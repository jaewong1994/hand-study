  <script>window.HandStudyRecord={"adminYear":2019,"answer":"7","contentHash":"02ab849fdf07497aa499012edcaef2ca8e0bcc0eeb53e6e2f25ab8fc84dee361","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24699,"month":11,"number":28,"points":4,"preview":false,"questionHtml":"\u003cp>다항함수 \u003cspan class=\"heq\">\\(f(x)\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox hcond\">\u003cp class=\"hcondr\">(가) 모든 실수 \u003cspan class=\"heq\">\\(x\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(\\int_{1}^{x} {\\,}f(t)\\,dt=\\frac{x - 1}{2} \\left\\{\\,f(x)+f(1) \\right\\}\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hcondr\">(나) \u003cspan class=\"heq\">\\(\\int_{0}^{2} {\\,}f(x)\\,dx=5 \\int_{- 1}^{1} {\\,}x f(x)\\,dx\\)\u003c/span>\u003c/p>\u003c/div>\u003cp>\u003cspan class=\"heq\">\\(f(0)=1\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(f(4)\\)\u003c/span>의 값을 구하시오. [4점]\u003c/p>","questionText":"다항함수 $f(x)$가 다음 조건을 만족시킨다.\n(가) 모든 실수 $x$에 대하여 $\\int_{1}^{x} {\\,}f(t)\\,dt=\\frac{x - 1}{2} \\left\\{\\,f(x)+f(1) \\right\\}$이다.(나) $\\int_{0}^{2} {\\,}f(x)\\,dx=5 \\int_{- 1}^{1} {\\,}x f(x)\\,dx$\n$f(0)=1$일 때, $f(4)$의 값을 구하시오. [4점]","sourceHash":"5395ed0352fa4ee6b6fe3ae441c269d2021c77e95a20eb6913469466b93803f8","sourceKind":"csat","sourceLabel":"2019년 시행 수능 · 2020학년도 · 나형 · 28번","steps":[{"explanation":{"body":"왼쪽은 아래 끝점이 1로 고정되고 위 끝점이 \\(x\\)인 적분이므로 미분하면 \\(f(x)\\)예요. 오른쪽은 \\((x-1)/2\\)와 \\(f(x)+f(1)\\)의 곱이라 곱의 미분법을 써야 해요. 이때 \\(f(1)\\)은 상수라서 미분값이 0이에요. 두 쪽을 미분한 뒤 2를 곱하면 다음 관계식이 나와요.","skillTags":["integration.fundamental-theorem"],"title":"움직이는 끝점을 미분해요"},"id":"s1","latex":"\\text{(가)를 미분하면 }2f(x)=f(x)+f(1)+(x-1)f\\prime(x)"},{"id":"s2","latex":"f(x)=f(1)+(x-1)f\\prime(x)"},{"id":"s3","latex":"\\text{다시 미분하면 }(x-1)f\\prime\\prime(x)=0\\ \\Rightarrow\\ f\\prime\\prime(x)=0"},{"id":"s4","latex":"f(0)=1\\ \\Rightarrow\\ f(x)=ax+1\\quad(\\text{상수함수도 }a=0\\text{에 포함})"},{"id":"s5","latex":"\\int_0^2f(x)\\,dx=2a+2,\\quad\\int_{-1}^1xf(x)\\,dx=\\frac{2a}3"},{"id"
