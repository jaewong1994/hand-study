  <script>window.HandStudyRecord={"itemId":7762,"sourceLabel":"2019 교육청 고2 수학가형 6월 15번","adminYear":2019,"grade":2,"month":6,"number":15,"track":"수학가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"반지름의 길이가 $r\\,$인 원형 도선에 세기가 $I\\,$인 전류가 흐를 때, 원형 도선의 중심에서 수직 거리 $x\\,$만큼 떨어진 지점에서의 자기장의 세기를 $B\\,$라 하면 다음과 같은 관계식이 성립한다고 한다.\n $B\\,= \\frac{k\\,I\\,r ^{\\,2}}{2(x ^{\\,2} +r ^{\\,2} ) ^{\\frac{3}{2}}}$ (단, $k\\,$는 상수이다.)\n전류의 세기가 $I_{0} \\, \\left( I_{0} >0 \\right) \\,$으로 일정할 때, 반지름의 길이가 $r_1 \\,$인 원형 도선의 중심에서 수직 거리 $x_1 \\,$만큼 떨어진 지점에서의 자기장의 세기를 $B_1 \\,$, 반지름의 길이가 $3r_1 \\,$인 원형 도선의 중심에서 수직 거리 $3x_1 \\,$만큼 떨어진 지점에서의 자기장의 세기를 $B_2 \\,$라 하자. $\\frac{B_2}{B_1 }\\,$의 값은? (단, 전류의 세기의 단위는 $A\\,$, 자기장의 세기의 단위는 $T\\,$, 길이와 거리의 단위는 $m\\,$이다.) [4점]\n① $\\frac{1}{6}$ ② $\\frac{1}{4} \\,$ ③ $\\frac{1}{3} \\,$ ④ $\\frac{5}{12} \\,$ ⑤ $\\frac{1}{2} \\,$","answer":"③","sourceHash":"7ad76dbc97d8c2348d7db7e47cf3f796e225c51bf5ff90f1f170dabce2febbc6","steps":[{"id":"s1","latex":"B_2=\\dfrac{kI(3r)^2}{2\\{(3x)^2+(3r)^2\\}^{3/2}}"},{"id":"s2","latex":"\\dfrac{B_2}{B_1}=\\dfrac9{9^{3/2}}=\\dfrac13"}],"diagram":null,"contentHash":"449ebfaf009f9c2c421fa9ae85bcb68019e9209f7c7e41d7412225f4e3ef13c9","questionHtml":"\u003cp class=\"hp\">반지름의 길이가 \u003cspan class=\"heq\">\\(r\\,\\)\u003c/span>인 원형 도선에 세기가 \u003cspan class=\"heq\">\\(I\\,\\)\u003c/span>인 전류가 흐를 때, 원형 도선의 중심에서 수직 거리 \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>만큼 떨어진 지점에서의 자기장의 세기를 \u003cspan class=\"heq\">\\(B\\,\\)\u003c/span>라 하면 다음과 같은 관계식이 성립한다고 한다.\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\(B\\,= \\dfrac{k\\,I\\,r^{\\,2}}{2(x^{\\,2} +r^{\\,2} )^{\\dfrac{3}{2}}}\\)\u003c/span> (단, \u003cspan class=\"heq\">\\(k\\,\\)\u003c/span>는 상수이다.)\u003c/p>\u003cp class=\"hp htall\">전류의 세기가 \u003cspan class=\"heq\">\\(I_{0} \\, \\left( I_{0} \\gt 0 \\right) \\,\\)\u003c/span>으로 일정할 때, 반지름의 길이가 \u003cspan class=\"heq\">\\(r_{1} \\,\\)\u003c/span>인 원형 도선의 중심에서 수직 거리 \u003cspan class=\"heq\">\\(x_{1} \\,\\)\u003c/span>만큼 떨어진 지점에서의 자기장의 세기를 \u003cspan class=\"heq\">\\(B_{1} \\,\\)\u003c/span>, 반지름의 길이가 \u003cspan class=\"heq\">\\(3r_{1} \\,\\)\u003c/span>인 원형 도선의 중심에서 수직 거리 \u003cspan class=\"heq\">\\(3x_{1} \\,\\)\u003c/span>만큼 떨어진 지점에서의 자기장의 세기를 \u003cspan class=\"heq\">\\(B_{2} \\,\\)\u003c/span>라 하자. \u003cspan class=\"heq\">\\(\\dfrac{B_{2}}{B_{1} }\\,\\)\u003c/span>의 값은? (단, 전류의 세기의 단위는 \u003cspan class=\"heq\">\\(A\\,\\)\u003c/span>,  자기장의 세기의 단위는 \u003cspan class=\"heq\">\\(T\\,\\)\u003c/span>, 길이와 거리의 단위는 \u003cspan class=\"heq\">\\(m\\,\\)\u003c/span>이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp htall\">① \u003cspan class=\"heq\">\\(\\dfrac{1}{6}\\)\u003c/span>&emsp;② \u003cspan class=\"heq\">\\(\\dfrac{1}{4} \\,\\)\u003c/span>&emsp;③ \u003cspan class=\"heq\">\\(\\dfrac{1}{3} \\,\\)\u003c/span>&emsp;④ \u003cspan class=\"heq\">\\(\\dfrac{5}{12} \\,\\)\u003c/span>&emsp;⑤ \u003cspan class=\"heq\">\\(\\dfrac{1}{2} \\,\\)\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"8f184a6c3738b330e270e6756fdbe09ac658440af8ec2c6e2442681ffcc471f0"};</script>
