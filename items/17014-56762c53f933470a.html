<script>window.HandStudyRecord={"itemId":17014,"sourceLabel":"2021 교육청 고3 수학기하 3월 30번","adminYear":2021,"grade":3,"month":3,"number":30,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 두 초점이 $F \\left( c,\\,0 \\right)$, $F ' \\left( -c,\\,0 \\right) \\,$$\\left( c>0 \\right) \\,$이고 장축의 길이가 $12\\,$인 타원이 있다. 점 $F\\,$가 초점이고 직선 $x=-k\\,$$\\left(k>0\\right)\\,$이 준선인 포물선이 타원과 제$2\\,$사분면의 점 $P\\,$에서 만난다. 점 $P\\,$에서 직선 $x=-k\\,$에 내린 수선의 발을 $Q\\,$라 할 때, 두 점 $P$, $Q\\,$가 다음 조건을 만족시킨다.\n(가) $\\cos\\, \\left( \\angle F'FP \\right) = \\frac{7}{8}$ (나) ${\\overline{ FP}} - {\\overline{ F ' Q}} = {\\overline{ PQ}} - {\\overline{ FF ' }}$\n$c+ k\\,$의 값을 구하시오. [4점]","answer":"15","sourceHash":"200866356a7af74df4f06014ed8e5a02ecb3ec62fa747e42931b6f1c22add907","steps":[{"id":"s1","latex":"\\text{타원}\\quad a=6,\\quad PF+PF'=12"},{"id":"s2","latex":"\\text{포물선}\\quad PQ=PF"},{"id":"s3","latex":"PF-F'Q=PQ-FF'\\Rightarrow F'Q=FF'=2c"},{"id":"s4","latex":"P=(u,v),\\quad \\dfrac{c-u}{PF}=\\dfrac78\\Rightarrow u=c-\\dfrac78PF"},{"id":"s5","latex":"PQ=u+k=PF\\Rightarrow k=\\dfrac{15}{8}PF-c"},{"id":"s6","latex":"v^2=PF^2-(u-c)^2=\\dfrac{15}{64}PF^2"},{"id":"s7","latex":"F'Q^2=(k-c)^2+v^2=4c^2\\Rightarrow PF=2c"},{"id":"s8","latex":"\\text{타원식}\\quad PF=6-\\dfrac{c}{6}u,\\quad u=-\\dfrac34c"},{"id":"s9","latex":"2c=6+\\dfrac{c^2}{8}\\Rightarrow c=4\\quad(0\u003cc\u003c6)"},{"id":"s10","latex":"PF=8,\\quad k=\\dfrac{15}{8}\\cdot8-4=11"},{"id":"s11","latex":"c+k=\\boxed{15}"}],"diagram":null,"contentHash":"cc4b75d41388a90d127bdf5e979f6a72945eae668894d12555da01ef4dd308ce","questionHtml":"\u003cp class=\"hp\">그림과 같이 두 초점이 \u003cspan class=\"heq\">\\(F \\left( c,\\,0 \\right)\\)\u003c/span>, \u003cspan class=\"heq\">\\(F' \\left( -c,\\,0 \\right) \\,\\)\u003c/span>\u003cspan class=\"heq\">\\(\\left( c\\gt 0 \\right) \\,\\)\u003c/span>이고 장축의 길이가 \u003cspan class=\"heq\">\\(12\\,\\)\u003c/span>인 타원이 있다. 점 \u003cspan class=\"heq\">\\(F\\,\\)\u003c/span>가 초점이고 직선 \u003cspan class=\"heq\">\\(x=-k\\,\\)\u003c/span>\u003cspan class=\"heq\">\\(\\left(k\\gt 0\\right)\\,\\)\u003c/span>이 준선인 포물선이 타원과 제\u003cspan class=\"heq\">\\(2\\,\\)\u003c/span>사분면의 점 \u003cspan class=\"heq\">\\(P\\,\\)\u003c/span>에서 만난다. 점 \u003cspan class=\"heq\">\\(P\\,\\)\u003c/span>에서 직선 \u003cspan class=\"heq\">\\(x=-k\\,\\)\u003c/span>에 내린 수선의 발을 \u003cspan class=\"heq\">\\(Q\\,\\)\u003c/span>라 할 때, 두 점 \u003cspan class=\"heq\">\\(P\\)\u003c/span>, \u003cspan class=\"heq\">\\(Q\\,\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp htall\">(가) \u003cspan class=\"heq\">\\(\\cos\\, \\left( \\angle F'FP \\right) = \\dfrac{7}{8}\\)\u003c/span>\u003c/p>\u003cp class=\"hp htall\">(나) \u003cspan class=\"heq\">\\({\\overline{FP}} - {\\overline{F' Q}} = {\\overline{PQ}} - {\\overline{FF' }}\\)\u003c/span>\u003c/p>\u003c/div>\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(c+ k\\,\\)\u003c/span>의 값을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/b9490ec451a337beecfbc588.png\" style=\"width:246px;max-width:100%\">\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"56762c53f933470a1bc4fe9778f587b513e5c85e2c319e28b4ff05436590c05b"};</script>
<script>window.HandStudyGuide={"itemId":17014,"sourceHash":"200866356a7af74df4f06014ed8e5a02ecb3ec62fa747e42931b6f1c22add907","contentHash":"cc4b75d41388a90d127bdf5e979f6a72945eae668894d12555da01ef4dd308ce","overview":{"goal":"포물선의 초점·준선 거리와 타원의 초점 거리합을 함께 써서 c와 k를 구해요.","firstLook":"P에서 준선에 내린 수선 PQ는 포물선 정의에 따라 초점 거리 PF와 같아요. 조건 (나)에 넣으면 F'Q의 길이가 바로 정해져요.","conditions":[{"label":"타원","meaning":"\\(PF+PF'=12\\)이고 \\(0<c<6\\)이에요."},{"label":"포물선","meaning":"\\(PQ=PF\\)예요."},{"label":"각 조건","meaning":"F에서 왼쪽 수평방향과 FP가 이루는 각의 코사인이 \\(7/8\\)이에요."}]},"chapters":[{"id":"c1","label":"두 곡선의 거리 조건을 연결해요","stepIds":["s1","s2","s3"],"question":"조건 (나)에서 왜 \\(F'Q=2c\\)가 될까요?","hint":"\\(PQ=PF\\)와 \\(FF'=2c\\)를 넣어요.","explanation":"타원의 장반경은 6이므로 \\(PF+PF'=12\\)예요. 포물선 정의에서 P의 초점 F까지 거리와 준선까지 거리 PQ가 같아 \\(PQ=PF\\)예요. (나)의 \\(PF-F'Q=PQ-FF'\\)에 넣으면 양쪽 PF가 없어지고 \\(F'Q=FF'=2c\\)를 얻어요.","check":{"prompt":"포물선 정의로 바로 같다고 놓는 두 길이는 무엇인가요?","answer":"\\(PQ\\)와 \\(PF\\)예요."}},{"id":"c2","label":"P의 좌표를 PF로 표현해요","stepIds":["s4","s5","s6"],"question":"\\(PF=r\\)라 할 때 P의 x좌표는 어떻게 나오나요?","hint":"\\(F\\)에서 \\(F'\\) 방향은 왼쪽을 향해요.","explanation":"\\(P=(u,v)\\), \\(PF=r\\)라 두면 \\(\\cos\\angle F'FP=(c-u)/r=7/8\\)이므로 \\(u=c-7r/8\\)예요. \\(Q=(-k,v)\\)이고 \\(P\\)는 \\(Q\\)의 오른쪽에 있어 \\(PQ=u+k=r\\), 따라서 \\(k=r-u=15r/8-c\\)예요. 또 직각삼각형의 가로길이는 \\(c-u=7r/8\\)이므로 \\(v^2=r^2-(7r/8)^2=15r^2/64\\)예요.","check":{"prompt":"\\(k=\\frac{15}{8}r-c\\)에서 사용한 거리식은 무엇인가요?","answer":"수평선분 \\(PQ=u-(-k)=u+k=r\\)이에요."}},{"id":"c3","label":"F'Q 거리로 r과 c를 연결해요","stepIds":["s7"],"question":"\\(F'Q=2c\\)를 좌표로 쓰면 어떤 식이 되나요?","hint":"\\(F'=(-c,0), Q=(-k,v)\\)예요.","explanation":"\\(F'Q^2=(k-c)^2+v^2=4c^2\\)예요. 앞에서 \\(k-c=15r/8-2c\\), \\(v^2=15r^2/64\\)를 넣으면 \\((15r/8-2c)^2+15r^2/64=4c^2\\)예요. 전개하면 \\((15/4)r(r-2c)=0\\)이고 \\(r\\)은 길이라 양수이므로 \\(r=PF=2c\\)예요.","check":{"prompt":"전개 뒤 \\(r=0\\)을 제외하는 이유는 무엇인가요?","answer":"P와 F는 서로 다른 점이라 거리 PF는 양수예요."}},{"id":"c4","label":"타원 위 점 조건으로 c와 k를 구해요","stepIds":["s8","s9","s10","s11"],"question":"타원에서 \\(PF=6-(c/6)u\\)를 쓰면 무엇이 정해질까요?","hint":"\\(r=2c\\)를 \\(u\\)의 식에도 넣어요.","explanation":"\\(r=2c\\)이므로 \\(u=c-7(2c)/8=-3c/4\\)예요. 타원 위 점의 오른쪽 초점까지 거리는 \\(PF=6-(c/6)u\\)라서 \\(2c=6+c^2/8\\)이에요. 정리하면 \\(c^2-16c+48=0\\), 해는 \\(4\\)와 \\(12\\)예요. 타원의 초점은 장반경보다 안쪽이라 \\(0<c<6\\)이므로 \\(c=4\\)예요. \\(PF=8\\)이고 \\(k=15\\cdot8/8-4=11\\)이므로 \\(c+k=15\\)예요.","check":{"prompt":"\\(c=12\\)를 제외하는 타원의 기본 조건은 무엇인가요?","answer":"초점거리 c는 장반경 6보다 작아야 해요."}}],"takeaway":["타원과 포물선이 함께 나오면 각 곡선의 거리 정의를 같은 선분에 연결해요.","각의 코사인으로 초점에서 P까지의 가로 성분을 구해요.","방정식의 여러 해 중 도형의 초점 위치 조건을 만족하는 해만 남겨요."]};</script>
