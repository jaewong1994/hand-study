  <script>window.HandStudyRecord={"itemId":17014,"sourceLabel":"2021 교육청 고3 수학기하 3월 30번","adminYear":2021,"grade":3,"month":3,"number":30,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 두 초점이 $F \\left( c,\\,0 \\right)$, $F ' \\left( -c,\\,0 \\right) \\,$$\\left( c>0 \\right) \\,$이고 장축의 길이가 $12\\,$인 타원이 있다. 점 $F\\,$가 초점이고 직선 $x=-k\\,$$\\left(k>0\\right)\\,$이 준선인 포물선이 타원과 제$2\\,$사분면의 점 $P\\,$에서 만난다. 점 $P\\,$에서 직선 $x=-k\\,$에 내린 수선의 발을 $Q\\,$라 할 때, 두 점 $P$, $Q\\,$가 다음 조건을 만족시킨다.\n(가) $\\cos\\, \\left( \\angle F'FP \\right) = \\frac{7}{8}$ (나) ${\\overline{ FP}} - {\\overline{ F ' Q}} = {\\overline{ PQ}} - {\\overline{ FF ' }}$\n$c+ k\\,$의 값을 구하시오. [4점]","answer":"15","sourceHash":"200866356a7af74df4f06014ed8e5a02ecb3ec62fa747e42931b6f1c22add907","steps":[{"id":"s1","latex":"\\text{타원}\\quad a=6,\\quad PF+PF'=12"},{"id":"s2","latex":"\\text{포물선}\\quad PQ=PF"},{"id":"s3","latex":"PF-F'Q=PQ-FF'\\Rightarrow F'Q=FF'=2c"},{"id":"s4","latex":"P=(u,v),\\quad \\dfrac{c-u}{PF}=\\dfrac78\\Rightarrow u=c-\\dfrac78PF"},{"id":"s5","latex":"PQ=u+k=PF\\Rightarrow k=\\dfrac{15}{8}PF-c"},{"id":"s6","latex":"v^2=PF^2-(u-c)^2=\\dfrac{15}{64}PF^2"},{"id":"s7","latex":"F'Q^2=(k-c)^2+v^2=4c^2\\Rightarrow PF=2c"},{"id":"s8","latex":"\\text{타원식}\\quad PF=6-\\dfrac{c}{6}u,\\quad u=-\\dfrac34c"},{"id":"s9","latex":"2c=6+\\dfrac{c^2}{8}\\Rightarrow c=4\\quad(0\u003cc\u003c6)"},{"id":"s10","latex":"PF=8,\\quad k=\\dfrac{15}{8}\\cdot8-4=11"},{"id":"s11","latex":"c+k=\\boxed{15}"}],"diagram":null,"contentHash":"cc4b75d41388a90d127bdf5e979f6a72945eae668894d12555da01ef4dd308ce","questionHtml":"\u003cp class=\"hp\">그림과 같이 두 초점이 \u003cspan class=\"heq\">\\(F \\left( c,\\,0 \\right)\\)\u003c/span>, \u003cspan class=\"heq\">\\(F' \\left( -c,\\,0 \\right) \\,\\)\u003c/span>\u003cspan class=\"heq\">\\(\\left( c\\gt 0 \\right) \\,\\)\u003c/span>이고 장축의 길이가 \u003cspan class=\"heq\">\\(12\\,\\)\u003c/span>인 타원이 있다. 점 \u003cspan class=\"heq\">\\(F\\,\\)\u003c/span>가 초점이고 직선 \u00
