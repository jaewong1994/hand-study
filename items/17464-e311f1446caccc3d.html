<script>window.HandStudyRecord={"itemId":17464,"sourceLabel":"2022 평가원 고3 수학기하 6월 30번","adminYear":2022,"grade":3,"month":6,"number":30,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"좌표평면에서 한 변의 길이가 $4$인 정육각형 $A B C D E F$의 변 위를 움직이는 점 $P$가 있고, 점 $C$를 중심으로 하고 반지름의 길이가 $1$인 원 위를 움직이는 점 $Q$가 있다. 두 점 $P,\\,Q$와 실수 $k$에 대하여 점 $X$가 다음 조건을 만족시킬 때, $\\left| \\, {\\vec{ CX }} \\, \\right|$의 값이 최소가 되도록 하는 $k$의 값을 $\\alpha$, $\\left| \\,\\vec{C X}\\, \\right|$의 값이 최대가 되도록 하는 $k$의 값을 $\\beta$라 하자.\n(가) $\\vec{C X}= \\frac{1}{2} \\vec{C P}+\\vec{C Q}$ (나) ${\\vec{ XA}} + {\\vec{ XC}} +2 {\\vec{ XD}} =k {\\vec{ CD}}$\n$\\alpha ^{2} +\\beta ^{2}$의 값을 구하시오. [4점]","answer":"8","sourceHash":"ef289bcf53851c95c1c59672ad93291bcf8cbc8c32bb5762fdac317d25eee4a4","steps":[{"id":"s1","latex":"C=(0,0),\\ D=(4,0),\\ A=(0,4\\sqrt3):\\quad A+2D-4X=kD"},{"id":"s2","latex":"X=(2-k,\\sqrt3)=(x,\\sqrt3),\\quad k=2-x,\\quad |CX|^2=x^2+3"},{"id":"s3","latex":"Y=P/2\\text{의 육각형 꼭짓점}:\\ (0,0),(2,0),(3,\\sqrt3),(2,2\\sqrt3),(0,2\\sqrt3),(-1,\\sqrt3)"},{"id":"s4","latex":"|X-Y|=1:\\quad-2\\le x\\le4,\\quad x=4\\text{는 }Y=(3,\\sqrt3),\\ CQ=(1,0)\\text{에서 가능}"},{"id":"s5","latex":"x=0:\\quad Y=(-1/2,\\sqrt3/2)\\text{는 변 위},\\quad|X-Y|=1\\text{이므로 가능}"},{"id":"s6","latex":"3\\le|CX|^2\\le19,\\quad |CX|^2=3\\ (x=0),\\quad |CX|^2=19\\ (x=4)"},{"id":"s7","latex":"\\alpha=2,\\ \\beta=-2\\Rightarrow\\alpha^2+\\beta^2=8"}],"diagram":null,"contentHash":"c27a42d62842f290d5367a1dff4718e292ceb6c8177836a10ba4c1f66defdfe3","questionHtml":"<p class=\"hp\">좌표평면에서 한 변의 길이가 <span class=\"heq\">\\(4\\)<\/span>인 정육각형 <span class=\"heq\">\\(A B C D E F\\)<\/span>의 변 위를 움직이는 점 <span class=\"heq\">\\(P\\)<\/span>가 있고, 점 <span class=\"heq\">\\(C\\)<\/span>를 중심으로 하고 반지름의 길이가 <span class=\"heq\">\\(1\\)<\/span>인 원 위를 움직이는 점 <span class=\"heq\">\\(Q\\)<\/span>가 있다. 두 점 <span class=\"heq\">\\(P,\\,Q\\)<\/span>와 실수 <span class=\"heq\">\\(k\\)<\/span>에 대하여 점 <span class=\"heq\">\\(X\\)<\/span>가 다음 조건을 만족시킬 때, <span class=\"heq\">\\(\\left| \\, {\\overrightarrow{CX}} \\, \\right|\\)<\/span>의 값이 최소가 되도록 하는 <span class=\"heq\">\\(k\\)<\/span>의 값을 <span class=\"heq\">\\(\\alpha\\)<\/span>, <span class=\"heq\">\\(\\left| \\,\\overrightarrow{CX}\\, \\right|\\)<\/span>의 값이 최대가 되도록 하는 <span class=\"heq\">\\(k\\)<\/span>의 값을 <span class=\"heq\">\\(\\beta\\)<\/span>라 하자.<\/p><div class=\"hbox\"><p class=\"hp htall\">(가) <span class=\"heq\">\\(\\overrightarrow{CX}= \\dfrac{1}{2} \\overrightarrow{CP}+\\overrightarrow{CQ}\\)<\/span><\/p><p class=\"hp\">(나) <span class=\"heq\">\\({\\overrightarrow{XA}} + {\\overrightarrow{XC}} +2 {\\overrightarrow{XD}} =k {\\overrightarrow{CD}}\\)<\/span><\/p><\/div><p class=\"hp\"><span class=\"heq\">\\(\\alpha^{2} +\\beta^{2}\\)<\/span>의 값을 구하시오. <span class=\"hscore\">[4점]<\/span><\/p><p class=\"hp\"><img class=\"hfig\" src=\"../assets/figures/d064bd9a5c49b81b15e62ef2.png\" style=\"width:291px;max-width:100%\"><\/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"2741efe8f86d67fec472ca68d26dde563e063adc4935a533392dc8bd24083360"};</script>
<script>window.HandStudyGuide={"itemId":17464,"sourceHash":"ef289bcf53851c95c1c59672ad93291bcf8cbc8c32bb5762fdac317d25eee4a4","contentHash":"c27a42d62842f290d5367a1dff4718e292ceb6c8177836a10ba4c1f66defdfe3","overview":{"goal":"조건 (나)로 점 \\(X\\)의 직선을 찾고, 조건 (가)로 실제 가능한 범위를 정해 거리의 최솟값과 최댓값을 구해요.","firstLook":"\\(\\frac12\\overrightarrow{CP}\\)의 끝점을 \\(Y\\)라 두면 조건 (가)는 \\(|XY|=1\\)이에요. 먼저 \\(X\\)의 직선을 고정한 뒤 이 거리 조건을 써요.","conditions":[{"label":"조건 (가)","meaning":"\\(Y\\)는 한 변의 길이가 \\(2\\)인 축소 정육각형의 변 위를 움직이고 \\(|XY|=1\\)이에요."},{"label":"조건 (나)","meaning":"\\(X\\)의 높이가 고정되고, \\(x\\)좌표와 \\(k\\)가 일대일로 대응해요."}]},"chapters":[{"id":"c1","label":"움직이는 점의 직선을 찾아요","stepIds":["s1","s2"],"question":"좌표를 어떻게 잡으면 조건 (나)가 짧게 정리될까요?","hint":"\\(C=(0,0)\\), \\(D=(4,0)\\), \\(A=(0,4\\sqrt3)\\)으로 놓으세요.","explanation":"위치벡터로 조건 (나)를 쓰면 \\((A-X)+(C-X)+2(D-X)=k(D-C)\\), 곧 \\(A+2D-4X=kD\\)예요. 성분을 비교하면 \\(X=(2-k,\\sqrt3)\\)이에요. \\(x=2-k\\)라 두면 \\(k=2-x\\), \\(|CX|^2=x^2+3\\)이에요.","check":{"prompt":"거리 대신 거리의 제곱을 비교해도 되는 이유는 무엇인가요?","answer":"거리는 음이 아니고, 제곱은 음이 아닌 수의 대소를 그대로 보존하기 때문이에요."}},{"id":"c2","label":"조건 (가)를 거리 1로 바꿔요","stepIds":["s3"],"question":"점 \\(Y\\)는 어떤 도형의 변 위를 움직일까요?","hint":"\\(P\\)의 위치벡터를 절반으로 줄이면 꼭짓점 좌표도 절반이 돼요.","explanation":"\\(\\overrightarrow{CY}=\\frac12\\overrightarrow{CP}\\)로 두면 \\(Y\\)의 꼭짓점은 \\((0,0),(2,0),(3,\\sqrt3),(2,2\\sqrt3),(0,2\\sqrt3),(-1,\\sqrt3)\\)이에요. 또 \\(\\overrightarrow{YX}=\\overrightarrow{CQ}\\)이므로 \\(|YX|=1\\)이에요. 즉 \\(X\\)는 축소 정육각형의 변에서 거리 \\(1\\)인 점이에요.","check":{"prompt":"\\(X\\)가 축소 정육각형의 변 위에 있다고 하면 왜 틀리나요?","answer":"\\(X\\)는 변 위의 \\(Y\\)에서 다시 길이 \\(1\\)인 벡터 \\(\\overrightarrow{CQ}\\)만큼 이동한 점이기 때문이에요."}},{"id":"c3","label":"가능한 좌표의 범위를 확인해요","stepIds":["s4","s5"],"question":"높이가 \\(\\sqrt3\\)인 직선 위에서 실제 가능한 \\(x\\)는 어디까지일까요?","hint":"축소 정육각형의 가장 왼쪽과 오른쪽 점에서 거리 \\(1\\)을 더해 보세요.","explanation":"\\(Y\\)의 \\(x\\)좌표는 \\(-1\\) 이상 \\(3\\) 이하이므로 \\(-2\\le x\\le4\\)예요. 양끝은 \\(Y=(-1,\\sqrt3),(3,\\sqrt3)\\)에서 수평으로 거리 \\(1\\)만큼 가면 실제 가능해요. \\(x=0\\)도 \\(Y=(-\\frac12,\\frac{\\sqrt3}{2})\\)를 잡으면 \\(|(0,\\sqrt3)-Y|=1\\)이므로 가능해요.","check":{"prompt":"왜 \\(x=0\\)의 실현 가능성을 따로 확인하나요?","answer":"범위 안이라는 사실만으로 원래의 점 \\(P,Q\\)가 존재한다고 자동으로 결론낼 수 없기 때문이에요."}},{"id":"c4","label":"거리와 매개변수를 마무리해요","stepIds":["s6","s7"],"question":"어떤 \\(x\\)가 최소와 최대를 만들까요?","hint":"\\(x^2+3\\)을 \\([-2,4]\\)에서 비교하세요.","explanation":"\\(x=0\\)에서 \\(|CX|^2=3\\)이 최소예요. 양끝에서는 \\(7\\)과 \\(19\\)이므로 최대는 \\(x=4\\)에서 나와요. \\(k=2-x\\)에서 \\(\\alpha=2\\), \\(\\beta=-2\\)이고 \\(\\alpha^2+\\beta^2=8\\)이에요.","check":{"prompt":"왼쪽 끝이 최댓값을 만들지 못하는 이유는 무엇인가요?","answer":"\\(x=-2\\)에서는 거리의 제곱이 \\(7\\), \\(x=4\\)에서는 \\(19\\)이기 때문이에요."}}],"takeaway":["벡터의 합은 보조점을 두면 이동 영역의 거리 조건으로 바뀌어요.","극값 후보가 원래 점의 움직임으로 실제 만들어지는지 확인해요.","직선 위 거리의 극값은 양끝과 원점에 가장 가까운 점을 비교해요."]};</script>
