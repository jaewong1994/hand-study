  <script>window.HandStudyRecord={"itemId":16776,"sourceLabel":"2020 교육청 고3 수리나형 3월 21번","adminYear":2020,"grade":3,"month":3,"number":21,"track":"수리나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"이차함수 $g(x)=x ^{\\,2} -6x+10\\,$에 대하여 삼차함수 $f(x)\\,$가 다음 조건을 만족시킨다.\n(가) 방정식 $f( x ) =0\\,$은 서로 다른 세 실근을 갖는다.(나) 함수 $\\left(\\,g \\circ f \\right)(x)\\,$의 최솟값을 $m\\,$이라 할 때, 방정식 $g(\\,f(x))=m\\,$의 서로 다른 실근의 개수는 $2\\,$이다.(다) 방정식 $g(\\,f(x))=17\\,$은 서로 다른 세 실근을 갖는다.\n함수 $f(x)\\,$의 극댓값과 극솟값의 합은? [4점]\n① $2$ ② $4$ ③ $6$ ④ $8$ ⑤ $10$\n단답형","answer":"①","sourceHash":"4c358765dcb0362a76d40d05f8fb02f8a3ae6887e8a9fb2ad890198307deb374","steps":[{"id":"s1","latex":"g(u)=(u-3)^2+1,\\qquad m=1"},{"id":"s2","latex":"g(f(x))=1\\Longleftrightarrow f(x)=3"},{"id":"s3","latex":"\\#\\{x:f(x)=3\\}=2\\Rightarrow 3\\in\\{M,N\\}"},{"id":"s4","latex":"f(x)=0\\text{이 서로 다른 세 실근}\\Rightarrow N\u003c0\u003cM\\Rightarrow M=3"},{"id":"s5","latex":"g(f(x))=17\\Longleftrightarrow f(x)=7\\text{ 또는 }f(x)=-1"},{"id":"s6","latex":"7>M\\Rightarrow\\#\\{f=7\\}=1"},{"id":"s7","latex":"\\#\\{g(f)=17\\}=3\\Rightarrow\\#\\{f=-1\\}=2\\Rightarrow N=-1"},{"id":"s8","latex":"M+N=3-1=\\boxed{2}"}],"diagram":null,"contentHash":"0b22f615700bddba7ba1b5ee74fac73caaf5d411c16944fe9c663e445cbcedbf","questionHtml":"\u003cp class=\"hp\">이차함수 \u003cspan class=\"heq\">\\(g(x)=x^{\\,2} -6x+10\\,\\)\u003c/span>에 대하여 삼차함수 \u003cspan class=\"heq\">\\(f(x)\\,\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가)방정식 \u003cspan class=\"heq\">\\(f( x ) =0\\,\\)\u003c/span>은 서로 다른 세 실근을 갖는다.\u003c/p>\u003cp class=\"hp\">(나)함수 \u003cspan class=\"heq\">\\(\\left(\\,g \\circ f \\right)(x)\\,\\)\u003c/span>의 최솟값을 \u003cspan class=\"heq\">\\(m\\,\\)\u003c/span>이라 할 때, 방정식 \u003cspan class=\"heq\">\\(g(\\,f(x))=m\\,\\)\u003c/span>의 서로 다른 실근의 개수는 \u003cspan class=\"heq\">\\(2\\,\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp\">(다)방정식 \u003cspan class=\"heq\">\\(g(\\,f(x))=17\\,\\)\u003c/span>은 서로
