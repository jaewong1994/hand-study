<script>window.HandStudyRecord={"itemId":18270,"sourceLabel":"2025 교육청 고3 수학확통 10월 29번","adminYear":2025,"grade":3,"month":10,"number":29,"track":"확통","points":4,"scoreStatus":"confirmed_4_direct","questionText":"집합 $X\\,= \\left\\{2,\\,3,\\,5,\\,7,\\,11 \\right\\}\\,$과 함수 $f\\,:\\,X\\,\\rightarrow\\, X\\,$에 대하여 함수 $f\\,$의 치역을 $A\\,$, 합성함수 $f \\circ f\\,$의 치역을 $B\\,$라 할 때, 다음 조건을 만족시키는 함수 $f\\,$의 개수를 구하시오. [4점]\n(가) $n \\left(B\\, \\right)=2$ (나) 집합 $A\\,$의 모든 원소의 곱은 집합 $B\\,$의 모든 원소의 곱의 $2\\,$배이다.","answer":"180","sourceHash":"53b52eba2315f47da6f0a9bf3232c04ab509fbe201622a61a050f3a489aa7c03","steps":[{"id":"s1","latex":"B=f(A)\\subset A,\\quad\\prod A=2\\prod B\\Rightarrow A\\setminus B=\\{2\\}"},{"id":"s2","latex":"|B|=2,\\quad A=B\\cup\\{2\\},\\quad B\\subset X\\setminus\\{2\\}"},{"id":"s3","latex":"B\\text{의 선택}:\\quad{}_{4}\\mathrm{C}_{2}=6"},{"id":"s4","latex":"f(A)=B:\\quad2^3-2=6"},{"id":"s5","latex":"X\\setminus A\\text{의 두 원소 중 적어도 하나가 }2\\text{로 감}:\\quad3^2-2^2=5"},{"id":"s6","latex":"6\\cdot6\\cdot5=180"}],"diagram":null,"contentHash":"abd771f6787e77e340fe77c56e5d396b686ef284db1a59feceffd0a5183dc9e8","questionHtml":"<p class=\"hp\">집합 <span class=\"heq\">\\(X\\,= \\left\\{2,\\,3,\\,5,\\,7,\\,11 \\right\\}\\,\\)<\/span>과 함수 <span class=\"heq\">\\(f\\,:\\,X\\,\\rightarrow\\, X\\,\\)<\/span>에 대하여 함수 <span class=\"heq\">\\(f\\,\\)<\/span>의 치역을 <span class=\"heq\">\\(A\\,\\)<\/span>, 합성함수 <span class=\"heq\">\\(f \\circ f\\,\\)<\/span>의 치역을 <span class=\"heq\">\\(B\\,\\)<\/span>라 할 때, 다음 조건을 만족시키는 함수 <span class=\"heq\">\\(f\\,\\)<\/span>의 개수를 구하시오. <span class=\"hscore\">[4점]<\/span><\/p><div class=\"hbox\"><p class=\"hp\">(가) <span class=\"heq\">\\(n \\left(B\\, \\right)=2\\)<\/span><\/p><p class=\"hp\">(나) 집합 <span class=\"heq\">\\(A\\,\\)<\/span>의 모든 원소의 곱은 집합 <span class=\"heq\">\\(B\\,\\)<\/span>의 모든 원소의 곱의 <span class=\"heq\">\\(2\\,\\)<\/span>배이다.<\/p><\/div>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"150ce34147ec54ba43110800feaf <script>window.HandStudyGuide={"itemId":18270,"sourceHash":"53b52eba2315f47da6f0a9bf3232c04ab509fbe201622a61a050f3a489aa7c03","contentHash":"abd771f6787e77e340fe77c56e5d396b686ef284db1a59feceffd0a5183dc9e8","overview":{"goal":"두 치역의 포함 관계와 원소의 곱 조건으로 \\(A,B\\)를 정한 뒤 함수의 값을 나누어 세어요.","firstLook":"\\(A=f(X)\\)이고 \\(B=f(A)\\)이므로 \\(B\\subset A\\)예요. 집합의 원소가 모두 소수라서 곱의 비가 2라는 조건은 두 집합의 차이를 바로 알려 줘요.","conditions":[{"label":"(가)","meaning":"\\(B\\)에는 서로 다른 원소가 두 개 있어요."},{"label":"(나)","meaning":"\\(A\\)에는 \\(B\\)의 두 원소에 더해 소수 2만 하나 더 있어요."}]},"chapters":[{"id":"c1","label":"두 치역의 차이를 확정해요","stepIds":["s1","s2","s3"],"question":"곱의 비가 2이면 왜 \\(A\\setminus B=\\{2\\}\\)일까요?","hint":"\\(B=f(A)\\subset f(X)=A\\)를 먼저 쓰고, 공통 원소의 곱을 약분해요.","explanation":"\\(A=f(X)\\)이고 \\(A\\subset X\\)이므로 \\(B=f(A)\\subset f(X)=A\\)예요. 따라서 \\(A\\)의 원소의 곱을 \\(B\\)의 원소의 곱으로 나누면 \\(A\\setminus B\\)에 있는 원소들의 곱만 남아요. 그 값이 \\(2\\)이고 \\(X\\)의 원소 \\(2,3,5,7,11\\)은 모두 서로 다른 소수이므로 \\(A\\setminus B=\\{2\\}\\)예요. \\(|B|=2\\)이므로 \\(A=B\\cup\\{2\\}\\)이고, \\(B\\)는 \\(3,5,7,11\\) 중 두 개를 고른 집합이에요. 선택은 \\({}_{4}\\mathrm{C}_{2}=6\\)가지예요.","check":{"prompt":"왜 \\(2\\)가 \\(B\\)에 들어갈 수 없나요?","answer":"\\(A\\setminus B=\\{2\\}\\)이므로 2는 \\(A\\)에는 들어가지만 \\(B\\)에는 들어가지 않아요."}},{"id":"c2","label":"집합 A 위의 함수값을 세어요","stepIds":["s4"],"question":"\\(f(A)=B\\)가 되게 하는 값의 지정은 몇 가지인가요?","hint":"\\(A\\)의 세 원소가 \\(B\\)의 두 원소로 가되, 둘 다 실제로 나와야 해요.","explanation":"\\(A\\)의 세 원소 각각에 \\(B\\)의 두 원소 중 하나를 대응시키면 일단 \\(2^3=8\\)가지예요. 그러나 세 원소가 모두 \\(B\\)의 첫째 원소로 가는 경우와 모두 둘째 원소로 가는 경우에는 치역이 한 원소뿐이에요. 이 두 경우를 빼면 \\(f(A)=B\\)가 되는 지정은 \\(2^3-2=6\\)가지예요.","check":{"prompt":"여덟 지정 중 제외하는 두 경우는 무엇인가요?","answer":"\\(A\\)의 세 원소가 모두 같은 한 원소로 가는 두 가지 일정한 함수예요."}},{"id":"c3","label":"A 밖에서 2가 꼭 나오게 해요","stepIds":["s5","s6"],"question":"남은 두 원소의 함수값에서 왜 적어도 하나가 2여야 할까요?","hint":"\\(f(A)=B\\)에서는 2가 나오지 않지만 전체 치역 \\(f(X)=A\\)에는 2가 있어야 해요.","explanation":"\\(X\\setminus A\\)에는 두 원소가 있어요. 이들의 함수값도 전체 치역이 \\(A\\)를 넘지 않게 \\(A\\)의 세 원소 중에서 골라야 하므로 \\(3^2\\)가지가 출발점이에요. 그런데 \\(f(A)=B\\)에서는 2가 함수값으로 나오지 않아요. 전체 치역 \\(A=B\\cup\\{2\\}\\)에 2가 들어가려면 바깥의 두 원소 중 적어도 하나가 2로 가야 해요. 둘 다 \\(B\\)로 가는 \\(2^2\\)가지를 빼면 \\(3^2-2^2=5\\)가지예요. 따라서 전체 함수는 \\(6\\times6\\times5=180\\)개예요.","check":{"prompt":"바깥 두 원소가 모두 2로 가는 경우도 허용되나요?","answer":"허용돼요. 적어도 하나가 2로 가면 되고, 이미 \\(f(A)=B\\)에서 \\(B\\)의 두 원소가 모두 나와요."}}],"takeaway":["합성함수의 치역은 원래 함수의 치역에 포함된다는 관계부터 써요.","소수로 이루어진 집합에서는 원소 곱의 비가 집합의 차이를 정확히 드러낼 수 있어요.","전체 치역을 맞출 때는 안쪽에서 이미 나온 값과 바깥에서 새로 나와야 하는 값을 나누어 세어요."]};</script>
