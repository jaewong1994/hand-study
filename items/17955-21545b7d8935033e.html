  <script>window.HandStudyRecord={"adminYear":2024,"answer":"270","contentHash":"1bec45f8007b706ae6d8ed09824483015c52e5e9271b07c0b08197aabc1738c1","diagram":null,"editionHash":"21545b7d8935033ebab1b741faab50a26f6064cf730e48b0e34d302bb3459e59","grade":3,"graphHash":"","graphPlan":null,"itemId":17955,"learningHash":"71b84be557f36dadd20c3276c45dd015d905efdb25f61d50c08df5150e45134c","month":3,"number":29,"points":4,"preview":false,"questionHtml":"\u003cp class=\"hp\">자연수 \u003cspan class=\"heq\">\\(n\\,\\)\u003c/span>에 대하여 함수 \u003cspan class=\"heq\">\\(f \\left( x \\right)\\,\\)\u003c/span>를\u003c/p>\u003cp class=\"hp htall\">&emsp;&emsp;\u003cspan class=\"heq\">\\(f \\left( x \\right) = \\dfrac{4}{n^{3}} x^{3} +1\\,\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">이라 하자. 원점에서 곡선 \u003cspan class=\"heq\">\\(y=f \\left(x \\right)\\,\\)\u003c/span>에 그은 접선을 \u003cspan class=\"heq\">\\(l_{n}\\,\\)\u003c/span>, 접선 \u003cspan class=\"heq\">\\(l_{n}\\,\\)\u003c/span>의 접점을 \u003cspan class=\"heq\">\\({{P}}_{n}\\,\\)\u003c/span>이라 하자. \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>축과 직선 \u003cspan class=\"heq\">\\(l_{n}\\,\\)\u003c/span>에 동시에 접하고 점 \u003cspan class=\"heq\">\\({{P}}_{n}\\,\\)\u003c/span>을 지나는 원 중 중심의 \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>좌표가 양수인 것을 \u003cspan class=\"heq\">\\(C_{n}\\,\\)\u003c/span>이라 하자. 원 \u003cspan class=\"heq\">\\(C_{n}\\,\\)\u003c/span>의 반지름의 길이를 \u003cspan class=\"heq\">\\(r_{n}\\,\\)\u003c/span>이라 할 때, \u003cspan class=\"heq\">\\(40 \\times \\lim\\limits_{n\\, \\rightarrow \\, \\infty } {} n^{2} \\left( 4r_{n} -3 \\right)\\,\\)\u003c/span>의 값을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/9f9d4bc310e0af42991888c1.png\" style=\"width:272px;max-width:100%\">\u003c/p>","questionText":"자연수 $n\\,$에 대하여 함수 $f \\left( x \\right)\\,$를\n $f \\left( x \\right) = \\frac{4}{n ^{3}} x ^{3} +1\\,$\n이라 하자. 원점에서 곡선 $y=f \\left(x \\right)\\,$에 그은 접선을 $l_{n}\\,$, 접선 $l_{n}\\,$의 접점을 ${{P}} _{n}\\,$이라 하자. $x\\,$축과 직선 $l_{n}\\,$에 동시에 접하고 점 ${{P}} _{n}\\,$을 지나는 원 중 중심의 $x\\,$좌표가 양수인 것을 $C_{n}\\,$이라 하자. 원 $C_{n}\\,$의 반지름의 길이를 $r_{n}\\,$이라 할 때, $40 \\times \\lim _{n\\, \\rightarrow \\, \\infty } {} n ^{2} \\left( 4r _{n} -3 \\right)\\,$의 값을 구하시오. [4점]","scoreStatus":"confirmed_4_direct","sourceHash":"0c6ca23c54a0fd558ce51b9a26bd7987a5b7eaa2184d32f8bd4514fe75af84a0","sourceLabel":"2024 교육청 고3 수학미적분 3월 29번","stepExplanations":{"s1":{"body":"접점의 \\(x\\)좌표를 \\(t\\)라 하면 접선은 \\(y-f(t)=f^{\\prime}(t)(x-t)\\)예요. 원점 \\((0,0)\\)을 넣으면 \\(f(t)=tf^{\\prime}(t)\\)이므로 \\(\\frac{4t^3}{n^3}+1=\\frac{12t^3}{n^3}\\)이에요. 따라서 \\(t=\\frac n2\\), \\(f(t)=\\frac{3}{2}\\)이고 접점은 \\(P_n=(\\frac n2,\\frac{3}{2})\\)예요.","skillTags":["algebra.calculation"],"title":"원점을 지나는 접선 조건을 식으로 써요"},"s4":{"body":"\\(u=\\sqrt{n^2+9}\\)로 놓고 원의 중심을 \\((c,r_n)\\)이라 해요. 원은 \\(x\\)축에 접하면서 \\(y=\\frac{3}{2}\\)인 점을 지나므로 중심은 축 위쪽에 있고, 조건에 따라 \\(c>0\\)이에요. 원점에서 원에 그은 접선의 접점은 \\(x\\)축 위의 \\((c,0)\\)와 \\(P_n\\)이므로 두 접선의 길이가 같아 \\(c=OP_n=\\frac u2\\)예요. 중심과 \\(P_n\\)을 잇는 반지름은 기울기 \\(\\frac3n\\)인 접선에 수직이므로 \\(n(c-\\frac n2)+3(r_n-\\frac{3}{2})=0\\)이에요. \\(c=\\frac u2\\)를 넣으면 \\(r_n=\\frac{u^2-nu}{6}=\\frac{3u}{2(u+n)}\\)을 얻어요.","skillTags":["geometry.reasoning","reasoning.casework","algebra.calculation"],"title":"같은 점에서 그은 두 접선의 길이를 이용해요"},"s5":{"body":"\\(4r_n-3=\\frac{6u}{u+n}-3=\\frac{3(u-n)}{u+n}\\)이에요. \\(u^2-n^2=9\\)이므로 \\(u-n=\\frac9{u+n}\\)을 넣으면 \\(4r_n-3=\\frac{27}{(u+n)^2}\\)가 돼요. 따라서 \\(n^2(4r_n-3)=\\frac{27}{(\\sqrt{1+\\frac9{n^2}}+1)^2}\\to\\frac{27}4\\)이고, 40을 곱하면 270이에요.","skillTags":["algebra.calculation","calculus.limit"],"title":"0으로 가는 차는 먼저 유리화해요"}},"steps":[{"id":"s1","latex":"f(t)=tf^{\\prime}(t)\\Rightarrow t=n/2"},{"id":"s2","latex":"P_n=(n/2,3/2)"},{"id":"s3","latex":"\\text{직선 }OP_n\\text{의 기울기}=\\dfrac3n"},{"id":"s4","latex":"4r_n-3=\\dfrac{27}{(\\sqrt{n^2+9}+n)^2}"},{"id":"s5","latex":"\\lim n^2(4r_n-3)=27/4"},{"id":"s6","latex":"40\\cdot27/4=\\boxed{270}"}],"track":"미적분"};</script>
