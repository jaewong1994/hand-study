<script>window.HandStudyGuide={"itemId":17494,"sourceHash":"f7126f4004d9b91f506f64cef82806d36b13ff5e2bc0b4e6f20ec4fe8c7fd56c","contentHash":"517e287b1427f3f408d9adc6bfdb889aa4dfa5faeff91eb719e9ab00d50b2c6e","overview":{"goal":"두 원의 허용된 호에서 길이 2인 현의 중점을 움직이고, 벡터의 합을 중점 위치의 두 배로 바꾸어 자취 길이를 구합니다.","firstLook":"점 Y를 직접 움직이기보다 두 점 P, Q의 중점 M을 봅니다. 같은 원 위에서 두 점 사이 거리가 2이면 중심에서 M까지 거리는 일정합니다.","conditions":[{"label":"점 X의 자취","meaning":"중심이 A 또는 B이고 반지름이 2인 원에서 원점까지 거리가 2 이상인 호만 허용됩니다."},{"label":"두 점의 위치","meaning":"두 점의 가로좌표 부호가 같고 거리가 2여야 합니다."}]},"chapters":[{"id":"c1","label":"점들이 같은 원에 있음을 확인합니다","stepIds":["s1","s2","s3","s4"],"question":"왜 P와 Q는 한 원의 같은 허용 호에 있어야 하나요?","hint":"서로 다른 두 원에서 가로좌표 부호와 거리 조건을 함께 확인하세요.","explanation":"점의 자취는 중심 A 또는 B, 반지름 2인 두 원에서 \\(OX\\ge2\\)인 부분입니다. \\(x_Px_Q\\ge0\\), \\(PQ=2\\)를 동시에 만족하는 두 점은 같은 쪽 원의 허용 호에 놓입니다. 반지름 2인 원에서 길이 2인 현은 중심각이 \\(\\pi/3\\)입니다. 현의 중점 M에 내린 수선은 현을 이등분하므로 \\(AM=BM=\\sqrt{2^2-1^2}=\\sqrt3\\)입니다.","check":{"prompt":"현의 중심각이 \\(\\pi/3\\)인 이유는 무엇인가요?","answer":"반지름 2, 현의 길이 2인 이등변삼각형이 세 변의 길이가 모두 2인 정삼각형이기 때문입니다."}},{"id":"c2","label":"중점이 움직일 각의 범위를 구합니다","stepIds":["s5","s6"],"question":"허용 호에서 현의 두 끝점을 함께 움직일 수 있는 각은 얼마인가요?","hint":"전체 허용 중심각에서 현이 차지하는 중심각을 빼세요.","explanation":"한 원에서 \\(OX\\ge2\\)이고 가로좌표의 부호가 정해지는 큰 호의 중심각은 \\(3\\pi/2\\)입니다. 두 끝점 사이에는 항상 \\(\\pi/3\\)의 간격이 필요하므로 중점 방향이 움직일 수 있는 각의 크기는 \\(3\\pi/2-\\pi/3=7\\pi/6\\)입니다. 끝점에서 현의 한 끝이 허용 호의 경계에 닿는 경우도 포함되며 자취 길이는 달라지지 않습니다.","check":{"prompt":"허용 중심각에서 왜 \\(\\pi/3\\)을 빼나요?","answer":"현의 두 끝점이 모두 허용 호 안에 있어야 하므로 앞쪽 끝점과 뒤쪽 끝점 사이의 고정 간격만큼 중점 방향의 이동 범위가 줄어듭니다."}},{"id":"c3","label":"벡터의 합으로 자취를 확대합니다","stepIds":["s7","s8","s9","s10"],"question":"점 Y의 자취 반지름과 전체 길이는 얼마인가요?","hint":"중점 M에 대해 두 위치벡터의 합을 쓰세요.","explanation":"중점의 성질로 \\(\\overrightarrow{OP}+\\overrightarrow{OQ}=2\\overrightarrow{OM}\\)이므로 \\(Y\\)는 \\(M\\)의 자취를 원점 중심으로 2배 확대한 점입니다. 한쪽 자취의 반지름은 \\(2\\sqrt3\\), 각은 \\(7\\pi/6\\)이므로 길이는 \\(2\\sqrt3\\cdot7\\pi/6=7\\sqrt3\\pi/3\\)입니다. 좌우 두 원에서 같은 길이의 서로 겹치지 않는 호가 생겨 전체는 \\(14\\sqrt3\\pi/3\\)입니다. 따라서 \\(p+q=3+14=17\\)입니다.","check":{"prompt":"마지막에 2를 곱하는 두 가지 이유를 구별해 보세요.","answer":"먼저 벡터의 합 때문에 M의 자취가 2배 확대되고, 마지막에는 A 쪽과 B 쪽의 두 자취 길이를 더하기 때문에 다시 2배가 됩니다."}}],"takeaway":["두 점의 위치벡터 합은 두 점의 중점 위치벡터의 두 배입니다.","고정 길이의 현은 중심각이 고정되므로 중점은 더 작은 동심원 위를 움직입니다."]};</script>
