  <script>window.HandStudyRecord={"itemId":16538,"sourceLabel":"2019 평가원 고3 수리가형 9월 18번","adminYear":2019,"grade":3,"month":9,"number":18,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"빨간색 공 $6$개, 파란색 공 $3$개, 노란색 공 $3$개가 들어있는 주머니가 있다. 이 주머니에서 임의로 한 개의 공을 꺼내는 시행을 하여, 다음 규칙에 따라 세 사람 ${A}$, ${B}$, ${C }$가 점수를 얻는다. (단, 한 번 꺼낸 공은 다시 주머니에 넣지 않는다.)\n∙ 빨간색 공이 나오면 ${A}$는 $3$점, ${B}$는 $1$점, ${C }$는 $1$점을 얻는다.∙ 파란색 공이 나오면 ${A}$는 $2$점, ${B}$는 $6$점, ${C }$는 $2$점을 얻는다.∙ 노란색 공이 나오면 ${A}$는 $2$점, ${B}$는 $2$점, ${C }$는 $6$점을 얻는다.\n이 시행을 계속하여 얻은 점수의 합이 처음으로 $24$점 이상인 사람이 나오면 시행을 멈춘다. 다음은 얻은 점수의 합이 $24$점 이상인 사람이 ${A}$뿐일 확률을 구하는 과정이다.\n꺼낸 빨간색 공의 개수를 $x$, 파란색 공의 개수를 $y,\\,$노란색 공의 개수를 $z$라 할 때, 얻은 점수의 합이 $24$점 이상인 사람이 ${A}$뿐이기 위해서는 $x$, $y$, $z$가 다음 조건을 만족시켜야한다. $x= 6$, $0 \u003c y \u003c 3$ , $0 \u003c z \u003c 3$ , $y+z≥ 3$ 이 조건을 만족시키는 순서쌍 $(x,\\, y,\\, z)$ 는 $(6,\\, 1,\\, 2)$ , $(6,\\, 2,\\, 1)$ , $(6,\\, 2,\\, 2)$ 이다.(ⅰ) $(x,\\, y,\\, z) = (6,\\, 1,\\, 2)$인 경우의 확률은 $box{\\,{}^{}^{}(가){}_{}\\,}$이다.(ⅱ) $(x,\\, y,\\, z) = (6,\\, 2,\\, 1)$인 경우의 확률은 $box{\\,{}^{}^{}(가){}_{}\\,}$이다.(ⅲ) $(x,\\, y,\\, z) = (6,\\, 2,\\, 2)$인 경우는 $10$번째 시행에서 빨간색 공이 나와야 하므로 그 확률은 $box{\\,{}^{}^{}(나){}_{}\\,}$이다.(ⅰ), (ⅱ), (ⅲ)에 의하여 구하는 확률은 $2 \\times box{\\,{}^{}^{}(가){}_{}\\,}\\,+\\,box{\\,{}^{}^{}(나){}_{}\\,} \\,$이다.\n위의 (가), (나)에 알맞은 수를 각각 $p$, $q$라 할 때, $p+ q의$ 값은? [4점]\n① $\\frac{13}{110}$ ② $\\frac{27}{220}$ ③ $\\frac{7}{55}$ ④ $\\frac{29}{220}$ ⑤ $\\frac{3}{22}$","answer":"②","sourceHash":"db42fe5a81f4a7e30316035f09ef216b3516ac00047802fddd1ed3f5e101095a","steps":[{"id":"s1","latex":"(x,y,z)=(6,1,2):\\quad p=\\frac{{6\\choose6}{3\\choose1}{3\\choose2}}{{12\\choose9}}=\\frac9{220}"},{"id":"s2","latex":"(x,y,z)=(6,2,1):\\quad p=\\frac9{220}"},{"id":"s3","latex":"(x,y,z)=(6,2,2):\\quad\\text{제10회는 빨강}"},{"id":"s4","latex":"P\\{\\text{처음 }10\\text{번에 }(x,y,z)=(6,2,2)\\}=\\frac{{}_{6}\\mathrm C_{6}\\,{}_{3}\\mathrm C_{2}\\,{}_{3}\\mathrm C_{2}}{{}_{12}\\mathrm C_{10}}=\\frac9{66}"},{"id":"s5","latex":"q=\\frac9{66}\\cdot\\frac6{10}=\\frac9{110}"},{"id":"s6","latex":"p+q=\\frac9{220}+\\frac9{110}=\\boxed{\\frac{27}{220}}"}],"diagram":null,"contentHash":"12a6c2588ab131ce6589fe735f46a06878dfa778d75c69d4fd730456ea904431","questionHtml":"\u003cp class=\"hp\">빨간색 공 \u003cspan class=\"heq\">\\(6\\)\u003c/span>개, 파란색 공 \u003cspan class=\"heq\">\\(3\\)\u003c/span>개, 노란색 공 \u003cspan class=\"heq\">\\(3\\)\u003c/span>개가 들어있는 주머니가 있다. 이 주머니에서 임의로 한 개의 공을 꺼내는 시행을 하여, 다음 규칙에 따라 세 사람 \u003cspan class=\"heq\">\\({A}\\)\u003c/span>, \u003cspan class=\"heq\">\\({B}\\)\u003c/span>, \u003cspan class=\"heq\">\\({C }\\)\u003c/span>가 점수를 얻는다. (단, 한 번 꺼낸 공은 다시 주머니에 넣지 않는다.)\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">∙ 빨간색 공이 나오면 \u003cspan class=\"heq\">\\({A}\\)\u003c/span>는 \u003cspan class=\"heq\">\\(3\\)\u003c/span>점, \u003cspan class=\"heq\">\\({B}\\)\u003c/span>는 \u003cspan class=\"heq\">\\(1\\)\u003c/span>점, \u003cspan class=\"heq\">\\({C }\\)\u003c/span>는 \u003cspan class=\"heq\">\\(1\\)\u003c/span>점을 얻는다.\u003c/p>\u003cp class=\"hp\">∙ 파란색 공이 나오면 \u003cspan class=\"heq\">\\({A}\\)\u003c/span>는 \u003cspan class=\"heq\">\\(2\\)\u003c/span>점, \u003cspan class=\"heq\">\\({B}\\)\u003c/span>는 \u003cspan class=\"heq\">\\(6\\)\u003c/span>점, \u003cspan class=\"heq\">\\({C }\\)\u003c/span>는 \u003cspan class=\"heq\">\\(2\\)\u003c/span>점을 얻는다.\u003c/p>\u003cp class=\"hp\">∙ 노란색 공이 나오면 \u003cspan class=\"heq\">\\({A}\\)\u003c/span>는 \u003cspan class=\"heq\">\\(2\\)\u003c/span>점, \u003cspan class=\"heq\">\\({B}\\)\u003c/span>는 \u003cspan class=\"heq\">\\(2\\)\u003c/span>점, \u003cspan class=\"heq\">\\({C }\\)\u003c/span>는 \u003cspan class=\"heq\">\\(6\\)\u003c/span>점을 얻는다.\u003c/p>\u003c/div>\u003cp class=\"hp\">이 시행을 계속하여 얻은 점수의 합이 처음으로 \u003cspan class=\"heq\">\\(24\\)\u003c/span>점 이상인 사람이 나오면 시행을 멈춘다. 다음은 얻은 점수의 합이 \u003cspan class=\"heq\">\\(24\\)\u003c/span>점 이상인 사람이 \u003cspan class=\"heq\">\\({A}\\)\u003c/span>뿐일 확률을 구하는 과정이다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">꺼낸 빨간색 공의 개수를 \u003cspan class=\"heq\">\\(x\\)\u003c/span>, 파란색 공의 개수를 \u003cspan class=\"heq\">\\(y,\\,\\)\u003c/span>노란색 공의 개수를 \u003cspan class=\"heq\">\\(z\\)\u003c/span>라 할 때, 얻은 점수의 합이 \u003cspan class=\"heq\">\\(24\\)\u003c/span>점 이상인 사람이 \u003cspan class=\"heq\">\\({A}\\)\u003c/span>뿐이기 위해서는 \u003cspan class=\"heq\">\\(x\\)\u003c/span>, \u003cspan class=\"heq\">\\(y\\)\u003c/span>, \u003cspan class=\"heq\">\\(z\\)\u003c/span>가 다음 조건을 만족시켜야한다.\u003c/p>\u003cp class=\"hp\">&emsp;\u003cspan class=\"heq\">\\(x= 6\\)\u003c/span>, \u003cspan class=\"heq\">\\(0 \\lt  y \\lt  3\\)\u003c/span> , \u003cspan class=\"heq\">\\(0 \\lt  z \\lt  3\\)\u003c/span> , \u003cspan class=\"heq\">\\(y+z\\ge  3\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">이 조건을 만족시키는 순서쌍 \u003cspan class=\"heq\">\\((x,\\, y,\\, z)\\)\u003c/span> 는\u003c/p>\u003cp class=\"hp\">&emsp;\u003cspan class=\"heq\">\\((6,\\, 1,\\, 2)\\)\u003c/span> , \u003cspan class=\"heq\">\\((6,\\, 2,\\, 1)\\)\u003c/span> , \u003cspan class=\"heq\">\\((6,\\, 2,\\, 2)\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">이다.\u003c/p>\u003cp class=\"hp htall\">(ⅰ) \u003cspan class=\"heq\">\\((x,\\, y,\\, z) = (6,\\, 1,\\, 2)\\)\u003c/span>인 경우의 확률은 \u003cspan class=\"heq\">\\(\\boxed{\\vphantom{(}\\,(\\text{가})\\,}\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp htall\">(ⅱ) \u003cspan class=\"heq\">\\((x,\\, y,\\, z) = (6,\\, 2,\\, 1)\\)\u003c/span>인 경우의 확률은 \u003cspan class=\"heq\">\\(\\boxed{\\vphantom{(}\\,(\\text{가})\\,}\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp htall\">(ⅲ) \u003cspan class=\"heq\">\\((x,\\, y,\\, z) = (6,\\, 2,\\, 2)\\)\u003c/span>인 경우는 \u003cspan class=\"heq\">\\(10\\)\u003c/span>번째 시행에서 \u003cbr>빨간색 공이 나와야 하므로 그 확률은 \u003cspan class=\"heq\">\\(\\boxed{\\vphantom{(}\\,(\\text{나})\\,}\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp htall\">(ⅰ), (ⅱ), (ⅲ)에 의하여 구하는 확률은 \u003cbr>     \u003cspan class=\"heq\">\\(2 \\times \\boxed{\\vphantom{(}\\,(\\text{가})\\,}\\,+\\,\\boxed{\\vphantom{(}\\,(\\tex
