<script>window.HandStudyRecord={"adminYear":2020,"answer":"587","contentHash":"89a63be41dcdf7b147633994a02419c8ad2b1b8e10974c4c7a4d3d76bf37a095","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24760,"month":12,"number":29,"points":4,"preview":false,"questionHtml":"\u003cp>숫자 \u003cspan class=\"heq\">\\(3, \\,3, \\,4, \\,4, \\,4\\)\u003c/span>가 하나씩 적힌 \u003cspan class=\"heq\">\\(5\\)\u003c/span>개의 공이 들어 있는 주머니가 있다. 이 주머니와 한 개의 주사위를 사용하여 다음 규칙에 따라 점수를 얻는 시행을 한다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp>주머니에서 임의로 한 개의 공을 꺼내어꺼낸 공에 적힌 수가 \u003cspan class=\"heq\">\\(3\\)\u003c/span>이면 주사위를 \u003cspan class=\"heq\">\\(3\\)\u003c/span>번 던져서 나오는세 눈의 수의 합을 점수로 하고,꺼낸 공에 적힌 수가 \u003cspan class=\"heq\">\\(4\\)\u003c/span>이면 주사위를 \u003cspan class=\"heq\">\\(4\\)\u003c/span>번 던져서 나오는네 눈의 수의 합을 점수로 한다.\u003c/p>\u003c/div>\u003cp>이 시행을 한 번 하여 얻은 점수가 \u003cspan class=\"heq\">\\(10\\)\u003c/span>점일 확률은 \u003cspan class=\"heq\">\\(\\frac{q}{p}\\)\u003c/span>이다. \u003cspan class=\"heq\">\\(p+q\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(p\\)\u003c/span>와 \u003cspan class=\"heq\">\\(q\\)\u003c/span>는 서로소인 자연수이다.) [4점]\u003c/p>","questionText":"숫자 $3, \\,3, \\,4, \\,4, \\,4$가 하나씩 적힌 $5$개의 공이 들어 있는 주머니가 있다. 이 주머니와 한 개의 주사위를 사용하여 다음 규칙에 따라 점수를 얻는 시행을 한다.\n주머니에서 임의로 한 개의 공을 꺼내어꺼낸 공에 적힌 수가 $3$이면 주사위를 $3$번 던져서 나오는세 눈의 수의 합을 점수로 하고,꺼낸 공에 적힌 수가 $4$이면 주사위를 $4$번 던져서 나오는네 눈의 수의 합을 점수로 한다.\n이 시행을 한 번 하여 얻은 점수가 $10$점일 확률은 $\\frac{q}{p}$이다. $p+q$의 값을 구하시오. [4점]","sourceHash":"389f8dcb603b63ff924d3a56e400719524efd83de57deeb587d299b74e72a275","sourceKind":"csat","sourceLabel":"2020년 시행 수능 · 2021학년도 · 나형 · 29번","steps":[{"id":"s1","latex":"\\text{공의 수가 }3\\text{일 확률}=\\frac25,\\quad4\\text{일 확률}=\\frac35"},{"id":"s2","latex":"\\text{주사위 눈에서 1씩 빼면 각 수는 }0,1,\\ldots,5"},{"id":"s3","latex":"\\text{3번 던져 합10: }u_1+u_2+u_3=7"},{"id":"s4","latex":"{}_9\\mathrm C_2-3\\cdot{}_3\\mathrm C_2=36-9=27"},{"id":"s5","latex":"\\text{어느 }u_i\\ge6\\text{인 경우를 빼며 두 수가 동시에6 이상일 수는 없다.}"},{"id":"s6","latex":"\\text{4번 던져 합10: }u_1+u_2+u_3+u_4=6"},{"id":"s7","latex":"{}_9\\mathrm C_3-4=84-4=80"},{"id":"s8","latex":"\\mathrm P=\\frac25\\frac{27}{6^3}+\\frac35\\frac{80}{6^4}=\\frac1{20}+\\frac1{27}=\\frac{47}{540}"},{"id":"s9","latex":"\\text{47과 540은 서로소이므로 기약분수에서 }\\boxed{p+q=540+47=587}"}],"track":"나형"};</script>
