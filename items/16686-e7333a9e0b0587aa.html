<script>window.HandStudyRecord={"itemId":16686,"sourceLabel":"2020 교육청 고3 수리가형 4월 21번","adminYear":2020,"grade":3,"month":4,"number":21,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"자연수 $k$에 대하여 집합 $A _{k}$를\n $\\left. A _{k} = \\left\\{ \\sin\\, \\frac{2(m-1)}{k} \\pi \\right| m은\\,자연수 \\right\\}$\n라 할 때, \u003c보기>에서 옳은 것만을 있는 대로 고른 것은? [4점]\n \u003c 보 기 > ㄱ. $A _{3} = \\left\\{ - \\frac{\\sqrt{3}}{2} ,\\,0,\\, \\frac{\\sqrt{3}}{2} \\right\\}$ ㄴ. $1$이 집합 $A _{k}$의 원소가 되도록 하는 두 자리 자연수 $k$의 개수는 $22$이다.ㄷ. $n(A _{k} )=11$을 만족시키는 모든 $k$의 값의 합은 $33$이다.\n① ㄱ ② ㄱ, ㄴ ③ ㄱ, ㄷ ④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ\n단답형","answer":"②","sourceHash":"27a0c01f0ae01f590d9def4800779755687889769ba8d58ed3547981e132cf91","steps":[{"id":"s1","latex":"A_3=\\left\\{-\\frac{\\sqrt3}{2},0,\\frac{\\sqrt3}{2}\\right\\}\\quad(\\text{ㄱ 참})"},{"id":"s2","latex":"1\\in A_k\\iff4\\mid k\\Rightarrow\\#\\{10\\le k\\le99\\}=22\\quad(\\text{ㄴ 참})"},{"id":"s3","latex":"\\sin\\theta=\\sin(\\pi-\\theta),\\quad\\text{주기 }2\\pi\\text{에서 같은 값을 짝짓기}"},{"id":"s4","latex":"n(A_k)=\\begin{cases}k&k\\equiv1,3\\pmod4\\\\k/2&k\\equiv2\\pmod4\\\\k/2+1&k\\equiv0\\pmod4\\end{cases}"},{"id":"s5","latex":"n(A_k)=11\\Rightarrow k\\in\\{11,20,22\\},\\quad\\sum k=53\\ne33\\quad(\\text{ㄷ 거짓})"},{"id":"s6","latex":"\\therefore\\ \\text{ㄱ, ㄴ 명제만 참}"}],"diagram":null,"contentHash":"9ecb2123e2cf5414d50e948739cf3ad82fa1d71ed6fae47d34ba093c0d28ce67","questionHtml":"\u003cp class=\"hp\">자연수 \u003cspan class=\"heq\">\\(k\\)\u003c/span>에 대하여 집합 \u003cspan class=\"heq\">\\(A_{k}\\)\u003c/span>를\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\(\\left. A_{k} = \\left\\{ \\sin\\, \\dfrac{2(m-1)}{k} \\pi \\right| m\\text{은}\\,\\text{자연수} \\right\\}\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">라 할 때, &lt;보기&gt;에서 옳은 것만을 있는 대로 고른 것은? \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp htall\">\u003cdiv class=\"hbox\">\u003cp class=\"hp\">&lt; 보 기 &gt;\u003c/p>\u003cp class=\"hp htall\">\u003cdiv class=\"hbox\">\u003cp class=\"hp htall\">ㄱ.\u003cspan class=\"heq\">\\(A_{3} = \\left\\{ - \\dfrac{\\sqrt{3}}{2} ,\\,0,\\, \\dfrac{\\sqrt{3}}{2} \\right\\}\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">ㄴ. \u003cspan class=\"heq\">\\(1\\)\u003c/span>이 집합 \u003cspan class=\"heq\">\\(A_{k}\\)\u003c/span>의 원소가 되도록 하는 두 자리 자연수 \u003cbr>\u003cspan class=\"heq\">\\(k\\)\u003c/span>의 개수는 \u003cspan class=\"heq\">\\(22\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp\">ㄷ. \u003cspan class=\"heq\">\\(n(A_{k} )=11\\)\u003c/span>을 만족시키는 모든 \u003cspan class=\"heq\">\\(k\\)\u003c/span>의 값의 합은 \u003cspan class=\"heq\">\\(33\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003c/p>\u003cp class=\"hp htall\">ㄱ.\u003cspan class=\"heq\">\\(A_{3} = \\left\\{ - \\dfrac{\\sqrt{3}}{2} ,\\,0,\\, \\dfrac{\\sqrt{3}}{2} \\right\\}\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">ㄴ. \u003cspan class=\"heq\">\\(1\\)\u003c/span>이 집합 \u003cspan class=\"heq\">\\(A_{k}\\)\u003c/span>의 원소가 되도록 하는 두 자리 자연수 \u003cbr>\u003cspan class=\"heq\">\\(k\\)\u003c/span>의 개수는 \u003cspan class=\"heq\">\\(22\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp\">ㄷ. \u003cspan class=\"heq\">\\(n(A_{k} )=11\\)\u003c/span>을 만족시키는 모든 \u003cspan class=\"heq\">\\(k\\)\u003c/span>의 값의 합은 \u003cspan class=\"heq\">\\(33\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003c/p>\u003cp class=\"hp\">① ㄱ&emsp;② ㄱ, ㄴ&emsp;③ ㄱ, ㄷ\u003cbr>④ ㄴ, ㄷ&emsp;⑤ ㄱ, ㄴ, ㄷ\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"e7333a9e0b0587aa20aa37fba8be83d1940b6a42dc4eb14c4da54bc3fad5e54a"};</script>
<script>window.HandStudyGuide={"itemId":16686,"sourceHash":"27a0c01f0ae01f590d9def4800779755687889769ba8d58ed3547981e132cf91","contentHash":"9ecb2123e2cf5414d50e948739cf3ad82fa1d71ed6fae47d34ba093c0d28ce67","overview":{"goal":"한 주기에서 사인값이 몇 종류 나오는지 따져 세 명제의 참과 거짓을 판단해요.","firstLook":"각 \\(m\\)은 단위원을 \\(k\\)등분한 각을 만들어요. 서로 다른 각이어도 사인값은 같을 수 있으므로 \\(\\sin\\theta=\\sin(\\pi-\\theta)\\)로 짝을 세는 것이 핵심이에요.","conditions":[{"label":"집합의 원소","meaning":"\\(m\\)은 모든 자연수를 움직이지만 사인함수의 주기 때문에 \\(m-1=0,1,\\ldots,k-1\\)만 조사하면 충분해요."},{"label":"값 1의 포함","meaning":"사인값이 \\(1\\)이 되려면 각이 \\(\\pi/2\\)에 주기의 정수배를 더한 꼴이어야 해요."},{"label":"원소 개수","meaning":"서로 다른 각의 개수가 아니라 서로 다른 사인값의 개수를 세어요."}]},"chapters":[{"id":"c1","label":"작은 경우와 값 1의 조건을 확인해요","stepIds":["s1","s2"],"question":"\\(A_3\\)를 직접 쓰고, \\(1\\in A_k\\)가 되는 \\(k\\)의 조건을 찾아볼까요?","hint":"\\(m-1=0,1,2\\)를 대입하고, \\(\\frac{2j}{k}\\pi=\\frac{\\pi}{2}+2t\\pi\\)를 풀어요.","explanation":"\\(k=3\\)일 때 한 주기의 각은 \\(0,2\\pi/3,4\\pi/3\\)이고 사인값은 각각 \\(0,\\sqrt3/2,-\\sqrt3/2\\)예요. 따라서 ㄱ은 참이에요.\n\n\\(j=m-1\\)라 두면 \\(1\\in A_k\\)이려면 \\(2j\\pi/k=\\pi/2+2t\\pi\\), 즉 \\(4j=k(4t+1)\\)이어야 해요. 이는 \\(k\\)가 \\(4\\)의 배수일 때 가능하고, 실제로 \\(j=k/4\\)를 택하면 돼요. 두 자리의 \\(4\\)의 배수는 \\(12,16,\\ldots,96\\)이므로 개수는 \\((96-12)/4+1=22\\)예요. 따라서 ㄴ도 참이에요.","check":{"prompt":"두 자리 자연수 중 첫 번째와 마지막 4의 배수는 무엇인가요?","answer":"각각 \\(12\\)와 \\(96\\)이고, 공차가 \\(4\\)인 등차수열로 세면 \\(22\\)개예요."}},{"id":"c2","label":"같은 사인값을 만드는 각을 짝지어요","stepIds":["s3","s4"],"question":"\\(n(A_k)\\)가 \\(k\\)를 \\(4\\)로 나눈 나머지에 따라 달라지는 이유는 무엇인가요?","hint":"각의 번호 \\(j\\)와 \\(\\frac{k}{2}-j\\)가 같은 사인값을 만들지만, 이 번호가 정수인지와 \\(0,\\pm1\\)이 포함되는지가 달라져요.","explanation":"한 주기에서 \\(\\sin\\theta=\\sin(\\pi-\\theta)\\)이므로 위쪽 반원의 각들은 좌우로 짝을 이루고, 아래쪽 반원도 같은 방식으로 짝을 이뤄요. \\(k\\)가 홀수이면 \\(\\pi\\)에 해당하는 표본이 없고 양수와 음수 값이 겹치지 않아 모든 \\(k\\)개 값이 서로 달라요. 그래서 \\(k\\equiv1,3\\pmod4\\)이면 \\(n(A_k)=k\\)예요.\n\n\\(k\\equiv2\\pmod4\\)이면 \\(0\\)은 두 각에서 나오고 나머지는 두 개씩 짝지어져 \\(n(A_k)=k/2\\)예요. \\(k\\equiv0\\pmod4\\)이면 여기에 \\(1\\)과 \\(-1\\)이 각각 짝 없이 더 남으므로 \\(n(A_k)=k/2+1\\)이에요. 작은 예로 \\(k=6\\)이면 서로 다른 값은 \\(0,\\pm\\sqrt3/2\\)의 \\(3\\)개이고, \\(k=8\\)이면 \\(0,\\pm\\sqrt2/2,\\pm1\\)의 \\(5\\)개라 공식과 맞아요.","check":{"prompt":"\\(k=8\\)일 때 공식이 주는 원소 개수는 얼마인가요?","answer":"\\(8/2+1=5\\)이고, 실제 값 \\(0,\\pm\\sqrt2/2,\\pm1\\)과 일치해요."}},{"id":"c3","label":"원소가 11개인 k를 모두 찾아요","stepIds":["s5","s6"],"question":"세 경우의 식을 각각 \\(11\\)과 같게 놓으면 어떤 \\(k\\)가 남을까요?","hint":"홀수, 2로 나누어지지만 4로는 나누어지지 않는 수, 4의 배수를 나누어 확인해요.","explanation":"홀수인 경우에는 \\(k=11\\)이 바로 나와요. \\(k\\equiv2\\pmod4\\)에서는 \\(k/2=11\\)이므로 \\(k=22\\)이고 조건에 맞아요. \\(k\\equiv0\\pmod4\\)에서는 \\(k/2+1=11\\)이므로 \\(k=20\\)이고 역시 조건에 맞아요. 세 값의 합은 \\(11+22+20=53\\)이므로 합이 \\(33\\)이라는 ㄷ은 거짓이에요. 따라서 참인 것은 ㄱ, ㄴ이고 정답은 ②예요.","check":{"prompt":"\\(k=20\\)과 \\(k=22\\)를 서로 다른 경우에 넣어야 하는 까닭은 무엇인가요?","answer":"\\(20\\)은 \\(4\\)의 배수라 \\(k/2+1\\)을 쓰고, \\(22\\)는 \\(4\\)로 나누면 나머지가 \\(2\\)라 \\(k/2\\)를 써야 하기 때문이에요."}}],"takeaway":["주기함수로 만든 집합은 먼저 한 주기에 해당하는 입력만 남겨요.","서로 다른 입력이 같은 함숫값을 만들 수 있으므로 대칭 관계로 중복을 세어요.","나머지에 따라 나눈 공식은 각 경우에서 얻은 답이 실제 그 나머지 조건을 만족하는지 다시 확인해요."]};</script>
