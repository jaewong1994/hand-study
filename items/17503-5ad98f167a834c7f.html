<script>window.HandStudyGuide={"itemId":17503,"sourceHash":"634a80ec415cac41188baf3f3892ab63e265a24626557e00ab1509fbb650e5ff","contentHash":"bfd9d22f1e278a9ecad732cd68d2261377f4e8788df33d996795ead310b11704","overview":{"goal":"접선과 그래프의 교점 개수가 바뀌는 위치를 모두 찾아 그 합을 구해요.","firstLook":"\\(x=t\\)는 항상 접점이에요. 그래서 차이 함수의 영점 개수가 바뀌려면 접촉 모양이나 다른 교점의 개수가 바뀌는 경계를 찾아야 해요.","conditions":[{"label":"개수 조건","meaning":"\\(t=5\\)에서는 함수값만 주변과 다르고, 왼쪽과 오른쪽의 교점 수는 같아요."}]},"chapters":[{"id":"c1","label":"특별한 접촉 조건으로 상수를 정해요","stepIds":["s1","s2","s3","s4"],"question":"왜 \\(t=5\\)에서 \\(f''(5)=0\\)이어야 할까요?","hint":"차이 함수 \\(R_t\\)는 \\(x=t\\)에서 이미 함수값과 일차항이 모두 \\(0\\)이에요.","explanation":"\\(R_t(x)=f(x)-f(t)-f'(t)(x-t)\\)로 두면 \\(R_t(t)=0\\), \\(R_t'(t)=f'(t)-f'(t)=0\\)이에요. 즉 \\(x=t\\)는 항상 적어도 두 번 겹치는 접점이에요. 그런데 \\(t=5\\)에서만 교점 하나가 더 접점에 합쳐져 \\(g(5)\\)가 주변값보다 \\(1\\) 작으려면 \\(R_t''(t)=f''(t)\\)도 \\(0\\)이어야 해요. \\(f''(5)=(25-5a-20+2a+2)e^{-5}=(7-3a)e^{-5}=0\\)이므로 \\(a=7/3\\)이에요. 따라서 \\(f''(x)=(x-4/3)(x-5)e^{-x}\\)예요.","check":{"prompt":"\\(R_t(t),R_t'(t),R_t''(t)\\)는 각각 무엇인가요?","answer":"앞의 두 값은 항상 \\(0\\)이고, 셋째는 \\(f''(t)\\)예요."}},{"id":"c2","label":"도함수의 모양으로 교점 수를 세어요","stepIds":["s5","s6","s7"],"question":"교점 수가 \\(1\\), \\(2\\), \\(3\\)으로 나뉘는 경계는 왜 \\(u,v,4/3,5\\)일까요?","hint":"\\(R_t'(x)=f'(x)-f'(t)\\)이고, \\(f'\\)의 증감은 \\(f''\\)의 부호로 정해요.","explanation":"\\(f'(x)=-(1/3)(3x^2-13x+7)e^{-x}\\)의 두 영점을 \\(u<v\\)라 두면 \\(u<4/3<v<5\\)예요. 또 \\(f''\\)의 부호로 \\(f'\\)는 \\(( -\\infty,4/3)\\)에서 증가하고, \\((4/3,5)\\)에서 감소하고, \\((5,\\infty)\\)에서 다시 증가해요. 그래서 수평선 \\(y=f'(t)\\)과 \\(f'\\)의 교점 수가 달라지는 위치가 \\(u,v,4/3,5\\)예요.\n\n이 교점들을 경계로 \\(R_t\\)의 증가·감소를 따라가고 \\(R_t(-\\infty)=\\infty\\)와 오른쪽 끝의 부호를 대조하면, \\(t\\le u\\)에서는 영점이 \\(1\\)개예요. \\(u<t\\le v\\)에서는 \\(2\\)개이지만 \\(t=4/3\\)에서는 두 영점이 접점에서 합쳐져 \\(1\\)개예요. \\(t>v\\)에서는 \\(3\\)개이지만 \\(t=5\\)에서는 합쳐진 영점을 한 번만 세어 \\(2\\)개예요. 이렇게 예외점까지 따로 세어야 서로 다른 실근의 개수가 맞아요.","check":{"prompt":"\\(4/3\\)과 \\(5\\)에서는 주변보다 교점 수가 각각 어떻게 달라지나요?","answer":"\\(4/3\\)에서는 주변 \\(2\\)개가 \\(1\\)개로, \\(5\\)에서는 주변 \\(3\\)개가 \\(2\\)개로 줄어요."}},{"id":"c3","label":"좌우에서 다른 경계만 골라요","stepIds":["s8","s9"],"question":"함수값만 작아지는 \\(4/3\\), \\(5\\)는 왜 답에 들어가지 않을까요?","hint":"문제는 \\(g(k)\\)와 극한의 차가 아니라 좌극한과 우극한의 차를 물어요.","explanation":"\\(t=4/3\\)에서는 왼쪽과 오른쪽의 \\(g(t)\\)가 모두 \\(2\\)이고 함수값만 \\(1\\)이에요. \\(t=5\\)에서도 양쪽은 모두 \\(3\\)이고 함수값만 \\(2\\)예요. 따라서 두 점은 조건을 만족하지 않아요. 반면 \\(u\\)에서는 좌우 값이 \\(1,2\\), \\(v\\)에서는 \\(2,3\\)으로 달라져요. 구하는 값은 \\(u+v\\)이고, \\(3x^2-13x+7=0\\)의 근의 합이므로 \\(u+v=13/3\\)이에요. \\(p+q=3+13=16\\)이에요.","check":{"prompt":"좌극한과 우극한이 실제로 다른 두 위치와 각 쌍은 무엇인가요?","answer":"\\(u\\)에서는 \\(1,2\\), \\(v\\)에서는 \\(2,3\\)이에요."}}],"takeaway":["접선 교점 문제는 곡선과 접선의 차이 함수를 만들어요.","서로 다른 실근 수를 셀 때 겹친 접점은 한 번만 세어요.","함수값만 주변과 다른 점과 좌극한·우극한이 서로 다른 점을 구별해요."]};</script>
