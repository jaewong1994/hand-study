<script>window.HandStudyGuide={"itemId":17389,"sourceHash":"43094e117e1cbb637d6bbbfc66735ea0d9c34f9104231d2af88dc4cd2d68227b","contentHash":"5fcdbf5572c4bbbe2d620f122c292bf35f22c94954a5dcf73191e0f1c454bebd","overview":{"goal":"0에서의 극한과 두 정지점 조건을 결합해 \\(a,b,c,\\alpha,\\beta\\)를 정하고 최종값을 계산해요.","firstLook":"\\(f(x)/x^2\\)가 유한한 값으로 가려면 먼저 \\(f(0)=0\\)이어야 해요. 그 뒤 기본극한으로 \\(c\\)를 구할 수 있어요.","conditions":[{"label":"0에서 유한한 이차 분모 극한","meaning":"상수항을 없애고 코사인과 사인의 기본극한으로 \\(c\\)를 나타내요."},{"label":"음수와 양수인 두 정지점","meaning":"도함수 방정식을 탄젠트 식으로 바꾸어 조건 (나)와 결합해요."}]},"chapters":[{"id":"c1","label":"극한에서 상수 관계 얻기","stepIds":["s1"],"question":"분모가 \\(x^2\\)인데 분자에 0이 아닌 상수항이 남으면 극한은 어떻게 될까요?","hint":"먼저 \\(f(0)\\)을 0으로 만든 뒤 식을 \\(\\cos x-1\\)과 \\(x\\sin x\\)로 나누세요.","explanation":"유한한 극한이 존재하려면 \\(f(0)=a+b=0\\)이어야 하므로 \\(b=-a\\)예요. 그러면 \\(f(x)=a(\\cos x-1)+x\\sin x\\)이고\n\n\\(c=a\\lim_{x\\to0}\\frac{\\cos x-1}{x^2}+\\lim_{x\\to0}\\frac{\\sin x}{x}=a(-1/2)+1=1-a/2\\)\n\n예요.","check":{"prompt":"\\(x\\sin x/x^2\\)의 극한이 1인 이유는 무엇인가요?","answer":"약분하면 \\(\\sin x/x\\)이고, 이는 1로 가까워지는 기본극한이에요."}},{"id":"c2","label":"두 정지점 조건 결합하기","stepIds":["s2","s3","s4"],"question":"정지점에서 얻은 두 탄젠트 값을 조건 (나)에 넣으면 왜 \\(\\beta=1-a\\)가 되나요?","hint":"\\(\\tan\\alpha=-\\alpha/(1-a)\\), \\(\\tan\\beta=-\\beta/(1-a)\\)를 차분식에 그대로 대입하세요.","explanation":"미분하면 \\(f'(x)=(1-a)\\sin x+x\\cos x\\)예요. \\(\\alpha,\\beta\\)에서는 \\(\\cos x\\ne0\\)이고 \\(a<1\\)이므로 \\(\\tan x=-x/(1-a)\\)예요. 따라서 \\(\\frac{\\tan\\beta-\\tan\\alpha}{\\beta-\\alpha}=-\\frac1{1-a}\\)이고 조건 (나)는 \\(-\\frac1{1-a}+\\frac1\\beta=0\\)이 돼요. 그래서 \\(\\beta=1-a\\)예요.\n\n이를 \\(\\tan\\beta=-\\beta/(1-a)\\)에 넣으면 \\(\\tan\\beta=-1\\)이에요. \\(0<\\beta<\\pi\\)에서 가능한 값은 \\(\\beta=3\\pi/4\\)이고, \\(a=1-\\beta=1-3\\pi/4\\)예요.","check":{"prompt":"\\(\\tan\\beta=-1\\)의 해 중 \\(\\beta=7\\pi/4\\)를 쓰지 않는 이유는 무엇인가요?","answer":"문제에서 \\(0<\\beta<\\pi\\)라고 했으므로 그 범위를 벗어나요."}},{"id":"c3","label":"음의 정지점 확인하기","stepIds":["s5"],"question":"음의 구간에서 \\(-3\\pi/4\\) 외에 다른 해가 없다는 것을 어떻게 확인할까요?","hint":"\\(\\tan x=-4x/(3\\pi)\\)의 양변 부호와 각 연속 구간의 단조성을 보세요.","explanation":"정지점 식은 \\(\\tan x=-4x/(3\\pi)\\)가 돼요. \\(-\\pi/2<x<0\\)에서는 \\(\\tan x<0\\)인데 오른쪽은 양수라 해가 없어요. \\(-\\pi<x<-\\pi/2\\)에서 \\(\\tan x+4x/(3\\pi)\\)의 미분은 \\(\\sec^2x+4/(3\\pi)>0\\)이므로 이 함수는 계속 증가해 해가 하나뿐이에요. \\(x=-3\\pi/4\\)를 넣으면 양변이 모두 1이므로 \\(\\alpha=-3\\pi/4\\)예요.","check":{"prompt":"\\(-\\pi/2<x<0\\)에서 해가 없는 가장 빠른 확인은 무엇인가요?","answer":"왼쪽 \\(\\tan x\\)는 음수이고 오른쪽 \\(-4x/(3\\pi)\\)는 양수라 서로 같을 수 없어요."}},{"id":"c4","label":"최종값 계산하기","stepIds":["s6","s7"],"question":"\\((\\beta-\\alpha)/3\\)은 어떤 특별한 각이 되나요?","hint":"\\(\\alpha=-3\\pi/4\\), \\(\\beta=3\\pi/4\\)를 먼저 대입하세요.","explanation":"\\((\\beta-\\alpha)/3=(3\\pi/2)/3=\\pi/2\\)예요. \\(b=-a\\)이므로 \\(f(\\pi/2)=\\pi/2-a\\), \\(c=1-a/2\\)예요. 합은 \\(\\pi/2+1-3a/2\\)이고 \\(a=1-3\\pi/4\\)를 넣으면 \\(-1/2+13\\pi/8\\)이에요. 따라서 \\(p=-1/2\\), \\(q=13/8\\)이고 \\(120(p+q)=120\\cdot9/8=135\\)예요.","check":{"prompt":"\\(-1/2+13\\pi/8\\)에서 \\(p+q\\)는 얼마인가요?","answer":"\\(-1/2+13/8=9/8\\)이에요."}}],"takeaway":["분모가 \\(x^2\\)인 유한 극한에서는 분자의 상수항부터 없애요.","같은 정지점 식을 두 점에 적용하면 조건의 차분식이 단순해질 수 있어요.","삼각방정식의 해는 주어진 구간과 단조성을 함께 확인해요."]};</script>
