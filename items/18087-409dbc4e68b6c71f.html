<script>window.HandStudyRecord={"adminYear":2024,"answer":"57","contentHash":"201a5897f869ba5059f480f2e34a1fba189d6a1af978ae46dab0b62823f2354e","diagram":null,"editionHash":"409dbc4e68b6c71f1b68f039a39f0bf95ffe6f136f89e36f0e1a1a803c92dc58","grade":3,"graphHash":"","graphPlan":null,"itemId":18087,"learningHash":"d420a60ce5ca644db14550442ae42b0678e18e0997a94fa7a87b38143aea2ce7","month":9,"number":29,"points":4,"preview":false,"questionHtml":"\u003cp class=\"hp\">수열 \u003cspan class=\"heq\">\\(\\left\\{ a_{n} \\right\\} \\,\\)\u003c/span>의 첫째항부터 제\u003cspan class=\"heq\">\\(m\\,\\)\u003c/span>항까지의 합을 \u003cspan class=\"heq\">\\(S_{m}\\,\\)\u003c/span>이라 하자.\u003cbr>모든 자연수 \u003cspan class=\"heq\">\\(m\\,\\)\u003c/span>에 대하여\u003c/p>\u003cp class=\"hp htall\">&emsp;&emsp;\u003cspan class=\"heq\">\\(S_{m}= \\sum\\limits_{n=1}^{ \\infty } \\dfrac{m+1}{n(n+m+1)}\\)\u003c/span>\u003c/p>\u003cp class=\"hp htall\">일 때, \u003cspan class=\"heq\">\\(a_{1}+a_{10}=\\dfrac{q}{p}\\,\\)\u003c/span>이다. \u003cspan class=\"heq\">\\(p+q\\,\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(p\\,\\)\u003c/span>와 \u003cspan class=\"heq\">\\(q\\,\\)\u003c/span>는 서로소인 자연수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","questionText":"수열 $\\left\\{ a_{n} \\right\\} \\,$의 첫째항부터 제$m\\,$항까지의 합을 $S_{m}\\,$이라 하자. 모든 자연수 $m\\,$에 대하여\n $S_{m}= \\sum_{n=1}^{ \\infty } \\frac{m+1}{n(n+m+1)}$\n일 때, $a_{1}+a_{10}=\\frac{q}{p}\\,$이다. $p+q\\,$의 값을 구하시오. (단, $p\\,$와 $q\\,$는 서로소인 자연수이다.) [4점]","scoreStatus":"confirmed_4_direct","sourceHash":"099857c398ee53bb5ac6c3768071441be9a52639d2568339f74e5629d961326c","sourceLabel":"2024 평가원 고3 수학미적분 9월 29번","stepExplanations":{"s2":{"body":"\\(m\\)을 고정하고 \\(N\\ge m+1\\)인 부분합을 쓰면 \\(\\sum_{n=1}^{N}(\\frac1n-\\frac1{n+m+1})=1+\\frac{1}{2}+\\cdots+\\frac1{m+1}-\\{\\frac1{N+1}+\\cdots+\\frac1{N+m+1}\\}\\)이에요. 뒤의 괄호에는 \\(m+1\\)개 항만 남고, 그 합은 0보다 크며 \\(\\frac{m+1}{N+1}\\) 이하예요. \\(N\\to\\infty\\)일 때 이 값이 0으로 가므로 앞의 유한합만 남아요.","skillTags":["calculus.limit"],"title":"무한합을 바로 지우지 말고 N항까지만 써 봐요"},"s4":{"body":"\\(a_1\\)은 첫 부분합 자체라서 \\(a_1=S_1=1+\\frac{1}{2}=\\frac{3}{2}\\)예요. \\(a_{10}\\)은 \\(S_{10}-S_9\\)이므로 \\(1\\)부터 \\(\\frac{1}{10}\\)까지의 항이 모두 지워지고 \\(\\frac{1}{11}\\)만 남아요. 따라서 합은 \\(\\frac{3}{2}+\\frac{1}{11}=\\frac{35}{22}\\)이고, 35와 22는 서로소이므로 \\(p+q=57\\)이에요.","skillTags":["algebra.calculation"],"title":"첫째항과 열째항은 따로 계산해요"}},"steps":[{"id":"s1","latex":"\\dfrac{m+1}{n(n+m+1)}=\\dfrac1n-\\dfrac1{n+m+1}"},{"id":"s2","latex":"S_m=1+\\dfrac12+\\cdots+\\dfrac1{m+1}"},{"id":"s3","latex":"a_1=S_1=\\dfrac32"},{"id":"s4","latex":"a_{10}=S_{10}-S_9=\\dfrac1{11}"},{"id":"s5","latex":"a_1+a_{10}=\\dfrac{35}{22}\\Rightarrow p+q=57"}],"track":"미적분"};</script>
