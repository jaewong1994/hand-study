<script>window.HandStudyRecord={"itemId":17659,"sourceLabel":"2023 교육청 고3 수학미적분 10월 30번","adminYear":2023,"grade":3,"month":10,"number":30,"track":"미적분","points":4,"scoreStatus":"confirmed_4_direct","questionText":"두 정수 $a\\,$, $b\\,$에 대하여 함수 \n $f(x)= ( x ^{2} +ax+b ) e ^{-x} \\,$\n이 다음 조건을 만족시킨다. \n(가) 함수 $f(x)\\,$는 극값을 갖는다.(나) 함수 $\\left| f(x) \\right| \\,$가 $x=k \\,$에서 극대 또는 극소인 모든 $k\\,$의 값의 합은 $3\\,$이다.\n$f(10)=p\\,e^-10$일 때, $p\\,$의 값을 구하시오. [4점]","answer":"91","sourceHash":"9494f209f97bd94db429400b8e5869104ae58262cb0d87ca873e4e79b243d365","steps":[{"id":"s1","latex":"q(x)=x^2+ax+b,\\quad f'(x)=-e^{-x}\\{x^2-(2-a)x-(a-b)\\}"},{"id":"s2","latex":"f\\text{의 두 극점 위치의 합}=2-a"},{"id":"s3","latex":"\\Delta_q>0:\\quad\\sum k=(2-a)+(-a)=3\\Rightarrow a=-\\dfrac12\\quad\\text{불가}"},{"id":"s4","latex":"\\Delta_q=0:\\quad2-a=3\\Rightarrow a=-1,\\ b=\\dfrac14\\quad\\text{불가}"},{"id":"s5","latex":"\\Delta_q\u003c0:\\quad|f|=f,\\quad2-a=3\\Rightarrow a=-1"},{"id":"s6","latex":"b>\\dfrac14,\\quad f\\text{가 극값을 가짐}\\Rightarrow b\u003c\\dfrac54"},{"id":"s7","latex":"b\\in\\mathbb Z\\Rightarrow b=1,\\quad f(10)=91e^{-10}"}],"diagram":null,"contentHash":"d48998444dcc391826d31af7f1c9c9233fd5fe42787c45ace99ccfe72f0f9ebf","questionHtml":"\u003cp class=\"hp\">두 정수 \u003cspan class=\"heq\">\\(a\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(b\\,\\)\u003c/span>에 대하여 함수\u003c/p>\u003cp class=\"hp\">&emsp;&emsp;\u003cspan class=\"heq\">\\(f(x)= ( x^{2} +ax+b ) e^{-x} \\,\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">이 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가)함수 \u003cspan class=\"heq\">\\(f(x)\\,\\)\u003c/span>는 극값을 갖는다.\u003c/p>\u003cp class=\"hp\">(나)함수 \u003cspan class=\"heq\">\\(\\left| f(x) \\right| \\,\\)\u003c/span>가 \u003cspan class=\"heq\">\\(x=k \\,\\)\u003c/span>에서 극대 또는 극소인 모든 \u003cspan class=\"heq\">\\(k\\,\\)\u003c/span>의 값의 합은 \u003cspan class=\"heq\">\\(3\\,\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(f(10)=p\\,e^{-10}\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(p\\,\\)\u003c/span>의 값을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"0a71b3b0a518d71ad5fa2cbf4f11c467d0107ad6ced8648b27d0ed1e884f6474"};</script>
<script>window.HandStudyGuide={"itemId":17659,"sourceHash":"9494f209f97bd94db429400b8e5869104ae58262cb0d87ca873e4e79b243d365","contentHash":"d48998444dcc391826d31af7f1c9c9233fd5fe42787c45ace99ccfe72f0f9ebf","overview":{"goal":"절댓값 함수의 극값 후보를 원래 함수의 영점과 극점으로 나누어 정수 \\(a,b\\)를 정해요.","firstLook":"지수인수는 항상 양수예요. 따라서 \\(f\\)의 부호와 영점은 이차식이 정하고, \\(f\\)의 극점은 도함수 안의 다른 이차식이 정해요.","conditions":[{"label":"원래 함수가 극값을 가짐","meaning":"도함수의 이차식이 부호를 바꾸는 서로 다른 두 실근을 가져야 해요."},{"label":"절댓값 함수의 모든 극값 위치 합","meaning":"이차식의 실근 개수에 따라 새로 생기는 영점 극소를 포함해 경우를 나눠요."}]},"chapters":[{"id":"c1","label":"두 종류의 극값 후보 정리하기","stepIds":["s1","s2"],"question":"\\(f\\)의 극점 위치 두 개의 합은 도함수에서 어떻게 읽을 수 있을까요?","hint":"\\(q(x)=x^2+ax+b\\)로 두고 곱의 미분을 하세요.","explanation":"\\(q(x)=x^2+ax+b\\)로 두면 \\(f(x)=q(x)e^{-x}\\)이고, 미분하면 \\(f'(x)=-e^{-x}\\{x^2-(2-a)x-(a-b)\\}\\)예요. \\(e^{-x}\\)는 0이 아니므로 극점 후보는 괄호 안 이차식의 근이에요. 두 근의 합은 \\(2-a\\)예요. 한편 \\(|f|\\)는 \\(f\\)의 극점뿐 아니라 \\(q(x)=0\\)에서 부호가 바뀌면 값 0의 극소를 가져요.","check":{"prompt":"이차식 \\(q\\)의 근이 곧 \\(f\\)의 근인 이유는 무엇인가요?","answer":"\\(e^{-x}>0\\)이므로 \\(f(x)=0\\)일 조건은 \\(q(x)=0\\)뿐이에요."}},{"id":"c2","label":"이차식의 실근 개수로 경우 나누기","stepIds":["s3","s4","s5"],"question":"\\(q\\)가 서로 다른 두 실근, 중근, 실근 없음일 때 극값 위치의 합은 어떻게 달라질까요?","hint":"서로 다른 두 영점은 \\(|f|\\)의 극소 두 개를 추가하지만, 중근은 \\(f\\)의 부호를 바꾸지 않아요.","explanation":"\\(q\\)가 서로 다른 두 실근을 가지면 두 영점에서 \\(|f|\\)의 극소가 추가되고 그 위치 합은 \\(-a\\)예요. 전체 합은 \\((2-a)+(-a)=3\\)이어서 \\(a=-1/2\\)가 되지만 \\(a\\)가 정수라는 조건에 어긋나요.\n\n중근이면 \\(q\\ge0\\)이고 그 한 점은 이미 \\(f\\)의 극점 후보와 겹쳐 중복해서 더하지 않아요. 위치 합은 \\(2-a=3\\), 그래서 \\(a=-1\\)이에요. 중근 조건 \\(a^2-4b=0\\)은 \\(b=1/4\\)를 주어 정수 조건에 어긋나요. 따라서 \\(q\\)는 실근이 없고 항상 양수인 경우여야 해요. 이때 \\(|f|=f\\)이고 다시 \\(2-a=3\\)에서 \\(a=-1\\)이에요.","check":{"prompt":"\\(q\\)가 실근이 없을 때 항상 양수인 이유는 무엇인가요?","answer":"최고차항 계수가 양수인 이차식이고 x축과 만나지 않으므로 모든 실수에서 양수예요."}},{"id":"c3","label":"정수 조건으로 남은 값 결정하기","stepIds":["s6","s7"],"question":"\\(a=-1\\)에서 \\(q\\)가 항상 양수일 조건과 \\(f\\)가 실제 극값을 가질 조건은 각각 무엇인가요?","hint":"두 이차식의 판별식을 각각 계산하고 부등식을 겹치세요.","explanation":"\\(a=-1\\)이면 \\(q(x)=x^2-x+b\\)예요. 실근이 없으려면 판별식 \\(1-4b<0\\), 즉 \\(b>1/4\\)예요. 도함수 안의 식은 \\(x^2-3x+(b+1)\\)이고, \\(f\\)가 극값을 가지려면 이 식이 서로 다른 두 실근을 가져 도함수 부호가 바뀌어야 해요. 판별식 \\(9-4(b+1)=5-4b>0\\)에서 \\(b<5/4\\)예요.\n\n따라서 \\(1/4<b<5/4\\)인 정수는 \\(b=1\\)뿐이에요. \\(f(10)=(100-10+1)e^{-10}=91e^{-10}\\)이므로 \\(p=91\\)이에요.","check":{"prompt":"도함수의 이차식이 중근만 가지면 왜 조건 (가)의 극값이 되지 않나요?","answer":"중근에서는 도함수의 부호가 바뀌지 않아 함수가 증가와 감소를 서로 바꾸지 않기 때문이에요."}}],"takeaway":["절댓값 함수의 극값 후보는 원래 함수의 극점과 부호가 바뀌는 영점을 함께 살펴봐요.","같은 위치가 두 조건에서 겹치면 극값 위치의 합에 한 번만 더해요.","정수 조건은 두 판별식 부등식으로 얻은 좁은 구간에서 마지막 후보를 정해요."]};</script>
