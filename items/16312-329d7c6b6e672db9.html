lpha )=2\\,\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(f( \\alpha )\\,\\)\u003c/span>의 값을 구하시오.\u003cbr>(단, \u003cspan class=\"heq\">\\(\\lim\\limits_{x\\to  - \\infty } {} g(x)=0\\,\\)\u003c/span>이고, \u003cspan class=\"heq\">\\(\\alpha \\,\\)\u003c/span>는 상수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"329d7c6b6e672db981cef742671167a7fcda3743be766a93e4dd656bffa5a8a9"};</script>
<script>window.HandStudyGuide={"itemId":16312,"sourceHash":"8260212481f214a9a9910b45b4814cc3d64ec564c9598096f26260dddde2bdba","contentHash":"4b696e2b7a49104539cf72c260d261fc2e2614b7f60678c749b4e89baa4bbacb","overview":{"goal":"절댓값 그래프의 뾰족점 개수 변화로 \\(g\\)의 증가 형태를 결정해요.","firstLook":"\\(|g(x)-g(t)|\\)는 \\(g(x)=g(t)\\)인 점에서 원래 그래프가 수평이 아니면 뾰족해져요.","conditions":[{"label":"불연속점 하나","meaning":"뾰족점 개수가 바뀌는 높이가 한 곳뿐이어야 해요."},{"label":"왼쪽 끝 거동","meaning":"\\(g(x)\\to0\\) as \\(x\\to-\\infty\\)예요."}]},"chapters":[{"id":"c1","label":"뾰족점이 생기는 조건을 읽어요","stepIds":["s1","s2"],"question":"\\(h(t)\\)는 무엇을 세는 함수인가요?","hint":"절댓값 안이 \\(0\\)이 되는 점의 기울기를 확인해요.","explanation":"\\(g(x)=g(t)\\)인 점에서 \\(g'(x)\\ne0\\)이면 \\(g(x)-g(t)\\)의 부호가 바뀌어 절댓값 그래프에 뾰족점이 생겨요. 반대로 \\(g'(x)=0\\)이면 그 점은 세지 않아요. 따라서 \\(h(t)\\)는 \\(g(x)=g(t),g'(x)\\ne0\\)인 실수 \\(x\\)의 개수예요. 또 곱을 미분하면 \\(g'(x)=\\{f(x)+f'(x)\\}e^x\\)이고, \\(e^x>0\\)이므로 증감은 이차식 \\(q(x)=f(x)+f'(x)\\)의 부호가 정해요.","check":{"prompt":"\\(g(x)=g(t)\\)여도 세지 않는 경우는 언제인가요?","answer":"그 점에서 \\(g'(x)=0\\)일 때예요."}},{"id":"c2","label":"도함수의 이차식을 결정해요","stepIds":["s3","s4","s5"],"question":"왜 \\(q(x)=(x-\\alpha)^2\\)이어야 하나요?","hint":"이차식의 서로 다른 두 근은 서로 다른 극값 높이를 만들어요.","explanation":"\\(q\\)의 최고차항 계수는 \\(f\\)와 같이 \\(1\\)이에요. \\(q\\)가 서로 다른 두 실근을 가지면 \\(g\\)에는 극댓값과 극솟값이 생기고, 수평선과의 교점 개수가 바뀌는 높이도 둘 생겨 \\(h\\)의 불연속점이 하나라는 조건에 어긋나요. \\(q>0\\)이 항상 성립하면 \\(g\\)는 계속 증가하여 뾰족점 개수가 늘 \\(1\\)이라 불연속점이 없어요. 그러므로 \\(q\\)는 한 점에서만 \\(0\\)이고 부호가 바뀌지 않는 완전제곱, 곧 \\(q(x)=(x-\\alpha)^2\\)여야 해요.","check":{"prompt":"\\(q\\)가 항상 양수이면 \\(h\\)는 어떻게 되나요?","answer":"\\(g\\)가 일대일로 증가하므로 항상 \\(1\\)이에요."}},{"id":"c3","label":"유일한 불연속점의 값을 해석해요","stepIds":["s6","s7"],"question":"\\(t=\\alpha\\)에서만 개수가 달라지는 이유는 무엇인가요?","hint":"\\(g'=(x-\\alpha)^2e^x\\)는 부호가 바뀌지 않아요.","explanation":"\\(g'(x)=(x-\\alpha)^2e^x\\ge0\\)이고 \\(x=\\alpha\\)에서만 \\(0\\)이므로 \\(g\\)는 전체에서 증가해요. \\(t\\ne\\alpha\\)이면 같은 함숫값을 갖는 점은 \\(x=t\\) 하나이고 그곳의 기울기가 \\(0\\)이 아니어서 \\(h(t)=1\\)이에요. \\(t=\\alpha\\)이면 유일한 교점의 기울기가 \\(0\\)이어서 \\(h(\\alpha)=0\\)이에요. 또한 \\(q(\\alpha)=f(\\alpha)+f'(\\alpha)=0\\)이므로 \\(f(\\alpha)=-f'(\\alpha)\\)예요. 계수를 비교하거나 \\(q=(x-\\alpha)^2\\)를 풀면 \\(f(\\alpha)=2\\)를 얻어요.","check":{"prompt":"\\(h(\\alpha)\\)가 \\(0\\)인 까닭은 무엇인가요?","answer":"유일한 해 \\(x=\\alpha\\)에서 \\(g'(\\alpha)=0\\)이기 때문이에요."}},{"id":"c4","label":"주어진 함숫값으로 위치를 확인해요","stepIds":["s8"],"question":"\\(\\alpha\\)는 얼마인가요?","hint":"\\(g(\\alpha)=f(\\alpha)e^\\alpha\\)를 써요.","explanation":"앞에서 \\(f(\\alpha)=2\\)이고 문제에서 \\(g(\\alpha)=2\\)라고 했어요. 따라서 \\(2e^\\alpha=2\\), 곧 \\(e^\\alpha=1\\)이어서 \\(\\alpha=0\\)이에요. 요구한 값은 이미 구한 \\(f(\\alpha)=2\\)예요.","check":{"prompt":"\\(e^\\alpha=1\\)인 실수는 무엇인가요?","answer":"\\(\\alpha=0\\)이에요."}}],"takeaway":["절댓값 합성의 미분 불가능점은 안쪽 함수의 영점과 기울기를 함께 봐요.","도함수의 근 개수는 수평선 교점 개수가 바뀌는 높이 수와 연결돼요.","완전제곱 도함수는 한 점에서만 기울기가 \\(0\\)인 증가함수를 만들어요."]};</script>
