<script>window.HandStudyRecord={"itemId":17938,"sourceLabel":"2024 교육청 고3 수학기하 7월 30번","adminYear":2024,"grade":3,"month":7,"number":30,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"공간에 점 $P$를 포함하는 평면 $\\alpha$가 있다. 평면 $\\alpha$ 위에 있지 않은 서로 다른 두 점 $A$, $B$의 평면 $\\alpha$ 위로의 정사영을 각각 $A '$, $B '$이라 할 때, \n ${\\overline{ AA ' }} =9$, ${\\overline{ A ' P }} = {\\overline{ A ' B ' }} =5$, ${\\overline{ PB ' }} =8$\n이다. 선분 $PB '$의 중점 $M$에 대하여 $\\angle MAB = \\frac{\\pi }{2}$일 때, 직선 $BM$과 평면 $APB '$이 이루는 예각의 크기를 $\\theta$라 하자. $\\cos^{2} \\theta = \\frac{q}{p}$일 때, $p+q$의 값을 구하시오. (단, $p$와 $q$는 서로소인 자연수이다.) [4점]","answer":"111","sourceHash":"f850e0600f2735783e056bd3f9e7a9692400445ec97fb4a5474a2fde84cfd7a5","steps":[{"id":"s1","latex":"A'M\\perp PB',\\quad A'M=\\sqrt{5^2-4^2}=3"},{"id":"s2","latex":"AA'\\perp\\alpha\\Rightarrow AM=\\sqrt{3^2+9^2}=3\\sqrt{10}"},{"id":"s3","latex":"BB'=t:\\quad AM^2+AB^2=MB^2"},{"id":"s4","latex":"90+25+(t-9)^2=16+t^2\\Rightarrow t=10"},{"id":"s5","latex":"\\cos\\angle AMA'=\\dfrac3{3\\sqrt{10}}=\\dfrac1{\\sqrt{10}}"},{"id":"s6","latex":"d(B,\\text{평면 }APB')=10\\cdot\\dfrac1{\\sqrt{10}}=\\sqrt{10}"},{"id":"s7","latex":"MB=\\sqrt{4^2+10^2}=2\\sqrt{29}"},{"id":"s8","latex":"\\cos^2\\theta=1-\\dfrac{10}{116}=\\dfrac{53}{58}\\Rightarrow p+q=111"}],"diagram":null,"contentHash":"3b2db24104b2a3fbb86c3cee5182496caa715338d376b5ec66f2f61f1836873e","questionHtml":"<p class=\"hp\">공간에 점 <span class=\"heq\">\\(P\\)<\/span>를 포함하는 평면 <span class=\"heq\">\\(\\alpha\\)<\/span>가 있다. 평면 <span class=\"heq\">\\(\\alpha\\)<\/span> 위에 있지 않은 서로 다른 두 점 <span class=\"heq\">\\(A\\)<\/span>, <span class=\"heq\">\\(B\\)<\/span>의 평면 <span class=\"heq\">\\(\\alpha\\)<\/span> 위로의 정사영을 각각 <span class=\"heq\">\\(A'\\)<\/span>, <span class=\"heq\">\\(B'\\)<\/span>이라 할 때,<\/p><p class=\"hp htall\">&emsp;<span class=\"heq\">\\({\\overline{AA' }} =9\\)<\/span>, <span class=\"heq\">\\({\\overline{A' P }} = {\\overline{A' B' }} =5\\)<\/span>, <span clas <script>window.HandStudyGuide={"itemId":17938,"sourceHash":"f850e0600f2735783e056bd3f9e7a9692400445ec97fb4a5474a2fde84cfd7a5","contentHash":"3b2db24104b2a3fbb86c3cee5182496caa715338d376b5ec66f2f61f1836873e","overview":{"goal":"바닥 평면의 5-5-8 삼각형과 두 수직 단면을 이용해 점 B의 높이를 구하고, 직선 BM과 평면 APB'이 이루는 각을 계산해요.","firstLook":"정사영점 \\(A',B'\\)와 중점 \\(M\\)은 모두 평면 \\(\\alpha\\) 위에 있어요. 먼저 평면도에서 \\(A'M\\)을 구한 뒤 \\(AA'\\), \\(BB'\\)를 세운 수직 단면으로 옮겨가요.","conditions":[{"label":"정사영 길이","meaning":"\\(AA'=9\\)이고 \\(BB'\\)는 아직 모르는 높이예요."},{"label":"평면도","meaning":"평면 \\(\\alpha\\) 위에서 \\(A'P=A'B'=5\\), \\(PB'=8\\), \\(M\\)은 \\(PB'\\)의 중점이에요."},{"label":"직각 조건","meaning":"\\(\\angle MAB=90^\\circ\\)이므로 삼각형 \\(AMB\\)에 피타고라스 정리를 쓸 수 있어요."}]},"chapters":[{"id":"c1","label":"평면도와 A 쪽 수직 단면을 계산해요","stepIds":["s1","s2"],"question":"\\(A'M\\)과 \\(AM\\)의 길이는 각각 얼마인가요?","hint":"삼각형 \\(A'PB'\\)는 두 변이 \\(5\\)인 이등변삼각형이고 밑변의 절반은 \\(4\\)예요.","explanation":"\\(A'P=A'B'=5\\)이고 \\(M\\)은 길이 \\(8\\)인 \\(PB'\\)의 중점이므로 \\(PM=MB'=4\\)예요. 이등변삼각형에서 꼭짓점과 밑변 중점을 이은 선은 밑변에 수직이므로 \\(A'M=\\sqrt{5^2-4^2}=3\\)이에요.\n\n\\(AA'\\perp\\alpha\\)이고 \\(A'M\\)은 평면 \\(\\alpha\\) 위에 있으므로 \\(\\angle AA'M=90^\\circ\\)예요. 따라서 \\(AM=\\sqrt{AA'^2+A'M^2}=\\sqrt{9^2+3^2}=3\\sqrt{10}\\)이에요.","check":{"prompt":"삼각형 \\(AA'M\\)의 두 직각변은 무엇인가요?","answer":"\\(AA'=9\\), \\(A'M=3\\)이에요."}},{"id":"c2","label":"직각삼각형 AMB로 B의 높이를 구해요","stepIds":["s3","s4"],"question":"\\(BB'=t\\)라 할 때 \\(\\angle MAB=90^\\circ\\)은 어떤 방정식을 만들까요?","hint":"\\(AB^2=A'B'^2+(t-9)^2\\), \\(MB^2=MB'^2+t^2\\)예요.","explanation":"두 점의 정사영 사이 거리가 \\(A'B'=5\\)이고 높이 차가 \\(t-9\\)이므로 \\(AB^2=25+(t-9)^2\\)이에요. 또 \\(M\\)에서 \\(B'\\)까지가 \\(4\\), \\(B\\)의 높이가 \\(t\\)이므로 \\(MB^2=16+t^2\\)예요.\n\n\\(\\angle MAB=90^\\circ\\)이므로 \\(AM^2+AB^2=MB^2\\)예요. 값을 넣으면 \\(90+25+(t-9)^2=16+t^2\\)이고, 전개해 \\(196-18t=16\\), 따라서 \\(t=10\\)이에요.","check":{"prompt":"방정식에서 \\(t^2\\)을 소거한 뒤 남는 식은 무엇인가요?","answer":"\\(180=18t\\)이므로 \\(t=10\\)이에요."}},{"id":"c3","label":"B에서 평면 APB'까지의 수선 거리를 구해요","stepIds":["s5","s6"],"question":"점 \\(B\\)의 높이 \\(10\\) 중 평면 \\(APB'\\)에 수직인 성분은 얼마일까요?","hint":"직선 \\(PB'\\)에 수직인 단면에서 \\(MA\\)와 \\(MA'\\)가 이루는 각을 봐요.","explanation":"직선 \\(PB'\\)에 수직이고 \\(M,A',A\\)를 지나는 단면에서 \\(\\cos\\angle AMA'=A'M/AM=3/(3\\sqrt{10})=1/\\sqrt{10}\\)이에요. 평면 \\(APB'\\)은 이 단면에서 직선 \\(AM\\)으로 보이고, \\(BB'=10\\)은 바닥 평면에 수직인 선분으로 보여요.\n\n따라서 \\(B\\)에서 평면 \\(APB'\\)까지의 수선 거리는 이 수직 단면에서 높이 \\(10\\)을 \\(AM\\)에 수직인 방향으로 잰 길이이고, \\(10\\cdot1/\\sqrt{10}=\\sqrt{10}\\)이에요.","check":{"prompt":"구한 거리가 \\(BB'=10\\)보다 작은가요?","answer":"\\(\\sqrt{10}<10\\)이므로 수선 거리에 맞아요."}},{"id":"c4","label":"직선과 평면이 이루는 각을 구해요","stepIds":["s7","s8"],"question":"직선 \\(BM\\)과 평면 \\(APB'\\)이 이루는 각의 코사인 제곱은 얼마인가요?","hint":"BM의 길이와 B에서 평면까지의 수선 거리를 이용해 사인 제곱을 먼저 구해요.","explanation":"직각삼각형 \\(BMB'\\)에서 \\(MB=\\sqrt{MB'^2+BB'^2}=\\sqrt{4^2+10^2}=2\\sqrt{29}\\)예요. 직선 \\(BM\\)과 평면이 이루는 예각을 \\(\\theta\\)라 하면, 점 \\(B\\)에서 평면까지의 수선 거리 \\(\\sqrt{10}\\)이 \\(BM\\sin\\theta\\)예요.\n\n따라서 \\(\\sin^2\\theta=10/116=5/58\\)이고 \\(\\cos^2\\theta=1-5/58=53/58\\)이에요. \\(p=58,q=53\\)은 서로소이므로 \\(p+q=111\\)이에요.","check":{"prompt":"\\((2\\sqrt{29})^2\\)은 얼마인가요?","answer":"\\(4\\cdot29=116\\)이에요."}}],"takeaway":["공간도형의 정사영 자료는 먼저 바닥 평면도에서 길이를 구한 뒤 수직 단면으로 옮겨요.","두 점 사이 공간거리는 정사영점 사이 거리와 높이 차로 피타고라스 정리를 적용할 수 있어요.","직선과 평면 사이의 각은 선분 길이와 한 끝점에서 평면까지의 수선 거리로 구할 수 있어요."]};</script>
