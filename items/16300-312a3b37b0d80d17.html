  <script>window.HandStudyRecord={"itemId":16300,"sourceLabel":"2019 교육청 고3 수리가형 5월 18번","adminYear":2019,"grade":3,"month":5,"number":18,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 두 점 $A\\,,\\,B\\,$를 지름의 양 끝점으로 하고, 지름의 길이가 1인 반원과 호 $AB\\,$ 위를 움직이는 점 $P\\,$가 있다. 점 $P\\,$에서 선분 $AB\\,$에 내린 수선의 발을 $Q\\,$, 점 $Q\\,$에서 선분 $AP\\,$에 내린 수선의 발을 $R\\,$, 선분 $PQ\\,$와 선분 $RB\\,$의 교점을 $S\\,$라 하자. $\\angle PAB= \\theta \\,$라 할 때, 삼각형 $QSR\\,$의 넓이를 $f( \\theta )\\,$라 하자. $\\lim _{\\theta -> 0+} {} \\frac{f( \\theta )}{\\theta ^{3}} \\,$의 값은? (단, $0\u003c \\theta \u003c \\frac{\\pi }{2} \\,$) [4점]\n① $\\frac{1}{8}$ ② $\\frac{1}{4}$ ③ $\\frac{1}{2}$ ④ 1 ⑤ 2","answer":"②","sourceHash":"34b8c277ca25592a71efd409ea0832596efb448292ff761e88dbfc2a536b618e","steps":[{"id":"s1","latex":"PB=\\sin\\theta,\\quad AP=\\cos\\theta,\\quad PQ=\\sin\\theta\\cos\\theta"},{"id":"s2","latex":"QR=\\sin\\theta\\cos^2\\theta,\\quad PR=\\sin^2\\theta\\cos\\theta"},{"id":"s3","latex":"Q=(\\cos^2\\theta,0),\\quad R=(\\cos^4\\theta,\\cos^3\\theta\\sin\\theta),\\quad B=(1,0)"},{"id":"s4","latex":"S=RB\\cap\\{x=\\cos^2\\theta\\}\\Rightarrow QS=\\dfrac{\\cos^3\\theta\\sin\\theta}{1+\\cos^2\\theta}"},{"id":"s5","latex":"d(R,PQ)=\\cos^2\\theta-\\cos^4\\theta=\\cos^2\\theta\\sin^2\\theta"},{"id":"s6","latex":"f(\\theta)=\\dfrac{\\sin^3\\theta\\cos^5\\theta}{2(1+\\cos^2\\theta)}"},{"id":"s7","latex":"\\lim_{\\theta\\to0+}\\dfrac{f(\\theta)}{\\theta^3}=\\dfrac14"}],"diagram":null,"contentHash":"a81eb4cd0ad82634651aa9262cc74d8b946979bae050949a8e9666807a0ed29f","questionHtml":"\u003cp class=\"hp htall\">그림과 같이 두 점 \u003cspan class=\"heq\">\\(A\\,,\\,B\\,\\)\u003c/span>를 지름의 양 끝점으로 하고, 지름의 길이가 1인 반원과 호 \u003cspan class=\"heq\">\\(AB\\,\\)\u003c/span> 위를 움직이는 점 \u003cspan class=\"heq\">\\(P\\,\\)\u003c/span>가 있다. 점 \u003cspan class=\"heq\">\\(P\\,\\)\u003c/span>에서 선분 \u003cspan class=\"heq\">\\(AB\\,\\)\u003c/span>에 내린 수선의 발을 \u003cspan class=\"heq\">\\(Q\\,\\)\u003c/span>, 점 \u003cspan class=\"heq\">\\(Q\\,\\)\u003c/span>에서 선분 \u003cspan class=\"heq\">\\(AP\\,\\)\u003c/span>에 내린 수선의 발을 \u003cspan class=\"heq\">\\(R\\,\\)\u003c/span>, 선분 \u003cspan class=\"heq\">\\(PQ\\,\\)\u003c/span>와 선분 \u003cspan class=\"heq\">\\(RB\\,\\)\u003c/span>의 교점을 \u003cspan class=\"heq\">\\(S\\,\\)\u003c/span>라 하자. \u003cspan class=\"heq\">\\(\\angle PAB= \\theta \\,\\)\u003c/span>라 할 때, 삼각형 \u003cspan class=\"heq\">\\(QSR\\,\\)\u003c/span>의 넓이를 \u003cspan class=\"heq\">\\(f( \\theta )\\,\\)\u003c/span>라 하자.\u003cbr>\u003cspan class=\"heq\">\\(\\lim\\limits_{\\theta \\to  0+} {} \\dfrac{f( \\theta )}{\\theta^{3}} \\,\\)\u003c/span>의 값은? (단, \u003cspan class=\"heq\">\\(0\\lt  \\theta \\lt  \\dfrac{\\pi }{2} \\,\\)\u003c/span>) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig hfigr\" src=\"../assets/figures/d811ace6b04f0568147c7527.png\" style=\"float:right;margin:4px 0 8px 12px;width:342px;max-width:45%\">\u003c/p>\u003cp class=\"hp htall\">① \u003cspan class=\"heq\">\\(\\dfrac{1}{8}\\)\u003c/span>&emsp;② \u003cspan class=\"heq\">\\(\\dfrac{1}{4}\\)\u003c/span>&emsp;③ \u003cspan class=\"heq\">\\(\\dfrac{1}{2}\\)\u003c/span>&emsp;④ 1&emsp;⑤ 2\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"312a3b37b0d80d17da650229698b95b6a9460b02184fc7ef3acbd95afa1409ec"};</script>
