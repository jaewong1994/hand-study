  <script>window.HandStudyRecord={"itemId":17407,"sourceLabel":"2022 교육청 고3 수학확통 10월 30번","adminYear":2022,"grade":3,"month":10,"number":30,"track":"확통","points":4,"scoreStatus":"confirmed_4_direct","questionText":"주머니 ${A}$에 흰 공 $3$개, 검은 공 $1$개가 들어 있고, 주머니 $B$에도 흰 공 $3$개, 검은 공 $1$개가 들어 있다. 한 개의 동전을 사용하여 [실행 $1$]과 [실행 $2$]를 순서대로 하려고 한다.\n[실행 $1$] 한 개의 동전을 던져 앞면이 나오면 주머니 $A$에서 임의로 $2$개의 공을 꺼내어 주머니 $B$에 넣고, 뒷면이 나오면 주머니 $A$에서 임의로 $3$개의 공을 꺼내어 주머니 $B$에 넣는다.[실행 $2$] 주머니 $B$에서 임의로 $5$개의 공을 꺼내어 주머니 $A$에 넣는다.\n[실행 $2$]가 끝난 후 주머니 $B$에 흰 공이 남아 있지 않을 때, [실행 $1$]에서 주머니 $B$에 넣는 공 중 흰 공이 $2$개이었을 확률은 $\\frac{q}{p}$이다. $p+q$의 값을 구하시오. (단, $p$와 $q$는 서로소인 자연수이다.) [4점]","answer":"17","sourceHash":"3834683b38f59e367dce790fef125adde11741b7275c66e68469e4a42aafc876","steps":[{"id":"s1","latex":"E=\\{\\text{실행 2 뒤 }B\\text{에 흰 공이 없음}\\}"},{"id":"s2","latex":"P(H,W_2)=\\frac14,\\quad P(E\\mid H,W_2)=\\frac16"},{"id":"s3","latex":"P(H,W_1)=\\frac14,\\quad P(E\\mid H,W_1)=\\frac26"},{"id":"s4","latex":"P(T,W_3)=\\frac18,\\quad P(E\\mid T,W_3)=0"},{"id":"s5","latex":"P(T,W_2)=\\frac38,\\quad P(E\\mid T,W_2)=\\frac{{}_2C_2}{{}_7C_2}=\\frac1{21}"},{"id":"s6","latex":"P(E)=\\frac1{24}+\\frac1{12}+0+\\frac1{56}=\\frac17"},{"id":"s7","latex":"P(W_2\\cap E)=\\frac1{24}+\\frac1{56}=\\frac5{84}"},{"id":"s8","latex":"P(W_2\\mid E)=\\frac{5/84}{1/7}=\\frac5{12}"},{"id":"s9","latex":"p+q=12+5=\\boxed{17}"}],"diagram":null,"contentHash":"56e40c07a2ba946a32bd3bd4d2b11ab40b1732f22b2a3b24f7769eb0419bbf9a","questionHtml":"\u003cp class=\"hp\">주머니 \u003cspan class=\"heq\">\\({A}\\)\u003c/span>에 흰 공 \u003cspan class=\"heq\">\\(3\\)\u003c/span>개, 검은 공 \u003cspan class=\"heq\">\\(1\\)\u003c/span>개가 들어 있고, 주머니 \u003cspan class=\"heq\">\\(B\\)\u003c/span>에도 흰 공 \u003cspan class=\"heq\">\\(3\\)\u003c/span>개, 검은 공 \u003cspan class=\"heq\">\\(1\\)\u003c/span>개가 들어 있다. 한 개의 동전을 사용하여 [실행 \u003cspan class=\"heq\">\\(1\\)\u003c/span>]과 [실행 \u003cspan class=\"heq\">\\(2\\)\u003c/span>]를 순서대로 하려고 한다.\u003c/p>\u003cdiv class
