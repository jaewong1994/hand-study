<script>window.HandStudyGuide={"itemId":16894,"sourceHash":"a4b81f0a6aa765ec17a5ffcd672ac30f451511030f036c54bab5f1cc758a7f87","contentHash":"cfa1fa863914dfb98598d38e18e08b7c1c8a53e20145c21a51245db966b215d5","overview":{"goal":"적분을 미분해 극대점 조건을 한 변수 함수의 영점으로 바꾸고, 영점이 놓인 정수 구간을 세어요.","firstLook":"적분 안에서 \\(u=x-t\\)로 바꾸면 x에 따른 미분이 쉬워져 \\(g'(x)=\\int_0^xf(u)du\\)가 돼요.","conditions":[{"label":"극대의 순서","meaning":"g′의 부호가 양수에서 음수로 바뀌는 영점을 작은 것부터 세어요."}]},"chapters":[{"id":"c1","label":"g′를 한 변수 식으로 바꿔요","stepIds":["s1","s2","s3"],"question":"\\(u=x-t\\) 치환과 적분 계산 뒤 어떤 함수의 부호를 보면 되나요?","hint":"\\(w=\\sqrt{x}\\)로 두세요.","explanation":"\\(u=x-t\\)로 바꾸면 \\(g(x)=\\int_0^x(x-u)f(u)du\\), 따라서 \\(g'(x)=\\int_0^xf(u)du\\)예요. \\(u=v^2\\)로 다시 바꾸어 적분하면 \\(g'(x)=\\frac2{\\pi^2}\\{\\sin(\\pi w)-\\pi w\\cos(\\pi w)\\}\\), \\(w=\\sqrt x\\)예요. 양의 상수는 부호에 영향이 없으므로 \\(\\varphi(w)=\\sin\\pi w-\\pi w\\cos\\pi w\\)의 영점을 봐요.","check":{"prompt":"x와 w의 순서는 같은가요?","answer":"\\(x\\ge0\\)에서 \\(w=\\sqrt{x}\\)는 증가하므로 영점 순서와 극대 순서를 그대로 보존해요."}},{"id":"c2","label":"정수 사이에서 부호 변화를 찾아요","stepIds":["s4","s5"],"question":"φ의 도함수와 정수에서의 값은 영점 위치를 어떻게 정하나요?","hint":"각 정수 구간에서 sin의 부호를 보세요.","explanation":"\\(\\varphi'(w)=\\pi^2w\\sin\\pi w\\)이므로 각 정수 구간에서 단조 방향이 번갈아 바뀌고, \\(\\varphi(m)=(-1)^{m+1}\\pi m\\)이라 정수점의 부호도 번갈아요. g′가 양수에서 음수로 바뀌는 n번째 영점은 \\(2n-1<w<2n\\)에 하나씩 있어요. 따라서 \\(\\sqrt{a_n}\\in(2n-1,2n)\\)이에요.","check":{"prompt":"극대는 어느 방향의 부호 변화인가요?","answer":"g′가 양수에서 음수로 바뀔 때 g가 증가하다 감소하므로 극대예요."}},{"id":"c3","label":"여섯째 구간에서 k를 읽어요","stepIds":["s6"],"question":"\\(n=6\\)일 때 \\(\\sqrt{a_6}\\)와 \\(a_6\\)는 어느 제곱 사이에 있나요?","hint":"부등식의 양변을 제곱하세요.","explanation":"\\(n=6\\)을 넣으면 \\(11<\\sqrt{a_6}<12\\)이고 모두 양수이므로 \\(11^2<a_6<12^2\\)예요. 따라서 조건의 자연수 \\(k\\)는 11이고 정답은 ①이에요.","check":{"prompt":"제곱할 때 부등호 방향이 유지되는 이유는 무엇인가요?","answer":"세 수가 모두 양수이고 제곱함수가 양수 구간에서 증가하기 때문이에요."}}],"takeaway":["적분으로 정의된 함수는 치환 뒤 미분해 극값 조건을 단순한 영점 문제로 바꿀 수 있어요.","정수점 값과 각 구간의 단조성을 함께 보면 영점의 위치를 셀 수 있어요."]};</script>
