C}} }=6$, $\\angle {{ABC}} =\\frac{ \\pi}{2}\\,$인 직각삼각형 $ABC\\,$와 선분 $AC\\,$를 지름으로 하는 구 $S\\,$가 있다. 직선 $AB\\,$를 포함하고 평면 $ABC\\,$에 수직인 평면이 구 $S\\,$와 만나서 생기는 원을 $O\\,$라 하자. 원 $O\\,$ 위의 점 중에서 직선 $AC\\,$까지의 거리가 $4\\,$인 서로 다른 두 점을 ${{P}}$, ${{Q}} \\,$라 할 때, 선분 $PQ\\,$의 길이는? [4점]\n① $\\sqrt{43}$ ② $\\sqrt{47}$ ③ $\\sqrt{51}$\n④ $\\sqrt{55}$ ⑤ $\\sqrt{59}$","sourceHash":"1a23cadd1ba953ca5b92ff00a4df10d5d00f678372c27f62e8d0c1c54180e602","sourceKind":"csat","sourceLabel":"2024년 시행 수능 · 2025학년도 · 기하 · 28번","steps":[{"id":"s1","latex":"\\overline{\\mathrm{AC}}=10,\\quad\\text{구의 반지름}=5"},{"id":"s2","latex":"\\mathrm B=(-4,0,0),\\ \\mathrm A=(4,0,0),\\ \\mathrm C=(-4,6,0)"},{"id":"s3","latex":"\\text{구의 중심 }(0,3,0),\\quad O:\\ x^2+z^2=16,\\ y=0"},{"id":"s4","latex":"\\mathrm P=(x,0,z),\\quad d(\\mathrm P,\\mathrm{AC})^2=z^2+\\frac9{25}(4-x)^2=16"},{"id":"s5","latex":"z^2=16-x^2\\quad\\Rightarrow\\quad(2x-3)(x+6)=0"},{"id":"s6","latex":"-4\\le x\\le4\\quad\\Rightarrow\\quad x=\\frac32,\\quad z=\\pm\\frac{\\sqrt{55}}2"},{"id":"s7","latex":"\\overline{\\mathrm{PQ}}=\\sqrt{55}\\quad\\therefore\\text{④}"}],"track":"기하"};</script>
