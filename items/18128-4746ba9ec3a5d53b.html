<script>window.HandStudyRecord={"adminYear":2025,"answer":"63","contentHash":"b36e0ee7443d3328c655c745935138e18408d0287bf00681d9eb45b786cc58b8","diagram":null,"editionHash":"4746ba9ec3a5d53b1e165114803971481e7780e806a0ee5052262b676a6e7759","grade":3,"graphHash":"","graphPlan":null,"itemId":18128,"learningHash":"0bd7f8c9a62368271dc2fe3981d09ef56b3752a69cf677244ba316cda1e89ec8","month":10,"number":22,"points":4,"preview":false,"questionHtml":"\u003cp class=\"hp\">실수 \u003cspan class=\"heq\">\\(k\\,\\)\u003c/span>에 대하여 다음 조건을 만족시키는 수열 \u003cspan class=\"heq\">\\(\\left\\{a_{n} \\right\\}\\,\\)\u003c/span>이 있다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(a_{1}=3\\,\\)\u003c/span>이고, 모든 자연수 \u003cspan class=\"heq\">\\(n\\,\\)\u003c/span>에 대하여\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\(a_{n+1}= \\begin{cases}\\, \\left|\\, a_{n}+n\\,\\right| & & \\left(a_{n} \\lt  0 \\right) \\\\ \\, a_{n}-10+k & & \\left(a_{n} \\geq 0 \\right)\\end{cases}\\,\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">이다.\u003c/p>\u003c/div>\u003cp class=\"hp htall\">\u003cspan class=\"heq\">\\(a_{4} \\times a_{5}=0\\,\\)\u003c/span>이 되도록 하는 \u003cspan class=\"heq\">\\(k\\,\\)\u003c/span>의 최댓값을 \u003cspan class=\"heq\">\\(M\\,\\)\u003c/span>, 최솟값을 \u003cspan class=\"heq\">\\(m\\,\\)\u003c/span>이라 할 때, \u003cspan class=\"heq\">\\(M\\,+m=\\dfrac{q}{p}\\,\\)\u003c/span>이다. \u003cspan class=\"heq\">\\(p+q\\,\\)\u003c/span>의 값을 구하시오. \u003cbr>(단, \u003cspan class=\"heq\">\\(p\\,\\)\u003c/span>와 \u003cspan class=\"heq\">\\(q\\,\\)\u003c/span>는 서로소인 자연수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","questionText":"실수 $k\\,$에 대하여 다음 조건을 만족시키는 수열 $\\left\\{a_{n} \\right\\}\\,$이 있다.\n$a_{1}=3\\,$이고, 모든 자연수 $n\\,$에 대하여 $a_{n+1}= \\begin{cases}\\, \\left|\\, a_{n}+n\\,\\right| & & \\left(a_{n} \u003c 0 \\right) \\\\ \\, a_{n}-10+k & & \\left(a_{n} \\geq 0 \\right)\\end{cases}\\,$ 이다.\n$a_{4} \\times a_{5}=0\\,$이 되도록 하는 $k\\,$의 최댓값을 $M\\,$, 최솟값을 $m\\,$이라 할 때, $M\\,+m=\\frac{q}{p}\\,$이다. $p+q\\,$의 값을 구하시오. (단, $p\\,$와 $q\\,$는 서로소인 자연수이다.) [4점]\n 사각형입니다. 2025년 10월 고3 모의고사 문제지제 2 교시 수학 영역(기하) \n5 지선다형","scoreStatus":"confirmed_4_direct","sourceHash":"c57959c355b80f7dc0231fa92c222fd5fa66fd95e6b34363323e048abd187d1e","sourceLabel":"2025 교육청 고3 수학기하 10월 22번","stepExplanations":{"s1":{"body":"다음 항을 구할 때는 지금 항이 음수인지 먼저 봐요. \\(a_1=3\\ge0\\)이므로 \\(a_2=3-10+k=k-7\\)입니다. 따라서 먼저 \\(k\u003c7\\)과 \\(k\\ge7\\)로 나눠요. \\(a_4a_5=0\\)은 두 항 중 적어도 하나가 0이라는 뜻이므로, 각 경우에서 두 항을 모두 확인해야 해요.","skillTags":["sequence.sign-cases","equation.zero-product"],"title":"경우를 나누는 기준부터 만들어요"},"s2":{"body":"\\(k\u003c7\\)이면 \\(a_2\u003c0\\)이므로 \\(a_3=|a_2+2|=|k-5|\\)예요. 여기서 다시 \\(k=5\\)를 기준으로 나눕니다. \\(k\u003c5\\)에서는 \\(a_3=5-k>0\\), 따라서 \\(a_4=(5-k)-10+k=-5\\)이고 \\(a_5=|-5+4|=1\\)이에요. 두 항 모두 0이 아니므로 이 범위에는 해가 없어요.","skillTags":["sequence.sign-cases","function.absolute-value"],"title":"절댓값 안의 부호 때문에 한 번 더 나눠요"},"s3":{"body":"\\(5\\le k\u003c7\\)에서는 \\(a_3=k-5\\ge0\\)이므로 \\(a_4=2k-15\u003c0\\)예요. 그래서 \\(a_5=|a_4+4|=|2k-11|\\)입니다. \\(a_4\\)는 0이 될 수 없으니 \\(a_5=0\\)에서 \\(k=\\frac{11}{2}\\)를 얻어요. 이 값은 실제로 \\(5\\le k\u003c7\\)을 만족해요. 경계 \\(k=5\\)에서도 \\(a_3=0\\)은 ‘0 이상’인 쪽 식에 넣습니다.","skillTags":["sequence.sign-cases","equation.domain-check"],"title":"계산한 값이 처음 나눈 범위에 들어가는지 봐요"},"s4":{"body":"\\(k\\ge7\\)이면 \\(a_2\\ge0\\)이므로 \\(a_3=2k-17\\)이에요. 이 값이 음수인 \\(7\\le k\u003c\\frac{17}{2}\\)에서는 \\(a_4=|2k-14|=2k-14\\ge0\\), \\(a_5=3k-24\\)가 됩니다. \\(a_4=0\\)에서 \\(k=7\\), \\(a_5=0\\)에서 \\(k=8\\)을 얻고, 둘 다 이번 범위에 들어가요. \\(k=7\\)일 때 \\(a_4=0\\)이라고 계산을 멈추지 말고 다음 항에도 ‘0 이상’인 식을 적용해 보세요.","skillTags":["sequence.boundary","equation.zero-product"],"title":"항이 0인 경계도 규칙대로 계산해요"},"s5":{"body":"\\(k\\ge\\frac{17}{2}\\)이면 \\(a_3\\ge0\\)이므로 \\(a_4=3k-27\\)이에요. 먼저 \\(\\frac{17}{2}\\le k\u003c9\\)에서는 \\(a_4\u003c0\\), \\(a_5=|3k-23|\\)입니다. \\(a_5=0\\)의 후보 \\(k=\\frac{23}{3}\\)은 이번 범위 밖이고 \\(a_4\\)도 0이 아니므로 해가 없어요.","skillTags":["sequence.sign-cases","equation.domain-check"],"title":"해가 없다는 결론도 범위를 대조해서 얻어요"},"s6":{"body":"\\(k\\ge9\\)에서는 \\(a_4=3k-27\\ge0\\)이므로 \\(a_5=4k-37\\)이에요. 두 항을 각각 0으로 놓으면 \\(k=9\\), \\(k=\\frac{37}{4}\\)이고 모두 이 범위에 들어갑니다. 앞에서 찾은 값과 합치면 가장 작은 값은 \\(\\frac{11}{2}\\), 가장 큰 값은 \\(\\frac{37}{4}\\)예요. 숫자가 바뀌어도 ‘지금 항의 부호 → 다음 항의 식 → 후보가 해당 범위에 속하는지’ 순서로 따라가면 됩니다.","skillTags":["sequence.sign-cases","equation.domain-check"],"title":"남은 범위와 양 끝의 값을 확인해요"}},"steps":[{"id":"s1","latex":"a_2=k-7"},{"id":"s2","latex":"k\u003c5:\\quad a_3=5-k,\\ a_4=-5,\\ a_5=1"},{"id":"s3","latex":"5\\le k\u003c7:\\quad a_3=k-5,\\ a_4=2k-15\u003c0,\\ a_5=|2k-11|\\Rightarrow k=\\frac{11}{2}"},{"id":"s4","latex":"7\\le k\u003c\\frac{17}{2}:\\quad a_3=2k-17\u003c0,\\ a_4=2k-14,\\ a_5=3k-24\\Rightarrow k\\in\\{7,8\\}"},{"id":"s5","latex":"\\frac{17}{2}\\le k\u003c9:\\quad a_4=3k-27\u003c0,\\ a_5=|3k-23|\\Rightarrow\\text{해 없음}"},{"id":"s6","latex":"k\\ge9:\\quad a_4=3k-27,\\ a_5=4k-37\\Rightarrow k\\in\\left\\{9,\\frac{37}{4}\\right\\}"},{"id":"s7","latex":"k\\in\\left\\{\\frac{11}{2},7,8,9,\\frac{37}{4}\\right\\}"},{"id":"s8","latex":"M+m=\\frac{37}{4}+\\frac{11}{2}=\\frac{59}{4}\\Rightarrow p+q=63"}],"track":"기하"};</script>
<script>window.HandStudyGuide={"itemId":18128,"sourceHash":"c57959c355b80f7dc0231fa92c222fd5fa66fd95e6b34363323e048abd187d1e","contentHash":"b36e0ee7443d3328c655c745935138e18408d0287bf00681d9eb45b786cc58b8","overview":{"goal":"점화식에서 항의 부호가 바뀌는 경계를 빠짐없이 나누어 \\(a_4a_5=0\\)을 만드는 모든 \\(k\\)를 찾고 양 끝값을 더해요.","firstLook":"\\(a_1=3\\ge0\\)이므로 첫 단계는 바로 계산할 수 있어요. 그다음부터는 앞 항이 음수인지 0 이상인지에 따라 식이 달라지므로, 새 항의 부호가 바뀌는 \\(k\\)를 경계로 구간을 나눕니다.","conditions":[{"label":"점화식 경계","meaning":"앞 항이 0일 때는 \\(a_n\\ge0\\)인 두 번째 식을 사용해요."},{"label":"곱이 0","meaning":"\\(a_4=0\\) 또는 \\(a_5=0\\)인 경우를 모두 찾아야 해요."},{"label":"실수 k","meaning":"정수만 찾는 문제가 아니므로 분수 후보도 범위 안이면 포함합니다."}]},"chapters":[{"id":"c1","label":"첫 항에서 기준 만들기","stepIds":["s1"],"question":"첫 계산으로 어떤 경계가 바로 보이나요?","hint":"\\(a_1=3\\)은 0 이상이므로 두 번째 점화식을 쓰세요.","explanation":"\\(a_2=3-10+k=k-7\\)이에요. 따라서 다음 계산은 \\(k<7\\)과 \\(k\\ge7\\)로 갈립니다. 이후에도 새로 나온 항이 0이 되는 \\(k\\)를 기준으로 다시 나누면 돼요.","check":{"prompt":"\\(k=7\\)일 때 \\(a_2\\)에는 어느 식을 적용했나요?","answer":"\\(a_1=3\\ge0\\)이므로 두 번째 식을 적용했고, \\(a_2=0\\)입니다."}},{"id":"c2","label":"k가 7보다 작은 구간 조사하기","stepIds":["s2","s3"],"question":"\\(k<7\\) 안에서 왜 다시 \\(k=5\\)로 나눌까요?","hint":"\\(a_3=|k-5|\\)의 절댓값을 풀어야 해요.","explanation":"\\(k<7\\)이면 \\(a_2<0\\)이라 \\(a_3=|k-5|\\)입니다. \\(k<5\\)에서는 \\(a_3=5-k\\), 이어 \\(a_4=-5,a_5=1\\)이라 해가 없어요. \\(5\\le k<7\\)에서는 \\(a_3=k-5\\ge0\\), \\(a_4=2k-15<0\\), \\(a_5=|2k-11|\\)이므로 \\(a_5=0\\)에서 \\(k=11/2\\)를 얻습니다.","check":{"prompt":"\\(k=5\\)에서 \\(a_3=0\\)이면 다음 항을 계산할 때 어느 식을 쓰나요?","answer":"0은 0 이상이므로 두 번째 식을 씁니다."}},{"id":"c3","label":"k가 7 이상인 구간 조사하기","stepIds":["s4","s5","s6"],"question":"\\(k\\ge7\\)에서는 어떤 값들이 새 경계를 만드나요?","hint":"\\(a_3=2k-17\\)과 \\(a_4=3k-27\\)이 0이 되는 값을 차례로 보세요.","explanation":"\\(7\\le k<17/2\\)에서는 \\(a_3<0\\)이고 \\(a_4=2k-14\\ge0\\), \\(a_5=3k-24\\)라 \\(k=7,8\\)을 얻어요. \\(17/2\\le k<9\\)에서는 \\(a_4=3k-27<0\\), \\(a_5=|3k-23|\\)인데 후보 \\(23/3\\)이 이 구간 밖이라 해가 없습니다. \\(k\\ge9\\)에서는 \\(a_4=3k-27\\), \\(a_5=4k-37\\)이므로 \\(k=9,37/4\\)가 나와요.","check":{"prompt":"\\(17/2\\le k<9\\)에서 \\(a_5=0\\)의 형식적 후보가 탈락하는 이유는 무엇인가요?","answer":"\\(k=23/3\\)은 \\(17/2\\le k\\)를 만족하지 않아 그 식을 얻은 구간에 속하지 않습니다."}},{"id":"c4","label":"후보를 모아 양 끝값 계산하기","stepIds":["s7","s8"],"question":"각 구간에서 얻은 후보를 어떻게 최종 답으로 연결할까요?","hint":"모든 후보가 실제 구간 조건을 만족하는지 확인한 뒤 가장 작은 값과 가장 큰 값을 고르세요.","explanation":"가능한 값은 \\(11/2,7,8,9,37/4\\)예요. 가장 작은 값은 \\(m=11/2\\), 가장 큰 값은 \\(M=37/4\\)이므로 \\(M+m=59/4\\)입니다. 따라서 \\(p=4,q=59\\)예요.","check":{"prompt":"\\(p+q\\)는 얼마인가요?","answer":"\\(4+59=63\\)입니다."}}],"takeaway":["점화식이 앞 항의 부호에 따라 달라지면 새 항이 0이 되는 매개변수 값을 경계로 구간을 나눠요.","경계에서 0이 어느 조건에 포함되는지 원문 부등호를 그대로 확인해요.","방정식으로 얻은 후보는 반드시 그 식을 만든 구간에 속하는지 되돌아봐요."]};</script>
