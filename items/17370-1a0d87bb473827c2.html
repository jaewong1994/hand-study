<script>window.HandStudyGuide={"itemId":17370,"sourceHash":"00ec02e77f6ea2c27a91910ae6d81e9c17f6a32b9928671dd179bbc4ca4cc08c","contentHash":"17bf50d7b0a106c06b4971e29914dad323649670b1362d9a7a2c6281caa4b68b","overview":{"goal":"두 영역을 부채꼴과 삼각형의 차로 나타내고 작은 각에서 넓이의 일차항 비를 구해요.","firstLook":"반원의 반지름은 1이에요. 교점의 정확한 좌표 대신 삼각형의 각과 사인법칙으로 \\(OS,OT\\)를 구하면 넓이를 바로 만들 수 있어요.","conditions":[{"label":"수평인 현과 반원의 대칭","meaning":"\\(R\\)의 중심각을 구해 \\(BR\\)이 만드는 각들을 정해요."},{"label":"작은 양의 각","meaning":"사인 기본극한을 이용해 두 넓이에서 \\(\\theta\\)의 계수만 비교해요."}]},"chapters":[{"id":"c1","label":"각과 두 길이 구하기","stepIds":["s1","s2"],"question":"수평선으로 연결된 \\(Q,R\\)의 대칭에서 \\(\\angle AOR\\)와 \\(\\angle RBO\\)는 각각 얼마인가요?","hint":"\\(Q\\)의 중심각이 \\(2\\theta\\)이고 \\(R\\)은 세로축에 대해 대칭인 점이에요.","explanation":"\\(OB\\) 방향을 0으로 보면 \\(Q\\)의 방향각은 \\(2\\theta\\), 수평선 반대편의 \\(R\\)은 \\(\\pi-2\\theta\\)예요. 그래서 \\(OA\\)와 \\(OR\\) 사이의 각은 \\(2\\theta\\)예요. 또 원주각 \\(\\angle RBO\\)가 보는 호 \\(RA\\)의 중심각이 \\(2\\theta\\)이므로 \\(\\angle RBO=\\theta\\)예요.\n\n삼각형 \\(OBS\\)에서 \\(\\angle BOS=\\theta\\), \\(\\angle OBS=\\theta\\)이고 \\(OB=1\\)이므로 사인법칙에서 \\(OS=\\sin\\theta/\\sin2\\theta\\)예요. 삼각형 \\(OBT\\)에서는 \\(\\angle BOT=2\\theta\\), \\(\\angle OBT=\\theta\\), 나머지 각이 \\(\\pi-3\\theta\\)이므로 \\(OT=\\sin\\theta/\\sin3\\theta\\)예요.","check":{"prompt":"\\(OT\\)의 분모에 \\(\\sin3\\theta\\)가 나오는 이유는 무엇인가요?","answer":"변 \\(OB=1\\)의 맞은편 각이 \\(\\pi-3\\theta\\)이고 \\(\\sin(\\pi-3\\theta)=\\sin3\\theta\\)이기 때문이에요."}},{"id":"c2","label":"두 영역의 넓이 식 세우기","stepIds":["s3","s4"],"question":"\\(f\\)와 \\(g\\)는 각각 어떤 부채꼴과 삼각형의 합 또는 차인가요?","hint":"\\(f\\)는 부채꼴 \\(AOR\\)에 삼각형 \\(OTR\\)을 더하고, \\(g\\)는 부채꼴 \\(POQ\\)에서 삼각형 \\(OST\\)를 빼요.","explanation":"반지름이 1이고 중심각이 \\(2\\theta\\)인 부채꼴 \\(AOR\\)의 넓이는 \\(\\theta\\)예요. 삼각형 \\(OTR\\)에서 \\(OR=1\\), 두 변 사이 각의 사인은 \\(\\sin4\\theta\\)이므로 넓이는 \\(\\frac12OT\\sin4\\theta=\\frac{\\sin\\theta\\sin4\\theta}{2\\sin3\\theta}\\)예요. 따라서 \\(f(\\theta)=\\theta+\\frac{\\sin\\theta\\sin4\\theta}{2\\sin3\\theta}\\)예요.\n\n부채꼴 \\(POQ\\)의 중심각은 \\(\\theta\\)라 넓이는 \\(\\theta/2\\)예요. 그 안에서 빠지는 삼각형 \\(OST\\)의 넓이는 \\(\\frac12OS\\cdot OT\\sin\\theta=\\frac{\\sin^3\\theta}{2\\sin2\\theta\\sin3\\theta}\\)예요. 따라서 \\(g(\\theta)=\\frac\\theta2-\\frac{\\sin^3\\theta}{2\\sin2\\theta\\sin3\\theta}\\)예요.","check":{"prompt":"삼각형 \\(OST\\)의 두 변 사이 각은 무엇인가요?","answer":"\\(OS\\)는 \\(OP\\) 위, \\(OT\\)는 \\(OQ\\) 위에 있으므로 두 선분 사이 각은 \\(\\theta\\)예요."}},{"id":"c3","label":"작은 각에서 일차항 비교하기","stepIds":["s5","s6","s7","s8"],"question":"\\(f/\\theta\\)와 \\(g/\\theta\\)에서 사인들을 각각 각의 배수로 바꾸면 어떤 수가 남을까요?","hint":"\\(\\sin(c\\theta)/(c\\theta)\\to1\\)을 각 사인에 적용하세요.","explanation":"\\(\\theta\\to0+\\)에서 \\(\\sin\\theta\\)는 \\(\\theta\\), \\(\\sin2\\theta\\)는 \\(2\\theta\\), \\(\\sin3\\theta\\)는 \\(3\\theta\\), \\(\\sin4\\theta\\)는 \\(4\\theta\\)와 같은 비율로 가까워져요. 따라서 \\(\\frac{f(\\theta)}\\theta\\to1+\\frac{4}{2\\cdot3}=5/3\\)이고, \\(\\frac{g(\\theta)}\\theta\\to1/2-\\frac1{2\\cdot2\\cdot3}=5/12\\)예요. 그러므로 \\(a=\\frac{5/12}{5/3}=1/4\\), \\(80a=20\\)이에요.","check":{"prompt":"\\(g/\\theta\\)의 빼는 항이 \\(1/12\\)인 이유는 무엇인가요?","answer":"분자는 \\(\\theta^3\\), 분모는 \\(2\\cdot2\\theta\\cdot3\\theta\\cdot\\theta=12\\theta^3\\)과 같은 비율이기 때문이에요."}}],"takeaway":["원에서 수평 현이 만들면 대칭과 원주각으로 필요한 각을 먼저 정해요.","복잡한 영역은 부채꼴과 삼각형의 합·차로 분해해요.","작은 각의 넓이 비는 각 넓이를 \\(\\theta\\)로 나눈 일차항끼리 비교해요."]};</script>
