  <script>window.HandStudyRecord={"itemId":17109,"sourceLabel":"2021 교육청 고3 수학미적분 7월 29번","adminYear":2021,"grade":3,"month":7,"number":29,"track":"미적분","points":4,"scoreStatus":"confirmed_4_direct","questionText":"함수 $f \\left( x \\right)=x^{3} -x$와 실수 전체의 집합에서 미분가능한 역함수가 존재하는 삼차함수 $g \\left( x \\right)=ax^{3} +x^{2} +bx+1$이 있다. 함수 $g \\left( x \\right)$의 역함수 $g^{-1} \\left( x \\right)$에 대하여 함수 $h \\left( x \\right)$를\n $h \\left( x \\right) = \\begin{cases}\\left( f \\circ g^{-1} \\right) \\left( x \\right) & \\left( x\u003c 0 \\text{ 또는 } x> 1 \\right) \\\\ \\dfrac{1}{\\pi} \\sin \\pi x & \\left( 0 \\leq x \\leq 1 \\right)\\end{cases}$\n이라 하자. 함수 $h \\left( x \\right)$가 실수 전체의 집합에서 미분가능할 때, $g \\left( a+b \\right)$의 값을 구하시오. (단, $a,\\,b$는 상수이다.) [4점]","answer":"15","sourceHash":"e4826a03d5e078115f1659cf6db96707f526ba657a7a3f1c2047eb71ed98e030","steps":[{"id":"s1","latex":"g(0)=1\\Rightarrow g^{-1}(1)=0"},{"id":"s2","latex":"h\\prime(1)=\\cos\\pi=-1=\\frac{f\\prime(0)}{g\\prime(0)}=-\\frac1b\\Rightarrow b=1"},{"id":"s3","latex":"g\\text{는 일대일이고 }g\\prime(0)>0\\Rightarrow g\\text{는 증가함수}"},{"id":"s4","latex":"t=g^{-1}(0)\u003c0,\\quad h\\text{의 }0\\text{에서 연속성}\\Rightarrow f(t)=t(t-1)(t+1)=0\\Rightarrow t=-1"},{"id":"s5","latex":"g(-1)=1-a=0\\Rightarrow a=1,\\quad g\\prime(x)=3(x+1/3)^2+2/3>0"},{"id":"s6","latex":"\\frac{f\\prime(-1)}{g\\prime(-1)}=1=\\cos0\\quad\\text{(미분조건 확인)}"},{"id":"s7","latex":"g(a+b)=g(2)=8+4+2+1=15"}],"diagram":null,"contentHash":"a7410df02b4c93e0e9bf761eb6ab3ff6374340c860acdcd92ffb089784ed9b31","questionHtml":"\u003cp class=\"hp\">함수 \u003cspan class=\"heq\">\\(f \\left( x \\right)\\)\u003c/span>\u003cspan class=\"heq\">\\(=x^{3} -x\\)\u003c/span>와 실수 전체의 집합에서 미분가능한 역함수가 존재하는 삼차함수 \u003cspan class=\"heq\">\\(g \\left( x \\right)\\)\u003c/span>\u003cspan class=\"heq\">\\(=ax^{3} +x^{2} +bx+1\\)\u003c/span>이 있다. 함수 \u003cspan class=\"heq\">\\(g \\left( x \\right)\\)\u003c/span>의 역함수 \u003cspan class=\"heq\">\\(g^{-1} \\left( x \\right)\\)\u003c/span>에 대하여 함수 \u003cspan class=\"heq\">\\(h \\left( x \\right)\\)\u003c/span>를\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\(h(x)=\\begin{cases}(f\\circ g^{-1})(x)&x\\lt0\\text{ 또는 }x\\gt1\\\\\\dfrac1\\pi\\sin\\pi x&0\\le x\\le1\\end{cases}\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">이라 하자. 함수 \u003cspan class=\"heq\">\\(h \\left( x \\right)\\)\u003c/span>가 실수 전체의 집합에서 미분가능할 때, \u003cspan class=\"heq\">\\(g \\left( a+b \\right)\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(a,\\,b\\)\u003c/span>는 상수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"7a219fc85bcb9ff78ad4582d9d59f74765513d684e543e36e4f53fea90b01e59"};</script>
