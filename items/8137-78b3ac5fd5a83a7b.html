<script>window.HandStudyRecord={"itemId":8137,"sourceLabel":"2022 교육청 고2 수학 11월 30번","adminYear":2022,"grade":2,"month":11,"number":30,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"양의 실수 $a$에 대하여 함수 $f \\left( x \\right)$를\n $f \\left( x \\right) = {\\begin{cases}2 ^{x} +2 ^{-a} -2&\\, \\left( x\u003ca \\right) \\\\ 2 ^{-x} +2 ^{a} -2&\\, \\left( x{\\geq}a \\right)\\end{cases}}$\n라 할 때, 함수 $f \\left( x \\right)$가 다음 조건을 만족시키도록 하는 $a$의 최댓값을 $M$, 최솟값을 $m$이라 하자.\n함수 $y= \\left| \\,f \\left( x \\right) \\, \\right|$의 그래프와 직선 $y=k$가 서로 다른 두 점에서 만나도록 하는 양수 $k$는 오직 하나뿐이다.\n$2 ^{M+m} =p+ \\sqrt{q}$일 때, $p+q$의 값을 구하시오. (단, $p$와 $q$는 자연수이다.) [4점]","answer":"4","sourceHash":"d5c0ea286cf35c69dd7e2c67f17c537959f839476d245a2aa246a376c43a60ad","steps":[{"id":"s1","latex":"f\\text{는 }x=a\\text{에서 최댓값 }H=2^a+2^{-a}-2"},{"id":"s2","latex":"\\lim_{x\\to-\\infty}f=2^{-a}-2,\\quad\\lim_{x\\to\\infty}f=2^a-2"},{"id":"s3","latex":"a>1:\\ \\text{두 교점을 만드는 }k\\text{가 여러 개}\\quad\\text{(불가)}"},{"id":"s4","latex":"a=1:\\ \\text{유일한 }k=\\frac12\\Rightarrow M=1"},{"id":"s5","latex":"0\u003ca\u003c1:\\ \\text{유일성}\\iff H\\ge2-2^a"},{"id":"s6","latex":"t=2^a:\\quad2t^2-4t+1\\ge0,\\quad1\u003ct\u003c2"},{"id":"s7","latex":"t\\ge1+\\frac{\\sqrt2}{2}\\Rightarrow m=\\log_2\\left(1+\\frac{\\sqrt2}{2}\\right)"},{"id":"s8","latex":"2^{M+m}=2\\left(1+\\frac{\\sqrt2}{2}\\right)=2+\\sqrt2"},{"id":"s9","latex":"p+q=2+2=4"}],"diagram":null,"contentHash":"5d29de60cd7f1e0a887af3e2463fd6f5bc06086b34eac218b56c700d9a823a7c","questionHtml":"\u003cp class=\"hp\">양의 실수 \u003cspan class=\"heq\">\\(a\\)\u003c/span>에 대하여 함수 \u003cspan class=\"heq\">\\(f \\left( x \\right)\\)\u003c/span>를\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\(f \\left( x \\right) = {\\begin{cases}2^{x} +2^{-a} -2&\\, \\left( x\\lt a \\right) \\\\ 2^{-x} +2^{a} -2&\\, \\left( x{\\geq}a \\right)\\end{cases}}\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">라 할 때, 함수 \u003cspan class=\"heq\">\\(f \\left( x \\right)\\)\u003c/span>가 다음 조건을 만족시키도록 하는 \u003cspan class=\"heq\">\\(a\\)\u003c/span>의 최댓값을 \u003cspan class=\"heq\">\\(M\\)\u003c/span>, 최솟값을 \u003cspan class=\"heq\">\\(m\\)\u003c/span>이라 하자.\u003c/p>\u003cp class=\"hp\">\u003cdiv class=\"hbox\">\u003cp class=\"hp\">함수 \u003cspan class=\"heq\">\\(y= \\left| \\,f \\left( x \\right) \\, \\right|\\)\u003c/span>의 그래프와 직선 \u003cspan class=\"heq\">\\(y=k\\)\u003c/span>가 서로 다른 두 점에서 만나도록 하는 양수 \u003cspan class=\"heq\">\\(k\\)\u003c/span>는 오직 하나뿐이다.\u003c/p>\u003c/div>\u003c/p>\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(2^{M+m} =p+ \\sqrt{q}\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(p+q\\)\u003c/span>의 값을 구하시오. \u003cbr>(단, \u003cspan class=\"heq\">\\(p\\)\u003c/span>와 \u003cspan class=\"heq\">\\(q\\)\u003c/span>는 자연수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"78b3ac5fd5a83a7b5abf0b6150a5b50798f69facea69d73e9e190d8e894cc8f7"};</script>
<script>window.HandStudyGuide={"itemId":8137,"sourceHash":"d5c0ea286cf35c69dd7e2c67f17c537959f839476d245a2aa246a376c43a60ad","contentHash":"5d29de60cd7f1e0a887af3e2463fd6f5bc06086b34eac218b56c700d9a823a7c","overview":{"goal":"두 단조 조각의 꼭대기와 양끝에서 가까워지는 높이를 비교해 \\(|f(x)|=k\\)의 근이 정확히 두 개인 높이가 하나뿐인 \\(a\\)의 범위를 정해요.","firstLook":"왼쪽 조각은 증가하고 오른쪽 조각은 감소하며 \\(x=a\\)에서 같은 높이 \\(H\\)를 가져요. 절댓값을 취하면 각 조각이 0을 지나는지에 따라 교점 수가 달라져요.","conditions":[{"label":"유일한 높이","meaning":"양수 \\(k\\) 중 방정식 \\(|f(x)|=k\\)의 서로 다른 근이 두 개인 값이 정확히 하나예요."},{"label":"양의 매개변수","meaning":"\\(t=2^a\\)로 두면 \\(a\\)의 구간 \\(0<a<1\\)은 \\(1<t<2\\)가 돼요."}]},"chapters":[{"id":"c1","label":"꼭대기와 두 꼬리 높이를 비교해요","stepIds":["s1","s2","s3","s4"],"question":"\\(a=1\\)에서 두 교점을 만드는 유일한 높이가 왜 \\(1/2\\)일까요?","hint":"꼭대기 높이 \\(H\\)와 오른쪽 꼬리가 가까워지는 값을 계산해요.","explanation":"두 조각은 \\(x=a\\)에서 \\(H=2^a+2^{-a}-2\\)로 만나고, 왼쪽에서는 증가하며 오른쪽에서는 감소해요. 왼쪽 끝으로 가면 \\(2^{-a}-2<0\\), 오른쪽 끝으로 가면 \\(2^a-2\\)에 가까워져요. \\(a>1\\)이면 오른쪽 꼬리도 양수라 여러 높이 구간에서 두 교점이 생겨 조건에 맞지 않아요. \\(a=1\\)이면 \\(H=1/2\\), 오른쪽 꼬리는 0에 가까워지고, 높이 \\(k=1/2\\)에서 왼쪽 음수 쪽 한 점과 꼭대기 한 점만 생겨 정확히 두 점이에요. 다른 양수 높이에서는 교점 수가 2가 아니므로 허용되는 가장 큰 \\(a\\)는 \\(M=1\\)이에요.","check":{"prompt":"\\(a=1\\)에서 왼쪽 꼬리의 절댓값은 어느 값에 가까워지나요?","answer":"왼쪽 \\(f\\)는 \\(2^{-1}-2=-3/2\\)에 가까워지므로 절댓값은 \\(3/2\\)에 가까워져요."}},{"id":"c2","label":"영보다 작은 오른쪽 꼬리와 꼭대기를 비교해요","stepIds":["s5"],"question":"\\(0<a<1\\)에서 유일성을 가르는 두 높이는 무엇인가요?","hint":"꼭대기 \\(H\\)와 오른쪽 꼬리의 절댓값 \\(2-2^a\\)를 비교해요.","explanation":"\\(0<a<1\\)이면 오른쪽 꼬리값 \\(2^a-2\\)도 음수라 두 조각 모두 0을 한 번씩 지나요. 오른쪽 꼬리 절댓값을 \\(C=2-2^a\\)라 해요. \\(H<C\\)이면 \\(H<k<C\\)의 여러 높이에서 양쪽 음수 부분이 각각 한 점씩 만나 두 교점이 계속 생겨 유일하지 않아요. \\(H\\ge C\\)이면 두 교점이 생기는 높이는 경계 \\(k=H\\) 하나뿐이에요. 등호인 경우에도 \\(k=H=C\\)에서 두 점이고 그 양옆에서는 교점 수가 달라져 유일성이 유지돼요.","check":{"prompt":"\\(H<C\\)일 때 조건이 실패하는 핵심은 무엇인가요?","answer":"한 값이 아니라 열린 높이 구간 \\(H<k<C\\)의 모든 \\(k\\)가 두 교점을 만들기 때문이에요."}},{"id":"c3","label":"지수 치환으로 허용되는 가장 작은 값을 찾아요","stepIds":["s6","s7"],"question":"\\(H\\ge2-2^a\\)를 \\(t=2^a\\)로 바꾸면 어떤 이차부등식이 되나요?","hint":"\\(2^{-a}=1/t\\)를 넣고 양수 \\(t\\)를 곱해요.","explanation":"\\(t=2^a\\), \\(1<t<2\\)라 두면 \\(t+1/t-2\\ge2-t\\)예요. 양수 \\(t\\)를 곱해 \\(2t^2-4t+1\\ge0\\)을 얻어요. 두 경계는 \\(1\\pm\\sqrt2/2\\)이고 \\(1<t<2\\)에서는 \\(t\\ge1+\\sqrt2/2\\)여야 해요. 따라서 허용되는 가장 작은 \\(a\\)는 \\(m=\\log_2(1+\\sqrt2/2)\\)예요.","check":{"prompt":"작은 경계 \\(1-\\sqrt2/2\\)를 쓰지 않는 이유는 무엇인가요?","answer":"그 값은 1보다 작아서 \\(1<t<2\\)라는 범위 밖이기 때문이에요."}},{"id":"c4","label":"두 끝의 지수값을 곱해요","stepIds":["s8","s9"],"question":"\\(2^{M+m}\\)을 왜 두 지수값의 곱으로 계산할까요?","hint":"\\(2^{M+m}=2^M2^m\\)이에요.","explanation":"\\(M=1\\)이므로 \\(2^M=2\\), 또 \\(m\\)의 정의에서 \\(2^m=1+\\sqrt2/2\\)예요. 따라서 \\(2^{M+m}=2(1+\\sqrt2/2)=2+\\sqrt2\\)예요. \\(p=2,q=2\\)이므로 \\(p+q=4\\)예요.","check":{"prompt":"\\(q=2\\)가 자연수 조건을 만족하나요?","answer":"네. \\(2+\\sqrt2\\)에서 제곱근 안의 수가 자연수 2예요."}}],"takeaway":["단조인 두 조각에 절댓값을 씌운 그래프는 꼭대기 높이와 양끝에서 가까워지는 절댓값을 비교해 교점 수를 셀 수 있어요.","교점이 두 개인 높이가 하나뿐이라는 조건은 한 구간 전체가 생기지 않도록 두 경계 높이의 순서를 맞추는 문제예요.","지수 치환 뒤에는 원래 매개변수 범위를 새 변수의 범위로 함께 옮겨요."]};</script>
