<script>window.HandStudyRecord={"itemId":16300,"sourceLabel":"2019 교육청 고3 수리가형 5월 18번","adminYear":2019,"grade":3,"month":5,"number":18,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 두 점 $A\\,,\\,B\\,$를 지름의 양 끝점으로 하고, 지름의 길이가 1인 반원과 호 $AB\\,$ 위를 움직이는 점 $P\\,$가 있다. 점 $P\\,$에서 선분 $AB\\,$에 내린 수선의 발을 $Q\\,$, 점 $Q\\,$에서 선분 $AP\\,$에 내린 수선의 발을 $R\\,$, 선분 $PQ\\,$와 선분 $RB\\,$의 교점을 $S\\,$라 하자. $\\angle PAB= \\theta \\,$라 할 때, 삼각형 $QSR\\,$의 넓이를 $f( \\theta )\\,$라 하자. $\\lim _{\\theta -> 0+} {} \\frac{f( \\theta )}{\\theta ^{3}} \\,$의 값은? (단, $0\u003c \\theta \u003c \\frac{\\pi }{2} \\,$) [4점]\n① $\\frac{1}{8}$ ② $\\frac{1}{4}$ ③ $\\frac{1}{2}$ ④ 1 ⑤ 2","answer":"②","sourceHash":"34b8c277ca25592a71efd409ea0832596efb448292ff761e88dbfc2a536b618e","steps":[{"id":"s1","latex":"PB=\\sin\\theta,\\quad AP=\\cos\\theta,\\quad PQ=\\sin\\theta\\cos\\theta"},{"id":"s2","latex":"QR=\\sin\\theta\\cos^2\\theta,\\quad PR=\\sin^2\\theta\\cos\\theta"},{"id":"s3","latex":"Q=(\\cos^2\\theta,0),\\quad R=(\\cos^4\\theta,\\cos^3\\theta\\sin\\theta),\\quad B=(1,0)"},{"id":"s4","latex":"S=RB\\cap\\{x=\\cos^2\\theta\\}\\Rightarrow QS=\\dfrac{\\cos^3\\theta\\sin\\theta}{1+\\cos^2\\theta}"},{"id":"s5","latex":"d(R,PQ)=\\cos^2\\theta-\\cos^4\\theta=\\cos^2\\theta\\sin^2\\theta"},{"id":"s6","latex":"f(\\theta)=\\dfrac{\\sin^3\\theta\\cos^5\\theta}{2(1+\\cos^2\\theta)}"},{"id":"s7","latex":"\\lim_{\\theta\\to0+}\\dfrac{f(\\theta)}{\\theta^3}=\\dfrac14"}],"diagram":null,"contentHash":"a81eb4cd0ad82634651aa9262cc74d8b946979bae050949a8e9666807a0ed29f","questionHtml":"\u003cp class=\"hp htall\">그림과 같이 두 점 \u003cspan class=\"heq\">\\(A\\,,\\,B\\,\\)\u003c/span>를 지름의 양 끝점으로 하고, 지름의 길이가 1인 반원과 호 \u003cspan class=\"heq\">\\(AB\\,\\)\u003c/span> 위를 움직이는 점 \u003cspan class=\"heq\">\\(P\\,\\)\u003c/span>가 있다. 점 \u003cspan class=\"heq\">\\(P\\,\\)\u003c/span>에서 선분 \u003cspan class=\"heq\">\\(AB\\,\\)\u003c/span>에 내린 수선의 발을 \u003cspan class=\"heq\">\\(Q\\,\\)\u003c/span>, 점 \u003cspa
