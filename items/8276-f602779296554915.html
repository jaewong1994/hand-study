  <script>window.HandStudyRecord={"itemId":8276,"sourceLabel":"2023 교육청 고2 수학 6월 19번","adminYear":2023,"grade":2,"month":6,"number":19,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 길이가 $4 \\,$인 선분 $A B \\,$를 지름으로 하는 반원이 있다. 선분 $A B \\,$의 중점을 $O\\,$라 하고, 호 $AB$ 위의 점 $C\\,$에 대하여 점 $A\\,$를 지나고 선분 $O C \\,$와 평행한 직선과 호 $AB\\,$의 교점을 $P \\,$, 선분 $O C \\,$와 선분 $B P \\,$의 교점을 $Q \\,$라 하자. \n점 $Q\\,$를 지나고 선분 $PO\\,$와 평행한 직선과 선분 $O B \\,$의 교점을 $D\\,$라 하자. $\\angle CAB= \\theta \\,$라 할 때, 삼각형 $QDB \\,$의 넓이를 $S\\, \\left( \\theta \\right) \\,$, 삼각형 $P Q C\\,$의 넓이를 $T\\, \\left( \\theta \\right)\\,$라 하자. 다음은 $S\\, \\left( \\theta \\right) \\,$와 $T\\, \\left( \\theta \\right) \\,$를 구하는 과정이다. (단, $0\\lt \\theta \\lt \\dfrac{\\pi }{4}$)\n[그림 1]\n$\\angle CAB= \\theta \\,$이므로 $\\angle COB=2 \\theta \\,$이다.\n삼각형 $POB\\,$가 이등변삼각형이고 $\\angle OQB= \\dfrac{\\pi }{2} \\,$이므로\n점 $Q\\,$는 선분 $PB\\,$의 중점이고 $\\angle POQ=2 \\theta \\,$이다.\n선분 $P O\\,$와 선분 $Q D\\,$가 평행하므로\n삼각형 $P O B\\,$와 삼각형 $Q D B\\,$는 닮음이다.\n따라서 ${\\overline{QD}} = {\\boxed{\\vphantom{(}\\, (\\text{가}) \\, } \\,}$이고\n$\\angle Q D B={\\boxed{\\vphantom{(}\\, (\\text{나}) \\, } \\,}$이므로\n$S\\, \\left( \\theta \\right) = \\dfrac{1}{2} \\times {\\boxed{\\vphantom{(}\\, (\\text{가}) \\,}} \\, \\times 1 \\times \\,\\sin \\left( \\, {\\boxed{\\vphantom{(}\\, (\\text{나}) \\,}} \\, \\right) \\,$\n이다. ${\\overline{CQ}} = {\\overline{CO}} - {\\overline{QO}} \\,$이므로\n$T\\, \\left( \\theta \\right) = \\dfrac{1}{2} \\times {\\overline{PQ}} \\times \\, {\\overline{CQ}} =\\sin\\,2 \\theta \\, \\times \\left( \\,2- {\\boxed{\\vphantom{(}\\, (\\text{다}) \\,}} \\, \\right) \\,$\n이다.\n위의 $\\left( \\text{가} \\right)$에 알맞은 수를 $p\\,$라 하고, $\\left( \\text{나} \\right)$, $\\left( \\text{다} \\right)$에 알맞은 식을 각각 $f \\left( \\theta \\right) \\,$, $g \\left( \\theta \\right) \\,$라 할 때, $p{\\times}f \\left( \\dfrac{\\pi }{16} \\right) {\\times}g \\left( \\dfrac{\\pi }{8} \\right) \\,$의 값은? [4점]\n① $\\dfrac{\\sqrt{2}}{4} \\p
