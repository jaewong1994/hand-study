  <script>window.HandStudyRecord={"itemId":16240,"sourceLabel":"2019 교육청 고3 수리가형 3월 18번","adminYear":2019,"grade":3,"month":3,"number":18,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"네 개의 비어 있는 상자 $A$, $B$, $C$, $D\\,$가 있다. 각각의 상자에 최대 $5\\,$개의 공을 넣을 수 있을 때, 네 상자 $A$, $B$, $C$, $D\\,$에 $n\\,$$(1len \\leq 20)\\,$개의 공을 남김없이 나누어 넣는 경우의 수를 $f(n)\\,$이라 하자. 다음은 $f(15)+f(14)+f(13)\\,$의 값을 구하는 과정이다. (단, 공은 구별하지 않고, 공을 하나도 넣지 않은 상자가 있을 수 있다.)\n네 상자 $A$, $B$, $C$, $D$에 $n\\,$개의 공을 남김없이 나누어 넣는 경우의 수는 공이 $5\\,$개씩 모두 $20\\,$개가 들어 있는 네 상자 $A$, $B$, $C$, $D$에서 총 $20-n\\,$개의 공을 꺼내는 경우의 수와 같다.\n(ⅰ) $n=15\\,$인 경우\n공이 $5\\,$개씩 모두 $20\\,$개가 들어 있는 네 상자 $A$, $B$, $C$, $D$에서 총 $5\\,$개의 공을 꺼내는 경우의 수와 같으므로\n $f(15)= {\\boxed{\\vphantom{(}\\,(\\text{가}) \\,}} \\,$\n(ⅱ) $n=14\\,$인 경우\n공이 $5\\,$개씩 모두 $20\\,$개가 들어 있는 네 상자 $A$, $B$, $C$, $D\\,$에서 총 $6\\,$개의 공을 꺼내는 경우의 수와 같으므로\n $f(14)=_{4} H_{6} -\\, {\\boxed{\\vphantom{(}\\,(\\text{나}) \\,}} \\,$\n(ⅲ) $n=13\\,$인 경우\n공이 $5\\,$개씩 모두 $20\\,$개가 들어 있는 네 상자 $A$, $B$, $C$, $D\\,$에서 총 $7\\,$개의 공을 꺼내는 경우의 수와 같으므로 \n $f (13)= \\boxed{\\vphantom{(}\\,(\\text{다})\\,}\\,$\n(ⅰ), (ⅱ), (ⅲ)에 의해\n$f(15)+f(14)+f(13)\\,$$= {\\boxed{\\vphantom{(}\\,(\\text{가}) \\,}} \\,+ \\left(_{4} H_{6} -\\, {\\boxed{\\vphantom{(}\\,(\\text{나}) \\,}} \\, \\right) \\,+\\, {\\boxed{\\vphantom{(}\\,(\\text{다}) \\,}} \\,$\n이다.\n위의 (가), (나), (다)에 알맞은 수를 각각 $p$, $q$, $r\\,$라 할 때, $p+q+r\\,$의 값은? [4점]\n① $164$ ② $168$ ③ $172$ ④ $176$ ⑤ $180$","answer":"①","sourceHash":"3113ade222e26c9639be03cf26c3962f662ac4e9e612cf1f68041277c7c449fd","steps":[{"id":"s1","latex":"y_i=5-x_i\\Rightarrow\\sum_{i=1}^4y_i=20-n,\\quad0\\le y_i\\le5"},{"id":"s2","latex":"p=f(15)={}_4\\mathrm H_5={}_8\\mathrm C_3=56"},{"id":"s3","latex":"f(14)={}_4\\mathrm H_6-4\\Rightarrow q=4"},{"id":"s4","latex":"r=f(13)={}_4\\mathrm H_7-4-{}_4\\mathrm P_2"},{"id":"s5","latex":"r={}_{10}\\mathrm C_3-4-12=104"},{"id":"s6","latex":"p+q+r=56+4+104=164"}],"diagram":null,"contentHash":"e7f400e3bb8d93
