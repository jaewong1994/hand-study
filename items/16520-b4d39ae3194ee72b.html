<script>window.HandStudyRecord={"itemId":16520,"sourceLabel":"2019 평가원 고3 수리가형 6월 30번","adminYear":2019,"grade":3,"month":6,"number":30,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"상수 $a ,\\, b$에 대하여 함수 $f(x)=a\\,\\sin^{3} x+b\\,\\sin\\,x$가 $f \\left(\\frac{ \\pi }{4}\\right) = 3 \\sqrt{2}$, $f \\left(\\frac{ \\pi }{3}\\right) = 5 \\sqrt{3}$ 을 만족시킨다. 실수 $t\\,(1\u003ct\u003c14)$에 대하여 함수 $y= f(x)$의 그래프와 직선 $y= t$가 만나는 점의 $x$좌표 중 양수인 것을 작은 수부터 크기순으로 모두 나열할 때, $n$번째 수를 $x_{n}$이라 하고 $c_{n}= \\int _{3 \\sqrt{2}}^{5 \\sqrt{3}}\\frac{t}{f'(x_{n})}dt$ 라 하자. $\\sum _{n= 1}^{101}c_{n}= p+ q \\sqrt{2}$일 때, $q- p$의 값을 구하시오. (단, $p$와 $q$는 유리수이다.) [4점]","answer":"12","sourceHash":"0ff5fd86877ed6ca9c7a9840eb64d7a6a4ae86a3d36c1338630c1c2985d212fc","steps":[{"id":"s1","latex":"\\dfrac a4+\\dfrac b2=3,\\quad\\dfrac{3a}{8}+\\dfrac b2=5\\Rightarrow f(x)=16\\sin^3x-2\\sin x"},{"id":"s2","latex":"t=2s(8s^2-1),\\quad\\dfrac12\u003cs\u003c1\\Rightarrow\\text{각 }t\\text{에 대한 }s\\text{는 유일}"},{"id":"s3","latex":"\\sin\\alpha=s\\Rightarrow x_{2j-1}=2(j-1)\\pi+\\alpha,\\quad x_{2j}=(2j-1)\\pi-\\alpha"},{"id":"s4","latex":"f'(x_n)\\text{의 부호가 번갈아 바뀌므로 }c_{2j}=-c_{2j-1}"},{"id":"s5","latex":"\\sum_{n=1}^{101}c_n=c_1"},{"id":"s6","latex":"dt=(48s^2-2)ds,\\quad f'(x_1)=(48s^2-2)\\sqrt{1-s^2}"},{"id":"s7","latex":"c_1=\\int_{\\sqrt2/2}^{\\sqrt3/2}\\dfrac{16s^3-2s}{\\sqrt{1-s^2}}\\,ds=-\\dfrac{19}{3}+\\dfrac{17\\sqrt2}{3}"},{"id":"s8","latex":"q-p=\\dfrac{17}{3}+\\dfrac{19}{3}=12"}],"diagram":null,"contentHash":"67223baba0956d0750afa733dc461075d035ce1aae14c2fbffa1773c4781af0c","questionHtml":"\u003cp class=\"hp htall\">상수 \u003cspan class=\"heq\">\\(a ,\\, b\\)\u003c/span>에 대하여 함수 \u003cspan class=\"heq\">\\(f(x)=a\\,\\sin^{3} x+b\\,\\sin\\,x\\)\u003c/span>가 \u003cbr>&emsp;&emsp;\u003cspan class=\"heq\">\\(f \\left(\\dfrac{ \\pi }{4}\\right) = 3 \\sqrt{2}\\)\u003c/span>, \u003cspan class=\"heq\">\\(f \\left(\\dfrac{ \\pi }{3}\\right) = 5 \\sqrt{3}\\)\u003c/span>\u003cbr>을 만족시킨다. 실수 \u003cspan class=\"heq\">\\(t\\,(1\\lt t\\lt 14)\\)\u003c/span>에 대하여 함수 \u003cspan class=\"heq\">\\(y= f(x)\\)\u003c/span>의 그래프와 직선 \u003cspan class=\"heq\">\\(y= t\\)\u003c/span>가 만나는 점의 \u003cspan class=\"heq\">\\(x\\)\u003c/span>좌표 중 양수인 것을 작은 수부터 크기순으로 모두 나열할 때, \u003cspan class=\"heq\">\\(n\\)\u003c/span>번째 수를 \u003cspan class=\"heq\">\\(x_{n}\\)\u003c/span>이라 하고 \u003cbr>&emsp;&emsp;\u003cspan class=\"heq\">\\(c_{n}= \\int_{3 \\sqrt{2}}^{5 \\sqrt{3}}\\dfrac{t}{f' (x_{n})}dt\\)\u003c/span>\u003cbr>라 하자. \u003cspan class=\"heq\">\\(\\sum\\limits_{n= 1}^{101}c_{n}= p+ q \\sqrt{2}\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(q- p\\)\u003c/span>의 값을 구하시오. \u003cbr>(단, \u003cspan class=\"heq\">\\(p\\)\u003c/span>와 \u003cspan class=\"heq\">\\(q\\)\u003c/span>는 유리수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/a06fb504c7bd1e929d526f1d.png\" style=\"width:211px;max-width:100%\">\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"b4d39ae3194ee72bbafcf0638edfc34206134d5472754bee4dbe72a2abed874d"};</script>
<script>window.HandStudyGuide={"itemId":16520,"sourceHash":"0ff5fd86877ed6ca9c7a9840eb64d7a6a4ae86a3d36c1338630c1c2985d212fc","contentHash":"67223baba0956d0750afa733dc461075d035ce1aae14c2fbffa1773c4781af0c","overview":{"goal":"삼각함수의 주기에서 교점의 기울기가 반대인 쌍을 찾아 적분합을 모두 지우고 첫 항만 계산해요.","firstLook":"\\(f(x)\\)는 \\(\\sin x\\)만으로 정해져요. 한 주기에서 같은 사인값을 갖는 두 교점의 코사인 부호가 반대라 도함수도 반대가 돼요.","conditions":[{"label":"두 함숫값","meaning":"\\(a,b\\)를 정해 \\(f(x)=16\\sin^3x-2\\sin x\\)를 얻어요."},{"label":"교점 순서","meaning":"같은 높이의 두 교점이 주기마다 한 쌍씩 나타나요."},{"label":"101개 합","meaning":"앞의 100개는 50쌍으로 없어지고 마지막에 첫 형태의 한 항이 남아요."}]},"chapters":[{"id":"c1","label":"함수를 정하고 사인값을 하나로 정해요","stepIds":["s1","s2"],"question":"각 \\(t\\)에 대해 \\(\\sin x=s\\)의 \\(s\\)가 왜 하나뿐일까요?","hint":"두 주어진 함숫값으로 \\(a,b\\)를 구하고 \\(1/2<s<1\\)에서 \\(16s^3-2s\\)의 증가 여부를 봐요.","explanation":"두 조건을 \\(\\sqrt2,\\sqrt3\\)로 나누면 \\(a/4+b/2=3\\), \\(3a/8+b/2=5\\)예요. 따라서 \\(a=16,b=-2\\)이고 \\(f(x)=16\\sin^3x-2\\sin x\\)예요. \\(s=\\sin x\\)로 두면 \\(t=16s^3-2s=2s(8s^2-1)\\)이에요. 적분 높이에서는 \\(1/2<s<1\\)이고 이 식의 도함수 \\(48s^2-2\\)가 양수이므로 각 \\(t\\)마다 \\(s\\)가 하나로 정해져요.","check":{"prompt":"적분의 아래끝과 위끝은 각각 어떤 \\(s\\)에 대응하나요?","answer":"\\(3\\sqrt2=f(\\pi/4)\\)는 \\(s=\\sqrt2/2\\), \\(5\\sqrt3=f(\\pi/3)\\)는 \\(s=\\sqrt3/2\\)에 대응해요."}},{"id":"c2","label":"교점 두 개씩 짝지어 없애요","stepIds":["s3","s4","s5"],"question":"왜 \\(c_{2j}=-c_{2j-1}\\)이고 101개 합에는 \\(c_1\\)만 남을까요?","hint":"\\(\\sin\\alpha=s\\)인 두 교점에서 코사인의 부호를 비교해요.","explanation":"\\(0<\\alpha<\\pi/2\\), \\(\\sin\\alpha=s\\)라 하면 양의 교점은 \\(x_{2j-1}=2(j-1)\\pi+\\alpha\\), \\(x_{2j}=(2j-1)\\pi-\\alpha\\) 순서예요. 두 점의 사인값은 같지만 코사인값의 부호가 반대라 \\(f'(x_{2j})=-f'(x_{2j-1})\\)예요. 적분의 분자와 구간은 같으므로 \\(c_{2j}=-c_{2j-1}\\)이에요. 따라서 \\(c_1+c_2,\\ldots,c_{99}+c_{100}\\)이 모두 \\(0\\)이고, 주기 때문에 \\(c_{101}=c_1\\)이라 전체 합은 \\(c_1\\)이에요.","check":{"prompt":"101번째 항이 첫 번째와 같은 형태인 이유는 무엇인가요?","answer":"교점이 두 개씩 한 쌍을 이루고 함수와 도함수가 \\(2\\pi\\)마다 반복되므로 홀수 번째 항들은 모두 \\(c_1\\)과 같아요."}},{"id":"c3","label":"높이를 사인값으로 바꿔 적분해요","stepIds":["s6","s7","s8"],"question":"\\(c_1\\)의 적분에서 \\(f'(x_1)\\)는 어떻게 없어질까요?","hint":"\\(t=f(x_1)\\)이므로 \\(dt=f'(x_1)dx_1\\)이고, 이어서 \\(s=\\sin x_1\\)로 바꿔요.","explanation":"\\(s=\\sin x_1\\)로 두면 \\(dt=(48s^2-2)ds\\), \\(f'(x_1)=(48s^2-2)\\sqrt{1-s^2}\\)예요. 공통인 인수가 없어져\n\n\\(c_1=\\int_{\\sqrt2/2}^{\\sqrt3/2}\\frac{16s^3-2s}{\\sqrt{1-s^2}}ds\\)\n\n가 돼요. \\(u=\\sqrt{1-s^2}\\)로 두면 적분식은 \\((16u^2-14)du\\)가 되고 끝값은 \\(u=\\sqrt2/2\\)에서 \\(1/2\\)로 바뀌어요. 계산하면 \\(c_1=-19/3+17\\sqrt2/3\\)이에요. 따라서 \\(p=-19/3,q=17/3\\)이고 \\(q-p=12\\)예요.","check":{"prompt":"\\(p\\)가 음수라는 점을 마지막 계산에 어떻게 반영하나요?","answer":"\\(q-p=17/3-(-19/3)=36/3=12\\)로 음수를 빼야 해요."}}],"takeaway":["삼각함수 안의 같은 값을 갖는 두 교점은 도함수 부호가 반대인지 확인해 적분항을 짝지을 수 있어요.","홀수 개 항을 짝지울 때 어느 항이 남는지 주기와 순서를 함께 확인해요.","적분변수가 높이일 때 교점의 좌표를 변수로 바꾸면 분모의 도함수가 미분관계와 없어질 수 있어요."]};</script>
