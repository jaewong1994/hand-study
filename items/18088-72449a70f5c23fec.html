>\\(p\\,\\)\u003c/span>와 \u003cspan class=\"heq\">\\(q\\,\\)\u003c/span>는 유리수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","questionText":"양수 $k\\,$에 대하여 함수 $f(x)\\,$를\n $f(x)=(k- \\left| \\right. x \\left| \\right. )e ^{-x}$\n이라 하자. 실수 전체의 집합에서 미분가능하고 다음 조건을 만족시키는 모든 함수 $F\\,(x)\\,$에 대하여 $F\\,(0)\\,$의 최솟값을 $g(k)\\,$라 하자.\n모든 실수 $x\\,$에 대하여 $F' (x)=f(x)\\,$이고 $F\\,(x) \\geq f(x)\\,$이다.\n$g \\left(\\frac{1}{4} \\right)+g \\left(\\frac{3}{2} \\right)=p e+q\\,$일 때, $100(p+q)\\,$의 값을 구하시오. (단, $\\lim _{x \\,\\rightarrow\\, \\infty } x e^{-x}=0\\,$이고, $p\\,$와 $q\\,$는 유리수이다.) [4점]","scoreStatus":"confirmed_4_direct","sourceHash":"d0c9e3287100dc383a191e0a73c394916aeddf1494106592054dc4b86a4282fd","sourceLabel":"2024 평가원 고3 수학미적분 9월 30번","stepExplanations":{"s1":{"body":"\\(F^{\\prime}=f\\)이므로 \\(F(x)=F(0)+\\int_0^xf(t)\\,dt\\)예요. 이를 \\(F(x)\\ge f(x)\\)에 넣으면 \\(F(0)\\ge h(x)\\)가 됩니다. 즉 모든 \\(x\\)에서 성립하도록 \\(h\\)의 값들을 위에서 덮는 가장 작은 수가 \\(F(0)\\)의 최솟값이에요. 어떤 값이 극한으로만 가까워지는 경우에도 그 값보다 작게 정할 수는 없어요.","skillTags":["integration.constant","function.global-bound"],"title":"적분상수 하나를 정하는 문제로 바꿔요"},"s2":{"body":"\\(x\\ge0\\)에서는 \\(f(x)=(k-x)e^{-x}\\)예요. \\(\\int(k-t)e^{-t}\\,dt=(t+1-k)e^{-t}+C\\)인데, 일차식은 미분하고 지수함수는 적분하는 부분적분으로 얻습니다. 끝점 0과 \\(x\\)를 넣고 \\(f(x)\\)에서 빼면 \\((2k-1-2x)e^{-x}+1-k\\)가 남아요.","skillTags":["integration.by-parts","function.absolute-value"],"title":"절댓값을 나누고 부분적분해요"},"s3":{"body":"\\(x\u003c0\\)이면 \\(f(x)=(k+x)e^{-x}\\)예요. 부정적분은 \\(-(t+k+1)e^{-t}\\)이므로 \\(\\int_0^xf(t)\\,dt=-(x+k+1)e^{-x}+k+1\\)입니다. 이 값을 빼면 \\((2x+2k+1)e^{-x}-k-1\\)이 돼요. 상한이 음수여도 끝점 대입은 ‘상한−하한’ 그대로 해요.","skillTags":["integration.by-parts","integration.bounds"],"title":"음수 구간에서는 적분 방향도 확인해요"},"s4":{"body":"\\(0\u003ck\\le\\frac12\\)일 때 음수 구간에서는 \\(h^{\\prime}(x)=(1-2k-2x)e^{-x}>0\\)이므로 \\(h(x)\u003ch(0)=k\\)예요. 양수 구간에서는 \\(h^{\\prime}(x)=(2x-2k-1)e^{-x}\\)이므로 감소하다 증가하고, \\(x\\to\\infty\\)일 때 \\(1-k\\)에 가까워져요. \\(k\\le1-k\\)이므로 모든 \\(x\\)에서 \\(h(x)\\le1-k\\)입니다. 따라서 \\(F(0)=1-k\\)로 정하면 조건을 만족해요. 이보다 작은 수는 무한히 멀리 갔을 때의 함숫값을 덮지 못하므로 \\(g(k)=1-k\\)가 됩니다.","skillTags":["derivative.global-extrema","limit.endpoint"],"title":"가까워지는 값도 빠뜨리지 않고 비교해요"},"s5":{"body":"\\(k>\\frac12\\)이면 음수 구간에서 \\(h^{\\prime}(x)=(1-2k-2x)e^{-x}\\)의 부호가 \\(x=\\frac12-k\\)를 지나며 양에서 음으로 바뀌어요. 이때의 가장 큰 함숫값은 \\(2e^{k-1/2}-k-1\\)입니다. 양수 구간에서는 감소하다 증가하므로 \\(h(0)=k\\)와 무한히 멀리 갔을 때의 값 \\(1-k\\)를 함께 비교해요.\n\n\\(u=k-\\frac12>0\\)로 놓아 볼게요. \\(e^u-u-1\\)은 \\(u=0\\)에서 0이고, 도함수 \\(e^u-1\\)이 \\(u>0\\)에서 양수이므로 \\(e^u>1+u\\)예요. 따라서 \\(2e^{k-1/2}-k-1>k\\)이고, \\(k>\\frac12\\)에서 \\(k>1-k\\)도 성립해요. 결국 음수 구간에서 얻은 값이 모든 다른 함숫값보다 크거나 같으므로 그 값을 \\(F(0)\\)의 최솟값으로 정할 수 있어요.","skillTags":["derivative.global-extrema","inequality.function-comparison"],"title":"세 후보의 대소를 실제로 비교해요"}},"steps":[{"id":"s1","latex":"F(0)\\ge h(x),\\quad h(x)=f(x)-\\int_0^xf(t)dt"},{"id":"s2","latex":"x\\ge0:\\quad h(x)=(2k-1-2x)e^{-x}+1-k"},{"id":"s3","latex":"x\u003c0:\\quad h(x)=(2x+2k+1)e^{-x}-k-1"},{"id":"s4","latex":"0\u003ck\\le\\dfrac12:\\quad k\\le1-k,\\quad g(k)=1-k"},{"id":"s5","latex":"k>\\dfrac12:\\quad 2e^{k-1/2}-k-1>k>1-k\\quad\\Rightarrow\\quad g(k)=2e^{k-1/2}-k-1"},{"id":"s6","latex":"g\\!\\left(\\dfrac14\\right)=\\dfrac34"},{"id":"s7","latex":"g\\!\\left(\\dfrac32\\right)=2e-\\dfrac52"},{"id":"s8","latex":"g\\left(\\dfrac14\\right)+g\\left(\\dfrac32\\right)=2e-\\dfrac74\\quad\\Rightarrow\\quad100(p+q)=25"}],"track":"미적분"};</script>
<script>window.HandStudyGuide={"itemId":18088,"sourceHash":"d0c9e3287100dc383a191e0a73c394916aeddf1494106592054dc4b86a4282fd","contentHash":"72e7b1afcaf32354333211e41a37484134414e6ae6ee2cecc25d967dffbef917","overview":{"goal":"모든 \\(x\\)에서 \\(F(x)\\ge f(x)\\)가 되게 하는 적분상수의 가장 작은 값을 구하고, \\(k=1/4,3/2\\)에서 계산해요.","firstLook":"\\(F^{\\prime}=f\\)이면 \\(F\\)는 적분상수 하나만 달라져요. 따라서 함수 \\(F\\) 전체를 찾기보다, 모든 \\(x\\)의 조건이 \\(F(0)\\)에 어떤 하한을 주는지 모으는 편이 빠릅니다.","conditions":[{"label":"미분 조건","meaning":"\\(F(x)=F(0)+\\int_0^x f(t)dt\\)로 쓸 수 있어요."},{"label":"전 구간 부등식","meaning":"한 점이 아니라 모든 실수 \\(x\\)에서 \\(F(x)\\ge f(x)\\)여야 해요."},{"label":"절댓값","meaning":"\\(f(x)=(k-|x|)e^{-x}\\)이므로 \\(x<0\\)과 \\(x\\ge0\\)을 나눠야 합니다."}]},"chapters":[{"id":"c1","label":"함수 조건을 적분상수 조건으로 바꾸기","stepIds":["s1"],"question":"\\(F(0)\\)가 얼마나 커야 하는지를 한 함수의 값 비교로 나타낼 수 있을까요?","hint":"\\(F(x)=F(0)+\\int_0^x f(t)dt\\)를 \\(F(x)\\ge f(x)\\)에 넣어 보세요.","explanation":"정리하면 \\(F(0)\\ge f(x)-\\int_0^x f(t)dt=:h(x)\\)예요. 모든 \\(x\\)에서 성립해야 하므로 \\(F(0)\\)는 \\(h\\)의 모든 값을 덮어야 합니다. 어떤 값에 한없이 가까워질 뿐 실제로 닿지 않더라도, 그 값보다 작은 \\(F(0)\\)는 선택할 수 없다는 점도 챙겨야 해요.","check":{"prompt":"이제 \\(g(k)\\)는 어떤 값으로 해석할 수 있나요?","answer":"\\(h(x)\\)의 모든 값을 위에서 덮는 가장 작은 수입니다."}},{"id":"c2","label":"절댓값 양쪽에서 h 계산하기","stepIds":["s2","s3"],"question":"\\(|x|\\) 때문에 달라지는 두 식을 어떻게 계산할까요?","hint":"\\(x\\ge0\\)에서는 \\(|x|=x\\), \\(x<0\\)에서는 \\(|x|=-x\\)를 먼저 넣으세요.","explanation":"\\(x\\ge0\\)에서는 \\(f(x)=(k-x)e^{-x}\\)이고 부분적분을 하면 \\(h(x)=(2k-1-2x)e^{-x}+1-k\\)가 됩니다. \\(x<0\\)에서는 \\(f(x)=(k+x)e^{-x}\\)이므로 \\(h(x)=(2x+2k+1)e^{-x}-k-1\\)이에요. 음수인 상한에서도 부정적분을 구한 뒤 “상한에서의 값-하한에서의 값”으로 계산합니다.","check":{"prompt":"두 식이 만나는 \\(x=0\\)에서 \\(h(0)\\)은 얼마인가요?","answer":"두 식 모두 \\(h(0)=k\\)를 줍니다."}},{"id":"c3","label":"k의 범위에 따라 가장 큰 후보 비교하기","stepIds":["s4","s5"],"question":"왜 \\(k=1/2\\)를 기준으로 경우를 나누나요?","hint":"음수 구간에서 \\(h^{\\prime}(x)=0\\)이 되는 위치 \\(x=1/2-k\\)가 실제로 음수인지 보세요.","explanation":"\\(0<k\\le\\frac12\\)이면 음수 구간에서 도함수가 0이 되는 점이 없어요. 양수 구간에서는 \\(h^{\\prime}(x)=(2x-2k-1)e^{-x}\\)이므로 감소한 뒤 증가하여, 가장 큰 값의 후보는 경계 \\(h(0)=k\\)와 \\(x\\to\\infty\\)에서 가까워지는 \\(1-k\\)뿐입니다. 이때 \\(1-k\\ge k\\)라서 \\(g(k)=1-k\\)예요. \\(k>1/2\\)이면 \\(x=1/2-k<0\\)에서 음수 구간의 가장 큰 값 \\(2e^{k-1/2}-k-1\\)이 생깁니다. \\(u=k-1/2>0\\)에서 \\(e^u>1+u\\)를 쓰면 이 값이 \\(k\\)와 \\(1-k\\)보다 큼을 확인할 수 있어요.","check":{"prompt":"\\(k>1/2\\)에서 비교해야 하는 세 후보는 무엇인가요?","answer":"\\(h(0)=k\\), 무한히 멀리서 가까워지는 \\(1-k\\), 음수 구간 내부의 값 \\(2e^{k-1/2}-k-1\\)입니다."}},{"id":"c4","label":"두 k값 대입하고 마무리하기","stepIds":["s6","s7","s8"],"question":"\\(1/4\\)와 \\(3/2\\)는 각각 어느 경우의 식에 넣어야 할까요?","hint":"먼저 각 수를 \\(1/2\\)와 비교하세요.","explanation":"\\(1/4\\le1/2\\)이므로 \\(g(1/4)=1-1/4=3/4\\)예요. \\(3/2>1/2\\)이므로 \\(g(3/2)=2e^{1}-3/2-1=2e-5/2\\)입니다. 합은 \\(2e-7/4\\)이므로 \\(p=2,q=-7/4\\)예요.","check":{"prompt":"\\(100(p+q)\\)의 값은 얼마인가요?","answer":"\\(100(2-7/4)=25\\)입니다."}}],"takeaway":["도함수가 주어진 함수족은 적분상수 하나의 문제로 바꾸면 전 구간 부등식을 정리하기 쉬워요.","가장 큰 후보에는 실제로 얻는 값뿐 아니라 무한히 갈 때 가까워지는 값도 포함해 비교해요.","절댓값 함수는 경계에서 식이 이어지는지 확인하고 각 구간의 증감을 따로 조사해요."]};</script>
