  <script>window.HandStudyRecord={"itemId":8037,"sourceLabel":"2021 교육청 고2 수학 3월 20번","adminYear":2021,"grade":2,"month":3,"number":20,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"세 집합\n $X= \\left\\{ 1,\\,2,\\,3,\\,4 \\right\\}$, $Y= \\left\\{ 2,\\,3,\\,4,\\,5 \\right\\}$, $Z= \\left\\{ 3,\\,4,\\,5 \\right\\} \\,$\n에 대하여 두 함수 $f\\,:\\,X\\,\\to \\,Y$, $g\\,:\\,Y\\,\\to \\,Z\\,$가 다음 조건을 만족시킨다.\n(가) 함수 $f\\,$는 일대일대응이다.\n(나) $x \\in \\left( X \\cap Y \\right) \\,$이면 $g(x)-f(x)=1\\,$이다.\n\u003c보기>에서 옳은 것만을 있는 대로 고른 것은? [4점]\n\u003c보기>\nㄱ. 함수 $g \\circ f\\,$의 치역은 $Z\\,$이다.\nㄴ. $f^{-1} (5)\\geq2$\nㄷ. $f(3)\u003cg(2)\u003cf(1)\\,$이면 $f(4)+g(2)=6\\,$이다.\n① ㄱ ② ㄱ, ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","answer":"①","sourceHash":"509fafd328eec85bcd87e319add90f7c10b6dbe054066027ac5d62bb9e7a8975","steps":[{"id":"s1","latex":"X\\cap Y=\\{2,3,4\\}"},{"id":"s2","latex":"g(x)=f(x)+1\\in Z\\Rightarrow f(2),f(3),f(4)\\in\\{2,3,4\\}"},{"id":"s3","latex":"f\\text{는 전단사}\\Rightarrow f(1)=5"},{"id":"s4","latex":"(g\\circ f)(\\{2,3,4\\})=\\{3,4,5\\}=Z\\quad\\text{(\\char\"3131 참)}"},{"id":"s5","latex":"f^{-1}(5)=1\u003c2\\quad\\text{(\\char\"3134 거짓)}"},{"id":"s6","latex":"f(3)\u003cg(2)\u003cf(1)\\Rightarrow(f(2),f(3),f(4))=(3,2,4)"},{"id":"s7","latex":"f(4)+g(2)=4+4=8\\ne6\\quad\\text{(\\char\"3137 거짓)}"}],"diagram":null,"contentHash":"d3807f0fc80c2641eb569b0e0947b4a2919b7c7ab53ea20d478d816da3907a81","questionHtml":"\u003cp class=\"hp\">세 집합\u003c/p>\u003cp class=\"hp\">&emsp;\u003cspan class=\"heq\">\\(X= \\left\\{ 1,\\,2,\\,3,\\,4 \\right\\}\\)\u003c/span>, \u003cspan class=\"heq\">\\(Y= \\left\\{ 2,\\,3,\\,4,\\,5 \\right\\}\\)\u003c/span>, \u003cspan class=\"heq\">\\(Z= \\left\\{ 3,\\,4,\\,5 \\right\\} \\,\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">에 대하여 두 함수 \u003cspan class=\"heq\">\\(f\\,:\\,X\\, \\to  \\,Y\\)\u003c/span>, \u003cspan class=\"heq\">\\(g\\,:\\,Y\\, \\to  \\,Z\\,\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(
