<script>window.HandStudyRecord={"itemId":17669,"sourceLabel":"2023 교육청 고3 수학미적분 4월 22번","adminYear":2023,"grade":3,"month":4,"number":22,"track":"미적분","points":4,"scoreStatus":"confirmed_4_direct","questionText":"두 상수 $a$, $b$($b!=1$)과 이차함수 $f \\left( x \\right)$에 대하여 함수 $g \\left( x \\right)$가 다음 조건을 만족시킨다.\n(가) 함수 $g \\left( x \\right)$는 실수 전체의 집합에서 미분가능하고, 도함수 $g' \\left( x \\right)$는 실수 전체의 집합에서 연속이다.(나) $\\left| x \\right| \u003c 2$일 때, $g \\left( x \\right) = \\int _{0} ^{x} {\\left( -t+a \\right) dt}$이고 $\\left| x \\right| \\geq 2$일 때, $\\left| g' \\left( x \\right) \\right| =f \\left( x \\right)$이다.(다) 함수 $g \\left( x \\right)$는 $x=1$, $x=b$에서 극값을 갖는다.\n$g \\left( k \\right) =0$을 만족시키는 모든 실수 $k$의 값의 합이 $p+q \\sqrt{3}$일 때, $p \\times q$의 값을 구하시오. (단, $p$와 $q$는 유리수이다.) [4점]\n 사각형입니다. 2023년 4월 고3 모의고사 문제지제 2 교시 수학 영역(미적분) \n5 지선다형","answer":"32","sourceHash":"32bceeed61b30bf8aa26564c931a94702a5c15a374c2db209c274acb0f657922","steps":[{"id":"s1","latex":"|x|\u003c2:\\ g'(x)=1-x"},{"id":"s2","latex":"f(2)=1,\\ f(-2)=3,\\quad f(x)=c(x-b)^2"},{"id":"s3","latex":"c(b-2)^2=1,\\ c(b+2)^2=3\\Rightarrow b=4+2\\sqrt3"},{"id":"s4","latex":"g(x)=0\\Rightarrow x=0,2,6+4\\sqrt3"},{"id":"s5","latex":"8+4\\sqrt3\\Rightarrow pq=32"}],"diagram":null,"contentHash":"8d71c654514b738c34cf6c091d8f05a11e1b82510e8b98a42c32d475a4871094","questionHtml":"\u003cp class=\"hp\">두 상수 \u003cspan class=\"heq\">\\(a\\)\u003c/span>, \u003cspan class=\"heq\">\\(b\\)\u003c/span>(\u003cspan class=\"heq\">\\(b \\neq 1\\)\u003c/span>)과 이차함수 \u003cspan class=\"heq\">\\(f \\left( x \\right)\\)\u003c/span>에 대하여 함수 \u003cspan class=\"heq\">\\(g \\left( x \\right)\\)\u003c/span>가  다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) 함수 \u003cspan class=\"heq\">\\(g \\left( x \\right)\\)\u003c/span>는 실수 전체의 집합에서 미분가능하고,\u003cbr>도함수 \u003cspan class=\"heq\">\\(g' \\left( x \\right)\\)\u003c/span>는 실수 전체의 집합에서 연속이다.\u003c/p>\u003cp class=\"hp\">(나) \u003cspan class=\"heq\">\\(\\left| x \\right| \\lt  2\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(g \\left( x \\right) = \\int_{0}^{x} {\\left( -t+a \\right) dt}\\)\u003c/span>이고\u003cbr>\u003cspan class=\"heq\">\\(\\left| x \\right| \\geq 2\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(\\left| g' \\left( x \\right) \\right| =f \\left( x \\right)\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp\">(다) 함수 \u003cspan class=\"heq\">\\(g \\left( x \\right)\\)\u003c/span>는 \u003cspan class=\"heq\">\\(x=1\\)\u003c/span>, \u003cspan class=\"heq\">\\(x=b\\)\u003c/span>에서 극값을 갖는다.\u003c/p>\u003c/div>\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(g \\left( k \\right) =0\\)\u003c/span>을 만족시키는 모든 실수 \u003cspan class=\"heq\">\\(k\\)\u003c/span>의 값의 합이 \u003cspan class=\"heq\">\\(p+q \\sqrt{3}\\)\u003c/span>일 때,\u003cbr>\u003cspan class=\"heq\">\\(p \\times q\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(p\\)\u003c/span>와 \u003cspan class=\"heq\">\\(q\\)\u003c/span>는 유리수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"f37813ee31d8ae6ada711cb2ba1f0633b295da4c0cd243282dd41f4a66b0c06b"};</script>
<script>window.HandStudyGuide={"itemId":17669,"sourceHash":"32bceeed61b30bf8aa26564c931a94702a5c15a374c2db209c274acb0f657922","contentHash":"8d71c654514b738c34cf6c091d8f05a11e1b82510e8b98a42c32d475a4871094","overview":{"goal":"안쪽 적분식과 극값 조건으로 a를 정하고, 바깥쪽 도함수의 절댓값인 이차함수를 복원해 g의 모든 영점을 구해요.","firstLook":"안쪽에서는 \\(g'(x)=-x+a\\)예요. \\(x=1\\)의 극값이 \\(a\\)를 정하고, 경계 \\(x=\\pm2\\)에서 도함수의 연속성이 이차함수 \\(f\\)의 두 값을 정해요.","conditions":[{"label":"도함수의 연속","meaning":"안쪽과 바깥쪽이 만나는 \\(x=-2,2\\)에서 \\(g'\\)값이 이어져야 해요."},{"label":"바깥쪽 관계","meaning":"\\(|x|\\ge2\\)에서는 \\(f(x)=|g'(x)|\\)이고 \\(f\\)는 이차함수예요."},{"label":"두 극값","meaning":"극값 위치는 \\(1\\)과 \\(b\\)이고 \\(b\\ne1\\)이에요."}]},"chapters":[{"id":"c1","label":"안쪽 극값과 경계 기울기를 구해요","stepIds":["s1"],"question":"\\(x=1\\)의 극값은 \\(a\\)와 경계의 도함숫값을 어떻게 정할까요?","hint":"안쪽에서 \\(g'(x)=-x+a\\)이고 극값에서는 도함수가 \\(0\\)이에요.","explanation":"적분을 미분하면 \\(|x|<2\\)에서 \\(g'(x)=-x+a\\)예요. \\(x=1\\)에서 극값을 가지므로 \\(g'(1)=0\\), 따라서 \\(a=1\\)이에요. 그러면 안쪽에서 \\(g'(x)=1-x\\)이고 경계로 갈 때 \\(g'(-2)=3\\), \\(g'(2)=-1\\)이에요.","check":{"prompt":"안쪽의 \\(g(x)\\)를 직접 쓰면 무엇인가요?","answer":"\\(g(x)=-x^2/2+x\\)예요."}},{"id":"c2","label":"이차함수 f의 꼭짓점과 b를 정해요","stepIds":["s2","s3"],"question":"도함수의 연속성과 \\(x=b\\)의 극값은 왜 \\(f(x)=c(x-b)^2\\)를 만들까요?","hint":"경계에서 \\(f(-2)=3,f(2)=1\\)이고 \\(g'(b)=0\\)이에요.","explanation":"도함수의 연속성과 \\(f=|g'|\\)에서 \\(f(-2)=3\\), \\(f(2)=1\\)이에요. \\(b\\ne1\\)이고 안쪽의 도함수는 \\(x=1\\)에서만 0이므로 \\(b\\)는 바깥쪽에 있어요. \\(g'(b)=0\\)이어서 \\(f(b)=0\\)이고, \\(f\\)는 그 주변에서 절댓값이라 음수가 될 수 없으므로 \\(b\\)는 이차함수의 꼭짓점이에요. 따라서 \\(f(x)=c(x-b)^2\\), \\(c>0\\)예요.\n\n경계값을 넣으면 \\(c(b-2)^2=1\\), \\(c(b+2)^2=3\\)이에요. 두 식의 비와 \\(|b|\\ge2\\)를 함께 적용하면 \\(b=4+2\\sqrt3\\)이고, 다른 대수적 후보 \\(4-2\\sqrt3\\)은 안쪽 구간에 있어 제외돼요.","check":{"prompt":"\\(b=4+2\\sqrt3\\)은 실제로 \\(2\\)보다 큰가요?","answer":"\\(\\sqrt3>0\\)이므로 분명히 \\(b>4>2\\)예요."}},{"id":"c3","label":"도함수의 부호로 g의 영점을 찾아요","stepIds":["s4"],"question":"안쪽의 두 영점 외에 오른쪽 바깥에서 영점이 하나 더 생기는 위치는 어디인가요?","hint":"\\(x=2\\)부터 \\(b\\)까지 줄어든 넓이와 \\(b\\) 이후 늘어난 넓이가 같아지는 점을 찾아요.","explanation":"안쪽에서 \\(g(x)=-x^2/2+x=x(1-x/2)\\)이므로 연속성을 포함한 영점은 \\(x=0,2\\)예요. 왼쪽 바깥에서는 \\(g'(-2)=3>0\\)이고 \\(f\\)가 0이 되는 점 \\(b\\)는 오른쪽에 있으므로 \\(g'=f>0\\)예요. \\(g(-2)=-4\\)이어서 \\(x<-2\\)에서는 값이 더 작아 영점이 없어요.\n\n오른쪽에서 \\(g'(2)=-1\\)이므로 \\(2<x<b\\)에서는 \\(g'=-c(x-b)^2\\), 극값 \\(b\\)를 지난 뒤에는 \\(g'=c(x-b)^2\\)예요. \\(2\\)에서 \\(b\\)까지 감소한 양은 \\(c(b-2)^3/3\\)이고, \\(b\\) 뒤에서 \\(x\\)까지 증가한 양은 \\(c(x-b)^3/3\\)이에요. 다시 0이 되려면 \\(x-b=b-2\\), 따라서 \\(x=2b-2=6+4\\sqrt3\\)이에요.","check":{"prompt":"\\(x=b\\)에서 \\(g\\)는 양수인가요, 음수인가요?","answer":"\\(x=2\\)에서 \\(0\\)인 뒤 계속 감소했으므로 음수예요."}},{"id":"c4","label":"모든 영점의 합을 정리해요","stepIds":["s5"],"question":"세 영점의 합에서 \\(p\\times q\\)는 얼마인가요?","hint":"영점은 \\(0,2,6+4\\sqrt3\\)이에요.","explanation":"모든 영점의 합은 \\(0+2+(6+4\\sqrt3)=8+4\\sqrt3\\)이에요. 따라서 \\(p=8,q=4\\)이고 \\(p\\times q=32\\)예요.","check":{"prompt":"p와 q가 유리수라는 조건과 맞나요?","answer":"8과 4는 모두 정수이면서 유리수라 조건에 맞아요."}}],"takeaway":["적분으로 정의된 함수는 먼저 미분해 안쪽 극값과 경계 기울기를 구해요.","절댓값인 이차함수가 0이 되면 음수가 될 수 없으므로 그 근은 꼭짓점에서 두 번 만나요.","도함수의 부호가 극값에서 바뀌는 바깥 구간은 적분 넓이의 대칭으로 다음 영점을 찾을 수 있어요."]};</script>
