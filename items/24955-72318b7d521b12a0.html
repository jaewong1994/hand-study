{{AOC}}\\,$의 넓이가 $8\\,$일 때, $a \\times { \\overline{{OB}}}\\,$의 값은? (단, ${{O}}\\,$는 원점이다.) [4점]\n① $2^{\\frac{13}{6}}\\,$ ② $2^{\\frac{7}{3}}\\,$ ③ $2^{\\frac{5}{2}}\\,$ ④ $2^{\\frac{8}{3}}\\,$ ⑤ $2^{\\frac{17}{6}}$","sourceHash":"765833b66c3a31e64c793dbdcf7deda464194b012439ed935a82abca9d13481b","sourceKind":"csat","sourceLabel":"2025년 시행 수능 · 2026학년도 · 공통 · 10번","steps":[{"id":"s1","latex":"A=(t,a^{t}-2),\\quad B=(t,0),\\quad C=(t,-2)\\qquad(t>0)"},{"id":"s2","latex":"AB=BC\\Rightarrow a^{t}-2=2\\Rightarrow a^{t}=4"},{"id":"s3","latex":"AC=4\\text{이고 원점에서 직선 }AC\\text{까지의 거리는 }t\\text{이다.}"},{"id":"s4","latex":"[\\triangle AOC]=\\frac12\\cdot4\\cdot t=8\\Rightarrow t=4"},{"id":"s5","latex":"a^{4}=4\\Rightarrow a=2^{1/2}"},{"id":"s6","latex":"a\\cdot OB=2^{1/2}\\cdot4=2^{5/2}"},{"id":"s7","latex":"\\therefore\\ \\boxed{2^{5/2}}\\;(③)"}],"track":"공통"};</script>
