an class=\"heq\">\\(E_{2}\\)\u003c/span>라 하자. 두 타원 \u003cspan class=\"heq\">\\(E_{1}\\)\u003c/span>, \u003cspan class=\"heq\">\\(E_{2}\\)\u003c/span>의 교점 중 \u003cspan class=\"heq\">\\(y\\)\u003c/span>좌표가 양수인 점 \u003cspan class=\"heq\">\\({{B}}\\)\u003c/span>에 대하여 \u003cbr>\u003cspan class=\"heq\">\\(\\overline{{{}}' }- \\overline{{{BA}} }=\\dfrac{1}{5} \\overline{{{AF}}' }\\)\u003c/span>이 성립한다. 타원 \u003cspan class=\"heq\">\\(E_{2}\\)\u003c/span>의 단축의 길이가 \u003cspan class=\"heq\">\\(4 \\sqrt{3}\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(30 \\times c^{2}\\)\u003c/span>의 값을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/df744bab074827fcdbb4c8bf.png\" style=\"width:1015px;max-width:100%\">\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"9a6abd8a610c8aed8b7561fbe23ff656e8665733630eb50896f335396a114d52"};</script>
<script>window.HandStudyGuide={"itemId":17908,"sourceHash":"f352dd2052f9ad847b85ca2080ebd69791dee52beedb374d4f293235f32ea365","contentHash":"5f9de567ca64a26467de330fef96d94bd23bb5d1ec20ff24ccedf01caf1ce6bb","overview":{"goal":"두 타원의 초점 거리합을 연결해 장반경과 초점거리의 비를 구해요.","firstLook":"둘째 타원은 세 점 \\(A,F,F'\\)이 한 직선 위에 있어 장축 길이를 바로 구할 수 있어요.","conditions":[{"label":"첫째 타원","meaning":"장반경을 \\(a\\)라 하면 \\(BF+BF'=2a\\)예요."},{"label":"둘째 타원","meaning":"두 초점은 \\(A,F\\)이고 \\(F'\\)을 지나요."}]},"chapters":[{"id":"c1","label":"둘째 타원의 세 길이를 정리해요","stepIds":["s1","s2","s3","s4"],"question":"둘째 타원의 장반경과 초점거리는 어떻게 정해지나요?","hint":"\\(F'\\)에서 두 초점까지의 거리합을 써요.","explanation":"첫째 타원의 오른쪽 꼭짓점은 \\(A=(a,0)\\)예요. 둘째 타원에서 \\(F'\\)의 두 초점 \\(A,F\\)까지 거리합은 \\(F'A+F'F=(a+c)+2c=a+3c\\)이므로 장반경은 \\(a_2=(a+3c)/2\\)예요. 두 초점 사이 거리가 \\(AF=a-c\\)이므로 초점거리는 \\(c_2=(a-c)/2\\), 단축 길이가 \\(4\\sqrt3\\)이므로 단반경은 \\(b_2=2\\sqrt3\\)예요. \\(a_2^2=b_2^2+c_2^2\\)에 넣고 양변에 \\(4\\)를 곱하면 \\((a+3c)^2=48+(a-c)^2\\), 정리하여 \\(c(a+c)=6\\)을 얻어요.","check":{"prompt":"둘째 타원의 두 초점 사이 거리는 얼마인가요?","answer":"같은 \\(x\\)축 위에서 \\(a-c\\)예요."}},{"id":"c2","label":"교점에서 두 거리합을 빼요","stepIds":["s5","s6"],"question":"점 \\(B\\)에서 \\(BF'-BA\\)는 어떻게 나오나요?","hint":"두 타원의 거리합 식에서 공통인 \\(BF\\)를 없애요.","explanation":"\\(B\\)가 첫째 타원 위에 있으므로 \\(BF+BF'=2a\\)이고, 둘째 타원 위에 있으므로 \\(BA+BF=a+3c\\)예요. 첫 식에서 둘째 식을 빼면 \\(BF'-BA=2a-(a+3c)=a-3c\\)예요. 교점의 좌표를 직접 구하지 않아도 되는 까닭은 두 식에 같은 거리 \\(BF\\)가 들어 있기 때문이에요.","check":{"prompt":"거리합 두 식에서 없어지는 공통항은 무엇인가요?","answer":"\\(BF\\)예요."}},{"id":"c3","label":"주어진 길이차로 비를 구해요","stepIds":["s7"],"question":"조건에서 왜 \\(a=4c\\)가 되나요?","hint":"\\(AF'=a+c\\)를 함께 써요.","explanation":"문제의 조건은 \\(BF'-BA=AF'/5\\)이고 \\(AF'=a+c\\)예요. 따라서 \\(a-3c=(a+c)/5\\)이고, \\(5a-15c=a+c\\)에서 \\(4a=16c\\), 곧 \\(a=4c\\)를 얻어요.","check":{"prompt":"\\(A\\)와 \\(F'\\) 사이 거리는 얼마인가요?","answer":"좌표 차로 \\(a+c\\)예요."}},{"id":"c4","label":"초점거리를 결정해요","stepIds":["s8"],"question":"\\(30c^2\\)의 값은 얼마인가요?","hint":"\\(a=4c\\)를 앞의 곱식에 넣어요.","explanation":"\\(c(a+c)=6\\)에 \\(a=4c\\)를 넣으면 \\(5c^2=6\\)이에요. 따라서 \\(30c^2=6\\cdot5c^2=36\\)이에요. \\(c>0\\)이고 \\(a=4c>c\\)라 타원의 기본 조건도 만족해요.","check":{"prompt":"구한 비가 \\(a>c>0\\)을 만족하나요?","answer":"\\(a=4c\\)이고 \\(c>0\\)이므로 만족해요."}}],"takeaway":["한 점에서 두 초점까지의 거리합은 타원의 장축 길이예요.","두 타원의 교점에서는 거리합 식을 빼 공통 거리를 없앨 수 있어요.","마지막에는 장반경이 초점거리보다 큰지도 확인해요."]};</script>
