  <script>window.HandStudyRecord={"itemId":11718,"sourceLabel":"2020 교육청 고1 수학 9월 29번","adminYear":2020,"grade":1,"month":9,"number":29,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"제 ${1}$사분면 위의 점 $A$와 제 $3$사분면 위의 점 $B$에 대하여 두 점 $A ,\\, B$가 다음 조건을 만족시킨다.\n(가) 두 점 $A ,\\, B$는 직선 $y=x$위에 있다.\n(나) $\\overline{ OB} =2 \\overline{ OA}$\n점 $A$에서 $y$축에 내린 수선의 발을 $H$, 점 $B$에서 $x$축에 내린 수선의 발을 $L$이라 하자. 직선 $AL$과 직선 $BH$가 만나는 점을 $P$, 직선 $OP$가 직선 $LH$와 만나는 점을 $Q$라 하자. 세 점 $O ,\\, Q ,\\, L$을 지나는 원의 넓이가 $\\frac{81}{2} \\pi$일 때, $\\overline{ OA} \\times \\overline{ OB}$의 값을 구하시오. (단, $O$는 원점이다.) [4점]","answer":"162","sourceHash":"d9880d972843886f7914e40caa622767a8be87f85f821b87af9d7c2381aa65c1","steps":[{"id":"s1","latex":"A=(a,a),\\ a>0,\\qquad B=(-2a,-2a)"},{"id":"s2","latex":"H=(0,a),\\quad L=(-2a,0)"},{"id":"s3","latex":"AL:\\ y=\\frac13(x+2a),\\qquad BH:\\ y=\\frac32x+a"},{"id":"s4","latex":"P=\\left(-\\frac{2a}{7},\\frac{4a}{7}\\right)\\Rightarrow OP:\\ y=-2x"},{"id":"s5","latex":"LH:\\ y=\\frac12x+a\\Rightarrow OP\\perp LH"},{"id":"s6","latex":"Q=OP\\cap LH\\Rightarrow\\angle OQL=90^\\circ\\Rightarrow OL\\text{은 외접원의 지름}"},{"id":"s7","latex":"r=\\frac{OL}{2}=a,\\quad\\pi a^2=\\frac{81}{2}\\pi\\Rightarrow a^2=\\frac{81}{2}"},{"id":"s8","latex":"OA\\cdot OB=(\\sqrt2a)(2\\sqrt2a)=4a^2=162"}],"diagram":null,"contentHash":"ef2b2ddc09e71b323f9bdcadfc815e4bbbf23c19e1d05bb3ec71abe7fa2b41c7","questionHtml":"\u003cp class=\"hp\">제 \u003cspan class=\"heq\">\\({1}\\)\u003c/span>사분면 위의 점 \u003cspan class=\"heq\">\\({A }\\)\u003c/span>와 제 \u003cspan class=\"heq\">\\(3\\)\u003c/span>사분면 위의 점 \u003cspan class=\"heq\">\\({B }\\)\u003c/span>에 대하여 두 점 \u003cspan class=\"heq\">\\({A ,\\, B }\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cp class=\"hp htall\">\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) 두 점 \u003cspan class=\"heq\">\\({A ,\\, B }\\)\u003c/span>는 직선 \u003cspan class=\"heq\">\\(y=x\\)\u003c/span>위에 있다.\u003c/p>\u003cp class=\"hp htall\">(나) \u003cspan class=\"heq\">\\(\\overline{OB} =2 \\overline{OA}\\)\u003c/span>\u003c/p>\u003c/div>\u003c/p>\u003cp class=\"hp htall\">점 \u003cspan class=\"heq\">\\({A }\\)\u003c/span>에서 \u003cspan class=\"heq\">\\(y\\)\u003c/span>축에 내린 수선의 발을 \u003cspan class=\"heq\">\\({H }\\)\u003c/span>, 점 \u003cspan class=\"heq\">\\({B }\\)\u003c/span>에서 \u003cspan class=\"heq\">\\(x\\)\u003c/span>축에 내린 수선의 발을 \u003cspan class=\"heq\">\\({L }\\)\u003c/span>이라 하자. 직선 \u003cspan class=\"heq\">\\({AL }\\)\u003c/span>과 직선 \u003cspan class=\"heq\">\\({BH }\\)\u003c/span>가 만나는 점을 \u003cspan class=\"heq\">\\({P }\\)\u003c/span>, 직선 \u003cspan class=\"heq\">\\({OP }\\)\u003c/span>가 직선 \u003cspan class=\"heq\">\\({LH }\\)\u003c/span>와 만나는 점을 \u003cspan class=\"heq\">\\({Q }\\)\u003c/span>라 하자. 세 점 \u003cspan class=\"heq\">\\({O ,\\, Q ,\\, L }\\)\u003c/span>을 지나는 원의 넓이가 \u003cspan class=\"heq\">\\(\\dfrac{81}{2} \\pi\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(\\overline{OA} \\times \\overline{OB}\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\({O }\\)\u003c/span>는 원점이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"a4e18b67a08089041c95e8961f67f27925a368204bc83d824e74925880733b73"};</script>
