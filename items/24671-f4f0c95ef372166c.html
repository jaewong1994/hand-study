<script>window.HandStudyRecord={"adminYear":2019,"answer":"64","contentHash":"30d3f56bd4fca26f4b21c1bdaa5440a095f8c2912759f9ee0efefa58b2c498f1","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24671,"month":11,"number":30,"points":4,"preview":false,"questionHtml":"\u003cp>양의 실수 \u003cspan class=\"heq\">\\(t\\)\u003c/span>에 대하여 곡선 \u003cspan class=\"heq\">\\(y=t^{3}\\,\\ln\\, (x-t)\\)\u003c/span>가 곡선 \u003cspan class=\"heq\">\\(y=2e^{x - a}\\)\u003c/span>과 오직 한 점에서 만나도록 하는 실수 \u003cspan class=\"heq\">\\(a\\)\u003c/span>의 값을 \u003cspan class=\"heq\">\\(f(t)\\)\u003c/span>라 하자. \u003cspan class=\"heq\">\\(\\left\\{\\,f&#x27; \\left(\\frac{1}{3}\\right) \\right\\}^{2}\\)\u003c/span>의 값을 구하시오. [4점]\u003c/p>","questionText":"양의 실수 $t$에 대하여 곡선 $y=t^{3}\\,\\ln\\, (x-t)$가 곡선 $y=2e^{x - a}$과 오직 한 점에서 만나도록 하는 실수 $a$의 값을 $f(t)$라 하자. $\\left\\{\\,f\\,' \\left(\\frac{1}{3}\\right) \\right\\}^{2}$의 값을 구하시오. [4점]","sourceHash":"16221b391d29bfccc88b229e15a88b73c61f406aa32dc8cf037b19e3a300ce1b","sourceKind":"csat","sourceLabel":"2019년 시행 수능 · 2020학년도 · 가형 · 30번","steps":[{"id":"s1","latex":"u=x-t,\\quad t^3\\ln u=2e^{u+t-a}\\ \\Rightarrow\\ u>1"},{"explanation":{"body":"로그 안의 \\(x-t\\)를 \\(u\\)로 두면 \\(x=u+t\\)이고 지수함수는 \\(e^{u+t-a}\\)가 돼요. 양변을 \\(t^3e^u\\)로 나누면 왼쪽은 \\(u\\)만의 함수, 오른쪽은 \\(t,a\\)만의 값이 돼요. 이제 교점 하나라는 조건을 한 함수와 수평선이 한 번 만나는 조건으로 볼 수 있어요. 오른쪽이 양수라서 \\(\\ln u>0\\), 즉 \\(u>1\\)이라는 범위도 같이 남겨야 해요.","skillTags":["substitution.separating-parameters"],"title":"x-t를 새 변수로 두는 이유가 있어요"},"id":"s2","latex":"e^{-u}\\ln u=\\frac{2e^{t-a}}{t^3}"},{"id":"s3","latex":"h(u)=e^{-u}\\ln u,\\quad h\\prime(u)=e^{-u}\\left(\\frac1u-\\ln u\\right)"},{"id":"s4","latex":"u\\ln u\\text{는 }u>1\\text{에서 }0\\text{부터 }\\infty\\text{까지 증가한다.}"},{"id":"s5","latex":"c\\ln c=1\\text{인 }c>1\\text{이 하나 존재하고 }h\\text{는 }c\\text{에서만 최대}"},{"id":"s6","latex":"\\lim_{u\\to1+}h(u)=\\lim_{u\\to\\infty}h(u)=0\\ \\Rightarrow\\ \\text{교점이 하나일 조건은 }\\frac{2e^{t-a}}{t^3}=h(c)"},{"id":"s7","latex":"\\ln2+t-a-3\\ln t=\\ln h(c)\\ \\Rightarrow\\ f\\prime(t)=1-\\frac3t"},{"id":"s8","latex":"f\\prime(1/3)=-8\\ \\Rightarrow\\ \\boxed{\\{f\\prime(1/3)\\}^2=64}"}],"track":"가형"};</script>
<script>window.HandStudyGuide={"itemId":24671,"sourceHash":"16221b391d29bfccc88b229e15a88b73c61f406aa32dc8cf037b19e3a300ce1b","contentHash":"30d3f56bd4fca26f4b21c1bdaa5440a095f8c2912759f9ee0efefa58b2c498f1","overview":{"goal":"교점 하나 조건을 한 함수의 최댓값 조건으로 바꾸고 \\(f'(1/3)\\)을 구해요.","firstLook":"\\(x-t\\)를 새 변수로 두어 교점의 위치와 매개변수 \\(t,a\\)를 분리해요.","conditions":[{"label":"양의 로그값","meaning":"오른쪽이 양수이므로 \\(\\ln u>0\\), 따라서 \\(u>1\\)이에요."},{"label":"교점 하나","meaning":"\\(u\\)만의 함수와 양의 수평선이 정확히 한 점에서 만나야 해요."}]},"chapters":[{"id":"c1","label":"변수를 바꾸어 수평선 문제로 만들어요","stepIds":["s1","s2"],"question":"왜 \\(u=x-t\\)로 둔 뒤 \\(u>1\\)을 남겨야 할까요?","hint":"등식의 오른쪽은 항상 양수예요.","explanation":"\\(u=x-t\\)로 두면 \\(x=u+t\\)이고, 원래 등식은 \\(t^3\\ln u=2e^{u+t-a}\\)예요. 양변을 \\(t^3e^u\\)로 나누면 \\(e^{-u}\\ln u=2e^{t-a}/t^3\\)가 돼요. 오른쪽이 양수이므로 \\(\\ln u>0\\), 곧 \\(u>1\\)이어야 해요. 이제 왼쪽은 \\(u\\)만, 오른쪽은 \\(t,a\\)만 들어 있어요.","check":{"prompt":"\\(0<u\\le1\\)을 제외하는 직접적인 이유는 무엇인가요?","answer":"그 범위에서는 \\(\\ln u\\le0\\)인데 오른쪽 \\(2e^{t-a}/t^3\\)은 양수라 등식이 성립하지 않아요."}},{"id":"c2","label":"한 번 만나는 높이를 정해요","stepIds":["s3","s4","s5","s6"],"question":"수평선이 그래프와 한 번만 만나려면 왜 꼭 가장 높은 점을 지나야 할까요?","hint":"양 끝에서 함수값이 \\(0\\)으로 가고 가운데에서 한 번만 증가에서 감소로 바뀌어요.","explanation":"\\(h(u)=e^{-u}\\ln u\\)라 하면 \\(h'(u)=e^{-u}(1/u-\\ln u)\\)예요. \\(u\\ln u\\)는 \\(u>1\\)에서 계속 증가하며 \\(0\\)에서 무한히 큰 값까지 지나므로 \\(u\\ln u=1\\)인 \\(c>1\\)이 하나뿐이에요. 따라서 \\(h\\)는 \\(1<u<c\\)에서 증가하고 \\(u>c\\)에서 감소해요. 또 \\(u\\to1+\\)와 \\(u\\to\\infty\\)에서 \\(h(u)\\to0\\)이므로 양의 수평선은 보통 두 번 만나고, \\(h(c)\\) 높이일 때만 한 번 만나요. 그래서 \\(2e^{t-a}/t^3=h(c)\\)예요.","check":{"prompt":"오른쪽 상수가 \\(h(c)\\)보다 작으면 교점은 몇 개인가요?","answer":"증가 구간과 감소 구간에서 각각 한 번씩 만나므로 두 개예요."}},{"id":"c3","label":"로그를 취해 미분해요","stepIds":["s7","s8"],"question":"알 수 없는 상수 \\(c\\)를 구하지 않고도 답을 낼 수 있는 이유는 무엇인가요?","hint":"\\(h(c)\\)는 \\(t\\)와 무관한 상수라 미분하면 사라져요.","explanation":"양변에 로그를 취하면 \\(\\ln2+t-a-3\\ln t=\\ln h(c)\\)예요. 여기서 \\(a=f(t)\\)이고 오른쪽은 상수이므로 미분하면 \\(1-f'(t)-3/t=0\\), 따라서 \\(f'(t)=1-3/t\\)예요. \\(t=1/3\\)을 넣으면 \\(f'(1/3)=1-9=-8\\)이고, 제곱은 \\(64\\)예요.","check":{"prompt":"마지막 제곱 전에 확인할 미분계수는 얼마인가요?","answer":"\\(f'(1/3)=-8\\)이고 이를 제곱해 \\(64\\)를 얻어요."}}],"takeaway":["매개변수가 섞인 교점식은 한쪽을 위치 변수만의 함수로 분리해 보아요.","교점이 하나라는 조건은 증가·감소와 양 끝의 극한을 확인한 뒤 수평선 높이로 바꿔요.","미분할 때 매개변수와 무관한 상수는 직접 구하지 않아도 돼요."]};</script>
