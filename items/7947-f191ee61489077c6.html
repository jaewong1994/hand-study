  <script>window.HandStudyRecord={"itemId":7947,"sourceLabel":"2020 교육청 고2 수학 6월 20번","adminYear":2020,"grade":2,"month":6,"number":20,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"$1$보다 큰 실수 $a$에 대하여 두 곡선 $y=\\log_{a} \\,x$, $y= \\,\\log_{a+2} \\,x$가 직선 $y=2$와 만나는 점을 각각 $A,\\,B$라 하자. 점 $A$를 지나고 $y$축에 평행한 직선이 곡선 $y=\\log_{a+2} \\,x$와 만나는 점을 $C$, 점 $B$를 지나고 $y$축에 평행한 직선이 곡선 $y=\\log_{a} \\,x$와 만나는 점을 $D$라 할 때, \u003c보기>에서 옳은 것만을 있는 대로 고른 것은? [4점]\n\u003c보 기>ㄱ. 점 $A$의 $x$좌표는 $a ^{2}$이다.ㄴ. ${\\overline{AC}}$$=1$이면 $a=2$이다.ㄷ. 삼각형 $ACB$와 삼각형 $ABD$의 넓이를 각각 $S _{1} ,\\,S _{2}$라 할 때, $\\frac{S _{2}}{S _{1}}$$=\\log_{a} \\, \\left( a+2 \\right)$이다.\n① ㄱ ② ㄷ ③ ㄱ, ㄴ ④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","answer":"⑤","sourceHash":"3037e73fea0bf6bf08bad1aee9f68b7897f578cb29d9b79be8e5bf378a505ead","steps":[{"id":"s1","latex":"A=(a^2,2),\\quad B=((a+2)^2,2)"},{"id":"s2","latex":"C=(a^2,2\\log_{a+2}a),\\quad D=((a+2)^2,2\\log_a(a+2))"},{"id":"s3","latex":"\\therefore\\ \\text{(a) is true}"},{"id":"s4","latex":"AC=1\\iff2-2\\log_{a+2}a=1\\iff a^2=a+2\\iff a=2"},{"id":"s5","latex":"\\therefore\\ \\text{(b) is true}"},{"id":"s6","latex":"L=\\log_a(a+2)>1:\\quad AC=2\\left(1-\\dfrac1L\\right),\\quad BD=2(L-1)"},{"id":"s7","latex":"\\dfrac{S_2}{S_1}=\\dfrac{BD}{AC}=L=\\log_a(a+2)"},{"id":"s8","latex":"\\therefore\\ \\text{(c) is true}"}],"diagram":null,"contentHash":"394da72eb24cd6e1b4b5a6366e674c9594e1c00c06ebfe22efe4e31084fdbb7d","questionHtml":"\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(1\\)\u003c/span>보다 큰 실수 \u003cspan class=\"heq\">\\(a\\)\u003c/span>에 대하여 두 곡선 \u003cspan class=\"heq\">\\(y=\\log_{a} \\,x\\)\u003c/span>, \u003cspan class=\"heq\">\\(y= \\,\\log_{a+2} \\,x\\)\u003c/span>가 직선 \u003cspan class=\"heq\">\\(y=2\\)\u003c/span>와 만나는 점을 각각 \u003cspan class=\"heq\">\\(A,\\,B\\)\u003c/span>라 하자. 점 \u003cspan class=\"heq\">\\(A\\)\u003c/span>를 지나고 \u003cspan class=\"heq\">\\(y\\)\u003c/span>축에 평행한 직선이 곡선 \u003cspan class=\"heq\">\\(y=\\log_{a+2} \\,x\\)\u003c/span>와 만나는 점을 \u003cspan class=\"heq\">\\(C\\)\u003c/span>, 점 \u003cspan class=\"heq\">\\(B\\)\u003c/span>를 지나고 \u003cspan class=\"heq\">\\(y\\)\u003c/span>축에 평행한 직선이 곡선 \u003cspan class=\"heq\">\\(y=\\log_{a} \\,x\\)\u003c/span>와 만나는 점을 \u003cspan class=\"heq\">\\(D\\)\u003c/span>라 할 때, &lt;보기&gt;에서 옳은 것만을 있는 대로 고른 것은? \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cdiv class=\"hbox\">\u003cdiv style=\"text-align:center;font-weight:700;margin:0 0 6px\">&lt; 보 기 &gt;\u003c/div>\u003cp class=\"hp\">ㄱ. 점 \u003cspan class=\"heq\">\\(A\\)\u003c/span>의 \u003cspan class=\"heq\">\\(x\\)\u003c/span>좌표는 \u003cspan class=\"heq\">\\(a^{2}\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp htall\">ㄴ. \u003cspan class=\"heq\">\\({\\overline{A C}}\\)\u003c/span>\u003cspan class=\"heq\">\\(=1\\)\u003c/span>이면 \u003cspan class=\"heq\">\\(a=2\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp htall\">ㄷ. 삼각형 \u003cspan class=\"heq\">\\(A C B\\)\u003c/span>와 삼각형 \u003cspan class=\"heq\">\\(A B D\\)\u003c/span>의 넓이를 각각 \u003cspan class=\"heq\">\\(S_{1} ,\\,S_{2}\\)\u003c/span>라 할 때, \u003cspan class=\"heq\">\\(\\dfrac{S_{2}}{S_{1}}\\)\u003c/span>\u003cspan class=\"heq\">\\(=\\log_{a} \\, \\left( a+2 \\right)\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp class=\"hp\">① ㄱ&emsp;② ㄷ&emsp;③ ㄱ, ㄴ\u003cbr>④ ㄴ, ㄷ&emsp;⑤ ㄱ, ㄴ, ㄷ\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"f191ee61489077c681e6b42157f30b450e8c25586bada0ae324d537b7a7e2f57"};</script>
