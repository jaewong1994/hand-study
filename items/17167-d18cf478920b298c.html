<script>window.HandStudyRecord={"itemId":17167,"sourceLabel":"2021 평가원 고3 수학기하 6월 21번","adminYear":2021,"grade":3,"month":6,"number":21,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"다음 조건을 만족시키는 최고차항의 계수가 $1$인 이차함수 $f \\left( x \\right)$가 존재하도록 하는 모든 자연수 $n$의 값의 합을 구하시오. \n[4점]\n(가) $x$에 대한 방정식 $\\left( x ^{n} -64 \\right) \\,f \\left( x \\right) =0$은 서로 다른 두 실근을 갖고, 각각의 실근은 중근이다.(나) 함수 $f \\left( x \\right)$의 최솟값은 음의 정수이다.","answer":"24","sourceHash":"c2550bb6de647ba1e2f4a8835850d5348c48ce3aa770dddf0f9ce3b1d9511d6f","steps":[{"id":"s1","latex":"x^n=64\\text{의 실근}:\\quad n\\text{ 홀수이면 }c,\\ n\\text{ 짝수이면 }\\pm c"},{"id":"s2","latex":"c=2^{6/n}"},{"id":"s3","latex":"\\text{서로 다른 두 중근 조건}\\Rightarrow n\\text{은 짝수},\\quad f(x)=x^2-c^2"},{"id":"s4","latex":"f(x)=x^2-c^2\\text{의 최솟값은 }-c^2=-2^{12/n}\\text{이고 음의 정수이다}"},{"id":"s5","latex":"\\frac{12}{n}\\in\\mathbb N,\\quad n\\text{ 짝수}"},{"id":"s6","latex":"n\\in\\{2,4,6,12\\}"},{"id":"s7","latex":"\\sum n=24"}],"diagram":null,"contentHash":"5692fbf72e1a37528d38caa9b484c2bd2035de410bb6db7ec60e1c2bbe0fa68f","questionHtml":"<p class=\"hp\">다음 조건을 만족시키는 최고차항의 계수가 <span class=\"heq\">\\(1\\)<\/span>인 이차함수 <span class=\"heq\">\\(f \\left( x \\right)\\)<\/span>가 존재하도록 하는 모든 자연수 <span class=\"heq\">\\(n\\)<\/span>의 값의 합을 구하시오.<\/p><p class=\"hp\"><span class=\"hscore\">[4점]<\/span><\/p><div class=\"hbox\"><p class=\"hp\">(가) <span class=\"heq\">\\(x\\)<\/span>에 대한 방정식 <span class=\"heq\">\\(\\left( x^{n} -64 \\right) \\,f \\left( x \\right) =0\\)<\/span>은 서로 다른 두 실근을 갖고, 각각의 실근은 중근이다.<\/p><p class=\"hp\">(나) 함수 <span class=\"heq\">\\(f \\left( x \\right)\\)<\/span>의 최솟값은 음의 정수이다.<\/p><\/div>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"85f6b5bc109f1ff9dc7cb2dcdc4f66d0a40d26003c4342da7638b234f8aad98f"};</script>
<script>window.HandStudyGuide={"itemId":17167,"sourceHash":"c2550bb6de647ba1e2f4a8835850d5348c48ce3aa770dddf0f9ce3b1d9511d6f","contentHash":"5692fbf72e1a37528d38caa9b484c2bd2035de410bb6db7ec60e1c2bbe0fa68f","overview":{"goal":"곱의 두 실근이 모두 중근이 되도록 이차함수와 자연수 \\(n\\)을 정해요.","firstLook":"\\(x^n=64\\)의 실근 개수는 \\(n\\)의 홀짝에 따라 달라져요. 각 근을 중근으로 만들려면 \\(f\\)가 같은 근을 가져야 해요.","conditions":[{"label":"서로 다른 두 실근","meaning":"곱 전체의 실근은 정확히 두 개여야 해요."},{"label":"각각 중근","meaning":"\\(x^n-64\\)에서 한 번 나오는 실근을 \\(f\\)가 한 번 더 가져야 해요."}]},"chapters":[{"id":"c1","label":"n의 홀짝과 f를 정해요","stepIds":["s1","s2","s3"],"question":"왜 \\(n\\)은 짝수이고 \\(f(x)=x^2-c^2\\)인가요?","hint":"\\(c=2^{6/n}\\)라 두고 홀수일 때 실근이 몇 개인지 봐요.","explanation":"\\(x^n=64\\)의 양의 실근은 \\(c=2^{6/n}\\)예요. \\(n\\)이 홀수이면 실근은 \\(c\\) 하나뿐이에요. 이 근을 중근으로 만들려면 \\(f(c)=0\\)이어야 하는데, 이차식의 남은 근을 새로 만들면 그 근은 곱에서 한 번만 나와 조건을 어기고, \\(f=(x-c)^2\\)이면 서로 다른 실근이 하나뿐이에요. 따라서 홀수는 불가능해요.\n\n\\(n\\)이 짝수이면 \\(x^n-64\\)의 실근은 \\(\\pm c\\)이고 둘 다 한 번씩 나와요. 둘을 모두 중근으로 만들려면 최고차항 계수 \\(1\\)인 이차식이 정확히 \\(f(x)=(x-c)(x+c)=x^2-c^2\\)여야 해요.","check":{"prompt":"짝수 \\(n\\)에서 \\(f\\)가 다른 근을 추가로 가질 수 있나요?","answer":"이미 \\(\\pm c\\) 두 근을 모두 가져야 하고 \\(f\\)는 이차식이므로 다른 근을 더 가질 수 없어요."}},{"id":"c2","label":"최솟값의 정수 조건을 써요","stepIds":["s4","s5"],"question":"\\(-2^{12/n}\\)이 음의 정수가 되려면 왜 \\(12/n\\)이 자연수인가요?","hint":"\\(2^{12/n}\\)이 정수이고 지수를 기약분수로 생각해요.","explanation":"\\(f(x)=x^2-c^2\\)의 최솟값은 \\(x=0\\)에서 \\(-c^2=-2^{12/n}\\)이에요. 이것이 음의 정수이려면 \\(2^{12/n}\\)이 정수여야 해요. \\(12/n=p/q\\)를 서로소인 자연수 \\(p,q\\)로 쓰면 어떤 정수 \\(N\\)에 대해 \\(N^q=2^p\\)예요. 오른쪽의 소인수는 \\(2\\)뿐이고 지수 \\(p\\)가 \\(q\\)의 배수여야 하므로, 서로소 조건에서 \\(q=1\\)이에요. 따라서 \\(12/n\\)은 자연수예요.","check":{"prompt":"최솟값은 실제로 어느 \\(x\\)에서 얻나요?","answer":"\\(f(x)=x^2-c^2\\)이므로 \\(x=0\\)에서 \\(-c^2\\)를 얻어요."}},{"id":"c3","label":"짝수 약수를 모두 더해요","stepIds":["s6","s7"],"question":"가능한 \\(n\\)은 무엇인가요?","hint":"\\(n\\)은 \\(12\\)의 약수이면서 짝수예요.","explanation":"\\(12/n\\)이 자연수이므로 \\(n\\)은 \\(12\\)의 약수이고, 앞에서 \\(n\\)은 짝수라고 했어요. 따라서 \\(n\\in\\{2,4,6,12\\}\\)예요. 합은 \\(2+4+6+12=24\\)예요.","check":{"prompt":"각 후보에서 곱은 정말 서로 다른 두 중근만 가지나요?","answer":"네. \\(x^n-64\\)와 \\(f=x^2-c^2\\)가 공통으로 \\(\\pm c\\)만 가지므로 두 근의 곱에서의 횟수는 각각 적어도 두 번이고 다른 실근은 없어요."}}],"takeaway":["곱의 중근 조건은 두 인수가 공통근을 가져야 한다는 뜻으로 읽어요.","홀짝에 따른 실근 개수를 먼저 나누면 이차식의 두 근을 정확히 배치할 수 있어요.","유리수 지수의 거듭제곱이 정수라는 조건은 소인수의 지수를 비교해 확인해요."]};</script>
