<script>window.HandStudyRecord={"itemId":17678,"sourceLabel":"2023 교육청 고3 수학미적분 7월 22번","adminYear":2023,"grade":3,"month":7,"number":22,"track":"미적분","points":4,"scoreStatus":"confirmed_4_direct","questionText":"최고차항의 계수가 양수인 사차함수 $f(x)$가 있다. 실수 $t$에 대하여 함수 $g(x)$를\n $g \\left(x \\right)=f \\left(x \\right)-x-f \\left(t \\right)+t$\n라 할 때, 방정식 $g(x)=0$의 서로 다른 실근의 개수를 $h(t)$라 하자. 두 함수 $f(x)$와 $h(t)$가 다음 조건을 만족시킨다.\n (가) $\\lim _{t \\,\\rightarrow\\,-1} \\left\\{ h(t)-h(-1) \\right\\} = \\lim _{t \\,\\rightarrow\\, 1} \\left\\{ h(t)-h(1) \\right\\} =2$ (나) $\\int _{0} ^{\\alpha } {} f \\left(x \\right)dx= \\int _{0} ^{\\alpha } {} | f \\left(x \\right) | dx$를 만족시키는 실수 $\\alpha$의 최솟값은 $-1$이다.(다) 모든 실수 $x$에 대하여 $\\frac{d}{dx} \\int _{0} ^{x} {} \\left\\{ f \\left(u \\right)-ku \\right\\} du \\geq 0$이 되도록 하는 실수 $k$의 최댓값은 $f ' ( \\sqrt{2})$이다.\n$f(6)$의 값을 구하시오. [4점]","answer":"182","sourceHash":"bdf389467da7e83aa76756e0a8c1fa11cafdb0ef3f95cd5696057d84271ca77c","steps":[{"id":"s1","latex":"F(x)=f(x)-x,\\qquad g(x)=0\\iff F(x)=F(t)"},{"id":"s2","latex":"h(t)-h(\\pm1)\\to2\\Rightarrow F(x)=a(x^2-1)^2+C"},{"id":"s3","latex":"f(-1)=0\\Rightarrow C=1,\\qquad f(x)=a(x^2-1)^2+x+1"},{"id":"s4","latex":"f(x)\\ge kx\\ (\\forall x),\\quad k\\text{의 최댓값}=f'(\\sqrt2)\\Rightarrow f(\\sqrt2)=\\sqrt2f'(\\sqrt2)"},{"id":"s5","latex":"a+\\sqrt2+1=\\sqrt2(4\\sqrt2a+1)\\Rightarrow a=\\frac17"},{"id":"s6","latex":"f(6)=\\frac{35^2}{7}+7=182"}],"diagram":null,"contentHash":"8bd5614964eac1f75f3244eff53032e979f2e98e467f9524a1979ea8441a25b0","questionHtml":"<p class=\"hp\">최고차항의 계수가 양수인 사차함수 <span class=\"heq\">\\(f(x)\\)<\/span>가 있다. 실수 <span class=\"heq\">\\(t\\)<\/span>에 대하여 함수 <span class=\"heq\">\\(g(x)\\)<\/span>를<\/p><p class=\"hp\">&emsp;&emsp;<span class=\"heq\">\\(g \\left(x \\right)=f \\left(x \\right)-x-f \\left(t \\right)+t\\)<\/span><\/p><p class=\"hp\">라 할 때, 방정식 <span class=\"heq\">\\(g(x)=0\\)<\/span>의 서로 다른 실근의 개수를 <span class=\"heq\">\\(h(t)\\)<\/span>라 하자. 두 함수 <span class=\"heq\">\\(f(x)\\)<\/span>와 <span class=\"heq\">\\(h(t)\\)<\/span>가 다음 조건을 만족시킨다.<\/p><div class=\"hbox\"><p class=\"hp\">(가) <span class=\"heq\">\\(\\lim\\limits_{t \\,\\rightarrow\\,-1} \\left\\{ h(t)-h(-1) \\right\\} = \\lim\\limits_{t \\,\\rightarrow\\, 1} \\left\\{ h(t)-h(1) \\right\\} =2\\)<\/span><\/p><p class=\"hp\">(나) <span class=\"heq\">\\(\\int_{0}^{\\alpha } {} f \\left(x \\right)dx= \\int_{0}^{\\alpha } {} | f \\left(x \\right) | dx\\)<\/span>를 만족시키는 실수 <span class=\"heq\">\\(\\alpha\\)<\/span>의 최솟값은 <span class=\"heq\">\\(-1\\)<\/span>이다.<\/p><p class=\"hp htall\">(다) 모든 실수 <span class=\"heq\">\\(x\\)<\/span>에 대하여 <span class=\"heq\">\\(\\dfrac{d}{dx} \\int_{0}^{x} {} \\left\\{ f \\left(u \\right)-ku \\right\\} du \\geq 0\\)<\/span>이 되도록 하는 실수 <span class=\"heq\">\\(k\\)<\/span>의 최댓값은 <span class=\"heq\">\\(f' ( \\sqrt{2})\\)<\/span>이다.<\/p><\/div><p class=\"hp\"><span class=\"heq\">\\(f(6)\\)<\/span>의 값을 구하시오. <span class=\"hscore\">[4점]<\/span><\/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"e26c74e5301b115fb0832f72e1139c1d52e210e9fa5e94bbce198812c7a899d9"};</script>
<script>window.HandStudyGuide={"itemId":17678,"sourceHash":"bdf389467da7e83aa76756e0a8c1fa11cafdb0ef3f95cd5696057d84271ca77c","contentHash":"8bd5614964eac1f75f3244eff53032e979f2e98e467f9524a1979ea8441a25b0","overview":{"goal":"\\(F(x)=f(x)-x\\)의 수평선 교점 개수로 사차함수의 모양을 복원하고, 적분 조건과 접선 조건으로 상수를 정해요.","firstLook":"\\(g(x)=0\\)은 \\(F(x)=F(t)\\)예요. 따라서 \\(h(t)\\)는 높이 \\(F(t)\\)의 수평선이 \\(F\\)와 만나는 점의 개수예요.","conditions":[{"label":"조건 (가)","meaning":"\\(t=\\pm1\\)에서 수평선 교점 수가 주변보다 두 개 적어지는 W자 사차함수의 두 최솟값을 정해요."},{"label":"조건 (나)","meaning":"\\([-1,0]\\)에서 \\(f\\ge0\\)이고 왼쪽 끝에서 \\(f(-1)=0\\)임을 알려 줘요."},{"label":"조건 (다)","meaning":"\\(f(x)-kx\\ge0\\)의 최대 \\(k\\)에서 직선 \\(y=kx\\)가 \\(x=\\sqrt2\\)에서 \\(f\\)에 접해요."}]},"chapters":[{"id":"c1","label":"교점 개수로 사차함수의 모양을 정해요","stepIds":["s1","s2"],"question":"왜 \\(F\\)는 \\(a(x^2-1)^2+C\\) 꼴이 되나요?","hint":"\\(t=\\pm1\\)에서 같은 높이의 두 극솟값이 생겨야 주변 수평선에 교점 두 개가 추가돼요.","explanation":"\\(F=f-x\\)라 두면 \\(g(x)=0\\iff F(x)=F(t)\\)예요. 조건 (가)의 극한값이 \\(2\\)라는 것은 \\(t=\\pm1\\)의 높이에서보다 바로 위 높이에서 교점이 각각 두 개 더 생긴다는 뜻이에요. 최고차항 계수가 양수인 사차함수에서 이는 \\(x=-1,1\\)이 같은 높이의 두 극솟값이고 그 사이에 한 극댓값이 있는 경우예요. 가운데 극점의 좌표를 \\(r\\)라 하면 \\(F'(x)=\\lambda(x^2-1)(x-r)\\)인 \\(\\lambda>0\\)로 쓸 수 있어요. 두 극솟값의 높이가 같으므로 \\(0=F(1)-F(-1)=\\int_{-1}^{1}F'(x)\\,dx\\)이고, 홀수인 부분의 적분은 \\(0\\)이어서 \\(r=0\\)이 돼요. 따라서 \\(F'(x)=4ax(x^2-1)\\)인 어떤 \\(a>0\\)이고, 적분하면 \\(F(x)=a(x^2-1)^2+C\\)예요.","check":{"prompt":"두 극솟값의 높이가 같아야 하는 이유는 무엇인가요?","answer":"두 점 \\(t=-1,1\\)에서 같은 방식으로 교점 수가 두 개 줄어야 하나의 사차함수 수평선 구조와 맞기 때문이에요."}},{"id":"c2","label":"적분 조건으로 상수를 정해요","stepIds":["s3"],"question":"적분과 절댓값 적분이 같다는 것은 무엇을 뜻하나요?","hint":"\\(|f|-f\\)는 항상 \\(0\\) 이상이에요.","explanation":"\\(\\int_0^\\alpha f=\\int_0^\\alpha|f|\\)가 성립하려면 두 끝점 사이에서 \\(|f|-f=0\\), 즉 \\(f\\ge0\\)이어야 해요. 그런 \\(\\alpha\\)의 최솟값이 \\(-1\\)이므로 경계에서 \\(f(-1)=0\\)이에요. \\(f(x)=F(x)+x=a(x^2-1)^2+C+x\\)에 넣으면 \\(C-1=0\\), 따라서 \\(C=1\\)이에요.","check":{"prompt":"왜 \\(f(-1)>0\\)일 수 없나요?","answer":"연속성 때문에 \\(-1\\)의 왼쪽에서도 잠시 양수가 되어 더 작은 \\(\\alpha\\)도 조건을 만족하게 되므로 최솟값이 \\(-1\\)일 수 없어요."}},{"id":"c3","label":"최대 기울기의 접점을 써요","stepIds":["s4","s5"],"question":"\\(k\\)의 최댓값에서 왜 \\(f(\\sqrt2)=\\sqrt2 f'(\\sqrt2)\\)인가요?","hint":"적분의 도함수는 \\(f(x)-kx\\)예요.","explanation":"조건 (다)는 모든 \\(x\\)에서 \\(f(x)-kx\\ge0\\)이라는 뜻이에요. \\(k\\)를 최대까지 올리면 \\(x>0\\)인 어떤 점 \\(r\\)에서 직선 \\(y=kx\\)가 그래프에 처음 접하므로 \\(f(r)=kr\\), \\(f'(r)=k\\)예요. 두 식에서 \\(k\\)를 없애고 현재의 \\(f\\)를 넣으면 \\(a(3r^4-2r^2-1)=1\\)이고, \\(a>0\\)이므로 \\(r>1\\)이에요. \\(x>1\\)에서는 \\(f''(x)=4a(3x^2-1)>0\\)이어서 \\(f'\\)가 증가해요. 그런데 최댓값 \\(k=f'(r)\\)가 문제에서 \\(f'(\\sqrt2)\\)와 같다고 했으므로 \\(r=\\sqrt2\\)예요. 이제 \\(f(\\sqrt2)=\\sqrt2 f'(\\sqrt2)\\)에 \\(f(\\sqrt2)=a+\\sqrt2+1\\), \\(f'(\\sqrt2)=4\\sqrt2a+1\\)을 넣으면 \\(a+\\sqrt2+1=8a+\\sqrt2\\), 따라서 \\(a=1/7\\)이에요.","check":{"prompt":"접점에서는 값과 기울기 중 무엇이 각각 같아야 하나요?","answer":"함숫값은 \\(f(x)=kx\\), 기울기는 \\(f'(x)=k\\)가 되어야 해요."}},{"id":"c4","label":"요구한 함숫값을 계산해요","stepIds":["s6"],"question":"\\(f(6)\\)은 얼마인가요?","hint":"\\(6^2-1=35\\)예요.","explanation":"\\(f(6)=\\frac17(6^2-1)^2+6+1=35^2/7+7=175+7=182\\)예요.","check":{"prompt":"최고차항의 계수가 양수라는 조건과 \\(a=1/7\\)은 맞나요?","answer":"\\(a=1/7>0\\)이므로 맞아요."}}],"takeaway":["방정식의 실근 개수는 수평선과 그래프의 교점 수로 읽어요.","절댓값 적분과 원래 적분의 equality는 구간 전체의 부호를 정해요.","모든 x에서 성립하는 부등식의 최적 상수는 접점의 값과 기울기를 함께 써요."]};</script>
