  <script>window.HandStudyRecord={"itemId":17678,"sourceLabel":"2023 교육청 고3 수학미적분 7월 22번","adminYear":2023,"grade":3,"month":7,"number":22,"track":"미적분","points":4,"scoreStatus":"confirmed_4_direct","questionText":"최고차항의 계수가 양수인 사차함수 $f(x)$가 있다. 실수 $t$에 대하여 함수 $g(x)$를\n $g \\left(x \\right)=f \\left(x \\right)-x-f \\left(t \\right)+t$\n라 할 때, 방정식 $g(x)=0$의 서로 다른 실근의 개수를 $h(t)$라 하자. 두 함수 $f(x)$와 $h(t)$가 다음 조건을 만족시킨다.\n (가) $\\lim _{t \\,\\rightarrow\\,-1} \\left\\{ h(t)-h(-1) \\right\\} = \\lim _{t \\,\\rightarrow\\, 1} \\left\\{ h(t)-h(1) \\right\\} =2$ (나) $\\int _{0} ^{\\alpha } {} f \\left(x \\right)dx= \\int _{0} ^{\\alpha } {} | f \\left(x \\right) | dx$를 만족시키는 실수 $\\alpha$의 최솟값은 $-1$이다.(다) 모든 실수 $x$에 대하여 $\\frac{d}{dx} \\int _{0} ^{x} {} \\left\\{ f \\left(u \\right)-ku \\right\\} du \\geq 0$이 되도록 하는 실수 $k$의 최댓값은 $f ' ( \\sqrt{2})$이다.\n$f(6)$의 값을 구하시오. [4점]","answer":"182","sourceHash":"bdf389467da7e83aa76756e0a8c1fa11cafdb0ef3f95cd5696057d84271ca77c","steps":[{"id":"s1","latex":"F(x)=f(x)-x,\\qquad g(x)=0\\iff F(x)=F(t)"},{"id":"s2","latex":"h(t)-h(\\pm1)\\to2\\Rightarrow F(x)=a(x^2-1)^2+C"},{"id":"s3","latex":"f(-1)=0\\Rightarrow C=1,\\qquad f(x)=a(x^2-1)^2+x+1"},{"id":"s4","latex":"f(x)\\ge kx\\ (\\forall x),\\quad k_{\\max}=f'(\\sqrt2)\\Rightarrow f(\\sqrt2)=\\sqrt2f'(\\sqrt2)"},{"id":"s5","latex":"a+\\sqrt2+1=\\sqrt2(4\\sqrt2a+1)\\Rightarrow a=\\frac17"},{"id":"s6","latex":"f(6)=\\frac{35^2}{7}+7=182"}],"diagram":null,"contentHash":"d2a46d354963198c6069ab733bf72fdb1e4890d1034adc525f0de265d93373e3","questionHtml":"\u003cp class=\"hp\">최고차항의 계수가 양수인 사차함수 \u003cspan class=\"heq\">\\(f(x)\\)\u003c/span>가 있다. 실수 \u003cspan class=\"heq\">\\(t\\)\u003c/span>에 대하여 함수 \u003cspan class=\"heq\">\\(g(x)\\)\u003c/span>를\u003c/p>\u003cp class=\"hp\">&emsp;&emsp;\u003cspan class=\"heq\">\\(g \\left(x \\right)=f \\left(x \\right)-x-f \\left(t \\right)+t\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">라 할 때, 방정식 \u003cspan class=\"heq\">\\(g(x)=0\\)\u003c/span>의 서로 다른 실근의 개수를
