ightarrow g(t)=9"},{"explanation":{"body":"\\(x\\ge3\\)에서 이차함수 조각은 감소하고 로그함수 조각은 증가합니다. 따라서 \\([t-1,t+1]\\) 안의 각 조각은 자기 쪽 끝점에서 가장 크므로 전체 최댓값은 \\(f(t-1)\\)과 \\(f(t+1)\\)만 비교하면 됩니다.","skillTags":["구간최댓값","단조성"],"title":"구간 최댓값이 양 끝 중 하나인 이유"},"id":"s4","latex":"t>4\\text{에서는 왼쪽 조각이 감소하고 로그 조각이 증가하므로 }g(t)\\text{는 }f(t-1),\\ f(t+1)\\text{ 중 크거나 같은 값이다.}"},{"id":"s5","latex":"4\u003ct\\le6\\text{에서는 }f(t-1)\\ge5"},{"id":"s6","latex":"t>6\\text{에서는 }f(t+1)=a\\log_4(t-4)\\text{가 증가하므로 경계 }t\\to6+\\text{만 확인하면 된다.}"},{"id":"s7","latex":"a\\log_4 2=\\frac a2\\ge5\\Rightarrow a\\ge10"},{"id":"s8","latex":"a=10\\text{이면 모든 }t\\ge0\\text{에서 }g(t)\\ge5\\text{이고 }g(0)=5"},{"id":"s9","latex":"\\therefore\\ \\boxed{10}"}],"track":"공통"};</script>
