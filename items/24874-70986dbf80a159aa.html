htarrow g(t)=9"},{"explanation":{"body":"\\(x\\ge3\\)에서 이차함수 조각은 감소하고 로그함수 조각은 증가합니다. 따라서 \\([t-1,t+1]\\) 안의 각 조각은 자기 쪽 끝점에서 가장 크므로 전체 최댓값은 \\(f(t-1)\\)과 \\(f(t+1)\\)만 비교하면 됩니다.","skillTags":["구간최댓값","단조성"],"title":"구간 최댓값이 양 끝 중 하나인 이유"},"id":"s4","latex":"t>4\\text{에서는 왼쪽 조각이 감소하고 로그 조각이 증가하므로 }g(t)\\text{는 }f(t-1),\\ f(t+1)\\text{ 중 크거나 같은 값이다.}"},{"id":"s5","latex":"4\u003ct\\le6\\text{에서는 }f(t-1)\\ge5"},{"id":"s6","latex":"t>6\\text{에서는 }f(t+1)=a\\log_4(t-4)\\text{가 증가하므로 경계 }t\\to6+\\text{만 확인하면 된다.}"},{"id":"s7","latex":"a\\log_4 2=\\frac a2\\ge5\\Rightarrow a\\ge10"},{"id":"s8","latex":"a=10\\text{이면 모든 }t\\ge0\\text{에서 }g(t)\\ge5\\text{이고 }g(0)=5"},{"id":"s9","latex":"\\therefore\\ \\boxed{10}"}],"track":"공통"};</script>
<script>window.HandStudyGuide={"itemId":24874,"sourceHash":"38cc54268a4a590a1688cb9086789362cddc6f7727b857dad2f1289a3212114e","contentHash":"b5e50c6af90d18bbe5d61213a32e365f60fd9552db5a180a954546f8c001aadb","overview":{"firstLook":"이차함수 조각은 \\(f(x)=-(x-3)^2+9\\)이고 \\(f(1)=f(5)=5\\)예요. \\(0\\le t\\le2\\)에서는 오른쪽 끝 \\(t+1\\)까지 증가하므로 \\(g(t)=f(t+1)\\ge5\\), \\(2\\le t\\le4\\)에서는 꼭짓점 3을 포함하므로 \\(g(t)=9\\)예요.","goal":"움직이는 길이 2의 구간에서 최댓값이 항상 5 이상이 되게 하는 가장 작은 계수를 구해요.","conditions":[{"meaning":"\\(t=0\\)이면 구간 [-1,1]에서 증가하므로 최댓값은 \\(f(1)=5\\)예요.","label":"움직이는 구간의 위치"},{"meaning":"각 조각은 해당 구간에서 단조이므로 내부값은 자기 쪽 끝값보다 클 수 없어요.","label":"감소·증가 조각의 경쟁"}]},"chapters":[{"question":"왜 \\(t=0\\)에서 이미 값 5가 나오나요?","check":{"prompt":"왜 \\(t=0\\)에서 이미 값 5가 나오나요?","answer":"\\(t=0\\)이면 구간 [-1,1]에서 증가하므로 최댓값은 \\(f(1)=5\\)예요."},"stepIds":["s1","s2","s3"],"id":"c1","explanation":"이차함수 조각은 \\(f(x)=-(x-3)^2+9\\)이고 \\(f(1)=f(5)=5\\)예요. \\(0\\le t\\le2\\)에서는 오른쪽 끝 \\(t+1\\)까지 증가하므로 \\(g(t)=f(t+1)\\ge5\\), \\(2\\le t\\le4\\)에서는 꼭짓점 3을 포함하므로 \\(g(t)=9\\)예요.","hint":"이차함수의 꼭짓점 3과 구간 [t-1,t+1]의 위치를 비교해요.","label":"움직이는 구간의 위치"},{"question":"t가 4를 넘으면 왜 구간 안쪽이 아니라 두 끝을 비교하나요?","check":{"prompt":"t가 4를 넘으면 왜 구간 안쪽이 아니라 두 끝을 비교하나요?","answer":"각 조각은 해당 구간에서 단조이므로 내부값은 자기 쪽 끝값보다 클 수 없어요."},"stepIds":["s4","s5","s6"],"id":"c2","explanation":"\\(t>4\\)에서는 이차함수 조각은 감소하고 로그함수 조각은 증가해요. 따라서 구간 안쪽에서 더 큰 값이 새로 생기지 않고 왼쪽 끝 \\(f(t-1)\\)과 오른쪽 끝 \\(f(t+1)\\)을 비교하면 돼요. \\(4<t\\le6\\)에서는 \\(t-1\\in(3,5]\\)이어서 왼쪽 값이 5 이상이에요.","hint":"3의 오른쪽에서는 이차함수가 감소하고 로그 조각은 증가해요.","label":"감소·증가 조각의 경쟁"},{"question":"a가 10보다 작으면 어느 t에서 조건이 깨지나요?","check":{"prompt":"a가 10보다 작으면 어느 t에서 조건이 깨지나요?","answer":"a<10이면 \\(t\\to 6+\\)에서 a \\(\\log_4(t-4)\\to a/2<5\\)라 g(t)<5인 t가 생겨요."},"stepIds":["s7","s8","s9"],"id":"c3","explanation":"\\(t>6\\)에서는 오른쪽 끝의 로그값 \\(a\\log_4(t-4)\\)가 증가하므로 가장 작은 쪽은 \\(t\\to6+\\)예요. 그 극한이 \\(a\\log_4 2=a/2\\)이므로 \\(a/2\\ge5\\), 즉 \\(a\\ge10\\)이어야 해요. \\(a=10\\)이면 모든 구간에서 5 이상이고 \\(g(0)=5\\)라 최솟값이 실제로 5예요.","hint":"t를 6보다 조금 크게 보내 오른쪽 끝값의 극한을 봐요.","label":"하한 5의 달성"}],"takeaway":["x는 6에서 두 조각 값은 모두 0이라 연결된다.","t는 4,6 경계를 양쪽 경우에 포함해 확인했다.","a는 10에서 하한 5가 실제 달성된다."]};</script>
