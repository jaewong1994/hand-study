heq\">\\(k&gt;1\\)\u003c/span>이므로 방정식 \u003cspan class=\"heq\">\\(2^x = kx +1\\)\u003c/span>은 오직 하나의 양의 실근 \u003cspan class=\"heq\">\\(d\\)\u003c/span> 를 갖는다. 따라서 모든 자연수 \u003cspan class=\"heq\">\\(n\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(a_{n+1} - a_n = d\\)\u003c/span>이고, 수열 \u003cspan class=\"heq\">\\(\\left\\{a_n \\right\\}\\)\u003c/span>은 공차가 \u003cspan class=\"heq\">\\(d\\)\u003c/span>인 등차수열이다.점 \u003cspan class=\"heq\">\\({ Q}_n\\)\u003c/span>의 좌표가 \u003cspan class=\"heq\">\\((a_{n+1} , \\, 2^{a_n} )\\)\u003c/span>이므로 \u003cspan class=\"heq\">\\(A_n = \\frac{1}{2} ( a_{n+1} - a_n ) ( 2^{a_{n+1}} - 2^{a_n} )\\)\u003c/span>이다. \u003cspan class=\"heq\">\\(\\frac{A_3}{A_1} = 16\\)\u003c/span>이므로 \u003cspan class=\"heq\">\\(d\\)\u003c/span>의 값은 \u003cspan class=\"heq\">\\(\\boxed{\\,㈎\\,}\\)\u003c/span>이고, 수열 \u003cspan class=\"heq\">\\(\\left\\{ a_n \\right\\}\\)\u003c/span>의 일반항은 \u003cspan class=\"heq\">\\(a_n =\\)\u003c/span>\u003cspan class=\"heq\">\\(\\boxed{\\,㈏\\,}\\)\u003c/span>이다. 따라서 모든 자연수 \u003cspan class=\"heq\">\\(n\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(A_n =\\)\u003c/span>\u003cspan class=\"heq\">\\(\\boxed{\\,㈐\\,}\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp>위의 (가)에 알맞은 수를 \u003cspan class=\"heq\">\\(p\\)\u003c/span>, (나)와 (다)에 알맞은 식을 각각 \u003cspan class=\"heq\">\\(f(n), \\, g(n)\\)\u003c/span>이라 할 때, \u003cspan class=\"heq\">\\(p+ \\frac{g(4)}{ f(2)}\\)\u003c/span>의 값은? [4점]\u003c/p>\u003cfigure>\u003cimg class=\"hfig\" src=\"../assets/csat/24717-99efcce5bdd3a80c.png\" alt=\"2020년 시행 수능 16번 문항 그림 \" style=\"max-width:100%;width:420px\">\u003c/figure>\u003cdiv class=\"hchoices\">\u003cdiv class=\"hch\">① \u003cspan class=\"heq\">\\(118\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">② \u003cspan class=\"heq\">\\(121\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">③ \u003cspan class=\"heq\">\\(124\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">④ \u003cspan class=\"heq\">\\(127\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">⑤ \u003cspan class=\"heq\">\\(130\\)\u003c/span>\u003c/div>\u003c/div>","questionText":"상수 $k (k>1)$에 대하여 다음 조건을 만족시키는 수열 $\\left\\{ a_n \\right\\}$이 있다.\n모든 자연수 $n$에 대하여 $a_n \u003c a_n+1$이고 곡선 $y = 2^x$위의 두 점 ${ P }_n( a_n , \\,2^{a_n} )$, ${ P }_n+1 ( a_n+1 , \\,2^{a_n+1} )$을 지나는 직선의 기울기는 $k \\times 2^{a_n }$이다.\n점 ${P}_n$을 지나고 $x$축에 평행한 직선과 점 ${ P}_n+1$을 지나고 $y$축에 평행한 직선이 만나는 점을 ${ Q}_n$이라 하고 삼각형 ${ P}_n { Q}_n { P}_n+1$의 넓이를 $A_n$이라 하자. 다음은 $a_1 = 1$, $\\frac{A_3}{A_1} = 16$일 때, $A_n$을 구하는 과정이다.\n두 점 ${ P}_n , { P}_n+1$을 지나는 직선의 기울기가 $k \\times a_n$이므로 $2 ^{a _{n+1} -a _{n}} =k(a _{n+1} -a _{n} )+1$이다. 즉, 모든 자연수 $n$에 대하여 $a_n+1 - a_n$은 방정식 $2^x = kx +1$의 해이다.$k>1$이므로 방정식 $2^x = kx +1$은 오직 하나의 양의 실근 $d$ 를 갖는다. 따라서 모든 자연수 $n$에 대하여 $a_n+1 - a_n = d$이고, 수열 $\\left\\{a_n \\right\\}$은 공차가 $d$인 등차수열이다.점 ${ Q}_n$의 좌표가 $(a_n+1 , \\, 2^{a_n} )$이므로 $A_n = \\frac{1}{2} ( a_n+1 - a_n ) ( 2^{a_n+1} - 2^{a_n} )$이다. $\\frac{A_3}{A_1} = 16$이므로 $d$의 값은 $\\boxed{\\,㈎\\,}$이고, 수열 $\\left\\{ a_n \\right\\}$의 일반항은 $a_n =$$\\boxed{\\,㈏\\,}$이다. 따라서 모든 자연수 $n$에 대하여 $A_n =$$\\boxed{\\,㈐\\,}$이다.\n위의 (가)에 알맞은 수를 $p$, (나)와 (다)에 알맞은 식을 각각 $f(n), \\, g(n)$이라 할 때, $p+ \\frac{g(4)}{ f(2)}$의 값은? [4점]\n① $118$ ② $121$ ③ $124$ ④ $127$ ⑤ $130$","sourceHash":"94101444aa060d538bebd0d044d9d452c5b863344c83e7c8ae8b2ab5c7e8e080","sourceKind":"csat","sourceLabel":"2020년 시행 수능 · 2021학년도 · 가형 · 16번","steps":[{"id":"s1","latex":"\\frac{2^{a_{n+1}}-2^{a_n}}{a_{n+1}-a_n}=k2^{a_n}\\ \\Rightarrow\\ 2^{a_{n+1}-a_n}=k(a_{n+1}-a_n)+1"},{"id":"s2","latex":"2^x-kx-1\\text{은 아래로 볼록하고 }x=0\\text{에서 }0,\\quad \\ln2-k\u003c0"},{"id":"s3","latex":"\\text{양의 근 }d\\text{가 하나이므로 }a_{n+1}-a_n=d>0"},{"id":"s4","latex":"a_1=1\\ \\Rightarrow\\ a_n=1+(n-1)d"},{"id":"s5","latex":"A_n=\\frac12d\\,2^{a_n}(2^d-1)"},{"id":"s6","latex":"\\frac{A_3}{A_1}=2^{a_3-a_1}=2^{2d}=16\\ \\Rightarrow\\ d=2"},{"id":"s7","latex":"p=2,\\quad f(n)=2n-1,\\quad g(n)=A_n=3\\cdot2^{2n-1}"},{"id":"s8","latex":"p+\\frac{g(4)}{f(2)}=2+\\frac{3\\cdot2^7}{3}=\\boxed{130}\\quad\\text{⑤}"}],"track":"가형"};</script>
