<script>window.HandStudyRecord={"itemId":16541,"sourceLabel":"2019 평가원 고3 수리가형 9월 21번","adminYear":2019,"grade":3,"month":9,"number":21,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"좌표평면에서 두 점 ${A}(- 2,\\, 0)$, ${B}(2,\\, 0)$에 대하여 다음 조건을 만족시키는 직사각형의 넓이의 최댓값은? [4점]\n직사각형 위를 움직이는 점 ${P}$에 대하여 ${\\overline{PA}\\,+ \\overline{PB}}$의 값은 점 ${P}$의 좌표가 $(0,\\, 6)$일 때 최대이고 $\\left(\\frac{5}{2},\\, \\frac{3}{2} \\right)$일 때 최소이다.\n① $\\frac{200}{19}$ ② $\\frac{210}{19}$ ③ $\\frac{220}{19}$ ④ $\\frac{230}{19}$ ⑤ $\\frac{240}{19}$","answer":"⑤","sourceHash":"ab212824ffc94ef65dc42bd639c40966654a87b657b8345f38e197437ca07be4","steps":[{"id":"s1","latex":"U=(0,6),\\quad V=(5/2,3/2)"},{"id":"s2","latex":"\\text{최대 거리합의 타원}:\\quad x^2/40+y^2/36=1"},{"id":"s3","latex":"\\text{최소 거리합의 타원}:\\quad x^2/10+y^2/6=1"},{"id":"s4","latex":"U\\text{는 직사각형의 꼭짓점};\\quad U,V\\text{에서 두 타원의 접선은 }y=6,\\ x+y=4"},{"id":"s5","latex":"\\text{(I) }V\\text{가 변의 내부}:\\quad\\text{평행한 변 }x+y=4,6"},{"id":"s6","latex":"\\text{나머지 두 변 }x-y=-6,2p\\quad(p\\ge1/2)\\Rightarrow S=2p+6"},{"id":"s7","latex":"(3+p,3-p)\\text{는 최대 타원의 내부 또는 경계}"},{"id":"s8","latex":"\\frac{(3+p)^2}{40}+\\frac{(3-p)^2}{36}\\le1\\iff(19p-63)(p+3)\\le0"},{"id":"s9","latex":"S\\le\\frac{240}{19};\\quad p=63/19\\text{에서 네 꼭짓점 모두 최대 타원 안, }V\\text{는 변 위}"},{"id":"s10","latex":"\\text{(II) }V\\text{가 꼭짓점이고 }U\\text{와 이웃}:\\quad \\overrightarrow{VU}=(-5/2,9/2)"},{"id":"s11","latex":"\\text{나머지 변 방향은 }(9,5)\\text{ 또는 }(-9,-5)"},{"id":"s12","latex":"(9,5):U\\text{에서 }y>6,\\quad(-9,-5):V\\text{에서 }x+y\u003c4\\Rightarrow\\text{모두 불가}"},{"id":"s13","latex":"\\therefore U,V\\text{는 맞은편 꼭짓점};\\quad\\xi=(x+y)/\\sqrt2,\\ \\eta=(-x+y)/\\sqrt2"},{"id":"s14","latex":"\\overrightarrow{VU}\\text{의 새 좌표}=(\\sqrt2,7/\\sqrt2)"},{"id":"s15","latex":"\\text{변 방향 }e=(\\cos\\theta,-\\sin\\theta),\\ f=(\\sin\\theta,\\cos\\theta),\\quad0\\le\\theta\u003c\\pi/2"},{"id":"s16","latex":"\\overrightarrow{VU}=ae+bf\\ (a,b>0)\\Rightarrow a=\\sqrt2\\cos\\theta-\\frac7{\\sqrt2}\\sin\\theta,\\ b=\\sqrt2\\sin\\theta+\\frac7{\\sqrt2}\\cos\\theta"},{"id":"s17","latex":"S=ab=7\\cos2\\theta-\\frac{45}{4}\\sin2\\theta\\le7\u003c\\frac{240}{19}"},{"id":"s18","latex":"\\text{따라서 넓이의 최댓값}=\\boxed{240/19}"}],"diagram":null,"contentHash":"fff9e9125bd028609183bc59e1279b07100e718d2cfd08650c36cf8f6151abe9","questionHtml":"\u003cp class=\"hp\">좌표평면에서 두 점 \u003cspan class=\"heq\">\\({A}(- 2,\\, 0)\\)\u003c/span>, \u003cspan class=\"heq\">\\({B}(2,\\, 0)\\)\u003c/span>에 대하여 다음 조건을 만족시키는 직사각형의 넓이의 최댓값은? \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp htall\">직사각형 위를 움직이는 점 \u003cspan class=\"heq\">\\({P}\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\({\\overline{PA}\\,+ \\overline{PB}}\\)\u003c/span>의\u003c/p>\u003cp class=\"hp htall\">값은 점 \u003cspan class=\"heq\">\\({P}\\)\u003c/span>의 좌표가 \u003cspan class=\"heq\">\\((0,\\, 6)\\)\u003c/span>일때 최대이고 \u003cspan class=\"heq\">\\(\\left(\\dfrac{5}{2},\\, \\dfrac{3}{2} \\right)\\)\u003c/span>일 때\u003c/p>\u003cp class=\"hp\">최소이다.\u003c/p>\u003c/div>\u003cp class=\"hp htall\">① \u003cspan class=\"heq\">\\(\\dfrac{200}{19}\\)\u003c/span>&emsp;② \u003cspan class=\"heq\">\\(\\dfrac{210}{19}\\)\u003c/span>&emsp;③ \u003cspan class=\"heq\">\\(\\dfrac{220}{19}\\)\u003c/span>&emsp;④ \u003cspan class=\"heq\">\\(\\dfrac{230}{19}\\)\u003c/span>&emsp;⑤ \u003cspan class=\"heq\">\\(\\dfrac{240}{19}\\)\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"58d2bab42efba325fb2ad18c5062043d0093e7f89eadd1eff0b9d59fcbf223ba"};</script>
<script>window.HandStudyGuide={"itemId":16541,"sourceHash":"ab212824ffc94ef65dc42bd639c40966654a87b657b8345f38e197437ca07be4","contentHash":"fff9e9125bd028609183bc59e1279b07100e718d2cfd08650c36cf8f6151abe9","overview":{"goal":"거리합의 최대·최소를 나타내는 두 타원 사이에 직사각형이 놓인다는 뜻을 읽고, 최소점 V의 위치에 따라 모든 배치를 나눠 넓이를 비교해요.","firstLook":"직사각형 위 모든 점의 거리합은 V에서 가장 작고 U에서 가장 커요. 따라서 직사각형은 작은 타원 바깥과 큰 타원 안에 있고, V와 U에서는 해당 타원에 닿아요.","conditions":[{"label":"최대점 U","meaning":"\\(U=(0,6)\\)은 큰 타원 위의 직사각형 꼭짓점이에요."},{"label":"최소점 V","meaning":"\\(V=(5/2,3/2)\\)은 작은 타원 위의 변 내부 또는 꼭짓점이에요."}]},"chapters":[{"id":"c1","label":"두 거리합을 타원으로 바꿔요","stepIds":["s1","s2","s3","s4"],"question":"U와 V를 지나는 두 타원의 방정식은 어떻게 정해질까요?","hint":"초점이 \\((\\pm2,0)\\)이므로 \\(c=2\\)이고 거리합의 절반이 장반경이에요.","explanation":"U에서 두 초점까지 거리는 각각 \\(\\sqrt{40}\\)이므로 거리합은 \\(4\\sqrt{10}\\), 장반경은 \\(2\\sqrt{10}\\)이에요. \\(b^2=a^2-c^2=40-4=36\\)이라 큰 타원은 \\(x^2/40+y^2/36=1\\)이에요. V에서의 거리합은 \\(2\\sqrt{10}\\), 장반경은 \\(\\sqrt{10}\\)이고 \\(b^2=10-4=6\\)이라 작은 타원은 \\(x^2/10+y^2/6=1\\)이에요. U에서 큰 타원의 접선은 \\(y=6\\), V에서 작은 타원의 접선은 \\(x+y=4\\)예요. 최대·최소가 변 위에서 생기면 그 변은 이 접선과 일치해야 해요.","check":{"prompt":"작은 타원의 V에서 접선이 \\(x+y=4\\)인지 어떻게 확인하나요?","answer":"접선식 \\(xx_0/10+yy_0/6=1\\)에 \\((x_0,y_0)=(5/2,3/2)\\)를 넣으면 \\(x/4+y/4=1\\)이에요."}},{"id":"c2","label":"V가 변 안쪽인 경우를 계산해요","stepIds":["s5","s6","s7","s8","s9"],"question":"이 경우 직사각형의 네 변은 어떤 네 직선이 될까요?","hint":"V가 놓인 변과 평행한 맞은편 변, U를 지나는 수직인 변을 차례로 잡아요.","explanation":"V가 변의 내부이면 한 변은 \\(x+y=4\\)이고 맞은편 평행선은 U를 지나므로 \\(x+y=6\\)이에요. 이에 수직인 두 변 중 U를 지나는 것은 \\(x-y=-6\\), 다른 변은 \\(x-y=2p\\)로 둘 수 있어요. V가 그 변 사이에 있으려면 \\(2p\\ge1\\), 즉 \\(p\\ge1/2\\)예요. 두 평행선 사이 거리는 각각 \\(\\sqrt2\\), \\((2p+6)/\\sqrt2\\)라 넓이는 \\(S=2p+6\\)이에요. 꼭짓점 \\((3+p,3-p)\\)가 큰 타원 안에 있어야 하므로\\n\\n\\((3+p)^2/40+(3-p)^2/36\\le1\\)\\n\\n이고, 정리하면 \\((19p-63)(p+3)\\le0\\)예요. \\(p\\ge1/2\\)이므로 \\(p\\le63/19\\), 따라서 \\(S\\le2(63/19)+6=240/19\\)예요. 등호일 때 나머지 꼭짓점도 큰 타원 안에 있고 V는 변 위라 실제로 이 넓이를 만들 수 있어요.","check":{"prompt":"넓이 상한에서 등호를 만드는 p는 얼마인가요?","answer":"\\(p=63/19\\)이고 넓이는 \\(240/19\\)예요."}},{"id":"c3","label":"V와 U가 이웃 꼭짓점인 배치를 제외해요","stepIds":["s10","s11","s12"],"question":"두 점을 잇는 변에 수직인 다음 변이 왜 어느 방향으로도 불가능할까요?","hint":"U에서는 큰 타원 안쪽, V에서는 작은 타원 바깥쪽으로 가야 해요.","explanation":"\\(\\vec{VU}=(-5/2,9/2)\\)이므로 수직인 변 방향은 \\((9,5)\\) 또는 \\((-9,-5)\\)예요. U에서 \\((9,5)\\) 방향으로 움직이면 y좌표가 6보다 커져 곧바로 큰 타원 밖으로 나가 최대 조건을 어겨요. 반대로 V에서 \\((-9,-5)\\) 방향으로 움직이면 \\(x+y<4\\)인 작은 타원 안쪽으로 들어가 V보다 거리합이 작아져 최소 조건을 어겨요. 따라서 U와 V가 이웃한 꼭짓점일 수 없어요.","check":{"prompt":"각 방향이 어기는 조건을 각각 말해 보세요.","answer":"\\((9,5)\\)는 U의 최대 조건, \\((-9,-5)\\)는 V의 최소 조건을 어겨요."}},{"id":"c4","label":"맞은편 꼭짓점 배치의 넓이를 제한해요","stepIds":["s13","s14","s15","s16","s17"],"question":"직사각형의 대각선을 두 변 방향으로 나누면 넓이는 어떻게 나오나요?","hint":"서로 수직인 단위방향으로 분해한 두 성분의 곱이 넓이예요.","explanation":"U와 V가 맞은편 꼭짓점이면 좌표축을 \\(\\xi=(x+y)/\\sqrt2\\), \\(\\eta=(-x+y)/\\sqrt2\\)로 돌려도 길이와 직각은 보존돼요. 이 좌표에서 \\(\\vec{VU}=(\\sqrt2,7/\\sqrt2)\\)예요. 서로 수직인 변 방향을 \\(e=(\\cos\\theta,-\\sin\\theta)\\), \\(r=(\\sin\\theta,\\cos\\theta)\\)라 하고 대각선을 \\(ae+br\\)로 쓰면\\n\\n\\(a=\\sqrt2\\cos\\theta-7\\sin\\theta/\\sqrt2\\), \\(b=\\sqrt2\\sin\\theta+7\\cos\\theta/\\sqrt2\\)\\n\\n예요. 넓이 \\(ab=7\\cos2\\theta-(45/4)\\sin2\\theta\\)이고 가능한 배치에서 두 변 길이 a,b는 양수예요. 특히 \\(0\\le\\theta<\\pi/2\\)에서 두 번째 항은 0 이하이고 첫 항은 7 이하라 \\(S\\le7<240/19\\)예요.","check":{"prompt":"이 경우가 첫 경우의 최대 넓이를 이길 수 없는 수치 비교는 무엇인가요?","answer":"\\(S\\le7\\)이고 \\(7<240/19\\)예요."}},{"id":"c5","label":"모든 배치를 비교해 답을 정해요","stepIds":["s18"],"question":"검토한 세 배치 중 가장 큰 넓이는 무엇인가요?","hint":"V가 변 내부, U와 이웃 꼭짓점, 맞은편 꼭짓점인 경우를 비교해요.","explanation":"V가 변 내부인 경우 \\(240/19\\)가 실제로 가능하고, U와 V가 이웃한 경우는 불가능하며, 맞은편인 경우는 넓이가 7 이하예요. 따라서 직사각형 넓이의 최댓값은 \\(240/19\\), 정답은 ⑤예요.","check":{"prompt":"상한만이 아니라 최댓값이라고 말할 수 있는 이유는 무엇인가요?","answer":"\\(p=63/19\\)인 직사각형이 모든 조건을 만족해 \\(240/19\\)를 실제로 만들기 때문이에요."}}],"takeaway":["거리합의 최대·최소 조건은 같은 초점의 두 타원과 접선 조건으로 바꿔요.","최소점이 변 안쪽인지 꼭짓점인지 나누어 가능한 직사각형 배치를 빠짐없이 봐요.","넓이 상한을 구한 뒤 등호를 만드는 직사각형이 실제 조건을 만족하는지 확인해요."]};</script>
