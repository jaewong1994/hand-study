  <script>window.HandStudyRecord={"itemId":18271,"sourceLabel":"2025 교육청 고3 수학확통 10월 30번","adminYear":2025,"grade":3,"month":10,"number":30,"track":"확통","points":4,"scoreStatus":"confirmed_4_direct","questionText":"두 상자 ${{A}}\\,$, ${{B}}\\,$에 각각 $8\\,$개의 공이 들어 있다. 두 상자 ${{A}}\\,$, ${{B}}\\,$와 한 개의 주사위를 사용하여 다음 시행을 한다.\n주사위를 한 번 던져나온 눈의 수가 $3\\,$의 배수이면상자 ${{A}}\\,$에서 $2\\,$개의 공을 꺼내어 상자 ${{B}}\\,$에 넣고,나온 눈의 수가 $3\\,$의 배수가 아니면상자 ${{B}}\\,$에서 $1\\,$개의 공을 꺼내어 상자 ${{A}}\\,$에 넣는다.\n이 시행을 $4\\,$번 반복한 후 상자 ${{A}}\\,$에 들어 있는 공의 개수가 상자 ${{B}}\\,$에 들어 있는 공의 개수보다 많을 때, 주사위의 짝수의 눈이 $4\\,$번 나왔을 확률은 $\\frac{q}{p}\\,$이다. $p+q\\,$의 값을 구하시오. (단, $p\\,$와 $q\\,$는 서로소인 자연수이다.) [4점]","answer":"17","sourceHash":"9c903f41e32a2bf126b3c2a81d2afae1b431ee113744063b074f59a78a471ef2","steps":[{"id":"s1","latex":"n=\\#\\{3\\text{의 배수 눈}\\},\\quad A=12-3n,\\quad B=4+3n"},{"id":"s2","latex":"A>B\\iff n\\le1"},{"id":"s3","latex":"P(E)=\\left(\\frac23\\right)^4+\\binom41\\frac13\\left(\\frac23\\right)^3=\\frac{48}{81}"},{"id":"s4","latex":"P(E\\cap F)=\\left(\\frac13\\right)^4+\\binom41\\frac16\\left(\\frac13\\right)^3=\\frac3{81}"},{"id":"s5","latex":"P(F\\mid E)=\\frac3{48}=\\frac1{16}\\Rightarrow p+q=17"}],"diagram":null,"contentHash":"56ae1146dc65ae72683fd223b7c7353c111f3f94984397d2e375de8468f4b02f","questionHtml":"\u003cp class=\"hp\">두 상자 \u003cspan class=\"heq\">\\({{A}}\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\({{B}}\\,\\)\u003c/span>에 각각 \u003cspan class=\"heq\">\\(8\\,\\)\u003c/span>개의 공이 들어 있다. 두 상자 \u003cspan class=\"heq\">\\({{A}}\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\({{B}}\\,\\)\u003c/span>와 한 개의 주사위를 사용하여 다음 시행을 한다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">주사위를 한 번 던져\u003c/p>\u003cp class=\"hp\">나온 눈의 수가 \u003cspan class=\"heq\">\\(3\\,\\)\u003c/span>의 배수이면\u003c/p>\u003cp class=\"hp\">상자 \u003cspan class=\"heq\">\\({{A}}\\,\\)\u003c/span>에서 \u003cspan class=\"heq\">\\(2\\,\\)\u003c/span>개의 공을 꺼내어 상자 \u003cspan class=\"heq\">\\({{B}}\\,\\)\u003c/span>에 넣고,\u003c/p>\u003cp class=\"hp\">나온 눈의 수가 \u003cspan class=\"heq\">\\(3\\,\\)\u003c/span>의 배수가 아니면\u003c/p>\u003cp class=\"hp\">상자 \u003cspan class=\"heq\">\\({{B}}\\,\\)\u003c/span>에서 \u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>개의 공을 꺼내어 상자 \u003cspan class=\"heq\">\\({{A}}\\,\\)\u003c/span>에 넣는다.\u003c/p>\u003c/div>\u003cp class=\"hp htall\">이 시행을 \u003cspan class=\"heq\">\\(4\\,\\)\u003c/span>번 반복한 후 상자 \u003cspan class=\"heq\">\\({{A}}\\,\\)\u003c/span>에 들어 있는 공의 개수가 상자 \u003cspan class=\"heq\">\\({{B}}\\,\\)\u003c/span>에 들어 있는 공의 개수보다 많을 때, 주사위의 짝수의 눈이 \u003cspan class=\"heq\">\\(4\\,\\)\u003c/span>번 나왔을 확률은 \u003cspan class=\"heq\">\\(\\dfrac{q}{p}\\,\\)\u003c/span>이다. \u003cspan class=\"heq\">\\(p+q\\,\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(p\\,\\)\u003c/span>와 \u003cspan class=\"heq\">\\(q\\,\\)\u003c/span>는 서로소인 자연수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/695bdb1e794d16b4d633b2a7.png\" style=\"width:449px;max-width:100%\">\u003cimg class=\"hfig\" src=\"../assets/figures/7dbfc2dd177dc7cf26cfca95.png\" style=\"width:148px;max-width:100%\">\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"b55d66cedadaa73be5b4e70860b3549fa3166252d44d850b5aefbe42fe20f2d7"};</script>
