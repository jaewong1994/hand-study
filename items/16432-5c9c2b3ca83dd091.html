  <script>window.HandStudyRecord={"itemId":16432,"sourceLabel":"2019 교육청 고3 수리나형 4월 30번","adminYear":2019,"grade":3,"month":4,"number":30,"track":"수리나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"두 실수 $a$, $b$에 대하여 두 함수 \n $f \\left( x \\right) =ax+b$, \n $g \\left( x \\right) = \\frac{1}{ax+b-2} +3$\n이 다음 조건을 만족시키도록 하는 두 실수 $a$, $b$의 순서쌍 $\\left( \\,a,\\,b \\right)$를 좌표평면에 나타낸 영역을 $R\\,$라 하자.\n(가) $x>0$일 때, $1\u003cg \\left( x \\right) \u003c3$\n(나) 두 함수 $y=f \\left( x \\right)$와 $y= \\frac{1}{x-2} +3$의 그래프의 교점이 제$4$사분면 위에는 있지 않다.\n영역 $R\\,$에 속하는 점 $\\left( \\,a,\\,b \\right)$에 대하여 $a ^{2} +b ^{2}$의 최댓값을 $M\\,$이라 할 때, $100M\\,$의 값을 구하시오. (단, $a\\ne 0$) [4점]","answer":"306","sourceHash":"3f0b307ec4fa6945bc4fb2647fedb302fe17d70156f64c03b686074a6d85ed19","steps":[{"id":"s1","latex":"1\u003cg(x)\u003c3\\ (x>0)\\Rightarrow ax+b\u003c\\dfrac32"},{"id":"s2","latex":"\\therefore a\u003c0,\\quad b\\le\\dfrac32"},{"id":"s3","latex":"\\text{영역 조건}\\Rightarrow\\dfrac53a+b\\ge0"},{"id":"s4","latex":"-\\dfrac53a\\le b\\le\\dfrac32\\Rightarrow a\\ge-\\dfrac9{10}"},{"id":"s5","latex":"R\\text{의 원점에서 가장 먼 점}=\\left(-\\dfrac9{10},\\dfrac32\\right)"},{"id":"s6","latex":"M=\\dfrac{81}{100}+\\dfrac94=\\dfrac{153}{50}\\Rightarrow100M=306"}],"diagram":null,"contentHash":"86cc410002ab85ec33065157fb5a50d7282cbe4da4b1066ded288f1650ca2ede","questionHtml":"\u003cp class=\"hp\">두 실수 \u003cspan class=\"heq\">\\(a\\)\u003c/span>, \u003cspan class=\"heq\">\\(b\\)\u003c/span>에 대하여 두 함수\u003c/p>\u003cp class=\"hp\">&emsp;\u003cspan class=\"heq\">\\(f \\left( x \\right) =ax+b\\)\u003c/span>,\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\(g \\left( x \\right) = \\dfrac{1}{ax+b-2} +3\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">이 다음 조건을 만족시키도록 하는 두 실수 \u003cspan class=\"heq\">\\(a\\)\u003c/span>, \u003cspan class=\"heq\">\\(b\\)\u003c/span>의 순서쌍 \u003cspan class=\"heq\">\\(\\left( \\,a,\\,b \\right)\\)\u003c/span>를 좌표평면에 나타낸 영역을 \u003cspan class=\"heq\">\\(R\\,\\)\u003c/span>라 하자.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) \u003cspan class=\"heq\">\\(x\\gt 0\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(1\\lt g \\left( x \\right) \\lt 3\\)\u003c/span>\u003c/p>\u003cp class=\"hp htall\">(나) 두 함수 \u003cspan class=\"heq\">\\(y=f \\left( x \\right)\\)\u003c/span>와 \u003cspan class=\"heq\">\\(y= \\dfrac{1}{x-2} +3\\)\u003c/span>의 그래프의 교점이 \u003cbr>제\u003cspan class=\"heq\">\\(4\\)\u003c/span>사분면 위에는 있지 않다.\u003c/p>\u003c/div>\u003cp class=\"hp\">영역 \u003cspan class=\"heq\">\\(R\\,\\)\u003c/span>에 속하는 점 \u003cspan class=\"heq\">\\(\\left( \\,a,\\,b \\right)\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(a^{2} +b^{2}\\)\u003c/span>의 최댓값을 \u003cspan class=\"heq\">\\(M\\,\\)\u003c/span>이라 할 때, \u003cspan class=\"heq\">\\(100M\\,\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(a \\neq 0\\)\u003c/span>) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"5c9c2b3ca83dd091176f1cf5b17a948ccb18d93e830b5222b91c421a18692dab"};</script>
