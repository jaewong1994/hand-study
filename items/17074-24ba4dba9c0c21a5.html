<script>window.HandStudyRecord={"itemId":17074,"sourceLabel":"2021 교육청 고3 수학기하 7월 30번","adminYear":2021,"grade":3,"month":7,"number":30,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"평면 위에\n $\\overline{OA}=2+2 \\sqrt{3}$, $\\overline{AB}=4$, $\\angle COA= \\frac{\\pi}{3}$, $\\angle A= \\angle B= \\frac{\\pi}{2}$\n를 만족시키는 사다리꼴 $O A B C$가 있다. 선분 $A B$를 지름으로 하는 원 위의 점 $P$에 대하여 $\\overrightarrow{OC} \\cdot \\overrightarrow{OP}$의 값이 최대가 되도록 하는 점 $P$를 $Q$라 할 때, 직선 $O Q$가 원과 만나는 점 중 $Q$가 아닌 점을 $D$라 하자. 원 위의 점 $R$에 대하여 $\\overrightarrow{DQ} \\cdot \\overrightarrow{AR}$의 최댓값을 $M$이라 할 때, $M ^{2}$의 값을 구하시오. [4점]","answer":"108","sourceHash":"8dbced22e6c9b2a33518e885f09fc281b21bf34c4cf9a0e155093f372889e67a","steps":[{"id":"s1","latex":"O=(0,0),\\ A=(2+2\\sqrt3,0),\\ B=(2+2\\sqrt3,4)"},{"id":"s2","latex":"N=(2+2\\sqrt3,2),\\quad \\widehat{u}_{OC}=(\\frac12,\\frac{\\sqrt3}{2})"},{"id":"s3","latex":"\\max_{P}\\overrightarrow{OC}\\cdot\\overrightarrow{OP}\\Rightarrow Q=N+2\\widehat{u}_{OC}=(3+2\\sqrt3,2+\\sqrt3)"},{"id":"s4","latex":"OQ:x-\\sqrt3y=0,\\quad d(N,OQ)=1"},{"id":"s5","latex":"DQ=2\\sqrt{2^2-1^2}=2\\sqrt3,\\quad\\overrightarrow{DQ}=(3,\\sqrt3)"},{"id":"s6","latex":"\\overrightarrow{DQ}\\cdot\\overrightarrow{AR}\\le\\overrightarrow{DQ}\\cdot\\overrightarrow{AN}+|DQ|\\,|NR|"},{"id":"s7","latex":"\\le2\\sqrt3+2\\sqrt3\\cdot2=6\\sqrt3"},{"id":"s8","latex":"M=6\\sqrt3\\Rightarrow M^2=108"}],"diagram":null,"contentHash":"c9ec5f67c08d613f6750a1c221962f99980942985460c2d91cc7a4b2bcdc0b31","questionHtml":"\u003cp class=\"hp\">평면 위에\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\({\\overline{OA}} =2+2 \\sqrt{3}\\)\u003c/span>, \u003cspan class=\"heq\">\\({\\overline{AB}}\\)\u003c/span>\u003cspan class=\"heq\">\\(=4\\)\u003c/span>, \u003cspan class=\"heq\">\\(\\angle COA\\)\u003c/span>\u003cspan class=\"heq\">\\(= \\dfrac{\\pi}{3}\\)\u003c/span>, \u003cspan class=\"heq\">\\(\\angle A\\)\u003c/span>\u003cspan class=\"heq\">\\(= \\angl <script>window.HandStudyGuide={"itemId":17074,"sourceHash":"8dbced22e6c9b2a33518e885f09fc281b21bf34c4cf9a0e155093f372889e67a","contentHash":"c9ec5f67c08d613f6750a1c221962f99980942985460c2d91cc7a4b2bcdc0b31","overview":{"goal":"내적이 최대가 되는 원 위의 점과 현의 길이를 구한 뒤, 다시 내적의 최댓값을 계산해요.","firstLook":"고정벡터와의 내적을 크게 하려면 원의 중심에서 그 벡터 방향으로 가장 멀리 간 점을 골라요.","conditions":[{"label":"사다리꼴","meaning":"좌표를 잡으면 지름 \\(AB\\)가 수직이고 원의 반지름은 \\(2\\)예요."},{"label":"두 번의 최댓값","meaning":"먼저 \\(Q\\)를 정하고, 그다음 \\(R\\)을 정해요."}]},"chapters":[{"id":"c1","label":"좌표와 원의 중심을 잡아요","stepIds":["s1","s2"],"question":"원의 중심과 \\(OC\\) 방향은 무엇인가요?","hint":"\\(OA\\)를 \\(x\\)축에 놓아요.","explanation":"\\(O=(0,0)\\), \\(A=(2+2\\sqrt3,0)\\)로 놓으면 \\(AB=4\\)이고 \\(AB\\perp OA\\)이므로 \\(B=(2+2\\sqrt3,4)\\)예요. 지름 \\(AB\\)인 원의 중심은 중점 \\(N=(2+2\\sqrt3,2)\\), 반지름은 \\(2\\)예요. \\(\\angle COA=60^\\circ\\)이므로 \\(OC\\) 방향의 길이 \\(1\\)인 벡터는 \\((1/2,\\sqrt3/2)\\)예요.","check":{"prompt":"지름이 \\(4\\)인 원의 반지름은 얼마인가요?","answer":"\\(2\\)예요."}},{"id":"c2","label":"첫 내적을 최대로 하는 점을 찾아요","stepIds":["s3","s4"],"question":"점 \\(Q\\)는 왜 \\(OC\\) 방향의 원 끝점인가요?","hint":"\\(OP=ON+NP\\)로 나누어 내적해요.","explanation":"\\(\\overrightarrow{OC}\\cdot\\overrightarrow{OP}=\\overrightarrow{OC}\\cdot\\overrightarrow{ON}+\\overrightarrow{OC}\\cdot\\overrightarrow{NP}\\)에서 첫 항은 고정이에요. 둘째 항은 \\(NP\\)가 \\(OC\\)와 같은 방향일 때 가장 커요. 따라서 \\(Q=N+2(1/2,\\sqrt3/2)=(3+2\\sqrt3,2+\\sqrt3)\\)예요. 이 좌표는 \\(x=\\sqrt3y\\)를 만족하므로 직선 \\(OQ\\)는 \\(x-\\sqrt3y=0\\)이에요. 중심 \\(N\\)에서 이 직선까지 거리는 \\(|(2+2\\sqrt3)-2\\sqrt3|/2=1\\)이에요.","check":{"prompt":"\\(NQ\\)의 길이와 방향은 무엇인가요?","answer":"길이는 \\(2\\), 방향은 \\(OC\\)와 같아요."}},{"id":"c3","label":"원의 현 길이를 구해요","stepIds":["s5"],"question":"\\(DQ\\)의 길이는 얼마인가요?","hint":"중심에서 현까지 거리가 \\(1\\)인 반지름 \\(2\\)의 원을 봐요.","explanation":"직선 \\(OQ\\)가 원에서 자르는 현이 \\(DQ\\)예요. 중심에서 현까지의 수선이 현을 이등분하므로 반현 길이는 \\(\\sqrt{2^2-1^2}=\\sqrt3\\), 따라서 \\(DQ=2\\sqrt3\\)예요. 직선 방향이 \\((\\sqrt3,1)\\)이므로 길이를 맞추면 \\(\\overrightarrow{DQ}=(3,\\sqrt3)\\)로 둘 수 있어요.","check":{"prompt":"현의 반쪽 길이는 얼마인가요?","answer":"피타고라스 정리로 \\(\\sqrt3\\)이에요."}},{"id":"c4","label":"두 번째 내적의 최댓값을 구해요","stepIds":["s6","s7","s8"],"question":"원 위의 \\(R\\)을 어떻게 골라야 하나요?","hint":"\\(AR=AN+NR\\)로 나누고 움직이는 부분만 최대화해요.","explanation":"\\(\\overrightarrow{AR}=\\overrightarrow{AN}+\\overrightarrow{NR}\\)이므로 첫 내적 \\(\\overrightarrow{DQ}\\cdot\\overrightarrow{AN}= (3,\\sqrt3)\\cdot(0,2)=2\\sqrt3\\)은 고정이에요. 움직이는 항은 \\(NR\\)가 \\(DQ\\)와 같은 방향일 때 최대이고 그 값은 \\(DQ\\cdot NR=2\\sqrt3\\cdot2=4\\sqrt3\\)이에요. 실제로 원 위에 그 방향의 점이 있으므로 등호가 가능해요. 따라서 \\(M=6\\sqrt3\\), \\(M^2=108\\)이에요.","check":{"prompt":"부등식의 등호를 만드는 \\(R\\)은 실제로 존재하나요?","answer":"중심 \\(N\\)에서 \\(DQ\\) 방향으로 반지름 \\(2\\)만큼 간 원 위의 점이 존재해요."}}],"takeaway":["원 위 점과 고정벡터의 내적은 중심에서 그 벡터 방향의 끝점에서 최대예요.","중심과 직선 사이 거리로 현의 길이를 구할 수 있어요.","움직이는 벡터를 중심 기준으로 나누면 고정항과 최대화할 항이 분리돼요."]};</script>
