<script>window.HandStudyRecord={"itemId":25037,"sourceLabel":"2026 평가원 고3 수학기하 6월 30번","adminYear":2026,"grade":3,"month":6,"number":30,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"좌표평면에서 ${ \\overline{{AB}}}={ \\overline{{AC}}}=2\\,$, $\\angle {{CAB}}>\\frac{ \\pi }{2}\\,$인 이등변삼각형의 세 꼭짓점 ${{A}}\\,$, ${{B}}\\,$, ${{C}}\\,$와 선분 ${{AB}}\\,$의 수직이등분선 위의 점 ${{D}}\\,$가\n${ \\vec{{BA}}} \\cdot { \\vec{{BC}}}={ \\vec{{CB}}} \\cdot { \\vec{{CD}}}\\,$, $2{ \\vec{{AC}}} \\cdot { \\vec{{AD}}}={ \\vec{{DA}}} \\cdot { \\vec{{DB}}}\\,$\n를 만족시킨다. 선분 ${{AB}}\\,$를 지름으로 하는 원 위를 움직이는 점 ${{X}}\\,$에 대하여 ${ \\vec{{DX}}} \\cdot { \\vec{{BC}}}\\,$의 최댓값을 $M\\,$, 최솟값을 $m\\,$이라 하자. $\\left|\\, M\\, \\times m\\,\\right| =\\frac{q}{p}\\,$일 때, $p+q\\,$의 값을 구하시오. (단, $p\\,$와 $q\\,$는 서로소인 자연수이다.)","answer":"29","sourceHash":"e8d75d82798a82b8c57adfa293433ca7287d2949728c3dd63e558c800a53200d","scoreEvidenceOverlay":"inventory/score-evidence-10.json","steps":[{"id":"s1","latex":"\\mathrm A=(0,h),\\quad\\mathrm B=(-s,0),\\quad\\mathrm C=(s,0),\\quad h,s>0,\\ h^2+s^2=4"},{"id":"s2","latex":"\\mathrm D=(u,v),\\quad2s^2=-2s(u-s)\\Rightarrow u=0"},{"id":"s3","latex":"\\mathrm{DA}^2=\\mathrm{DB}^2\\Rightarrow(h-v)^2=s^2+v^2\\Rightarrow hv=h^2-2"},{"id":"s4","latex":"2h(h-v)=-v(h-v),\\quad h\\ne v\\Rightarrow v=-2h"},{"id":"s5","latex":"-2h^2=h^2-2\\Rightarrow h^2=\\frac23,\\quad s^2=\\frac{10}{3}>h^2"},{"id":"s6","latex":"\\mathrm O=\\left(-\\frac s2,\\frac h2\\right),\\quad|\\overrightarrow{\\mathrm{OX}}|=1"},{"id":"s7","latex":"\\overrightarrow{\\mathrm{DX}}\\cdot\\overrightarrow{\\mathrm{BC}}=-s^2+\\overrightarrow{\\mathrm{OX}}\\cdot(2s,0)"},{"id":"s8","latex":"M=-s^2+2s,\\quad m=-s^2-2s\\quad(\\overrightarrow{\\mathrm{OX}}=(\\pm1,0))"},{"id":"s9","latex":"|Mm|=\\left|\\frac{100}{9}-\\frac{40}{3}\\right|=\\frac{20}{9}\\Rightarrow p+q=29"}],"diagram":null,"contentHash":"a16f8acb26dbec9371bad95c12e4e363545a4752ba10a15cf5ddfaaad287e065","questionHtml":"\u003cdiv>좌표평면에서 ${ \\overline{{AB}}}={ \\overline{{AC}}}=2\\,$, $\\angle {{CAB}}&gt;\\frac{ \\pi }{2}\\,$인 이등변삼각형의 세 꼭짓점 ${{A}}\\,$, ${{B}}\\,$, ${{C}}\\,$와 선분 ${{AB}}\\,$의 수직이등분선 위의 점 ${{D}}\\,$가\u003cbr>${ \\vec{{BA}}} \\cdot { \\vec{{BC}}}={ \\vec{{CB}}} \\cdot { \\vec{{CD}}}\\,$, $2{ \\vec{{AC}}} \\cdot { \\vec{{AD}}}={ \\vec{{DA}}} \\cdot { \\vec{{DB}}}\\,$\u003cbr>를 만족시킨다. 선분 ${{AB}}\\,$를 지름으로 하는 원 위를 움직이는 점 ${{X}}\\,$에 대하여 ${ \\vec{{DX}}} \\cdot { \\vec{{BC}}}\\,$의 최댓값을 $M\\,$, 최솟값을 $m\\,$이라 하자. $\\left|\\, M\\, \\times m\\,\\right| =\\frac{q}{p}\\,$일 때, $p+q\\,$의 값을 구하시오. (단, $p\\,$와 $q\\,$는 서로소인 자연수이다.)\u003c/div>\u003cp>\u003cimg src=\"../assets/figures/70c039409f7a8dd67b1d6a4a.png\" alt=\"문항 도형\">\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"f640f38b79aa6f6d0b465ef41445f15ba20fa7c3bf833bf25f7470aeba8567bb"};</script>
<script>window.HandStudyGuide={"itemId":25037,"sourceHash":"e8d75d82798a82b8c57adfa293433ca7287d2949728c3dd63e558c800a53200d","contentHash":"a16f8acb26dbec9371bad95c12e4e363545a4752ba10a15cf5ddfaaad287e065","overview":{"goal":"벡터 내적 조건으로 삼각형과 점 \\(D\\)의 좌표를 정하고, 원 위 점의 내적 범위를 구해요.","firstLook":"이등변삼각형의 대칭축을 \\(y\\)축으로 두면 \\(B,C\\)가 좌우 대칭이 되어 두 벡터 조건이 짧아져요.","conditions":[{"label":"이등변삼각형","meaning":"\\(A=(0,h),B=(-s,0),C=(s,0)\\)로 두면 \\(h^2+s^2=4\\)예요."},{"label":"점 D","meaning":"첫 내적 조건과 수직이등분선 조건이 \\(D\\)의 두 좌표를 정해요."},{"label":"움직이는 점 X","meaning":"\\(AB\\)를 지름으로 하는 원의 중심에서 \\(X\\)까지의 거리는 \\(1\\)이에요."}]},"chapters":[{"id":"c1","label":"대칭 좌표로 점 D를 정해요","stepIds":["s1","s2","s3","s4","s5"],"question":"두 내적 조건과 수직이등분선 조건은 \\(h,s,D\\)를 어떻게 정할까요?","hint":"\\(D=(u,v)\\)로 두고 첫 내적에서 \\(u\\), 같은 거리 조건에서 \\(v\\)와 \\(h\\)의 관계를 구해요.","explanation":"\\(A=(0,h),B=(-s,0),C=(s,0)\\)로 두면 \\(h,s>0\\), \\(h^2+s^2=4\\)예요. \\(D=(u,v)\\)로 두고 첫 내적을 계산하면 \\(2s^2=-2s(u-s)\\)이므로 \\(u=0\\)이에요. 또 \\(D\\)가 \\(AB\\)의 수직이등분선 위에 있어 \\(DA=DB\\)이고, \\((h-v)^2=s^2+v^2\\)에서 \\(hv=h^2-2\\)를 얻어요.\n\n둘째 내적 조건은 \\(2h(h-v)=-v(h-v)\\)예요. \\(h=v\\)이면 \\(D=A\\)가 되어 \\(DA=DB\\)와 \\(AB=2\\)에 모순이므로 나누어 \\(v=-2h\\)를 얻어요. 이를 앞 식에 넣으면 \\(-2h^2=h^2-2\\), 따라서 \\(h^2=2/3\\), \\(s^2=10/3\\)이에요. 실제로 \\(s^2>h^2\\)라 \\(\\angle CAB\\)도 둔각이에요.","check":{"prompt":"\\(h-v\\)로 나누기 전에 \\(h=v\\)를 왜 따로 제외해야 하나요?","answer":"그 값이 \\(0\\)일 수 있는지 확인하지 않고 나누면 해를 잃을 수 있어요. 여기서는 \\(h=v\\)가 \\(D=A\\)를 뜻하고 수직이등분선 조건과 모순이라 제외할 수 있어요."}},{"id":"c2","label":"원의 중심에서 움직임을 분리해요","stepIds":["s6","s7"],"question":"\\(\\overrightarrow{DX}\\cdot\\overrightarrow{BC}\\)에서 고정된 부분과 움직이는 부분은 무엇인가요?","hint":"원의 중심을 \\(O\\)라 하고 \\(\\overrightarrow{DX}=\\overrightarrow{DO}+\\overrightarrow{OX}\\)로 나눠요.","explanation":"\\(AB\\)의 중점이자 원의 중심은 \\(O=(-s/2,h/2)\\)이고 반지름은 \\(1\\)이므로 \\(|\\overrightarrow{OX}|=1\\)이에요. \\(\\overrightarrow{BC}=(2s,0)\\)이고 \\(D=(0,-2h)\\)이므로\n\n\\(\\overrightarrow{DX}\\cdot\\overrightarrow{BC}=\\overrightarrow{DO}\\cdot\\overrightarrow{BC}+\\overrightarrow{OX}\\cdot(2s,0)=-s^2+\\overrightarrow{OX}\\cdot(2s,0)\\)\n\n예요. 첫 항은 고정되고 둘째 항만 \\(X\\)에 따라 변해요.","check":{"prompt":"움직이는 내적 \\(\\overrightarrow{OX}\\cdot(2s,0)\\)의 범위는 무엇인가요?","answer":"\\(|\\overrightarrow{OX}|=1\\)이고 다른 벡터의 길이가 \\(2s\\)이므로 \\(-2s\\) 이상 \\(2s\\) 이하예요."}},{"id":"c3","label":"양 끝값의 곱을 계산해요","stepIds":["s8","s9"],"question":"최댓값과 최솟값을 직접 곱하면 어떤 분수가 나오나요?","hint":"\\(\\overrightarrow{OX}\\)가 수평 오른쪽과 왼쪽을 향할 때 두 끝값을 써요.","explanation":"\\(M=-s^2+2s\\), \\(m=-s^2-2s\\)예요. 따라서 \\(Mm=s^4-4s^2\\)이고 \\(s^2=10/3\\)을 넣으면 \\(100/9-40/3=-20/9\\)예요. 절댓값은 \\(20/9\\)이므로 \\(p=9,q=20\\), \\(p+q=29\\)예요.","check":{"prompt":"\\(M\\)과 \\(m\\) 자체를 따로 근호로 계산하지 않아도 되는 이유는 무엇인가요?","answer":"곱은 \\((-s^2+2s)(-s^2-2s)\\)인 합차의 곱이라 \\(s^4-4s^2\\)로 바로 계산할 수 있기 때문이에요."}}],"takeaway":["이등변삼각형은 대칭축에 맞춘 좌표를 잡으면 내적 조건이 간단해져요.","수직이등분선 위의 점은 두 끝점까지의 거리가 같다는 식으로 사용해요.","원 위를 움직이는 벡터는 중심까지의 고정 벡터와 반지름 벡터로 나누어 최댓값과 최솟값을 찾아요."]};</script>
