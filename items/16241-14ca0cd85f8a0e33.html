  <script>window.HandStudyRecord={"itemId":16241,"sourceLabel":"2019 교육청 고3 수리가형 3월 19번","adminYear":2019,"grade":3,"month":3,"number":19,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 중심이 $O\\,$이고 길이가 $2\\,$인 선분 $AB\\,$를 지름으로 하는 반원이 있다. 호 $AB$ 위의 점 $P\\,$에서 선분 $AB\\,$에 내린 수선의 발을 $H\\,$라 하고, 점 $H\\,$를 지나고 선분 $OP\\,$에 수직인 직선이 선분 $OP$, 호 $AB\\,$와 만나는 점을 각각 $I$, $Q\\,$라 하자. 점 $Q\\,$를 지나고 직선 $OP\\,$에 평행한 직선이 호 $A B\\,$와 만나는 점 중 $Q\\,$가 아닌 점을 $R\\,$라 하자. $\\angle POB= \\theta \\,$일 때, 두 삼각형 $RIP$, $IHP\\,$의 넓이를 각각 $S\\,( \\theta )$, $T\\,( \\theta )\\,$라 하자. $\\lim _{\\theta \\, -> \\,0+} \\frac{ S\\,( \\theta )-T\\,( \\theta ) }{\\theta ^{3}} \\,}$의 값은? (단, $0\u003c\\theta\u003c \\frac{\\pi}{2}$) [4점]\n① $\\frac{\\sqrt{2} -1}{4}$ ② $\\frac{\\sqrt{2} -1}{2}$ ③ $\\sqrt{2} -\\,1$\n④ $\\frac{2 \\sqrt{2} -1}{4}$ ⑤ $\\frac{2 \\sqrt{2} -1}{2}$","answer":"②","sourceHash":"beb40042d722242bf18dc2012943afa03f3f1c967ea3aab9f0504a5fcd43af1c","steps":[{"id":"s1","latex":"OH=\\cos\\theta,\\quad OI=\\cos^2\\theta,\\quad IH=\\sin\\theta\\cos\\theta"},{"id":"s2","latex":"IP=1-OI=\\sin^2\\theta"},{"id":"s3","latex":"T(\\theta)=\\dfrac12IH\\cdot IP=\\dfrac12\\sin^3\\theta\\cos\\theta"},{"id":"s4","latex":"QI=\\sqrt{1-\\cos^4\\theta}=\\sin\\theta\\sqrt{1+\\cos^2\\theta}"},{"id":"s5","latex":"S(\\theta)=\\dfrac12IP\\cdot QI=\\dfrac12\\sin^3\\theta\\sqrt{1+\\cos^2\\theta}"},{"id":"s6","latex":"\\lim_{\\theta\\to0+}\\dfrac{S-T}{\\theta^3}=\\dfrac12(\\sqrt2-1)"}],"diagram":null,"contentHash":"50473c4387e0f8667bb44eadae053ed19b9423bace5e2e60771d6b471617147c","questionHtml":"\u003cp class=\"hp htall\">그림과 같이 중심이 \u003cspan class=\"heq\">\\(O\\,\\)\u003c/span>이고 길이가 \u003cspan class=\"heq\">\\(2\\,\\)\u003c/span>인 선분 \u003cspan class=\"heq\">\\(AB\\,\\)\u003c/span>를 지름으로 하는 반원이 있다. 호 \u003cspan class=\"heq\">\\(AB\\)\u003c/span> 위의 점 \u003cspan class=\"heq\">\\(P\\,\\)\u003c/span>에서 선분 \u003cspan class=\"heq\">\\(AB\\,\\)\u003c/span>에 내린 수선의 발을 \u003cspan class
