  <script>window.HandStudyRecord={"itemId":16649,"sourceLabel":"2020 교육청 고3 수리가형 3월 14번","adminYear":2020,"grade":3,"month":3,"number":14,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"함수 $y= \\log_{\\,3}\\, \\left| 2x \\right|$의 그래프와 함수 $y = \\log_{\\,3} \\,\\left(x+3 \\right)\\,$의 그래프가 만나는 서로 다른 두 점을 각각 $A$, $B\\,$라 하자. 점 $A\\,$를 지나고 직선 $AB\\,$와 수직인 직선이 $y\\,$축과 만나는 점을 $C\\,$라 할 때, 삼각형 $ABC\\,$의 넓이는? (단, 점 $\\A\\,$의 $x\\,$좌표는 점 $\\B\\,$의 $x\\,$좌표보다 작다.) [4점]\n① $\\frac{13}{2}$ ② $7$ ③ $\\frac{15}{2}$ ④ $8$ ⑤ $\\frac{17}{2}\\,$","answer":"⑤","sourceHash":"2bb6054633a8e6714f8bf16fddc86446e084d7900f26921ca1177746041e79ee","steps":[{"id":"s1","latex":"\\log_3|2x|=\\log_3(x+3)\\Rightarrow |2x|=x+3,\\quad x>-3"},{"id":"s2","latex":"x=-1,3;\\quad l=\\log_3 2,\\quad A(-1,l),\\ B(3,l+1)"},{"id":"s3","latex":"\\text{직선 }AB\\text{의 기울기}=\\frac14\\Rightarrow \\text{직선 }AC\\text{의 기울기}=-4"},{"id":"s4","latex":"C(0,l-4),\\quad AB=\\sqrt{4^2+1^2}=\\sqrt{17},\\quad AC=\\sqrt{1^2+(-4)^2}=\\sqrt{17}"},{"id":"s5","latex":"\\triangle ABC=\\frac12 AB\\cdot AC=\\frac{17}{2}"}],"diagram":null,"contentHash":"c4153a55569899d4c9d09da08cbc6e1e83ce508548ab92e816962f9ab0a2ce62","questionHtml":"\u003cp class=\"hp\">함수 \u003cspan class=\"heq\">\\(y= \\log_{\\,3}\\, \\left| 2x \\right|\\)\u003c/span>의 그래프와 함수 \u003cspan class=\"heq\">\\(y = \\log_{\\,3} \\,\\left(x+3 \\right)\\,\\)\u003c/span>의 그래프가 만나는 서로 다른 두 점을 각각 \u003cspan class=\"heq\">\\(A\\)\u003c/span>, \u003cspan class=\"heq\">\\(B\\,\\)\u003c/span>라 하자. 점 \u003cspan class=\"heq\">\\(A\\,\\)\u003c/span>를 지나고 직선 \u003cspan class=\"heq\">\\(AB\\,\\)\u003c/span>와 수직인 직선이 \u003cspan class=\"heq\">\\(y\\,\\)\u003c/span>축과 만나는 점을 \u003cspan class=\"heq\">\\(C\\,\\)\u003c/span>라 할 때, 삼각형 \u003cspan class=\"heq\">\\(ABC\\,\\)\u003c/span>의 넓이는? (단, 점 \u003cspan class=\"heq\">\\(A\\,\\)\u003c/span>의 \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>좌표는 점 \u003cspan class=\"heq\">\\(B\\,\\)\u003c/span>의 \u003cspan class
