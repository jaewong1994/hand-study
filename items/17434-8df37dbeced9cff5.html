<script>window.HandStudyRecord={"itemId":17434,"sourceLabel":"2022 교육청 고3 수학확통 7월 30번","adminYear":2022,"grade":3,"month":7,"number":30,"track":"확통","points":4,"scoreStatus":"confirmed_4_direct","questionText":"각 면에 숫자 $1\\,$, $1\\,$, $2\\,$, $2\\,$, $2\\,$, $2\\,$가 하나씩 적혀 있는 정육면체 모양의 상자가 있다. 이 상자를 $6\\,$번 던질 때, $n\\,$$\\left( 1 \\leq n \\leq 6 \\right) \\,$번째에 바닥에 닿은 면에 적혀 있는 수를 $a _{n} \\,$이라 하자. $a _{1} +a _{2} +a _{3} >a _{4} +a _{5} +a _{6} \\,$일 때, $a _{1} =a _{4} =1\\,$일 확률은 $\\frac{q}{p} \\,$이다. $p+q\\,$의 값을 구하시오. (단, $p\\,$와 $q\\,$는 서로소인 자연수이다.) [4점]","answer":"133","sourceHash":"3a653861d8ee4bf6515ecf4dc6a892179a0ebd3ccad867df5604e3d0f9bf923b","steps":[{"id":"s1","latex":"X,Y=\\text{앞뒤 세 번에서 }1\\text{의 횟수},\\quad A=\\{X\u003cY\\},\\quad B=\\{a_1=a_4=1\\}"},{"id":"s2","latex":"27P(X=k)=(8,12,6,1)\\quad(k=0,1,2,3)"},{"id":"s3","latex":"P(A)=\\{8(12+6+1)+12(6+1)+6\\}/729=242/729"},{"id":"s4","latex":"B\\text{일 때 남은 두 번의 횟수 }X',Y':\\quad9P(X'=k)=(4,4,1)"},{"id":"s5","latex":"P(A\\cap B)=\\tfrac19\\{4(4+1)+4\\}/81=24/729"},{"id":"s6","latex":"P(B\\mid A)=12/121\\Rightarrow p+q=133"}],"diagram":null,"contentHash":"bb3b75849448d05375b33264cde5c6ef8943c77c60eeba325c43b0515606ea85","questionHtml":"\u003cp class=\"hp htall\">각 면에 숫자 \u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(2\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(2\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(2\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(2\\,\\)\u003c/span>가 하나씩 적혀 있는 정육면체 모양의 상자가 있다. 이 상자를 \u003cspan class=\"heq\">\\(6\\,\\)\u003c/span>번 던질 때, \u003cspan class=\"heq\">\\(n\\,\\)\u003c/span>\u003cspan class=\"heq\">\\(\\left( 1 \\leq n \\leq 6 \\right) \\,\\)\u003c/span>번째에 바닥에 닿은 면에 적혀 있는 수를 \u003cspan class=\"heq\">\\(a_{n} \\,\\)\u003c/span>이라 하자.\u003cbr>\u003cspan class=\"heq\">\\(a_{1} +a_{2} +a_{3} \\gt a_{4} +a_{5} +a_{6} \\,\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(a_{1} =a_{4} =1\\,\\)\u003c/span>일 확률은 \u003cspan class=\"heq\">\\(\\dfrac{q}{p} \\,\\)\u003c/span>이다.\u003cbr>\u003cspan class=\"heq\">\\(p+q\\,\\)\u003c/span>의 값을 구하시오.\u003cbr>(단, \u003cspan class=\"heq\">\\(p\\,\\)\u003c/span>와 \u003cspan class=\"heq\">\\(q\\,\\)\u003c/span>는 서로소인 자연수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"8df37dbeced9cff550ff26e71e1cdab971bedb8775f5f1d8776933149f824e51"};</script>
<script>window.HandStudyGuide={"itemId":17434,"sourceHash":"3a653861d8ee4bf6515ecf4dc6a892179a0ebd3ccad867df5604e3d0f9bf923b","contentHash":"bb3b75849448d05375b33264cde5c6ef8943c77c60eeba325c43b0515606ea85","overview":{"goal":"앞 세 번과 뒤 세 번에 나온 1의 개수로 합의 대소를 바꾸고, 조건 사건과 목표 사건의 확률을 이항분포로 계산해요.","firstLook":"각 세 번의 합은 모두 2가 나왔을 때의 6에서 숫자 1이 나온 횟수만큼 줄어들어요. 따라서 합이 큰 쪽은 오히려 1의 개수가 적은 쪽이에요.","conditions":[{"label":"한 번의 확률","meaning":"숫자 \\(1\\)이 나올 확률은 \\(1/3\\), 숫자 \\(2\\)가 나올 확률은 \\(2/3\\)이에요."},{"label":"조건 사건","meaning":"앞 세 번의 합이 뒤 세 번의 합보다 큰 경우만 남겨요."},{"label":"목표 사건","meaning":"첫 번째와 네 번째 결과가 모두 \\(1\\)인 조건부확률을 구해요."}]},"chapters":[{"id":"c1","label":"합의 대소를 1의 횟수 비교로 바꿔요","stepIds":["s1"],"question":"앞뒤 세 번에서 1의 횟수를 어떻게 비교해야 앞쪽 합이 더 클까요?","hint":"세 번 모두 2라고 생각한 합 6에서 1의 횟수만큼 빼요.","explanation":"앞 세 번에서 \\(1\\)이 나온 횟수를 \\(X\\), 뒤 세 번에서 나온 횟수를 \\(Y\\)라 할게요. 앞쪽 합은 \\(6-X\\), 뒤쪽 합은 \\(6-Y\\)예요. 따라서 앞쪽 합이 더 큰 사건 \\(A\\)는 \\(6-X>6-Y\\), 즉 \\(X<Y\\)예요. 목표 사건은 \\(B=\\{a_1=a_4=1\\}\\)로 둘게요.","check":{"prompt":"앞 세 번에서 \\(1\\)이 두 번 나오면 그 합은 얼마인가요?","answer":"\\(6-2=4\\)예요."}},{"id":"c2","label":"조건 사건 A의 확률을 계산해요","stepIds":["s2","s3"],"question":"세 번 중 \\(1\\)이 \\(k\\)번 나올 확률을 이용하면 \\(P(A)\\)는 얼마인가요?","hint":"분모 \\(27\\)을 공통으로 두면 \\(k=0,1,2,3\\)의 분자는 \\(8,12,6,1\\)이에요.","explanation":"\\(X\\)와 \\(Y\\)는 각각 시행 횟수 \\(3\\), 성공확률 \\(1/3\\)인 이항분포를 따라요. 따라서\n\\[\n27P(X=k)=8,12,6,1\\quad(k=0,1,2,3)\n\\]\n이고 \\(Y\\)도 같아요.\n\n\\(X<Y\\)가 되도록 \\(X\\)의 값별로 뒤의 큰 값을 더하면 분자는 \\(8(12+6+1)+12(6+1)+6\\cdot1=152+84+6=242\\)예요. 따라서 \\(P(A)=242/729\\)예요.","check":{"prompt":"\\(X=0\\)일 때 허용되는 \\(Y\\)값은 무엇인가요?","answer":"\\(Y=1,2,3\\)이고 이에 해당하는 분자 합은 \\(12+6+1\\)이에요."}},{"id":"c3","label":"첫째와 넷째가 1인 경우의 교집합을 세어요","stepIds":["s4","s5"],"question":"사건 \\(B\\)가 일어났을 때 남은 네 번에서 어떤 비교를 해야 하나요?","hint":"앞뒤에 이미 1이 한 번씩 있으므로 남은 두 번의 1 횟수만 비교해요.","explanation":"\\(B\\)의 확률은 \\((1/3)^2=1/9\\)예요. 각 묶음에 남은 두 번에서 \\(1\\)의 횟수를 \\(X',Y'\\)라 하면 \\(X<Y\\)는 \\(1+X'<1+Y'\\), 즉 \\(X'<Y'\\)와 같아요.\n\n두 번 시행에서는 \\(9P(X'=k)=4,4,1\\)이고 \\(Y'\\)도 같아요. 따라서 \\(X'<Y'\\)인 분자는 \\(4(4+1)+4\\cdot1=24\\)이고 조건부로 그 확률은 \\(24/81\\)이에요. 그러므로 \\(P(A\\cap B)=\\frac19\\cdot\\frac{24}{81}=24/729\\)예요.","check":{"prompt":"두 번 중 \\(1\\)이 두 번 나올 확률은 얼마인가요?","answer":"\\((1/3)^2=1/9\\)이고 공통 분모 \\(9\\)에서 분자는 \\(1\\)이에요."}},{"id":"c4","label":"교집합을 조건 사건으로 나눠요","stepIds":["s6"],"question":"구하려는 \\(P(B\\mid A)\\)는 얼마인가요?","hint":"\\(P(A\\cap B)/P(A)\\)를 계산해요.","explanation":"조건부확률은\n\\[\nP(B\\mid A)=\\frac{24/729}{242/729}=\\frac{24}{242}=\\frac{12}{121}\n\\]\n이에요. \\(p=121,q=12\\)는 서로소이므로 \\(p+q=133\\)이에요.","check":{"prompt":"공통 분모 \\(729\\)는 계산에서 어떻게 되나요?","answer":"분자와 분모에 함께 있어 약분돼요."}}],"takeaway":["두 값만 나오는 여러 시행의 합은 한 값이 나온 횟수만으로 표현할 수 있어요.","조건 사건 아래에 특정 시행 결과를 고정하면 남은 시행의 횟수 분포로 교집합을 계산해요.","조건부확률은 목표와 조건의 교집합 확률을 조건 사건의 확률로 나눠요."]};</script>
