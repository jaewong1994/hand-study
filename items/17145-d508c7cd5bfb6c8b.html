  <script>window.HandStudyRecord={"itemId":17145,"sourceLabel":"2021 교육청 고3 수학확통 7월 29번","adminYear":2021,"grade":3,"month":7,"number":29,"track":"확통","points":4,"scoreStatus":"confirmed_4_direct","questionText":"$1,\\,2,\\,3,\\,4,\\,5$의 숫자가 하나씩 적힌 카드가 각각 $1$장, $2$장, $3$장, $4$장, $5$장이 있다. 이 $15$장의 카드 중에서 임의로 $2$장의 카드를 동시에 선택하는 시행을 한다. 이 시행에서 선택한 $2$장의 카드에 적힌 두 수의 곱의 모든 양의 약수의 개수가 $3$ 이하일 때, 그 두 수의 합이 짝수일 확률은 $\\frac{q}{p}$이다. $p+q$의 값을 구하시오. (단, $p$와 $q$는 서로소인 자연수이다.) [4점]","answer":"25","sourceHash":"cab58fa1c4eda165f3e82b767a6737e0f211508356a84df202cdb2f0396fd6b1","steps":[{"id":"s1","latex":"d(N)=N\\text{의 양의 약수 개수};\\quad d(N)\\le3\\Rightarrow N=1,\\ell,\\ell^2\\quad(\\ell\\text{은 소수})"},{"id":"s2","latex":"\\text{한 수가 }1:\\quad2+3+4+5=14"},{"id":"s3","latex":"\\text{두 수가 모두 }2\\text{ 이상}:\\quad{2\\choose2}+{3\\choose2}+{5\\choose2}=14"},{"id":"s4","latex":"\\#\\{d(N)\\le3\\}=14+14=28"},{"id":"s5","latex":"\\#\\{\\text{합이 짝수}\\}=3+5+{2\\choose2}+{3\\choose2}+{5\\choose2}=22"},{"id":"s6","latex":"P=\\frac{22}{28}=\\frac{11}{14}\\Rightarrow p+q=25"}],"diagram":null,"contentHash":"3a68c2845ad60ec61243062438649f308a81bc2e3873469c9c2a24f98d7d2dbe","questionHtml":"\u003cp class=\"hp htall\">\u003cspan class=\"heq\">\\(1,\\,2,\\,3,\\,4,\\,5\\)\u003c/span>의 숫자가 하나씩 적힌 카드가 각각 \u003cspan class=\"heq\">\\(1\\)\u003c/span>장, \u003cspan class=\"heq\">\\(2\\)\u003c/span>장, \u003cspan class=\"heq\">\\(3\\)\u003c/span>장, \u003cspan class=\"heq\">\\(4\\)\u003c/span>장, \u003cspan class=\"heq\">\\(5\\)\u003c/span>장이 있다. 이 \u003cspan class=\"heq\">\\(15\\)\u003c/span>장의 카드 중에서 임의로 \u003cspan class=\"heq\">\\(2\\)\u003c/span>장의 카드를 동시에 선택하는 시행을 한다. 이 시행에서 선택한 \u003cspan class=\"heq\">\\(2\\)\u003c/span>장의 카드에 적힌 두 수의 곱의 모든 양의 약수의 개수가 \u003cspan class=\"heq\">\\(3\\)\u003c/span> 이하일 때, 그 두 수의 합이 짝수일 확률은 \u003cspan class=\"heq\">\\(\\dfrac{q}{p}\\)\u003c/span>이다. \u003cspan class=\"heq\">\\(p+q\\)\u003c/span>의 값을 구하시오.\u003cbr>(단, \u003cspan class=\"heq\">\\(p\\)\u003c/span>와 \u003csp
