<script>window.HandStudyRecord={"itemId":17216,"sourceLabel":"2021 평가원 고3 수학미적분 9월 22번","adminYear":2021,"grade":3,"month":9,"number":22,"track":"미적분","points":4,"scoreStatus":"confirmed_4_direct","questionText":"최고차항의 계수가 $1$인 삼차함수 $f \\left( x \\right)$에 대하여 함수\n $g \\left( x \\right) =f \\left( x-3 \\right) \\times \\lim _{h -> 0+} {} \\frac{\\left| f(x+h) \\right| - \\left| f(x-h) \\right|}{h}$\n가 다음 조건을 만족시킬 때, $f \\left( 5 \\right)$의 값을 구하시오. [4점]\n(가) 함수 $g \\left( x \\right)$는 실수 전체의 집합에서 연속이다.(나) 방정식 $g \\left( x \\right)$$=0$은 서로 다른 네 실근 $\\alpha _{1} ,\\, \\alpha _{2} ,\\, \\alpha _{3} ,\\, \\alpha _{4}$를 갖고 $\\alpha _{1} + \\alpha _{2} + \\alpha _{3} + \\alpha _{4}$$=7$이다.\n 사각형입니다. 2021년 9월 고3 모의고사 문제지제 2 교시 수학 영역(미적분) \n5 지선다형","answer":"108","sourceHash":"a8ef7960a8d760f5e9e3a9f768dad97a7811f0a89637ffe3fbca381106378c2d","steps":[{"id":"s1","latex":"L(x)=\\lim_{h\\to0+}\\frac{|f(x+h)|-|f(x-h)|}{h}=|f|_+\\prime(x)+|f|_-\\prime(x)"},{"id":"s2","latex":"f(x)>0\\Rightarrow L(x)=2f\\prime(x),\\quad f(x)<0\\Rightarrow L(x)=-2f\\prime(x),\\quad f(r)=0\\Rightarrow L(r)=0"},{"id":"s3","latex":"f(r)=0\\text{이고 }x-r\\text{가 한 번만 곱해지면 }L(r-)=-2|f\\prime(r)|,\\quad L(r+)=2|f\\prime(r)|"},{"id":"s4","latex":"f\\text{가 }r\\text{에서 부호가 바뀌고 }f\\prime(r)\\ne0\\text{이면, }g\\text{의 연속성에서 }f(r-3)=0"},{"id":"s5","latex":"\\text{가장 작은 실근 }p\\text{에서는 }x-p\\text{가 적어도 두 번 곱해진다.}"},{"id":"s6","latex":"f(x)=(x-p)^3\\Rightarrow g(x)=0\\text{의 서로 다른 근은 }p,p+3\\text{뿐}\\quad\\text{모순}"},{"id":"s7","latex":"\\therefore\\ f(x)=(x-p)^2(x-q),\\quad q>p"},{"id":"s8","latex":"q\\text{는 단순근},\\ f(q-3)=0\\Rightarrow q-3=p\\Rightarrow q=p+3"},{"id":"s9","latex":"f(x)=(x-p)^2(x-p-3),\\qquad f\\prime(x)=3(x-p)(x-p-2)"},{"id":"s10","latex":"g(x)=0\\Rightarrow x\\in\\{p,p+2,p+3,p+6\\}"},{"id":"s11","latex":"4p+11=7\\Rightarrow p=-1"},{"id":"s12","latex":"f(5)=(5+1)^2(5-2)=\\boxed{108}"}],"diagram":null,"contentHash":"ee5396dfb630955b16584c3eadd81394cef83c7a95df1815ddc0d3621ec23014","questionHtml":"<p class=\"hp\">최고차항의 계수가 <span class=\"heq\">\\(1\\)<\/span>인 삼차함수 <span class=\"heq\">\\(f \\left( x \\right)\\)<\/span>에 대하여 함수<\/p><p class=\"hp htall\">&emsp;<span class=\"heq\">\\(g \\left( x \\right) =f \\left( x-3 \\right) \\times \\lim\\limits_{h \\to  0+} {} \\dfrac{\\left| f(x+h) \\right| - \\left| f(x-h) \\right|}{h}\\)<\/span><\/p><p class=\"hp\">가 다음 조건을 만족시킬 때, <span class=\"heq\">\\(f \\left( 5 \\right)\\)<\/span>의 값을 구하시오. <span class=\"hscore\">[4점]<\/span><\/p><div class=\"hbox\"><p class=\"hp\">(가) 함수 <span class=\"heq\">\\(g \\left( x \\right)\\)<\/span>는 실수 전체의 집합에서 연속이다.<\/p><p class=\"hp\">(나) 방정식 <span class=\"heq\">\\(g \\left( x \\right)\\)<\/span><span class=\"heq\">\\(=0\\)<\/span>은 서로 다른 네 실근 <span class=\"heq\">\\(\\alpha_{1} ,\\, \\alpha_{2} ,\\, \\alpha_{3} ,\\, \\alpha_{4}\\)<\/span>를 갖고 <span class=\"heq\">\\(\\alpha_{1} + \\alpha_{2} + \\alpha_{3} + \\alpha_{4}\\)<\/span><span class=\"heq\">\\(=7\\)<\/span>이다.<\/p><\/div>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"6a8162b5dfb8e1a3e1e2d509edb933a5afcb99e082a2fb69c0b7dee9b498189b"};</script>
<script>window.HandStudyGuide={"itemId":17216,"sourceHash":"a8ef7960a8d760f5e9e3a9f768dad97a7811f0a89637ffe3fbca381106378c2d","contentHash":"ee5396dfb630955b16584c3eadd81394cef83c7a95df1815ddc0d3621ec23014","overview":{"goal":"절댓값 차의 한쪽 극한이 근을 지날 때 어떻게 바뀌는지 살펴 삼차함수의 근을 정해요.","firstLook":"\\(f(x)\\)가 양수인 곳과 음수인 곳에서 절댓값을 따로 풀어요. 부호가 바뀌는 근에서는 극한식이 뛰므로, 앞의 인수 \\(f(x-3)\\)가 그 점에서 \\(0\\)이어야 \\(g\\)가 연속이에요.","conditions":[{"label":"(가)","meaning":"부호가 바뀌는 근에서 극한식의 좌우 값이 달라도 \\(f(x-3)\\)가 그 차이를 없애야 해요."},{"label":"(나)의 근 개수","meaning":"\\(f(x-3)=0\\), 원래 \\(f(x)=0\\), \\(f'(x)=0\\)에서 생기는 서로 다른 점을 합쳐 네 개예요."},{"label":"(나)의 합","meaning":"네 근을 구한 뒤 합이 \\(7\\)이라는 조건이 남은 위치를 정해요."}]},"chapters":[{"id":"c1","label":"절댓값 차의 좌우 값을 계산해요","stepIds":["s1","s2","s3","s4"],"question":"부호가 바뀌는 근 \\(r\\)에서 \\(g\\)가 연속이려면 왜 \\(f(r-3)=0\\)이어야 할까요?","hint":"\\(f>0\\)일 때와 \\(f<0\\)일 때 극한식을 계산하고, \\(r\\)의 양쪽에서 얻는 값을 비교해요.","explanation":"극한 부분을 \\(L(x)\\)라 해요. \\(f(x)>0\\)인 곳에서는 절댓값이 그대로 풀려 \\(L(x)=2f'(x)\\), \\(f(x)<0\\)인 곳에서는 \\(L(x)=-2f'(x)\\)예요. 또 \\(f(r)=0\\)이면 대칭으로 뺀 두 절댓값의 1차 변화가 상쇄되어 \\(L(r)=0\\)이에요.\n\n특히 \\(f(x)\\)가 \\(r\\)에서 부호를 바꾸고 \\(f'(r)\ne0\\)이면 \\(L(x)\\)의 좌우 값은 \\(-2|f'(r)|\\)와 \\(2|f'(r)|\\)로 달라요. \\(g(x)=f(x-3)L(x)\\)가 이 점에서 연속이고 \\(g(r)=0\\)이 되려면 뛰는 값에 곱해진 \\(f(r-3)\\)가 \\(0\\)이어야 해요.","check":{"prompt":"부호가 바뀌는 근에서 \\(L(r)=0\\)이라는 사실만으로 \\(g\\)의 연속성이 보장되지 않는 이유는 무엇인가요?","answer":"\\(r\\)의 양쪽에서 \\(L(x)\\)가 서로 다른 0이 아닌 값에 가까워질 수 있어요. 따라서 앞의 인수 \\(f(x-3)\\)가 \\(0\\)으로 가야 좌우의 곱이 모두 \\(0\\)이 돼요."}},{"id":"c2","label":"가장 왼쪽 근의 반복을 정해요","stepIds":["s5","s6","s7","s8"],"question":"삼차함수의 가장 작은 근은 왜 같은 인수가 두 번 곱해진 근이어야 할까요?","hint":"가장 작은 근에서 부호가 바뀐다면 3만큼 더 작은 근이 필요하다는 연속 조건과 충돌해요.","explanation":"가장 작은 실근에서 \\(f\\)의 부호가 바뀌고 도함숫값이 \\(0\\)이 아니면, 앞의 논리로 그보다 \\(3\\) 작은 수도 근이어야 해 모순이에요. 따라서 가장 작은 근 \\(p\\)에서는 \\(x-p\\)가 적어도 두 번 곱해져야 해요. 세 번 모두 곱해진 \\(f(x)=(x-p)^3\\)이라면 \\(g(x)=0\\)의 서로 다른 근은 \\(p\\)와 \\(p+3\\)뿐이라 네 근 조건을 만족하지 못해요.\n\n그래서 \\(f(x)=(x-p)^2(x-q)\\)이고 \\(q>p\\)예요. \\(q\\)에서는 \\(x-q\\)가 한 번 곱해져 부호가 바뀌므로 연속 조건에서 \\(f(q-3)=0\\)이에요. \\(q-3\\)은 \\(q\\)보다 작은 근이므로 \\(p\\)여야 하고, 따라서 \\(q=p+3\\)이에요.","check":{"prompt":"\\(q-3=q\\)가 될 가능성은 왜 없나요?","answer":"그 등식은 \\(-3=0\\)을 뜻해 불가능하고, \\(q-3<q\\)이므로 이미 있는 더 작은 근 \\(p\\)와 같아야 해요."}},{"id":"c3","label":"네 근을 빠짐없이 모아요","stepIds":["s9","s10"],"question":"\\(g(x)=0\\)의 네 근은 각각 어느 인수에서 나오나요?","hint":"\\(f(x-3)=0\\)인 점과 \\(L(x)=0\\)인 점을 따로 구한 뒤 겹치는 점을 한 번만 써요.","explanation":"\\(f(x)=(x-p)^2(x-p-3)\\)이고 \\(f'(x)=3(x-p)(x-p-2)\\)예요. \\(f(x-3)=0\\)에서는 \\(x=p+3,p+6\\)을 얻어요. 한편 \\(L(x)=0\\)은 \\(f(x)=0\\)인 \\(x=p,p+3\\)과, 부호가 일정한 곳에서 \\(f'(x)=0\\)이 되는 \\(x=p+2\\)에서 생겨요. 모두 합치면 서로 다른 근은 \\(p,p+2,p+3,p+6\\) 네 개예요.","check":{"prompt":"\\(x=p+3\\)을 두 번 세지 않는 이유는 무엇인가요?","answer":"\\(f(x-3)=0\\)과 \\(f(x)=0\\)을 모두 만족하지만 방정식의 서로 다른 실근을 세므로 한 번만 적어요."}},{"id":"c4","label":"근의 합으로 위치를 확정해요","stepIds":["s11","s12"],"question":"네 근의 합과 최고차항 조건에서 \\(f(5)\\)는 어떻게 나오나요?","hint":"\\(p+(p+2)+(p+3)+(p+6)=7\\)을 먼저 풀어요.","explanation":"네 근의 합은 \\(4p+11\\)이고 이것이 \\(7\\)이므로 \\(p=-1\\)이에요. 최고차항 계수가 \\(1\\)이어서 앞에 다른 상수는 붙지 않으므로 \\(f(x)=(x+1)^2(x-2)\\)예요. 따라서 \\(f(5)=6^2\\cdot3=108\\)이에요.","check":{"prompt":"인수분해식 앞에 상수 \\(A\\)를 더 두지 않아도 되는 이유는 무엇인가요?","answer":"세 인수의 곱의 최고차항이 \\(x^3\\)이고 문제에서 최고차항 계수가 \\(1\\)이라고 했으므로 그 상수는 \\(1\\)이에요."}}],"takeaway":["절댓값이 있는 극한은 안쪽 함수의 부호가 같은 곳과 바뀌는 근을 나누어 좌우 값을 계산해요.","연속 조건으로 한 근에서 일정한 거리만큼 떨어진 다른 근을 강제할 수 있어요.","곱의 각 인수가 만드는 영점을 합칠 때 겹치는 점은 한 번만 세어요."]};</script>
