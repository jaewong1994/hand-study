003c/p>\u003c/div>\u003cp class=\"hp\">실수 전체의 집합에서 정의된 함수\u003cbr>&emsp;&emsp;&emsp;\u003c/p>\u003cp class=\"hp\">\\(g(x)=\\begin{cases}|x|/x+n&x\\ne0\\\\n&x=0\\end{cases}\\)\u003c/p>\u003cp class=\"hp\">\u003cbr>에 대하여 함수 \u003cspan class=\"heq\">\\((f \\circ g)(x)\\)\u003c/span>가 상수함수가 되도록 하는 \u003cspan class=\"heq\">\\(60\\)\u003c/span> 이하의 자연수 \u003cspan class=\"heq\">\\(n\\)\u003c/span>의 개수는? \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">➀ \u003cspan class=\"heq\">\\(30\\)\u003c/span>&emsp;➁ \u003cspan class=\"heq\">\\(32\\)\u003c/span>&emsp;➂ \u003cspan class=\"heq\">\\(34\\)\u003c/span>&emsp;➃ \u003cspan class=\"heq\">\\(36\\)\u003c/span>&emsp;➄ \u003cspan class=\"heq\">\\(38\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/214c8de86669e49c8740e5e5.png\" style=\"width:396px;max-width:100%\">\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"683acf2f6a30c015f8a83fedb5085a88b6aac392273a2dcadab25fbd03f5cb4c"};</script>
