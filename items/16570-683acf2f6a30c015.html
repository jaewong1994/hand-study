<script>window.HandStudyRecord={"itemId":16570,"sourceLabel":"2019 평가원 고3 수리나형 6월 21번","adminYear":2019,"grade":3,"month":6,"number":21,"track":"수리나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"실수 전체의 집합에서 정의된 함수 $f(x)$가 다음 조건을 만족시킨다.\n(가) $f(x)= {\\begin{cases}eqalign{\\,2 \\\\ \\\\ \\,-2x+6 \\\\ \\,}&eqalign{(\\,0 \\leq x\\lt 2) \\\\ \\\\ (\\,2 \\leq x\\lt 3) \\\\ } \\\\ \\,0&(3 \\leq x \\leq 4)\\end{cases}}$\n(나) 모든 실수 $x$에 대하여\n$f(- x) = f(x)$이고 $f(x) = f(x - 8)$이다.\n실수 전체의 집합에서 정의된 함수\n$g(x) =$$\\begin{cases}{}^{}^{}{}_{}_{} \\\\ {}^{}^{}{}_{}_{}_{}_{}_{}_{}\\end{cases}$\n$\\dfrac{ \\left| x \\right| }{x}+ n$\n$(x\\neq 0)$\n$n$\n$(x = 0)$\n에 대하여 함수 $(f \\circ g)(x)$가 상수함수가 되도록 하는 $60$ 이하의 자연수 $n$의 개수는? [4점]\n➀ $30$ ➁ $32$ ➂ $34$ ➃ $36$ ➄ $38$\n[그림 1]\n단답형(22~30)","answer":"①","sourceHash":"af901e9be8e178da94fbebd32c13fcbe3fa817c55cca1a243606b09674f3cfce","steps":[{"id":"s1","latex":"f(-x)=f(x),\\quad f(x)=f(x-8)\\Rightarrow f\\text{는 주기 }8\\text{인 짝함수}"},{"id":"s2","latex":"f(x)=2\\quad(8k-2\\le x\\le8k+2),\\qquad f(x)=0\\quad(8k+3\\le x\\le8k+5)"},{"id":"s3","latex":"g(x)\\in\\{n-1,n,n+1\\}\\Rightarrow f(n-1)=f(n)=f(n+1)"},{"id":"s4","latex":"f=2:\\quad8k-1\\le n\\le8k+1"},{"id":"s5","latex":"f=0:\\quad n=8k+4"},{"id":"s6","latex":"1\\le n\\le60:\\quad1+3\\cdot7=22\\text{개},\\qquad8\\text{개}"},{"id":"s7","latex":"22+8=30"}],"diagram":null,"contentHash":"1c86347867af355383fba76f0e447e6a5846d41b56091f10bbf18e7b8e1feb03","questionHtml":"\u003cp class=\"hp\">실수 전체의 집합에서 정의된 함수 \u003cspan class=\"heq\">\\(f(x)\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp htall\">(가) \u003cspan class=\"heq\">\\(f(x)=\\begin{cases}2&0\\le x\\lt2\\\\-2x+6&2\\le x\\lt3\\\\0&3\\le x\\le4\\end{cases}\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">(나) 모든 실수 \u003cspan class=\"heq\">\\(x\\)\u003c/span>에 대하여\u003cbr>\u003cspan class=\"heq\">\\(f(- x) = f(x)\\)\u003c/span>이고 \u003cspan class=\"heq\">\\(f(x) = f(x - 8)\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp class=\"hp\">실수 전체의 집합에서 정의된 함수\u003cbr>&emsp;&emsp;&emsp;\u003c/p>\u003cp class=\"hp\">\\(g(x)=\\begin{cases}|x|/x+n&x\\ne0\\\\n&x=0\\end{cases}\\)\u003c/p>\u003cp class=\"hp\">\u003cbr>에 대하여 함수 \u003cspan class=\"heq\">\\((f \\circ g)(x)\\)\u003c/span>가 상수함수가 되도록 하는 \u003cspan class=\"heq\">\\(60\\)\u003c/span> 이하의 자연수 \u003cspan class=\"heq\">\\(n\\)\u003c/span>의 개수는? \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">➀ \u003cspan class=\"heq\">\\(30\\)\u003c/span>&emsp;➁ \u003cspan class=\"heq\">\\(32\\)\u003c/span>&emsp;➂ \u003cspan class=\"heq\">\\(34\\)\u003c/span>&emsp;➃ \u003cspan class=\"heq\">\\(36\\)\u003c/span>&emsp;➄ \u003cspan class=\"heq\">\\(38\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/214c8de86669e49c8740e5e5.png\" style=\"width:396px;max-width:100%\">\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"683acf2f6a30c015f8a83fedb5085a88b6aac392273a2dcadab25fbd03f5cb4c"};</script>
<script>window.HandStudyGuide={"itemId":16570,"sourceHash":"af901e9be8e178da94fbebd32c13fcbe3fa817c55cca1a243606b09674f3cfce","contentHash":"1c86347867af355383fba76f0e447e6a5846d41b56091f10bbf18e7b8e1feb03","overview":{"goal":"짝함수와 주기 조건으로 \\(f\\)의 반복 구간을 찾고, 연속된 세 정수에서 함숫값이 같은 \\(n\\)을 세어요.","firstLook":"\\(g(x)\\)는 \\(x<0,x=0,x>0\\)에서 각각 \\(n-1,n,n+1\\)이에요. 합성함수가 상수이려면 이 세 곳의 \\(f\\)값이 같아야 해요.","conditions":[{"label":"짝함수와 주기","meaning":"주어진 \\([0,4]\\)의 모양을 좌우로 뒤집고 8씩 반복해요."},{"label":"상수 합성함수","meaning":"\\(f(n-1)=f(n)=f(n+1)\\)이어야 해요."}]},"chapters":[{"id":"c1","label":"함수의 반복 구간을 읽어요","stepIds":["s1","s2"],"question":"\\(f\\)가 일정한 구간은 8마다 어떻게 반복될까요?","hint":"그림의 \\([0,4]\\) 부분을 \\(y\\)축에 대칭시키고 오른쪽으로 8씩 옮겨요.","explanation":"\\(f\\)는 주기 8인 짝함수예요. 그림과 식에서 \\(f(x)=2\\)인 구간은 \\(8k-2\\le x\\le8k+2\\), \\(f(x)=0\\)인 구간은 \\(8k+3\\le x\\le8k+5\\)예요. 그 사이 길이 1인 구간에서는 값이 2와 0 사이에서 변해요.","check":{"prompt":"\\([6,10]\\)에서 \\(f(x)=2\\)인 이유는 무엇인가요?","answer":"\\([-2,2]\\)에서 값이 2이고 주기가 8이므로 오른쪽으로 8만큼 옮긴 \\([6,10]\\)에서도 2예요."}},{"id":"c2","label":"연속된 세 입력의 값을 같게 해요","stepIds":["s3","s4","s5"],"question":"\\(n-1,n,n+1\\)이 어느 구간 안에 함께 있어야 할까요?","hint":"길이 2인 세 정수 묶음이 높이 2 또는 높이 0인 평평한 구간 안에 들어가야 해요.","explanation":"\\(x<0, x=0, x>0\\)에서 \\(g(x)\\)의 값은 각각 \\(n-1,n,n+1\\)이므로 세 \\(f\\)값이 같아야 해요. 높이 2인 \\([8k-2,8k+2]\\) 안에 세 수가 모두 들어가려면 \\(8k-1\\le n\\le8k+1\\)이에요. 높이 0인 \\([8k+3,8k+5]\\) 안에서는 가운데가 \\(n=8k+4\\)일 때만 세 수가 모두 들어가요.","check":{"prompt":"기울어진 구간에서는 세 값이 같을 수 없는 이유는 무엇인가요?","answer":"연속된 세 정수 가운데 적어도 하나는 평평한 구간 밖에 있고, 기울어진 구간의 함숫값은 끝의 0 또는 2와 같지 않기 때문이에요."}},{"id":"c3","label":"60 이하의 자연수를 빠짐없이 세어요","stepIds":["s6","s7"],"question":"두 종류에서 각각 몇 개의 \\(n\\)이 나올까요?","hint":"높이 2인 경우는 \\(k=0\\)과 \\(k=1,\\ldots,7\\)을 나누고, 높이 0인 경우는 \\(4,12,\\ldots,60\\)을 세어요.","explanation":"높이 2인 경우 \\(k=0\\)에서는 자연수 \\(n=1\\)만 가능하고, \\(k=1,\\ldots,7\\)에서는 각각 세 개씩 나와 \\(1+3\\times7=22\\)개예요. 높이 0인 경우는 \\(n=8k+4\\)이고 \\(4,12,20,28,36,44,52,60\\)의 8개예요. 두 경우는 겹치지 않으므로 전체는 \\(22+8=30\\)개, 정답은 ①이에요.","check":{"prompt":"높이 0인 마지막 값 \\(60\\)을 포함하는 이유는 무엇인가요?","answer":"문제는 60 이하라고 했고 \\(60=8\\cdot7+4\\)이므로 조건을 만족해요."}}],"takeaway":["짝함수와 주기함수 조건은 기준 구간의 모양을 대칭하고 평행이동해 전체 구간으로 넓혀요.","합성함수의 안쪽 값이 몇 개뿐이면 각 입력에서 바깥 함숫값이 같은지 직접 비교해요."]};</script>
