<script>window.HandStudyRecord={"itemId":11779,"sourceLabel":"2021 교육청 고1 수학 6월 30번","adminYear":2021,"grade":1,"month":6,"number":30,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"$5\\,$이상의 자연수 $n\\,$에 대하여 다항식\n $P _{n} \\left( x \\right) =(1+x)(1+x ^{2} )(1+x ^{3} ) \\cdots (1+x ^{n-1} )(1+x ^{n} )-64\\,$\n 가 $x ^{2} +x+1\\,$로 나누어떨어지도록 하는 모든 자연수 $n\\,$의 값의 합을 구하시오. [4점]","answer":"38","sourceHash":"6ee92a965c3fdd39357cc7411a3f6b9b6b4c8d514d5c2f12b94418b9a05bce67","steps":[{"id":"s1","latex":"\\omega^2+\\omega+1=0\\Rightarrow\\omega^3=1"},{"id":"s2","latex":"(1+\\omega)(1+\\omega^2)(1+\\omega^3)=1\\cdot2=2"},{"id":"s3","latex":"\\prod_{k=1}^{n}(1+\\omega^k)=\\begin{cases}2^m&n=3m\\\\2^m(1+\\omega)&n=3m+1\\\\2^m&n=3m+2\\end{cases}"},{"id":"s4","latex":"P_n(\\omega)=0\\iff\\prod_{k=1}^{n}(1+\\omega^k)=64"},{"id":"s5","latex":"2^m=64\\Rightarrow m=6,\\qquad n=18\\ \\text{또는}\\ 20"},{"id":"s6","latex":"18+20=38"}],"diagram":null,"contentHash":"e56c89920203c659e385d06fa2ee34c57ddb6c5fb53987e5ae5d962b8f9456c1","questionHtml":"\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(5\\,\\)\u003c/span>이상의 자연수 \u003cspan class=\"heq\">\\(n\\,\\)\u003c/span>에 대하여 다항식\u003c/p>\u003cp class=\"hp\">&emsp;\u003cspan class=\"heq\">\\(P_{n} \\left( x \\right) =(1+x)(1+x^{2} )(1+x^{3} ) \\cdots (1+x^{n-1} )(1+x^{n} )-64\\,\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">가 \u003cspan class=\"heq\">\\(x^{2} +x+1\\,\\)\u003c/span>로 나누어떨어지도록 하는 모든 자연수 \u003cspan class=\"heq\">\\(n\\,\\)\u003c/span>의 값의 합을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"9a497c7fd4fbeea5f66236c04c97649d79ba676580571bf24d874ed268abc62e"};</script>
<script>window.HandStudyGuide={"itemId":11779,"sourceHash":"6ee92a965c3fdd39357cc7411a3f6b9b6b4c8d514d5c2f12b94418b9a05bce67","contentHash":"e56c89920203c659e385d06fa2ee34c57ddb6c5fb53987e5ae5d962b8f9456c1","overview":{"goal":"\\(x^2+x+1\\)의 두 근을 대입하고, 지수를 세 항씩 묶어 나누어떨어지는 \\(n\\)을 찾아요.","firstLook":"\\(x^2+x+1\\)의 한 근을 \\(\\omega\\)라 하면 \\(1+\\omega+\\omega^2=0\\), \\(\\omega^3=1\\)이에요. 계수가 실수이므로 \\(\\omega\\)에서 0이면 켤레인 \\(\\omega^2\\)에서도 0이에요.","conditions":[{"label":"나누어떨어짐","meaning":"\\(P_n(\\omega)=0\\)을 만족하면 두 근 \\(\\omega,\\omega^2\\)가 모두 근이 되어 이차식으로 나누어떨어져요."}]},"chapters":[{"id":"c1","label":"세 항 한 묶음의 곱을 직접 계산해요","stepIds":["s1","s2"],"question":"\\((1+\\omega)(1+\\omega^2)(1+\\omega^3)\\)은 왜 2인가요?","hint":"앞의 두 인수를 먼저 곱하고 \\(1+\\omega+\\omega^2=0\\)을 사용해요.","explanation":"\\((1+\\omega)(1+\\omega^2)=1+\\omega+\\omega^2+\\omega^3\\)이에요. 여기서 \\(1+\\omega+\\omega^2=0\\), \\(\\omega^3=1\\)이므로 앞의 두 인수의 곱은 1이에요. 또 \\(1+\\omega^3=2\\)이므로 세 항을 한 묶음으로 한 전체 곱은 \\(1\\times2=2\\)예요.","check":{"prompt":"\\((1+\\omega)(1+\\omega^2)\\)의 값은 얼마인가요?","answer":"전개하면 \\(1+\\omega+\\omega^2+\\omega^3=1\\)이에요."}},{"id":"c2","label":"세 가지 나머지 경우를 빠짐없이 나눠요","stepIds":["s3","s4","s5"],"question":"\\(n\\)을 3으로 나눈 나머지에 따라 곱은 어떻게 달라지나요?","hint":"완전한 세 항 묶음 뒤에 남는 인수가 0개, 1개, 2개인 경우를 각각 써요.","explanation":"\\(n=3m\\)이면 세 항 묶음이 \\(m\\)개라 곱은 \\(2^m\\)이에요. \\(n=3m+1\\)이면 다음 인수 \\(1+\\omega^{3m+1}=1+\\omega\\)가 남아 \\(2^m(1+\\omega)\\)예요. \\(n=3m+2\\)이면 \\((1+\\omega)(1+\\omega^2)=1\\)까지 붙으므로 다시 \\(2^m\\)이에요. \\(P_n(\\omega)=0\\)은 이 곱이 64라는 뜻이에요. 나머지가 1인 경우에는 허수가 0이 아닌 \\(1+\\omega\\)가 남아 양의 실수 64가 될 수 없어요. 나머지가 0 또는 2이면 \\(2^m=64=2^6\\)이라 \\(m=6\\), 따라서 \\(n=18\\) 또는 \\(20\\)이에요.","check":{"prompt":"\\(n=19\\)가 탈락하는 정확한 이유는 무엇인가요?","answer":"\\(19=3\\times6+1\\)이라 곱이 \\(64(1+\\omega)\\)이고, \\(1+\\omega\\ne1\\)이므로 64가 아니에요."}},{"id":"c3","label":"두 근에 대한 충분성도 확인해요","stepIds":["s6"],"question":"\\(n=18,20\\)이면 정말 이차식으로 나누어떨어지나요?","hint":"\\(P_n\\)의 계수가 실수라는 점을 사용해요.","explanation":"두 값에서 \\(P_n(\\omega)=0\\)임을 확인했어요. \\(P_n\\)의 계수는 실수이므로 켤레인 \\(\\omega^2\\)를 대입한 값도 0이에요. 따라서 \\(x^2+x+1\\)의 두 근이 모두 \\(P_n\\)의 근이어서 실제로 나누어떨어져요. 두 값은 모두 \\(n\\ge5\\)이고 합은 \\(18+20=38\\)이에요.","check":{"prompt":"가능한 \\(n\\)의 합은 얼마인가요?","answer":"\\(18+20=38\\)이에요."}}],"takeaway":["이차식으로 나누어떨어지는지는 두 근을 대입해 모두 0이 되는지 확인해요.","복소수의 거듭제곱이 주기적으로 반복되면 한 주기의 곱과 남은 인수를 나누어 계산해요.","필요조건으로 후보를 찾은 뒤 켤레근까지 0이 되는 충분성도 확인해요."]};</script>
