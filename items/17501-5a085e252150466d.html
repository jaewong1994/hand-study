<script>window.HandStudyGuide={"itemId":17501,"sourceHash":"c60a6c14aa81170ec9d5e78b05e820fdf13e91242f4fcb00a2c1da4ec5684fb0","contentHash":"ffd7079672c62af22faf04a788fd99a24785e90b7266a83810eb9046ce9eaa57","overview":{"goal":"로그함수의 불연속과 영점 개수, 절댓값의 극소 조건으로 삼차함수를 정한 뒤 극솟값을 구해요.","firstLook":"\\(\\ln|f(x)|\\)는 \\(f=0\\)에서 정의되지 않고, 그 영점은 로그값이 0인 \\(|f|=1\\)에서 생겨요.","conditions":[{"label":"불연속점이 하나","meaning":"삼차함수의 유일한 실근 위치를 확정하고 양쪽에서 \\(f\\)의 부호를 정해요."},{"label":"절댓값이 특정 점에서 극소","meaning":"로그값의 부호와 함수의 극값을 함께 이용해 접하는 높이를 정해요."}]},"chapters":[{"id":"c1","label":"로그함수의 정의역과 부호","stepIds":["s1","s2","s3"],"question":"불연속점이 \\(x=1\\)뿐이라는 조건은 \\(f\\)의 실근과 부호를 어떻게 정하나요?","hint":"로그의 진수 \\(|f(x)|\\)가 0이 되는 곳에서만 함수가 정의되지 않아요.","explanation":"\\(g(x)=\\ln|f(x)|\\)는 \\(f(x)=0\\)에서만 정의되지 않으므로 \\(f\\)의 유일한 실근은 \\(1\\)이에요. 최고차항의 계수가 양수인 삼차함수이므로 \\(x<1\\)에서는 \\(f(x)<0\\), \\(x>1\\)에서는 \\(f(x)>0\\)예요. 특히 \\(x=2\\) 근방에서는 \\(g'=f'/f\\)이고 분모가 양수라 \\(g\\)와 \\(f\\)의 증가·감소가 같아요.\n\n\\(g\\)가 \\(2\\)에서 극대이므로 \\(f\\)도 그곳에서 극대이고 \\(f'(2)=0\\)이에요. 그런데 \\(|g|\\)가 같은 곳에서 극소가 되려면 \\(g(2)>0\\)일 수 없어요. 양수라면 근방에서 \\(|g|=g\\)라 극대가 되기 때문이에요. 따라서 \\(g(2)\\le0\\), 즉 \\(f(2)\\le1\\)이에요.","check":{"prompt":"\\(x=2\\) 근방에서 \\(g'\\)와 \\(f'\\)의 부호가 같은 까닭은 무엇인가요?","answer":"그 근방은 \\(x>1\\)이고 \\(f(x)>0\\)이므로 \\(g'=f'/f\\)의 분모가 양수예요."}},{"id":"c2","label":"영점 개수로 접점 확정","stepIds":["s4","s5"],"question":"\\(g=0\\)인 점이 세 개라는 조건에서 왜 \\(f(2)=1\\)이 되나요?","hint":"\\(g=0\\)은 \\(|f|=1\\)이고, 왼쪽에서는 \\(f=-1\\), 오른쪽에서는 \\(f=1\\)을 살펴보세요.","explanation":"\\(g(x)=0\\)은 \\(|f(x)|=1\\)과 같아요. \\(x<1\\)의 음의 가지에서는 \\(f=-1\\)인 점이 하나 있고, 나머지 두 영점은 \\(x>1\\)에서 \\(f=1\\)인 점들이어야 해요. \\(x=2\\)가 오른쪽 가지의 극대점이고 \\(f(2)le1\\)이므로, 수평선 \\(y=1\\)이 이 가지와 두 번 만나려면 극대점에서 접해야 해요. 따라서 \\(f(2)=1\\)이에요.\n\n최고차항 계수가 \\(1/2\\)인 삼차함수를 \\(f(x)=\\frac12x^3+Ax^2+Bx+C\\)로 두고 \\(f(1)=0\\), \\(f(2)=1\\), \\(f'(2)=0\\)을 풀면 \\(f(x)=\\frac12(x-1)(x^2-6x+10)\\)을 얻어요.","check":{"prompt":"완성된 식이 유일한 실근 \\(1\\)을 갖는지 어떻게 확인하나요?","answer":"이차인수는 \\((x-3)^2+1>0\\)이므로 실근은 일차인수에서 나오는 \\(1\\)뿐이에요."}},{"id":"c3","label":"로그함수의 극솟값","stepIds":["s6","s7"],"question":"\\(x>2\\)에서 \\(f\\)가 다시 작아지는 지점과 그 함숫값은 무엇인가요?","hint":"도함수를 인수분해하고 \\(2\\) 다음의 임계점을 찾으세요.","explanation":"미분하면 \\(f'(x)=\\frac12(x-2)(3x-8)\\)이에요. \\(2<x<8/3\\)에서는 감소하고 \\(x>8/3\\)에서는 증가하므로 \\(x=8/3\\)에서 극소예요. 대입하면 \\(f(8/3)=25/27\\)이고 이 값은 양수이므로 \\(g\\)의 극솟값은 \\(\\ln(25/27)\\)이에요. 정답은 ⑤예요.","check":{"prompt":"왜 로그를 취한 뒤에도 극솟값 위치가 바뀌지 않나요?","answer":"\\(x>1\\)에서 \\(f>0\\)이고 자연로그는 양수 구간에서 증가하므로 \\(f\\)가 작아지는 위치와 \\(\\ln f\\)가 작아지는 위치가 같아요."}}],"takeaway":["로그 절댓값 함수의 불연속점은 원래 함수의 영점이에요.","절댓값의 극소 조건은 원래 함수값이 로그 기준값보다 위인지 아래인지 구분하게 해요.","영점 개수는 수평선과 삼차함수의 교점 개수로 해석해요."]};</script>
