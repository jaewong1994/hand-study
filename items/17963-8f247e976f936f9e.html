<script>window.HandStudyRecord={"adminYear":2024,"answer":"②","contentHash":"5ebac67a986a3e06c7b579cde21c08a332510506164f24a932067781ca42f326","diagram":null,"editionHash":"8f247e976f936f9e10ecb3e4e98828b784a8efd2d0df54956f5431bba07d01ee","grade":3,"graphHash":"","graphPlan":null,"itemId":17963,"learningHash":"859088676a58e31fd6a8d7609f022ee8901c793dc7324cf31199e865ab0d6e81","month":5,"number":28,"points":4,"preview":false,"questionHtml":"\u003cp class=\"hp\">두 상수 \u003cspan class=\"heq\">\\(a \\, \\left(a\\gt 0 \\right)\\)\u003c/span>, \u003cspan class=\"heq\">\\(b\\)\u003c/span>에 대하여 두 함수 \u003cspan class=\"heq\">\\(f(x)\\)\u003c/span>, \u003cspan class=\"heq\">\\(g(x)\\)\u003c/span>를\u003c/p>\u003cp class=\"hp\">&emsp;\u003cspan class=\"heq\">\\(f \\left(x \\right)=a \\sin\\, x-\\cos\\, x\\)\u003c/span>, \u003cspan class=\"heq\">\\(g \\left(x \\right)=e^{2x-b} -1\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">이라 하자. 두 함수 \u003cspan class=\"heq\">\\(f(x)\\)\u003c/span>, \u003cspan class=\"heq\">\\(g(x)\\)\u003c/span>가 다음 조건을 만족시킬 때, \u003cspan class=\"heq\">\\(\\tan b\\)\u003c/span>의 값은? \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp htall\">\u003cdiv class=\"hbox\">\u003cp class=\"hp htall\">(가) \u003cspan class=\"heq\">\\(f(k)=g(k)=0\\)\u003c/span>을 만족시키는 실수 \u003cspan class=\"heq\">\\(k\\)\u003c/span>가 열린구간 \u003cbr>\u003cspan class=\"heq\">\\(\\left(-\\dfrac{ \\pi}{2},\\, \\dfrac{ \\pi}{2} \\right)\\)\u003c/span>에 존재한다.\u003c/p>\u003cp class=\"hp htall\">(나) 열린구간 \u003cspan class=\"heq\">\\(\\left(-\\dfrac{ \\pi}{2},\\, \\dfrac{ \\pi}{2} \\right)\\)\u003c/span>에서 방정식 \u003cspan class=\"heq\">\\(\\left\\{ f(x) g(x) \\right\\}' =2 f(x)\\)\u003c/span>의 모든 해의 합은 \u003cspan class=\"heq\">\\(\\dfrac{ \\pi}{4}\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003c/p>\u003cp class=\"hp htall\">① \u003cspan class=\"heq\">\\(\\dfrac{5}{2}\\)\u003c/span>&emsp;② \u003cspan class=\"heq\">\\(3\\)\u003c/span>&emsp;③ \u003cspan class=\"heq\">\\(\\dfrac{7}{2}\\)\u003c/span>&emsp;④ \u003cspan class=\"heq\">\\(4\\)\u003c/span>&emsp;⑤ \u003cspan class=\"heq\">\\(\\dfrac{9}{2}\\)\u003c/span>\u003c/p>","questionText":"두 상수 $a \\, \\left(a>0 \\right)$, $b$에 대하여 두 함수 $f(x)$, $g(x)$를\n $f \\left(x \\right)=a \\sin\\, x-\\cos\\, x$, $g \\left(x \\right)=e ^{2x-b} -1$\n이라 하자. 두 함수 $f(x)$, $g(x)$가 다음 조건을 만족시킬 때, $\\tan b$의 값은? [4점]\n(가) $f(k)=g(k)=0$을 만족시키는 실수 $k$가 열린구간 $\\left(-\\frac{ \\pi}{2},\\, \\frac{ \\pi}{2} \\right)$에 존재한다.(나) 열린구간 $\\left(-\\frac{ \\pi}{2},\\, \\frac{ \\pi}{2} \\right)$에서 방정식 $\\left\\{ f(x) g(x) \\right\\} ' =2 f(x)$ 의 모든 해의 합은 $\\frac{ \\pi}{4}$이다.\n① $\\frac{5}{2}$ ② $3$ ③ $\\frac{7}{2}$ ④ $4$ ⑤ $\\frac{9}{2}$\n단답형","scoreStatus":"confirmed_4_direct","sourceHash":"32ce61703f68aacd9668836b3ff52daa2ab53e8214d30eed038086011a94f4e9","sourceLabel":"2024 교육청 고3 수학미적분 5월 28번","stepExplanations":{"s2":{"body":"\\(g^{\\prime}(x)=2e^{2x-b}=2(g(x)+1)\\)이에요. 따라서 \\((fg)^{\\prime}=f^{\\prime}g+fg^{\\prime}=g(f^{\\prime}+2f)+2f\\)이므로, 주어진 방정식은 \\(g(f^{\\prime}+2f)=0\\)과 같아요. 해는 \\(g=0\\)인 경우와 \\(f^{\\prime}+2f=0\\)인 경우로 나누어 찾으면 돼요.","skillTags":["calculus.derivative","algebra.calculation"],"title":"지수함수의 도함수를 g로 다시 써 봐요"},"s3":{"body":"\\(g(x)=0\\)의 해는 \\(k=\\frac b2\\) 하나예요. 또 \\(f^{\\prime}+2f=(a-2)\\cos x+(2a+1)\\sin x\\)이고, 주어진 열린 구간에서는 \\(\\cos x>0\\)이므로 \\(\\tan x=\\frac{2-a}{2a+1}\\)과 같아요. 탄젠트가 이 구간에서 모든 실숫값을 한 번씩 가지므로 이 해 \\(m\\)도 하나예요. 두 해가 같다면 \\(\\frac1a=\\frac{2-a}{2a+1}\\)에서 \\(a^2+1=0\\)이 되어 불가능하므로, 해의 합 조건은 정확히 \\(k+m=\\frac\\pi4\\)예요.","skillTags":["reasoning.casework","algebra.calculation"],"title":"해가 정확히 두 개인지 먼저 세어요"},"s4":{"body":"\\(\\tan k=\\frac1a\\)와 \\(\\tan m=\\frac{2-a}{2a+1}\\)을 합 공식에 넣으면 \\(\\tan(k+m)=\\frac{-a^2+4a+1}{2a^2+2a-2}=1\\)이에요. 따라서 \\(3a^2-2a-3=0\\), 즉 \\(a^2-1=\\frac{2a}3\\)이에요. \\(b=2k\\)이고 \\(a>0\\)이므로 \\(a^2-1>0\\)이라 분모가 0이 아니며, \\(\\tan b=\\frac{2a}{a^2-1}=3\\)을 얻어요.","skillTags":["geometry.reasoning","reasoning.casework"],"title":"각의 합 공식을 쓰고 분모를 정리해요"}},"steps":[{"id":"s1","latex":"g(k)=0\\Rightarrow k=\\frac b2,\\quad f(k)=0\\Rightarrow\\tan k=\\frac1a"},{"id":"s2","latex":"(fg)^{\\prime}=2f\\Rightarrow g\\{f^{\\prime}+2f\\}=0"},{"id":"s3","latex":"\\tan m=\\frac{2-a}{2a+1},\\quad k+m=\\frac\\pi4"},{"id":"s4","latex":"\\tan(k+m)=1\\Rightarrow3a^2-2a-3=0"},{"id":"s5","latex":"a^2-1=\\frac{2a}{3},\\quad\\tan b=\\tan2k=\\frac{2a}{a^2-1}=3"}],"track":"미적분"};</script>
