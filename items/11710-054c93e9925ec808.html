  <script>window.HandStudyRecord={"itemId":11710,"sourceLabel":"2020 교육청 고1 수학 9월 21번","adminYear":2020,"grade":1,"month":9,"number":21,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"좌표평면 위의 두 점 $A \\left( -1 ,\\, 0 \\right)$, $B \\left( 1 ,\\, 0 \\right)$을 지름의 양 끝점으로 하는 원 $C$가 있다. 점 $A$를 지나고 기울기가 $m \\left( 0\u003cm\u003c1 \\right)$인 직선이 원 $C$와 만나는 점 중 $A$가 아닌 점을 $P$라 할 때, 선분 $AP$를 $3 \\,:\\, 1$로 외분하는 점을 $Q$, 선분 $BP$와 선분 $OQ$가 만나는 점을 $R$라 하자. 삼각형 $OBR$의 넓이가 $\\frac{9}{26}$일 때, 상수 $m$의 값은? (단, $O$는 원점이다.) [4점]\n① $\\frac{1}{3}$ ② $\\frac{5}{12}$ ③ $\\frac{1 }{2}$ ④ $\\frac{7}{12}$ ⑤ $\\frac{2}{3}$","answer":"⑤","sourceHash":"5bf430377921d275d5444f8602939f9a87c7435b1e600e77e4d64f8fc9aa307e","steps":[{"id":"s1","latex":"x^2+y^2=1,\\quad y=m(x+1)"},{"id":"s2","latex":"(x+1)\\{(1+m^2)x-(1-m^2)\\}=0"},{"id":"s3","latex":"P=\\left(\\frac{1-m^2}{1+m^2},\\frac{2m}{1+m^2}\\right)"},{"id":"s4","latex":"Q=\\frac{3P-A}{2}=\\left(\\frac{2-m^2}{1+m^2},\\frac{3m}{1+m^2}\\right)"},{"id":"s5","latex":"OQ:\\ y=\\frac{3m}{2-m^2}x,\\qquad BP:\\ y=-\\frac1m(x-1)"},{"id":"s6","latex":"y_R=\\frac{3m}{2(1+m^2)}"},{"id":"s7","latex":"[\\triangle OBR]=\\frac12\\cdot1\\cdot y_R=\\frac9{26}\\Rightarrow6m^2-13m+6=0"},{"id":"s8","latex":"m\\in\\left\\{\\frac23,\\frac32\\right\\},\\quad0\u003cm\u003c1\\Rightarrow m=\\frac23"}],"diagram":null,"contentHash":"aaf499489b13ae6a47e2c8c139ca2b17ae1e8bee37daa1e1edf5b4c81edfb4bc","questionHtml":"\u003cp class=\"hp htall\">좌표평면 위의 두 점 \u003cspan class=\"heq\">\\({{A \\left( -1 ,\\, 0 \\right) }}\\)\u003c/span>, \u003cspan class=\"heq\">\\({B \\left( 1 ,\\, 0 \\right) }\\)\u003c/span>을 지름의 양 끝점으로 하는 원 \u003cspan class=\"heq\">\\(C\\)\u003c/span>가 있다. 점 \u003cspan class=\"heq\">\\({A }\\)\u003c/span>를 지나고 기울기가 \u003cspan class=\"heq\">\\(m \\left( 0\\lt m\\lt 1 \\right)\\)\u003c/span>인 직선이 원 \u003cspan class=\"heq\">\\(C\\)\u003c/span>와 만나는 점 중 \u003cspan class=\"heq\">\\({A }\\)\u003c/span>가 아닌 점을 \u003cspan class=\"heq\">\\({P }
