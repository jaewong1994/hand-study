<script>window.HandStudyRecord={"itemId":17233,"sourceLabel":"2021 평가원 고3 수학확통 6월 30번","adminYear":2021,"grade":3,"month":6,"number":30,"track":"확통","points":4,"scoreStatus":"confirmed_4_direct","questionText":"숫자 $1,\\,2,\\,3$이 하나씩 적혀 있는 $3$개의 공이 들어 있는 주머니가 있다. 이 주머니에서 임의로 한 개의 공을 꺼내어 공에 적혀 있는 수를 확인한 후 다시 넣는 시행을 한다. 이 시행을 $5$번 반복하여 확인한 $5$개의 수의 곱이 $6$의 배수일 확률이 $\\frac{q}{p}$일 때, $p+q$의 값을 구하시오. (단, $p$와 $q$는 서로소인 자연수이다.) [4점]","answer":"47","sourceHash":"7dc81c9e4f879ed354575a2bd0faa58ad3b3d2c3b420cee7ff509638deba130d","steps":[{"id":"s1","latex":"\\text{곱이 }6\\text{의 배수}\\iff2\\text{와 }3\\text{이 각각 적어도 한 번 등장}"},{"id":"s2","latex":"A:\\ 2\\text{가 없음},\\quad B:\\ 3\\text{이 없음}"},{"id":"s3","latex":"P(A)=P(B)=(\\frac23)^5,\\quad P(A\\cap B)=(\\frac13)^5"},{"id":"s4","latex":"P(A\\cup B)=\\frac{32+32-1}{243}=\\frac{63}{243}"},{"id":"s5","latex":"P((A\\cup B)^c)=1-\\frac{63}{243}=\\frac{20}{27}"},{"id":"s6","latex":"p+q=47"}],"diagram":null,"contentHash":"330d585572c7d297e7faea7472634c303d742ff46087e37148989bd217ab270d","questionHtml":"\u003cp class=\"hp htall\">숫자 \u003cspan class=\"heq\">\\(1,\\,2,\\,3\\)\u003c/span>이 하나씩 적혀 있는 \u003cspan class=\"heq\">\\(3\\)\u003c/span>개의 공이 들어 있는 주머니가 있다. 이 주머니에서 임의로 한 개의 공을 꺼내어 공에 적혀 있는 수를 확인한 후 다시 넣는 시행을 한다.\u003cbr>이 시행을 \u003cspan class=\"heq\">\\(5\\)\u003c/span>번 반복하여 확인한 \u003cspan class=\"heq\">\\(5\\)\u003c/span>개의 수의 곱이 \u003cspan class=\"heq\">\\(6\\)\u003c/span>의 배수일 확률이 \u003cspan class=\"heq\">\\(\\dfrac{q}{p}\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(p+q\\)\u003c/span>의 값을 구하시오. \u003cbr>(단, \u003cspan class=\"heq\">\\(p\\)\u003c/span>와 \u003cspan class=\"heq\">\\(q\\)\u003c/span>는 서로소인 자연수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/ac3256e3cdbfc76bdf713cbd.png\" style=\"width:185px;max-width:100%\">\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"ea128b6879e40dba281a2a06889e3619ddd81e9ce0dc77fb9fa19722 <script>window.HandStudyGuide={"itemId":17233,"sourceHash":"7dc81c9e4f879ed354575a2bd0faa58ad3b3d2c3b420cee7ff509638deba130d","contentHash":"330d585572c7d297e7faea7472634c303d742ff46087e37148989bd217ab270d","overview":{"goal":"곱이 6의 배수가 되려면 필요한 숫자를 사건으로 바꾸고 여사건을 포함배제로 세어요.","firstLook":"6의 소인수 2와 3이 곱에 모두 있어야 해요. 즉 다섯 번 중 2와 3이 각각 적어도 한 번 나와야 해요.","conditions":[{"label":"복원추출","meaning":"매번 1, 2, 3이 같은 확률로 나오므로 전체 결과는 3의 5제곱 가지예요."},{"label":"6의 배수","meaning":"2가 한 번 이상, 3도 한 번 이상 등장해야 해요."}]},"chapters":[{"id":"c1","label":"필요한 등장 조건을 잡아요","stepIds":["s1","s2"],"question":"곱이 6의 배수가 아닌 결과는 어떤 사건의 합일까요?","hint":"2가 한 번도 안 나오는 사건과 3이 한 번도 안 나오는 사건을 생각해요.","explanation":"곱에 인수 \\(2\\)와 \\(3\\)이 모두 있어야 \\(6\\)의 배수예요. 따라서 원하는 사건의 반대는 ‘2가 한 번도 나오지 않음’ 또는 ‘3이 한 번도 나오지 않음’이에요.\n\n2가 없는 사건을 \\(A\\), 3이 없는 사건을 \\(B\\)라 두면 원하는 사건은 \\((A\\cup B)^c\\)예요.","check":{"prompt":"1이 나오지 않는 경우도 따로 빼야 하나요?","answer":"아니요. 1은 곱의 2와 3 인수에 영향을 주지 않으므로 나와도 되고 나오지 않아도 돼요."}},{"id":"c2","label":"겹친 경우를 한 번 되돌려요","stepIds":["s3","s4"],"question":"A와 B를 더할 때 왜 한 가지를 빼야 할까요?","hint":"2도 없고 3도 없는 결과를 찾아보세요.","explanation":"\\(A\\)에서는 매번 1 또는 3만 고르므로 \\(P(A)=\\left(\\frac23\\right)^5=\\frac{32}{243}\\)이에요. 마찬가지로 \\(P(B)=\\frac{32}{243}\\)예요.\n\n두 사건에 동시에 속하려면 2도 3도 나오지 않아야 하므로 다섯 번 모두 1이 나와야 해요. 따라서 \\(P(A\\cap B)=\\left(\\frac13\\right)^5=\\frac1{243}\\)이고, \\(P(A\\cup B)=\\frac{32+32-1}{243}=\\frac{63}{243}\\)이에요.","check":{"prompt":"교집합의 결과가 왜 1가지뿐인가요?","answer":"각 시행에서 2와 3을 모두 금지하면 고를 수 있는 수가 1뿐이어서 (1,1,1,1,1)만 남아요."}},{"id":"c3","label":"여사건을 빼고 약분해요","stepIds":["s5","s6"],"question":"원하는 확률과 최종 합은 어떻게 나오나요?","hint":"전체 확률 1에서 합사건의 확률을 빼세요.","explanation":"원하는 확률은 \\(1-\\frac{63}{243}=\\frac{180}{243}=\\frac{20}{27}\\)이에요. \\(20\\)과 \\(27\\)은 공약수가 없으므로 \\(p=27\\), \\(q=20\\)이고 \\(p+q=47\\)이에요.","check":{"prompt":"63을 243에서 뺀 뒤 왜 바로 20/27이 되나요?","answer":"180/243의 분자와 분모를 9로 나누면 20/27이 되고 더는 약분되지 않아요."}}],"takeaway":["곱의 배수 조건은 필요한 소인수가 각각 등장하는 조건으로 바꿔요.","여사건 둘을 더할 때 교집합을 한 번 빼 중복을 바로잡아요.",
