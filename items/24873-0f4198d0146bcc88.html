  <script>window.HandStudyRecord={"adminYear":2023,"answer":"25","contentHash":"5e497d1b9e470765791f9b94ff1deb2a2f3b5b99711822899460c3fd959b5f22","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24873,"month":11,"number":20,"points":4,"preview":false,"questionHtml":"\u003cp>\u003cspan class=\"heq\">\\(a&gt; \\sqrt{2}\\)\u003c/span>인 실수 \u003cspan class=\"heq\">\\(a\\)\u003c/span>에 대하여 함수 \u003cspan class=\"heq\">\\(f(x)\\)\u003c/span>를\u003c/p>\u003cp> \u003cspan class=\"heq\">\\(f \\left(x \\right)=\\,-x ^{3} +ax ^{2} +2x\\)\u003c/span>\u003c/p>\u003cp>라 하자. 곡선 \u003cspan class=\"heq\">\\(y=f(x)\\)\u003c/span> 위의 점 \u003cspan class=\"heq\">\\(O (0,\\,0)\\)\u003c/span>에서의 접선이 곡선 \u003cspan class=\"heq\">\\(y=f(x)\\)\u003c/span>와 만나는 점 중 \u003cspan class=\"heq\">\\(O\\)\u003c/span>가 아닌 점을 \u003cspan class=\"heq\">\\(A\\)\u003c/span>라 하고, 곡선 \u003cspan class=\"heq\">\\(y=f(x)\\)\u003c/span> 위의 점 \u003cspan class=\"heq\">\\(A\\)\u003c/span>에서의 접선이 \u003cspan class=\"heq\">\\(x\\)\u003c/span>축과 만나는 점을 \u003cspan class=\"heq\">\\(B\\)\u003c/span>라 하자. 점 \u003cspan class=\"heq\">\\(A\\)\u003c/span>가 선분 \u003cspan class=\"heq\">\\(OB\\)\u003c/span>를 지름으로 하는 원 위의 점일 때, \u003cspan class=\"heq\">\\(\\overline{OA} \\times \\overline{AB}\\)\u003c/span>의 값을 구하시오. [4점]\u003c/p>","questionText":"$a> \\sqrt{2}$인 실수 $a$에 대하여 함수 $f(x)$를\n $f \\left(x \\right)=\\,-x ^{3} +ax ^{2} +2x$\n라 하자. 곡선 $y=f(x)$ 위의 점 $O (0,\\,0)$에서의 접선이 곡선 $y=f(x)$와 만나는 점 중 $O$가 아닌 점을 $A$라 하고, 곡선 $y=f(x)$ 위의 점 $A$에서의 접선이 $x$축과 만나는 점을 $B$라 하자. 점 $A$가 선분 $OB$를 지름으로 하는 원 위의 점일 때, $\\overline{OA} \\times \\overline{AB}$의 값을 구하시오. [4점]","sourceHash":"a7a9bec0e014d14c6ae94cc46efe0e911cd5a530bb6e3347e09a56343f1551f0","sourceKind":"csat","sourceLabel":"2023년 시행 수능 · 2024학년도 · 공통 · 20번","steps":[{"id":"s1","latex":"f'(0)=2\\Rightarrow O\\text{에서의 접선은 }y=2x"},{"id":"s2","latex":"-x^{3}+ax^{2}+2x=2x\\Rightarrow x^{2}(a-x)=0"},{"id":"s3","latex":"A=(a,2a)"},{"id":"s4","latex":"A\\text{가 지름 }OB\\text{인 원 위에 있으므로 }OA\\perp AB"},{"id":"s5","latex":"\\text{직선 }OA\\text{의 기울기는 }2,\\quad A\\text{에서의 접선 기울기는 }f'(a)=2-a^{2}"},{"id":"s6","latex":"2(2-a^{2})=-1\\Rightarrow a^{2}=\\frac52"},{"id":"s7","latex":"f'(a)=-\\frac12\\text{이므로 }B=(5a,0)"},{"id":"s8","latex":"OA=\\sqrt5a,\\quad AB=2\\sqrt5a"},{"id":"s9","latex":"OA\\cdot AB=10a^{2}=25"},{"id":"s10","latex":"\\therefore\\ \\boxed{25}"}],"track":"공통"};</script>
