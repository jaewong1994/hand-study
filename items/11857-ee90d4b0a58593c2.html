  <script>window.HandStudyRecord={"itemId":11857,"sourceLabel":"2022 교육청 고1 수학 6월 18번","adminYear":2022,"grade":1,"month":6,"number":18,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 빗변의 길이가 $c\\,$이고 둘레의 길이가 $10\\,$인 직각삼각형 $ABC\\,$가 있다.\n[그림 1]\n다음은 직각삼각형 $A B C\\,$의 빗변의 길이 $c\\,$의 범위를 구하는 과정이다.\n${\\overline{BC}} =a\\,$, ${\\overline{CA}} = b\\,$라 하면\n삼각형 $ABC\\,$의 둘레의 길이가 $10\\,$이고 ${\\overline{AB }} =c\\,$이므로\n$a+b= {\\boxed{\\vphantom{(}\\, (\\text{가}) \\,}} \\, \\cdots \\cdots$ ㉠\n이다. 삼각형 $\\,ABC\\,$가 직각삼각형이므로\n$a^{2} +b^{2} =c^{2} \\,$에서 $\\left( a+b \\right)^{2} -2ab=c^{2} \\, \\cdots \\cdots$ ㉡\n이다. ㉠을 ㉡에 대입하면 $ab= {\\boxed{\\vphantom{(}\\, (\\text{나}) \\,}} \\,$이다.\n$a\\,$, $b\\,$를 두 실근으로 가지고 이차항의 계수가 $1\\,$인 $x\\,$에 대한\n이차방정식은\n$x^{2} - \\left( \\, {\\boxed{\\vphantom{(}\\, (\\text{가}) \\,}} \\, \\right) \\,x+ {\\boxed{\\vphantom{(}\\, (\\text{나}) \\,}} \\,=0$ $\\cdots \\cdots$ ㉢\n이고 ㉢의 판별식 $D \\geq 0\\,$이다.\n빗변의 길이 $c\\,$는 양수이므로\n부등식 $D \\geq 0\\,$의 해를 구하면 $c \\geq {\\boxed{\\vphantom{(}\\, (\\text{다}) \\,}} \\,$이다.\n㉢의 두 실근 $a\\,$, $b\\,$는 모두 양수이므로\n두 근의 합 ${\\boxed{\\vphantom{(}\\, (\\text{가}) \\,}} \\,$와 곱 ${\\boxed{\\vphantom{(}\\, (\\text{나}) \\,}} \\,$는 모두 양수이다.\n따라서 빗변의 길이 $c\\,$의 범위는 ${\\boxed{\\vphantom{(}\\, (\\text{다}) \\,}} \\, \\leq c\\lt \\,5\\,$이다.\n위의 (가), (나)에 알맞은 식을 각각 $f \\left( c \\right) \\,$, $g \\left( c \\right) \\,$라 하고 (다)에 알맞은 수를 $k\\,$라 할 때, $\\dfrac{k}{25} \\times f \\left( \\dfrac{9}{2} \\right) \\times g \\left( \\dfrac{9}{2} \\right) \\,$의 값은? [4점]\n① $10 \\left( \\sqrt{2} -1 \\right)$ ② $11 \\left( \\sqrt{2} -1 \\right)$ ③ $12 \\left( \\sqrt{2} -1 \\right)$\n④ $10 \\left( \\sqrt{2} +1 \\right)$ ⑤ $11 \\left( \\sqrt{2} +1 \\right)$","answer":"②","sourceHash":"62c34362491d05762cb916884e8b12205938def305c485de5865e5aeef9e3401","steps":[{"id":"s1","latex":"a+b+c=10\\Rightarrow f(c)=a+b=10-c"},{"id":"s2","latex":"a^2+b^2=c^2\\Rightarrow(a+b)^2-2ab=c^2"},{"id":"s3","latex":"g(c)=ab=50-10c"},{"id":"s4","latex":"a,b:\\quad x^2-(10-c)x+(50-10c)=0"},{"id":"s5","latex":"D=(10-c)^2-4(50-10c)=c^2+20c-100\\ge0"},{"id":"s6","latex":"c>0\\Rightarrow c\\ge10(\\sqrt2-1)=k"},{"id":"s7","latex":"a+b>0,\\ ab>0\\Rightarrow c\u003c5"},{"id":"s8","latex":"f\\left(\\frac92\\right)=\\frac{11}{2},\\quad g\\left(\\frac92\\right)=5"},{"id":"s9","latex":"\\frac{k}{25}f\\left(\\frac92\\right)g\\left(\\frac92\\right)=11(\\sqrt2-1)"}],"diagram":null,"contentHash":"5e2223b7e890497a4fa72e9acb7db051bffe04e93801dc9a4bb7c6cb73dea3a9","questionHtml":"\u003cp class=\"hp\">그림과 같이 빗변의 길이가 \u003cspan class=\"heq\">\\(c\\)\u003c/span>이고 둘레의 길이가 \u003cspan class=\"heq\">\\(10\\,\\)\u003c/span>인 직각삼각형 \u003cspan class=\"heq\">\\(ABC\\)\u003c/span>가 있다.\u003c/p>\u003cp class=\"hp\">\u003cspan class=\"hfigwrap\" style=\"position:relative;display:inline-block;width:252px;aspect-ratio:18962/11291;max-width:100%;vertical-align:middle\">\u003cspan class=\"hfiglayer\" style=\"position:absolute;overflow:hidden;left:8.81%;top:8.58%;width:81.78%;height:84.62%\">\u003cimg class=\"hfig\" src=\"../assets/figures/10ea03a3e77820621c50ef86.png\" style=\"position:absolute;left:-12.1119%;top:-9.7865%;width:122.1667%;height:123.4038%;aspect-ratio:1.6069;max-width:none;display:block;margin:0\">\u003c/span>\u003cspan class=\"hfiglabel\" style=\"position:absolute;left:89.54%;top:2.50%;line-height:1;white-space:nowrap\">\u003cspan class=\"heq\">\\(A\\)\u003c/span>\u003c/span>\u003cspan class=\"hfiglabel\" style=\"position:absolute;left:1.49%;top:87.32%;line-height:1;white-space:nowrap\">\u003cspan class=\"heq\">\\(B\\)\u003c/span>\u003c/span>\u003cspan class=\"hfiglabel\" style=\"position:absolute;left:89.54%;top:87.32%;line-height:1;white-space:nowrap\">\u003cspan class=\"heq\">\\(C\\)\u003c/span>\u003c/span>\u003cspan class=\"hfiglabel\" style=\"position:absolute;left:39.82%;top:33.63%;line-height:1;white-space:nowrap\">\u003cspan class=\"heq\">\\(c\\)\u003c/span>\u003c/span>\u003c/span>\u003c/p>\u003cp class=\"hp\"
