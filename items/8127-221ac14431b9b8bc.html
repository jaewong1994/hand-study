<script>window.HandStudyRecord={"itemId":8127,"sourceLabel":"2022 교육청 고2 수학 11월 20번","adminYear":2022,"grade":2,"month":11,"number":20,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"반지름의 길이가 $\\sqrt{3}$인 원 $C\\,$에 내접하는 삼각형 $ABC$에 대하여 $\\angle BAC$의 이등분선이 원 $C\\,$와 만나는 점 중 $A$가 아닌 점을 $D$라 하고, 두 선분 $BC$, $AD$의 교점을 $E$라 하자. $\\overline{BD} = \\sqrt{3}$일 때, \u003c보기>에서 옳은 것만을 있는 대로 고른 것은? [4점]\n\u003c보기> ㄱ. $\\sin\\, ( \\angle DBE )= \\frac{1}{2}$ ㄴ. ${ \\overline{AB} }^{\\, 2 } + { \\overline{AC} }^{\\, 2 } = \\overline{AB} \\times \\overline{AC} + 9$ ㄷ. 삼각형 $ABC$의 넓이가 삼각형 $BDE$의 넓이의 $4$배가 되도록 하는 모든 $\\overline{BE}$의 값의 합은 $\\frac{9}{4}$이다.\n① ㄱ ② ㄷ ③ ㄱ, ㄴ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","answer":"⑤","sourceHash":"b7194df10f8dcb7876534cf2028b09c030b8d4fb515fbbba205d147b8bd70fc5","steps":[{"id":"s1","latex":"BD=2R\\sin\\angle BAD,\\quad\\sqrt3=2\\sqrt3\\sin\\angle BAD"},{"id":"s2","latex":"\\angle BAD=30^\\circ\\Rightarrow\\angle BAC=60^\\circ"},{"id":"s3","latex":"\\angle DBE=\\angle DAC=30^\\circ\\Rightarrow\\sin\\angle DBE=\\frac12\\quad\\text{(\\char\"3131 참)}"},{"id":"s4","latex":"BC=2\\sqrt3\\sin60^\\circ=3"},{"id":"s5","latex":"BC^2=AB^2+AC^2-2AB\\cdot AC\\cos60^\\circ"},{"id":"s6","latex":"AB^2+AC^2=AB\\cdot AC+9\\quad\\text{(\\char\"3134 참)}"},{"id":"s7","latex":"BE=x,\\quad CE=3-x,\\quad AB:AC=x:(3-x)"},{"id":"s8","latex":"[ABC]=4[BDE]\\Rightarrow AB\\cdot AC=4x"},{"id":"s9","latex":"AB^2=\\frac{4x^2}{3-x},\\quad AC^2=4(3-x)"},{"id":"s10","latex":"4x^2-9x+3=0"},{"id":"s11","latex":"\\sum x=\\frac94\\quad\\text{(\\char\"3137 참)}"}],"diagram":null,"contentHash":"a951ff04944ad3a23046b7d529d3188a3b04c862dcb0ebcda28780145d8b4f0f","questionHtml":"\u003cp class=\"hp htall\">반지름의 길이가 \u003cspan class=\"heq\">\\(\\sqrt{3}\\)\u003c/span>인 원 \u003cspan class=\"heq\">\\(C\\,\\)\u003c/span>에 내접하는 삼각형 \u003cspan class=\"heq\">\\(ABC\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(\\angle BAC\\)\u003c/span>의 이등분선이 원 \u003cspan class=\"heq\">\\(C\\,\\)\u003c/sp
