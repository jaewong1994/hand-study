<script>window.HandStudyRecord={"itemId":16890,"sourceLabel":"2020 평가원 고3 수리가형 9월 16번","adminYear":2020,"grade":3,"month":9,"number":16,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"모든 자연수 $n$에 대하여 다음 조건을 만족시키는 $x$축 위의 점 $P_{n}$과 곡선 $y= \\sqrt{3x}$ 위의 점 $Q_{n}$이 있다.\n• 선분 $O P_{n}$과 선분 $P_{n} Q_{n}$이 서로 수직이다.\n• 선분 $OQ_{ n }$과 선분 $Q_{ n } P_{ n+1 }$이 서로 수직이다.\n다음은 점 $P_{1}$의 좌표가 $(1,\\,0)$일 때, 삼각형 $O P_{n+1} Q_{n}$의 넓이 $A_{n}$을 구하는 과정이다. (단, $O$는 원점이다.)\n[그림 1]\n위의 (가)에 알맞은 수를 $p$, (나)에 알맞은 식을 $f(n)$이라 할 때, $p+f(8)$의 값은? [4점]\n① $20$ ② $22$ ③ $24$ ④ $26$ ⑤ $28$","answer":"⑤","sourceHash":"0f1e9d8d66c3587d3d982bbc10c1ad16cd11235dc77b788624b78f8ee67e2221","steps":[{"id":"s1","latex":"Q_n=(a_n,\\sqrt{3a_n})"},{"id":"s2","latex":"OP_n:P_nQ_n=P_nQ_n:P_nP_{n+1}"},{"id":"s3","latex":"P_nP_{n+1}=3\\Rightarrow p=3"},{"id":"s4","latex":"a_{n+1}=a_n+3,\\ a_1=1\\Rightarrow a_n=3n-2"},{"id":"s5","latex":"A_n=\\frac12(3n+1)\\sqrt{9n-6}\\Rightarrow f(n)=3n+1"},{"id":"s6","latex":"p+f(8)=\\boxed{28}"}],"diagram":null,"contentHash":"20213ccf8bb4432a876d20482b13fcb095afeb0ddf19ec11d735f61044b5147c","questionHtml":"\u003cp class=\"hp\">모든 자연수 \u003cspan class=\"heq\">\\(n\\)\u003c/span>에 대하여 다음 조건을 만족시키는 \u003cspan class=\"heq\">\\(x\\)\u003c/span>축 위의 점 \u003cspan class=\"heq\">\\(P_{n}\\)\u003c/span>과 곡선 \u003cspan class=\"heq\">\\(y= \\sqrt{3x}\\)\u003c/span> 위의 점 \u003cspan class=\"heq\">\\(Q_{n}\\)\u003c/span>이 있다.\u003c/p>\u003cp class=\"hp\">\u003cdiv class=\"hbox\">\u003cp class=\"hp\">• 선분 \u003cspan class=\"heq\">\\(O P_{n}\\)\u003c/span>과 선분 \u003cspan class=\"heq\">\\(P_{n} Q_{n}\\)\u003c/span>이 서로 수직이다.\u003c/p>\u003cp class=\"hp\">• 선분 \u003cspan class=\"heq\">\\(OQ_{ n }\\)\u003c/span>과 선분 \u003cspan class=\"heq\">\\(Q_{ n } P_{ n+1 }\\)\u003c/span>이 서로 수직이다.\u003c/p>\u003c/div>\u003c/p>\u003cp class=\"hp\">다음은 점 \u003cspan class=\"heq\">\\(P_{1}\\)\u003c/span>의 좌표가 \u003cspan class=\"heq\">\\((1,\\,0)\\)\u003c/span>일 때, 삼각형 \u003cspan cla
