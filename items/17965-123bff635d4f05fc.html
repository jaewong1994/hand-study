<script>window.HandStudyRecord={"adminYear":2024,"answer":"138","contentHash":"1add152c5b91a958d5c70198273697bd5c6f863980259df43d7cb4f86a6e3092","diagram":null,"editionHash":"123bff635d4f05fcf90748ac50e0a74d877bd3a082af304fc90151ffc06b39d5","grade":3,"graphHash":"","graphPlan":null,"itemId":17965,"learningHash":"4124fecf7b0e2c1a4634289975ae1da10536ed457be0971ef6ce796684ce70d6","month":5,"number":30,"points":4,"preview":false,"questionHtml":"\u003cp class=\"hp\">수열 \u003cspan class=\"heq\">\\(\\left\\{ a_{n} \\right\\}\\)\u003c/span>은 공비가 \u003cspan class=\"heq\">\\(0\\)\u003c/span>이 아닌 등비수열이고, 수열 \u003cspan class=\"heq\">\\(\\left\\{ b_{n} \\right\\}\\)\u003c/span>을 모든 자연수 \u003cspan class=\"heq\">\\(n\\)\u003c/span>에 대하여\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\(b_{n} = {\\begin{cases}a_{n}&& \\left( \\left| a_{n} \\right| \\lt  \\alpha \\right) \\\\ - \\dfrac{5}{a_{n}}&& \\left( \\left| a_{n} \\right| \\geq \\alpha \\right)\\end{cases}}\\)\u003c/span> (\u003cspan class=\"heq\">\\(\\alpha\\)\u003c/span>는 양의 상수\u003cspan class=\"heq\">\\(\\left. \\right)\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">라 할 때, 두 수열 \u003cspan class=\"heq\">\\(\\left\\{ a_{n} \\right\\}\\)\u003c/span>, \u003cspan class=\"heq\">\\(\\left\\{ b_{n} \\right\\}\\)\u003c/span>과 자연수 \u003cspan class=\"heq\">\\(p\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cp class=\"hp htall\">\u003cdiv class=\"hbox\">\u003cp class=\"hp htall\">\u003cspan class=\"heq\">\\((\\)\u003c/span>가\u003cspan class=\"heq\">\\()\\)\u003c/span> \u003cspan class=\"heq\">\\(\\sum\\limits_{n=1}^{ \\infty } a_{n}=4\\)\u003c/span>\u003c/p>\u003cp class=\"hp htall\">(나) \u003cspan class=\"heq\">\\(\\sum\\limits_{n=1}^{m} \\dfrac{a_{n}}{b_{n}}\\)\u003c/span>의 값이 최소가 되도록 하는 자연수 \u003cspan class=\"heq\">\\(m\\)\u003c/span>은 \u003cspan class=\"heq\">\\(p\\)\u003c/span>이고, \u003cspan class=\"heq\">\\(\\sum\\limits_{n=1}^{p} b_{n}=51\\)\u003c/span>, \u003cspan class=\"heq\">\\(\\sum\\limits_{n=p+1}^{ \\infty } b_{n}=\\dfrac{1}{64}\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003c/p>\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(32 \\times \\left(a_{3}+p \\right)\\)\u003c/span>의 값을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","questionText":"수열 $\\left\\{ a_{n} \\right\\}$은 공비가 $0$이 아닌 등비수열이고, 수열 $\\left\\{ b_{n} \\right\\}$을 모든 자연수 $n$에 대하여\n $b _{n} = {\\begin{cases}a _{n}&& \\left( \\left| a _{n} \\right| \u003c \\alpha \\right) \\\\ - \\frac{5}{a _{n}}&& \\left( \\left| a _{n} \\right| \\geq \\alpha \\right)\\end{cases}}$ ($\\alpha$는 양의 상수$\\left. \\right)$\n라 할 때, 두 수열 $\\left\\{ a_{n} \\right\\}$, $\\left\\{ b_{n} \\right\\}$과 자연수 $p$ 가 다음 조건을 만족시킨다.\n$($가$)$ $\\sum_{n=1}^{ \\infty } a_{n}=4$ (나) $\\sum_{n=1}^{m} \\frac{a_{n}}{b_{n}}$의 값이 최소가 되도록 하는 자연수 $m$은 $p$이고, $\\sum_{n=1}^{p} b_{n}=51$, $\\sum_{n=p+1}^{ \\infty } b_{n}=\\frac{1}{64}$이다. \n$32 \\times \\left(a_{3}+p \\right)$의 값을 구하시오. [4점]","scoreStatus":"confirmed_4_direct","sourceHash":"1ebba4cf06e78fb872cdfdb71b6390a895846b6e641124e8432159c1538273d4","sourceLabel":"2024 교육청 고3 수학미적분 5월 30번","stepExplanations":{"s2":{"body":"급수의 합이 4이므로 \\(0\u003c|r|\u003c1\\), \\(a=4(1-r)>0\\)이에요. 따라서 \\(|a_n|\\)은 계속 작아져요. \\(|a_n|\\ge\\alpha\\)일 때 \\(\\frac{a_n}{b_n}=-\\frac{a_n^2}{5}\u003c0\\), \\(|a_n|\u003c\\alpha\\)일 때는 \\(\\frac{a_n}{b_n}=1\\)이에요. 만약 처음부터 모두 후자라면 최소는 \\(p=1\\)이고 \\(b_1=a\u003c8\\)이어서 \\(b_1=51\\)과 모순이에요. 그러므로 앞의 몇 항에서는 부분합이 감소하고, 그 뒤에는 1씩 증가해요. 최소가 되는 \\(p\\)가 바로 마지막 음수 항의 번호이므로 표시된 두 범위가 정해져요.","skillTags":["algebra.calculation","reasoning.casework"],"title":"부분합이 줄다가 늘어나는 지점이 p예요"},"s4":{"body":"\\(n\\ge p+1\\)에서는 \\(b_n=a_n\\)이므로 꼬리합은 \\(\\frac{ar^p}{1-r}=4r^p=\\frac{1}{64}\\), 즉 \\(r^p=\\frac{1}{256}\\)이에요. 앞부분은 \\(-\\frac5a,-\\frac5{ar},\\ldots,-\\frac5{ar^{p-1}}\\)이므로 그 합은 \\((-\\frac5a)\\frac{1-r^{-p}}{1-r^{-1}}\\)예요. 여기에 \\(r^{-p}=256\\)을 넣으면 \\(\\frac{1275r}{a(r-1)}=51\\)이 되고, \\(a(r-1)=25r\\)을 얻어요.","skillTags":["algebra.calculation","calculus.limit"],"title":"앞부분은 역수의 등비수열로 더해요"},"s5":{"body":"\\(a=4(1-r)\\)를 대입하면 \\(4r^2+17r+4=(4r+1)(r+4)=0\\)이에요. 두 후보 중 \\(|r|\u003c1\\)을 만족하는 것은 \\(r=-\\frac{1}{4}\\)뿐이므로 \\(a=5\\)예요. 또 \\((-\\frac{1}{4})^p=\\frac{1}{256}\\)에서 \\(p=4\\)예요. 이때 \\(|a_5|\u003c\\alpha\\le|a_4|\\), 즉 \\(\\frac{5}{256}\u003c\\alpha\\le\\frac5{64}\\)인 양수 \\(\\alpha\\)를 잡을 수 있어 원래 분기 조건도 모순이 없어요.","skillTags":["reasoning.casework","algebra.calculation"],"title":"수렴 조건에 맞는 공비만 남겨요"}},"steps":[{"id":"s1","latex":"a_n=ar^{n-1},\\quad\\frac{a}{1-r}=4"},{"id":"s2","latex":"|a_n|\\ge\\alpha\\ (n\\le p),\\quad |a_n|\u003c\\alpha\\ (n\\ge p+1)"},{"id":"s3","latex":"\\sum_{n=p+1}^{\\infty}b_n=\\frac{ar^p}{1-r}=\\frac1{64}\\Rightarrow r^p=\\frac1{256}"},{"id":"s4","latex":"\\sum_{n=1}^{p}-\\frac5{a_n}=51\\Rightarrow a(r-1)=25r"},{"id":"s5","latex":"4r^2+17r+4=0,\\ |r|\u003c1\\Rightarrow r=-\\frac14,\\ a=5,\\ p=4"},{"id":"s6","latex":"32(a_3+p)=32\\left(\\frac5{16}+4\\right)=138"}],"track":"미적분"};</script>
<script>window.HandStudyGuide={"itemId":17965,"sourceHash":"1ebba4cf06e78fb872cdfdb71b6390a895846b6e641124e8432159c1538273d4","contentHash":"1add152c5b91a958d5c70198273697bd5c6f863980259df43d7cb4f86a6e3092","overview":{"goal":"부분합이 가장 작아지는 위치를 조각 정의가 바뀌는 경계로 해석하고, 앞부분과 꼬리의 등비합을 실제로 계산해 공비와 \\(p\\)를 구해요.","firstLook":"\\(a_n/b_n\\)은 큰 조각에서는 음수이고 작은 조각에서는 1이에요. 따라서 부분합은 음수항이 이어지는 동안 감소하고 그다음부터 증가해요.","conditions":[{"label":"원래 등비급수의 합이 4","meaning":"\\(|r|<1\\)이고 \\(a/(1-r)=4\\)예요."},{"label":"부분합의 최소 위치","meaning":"크기 기준을 넘는 마지막 항이 \\(a_p\\), 기준보다 작은 첫 항이 \\(a_{p+1}\\)이에요."},{"label":"앞부분 합과 꼬리합","meaning":"앞에서는 공비 \\(1/r\\)인 항들을, 뒤에서는 공비 \\(r\\)인 항들을 각각 끝까지 전개해요."}]},"chapters":[{"id":"c1","label":"최소 위치를 조각 경계로 읽기","stepIds":["s1","s2"],"question":"왜 \\(m=p\\)까지는 부분합이 감소하고 그 뒤에는 증가해야 할까요?","hint":"두 조각에서 \\(a_n/b_n\\)의 부호를 각각 계산하세요.","explanation":"\\(a_n=ar^{n-1}\\)로 두면 급수 수렴에서 \\(|r|<1\\)이고 \\(\\frac{a}{1-r}=4\\)예요. \\(|a_n|\\ge\\alpha\\)이면 \\(\\frac{a_n}{b_n}=\\frac{a_n}{-5/a_n}=-a_n^2/5<0\\)이고, \\(|a_n|<\\alpha\\)이면 \\(\\frac{a_n}{b_n}=1>0\\)이에요.\n\n또 \\(|r|<1\\)이라 \\(|a_n|\\)은 계속 작아져요. 따라서 부분합이 \\(m=p\\)에서 가장 작으려면 \\(n\\le p\\)에서는 큰 조각을 써 음수항을 더하고, \\(n\\ge p+1\\)에서는 작은 조각을 써 양수 1을 더해야 해요. 즉 조각이 \\(p\\)와 \\(p+1\\) 사이에서 한 번 바뀌어요.","check":{"prompt":"조각이 바뀐 뒤 부분합이 매번 정확히 1씩 증가하는 이유는 무엇인가요?","answer":"작은 조각에서는 \\(b_n=a_n\\)이므로 \\(a_n/b_n=1\\)이기 때문이에요."}},{"id":"c2","label":"꼬리합에서 공비의 거듭제곱 구하기","stepIds":["s3"],"question":"\\(p+1\\)번째부터는 왜 \\(b_n\\)의 꼬리합이 원래 \\(a_n\\)의 꼬리합과 같을까요?","hint":"경계 뒤에서는 모두 \\(|a_n|<\\alpha\\)라 \\(b_n=a_n\\)이에요.","explanation":"\\(n\\ge p+1\\)에서는 \\(b_n=a_n=ar^{n-1}\\)이에요. 따라서 꼬리합은 \\(\\frac{ar^p}{1-r}\\)이고, 전체합 조건 \\(\\frac{a}{1-r}=4\\)를 쓰면 \\(4r^p\\)예요. 이것이 \\(1/64\\)이므로 \\(r^p=1/256\\)이에요.","check":{"prompt":"꼬리합의 첫 항 지수가 \\(r^p\\)인 이유는 무엇인가요?","answer":"첫 항이 \\(a_{p+1}=ar^{(p+1)-1}=ar^p\\)이기 때문이에요."}},{"id":"c3","label":"앞부분 등비합을 빠짐없이 계산하기","stepIds":["s4"],"question":"\\(\\sum_{n=1}^p-5/a_n\\)을 계산할 때 \\(r^{-p}=256\\)을 어디에 넣을까요?","hint":"첫 항 \\(-5/a\\), 공비 \\(1/r\\), 항의 개수 \\(p\\)인 유한 등비합을 그대로 쓰세요.","explanation":"앞부분에서는 \\(b_n=-5/a_n=-\\frac5a r^{-(n-1)}\\)예요. 따라서\n\n\\(\\sum_{n=1}^pb_n=-\\frac5a\\left(1+\\frac1r+\\cdots+\\frac1{r^{p-1}}\\right)=-\\frac5a\\frac{1-r^{-p}}{1-r^{-1}}\\)\n\n예요. \\(r^{-p}=256\\)을 넣고 \\(1-r^{-1}=(r-1)/r\\)로 바꾸면 합은 \\(\\frac{1275r}{a(r-1)}\\)예요. 이 값이 51이므로 \\(a(r-1)=25r\\)을 얻어요.","check":{"prompt":"유한 등비합에서 \\(1-r^{-p}\\)가 음수여도 최종 합이 51이 될 수 있는 이유는 무엇인가요?","answer":"공비 \\(r\\)도 뒤에서 음수로 정해지고 분모 \\(r-1\\)도 음수라 전체 부호는 실제 식을 함께 계산해야 해요. 부호를 항별 식에서 유지했기 때문에 식 자체는 맞아요."}},{"id":"c4","label":"공비와 경계 번호 결정하기","stepIds":["s5","s6"],"question":"두 합 조건을 연립하면 어떤 공비 두 개가 나오고, 왜 하나만 남을까요?","hint":"\\(a=4(1-r)\\)를 \\(a(r-1)=25r\\)에 넣으세요.","explanation":"\\(a=4(1-r)\\)를 대입하면 \\(4r^2+17r+4=0\\), 즉 \\((4r+1)(r+4)=0\\)이에요. 급수가 수렴하려면 \\(|r|<1\\)이므로 \\(r=-1/4\\)만 남고 \\(a=4(1+1/4)=5\\)예요. 이제 \\((-1/4)^p=1/256=(1/4)^4\\)이고 오른쪽이 양수이므로 \\(p\\)는 짝수, 크기를 비교하면 \\(p=4\\)예요.\n\n\\(a_3=5(-1/4)^2=5/16\\)이므로 \\(32(a_3+p)=32(5/16+4)=10+128=138\\)이에요.","check":{"prompt":"\\(r=-4\\)를 버리는 직접적인 조건은 무엇인가요?","answer":"원래 무한등비급수 \\(\\sum a_n\\)이 수렴하므로 반드시 \\(|r|<1\\)이어야 해요."}}],"takeaway":["부분합의 최소 위치는 각 항의 부호가 음수에서 양수로 바뀌는 경계와 연결해요.","꼬리합과 앞부분 합은 서로 다른 조각의 등비수열이므로 첫 항·공비·항 개수를 각각 확인해요.","유한 등비합에서는 거듭제곱과 부호를 생략하지 않고 끝까지 전개해요."]};</script>
