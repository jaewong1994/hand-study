  <script>window.HandStudyRecord={"itemId":17705,"sourceLabel":"2023 교육청 고3 수학확통 4월 22번","adminYear":2023,"grade":3,"month":4,"number":22,"track":"확통","points":4,"scoreStatus":"confirmed_4_direct","questionText":"두 상수 $a$, $b$($b!=1$)과 이차함수 $f \\left( x \\right)$에 대하여 함수 $g \\left( x \\right)$가 다음 조건을 만족시킨다.\n(가) 함수 $g \\left( x \\right)$는 실수 전체의 집합에서 미분가능하고, 도함수 $g' \\left( x \\right)$는 실수 전체의 집합에서 연속이다.(나) $\\left| x \\right| \u003c 2$일 때, $g \\left( x \\right) = \\int _{0} ^{x} {\\left( -t+a \\right) dt}$이고 $\\left| x \\right| \\geq 2$일 때, $\\left| g' \\left( x \\right) \\right| =f \\left( x \\right)$이다.(다) 함수 $g \\left( x \\right)$는 $x=1$, $x=b$에서 극값을 갖는다.\n$g \\left( k \\right) =0$을 만족시키는 모든 실수 $k$의 값의 합이 $p+q \\sqrt{3}$일 때, $p \\times q$의 값을 구하시오. (단, $p$와 $q$는 유리수이다.) [4점]\n 사각형입니다. 2023년 4월 고3 모의고사 문제지제 2 교시 수학 영역(확률과 통계) \n5 지선다형","answer":"32","sourceHash":"b8824ad790e92ef09664c6d6be890ec9bc59a5b2706df42eca48d1b12414a343","steps":[{"id":"s1","latex":"a=1,\\quad f(2)=1,\\ f(-2)=3"},{"id":"s2","latex":"f(x)=c(x-b)^2,\\quad c(b-2)^2=1,\\ c(b+2)^2=3"},{"id":"s3","latex":"b=4+2\\sqrt3"},{"id":"s4","latex":"g(b)=-\\frac{b-2}{3},\\quad x>b:\\ g(x)=g(b)+\\frac{c(x-b)^3}{3}"},{"id":"s5","latex":"g(x)=0\\Rightarrow x\\in\\{0,2,2b-2\\}=\\{0,2,6+4\\sqrt3\\}"},{"id":"s6","latex":"p q=8\\cdot4=32"}],"diagram":null,"contentHash":"2d66a3c9dbdcd780390766d4b04d2d95cb45dded80fd9f1da0d335cd03ed599e","questionHtml":"\u003cp class=\"hp\">두 상수 \u003cspan class=\"heq\">\\(a\\)\u003c/span>, \u003cspan class=\"heq\">\\(b\\)\u003c/span>(\u003cspan class=\"heq\">\\(b \\neq 1\\)\u003c/span>)과 이차함수 \u003cspan class=\"heq\">\\(f \\left( x \\right)\\)\u003c/span>에 대하여 함수 \u003cspan class=\"heq\">\\(g \\left( x \\right)\\)\u003c/span>가  다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) 함수 \u003cspan class=\"heq\">\\(g \\left( x \\right)\\)\u003c/span>는 실수 전체의 집합에서 미분가능하고,\u003cbr>도함수 \u003cspan class=\"heq\">\\(g' \\left( x \\right)\\)\u003c/span>는 실수 전체의 집합에서 연속이다.\
