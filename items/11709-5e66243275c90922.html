<script>window.HandStudyGuide={"itemId":11709,"sourceHash":"23b4c3361219529b26108bf1a816675f29eb9c712ddc8a4b63862d688c7652cd","contentHash":"73709ebb733e28239d1a6b3548e5ff39f7adc128c31c8d0fc5f05c47387a1b34","overview":{"conditions":[{"meaning":"현 \\(AB\\)를 보는 원주각이 \\(45^\\circ\\)이므로 작은 중심각은 \\(90^\\circ\\)예요.","label":"좌표와 원주각 조건"}],"goal":"원주각과 중심각을 이용해 가능한 두 원의 중심을 좌표로 찾아요.","firstLook":"같은 현 \\(AB\\)를 보는 원주각이 \\(45^\\circ\\)이므로 중심각 \\(\\angle ACB\\)는 \\(90^\\circ\\)예요. \\(AB=\\sqrt{6^2+12^2}=6\\sqrt5\\)이고 중점은 \\(M=(2,-3)\\)이에요."},"chapters":[{"check":{"prompt":"가능한 원의 중심이 한쪽으로만 정해지지 않는 이유는 무엇인가요?","answer":"두 중심은 모두 현 \\(AB\\)의 수직이등분선 위에 있고, 중점 \\(M\\)을 기준으로 서로 반대쪽에 있어요."},"stepIds":["s1","s2"],"question":"현의 길이와 중점 좌표는 어떻게 구하나요?","id":"c1","label":"조건을 좌표로 옮겨요","explanation":"같은 현 \\(AB\\)를 보는 원주각이 \\(45^\\circ\\)이므로 중심각 \\(\\angle ACB\\)는 \\(90^\\circ\\)예요. \\(AB=\\sqrt{6^2+12^2}=6\\sqrt5\\)이고 중점은 \\(M=(2,-3)\\)이에요.","hint":"두 점 사이 거리와 중점 공식을 사용해요."},{"check":{"prompt":"두 중심을 모두 얻는 연립식은 무엇인가요?","answer":"\\(y+3=-(x-2)/2\\)를 거리식에 넣으면 \\((x-2)^2+(x-2)^2/4=45\\)이므로 \\(x-2=\\pm6\\)이에요."},"stepIds":["s3","s4"],"question":"수직이등분선 위의 두 중심 좌표를 어떻게 구하나요?","id":"c2","label":"좌표 관계로 핵심 식을 세워요","explanation":"중심 \\(C\\)는 \\(AB\\)의 수직이등분선 위에 있어요. \\(\\angle ACB=90^\\circ\\)이고 \\(CA=CB\\)이므로 \\(\\triangle ACB\\)는 \\(C\\)가 직각인 이등변직각삼각형이에요. 따라서 빗변 \\(AB\\)의 중점 \\(M\\)에 대하여 \\(CM=AM=AB/2=3\\sqrt5\\)예요. \\(AB\\)의 기울기가 \\(2\\)이므로 \\(C=(x,y)\\)는 \\(y+3=-(x-2)/2\\), \\((x-2)^2+(y+3)^2=45\\)를 만족해요. 첫째 식을 둘째 식에 넣으면 \\((x-2)^2+(x-2)^2/4=45\\), 즉 \\(x-2=\\pm6\\)이므로 \\(C=(8,-6)\\) 또는 \\((-4,0)\\)이에요.","hint":"\\(C=(x,y)\\)라 두고 기울기와 \\(CM=3\\sqrt5\\)를 함께 써요."},{"check":{"prompt":"두 후보의 \\(OC\\)는 각각 얼마인가요?","answer":"\\(C=(8,-6)\\)이면 \\(OC=10\\), \\(C=(-4,0)\\)이면 \\(OC=4\\)예요."},"stepIds":["s5","s6"],"question":"두 중심에서 원점까지 거리를 비교하면 무엇을 얻나요?","id":"c3","label":"값과 범위를 확인해요","explanation":"따라서 \\(C=(8,-6)\\) 또는 \\((-4,0)\\)이고 원점까지의 거리는 각각 10,4예요. 두 원 모두 현 AB를 보는 원주각 \\(45^\\circ\\)인 점 P를 가지므로 가능한 값을 모두 확인했고, 최솟값은 4라 답은 ②예요.","hint":"각 좌표를 거리 공식에 직접 넣어요."}],"takeaway":["원주각을 알면 같은 현을 보는 중심각을 구해 원의 중심 조건으로 바꿔요.","원의 중심은 현의 수직이등분선 위에 있고, 이등변직각삼각형에서는 빗변 중점까지의 거리가 반지름과 같아요.","수직이등분선의 양쪽 해를 모두 구한 뒤 목표점까지의 거리를 각각 비교해요."]};</script>
