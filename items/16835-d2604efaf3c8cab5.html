<script>window.HandStudyRecord={"itemId":16835,"sourceLabel":"2020 교육청 고3 수리나형 7월 21번","adminYear":2020,"grade":3,"month":7,"number":21,"track":"수리나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"첫째항이 양수이고 공차가 $-\\,1\\,$보다 작은 등차수열 $\\left\\{ a _{n} \\right\\} \\,$에 대하여 수열 $\\left\\{ b _{n} \\right\\} \\,$은 다음과 같다.\n $b _{n} = {\\begin{cases}\\,a _{n+1} - \\frac{n}{2} \\, \\left( \\,a _{n} \\geq 0\\, \\right) \\\\ \\,a _{n} + \\frac{n}{2} \\, \\left( \\,a _{n} <0\\, \\right)\\end{cases}}$\n수열 $\\left\\{ b _{n} \\right\\}$의 첫째항부터 제$n$항까지의 합을 $S _{n}$이라 할 때, 수열 $\\left\\{ b _{n} \\right\\}$은 다음 조건을 만족시킨다.\n(가) $b _{5} <b _{6}$ (나) $S _{\\,5} =S _{\\,9} =0\\,$\n$S _{n} \\leq -70\\,$을 만족시키는 자연수 $n\\,$의 최솟값은? [4점]\n① $13$ ② $15$ ③ $17\\,$ ④ $19$ ⑤ $21$\n단답형","answer":"④","sourceHash":"a93566ebfec69b4fb50e3085b19b418e186971fc5ac0dc2c7e1274e7b4bfd5e8","steps":[{"id":"s1","latex":"a_n=a_1+(n-1)d,\\quad d<-1,\\quad a_k\\ge0>a_{k+1}"},{"id":"s2","latex":"b_{k+1}-b_k=k+\\frac12>0,\\quad b_{n+1}-b_n<0\\ (n\\ne k)"},{"id":"s3","latex":"b_5<b_6\\Rightarrow k=5"},{"id":"s4","latex":"S_5=0\\Rightarrow2a_1+6d-3=0"},{"id":"s5","latex":"S_9-S_5=0\\Rightarrow2a_1+13d+\\frac{15}{2}=0"},{"id":"s6","latex":"a_1=6,\\quad d=-\\frac32"},{"id":"s7","latex":"(S_1,\\ldots,S_9)=(4,6,6,4,0,3/2,2,3/2,0)\\Rightarrow n\\le9\\text{는 제외}"},{"id":"s8","latex":"n\\ge10:\\quad S_n=-\\frac{(n-5)(n-9)}2"},{"id":"s9","latex":"S_{18}=-\\dfrac{117}{2}>-70,\\quad S_{19}=-70\\Rightarrow\\text{처음 조건을 만족하는 자연수는 }19"}],"diagram":null,"contentHash":"3f3c9df8ac06090860d60f37a5e057ed5cd275106d19cb7b77b8e870e489a0de","questionHtml":"<p class=\"hp\">첫째항이 양수이고 공차가 <span class=\"heq\">\\(-\\,1\\,\\)<\/span>보다 작은 등차수열 <span class=\"heq\">\\(\\left\\{ a_{n} \\right\\} \\,\\)<\/span>에 대하여 수열 <span class=\"heq\">\\(\\left\\{ b_{n} \\right\\} \\,\\)<\/span>은 다음과 같다.<\/p><p class=\"hp htall\">&emsp;<span class=\"heq\">\\(b_{n} = {\\begin{cases}\\,a_{n+1} - \\dfrac{n}{2} \\, \\left( \\,a_{n} \\geq 0\\, \\right) \\\\ \\,a_{n} + \\dfrac{n}{2} \\, \\left( \\,a_{n} \\lt 0\\, \\right)\\end{cases}}\\)<\/span><\/p><p class=\"hp\">수열 <span class=\"heq\">\\(\\left\\{ b_{n} \\right\\}\\)<\/span>의 첫째항부터 제<span class=\"heq\">\\(n\\)<\/span>항까지의 합을 <span class=\"heq\">\\(S_{n}\\)<\/span>이라 할 때, 수열 <span class=\"heq\">\\(\\left\\{ b_{n} \\right\\}\\)<\/span>은 다음 조건을 만족시킨다.<\/p><p class=\"hp\"><div class=\"hbox\"><p class=\"hp\">(가) <span class=\"heq\">\\(b_{5} \\lt b_{6}\\)<\/span><\/p><p class=\"hp\">(나) <span class=\"heq\">\\(S_{\\,5} =S_{\\,9} =0\\,\\)<\/span><\/p><\/div><\/p><p class=\"hp\"><span class=\"heq\">\\(S_{n} \\leq -70\\,\\)<\/span>을 만족시키는 자연수 <span class=\"heq\">\\(n\\,\\)<\/span>의 최솟값은? <span class=\"hscore\">[4점]<\/span><\/p><p class=\"hp\">① <span class=\"heq\">\\(13\\)<\/span>&emsp;② <span class=\"heq\">\\(15\\)<\/span>&emsp;③ <span class=\"heq\">\\(17\\,\\)<\/span>&emsp;④ <span class=\"heq\">\\(19\\)<\/span>&emsp;⑤ <span class=\"heq\">\\(21\\)<\/span><\/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"9301ec8cdb30cb2ee09b34801b35b43349437ee1dc5c4418f58d3f66bd772851"};</script>
<script>window.HandStudyGuide={"itemId":16835,"sourceHash":"a93566ebfec69b4fb50e3085b19b418e186971fc5ac0dc2c7e1274e7b4bfd5e8","contentHash":"3f3c9df8ac06090860d60f37a5e057ed5cd275106d19cb7b77b8e870e489a0de","overview":{"goal":"등차수열의 부호가 바뀌는 유일한 위치를 \\(b_n\\)의 증가 지점으로 찾아 첫항과 공차를 정하고, 부분합이 처음 \\(-70\\)에 닿는 항을 구해요.","firstLook":"공차가 \\(-1\\)보다 작으므로 \\(a_n\\)은 계속 감소하고 0 이상인 항은 처음부터 연속해서 나타나요. 마지막으로 0 이상인 항의 번호를 \\(k\\)라 두고 \\(b_n\\)의 차를 비교해요.","conditions":[{"label":"부호 경계","meaning":"\\(a_k\\ge0\\), \\(a_{k+1}<0\\)인 번호 \\(k\\)가 하나뿐이에요."},{"label":"부분합 조건","meaning":"\\(S_5=0\\)과 \\(S_9-S_5=0\\)을 서로 다른 조각의 합으로 계산해요."}]},"chapters":[{"id":"c1","label":"유일한 증가 지점으로 부호 경계를 찾아요","stepIds":["s1","s2","s3"],"question":"\\(b_n\\)이 왜 \\(n=k\\)에서만 증가할까요?","hint":"\\(n\\le k\\), \\(n\\ge k+1\\), 경계를 넘는 한 번을 따로 계산해요.","explanation":"\\(a_n=a_1+(n-1)d\\), \\(d<-1\\)이므로 \\(a_n\\)은 계속 감소해 \\(a_k\\ge0\\), \\(a_{k+1}<0\\)인 \\(k\\)가 하나뿐이에요. \\(n<k\\)에서는 \\(b_{n+1}-b_n=d-1/2<0\\), \\(n>k\\)에서는 \\(d+1/2<0\\)이에요. 그러나 경계에서는 \\(b_{k+1}=a_{k+1}+(k+1)/2\\), \\(b_k=a_{k+1}-k/2\\)이므로 차가 \\(k+1/2>0\\)이에요. 주어진 \\(b_5<b_6\\)이 유일한 증가이므로 \\(k=5\\), 즉 \\(a_5\\ge0>a_6\\)이에요.","check":{"prompt":"경계에서 공차 \\(d\\)가 차의 식에서 사라지는 이유는 무엇인가요?","answer":"두 항 모두 같은 \\(a_{k+1}\\)을 포함하므로 빼면 없어지고, 반으로 나눈 번호 항만 더해져 \\(k+1/2\\)가 남아요."}},{"id":"c2","label":"두 부분합으로 첫항과 공차를 구해요","stepIds":["s4","s5","s6"],"question":"\\(S_5\\)와 \\(S_9-S_5\\)에서는 왜 서로 다른 \\(b_n\\) 식을 써야 할까요?","hint":"앞의 다섯 항은 \\(a_n\\ge0\\), 뒤의 네 항은 \\(a_n<0\\)인 조각이에요.","explanation":"\\(n=1,\\ldots,5\\)에서는 \\(b_n=a_{n+1}-n/2=a_1+nd-n/2\\)예요. 합하면 \\(S_5=5a_1+15d-15/2=0\\), 즉 \\(2a_1+6d-3=0\\)이에요. \\(n=6,\\ldots,9\\)에서는 \\(b_n=a_n+n/2=a_1+(n-1)d+n/2\\)이고, 네 항의 합이 0이므로 \\(4a_1+26d+15=0\\), 즉 \\(2a_1+13d+15/2=0\\)이에요. 두 식의 차에서 \\(7d+21/2=0\\), 따라서 \\(d=-3/2\\), \\(a_1=6\\)이에요.","check":{"prompt":"\\(n=6\\)부터 \\(9\\)까지 \\(n-1\\)의 합은 얼마인가요?","answer":"\\(5+6+7+8=26\\)이에요."}},{"id":"c3","label":"아홉째 항 뒤의 부분합을 직접 비교해요","stepIds":["s7","s8","s9"],"question":"왜 \\(n=19\\)가 처음 조건을 만족하는지 바로 앞 번호도 확인해야 할까요?","hint":"\\(S_n=-(n-5)(n-9)/2\\)에 \\(18,19\\)를 각각 넣어요.","explanation":"구한 값으로 \\(a_n=15/2-3n/2\\)이고 \\(n\\ge6\\)에서는 \\(b_n=a_n+n/2=15/2-n\\)이에요. 직접 계산한 \\(S_1,\\ldots,S_9\\)은 모두 \\(-70\\)보다 크고 \\(S_9=0\\)이에요. 따라서 \\(n\\ge10\\)에서\n\n\\(S_n=\\sum_{j=10}^n(15/2-j)=-\\dfrac{(n-5)(n-9)}2\\)\n\n예요. \\(n=18\\)이면 \\(-117/2>-70\\), \\(n=19\\)이면 정확히 \\(-70\\)이에요. 이후에는 \\(b_n<0\\)라 부분합이 더 작아지므로 처음 조건을 만족하는 자연수는 \\(19\\), 선택지 ④예요.","check":{"prompt":"\\(n=19\\)에서 부분합을 곱으로 확인해 보세요.","answer":"\\(-((19-5)(19-9))/2=-(14\\cdot10)/2=-70\\)이에요."}}],"takeaway":["등차수열의 부호가 한 번 바뀌면 조각수열의 증가 방향이 바뀌는 경계를 차로 찾을 수 있어요.","부분합 조건은 부호 경계 앞뒤를 나누어 각각 알맞은 식으로 더해요.","가장 이른 자연수를 묻는 부등식은 후보와 바로 앞 번호를 함께 대입해 확인해요."]};</script>
