<script>window.HandStudyRecord={"itemId":16460,"sourceLabel":"2019 교육청 고3 수리나형 5월 30번","adminYear":2019,"grade":3,"month":5,"number":30,"track":"수리나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"함수 $f(x)=2x ^{3} -3ax ^{2} +9\\,$에 대하여 함수\n $g(x)= {\\begin{cases}f(x)&(x \\geq 0) \\\\ -f(x)+18\\,&(x\u003c0)\\end{cases}}$\n이 다음 조건을 만족시킨다.\n(가) 곡선 $y=g(x)\\,$와 직선 $y=x\\,$의 교점의 개수는 1이다.(나) 함수 $g(x)$의 극솟값은 양수이다.\n방정식 $g(x)=x\\,$의 실근을 $k\\,$라 할 때, $12(a+k)\\,$의 값을 구하시오. (단, $a\\,$는 0이 아닌 상수이다.) [4점]","answer":"47","sourceHash":"6ef7b856eef3390685fd5939c908cc2d236fa34eb26d6efa49391b203d1534da","steps":[{"id":"s1","latex":"f'(x)=6x(x-a)"},{"id":"s2","latex":"a\u003c0\\Rightarrow g(x)-x>0\\text{이므로 교점이 없어 불가}"},{"id":"s3","latex":"a>0,\\quad g(a)=9-a^3>0"},{"id":"s4","latex":"\\text{유일한 교점에서는 접하므로 }f(k)=k,\\quad f'(k)=1"},{"id":"s5","latex":"2k^3-3ak^2+9=k,\\quad6k^2-6ak=1"},{"id":"s6","latex":"2k^3+k-18=(k-2)(2k^2+4k+9)=0"},{"id":"s7","latex":"k=2,\\quad a=\\dfrac{23}{12}"},{"id":"s8","latex":"12(a+k)=23+24=47"}],"diagram":null,"contentHash":"70ae17f5a00baffd1d3581fd1b28cf48d15327ec929a6bf689101eef816be98f","questionHtml":"\u003cp class=\"hp\">함수 \u003cspan class=\"heq\">\\(f(x)=2x^{3} -3ax^{2} +9\\,\\)\u003c/span>에 대하여 함수\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\(g(x)= {\\begin{cases}f(x)&(x \\geq 0) \\\\ -f(x)+18\\,&(x\\lt 0)\\end{cases}}\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">이 다음 조건을 만족시킨다.\u003c/p>\u003cp class=\"hp\">\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) 곡선 \u003cspan class=\"heq\">\\(y=g(x)\\,\\)\u003c/span>와 직선 \u003cspan class=\"heq\">\\(y=x\\,\\)\u003c/span>의 교점의 개수는 1이다.\u003c/p>\u003cp class=\"hp\">(나) 함수 \u003cspan class=\"heq\">\\(g(x)\\)\u003c/span>의 극솟값은 양수이다.\u003c/p>\u003c/div>\u003c/p>\u003cp class=\"hp\">방정식 \u003cspan class=\"heq\">\\(g(x)=x\\,\\)\u003c/span>의 실근을 \u003cspan class=\"heq\">\\(k\\,\\)\u003c/span>라 할 때, \u003cspan class=\"heq\">\\(12(a+k)\\,\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(a\\,\\)\u003c/span>는 0이 아닌 상수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"4daf24268f1fccf5f9afcb96e37e3a58cf365f3025e3921e9067510670cb7d09"};</script>
<script>window.HandStudyGuide={"itemId":16460,"sourceHash":"6ef7b856eef3390685fd5939c908cc2d236fa34eb26d6efa49391b203d1534da","contentHash":"70ae17f5a00baffd1d3581fd1b28cf48d15327ec929a6bf689101eef816be98f","overview":{"goal":"g(x)-x의 그래프가 한 번만 0이 되면서 g의 극솟값이 양수가 되는 접점 조건으로 a와 교점 k를 구합니다.","firstLook":"교점이 하나뿐이라는 조건은 양쪽 조각의 부호와 접하는 경우를 함께 봐야 합니다. 극솟값이 양수라는 조건이 a의 부호를 먼저 정합니다.","conditions":[{"label":"교점 하나","meaning":"g(x)-x가 부호를 바꾸며 여러 번 지나지 않고 한 점에서만 0이 됩니다."},{"label":"양의 극솟값","meaning":"오른쪽 조각의 극솟값이 0보다 커야 합니다."}]},"chapters":[{"id":"c1","label":"a의 부호를 정합니다","stepIds":["s1","s2","s3"],"question":"왜 a는 양수여야 하며 어떤 부등식이 필요한가요?","hint":"f′의 영점과 오른쪽 조각의 극솟값을 보세요.","explanation":"\\(f'(x)=6x(x-a)\\)입니다. \\(a<0\\)이면 극솟값이 양수라는 조건으로 \\(g(x)>0\\)입니다. 따라서 \\(x<0\\)에서는 양수인 \\(g(x)\\)와 음수인 \\(x\\)가 같을 수 없습니다. \\(x\\ge0\\)에서는 \\(g(x)-x=2x^3-3ax^2-x+9\\)이고, \\(-3ax^2\\ge0\\), \\(2x^3-x\\ge-2/(3\\sqrt6)>-1\\)이므로 이 차도 양수입니다. 결국 교점이 없어 모순이므로 \\(a>0\\)입니다. 이때 오른쪽 조각 \\(x\\ge0\\)에서 \\(x=a\\)가 극솟값점이고, 조건에 따라 \\(g(a)=f(a)=9-a^3>0\\)이어야 합니다.","check":{"prompt":"상수 a가 0인 경우를 따로 고려하지 않는 이유는 무엇인가요?","answer":"문제에서 a는 0이 아닌 상수라고 주어졌습니다."}},{"id":"c2","label":"유일한 교점을 접점으로 만듭니다","stepIds":["s4","s5"],"question":"교점 k에서 왜 함수값과 기울기 두 식을 함께 세우나요?","hint":"한 점만 만나려면 차의 그래프가 그 점에서 축에 접해야 합니다.","explanation":"오른쪽 조각에서 직선과 교점이 하나뿐이려면 \\(y=f(x)\\)와 \\(y=x\\)가 \\(x=k\\)에서 접합니다. 따라서 \\(f(k)=k\\), \\(f'(k)=1\\)입니다. 식으로 쓰면 \\(2k^3-3ak^2+9=k\\), \\(6k^2-6ak=1\\)입니다.","check":{"prompt":"두 번째 식의 오른쪽이 0이 아니라 1인 이유는 무엇인가요?","answer":"접하는 상대가 가로축이 아니라 기울기가 1인 직선이기 때문입니다."}},{"id":"c3","label":"a를 없애고 답을 구합니다","stepIds":["s6","s7","s8"],"question":"두 식에서 a를 없애면 k는 어떻게 정해지나요?","hint":"미분식에서 ak를 나타내 첫 식에 넣으세요.","explanation":"\\(6k^2-6ak=1\\)에서 \\(ak=k^2-1/6\\)입니다. 이를 첫 식에 넣어 정리하면 \\(2k^3+k-18=0\\), 곧 \\((k-2)(2k^2+4k+9)=0\\)입니다. 이차식은 판별식이 음수이므로 실근이 없고 \\(k=2\\)입니다. 미분식에 넣으면 \\(24-12a=1\\), 따라서 \\(a=23/12\\)입니다. \\(12(a+k)=23+24=47\\)입니다.","check":{"prompt":"구한 a가 극솟값 양수 조건을 만족하나요?","answer":"\\(a=23/12<2\\)이므로 \\(a^3<8<9\\), 따라서 \\(9-a^3>0\\)입니다."}}],"takeaway":["곡선과 직선이 한 점에서만 만나고 부호 조건이 유지되면 접점의 함수값과 기울기를 함께 씁니다.","후보를 구한 뒤 처음에 사용한 극솟값 부등식에 다시 대입합니다."]};</script>
