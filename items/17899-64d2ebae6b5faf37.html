t":"\\(\\angle ACD=180^\\circ-(\\angle ADC+\\angle DAC)\\)이고 사인은 보각에서 같아요.","explanation":"확장 사인법칙으로 \\(AD=12\\sin \\angle ACD=12\\sin(\\angle ADC+\\angle DAC)\\)예요. 덧셈정리를 쓰면\n\n\\(AD=12\\{(\\sqrt2/3)(2\\sqrt2/3)+(-\\sqrt7/3)(1/3)\\}=(16-4\\sqrt7)/3\\)이에요.\n\n따라서 \\(p=16/3,q=-4/3\\)이고 \\(9|pq|=9\\cdot64/9=64\\)예요.","check":{"prompt":"\\(q\\)가 음수인 것이 도형의 길이와 모순인가요?","answer":"아니에요. \\(p+q\\sqrt7=(16-4\\sqrt7)/3>0\\)이므로 실제 길이는 양수예요."}}],"takeaway":["평행과 수직 조건은 원래 삼각형의 각을 다른 삼각형으로 옮기는 데 써요.","사인만으로 예각과 둔각을 구별할 수 없으므로 원 위 점의 위치로 코사인의 부호를 정해요.","현의 길이는 외접반지름과 맞은편 원주각의 사인으로 계산해요."]};</script>
