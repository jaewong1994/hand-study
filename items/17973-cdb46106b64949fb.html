<script>window.HandStudyRecord={"adminYear":2024,"answer":"12","contentHash":"15354affb62020d23936422a1dd465b1429bf76558f086a52bc4d820acaf913d","diagram":null,"editionHash":"cdb46106b64949fb70a7660344b3f8f16f9170509e29260248743009ab26e01d","grade":3,"graphHash":"","graphPlan":null,"itemId":17973,"learningHash":"08752ee3dba8c8cff6fecfd48bdfa4ea03a76878c95965ba23fb9a7ddb635c14","month":7,"number":29,"points":4,"preview":false,"questionHtml":"\u003cp class=\"hp htall\">첫째항이 \u003cspan class=\"heq\">\\(1\\)\u003c/span>이고 공비가 \u003cspan class=\"heq\">\\(0\\)\u003c/span>이 아닌 등비수열 \u003cspan class=\"heq\">\\(\\left\\{ a_{n} \\right\\}\\)\u003c/span>에 대하여 급수 \u003cspan class=\"heq\">\\(\\sum\\limits_{n=1}^{\\infty } a_{n}\\)\u003c/span>이 수렴하고\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\(\\sum\\limits_{n=1}^{\\infty } \\left( 20a_{2n} +21 \\left| a_{3n-1} \\right| \\right) =0\\)\u003c/span>\u003c/p>\u003cp class=\"hp htall\">이다. 첫째항이 \u003cspan class=\"heq\">\\(0\\)\u003c/span>이 아닌 등비수열 \u003cspan class=\"heq\">\\(\\left\\{ b_{n} \\right\\}\\)\u003c/span>에 대하여 \u003cbr>급수 \u003cspan class=\"heq\">\\(\\sum\\limits_{n=1}^{\\infty } \\dfrac{3 \\left| a_{n} \\right| +b_{n}}{a_{n}}\\)\u003c/span>이 수렴할 때, \u003cspan class=\"heq\">\\(b_{1} \\times \\sum\\limits_{n=1}^{\\infty } b_{n}\\)\u003c/span>의 값을 구하시오.\u003c/p>\u003cp class=\"hp\">\u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","questionText":"첫째항이 $1$이고 공비가 $0$이 아닌 등비수열 $\\left\\{ a _{n} \\right\\}$에 대하여 급수 $\\sum _{n=1} ^{\\infty } a _{n}$이 수렴하고\n $\\sum _{n=1} ^{\\infty } \\left( 20a _{2n} +21 \\left| a _{3n-1} \\right| \\right) =0$\n이다. 첫째항이 $0$이 아닌 등비수열 $\\left\\{ b _{n} \\right\\}$에 대하여 급수 $\\sum _{n=1} ^{\\infty } \\frac{3 \\left| a _{n} \\right| +b _{n}}{a _{n}}$이 수렴할 때, $b _{1} \\times \\sum _{n=1} ^{\\infty } b _{n}$의 값을 구하시오. \n[4점]","scoreStatus":"confirmed_4_direct","sourceHash":"b2c2435e08c15f8cab3cef84b2cb1103cffe3079b1f41e3c2d0727491b3d5783","sourceLabel":"2024 교육청 고3 수학미적분 7월 29번","stepExplanations":{"s2":{"body":"첫째항이 1이고 급수가 수렴하므로 \\(0\u003c|r|\u003c1\\)이에요. 만약 \\(r>0\\)이면 \\(20a_{2n}\\)과 \\(21|a_{3n-1}|\\)가 모두 양수라서 그 합이 0일 수 없어요. 따라서 \\(r=-s\\)로 놓으면 \\(0\u003cs\u003c1\\)이고, \\(a_{2n}=-s^{2n-1}\\), \\(|a_{3n-1}|=s^{3n-2}\\)예요.","skillTags":["calculus.limit","reasoning.casework"],"title":"합이 0이려면 공비가 음수여야 해요"},"s4":{"body":"\\(s^{2n-1}\\)은 첫째항 \\(s\\), 공비 \\(s^2\\)이고, \\(s^{3n-2}\\)는 첫째항 \\(s\\), 공비 \\(s^3\\)이에요. 그래서 \\(-\\frac{20s}{1-s^2}+\\frac{21s}{1-s^3}=0\\)을 얻어요. \\(s>0\\), \\(1-s>0\\)이므로 이 인수들을 약분하면 \\(21(1+s)=20(1+s+s^2)\\)가 돼요. 인수분해한 두 후보 중 \\(0\u003cs\u003c1\\)인 것은 \\(s=\\frac{1}{4}\\)뿐이에요.","skillTags":["calculus.limit","reasoning.casework"],"title":"두 등비급수의 첫째항은 모두 s예요"},"s7":{"body":"\\(b_n=b_1q^{n-1}\\)로 놓고 \\(\\rho=-4q\\)라 쓰면 일반항은 \\(3(-1)^{n-1}+b_1\\rho^{n-1}\\)이에요. 급수가 수렴하려면 이 값이 0으로 가야 해요. \\(|\\rho|\u003c1\\)이면 첫 항의 교대가 남고, \\(|\\rho|>1\\)이면 \\(b_1\\ne0\\)인 둘째 항의 크기가 무한히 커져요. \\(\\rho=1\\)도 홀수·짝수 번째 값이 동시에 0으로 갈 수 없어요. 따라서 \\(\\rho=-1\\)이고, \\((3+b_1)(-1)^{n-1}\\to0\\)이 되려면 \\(b_1=-3\\)이에요. 이때 일반항은 실제로 모두 0이므로 충분조건도 만족해요. \\(q=\\frac{1}{4}\\)이므로 \\(\\sum b_n=-\\frac3{1-\\frac14}=-4\\)예요.","skillTags":["calculus.limit","reasoning.casework","geometry.reasoning"],"title":"두 교대항이 정확히 상쇄되어야 해요"}},"steps":[{"id":"s1","latex":"a_n=r^{n-1},\\quad |r|\u003c1"},{"id":"s2","latex":"r=-s\\ (0\u003cs\u003c1)"},{"id":"s3","latex":"-\\dfrac{20s}{1-s^2}+\\dfrac{21s}{1-s^3}=0"},{"id":"s4","latex":"21(1+s)=20(1+s+s^2)"},{"id":"s5","latex":"(5s+1)(4s-1)=0\\Rightarrow r=-\\dfrac14"},{"id":"s6","latex":"\\dfrac{3|a_n|+b_n}{a_n}=3(-1)^{n-1}+b_1(-4q)^{n-1}"},{"id":"s7","latex":"\\text{일반항이 }0\\text{으로 수렴}\\Rightarrow q=\\dfrac14,\\ b_1=-3"},{"id":"s8","latex":"\\sum b_n=-4\\Rightarrow b_1\\sum b_n=12"}],"track":"미적분"};</script>
<script>window.HandStudyGuide={"itemId":17973,"sourceHash":"b2c2435e08c15f8cab3cef84b2cb1103cffe3079b1f41e3c2d0727491b3d5783","contentHash":"15354affb62020d23936422a1dd465b1429bf76558f086a52bc4d820acaf913d","overview":{"goal":"첫 등비급수로 공비를 정하고 둘째 급수의 일반항이 0이 되도록 \\(b_n\\)을 결정해요.","firstLook":"둘째 급수는 진동하는 \\(3(-1)^{n-1}\\)을 \\(b_n/a_n\\)이 항별로 정확히 없애야 수렴할 수 있어요.","conditions":[{"label":"일반항 조건","meaning":"급수가 수렴하면 그 일반항은 반드시 0으로 수렴해야 해요."}]},"chapters":[{"id":"c1","label":"첫 급수에서 공비의 부호와 값 구하기","stepIds":["s1","s2","s3","s4","s5"],"question":"\\(r\\)이 왜 음수여야 하나요?","hint":"\\(20a_{2n}\\)을 전개한 뒤 공비의 절댓값이 1보다 작아야 한다는 점을 쓰세요.","explanation":"첫째항이 1이므로 \\(a_n=r^{n-1}\\), 수렴에서 \\(|r|<1\\)예요. 둘째 부분은 양수이므로 합이 0이 되려면 \\(a_{2n}=r^{2n-1}\\)의 합이 음수여야 하여 \\(r<0\\)예요. \\(r=-s,\\,0<s<1\\)로 두면 \\(-20s/(1-s^2)+21s/(1-s^3)=0\\). s를 약분하고 정리하면 \\(21(1+s)=20(1+s+s^2)\\), 즉 \\((5s+1)(4s-1)=0\\). 범위에 맞는 \\(s=1/4\\)이므로 \\(r=-1/4\\)예요.","check":{"prompt":"인수분해의 근 \\(s=-1/5\\)를 버리는 이유는 무엇인가요?","answer":"\\(s=-r\\)로 두어 \\(0<s<1\\)이어야 하기 때문이에요."}},{"id":"c2","label":"둘째 급수의 일반항 분석하기","stepIds":["s6","s7"],"question":"\\(q=1/4\\)가 아니면 일반항이 0이 될 수 없는 이유는 무엇인가요?","hint":"\\(|4q|\\)가 1보다 작은 경우, 큰 경우, 같은 경우를 나누세요.","explanation":"\\(b_n=b_1q^{n-1}\\)로 두면 급수의 일반항은 \\(3(-1)^{n-1}+b_1(-4q)^{n-1}\\)예요. \\(|4q|<1\\)이면 둘째 항만 0으로 가서 첫 진동항이 남고, \\(|4q|>1\\)이면 둘째 항이 발산해요. \\(|4q|=1\\)에서도 \\(-4q=1\\)이면 상수항으로 진동을 없앨 수 없어요. 따라서 \\(-4q=-1\\), 즉 \\(q=1/4\\)이어야 하고 계수를 맞추면 \\(b_{1}=-3\\)예요. 이때 일반항은 모든 \\(n\\)에서 실제로 0예요.","check":{"prompt":"일반항이 0으로 수렴한다는 조건만 쓰고 급수 수렴을 끝냈다고 해도 되나요?","answer":"\\(q=1/4, b_1=-3\\)이고 모든 \\(n\\)에서 성립해요."}},{"id":"c3","label":"둘째 수열의 합과 요구값 계산하기","stepIds":["s8"],"question":"\\(b_n\\)의 급수 합은 얼마인가요?","hint":"첫째항 -3, 공비 1/4인 등비급수 합을 쓰세요.","explanation":"\\(\\sum b_n=-3/(1-1/4)=-4\\)예요. 따라서 \\(b_1\\sum b_n=(-3)(-4)=12\\)예요.","check":{"prompt":"\\(b_n\\) 자체의 급수도 수렴하나요?","answer":"공비 \\(q=1/4\\)의 절댓값이 1보다 작으므로 수렴해요."}}],"takeaway":["절댓값이 있는 급수의 부호는 절댓값이 없는 부분이 상쇄해야 하는 방향으로 먼저 판단해요.","급수의 일반항 조건은 후보를 정한 뒤 실제 일반항이 사라지는지까지 확인해 충분성을 점검해요."]};</script>
