<script>window.HandStudyRecord={"itemId":17686,"sourceLabel":"2023 교육청 고3 수학미적분 7월 30번","adminYear":2023,"grade":3,"month":7,"number":30,"track":"미적분","points":4,"scoreStatus":"confirmed_4_direct","questionText":"최고차항의 계수가 $1$인 삼차함수 $f(x)$에 대하여 함수 $g(x)$를\n $g \\left(x \\right)=\\sin \\left| \\pi f \\left(x \\right) \\right|$\n라 하자. 함수 $y=g(x)$의 그래프와 $x$축이 만나는 점의 $x$좌표 중 양수인 것을 작은 수부터 크기순으로 모두 나열할 때, $n$번째 수를 $a_{n}$이라 하자. 함수 $g(x)$와 자연수 $m$이 다음 조건을 만족시킨다.\n (가) 함수 $g(x)$는 $x=a_{4}$와 $x=a_{8}$에서 극대이다.\n(나) $f \\left( a _{m} \\right) =f \\left(0 \\right)$\n$f \\left(a_{k} \\right) \\leq f(m)$을 만족시키는 자연수 $k$의 최댓값을 구하시오. [4점]","answer":"208","sourceHash":"503cce6ae1ba75485d2c4d993d3561c99bad95c92eab77ca86c75ca2d1cf0ad4","steps":[{"id":"s1","latex":"g(x)=0\\iff |f(x)|\\in\\mathbb Z,\\qquad a_4,a_8\\text{는 }f\\text{의 극값점}"},{"id":"s2","latex":"f(a_4)-f(a_8)=4,\\qquad f(a_8)\\le f(0)<f(a_8)+1"},{"id":"s3","latex":"f(a_m)=f(0)\\Rightarrow f(0)=f(a_8),\\quad f(x)-f(a_8)=x(x-a_8)^2"},{"id":"s4","latex":"f'(x)=(x-a_8)(3x-a_8)\\Rightarrow a_4=\\frac{a_8}{3}"},{"id":"s5","latex":"\\frac4{27}a_8^3=4\\Rightarrow a_8=3,\\quad a_4=1,\\quad m=8"},{"id":"s6","latex":"0<x\\le3:\\ 8\\text{개},\\qquad3<x\\le8:\\ f(8)-f(3)=8(8-3)^2=200"},{"id":"s7","latex":"f(a_k)\\le f(8)\\text{을 만족시키는 자연수 }k\\text{는 }1,2,\\ldots,208\\text{이므로 가장 큰 값은 }208\\text{이다.}"}],"diagram":null,"contentHash":"83ad7f0b8923d2a18f4f9b75e310a65243cc5d892dce9f0e305ead189bb7fedd","questionHtml":"<p class=\"hp\">최고차항의 계수가 <span class=\"heq\">\\(1\\)<\/span>인 삼차함수 <span class=\"heq\">\\(f(x)\\)<\/span>에 대하여 함수 <span class=\"heq\">\\(g(x)\\)<\/span>를<\/p><p class=\"hp\">&emsp;&emsp;<span class=\"heq\">\\(g \\left(x \\right)=\\sin \\left| \\pi f \\left(x \\right) \\right|\\)<\/span><\/p><p class=\"hp\">라 하자. 함수 <span class=\"heq\">\\(y=g(x)\\)<\/span>의 그래프와 <span class=\"heq\">\\(x\\)<\/span>축이 만나는 점의 <span class=\"heq\">\\(x\\)<\/span>좌표 중 양수인 것을 작은 수부터 크기순으로 모두 나열할 때, <span class=\"heq\">\\(n\\)<\/span>번째 수를 <span class=\ <script>window.HandStudyGuide={"itemId":17686,"sourceHash":"503cce6ae1ba75485d2c4d993d3561c99bad95c92eab77ca86c75ca2d1cf0ad4","contentHash":"83ad7f0b8923d2a18f4f9b75e310a65243cc5d892dce9f0e305ead189bb7fedd","overview":{"goal":"\\(g\\)의 영점 순서와 두 극대 위치로 삼차함수를 정하고 마지막 번호를 세어요.","firstLook":"\\(g(x)=0\\)은 \\(|f(x)|\\)가 정수라는 뜻이에요. \\(f\\)의 그래프가 정수 높이를 지나는 순서와 극값 위치를 함께 세어야 해요.","conditions":[{"label":"영점과 극대","meaning":"\\(a_{4}\\)와 \\(a_{8}\\)은 \\(g\\)의 영점이면서 극대점이므로 \\(f\\)의 두 극값 위치이고, 두 극값의 높이 차는 4예요."}]},"chapters":[{"id":"c1","label":"영점 순서에서 극값 높이를 읽기","stepIds":["s1","s2"],"question":"두 극값의 함수값 차가 왜 4인가요?","hint":"\\(g\\)의 영점은 \\(|f|=0,1,2,\\ldots\\)인 점이에요. 극값 사이에서 지나가는 정수 높이를 \\(a_4\\)와 \\(a_8\\)의 번호 차와 연결해 보세요.","explanation":"\\(g(x)=\\sin|\\pi f(x)|\\)이므로 \\(g(x)=0\\)일 필요충분조건은 \\(|f(x)|\\)가 정수인 것이에요. 또 \\(g\\)가 영점에서 극대라면 그 점에서 \\(f\\)가 방향을 바꾸어 같은 정수 높이에 접해야 하므로 \\(a_4,a_8\\)은 \\(f\\)의 두 극값 위치예요. 양의 \\(x\\)축에서 네 번째 영점부터 여덟 번째 영점까지 정수 높이가 네 칸 변하므로 \\(f(a_4)-f(a_8)=4\\)예요. 0에서 \\(a_{8}\\)까지 새 정수 높이를 하나 더 지나면 영점 번호가 늘어나므로 \\(f(a_8)\\le f(0)<f(a_8)+1\\)도 얻어요.","check":{"prompt":"\\(a_{4}\\)와 \\(a_{8}\\)에서 \\(f\\)가 정수 높이를 가로지르지 않고 접한다는 사실은 무엇에서 나오나요?","answer":"그 점들이 \\(g\\)의 영점인 동시에 극대점이어서, \\(f\\)가 정수 높이를 지나 계속 같은 방향으로 움직일 수 없기 때문이에요."}},{"id":"c2","label":"삼차함수의 모양 결정하기","stepIds":["s3","s4","s5"],"question":"\\(f(x)-f(a_{8})\\)이 왜 \\(x(x-a_{8})^2\\) 꼴인가요?","hint":"\\(f(a_m)=f(0)\\)인 양의 영점이 하나뿐이라는 조건과 \\(a_8\\)에서 \\(f'=0\\)임을 같이 쓰세요.","explanation":"\\(f(a_m)=f(0)\\)을 만족하는 양의 영점은 \\(a_8\\)이므로 \\(f(0)=f(a_8)\\)예요. \\(a_8\\)은 \\(f\\)의 극값점이어서 \\(f(x)-f(a_8)\\)는 \\(x=a_8\\)을 중근으로 가지고, \\(x=0\\)도 근이에요. 최고차항 계수가 1이므로 \\(f(x)-f(a_8)=x(x-a_8)^2\\). 미분하면 \\(f'(x)=(x-a_8)(3x-a_8)\\)이어서 다른 극값점은 \\(a_4=a_8/3\\)예요. \\(f(a_4)-f(a_8)=4a_8^3/27=4\\)에서 \\(a_8=3\\), 따라서 \\(a_4=1\\)이고 조건의 번호는 \\(m=8\\)예요.","check":{"prompt":"\\(a_{8}=3\\)을 얻은 뒤 \\(m=8\\)이라고 할 수 있는 이유는 무엇인가요?","answer":"\\(f(a_m)=f(0)\\)을 만족하는 양의 영점이 \\(a_8\\)이라고 이미 정했으므로 그 첨자 \\(m\\)이 8이에요."}},{"id":"c3","label":"정수 높이를 끝까지 세기","stepIds":["s6","s7"],"question":"\\(3<x\\le 8\\)에서 영점이 정확히 200개 더 생기는 이유는 무엇인가요?","hint":"\\(x>3\\)에서 \\(f'\\)의 부호와 \\(f(8)-f(3)\\)을 함께 확인하세요.","explanation":"\\(0<x\\le 3\\)에는 정의된 순서 그대로 \\(a_1,\\ldots,a_8\\)의 8개 영점이 있어요. \\(x>3\\)에서는 \\(f'(x)=(x-3)(3x-3)>0\\)이므로 \\(f\\)가 계속 증가해요. 직접 계산하면 \\(f(8)-f(3)=8(8-3)^2=200\\). 따라서 \\(x\\)가 3에서 8까지 움직일 때 \\(f\\)는 서로 다른 정수 높이 200개를 각각 한 번씩 지나고, \\(g\\)의 영점도 200개 더 생겨요. 그러므로 \\(f(a_k)\\le f(8)\\)을 만족하는 \\(k\\)는 \\(1,2,\\ldots,208\\)이고 가장 큰 값은 \\(8+200=208\\)예요.","check":{"prompt":"높이 차 200을 그대로 영점 개수로 셀 수 있는 핵심 조건은 무엇인가요?","answer":"\\(x>3\\)에서 \\(f\\)가 엄격히 증가하여 각 정수 높이를 정확히 한 번씩 지나기 때문이에요."}}],"takeaway":["합성함수의 영점 순서는 바깥함수의 영점 조건을 안쪽함수의 정수 높이로 바꾸어 세어요.","높이 차를 교점 수로 바꿀 때는 해당 구간의 단조성을 반드시 확인해요."]};</script>
