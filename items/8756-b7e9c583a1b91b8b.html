  <script>window.HandStudyRecord={"itemId":8756,"sourceLabel":"2019 교육청 고2 수학가형 3월 20번","adminYear":2019,"grade":2,"month":3,"number":20,"track":"수학가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"$x\\,$에 대한 삼차식 \n $f(x)=x ^{3} + \\left( 2a-1 \\right) x ^{2} + \\left( b ^{2} -2a \\right) x-b ^{2}$\n에 대하여 \u003c보기>에서 옳은 것만을 있는 대로 고른 것은? [4점]\n\u003c 보 기 >\nㄱ. $f(x)\\,$는 $x-1\\,$을 인수로 갖는다.\nㄴ. $a\u003cb\u003c0\\,$인 어떤 두 실수 $a$, $b\\,$에 대하여 방정식 $f(x)=0\\,$의 서로 다른 실근의 개수는 $2\\,$이다.\nㄷ. 방정식 $f(x)=0\\,$이 서로 다른 세 실근을 갖고 세 근의 합이 $7\\,$이 되도록 하는 두 정수 $a$, $b\\,$의 모든 순서쌍 $\\left( a,\\,b \\right)\\,$의 개수는 $5$이다.\n① ㄱ ② ㄱ, ㄴ ③ ㄱ, ㄷ ④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","answer":"⑤","sourceHash":"f19af3039182d084a93162bcfa1a84dcba162b5e0f2146dca20a8ad4522acf5e","steps":[{"id":"s1","latex":"f(x)=(x-1)(x^2+2ax+b^2)\\Rightarrow\\text{첫째 명제는 참}"},{"id":"s2","latex":"(a,b)=\\left(-\\frac58,-\\frac12\\right):\\quad x^2+2ax+b^2=(x-1)\\left(x-\\frac14\\right)\\Rightarrow\\text{둘째 명제는 참}"},{"id":"s3","latex":"\\sum\\text{근}=1-2a=7\\Rightarrow a=-3"},{"id":"s4","latex":"x^2-6x+b^2=0:\\quad9-b^2>0,\\ b^2\\ne5"},{"id":"s5","latex":"b\\in\\{-2,-1,0,1,2\\}\\Rightarrow5\\text{개}\\Rightarrow\\text{셋째 명제는 참}"}],"diagram":null,"contentHash":"553fb26a4763b47c9b9703dad0c644eba31f1583952263d7287abdab0b07b9f0","questionHtml":"\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>에 대한 삼차식\u003c/p>\u003cp class=\"hp\">&emsp;\u003cspan class=\"heq\">\\(f(x)=x^{3} + \\left( 2a-1 \\right) x^{2} + \\left( b^{2} -2a \\right) x-b^{2}\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">에 대하여 &lt;보기&gt;에서 옳은 것만을 있는 대로 고른 것은? \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cdiv class=\"hbox\">\u003cdiv style=\"text-align:center;font-weight:700;margin:0 0 6px\">&lt; 보 기 &gt;\u003c/div>\u003cp class=\"hp\">ㄱ.\u003cspan class=\"heq\">\\(f(x)\\,\\)\u003c/span>는 \u003cspan class=\"heq\">\\(x-1\\,\\)\u003c/span>을 인수로 갖는다.\u003c/p>\u003cp class=\"hp\">ㄴ.\u003cspan class=\"heq\">\\(a\\lt b\\lt 0\\,\\)\u003c
