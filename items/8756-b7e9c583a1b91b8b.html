<script>window.HandStudyRecord={"itemId":8756,"sourceLabel":"2019 교육청 고2 수학가형 3월 20번","adminYear":2019,"grade":2,"month":3,"number":20,"track":"수학가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"$x\\,$에 대한 삼차식 \n $f(x)=x ^{3} + \\left( 2a-1 \\right) x ^{2} + \\left( b ^{2} -2a \\right) x-b ^{2}$\n에 대하여 \u003c보기>에서 옳은 것만을 있는 대로 고른 것은? [4점]\n\u003c 보 기 >\nㄱ. $f(x)\\,$는 $x-1\\,$을 인수로 갖는다.\nㄴ. $a\u003cb\u003c0\\,$인 어떤 두 실수 $a$, $b\\,$에 대하여 방정식 $f(x)=0\\,$의 서로 다른 실근의 개수는 $2\\,$이다.\nㄷ. 방정식 $f(x)=0\\,$이 서로 다른 세 실근을 갖고 세 근의 합이 $7\\,$이 되도록 하는 두 정수 $a$, $b\\,$의 모든 순서쌍 $\\left( a,\\,b \\right)\\,$의 개수는 $5$이다.\n① ㄱ ② ㄱ, ㄴ ③ ㄱ, ㄷ ④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","answer":"⑤","sourceHash":"f19af3039182d084a93162bcfa1a84dcba162b5e0f2146dca20a8ad4522acf5e","steps":[{"id":"s1","latex":"f(x)=(x-1)(x^2+2ax+b^2)\\Rightarrow\\text{첫째 명제는 참}"},{"id":"s2","latex":"(a,b)=\\left(-\\frac58,-\\frac12\\right):\\quad x^2+2ax+b^2=(x-1)\\left(x-\\frac14\\right)\\Rightarrow\\text{둘째 명제는 참}"},{"id":"s3","latex":"\\sum\\text{근}=1-2a=7\\Rightarrow a=-3"},{"id":"s4","latex":"x^2-6x+b^2=0:\\quad9-b^2>0,\\ b^2\\ne5"},{"id":"s5","latex":"b\\in\\{-2,-1,0,1,2\\}\\Rightarrow5\\text{개}\\Rightarrow\\text{셋째 명제는 참}"}],"diagram":null,"contentHash":"553fb26a4763b47c9b9703dad0c644eba31f1583952263d7287abdab0b07b9f0","questionHtml":"\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>에 대한 삼차식\u003c/p>\u003cp class=\"hp\">&emsp;\u003cspan class=\"heq\">\\(f(x)=x^{3} + \\left( 2a-1 \\right) x^{2} + \\left( b^{2} -2a \\right) x-b^{2}\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">에 대하여 &lt;보기&gt;에서 옳은 것만을 있는 대로 고른 것은? \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cdiv class=\"hbox\">\u003cdiv style=\"text-align:center;font-weight:700;margin:0 0 6px\">&lt; 보 기 &gt;\u003c/div>\u003cp class=\"hp\">ㄱ.\u003cspan class=\"heq\">\\(f(x)\\,\\)\u003c/span>는 \u003cspan class=\"heq\">\\(x-1\\,\\)\u003c/span>을 인수로 갖는다.\u003c/p>\u003cp class=\"hp\">ㄴ.\u003cspan class=\"heq\">\\(a\\lt b\\lt 0\\,\\)\u003c/span>인 어떤 두 실수 \u003cspan class=\"heq\">\\(a\\)\u003c/span>, \u003cspan class=\"heq\">\\(b\\,\\)\u003c/span>에 대하여 \u003cbr>방정식 \u003cspan class=\"heq\">\\(f(x)=0\\,\\)\u003c/span>의 서로 다른 실근의 개수는 \u003cspan class=\"heq\">\\(2\\,\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp\">ㄷ.방정식 \u003cspan class=\"heq\">\\(f(x)=0\\,\\)\u003c/span>이 서로 다른 세 실근을 갖고 세 근의 합이 \u003cspan class=\"heq\">\\(7\\,\\)\u003c/span>이 되도록 하는 두 정수 \u003cspan class=\"heq\">\\(a\\)\u003c/span>, \u003cspan class=\"heq\">\\(b\\,\\)\u003c/span>의 모든 순서쌍 \u003cspan class=\"heq\">\\(\\left( a,\\,b \\right)\\,\\)\u003c/span>의 개수는 \u003cspan class=\"heq\">\\(5\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp class=\"hp\">① ㄱ&emsp;② ㄱ, ㄴ&emsp;③ ㄱ, ㄷ \u003cbr>④ ㄴ, ㄷ&emsp;⑤ ㄱ, ㄴ, ㄷ\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"b7e9c583a1b91b8bcff87f7c89769929c07713ef85f0747a44af89030e527ffa"};</script>
<script>window.HandStudyGuide={"itemId":8756,"sourceHash":"f19af3039182d084a93162bcfa1a84dcba162b5e0f2146dca20a8ad4522acf5e","contentHash":"553fb26a4763b47c9b9703dad0c644eba31f1583952263d7287abdab0b07b9f0","overview":{"goal":"인수분해한 이차식의 근을 이용해 세 명제를 확인해요.","firstLook":"\\(x=1\\)을 넣으면 항상 0이므로 먼저 \\(f(x)=(x-1)(x^2+2ax+b^2)\\)로 묶어요.","conditions":[{"label":"고정근","meaning":"1은 항상 근이에요."},{"label":"서로 다른 근","meaning":"이차식의 판별식과 1의 중복 여부를 함께 봐요."},{"label":"근의 합","meaning":"세 근의 합으로 \\(a\\)를 정해요."}]},"chapters":[{"id":"c1","label":"ㄱ과 ㄴ을 확인해요","stepIds":["s1","s2"],"question":"서로 다른 실근이 두 개가 되는 실제 예는 무엇인가요?","hint":"이차식의 한 근을 1로 만들어 고정근과 겹치게 해요.","explanation":"직접 인수분해하면 \\(f(x)=(x-1)(x^2+2ax+b^2)\\)이므로 ㄱ은 참이에요. \\(a=-5/8,b=-1/2\\)이면 \\(a<b<0\\)이고 이차식은 \\((x-1)(x-1/4)\\)예요. 따라서 \\(f(x)=(x-1)^2(x-1/4)\\)라 서로 다른 실근은 1과 \\(1/4\\)의 두 개여서 ㄴ도 참이에요.","check":{"prompt":"ㄴ의 예에서 중근을 두 개로 세지 않는 이유는 무엇인가요?","answer":"문제는 서로 다른 실근의 개수를 묻기 때문에 값 1은 한 번만 세어요."}},{"id":"c2","label":"ㄷ의 정수 순서쌍을 세어요","stepIds":["s3","s4","s5"],"question":"세 근의 합이 7이면 왜 \\(a=-3\\)인가요?","hint":"삼차식에서 근의 합은 \\(x^2\\)항 계수의 반대예요.","explanation":"세 근의 합은 \\(1-2a\\)이므로 \\(1-2a=7\\), \\(a=-3\\)이에요. 이차식은 \\(x^2-6x+b^2\\)이고 서로 다른 두 실근을 가지려면 판별식 \\(36-4b^2>0\\), 즉 \\(|b|<3\\)이어야 해요. 또 이차식에 \\(x=1\\)을 넣은 \\(b^2-5\\)가 0이면 고정근 1과 겹치지만 정수 \\(b\\)에서는 생기지 않아요. 따라서 \\(b=-2,-1,0,1,2\\)의 5개이고 ㄷ도 참이어서 답은 ⑤예요.","check":{"prompt":"\\(b=\\pm3\\)을 제외하는 이유는 무엇인가요?","answer":"판별식이 0이 되어 이차식의 두 근이 같으므로 삼차식이 서로 다른 세 실근을 갖지 못해요."}}],"takeaway":["항상 존재하는 근을 먼저 인수분해하면 나머지 근의 조건을 분리할 수 있어요.","서로 다른 근을 셀 때 판별식뿐 아니라 고정근과 겹치는지도 확인해요."]};</script>
