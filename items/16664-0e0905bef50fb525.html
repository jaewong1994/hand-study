<script>window.HandStudyRecord={"itemId":16664,"sourceLabel":"2020 교육청 고3 수리가형 3월 29번","adminYear":2020,"grade":3,"month":3,"number":29,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"자연수 $n\\,$에 대하여 두 점 $A\\, \\left( 0,\\,n+5 \\right)$, $B\\, \\left( n+4,\\,0 \\right)\\,$과 원점 $O\\,$를 꼭짓점으로 하는 삼각형 $A O B\\,$가 있다. 삼각형 $A O B\\,$의 내부에 포함된 정사각형 중 한 변의 길이가 $1\\,$이고 꼭짓점의 $x\\,$좌표와 $y\\,$좌표가 모두 자연수인 정사각형의 개수를 $a _{\\,n}\\,$이라 하자. $\\sum _{n=1} ^{8} a _{\\,n}\\,$의 값을 구하시오. [4점]","answer":"164","sourceHash":"e0322adcbb0589ab4857af8dafa5d65d5ea7c20d3b42f3047a78c64fc840c2f2","steps":[{"id":"s1","latex":"AB:\\quad \\frac{x}{n+4}+\\frac{y}{n+5}=1"},{"id":"s2","latex":"\\text{정사각형의 왼쪽 아래 꼭짓점}=(i,j),\\qquad i,j\\in\\mathbb N"},{"id":"s3","latex":"\\frac{i+1}{n+4}+\\frac{j+1}{n+5}\\le1"},{"id":"s4","latex":"j+1\\le(n+3-i)+\\frac{n+3-i}{n+4}\\Rightarrow j\\le n+2-i"},{"id":"s5","latex":"a_n=\\sum_{i=1}^{n+1}(n+2-i)=\\frac{(n+1)(n+2)}2={n+2\\choose2}"},{"id":"s6","latex":"\\sum_{n=1}^{8}a_n=\\sum_{r=3}^{10}{r\\choose2}={11\\choose3}-1=\\boxed{164}"}],"diagram":null,"contentHash":"a9e34bd6ee6938349d6a8b75669fbaf9eddfb0846b1ba9f9b2e8e268bdd55370","questionHtml":"\u003cp class=\"hp htall\">자연수 \u003cspan class=\"heq\">\\(n\\,\\)\u003c/span>에 대하여 두 점 \u003cspan class=\"heq\">\\(A\\, \\left( 0,\\,n+5 \\right)\\)\u003c/span>, \u003cspan class=\"heq\">\\(B\\, \\left( n+4,\\,0 \\right)\\,\\)\u003c/span>과 원점 \u003cspan class=\"heq\">\\(O\\,\\)\u003c/span>를 꼭짓점으로 하는 삼각형 \u003cspan class=\"heq\">\\(A O B\\,\\)\u003c/span>가 있다. 삼각형 \u003cspan class=\"heq\">\\(A O B\\,\\)\u003c/span>의 내부에 포함된 정사각형 중 한 변의 길이가 \u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>이고 꼭짓점의 \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>좌표와 \u003cspan class=\"heq\">\\(y\\,\\)\u003c/span>좌표가 모두 자연수인 정사각형의 개수를 \u003cspan class=\"heq\">\\(a_{\\,n}\\,\\)\u003c/span>이라 하자. \u003cspan class=\"heq\">\\(\\sum\\limits_{n=1}^{8} a_{\\,n}\\,\\)\u003c/span>의 값을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"0e0905bef50fb525e7f5f52f97f800a12830298f9cd72be099903ecca9d2ed14"};</script>
<script>window.HandStudyGuide={"itemId":16664,"sourceHash":"e0322adcbb0589ab4857af8dafa5d65d5ea7c20d3b42f3047a78c64fc840c2f2","contentHash":"a9e34bd6ee6938349d6a8b75669fbaf9eddfb0846b1ba9f9b2e8e268bdd55370","overview":{"goal":"단위 정사각형의 오른쪽 위 꼭짓점이 빗변 아래에 있는 조건을 정수 부등식으로 바꾸어 개수를 세고 합해요.","firstLook":"길이가 1이고 꼭짓점 좌표가 정수인 정사각형은 좌표축과 평행해요. 삼각형의 빗변이 내려가므로 네 꼭짓점 중 오른쪽 위 점만 확인하면 돼요.","conditions":[{"label":"자연수 좌표","meaning":"왼쪽 아래 꼭짓점의 두 좌표는 1 이상의 정수예요."},{"label":"삼각형 내부","meaning":"정사각형의 네 꼭짓점과 변이 삼각형 안에 포함되어야 하며 경계에 닿는 것은 허용돼요."},{"label":"단위 길이","meaning":"정수 격자에서 길이 1인 변은 가로 또는 세로 방향이에요."}]},"chapters":[{"id":"c1","label":"빗변과 대표 꼭짓점을 정해요","stepIds":["s1","s2","s3"],"question":"정사각형 하나를 어떤 두 정수로 나타내고 어느 점을 검사할까요?","hint":"왼쪽 아래를 \\((i,j)\\)라 하면 오른쪽 위는 \\((i+1,j+1)\\)이에요.","explanation":"두 절편이 \\(n+4,n+5\\)이므로 빗변 \\(AB\\)의 방정식은 \\(x/(n+4)+y/(n+5)=1\\)이에요. 정사각형의 왼쪽 아래 꼭짓점을 \\((i,j)\\)라 두면 자연수 좌표 조건에서 \\(i,j\\in\\mathbb N\\)이에요.\n\n빗변 아래 영역은 오른쪽이나 위로 갈수록 경계에 가까워지므로 정사각형 전체가 들어가는지는 오른쪽 위 꼭짓점만 확인하면 돼요. 따라서 \\((i+1)/(n+4)+(j+1)/(n+5)\\le1\\)이에요.","check":{"prompt":"왼쪽 아래 꼭짓점만 확인하면 부족한 이유는 무엇인가요?","answer":"그 점은 빗변 아래여도 오른쪽 위 꼭짓점이 빗변을 넘어 정사각형 일부가 밖으로 나갈 수 있기 때문이에요."}},{"id":"c2","label":"각 i에서 가능한 j를 세어요","stepIds":["s4","s5"],"question":"고정된 \\(i\\)에서 \\(j\\)는 어디까지 가능하고 정사각형은 몇 개인가요?","hint":"부등식의 오른쪽을 정수 부분과 1보다 작은 분수 부분으로 나누어요.","explanation":"부등식을 \\(j\\)에 대해 정리하면\n\\[\nj+1\\le(n+3-i)+\\frac{n+3-i}{n+4}.\n\\]\n\\(1\\le i\\le n+1\\)이면 분수 부분은 \\(0\\)보다 크고 \\(1\\)보다 작으므로 정수 \\(j\\)는 \\(j\\le n+2-i\\)예요. 따라서 각 \\(i\\)에서 가능한 \\(j\\)의 수는 \\(n+2-i\\)개예요.\n\n\\(i=1,\\ldots,n+1\\)에 대해 더하면 \\(a_n=(n+1)+n+\\cdots+1=(n+1)(n+2)/2={}_{n+2}\\mathrm C_2\\)예요.","check":{"prompt":"\\(i=n+1\\)일 때 가능한 \\(j\\)는 몇 개인가요?","answer":"\\(n+2-(n+1)=1\\)개예요."}},{"id":"c3","label":"여덟 항의 조합 합을 계산해요","stepIds":["s6"],"question":"\\(\\sum_{n=1}^8 a_n\\)은 얼마인가요?","hint":"\\(r=n+2\\)로 바꾸고 연속한 조합 수의 합을 이용해요.","explanation":"\\[\n\\sum_{n=1}^8a_n=\\sum_{r=3}^{10}{}_r\\mathrm C_2.\n\\]\n\\(\\sum_{r=2}^{10}{}_r\\mathrm C_2={}_{11}\\mathrm C_3\\)이므로 \\(r=2\\)의 값 \\(1\\)을 빼면 \\({}_{11}\\mathrm C_3-1=165-1=164\\)예요.","check":{"prompt":"\\({}_{11}\\mathrm C_3\\)은 얼마인가요?","answer":"\\(11\\cdot10\\cdot9/(3\\cdot2\\cdot1)=165\\)예요."}}],"takeaway":["정수 격자의 단위 정사각형은 한 꼭짓점의 정수 좌표로 나타낼 수 있어요.","감소하는 빗변 아래에 정사각형이 들어가는지는 가장 오른쪽 위 꼭짓점으로 확인해요.","계단 모양 개수의 합은 조합 수로 바꾸면 연속 조합 합 공식으로 빠르게 계산할 수 있어요."]};</script>
