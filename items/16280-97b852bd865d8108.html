<script>window.HandStudyRecord={"itemId":16280,"sourceLabel":"2019 교육청 고3 수리가형 4월 28번","adminYear":2019,"grade":3,"month":4,"number":28,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"할아버지, 할머니, 아버지, 어머니, 아이로 구성된 $5$명의 가족이 영화를 보려고 한다. 영화관의 좌석은 그림과 같이 $A$, $B$ 두 개의 열로 이루어져 있고, 각 열에는 $5$개의 좌석이 있다. $A$열에는 할아버지와 할머니가 이웃하여 앉고, $B$열에는 아버지, 어머니, 아이가 앉되 아이는 아버지 또는 어머니와 이웃하고, 아이의 바로 앞에 있는 좌석은 비어 있도록 한다. 이때, $5$명이 모두 좌석에 앉는 경우의 수를 구하시오. (단, $2$명이 같은 열의 바로 옆에 앉을 때만 이웃한 것으로 본다. 또한 한 좌석에는 한 명만 앉고, 다른 관람객은 없다.) [4점]\n$A$열 $B$열 ","answer":"192","sourceHash":"ec1ff7e244fbdd309598125f339a76f7b3a38da2f540f2391d47584d6e62ad82","steps":[{"id":"s1","latex":"A,B\\text{열의 좌석을 왼쪽부터 }1,2,3,4,5\\text{로 둔다}"},{"id":"s2","latex":"\\text{조부모의 이웃한 좌석쌍}:\\ \\{1,2\\},\\{2,3\\},\\{3,4\\},\\{4,5\\}"},{"id":"s3","latex":"c=\\text{아이의 }B\\text{열 좌석},\\qquad N(c)=\\text{부모의 순서 있는 배치 수}"},{"id":"s4","latex":"N(1)=N(5)=12-3\\cdot2=6"},{"id":"s5","latex":"N(2)=N(3)=N(4)=12-2\\cdot1=10"},{"id":"s6","latex":"\\text{아이의 바로 앞 좌석은 비어야 하므로 }c\\notin\\text{조부모 좌석쌍}"},{"id":"s7","latex":"\\{1,2\\}:26,\\quad\\{2,3\\}:22,\\quad\\{3,4\\}:22,\\quad\\{4,5\\}:26"},{"id":"s8","latex":"2(26+22+22+26)=192"}],"diagram":null,"contentHash":"ea4914d60a5128fe960bd2307516c5d84857f07fdaaa98c4b978089f6b70d95a","questionHtml":"\u003cp class=\"hp\">할아버지, 할머니, 아버지, 어머니, 아이로 구성된 \u003cspan class=\"heq\">\\(5\\)\u003c/span>명의 가족이 영화를 보려고 한다. 영화관의 좌석은 그림과 같이 \u003cspan class=\"heq\">\\(A\\)\u003c/span>, \u003cspan class=\"heq\">\\(B\\)\u003c/span> 두 개의 열로 이루어져 있고, 각 열에는 \u003cspan class=\"heq\">\\(5\\)\u003c/span>개의 좌석이 있다.\u003cbr>\u003cspan class=\"heq\">\\(A\\)\u003c/span>열에는 할아버지와 할머니가 이웃하여 앉고, \u003cspan class=\"heq\">\\(B\\)\u003c/span>열에는 아버지, 어머니, 아이가 앉되 아이는 아버지 또는 어머니와 이웃하고, 아이의 바로 앞에 있는 좌석은 비어 있도록 한다. \u003cbr>이때, \u003cspan class=\"heq\">\\(5\\)\u003c/span>명이 모두 좌석에 앉는 경우의 수를 구하시오. \u003cbr>(단, \u003cspan class=\"heq\">\\(2\\)\u003c/span>명이 같은 열의 바로 옆에 앉을 때만 이웃한 것으로 본다. 또한 한 좌석에는 한 명만 앉고, 다른 관람
