cases} \\left(x-a-2 \\right) ^{2} e ^{x}&& \\left(x \\geq a \\right) \\\\ e ^{2a} \\left(x-a \\right)+4e ^{a}&& \\left(x\u003ca \\right)\\end{cases}}$\n일 때, 실수 $t$에 대하여 $f(x)=t$를 만족시키는 $x$의 최솟값을 $g(t)$라 하자. 함수 $g(t)$가 $t=12$에서만 불연속일 때, $\\frac{g ' (f(a+2))}{g ' (f(a+6))}$의 값은? (단, $a$는 상수이다.) [4점]\n① $6 e^{4}$ ② $9 e^{4}$ ③ $12 e^{4}$\n④ $8 e^{6}$ ⑤ $10 e^{6}$","scoreStatus":"confirmed_4_direct","sourceHash":"9048d58d855f6704bce36c9bee058230fc8169f64cf6009cc8f78ddd0a4a6088","sourceLabel":"2024 평가원 고3 수학미적분 6월 28번","stepExplanations":{"s1":{"body":"\\(x\u003ca\\)의 직선은 기울기가 \\(e^{2a}>0\\)이고 높이 \\(4e^a\\)보다 작은 모든 값을 가져요. 따라서 \\(t\u003c4e^a\\)이면 이 직선 위의 근이 항상 가장 왼쪽이에요. 한편 \\(x\\ge a\\)에서 \\(f^{\\prime}(x)=(x-a-2)(x-a)e^x\\)이므로 그래프는 \\(a\\)부터 \\(a+2\\)까지 \\(4e^a\\)에서 0으로 감소한 뒤 증가해요. \\(t=4e^a\\)에서는 가장 작은 근이 \\(a\\)인데, 그보다 조금 큰 \\(t\\)의 근은 \\(a+2\\)보다 오른쪽으로 옮겨 가요. 이곳에서만 가장 작은 근이 끊어지므로 \\(4e^a=12\\)예요.","skillTags":["algebra.calculation"],"title":"가장 작은 근은 어느 부분에서 나오나요?"},"s3":{"body":"\\(f(a+2)=0\\)이지만 \\(g(0)\\)은 \\(f(x)=0\\)인 근 중 가장 작은 것을 골라요. \\(0\u003c12\\)이므로 직선 부분에 있는 근을 골라야 해요. 직선식을 \\(x\\)에 관해 풀면 \\(g(t)=a+\\frac{t-4e^a}{e^{2a}}\\)이고, \\(e^a=3\\)이므로 이 구간에서 \\(g^{\\prime}(t)=\\frac{1}{9}\\)예요.","skillTags":["algebra.calculation"],"title":"함숫값이 0이어도 a+2를 고르면 안 돼요"},"s6":{"body":"\\(f(a+6)=16e^{a+6}=48e^6>12\\)이므로 이 높이의 근은 \\(x>a+2\\)인 증가 구간에 하나뿐이에요. 따라서 \\(g(f(a+6))=a+6\\)이고 역함수 미분법을 쓸 수 있어요. \\(f^{\\prime}(a+6)=4\\cdot6\\cdot e^{a+6}=72e^6\\ne0\\)이므로 \\(g^{\\prime}(f(a+6))=\\frac1{72e^6}\\)이에요.","skillTags":["calculus.derivative","algebra.calculation"],"title":"높이가 12보다 크면 증가하는 오른쪽 가지예요"}},"steps":[{"id":"s1","latex":"g\\text{의 불연속점}=f(a)=4e^a=12\\Rightarrow e^a=3"},{"id":"s2","latex":"t\u003c12:\\quad g(t)=a+\\dfrac{t-4e^a}{e^{2a}},\\qquad g'(t)=\\dfrac19"},{"id":"s3","latex":"f(a+2)=0\u003c12\\Rightarrow g'\\!\\left(f(a+2)\\right)=\\dfrac19"},{"id":"s4","latex":"x\\ge a:\\quad f'(x)=(x-a-2)(x-a)e^x"},{"id":"s5","latex":"f(a+6)=16e^{a+6}>12,\\quad f'(a+6)=72e^6"}, <script>window.HandStudyGuide={"itemId":18077,"sourceHash":"9048d58d855f6704bce36c9bee058230fc8169f64cf6009cc8f78ddd0a4a6088","contentHash":"5f6062f236fadb27dd2ab18afacbc5ca145182d1212db189c2ec2f7efcc92f95","overview":{"goal":"방정식의 가장 작은 해가 어느 조각에서 나오는지 추적해 불연속 높이와 두 미분계수를 구해요.","firstLook":"왼쪽 직선의 값의 범위와 오른쪽 곡선의 증감을 비교하면 가장 작은 해가 바뀌는 높이가 보여요.","conditions":[{"label":"가장 작은 해를 함수값으로 정함","meaning":"같은 높이의 해가 여러 개면 그래프에서 가장 왼쪽 교점을 선택해요."},{"label":"불연속점이 한 높이에만 존재","meaning":"왼쪽 직선의 끝높이와 주어진 불연속 높이를 같게 해요."}]},"chapters":[{"id":"c1","label":"가장 작은 해가 바뀌는 높이","stepIds":["s1","s2","s3"],"question":"가장 작은 해가 왼쪽 직선에서 오른쪽 곡선으로 바뀌는 높이는 얼마인가요?","hint":"\\(x<a\\)인 직선이 가지는 값의 위끝과 \\(x=a\\)에서의 함숫값을 비교하세요.","explanation":"\\(x<a\\)에서 기울기는 \\(e^{2a}>0\\)이고 값의 범위는 \\(( -\\infty,4e^a)\\)예요. 오른쪽에서는 \\(f'(x)=(x-a-2)(x-a)e^x\\)라 \\(x=a\\)에서 높이 \\(4e^a\\)로 시작해 \\(a+2\\)까지 감소한 뒤 증가해요. 따라서 \\(t<4e^a\\)에서는 가장 왼쪽 해가 직선에 있지만, 이 높이를 넘으면 해가 오른쪽 증가 구간으로 옮겨 점프해요.\n\n유일한 불연속 높이가 12이므로 \\(4e^a=12\\), 즉 \\(e^a=3\\)이에요. \\(t<12\\)에서 직선식을 풀면 \\(g(t)=a+(t-4e^a)/e^{2a}\\)이고 \\(g'(t)=e^{-2a}=1/9\\)예요. \\(f(a+2)=0<12\\)이므로 \\(g'(f(a+2))=1/9\\)예요.","check":{"prompt":"\\(f(a+2)=0\\)인 점 자체가 가장 작은 해가 아닌 이유는 무엇인가요?","answer":"높이 0은 왼쪽 직선에서도 만나며 그 해는 \\(a\\)보다 작아서 \\(a+2\\)보다 왼쪽에 있어요."}},{"id":"c2","label":"높은 값에 대응하는 가지","stepIds":["s4","s5"],"question":"\\(f(a+6)\\)에 대응하는 가장 작은 해가 왜 \\(a+6\\)인가요?","hint":"그 함숫값이 12보다 큰지 확인한 뒤 오른쪽 곡선의 증가 구간을 보세요.","explanation":"오른쪽 조각의 도함수는 \\(f'(x)=(x-a-2)(x-a)e^x\\)예요. \\(f(a+6)=16e^{a+6}=48e^6>12\\)이므로 왼쪽 직선에는 같은 높이의 해가 없고, 오른쪽 감소 구간도 높이가 12 이하라 해당하지 않아요. 따라서 오른쪽 증가 구간의 유일한 해 \\(a+6\\)이 \\(g(f(a+6))\\)예요.\n\n이 점에서 \\(f'(a+6)=4\\cdot6\\cdot e^{a+6}=72e^6\\)이고 0이 아니므로 역함수의 미분 공식을 적용할 수 있어요.","check":{"prompt":"\\(f'(a+6)\\)에서 두 일차인수의 값은 각각 얼마인가요?","answer":"\\(a+6-a-2=4\\), \\(a+6-a=6\\)이에요."}},{"id":"c3","label":"두 미분계수의 비","stepIds":["s6","s7"],"question":"오른쪽 증가 가지의 역관계 미분계수는 얼마인가요?","hint":"대응점에서 \\(g'=1/f'\\)를 사용하고 앞에서 구한 \\(1/9\\)와 나누세요.","explanation":"\\(f'(a+6)=72e^6\\ne0\\)이므로 \\(g'(f(a+6))=1/(72e^6)\\)이에요. 따라서 요구한 비는 \\((1/9)/(1/(72e^6))=72e^6/9=8e^6\\)이고 정답은 ④예요.","check":{"prompt":"나눗셈에서 \\(72\\)가 \\(8\\)로 줄어드는 계산은 무엇인가요?","answer":"\\(72/9=8\\)이에요."}}],"takeaway":["방정식의 가장 작은 해는 그래프의 가장 왼쪽 교점을 뜻해요.","조각의 값의 범위를 비교하면 선택되는 가지가 바뀌는 높이를 찾을 수 있어요.","역함수 미분 공식 전에는 대응점의 도함수가 0이 아닌지 확인해요."]};</script>
