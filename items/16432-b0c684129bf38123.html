<script>window.HandStudyRecord={"itemId":16432,"sourceLabel":"2019 교육청 고3 수리나형 4월 30번","adminYear":2019,"grade":3,"month":4,"number":30,"track":"수리나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"두 실수 $a$, $b$에 대하여 두 함수 \n $f \\left( x \\right) =ax+b$, \n $g \\left( x \\right) = \\frac{1}{ax+b-2} +3$\n이 다음 조건을 만족시키도록 하는 두 실수 $a$, $b$의 순서쌍 $\\left( \\,a,\\,b \\right)$를 좌표평면에 나타낸 영역을 $R\\,$라 하자.\n(가) $x>0$일 때, $1\u003cg \\left( x \\right) \u003c3$\n(나) 두 함수 $y=f \\left( x \\right)$와 $y= \\frac{1}{x-2} +3$의 그래프의 교점이 제$4$사분면 위에는 있지 않다.\n영역 $R\\,$에 속하는 점 $\\left( \\,a,\\,b \\right)$에 대하여 $a ^{2} +b ^{2}$의 최댓값을 $M\\,$이라 할 때, $100M\\,$의 값을 구하시오. (단, $a\\ne 0$) [4점]","answer":"306","sourceHash":"3f0b307ec4fa6945bc4fb2647fedb302fe17d70156f64c03b686074a6d85ed19","steps":[{"id":"s1","latex":"1\u003cg(x)\u003c3\\ (x>0)\\Rightarrow ax+b\u003c\\dfrac32"},{"id":"s2","latex":"\\therefore a\u003c0,\\quad b\\le\\dfrac32"},{"id":"s3","latex":"\\text{영역 조건}\\Rightarrow\\dfrac53a+b\\ge0"},{"id":"s4","latex":"-\\dfrac53a\\le b\\le\\dfrac32\\Rightarrow a\\ge-\\dfrac9{10}"},{"id":"s5","latex":"R\\text{의 원점에서 가장 먼 점}=\\left(-\\dfrac9{10},\\dfrac32\\right)"},{"id":"s6","latex":"M=\\dfrac{81}{100}+\\dfrac94=\\dfrac{153}{50}\\Rightarrow100M=306"}],"diagram":null,"contentHash":"86cc410002ab85ec33065157fb5a50d7282cbe4da4b1066ded288f1650ca2ede","questionHtml":"\u003cp class=\"hp\">두 실수 \u003cspan class=\"heq\">\\(a\\)\u003c/span>, \u003cspan class=\"heq\">\\(b\\)\u003c/span>에 대하여 두 함수\u003c/p>\u003cp class=\"hp\">&emsp;\u003cspan class=\"heq\">\\(f \\left( x \\right) =ax+b\\)\u003c/span>,\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\(g \\left( x \\right) = \\dfrac{1}{ax+b-2} +3\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">이 다음 조건을 만족시키도록 하는 두 실수 \u003cspan class=\"heq\">\\(a\\)\u003c/span>, \u003cspan class=\"heq\">\\(b\\)\u003c/span>의 순서쌍 \u003cspan class=\"heq\">\\(\\left( \\,a,\\,b \\right)\\)\u003c/span>를 좌표평면에 나타낸 영역을 \u003cspan class=\"heq\">\\(R\\,\\)\u003c/span>라 하자.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) \u003cspan class=\"heq\">\\(x\\gt 0\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(1\\lt g \\left( x \\right) \\lt 3\\)\u003c/span>\u003c/p>\u003cp class=\"hp htall\">(나) 두 함수 \u003cspan class=\"heq\">\\(y=f \\left( x \\right)\\)\u003c/span>와 \u003cspan class=\"heq\">\\(y= \\dfrac{1}{x-2} +3\\)\u003c/span>의 그래프의 교점이 \u003cbr>제\u003cspan class=\"heq\">\\(4\\)\u003c/span>사분면 위에는 있지 않다.\u003c/p>\u003c/div>\u003cp class=\"hp\">영역 \u003cspan class=\"heq\">\\(R\\,\\)\u003c/span>에 속하는 점 \u003cspan class=\"heq\">\\(\\left( \\,a,\\,b \\right)\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(a^{2} +b^{2}\\)\u003c/span>의 최댓값을 \u003cspan class=\"heq\">\\(M\\,\\)\u003c/span>이라 할 때, \u003cspan class=\"heq\">\\(100M\\,\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(a \\neq 0\\)\u003c/span>) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"b0c684129bf38123184c39567bf51b5125ba57baf7c5348115a26de661f07409"};</script>
<script>window.HandStudyGuide={"itemId":16432,"sourceHash":"3f0b307ec4fa6945bc4fb2647fedb302fe17d70156f64c03b686074a6d85ed19","contentHash":"86cc410002ab85ec33065157fb5a50d7282cbe4da4b1066ded288f1650ca2ede","overview":{"goal":"두 그래프 조건을 \\(a,b\\)의 연립부등식으로 바꾸고 영역에서 원점까지 가장 먼 점을 찾아요.","firstLook":"조건 (가)는 모든 \\(x>0\\)에 대한 조건이므로 일차식의 기울기와 \\(x\\to0+\\)일 때 값을 함께 봐요.","conditions":[{"label":"함숫값 범위","meaning":"\\(x>0\\)에서 항상 \\(1<g(x)<3\\)이에요."},{"label":"교점 위치","meaning":"쌍곡선의 제4사분면 가지와 직선이 만나지 않아야 해요."}]},"chapters":[{"id":"c1","label":"첫 조건에서 반평면을 구해요","stepIds":["s1","s2"],"question":"왜 \\(a<0,b\\le3/2\\)인가요?","hint":"\\(u=ax+b-2\\)로 놓고 \\(1<1/u+3<3\\)을 풀어요.","explanation":"부등식은 \\(-2<1/(ax+b-2)<0\\)이므로 분모가 \\(-1/2\\)보다 작아 \\(ax+b<3/2\\)예요. 이것이 모든 \\(x>0\\)에서 성립하려면 기울기는 양수일 수 없고, \\(a\\ne0\\)이므로 \\(a<0\\)이에요. 또 \\(x\\to0+\\)로 보내면 \\(b\\le3/2\\)를 얻어요. 등호는 \\(x=0\\)이 범위에 없고 \\(a<0\\)이므로 허용돼요.","check":{"prompt":"\\(b=3/2\\)가 허용되는 이유는 무엇인가요?","answer":"\\(x>0\\)이면 \\(ax<0\\)이라 실제로 \\(ax+b<3/2\\)가 되기 때문이에요."}},{"id":"c2","label":"교점 조건에서 다른 경계를 구해요","stepIds":["s3","s4"],"question":"조건 (나)는 어떤 부등식이 되나요?","hint":"쌍곡선의 제4사분면 가지가 시작하는 \\((5/3,0)\\)에서 직선의 위치를 비교해요.","explanation":"쌍곡선 \\(y=1/(x-2)+3\\)의 제4사분면 부분은 \\(5/3<x<2\\)에 있어요. 감소하는 직선이 이 가지와 만나지 않으려면 시작점에서 직선이 \\(x\\)축 위쪽에 있어야 하므로 \\(5a/3+b\\ge0\\)이에요. 따라서 \\(-5a/3\\le b\\le3/2\\)이고 이 구간이 비지 않으려면 \\(-5a/3\\le3/2\\), 즉 \\(a\\ge-9/10\\)이에요. 첫 조건과 합치면 \\(-9/10\\le a<0\\)인 영역이 돼요.","check":{"prompt":"\\(a\\)의 가장 작은 값은 얼마인가요?","answer":"두 경계가 만나는 \\(-9/10\\)이에요."}},{"id":"c3","label":"영역에서 원점까지 가장 먼 점을 찾아요","stepIds":["s5","s6"],"question":"\\(a^2+b^2\\)의 최댓값은 어디에서 생기나요?","hint":"영역의 꼭짓점 중 \\(|a|\\)와 \\(b\\)가 동시에 가장 큰 점을 봐요.","explanation":"영역은 \\(b=3/2\\), \\(b=-5a/3\\), \\(a=0\\) 사이의 삼각형 모양이고, 원점에서 가장 먼 점은 두 경계가 만나는 \\((-9/10,3/2)\\)예요. 여기서 \\(M=81/100+9/4=306/100=153/50\\)이므로 \\(100M=306\\)이에요.","check":{"prompt":"경계 교점이 실제 영역에 포함되나요?","answer":"두 부등식이 모두 등호로 성립하고 \\(a=-9/10\\ne0\\)이라 포함돼요."}}],"takeaway":["모든 양수에서의 일차부등식은 기울기와 열린 끝의 극한을 함께 봐요.","그래프 교점의 사분면 조건은 해당 가지의 시작점과 직선 위치로 경계를 만들 수 있어요.","거리제곱의 최댓값은 닫힌 경계의 꼭짓점을 비교해 확인해요."]};</script>
