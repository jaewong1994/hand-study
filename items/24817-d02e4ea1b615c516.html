  <script>window.HandStudyRecord={"adminYear":2022,"answer":"④","contentHash":"88d93a2addeab58d86d85fb80273a1740f2a3256139dd4908d79cfd56665707d","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24817,"month":11,"number":10,"points":4,"preview":false,"questionHtml":"\u003cp>두 곡선 \u003cspan class=\"heq\">\\(y = x^3 +x^2 ,\\,y = - x^2 +k\\)\u003c/span>와 \u003cspan class=\"heq\">\\(y\\)\u003c/span>축으로 둘러싸인 부분의 넓이를 \u003cspan class=\"heq\">\\(A\\)\u003c/span>, 두 곡선 \u003cspan class=\"heq\">\\(y = x^3 +x^2 ,\\,y = - x^2 +k\\)\u003c/span>와 직선 \u003cspan class=\"heq\">\\(x=2\\)\u003c/span>로 둘러싸인 부분의 넓이를 \u003cspan class=\"heq\">\\(B\\,\\)\u003c/span>라 하자. \u003cspan class=\"heq\">\\(A= B\\)\u003c/span>일 때, 상수 \u003cspan class=\"heq\">\\(k\\)\u003c/span>의 값은? (단, \u003cspan class=\"heq\">\\(4 &lt; k &lt; 5\\)\u003c/span>) [4점]\u003c/p>\u003cfigure>\u003cimg class=\"hfig\" src=\"../assets/csat/24817-1f04bb08166a599c.png\" alt=\"2022년 시행 수능 10번 문항 그림 \" style=\"max-width:100%;width:420px\">\u003c/figure>\u003cdiv class=\"hchoices\">\u003cdiv class=\"hch\">① \u003cspan class=\"heq\">\\(\\frac{25}{6}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">② \u003cspan class=\"heq\">\\(\\frac{13}{3}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">③ \u003cspan class=\"heq\">\\(\\frac{9}{2}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">④ \u003cspan class=\"heq\">\\(\\frac{14}{3}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">⑤ \u003cspan class=\"heq\">\\(\\frac{29}{6}\\)\u003c/span>\u003c/div>\u003c/div>","questionText":"두 곡선 $y = x^3 +x^2 ,\\,y = - x^2 +k$와 $y$축으로 둘러싸인 부분의 넓이를 $A$, 두 곡선 $y = x^3 +x^2 ,\\,y = - x^2 +k$와 직선 $x=2$로 둘러싸인 부분의 넓이를 $B\\,$라 하자. $A= B$일 때, 상수 $k$의 값은? (단, $4 \u003c k \u003c 5$) [4점]\n① $\\frac{25}{6}$ ② $\\frac{13}{3}$ ③ $\\frac{9}{2}$ ④ $\\frac{14}{3}$ ⑤ $\\frac{29}{6}$","sourceHash":"0429add7e3ba22e90cf08fbeb0912e0b918466efb8c22446d9337497877c9802","sourceKind":"csat","sourceLabel":"2022년 시행 수능 · 2023학년도 · 공통 · 10번","steps":[{"id":"s1","l
