<script>window.HandStudyGuide={"itemId":17684,"sourceHash":"1065a7891e1cba059ead6fc1f44c783faa9d872d1f16bb7be95549fd3dc1dd5e","contentHash":"675b39e7d61aace6266e0a903b7b1685621ae83d2e33a2d2cfe9586b88f6fe27","overview":{"goal":"좌표로 \\(S\\)의 위치와 두 삼각형의 높이를 구해 넓이비의 극한을 계산해요.","firstLook":"\\(S\\)는 반지름 \\(OR\\) 위에 있으므로 \\(s=OS\\)로 두면 \\(RS=1-s\\)가 돼요.","conditions":[{"label":"좌표 배치","meaning":"반지름이 1인 원에서 \\(A=(-1,0),B=(1,0)\\)으로 놓아요."}]},"chapters":[{"id":"c1","label":"점들의 좌표와 첫 번째 넓이","stepIds":["s1","s2"],"question":"\\(Q\\)의 \\(y\\)좌표가 음수인 이유는 무엇인가요?","hint":"\\(Q\\)는 \\(P\\)를 포함하지 않는 반원 위에 있어요.","explanation":"\\(A=(-1,0),B=(1,0),O=(0,0)\\)으로 두면 원주각에서 \\(P=(\\cos 2\\theta,\\sin 2\\theta)\\)예요. \\(Q\\)는 \\(P\\)를 포함하지 않는 아래쪽 반원에 있고 \\(\\angle QAB=2\\theta\\)이므로 \\(Q=(\\cos 4\\theta,-\\sin 4\\theta)\\), 맞은편 점은 \\(R=(-\\cos 4\\theta,\\sin 4\\theta)\\)예요. 따라서 \\(f(\\theta)=[BOQ]=\\frac12\\sin 4\\theta\\)예요.","check":{"prompt":"\\(R\\)의 좌표가 \\(-Q\\)인 이유는 무엇인가요?","answer":"\\(QR\\)이 중심 \\(O\\)를 지나는 지름이므로 \\(R\\)은 \\(Q\\)의 맞은편 점이에요."}},{"id":"c2","label":"교점의 위치와 두 번째 넓이","stepIds":["s3","s4"],"question":"\\(s=OS\\)는 어떤 식으로 나타나나요?","hint":"\\(S\\)는 직선 \\(AP\\)와 지름 \\(QR\\)의 교점이므로 두 직선의 기울기를 사용하세요.","explanation":"\\(R=(-\\cos4\\theta,\\sin4\\theta)\\)이고 \\(S\\)는 반직선 \\(OR\\) 위에 있으므로 \\(s=OS\\)라 두면 \\(S=(-s\\cos4\\theta,s\\sin4\\theta)\\)예요. 한편 직선 \\(AP\\)의 방정식은 \\(y=\\tan\\theta(x+1)\\)이므로 \\(S\\)의 좌표를 대입하면 \\(s\\sin4\\theta=\\tan\\theta(1-s\\cos4\\theta)\\)예요. 이를 \\(s\\)에 관해 풀면 \\(s=\\frac{\\tan\\theta}{(\\tan\\theta+\\tan4\\theta)\\cos4\\theta}\\)이고, 기본 극한으로 \\(s\\to1/5\\)예요. 특히 충분히 작은 양의 \\(\\theta\\)에서는 \\(0<s<1\\)이므로 \\(S\\)는 \\(O\\)와 \\(R\\) 사이에 있고 \\(RS=1-s\\)예요. \\(P\\)에서 직선 \\(QR\\)까지의 거리는 두 반지름 \\(OP\\)와 \\(OQ\\) 사이 각의 사인으로 \\(\\sin6\\theta\\)이므로 \\(g(\\theta)=\\frac12(1-s)\\sin6\\theta\\)예요.","check":{"prompt":"\\(RS\\)가 \\(1-s\\)인 이유는 무엇인가요?","answer":"\\(OR=1\\)이고 \\(S\\)가 선분 \\(OR\\) 위에 있으며 \\(OS=s\\)이므로 \\(RS=OR-OS=1-s\\)예요."}},{"id":"c3","label":"넓이비의 극한 계산하기","stepIds":["s5"],"question":"\\(s\\)의 극한과 사인비를 어떻게 결합하나요?","hint":"\\(g/f\\)에서 \\(1/2\\)을 약분하고 \\(\\sin 6\\theta/\\sin 4\\theta\\)를 보세요.","explanation":"\\(g/f=(1-s)\\sin 6\\theta/\\sin 4\\theta\\)예요. \\(\\theta\\)가 0의 오른쪽으로 갈 때 \\(1-s\\to 4/5\\)이고 \\(\\sin 6\\theta/\\sin 4\\theta\\to 6/4\\)예요. 따라서 극한은 \\((4/5)(6/4)=6/5\\), 정답은 ②예요.","check":{"prompt":"절댓값 없이 \\(1-s\\)를 써도 되는 이유는 무엇인가요?","answer":"작은 양의 \\(\\theta\\)에서 \\(S\\)가 \\(O\\)와 \\(R\\) 사이에 있어 \\(0<s<1\\)이기 때문이에요."}}],"takeaway":["지름 위 교점은 중심에서의 거리로 두면 남은 밑변 길이가 바로 정리돼요.","두 삼각형 넓이비에서는 공통 상수와 작은 각의 사인비를 먼저 약분해요."]};</script>
