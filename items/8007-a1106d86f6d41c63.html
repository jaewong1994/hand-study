<script>window.HandStudyRecord={"itemId":8007,"sourceLabel":"2021 교육청 고2 수학 11월 20번","adminYear":2021,"grade":2,"month":11,"number":20,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 $1$보다 큰 두 실수 $a,\\,b$에 대하여 직선 $y=a$가 두 곡선 $y=2 ^{x}$, $y= \\left( \\frac{1}{4} \\right) ^{x}$과 만나는 점을 각각 $A$, $B$라 하고, 직선 $y= \\frac{1}{b}$이 두 곡선 $y=2 ^{x}$, $y= \\left( \\frac{1}{4} \\right) ^{x}$과 만나는 점을 각각 $C$, $D$라 하자. \u003c보기>에서 옳은 것만을 있는 대로 고른 것은? [4점]\n \n| 보기 |ㄱ. $a=b$이면 $\\overline{AB}=\\overline{CD}$이다.ㄴ. 직선 $AC$의 기울기를 $m _{1}$, 직선 $BD$의 기울기를 $m _{2}$라 하면 $2m _{1} +m _{2} =0$이다.ㄷ. 직선 $AC$와 직선 $BD$가 서로 수직이고 직선 $AD$의 기울기가 $2 \\sqrt{2}$이면 사각형 $ABCD$는 마름모이다.\n① ㄱ ② ㄷ ③ ㄱ, ㄴ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","answer":"⑤","sourceHash":"186538dee887c904cc33d80ea23a7d95aa032c0f15e55bf50068128fec81b190","steps":[{"id":"s1","latex":"u=\\log_2a,\\ v=\\log_2b,\\ H=a-b^{-1}>0"},{"id":"s2","latex":"A=(u,a),\\ B=(-u/2,a),\\ C=(-v,b^{-1}),\\ D=(v/2,b^{-1})"},{"id":"s3","latex":"a=b\\Rightarrow AB=CD=\\frac32\\log_2a\\quad\\text{(I 참)}"},{"id":"s4","latex":"m_{AC}=\\frac H{u+v},\\quad m_{BD}=-\\frac{2H}{u+v}=-2m_{AC}\\quad\\text{(II 참)}"},{"id":"s5","latex":"AC\\perp BD\\Rightarrow m_{AC}=\\frac1{\\sqrt2}\\Rightarrow H=\\frac{u+v}{\\sqrt2}"},{"id":"s6","latex":"m_{AD}=2\\sqrt2\\Rightarrow H=2\\sqrt2\\left(u-\\frac v2\\right)"},{"id":"s7","latex":"u+v=4u-2v\\Rightarrow u=v\\Rightarrow AB=CD"},{"id":"s8","latex":"AB\\parallel CD,\\ AB=CD\\Rightarrow ABCD\\text{는 평행사변형}"},{"id":"s9","latex":"AC\\perp BD\\Rightarrow ABCD\\text{는 마름모}\\quad\\text{(III 참)}"}],"diagram":null,"contentHash":"c93aa186fb528f3a35e422d18d3f9fb841899def2b40e1e61863d7de74860167","questionHtml":"\u003cp class=\"hp htall\">그림과 같이 \u003cspan class=\"heq\">\\(1\\)\u003c/span>보다 큰 두 실수 \u003cspan class=\"heq\">\\(a,\\,b\\)\u003c/span>에 대하여 직선 \u003cspan class=\"heq\">\\(y=a\\)\u003c/span>가 두 곡선 \u003cspan class=\"heq\">\\(y=2^{x}\\)\u003c/span>, \u003cspan class=\"heq\">\\(y= \\left( \\dfrac{1}{4} \\right)^{x}
