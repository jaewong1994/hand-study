<script>window.HandStudyRecord={"adminYear":2025,"answer":"977","contentHash":"25a1005a2cb44632e862f2805cf5f51c4c58b243bb8a1f050ee9ba91546f2166","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24990,"month":11,"number":29,"points":4,"preview":false,"questionHtml":"<p><span class=\"heq\">\\(6\\)<\/span> 이하의 자연수 <span class=\"heq\">\\(a\\,\\)<\/span>에 대하여 한 개의 주사위와 한 개의 동전을 사용하여 다음 시행을 한다.<\/p><div class=\"hbox\"><p>주사위를 한 번 던져 나온 눈의 수가 <span class=\"heq\">\\(a\\,\\)<\/span>보다 작거나 같으면 동전을 <span class=\"heq\">\\(5\\,\\)<\/span>번 던져 앞면이 나온 횟수를 기록하고, 나온 눈의 수가 <span class=\"heq\">\\(a\\,\\)<\/span>보다 크면 동전을 <span class=\"heq\">\\(3\\,\\)<\/span>번 던져 앞면이 나온 횟수를 기록한다.<\/p><\/div><p>이 시행을 <span class=\"heq\">\\(19200\\,\\)<\/span>번 반복하여 기록한 수가 <span class=\"heq\">\\(3\\,\\)<\/span>인 횟수를 확률변수 <span class=\"heq\">\\(X\\,\\)<\/span>라 하자. <span class=\"heq\">\\({{E}} \\left(X\\, \\right)=4800\\,\\)<\/span>일 때, <span class=\"heq\">\\({{P}} \\left(X\\, \\leq 4800+30a \\right)\\,\\)<\/span>의 값을 오른쪽 표준정규분포표를 이용하여 구한 값이 <span class=\"heq\">\\(k\\,\\)<\/span>이다. <span class=\"heq\">\\(1000 \\times k\\,\\)<\/span>의 값을 구하시오. [4점]<\/p><p>[표] z=0.5: 0.191, z=1.0: 0.341, z=1.5: 0.433, z=2.0: 0.477, z=2.5: 0.494, z=3.0: 0.499<\/p>","questionText":"$6$ 이하의 자연수 $a\\,$에 대하여 한 개의 주사위와 한 개의 동전을 사용하여 다음 시행을 한다.\n주사위를 한 번 던져 나온 눈의 수가 $a\\,$보다 작거나 같으면 동전을 $5\\,$번 던져 앞면이 나온 횟수를 기록하고, 나온 눈의 수가 $a\\,$보다 크면 동전을 $3\\,$번 던져 앞면이 나온 횟수를 기록한다.\n이 시행을 $19200\\,$번 반복하여 기록한 수가 $3\\,$인 횟수를 확률변수 $X\\,$라 하자. ${{E}} \\left(X\\, \\right)=4800\\,$일 때, ${{P}} \\left(X\\, \\leq 4800+30a \\right)\\,$의 값을 오른쪽 표준정규분포표를 이용하여 구한 값이 $k\\,$이다. $1000 \\times k\\,$의 값을 구하시오. [4점]\n[표] z=0.5: 0.191, z=1.0: 0.341, z=1.5: 0.433, z=2.0: 0.477, z=2.5: 0.494, z=3.0: 0.499","sourceHash":"b3e0909432d0f76caf39006da507231c61b8900d38ec0d673627821f332f1c54","sourceKind":"csat","sourceLabel":"2025년 시행 수능 · 2026학년도 · 확률과 통계 · 29번","steps":[{"id":"s1","latex":"\\text{한 시행에서 기록값이 }3\\text{일 확률을 }p\\text{라 한다.}"},{"id":"s2","latex":"p=\\frac a6\\cdot{}_5\\mathrm C_3\\left(\\frac12\\right)^5+\\frac{6-a}{6}\\cdot{}_3\\mathrm C_3\\left(\\frac12\\right)^3"},{"id":"s3","latex":"=\\frac{5a}{96}+\\frac{6-a}{48}=\\frac{a+4}{32}"},{"id":"s4","latex":"X\\sim B(19200,p),\\quad E(X)=19200p=600(a+4)=4800"},{"id":"s5","latex":"a=4,\\quad p=\\frac14"},{"id":"s6","latex":"V(X)=19200\\cdot\\frac14\\cdot\\frac34=3600=60^{2}"},{"explanation":{"body":"시행 횟수 19200이 충분히 크므로 문제의 표를 쓰기 위해 평균 \\(np=4800\\), 표준편차 \\(\\sqrt{np(1-p)}=60\\)인 정규분포로 근사합니다. 그 뒤 \\(Z=(X-4800)/60\\)으로 표준화합니다.","skillTags":["이항분포","정규근사","표준화"],"title":"이항분포를 정규분포로 바꾸기"},"id":"s7","latex":"X\\text{를 }N(4800,60^{2})\\text{으로 근사하면 }Z=\\frac{X-4800}{60}\\sim N(0,1)"},{"id":"s8","latex":"P(X\\le4800+30a)=P(X\\le4920)=P(Z\\le2)"},{"id":"s9","latex":"P(Z\\le2)=0.5+0.477=0.977"},{"id":"s10","latex":"1000k=977"},{"id":"s11","latex":"\\therefore\\ \\boxed{977}"}],"track":"확률과 통계","editionHash":"4fc4ad9d06e3c4c3e0eee026f86a55f4bbdb433a148ee6f344a5ca28e1e21f73"};</script>
<script>window.HandStudyGuide={"itemId":24990,"sourceHash":"b3e0909432d0f76caf39006da507231c61b8900d38ec0d673627821f332f1c54","contentHash":"25a1005a2cb44632e862f2805cf5f51c4c58b243bb8a1f050ee9ba91546f2166","overview":{"goal":"한 번의 시행에서 3을 기록할 확률로 \\(a\\)를 정하고, 이항분포를 정규분포로 가까이 보아 표의 값을 읽어요.","firstLook":"주사위 눈이 \\(a\\) 이하인지 초과인지에 따라 동전을 던지는 횟수가 달라져요. 두 가지 경로에서 각각 정확히 3번 앞면이 나올 확률을 구해 더해야 해요.","conditions":[{"label":"주사위 분기","meaning":"눈이 \\(a\\) 이하일 확률은 \\(a/6\\), 초과일 확률은 \\((6-a)/6\\)이에요."},{"label":"반복 시행","meaning":"19200번의 시행은 서로 독립이고 매번 3을 기록할 확률이 같아요."}]},"chapters":[{"id":"c1","label":"한 시행의 성공 확률을 구해요","stepIds":["s1","s2","s3"],"question":"한 번의 시행에서 3을 기록하는 두 경로의 확률은 어떻게 더할까요?","hint":"동전을 5번 던지는 경로와 3번 던지는 경로를 서로 겹치지 않는 경우로 나눠요.","explanation":"한 시행에서 3을 기록할 확률을 \\(p\\)라 할게요. 주사위 눈이 \\(a\\) 이하이면 동전을 5번 던지므로 앞면이 정확히 3번 나올 확률은 \\({}_5\\mathrm C_3(1/2)^3(1/2)^2={}_5\\mathrm C_3(1/2)^5=10/32\\)예요. 이 경로의 확률은 \\((a/6)(10/32)=5a/96\\)이에요.\n\n주사위 눈이 \\(a\\)보다 크면 동전을 3번 던져 3번 모두 앞면이어야 하므로 확률은 \\((1/2)^3=1/8\\)이에요. 이 경로의 확률은 \\(((6-a)/6)(1/8)=(6-a)/48\\)이에요. 두 주사위 경우는 겹치지 않으므로 \\(p=5a/96+(6-a)/48=(a+4)/32\\)예요.","check":{"prompt":"두 번째 경로에서 조합의 수가 1인 이유는 무엇인가요?","answer":"동전을 3번 던져 앞면이 3번 나오려면 세 번 모두 앞면인 한 가지 배열뿐이에요."}},{"id":"c2","label":"기댓값으로 자연수 a를 정해요","stepIds":["s4","s5","s6"],"question":"\\(E(X)=4800\\)은 \\(a\\)와 성공 확률을 어떻게 정할까요?","hint":"\\(X\\)는 19200번 중 성공한 횟수이므로 이항분포의 기댓값을 써요.","explanation":"각 시행은 독립이고 성공 확률이 \\(p\\)로 같으므로 \\(X\\)는 이항분포 \\(B(19200,p)\\)를 따라요. 따라서 \\(E(X)=19200p\\)예요. \\(p=(a+4)/32\\)를 넣으면 \\(19200(a+4)/32=600(a+4)=4800\\)이므로 \\(a+4=8\\), \\(a=4\\)예요. 실제로 6 이하의 자연수 조건도 만족해요.\n\n이때 \\(p=(4+4)/32=1/4\\)이고, 분산은 \\(V(X)=19200(1/4)(3/4)=3600=60^2\\)이에요. 따라서 평균은 4800, 표준편차는 60이에요.","check":{"prompt":"\\(a=4\\)를 구한 뒤 원래 범위를 다시 확인해야 하는 이유는 무엇인가요?","answer":"식에서 얻은 값이 문제의 조건인 6 이하의 자연수에 실제로 들어가야 시행이 성립하기 때문이에요."}},{"id":"c3","label":"표준정규분포표에서 값을 읽어요","stepIds":["s7","s8","s9","s10","s11"],"question":"상한 \\(4800+30a\\)는 평균에서 표준편차 몇 배만큼 떨어져 있을까요?","hint":"\\(a=4\\)를 넣고 평균 4800, 표준편차 60으로 나눠요.","explanation":"시행 횟수가 크므로 \\(X\\)를 평균 4800, 분산 \\(60^2\\)인 정규분포로 가까이 보아요. \\(a=4\\)이므로 상한은 \\(4800+30a=4920\\)이고, 평균과의 차는 \\(120\\)이에요. 이를 표준편차 60으로 나누면 \\(Z=(4920-4800)/60=2\\)예요.\n\n따라서 \\(P(X\\le4920)\\)은 표준정규분포에서 \\(P(Z\\le2)\\)로 구해요. 표는 평균 0에서 \\(z=2\\)까지의 넓이 0.477을 주므로 왼쪽 절반 0.5를 더해 \\(k=0.5+0.477=0.977\\)이에요. 그러므로 \\(1000k=977\\)이에요.","check":{"prompt":"표의 0.477에 0.5를 더하는 이유는 무엇인가요?","answer":"0.477은 0부터 2까지의 넓이이고, \\(Z\\le2\\)는 음의 무한대부터 0까지의 넓이 0.5도 포함하기 때문이에요."}}],"takeaway":["시행이 두 갈래로 나뉘면 각 경로의 확률을 ‘분기 확률 × 그 안의 성공 확률’로 구해 더해요.","이항분포의 기댓값으로 성공 확률을 정한 뒤 분산을 계산하면 정규분포의 중심과 퍼짐을 알 수 있어요.","표준정규분포표가 어느 구간의 넓이를 주는지 확인한 뒤 필요한 0.5를 더하거나 빼요."]};</script>
