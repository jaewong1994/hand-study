  <script>window.HandStudyRecord={"adminYear":2025,"answer":"977","contentHash":"b1b347d93b27a1d3e8a99fbe81a14b93dc58c7744d1177f90963bd07257a4e38","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24990,"month":11,"number":29,"points":4,"preview":false,"questionHtml":"\u003cp>\u003cspan class=\"heq\">\\(6\\)\u003c/span> 이하의 자연수 \u003cspan class=\"heq\">\\(a\\,\\)\u003c/span>에 대하여 한 개의 주사위와 한 개의 동전을 사용하여 다음 시행을 한다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp>주사위를 한 번 던져 나온 눈의 수가 \u003cspan class=\"heq\">\\(a\\,\\)\u003c/span>보다 작거나 같으면 동전을 \u003cspan class=\"heq\">\\(5\\,\\)\u003c/span>번 던져 앞면이 나온 횟수를 기록하고, 나온 눈의 수가 \u003cspan class=\"heq\">\\(a\\,\\)\u003c/span>보다 크면 동전을 \u003cspan class=\"heq\">\\(3\\,\\)\u003c/span>번 던져 앞면이 나온 횟수를 기록한다.\u003c/p>\u003c/div>\u003cp>이 시행을 \u003cspan class=\"heq\">\\(19200\\,\\)\u003c/span>번 반복하여 기록한 수가 \u003cspan class=\"heq\">\\(3\\,\\)\u003c/span>인 횟수를 확률변수 \u003cspan class=\"heq\">\\(X\\,\\)\u003c/span>라 하자. \u003cspan class=\"heq\">\\({{E}} \\left(X\\, \\right)=4800\\,\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\({{P}} \\left(X\\, \\leq 4800+30a \\right)\\,\\)\u003c/span>의 값을 오른쪽 표준정규분포표를 이용하여 구한 값이 \u003cspan class=\"heq\">\\(k\\,\\)\u003c/span>이다. \u003cspan class=\"heq\">\\(1000 \\times k\\,\\)\u003c/span>의 값을 구하시오. [4점]\u003c/p>\u003cp>[표] z=0.5: 0.191, z=1.0: 0.341, z=1.5: 0.433, z=2.0: 0.477, z=2.5: 0.494, z=3.0: 0.499\u003c/p>","questionText":"$6$ 이하의 자연수 $a\\,$에 대하여 한 개의 주사위와 한 개의 동전을 사용하여 다음 시행을 한다.\n주사위를 한 번 던져 나온 눈의 수가 $a\\,$보다 작거나 같으면 동전을 $5\\,$번 던져 앞면이 나온 횟수를 기록하고, 나온 눈의 수가 $a\\,$보다 크면 동전을 $3\\,$번 던져 앞면이 나온 횟수를 기록한다.\n이 시행을 $19200\\,$번 반복하여 기록한 수가 $3\\,$인 횟수를 확률변수 $X\\,$라 하자. ${{E}} \\left(X\\, \\right)=4800\\,$일 때, ${{P}} \\left(X\\, \\leq 4800+30a \\right)\\,$의 값을 오른쪽 표준정규분포표를 이용하여 구한 값이 $k\\,$이다. $1000 \\times k\\,$의 값을 구하시오. [4점]\n[표] z=0.5: 0.191, z=1.0: 0.341, z=1.5: 0.433, z=2.0: 0.477, z=2.5: 0.494, z=3.0: 0.499","sourceHash":"b3e0909432d0f76caf39006da507231c61b8900d38ec0d673627821f332f1c54","sourceKind":"csat","sourceLabel":"2025년 시행 수능 · 2026학년도 · 확률과 통계 · 29번","steps":[{"id":"s1","latex":"\\text{한 시행에서 기록값이 }3\\text{일 확률을 }p\\text{라 한다.}"},{"id":"s2","latex":"p=\\frac a6\\cdot{}_5C_3\\left(\\frac12\\right)^5+\\frac{6-a}{6}\\cdot{}_3C_3\\left(\\frac12\\right)^3"},{"id":"s3","latex":"=\\frac{5a}{96}+\\frac{6-a}{48}=\\frac{a+4}{32}"},{"id":"s4","latex":"X\\sim B(19200,p),\\quad E(X)=19200p=600(a+4)=4800"},{"id":"s5","latex":"a=4,\\quad p=\\frac14"},{"id":"s6","latex":"V(X)=19200\\cdot\\frac14\\cdot\\frac34=3600=60^{2}"},{"explanation":{"body":"시행 횟수 19200이 충분히 크므로 문제의 표를 쓰기 위해 평균 \\(np=4800\\), 표준편차 \\(\\sqrt{np(1-p)}=60\\)인 정규분포로 근사합니다. 그 뒤 \\(Z=(X-4800)/60\\)으로 표준화합니다.","skillTags":["이항분포","정규근사","표준화"],"title":"이항분포를 정규분포로 바꾸기"},"id":"s7","latex":"X\\text{를 }N(4800,60^{2})\\text{으로 근사하면 }Z=\\frac{X-4800}{60}\\sim N(0,1)"},{"id":"s8","latex":"P(X\\le4800+30a)=P(X\\le4920)=P(Z\\le2)"},{"id":"s9","latex":"P(Z\\le2)=0.5+0.477=0.977"},{"id":"s10","latex":"1000k=977"},{"id":"s11","latex":"\\therefore\\ \\boxed{977}"}],"track":"확률과 통계"};</script>
