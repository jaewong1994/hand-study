을 구하시오.\u003cbr>(단, \u003cspan class=\"heq\">\\(p\\,\\)\u003c/span>와 \u003cspan class=\"heq\">\\(q\\,\\)\u003c/span>는 서로소인 자연수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","questionText":"최고차항의 계수가 $1\\,$인 삼차함수 $f \\left(x \\right)\\,$에 대하여 함수\n $g \\left(x \\right)= \\left|\\, f \\left(\\frac{2}{1+e^{-x}} \\right)\\,\\right|$\n가 실수 전체의 집합에서 미분가능하고 다음 조건을 만족시킨다.\n(가) 함수 $g \\left(x \\right)\\,$는 $x=0\\,$에서 극소이고, $g \\left(0 \\right) > 0\\,$이다.(나) $g' \\left( \\ln\\, 3 \\right) \u003c 0$, $\\left|\\, g' \\left(- \\ln\\, 3 \\right)\\,\\right| =\\frac{3}{8}g \\left(- \\ln\\, 3 \\right)$\n$g \\left(0 \\right)\\,$의 최솟값을 $\\frac{q}{p}\\,$라 할 때, $p+q\\,$의 값을 구하시오. (단, $p\\,$와 $q\\,$는 서로소인 자연수이다.) [4점]","scoreStatus":"confirmed_4_direct","sourceHash":"bff84d585153361f15585367d864775eaaf5530d7e26af70a2eec0f20ad01c6c","sourceLabel":"2025 평가원 고3 수학미적분 6월 30번","stepExplanations":{"s2":{"body":"\\(u=2/(1+e^{-x})\\)는 증가하고 \\(x=0\\)에서 \\(u=1\\)입니다. \\(g(0)>0\\)인 극소이므로 \\(|f(u)|\\)가 \\(u=1\\)에서 극소입니다. \\(f(1)>0\\)이면 이후 도함수가 양수여서 \\(g'(\\ln3)>0\\)가 되므로 모순이고, 따라서 \\(f(1)\u003c0,f'(1)=0\\)입니다.","skillTags":["composition-monotonicity","sign-choice"],"title":"f(1)의 부호와 정지점"},"s4":{"body":"\\(u\u003c1\\)에서는 \\(f'(u)=3(u-1)(u-\\alpha)>0\\)이므로 \\(f(1/2)\u003cf(1)\u003c0\\)입니다. 따라서 \\(x=-\\ln3\\)에서는 \\(g=-f(u)\\), \\(u=1/2,u'=3/8\\)이어서 \\(|g'|=(3/8)|f'(1/2)|\\), \\(g=|f(1/2)|\\)입니다. 양변의 \\(3/8\\)을 지우면 \\(|f'(1/2)|=|f(1/2)|\\)입니다.","skillTags":["absolute-derivative","chain-rule"],"title":"x=-ln3 조건에서 3/8을 지우기"},"s7":{"body":"\\(f(1)\u003c0\\)이고 \\(1\u003cu\u003c\\alpha\\)에서 \\(f\\)는 더 작아집니다. 이후 증가하더라도 \\(0\u003cu\u003c2\\) 안에서 \\(f\\)가 0을 가로지르면 \\(|f|\\)에 뾰족점이 생깁니다. 이를 피하려면 \\(f(2)\\le0\\)이어야 하고, 식에 넣으면 \\(\\alpha\\ge8/7\\)입니다. \\(\\alpha=8/7\\)일 때 0이 되는 곳은 \\(u=2\\)인데, 유한한 실수 \\(x\\)에서는 \\(0\u003cu\u003c2\\)이므로 실제 정의역 안의 뾰족점은 생기지 않아 등호도 허용됩니다.","skillTags":["absolute-value-differentiability","endpoint-bound"],"title":"미분가능성이 f(2)의 부호를 제한한다"}},"steps":[{"id":"s1","latex":"u=\\frac{2}{1+e^{-x}},\\quad u(0)=1,\\quad u(\\pm\\ln3)=\\frac32,\\frac12,\\quad u\\prime(\\pm\\ln3)=\\frac38"},{"id":"s1b","latex":"f(1)>0\\text{인 극소}\\Rightarrow f\\prime(u)>0\\ (u>1)\\Rightarrow g\\prime(\\ln3)>0\\quad\\text{(모순)}"},{"id":"s2","latex":"g(0)>0,\\ x=0\\text{에서 극소}\\Rightarrow f(1)\u003c0,\\quad f\\prime(1)=0"},{"id":"s3","latex":"f\\prime(u)=3(u-1)(u-\\alpha),\\quad\\alpha>1"},{"id":"s4","latex":"|g\\prime(-\\ln3)|=\\frac38g(-\\ln3)\\Rightarrow|f\\prime(1/2)|=|f(1/2)|"},{"id":"s5","latex":"g\\prime(\\ln3)\u003c0\\Rightarrow1\u003c\\alpha\u003c\\frac32,\\quad f(1/2)=-f\\prime(1/2)"},{"id":"s6","latex":"f(u)=u^3-\\frac{3(1+\\alpha)}2u^2+3\\alpha u+\\frac{8-21\\alpha}{8}"},{"id":"s7","latex":"|f(u)|\\text{의 미분가능성}\\Rightarrow f(2)\\le0\\Rightarrow\\alpha\\ge\\frac87"},{"id":"s8","latex":"g(0)=-f(1)=\\frac{9\\alpha-4}{8}\\ge\\frac{11}{14}"},{"id":"s9","latex":"g(0)\\text{의 최솟값}=\\frac{11}{14}\\Rightarrow p+q=14+11=25"}],"track":"미적분"};</script>
