eft(x \\right)= \\left|\\, f \\left(\\frac{2}{1+e^{-x}} \\right)\\,\\right|$\n가 실수 전체의 집합에서 미분가능하고 다음 조건을 만족시킨다.\n(가) 함수 $g \\left(x \\right)\\,$는 $x=0\\,$에서 극소이고, $g \\left(0 \\right) > 0\\,$이다.(나) $g' \\left( \\ln\\, 3 \\right) < 0$, $\\left|\\, g' \\left(- \\ln\\, 3 \\right)\\,\\right| =\\frac{3}{8}g \\left(- \\ln\\, 3 \\right)$\n$g \\left(0 \\right)\\,$의 최솟값을 $\\frac{q}{p}\\,$라 할 때, $p+q\\,$의 값을 구하시오. (단, $p\\,$와 $q\\,$는 서로소인 자연수이다.) [4점]","scoreStatus":"confirmed_4_direct","sourceHash":"bff84d585153361f15585367d864775eaaf5530d7e26af70a2eec0f20ad01c6c","sourceLabel":"2025 평가원 고3 수학미적분 6월 30번","stepExplanations":{"s2":{"body":"\\(u=2/(1+e^{-x})\\)는 증가하고 \\(x=0\\)에서 \\(u=1\\)입니다. \\(g(0)>0\\)인 극소이므로 \\(|f(u)|\\)가 \\(u=1\\)에서 극소입니다. \\(f(1)>0\\)이면 이후 도함수가 양수여서 \\(g'(\\ln3)>0\\)가 되므로 모순이고, 따라서 \\(f(1)<0,f'(1)=0\\)입니다.","skillTags":["composition-monotonicity","sign-choice"],"title":"f(1)의 부호와 정지점"},"s4":{"body":"\\(u<1\\)에서는 \\(f'(u)=3(u-1)(u-\\alpha)>0\\)이므로 \\(f(1/2)<f(1)<0\\)입니다. 따라서 \\(x=-\\ln3\\)에서는 \\(g=-f(u)\\), \\(u=1/2,u'=3/8\\)이어서 \\(|g'|=(3/8)|f'(1/2)|\\), \\(g=|f(1/2)|\\)입니다. 양변의 \\(3/8\\)을 지우면 \\(|f'(1/2)|=|f(1/2)|\\)입니다.","skillTags":["absolute-derivative","chain-rule"],"title":"x=-ln3 조건에서 3/8을 지우기"},"s7":{"body":"\\(f(1)<0\\)이고 \\(1<u<\\alpha\\)에서 \\(f\\)는 더 작아집니다. 이후 증가하더라도 \\(0<u<2\\) 안에서 \\(f\\)가 0을 가로지르면 \\(|f|\\)에 뾰족점이 생깁니다. 이를 피하려면 \\(f(2)\\le0\\)이어야 하고, 식에 넣으면 \\(\\alpha\\ge8/7\\)입니다. \\(\\alpha=8/7\\)일 때 0이 되는 곳은 \\(u=2\\)인데, 유한한 실수 \\(x\\)에서는 \\(0<u<2\\)이므로 실제 정의역 안의 뾰족점은 생기지 않아 등호도 허용됩니다.","skillTags":["absolute-value-differentiability","endpoint-bound"],"title":"미분가능성이 f(2)의 부호를 제한한다"}},"steps":[{"id":"s1","latex":"u=\\frac{2}{1+e^{-x}},\\quad u(0)=1,\\quad u(\\pm\\ln3)=\\frac32,\\frac12,\\quad u\\prime(\\pm\\ln3)=\\frac38"},{"id":"s1b","latex":"f(1)>0\\text{인 극소}\\Rightarrow f\\prime(u)>0\\ (u>1)\\Rightarrow g\\prime(\\ln3)>0\\quad\\text{(모순)}"},{"id":"s2","latex":"g(0)>0,\\ x=0\\text{에서 극소}\\Rightarrow f(1)<0,\\quad f\\prime(1)=0"},{"id":"s3","latex":"f\\prime(u)=3(u-1)(u-\\alpha),\\quad\\alpha>1"},{"id":"s4","latex":"|g\\prime(-\\ln3)|=\\frac38g(-\\ln3)\\Rightarrow|f\\prime(1/2)|=|f(1/2)|"},{"id":"s5","latex":"g\\prime(\\ln3)<0\\Rightarrow1<\\alpha<\\frac32,\\quad f(1/2)=-f\\prime(1/2)"},{"id":"s6","latex":"f(u)=u^3-\\frac{3(1+\\alpha)}2u^2+3\\alpha u+\\frac{8-21\\alpha}{8}"},{"id":"s7","latex":"|f(u)|\\text{의 미분가능성}\\Rightarrow f(2)\\le0\\Rightarrow\\alpha\\ge\\frac87"},{"id":"s8","latex":"g(0)=-f(1)=\\frac{9\\alpha-4}{8}\\ge\\frac{11}{14}"},{"id":"s9","latex":"g(0)\\text{의 최솟값}=\\frac{11}{14}\\Rightarrow p+q=14+11=25"}],"track":"미적분","editionHash":"c86740b998f670798bb18056af2e458699aaa5822c77444d30ff2515985511b2"};</script>
<script>window.HandStudyGuide={"itemId":18367,"sourceHash":"bff84d585153361f15585367d864775eaaf5530d7e26af70a2eec0f20ad01c6c","contentHash":"35112a1f0f2a69e67a948af91042e57f6bab3b749b6aeb3a5a1fbab043e5a96e","overview":{"goal":"합성식의 안쪽 값을 \\(u\\)로 두고 \\(|f(u)|\\)의 극소·미분가능성으로 \\(g(0)\\)의 최솟값을 구해요.","firstLook":"\\(u=2/(1+e^{-x})\\)는 \\(x\\)가 커질수록 증가하고, 모든 실수 \\(x\\)를 \\(0<u<2\\)로 옮겨요.","conditions":[{"label":"\\(x=0\\)에서 양의 극소","meaning":"\\(|f(u)|\\)가 \\(u=1\\)에서 0이 아닌 극소이므로 \\(f'(1)=0\\)이고 \\(f(1)\\)의 부호를 정해야 해요."},{"label":"실수 전체에서 미분가능","meaning":"\\(0<u<2\\) 안에 도함숫값이 0이 아닌 영점이 생기면 절댓값 그래프가 꺾이므로 허용되지 않아요."}]},"chapters":[{"id":"c1","label":"안쪽 값과 변화율 계산","stepIds":["s1"],"question":"\\(x=0,-\\ln 3,\\ln 3\\)은 각각 어떤 \\(u\\) 값으로 옮겨지나요?","hint":"\\(e^{-x}\\)에 \\(1,3,1/3\\)을 차례로 넣으세요.","explanation":"\\(u=2/(1+e^{-x})\\)로 두면 \\(u'(x)=2e^{-x}/(1+e^{-x})^2=u(2-u)/2>0\\)이므로 \\(u\\)는 증가해요. \\(u(0)=1\\), \\(u(-\\ln 3)=1/2\\), \\(u(\\ln 3)=3/2\\)이고, \\(u'(0)=1/2\\), \\(u'(\\pm\\ln 3)=3/8\\)예요.","check":{"prompt":"\\(u'(x)>0\\)이라는 사실은 뒤의 부호 판단에 어떻게 쓰이나요?","answer":"\\(g'(x)\\)의 부호를 판단할 때 \\(u'(x)\\)는 항상 양수이므로 \\(|f(u)|\\) 쪽의 부호만 보면 돼요."}},{"id":"c2","label":"함숫값의 부호와 두 임계점","stepIds":["s1b","s2","s3"],"question":"\\(f(1)>0\\)이라고 가정하면 왜 \\(g'(\\ln 3)<0\\)과 모순인가요?","hint":"양의 \\(f(1)\\)에서 \\(|f|=f\\)이고, \\(u=1\\)이 극소일 때 오른쪽 도함수 부호를 보세요.","explanation":"\\(g(0)=|f(1)|>0\\)이고 \\(u'(0)>0\\)이므로 \\(u=1\\)에서 \\(|f(u)|\\)가 극소이며 \\(f'(1)=0\\)예요. 만약 \\(f(1)>0\\)이면 1 근처에서 \\(|f|=f\\)라 \\(u=1\\)은 \\(f\\)의 극소예요. 최고차항의 계수가 1인 삼차함수에서 이때 다른 임계점은 1보다 작고, \\(u>1\\)에서는 \\(f'(u)>0\\), \\(f(u)>0\\)예요. 그러면 \\(g'(\\ln 3)=f'(3/2)u'(\\ln 3)>0\\)가 되어 조건 \\(g'(\\ln 3)<0\\)과 모순이에요. 따라서 \\(f(1)<0\\)이고, \\(u=1\\)은 \\(f\\)의 극대예요. 다른 임계점을 \\(\\alpha>1\\)이라 두면 \\(f'(u)=3(u-1)(u-\\alpha)\\)로 쓸 수 있어요.","check":{"prompt":"\\(f(1)<0\\)일 때 \\(u=1\\)은 \\(f\\)의 극대인가요, 극소인가요?","answer":"근처에서 \\(|f|=-f\\)이고 \\(|f|\\)가 극소이므로 \\(f\\)는 극대예요."}},{"id":"c3","label":"두 도함수 조건으로 삼차함수 확정","stepIds":["s4","s5","s6"],"question":"\\(u=1/2\\)에서 왜 \\(f(1/2)=-f'(1/2)\\)가 되나요?","hint":"\\(f\\)와 \\(f'\\)의 부호를 각각 확인한 뒤 절댓값을 벗기세요.","explanation":"\\(u=1/2\\)에서는 \\(f'(1/2)=3(-1/2)(1/2-\\alpha)>0\\)이고, \\(f\\)가 \\(u=1\\)까지 증가하면서 \\(f(1)<0\\)이므로 \\(f(1/2)<0\\)예요. 조건 \\(|g'(-\\ln 3)|=(3/8)g(-\\ln 3)\\)에 \\(u'=3/8\\)을 넣으면 \\(|f'(1/2)|=|f(1/2)|\\), 따라서 \\(f(1/2)=-f'(1/2)\\)예요. 한편 \\(f(3/2)\\ge 0\\)이면 음수인 \\(f(1)\\)에서 \\(u=3/2\\)까지 가는 사이에 영점이 생겨요. 두 임계점 가운데 \\(u=1\\)에서는 \\(f(1)<0\\)이고, \\(u=\\alpha\\)에서는 극솟값 \\(f(\\alpha)<f(1)<0\\)이므로 이 영점은 어느 임계점도 아니에요. 따라서 그 영점에서는 \\(f'\\ne 0\\)이고 \\(|f(u)|\\)가 꺾여 미분가능 조건에 어긋나므로 \\(f(3/2)<0\\)예요. 이제 \\(g'(\\ln 3)=-f'(3/2)u'(\\ln 3)<0\\)에서 \\(f'(3/2)>0\\), 곧 \\(1<\\alpha<3/2\\)를 얻어요. \\(f'\\)을 적분하면 \\(f(u)=u^3-\\frac{3(1+\\alpha)}2u^2+3\\alpha u+C\\)예요. 여기에 \\(f(1/2)+f'(1/2)=0\\)을 대입하면 \\(C+(21\\alpha-8)/8=0\\), 즉 \\(C=(8-21\\alpha)/8\\)이므로 \\(f(u)=u^3-\\frac{3(1+\\alpha)}2u^2+3\\alpha u+\\frac{8-21\\alpha}{8}\\)을 얻어요.","check":{"prompt":"\\(g'(\\ln 3)<0\\)에서 \\(\\alpha<3/2\\)가 나오는 이유는 무엇인가요?","answer":"미분가능성 때문에 \\(f(3/2)<0\\)이고, 이때 \\(g'=-f'u'\\)예요. \\(u'>0\\), \\(g'<0\\)이므로 \\(f'(3/2)>0\\), 따라서 \\(3/2-\\alpha>0\\)이어야 해요."}},{"id":"c4","label":"절댓값의 꺾임을 막아 최솟값 결정","stepIds":["s7","s8","s9"],"question":"\\(f(2)>0\\)이면 왜 \\(|f(u)|\\)가 \\(0<u<2\\)에서 미분 불가능해지나요?","hint":"\\(f(1)<0\\)에서 출발해 \\(u=2\\)까지 가는 동안 생기는 마지막 영점을 보세요.","explanation":"\\(f(1)<0\\)인데 \\(f(2)>0\\)이면 \\(1<u<2\\)에 \\(f(u)=0\\)인 점이 생겨요. \\(u=\\alpha\\)는 극솟점이고 \\(f(\\alpha)<f(1)<0\\)이므로, 그 뒤 2로 가며 만나는 영점에서는 \\(f' (u)>0\\)예요. 이런 영점에서 \\(|f(u)|\\)의 좌우 기울기는 서로 달라져 미분가능 조건에 어긋나요. 따라서 \\(f(2)\\le 0\\)이어야 해요. 실제로 \\(f(2)=3(8-7\\alpha)/8\\)이므로 \\(\\alpha\\ge 8/7\\)이고, 앞의 범위와 합치면 \\(8/7\\le\\alpha<3/2\\)예요. 경계 \\(\\alpha=8/7\\)에서는 \\(f(2)=0\\)이지만 \\(u=2\\)는 유한한 \\(x\\)에서 닿지 않고 \\(x\\to\\infty\\)일 때만 가까워지는 치역의 끝점이에요. 따라서 \\(0<u<2\\)에서는 새 영점이 없어 이 경계도 허용돼요. \\(g(0)=-f(1)=(9\\alpha-4)/8\\)은 \\(\\alpha\\)가 커질수록 증가하므로 \\(\\alpha=8/7\\)에서 최솟값 \\(11/14\\)를 가져요. 따라서 \\(p+q=14+11=25\\)예요.","check":{"prompt":"최솟값이 허용 범위의 왼쪽 끝 \\(\\alpha=8/7\\)에서 나오는 이유는 무엇인가요?","answer":"\\(g(0)=(9\\alpha-4)/8\\)의 \\(\\alpha\\) 계수가 양수라 허용 범위에서 계속 증가하기 때문이에요."}}],"takeaway":["합성식의 안쪽 함수가 증가하면 바깥 함수의 극값·도함수 부호를 같은 입력 순서로 옮겨 볼 수 있어요.","절댓값 안의 함수가 0을 지날 때에는 그 점의 도함숫값도 0인지 확인해야 미분가능성을 판단할 수 있어요."]};</script>
