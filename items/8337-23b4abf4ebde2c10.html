  <script>window.HandStudyRecord={"itemId":8337,"sourceLabel":"2024 교육청 고2 수학 10월 20번","adminYear":2024,"grade":2,"month":10,"number":20,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"실수 $a\\,$에 대하여 함수 $f \\left(x \\right)\\,$를\n $f \\left( x \\right) = {\\begin{cases}\\,\\left( x-1 \\right) \\left( x-a \\right)&&\\left( x\u003c1 \\right) \\\\ \\,0&&\\left( 1 \\leq x\u003c2 \\right) \\\\ \\,1&&\\left( x \\geq 2 \\right)\\end{cases}}$\n라 하자. 양의 실수 $t\\,$에 대하여 함수 $f \\left(x \\right)\\,$에서 $x\\,$의 값이 $0\\,$에서 $t\\,$까지 변할 때의 평균변화율을 $g \\left(t \\right)\\,$라 할 때, \u003c보기>에서 옳은 것만을 있는 대로 고른 것은? [4점]\n\u003c보 기>ㄱ. $a=1\\,$일 때, $g \\left(1 \\right)=\\,-1\\,$이다.ㄴ. 함수 $g \\left(t \\right)\\,$의 최댓값이 $1\\,$일 때, $g \\left(2 \\right)=\\frac{1}{2}\\,$이다.ㄷ. $g \\left(k \\right)=g \\left(k+1 \\right)=g \\left(k+2 \\right)\\,$를 만족시키는 $0\u003ck\u003c2\\,$인 실수 $k\\,$가 존재할 때, 함수 $y=f \\left(x \\right)\\,$의 그래프와 직선 $y=\\,-\\frac{3}{2}\\,$은 서로 다른 두 점에서 만난다.\n① ㄱ ② ㄴ ③ ㄱ, ㄴ\n④ ㄱ, ㄷ ⑤ ㄴ, ㄷ","answer":"④","sourceHash":"da70da5c287e82fe255454ec9f6cca814d8ac2c082cabfd234a110caa8ce1057","steps":[{"id":"s1","latex":"g(t)=\\frac{f(t)-a}{t}=\\begin{cases}t-1-a&0\u003ct\u003c1\\\\-a/t&1\\le t\u003c2\\\\(1-a)/t&t\\ge2\\end{cases}"},{"id":"s2","latex":"a=1\\Rightarrow g(1)=-1"},{"id":"s3","latex":"\\max g=1\\Rightarrow a=-1\\Rightarrow g(2)=1\\ne\\frac12"},{"id":"s4","latex":"1\\le k\u003c2\\Rightarrow g(k+1)=g(k+2)\\Rightarrow a=1\\Rightarrow g(k)\\ne0"},{"id":"s5","latex":"0\u003ck\u003c1:\\quad k-1-a=-\\frac a{k+1}=\\frac{1-a}{k+2}"},{"id":"s6","latex":"(k,a)=\\left(\\frac12,-\\frac32\\right)"},{"id":"s7","latex":"(x-1)\\left(x+\\frac32\\right)=-\\frac32\\Rightarrow x=0,-\\frac12"}],"diagram":null,"contentHash":"840bbb2070fce84132947124cb700b2723fb25b25ad17b9d37c444e74ba27d79","questionHtml":"\u003cp class=\"hp\">실수 \u003cspan class=\"heq\">\\(a\\,\\)\u003c/span>에 대하여 함수 \u003cspan class=\"heq\">\\(f \\left(x \\right)\\,\\)\u003c/span>를\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\(f \\left( x \\right) = {\\begin{cases}\\,\\left( x-1 \\right) \\left( x-a \\right)&&\\left( x\\lt 1 \\right) \\\\ \\,0&&\\left( 1 \\leq x\\lt 2 \\right) \\\\ \\,1&&\\left( x \\geq 2 \\right)\\end{cases}}\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">라 하자. 양의 실수 \u003cspan class=\"heq\">\\(t\\,\\)\u003c/span>에 대하여 함수 \u003cspan class=\"heq\">\\(f \\left(x \\right)\\,\\)\u003c/span>에서 \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>의 값이 \u003cspan class=\"heq\">\\(0\\,\\)\u003c/span>에서 \u003cspan class=\"heq\">\\(t\\,\\)\u003c/span>까지 변할 때의 평균변화율을 \u003cspan class=\"heq\">\\(g \\left(t \\right)\\,\\)\u003c/span>라 할 때, &lt;보기&gt;에서 옳은 것만을 있는 대로 고른 것은? \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cdiv class=\"hbox\">\u003cdiv style=\"text-align:center;font-weight:700;margin:0 0 6px\">&lt; 보 기 &gt;\u003c/div>\u003cp class=\"hp\">ㄱ. \u003cspan class=\"heq\">\\(a=1\\,\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(g \\left(1 \\right)=\\,-1\\,\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp htall\">ㄴ. 함수 \u003cspan class=\"heq\">\\(g \\left(t \\right)\\,\\)\u003c/span>의 최댓값이 \u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(g \\left(2 \\right)=\\dfrac{1}{2}\\,\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp htall\">ㄷ. \u003cspan class=\"heq\">\\(g \\left(k \\right)=g \\left(k+1 \\right)=g \\left(k+2 \\right)\\,\\)\u003c/span>를 만족시키는 \u003cspan class=\"heq\">\\(0\\lt k\\lt 2\\,\\)\u003c/span>인 실수 \u003cspan class=\"heq\">\\(k\\,\\)\u003c/span>가 존재할 때, 함수 \u003cspan class=\"heq\">\\(y=f \\left(x \\right)\\,\\)\u003c/span>의 그래프와 직선 \u003cspan class=\"heq\">\\(y=\\,-\\dfrac{3}{2}\\,\\)\u003c/span>은 서로 다른 두 점에서 만난다.\u003c/p>\u003c/div>\u003cp class=\"hp\">① ㄱ&emsp;② ㄴ&emsp;③ ㄱ, ㄴ\u003c/p>\u003cp class=\"hp\">④ ㄱ, ㄷ&emsp;⑤ ㄴ, ㄷ\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"23b4abf4ebde2c10e73ed8cdb328865032bf21e450a9cfd5512e61c959590ebf"};</script>
