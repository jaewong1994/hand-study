  <script>window.HandStudyRecord={"itemId":17272,"sourceLabel":"2022 교육청 고3 수학기하 10월 30번","adminYear":2022,"grade":3,"month":10,"number":30,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 한 변의 길이가 $4$인 정삼각형을 밑면으로 하고 높이가 $4+2 \\sqrt{ 3}$ 인 정삼각기둥 $A B C-DEF$와 ${\\overline{D G}} =4$인 선분 $A D$ 위의 점 $G$가 있다. 점 $H$가 다음 조건을 만족시킨다.\n(가) 삼각형 $C G H$의 평면 $A D E B$ 위로의 정사영은 정삼각형이다.(나) 삼각형 $C G H$의 평면 $D E F$ 위로의 정사영의 내부와 삼각형 $D E F$의 내부의 공통부분의 넓이는 $2\\sqrt{ 3}$이다.\n삼각형 $C G H$의 평면 $A D F C$ 위로의 정사영의 넓이를 $S\\,$라 할 때, $S^{2}$의 값을 구하시오. [4점]","answer":"48","sourceHash":"c25a6c35dde9048e7dfd67462ac4e3fd97279b552391921b747b4204750b8a85","steps":[{"id":"s1","latex":"D=(0,0,0),\\ E=(4,0,0),\\ F=(2,2\\sqrt3,0),\\quad h=4+2\\sqrt3"},{"id":"s2","latex":"C=(2,2\\sqrt3,h),\\quad G=(0,0,4)"},{"id":"s3","latex":"\\text{평면 }y=0\\text{ 위 정사영}:\\quad C_1=(2,0,h),\\quad GC_1=4"},{"id":"s4","latex":"\\triangle GC_1H_1\\text{ 정삼각형}\\Rightarrow H_1=(4,0,4)\\text{ 또는 }(-2,0,h)"},{"latex":"H=(-2,y,h):\\quad\\text{밑면과 겹친 넓이는 }2\\sqrt3\\text{ 미만이므로 제외}","id":"s5"},{"latex":"H=(4,y,4),\\quad J=DH\\cap EF:\\quad[DFJ]=\\tfrac12[DFE]\\Rightarrow J=(3,\\sqrt3)","id":"s6"},{"latex":"y/4=\\sqrt3/3\\Rightarrow H=(4,4\\sqrt3/3,4)","id":"s7"},{"id":"s8","latex":"\\text{평면 }ADFC\\text{의 단위법선 }n=\\left(\\frac{\\sqrt3}{2},-\\frac12,0\\right)"},{"id":"s9","latex":"H_3=H-(H\\cdot n)n=(2,2\\sqrt3,4)"},{"id":"s10","latex":"GH_3=4,\\quad H_3C=2\\sqrt3"},{"id":"s11","latex":"S=\\frac12\\cdot4\\cdot2\\sqrt3=4\\sqrt3"},{"id":"s12","latex":"S^2=\\boxed{48}"}],"diagram":null,"contentHash":"c4e8bbd52430543824dc59b73e022a964ffe1e7dcfbdb7c9e1d269a21517a7ba","questionHtml":"\u003cp class=\"hp htall\">그림과 같이 한 변의 길이가 \u003cspan class=\"heq\">\\(4\\)\u003c/span>인 정삼각형을 밑면으로 하고 높이가 \u003cspan class=\"heq\">\\(4+2 \\sqrt{ 3}\\)\u003c/span> 인 정삼각기둥 \u003cspan class=\"heq\">\\(A B C-DEF\\)\u003c/span>와 \u003cspan class=\"heq\">\\({\\overline{D G}} =4\\)\u003c/span>인 선분 \u003cspan class=\"heq\">\\(A D
