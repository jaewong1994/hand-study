<script>window.HandStudyGuide={"itemId":8757,"sourceHash":"c43cd6b05514aa9764c7506567c76eb29c90740cdf6cef57b8e29d5f7caf3ad1","contentHash":"c2bffe6d5e1c434f6a28273256fcf0cbe931107b867119e07850d48dc9e1bf23","overview":{"goal":"합성방정식을 두 이차방정식으로 나누고, 각 방정식의 실근 수와 두 근집합의 겹침까지 확인해 정수 \\(a\\)를 세어요.","firstLook":"\\(f(u)=f(v)\\)는 \\((u-v)(u+v-2)=0\\)으로 인수분해돼요.","conditions":[{"label":"서로 다른 실근 두 개","meaning":"두 이차방정식의 근을 합친 집합의 원소가 정확히 두 개여야 해요."}]},"chapters":[{"id":"c1","label":"합성방정식을 두 식으로 나눠요","stepIds":["s1","s2"],"question":"\\(f(g(x))=f(x)\\)는 왜 두 경우로 나뉘나요?","hint":"\\(f(u)-f(v)=(u-v)(u+v-2)\\)를 확인하세요.","explanation":"\\(f(z)=z^2-2z-3\\)이므로 \\(f(u)-f(v)=(u-v)(u+v-2)\\)예요. 따라서 \\(u=g(x),v=x\\)를 넣으면 \\(g(x)=x\\) 또는 \\(g(x)+x=2\\)예요. 각각 \\(x^2+x+a=0\\), \\(x^2+3x+a-2=0\\)이 돼요.","check":{"prompt":"두 경우를 더하는 것이 아니라 합집합으로 보아야 하는 이유는 무엇인가요?","answer":"한 x가 두 방정식을 동시에 만족할 수 있으므로 서로 다른 근의 수에서는 중복을 한 번만 세어야 해요."}},{"id":"c2","label":"판별식으로 실근 수를 나눠요","stepIds":["s3","s4"],"question":"어느 정수 범위에서 첫 식은 근이 없고 둘째 식은 두 근을 가지나요?","hint":"두 판별식 \\(1-4a\\), \\(17-4a\\)의 부호를 비교하세요.","explanation":"정수 \\(a\\)에 대해 \\(1\\le a\\le4\\)이면 \\(1-4a<0\\)이고 \\(17-4a>0\\)이에요. 따라서 첫 이차방정식은 실근이 없고 둘째는 서로 다른 두 실근을 가져 전체 근이 정확히 두 개예요.","check":{"prompt":"정수 a에서는 판별식이 0인 경계가 생기나요?","answer":"\\(a=1/4\\), \\(17/4\\)일 때만 0인데 둘 다 정수가 아니어서 생기지 않아요."}},{"id":"c3","label":"다른 정수 범위를 제외해요","stepIds":["s5"],"question":"\\(a\\le0\\)이나 \\(a\\ge5\\)에서는 왜 답이 되지 않나요?","hint":"두 방정식의 근 수와 공통근을 확인하세요.","explanation":"\\(a\\le0\\)이면 두 판별식이 모두 양수라 보통 네 근이 생겨요. 공통근이 있으려면 두 식을 빼서 \\(2x-2=0\\), 즉 \\(x=1\\)이고 이를 넣어 \\(a=-2\\)여야 해요. 이때도 근집합은 \\(\\{1,-2,-4\\}\\)로 세 개예요. \\(a\\ge5\\)이면 두 판별식이 모두 음수라 실근이 없어요. 따라서 가능한 정수는 \\(1,2,3,4\\)의 네 개이고 정답은 ④예요.","check":{"prompt":"특별한 값 \\(a=-2\\)를 따로 확인한 이유는 무엇인가요?","answer":"두 이차방정식이 공통근을 가져 네 근보다 적어질 수 있는 유일한 정수이기 때문이에요."}}],"takeaway":["합성된 이차함수 방정식은 차를 인수분해해 경우를 나눌 수 있어요.","서로 다른 근의 개수는 각 식의 근 수뿐 아니라 공통근도 확인해요.","판별식 경계가 정수 조건에 실제 포함되는지 확인해요."]};</script>
