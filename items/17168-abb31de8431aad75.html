<script>window.HandStudyRecord={"itemId":17168,"sourceLabel":"2021 평가원 고3 수학기하 6월 22번","adminYear":2021,"grade":3,"month":6,"number":22,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"삼차함수 $f \\left( x \\right)$가 다음 조건을 만족시킨다.\n(가) 방정식 $f \\left( x \\right)$$=0$의 서로 다른 실근의 개수는 $2$이다.(나) 방정식 $f \\left( x-f \\left( x \\right) \\right)$$=0$의 서로 다른 실근의 개수는 $3$이다.\n$f \\left( 1 \\right) =4$, $f' \\left( 1 \\right)$$=1$, $f' \\left( 0 \\right)$$>1$일 때, $f \\left( 0 \\right)$$= \\frac{q}{p}$이다. $p+q$의 값을 구하시오. (단, $p$와 $q$는 서로소인 자연수이다.) [4점]\n 사각형입니다. 2021년 6월 고3 모의고사 문제지제 2 교시 수학 영역(기하) 5 지선다형","answer":"61","sourceHash":"a4945d67033d0c5ceac0738666b9317d87c7481c19927dd7790d95553ed0380a","steps":[{"id":"s1","latex":"f(x)=c(x-\\alpha)^2(x-\\beta),\\quad\\alpha\\ne\\beta"},{"id":"s2","latex":"f(x)=x-\\alpha\\Leftrightarrow(x-\\alpha)\\{c(x-\\alpha)(x-\\beta)-1\\}=0"},{"id":"s3","latex":"f(x)=x-\\beta\\Leftrightarrow(x-\\beta)\\{c(x-\\alpha)^2-1\\}=0"},{"id":"s4","latex":"c>0:\\quad\\text{첫 식의 근 }3\\text{개, 둘째 식의 근 }2\\text{개 이상; 두 근 집합은 겹치지 않음}"},{"id":"s5","latex":"c\u003c0:\\quad\\text{둘째 식의 근은 }\\beta\\text{뿐}\\Rightarrow\\text{첫 식의 이차식이 중근}"},{"id":"s6","latex":"c^2(\\alpha-\\beta)^2+4c=0\\Rightarrow c(\\alpha-\\beta)^2=-4"},{"id":"s7","latex":"A=1-\\alpha,\\ B=1-\\beta,\\ t=B/A:\\quad cA^3t=4,\\ cA^2(1+2t)=1"},{"id":"s8","latex":"cA^2(t-1)^2=-4\\Rightarrow(t-1)^2=-4(1+2t)\\Rightarrow t=-1,-5"},{"id":"s9","latex":"t=-5:\\quad A=36/5,\\ c=-25/11664,\\ f^{\\prime}(0)=3503/3888\u003c1\\quad\\text{제외}"},{"id":"s10","latex":"t=-1:\\quad A=4,\\ c=-1/16,\\ \\alpha=-3,\\ \\beta=5"},{"id":"s11","latex":"f(0)=45/16\\Rightarrow p+q=61"}],"diagram":null,"contentHash":"5d9cd293b85ac16c437481cf0ac59a9dd6feb0f453d30c9aff47a755b69361d5","questionHtml":"\u003cp class=\"hp\">삼차함수 \u003cspan class=\"heq\">\\(f \\left( x \\right)\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) 방정식 \u003cspan class=\"heq\">\\(f \\left( x \\ri
