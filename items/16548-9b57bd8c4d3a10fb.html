<script>window.HandStudyRecord={"itemId":16548,"sourceLabel":"2019 평가원 고3 수리가형 9월 28번","adminYear":2019,"grade":3,"month":9,"number":28,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"연필 $7$자루와 볼펜 $4$자루를 다음 조건을 만족시키도록 여학생 $3$명과 남학생 $2$명에게 남김없이 나누어 주는 경우의 수를 구하시오. (단, 연필끼리는 서로 구별하지 않고, 볼펜끼리도 서로 구별하지 않는다.) [4점]\n(가) 여학생이 각각 받는 연필의 개수는 서로 같고, 남학생이 각각 받는 볼펜의 개수도 서로 같다.(나) 여학생은 연필을 $1$자루 이상 받고, 볼펜을 받지 못하는 여학생이 있을 수 있다.(다) 남학생은 볼펜을 $1$자루 이상 받고, 연필을 받지 못하는 남학생이 있을 수 있다.","answer":"49","sourceHash":"c9aa9fd29ebd8dd5c02cca13a78668496a278f7f226c7c4c783a8d834efe92fd","steps":[{"id":"s1","latex":"\\text{여학생의 연필 수 }p:\\quad p\\in\\{1,2\\}"},{"id":"s2","latex":"p=1:\\ 7-3p=4\\Rightarrow4+1=5,\\qquad p=2:\\ 7-3p=1\\Rightarrow1+1=2"},{"id":"s3","latex":"N_{\\mathrm{pencil}}=5+2=7"},{"id":"s4","latex":"\\text{남학생의 볼펜 수 }q:\\quad q\\in\\{1,2\\}"},{"id":"s5","latex":"q=1:\\ 4-2q=2\\Rightarrow{}_{4}\\mathrm C_{2}=6,\\qquad q=2:\\ 4-2q=0\\Rightarrow1"},{"id":"s6","latex":"N_{\\mathrm{pen}}=6+1=7"},{"id":"s7","latex":"N=7\\cdot7=\\boxed{49}"}],"diagram":null,"contentHash":"8a6254b53de37baf51218283c87a9e4b131267043fb04f4c9b413cdcdf35d840","questionHtml":"<p class=\"hp\">연필 <span class=\"heq\">\\(7\\)<\/span>자루와 볼펜 <span class=\"heq\">\\(4\\)<\/span>자루를 다음 조건을 만족시키도록 여학생 <span class=\"heq\">\\(3\\)<\/span>명과 남학생 <span class=\"heq\">\\(2\\)<\/span>명에게 남김없이 나누어 주는 경우의 수를 구하시오. (단, 연필끼리는 서로 구별하지 않고, 볼펜끼리도 서로 구별하지 않는다.) <span class=\"hscore\">[4점]<\/span><\/p><div class=\"hbox\"><p class=\"hp\">(가) 여학생이 각각 받는 연필의 개수는 서로 같고, 남학생이 각각 받는 볼펜의 개수도 서로 같다.<\/p><p class=\"hp\">(나) 여학생은 연필을 <span class=\"heq\">\\(1\\)<\/span>자루 이상 받고, 볼펜을 받지 못하는 여학생이 있을 수 있다.<\/p><p class=\"hp\">(다) 남학생은 볼펜을 <span class=\"heq\">\\(1\\)<\/span>자루 이상 받고, 연필을 받지 못하는 남학생이 있을 수 있다.<\/p><\/div>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"7fd9282c98a6d00274b3833ae1240a922c2ac629d08061bc3effeba20b16e7f2"};</script>
<script>window.HandStudyGuide={"itemId":16548,"sourceHash":"c9aa9fd29ebd8dd5c02cca13a78668496a278f7f226c7c4c783a8d834efe92fd","contentHash":"8a6254b53de37baf51218283c87a9e4b131267043fb04f4c9b413cdcdf35d840","overview":{"goal":"여학생이 받는 연필 수와 남학생이 받는 볼펜 수를 먼저 정한 뒤, 남은 물건을 나누는 경우를 세어요.","firstLook":"같아야 하는 양은 여학생 세 명의 연필 수와 남학생 두 명의 볼펜 수예요. 이 공통 수를 먼저 정하면 나머지는 서로 다른 학생에게 같은 물건을 나누는 문제가 돼요.","conditions":[{"label":"연필 조건","meaning":"여학생 세 명은 각각 같은 수의 연필을 받고 그 수는 1 이상이에요."},{"label":"볼펜 조건","meaning":"남학생 두 명은 각각 같은 수의 볼펜을 받고 그 수는 1 이상이에요."},{"label":"나머지 배분","meaning":"남학생은 연필을, 여학생은 볼펜을 0개 받아도 되므로 남은 수에는 0을 허용해요."}]},"chapters":[{"id":"c1","label":"연필을 나누는 경우를 세어요","stepIds":["s1","s2","s3"],"question":"여학생 한 명이 받는 연필 수는 왜 1 또는 2뿐일까요?","hint":"세 여학생에게 먼저 같은 수씩 주고 남은 연필을 두 남학생에게 나눠요.","explanation":"여학생 한 명이 받는 연필 수를 \\(p\\)라 하면 세 여학생에게 \\(3p\\)자루를 줘요. \\(p\\ge1\\)이고 \\(3p\\le7\\)이므로 \\(p=1,2\\)뿐이에요.\n\n\\(p=1\\)이면 연필이 \\(7-3=4\\)자루 남아요. 두 남학생이 받는 수를 \\(x,y\\)라 하면 \\(x+y=4\\), \\(x,y\\ge0\\)이고 \\((x,y)=(0,4),(1,3),\\ldots,(4,0)\\)이므로 5가지예요. \\(p=2\\)이면 \\(x+y=1\\)이라서 \\((0,1),(1,0)\\)의 2가지예요. 따라서 연필을 나누는 경우는 \\(5+2=7\\)가지예요.","check":{"prompt":"남학생이 연필을 받지 못해도 된다는 조건은 계산에서 어디에 쓰였나요?","answer":"\\(x,y\\ge0\\)으로 두어 \\((0,4),(4,0)\\)과 \\((0,1),(1,0)\\)을 포함할 때 쓰였어요."}},{"id":"c2","label":"볼펜을 나누는 경우를 세어요","stepIds":["s4","s5","s6"],"question":"남학생 한 명이 받는 볼펜 수에 따라 여학생에게 남는 볼펜은 몇 자루일까요?","hint":"남학생 두 명에게 같은 수씩 먼저 주고, 남은 볼펜을 세 여학생에게 0개도 허용하여 나눠요.","explanation":"남학생 한 명이 받는 볼펜 수를 \\(q\\)라 하면 \\(q\\ge1\\), \\(2q\\le4\\)이므로 \\(q=1,2\\)예요.\n\n\\(q=1\\)이면 볼펜 2자루가 남아요. 세 여학생이 받는 수를 \\(u,v,w\\)라 하면 \\(u+v+w=2\\), \\(u,v,w\\ge0\\)이에요. 한 명이 2자루 받는 3가지와 두 명이 1자루씩 받는 \\({}_3\\mathrm C_2=3\\)가지를 합해 6가지예요. \\(q=2\\)이면 남는 볼펜이 없어서 세 여학생이 모두 0자루를 받는 1가지뿐이에요. 따라서 볼펜을 나누는 경우는 \\(6+1=7\\)가지예요.","check":{"prompt":"\\(q=1\\)일 때 6가지가 빠짐없이 세어졌다는 이유는 무엇인가요?","answer":"합이 2인 0 이상의 세 수는 \\((2,0,0)\\)의 순서를 바꾼 3가지와 \\((1,1,0)\\)의 순서를 바꾼 3가지뿐이에요."}},{"id":"c3","label":"두 배분을 곱해 정답을 확인해요","stepIds":["s7"],"question":"연필의 7가지와 볼펜의 7가지는 왜 곱할 수 있을까요?","hint":"연필을 어떻게 나누어도 볼펜을 나누는 7가지를 모두 선택할 수 있는지 확인해요.","explanation":"연필 배분을 하나 정한 뒤에도 볼펜 배분 7가지를 모두 고를 수 있고, 볼펜 조건은 연필 배분에 따라 달라지지 않아요. 따라서 곱의 법칙으로 전체 경우의 수는 \\(7\\times7=49\\)예요.","check":{"prompt":"전체 경우의 수를 더하지 않고 곱하는 이유는 무엇인가요?","answer":"한 배분을 택하는 것이 연필 경우와 볼펜 경우 중 하나를 고르는 일이 아니라, 연필 경우 하나와 볼펜 경우 하나를 짝짓는 일이기 때문이에요."}}],"takeaway":["같은 수를 받아야 하는 사람들에게 먼저 공통 수만큼 주면 남은 배분이 단순해져요.","0개를 받아도 되는 사람은 0 이상의 정수해에 포함해야 해요.","두 선택이 서로의 가능한 경우 수를 바꾸지 않으면 곱의 법칙을 적용해요."]};</script>
