<script>window.HandStudyGuide={"itemId":17667,"sourceHash":"b5b810ae2289a97c707845de796974ba3086cc2e37e3cf0a1df0f8f6816daeb8","contentHash":"0ce9520a291cb29ba10f214e79e6419fcacae71cddb9cc78c773f0040cc8e8df","overview":{"goal":"이차부등식의 두 근이 놓인 정수 사이를 찾아 해의 개수를 정확히 세고, 근호에서 가장 큰 항과 남는 차를 구해요.","firstLook":"근의 정확한 소수값은 필요 없어요. 왼쪽 근이 -1과 0 사이, 오른쪽 근이 \\(4n\\)과 \\(4n+1\\) 사이임을 보이면 정수 개수가 바로 정해져요.","conditions":[{"label":"엄격한 이차부등식","meaning":"위로 열린 이차식이 음수인 두 근 사이의 열린구간을 사용해요."},{"label":"자연수인 매개변수","meaning":"양수인 항들을 제곱 비교해 근호의 위치를 연속된 정수 사이에 잡아요."}]},"chapters":[{"id":"c1","label":"두 근의 정수 경계 찾기","stepIds":["s1","s2","s3"],"question":"\\(\\sqrt{4n^2+n}\\)이 \\(2n\\)과 \\(2n+1\\) 사이임을 어떻게 확인할까요?","hint":"세 수가 양수이므로 제곱해서 비교하세요.","explanation":"근의 공식으로 부등식의 해는 \\(2n-\\sqrt{4n^2+n}<x<2n+\\sqrt{4n^2+n}\\)예요. \\(4n^2<4n^2+n\\)이므로 \\(2n<\\sqrt{4n^2+n}\\)이고, \\(4n^2+n<(2n+1)^2=4n^2+4n+1\\)이므로 \\(\\sqrt{4n^2+n}<2n+1\\)이에요.\n\n따라서 왼쪽 근은 -1보다 크고 0보다 작아요. 오른쪽 근은 \\(4n\\)보다 크고 \\(4n+1\\)보다 작아요.","check":{"prompt":"오른쪽 비교에서 \\(n<4n+1\\)이 항상 참인 이유는 무엇인가요?","answer":"\\(n\\)이 자연수라 \\(3n+1>0\\)이기 때문이에요."}},{"id":"c2","label":"열린구간의 정수 세기","stepIds":["s4","s5"],"question":"두 근 사이에 들어가는 첫 정수와 마지막 정수는 각각 무엇인가요?","hint":"왼쪽 근은 -1과 0 사이이고 오른쪽 근은 \\(4n\\)과 \\(4n+1\\) 사이예요.","explanation":"열린구간 안의 정수는 \\(0,1,\\ldots,4n\\)이에요. 0부터 \\(4n\\)까지는 양 끝을 포함해 \\(4n+1\\)개이므로 \\(a_n=4n+1\\)이에요. 따라서 \\(\\sqrt{na_n}=\\sqrt{n(4n+1)}=\\sqrt{4n^2+n}\\)이에요.","check":{"prompt":"부등식이 엄격하지만 0과 \\(4n\\)을 포함해도 되는 이유는 무엇인가요?","answer":"실제 두 근은 각각 0보다 작고 \\(4n\\)보다 크므로 0과 \\(4n\\)은 근이 아니라 열린구간의 안쪽에 있어요."}},{"id":"c3","label":"가장 큰 항과 남는 차 구하기","stepIds":["s6","s7"],"question":"\\(\\sqrt{4n^2+n}\\)에서 어떤 \\(pn\\)을 빼야 유한한 값이 남을까요?","hint":"\\(n\\)을 묶어 가장 큰 계수를 보고, 남은 차는 켤레를 곱하세요.","explanation":"\\(\\sqrt{4n^2+n}=n\\sqrt{4+1/n}\\)이므로 가장 큰 항은 \\(2n\\)이고 \\(p=2\\)예요. 남은 차는 \\(\\sqrt{4n^2+n}-2n=\\frac{n}{\\sqrt{4n^2+n}+2n}\\)으로 유리화돼요. 분자와 분모를 \\(n\\)으로 나누면 극한은 \\(1/(2+2)=1/4\\)이므로 \\(q=1/4\\)예요. 따라서 \\(100pq=100\\cdot2\\cdot1/4=50\\)이에요.","check":{"prompt":"유리화했을 때 분자가 \\(n\\)만 남는 이유는 무엇인가요?","answer":"\\((4n^2+n)-(2n)^2=n\\)이기 때문이에요."}}],"takeaway":["정수 개수 문제는 두 근이 어느 연속된 정수 사이에 있는지 먼저 찾아요.","엄격한 부등식이라도 정수 후보가 실제 근과 다르면 포함될 수 있어요.","근호에서 큰 항을 뺀 극한은 켤레를 곱해 남는 차를 계산해요."]};</script>
