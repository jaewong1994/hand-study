  <script>window.HandStudyRecord={"itemId":16566,"sourceLabel":"2019 평가원 고3 수리나형 6월 17번","adminYear":2019,"grade":3,"month":6,"number":17,"track":"수리나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 한 변의 길이가 $4$인 정사각형 ${ A_{1}B_{1}C_{1}D_{1 }}$이 있다. 선분 ${ C_{1}D_{1 }}$의 중점을 ${E_{1}}$이라 하고, 직선 ${ A_{1}B_{1 }}$ 위에 두 점 ${ F_{1}}$, ${ G_{1}}$을 $\\overline{{ E_{1}F_{1 }}}= \\overline{{ E_{1}G_{1}}}$, $\\overline{{ E_{1}F_{1}}} : \\overline{{ F_{1}G_{1}}}= 5 : 6$이 되도록 잡고 이등변삼각형 ${ E_{1}F_{1}G_{1}}$을 그린다. 선분 ${ D_{1}A_{1}}_{ }$과 선분 ${ E_{1}F_{1}}$의 교점을 ${ P_{1}}$, 선분 ${ B_{1}C_{1}}$과 선분 ${ G_{1}E_{1}}$의 교점을 ${ Q_{1}}$이라 할 때, 네 삼각형 ${ E_{1}D_{1}P_{1}}$, ${ P_{1}F_{1}A_{1}}$, ${ Q_{1}B_{1}G_{1}}$, ${ E_{1}Q_{1}C_{1}}$로 만들어진 모양의 도형에 색칠하여 얻은 그림을 $R _{1 }$이라 하자. 그림 ${ R _{1}}$에 선분 ${ F_{1}G_{1}}$ 위의 두 점 ${ A_{2 }}$, ${ B_{2 }}$와 선분 ${ G_{1}E_{1 }}$ 위의 점 ${ C_{2}}$, 선분 ${ E_{1}F_{1}}$ 위의 점 ${ D_{2}}$를 꼭짓점으로 하는 정사각형 ${ A_{2}B_{2}C_{2}D_{2}}$를 그리고, 그림 $R _{1 }$을 얻는 것과 같은 방법으로 정사각형 ${ A_{2}B_{2}C_{2}D_{2}}$에 모양의 도형을 그리고 색칠하여 얻은 그림을 $R _{2 }$라 하자. 이와 같은 과정을 계속하여 $n$번째 얻은 그림 $R _{n }$에 색칠되어 있는 부분의 넓이를 $S_{n }$이라 할 때, $\\lim _{n \\,->\\, \\infty }S_{n }$의 값은? [4점]\n➀ $\\frac{61}{6}$ ➁ $\\frac{125}{12}$ ➂ $\\frac{32}{3}$ ➃ $\\frac{131}{12}$ ➄ $\\frac{67}{6}$","answer":"②","sourceHash":"f9f9306dd00bfece8a971fd51b37d22f344867bd8ece4043c85ad97cfce91486","steps":[{"id":"s1","latex":"E_1H\\perp F_1G_1,\\quad E_1H=4,\\quad E_1F_1:F_1G_1=5:6"},{"id":"s2","latex":"E_1F_1=5a,\\ F_1H=3a\\Rightarrow(5a)^2=4^2+(3a)^2\\Rightarrow a=1"},{"id":"s3","latex":"D_1E_1:A_1F_1=2:1\\Rightarrow D_1P_1=\\dfrac83,\\quad A_1P_1=\\dfrac43"},{"id":"s4","latex":"S_1=2\\cdot\\dfrac12\\cdot2\\cdot\\dfrac83+2\\cdot\\dfrac12\\cdot1\\cdot\\dfrac43=\\dfrac{20}{3}"},{"id":"s5","latex":"3:4=\\dfrac{x}{2}:(4-x)\\Rightarrow x=\\dfrac{12}{5}"},{"id":"s6","latex":"\\text{닮음비}=\\dfrac35\\Rightarrow\\text{넓이비}=\\dfrac9{25}"},{"id":"s7","latex":"\\lim_{n\\to\\infty}S_n=\\dfrac{20/3}{1-9/25}=\\dfrac{125}{12}"}],"diagram":null,"contentHash":"65bda63e74f022abc3f20f682e97cb3993b90f3d52045c7b3d93931cadff30ec","questionHtml":"\u003cp class=\"hp htall\">그림과 같이 한 변의 길이가 \u003cspan class=\"heq\">\\(4\\)\u003c/span>인 정사각형\u003cspan class=\"heq\">\\({A_{1}B_{1}C_{1}D_{1 }}\\)\u003c/span>이 있다. 선분\u003cspan class=\"heq\">\\({C_{1}D_{1 }}\\)\u003c/span>의 중점을 \u003cspan class=\"heq\">\\({E_{1}}\\)\u003c/span>이라 하고, 직선\u003cspan class=\"heq\">\\({A_{1}B_{1 }}\\)\u003c/span> 위에 두 점 \u003cspan class=\"heq\">\\({F_{1}}\\)\u003c/span>, \u003cspan class=\"heq\">\\({G_{1}}\\)\u003c/span>을 \u003cspan class=\"heq\">\\(\\overline{{E_{1}F_{1 }}}= \\overline{{E_{1}G_{1}}}\\)\u003c/span>, \u003cspan class=\"heq\">\\(\\overline{{E_{1}F_{1}}} : \\overline{{F_{1}G_{1}}}= 5 : 6\\)\u003c/span>이 되도록 잡고 이등변삼각형 \u003cspan class=\"heq\">\\({E_{1}F_{1}G_{1}}\\)\u003c/span>을 그린다. 선분\u003cspan class=\"heq\">\\({D_{1}A_{1}}\\)\u003c/span>과 선분\u003cspan class=\"heq\">\\({E_{1}F_{1}}\\)\u003c/span>의 교점을 \u003cspan class=\"heq\">\\({P_{1}}\\)\u003c/span>, 선분\u003cspan class=\"heq\">\\({B_{1}C_{1}}\\)\u003c/span>과 선분\u003cspan class=\"heq\">\\({G_{1}E_{1}}\\)\u003c/span>의 교점을 \u003cspan class=\"heq\">\\({Q_{1}}\\)\u003c/span>이라 할 때, 네 삼각형 \u003cspan class=\"heq\">\\({E_{1}D_{1}P_{1}}\\)\u003c/span>, \u003cspan class=\"heq\">\\({P_{1}F_{1}A_{1}}\\)\u003c/span>, \u003cspan class=\"heq\">\\({Q_{1}B_{1}G_{1}}\\)\u003c/span>, \u003cspan class=\"heq\">\\({E_{1}Q_{1}C_{1}}\\)\u003c/span>로 만들어진 \u003cimg class=\"hfig\" src=\"../assets/figures/13e2c7175232c60cde2a603d.png\" style=\"width:31px;max-width:100%\">모양의 도형에 색칠하여 얻은 그림을 \u003cspan class=\"heq\">\\(R_{1 }\\)\u003c/span>이라 하자. 그림 \u003cspan class=\"heq\">\\({ R_{1}}\\)\u003c/span>에 선분 \u003cspan class=\"heq\">\\({F_{1}G_{1}}\\)\u003c/span> 위의 두 점 \u003cspan class=\"heq\">\\({A_{2 }}\\)\u003c/span>, \u003cspan class=\"heq\">\\({B_{2 }}\\)\u003c/span>와 선분 \u003cspan class=\"heq\">\\({G_{1}E_{1 }}\\)\u003c/span> 위의 점 \u003cspan class=\"heq\">\\({C_{2}}\\)\u003c/span
