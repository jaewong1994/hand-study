uestionHtml":"\u003cp class=\"hp htall\">함수 \u003cspan class=\"heq\">\\(y=\\dfrac{ \\sqrt{x}}{10}\\)\u003c/span>의 그래프와 함수 \u003cspan class=\"heq\">\\(y= \\tan x\\)\u003c/span>의 그래프가 만나는 모든 점의 \u003cspan class=\"heq\">\\(x\\)\u003c/span>좌표를 작은 수부터 크기순으로 나열할 때, \u003cspan class=\"heq\">\\(n\\)\u003c/span>번째 수를 \u003cspan class=\"heq\">\\(a_{n}\\)\u003c/span>이라 하자.\u003c/p>\u003cp class=\"hp htall\">&emsp;&emsp;\u003cspan class=\"heq\">\\(\\dfrac{1}{\\pi^{2}} \\times \\lim\\limits_{n\\, \\rightarrow \\, \\infty } {} a_{n}^{3} \\tan^{2} \\left( a_{n+1} -a_{n} \\right)\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">의 값을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","questionText":"함수 $y=\\frac{ \\sqrt{x}}{10}$의 그래프와 함수 $y= \\tan x$의 그래프가 만나는 모든 점의 $x$좌표를 작은 수부터 크기순으로 나열할 때, $n$번째 수를 $a_{n}$이라 하자.\n $\\frac{1}{\\pi ^{2}} \\times \\lim _{n\\, \\rightarrow \\, \\infty } {} a _{n}^{3} \\tan^{2} \\left( a _{n+1} -a _{n} \\right)$\n의 값을 구하시오. [4점]","scoreStatus":"confirmed_4_direct","sourceHash":"a7e8b480b3dcfdd579454eafa34de07f1545e54c2b2ca927b346a89c499b5f03","sourceLabel":"2024 평가원 고3 수학미적분 6월 30번","stepExplanations":{"s1":{"body":"자연수 \\(m\\ge1\\)에 대해 \\((m\\pi,m\\pi+\\frac\\pi2)\\)에서 \\(H(x)=\\tan x-\\frac{\\sqrt{x}}{10}\\)을 보아요. \\(H^{\\prime}(x)=\\sec^2x-\\frac1{20\\sqrt{x}}>0\\)이고, 왼쪽 끝에서는 음수, 오른쪽 끝에 가까워지면 양의 무한대로 가므로 교점이 정확히 하나예요. 그 다음 반주기에는 탄젠트가 음수라 교점이 없어요. 따라서 충분히 큰 \\(n\\)에 대해 \\(a_n=m_n\\pi+\\theta_n\\)으로 쓰면 \\(0\u003c\\theta_n\u003c\\frac\\pi2\\)이고 \\(m_{n+1}=m_n+1\\)이에요.","skillTags":["algebra.calculation","geometry.reasoning"],"title":"충분히 뒤에서는 탄젠트의 한 가지마다 교점이 하나예요"},"s2":{"body":"\\(a_n\\to\\infty\\)이므로 \\(\\tan\\theta_n=\\frac{\\sqrt{a_n}}{10}\\to\\infty\\)예요. \\(0\u003c\\theta_n\u003c\\frac\\pi2\\)에서 각도가 \\(\\frac\\pi2\\)보다 일정한 양만큼 작다면 탄젠트 값이 유한한 범위에 머물러요. 그러므로 \\(\\theta_n\\to\\frac\\pi2\\)예요. 이제 \\(a_{n+1}-a_n=\\pi+\\theta_{n+1}-\\theta_n\\to\\pi\\)이고, \\(\\frac{a_{n+1}}{a_n}=1+\\frac{a_{n+1}-a_n}{a_n}\\to1\\)이에요.","skillTags":["calculus.limit","algebra.calculation"],"title":"교점의 각도는 π/2에 가까워져요"},"s3":{"body":"탄젠트의 차 공식을 쓰면 분자는 \\(\\frac{\\sqrt{a_{n+1}}-\\sqrt{a_n}}{10}\\), 분모는 \\(1+\\frac{\\sqrt{a_na_{n+1}}}{100}\\)이에요. 여기에 \\(\\sqrt{a_{n+1}}-\\sqrt{a_n}=\\frac{a_{n+1}-a_n}{\\sqrt{a_{n+1}}+\\sqrt{a_n}}\\)을 넣으면 표시된 식을 얻어요. 모든 분모는 충분히 큰 \\(n\\)에서 양수예요.","skillTags":["geometry.reasoning","algebra.calculation"],"title":"차의 공식 뒤에 제곱근 차를 유리화해요"},"s4":{"body":"\\(R_n=\\frac{a_{n+1}}{a_n}\\), \\(d_n=a_{n+1}-a_n\\)으로 쓰면 \\(a_n^3\\tan^2d_n=\\frac{100d_n^2}{(\\sqrt{R_n}+1)^2(\\frac{100}{a_n}+\\sqrt{R_n})^2}\\)이에요. 여기서 \\(R_n\\to1\\), \\(d_n\\to\\pi\\), \\(\\frac{100}{a_n}\\to0\\)이므로 분모는 \\(4\\cdot1\\), 분자는 \\(100\\pi^2\\)으로 가요. 따라서 극한은 \\(25\\pi^2\\)이고, 문제의 \\(\\frac1{\\pi^2}\\)을 곱하면 25예요.","skillTags":["calculus.limit","algebra.calculation"],"title":"분모를 aₙ의 크기에 맞춰 나누어요"}},"steps":[{"id":"s1","latex":"a_n=m_n\\pi+\\theta_n,\\quad0\u003c\\theta_n\u003c\\frac\\pi2,\\quad m_{n+1}=m_n+1\\quad(n\\text{이 충분히 큼})"},{"id":"s2","latex":"\\tan\\theta_n=\\frac{\\sqrt{a_n}}{10}\\to\\infty\\quad\\Rightarrow\\quad\\theta_n\\to\\frac\\pi2,\\quad a_{n+1}-a_n\\to\\pi,\\quad \\frac{a_{n+1}}{a_n}\\to1"},{"id":"s3","latex":"\\tan(a_{n+1}-a_n)=\\frac{10(a_{n+1}-a_n)}{(\\sqrt{a_{n+1}}+\\sqrt{a_n})(100+\\sqrt{a_na_{n+1}})}"},{"id":"s4","latex":"a_n^3\\tan^2(a_{n+1}-a_n)\\to\\frac{100\\pi^2}{4}=25\\pi^2"},{"id":"s5","latex":"\\frac1{\\pi^2}\\lim=25"}],"track":"미적분"};</script>
