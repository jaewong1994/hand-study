<script>window.HandStudyRecord={"adminYear":2021,"answer":"143","contentHash":"8e05d88909031f709b7143cc7fde34bc3dcd641ee9db160d9c631a3d95c9ef3a","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24799,"month":11,"number":30,"points":4,"preview":false,"questionHtml":"\u003cp>실수 전체의 집합에서 증가하고 미분가능한 함수 \u003cspan class=\"heq\">\\(f \\left( x \\right)\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox hcond\">\u003cp class=\"hcondr\">(가) \u003cspan class=\"heq\">\\(f \\left( 1 \\right) =1,\\, \\int _{1} ^{2} {f \\left( x \\right) dx= \\frac{5}{4}}\\)\u003c/span>\u003c/p>\u003cp class=\"hcondr\">(나) 함수 \u003cspan class=\"heq\">\\(f \\left( x \\right)\\)\u003c/span>의 역함수를 \u003cspan class=\"heq\">\\(g \\left( x \\right)\\)\u003c/span>라 할 때, \u003cspan class=\"heq\">\\(x \\geq 1\\)\u003c/span>인 모든 실수 \u003cspan class=\"heq\">\\(x\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(g \\left( 2x \\right) =2f \\left( x \\right)\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp>\u003cspan class=\"heq\">\\(\\int _{1} ^{8} {xf&#x27; \\left( x \\right) dx= \\frac{q}{p}}\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(p+q\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(p\\)\u003c/span>와 \u003cspan class=\"heq\">\\(q\\)\u003c/span>는 서로소인 자연수이다.) [4점]\u003c/p>","questionText":"실수 전체의 집합에서 증가하고 미분가능한 함수 $f \\left( x \\right)$가 다음 조건을 만족시킨다.\n(가) $f \\left( 1 \\right) =1,\\, \\int _{1} ^{2} {f \\left( x \\right) dx= \\frac{5}{4}}$(나) 함수 $f \\left( x \\right)$의 역함수를 $g \\left( x \\right)$라 할 때, $x \\geq 1$인 모든 실수 $x$에 대하여 $g \\left( 2x \\right) =2f \\left( x \\right)$이다.\n$\\int _{1} ^{8} {xf\\, ' \\left( x \\right) dx= \\frac{q}{p}}$일 때, $p+q$의 값을 구하시오. (단, $p$와 $q$는 서로소인 자연수이다.) [4점]","sourceHash":"d7c2feb32c8347813597c3f84beaca45889c535badbe015597fe454a35ecf8a3","sourceKind":"csat","sourceLabel":"2021년 시행 수능 · 2022학년도 · 미적분 · 30번","steps":[{"id":"s1","latex":"f(1)=1,\\quad g(2)=2f(1)=2\\quad\\Rightarrow\\quad f(2)=2"},{"id":"s2","latex":"g(4)=2f(2)=4,\\quad g(8)=2f(4)=8\\quad\\Rightarrow\\quad f(4)=4,\\ f(8)=8"},{"explanation":{"body":"\\(y=f(x)\\)와 \\(x=g(y)\\)는 같은 관계를 나타내요. \\(x=a\\)부터 \\(b\\)까지 \\(f\\) 아래의 넓이와, \\(y=f(a)\\)부터 \\(f(b)\\)까지 역함수 아래의 넓이를 합하면 \\(bf(b)-af(a)\\)가 됩니다. 여기서는 \\(f(a)=a,f(b)=b\\)이므로 두 적분의 합이 \\(b^2-a^2\\)예요. 끝점이 고정된 값인지 먼저 확인하고 사용해요.","skillTags":["integration.inverse-function"],"title":"역함수의 적분은 원래 함수와 짝지어 계산해요"},"id":"s3","latex":"f(a)=a,\\ f(b)=b\\text{일 때}\\quad\\int_a^bf(x)\\,dx+\\int_a^bg(x)\\,dx=b^2-a^2"},{"explanation":{"body":"조건은 \\(g(2t)=2f(t)\\) 꼴이에요. 이를 쓰려고 \\(x=2t\\)로 치환합니다. \\(dx=2\\,dt\\)이고 구간 \\([2,4]\\)는 \\([1,2]\\)로 바뀌어요. 치환에서 나온 2와 함수 조건에서 나온 2가 곱해져 \\(4\\int_1^2f(t)\\,dt\\)가 되는 거예요.","skillTags":["integration.substitution","integration.bounds"],"title":"x=2t로 바꾸면 dx도 두 배가 돼요"},"id":"s4","latex":"\\int_2^4g(x)\\,dx=\\int_1^22g(2t)\\,dt=4\\int_1^2f(t)\\,dt=5"},{"id":"s5","latex":"\\int_2^4f(x)\\,dx=12-5=7,\\quad\\int_4^8g(x)\\,dx=4\\int_2^4f(t)\\,dt=28"},{"id":"s6","latex":"\\int_4^8f(x)\\,dx=48-28=20,\\quad\\int_1^8f(x)\\,dx=\\frac54+7+20=\\frac{113}{4}"},{"explanation":{"body":"\\(\\int xf^{\\prime}(x)\\,dx\\)에서는 \\(x\\)를 미분하면 1로 간단해지고, \\(f^{\\prime}(x)\\)를 적분하면 \\(f(x)\\)가 돼요. 그래서 부분적분하면 \\([xf(x)]_1^8-\\int_1^8f(x)\\,dx\\)입니다. 끝점 항은 \\(8f(8)-1f(1)=64-1\\)이고, 남은 적분은 바로 앞에서 구한 값을 사용해요.","skillTags":["integration.by-parts"],"title":"x는 미분하고 f′(x)는 적분해요"},"id":"s7","latex":"\\int_1^8xf\\prime(x)\\,dx=[xf(x)]_1^8-\\int_1^8f(x)\\,dx=64-1-\\frac{113}{4}=\\frac{139}{4}"},{"id":"s8","latex":"p+q=4+139=143"}],"track":"미적분"};</script>
<script>window.HandStudyGuide={"itemId":24799,"sourceHash":"d7c2feb32c8347813597c3f84beaca45889c535badbe015597fe454a35ecf8a3","contentHash":"8e05d88909031f709b7143cc7fde34bc3dcd641ee9db160d9c631a3d95c9ef3a","overview":{"goal":"역함수 관계로 구간별 넓이를 구하고, 부분적분으로 목표 적분을 계산해요.","firstLook":"\\(g(2x)=2f(x)\\)는 함수값뿐 아니라 적분구간도 두 배씩 연결해요. 먼저 \\(1,2,4,8\\)에서 \\(f\\)와 \\(g\\)의 대응을 확인해요.","conditions":[{"label":"(가)","meaning":"\\([1,2]\\)에서 \\(f\\)의 넓이 \\(5/4\\)가 다음 구간의 역함수 넓이를 시작하게 해요."},{"label":"(나)","meaning":"\\(g(2x)=2f(x)\\)이므로 \\(x\\)-구간을 두 배로 옮길 때 함수값도 두 배가 돼요."}]},"chapters":[{"id":"c1","label":"고정되는 끝점을 이어 가요","stepIds":["s1","s2"],"question":"\\(f(1)=1\\)에서 \\(f(8)=8\\)까지 어떻게 이어질까요?","hint":"\\(g(y)=x\\)이면 역함수 관계로 \\(f(x)=y\\)예요.","explanation":"\\(g(2)=2f(1)=2\\)이므로 \\(f(2)=2\\)예요. 이제 \\(x=2\\)를 (나)에 넣으면 \\(g(4)=2f(2)=4\\)라서 \\(f(4)=4\\)예요. 다시 \\(x=4\\)를 넣으면 \\(g(8)=2f(4)=8\\)이므로 \\(f(8)=8\\)이에요. 이렇게 \\(1,2,4,8\\)은 \\(f\\)와 \\(g\\) 모두의 고정점이 돼요.","check":{"prompt":"\\(g(4)=4\\)가 역함수 관계에서 뜻하는 것은 무엇인가요?","answer":"\\(f(4)=4\\)라는 뜻이에요."}},{"id":"c2","label":"역함수 넓이를 다음 구간으로 옮겨요","stepIds":["s3","s4","s5","s6"],"question":"\\([1,2]\\)의 \\(f\\) 넓이로 \\([2,4]\\), \\([4,8]\\)의 넓이를 어떻게 차례로 구할까요?","hint":"고정점 \\(a,b\\) 사이에서는 \\(f\\)와 역함수 \\(g\\)의 넓이 합이 \\(b^2-a^2\\)예요. 또 \\(x=2t\\)로 바꿔요.","explanation":"끝점이 \\(f(a)=a,f(b)=b\\)를 만족하므로 \\(\\int_a^bf(x)\\,dx+\\int_a^bg(x)\\,dx=b^2-a^2\\)예요. 먼저 \\(x=2t\\), \\(dx=2dt\\)로 두면\n\n\\(\\int_2^4g(x)\\,dx=\\int_1^2g(2t)\\cdot2\\,dt=\\int_1^2(2f(t))\\cdot2\\,dt=4\\cdot\\frac54=5\\)예요.\n\n따라서 \\(\\int_2^4f=4^2-2^2-5=12-5=7\\)이에요. 같은 치환으로 \\(\\int_4^8g=4\\int_2^4f=28\\)이고, 다시 넓이 합을 쓰면 \\(\\int_4^8f=8^2-4^2-28=48-28=20\\)이에요. 그러므로 \\(\\int_1^8f=5/4+7+20=113/4\\)예요.","check":{"prompt":"\\(\\int_4^8g(x)\\,dx\\)가 \\(4\\int_2^4f(t)\\,dt\\)가 되는 이유는 무엇인가요?","answer":"\\(x=2t\\)에서 \\(dx=2dt\\), \\(g(2t)=2f(t)\\)이므로 두 배가 두 번 곱해져요."}},{"id":"c3","label":"부분적분에서 경계항을 계산해요","stepIds":["s7","s8"],"question":"\\(\\int_1^8xf'(x)\\,dx\\)에서는 어느 항을 미분하고 어느 항을 적분하면 편할까요?","hint":"\\(x\\)를 미분하면 \\(1\\)이 되고, \\(f'(x)\\)를 적분하면 앞에서 넓이를 구한 \\(f(x)\\)가 돼요.","explanation":"부분적분에서 \\(u=x\\), \\(dv=f'(x)\\,dx\\)로 두면 \\(du=dx\\), \\(v=f(x)\\)예요. 그래서\n\n\\(\\int_1^8xf'(x)\\,dx=[xf(x)]_1^8-\\int_1^8f(x)\\,dx\\)예요.\n\n경계항은 \\(8f(8)-1f(1)=8\\cdot8-1\\cdot1=63\\)이고, 남은 적분은 \\(113/4\\)예요. 따라서 \\(63-113/4=(252-113)/4=139/4\\)이고, \\(p+q=4+139=143\\)이에요.","check":{"prompt":"부분적분에서 선택한 \\(u,dv\\)와 경계항은 무엇인가요?","answer":"\\(u=x,dv=f'(x)\\,dx\\)이고, 경계항은 \\([xf(x)]_1^8=63\\)이에요."}}],"takeaway":["역함수 식에서는 먼저 서로 대응하는 끝점을 찾아요.","변수 치환에서는 함수값의 배율과 미분에서 생기는 배율을 모두 곱해요.","부분적분은 미분하면 단순해지는 항과 이미 적분값을 아는 항을 골라요."]};</script>
