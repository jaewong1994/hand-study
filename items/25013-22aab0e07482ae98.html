<script>window.HandStudyGuide={"itemId":25013,"sourceHash":"e31702733d0e1eb243f56b2197a0ccd2244fcd1c819957757e3165f80d08ebb1","contentHash":"fd5d1cc1f525629c8d12bf7739b017d1c86cbce3d6759d47aef9f776345c913b","overview":{"goal":"각 자연수 번호가 더 작은 번호에서 만들어지는 방식을 분류해, 값이 10인 항의 개수만 세는 점화식을 세워요.","firstLook":"항을 하나씩 끝없이 만들 필요는 없어요. 값이 1 늘어나는 짝수 번호 경로 하나와 값이 4 늘어나는 홀수 번호 경로 두 개가 있다는 점을 개수에 반영해요.","conditions":[{"label":"초기항","meaning":"\\(a_1=1\\), \\(a_3=4\\)는 점화식 바깥에서 따로 주어진 항이에요."},{"label":"번호 분류","meaning":"자연수는 \\(1,3\\), 양의 짝수, \\(5\\) 이상의 홀수로 중복 없이 나뉘어요."},{"label":"이전 번호","meaning":"각 규칙의 오른쪽 번호 n은 새 번호보다 작아 값을 거슬러 올라가는 과정이 끝나요."}]},"chapters":[{"id":"c1","label":"모든 자연수 번호의 생성 경로를 나눠요","stepIds":["s1","s2","s3","s4","s5"],"question":"각 번호는 어떤 더 작은 번호에서 유일하게 만들어질까요?","hint":"짝수는 \\(2n\\), \\(5\\) 이상의 홀수는 \\(4n+1\\) 또는 \\(4n+3\\) 중 하나예요.","explanation":"값이 \\(v\\)인 번호의 개수를 \\(N(v)\\)라 할게요. 번호 \\(1,3\\)은 초기항이고, 나머지 자연수는 \\(2n\\), \\(4n+1\\), \\(4n+3\\) 가운데 정확히 하나의 꼴이에요. 짝수 경로에서는 \\(a_{2n}=a_n+1\\), 두 홀수 경로에서는 \\(a_{4n+1}=a_{4n+3}=a_n+4\\)예요.\n\n세 종류는 서로 겹치지 않고 \\(n<2n,4n+1,4n+3\\)이므로 각 새 번호에는 더 작은 이전 번호가 하나뿐이에요. 따라서 서로 다른 생성 경로가 같은 번호를 중복해 세는 일도 없어요.","check":{"prompt":"번호 \\(13\\)은 두 홀수 꼴 중 어느 쪽인가요?","answer":"\\(13=4\\cdot3+1\\)이므로 \\(4n+1\\) 경로이고 이전 번호는 \\(3\\)이에요."}},{"id":"c2","label":"작은 값의 개수를 직접 확인해요","stepIds":["s6"],"question":"점화식을 시작하는 \\(N(1),N(2),N(3),N(4)\\)는 어떻게 얻을까요?","hint":"초기항과 작은 번호 몇 개를 규칙에 넣어 직접 확인해요.","explanation":"\\(a_1=1\\)이라 \\(N(1)=1\\)이고, \\(a_2=a_1+1=2\\)라 \\(N(2)=1\\)이에요. 이어서 \\(a_4=a_2+1=3\\)이므로 \\(N(3)=1\\)이에요.\n\n값 \\(4\\)는 주어진 \\(a_3=4\\)와 \\(a_8=a_4+1=4\\)에서 나오므로 \\(N(4)=2\\)예요. 값이 더 작은 이전 항에서만 새 항이 생기므로 이 확인으로 빠진 번호가 없어요.","check":{"prompt":"값이 \\(4\\)인 두 번호는 무엇인가요?","answer":"초기 번호 \\(3\\)과 짝수 경로로 생긴 번호 \\(8\\)이에요."}},{"id":"c3","label":"값의 개수 점화식을 세워 계산해요","stepIds":["s7","s8","s9"],"question":"값 \\(v\\)를 만드는 세 경로는 \\(N(v)\\)에 어떻게 기여할까요?","hint":"짝수 경로는 값 \\(v-1\\)인 번호마다 하나, 두 홀수 경로는 값 \\(v-4\\)인 번호마다 둘을 만들어요.","explanation":"값이 \\(v-1\\)인 번호 \\(n\\)마다 \\(2n\\)에서 값 \\(v\\)가 하나 생겨요. 또 값이 \\(v-4\\)인 번호마다 \\(4n+1,4n+3\\)에서 값 \\(v\\)가 두 개 생겨요. 따라서 \\(v\\ge5\\)에서\n\\[\nN(v)=N(v-1)+2N(v-4)\n\\]\n예요.\n\n초깃값을 넣으면 \\(N(5)=2+2\\cdot1=4\\), \\(N(6)=4+2\\cdot1=6\\), \\(N(7)=6+2\\cdot1=8\\), \\(N(8)=8+2\\cdot2=12\\), \\(N(9)=12+2\\cdot4=20\\), \\(N(10)=20+2\\cdot6=32\\)예요. 따라서 답은 \\(32\\)예요.","check":{"prompt":"\\(N(10)\\)에서 더하는 두 항은 무엇인가요?","answer":"\\(N(9)=20\\)과 \\(2N(6)=12\\)이므로 합은 \\(32\\)예요."}}],"takeaway":["재귀 수열의 번호를 서로 겹치지 않는 생성 규칙으로 나누면 항을 모두 나열하지 않고 값별 개수를 셀 수 있어요.","새 번호가 항상 더 큰지 확인하면 거슬러 올라가는 경로가 끝나고 중복이 없음을 보일 수 있어요.","개수 점화식은 각 생성 규칙이 이전 값 하나에서 새 번호를 몇 개 만드는지 계수로 반영해요."]};</script>
