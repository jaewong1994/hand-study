<script>window.HandStudyRecord={"itemId":18040,"sourceLabel":"2024 평가원 고3 수학기하 6월 30번","adminYear":2024,"grade":3,"month":6,"number":30,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"두 초점이 $F (5,\\,0)$, $F ' (-5,\\,0)$이고, 주축의 길이가 $6$인 쌍곡선이 있다. 쌍곡선 위의 $\\overline{\\mathrm{PF}} < \\overline{\\mathrm{PF'}}$인 점 $P$에 대하여 점 $Q$가\n $\\left( \\left| {\\vec{ FP }} \\right| +1 \\right) {\\vec{ F ' Q }} =5 {\\vec{ QP }}$\n를 만족시킨다. 점 $A (-9,\\,-3)$에 대하여 $\\left| {\\vec{ AQ }} \\right|$의 최댓값을 구하시오. [4점]","answer":"10","sourceHash":"4212c0473c4ef509e26ea5fd19b2c693e821877972fb9e7215b3d50cbf8bb658","steps":[{"id":"s1","latex":"|F^{\\prime}P|=|FP|+6"},{"id":"s2","latex":"(|FP|+1)\\vec{F^{\\prime}Q}=5(\\vec{F^{\\prime}P}-\\vec{F^{\\prime}Q})"},{"id":"s3","latex":"(|FP|+6)\\vec{F^{\\prime}Q}=5\\vec{F^{\\prime}P}\\Rightarrow|F^{\\prime}Q|=5"},{"id":"s4","latex":"Q\\text{는 중심 }F^{\\prime}\\text{, 반지름 }5\\text{인 원 위}"},{"id":"s5","latex":"AF^{\\prime}=5,\\ F^{\\prime}Q=5\\Rightarrow AQ\\text{의 최댓값은 }10"},{"id":"s6","latex":"Q=(-1,3),\\ P=(39/5,48/5)\\text{에서 등호 성립}:\\quad x_P^2/9-y_P^2/16=1,\\ AQ=10"}],"diagram":null,"contentHash":"3209937e94bfa3dbe1195bbf4d1160ef48261f9334dcb920e04ea36b744630e9","questionHtml":"<p class=\"hp htall\">두 초점이 <span class=\"heq\">\\({{F}} (5,\\,0)\\)<\/span>, <span class=\"heq\">\\({{F}}' (-5,\\,0)\\)<\/span>이고, 주축의 길이가 <span class=\"heq\">\\(6\\)<\/span>인 쌍곡선이 있다. 쌍곡선 위의 <span class=\"heq\">\\(\\overline{{{PF}} }\\lt  \\overline{{{PF}}' }\\)<\/span>인 점 <span class=\"heq\">\\({{P}}\\)<\/span>에 대하여 점 <span class=\"heq\">\\({{Q}}\\)<\/span>가<\/p><p class=\"hp\">&emsp;&emsp;<span class=\"heq\">\\(\\left( \\left| {\\overrightarrow{FP}} \\right| +1 \\right) {\\vec{F' Q }} =5 {\\overrightarrow{QP}}\\)<\/span><\/p><p class=\"hp\">를 만족시킨다. 점 <span class=\"heq\">\\({{A}} (-9,\\,-3)\\)<\/span>에 대하여 <span class=\"heq\">\\(\\left| {\\overrightarrow{AQ}} \\right|\\)<\/span>의 최댓값을 구하시오. <span class=\"hscore\">[4점]<\/span><\/p>","preview":false <script>window.HandStudyGuide={"itemId":18040,"sourceHash":"4212c0473c4ef509e26ea5fd19b2c693e821877972fb9e7215b3d50cbf8bb658","contentHash":"3209937e94bfa3dbe1195bbf4d1160ef48261f9334dcb920e04ea36b744630e9","overview":{"goal":"쌍곡선의 거리 차를 벡터식에 넣어 Q의 자취를 원으로 만들고 A에서 가장 먼 거리를 구해요.","firstLook":"P는 F에 더 가까운 가지에 있으므로 \\(PF'=PF+6\\)이에요. 벡터식도 기준점을 F'로 통일해요.","conditions":[{"label":"쌍곡선","meaning":"\\(PF'-PF=6\\)이에요."},{"label":"벡터 등식","meaning":"Q는 F'P를 일정한 비로 나누며, 그 비가 쌍곡선 거리식과 약분돼요."}]},"chapters":[{"id":"c1","label":"벡터식의 기준점을 통일해요","stepIds":["s1","s2","s3"],"question":"왜 \\(F'Q\\)의 길이가 P와 무관하게 5가 될까요?","hint":"\\(\\vec{QP}=\\vec{F'P}-\\vec{F'Q}\\)로 바꿔요.","explanation":"P가 F에 가까운 가지에 있으므로 \\(PF'=PF+6\\)이에요. 주어진 식은 \\((PF+1)\\vec{F'Q}=5(\\vec{F'P}-\\vec{F'Q})\\)예요. 오른쪽의 \\(5\\vec{F'Q}\\)를 왼쪽으로 옮기면 \\((PF+6)\\vec{F'Q}=5\\vec{F'P}\\)가 돼요. \\(PF+6=PF'\\)이고 두 벡터는 같은 방향이므로 길이를 비교해 \\(PF'\\cdot F'Q=5PF'\\), 따라서 \\(F'Q=5\\)예요.","check":{"prompt":"\\(PF'\\)로 나눌 수 있는 이유는 무엇인가요?","answer":"P와 F'은 다른 점이므로 \\(PF'>0\\)이에요."}},{"id":"c2","label":"Q의 자취에서 거리의 상한을 찾아요","stepIds":["s4","s5"],"question":"A에서 Q까지의 거리가 왜 10을 넘지 않을까요?","hint":"Q는 중심 F', 반지름 5인 원 위이고 \\(AF'=5\\)예요.","explanation":"Q는 중심 F'(-5,0), 반지름 5인 원 위를 움직여요. A(-9,-3)에서 F'까지의 거리는 \\(\\sqrt{(-4)^2+(-3)^2}=5\\)예요. 삼각부등식으로 \\(AQ\\le AF'+F'Q=5+5=10\\)이에요. 등호가 되려면 A,F',Q가 한 직선 위에서 F'이 A와 Q 사이에 있어야 해요.","check":{"prompt":"거리 10이 나오려면 Q는 원의 어느 쪽 점이어야 하나요?","answer":"A에서 F'을 지나 같은 방향으로 5만큼 더 간 원 위의 점이어야 해요."}},{"id":"c3","label":"등호가 실제 가능한지 확인해요","stepIds":["s6"],"question":"원의 가장 먼 점이 원래 P 조건에서도 만들어질까요?","hint":"제시된 Q와 P를 쌍곡선 식과 벡터식에 직접 넣어요.","explanation":"등호점은 \\(Q=(-1,3)\\)이고, 이에 대응하는 \\(P=(39/5,48/5)\\)를 잡을 수 있어요. 쌍곡선의 식 \\(x^2/9-y^2/16=1\\)에 P를 넣으면 \\(1521/225-2304/400=1\\)이 되고, P는 F 쪽 가지에 있어 거리 차 조건도 맞아요. 따라서 상한 10은 실제로 도달하며 최댓값은 10이에요.","check":{"prompt":"상한만 구하고 끝내면 부족한 이유는 무엇인가요?","answer":"그 원 위의 점 Q가 실제 쌍곡선 위 P와 벡터식을 만족하는지 확인해야 최댓값이라고 할 수 있어요."}}],"takeaway":["쌍곡선에서는 어느 초점에 가까운 가지인지 보고 거리 차의 방향을 정해요.","벡터식을 한 기준점으로 바꾸면 Q의 일정한 거리 자취가 드러나요.","거리의 상한을 구한 뒤 등호를 만드는 원래 조건의 점이 실제 존재하는지 확인해요."]};</script>
