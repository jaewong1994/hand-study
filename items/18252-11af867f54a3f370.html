y":"\\(\\theta=\\pi/6\\)이면 \\(A,M,P\\)가 한 직선 위에 놓여 이차식의 두 해가 \\(1,3\\)입니다. 그림의 반원에서 \\(P\\)는 \\(M\\)을 지나 \\(A\\)의 반대쪽에 있으므로 \\(AP=AM+MP=3\\)인 가지를 골라야 합니다.","skillTags":["geometric-branch","root-selection"],"title":"t=1이 아니라 3을 고르는 까닭"},"s4":{"body":"\\(t^2-4t\\cos(\\pi/6-\\theta)+3=0\\)을 \\(\\theta\\)로 미분합니다. \\(\\theta=\\pi/6\\)에서는 \\(\\sin(\\pi/6-\\theta)=0\\)이므로 각을 미분해서 생기는 항이 사라지고 \\(2(t-2)t'=0\\)만 남습니다. \\(t=3\\)이어서 \\(t'=0\\)입니다.","skillTags":["implicit-differentiation","boundary-substitution"],"title":"암묵적으로 미분할 때 사라지는 항"}},"steps":[{"id":"s1","latex":"M=\\text{반원의 중심},\\quad AM=2,\\ BM=MP=1,\\quad AP=t"},{"id":"s2","latex":"\\angle BAM=\\frac\\pi6,\\quad t^2-4t\\cos\\left(\\frac\\pi6-\\theta\\right)+3=0"},{"id":"s3","latex":"\\theta=\\pi/6:\\quad t=1\\text{ 또는 }3;\\quad P\\text{는 }BC\\text{의 }A\\text{ 반대쪽}\\Rightarrow t=3"},{"id":"s4","latex":"\\theta=\\frac\\pi6\\Rightarrow t=3,\\quad 2(t-2)t^{\\prime}=0\\Rightarrow t^{\\prime}=0"},{"id":"s5","latex":"f(\\theta)=\\frac{\\sqrt3}{2}t\\sin\\theta\\Rightarrow20f^{\\prime}\\left(\\frac\\pi6\\right)=45"}],"track":"미적분"};</script>
<script>window.HandStudyGuide={"itemId":18252,"sourceHash":"bf3c7447fc364f13bd89d8deae7af9b2e18f8a87265040b586f5e26f1f4d159c","contentHash":"22415c55217b5f1567f8c2d3d9487288f2e77040cc9d50457cecfd38544ee398","overview":{"goal":"반원의 중심과 움직이는 점이 만드는 삼각형에서 길이의 변화율을 구해 넓이의 변화율을 계산해요.","firstLook":"원의 중심을 잇고 코사인법칙을 쓰면 움직이는 길이 \\(AP\\)와 각 \\(\\theta\\) 사이의 식을 만들 수 있어요.","conditions":[{"label":"지름이 정해진 반원","meaning":"중심에서 호 위의 점까지의 거리는 반지름으로 일정해요."},{"label":"점이 직선의 반대쪽 호에 위치","meaning":"같은 방향에서 생기는 두 교점 중 문제의 반원 위에 놓인 점을 골라요."}]},"chapters":[{"id":"c1","label":"중심을 이용한 길이 관계","stepIds":["s1","s2"],"question":"중심을 \\(M\\)이라 할 때 삼각형 \\(AMP\\)에서 일정한 두 길이는 무엇인가요?","hint":"\\(M\\)은 지름 \\(BC\\)의 중점이고 \\(P\\)는 반원 위에 있어요.","explanation":"\\(M\\)은 반원의 중심이므로 \\(BM=MP=1\\)이에요. 주어진 직각삼각형에서 \\(AB=\\sqrt3\\), \\(BM=1\\)이어서 \\(AM=\\sqrt{3+1}=2\\)이고 \\(\\angle BAM=\\pi/6\\)이에요. \\(AP=t\\), \\(\\angle BAP=\\theta\\)라 하면 \\(\\angle MAP=\\pi/6-\\theta\\)예요.\n\n삼각형 \\(AMP\\)에 코사인법칙을 쓰면 \\(MP^2=t^2+2^2-4t\\cos(\\pi/6-\\theta)\\)예요. \\(MP=1\\)이므로 \\(t^2-4t\\cos(\\pi/6-\\theta)+3=0\\)을 얻어요.","check":{"prompt":"코사인법칙의 교차항이 왜 \\(-4t\\cos(\\pi/6-\\theta)\\)인가요?","answer":"두 변의 길이가 \\(t,2\\)이므로 \\(-2\\cdot t\\cdot2\\cos(\\pi/6-\\theta)\\)예요."}},{"id":"c2","label":"해의 선택과 길이 변화율","stepIds":["s3","s4"],"question":"\\(\\theta=\\pi/6\\)에서 나온 \\(t=1,3\\) 중 어떤 값을 선택하나요?","hint":"이때 \\(A,M,P\\)가 한 직선에 놓이고, 문제의 점 \\(P\\)가 놓인 반원의 쪽을 확인하세요.","explanation":"\\(\\theta=\\pi/6\\)이면 \\(\\angle MAP=0\\)이라 식은 \\(t^2-4t+3=0\\), 즉 \\(t=1\\) 또는 \\(3\\)이에요. 중심 \\(M\\)을 지나 같은 직선에서 원과 만나는 두 점 중 문제에서 지정한 \\(BC\\)의 \\(A\\) 반대쪽 반원 위의 점은 \\(A\\)에서 더 먼 교점이므로 \\(t=3\\)이에요.\n\n관계식을 미분하면 \\(2tt'-4t'\\cos u-4t\\sin u=0\\), 여기서 \\(u=\\pi/6-\\theta\\)예요. \\(u=0,t=3\\)을 넣으면 \\(6t'-4t'=0\\)이므로 \\(t'=0\\)이에요.","check":{"prompt":"관계식을 미분한 뒤 \\(u=0\\)에서 사라지는 항은 무엇인가요?","answer":"\\(\\sin0=0\\)이므로 \\(-4t\\sin u\\) 항이 사라져요."}},{"id":"c3","label":"삼각형 넓이의 변화율","stepIds":["s5"],"question":"넓이식에서 \\(t'=0\\)이어도 남는 변화율은 어느 항에서 나오나요?","hint":"\\(f=(\\sqrt3/2)t\\sin\\theta\\)를 곱의 미분법으로 미분하세요.","explanation":"삼각형의 두 변 \\(AB=\\sqrt3\\), \\(AP=t\\)와 끼인각 \\(\\theta\\)를 쓰면 \\(f(\\theta)=\\frac{\\sqrt3}{2}t\\sin\\theta\\)예요. 따라서 \\(f'=\\frac{\\sqrt3}{2}(t'\\sin\\theta+t\\cos\\theta)\\)이고, \\(\\theta=\\pi/6,t=3,t'=0\\)을 넣으면 \\(f'=\\frac{\\sqrt3}{2}\\cdot3\\cdot\\frac{\\sqrt3}{2}=9/4\\)예요. 그러므로 \\(20f'(\\pi/6)=45\\)예요.","check":{"prompt":"\\(20\\)을 곱한 마지막 값은 어떻게 계산하나요?","answer":"\\(20\\cdot9/4=5\\cdot9=45\\)예요."}}],"takeaway":["원 위의 움직이는 점은 중심과 이으면 일정한 반지름을 얻어요.","방정식에 여러 양의 해가 나오면 점이 놓인 반원의 방향으로 선택해요.","길이 변화율이 0인 순간에도 각의 변화 때문에 넓이는 변할 수 있어요."]};</script>
