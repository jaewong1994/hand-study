  <script>window.HandStudyRecord={"adminYear":2019,"answer":"②","contentHash":"9ef887f5ffe228e6cb775628816265a94f2db1f9e7d793eed6148a43ff9e8146","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24691,"month":11,"number":20,"points":4,"preview":false,"questionHtml":"\u003cp>함수\u003c/p>\u003cp> \u003cspan class=\"heq\">\\(f(x)=\\begin{cases}\\, - x \\,&amp; (x≤ 0) \\\\ \\, x - 1 \\,&amp; (0 &lt; x≤ 2) \\\\ \\, 2x - 3 \\,&amp; (x&gt; 2)\\end{cases}\\)\u003c/span>\u003c/p>\u003cp>와 상수가 아닌 다항식 \u003cspan class=\"heq\">\\(p(x)\\)\u003c/span>에 대하여 &lt;보기&gt;에서 옳은 것만을 있는 대로 고른 것은? [4점]\u003c/p>\u003cp>&lt;보 기&gt;ㄱ. 함수 \u003cspan class=\"heq\">\\(p(x)f(x)\\)\u003c/span>가 실수 전체의 집합에서 연속이면 \u003cspan class=\"heq\">\\(p(0)=0\\)\u003c/span>이다.ㄴ. 함수 \u003cspan class=\"heq\">\\(p(x)f(x)\\)\u003c/span>가 실수 전체의 집합에서 미분가능하면 \u003cspan class=\"heq\">\\(p(2)=0\\)\u003c/span>이다.ㄷ. 함수 \u003cspan class=\"heq\">\\(p(x) \\left\\{\\,f(x) \\right\\}^{2}\\)\u003c/span>이 실수 전체의 집합에서 미분가능하면 \u003cspan class=\"heq\">\\(p(x)\\)\u003c/span>는 \u003cspan class=\"heq\">\\(x^{2}(x-2)^{2}\\)\u003c/span>으로 나누어떨어진다.\u003c/p>\u003cdiv class=\"hchoices\">\u003cdiv class=\"hch\">① ㄱ\u003c/div>\u003cdiv class=\"hch\">② ㄱ, ㄴ\u003c/div>\u003cdiv class=\"hch\">③ ㄱ, ㄷ\u003c/div>\u003cdiv class=\"hch\">④ ㄴ, ㄷ\u003c/div>\u003cdiv class=\"hch\">⑤ ㄱ, ㄴ, ㄷ\u003c/div>\u003c/div>","questionText":"함수\n $f(x)=\\begin{cases}\\, - x \\,& (x≤ 0) \\\\ \\, x - 1 \\,& (0 \u003c x≤ 2) \\\\ \\, 2x - 3 \\,& (x> 2)\\end{cases}$\n와 상수가 아닌 다항식 $p(x)$에 대하여 \u003c보기>에서 옳은 것만을 있는 대로 고른 것은? [4점]\n\u003c보 기>ㄱ. 함수 $p(x)f(x)$가 실수 전체의 집합에서 연속이면 $p(0)=0$이다.ㄴ. 함수 $p(x)f(x)$가 실수 전체의 집합에서 미분가능하면 $p(2)=0$이다.ㄷ. 함수 $p(x) \\left\\{\\,f(x) \\right\\}^{2}$이 실수 전체의 집합에서 미분가능하면 $p(x)$는 $x^{2}(x-2)^{2}$으로 나누어떨어진다.\n① ㄱ ② ㄱ, ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","sourceHash":"e1cc4d6c2e066bcecefdc0ac7363fb22f6e1f17163798a4b0d2551927d89b1fd","sourceKind":"csat","sourceLabel":"2019년 시행 수능 · 2020학년도 · 나형 · 20번","steps":[{"id":"s1","latex":"\\text{ㄱ: }\\lim_{x\\to0-}p(x)f(x)=0,\\quad\\lim_{x\\to0+}p(x)f(x)=-p(0)"},{"id":"s2","latex":"\\text{연속이면 }-p(0)=0\\ \\Rightarrow\\ p(0)=0\\quad\\text{참}"},{"id":"s3","latex":"\\text{ㄴ: }x=2\\text{에서 왼쪽 미분계수}=p\\prime(2)+p(2)"},{"id":"s4","latex":"\\text{오른쪽 미분계수}=p\\prime(2)+2p(2)"},{"id":"s5","latex":"\\text{두 값이 같으면 }p(2)=0\\quad\\text{참}"},{"id":"s6","latex":"\\text{ㄷ: }p(x)=x^2(x-2),\\quad h(x)=p(x)f(x)^2\\text{로 둔다.}"},{"id":"s7","latex":"h(0)=0,\\quad\\lim_{x\\to0-}\\frac{h(x)}x=\\lim_{x\\to0+}\\frac{h(x)}x=0"},{"id":"s8","latex":"h(2)=0,\\quad\\lim_{x\\to2-}\\frac{h(x)}{x-2}=\\lim_{x\\to2+}\\frac{h(x)}{x-2}=4"},{"id":"s9","latex":"\\text{그 밖에서는 다항식이므로 }h\\text{는 모든 실수에서 미분가능}"},{"id":"s10","latex":"p(x)=x^2(x-2)\\text{는 }x^2(x-2)^2\\text{으로 나누어떨어지지 않는다.}\\quad\\text{ㄷ 거짓}"},{"id":"s11","latex":"\\boxed{\\text{ㄱ, ㄴ}}\\quad\\text{②}"}],"track":"나형"};</script>
