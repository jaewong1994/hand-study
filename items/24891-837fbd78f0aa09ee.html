(x)-g(x),\\quad h'(a)=0\\text{은 접점의 정의로 항상 성립한다.}"},{"explanation":{"body":"접선은 접점에서 곡선과 만나므로 \\(h'(a)=0\\)은 언제나 성립합니다. 하지만 극값이 되려면 \\(h'=f-g\\)의 부호가 좌우에서 바뀌어야 합니다. 즉 곡선이 접선의 한쪽에서 다른 쪽으로 넘어가는 변곡점이어야 합니다.","skillTags":["접선","변곡점","극값판정"],"title":"접점인데도 극값이 되려면"},"id":"s2","latex":"h\\text{가 }x=a\\text{에서 극값을 가지려면 접선과 곡선의 위아래 관계가 }a\\text{의 좌우에서 바뀌어야 한다.}"},{"id":"s3","latex":"\\text{이는 }a\\text{가 }f\\text{의 변곡점일 때이다.}"},{"id":"s4","latex":"f''(x)=\\cos2x\\ (\\sin x>0),\\qquad f''(x)=-\\cos2x\\ (\\sin x\u003c0)"},{"id":"s5","latex":"\\cos2x=0\\Rightarrow x=\\frac\\pi4,\\frac{3\\pi}4,\\frac{5\\pi}4,\\frac{7\\pi}4,\\ldots"},{"id":"s6","latex":"x=n\\pi\\text{에서도 }f''\\text{의 좌우 부호가 바뀌므로 변곡점이다.}"},{"id":"s7","latex":"a_1=\\frac\\pi4,\\ a_2=\\frac{3\\pi}4,\\ a_3=\\pi,\\ a_4=\\frac{5\\pi}4,\\ a_5=\\frac{7\\pi}4,\\ a_6=2\\pi"},{"id":"s8","latex":"\\frac{100}{\\pi}(a_6-a_2)=\\frac{100}{\\pi}\\left(2\\pi-\\frac{3\\pi}{4}\\right)=125"},{"id":"s9","latex":"\\therefore\\ \\boxed{125}"}],"track":"미적분"};</script>
