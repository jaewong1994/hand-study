  <script>window.HandStudyRecord={"adminYear":2023,"answer":"125","contentHash":"052d8495a482bf714e231ab429bb6925f4f159868513a0140653d485fcce1bc2","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24891,"month":11,"number":30,"points":4,"preview":false,"questionHtml":"\u003cp>실수 전체의 집합에서 미분가능한 함수 \u003cspan class=\"heq\">\\(f(x)\\)\u003c/span>의 도함수 \u003cspan class=\"heq\">\\(f &#x27; (x)\\)\u003c/span>가\u003c/p>\u003cp> \u003cspan class=\"heq\">\\(f&#x27; \\left(x \\right)= \\left| \\sin x \\right| \\cos x\\)\u003c/span>\u003c/p>\u003cp>이다. 양수 \u003cspan class=\"heq\">\\(a\\)\u003c/span>에 대하여 곡선 \u003cspan class=\"heq\">\\(y=f(x)\\)\u003c/span> 위의 점 \u003cspan class=\"heq\">\\((a,\\, f(a))\\)\u003c/span>에서의 접선의 방정식을 \u003cspan class=\"heq\">\\(y=g(x)\\)\u003c/span>라 하자. 함수\u003c/p>\u003cp> \u003cspan class=\"heq\">\\(h \\left(x \\right)= \\int _{0} ^{x} {} \\left\\{ f \\left(t \\right)-g \\left(t \\right) \\right\\} dt\\)\u003c/span>\u003c/p>\u003cp>가 \u003cspan class=\"heq\">\\(x=a\\)\u003c/span>에서 극대 또는 극소가 되도록 하는 모든 양수 \u003cspan class=\"heq\">\\(a\\)\u003c/span>를 작은 수부터 크기순으로 나열할 때, \u003cspan class=\"heq\">\\(n\\)\u003c/span>번째 수를 \u003cspan class=\"heq\">\\(a_{n}\\)\u003c/span>이라 하자. \u003cspan class=\"heq\">\\(\\frac{100}{ \\pi} \\times \\left(a_{6}-a_{2} \\right)\\)\u003c/span>의 값을 구하시오. [4점]\u003c/p>","questionText":"실수 전체의 집합에서 미분가능한 함수 $f(x)$의 도함수 $f \\,' (x)$가\n $f\\, ' \\left(x \\right)= \\left| \\sin x \\right| \\cos x$\n이다. 양수 $a$에 대하여 곡선 $y=f(x)$ 위의 점 $(a,\\, f(a))$에서의 접선의 방정식을 $y=g(x)$라 하자. 함수\n $h \\left(x \\right)= \\int _{0} ^{x} {} \\left\\{ f \\left(t \\right)-g \\left(t \\right) \\right\\} dt$\n가 $x=a$에서 극대 또는 극소가 되도록 하는 모든 양수 $a$를 작은 수부터 크기순으로 나열할 때, $n$번째 수를 $a_{n}$이라 하자. $\\frac{100}{ \\pi} \\times \\left(a_{6}-a_{2} \\right)$의 값을 구하시오. [4점]","sourceHash":"fcd697bfe3405cea7edcd5933f9871470c3d9fc69ff9b5d19001b9eb36a39e33","sourceKind":"csat","sourceLabel":"2023년 시행 수능 · 2024학년도 · 미적분 · 30번","steps":[{"id":"s1","latex":"h'(x)=f(x)-g(x),\\quad h'(a)=0\\text{은 접점의 정의로 항상 성립한다.}"},{"explanation":{"body":"접선은 접점에서 곡선과 만나므로 \\(h'(a)=0\\)은 언제나 성립합니다. 하지만 극값이 되려면 \\(h'=f-g\\)의 부호가 좌우에서 바뀌어야 합니다. 즉 곡선이 접선의 한쪽에서 다른 쪽으로 넘어가는 변곡점이어야 합니다.","skillTags":["접선","변곡점","극값판정"],"title":"접점인데도 극값이 되려면"},"id":"s2","latex":"h\\text{가 }x=a\\text{에서 극값을 가지려면 접선과 곡선의 위아래 관계가 }a\\text{의 좌우에서 바뀌어야 한다.}"},{"id":"s3","latex":"\\text{이는 }a\\text{가 }f\\text{의 변곡점일 때이다.}"},{"id":"s4","latex":"f''(x)=\\cos2x\\ (\\sin x>0),\\qquad f''(x)=-\\cos2x\\ (\\sin x\u003c0)"},{"id":"s5","latex":"\\cos2x=0\\Rightarrow x=\\frac\\pi4,\\frac{3\\pi}4,\\frac{5\\pi}4,\\frac{7\\pi}4,\\ldots"},{"id":"s6","latex":"x=n\\pi\\text{에서도 }f''\\text{의 좌우 부호가 바뀌므로 변곡점이다.}"},{"id":"s7","latex":"a_1=\\frac\\pi4,\\ a_2=\\frac{3\\pi}4,\\ a_3=\\pi,\\ a_4=\\frac{5\\pi}4,\\ a_5=\\frac{7\\pi}4,\\ a_6=2\\pi"},{"id":"s8","latex":"\\frac{100}{\\pi}(a_6-a_2)=\\frac{100}{\\pi}\\left(2\\pi-\\frac{3\\pi}{4}\\right)=125"},{"id":"s9","latex":"\\therefore\\ \\boxed{125}"}],"track":"미적분"};</script>
