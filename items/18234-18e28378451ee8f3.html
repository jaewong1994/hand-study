<script>window.HandStudyGuide={"itemId":18234,"sourceHash":"cab052318230b4fc10c5fe53b4500392cb17c747b11f9ce293c6c575c032037d","contentHash":"ee1da3c4127f0e9387981b87f18b6cf175bb46f2b5cc1fce8060e8bade3c6efd","overview":{"goal":"두 급수로 등비수열을 정한 뒤 결과가 양의 정수가 되는 \\(m\\)의 최댓값을 구해요.","firstLook":"\\(\\sin(n\\pi/2)\\)는 홀수 \\(n\\)에서만 \\(1\\) 또는 \\(-1\\)이므로 둘째 급수는 공비가 \\(-|r|^2\\)인 등비급수로 묶여요.","conditions":[{"label":"수렴 범위","meaning":"첫 등비급수가 수렴하므로 공비 \\(r\\)은 \\(|r|<1\\)예요."}]},"chapters":[{"id":"c1","label":"첫 급수로 첫째항과 공비의 관계 세우기","stepIds":["s1","s2"],"question":"첫 급수의 합이 왜 \\(a(1+r)/(1-r)\\)인가요?","hint":"\\(a_n+a_{n+1}=a(1+r)r^{n-1}\\)로 묶으세요.","explanation":"\\(a_n=ar^{n-1}\\), \\(|r|<1\\)로 두어요. \\(a_n+a_{n+1}=a(1+r)r^{n-1}\\)이므로 합은 \\(a(1+r)/(1-r)=5\\). 따라서 \\(a(1+r)=5(1-r)\\)예요.","check":{"prompt":"\\(r=-1\\)은 왜 고려하지 않나요?","answer":"급수가 수렴하려면 \\(|r|<1\\)이어야 하므로 제외돼요."}},{"id":"c2","label":"사인 급수로 공비 결정하기","stepIds":["s3","s4","s5"],"question":"둘째 급수의 분모가 \\(1+r^2\\)인 이유는 무엇인가요?","hint":"\\(n=1,3,5,\\ldots\\)만 남기고 사인값의 부호가 번갈아 바뀌는 것을 보세요.","explanation":"\\(|a_{n+1}+a_{n+2}|=|a(1+r)||r|^n=5(1-r)|r|^n\\)예요. 짝수 \\(n\\)에서는 사인값이 0이고, \\(n=1,3,5,\\ldots\\)에서는 부호가 \\(+, -, +,\\ldots\\)로 바뀌므로 합은 \\(5(1-r)|r|/(1+r^2)=2\\)예요. \\(r>0\\)이면 \\(7r^2-5r+2=0\\)인데 판별식이 \\(-31\\)이라 불가능해요. \\(r=-u<0\\)이면 \\(3u^2+5u-2=0\\)이고 \\(0<u<1\\)인 근은 \\(u=1/3\\)예요. 따라서 \\(r=-1/3\\)이고 첫 관계에서 \\(a=10\\)예요.","check":{"prompt":"\\(u\\)의 다른 근 -2를 버리는 이유는 무엇인가요?","answer":"\\(u=-r\\)는 \\(0<u<1\\)이어야 하기 때문이에요."}},{"id":"c3","label":"자연수 조건으로 최댓값 찾기","stepIds":["s6","s7","s8"],"question":"\\(m\\)이 14의 배수여야 하는 이유는 무엇인가요?","hint":"15와 14가 서로소라는 점을 쓰세요.","explanation":"\\(\\sum 100a_n=100\\cdot 10/(1+1/3)=750\\). 또 \\(a_{3n}\\)의 첫 항은 10/9, 공비는 -1/27이므로 합은 \\((10/9)/(1+1/27)=15/14\\)예요. 요구 합은 \\(750-15m/14\\). 이것이 정수이려면 14가 \\(m\\)을 나누므로 \\(m=14k\\)예요. 양의 자연수여야 하므로 \\(750-15k>0\\), 즉 \\(1\\le k\\le 49\\). 따라서 \\(m\\)의 최댓값은 \\(14\\cdot 49=686\\)예요.","check":{"prompt":"\\(k=50\\)을 포함하지 않는 이유는 무엇인가요?","answer":"그때 합이 0이 되어 이 문제에서 말하는 양의 자연수가 아니기 때문이에요."}}],"takeaway":["주기적인 사인 값이 곱해진 급수는 0이 아닌 항만 골라 새 등비급수로 만들어요.","유리식이 자연수가 되는 조건은 먼저 정수 조건, 다음에 양수 조건을 확인해요."]};</script>
