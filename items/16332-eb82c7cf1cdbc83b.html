  <script>window.HandStudyRecord={"itemId":16332,"sourceLabel":"2019 교육청 고3 수리가형 7월 20번","adminYear":2019,"grade":3,"month":7,"number":20,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"실수 전체의 집합에서 미분가능한 함수 $f \\left( x \\right) \\,$가 모든 실수 $x\\,$에 대하여 $f \\left(1+x \\right)=f \\left(1-x \\right)\\,$, $f \\left(2+x \\right)=f \\left(2-x \\right)\\,$ 를 만족시킨다. 실수 전체의 집합에서 $f ' \\left( x \\right)\\,$가 연속이고, $\\int _{2} ^{5} {f ' \\left(x \\right)dx=4}\\,$일 때, \u003c보기>에서 옳은 것만을 있는 대로 고른 것은? [4점]\n\u003c보 기>ㄱ. 모든 실수 $x$에 대하여 $f \\left( x+2 \\right)=f \\left( x \\right)\\,$이다.ㄴ. $f \\left( 1 \\right) -f \\left( 0 \\right) =4$ ㄷ. $\\int _{0} ^{1} {f \\left( f \\left( x \\right) \\right) f' \\left( x \\right) dx=6}\\,$일 때, $\\int _{1} ^{10} {f \\left(x \\right)dx}\\,= \\frac{ 27}{ 2}$ 이다.\n① ㄱ ② ㄷ ③ ㄱ, ㄴ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","answer":"⑤","sourceHash":"ab19caab3d6ff8dbe5798f5bfcba3d084eb8c981abd59ecc1e5dc0d80b08cd3e","steps":[{"id":"s1","latex":"f(x+2)=f(2-x)=f(x)\\Rightarrow\\text{주기 }2"},{"id":"s2","latex":"\\int_2^5f'=f(5)-f(2)=4\\Rightarrow f(1)-f(0)=4"},{"id":"s3","latex":"t=f(x)\\Rightarrow\\int_{f(0)}^{f(0)+4}f(t)dt=6"},{"id":"s4","latex":"\\text{두 주기의 적분이 }6\\Rightarrow\\int_0^2f=3"},{"id":"s5","latex":"x=1\\text{ 대칭}\\Rightarrow\\int_0^1f=\\frac32"},{"id":"s6","latex":"\\int_1^{10}f=4\\cdot3+\\frac32=\\frac{27}{2}"},{"id":"s7","latex":"\\therefore\\ \\text{세 명제 모두 참}"}],"diagram":null,"contentHash":"066538df03204861172b1e13ecee61f078e72df390041d8ab4843d9451753715","questionHtml":"\u003cp class=\"hp\">실수 전체의 집합에서 미분가능한 함수 \u003cspan class=\"heq\">\\(f \\left( x \\right) \\,\\)\u003c/span>가 모든 실수 \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>에 대하여 \u003cbr>\u003cbr>     \u003cspan class=\"heq\">\\(f \\left(1+x \\right)=f \\left(1-x \\right)\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(f \\left(2+x \\right)=f \\left(2-x \\right)\\,\\)\u003c/span>\u003cbr>\u003cbr>를 만족시킨다. 실수 전체의 집합에서 \u003cspan class=\"heq\">\\(f' \\left( x \\right)\\,\\)
