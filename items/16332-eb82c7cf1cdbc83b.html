<script>window.HandStudyRecord={"itemId":16332,"sourceLabel":"2019 교육청 고3 수리가형 7월 20번","adminYear":2019,"grade":3,"month":7,"number":20,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"실수 전체의 집합에서 미분가능한 함수 $f \\left( x \\right) \\,$가 모든 실수 $x\\,$에 대하여 $f \\left(1+x \\right)=f \\left(1-x \\right)\\,$, $f \\left(2+x \\right)=f \\left(2-x \\right)\\,$ 를 만족시킨다. 실수 전체의 집합에서 $f ' \\left( x \\right)\\,$가 연속이고, $\\int _{2} ^{5} {f ' \\left(x \\right)dx=4}\\,$일 때, \u003c보기>에서 옳은 것만을 있는 대로 고른 것은? [4점]\n\u003c보 기>ㄱ. 모든 실수 $x$에 대하여 $f \\left( x+2 \\right)=f \\left( x \\right)\\,$이다.ㄴ. $f \\left( 1 \\right) -f \\left( 0 \\right) =4$ ㄷ. $\\int _{0} ^{1} {f \\left( f \\left( x \\right) \\right) f' \\left( x \\right) dx=6}\\,$일 때, $\\int _{1} ^{10} {f \\left(x \\right)dx}\\,= \\frac{ 27}{ 2}$ 이다.\n① ㄱ ② ㄷ ③ ㄱ, ㄴ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","answer":"⑤","sourceHash":"ab19caab3d6ff8dbe5798f5bfcba3d084eb8c981abd59ecc1e5dc0d80b08cd3e","steps":[{"id":"s1","latex":"f(x+2)=f(2-x)=f(x)\\Rightarrow\\text{주기 }2"},{"id":"s2","latex":"\\int_2^5f'=f(5)-f(2)=4\\Rightarrow f(1)-f(0)=4"},{"id":"s3","latex":"t=f(x)\\Rightarrow\\int_{f(0)}^{f(0)+4}f(t)dt=6"},{"id":"s4","latex":"\\text{두 주기의 적분이 }6\\Rightarrow\\int_0^2f=3"},{"id":"s5","latex":"x=1\\text{ 대칭}\\Rightarrow\\int_0^1f=\\frac32"},{"id":"s6","latex":"\\int_1^{10}f=4\\cdot3+\\frac32=\\frac{27}{2}"},{"id":"s7","latex":"\\therefore\\ \\text{세 명제 모두 참}"}],"diagram":null,"contentHash":"066538df03204861172b1e13ecee61f078e72df390041d8ab4843d9451753715","questionHtml":"\u003cp class=\"hp\">실수 전체의 집합에서 미분가능한 함수 \u003cspan class=\"heq\">\\(f \\left( x \\right) \\,\\)\u003c/span>가 모든 실수 \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>에 대하여 \u003cbr>\u003cbr>     \u003cspan class=\"heq\">\\(f \\left(1+x \\right)=f \\left(1-x \\right)\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(f \\left(2+x \\right)=f \\left(2-x \\right)\\,\\)\u003c/span>\u003cbr>\u003cbr>를 만족시킨다. 실수 전체의 집합에서 \u003cspan class=\"heq\">\\(f' \\left( x \\right)\\,\\)\u <script>window.HandStudyGuide={"itemId":16332,"sourceHash":"ab19caab3d6ff8dbe5798f5bfcba3d084eb8c981abd59ecc1e5dc0d80b08cd3e","contentHash":"066538df03204861172b1e13ecee61f078e72df390041d8ab4843d9451753715","overview":{"goal":"두 대칭축에서 주기 2를 얻고, 치환 적분과 한 주기의 넓이로 긴 구간 적분을 계산해요.","firstLook":"\\(x=1\\)과 \\(x=2\\)에 대한 대칭을 연달아 적용하면 그래프가 2만큼 평행이동해도 같아져요.","conditions":[{"label":"두 대칭식","meaning":"대칭축 사이 거리 1의 두 배인 2가 주기가 돼요."}]},"chapters":[{"id":"c1","label":"대칭에서 주기와 함수값 차를 얻어요","stepIds":["s1","s2"],"question":"두 대칭식을 어떻게 이어 \\(f(x+2)=f(x)\\)를 만드나요?","hint":"중간값 f(2−x)를 사용하세요.","explanation":"중심 2 대칭에서 \\(f(x+2)=f(2-x)\\)이고 중심 1 대칭에서 \\(f(2-x)=f(x)\\)이므로 주기는 2예요. 또 \\(\\int_2^5f'(x)dx=f(5)-f(2)=4\\)이고 주기로 \\(f(5)=f(1), f(2)=f(0)\\)이므로 \\(f(1)-f(0)=4\\)예요. 따라서 ㄱ, ㄴ은 참이에요.","check":{"prompt":"\\(f(5)=f(1)\\)인 이유는 무엇인가요?","answer":"주기 2를 두 번 빼면 같은 함숫값이기 때문이에요."}},{"id":"c2","label":"합성 적분으로 한 주기의 적분을 구해요","stepIds":["s3","s4","s5"],"question":"\\(t=f(x)\\) 치환 뒤 적분구간 길이 4는 몇 주기인가요?","hint":"\\(f(1)=f(0)+4\\)와 주기 2를 함께 쓰세요.","explanation":"\\(t=f(x)\\)로 치환하면 \\(\\int_0^1f(f(x))f'(x)dx=\\int_{f(0)}^{f(0)+4}f(t)dt=6\\)이에요. 길이 4는 주기 2가 두 번 들어가므로 한 주기의 적분은 3이에요. 또한 \\(x=1\\) 대칭으로 \\([0,1]\\)과 \\([1,2]\\)의 적분이 같아 각각 \\(3/2\\)예요.","check":{"prompt":"치환에서 f가 일대일일 필요가 없나요?","answer":"합성함수의 미분 관계로 양 끝의 \\(f\\)값만 사용하므로 단조일 필요가 없어요."}},{"id":"c3","label":"긴 구간을 주기별로 나눠요","stepIds":["s6","s7"],"question":"[1,10]에는 완전한 주기와 반 주기가 각각 몇 개 있나요?","hint":"[1,9]와 [9,10]으로 나누세요.","explanation":"[1,9]는 길이 8이라 네 주기이고 적분은 \\(4\\cdot3=12\\)예요. [9,10]은 주기로 [1,2]와 같아 \\(3/2\\)예요. 합은 \\(27/2\\)이므로 ㄷ도 참이고 정답은 ⑤예요.","check":{"prompt":"[9,10]이 [1,2]와 같은 이유는 무엇인가요?","answer":"양 끝에서 8을 빼면 [1,2]가 되고 8은 주기 2의 네 배예요."}}],"takeaway":["두 평행한 대칭축을 차례로 적용하면 두 축 간격의 두 배가 주기가 돼요.","주기함수 적분은 구간을 완전한 주기와 남는 구간으로 나눠요."]};</script>
