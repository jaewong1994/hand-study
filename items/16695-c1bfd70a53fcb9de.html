:"\\(b_{2n}=3a_n-2\\)에 \\(n=1\\)을 넣었어요."}},{"id":"c4","label":"목표 항을 계산해요","stepIds":["s4"],"question":"\\(2\\)에서 \\(32\\)까지 네 배 공식을 몇 번 쓰나요?","hint":"\\(2\\to8\\to32\\)예요.","explanation":"\\(b_8=3b_2+4\\), \\(b_{32}=3b_8+4=9b_2+16\\)이에요. \\(b_2=7\\)을 넣으면 \\(b_{32}=63+16=79\\)예요.","check":{"prompt":"\\(b_{32}=9b_2+16\\)의 상수 16은 어떻게 나오나요?","answer":"\\(3(3b_2+4)+4=9b_2+12+4\\)에서 나와요."}}],"takeaway":["첨자 점화식은 짝수와 홀수를 분리해 절반 첨자로 내려가요.","부분합에서는 짝수항과 홀수항을 같은 첨자의 항끼리 묶어요.","반복되는 첨자 변환은 합성해 바로 쓰는 공식을 만들어요."]};</script>
