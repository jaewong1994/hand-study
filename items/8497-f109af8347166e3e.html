<script>window.HandStudyRecord={"itemId":8497,"sourceLabel":"2025 교육청 고2 수학 3월 30번","adminYear":2025,"grade":2,"month":3,"number":30,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"실수 $a\\, \\left(a \\neq 0 \\right)\\,$과 $2\\,$보다 큰 자연수 $n\\,$에 대하여 집합 $\\{x\\in\\mathbb{R}\\mid x\\ne2\\}$에서 정의된 함수 $f \\left(x \\right)\\,$를\n $f \\left(x \\right)= \\begin{cases}\\dfrac{ax-an}{x-2}-n & x<2\\ \\text{또는}\\ 2<x<n \\\\ -a\\sqrt{x-n}-n & x\\geq n\\end{cases}$\n이라 하자. 실수 $t\\,$에 대하여 $x\\,$에 대한 방정식 $\\left|\\, f \\left(x \\right)\\,\\right| =t\\,$의 서로 다른 실근의 개수를 $g \\left(t \\right)\\,$라 할 때, 함수 $g \\left(t \\right)\\,$가 다음 조건을 만족시키도록 하는 모든 $n\\,$의 값의 합을 구하시오. [4점]\n(가) $g \\left(t \\right)=2\\,$를 만족시키는 실수 $t\\,$의 최솟값은 $0$, 최댓값은 $\\frac{3}{2}n\\,$이다.\n(나) $g \\left( \\left|\\, f \\left(5 \\right)\\,\\right| \\right) \\times g \\left(n \\right)=6$","answer":"68","sourceHash":"78bb4c82ca0317b253b3e3a9799c031ae357608f0cd8dc9bdf2dfccda1ee8299","steps":[{"id":"s1","latex":"g(0)=2\\Rightarrow a=-c\\quad(c>0)"},{"id":"s2","latex":"\\mathcal R_{x<2}=(-\\infty,-n-c),\\quad\\mathcal R_{2<x<n}=(-n,\\infty),\\quad\\mathcal R_{x\\ge n}=[-n,\\infty)"},{"id":"s3","latex":"g(t)=\\begin{cases}4&0<t<n\\\\3&t=n\\\\2&n<t\\le n+c\\\\3&t>n+c\\end{cases}"},{"id":"s4","latex":"n+c=\\frac32n\\Rightarrow a=-\\frac n2,\\qquad g(n)=3"},{"id":"s5","latex":"g(|f(5)|)=2\\Rightarrow |f(5)|=0\\ \\text{또는}\\ n<|f(5)|\\le\\frac32n"},{"id":"s6","latex":"3\\le n\\le5\\quad\\times,\\qquad n>5:\\ f(5)=\\frac{n(n-11)}6"},{"id":"s7","latex":"n=11\\ \\text{또는}\\ 6<|n-11|\\le9\\Rightarrow n\\in\\{11,18,19,20\\}"},{"id":"s8","latex":"11+18+19+20=68"}],"diagram":null,"contentHash":"cf92bf6a0ae5a414e4261e8c1faf193c78d1b8ae054232da3fac1324fe80ce63","questionHtml":"<p class=\"hp\">실수 <span class=\"heq\">\\(a\\, \\left(a \\neq 0 \\right)\\,\\)<\/span>과 <span class=\"heq\">\\(2\\,\\)<\/span>보다 큰 자연수 <span class=\"heq\">\\(n\\,\\)<\/span>에 대하여 <br>집합 <span class=\"heq\">\\(\\{x\\,|\\, x \\neq 2\\,\\) \\)라 모두 탈락해요. \\(n>5\\)에서는 \\(f(5)=n(n-11)/6\\)이고, \\(|f(5)|=0\\) 또는 \\(n<|f(5)|\\le3n/2\\)를 풀면 \\(n=11,18,19,20\\)이에요. 합은 \\(68\\)이에요.","hint":"n>5 식을 부등식으로 풀고 \\(3\\le n\\le 5\\)는 직접 확인해요.","label":"남은 자연수를 직접 확인해요"}],"takeaway":["t<0에서는 |f|는 t의 해가 없어 g는 0이다.","끝점 n+c에서는 해 개수 2에 포함된다.","2보다 큰 자연수 n을 정수로 전수 확인했다."]};</script>
