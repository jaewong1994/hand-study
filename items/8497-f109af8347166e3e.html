  <script>window.HandStudyRecord={"itemId":8497,"sourceLabel":"2025 교육청 고2 수학 3월 30번","adminYear":2025,"grade":2,"month":3,"number":30,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"실수 $a\\, \\left(a \\neq 0 \\right)\\,$과 $2\\,$보다 큰 자연수 $n\\,$에 대하여 집합 $\\{x\\in\\mathbb{R}\\mid x\\ne2\\}$에서 정의된 함수 $f \\left(x \\right)\\,$를\n $f \\left(x \\right)= \\begin{cases}\\dfrac{ax-an}{x-2}-n & x\u003c2\\ \\text{또는}\\ 2\u003cx\u003cn \\\\ -a\\sqrt{x-n}-n & x\\geq n\\end{cases}$\n이라 하자. 실수 $t\\,$에 대하여 $x\\,$에 대한 방정식 $\\left|\\, f \\left(x \\right)\\,\\right| =t\\,$의 서로 다른 실근의 개수를 $g \\left(t \\right)\\,$라 할 때, 함수 $g \\left(t \\right)\\,$가 다음 조건을 만족시키도록 하는 모든 $n\\,$의 값의 합을 구하시오. [4점]\n(가) $g \\left(t \\right)=2\\,$를 만족시키는 실수 $t\\,$의 최솟값은 $0$, 최댓값은 $\\frac{3}{2}n\\,$이다.\n(나) $g \\left( \\left|\\, f \\left(5 \\right)\\,\\right| \\right) \\times g \\left(n \\right)=6$","answer":"68","sourceHash":"78bb4c82ca0317b253b3e3a9799c031ae357608f0cd8dc9bdf2dfccda1ee8299","steps":[{"id":"s1","latex":"g(0)=2\\Rightarrow a=-c\\quad(c>0)"},{"id":"s2","latex":"\\mathcal R_{x\u003c2}=(-\\infty,-n-c),\\quad\\mathcal R_{2\u003cx\u003cn}=(-n,\\infty),\\quad\\mathcal R_{x\\ge n}=[-n,\\infty)"},{"id":"s3","latex":"g(t)=\\begin{cases}4&0\u003ct\u003cn\\\\3&t=n\\\\2&n\u003ct\\le n+c\\\\3&t>n+c\\end{cases}"},{"id":"s4","latex":"n+c=\\frac32n\\Rightarrow a=-\\frac n2,\\qquad g(n)=3"},{"id":"s5","latex":"g(|f(5)|)=2\\Rightarrow |f(5)|=0\\ \text{or}\\ n\u003c|f(5)|\\le\\frac32n"},{"id":"s6","latex":"3\\le n\\le5\\quad\\times,\\qquad n>5:\\ f(5)=\\frac{n(n-11)}6"},{"id":"s7","latex":"n=11\\ \text{or}\\ 6\u003c|n-11|\\le9\\Rightarrow n\\in\\{11,18,19,20\\}"},{"id":"s8","latex":"11+18+19+20=68"}],"diagram":null,"contentHash":"2dc98fefb5c88bb384442bf77c852dab9fe0aa57ac453ff8a858eaa03a93bb62","questionHtml":"\u003cp class=\"hp\">실수 \u003cspan class=\"heq\">\\(a\\, \\left(a \\neq 0 \\right)\\,\\)\u003c/span>과 \u003cspan class=\"heq\">\\(2\\,\\)\u003c/span>보다 큰 자연수 \u003cspan class=\"heq\
