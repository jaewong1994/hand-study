겨요.","explanation":"조건 (가), (나)를 만족하는 \\(270\\)가지에서 네 명 모두 홀수인 \\(52\\)가지를 빼면 \\(270-52=218\\)이에요.","check":{"prompt":"모두 짝수인 경우도 빼야 하나요?","answer":"아니에요. 모두 짝수이면 적어도 한 학생이 짝수라는 조건을 만족해요."}}],"takeaway":["최소 한 개 조건은 먼저 한 개씩 배분해요.","윗범위 위반을 뺄 때 겹침을 확인해요.","‘적어도 하나’는 반대 사건이 더 단순한지 살펴봐요."]};</script>
