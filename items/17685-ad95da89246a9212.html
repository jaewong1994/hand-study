<script>window.HandStudyRecord={"itemId":17685,"sourceLabel":"2023 교육청 고3 수학미적분 7월 29번","adminYear":2023,"grade":3,"month":7,"number":29,"track":"미적분","points":4,"scoreStatus":"confirmed_4_direct","questionText":"함수 $f(x)$는 실수 전체의 집합에서 도함수가 연속이고 다음 조건을 만족시킨다.\n(가) $x\u003c1$일 때, $f ' \\left(x \\right)=\\,-2x+4$이다.(나) $x \\geq 0$인 모든 실수 $x$에 대하여 $f \\left( x ^{2} +1 \\right) =ae ^{2x} +bx$이다. (단, $a$, $b$는 상수이다.)\n$\\int _{0} ^{5} {} f \\left(x \\right)dx=pe ^{4} -q$ 일 때, $p+q$의 값을 구하시오. (단, $p$, $q$는 유리수이다.) [4점]","answer":"12","sourceHash":"d9ef8ba8ecbd334dd5c6d86e878f4085ba034b4f8c3dd219cfb2916b5bd5fddc","steps":[{"id":"s1","latex":"2x f'(x^2+1)=2ae^{2x}+b\\Rightarrow 2a+b=0"},{"id":"s2","latex":"f'(1)=\\lim_{x\\to0+}\\frac{a(e^{2x}-1)}x=2a=2\\Rightarrow a=1,\\ b=-2"},{"id":"s3","latex":"x\u003c1:\\ f(x)=-x^2+4x-2,\\qquad\\int_0^1f(x)\\,dx=-\\frac13"},{"id":"s4","latex":"\\int_1^5f(x)\\,dx=\\int_0^2(2te^{2t}-4t^2)\\,dt=\\frac32e^4+\\frac12-\\frac{32}{3}"},{"id":"s5","latex":"\\int_0^5f(x)\\,dx=\\dfrac32e^4-\\dfrac{21}{2}\\Rightarrow p+q=12"}],"diagram":null,"contentHash":"e04d31d19fe1439e05b149b10fa096fb5d24a9349ccf3ed41e07b5d5b55b3ee5","questionHtml":"\u003cp class=\"hp\">함수 \u003cspan class=\"heq\">\\(f(x)\\)\u003c/span>는 실수 전체의 집합에서 도함수가 연속이고 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) \u003cspan class=\"heq\">\\(x\\lt 1\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(f' \\left(x \\right)=\\,-2x+4\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp\">(나) \u003cspan class=\"heq\">\\(x \\geq 0\\)\u003c/span>인 모든 실수 \u003cspan class=\"heq\">\\(x\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(f \\left( x^{2} +1 \\right) =ae^{2x} +bx\\)\u003c/span>이다.\u003cbr>(단, \u003cspan class=\"heq\">\\(a\\)\u003c/span>, \u003cspan class=\"heq\">\\(b\\)\u003c/span>는 상수이다.)\u003c/p>\u003c/div>\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(\\int_{0}^{5} {} f \\left(x \\right)dx=pe^{4} -q\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(p+q\\)\u003c/span>의 값을 구 <script>window.HandStudyGuide={"itemId":17685,"sourceHash":"d9ef8ba8ecbd334dd5c6d86e878f4085ba034b4f8c3dd219cfb2916b5bd5fddc","contentHash":"e04d31d19fe1439e05b149b10fa096fb5d24a9349ccf3ed41e07b5d5b55b3ee5","overview":{"goal":"미분가능성과 도함수의 연속성으로 \\(a,b\\)를 정하고 두 구간의 적분을 합쳐요.","firstLook":"\\(x^2+1\\)은 1 이상만 만들므로 1을 경계로 함수를 나누어 생각해요.","conditions":[{"label":"도함수 연속","meaning":"오른쪽 관계식에서 얻는 \\(f'(1)\\)과 왼쪽 식의 값이 같아야 해요."},{"label":"\\(f(x^2+1)\\)","meaning":"\\([1,5]\\) 적분은 \\(u=t^2+1\\)로 바꾸어 주어진 함숫값을 사용해요."}]},"chapters":[{"id":"c1","label":"경계에서 상수 결정","stepIds":["s1","s2"],"question":"\\(x=0\\)을 대입한 식과 \\(x\\to 0+\\)에서의 도함수 극한은 각각 무엇을 알려 주나요?","hint":"먼저 \\(2a+b=0\\)을 얻고, 그 식을 미분식에 다시 넣어 보세요.","explanation":"관계식을 미분하면 \\(2x f'(x^2+1)=2ae^{2x}+b\\)예요. \\(x=0\\)을 대입하면 좌변이 0이므로 \\(2a+b=0\\)예요. 이제 \\(x>0\\)에서 \\(f'(x^2+1)=\\{2ae^{2x}+b\\}/(2x)=a(e^{2x}-1)/x\\)이고, \\(x\\to 0+\\)이면 이 값은 \\(2a\\)에 가까워져요. 한편 \\(x<1\\)에서 \\(f'(x)=-2x+4\\)이므로 왼쪽에서 \\(f'(1)=2\\). 도함수가 연속이어서 \\(2a=2\\), 따라서 \\(a=1,b=-2\\)예요.","check":{"prompt":"\\(2a+b=0\\)을 쓴 뒤 \\(f'(1)=2a\\)가 되는 이유는 무엇인가요?","answer":"\\(f'(x^2+1)=a(e^{2x}-1)/x\\)이고 \\(x\\to 0+\\)에서 \\((e^{2x}-1)/x\\to 2\\)이기 때문이에요."}},{"id":"c2","label":"일보다 작은 구간 적분","stepIds":["s3"],"question":"왼쪽 함수의 적분상수는 무엇으로 정하나요?","hint":"(나)에 \\(x=0\\)을 넣어 \\(f(1)\\)을 먼저 구하세요.","explanation":"(나)에 \\(x=0\\)을 넣으면 \\(f(1)=a=1\\)예요. \\(f'(x)=-2x+4\\)를 적분하면 \\(f(x)=-x^2+4x+C\\)이고, \\(f(1)=1\\)에서 \\(C=-2\\)예요. 그래서 \\(\\int_0^1f(x)dx=[-x^3/3+2x^2-2x]_0^1=-1/3\\)예요.","check":{"prompt":"\\(f(1)\\)은 얼마이고 어디에서 얻나요?","answer":"(나)에 \\(x=0\\)을 넣어 \\(f(1)=a=1\\)을 얻어요."}},{"id":"c3","label":"오른쪽 구간 치환","stepIds":["s4","s5"],"question":"\\(1\\le u\\le 5\\)를 어떤 새 변수로 나타내면 주어진 식을 쓸 수 있나요?","hint":"\\(u=t^2+1\\)로 두고 양 끝값과 \\(du\\)를 함께 바꾸세요.","explanation":"\\(u=t^2+1\\)로 두면 \\(du=2t\\,dt\\), 양 끝은 \\(u=1,5\\)에서 \\(t=0,2\\)로 바뀌고 \\(f(t^2+1)=e^{2t}-2t\\)예요. 따라서 \\(\\int_1^5f(u)du=\\int_0^2(2te^{2t}-4t^2)dt\\). 첫 적분은 \\(t\\)를 미분하고 \\(2e^{2t}\\)를 적분하여 \\([te^{2t}]_0^2-\\int_0^2e^{2t}dt=2e^4-(e^4-1)/2=\\frac32e^4+\\frac12\\). 둘째는 \\(\\int_0^24t^2dt=32/3\\)예요. 왼쪽 구간의 \\(-1/3\\)까지 더하면 \\(\\frac32e^4-\\frac{21}{2}\\), 따라서 \\(p+q=3/2+21/2=12\\)예요.","check":{"prompt":"치환 뒤 \\(-2t\\) 항이 왜 \\(-4t^2\\)가 되나요?","answer":"함숫값의 \\(-2t\\)에 미분관계 \\(du=2t\\,dt\\)가 곱해지기 때문이에요."}}],"takeaway":["경계에서는 함수값뿐 아니라 도함수의 좌우 값도 실제 극한으로 맞춰요.","치환할 때 새 변수, 미분관계, 양 끝값을 한꺼번에 바꿔요."]};</script>
