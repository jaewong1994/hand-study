<script>window.HandStudyRecord={"itemId":16302,"sourceLabel":"2019 교육청 고3 수리가형 5월 20번","adminYear":2019,"grade":3,"month":5,"number":20,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"함수 $f(x)= \\frac{5x ^{2}}{e ^{x}} \\,$에 대하여 함수 $g(x)\\,$를\n $g(x)=(f \\circ f)(x)$\n라 하자. 실수 $t\\,$에 대하여 방정식 $g(x)=t\\,$의 실근의 개수를 $h(t)\\,$라 할 때, \u003c보기>에서 옳은 것만을 있는 대로 고른 것은? (단, $7\u003ce ^{2} \u003c8\\,$이고, $\\lim _{x\\to \\infty } {} f(x)=0\\,$이다.) [4점]\n\u003c보기>\nㄱ. 함수 $f(x)$의 극댓값은 $\\frac{20}{e ^{2}} \\,$이다.\nㄴ. 집합 $A=\\{\\, a \\mid g'(a)=0,\\ a$는 실수$\\,\\}$의 원소의 개수는 5이다.\nㄷ. $h(t)$의 최댓값은 6이다.\n① ㄱ ② ㄴ ③ ㄱ, ㄴ ④ ㄱ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","answer":"⑤","sourceHash":"363a00bd5a8f833b5321bdfc76c9e73b4fd59ba53019e0a181a39de9dfb6fee0","steps":[{"id":"s1","latex":"f'(x)=\\dfrac{5x(2-x)}{e^x}"},{"id":"s2","latex":"M=f(2)=\\dfrac{20}{e^2},\\qquad2\u003cM\u003c3"},{"id":"s3","latex":"g'(x)=f'(f(x))f'(x)"},{"id":"s4","latex":"g'(x)=0\\Leftrightarrow x\\in\\{0,2\\}\\text{ 또는 }f(x)\\in\\{0,2\\}"},{"id":"s5","latex":"f(x)=2\\text{의 서로 다른 세 근을 더하면 }|A|=5"},{"id":"s6","latex":"0\u003ct\u003cM:\\quad f(u)=t\\text{의 두 양의 근 }u_1\u003c2\u003cu_2"},{"id":"s7","latex":"f(M)\u003ct\u003cM\\Rightarrow u_1,u_2\u003cM\\Rightarrow h(t)=3+3=6"},{"id":"s8","latex":"\\therefore\\text{세 명제는 모두 참}"}],"diagram":null,"contentHash":"dfd79ca23281762fcd56782cc427f84a0be1f04f0d38fb436169adaad763ceac","questionHtml":"\u003cp class=\"hp htall\">함수 \u003cspan class=\"heq\">\\(f(x)= \\dfrac{5x^{2}}{e^{x}} \\,\\)\u003c/span>에 대하여 함수 \u003cspan class=\"heq\">\\(g(x)\\,\\)\u003c/span>를\u003c/p>\u003cp class=\"hp\">&emsp;&emsp;\u003cspan class=\"heq\">\\(g(x)=(f \\circ f)(x)\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">라 하자. 실수 \u003cspan class=\"heq\">\\(t\\,\\)\u003c/span>에 대하여 방정식 \u003cspan class=\"heq\">\\(g(x)=t\\,\\)\u003c/span>의 실근의 개수를 \u003cspan class=\"heq\">\\(h(t)\\,\\)\u003c/span>라 할 때, &lt;보기&gt;에서 옳은 것만을 있는 대로 고른 것은?\u003cbr>(단, \u003cspan class=\"heq\">\\(7\\lt e^{2} \\lt 8\\,\\)\u003c/span>이고, \u003cspan class=\"heq\">\\(\\lim\\limits_{x\\to  \\infty } {} f(x)=0\\,\\)\u003c/span>이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp htall\">\u003cdiv class=\"hbox\">\u003cp class=\"hp\">&lt;보기&gt;\u003c/p>\u003cp class=\"hp htall\">ㄱ. 함수 \u003cspan class=\"heq\">\\(f(x)\\)\u003c/span>의 극댓값은 \u003cspan class=\"heq\">\\(\\dfrac{20}{e^{2}} \\,\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp\">ㄴ. 집합 \u003cspan class=\"heq\">\\(A= \\left\\{ \\,a\\,\\mid\\,g'(a)=0\\,,\\,a\\text{는}\\,\\text{실수}\\, \\right\\}\\)\u003c/span>의 원소의 개수는 \u003cbr>5이다.\u003c/p>\u003cp class=\"hp\">ㄷ. \u003cspan class=\"heq\">\\(h(t)\\)\u003c/span>의 최댓값은 6이다.\u003c/p>\u003c/div>\u003c/p>\u003cp class=\"hp\">① ㄱ&emsp;② ㄴ&emsp;③ ㄱ, ㄴ\u003cbr>④ ㄱ, ㄷ&emsp;⑤ ㄱ, ㄴ, ㄷ\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"219f03c89af7e7de4a01b2d35354644becec3ef050fc90a2f466fd02ca1a6a9b"};</script>
<script>window.HandStudyGuide={"itemId":16302,"sourceHash":"363a00bd5a8f833b5321bdfc76c9e73b4fd59ba53019e0a181a39de9dfb6fee0","contentHash":"dfd79ca23281762fcd56782cc427f84a0be1f04f0d38fb436169adaad763ceac","overview":{"goal":"함수 \\(f\\)의 증가와 감소를 파악해 합성함수의 도함수가 0인 점과 방정식의 실근 개수를 세어요.","firstLook":"\\(g(x)=f(f(x))\\)이므로 \\(f\\)의 그래프를 먼저 읽어요. 특히 \\(f(x)=u\\)의 실근 개수가 \\(u\\)에 따라 어떻게 달라지는지가 핵심이에요.","conditions":[{"label":"지수 값의 범위","meaning":"\\(7<e^2<8\\)에서 극댓값 \\(M=20/e^2\\)가 2와 3 사이임을 알아요."},{"label":"끝에서의 값","meaning":"\\(x\\to\\infty\\)일 때 \\(f(x)\\to0\\)이어서 \\(x>2\\)인 가지가 양의 값을 다시 지나가요."}]},"chapters":[{"id":"c1","label":"도함수로 그래프의 세 가지를 읽어요","stepIds":["s1","s2"],"question":"\\(f\\)는 어느 구간에서 증가하거나 감소하고, 극댓값은 얼마일까요?","hint":"\\(f'(x)=5x(2-x)e^{-x}\\)에서 지수 부분은 항상 양수예요.","explanation":"\\(e^{-x}>0\\)이므로 \\(f'(x)\\)의 부호는 \\(x(2-x)\\)가 정해요. \\(x<0\\)에서는 감소, \\(0<x<2\\)에서는 증가, \\(x>2\\)에서는 감소해요. 따라서 극댓값은 \\(M=f(2)=20/e^2\\)예요. 또 \\(20/8<M<20/7\\)이므로 \\(2<M<3\\)이고 ㄱ은 참이에요.","check":{"prompt":"\\(x=0\\)은 왜 극댓값의 점이 아닌가요?","answer":"왼쪽에서 \\(f'<0\\), 오른쪽에서 \\(f'>0\\)이므로 감소하다 증가하는 극솟값의 점이에요."}},{"id":"c2","label":"합성함수의 도함수가 0인 점을 세어요","stepIds":["s3","s4","s5"],"question":"\\(g'(x)=0\\)이 되는 서로 다른 실수는 왜 다섯 개일까요?","hint":"\\(g'(x)=f'(f(x))f'(x)\\)의 두 인수를 각각 0으로 놓고 겹치는 해를 확인해요.","explanation":"\\(f'(x)=0\\)에서는 \\(x=0,2\\)를 얻어요. \\(f'(f(x))=0\\)이면 \\(f(x)=0\\) 또는 \\(f(x)=2\\)예요. \\(f(x)=0\\)의 유일한 해 \\(x=0\\)은 이미 센 값이에요. \\(f(x)=2\\)는 \\(x<0\\), \\(0<x<2\\), \\(x>2\\)에서 각각 해가 하나씩 있어요. 이 세 해는 0, 2와 겹치지 않으므로 전체는 \\(2+3=5\\)개이고 ㄴ은 참이에요.","check":{"prompt":"\\(f(x)=0\\)의 해를 하나 더 세면 왜 안 되나요?","answer":"유일한 해가 \\(x=0\\)이고, 이 값은 이미 \\(f'(x)=0\\)에서 셌기 때문이에요."}},{"id":"c3","label":"바깥 방정식의 두 값을 안쪽에 넣어요","stepIds":["s6","s7"],"question":"어떤 \\(t\\)에서 \\(g(x)=t\\)가 실근 여섯 개를 가질까요?","hint":"\\(f(u)=t\\)의 두 양의 해를 \\(u_1,u_2\\)라 하고 각 \\(f(x)=u_i\\)의 해를 세어요.","explanation":"\\(u=f(x)\\)로 놓으면 항상 \\(u\\ge0\\)이므로, 먼저 \\(u\\ge0\\)에서만 \\(f(u)=t\\)를 풀어야 해요. \\(0<t<M\\)이면 이 범위에서 \\(0<u_1<2<u_2\\)인 두 해를 가져요. 양수 \\(u<M\\)에 대해 \\(f(x)=u\\)는 세 감소·증가 구간에서 각각 해 하나씩, 모두 세 해를 가져요. \\(M>2\\)이고 \\(x>2\\)에서 \\(f\\)가 감소하므로 \\(f(M)<f(2)=M\\)이에요. \\(f(M)<t<M\\)로 잡으면 \\(u_1<2<M\\)이고, \\(f(u_2)=t>f(M)\\)이므로 \\(u_2<M\\)이에요. 따라서 두 값이 각각 세 해를 주어 \\(h(t)=3+3=6\\)이에요.","check":{"prompt":"\\(f(M)<t<M\\)에서 왜 \\(u_2<M\\)인가요?","answer":"\\(x>2\\)에서 \\(f\\)가 감소하고 \\(f(u_2)=t>f(M)\\)이므로 입력은 \\(u_2<M\\)이어야 해요."}},{"id":"c4","label":"여섯 개가 가장 많음을 확인해요","stepIds":["s8"],"question":"실근이 6개보다 많아질 수 없는 이유는 무엇일까요?","hint":"바깥 방정식과 안쪽 방정식의 해 개수에 각각 상한을 잡아요.","explanation":"\\(u\\ge0\\)에서 \\(f(u)=t\\)의 해는 많아야 두 개예요. 또 고정된 양수 \\(u\\)에 대해 \\(f(x)=u\\)의 해는 세 구간에서 많아야 하나씩, 모두 세 개예요. 따라서 \\(g(x)=t\\)의 실근은 많아야 \\(2\\times3=6\\)개예요. 실제로 6개가 되는 \\(t\\)도 찾았으므로 최댓값은 6이고, ㄷ도 참이어서 정답은 ⑤예요.","check":{"prompt":"\\(h(t)=6\\)인 예만 찾고 끝내면 안 되는 이유는 무엇인가요?","answer":"7개 이상이 되는 경우가 없다는 상한도 보여야 해요. 바깥 단계 최대 2개와 안쪽 단계 최대 3개를 곱하면 6을 넘지 않아요."}}],"takeaway":["합성함수 방정식은 안쪽 함숫값을 \\(u\\)로 놓고 \\(f(u)=t\\)를 만족하는 가능한 \\(u\\)부터 찾은 뒤, 각 \\(u\\)를 안쪽 함수가 몇 번 만드는지 세어요.","도함수의 곱이 0일 때는 두 인수에서 얻은 해가 겹치는지 확인해요.","최댓값은 실제로 그 값이 나오는 경우와 더 커질 수 없다는 이유를 함께 보여요."]};</script>
