<script>window.HandStudyRecord={"itemId":18386,"sourceLabel":"2025 평가원 고3 수학확통 9월 22번","adminYear":2025,"grade":3,"month":9,"number":22,"track":"확통","points":4,"scoreStatus":"confirmed_4_direct","questionText":"곡선 $y= \\log_{2}\\,x$ 위에 서로 다른 두 점 ${{A}}\\,$, ${{B}}\\,$가 있다. 점 ${{A}}\\,$에서 직선 $y=x\\,$에 내린 수선의 발을 ${{P}}\\,$라 하고, 점 ${{B}}\\,$를 직선 $y=x\\,$에 대하여 대칭이동한 점을 ${{Q}}\\,$라 할 때, 네 점 ${{A}}\\,$, ${{B}}\\,$, ${{P}}\\,$, ${{Q}}\\,$가 다음 조건을 만족시킨다.\n(가) (직선 ${{AP}}\\,$의 $y\\,$절편)$-$(직선 ${{BQ}}\\,$의 $y\\,$절편) $=\\frac{13}{2}$ (나) 직선 ${{AB}}\\,$의 기울기는 $\\frac{6}{7}\\,$이다.\n사각형 ${{APQB}}\\,$의 넓이가 $\\frac{q}{p}\\,$일 때, $p+q\\,$의 값을 구하시오. (단, $p\\,$와 $q\\,$는 서로소인 자연수이다.) [4점]\n5 지선다형 사각형입니다. 2025년 9월 고3 모의고사 문제지제 2 교시 수학 영역(확률과 통계)","answer":"73","sourceHash":"83c1be3b35fa24051a6fbfa6c4b7f871f1307f14d6901ead582d4e55cc15dd0f","steps":[{"id":"s1","latex":"A=(a,\\log_2a),\\quad B=(b,\\log_2b)"},{"id":"s2","latex":"(a+\\log_2a)-(b+\\log_2b)=\\frac{13}{2}"},{"id":"s3","latex":"\\frac{\\log_2a-\\log_2b}{a-b}=\\frac67"},{"id":"s4","latex":"a-b=\\frac72,\\quad\\log_2\\frac ab=3\\Rightarrow(a,b)=\\left(4,\\frac12\\right)"},{"id":"s5","latex":"A=(4,2),\\ B=\\left(\\frac12,-1\\right),\\ P=(3,3),\\ Q=\\left(-1,\\frac12\\right)"},{"id":"s6","latex":"[APQB]=\\frac{65}{8}\\Rightarrow p+q=8+65=73"}],"diagram":null,"contentHash":"35cdebaec68cf06c91594126016580dfd20737ca1848e39bbc733ef355d1e378","questionHtml":"\u003cp class=\"hp\">곡선 \u003cspan class=\"heq\">\\(y= \\log_{2}\\,x\\)\u003c/span> 위에 서로 다른 두 점 \u003cspan class=\"heq\">\\({{A}}\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\({{B}}\\,\\)\u003c/span>가 있다. 점 \u003cspan class=\"heq\">\\({{A}}\\,\\)\u003c/span>에서 직선 \u003cspan class=\"heq\">\\(y=x\\,\\)\u003c/span>에 내린 수선의 발을 \u003cspan class=\"heq\">\\({{P}}\\,\\)\u003c/span>라 하고, 점 \u003cspan class=\"heq\">\\({{B}}\\,\\)\u003c/span>를 직선 \u003cspan class=\"heq\">\\(y=x\\,\\)\u003c/span>에 대하여 대칭이동한 점을 \u003cspan class=\"heq\">\\({{Q}}\\,\\)\u003c/span>라 할 때, 네 점 \u003cspan class=\"heq
