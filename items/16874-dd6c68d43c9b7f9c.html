<script>window.HandStudyRecord={"itemId":16874,"sourceLabel":"2020 평가원 고3 수리가형 6월 30번","adminYear":2020,"grade":3,"month":6,"number":30,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"실수 전체의 집합에서 정의된 함수 $f(x)$는 $0{\\leq}x\u003c3$일 때 $f(x)= \\left| x-1 \\right| + \\left| x-2 \\right|$이고, 모든 실수 $x$에 대하여 $f(x+3)=f(x)$를 만족시킨다. 함수 $g(x)$를\n $g(x)= \\lim _{h\\,-> \\,0+} {\\left| \\frac{f \\left( 2 ^{x+h} \\right) -f \\left( 2 ^{x} \\right)}{h} \\right|}$\n이라 하자. 함수 $g(x)$가 $x=a$에서 불연속인 $a$의 값 중에서 열린구간 $(-5,\\,5)$에 속하는 모든 값을 작은 수부터 크기순으로 나열한 것을 $a _{1} ,\\,a _{2} ,\\, \\cdots ,\\,a _{n}$ ($n$은 자연수)라 할 때, $n+ \\sum _{k=1} ^{n} \\frac{g \\left( a _{k} \\right)}{\\ln\\,2}$의 값을 구하시오. [4점]","answer":"331","sourceHash":"4daf41b3d8870676ee32b1e19317efa1641b9146bb9f511216de875a267f4ebf","steps":[{"id":"s1","latex":"f\\text{의 뾰족점}:\\ t=3j+1,3j+2"},{"id":"s2","latex":"g(x)=m(2^x)2^x\\ln2"},{"id":"s3","latex":"-5\u003cx\u003c5\\Rightarrow1/32\u003ct\u003c32"},{"id":"s4","latex":"n=11+10=21"},{"id":"s5","latex":"\\sum g(a_k)/\\ln2=2(2+5+\\cdots+29)=310"},{"id":"s6","latex":"n+\\sum g(a_k)/\\ln2=\\boxed{331}"}],"diagram":null,"contentHash":"c15d43e125448ea96356b240357ed2699b0a97bec7f9735535be22d55f65f7ff","questionHtml":"\u003cp class=\"hp\">실수 전체의 집합에서 정의된 함수 \u003cspan class=\"heq\">\\(f(x)\\)\u003c/span>는 \u003cspan class=\"heq\">\\(0{\\leq}x\\lt 3\\)\u003c/span>일 때 \u003cspan class=\"heq\">\\(f(x)= \\left| x-1 \\right| + \\left| x-2 \\right|\\)\u003c/span>이고, 모든 실수 \u003cspan class=\"heq\">\\(x\\)\u003c/span>에 대하여 \u003cbr>\u003cspan class=\"heq\">\\(f(x+3)=f(x)\\)\u003c/span>를 만족시킨다. 함수 \u003cspan class=\"heq\">\\(g(x)\\)\u003c/span>를\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\(g(x)= \\lim\\limits_{h\\,\\to  \\,0+} {\\left| \\dfrac{f \\left( 2^{x+h} \\right) -f \\left( 2^{x} \\right)}{h} \\right|}\\)\u003c/span>\u003c/p>\u003cp class=\"hp htall\">이라 하자. 함수 \u003cspan class=\"heq\">\\(g(x)\\)\u003c/span>가 \u003cspan class=\"heq\">\\(x=a\\)\u003c/span>에서 불연속인 \u003cspan class=\"heq\">\\(a\\)\u003c/span>의 값 중에서 열린구간 \u003cspan class=\"heq\">\\((-5,\\,5)\\)\u003c/span>에 속하는 모든 값을 작은 수부터 크기순으로 나열한 것을 \u003cspan class=\"heq\">\\(a_{1} ,\\,a_{2} ,\\, \\cdots ,\\,a_{n}\\)\u003c/span> (\u003cspan class=\"heq\">\\(n\\)\u003c/span>은 자연수)라 할 때, \u003cspan class=\"heq\">\\(n+ \\sum\\limits_{k=1}^{n} \\dfrac{g \\left( a_{k} \\right)}{\\ln\\,2}\\)\u003c/span>의 값을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/f2791bcf29264001684439ad.png\" style=\"width:382px;max-width:100%\">\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"dd6c68d43c9b7f9cc750bb763f1ca9b78e6bd117fc498fb243c6e89b6e1bdde7"};</script>
<script>window.HandStudyGuide={"itemId":16874,"sourceHash":"4daf41b3d8870676ee32b1e19317efa1641b9146bb9f511216de875a267f4ebf","contentHash":"c15d43e125448ea96356b240357ed2699b0a97bec7f9735535be22d55f65f7ff","overview":{"goal":"주기적인 꺾은선 함수의 오른쪽 기울기 크기를 합성함수의 변화율에 연결하고, g의 불연속 위치와 그 값을 세어요.","firstLook":"\\(2^x\\)는 \\(x\\)가 커질 때 증가하므로 \\(h\\to0+\\)는 \\(f\\)의 입력도 오른쪽으로 움직이게 해요. 따라서 각 꺾인 점에서 \\(f\\)의 오른쪽 기울기를 사용해요.","conditions":[{"label":"주기","meaning":"\\(f\\)는 주기 \\(3\\)이고 한 주기에서 기울기가 \\(-2,0,2\\)로 바뀌어요."},{"label":"오른쪽 극한","meaning":"정의에서 \\(h\\to0+\\)이므로 꺾인 점의 오른쪽 기울기를 택해요."},{"label":"열린구간","meaning":"불연속점의 \\(x\\)는 \\(-5<x<5\\)만 포함하고 양 끝은 제외해요."}]},"chapters":[{"id":"c1","label":"한 주기의 오른쪽 기울기 크기를 읽어요","stepIds":["s1","s2"],"question":"\\(f\\)의 어느 꺾인 입력이 \\(g\\)의 불연속을 만들까요?","hint":"기울기 자체가 아니라 오른쪽 기울기의 절댓값이 \\(2\\)와 \\(0\\) 사이에서 바뀌는 곳을 찾아요.","explanation":"한 주기에서 \\(0<t<1\\)일 때 \\(f(t)=3-2t\\), \\(1<t<2\\)일 때 \\(f(t)=1\\), \\(2<t<3\\)일 때 \\(f(t)=2t-3\\)이에요. 오른쪽 기울기의 절댓값은 차례로 \\(2,0,2\\)예요.\n\n주기 경계 \\(t=3j\\)에서는 기울기가 \\(2\\)에서 \\(-2\\)로 바뀌지만 절댓값은 양쪽 모두 \\(2\\)라 \\(g\\)가 끊기지 않아요. 반면 \\(t=3j+1\\)과 \\(t=3j+2\\)에서는 절댓값이 \\(2\\)와 \\(0\\) 사이에서 바뀌므로 불연속이에요. \\(t=2^x\\)라 하고 오른쪽 기울기 절댓값을 \\(m(t)\\)라 쓰면 연쇄법칙으로 \\(g(x)=m(2^x)2^x\\ln2\\)예요.","check":{"prompt":"\\(t=3j\\)에서 \\(g\\)가 연속인 이유는 무엇인가요?","answer":"f의 좌우 기울기는 부호만 다르고 절댓값은 모두 2라서 g의 좌우 값이 같기 때문이에요."}},{"id":"c2","label":"x의 범위를 t의 범위로 바꿔 개수를 세어요","stepIds":["s3","s4"],"question":"\\(-5<x<5\\)에서 불연속을 만드는 양의 \\(t\\)는 몇 개인가요?","hint":"\\(1/32<t<32\\) 안의 \\(3j+1\\), \\(3j+2\\)를 세되 \\(t=32\\)는 제외해요.","explanation":"\\(t=2^x\\)이므로 \\(-5<x<5\\)는 \\(1/32<t<32\\)와 같아요. 이 범위에서 \\(3j+1\\)인 양수는 \\(1,4,7,\\ldots,31\\)로 \\(11\\)개예요. \\(3j+2\\)인 양수는 \\(2,5,8,\\ldots,29\\)로 \\(10\\)개예요. 다음 값 \\(32\\)는 \\(x=5\\)에 해당해 열린구간에서 제외돼요. 따라서 \\(n=21\\)이에요.","check":{"prompt":"\\(t=1\\)은 포함되고 \\(t=32\\)는 제외되는 이유는 무엇인가요?","answer":"\\(t=1\\)은 \\(x=0\\)이지만 \\(t=32\\)는 끝점 \\(x=5\\)이기 때문이에요."}},{"id":"c3","label":"불연속점에서 정의된 g값을 더해요","stepIds":["s5","s6"],"question":"두 종류의 꺾인 점 중 어느 쪽만 \\(g(a_k)\\)의 합에 기여할까요?","hint":"오른쪽 기울기가 0인 점에서는 g값도 0이에요.","explanation":"\\(t=3j+1\\)에서는 오른쪽 구간이 평평해 \\(m(t)=0\\)이므로 \\(g(a_k)=0\\)이에요. \\(t=3j+2\\)에서는 오른쪽 기울기 절댓값이 \\(2\\)이므로 \\(g(a_k)/\\ln2=2t\\)예요.\n\n따라서\n\\[\n\\sum_{k=1}^n\\frac{g(a_k)}{\\ln2}\n=2(2+5+8+\\cdots+29).\n\\]\n이 등차수열은 \\(10\\)항이고 합이 \\(10(2+29)/2=155\\)이므로 전체는 \\(310\\)이에요. 마지막으로 \\(n\\)을 더하면 \\(21+310=331\\)이에요.","check":{"prompt":"\\(2+5+\\cdots+29\\)의 항 수는 얼마인가요?","answer":"\\((29-2)/3+1=10\\)개예요."}}],"takeaway":["오른쪽 변화율로 정의된 함수는 원래 함수의 꺾인 점에서 오른쪽 기울기를 사용해요.","절댓값을 취하면 기울기의 부호 변화만 있는 꼭짓점은 새 함수의 불연속을 만들지 않을 수 있어요.","지수함수의 입력 범위로 바꾼 뒤 등차수열 형태의 불연속 입력을 세고 합해요."]};</script>
