<script>window.HandStudyGuide={"itemId":27043,"sourceHash":"65f826f7eb11d8d7cdb6c9d2ad5b251382f4f9558e618cc0c34648092a6c7ba9","contentHash":"d0351fb6bbe8048e61d940d907fe89bab867c1e0862f14a17c68c81ecbb0ac94","overview":{"goal":"도형 넓이 \\(t\\)와 각 \\(\\theta\\)를 공통 매개변수 \\(\\alpha\\)로 미분해요.","firstLook":"\\(f'(k)=d\\theta/dt=(d\\theta/d\\alpha)/(dt/d\\alpha)\\)로 계산해요.","conditions":[{"label":"점의 배치","meaning":"\\(0<\\theta-\\alpha<\\pi/2\\)라 사인법칙과 코사인의 양의 부호를 확정해요."}]},"chapters":[{"id":"c1","label":"넓이를 각으로 표현","stepIds":["s1","s2","s3","s4"],"question":"도형 넓이가 삼각형에서 부채꼴을 뺀 값인 이유는?","hint":"호 \\(BP\\)가 삼각형 \\(AOP\\) 안에서 잘라내는 부분을 봐요.","explanation":"\\(\\alpha=\\angle AOP\\), \\(\\theta=\\angle OPQ\\)로 두어요. 삼각형 \\(AOP\\)의 넓이는 \\(\\frac12\\cdot5\\cdot2\\sin\\alpha=5\\sin\\alpha\\)이고, 부채꼴 \\(OBP\\)의 넓이는 \\(\\frac12\\cdot2^2\\alpha=2\\alpha\\)예요. 따라서 두 넓이의 차인 \\(t=5\\sin\\alpha-2\\alpha\\)예요.","check":{"prompt":"\\(dt/d\\alpha\\)는?","answer":"\\(5\\cos\\alpha-2\\)이에요."}},{"id":"c2","label":"사인법칙 관계 미분","stepIds":["s5","s6","s7"],"question":"\\(\\theta\\)와 \\(\\alpha\\)를 잇는 한 식은?","hint":"삼각형 \\(AOP\\)에서 \\(AO=5\\), \\(OP=2\\)를 써요.","explanation":"사인법칙으로 \\(5\\sin(\\theta-\\alpha)=2\\sin\\theta\\)예요. 양변을 \\(\\alpha\\)로 미분하면 \\(5\\cos(\\theta-\\alpha)(d\\theta/d\\alpha-1)=2\\cos\\theta\\,d\\theta/d\\alpha\\)예요. 변화율 항을 한쪽에 모아 \\(d\\theta/d\\alpha=\\dfrac{5\\cos(\\theta-\\alpha)}{5\\cos(\\theta-\\alpha)-2\\cos\\theta}\\)를 얻어요.","check":{"prompt":"분모의 두 항은?","answer":"\\(5\\cos(\\theta-\\alpha)-2\\cos\\theta\\)이에요."}},{"id":"c3","label":"주어진 탄젠트로 수치화","stepIds":["s8","s9","s10","s11","s12","s13"],"question":"코사인 부호를 어떻게 정하나요?","hint":"\\(\\theta\\)와 \\(\\theta-\\alpha\\) 모두 제\\(1\\)사분면이에요.","explanation":"\\(\\tan\\theta=3/2\\)이므로 \\(\\sin\\theta=3/\\sqrt{13}\\), \\(\\cos\\theta=2/\\sqrt{13}\\)이에요. 관계식에서 \\(\\sin(\\theta-\\alpha)=6/(5\\sqrt{13})\\)이고 각의 범위로 \\(\\cos(\\theta-\\alpha)=17/(5\\sqrt{13})\\)예요. 따라서 \\(\\cos\\alpha=\\cos\\theta\\cos(\\theta-\\alpha)+\\sin\\theta\\sin(\\theta-\\alpha)=\\dfrac{2\\cdot17+3\\cdot6}{5\\cdot13}=\\frac45\\)예요. 이제 \\(dt/d\\alpha=5\\cos\\alpha-2=2\\), \\(d\\theta/d\\alpha=17/13\\)이므로 \\(f'(k)=\\dfrac{d\\theta/d\\alpha}{dt/d\\alpha}=17/26\\), ④예요.","check":{"prompt":"두 변화율의 비 \\(\\dfrac{d\\theta/d\\alpha}{dt/d\\alpha}\\)는?","answer":"\\(\\dfrac{17/13}{2}=\\dfrac{17}{26}\\)이에요."}}],"takeaway":["역으로 정의된 각 함수는 공통 매개변수의 변화율 비로 미분해요.","제곱근 부호는 각의 범위로 정해요.","넓이는 포함된 부분과 제외된 부분을 먼저 나누어 봐요."]};</script>
