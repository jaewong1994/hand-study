label","x":0.2,"y":38.0},{"color":"amber","id":"ans","text":"a₄=-3, a₆=-3/4, 36a₄a₆=81","type":"label","x":3.8,"y":-38.0},{"color":"navy","id":"label-a5","text":"a5","type":"label","x":5.05,"y":-5},{"color":"navy","id":"label-a6","text":"a6","type":"label","x":6.05,"y":-7}],"stepId":"s13","title":"요구 곱"}],"title":"2026 평가원 고3 수학미적분 9월 29번 · 정확 점열","version":1},"itemId":27044,"learningHash":"7b8c085e47ad7fa59502bd4b61396304dd53c3769fc1f67842feea5d003c56df","month":9,"number":29,"points":4,"preview":false,"questionHtml":"\u003cdiv>수열 $\\left\\{a_{n} \\right\\}\\,$은 등비수열이고, 수열 $\\left\\{b_{n} \\right\\}\\,$을 모든 자연수 $n\\,$에 대하여\u003cbr>$b_{n}= \\begin{cases}\\,a_{n}-a_{1} &amp; &amp; \\left( \\left|\\, a_{n}\\,\\right| \\geq 10 \\right) \\\\ \\, \\left(a_{n} \\right)^{2} &amp; &amp; \\left( \\left|\\, a_{n}\\,\\right| &lt; 10 \\right)\\end{cases}$\u003cbr>이라 하자. 수열 $\\left\\{b_{n} \\right\\}\\,$은 다음 조건을 만족시킨다.\u003cbr>(가) $\\left(b_{2} \\right)^{2}=36b_{3}$\u003cbr>(나) 급수 $\\sum_{n=1}^{ \\infty }b_{n}\\,$은 수렴하고 그 합은 $12\\,$이다.\u003cbr>$a_{1} &gt; 0\\,$이고 $a_{2} &lt; 0\\,$일 때, $36 \\times a_{4} \\times a_{6}\\,$의 값을 구하시오. [4점]\u003c/div>","questionText":"수열 $\\left\\{a_{n} \\right\\}\\,$은 등비수열이고, 수열 $\\left\\{b_{n} \\right\\}\\,$을 모든 자연수 $n\\,$에 대하여\n$b_{n}= \\begin{cases}\\,a_{n}-a_{1} & & \\left( \\left|\\, a_{n}\\,\\right| \\geq 10 \\right) \\\\ \\, \\left(a_{n} \\right)^{2} & & \\left( \\left|\\, a_{n}\\,\\right| \u003c 10 \\right)\\end{cases}$\n이라 하자. 수열 $\\left\\{b_{n} \\right\\}\\,$은 다음 조건을 만족시킨다.\n(가) $\\left(b_{2} \\right)^{2}=36b_{3}$\n(나) 급수 $\\sum_{n=1}^{ \\infty }b_{n}\\,$은 수렴하고 그 합은 $12\\,$이다.\n$a_{1} > 0\\,$이고 $a_{2} \u003c 0\\,$일 때, $36 \\times a_{4} \\times a_{6}\\,$의 값을 구하시오. [4점]","scoreStatus":"confirmed_4_direct","sourceHash":"7f893bb1a6a8de1f45060f1468c49d7777645e5d3e6f6310cdb7a4e55e909dbd","sourceLabel":"2026 평가원 고3 수학미적분 9월 29번","stepExplanations":{"s11":{"body":"\\(r=-1/2\\)이면 \\(b_1=0,b_2=a(r-1)=-3a/2\\)이고 \\(n\\ge3\\)에서는 \\(b_n=a^2r^{2n-2}\\)입니다. 꼬리합은 \\(a^2r^4/(1-r^2)=a^2/12\\)이므로 \\(-3a/2+a^2/12=12\\), 양수 해는 \\(a=24\\)입니다.","skillTags":["piecewise-series","tail-sum"],"title":"남는 경우의 급수를 직접 합하기"},"s4":{"body":"조건 (가)에서 \\(b_3=b_2^2/36\\ge0\\)입니다. 만약 \\(|a_3|\\ge10\\)이면 \\(b_3=a_3-a_1=a(r^2-1)\u003c0\\)이 되어 모순입니다. 따라서 \\(|a_3|\u003c10\\)이고, 그 뒤 항들은 절댓값이 더 작아 모두 제곱 조각을 씁니다.","skillTags":["piecewise-threshold","sign-contradiction"],"title":"a3가 반드시 10보다 작아야 한다"},"s8":{"body":"이 경우 조건 (가)로 \\(a=6\\)이 되고, \\(|r|\u003c1\\)이라 모든 항이 10보다 작습니다. 따라서 \\(b_n=a_n^2=36r^{2n-2}\\)이고 합은 \\(36/(1-r^2)>36\\)이어서 12가 될 수 없습니다.","skillTags":["case-elimination","positive-geometric-series"],"title":"|a2|\u003c10인 경우가 합 12와 맞지 않는다"}},"steps":[{"id":"s1","latex":"a_n=ar^{n-1},\\quad a>0,\\ r\u003c0,\\quad b_n\\to0\\Rightarrow-1\u003cr\u003c0"},{"id":"s2","latex":"r=-1:\\quad b_n=\\begin{cases}a^2&(a\u003c10)\\\\0\\ (n\\text{ 홀수}),\\ -2a\\ (n\\text{ 짝수})&(a\\ge10)\\end{cases}\\Rightarrow b_n\\not\\to0"},{"id":"s3","latex":"r\u003c-1:\\quad n\\text{이 충분히 크면 }|a_n|\\ge10,\\quad b_{2n}=ar^{2n-1}-a\\to-\\infty\\quad\\times"},{"id":"s4","latex":"b_3\\ge0,\\quad|a_3|\\ge10\\Rightarrow b_3=a(r^2-1)\u003c0\\quad\\times"},{"id":"s5","latex":"|a_3|\u003c10\\Rightarrow b_n=a^2r^{2n-2}\\quad(n\\ge3)"},{"id":"s6","latex":"\\text{(I)}\\ |a_2|\u003c10:\\quad a^4r^4=36a^2r^4\\Rightarrow a=6"},{"id":"s7","latex":"a=6\u003c10\\Rightarrow b_1=a^2,\\quad b_n=a^2r^{2n-2}\\ (n\\ge1)"},{"id":"s8","latex":"\\sum b_n=\\frac{36}{1-r^2}>36\\quad\\times"},{"id":"s9","latex":"\\text{(II)}\\ |a_2|\\ge10:\\quad b_1=0,\\ b_2=a(r-1)"},{"id":"s10","latex":"(r-1)^2=36r^4\\Rightarrow(2r+1)(3r-1)=0\\Rightarrow r=-\\frac12"},{"id":"s11","latex":"-\\frac32a+\\frac{a^2}{12}=12\\Rightarrow(a-24)(a+6)=0\\Rightarrow a=24"},{"id":"s12","latex":"|a_2|=12\\ge10,\\quad|a_3|=6\u003c10\\quad\\checkmark"},{"id":"s13","latex":"36a_4a_6=36(-3)\\left(-\\frac34\\right)=81"}],"track":"미적분"};</script>
<script>window.HandStudyGuide={"itemId":27044,"sourceHash":"7f893bb1a6a8de1f45060f1468c49d7777645e5d3e6f6310cdb7a4e55e909dbd","contentHash":"4ec7b27c9aa9c004defcd1e1cd5d021a1264f128fadca79d405696b2bca4afd6","overview":{"goal":"급수 수렴으로 공비의 범위를 좁히고 조각 정의의 경계를 따라 첫째항과 공비를 정해 요구한 곱을 계산해요.","firstLook":"급수가 수렴하면 각 항은 0으로 가야 해요. 이 사실을 먼저 쓰면 공비가 \\(-1\\) 이하인 경우를 버리고 이후 항의 크기가 줄어든다는 구조를 얻어요.","conditions":[{"label":"첫째항은 양수이고 둘째항은 음수","meaning":"공비가 음수임을 알려 줘요."},{"label":"조각의 경계가 절댓값 10","meaning":"셋째항이 어느 조각에 있는지 먼저 정한 뒤 둘째항의 두 경우를 나눠요."},{"label":"급수의 합이 12","meaning":"한 경우를 배제하고 남은 경우의 첫째항을 결정해요."}]},"chapters":[{"id":"c1","label":"공비 범위와 셋째항의 조각 정하기","stepIds":["s1","s2","s3","s4","s5"],"question":"급수의 각 항이 0으로 가야 한다는 조건이 공비와 셋째항의 조각을 어떻게 제한할까요?","hint":"\\(a_n=ar^{n-1}\\)로 두고 \\(r=-1\\), \\(r<-1\\)을 각각 실제 \\(b_n\\)에 넣어 보세요.","explanation":"\\(a_1=a>0\\), \\(a_2=ar<0\\)이므로 \\(r<0\\)이에요. 급수가 수렴하려면 \\(b_n\\)이 0으로 가야 해요. \\(r=-1\\)이면 \\(a_n\\)의 크기가 줄지 않아 \\(a<10\\)일 때도 \\(b_n=a^2\\)가 계속되고, \\(a\\ge10\\)일 때도 짝수항이 \\(-2a\\)로 반복돼요. \\(r<-1\\)이면 뒤의 항들은 절댓값이 10 이상이고, 특히 \\(b_{2n}=ar^{2n-1}-a\\)의 절댓값이 커져 0으로 가지 않아요. 따라서 \\(-1<r<0\\)이에요.\n\n조건 (가)에서 \\(b_3=b_2^2/36\\ge0\\)예요. 만약 \\(|a_3|\\ge10\\)이면 \\(b_3=a_3-a_1=a(r^2-1)<0\\)이 되어 모순이에요. 따라서 \\(|a_3|<10\\)이고, \\(|r|<1\\)이라 이후 항의 크기는 더 작으므로 모든 \\(n\\ge3\\)에서 \\(b_n=a_n^2=a^2r^{2n-2}\\)예요.","check":{"prompt":"\\(|a_3|<10\\)만 확인하고 이후 항도 같은 조각이라고 말할 수 있는 이유는 무엇인가요?","answer":"\\(|r|<1\\)이므로 \\(|a_{n+1}|=|r||a_n|<|a_n|\\)여서 셋째항 뒤의 크기가 계속 감소해요."}},{"id":"c2","label":"둘째항이 작은 경우 배제하기","stepIds":["s6","s7","s8"],"question":"\\(|a_2|<10\\)이면 조건 (가)에서 왜 \\(a=6\\)이 되고, 급수의 합과는 왜 맞지 않을까요?","hint":"이 경우 \\(b_2=a^2r^2\\), \\(b_3=a^2r^4\\)를 대입하세요.","explanation":"\\(|a_2|<10\\)이면 \\(b_2=a^2r^2\\), \\(b_3=a^2r^4\\)예요. \\((b_2)^2=36b_3\\)에 넣으면 \\(a^4r^4=36a^2r^4\\)이고 \\(a>0\\), \\(r\\ne0\\)이므로 \\(a=6\\)이에요. 그러면 \\(|a_1|<10\\)도 만족하여 처음부터 모든 \\(b_n=36r^{2n-2}\\)예요. 합은 \\(\\frac{36}{1-r^2}\\)인데 \\(0<r^2<1\\)이어서 36보다 커요. 주어진 합 12와 맞지 않으므로 이 경우는 불가능해요.","check":{"prompt":"\\(a=6\\)일 때 \\(b_1\\)도 제곱 조각을 쓰는 이유는 무엇인가요?","answer":"\\(|a_1|=6<10\\)이므로 정의에 따라 \\(b_1=a_1^2=36\\)이에요."}},{"id":"c3","label":"남은 경우에서 공비와 첫째항 구하기","stepIds":["s9","s10","s11","s12"],"question":"\\(|a_2|\\ge10\\)인 경우 조건 (가)와 급수의 합은 \\(r\\)과 \\(a\\)를 어떻게 정할까요?","hint":"먼저 \\(b_1=0\\), \\(b_2=a(r-1)\\)을 쓰고, \\(n\\ge3\\)의 제곱 조각은 등비급수로 더하세요.","explanation":"\\(|a_2|\\ge10\\)이면 \\(|a_1|>|a_2|\\)이므로 \\(|a_1|\\ge10\\)이고 \\(b_1=a-a=0\\), \\(b_2=ar-a=a(r-1)\\)예요. 조건 (가)는 \\(a^2(r-1)^2=36a^2r^4\\), 즉 \\((r-1)^2=36r^4\\)예요. \\(-1<r<0\\)에서는 \\(1-r=6r^2\\)이므로 \\((2r+1)(3r-1)=0\\), 가능한 값은 \\(r=-1/2\\)예요.\n\n이때 \\(b_2=-3a/2\\)이고 \\(n\\ge3\\)의 합은 첫 항 \\(a^2/16\\), 공비 \\(1/4\\)인 등비급수라서 \\(a^2/12\\)예요. 따라서 \\(-3a/2+a^2/12=12\\), 즉 \\((a-24)(a+6)=0\\)이에요. \\(a>0\\)이므로 \\(a=24\\)예요. 실제로 \\(|a_2|=12\\ge10\\), \\(|a_3|=6<10\\)이라 사용한 조각 조건도 맞아요.","check":{"prompt":"꼬리 급수의 첫 항이 왜 \\(a^2/16\\)인가요?","answer":"\\(r=-1/2\\)에서 \\(b_3=a^2r^4=a^2/16\\)이고, 이후에는 매번 \\(r^2=1/4\\)배가 돼요."}},{"id":"c4","label":"요구한 항의 곱 계산하기","stepIds":["s13"],"question":"\\(a=24\\), \\(r=-1/2\\)일 때 넷째항과 여섯째항은 각각 얼마인가요?","hint":"\\(a_n=24(-1/2)^{n-1}\\)에 \\(n=4,6\\)을 넣으세요.","explanation":"\\(a_4=24(-1/2)^3=-3\\), \\(a_6=24(-1/2)^5=-3/4\\)예요. 따라서 \\(36a_4a_6=36\\cdot(-3)\\cdot(-3/4)=81\\)이에요.","check":{"prompt":"두 항의 곱이 양수인 이유는 무엇인가요?","answer":"공비가 음수이고 넷째항과 여섯째항은 모두 짝수 번째 항이라 둘 다 음수이기 때문이에요."}}],"takeaway":["급수 수렴 문제에서는 먼저 일반항이 0으로 가는지 확인해 공비 범위를 좁혀요.","조각 정의는 경계값을 기준으로 경우를 나눈 뒤 사용한 조각이 실제 값과 맞는지 되돌아가 확인해요.","등비급수의 첫 항과 공비를 실제 지수에서 계산해 합을 구해요."]};</script>
