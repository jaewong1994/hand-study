<script>window.HandStudyRecord={"itemId":16370,"sourceLabel":"2019 교육청 고3 수리나형 10월 28번","adminYear":2019,"grade":3,"month":10,"number":28,"track":"수리나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"식문화 체험의 날에 어느 고등학교 전체 학생을 대상으로 점심과 저녁 식사를 제공하였다. 모든 학생들은 매 식사 때마다 양식과 한식 중 하나를 반드시 선택하였고, 전체 학생의 $60$%가 점심에 한식을 선택하였다. 점심에 양식을 선택한 학생의 $25$%는 저녁에도 양식을 선택하였고, 점심에 한식을 선택한 학생의 $30$%는 저녁에도 한식을 선택하였다. 이 고등학교 학생 중에서 임의로 선택한 한 명이 저녁에 양식을 선택한 학생일 때, 이 학생이 점심에 한식을 선택했을 확률은 $\\frac{q}{p}\\,$이다. $p+q\\,$의 값을 구하시오. (단, $p\\,$와 $q\\,$는 서로소인 자연수이다.) [4점]","answer":"47","sourceHash":"2bb26c9390784298798d918ffe4612eb16e44641e3e65384558c8cd313b3af94","steps":[{"id":"s1","latex":"A=\\{\\text{점심 한식}\\},\\qquad B=\\{\\text{저녁 양식}\\}"},{"id":"s2","latex":"P(A)=\\frac35,\\quad P(B\\mid A)=\\frac7{10},\\quad P(B\\mid A^c)=\\frac14"},{"id":"s3","latex":"P(A\\cap B)=\\frac35\\cdot\\frac7{10}=\\frac{21}{50}"},{"id":"s4","latex":"P(A^c\\cap B)=\\frac25\\cdot\\frac14=\\frac5{50}"},{"id":"s5","latex":"P(A\\mid B)=\\frac{21}{21+5}=\\frac{21}{26}"},{"id":"s6","latex":"p+q=26+21=\\boxed{47}"}],"diagram":null,"contentHash":"38dd061dd6cf71afe0d5ff6fa3875eefc797d5bddf1b4e83c746fae4a307774e","questionHtml":"\u003cp class=\"hp htall\">식문화 체험의 날에 어느 고등학교 전체 학생을 대상으로 점심과 저녁 식사를 제공하였다. 모든 학생들은 매 식사 때마다 양식과 한식 중 하나를 반드시 선택하였고, 전체 학생의 \u003cspan class=\"heq\">\\(60\\)\u003c/span>%가 점심에 한식을 선택하였다. 점심에 양식을 선택한 학생의 \u003cspan class=\"heq\">\\(25\\)\u003c/span>%는 저녁에도 양식을 선택하였고, 점심에 한식을 선택한 학생의 \u003cspan class=\"heq\">\\(30\\)\u003c/span>%는 저녁에도 한식을 선택하였다. 이 고등학교 학생 중에서 임의로 선택한 한 명이 저녁에 양식을 선택한 학생일 때, 이 학생이 점심에 한식을 선택했을 확률은 \u003cspan class=\"heq\">\\(\\dfrac{q}{p}\\,\\)\u003c/span>이다. \u003cspan class=\"heq\">\\(p+q\\,\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(p\\,\\)\u003c/span>와 \u003cspan class=\"heq\">\\(q\\,\\)\u003c/span>는 서로소인 자연수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"cbb8aa842aba3c08665c71e57
