<script>window.HandStudyGuide={"itemId":11749,"sourceHash":"38541640ba458cd30d8330a35db3c598456896aeb3691b32983f587779a864bd","contentHash":"445548e7e4cdf955bf6ec6f748bfd613fc5e254c0cbbdc7b8115be9efb6e30c1","overview":{"goal":"길이 \\(2\\)인 구간을 움직일 때 \\(|f(x)|\\)의 가장 큰 값이 어떻게 변하는지 따져 \\(a,b,c,m\\)을 구해요.","firstLook":"먼저 \\(|f(x)|\\le10\\)이 되는 고정 구간을 찾으면 \\(g(k)=10\\)이 가능한 이동구간의 중심 \\(k\\)를 알 수 있어요.","conditions":[{"label":"이동구간","meaning":"\\([k-1,k+1]\\) 전체가 허용 구간 안에 들어가면서 높이 \\(10\\)에 닿아야 \\(g(k)=10\\)이에요."},{"label":"두 최솟값 위치","meaning":"\\(f\\)가 \\(x=1\\)에 대칭이므로 구간 중심도 \\(k=1\\)을 기준으로 대칭이에요."}]},"chapters":[{"id":"c1","label":"높이가 10인 가장 큰 중심으로 계수를 정해요","stepIds":["s1","s2","s3","s4"],"question":"왜 가장 큰 \\(k\\)가 \\(d=\\sqrt{20/a}\\)인가요?","hint":"\\(|f(x)|\\le10\\)인 \\(x\\)의 범위를 먼저 구해요.","explanation":"\\(f(x)=a(x-1)^2-10\\)이고 \\(a>0\\)이므로 \\(f(x)\\ge-10\\)이에요. 따라서 \\(|f(x)|\\le10\\)은 \\(f(x)\\le10\\), 곧 \\(|x-1|\\le d\\)와 같고 \\(d=\\sqrt{20/a}\\)예요.\n\n길이 \\(2\\)인 구간 \\([k-1,k+1]\\)이 \\([1-d,1+d]\\) 안에 들어가려면 \\(2-d\\le k\\le d\\)예요. 이런 구간이 존재하려면 \\(d\\ge1\\)이고, 오른쪽 끝의 중심 \\(k=d\\)에서는 구간이 높이 \\(10\\)에 닿아 \\(g(k)=10\\)이에요. 따라서 가장 큰 \\(k\\)는 \\(d\\)이고, \\(d=\\sqrt{10}\\)에서 \\(a=2\\)예요.","check":{"prompt":"구간이 허용 범위 안에 들어가기만 하면 왜 높이 \\(10\\)에도 닿나요?","answer":"가장 큰 중심 \\(k=d\\)에서는 이동구간의 오른쪽 끝 \\(d+1\\)이 고정 구간의 오른쪽 끝 \\(1+d\\)와 같아져 \\(|f|=10\\)이에요."}},{"id":"c2","label":"대칭으로 한쪽 중심만 살펴요","stepIds":["s5","s6"],"question":"왜 \\(g(k)=g(2-k)\\)인가요?","hint":"\\(f(x)=2(x-1)^2-10\\)은 \\(x=1\\)에 대칭이에요.","explanation":"\\(|f(x)|\\)의 그래프가 \\(x=1\\)에 대칭이므로 중심이 \\(k\\)인 구간을 대칭시키면 중심이 \\(2-k\\)인 구간이 돼요. 따라서 \\(g(k)=g(2-k)\\)예요. 한쪽인 \\(k>2\\)만 보면, 구간에서 큰 값 후보는 왼쪽 끝 쪽의 \\(10-2(k-2)^2\\)와 오른쪽 끝의 \\(|2k^2-10|\\)예요. \\(g(k)\\)는 이 두 값 중 더 큰 값이에요.","check":{"prompt":"최솟값 위치가 하나 나오면 다른 하나는 어떻게 찾나요?","answer":"대칭축이 \\(k=1\\)이므로 한 위치가 \\(k=c\\)이면 다른 위치는 \\(k=2-c\\)예요."}},{"id":"c3","label":"두 후보가 만나는 중심을 찾아요","stepIds":["s7","s8","s9"],"question":"왜 \\(k=3\\)에서 가장 작은 값 \\(8\\)을 얻나요?","hint":"\\(2<k<3\\)에서는 첫 후보를, \\(k>3\\)에서는 둘째 후보를 \\(8\\)과 비교해요.","explanation":"두 후보가 같아지는 식 \\(10-2(k-2)^2=2k^2-10\\)을 풀면 \\(k=3\\)이에요. 이때 두 값 모두 \\(8\\)이에요.\n\n\\(0\\le k\\le2\\)에서는 이동구간이 꼭짓점 \\(x=1\\)을 포함하므로 \\(g(k)\\ge10\\)이고, \\(2<k<3\\)에서는 \\(10-2(k-2)^2>8\\), \\(k>3\\)에서는 \\(|2k^2-10|>8\\)이에요. 따라서 한쪽의 유일한 최솟값 위치는 \\(k=3\\), 대칭인 다른 위치는 \\(k=-1\\)이고 최솟값은 \\(m=8\\)이에요.","check":{"prompt":"\\(k=3\\)의 대칭 위치는 왜 \\(-1\\)인가요?","answer":"두 중심의 평균이 대칭축 \\(1\\)이어야 하므로 \\(2-3=-1\\)이에요."}},{"id":"c4","label":"마지막 식을 계산해요","stepIds":["s10"],"question":"요구한 값은 얼마인가요?","hint":"\\((b,c)=(-1,3)\\), \\(m=8\\)을 넣어요.","explanation":"\\(b^2+c^2+m^2=(-1)^2+3^2+8^2=1+9+64=74\\)예요.","check":{"prompt":"\\(b,c\\)의 순서를 바꾸면 결과가 달라지나요?","answer":"두 값은 제곱해서 더하므로 순서를 바꾸어도 결과는 같아요."}}],"takeaway":["이동구간에서 가장 큰 절댓값을 제한하려면 구간 전체가 들어가야 하는 고정 범위를 먼저 찾아요.","원래 함수의 대칭은 이동구간 중심에 대한 함수의 대칭으로 이어져요.","두 후보 중 더 큰 값의 최솟값은 한 후보가 내려가고 다른 후보가 올라갈 때 두 값이 만나는 지점에서 확인해요."]};</script>
