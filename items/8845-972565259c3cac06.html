  <script>window.HandStudyRecord={"itemId":8845,"sourceLabel":"2022 교육청 고2 수학 6월 19번","adminYear":2022,"grade":2,"month":6,"number":19,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 중심이 $O\\,$, 반지름의 길이가 $1\\,$이고 중심각의 크기가 $\\theta\\,$인 부채꼴 $O A B\\,$가 있다. 호 $A B\\,$의 삼등분점 중 점 $A\\,$에 가까운 점을 $C\\,$라 하고, 직선 $O A\\,$와 직선 $BC\\,$가 만나는 점을 $D\\,$라 하자. 다음은 두 선분 $AD\\,$, $CD\\,$와 호 $AC\\,$로 둘러싸인 부분의 넓이 $S\\, \\left( \\theta \\right) \\,$를 구하는 과정이다. (단, $0\\lt \\theta \\lt \\dfrac{3}{4} \\pi\\,$)\n[그림 1]\n점 $C\\,$가 호 $A B\\,$의 삼등분점 중 점 $A\\,$에 가까운 점이므로\n$\\angle BOC= {\\boxed{\\vphantom{(}\\,(\\text{가})\\,}} \\,$\n이다. 또한, 삼각형 $BOC\\,$에서 \n $\\angle OBC= \\angle OCB= \\dfrac{1}{2} \\left( \\pi - {\\boxed{\\vphantom{(}\\, \\left( \\text{가} \\right) \\,}} \\,\\right)\\,$\n이다. 한편, 삼각형 $BOD\\,$에서 사인법칙에 의하여\n${\\overline{OD }} = \\dfrac{\\cos\\, \\dfrac{\\theta }{3}}{\\, {\\boxed{\\vphantom{(}\\, \\left( \\text{나} \\right) \\,}} \\, }$\n이다. $S\\, \\left( \\theta \\right) \\,$는 삼각형 $COD\\,$의 넓이에서 부채꼴 $O A C\\,$의 넓이를 뺀 값이므로\n$S\\, \\left( \\theta \\right) =\\, \\dfrac{1}{2} \\times \\dfrac{\\cos\\, \\dfrac{\\theta }{3}}{\\, {\\boxed{\\vphantom{(}\\, \\left( \\text{나} \\right) \\,}} \\, } \\times \\sin \\dfrac{\\theta }{3} \\,-\\, {\\boxed{\\vphantom{(}\\, \\left( \\text{다} \\right) \\,}}$\n이다.\n위의 (가), (나), (다)에 알맞은 식을 각각 $f \\left( \\theta \\right) \\,$, $g \\left( \\theta \\right) \\,$, $h \\left( \\theta \\right) \\,$라 할 때, $\\dfrac{f \\left( \\dfrac{\\pi }{2} \\right) \\times g \\left( \\dfrac{\\pi }{4} \\right)}{h \\left( \\dfrac{\\pi }{8} \\right)} \\,$의 값은? [4점]\n① $8 \\sqrt{3}$ ② $\\dfrac{17 \\sqrt{3}}{2}$ ③ $9 \\sqrt{3}$ ④ $\\dfrac{19 \\sqrt{3}}{2}$ ⑤ $10 \\sqrt{3}$","answer":"①","sourceHash":"7cd4a87646aba8eeb623df8e3f067bbc23fe0881f5606c49510d432dbdeb34f9","steps":[{"id":"s1","latex":"f(\\theta)=\\angle BOC=\\frac{2\\theta}{3}"},{"id":"s2","latex":"\\angle BDO=\\frac\\pi2-\\frac{2\\theta}{3}"},{"id":"s3","latex":"OD=\\frac{\\cos(\\theta/3
