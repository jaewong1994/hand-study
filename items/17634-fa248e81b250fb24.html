  <script>window.HandStudyRecord={"itemId":17634,"sourceLabel":"2023 교육청 고3 수학기하 7월 14번","adminYear":2023,"grade":3,"month":7,"number":14,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"최고차항의 계수가 $1$이고 $f \\left(-3 \\right)=f \\left(0 \\right)$인 삼차함수 $f(x)$에 대하여 함수 $g(x)$를\n $g \\left(x \\right)= \\begin{cases}f \\left(x \\right) & \\left(x\u003c -3 \\text{ 또는 } x \\geq 0 \\right) \\\\ -f \\left(x \\right) & \\left(-3 \\leq x\u003c0 \\right)\\end{cases}$\n이라 하자. 함수 $g(x) g(x-3)$이 $x=k$에서 불연속인 실수 $k$의 값이 한 개일 때, \u003c보기>에서 옳은 것만을 있는 대로 고른 것은?\n[4점]\n\u003c보기>\nㄱ. 함수 $g(x) g(x-3)$은 $x=0$에서 연속이다.\nㄴ. $f(-6) \\times f(3)=0$\nㄷ. 함수 $g(x) g(x-3)$이 $x=k$에서 불연속인 실수 $k$가 음수일 때 집합 $\\{ x \\mid f(x)=0,\\ x\\text{는 실수}\\}$의 모든 원소의 합이 $-1$이면 $g \\left(-1 \\right)=\\,-48$이다.\n① ㄱ ② ㄱ, ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","answer":"⑤","sourceHash":"69a987006dab089f3e077a0540e93ef9e9a0d115095fe90629f28ea08c732b93","steps":[{"id":"s1","latex":"c=f(-3)=f(0)\\ne0\\qquad (c=0\\Rightarrow g\\text{가 }-3,0\\text{에서 모두 연속})"},{"id":"s2","latex":"\\lim_{x\\to0-}g(x)g(x-3)=(-c)c=\\lim_{x\\to0+}g(x)g(x-3)=g(0)g(-3)"},{"id":"s3","latex":"x=-3\\text{에서 불연속}\\iff f(-6)=0,\\qquad x=3\\text{에서 불연속}\\iff f(3)=0"},{"id":"s4","latex":"f(-6)f(3)=0"},{"id":"s5","latex":"\\text{불연속점의 합}=-1\\Rightarrow f(3)=0,\\quad f(x)=(x-3)^2(x+4)"},{"id":"s6","latex":"f(-6)=-162\\ne0,\\qquad g(-1)=-f(-1)=-48"},{"id":"s7","latex":"\\therefore\\ \\mathrm{I,II,III}"}],"diagram":null,"contentHash":"fd9ae3b10dc4313415fb27a5f781dbccd1ac9598adced7df3c1a2aa7a3b68b41","questionHtml":"\u003cp class=\"hp\">최고차항의 계수가 \u003cspan class=\"heq\">\\(1\\)\u003c/span>이고 \u003cspan class=\"heq\">\\(f \\left(-3 \\right)=f \\left(0 \\right)\\)\u003c/span>인 삼차함수 \u003cspan class=\"heq\">\\(f(x)\\)\u003c/span>에 대하여 함수 \u003cspan class=\"heq\">\\(g(x)\\)\u003c/span>를\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\(g \\left(x \\right)= {\\begin{cases}f \\left(x \\right)&& \\left(x\\lt  -3 \\, \\text{또는} \\, x \\geq 0 \\right) \\\\ -f \\left(x \\right)&& \\left(-3 \\leq x\\lt 0 \\right)\\end{cases}}\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">이라 하자. 함수 \u003cspan class=\"heq\">\\(g(x) g(x-3)\\)\u003c/span>이 \u003cspan class=\"heq\">\\(x=k\\)\u003c/span>에서 불연속인 실수 \u003cspan class=\"heq\">\\(k\\)\u003c/span>의 값이 한 개일 때, &lt;보기&gt;에서 옳은 것만을 있는 대로 고른 것은?\u003c/p>\u003cp class=\"hp\">\u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cdiv class=\"hbox\">\u003cdiv style=\"text-align:center;font-weight:700;margin:0 0 6px\">&lt; 보 기 &gt;\u003c/div>\u003cp class=\"hp\">ㄱ. 함수 \u003cspan class=\"heq\">\\(g(x) g(x-3)\\)\u003c/span>은 \u003cspan class=\"heq\">\\(x=0\\)\u003c/span>에서 연속이다.\u003c/p>\u003cp class=\"hp\">ㄴ. \u003cspan class=\"heq\">\\(f(-6) \\times f(3)=0\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">ㄷ. 함수 \u003cspan class=\"heq\">\\(g(x) g(x-3)\\)\u003c/span>이 \u003cspan class=\"heq\">\\(x=k\\)\u003c/span>에서 불연속인 실수 \u003cspan class=\"heq\">\\(k\\)\u003c/span>가 음수일 때 집합 \u003cspan class=\"heq\">\\(\\{ x \\,|\\, f(x)=0,\\, x\\)\u003c/span>는 실수\u003cspan class=\"heq\">\\(\\}\\)\u003c/span>의 모든 원소의 합이 \u003cspan class=\"heq\">\\(-1\\)\u003c/span>이면 \u003cspan class=\"heq\">\\(g \\left(-1 \\right)=\\,-48\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp class=\"hp\">① ㄱ&emsp;② ㄱ, ㄴ&emsp;③ ㄱ, ㄷ\u003c/p>\u003cp class=\"hp\">④ ㄴ, ㄷ&emsp;⑤ ㄱ, ㄴ, ㄷ\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"fa248e81b250fb243463ed0c064655c3ab24d4cc98f88f7feeda7c324e5bfe79"};</script>
