<script>window.HandStudyRecord={"itemId":17072,"sourceLabel":"2021 교육청 고3 수학기하 7월 28번","adminYear":2021,"grade":3,"month":7,"number":28,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 좌표평면에서 포물선 $y ^{2}$$=4x$의 초점 $F$를 지나고 $x$축과 수직인 직선 $l _{1}$이 이 포물선과 만나는 서로 다른 두 점을 각각 $A,\\,B$라 하고, 점 $F$를 지나고 기울기가 $m$$\\left( m>0 \\right)$인 직선 $l _{2}$가 이 포물선과 만나는 서로 다른 두 점을 각각 $C,\\,D$라 하자. 삼각형 $F C A$의 넓이가 삼각형 $F D B$의 넓이의 $5$배일 때, $m$의 값은? (단, 두 점 $A,\\,C$는 제$1$사분면 위의 점이고, 두 점 $B,\\,D$는 제$4$사분면 위의 점이다.) [4점]\n$F$$O$$x$$C$$D$$A$$B$$y$$y^2 =4x$$l_1$$l_2$\n① $\\frac{\\sqrt{3}}{2}$ ② $1$ ③ $\\frac{\\sqrt{5}}{2}$ ④ $\\frac{\\sqrt{6}}{2}$ ⑤ $\\frac{\\sqrt{7}}{2}$\n단답형","answer":"③","sourceHash":"af62da74d0cece0f9878605638014b47a6a6bbfa9f81ba5bfe8f99986d2cfd80","steps":[{"id":"s1","latex":"F=(1,0),\\quad A=(1,2),\\quad B=(1,-2)"},{"id":"s2","latex":"y^2=4x\\text{ 위의 점을 }(t^2,2t)\\text{로 둔다}"},{"id":"s3","latex":"X=(t^2,2t):\\quad FX=t^2+1,\\quad m=\\frac{2t}{t^2-1}"},{"id":"s4","latex":"C\\leftrightarrow t=u>0,\\quad D\\leftrightarrow t=v\u003c0"},{"id":"s5","latex":"mt^2-2t-m=0\\Rightarrow uv=-1"},{"id":"s6","latex":"[FCA]=5[FDB],\\quad FA=FB\\Rightarrow FC=5FD"},{"id":"s7","latex":"\\frac{u^2+1}{v^2+1}=5,\\quad v=-\\frac1u\\Rightarrow u^2=5"},{"id":"s8","latex":"m=\\frac{2\\sqrt5}{5-1}=\\boxed{\\frac{\\sqrt5}{2}}"}],"diagram":null,"contentHash":"8a4a842d201525186ae4f3e37c7ceeeda6236212f65212d90a1846e1bee21ad6","questionHtml":"\u003cp class=\"hp\">그림과 같이 좌표평면에서 포물선 \u003cspan class=\"heq\">\\(y^{2}\\)\u003c/span>\u003cspan class=\"heq\">\\(=4x\\)\u003c/span>의 초점 \u003cspan class=\"heq\">\\(F\\)\u003c/span>를 지나고 \u003cspan class=\"heq\">\\(x\\)\u003c/span>축과 수직인 직선 \u003cspan class=\"heq\">\\(l_{1}\\)\u003c/span>이 이 포물선과 만나는 서로 다른 두 점을 각각 \u003cspan class=\"heq\">\\(A,\\,B\\)\u003c/span>라 하고, 점 \u003cspan class=\"heq\">\\(F\\)\u003c/span>를 지나고 기울기가 \u003cspan class=\"heq\">\\(m\\)\u003c/span>\u003cspan class=\"heq\">\\(\\left( m\\gt 0 \\right)\\)\u003c
