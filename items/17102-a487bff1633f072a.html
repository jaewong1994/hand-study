<script>window.HandStudyRecord={"itemId":17102,"sourceLabel":"2021 교육청 고3 수학미적분 7월 22번","adminYear":2021,"grade":3,"month":7,"number":22,"track":"미적분","points":4,"scoreStatus":"confirmed_4_direct","questionText":"삼차함수 $f \\left( x \\right)$$= \\dfrac{2 \\sqrt{3}}{3} x \\left( x-3 \\right) \\left( x+3 \\right)$에 대하여 $x \\geq -3$에서 정의된 함수 $g \\left( x \\right)$는\n $g \\left( x \\right) = {\\begin{cases}f \\left( x \\right)&\\, \\left( -3 \\leq x \\leq 3 \\right) \\\\ eqalign{ \\\\ \\dfrac{1}{k+1} \\,f \\left( x-6k \\right)}&eqalign{ \\\\ \\, \\left( 6k-3 \\leq x\\lt 6k+3 \\right)}\\end{cases}}$\n     (단, $k$는 모든 자연수)\n이다. 자연수 $n$에 대하여 직선 $y$$=n$과 함수 $y$$=g \\left( x \\right)$의 그래프가 만나는 점의 개수를 $a_{n}$이라 할 때, $\\sum\\limits_{k=1}^{12} a_{n}$의 값을 구하시오. [4점]\n[도형 1]2021년 7월 고3 모의고사 문제지\n제2교시\n 수학영역(미적분)\n제2교시\n[도형 2]\n5지선다형","answer":"64","sourceHash":"01c769500087fcb94872ecd1a2836d2bd0c80b5a311576bdedeba18751a79e2a","steps":[{"id":"s1","latex":"f'(x)=2\\sqrt3(x^2-3)"},{"id":"s2","latex":"f(-\\sqrt3)=12,\\qquad f(0)=0"},{"id":"s3","latex":"r=1:\\ [-3,3],\\quad r=k+1\\ (k\\ge1):\\ [6k-3,6k+3)"},{"latex":"\\text{제 }r\\text{구간의 양의 극댓값}=\\dfrac{12}{r}","id":"s4"},{"id":"s5","latex":"n\u003c\\dfrac{12}{r}:\\ 2\\text{개},\\qquad n=\\dfrac{12}{r}:\\ 1\\text{개}"},{"id":"s6","latex":"n>\\dfrac{12}{r}:\\ 0\\text{개}\\quad\\text{각 구간의 교점 수를 합한다}"},{"id":"s7","latex":"(a_1,a_2,\\ldots,a_{12})=(23,11,7,5,4,3,2,2,2,2,2,1)"},{"id":"s8","latex":"\\sum_{k=1}^{12}a_k=23+11+7+5+4+3+5\\cdot2+1=64"}],"diagram":null,"contentHash":"4b43ef090ae6ab19d4554e04ebec59ffd64a756a7933e5d445d799b1d1aa3974","questionHtml":"\u003cp class=\"hp htall\">삼차함수 \u003cspan class=\"heq\">\\(f \\left( x \\right)\\)\u003c/span>\u003cspan class=\"heq\">\\(= \\dfrac{2 \\sqrt{3}}{3} x \\left( x-3 \\right) \\left( x+3 \\right)\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(x \\geq -3\\)\u003c/span>에서 정의된 함수 \u003cspan class=\"heq\">\\(g \\left( x \\right)\\)\u003c/span>는\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\(g(x)=\\begin{cases}f(x)&-3\\le x\\le3\\\\\\dfrac1{k+1}f(x-6k)&6k-3\\le x\\lt6k+3\\end{cases}\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">&emsp;&emsp;&emsp;&emsp;&emsp;(단, \u003cspan class=\"heq\">\\(k\\)\u003c/span>는 모든 자연수)\u003c/p>\u003cp class=\"hp htall\">이다. 자연수 \u003cspan class=\"heq\">\\(n\\)\u003c/span>에 대하여 직선 \u003cspan class=\"heq\">\\(y\\)\u003c/span>\u003cspan class=\"heq\">\\(=n\\)\u003c/span>과 함수 \u003cspan class=\"heq\">\\(y\\)\u003c/span>\u003cspan class=\"heq\">\\(=g \\left( x \\right)\\)\u003c/span>의 그래프가 만나는 점의 개수를 \u003cspan class=\"heq\">\\(a_{n}\\)\u003c/span>이라 할 때, \u003cspan class=\"heq\">\\(\\sum\\limits_{k=1}^{12} a_{n}\\)\u003c/span>의 값을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp hnotice\">※ 원문 합 기호의 항 a_n은 문맥과 공식 해설에 따라 a_k로 읽습니다.\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"a487bff1633f072aa97f2cb4e036afad775b31cc82ea48c46ea168274eedd8a9"};</script>
<script>window.HandStudyGuide={"itemId":17102,"sourceHash":"01c769500087fcb94872ecd1a2836d2bd0c80b5a311576bdedeba18751a79e2a","contentHash":"4b43ef090ae6ab19d4554e04ebec59ffd64a756a7933e5d445d799b1d1aa3974","overview":{"goal":"반복되는 각 구간에서 양의 극댓값이 얼마나 낮아지는지 보고, 높이 \\(n\\)인 수평선의 교점 수를 구간별로 더해요.","firstLook":"각 구간의 그래프는 같은 삼차함수를 세로로 \\(1/r\\)배 한 모양이에요. 양의 봉우리 높이는 \\(12/r\\)이에요.","conditions":[{"label":"첫 구간","meaning":"\\([-3,3]\\)에서는 원래 함수 \\(f\\)를 사용해요."},{"label":"뒤의 구간","meaning":"순서 \\(r=k+1\\)인 구간에서는 그래프 높이가 \\(1/r\\)배가 돼요."}]},"chapters":[{"id":"c1","label":"원래 그래프의 봉우리 높이를 구해요","stepIds":["s1","s2"],"question":"양의 극댓값은 어디에서 얼마인가요?","hint":"도함수의 근 \\(\\pm\\sqrt3\\)을 원래 함수에 넣으세요.","explanation":"\\(f'(x)=2\\sqrt3(x^2-3)\\)이므로 극점은 \\(x=\\pm\\sqrt3\\)예요. 양의 봉우리는 \\(x=-\\sqrt3\\)에서 생기고 \\(f(-\\sqrt3)=12\\)예요. 또 구간 경계 \\(-3,0,3\\)에서는 함숫값이 \\(0\\)이에요.","check":{"prompt":"높이가 양수인 수평선과 원래 한 봉우리가 만나는 점은 최대 몇 개인가요?","answer":"봉우리 높이보다 낮으면 올라갈 때와 내려갈 때 두 점에서 만나요."}},{"id":"c2","label":"각 반복 구간의 교점 수를 정해요","stepIds":["s3","s4","s5","s6"],"question":"순서가 \\(r\\)인 구간에서 높이 \\(n\\)과 몇 점에서 만나나요?","hint":"그 구간의 양의 극댓값 \\(12/r\\)와 n을 비교하세요.","explanation":"첫 구간을 \\(r=1\\), 뒤의 구간을 차례로 \\(r=2,3,\\ldots\\)라 보면 양의 극댓값은 \\(12/r\\)예요. \\(n<12/r\\)이면 양의 봉우리의 양쪽에서 두 점, \\(n=12/r\\)이면 꼭대기 한 점, \\(n>12/r\\)이면 교점이 없어요. 구간의 오른쪽 끝은 열려 있지만 그곳의 함숫값은 \\(0\\)이라 양의 \\(n\\)의 교점 수에는 영향을 주지 않아요.","check":{"prompt":"등호일 때 두 점이 아니라 한 점인 이유는 무엇인가요?","answer":"수평선이 극댓값을 주는 꼭대기에 접해 하나의 x좌표만 가지기 때문이에요."}},{"id":"c3","label":"열두 개의 교점 수를 계산해요","stepIds":["s7"],"question":"\\(a_n\\)을 빠르게 구하는 규칙은 무엇인가요?","hint":"\\(12/n\\)이 정수인지 구분하세요.","explanation":"\\(12/n=m\\)이 자연수이면 \\(r=1,\\ldots,m-1\\)에서 두 점씩, \\(r=m\\)에서 한 점이라 \\(a_n=2m-1\\)이에요. 정수가 아니면 \\(r\\le\\lfloor12/n\\rfloor\\)인 구간마다 두 점이라 \\(a_n=2\\lfloor12/n\\rfloor\\)예요. 따라서 \\((a_1,\\ldots,a_{12})=(23,11,7,5,4,3,2,2,2,2,2,1)\\)이에요.","check":{"prompt":"예를 들어 \\(a_5=4\\)인 이유는 무엇인가요?","answer":"\\(12/5\\)는 2와 3 사이이므로 첫 두 구간에서 각각 두 점, 이후에는 0점이에요."}},{"id":"c4","label":"교점 수를 모두 더해요","stepIds":["s8"],"question":"열두 값을 더하면 얼마인가요?","hint":"값이 2인 다섯 항을 묶으세요.","explanation":"\\(23+11+7+5+4+3+5\\times2+1=64\\)예요.","check":{"prompt":"값이 2인 항은 몇 개인가요?","answer":"\\(n=7,8,9,10,11\\)의 다섯 개예요."}}],"takeaway":["반복 그래프는 구간 순서에 따른 세로 확대 비율을 먼저 찾아요.","수평선이 극댓값과 같을 때는 접점 하나만 세어요.","교점 수 공식은 나눗셈 결과가 정수인지에 따라 등호 경우를 따로 처리해요."]};</script>
