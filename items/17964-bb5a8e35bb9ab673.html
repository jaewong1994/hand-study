}}\\)<\/span>, <span class=\"heq\">\\({{B}}\\)<\/span>와 가까운 점을 <span class=\"heq\">\\({{D}}\\)<\/span>라 하고, 선분 <span class=\"heq\">\\({{BC}}\\)<\/span>를 지름으로 하는 원을 <span class=\"heq\">\\(O\\)<\/span>라 하자. 원 <span class=\"heq\">\\(O\\)<\/span> 위의 점 <span class=\"heq\">\\({{P}}\\)<\/span>를<\/p><p class=\"hp htall\">&emsp;&emsp;<span class=\"heq\">\\(\\angle BAP = \\theta \\, \\left( 0\\lt  \\theta \\lt  \\dfrac{\\pi }{6} \\right)\\)<\/span><\/p><p class=\"hp htall\">가 되도록 잡고, 두 점 <span class=\"heq\">\\({{P}}\\)<\/span>, <span class=\"heq\">\\({{D}}\\)<\/span>를 지나는 직선이 원 <span class=\"heq\">\\(O\\)<\/span>와 만나는 점 중 <span class=\"heq\">\\({{P}}\\)<\/span>가 아닌 점을 <span class=\"heq\">\\({{Q}}\\)<\/span>라 하자. 선분 <span class=\"heq\">\\({{AQ}}\\)<\/span>의 길이를 <span class=\"heq\">\\(f( \\theta)\\)<\/span>라 할 때, <span class=\"heq\">\\(\\cos \\theta_{0}=\\dfrac{7}{8}\\)<\/span>인 <span class=\"heq\">\\(\\theta_{0}\\)<\/span>에 대하여 <span class=\"heq\">\\(f' \\left( \\theta_{0} \\right)=k\\)<\/span>이다. <span class=\"heq\">\\(k^{2}\\)<\/span>의 값을 구하시오. <br><span class=\"heq\">\\(( \\begin{matrix} \\\\ \\end{matrix}\\)<\/span>단, <span class=\"heq\">\\(\\angle {{APD}} \\lt \\dfrac{ \\pi}{2}\\)<\/span>이고 <span class=\"heq\">\\(0\\lt  \\theta_{0}\\lt \\dfrac{ \\pi}{6}\\)<\/span>이다.<span class=\"heq\">\\(\\begin{matrix} \\\\ \\end{matrix} )\\)<\/span> <span class=\"hscore\">[4점]<\/span><\/p><p class=\"hp\"><img class=\"hfig\" src=\"../assets/figures/3e176aaa1d9f2422373e90e2.png\" style=\"width:1253px;max-width:100%\"><\/p>","questionText":"그림과 같이 길이가 $3$인 선분 ${{AB}}$를 삼등분하는 점 중 ${{A}}$와 가까운 점을 ${{C}}$, ${{B}}$와 가까운 점을 ${{D}}$라 하고, 선분 ${{BC}}$를 지름으로 하는 원을 $O$라 하자. 원 $O$ 위의 점 ${{P}}$를\n $\\angle BAP = \\theta \\, \\left( 0< \\theta < \\frac{\\pi }{6} \\right)$\n가 되도록 잡고, 두 점 ${{P}}$, ${{D}}$를 지나는 직선이 원 $O$와 만나는 점 중 ${{P}}$가 아닌 점을 ${{Q}}$라 하자. 선분 ${{AQ}}$의 길이를 $f( \\theta)$라 할 때, $\\cos \\theta_{0}=\\frac{7}{8}$인 $\\theta_{0}$에 대하여 $f ' \\left( \\theta_{0} \\right)=k$이다. $k^{2}$의 값을 구하시오. $\\left( \\begin{matrix} \\\\ \\end{matrix}$단, $\\angle {{APD}} <\\frac{ \\pi}{2}$이고 $0< \\theta_{0}<\\frac{ \\pi}{6}$이다.$\\begin{matrix} \\\\ \\end{matrix} \\right)$ [4점]","scoreStatus":"confirmed_4_direct","sourceHash":"aa4c768b9cc5f10a5f8306469b5b4146b27f4fd4f7782d4cbf81274f2c0eb43f","sourceLabel":"2024 교육청 고3 수학미적분 5월 29번","stepExplanations":{"s2":{"body":"\\(BC=2\\)이고 \\(D\\)가 그 중점이므로 \\(DP=DQ=1\\), \\(AD=2\\)예요. 삼각형 \\(ADP\\)에서 사인법칙을 쓰면 \\(\\frac{\\sin\\alpha}{2}=\\sin\\theta\\)이어서 \\(\\sin\\alpha=2\\sin\\theta\\)예요. 또 \\(P,D,Q\\)는 일직선 위에 있고 \\(DP\\)와 \\(DQ\\)가 반대 방향이므로 \\(\\angle ADQ=\\theta+\\alpha\\)예요. 삼각형 \\(ADQ\\)에 코사인법칙을 쓰면 \\(f^2=2^2+1^2-2\\cdot2\\cdot1\\cos(\\theta+\\alpha)\\)를 얻어요.","skillTags":["algebra.calculation","geometry.reasoning"],"title":"D가 원의 중심이라는 점을 이용해요"},"s3":{"body":"\\(\\sin\\alpha=2\\sin\\theta\\)를 \\(\\theta\\)로 미분하면 \\(\\cos\\alpha\\cdot\\alpha^{\\prime}=2\\cos\\theta\\)예요. 문제에서 \\(\\alpha<\\frac\\pi2\\)이고 삼각형의 내각이므로 \\(\\cos\\alpha>0\\)이라 나눌 수 있어요. 또한 \\(f^2=5-4\\cos(\\theta+\\alpha)\\)를 미분하면 \\(2ff^{\\prime}=4\\sin(\\theta+\\alpha)(1+\\alpha^{\\prime})\\)예요.","skillTags":["calculus.derivative","reasoning.casework"],"title":"α도 θ에 따라 달라지는 각이에요"},"s5":{"body":"\\(\\sin\\theta_0=\\frac{\\sqrt{15}}8\\)이므로 \\(\\sin\\alpha_0=\\frac{\\sqrt{15}}4\\)이고, \\(\\alpha_0\\)가 예각이어서 \\(\\cos\\alpha_0=\\frac{1}{4}\\)이에요. 따라서 \\(\\cos(\\theta_0+\\alpha_0)=\\frac{7}{32}-\\frac{15}{32}=-\\frac{1}{4}\\), \\(\\sin(\\theta_0+\\alpha_0)=\\frac{\\sqrt{15}}{32}+\\frac{7\\sqrt{15}}{32}=\\frac{\\sqrt{15}}4\\)예요. 길이 \\(f\\)는 양수이므로 \\(f(\\theta_0)=\\sqrt6\\)이고, \\(\\alpha_0^{\\prime}=7\\)을 넣으면 \\(f^{\\prime}(\\theta_0)=\\frac{4\\sqrt{15}}{\\sqrt6}=2\\sqrt{10}\\)이에요.","skillTags":["geometry.reasoning","reasoning.casework"],"title":"합각의 사인과 코사인을 각각 계산해요"}},"steps":[{"id":"s1","latex":"\\sin\\alpha=2\\sin\\theta,\\quad \\alpha=\\angle APD"},{"id":"s2","latex":"f^2=5-4\\cos(\\theta+\\alpha)"},{"id":"s3","latex":"\\alpha^{\\prime}=\\frac{2\\cos\\theta}{\\cos\\alpha},\\quad ff^{\\prime}=2\\sin(\\theta+\\alpha)(1+\\alpha^{\\prime})"},{"id":"s4","latex":"\\cos\\theta_0=\\frac78\\Rightarrow\\sin\\alpha_0=\\frac{\\sqrt{15}}4,\\ \\cos\\alpha_0=\\frac14,\\ \\alpha_0^{\\prime}=7"},{"id":"s5","latex":"f(\\theta_0)=\\sqrt6,\\ \\sin(\\theta_0+\\alpha_0)=\\frac{\\sqrt{15}}4"},{"id":"s6","latex":"f^{\\prime}(\\theta_0)=2\\sqrt{10}\\Rightarrow k^2=40"}],"track":"미적분","editionHash":"bf431f3e8916bf89e58ed8ec63b1a47fce6a5fbf341fe21dc6083bf8a28ee3a0"};</script>
