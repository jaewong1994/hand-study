<script>window.HandStudyRecord={"itemId":12040,"sourceLabel":"2024 교육청 고1 수학 6월 21번","adminYear":2024,"grade":1,"month":6,"number":21,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"최고차항의 계수가 $2$인 이차함수 $f(x)$와 최고차항의 계수가 $-1$인 이차함수 $g(x)$가 다음 조건을 만족시킨다.\n(가) 함수 $y=f(x)$의 그래프가 직선 $y=x$와 원점이 아닌 서로 다른 두 점 ${{P}}$, ${{Q}}$에서 만난다.(나) 함수 $y=g(x)$의 그래프가 직선 $y=x$와 한 점 ${{P}}$에서만 만난다.(다) 점 ${{P}}$의 $x$좌표는 점 ${{Q}}$의 $x$좌표보다 작고, $\\frac{}{l} i n e{{{OP}} }\\frac{=}{l} i n e{{{PQ}} }$이다.\n부등식 $f(x)+g(x) \\geq 0$의 해가 모든 실수일 때, 점 ${{P}}$의 $x$좌표의 최댓값은? (단, ${{O}}$는 원점이다.) [4점]\n① $1+ \\sqrt{3}$ ② $2+ \\sqrt{3}$ ③ $3+ \\sqrt{3}$\n④ $4+ \\sqrt{3}$ ⑤ $5+ \\sqrt{3}$\n단답형","answer":"②","sourceHash":"a5bed692df00137a4931a03f0bb07a11f91ddfdd985325caf3324a1a268cad3e","steps":[{"id":"s1","latex":"P=(p,p),\\ Q=(q,q),\\ p\u003cq,\\quad OP=PQ\\Rightarrow q=2p,\\ p>0"},{"id":"s2","latex":"f(x)-x=2(x-p)(x-2p)\\Rightarrow f(x)=2x^2+(1-6p)x+4p^2"},{"id":"s3","latex":"g(x)-x=-(x-p)^2\\Rightarrow g(x)=-x^2+(2p+1)x-p^2"},{"id":"s4","latex":"f(x)+g(x)=x^2+(2-4p)x+3p^2"},{"id":"s5","latex":"f+g\\ge0\\ (\\forall x)\\Rightarrow(2-4p)^2-12p^2\\le0"},{"id":"s6","latex":"p^2-4p+1\\le0\\Rightarrow2-\\sqrt3\\le p\\le2+\\sqrt3"},{"id":"s7","latex":"p_{\\max}=2+\\sqrt3"}],"diagram":null,"contentHash":"030e1be39fbe662a17d011c1dcef8102bc4a151de5d549c45be7996b0e86de70","questionHtml":"\u003cp class=\"hp\">최고차항의 계수가 \u003cspan class=\"heq\">\\(2\\)\u003c/span>인 이차함수 \u003cspan class=\"heq\">\\(f(x)\\)\u003c/span>와 최고차항의 계수가 \u003cspan class=\"heq\">\\(-1\\)\u003c/span>인 이차함수 \u003cspan class=\"heq\">\\(g(x)\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) 함수 \u003cspan class=\"heq\">\\(y=f(x)\\)\u003c/span>의 그래프가 직선 \u003cspan class=\"heq\">\\(y=x\\)\u003c/span>와 원점이 아닌 서로 다른 두 점 \u003cspan class=\"heq\">\\({{P}}\\)\u003c/span>, \u003cspan class=\"heq\">\\({{Q}}\\)\u003c/span>에서 만난다.\u003c/p>\u003cp class=\"hp\">(나) 함수 \u003cspan class=\"heq\">\\(y=
