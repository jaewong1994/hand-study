<script>window.HandStudyRecord={"adminYear":2022,"answer":"26","contentHash":"525c0837059858ff18c937ccf3d3c82a37706adf8bc039230cf05984fc028d46","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24844,"month":11,"number":29,"points":4,"preview":false,"questionHtml":"\u003cp>세 상수 \u003cspan class=\"heq\">\\(a,\\,b,\\,c\\)\u003c/span>에 대하여 함수 \u003cspan class=\"heq\">\\(f \\left( x \\right)=ae^{2x} +be^x +c\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox hcond\">\u003cp class=\"hcondr\">(가) \u003cspan class=\"heq\">\\(\\lim _{x\\, \\rightarrow \\,- \\infty } {\\,} \\frac{f \\left( x \\right) +6}{e ^{x}} =1\\)\u003c/span>\u003c/p>\u003cp class=\"hcondr\">(나) \u003cspan class=\"heq\">\\(f \\left( \\ln\\,2 \\right)=0\\)\u003c/span>\u003c/p>\u003c/div>\u003cp>함수 \u003cspan class=\"heq\">\\(f \\left( x \\right)\\)\u003c/span>의 역함수를 \u003cspan class=\"heq\">\\(g \\left( x \\right)\\)\u003c/span>라 할 때, \u003cspan class=\"heq\">\\(\\int _{ 0} ^{14 } { g(x)}\\,dx=p+q \\ln\\,2\\)\u003c/span>이다. \u003cspan class=\"heq\">\\(p+q\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(p,\\,q\\)\u003c/span>는 유리수이고, \u003cspan class=\"heq\">\\(\\ln\\,2\\)\u003c/span>는 무리수이다.) [4점]\u003c/p>","questionText":"세 상수 $a,\\,b,\\,c$에 대하여 함수 $f \\left( x \\right)=ae^2x +be^x +c$가 다음 조건을 만족시킨다.\n(가) $\\lim _{x\\, \\rightarrow \\,- \\infty } {\\,} \\frac{f \\left( x \\right) +6}{e ^{x}} =1$(나) $f \\left( \\ln\\,2 \\right)=0$\n함수 $f \\left( x \\right)$의 역함수를 $g \\left( x \\right)$라 할 때, $\\int _{ 0} ^{14 } { g(x)}\\,dx=p+q \\ln\\,2$이다. $p+q$의 값을 구하시오. (단, $p,\\,q$는 유리수이고, $\\ln\\,2$는 무리수이다.) [4점]","sourceHash":"d651ae605c4c7d1586aa1db368edd0c20c896c2b8bf66fd8e6b8d889ba23c2a2","sourceKind":"csat","sourceLabel":"2022년 시행 수능 · 2023학년도 · 미적분 · 29번","steps":[{"id":"s1","latex":"\\frac{f(x)+6}{e^x}=ae^x+b+(c+6)e^{-x}"},{"id":"s2","latex":"x\\to-\\infty\\text{에서 유한한 극한 }1\\text{을 가지므로 }c=-6,\\quad b=1"},{"id":"s3","latex":"f(\\ln2)=4a+2-6=0\\ \\Rightarrow\\ a=1"},{"id":"s4","latex":"f(x)=e^{2x}+e^x-6,\\quad f\\prime(x)=2e^{2x}+e^x>0"},{"id":"s5","latex":"f(\\ln2)=0,\\quad f(\\ln4)=14\\ \\Rightarrow\\ g(0)=\\ln2,\\quad g(14)=\\ln4"},{"explanation":{"body":"\\(g(x)\\)를 직접 구하면 근호와 로그가 섞여 적분하기 복잡해져요. 대신 \\(t=g(x)\\)로 두면 역함수 관계에서 \\(x=f(t)\\)가 돼요. 따라서 \\(dx=f\\prime(t)\\,dt\\)이고 적분할 함수는 \\(t f\\prime(t)\\)로 바뀌어요. \\(f\\prime>0\\)이라 대응이 한 방향으로 이어지므로 두 끝점도 \\(0,14\\)에서 \\(\\ln2,\\ln4\\)로 바꿔야 해요.","skillTags":["integration.inverse-substitution"],"title":"왜 역함수를 새 변수로 둘까요?"},"id":"s6","latex":"t=g(x),\\quad x=f(t),\\quad dx=f\\prime(t)\\,dt"},{"id":"s7","latex":"I=\\int_0^{14}g(x)\\,dx=\\int_{\\ln2}^{\\ln4}t f\\prime(t)\\,dt"},{"explanation":{"body":"\\(t\\)는 미분하면 \\(1\\)이 되고, \\(f\\prime(t)\\)는 적분하면 이미 알고 있는 \\(f(t)\\)가 돼요. 그래서 부분적분 뒤에는 \\(\\int f(t)\\,dt\\)만 남아요. 여기서는 \\(u=t\\), \\(dv=f\\prime(t)dt\\)로 잡은 것이고, 숫자나 적분구간이 달라져도 이 두 장점이 있으면 같은 선택이 유효해요.","skillTags":["integration.by-parts"],"title":"어느 쪽을 미분하고 적분할까요?"},"id":"s8","latex":"I=[tf(t)]_{\\ln2}^{\\ln4}-\\int_{\\ln2}^{\\ln4}f(t)\\,dt"},{"id":"s9","latex":"=14\\ln4-\\left[\\frac12e^{2t}+e^t-6t\\right]_{\\ln2}^{\\ln4}"},{"explanation":{"body":"상한 \\(t=\\ln4\\)에서는 \\(e^t=4\\), \\(e^{2t}=16\\)이고, 하한 \\(t=\\ln2\\)에서는 각각 \\(2,4\\)예요. 하한의 \\(-6\\ln2\\)까지 괄호째 빼야 \\(8-6\\ln2\\)가 돼요. 마지막에는 앞의 \\(28\\ln2\\)에서 이 값을 빼므로 로그의 계수가 \\(28+6=34\\)가 돼요.","skillTags":["integration.endpoint-evaluation"],"title":"상한값에서 하한값 전체를 빼요"},"id":"s10","latex":"=28\\ln2-\\{(8+4-6\\ln4)-(2+2-6\\ln2)\\}"},{"id":"s11","latex":"=28\\ln2-(8-6\\ln2)=-8+34\\ln2"},{"id":"s12","latex":"p=-8,\\quad q=34\\ \\Rightarrow\\ \\boxed{p+q=26}"}],"track":"미적분"};</script>
<script>window.HandStudyGuide={"itemId":24844,"sourceHash":"d651ae605c4c7d1586aa1db368edd0c20c896c2b8bf66fd8e6b8d889ba23c2a2","contentHash":"525c0837059858ff18c937ccf3d3c82a37706adf8bc039230cf05984fc028d46","overview":{"goal":"함수를 확정한 뒤 역함수 적분을 원래 함수의 적분으로 바꾸어 \\(p+q\\)를 구해요.","firstLook":"역함수 식을 직접 풀기보다 \\(t=g(x)\\)로 치환하면 계산이 단순해져요.","conditions":[{"label":"무한대에서의 극한","meaning":"발산하는 항의 계수는 0이어야 하고 남는 상수항이 1이어야 해요."},{"label":"역함수 적분","meaning":"\\(f\\)가 증가하는지 확인한 뒤 적분구간도 함께 바꿔요."}]},"chapters":[{"id":"c1","label":"계수와 증가성 확정","stepIds":["s1","s2","s3","s4"],"question":"\\(x\\to-\\infty\\)에서 어떤 항이 발산할 수 있나요?","hint":"\\(e^{-x}\\)의 거동을 먼저 보세요.","explanation":"\\((f(x)+6)/e^x=ae^x+b+(c+6)e^{-x}\\)에서 마지막 항이 유한하려면 \\(c=-6\\)이고, 극한값 1에서 \\(b=1\\)예요. \\(f(\\ln 2)=0\\)을 넣어 \\(a=1\\)을 얻어요. 그러면 \\(f'(x)=2e^{2x}+e^x>0\\)이므로 역함수의 대응이 한 방향으로 정해져요.","check":{"prompt":"\\(c=-6\\)을 먼저 정하는 이유는 무엇인가요?","answer":"\\(e^{-x}\\)가 발산하므로 그 계수 \\(c+6\\)이 0이 아니면 주어진 유한한 극한이 존재하지 않기 때문이에요."}},{"id":"c2","label":"역함수 치환과 부분적분","stepIds":["s5","s6","s7","s8"],"question":"\\(g(x)\\)를 직접 구하지 않고 적분하려면 무엇을 새 변수로 둘까요?","hint":"\\(t=g(x)\\)이면 \\(x=f(t)\\)예요.","explanation":"\\(f(\\ln 2)=0\\), \\(f(\\ln 4)=14\\)이므로 구간은 \\([\\ln 2,\\ln 4]\\)로 바뀌어요. \\(t=g(x)\\), \\(dx=f'(t)dt\\)로 두면 \\(I=\\int t f'(t)dt\\)이고, \\(t\\)를 미분하는 부분적분으로 \\([tf(t)]-\\int f(t)dt\\)가 돼요.","check":{"prompt":"치환 뒤 아래끝과 위끝은 각각 무엇인가요?","answer":"\\(x=0\\)일 때 \\(t=g(0)=\\ln 2\\), \\(x=14\\)일 때 \\(t=g(14)=\\ln 4\\)예요."}},{"id":"c3","label":"끝값 계산과 답 대조","stepIds":["s9","s10","s11","s12"],"question":"하한을 뺄 때 특히 놓치기 쉬운 항은 무엇인가요?","hint":"적분한 식 전체를 괄호로 묶으세요.","explanation":"\\([\\frac12e^{2t}+e^t-6t]_{\\ln 2}^{\\ln 4}\\)에서 위끝은 \\(12-6\\ln 4\\), 아래끝은 \\(4-6\\ln 2\\)예요. 따라서 적분값은 \\(-8+34\\ln 2\\)이고 \\(p=-8,q=34\\)이므로 \\(p+q=26\\)예요.","check":{"prompt":"\\(14\\ln 4\\)는 \\(\\ln 2\\)로 어떻게 바뀌나요?","answer":"\\(\\ln 4=2\\ln 2\\)이므로 \\(14\\ln 4=28\\ln 2\\)예요."}}],"takeaway":["역함수 적분은 \\(t=g(x)\\) 치환으로 원래 함수에 되돌릴 수 있어요.","치환에서는 단조성과 양 끝값을 함께 확인해요."]};</script>
