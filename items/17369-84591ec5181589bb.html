<script>window.HandStudyGuide={"itemId":17369,"sourceHash":"97e7b8e470ca16913d4800c4cb4823a7308bb8e72a1425db2aa00a823f7627af","contentHash":"35110122a2314ac0e8d228c2c4113c22a3ce184b1e4a3ba74bb34a8c4fa0c84f","overview":{"goal":"네 구간에서 모양을 위로 붙일지 아래로 붙일지를 부호로 나타내고, 변곡점 개수에 맞는 모든 경우의 절댓값 넓이를 비교해요.","firstLook":"각 구간의 식을 따로 길게 쓰기보다, \\(1-\\cos t\\) 앞에 붙는 부호 네 개를 추적하면 변곡점과 넓이를 함께 관리할 수 있어요.","conditions":[{"label":"구간마다 두 가지 연결 방법","meaning":"각 길이 \\(\\pi\\) 구간의 증가량은 \\(1-\\cos t\\) 또는 그 반대예요."},{"label":"변곡점이 여섯 개","meaning":"구간 안에서 생기는 네 개에 더해 경계 세 곳 중 정확히 두 곳이 변곡점이어야 해요."}]},"chapters":[{"id":"c1","label":"구간의 모양을 부호로 나타내기","stepIds":["s1","s2","s3"],"question":"각 구간 안에서 오목과 볼록이 바뀌는 위치는 부호 선택과 관계없이 어디일까요?","hint":"\\(f''(n\\pi+t)\\)의 부호는 \\(s_n\\cos t\\)로 정리돼요.","explanation":"\\(0\\le t\\le\\pi\\)에서 기본 모양은 \\(1-\\cos t\\)예요. \\(n\\)번째 구간에서는 이를 그대로 더하거나 반대로 더하므로 \\(f(n\\pi+t)=f(n\\pi)+s_n(1-\\cos t)\\)로 쓸 수 있어요. 첫 구간은 \\(s_0=1\\)이고 나머지는 각각 \\(1\\) 또는 \\(-1\\)이에요.\n\n구간 안에서 두 번 미분하면 \\(f''(n\\pi+t)=s_n\\cos t\\)예요. \\(\\cos t\\)는 \\(t=\\pi/2\\)에서 부호가 바뀌므로 \\(x=\\pi/2,3\\pi/2,5\\pi/2,7\\pi/2\\)는 부호 선택과 무관하게 모두 변곡점이에요.","check":{"prompt":"구간 안에서 확보되는 변곡점은 모두 몇 개인가요?","answer":"네 구간마다 하나씩이므로 4개예요."}},{"id":"c2","label":"경계의 변곡점과 부호열 찾기","stepIds":["s4","s5"],"question":"경계 \\(x=n\\pi\\)의 왼쪽과 오른쪽에서 이계도함수의 부호가 반대가 되려면 이웃한 두 부호는 어떤 관계여야 할까요?","hint":"왼쪽에서는 \\(\\cos\\pi=-1\\), 오른쪽에서는 \\(\\cos0=1\\)을 넣으세요.","explanation":"\\(x=n\\pi\\)의 바로 왼쪽에서 이계도함수의 부호는 \\(-s_{n-1}\\), 바로 오른쪽에서는 \\(s_n\\)이에요. 오목과 볼록이 바뀌려면 이 두 부호가 반대여야 하므로 \\(s_n=s_{n-1}\\)이어야 해요.\n\n전체 변곡점은 6개이고 구간 안에서 이미 4개가 있으므로, 세 경계 중 정확히 두 곳에서 이웃한 부호가 같아야 해요. \\(s_0=1\\)에서 부호가 달라지는 경계를 하나만 고르면 되므로 가능한 열은 \\((+,-,-,-)\\), \\((+,+,-,-)\\), \\((+,+,+,-)\\) 세 가지예요.","check":{"prompt":"부호가 한 번도 바뀌지 않는 \\((+,+,+,+)\\)가 제외되는 이유는 무엇인가요?","answer":"세 경계가 모두 변곡점이 되어 전체 변곡점이 \\(4+3=7\\)개가 되기 때문이에요."}},{"id":"c3","label":"세 경우의 절댓값 넓이 비교하기","stepIds":["s6","s7","s8","s9"],"question":"각 부호열에서 구간 시작값을 누적하면 네 구간의 절댓값 넓이는 어떻게 달라질까요?","hint":"\\(\\int_0^\\pi(1-\\cos t)\\,dt=\\pi\\)를 쓰고, 각 구간의 세로 이동값도 함께 더하세요.","explanation":"한 구간에서 \\(\\int_0^\\pi(1-\\cos t)\\,dt=\\pi\\)예요. \\((+,-,-,-)\\)에서는 구간 끝값이 \\(0,2,0,-2,-4\\)로 이어져 절댓값 넓이가 차례로 \\(\\pi,\\pi,\\pi,3\\pi\\), 합이 \\(6\\pi\\)예요. \\((+,+,-,-)\\)에서는 높이가 \\(0,2,4,2,0\\)으로 이어져 넓이가 \\(\\pi,3\\pi,3\\pi,\\pi\\), 합이 \\(8\\pi\\)예요. \\((+,+,+,-)\\)에서는 높이가 \\(0,2,4,6,4\\)로 이어져 넓이가 \\(\\pi,3\\pi,5\\pi,5\\pi\\), 합이 \\(14\\pi\\)예요. 가능한 세 경우를 모두 비교했으므로 가장 작은 값은 \\(6\\pi\\), 정답은 ②예요.","check":{"prompt":"가장 작은 값이 \\(6\\pi\\)라는 결론이 빠뜨린 부호열 없이 완전한 이유는 무엇인가요?","answer":"변곡점 조건은 세 경계 중 부호가 달라지는 곳이 정확히 한 곳임을 뜻하고, 그 위치 세 가지를 모두 계산했기 때문이에요."}}],"takeaway":["반복되는 조각은 부호열로 나타내면 경계 조건을 체계적으로 셀 수 있어요.","변곡점은 구간 내부와 조각 경계에서 생기는 경우를 따로 세어요.","최솟값을 구할 때는 가능한 경우를 모두 만든 뒤 실제 절댓값 넓이를 비교해요."]};</script>
