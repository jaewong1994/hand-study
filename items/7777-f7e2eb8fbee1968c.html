<script>window.HandStudyGuide={"itemId":7777,"sourceHash":"c5a39e500494350741fb45ef02c90f46a63e492f10953e109d8c86939ffbc6da","contentHash":"13f7ebc27ac5da85807bb4d4313bef194e4170bc6d39c9dc6f733209f78cf480","overview":{"goal":"밑을 소인수분해해 가능한 두 근의 곱을 분류하고, \\(k\\)가 \\(72\\)부터 \\(80\\)일 때 경우의 수가 정확히 \\(59\\)임을 확인해요.","firstLook":"\\(24^{1/5}=2^{3/5}3^{1/5}\\)이므로 두 인수의 2와 3의 지수 합을 각각 맞춰야 해요. 같은 근도 밑과 지수를 여러 방식으로 나타낼 수 있어요.","conditions":[{"label":"자연수 범위","meaning":"밑 \\(a,c\\)와 분모 \\(b,d\\)가 모두 \\(2\\) 이상 \\(k\\) 이하예요."},{"label":"근의 곱","meaning":"소수 2와 3의 지수를 각각 \\(3/5,1/5\\)로 맞춰요."}]},"chapters":[{"id":"c1","label":"주요 네 가족을 세어요","stepIds":["s1","s2"],"question":"왜 네 쌍에서 각각 \\(12\\)가지가 나오나요?","hint":"같은 근 \\(m^{r/s}\\)을 \\((m^j)^{r/(sj)}\\)로 나타낼 수 있는 j를 세세요.","explanation":"곱에 다른 소수가 들어가면 없어질 수 없으므로 \\(a=2^u3^v,c=2^s3^t\\)로 놓을 수 있어요. 그러면 지수는 \\(u/b+s/d=3/5\\), \\(v/b+t/d=1/5\\)를 만족해야 해요. \\(a,b,c,d\\le80\\)에서 이 두 식을 만족하는 양의 두 인수의 무순서 쌍을 적으면 모두 일곱 가족이고, 그중 네 가족은 \\((3^{1/5},2^{3/5})\\), \\((2^{1/5},12^{1/5})\\), \\((4^{1/5},6^{1/5})\\), \\((\\sqrt2,18^{1/10})\\)예요. 첫 쌍은 \\(3^{1/5}\\)의 표현이 \\(j=1,2,3\\), \\(2^{3/5}\\)의 표현이 \\(j=1,2\\)라 \\(3\\times2\\times2=12\\)가지예요. 나머지 세 쌍도 각각 두 근의 표현 수의 곱이 \\(6\\)이고 순서 교환 \\(2\\)를 곱해 \\(12\\)가지예요. 합은 \\(48\\)가지예요.","check":{"prompt":"마지막에 2를 곱하는 이유는 무엇인가요?","answer":"첫 인수를 \\(a^{1/b}\\)에 둘 때와 \\(c^{1/d}\\)에 둘 때가 서로 다른 순서쌍이기 때문이에요."}},{"id":"c2","label":"남은 세 가족을 세어요","stepIds":["s3","s4"],"question":"나머지 \\(11\\)가지는 어떻게 구성되나요?","hint":"각 무순서 쌍의 표현 수와 순서 교환을 따로 세세요.","explanation":"\\((8^{1/10},72^{1/10})\\)에서는 첫 근의 표현이 \\(8^{1/10},64^{1/20}\\) 두 가지이고 둘째는 한 가지라 순서까지 \\(2\\times1\\times2=4\\)가지예요. 두 근이 같은 \\((24^{1/10},24^{1/10})\\)은 한 가지예요. 또 \\((12^{1/10},48^{1/10})\\), \\((24^{1/30},24^{1/6})\\), \\((18^{1/35},48^{1/7})\\)은 각각 순서 교환만 있어 \\(2\\)가지씩, 모두 \\(6\\)가지예요. 따라서 \\(48+4+1+6=59\\)가지예요.","check":{"prompt":"두 근이 모두 \\(24^{1/10}\\)인 경우에 순서 교환으로 2를 곱하지 않는 이유는 무엇인가요?","answer":"두 쪽의 \\((a,b,c,d)\\) 값이 같아 교환해도 같은 순서쌍이기 때문이에요."}},{"id":"c3","label":"범위의 양끝을 확인해요","stepIds":["s5","s6"],"question":"왜 가능한 \\(k\\)의 범위가 정확히 \\(72\\)부터 \\(80\\)인가요?","hint":"\\(72\\)가 빠질 때와 \\(81\\)이 새로 들어올 때의 변화만 확인하세요.","explanation":"\\(k=71\\)이면 밑 \\(72\\)를 쓰는 가족의 \\(4\\)가지가 빠져 \\(55\\)가지예요. \\(72\\le k\\le80\\)에서는 새 표현이 추가되지 않아 계속 \\(59\\)가지예요. \\(k=81\\)이 되면 밑 \\(81=3^4\\)을 이용한 새 표현이 들어와 \\(4\\)가지가 늘어 \\(63\\)가지예요. 따라서 \\(m=72,M=80\\)이고 \\(M+m=152\\)예요.","check":{"prompt":"중간의 \\(73\\)부터 \\(80\\)까지 경우의 수가 바뀌지 않는 이유는 무엇인가요?","answer":"그 범위의 새 자연수는 필요한 소인수 거듭제곱 표현을 만들지 못해 새 순서쌍이 추가되지 않기 때문이에요."}}],"takeaway":["근의 곱 조건은 소인수별 지수 합으로 분류해요.","같은 실수도 밑과 지수의 자연수 배수로 여러 번 표현될 수 있어요.","개수가 일정한 매개변수 구간은 새 표현이 처음 들어오는 경계를 확인해요."]};</script>
