<script>window.HandStudyGuide={"itemId":27053,"sourceHash":"fe0155a61bb24a5a2baaeb78c2a167ce0f4122fe0c3bd2af76b0f807650cd51e","contentHash":"ca37e15619a901e5f107c2a5183989aaa5548f0cdfeb3d076b24252c107114e5","overview":{"goal":"등변사다리꼴의 좌표를 벡터 조건으로 확정하고, 두 직각 조건이 만드는 두 원의 교점을 구해 내적의 합을 계산해요.","firstLook":"\\(\\overrightarrow{XA}\\cdot\\overrightarrow{XD}=0\\)은 \\(\\angle AXD=90^\\circ\\)이므로 \\(X\\)는 지름 \\(AD\\)인 원 위에 있어요. 다른 식도 지름 \\(BC\\)인 원을 만들어요.","conditions":[{"label":"사다리꼴","meaning":"\\(AB\\parallel DC\\), 두 옆변의 길이와 밑각이 같아 좌우대칭인 좌표를 잡을 수 있어요."},{"label":"예각","meaning":"윗변의 왼쪽 꼭짓점은 밑변의 중점보다 왼쪽에 놓여 좌표 후보를 하나로 정해요."},{"label":"모든 점 X","meaning":"두 원의 공통점 두 개에서 내적 값을 각각 구해 더해야 해요."}]},"chapters":[{"id":"c1","label":"사다리꼴의 좌표를 벡터 조건으로 정해요","stepIds":["s1","s2","s3"],"question":"윗변 꼭짓점의 가로 이동 \\(a\\)와 높이 \\(h\\)는 얼마인가요?","hint":"대칭으로 \\(D=(a,h)\\), \\(C=(24-a,h)\\)로 두고 길이와 내적 조건을 식으로 만들어요.","explanation":"\\(A=(0,0)\\), \\(B=(24,0)\\), \\(D=(a,h)\\), \\(C=(24-a,h)\\)로 놓을 수 있어요. 밑각이 예각이고 좌우의 옆변이 안쪽으로 기울므로 \\(0<a<12\\)예요. \\(AD=13\\sqrt2\\)에서 \\(a^2+h^2=338\\)이에요.\n\n\\(\\overrightarrow{AB}=(24,0)\\), \\(\\overrightarrow{DC}=(24-2a,0)\\), \\(\\overrightarrow{AD}=(a,h)\\), \\(\\overrightarrow{BC}=(-a,h)\\)이므로 내적 조건은 \\(24(24-2a)=h^2-a^2\\)예요. 첫 식에서 \\(h^2=338-a^2\\)을 넣으면 \\(a^2-24a+119=0\\), 즉 \\((a-7)(a-17)=0\\)이에요. 범위에서 \\(a=7\\)이고 \\(h^2=338-49=289\\)이므로 \\(h=17\\)이에요.","check":{"prompt":"후보 \\(a=17\\)을 제외하는 이유는 무엇인가요?","answer":"예각인 등변사다리꼴의 좌표 범위 \\(0<a<12\\)를 벗어나기 때문이에요."}},{"id":"c2","label":"두 직각 조건으로 X의 좌표를 구해요","stepIds":["s4","s5","s6"],"question":"지름 AD와 BC인 두 원의 공통점은 어디인가요?","hint":"두 내적식을 좌표로 쓴 뒤 서로 빼면 x가 먼저 정해져요.","explanation":"\\(X=(x,y)\\)라 두면 \\(\\overrightarrow{XA}\\cdot\\overrightarrow{XD}=0\\)에서 \\(x(x-7)+y(y-17)=0\\)이에요. 다른 조건은 \\(B=(24,0)\\), \\(C=(17,17)\\)이므로 \\((x-24)(x-17)+y(y-17)=0\\)이에요.\n\n둘째 식에서 첫째 식을 빼면 \\(-34x+408=0\\)이므로 \\(x=12\\)예요. 이를 첫 식에 넣으면 \\(12\\cdot5+y(y-17)=0\\), 즉 \\(y^2-17y+60=0\\)이에요. 따라서 \\(y=5,12\\)이고 모든 점은 \\(X_1=(12,5)\\), \\(X_2=(12,12)\\)예요.","check":{"prompt":"\\(y^2-17y+60\\)은 어떻게 인수분해되나요?","answer":"\\((y-5)(y-12)\\)예요."}},{"id":"c3","label":"두 내적 값을 한꺼번에 더해요","stepIds":["s7"],"question":"두 점에서 \\(\\overrightarrow{AD}\\cdot\\overrightarrow{AX}\\)의 합은 얼마인가요?","hint":"\\(\\overrightarrow{AD}=(7,17)\\)이고 두 점의 \\(x\\)좌표는 모두 \\(12\\)예요.","explanation":"각 점에서 \\(\\overrightarrow{AX}=(12,y)\\)이므로 내적은 \\(7\\cdot12+17y\\)예요. 두 점의 값을 더하면\n\\[\n2\\cdot7\\cdot12+17(5+12)=168+289=457\n\\]\n이에요.","check":{"prompt":"두 y좌표를 직접 더하지 않고 이차방정식에서 구할 수도 있나요?","answer":"근과 계수의 관계로 두 근의 합이 \\(17\\)임을 바로 알 수 있어요."}}],"takeaway":["등변사다리꼴은 밑변을 수평으로 놓고 윗변 양 끝의 가로 이동을 같게 잡으면 좌표가 단순해져요.","두 선분을 보는 각이 직각이라는 조건은 각각 그 선분을 지름으로 하는 원을 만들어요.","두 원의 방정식은 공통인 이차항을 빼 먼저 한 좌표를 구하면 쉬워요."]};</script>
