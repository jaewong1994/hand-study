함수 \u003cspan class=\"heq\">\\(y=\\log_{2^{n}} (x+2n)\\)\u003c/span>의 그래프와 \u003cbr>함수 \u003cspan class=\"heq\">\\(y=f(x)\\)\u003c/span>의 그래프가 만나는 서로 다른 모든 점의 개수를 \u003cspan class=\"heq\">\\(a_{n}\\)\u003c/span>이라 하자. \u003cspan class=\"heq\">\\(a_{1}+a_{2}+a_{3}\\)\u003c/span>의 값은? \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">① \u003cspan class=\"heq\">\\(532\\)\u003c/span>&emsp;② \u003cspan class=\"heq\">\\(535\\)\u003c/span>&emsp;③ \u003cspan class=\"heq\">\\(538\\)\u003c/span>&emsp;④ \u003cspan class=\"heq\">\\(541\\)\u003c/span>&emsp;⑤ \u003cspan class=\"heq\">\\(544\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/0d60a3d15bf63f9b35d58ed7.png\" style=\"width:356px;max-width:100%\">\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"ed407a6476f801322c2a4b091344331ccf52370a2e7e75593bd0649027e524d6"};</script>
