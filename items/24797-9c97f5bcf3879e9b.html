<script>window.HandStudyRecord={"adminYear":2021,"answer":"②","contentHash":"7a2150aa4ab30f027d6435b46850ff1ac05ba015dbf542932705afdc76ba196e","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24797,"month":11,"number":28,"points":4,"preview":false,"questionHtml":"\u003cp>함수 \u003cspan class=\"heq\">\\(f \\left( x \\right) =6 \\pi \\left( x-1 \\right) ^{2}\\)\u003c/span>에 대하여 함수 \u003cspan class=\"heq\">\\(g \\left( x \\right)\\)\u003c/span>를\u003c/p>\u003cp> \u003cspan class=\"heq\">\\(g \\left( x \\right) =3f \\left( x \\right) +4\\cos f \\left( x \\right)\\)\u003c/span>\u003c/p>\u003cp>라 하자. \u003cspan class=\"heq\">\\(0&lt;x&lt;2\\)\u003c/span>에서 함수 \u003cspan class=\"heq\">\\(g \\left( x \\right)\\)\u003c/span>가 극소가 되는 \u003cspan class=\"heq\">\\(x\\)\u003c/span>의 개수는?\u003c/p>\u003cp>[4점]\u003c/p>\u003cdiv class=\"hchoices\">\u003cdiv class=\"hch\">① \u003cspan class=\"heq\">\\(6\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">② \u003cspan class=\"heq\">\\(7\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">③ \u003cspan class=\"heq\">\\(8\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">④ \u003cspan class=\"heq\">\\(9\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">⑤ \u003cspan class=\"heq\">\\(10\\)\u003c/span>\u003c/div>\u003c/div>","questionText":"함수 $f \\left( x \\right) =6 \\pi \\left( x-1 \\right) ^{2}$에 대하여 함수 $g \\left( x \\right)$를\n $g \\left( x \\right) =3f \\left( x \\right) +4\\cos f \\left( x \\right)$\n라 하자. $0\u003cx\u003c2$에서 함수 $g \\left( x \\right)$가 극소가 되는 $x$의 개수는?\n[4점]\n① $6$ ② $7$ ③ $8$ ④ $9$ ⑤ $10$\n단답형","sourceHash":"9c144fbb78349748aaafd7437eebba1aec5630c01574a73d28a49ab27ae3ba72","sourceKind":"csat","sourceLabel":"2021년 시행 수능 · 2022학년도 · 미적분 · 28번","steps":[{"id":"s1","latex":"f(x)=6\\pi(x-1)^2,\\quad g(x)=3f(x)+4\\cos f(x)"},{"id":"s2","latex":"g\\prime(x)=12\\pi(x-1)\\{3-4\\sin f(x)\\}"},{"id":"s3","latex":"x=1\\text{ 근처에서는 }3-4\\sin f(x)>0\\quad\\Rightarrow\\quad x=1\\text{에서 극소}"},{"id":"s4","latex":"1\u003cx\u003c2:\\quad t=f(x)\\text{는 }0\\text{에서 }6\\pi\\text{까지 증가}"},{"id":"s5","latex":"3-4\\sin t\\text{는 각 구간 }(2k\\pi,2(k+1)\\pi)\\text{에서 음수에서 양수로 한 번 변한다}\\quad(k=0,1,2)"},{"id":"s6","latex":"1\u003cx\u003c2\\text{에서 극소점 }3\\text{개},\\quad g(1-u)=g(1+u)\\text{이므로 }0\u003cx\u003c1\\text{에서도 }3\\text{개}"},{"id":"s7","latex":"3+1+3=7\\quad\\therefore\\text{②}"}],"track":"미적분"};</script>
<script>window.HandStudyGuide={"itemId":24797,"sourceHash":"9c144fbb78349748aaafd7437eebba1aec5630c01574a73d28a49ab27ae3ba72","contentHash":"7a2150aa4ab30f027d6435b46850ff1ac05ba015dbf542932705afdc76ba196e","overview":{"goal":"도함수의 부호 변화를 한 주기씩 세어 \\(g\\)의 극소점 개수를 구해요.","firstLook":"\\(g\\)는 \\(f\\)만으로 정해지고 \\(f(x)=6\\pi (x-1)^2\\)이므로 \\(x=1\\)에 대해 대칭이에요.","conditions":[{"label":"안쪽 함수의 범위","meaning":"\\(1<x<2\\)에서 \\(t=f(x)\\)는 0에서 \\(6\\pi\\)까지 엄격히 증가해 정확히 세 주기를 지나요."}]},"chapters":[{"id":"c1","label":"도함수와 가운데 극소점","stepIds":["s1","s2","s3"],"question":"\\(x=1\\)에서는 왜 \\(g'\\)의 부호가 음수에서 양수로 바뀌나요?","hint":"\\(f(1)=0\\)이므로 1 근처에서 \\(3-4\\sin f(x)\\)의 부호를 먼저 확인하세요.","explanation":"미분하면 \\(g'(x)=f'(x)\\{3-4\\sin f(x)\\}=12\\pi(x-1)\\{3-4\\sin f(x)\\}\\)예요. \\(x=1\\) 근처에서는 \\(f(x)\\)가 0에 가까워 \\(3-4\\sin f(x)>0\\). 따라서 \\(x-1\\)의 부호에 따라 \\(g'\\)가 음수에서 양수로 바뀌므로 \\(x=1\\)은 극소점이에요.","check":{"prompt":"\\(x=1\\)에서 \\(g'(1)=0\\)이라는 사실만으로 극소라고 할 수 있나요?","answer":"아니요. 양쪽에서 \\(g'\\)의 부호가 음수에서 양수로 바뀌는 것까지 확인해야 해요."}},{"id":"c2","label":"한 주기 안의 극소 세기","stepIds":["s4","s5"],"question":"\\(2\\pi\\) 길이의 한 구간마다 극소가 하나인 이유는 무엇인가요?","hint":"\\(\\sin t=3/4\\)의 두 해에서 \\(3-4\\sin t\\)의 부호 변화를 각각 확인하세요.","explanation":"\\(1<x<2\\)에서는 \\(t=f(x)\\)가 증가하므로 \\(g'\\)의 부호는 \\(3-4\\sin t\\)의 부호와 같아요. 각 구간 \\((2k\\pi,2(k+1)\\pi)\\)에서 \\(\\sin t=3/4\\)인 점은 두 개예요. 첫 점에서는 부호가 양수에서 음수로 바뀌어 극대, 둘째 점에서는 음수에서 양수로 바뀌어 극소가 돼요. \\(0<t<6\\pi\\)에는 세 주기가 있으므로 오른쪽 극소는 3개예요.","check":{"prompt":"한 주기의 첫 번째 해를 극소로 세면 안 되는 이유는 무엇인가요?","answer":"그 점에서는 도함수 부호가 +에서 -로 바뀌어 극대이기 때문이에요."}},{"id":"c3","label":"대칭으로 전체 개수 구하기","stepIds":["s6","s7"],"question":"가운데 점을 두 번 세지 않으려면 어떻게 합하나요?","hint":"왼쪽 3개, \\(x=1,\\) 오른쪽 3개를 따로 적으세요.","explanation":"\\(f(1-u)=f(1+u)\\)이므로 \\(g\\)도 \\(x=1\\)에 대해 대칭이에요. 따라서 \\(0<x<1\\)에도 오른쪽과 대응하는 극소점 3개가 있어요. 가운데 \\(x=1\\)은 별도로 한 번만 세어 전체는 \\(3+1+3=7\\)개, 정답은 ②예요.","check":{"prompt":"구간 끝 \\(x=0,2\\)는 왜 세지 않나요?","answer":"문제의 범위가 열린구간 \\(0<x<2\\)이므로 끝점은 포함되지 않아요."}}],"takeaway":["합성함수의 극값은 안쪽 함수가 단조인 구간별로 바깥 도함수의 부호 변화를 세어요.","대칭점 자체와 양쪽 대응점을 분리하면 중복을 피할 수 있어요."]};</script>
