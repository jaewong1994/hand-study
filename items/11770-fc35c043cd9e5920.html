  <script>window.HandStudyRecord={"itemId":11770,"sourceLabel":"2021 교육청 고1 수학 6월 21번","adminYear":2021,"grade":1,"month":6,"number":21,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"두 이차함수 $f \\left( x \\right)\\,$, $g \\left( x \\right) \\,$는 다음 조건을 만족시킨다.\n(가) $f \\left( x \\right) g \\left( x \\right) = \\left( x ^{2} -4 \\right) \\left( x ^{2} -9 \\right)$ (나) $f \\left( \\alpha \\right) =f \\left( \\alpha +5 \\right) =0\\,$인 실수 $\\alpha \\,$가 존재한다.\n\u003c보기>에서 옳은 것만을 있는 대로 고른 것은? [4점]\n\u003c보 기>ㄱ. $f \\left( 2 \\right) =0\\,$일 때, $g \\left( 3 \\right) =0\\,$이다. ㄴ. $g \\left( 2 \\right) >0\\,$일 때, $f \\left( \\frac{5}{2} \\right) \u003cg \\left( \\frac{5}{2} \\right) \\,$이다.ㄷ. $x\\,$에 대한 방정식 $f \\left( x \\right) -g \\left( x \\right) =0\\,$이 서로 다른 두 정수 $m\\,$, $n\\,$을 근으로 가질 때, $\\left| \\,m+n\\, \\right| =5\\,$이다.\n① ㄱ ② ㄱ, ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ\n단답형","answer":"⑤","sourceHash":"6379853510e549f5ffb588ffd97371dc64711ec3668b7c4ad219b979c11d0dff","steps":[{"id":"s1","latex":"f(x)g(x)=(x-2)(x+2)(x-3)(x+3)"},{"id":"s2","latex":"\\exists\\alpha:\\ f(\\alpha)=f(\\alpha+5)=0\\Rightarrow\\{\\text{roots of }f\\}=\\{-3,2\\}\\text{ or }\\{-2,3\\}"},{"id":"s3","latex":"f(2)=0\\Rightarrow g(3)=0\\qquad\\text{(\\char\"3131 참)}"},{"id":"s4","latex":"g(2)>0\\Rightarrow f=a(x+3)(x-2),\\ g=\\frac1a(x+2)(x-3),\\ a\u003c0"},{"id":"s5","latex":"f\\left(\\frac52\\right)=\\frac{11a}{4}\u003c0\u003c -\\frac9{4a}=g\\left(\\frac52\\right)\\qquad\\text{(\\char\"3134 참)}"},{"id":"s6","latex":"f(x)=g(x)\\Rightarrow mn=-6,\\quad|m+n|=\\frac{a^2+1}{|a^2-1|}>1"},{"id":"s7","latex":"m,n\\in\\mathbb Z,\\ mn=-6\\Rightarrow|m+n|=5\\qquad\\text{(\\char\"3137 참)}"}],"diagram":null,"contentHash":"1ecf577308f26d1cb1643044869cd1cdbd8309f6f34a736642d82bf26e84cd74","questionHtml":"\u003cp class=\"hp\">두 이차함수 \u003cspan class=\"heq\">\\(f \\left( x \\right)\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(g \\left( x \\right) \\,\\)\u003c/span>는 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) \u003cspan class=\"heq\">\\(f \\left( x \\right) g \\left( x \\right) = \\left( x^{2} -4 \\right) \\left( x^{2} -9 \\right)\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">(나) \u003cspan class=\"heq\">\\(f \\left( \\alpha \\right) =f \\left( \\alpha +5 \\right) =0\\,\\)\u003c/span>인 실수 \u003cspan class=\"heq\">\\(\\alpha \\,\\)\u003c/span>가 존재한다.\u003c/p>\u003c/div>\u003cp class=\"hp\">&lt;보기&gt;에서 옳은 것만을 있는 대로 고른 것은? \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cdiv class=\"hbox\">\u003cdiv style=\"text-align:center;font-weight:700;margin:0 0 6px\">&lt; 보 기 &gt;\u003c/div>\u003cp class=\"hp\">ㄱ. \u003cspan class=\"heq\">\\(f \\left( 2 \\right) =0\\,\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(g \\left( 3 \\right) =0\\,\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp htall\">ㄴ. \u003cspan class=\"heq\">\\(g \\left( 2 \\right) \\gt 0\\,\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(f \\left( \\dfrac{5}{2} \\right) \\lt g \\left( \\dfrac{5}{2} \\right) \\,\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp\">ㄷ. \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>에 대한 방정식 \u003cspan class=\"heq\">\\(f \\left( x \\right) -g \\left( x \\right) =0\\,\\)\u003c/span>이 서로 다른 두 정수 \u003cspan class=\"heq\">\\(m\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(n\\,\\)\u003c/span>을 근으로 가질 때, \u003cspan class=\"heq\">\\(\\left| \\,m+n\\, \\right| =5\\,\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp class=\"hp\">① ㄱ&emsp;② ㄱ, ㄴ&emsp;③ ㄱ, ㄷ\u003c/p>\u003cp class=\"hp\">④ ㄴ, ㄷ&emsp;⑤ ㄱ, ㄴ, ㄷ\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"fc35c043cd9e59202e2cf00c7c281321f0948b15d9c91b8b097c9c039a3aeb1c"};</script>
