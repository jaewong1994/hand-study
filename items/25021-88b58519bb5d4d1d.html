<script>window.HandStudyGuide={"itemId":25021,"sourceHash":"676ed525e4c204b00aea12f8d471f4a79dc9c21fd1f398fc838a61c7e084d776","contentHash":"9febb9f6cf84018e551e963e714ab406f3a535ea7d58a26d20ff3936a247e3dc","overview":{"goal":"검은 공 사이의 다섯 칸에 노란색과 보라색을 겹치지 않게 분배해요.","firstLook":"검은 공 네 개를 먼저 놓으면 앞·사이·뒤에 다섯 칸이 생겨요. 노란색과 보라색이 같은 칸에만 들어가지 않으면 서로 이웃하지 않아요.","conditions":[{"label":"같은 색은 구별하지 않음","meaning":"각 칸에 들어가는 개수만 정하면 돼요."},{"label":"이웃 금지","meaning":"노란색이 들어간 칸에는 보라색을 한 개도 둘 수 없어요."}]},"chapters":[{"id":"c1","label":"검은 공으로 다섯 칸을 만들어요","stepIds":["s1","s2","s3"],"question":"노란색과 보라색이 서로 다른 칸에 있으면 왜 이웃하지 않을까요?","hint":"서로 다른 칸 사이에는 반드시 검은 공이 하나 있어요.","explanation":"검은 공 네 개를 먼저 늘어놓으면 앞뒤와 검은 공 사이에 모두 다섯 칸이 생겨요. 한 칸 안의 공들은 검은 공 없이 이어지므로 노란색과 보라색을 함께 넣으면 경계에서 반드시 이웃해요. 반대로 두 색이 서로 다른 칸에만 들어가면 사이에 검은 공이 있어 이웃하지 않아요. 노란색이 들어가는 칸 수를 \\(a\\)라 하면 \\(a=1,2,3,4\\)예요.","check":{"prompt":"\\(a=5\\)가 불가능한 이유는 무엇인가요?","answer":"노란 공은 네 개뿐인데 노란색이 있는 다섯 칸마다 적어도 한 개씩 필요하기 때문이에요."}},{"id":"c2","label":"칸 선택과 두 색의 분배를 곱해요","stepIds":["s4","s5","s6","s7"],"question":"보라색을 넣을 수 있는 칸이 왜 \\(5-a\\)개인가요?","hint":"노란색이 있는 칸은 보라색에 금지된 칸이에요.","explanation":"노란색 칸은 다섯 칸 중 \\({}_5\\mathrm C_a\\)가지로 고릅니다. 네 노란 공을 선택한 \\(a\\)칸에 하나 이상씩 나누는 경우는 \\(x_1+\\cdots+x_a=4\\)의 양의 정수해이므로 \\({}_3\\mathrm C_{a-1}\\)가지예요. 보라 공 네 개는 남은 \\(5-a\\)칸에 빈 칸을 허용해 나누므로 \\(y_1+\\cdots+y_{5-a}=4\\)의 0 이상 정수해 \\({}_{8-a}\\mathrm C_4\\)가지예요. 따라서 고정된 \\(a\\)의 경우의 수는 \\({}_5\\mathrm C_a{}_3\\mathrm C_{a-1}{}_{8-a}\\mathrm C_4\\)예요.","check":{"prompt":"보라색 분배에서 각 칸에 한 개 이상 조건을 쓰지 않는 이유는 무엇인가요?","answer":"남은 칸 중에는 보라 공이 하나도 들어가지 않는 빈 칸이 있어도 되기 때문이에요."}},{"id":"c3","label":"네 경우를 계산해 더해요","stepIds":["s8","s9"],"question":"서로 다른 \\(a\\)의 경우를 그대로 더해도 될까요?","hint":"\\(a\\)는 노란색이 들어간 칸 수라 한 배열에서 값이 하나로 정해져요.","explanation":"\\(a=1,2,3,4\\)일 때 위 식은 차례로 \\(175,450,150,5\\)가 돼요. 각 배열은 노란색이 있는 칸 수가 하나로 정해지므로 네 경우는 겹치지 않아요. 따라서 전체는 \\(175+450+150+5=780\\)이에요.","check":{"prompt":"네 값을 더한 최종 경우의 수는 얼마인가요?","answer":"\\(780\\)가지예요."}}],"takeaway":["같은 색 공 사이에 구분용 공을 먼저 놓으면 칸 분배 문제로 바꿀 수 있어요.","서로 이웃하지 않는 조건은 두 종류가 같은 칸을 쓰지 않는 조건으로 옮겨요.","한 개 이상 분배와 0개 이상 분배의 조건을 구별해 조합 수를 정해요."]};</script>
