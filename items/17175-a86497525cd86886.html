<script>window.HandStudyRecord={"itemId":17175,"sourceLabel":"2021 평가원 고3 수학기하 6월 29번","adminYear":2021,"grade":3,"month":6,"number":29,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"포물선 $y ^{2}$$=8x$와 직선 $y$$=2x-4$가 만나는 점 중 제$1$사분면 위에 있는 점을 $A$라 하자. 양수 $a$에 대하여 포물선 $\\left( y-2a \\right) ^{2}$$=8 \\left( x-a \\right)$가 점 $A$를 지날 때, 직선 $y$$=2x-4$와 포물선 $\\left( y-2a \\right) ^{2}$$=8 \\left( x-a \\right)$가 만나는 점 중 $A$가 아닌 점을 $B$라 하자. 두 점 $A,\\,B$에서 직선 $x= -2$에 내린 수선의 발을 각각 $C,\\,D$라 할 때, ${\\overline{ AC}} + {\\overline{ BD}} - {\\overline{ AB}}$$=k$이다. $k ^{2}$의 값을 구하시오.\n[4점]","answer":"80","sourceHash":"08f1bdc7097af7e2a6d4e47f1bf2a9a619fbec042809cb36bb126653c5b10bf6","steps":[{"id":"s1","latex":"y=2x-4,\\ y^2=8x\\Rightarrow x^2-6x+4=0"},{"id":"s2","latex":"A=(3+\\sqrt5,2+2\\sqrt5),\\quad A'=(3-\\sqrt5,2-2\\sqrt5)"},{"id":"s3","latex":"(y-2a)^2=8(x-a)\\text{는 }(a,2a)\\text{만큼 평행이동}"},{"id":"s4","latex":"A'\\mapsto A\\Rightarrow(a,2a)=(2\\sqrt5,4\\sqrt5)"},{"id":"s5","latex":"B=A+(a,2a)=(3+3\\sqrt5,2+6\\sqrt5)"},{"id":"s6","latex":"AB=\\sqrt{(2\\sqrt5)^2+(4\\sqrt5)^2}=10"},{"id":"s7","latex":"k=4\\sqrt5\\Rightarrow k^2=80"}],"diagram":null,"contentHash":"95cc2b57def2955faeb44d341c19b9d7a7ebc349de3a449c044e8c3af2041df3","questionHtml":"\u003cp class=\"hp htall\">포물선 \u003cspan class=\"heq\">\\(y^{2}\\)\u003c/span>\u003cspan class=\"heq\">\\(=8x\\)\u003c/span>와 직선 \u003cspan class=\"heq\">\\(y\\)\u003c/span>\u003cspan class=\"heq\">\\(=2x-4\\)\u003c/span>가 만나는 점 중 제\u003cspan class=\"heq\">\\(1\\)\u003c/span>사분면 위에 있는 점을 \u003cspan class=\"heq\">\\(A\\)\u003c/span>라 하자. 양수 \u003cspan class=\"heq\">\\(a\\)\u003c/span>에 대하여 \u003cbr>포물선 \u003cspan class=\"heq\">\\(\\left( y-2a \\right)^{2}\\)\u003c/span>\u003cspan class=\"heq\">\\(=8 \\left( x-a \\right)\\)\u003c/span>가 점 \u003cspan class=\"heq\">\\(A\\)\u003c/span>를 지날 때, 직선 \u003cspan class=\"heq\">\\(y\\)\u003c/span>\u003cspan class=\"heq\">\\(=2x-4\\)\u003c/span>와 포물선 \u003cspan class=\"
