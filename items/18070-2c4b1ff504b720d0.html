<script>window.HandStudyRecord={"itemId":18070,"sourceLabel":"2024 평가원 고3 수학기하 9월 30번","adminYear":2024,"grade":3,"month":9,"number":30,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"좌표평면 위에 다섯 점\n ${{A}} (0,\\,8)$, ${{B}} (8,\\,0)$, ${{C}} (7,\\,1)$, ${{D}} (7,\\,0)$, ${{E}} (-4,\\,2)$\n가 있다. 삼각형 $AOB\\,$의 변 위를 움직이는 점 $P\\,$와 삼각형 $CDB\\,$의 변 위를 움직이는 점 $Q\\,$에 대하여 $\\left|\\, {\\vec{ PQ }} + {\\vec{ OE }} \\,\\right| ^{2}\\,$의 최댓값을 $M\\,$, 최솟값을 $m\\,$이라 할 때, $M\\,+m\\,$의 값을 구하시오. (단, $O\\,$는 원점이다.) [4점]","answer":"54","sourceHash":"0291d58912832a6ae371ce72585e623d1d98fe120766566aebde0535e83254d7","steps":[{"id":"s1","latex":"\\vec{PQ}+\\vec{OE}=Q-(P+(4,-2)),\\quad P^{\\prime}=P+(4,-2)"},{"id":"s2","latex":"A^{\\prime}=(4,6),\\ O^{\\prime}=(4,-2),\\ B^{\\prime}=(12,-2),\\ C=(7,1),\\ D=(7,0),\\ B=(8,0)"},{"id":"s3","latex":"\\triangle CDB\\subset\\triangle A^{\\prime}O^{\\prime}B^{\\prime}"},{"id":"s4","latex":"CB:\\ x+y=8,\\quad A'B':\\ x+y=10\\Rightarrow\\text{두 선분 사이 거리의 최솟값}=\\sqrt2\\Rightarrow m=2"},{"id":"s5","latex":"\\text{꼭짓점 거리의 제곱 }34,18,34,45,13,29,52,20,20\\text{ 중 가장 큰 값이 }|BA'|^2=52\\Rightarrow M=52"},{"id":"s6","latex":"M+m=54"}],"diagram":null,"contentHash":"cc8b2b2792264368e519021f114e66c447808d35201f0c699f5b0075fb673f4b","questionHtml":"<p class=\"hp\">좌표평면 위에 다섯 점<\/p><p class=\"hp\">&emsp;<span class=\"heq\">\\({{A}} (0,\\,8)\\)<\/span>, <span class=\"heq\">\\({{B}} (8,\\,0)\\)<\/span>, <span class=\"heq\">\\({{C}} (7,\\,1)\\)<\/span>, <span class=\"heq\">\\({{D}} (7,\\,0)\\)<\/span>, <span class=\"heq\">\\({{E}} (-4,\\,2)\\)<\/span><\/p><p class=\"hp\">가 있다. 삼각형 <span class=\"heq\">\\(AOB\\,\\)<\/span>의 변 위를 움직이는 점 <span class=\"heq\">\\(P\\,\\)<\/span>와 삼각형 <span class=\"heq\">\\(CDB\\,\\)<\/span>의 변 위를 움직이는 점 <span class=\"heq\">\\(Q\\,\\)<\/span>에 대하여 <span class=\"heq\">\\(\\left|\\, {\\overrightarrow{PQ}} + {\\overrightarrow{OE}} \\,\\right|^{2}\\,\\)<\/span>의 최댓값을 <span class=\"heq\">\\(M\\,\\)<\/span>, 최솟값을 <span class=\"heq\">\\(m\\,\\)<\/span>이라 할 때, <span class=\"heq\">\\(M\\,+m\\,\\)<\/span>의 값을 구하시오. (단, <span class=\"heq\">\\(O\\,\\)<\/span>는 원점이다.) <span class=\"hscore\">[4점]<\/span><\/p><p class=\"hp\"><img class=\"hfig\" src=\"../assets/figures/c9fbb310ef0a219183761a03.png\" style=\"width:293px;max-width:100%\"><\/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"7b95a691cf42ad2cc7113c61d3b419bceb58360e9bf3b4ccb8410e25284d1143"};</script>
<script>window.HandStudyGuide={"itemId":18070,"sourceHash":"0291d58912832a6ae371ce72585e623d1d98fe120766566aebde0535e83254d7","contentHash":"cc8b2b2792264368e519021f114e66c447808d35201f0c699f5b0075fb673f4b","overview":{"goal":"벡터의 합을 두 점 사이의 거리로 바꾸고, 두 삼각형의 변 사이에서 거리의 최댓값과 최솟값을 구해요.","firstLook":"고정벡터를 움직이는 점 \\(P\\) 쪽에 합치면 \\(P\\)가 다니는 삼각형을 평행이동할 수 있어요. 그러면 식의 값은 평행이동한 큰 삼각형의 변과 작은 삼각형의 변 사이 거리의 제곱이에요.","conditions":[{"label":"점의 움직임","meaning":"\\(P\\)와 \\(Q\\)는 삼각형 내부가 아니라 각각 삼각형의 세 변 위를 움직여요."},{"label":"고정벡터","meaning":"\\(\\overrightarrow{OE}=(-4,2)\\)이므로 이를 빼는 효과는 \\(P\\)를 \\((4,-2)\\)만큼 옮기는 것과 같아요."},{"label":"구할 값","meaning":"거리 자체가 아니라 거리의 제곱의 최댓값 \\(M\\)과 최솟값 \\(m\\)을 더해요."}]},"chapters":[{"id":"c1","label":"벡터의 합을 두 점 사이의 거리로 바꿔요","stepIds":["s1","s2"],"question":"\\(\\overrightarrow{PQ}+\\overrightarrow{OE}\\)를 왜 \\(P'Q\\)의 거리로 볼 수 있을까요?","hint":"위치벡터로 \\(\\overrightarrow{PQ}=Q-P\\)를 쓰고 \\(P'=P+(4,-2)\\)를 정해요.","explanation":"\\(\\overrightarrow{OE}=(-4,2)\\)이므로 \\(\\overrightarrow{PQ}+\\overrightarrow{OE}=Q-P+(-4,2)=Q-[P+(4,-2)]\\)예요. 따라서 \\(P'=P+(4,-2)\\)라 두면 주어진 벡터의 크기는 \\(P'Q\\)의 길이와 같아요.\n\n점 \\(P\\)가 삼각형 \\(AOB\\)의 변 위를 움직이므로 \\(P'\\)는 그 삼각형을 \\((4,-2)\\)만큼 옮긴 삼각형 \\(A'O'B'\\)의 변 위를 움직여요. 꼭짓점은 \\(A'=(4,6)\\), \\(O'=(4,-2)\\), \\(B'=(12,-2)\\)이고, 작은 삼각형의 꼭짓점은 \\(C=(7,1)\\), \\(D=(7,0)\\), \\(B=(8,0)\\)이에요.","check":{"prompt":"점 \\(P\\)에 더한 벡터가 \\((4,-2)\\)인 이유는 무엇인가요?","answer":"식에 더해진 \\(\\overrightarrow{OE}=(-4,2)\\)를 \\(Q-P'\\) 꼴로 만들려면 \\(P'=P-\\overrightarrow{OE}=P+(4,-2)\\)로 두어야 해요."}},{"id":"c2","label":"두 삼각형의 위치와 가장 가까운 변을 확인해요","stepIds":["s3","s4"],"question":"작은 삼각형이 큰 삼각형 안에 있을 때 두 변 사이의 가장 짧은 거리는 어떻게 찾을까요?","hint":"두 빗변 \\(CB\\)와 \\(A'B'\\)의 방정식을 비교해요.","explanation":"큰 삼각형은 \\(x\\ge4\\), \\(y\\ge-2\\), \\(x+y\\le10\\)인 영역이고, \\(C,D,B\\)는 이 세 부등식을 모두 만족해요. 작은 삼각형 전체가 볼록한 큰 삼각형 안에 있으므로 \\(\\triangle CDB\\subset\\triangle A'O'B'\\)예요.\n\n작은 삼각형의 빗변 \\(CB\\)는 \\(x+y=8\\), 큰 삼각형의 빗변 \\(A'B'\\)는 \\(x+y=10\\)이에요. 두 평행선 사이의 거리는 \\(|10-8|/\\sqrt{1^2+1^2}=\\sqrt2\\)이고, 수선의 발이 두 선분 안에 놓여 실제로 이 거리를 만들 수 있어요. 다른 큰 변은 \\(x=4\\), \\(y=-2\\)인데 작은 삼각형에서 각각 적어도 \\(3\\), \\(2\\)만큼 떨어져 있으므로 \\(\\sqrt2\\)보다 가까워질 수 없어요. 따라서 최소 거리의 제곱은 \\(m=(\\sqrt2)^2=2\\)예요.","check":{"prompt":"평행한 두 직선 사이의 거리를 구한 뒤 선분 위에서 실제로 가능한지도 확인해야 하는 이유는 무엇인가요?","answer":"직선에서 가장 가까운 두 점이 선분의 연장선에만 있으면 움직이는 점들이 그 거리를 만들 수 없기 때문이에요."}},{"id":"c3","label":"꼭짓점 거리를 비교해 최댓값을 정해요","stepIds":["s5","s6"],"question":"가장 먼 두 점이 \\(B\\)와 \\(A'\\)라는 것을 어떻게 확인할까요?","hint":"한 선분 위에서 한 점까지의 거리의 제곱은 이차식이므로 최댓값은 선분의 끝점에서 나와요. 따라서 두 삼각형의 꼭짓점끼리 비교하면 돼요.","explanation":"각 삼각형의 한 변을 고정하면 다른 점까지의 거리의 제곱은 매개변수에 대한 아래로 꺾이지 않는 이차식이라 선분의 끝점에서 가장 커요. 이 논리를 양쪽 변에 적용하면 두 경계 사이의 최대 거리는 꼭짓점끼리의 거리 중에서 찾을 수 있어요.\n\n작은 삼각형의 꼭짓점 \\(C,D,B\\)에서 큰 삼각형의 꼭짓점 \\(A',O',B'\\)까지 거리의 제곱을 차례로 계산하면 \\(C\\)에서는 \\(34,18,34\\), \\(D\\)에서는 \\(45,13,29\\), \\(B\\)에서는 \\(52,20,20\\)이에요. 가장 큰 값은 \\(BA'^2=(8-4)^2+(0-6)^2=52\\)이므로 \\(M=52\\)예요. 따라서 \\(M+m=52+2=54\\)예요.","check":{"prompt":"\\(BA'^2\\)를 계산할 때 두 좌표의 차는 각각 얼마인가요?","answer":"가로 차는 \\(8-4=4\\), 세로 차는 \\(0-6=-6\\)이므로 제곱의 합은 \\(16+36=52\\)예요."}}],"takeaway":["고정벡터가 더해진 두 점의 차는 한쪽 도형을 평행이동해 보통의 거리 문제로 바꿀 수 있어요.","최소 거리는 가까운 변의 방정식과 선분 범위를 함께 확인해요.","두 다각형 사이의 최대 거리는 꼭짓점 후보를 모두 계산해 비교하면 빠짐없이 확정할 수 있어요."]};</script>
