<script>window.HandStudyRecord={"itemId":16310,"sourceLabel":"2019 교육청 고3 수리가형 5월 28번","adminYear":2019,"grade":3,"month":5,"number":28,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"주머니 $A\\,$에는 1, 2, 3, 4, 5의 숫자가 하나씩 적혀 있는 5개의 구슬이 들어 있고, 주머니 $B\\,$에는 1, 1, 2, 2, 2의 숫자가 하나씩 적혀 있는 5개의 구슬이 들어 있다. 주머니 $A\\,$에서 공을 임의로 한 개씩 두 번 꺼낼 때, 꺼낸 2개의 공에 적혀 있는 수를 차례로 $a _{1} \\,$, $a _{2} \\,$라 하고, 주머니 $B\\,$에서 공을 임의로 한 개씩 두 번 꺼낼 때, 꺼낸 2개의 공에 적혀 있는 수를 차례로 $b _{1} \\,$, $b _{2} \\,$라 하자. $a _{1} \\geq 3\\,$일 때, $a _{1} b _{1} \u003ca _{2} b _{2} \\,$일 확률은 $\\frac{q}{p} \\,$이다. $p+q\\,$의 값을 구하시오. (단, 한 번 꺼낸 공은 주머니에 다시 넣지 않으며, $p\\,$와 $q\\,$는 서로소인 자연수이다.) [4점]","answer":"51","sourceHash":"e9048c6c09150c3fa92abfbf29ad1b7baf545996028baed5608f420306975e6b","steps":[{"id":"s1","latex":"A=\\{a_1\\ge3\\},\\quad B=\\{a_1b_1\u003ca_2b_2\\},\\quad P(A)=\\dfrac35"},{"id":"s2","latex":"P(1,1)=\\dfrac1{10},\\quad P(1,2)=P(2,1)=P(2,2)=\\dfrac3{10}"},{"id":"s3","latex":"a_1=3:\\quad P(B\\mid a_1=3)=\\dfrac{17}{40}"},{"id":"s4","latex":"a_1=4:\\quad P(B\\mid a_1=4)=\\dfrac14"},{"id":"s5","latex":"a_1=5:\\quad P(B\\mid a_1=5)=\\dfrac3{20}"},{"id":"s6","latex":"P(A\\cap B)=\\dfrac15\\left(\\dfrac{17}{40}+\\dfrac14+\\dfrac3{20}\\right)=\\dfrac{33}{200}"},{"id":"s7","latex":"P(B\\mid A)=\\dfrac{33/200}{3/5}=\\dfrac{11}{40}\\Rightarrow p+q=51"}],"diagram":null,"contentHash":"858f6b6c1fdef4b5d949dc4736053a43d52bd8508b6e2eb79c0c4e7e490774dd","questionHtml":"\u003cp class=\"hp htall\">주머니 \u003cspan class=\"heq\">\\(A\\,\\)\u003c/span>에는 1, 2, 3, 4, 5의 숫자가 하나씩 적혀 있는 5개의 구슬이 들어 있고, 주머니 \u003cspan class=\"heq\">\\(B\\,\\)\u003c/span>에는 1, 1, 2, 2, 2의 숫자가 하나씩 적혀 있는 5개의 구슬이 들어 있다. 주머니 \u003cspan class=\"heq\">\\(A\\,\\)\u003c/span>에서 공을 임의로 한 개씩 두 번 꺼낼 때, 꺼낸 2개의 공에 적혀 있는 수를 차례로 \u003cspan class=\"heq\">\\(a_{1} \\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(a_{2} \\,\\)\u003c/span>라 하고, 주머니 \u003cspan class=\"heq\">\\(B\\,\\)\u003c/span>에서 공을 임의로 한 개씩 두 번 꺼낼 때, 꺼낸 2개의 공에 적혀 있는 수를 차례로 \u003cspan class=\"heq\">\\(b_{1} \\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(b_{2} \\,\\)\u003c/span>라 하자. \u003cspan class=\"heq\">\\(a_{1} \\geq 3\\,\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(a_{1} b_{1} \\lt a_{2} b_{2} \\,\\)\u003c/span>일 확률은 \u003cspan class=\"heq\">\\(\\dfrac{q}{p} \\,\\)\u003c/span>이다.\u003cbr>\u003cspan class=\"heq\">\\(p+q\\,\\)\u003c/span>의 값을 구하시오. (단, 한 번 꺼낸 공은 주머니에 다시 넣지 않으며, \u003cspan class=\"heq\">\\(p\\,\\)\u003c/span>와 \u003cspan class=\"heq\">\\(q\\,\\)\u003c/span>는 서로소인 자연수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig hfigr\" src=\"../assets/figures/4c91af5e6961d7e5e9e0c89d.png\" style=\"float:right;margin:4px 0 8px 12px;width:331px;max-width:45%\">\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"643301d684a15ca85a21ee4d5c0bc47c69411a1d1f7d9dcca5f7b6645a099961"};</script>
<script>window.HandStudyGuide={"itemId":16310,"sourceHash":"e9048c6c09150c3fa92abfbf29ad1b7baf545996028baed5608f420306975e6b","contentHash":"858f6b6c1fdef4b5d949dc4736053a43d52bd8508b6e2eb79c0c4e7e490774dd","overview":{"goal":"\\(a_1\\ge3\\)이라는 조건 아래에서 두 곱의 대소를 \\(a_1\\)과 \\((b_1,b_2)\\)에 따라 나누어 계산해요.","firstLook":"조건을 만족한 뒤 \\(a_1\\)은 3, 4, 5가 같은 확률로 나와요. 주머니 \\(B\\)에서는 숫자 1과 2의 구슬 수가 다르므로 \\((b_1,b_2)\\)의 네 값도 같은 확률이 아니에요.","conditions":[{"label":"조건 사건","meaning":"첫 번째 \\(A\\)의 수가 3, 4, 5 중 하나인 경우만 남겨 계산해요."},{"label":"비복원 추출","meaning":"꺼낸 구슬을 넣지 않으므로 두 번째 수의 분모는 4이고, 같은 숫자라도 남은 구슬 수가 달라져요."},{"label":"곱의 비교","meaning":"각 \\(a_1,b_1,b_2\\)에서 \\(a_2> a_1b_1/b_2\\)를 만족하는 남은 \\(A\\)의 수를 세어요."}]},"chapters":[{"id":"c1","label":"주머니 B의 순서쌍 확률을 구해요","stepIds":["s1","s2"],"question":"\\((b_1,b_2)=(1,1)\\)과 \\((1,2)\\)의 확률은 왜 다를까요?","hint":"주머니 \\(B\\)에는 1이 2개, 2가 3개 있고 첫 구슬은 다시 넣지 않아요.","explanation":"\\(a_1\\ge3\\)일 확률은 \\(3/5\\)이고, 이 조건 아래에서는 \\(a_1=3,4,5\\)가 각각 \\(1/3\\)의 확률이에요.\n\n주머니 \\(B\\)에서 두 수를 순서대로 뽑으면 \\(P(1,1)=(2/5)(1/4)=1/10\\)이에요. 또 \\(P(1,2)=(2/5)(3/4)=3/10\\), \\(P(2,1)=(3/5)(2/4)=3/10\\), \\(P(2,2)=(3/5)(2/4)=3/10\\)이에요. 네 확률의 합이 1이므로 빠진 경우도 없어요.","check":{"prompt":"\\(P(2,2)\\)의 두 번째 분자가 3이 아니라 2인 이유는 무엇인가요?","answer":"첫 번째에 숫자 2가 적힌 구슬 하나를 꺼냈으므로 숫자 2 구슬은 2개만 남기 때문이에요."}},{"id":"c2","label":"첫 수가 3일 때를 펼쳐 세어요","stepIds":["s3"],"question":"\\(a_1=3\\)일 때 성공 확률 \\(17/40\\)은 어떤 경우에서 나오나요?","hint":"네 개의 \\((b_1,b_2)\\)마다 부등식 \\(3b_1<a_2b_2\\)를 만족하는 \\(a_2\\)를 세어요.","explanation":"\\(a_1=3\\)이면 \\(a_2\\)는 \\(1,2,4,5\\) 중 같은 확률로 하나예요. \\((b_1,b_2)=(1,1)\\)이면 \\(3<a_2\\)라서 \\(a_2=4,5\\)의 2가지이고 이 경우의 확률은 \\((1/10)(2/4)=2/40\\)이에요.\n\n\\((1,2)\\)이면 \\(3<2a_2\\)라서 \\(a_2=2,4,5\\)의 3가지, 이 경우의 확률은 \\((3/10)(3/4)=9/40\\)이에요. \\((2,1)\\)이면 \\(6<a_2\\)를 만족하는 수가 없어요. \\((2,2)\\)이면 다시 \\(3<a_2\\)이므로 이 경우의 확률은 \\((3/10)(2/4)=6/40\\)이에요. 따라서 \\(2/40+9/40+0+6/40=17/40\\)이에요.","check":{"prompt":"\\((b_1,b_2)=(2,1)\\)인 갈래가 탈락하는 원래 부등식은 무엇인가요?","answer":"\\(6<a_2\\)가 되어야 하지만 남은 \\(a_2\\)의 최댓값이 5라서 불가능해요."}},{"id":"c3","label":"첫 수가 4와 5일 때도 확인해요","stepIds":["s4","s5"],"question":"\\(a_1\\)이 커질수록 성공 확률은 어떻게 달라질까요?","hint":"각 경우에 남은 \\(a_2\\)와 \\((b_1,b_2)\\)를 같은 방식으로 대조해요.","explanation":"\\(a_1=4\\)이면 \\(a_2\\)는 \\(1,2,3,5\\)예요. \\((1,1),(1,2),(2,1),(2,2)\\)에서 성공하는 \\(a_2\\)의 수는 각각 \\(1,2,0,1\\)이므로 확률은 \\((1/10)(1/4)+(3/10)(2/4)+(3/10)(0/4)+(3/10)(1/4)=1/4\\)이에요.\n\n\\(a_1=5\\)이면 \\(a_2\\)는 \\(1,2,3,4\\)예요. 이때 성공할 수 있는 갈래는 \\((b_1,b_2)=(1,2)\\)이고 \\(5<2a_2\\)를 만족하는 \\(a_2=3,4\\)뿐이에요. 따라서 확률은 \\((3/10)(2/4)=3/20\\)이에요. 실제로 \\(17/40>1/4>3/20\\)이어서 첫 수가 커질수록 조건을 만족하기 어려워지는 흐름과도 맞아요.","check":{"prompt":"\\(a_1=5\\)에서 \\((2,2)\\)가 성공하지 못하는 이유는 무엇인가요?","answer":"부등식이 \\(10<2a_2\\), 즉 \\(5<a_2\\)가 되지만 남은 \\(a_2\\)는 모두 4 이하이기 때문이에요."}},{"id":"c4","label":"조건부확률의 분모를 확인해요","stepIds":["s6","s7"],"question":"세 확률을 평균내면 왜 바로 조건부확률이 될까요?","hint":"\\(a_1\\ge3\\)인 조건 아래에서 3, 4, 5가 각각 같은 확률이라는 점을 써요.","explanation":"조건 \\(a_1\\ge3\\) 아래에서 세 값은 각각 \\(1/3\\)의 확률이므로 구하는 확률은 \\((1/3)(17/40+1/4+3/20)=(1/3)(33/40)=11/40\\)이에요.\n\n전체 경우를 기준으로 계산하면 교집합의 확률은 \\((1/5)(17/40+1/4+3/20)=33/200\\)이고, 이를 조건 사건의 확률 \\(3/5\\)로 나누어도 \\((33/200)/(3/5)=11/40\\)이에요. \\(p=40,q=11\\)은 서로소이므로 \\(p+q=51\\)이에요.","check":{"prompt":"\\(33/200\\)을 그대로 답으로 쓰면 안 되는 이유는 무엇인가요?","answer":"그 값은 \\(a_1\\ge3\\)과 곱의 부등식을 함께 만족할 확률이고, 문제는 \\(a_1\\ge3\\)이라는 조건 아래의 확률을 묻기 때문에 \\(3/5\\)로 나누어야 해요."}}],"takeaway":["비복원 추출에서는 첫 결과 뒤에 남은 개수를 다시 세어 순서쌍의 확률을 구해요.","조건부확률은 조건을 만족하는 표본 안에서 다시 확률을 계산하거나 교집합의 확률을 조건 사건의 확률로 나눠요.","부등식의 각 갈래에서 실제로 가능한 다음 값을 세면 탈락 경우와 경계를 놓치지 않아요."]};</script>
