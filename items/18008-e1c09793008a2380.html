  <script>window.HandStudyRecord={"itemId":18008,"sourceLabel":"2024 교육청 고3 수학확통 7월 28번","adminYear":2024,"grade":3,"month":7,"number":28,"track":"확통","points":4,"scoreStatus":"confirmed_4_direct","questionText":"주머니에 $1$부터 $9$까지의 자연수가 하나씩 적혀 있는 $9$개의 공이 들어 있다. 이 주머니에서 임의로 공을 한 개씩 $4$번 꺼내어 나온 공에 적혀 있는 수를 꺼낸 순서대로 $a$, $b$, $c$, $d$라 하자. $a \\times b+c+d$가 홀수일 때, 두 수 $a$, $b$가 모두 홀수일 확률은? (단, 꺼낸 공은 다시 넣지 않는다.) [4점]\n① $\\frac{5}{26}$ ② $\\frac{3}{13}$ ③ $\\frac{7}{26}$ ④ $\\frac{4}{13}$ ⑤ $\\frac{9}{26}$\n단답형","answer":"②","sourceHash":"6007efa312bf1be750c222f7a5cd09d452eac28a52efd2f232dcc37ed0c96ffb","steps":[{"id":"s1","latex":"A=\\{ab+c+d\\text{ 홀수}\\},\\quad B=\\{a,b\\text{ 모두 홀수}\\}"},{"id":"s2","latex":"n(A\\cap B)=5\\cdot4\\{3\\cdot2+4\\cdot3\\}=360"},{"id":"s3","latex":"n(A\\cap B^c)=(4\\cdot3)(2\\cdot5\\cdot2)+(2\\cdot5\\cdot4)(2\\cdot4\\cdot3)=240+960=1200"},{"id":"s4","latex":"P(B\\mid A)=\\frac{360}{1560}=\\frac3{13}"}],"diagram":null,"contentHash":"591e2be817ce7322469771752bd5881eac4c2cb7e83ec2c546312762d48c2cb3","questionHtml":"\u003cp class=\"hp\">주머니에 \u003cspan class=\"heq\">\\(1\\)\u003c/span>부터 \u003cspan class=\"heq\">\\(9\\)\u003c/span>까지의 자연수가 하나씩 적혀 있는 \u003cspan class=\"heq\">\\(9\\)\u003c/span>개의 공이 들어 있다. 이 주머니에서 임의로 공을 한 개씩 \u003cspan class=\"heq\">\\(4\\)\u003c/span>번 꺼내어 나온 공에 적혀 있는 수를 꺼낸 순서대로 \u003cspan class=\"heq\">\\(a\\)\u003c/span>, \u003cspan class=\"heq\">\\(b\\)\u003c/span>, \u003cspan class=\"heq\">\\(c\\)\u003c/span>, \u003cspan class=\"heq\">\\(d\\)\u003c/span>라 하자. \u003cbr>\u003cspan class=\"heq\">\\(a \\times b+c+d\\)\u003c/span>가 홀수일 때, 두 수 \u003cspan class=\"heq\">\\(a\\)\u003c/span>, \u003cspan class=\"heq\">\\(b\\)\u003c/span>가 모두 홀수일 확률은? \u003cbr>(단, 꺼낸 공은 다시 넣지 않는다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp htall\">① \u003cspan class=\"heq\">\\(\\dfrac{5}{26}\\)\u003c/span>&emsp;② \u003cspan class=\"heq\">\\(\\dfrac{3}{13}\\)\u003c/span>&emsp;③ \u003cspan class=\"heq\">\\(\\dfrac{7}{26}\
