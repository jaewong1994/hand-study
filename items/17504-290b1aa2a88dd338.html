<script>window.HandStudyRecord={"itemId":17504,"sourceLabel":"2022 평가원 고3 수학미적분 9월 22번","adminYear":2022,"grade":3,"month":9,"number":22,"track":"미적분","points":4,"scoreStatus":"confirmed_4_direct","questionText":"최고차항의 계수가 $1$이고 $x=3$에서 극댓값 $8$을 갖는 삼차함수 $f(x)$가 있다. 실수 $t$에 대하여 함수 $g(x)$를\n $g(x)=\\begin{cases}f(x) && (x \\geq t) \\\\ -f(x)+2 f(t) && (x\u003ct)\\end{cases}$\n라 할 때, 방정식 $g(x)=0$의 서로 다른 실근의 개수를 $h(t)$라 하자. 함수 $h(t)$가 $t=a$에서 불연속인 $a$의 값이 두 개일 때, $f(8)$의 값을 구하시오. [4점]\n 사각형입니다. 2022년 9월 고3 모의고사 문제지제 2 교시 수학 영역(미적분) \n5 지선다형","answer":"58","sourceHash":"3bba0c558baaa63fdc73f7f52b57d79e4bf1d3850b47b64bcf322d177d7993a5","steps":[{"id":"s1","latex":"f(x)=(x-3)^2(x-b)+8,\\quad b>3"},{"id":"s2","latex":"f'(x)=(x-3)(3x-2b-3)"},{"id":"s3","latex":"\\text{극솟점 }u=\\frac{2b+3}{3},\\quad \\mu=f(u)=8-\\frac{4(b-3)^3}{27}"},{"id":"s4","latex":"h(t)=\\#\\{x\\ge t:f(x)=0\\}+\\#\\{x\u003ct:f(x)=2f(t)\\}"},{"latex":"\\mu\u003c0:\\quad f=0\\text{의 세 단순근에서 모두 불연속}\\Rightarrow\\text{적어도 세 개}","id":"s5"},{"latex":"\\mu=0:\\quad\\text{왼쪽 단순근, 극솟점 }u,\\ u\\text{보다 큰 }f(t)=4\\text{인 점에서 불연속}","id":"s6"},{"latex":"\\mu>0:\\quad\\text{왼쪽 영점 한 개와 }t>3,\\ f(t)=4\\text{인 점들만 불연속}","id":"s7"},{"latex":"0\u003c\\mu\u003c4:\\ 3\\text{개};\\quad\\mu=4:\\ 2\\text{개};\\quad\\mu>4:\\ 1\\text{개}\\Rightarrow\\mu=4","id":"s8"},{"id":"s9","latex":"8-\\frac{4(b-3)^3}{27}=4\\Rightarrow b=6"},{"id":"s10","latex":"f(8)=(8-3)^2(8-6)+8=\\boxed{58}"}],"diagram":null,"contentHash":"077228842bb1e32541b28c4e2c86aeac2c515dff18ce1efb7357d3f16ef7c42e","questionHtml":"\u003cp class=\"hp\">최고차항의 계수가 \u003cspan class=\"heq\">\\(1\\)\u003c/span>이고 \u003cspan class=\"heq\">\\(x=3\\)\u003c/span>에서 극댓값 \u003cspan class=\"heq\">\\(8\\)\u003c/span>을 갖는 삼차함수 \u003cspan class=\"heq\">\\(f(x)\\)\u003c/span>가 있다. 실수 \u003cspan class=\"heq\">\\(t\\)\u003c/span>에 대하여 함수 \u003cspan class=\"heq\">\\(g(x)\\)\u003c/span>를\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\(g(x)=\\begin{cases}f(x) && (x \\geq <script>window.HandStudyGuide={"itemId":17504,"sourceHash":"3bba0c558baaa63fdc73f7f52b57d79e4bf1d3850b47b64bcf322d177d7993a5","contentHash":"077228842bb1e32541b28c4e2c86aeac2c515dff18ce1efb7357d3f16ef7c42e","overview":{"goal":"g의 두 조각에서 생기는 영점을 따로 세고, 개수가 바뀌는 t의 수가 두 개가 되도록 f의 극솟값을 정해요.","firstLook":"오른쪽 조각의 영점은 \\(f(x)=0\\), 왼쪽 조각의 영점은 \\(f(x)=2f(t)\\)예요. \\(t\\)가 움직일 때 경계가 근을 지나거나 수평선 높이가 극값을 지날 때 개수가 바뀌어요.","conditions":[{"label":"삼차함수","meaning":"\\(x=3\\)에서 극댓값 \\(8\\)이고 최고차항 계수는 \\(1\\)이에요."},{"label":"불연속점 두 개","meaning":"영점 개수 h(t)가 바뀌는 t값이 정확히 두 개예요."}]},"chapters":[{"id":"c1","label":"극솟값을 b로 표현해요","stepIds":["s1","s2","s3"],"question":"f를 왜 \\((x-3)^2(x-b)+8\\)로 둘 수 있을까요?","hint":"\\(f(x)-8\\)은 \\(x=3\\)에서 값과 도함수가 모두 \\(0\\)이에요.","explanation":"\\(x=3\\)에서 극댓값 \\(8\\)이므로 \\(f(x)-8\\)에는 \\((x-3)^2\\)가 곱해져요. 최고차항 계수가 \\(1\\)이라 \\(f(x)=(x-3)^2(x-b)+8\\)로 둘 수 있고 극댓값이 되려면 다른 도함수 근이 \\(3\\)보다 커 \\(b>3\\)이에요. 미분하면 \\(f'(x)=(x-3)(3x-2b-3)\\)이므로 극솟점은 \\(u=(2b+3)/3\\)예요. 극솟값은 \\(\\mu=f(u)=8-4(b-3)^3/27\\)이에요.","check":{"prompt":"b>3이면 두 도함수 근의 순서는 어떻게 되나요?","answer":"\\(3<u=(2b+3)/3\\)이라 3에서 극대, u에서 극소가 돼요."}},{"id":"c2","label":"h가 세는 두 종류의 근을 분리해요","stepIds":["s4"],"question":"경계 t의 오른쪽과 왼쪽에서 각각 어떤 방정식을 풀까요?","hint":"\\(g\\)의 정의를 \\(0\\)과 같게 놓아요.","explanation":"\\(x\\ge t\\)에서는 \\(g(x)=f(x)\\)라 \\(f\\)의 영점 중 경계 오른쪽에 있는 것을 세어요. \\(x<t\\)에서는 \\(g(x)=-f(x)+2f(t)\\)라 \\(f(x)=2f(t)\\)인 점 중 경계 왼쪽에 있는 것을 세어요. 따라서 \\(h(t)=\\#\\{x\\ge t:f(x)=0\\}+\\#\\{x<t:f(x)=2f(t)\\}\\)예요. 개수 변화는 경계가 \\(f\\)의 영점을 통과하거나, 높이 \\(2f(t)\\)가 \\(f\\)의 극댓값 \\(8\\) 또는 극솟값 \\(\\mu\\)에 닿을 때 생겨요.","check":{"prompt":"왼쪽 조각의 수평선 높이는 무엇인가요?","answer":"\\(y=2f(t)\\)예요."}},{"id":"c3","label":"극솟값의 범위별 변화 수를 비교해요","stepIds":["s5","s6","s7","s8"],"question":"μ가 음수이면 왜 불연속점이 이미 세 개 이상일까요?","hint":"\\(f(x)=0\\)이 서로 다른 세 근을 가져 경계가 각 근을 지나요.","explanation":"\\(\\mu<0\\)이면 극댓값은 양수, 극솟값은 음수라 \\(f(x)=0\\)은 서로 다른 세 근을 갖고 \\(t\\)가 각 근을 지날 때 첫 항의 개수가 바뀌어 이미 세 곳 이상이에요. \\(\\mu=0\\)에서도 왼쪽의 한 영점, 극솟점 \\(u\\), 그리고 \\(u\\)보다 오른쪽에서 \\(f(t)=4\\)가 되는 점 때문에 세 곳이에요. \\(\\mu>0\\)이면 \\(f(x)=0\\)은 왼쪽 영점 하나뿐이고, 추가 변화는 \\(t>3\\)에서 \\(f(t)=4\\)가 되는 점들에서 생겨요. \\(0<\\mu<4\\)이면 수평선 \\(y=4\\)가 세 번 만나 불연속점이 모두 세 개, \\(\\mu=4\\)이면 극솟점에서 두 교점이 합쳐져 모두 두 개, \\(\\mu>4\\)이면 한 개뿐이에요. 조건에 맞는 값은 \\(\\mu=4\\)예요.","check":{"prompt":"\\(\\mu=4\\)에서 불연속점 수가 하나 줄어드는 이유는 무엇인가요?","answer":"수평선 \\(y=4\\)가 극솟점에 접해 두 교점이 한 점으로 합쳐지기 때문이에요."}},{"id":"c4","label":"b와 f(8)을 계산해요","stepIds":["s9","s10"],"question":"\\(\\mu=4\\)에서 b는 얼마인가요?","hint":"극솟값 식에 대입해 세제곱을 풀어요.","explanation":"\\(8-4(b-3)^3/27=4\\)이므로 \\((b-3)^3=27\\), \\(b=6\\)이에요. 따라서 \\(f(8)=(8-3)^2(8-6)+8=25\\cdot2+8=58\\)이에요.","check":{"prompt":"구한 b가 처음의 b>3 조건을 만족하나요?","answer":"\\(b=6>3\\)이라 만족해요."}}],"takeaway":["조각함수의 영점은 경계 양쪽에서 서로 다른 방정식으로 나누어 세어요.","근의 개수는 경계가 근을 지날 때와 수평선이 극값 높이를 지날 때 바뀌어요.","극솟값의 범위를 나누어 불연속점 수를 빠짐없이 비교해요."]};</script>
