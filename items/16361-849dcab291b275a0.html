  <script>window.HandStudyRecord={"itemId":16361,"sourceLabel":"2019 교육청 고3 수리나형 10월 19번","adminYear":2019,"grade":3,"month":10,"number":19,"track":"수리나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 $\\overline{AB} \\,$$= 2$, $\\overline{BC}\\,$$=4\\,$이고 $\\angle ABC=60°\\,$인 삼각형 $A B C\\,$가 있다. 사각형 $D _{1}BE _{1} F _{1} \\,$이 마름모가 되도록 세 선분 $A B$, $B C$, $C A$ 위에 각각 점 $D _{1}$, $E _{1}$, $F_1\\,$을 잡고, 마름모 $D _{1}BE _{1} F _{1} \\,$의 내부와 중심이 $B\\,$인 부채꼴 $BE _{1}D _{1}\\,$의 외부의 공통부분에 색칠하여 얻은 그림을 $R_{\\,1}\\,$이라 하자. 그림 $R_{\\,1}\\,$에서 사각형 $D_2 E_1 E_2 F_2\\,$가 마름모가 되도록 세 선분 $F _{1} E _{1}$, $E _{1} C$, $C F _{1}$ 위에 각각 점 $D _{2}$, $E _{2}$, $F _{2} \\,$를 잡고, 마름모 $D_2 E_1 E_2 F_2\\,$의 내부와 중심이 $E_1\\,$인 부채꼴 $E _{1} E _{2}D _{2} \\,$의 외부의 공통부분에 색칠하여 얻은 그림을 $R _{\\,2}\\,$라 하자. 이와 같은 과정을 계속하여 $n\\,$번째 얻은 그림 $R_{\\,n}\\,$에 색칠되어 있는 부분의 넓이를 $S_{\\,n}\\,$이라 할 때, $\\lim_{n-> \\infty}\\,S_{\\,n}\\,$의 값은? [4점]\n $R_{\\,1}$$R_{\\,2}$$bold \\vdots$$bold \\vdots$\n① $\\frac{4(3 \\sqrt{3} - \\pi )}{15}$ ② $\\frac{4(3 \\sqrt{3} - \\pi )}{9}$ ③ $\\frac{8(3 \\sqrt{3} - \\pi )}{15}$ ④ $\\frac{2(3 \\sqrt{3} - \\pi )}{3}$ ⑤ $\\frac{8(3 \\sqrt{3} - \\pi )}{9}$","answer":"③","sourceHash":"62132f4163646741d80f6f7d761ec733669f8323f5251670ef73653ca58952fe","steps":[{"id":"s1","latex":"x=BE_1=D_1B,\\quad E_1C=4-x"},{"id":"s2","latex":"\\triangle ABC\\sim\\triangle F_1E_1C\\Rightarrow 2:x=4:(4-x)\\Rightarrow x=\\frac43"},{"id":"s3","latex":"a_1=x^2\\sin60^\\circ-\\frac{60^\\circ}{360^\\circ}\\pi x^2=\\frac{8(3\\sqrt3-\\pi)}{27}"},{"id":"s4","latex":"\\text{닮음비}=\\frac{x}{AB}=\\frac23\\Rightarrow\\frac{a_{n+1}}{a_n}=\\frac49"},{"id":"s5","latex":"\\lim_{n\\to\\infty}S_n=\\sum_{n=1}^{\\infty}a_n=\\frac{a_1}{1-4/9}"},{"id":"s6","latex":"=\\boxed{\\frac{8(3\\sqrt3-\\pi)}{15}}"}],"diagram":null,"contentHash":"9e7957ac8c4891a1b1c991e5747e0cce30614b8973d5318123c7922b77197526","questionHtml":"\u003cp class=\"hp htall\">그림과 같이 \u003cspan class=\"heq\">\\(\\overline{AB} \\,\\)\u003c
