  <script>window.HandStudyRecord={"adminYear":2023,"answer":"②","contentHash":"5af107351a061692bdcf44824d511acb61e590f4d04fe03e7f056fba1f37ecd9","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24863,"month":11,"number":10,"points":4,"preview":false,"questionHtml":"\u003cp>시각 \u003cspan class=\"heq\">\\(t=0\\)\u003c/span>일 때 동시에 원점을 출발하여 수직선 위를 움직이는 두 점 \u003cspan class=\"heq\">\\({{P}}\\)\u003c/span>, \u003cspan class=\"heq\">\\({{Q}}\\)\u003c/span>의 시각 \u003cspan class=\"heq\">\\(t \\, \\left(t \\geq 0 \\right)\\)\u003c/span>에서의 속도가 각각\u003c/p>\u003cp> \u003cspan class=\"heq\">\\(v _{1} \\left(t \\right)=t ^{2} -6t+5\\)\u003c/span>, \u003cspan class=\"heq\">\\(v _{2} \\left(t \\right)=2t-7\\)\u003c/span>\u003c/p>\u003cp>이다. 시각 \u003cspan class=\"heq\">\\(t\\)\u003c/span>에서의 두 점 \u003cspan class=\"heq\">\\({{P}}\\)\u003c/span>, \u003cspan class=\"heq\">\\({{Q}}\\)\u003c/span> 사이의 거리를 \u003cspan class=\"heq\">\\(f(t)\\)\u003c/span>라 할 때, 함수 \u003cspan class=\"heq\">\\(f(t)\\)\u003c/span>는 구간 \u003cspan class=\"heq\">\\([0,\\, a]\\)\u003c/span>에서 증가하고, 구간 \u003cspan class=\"heq\">\\([a,\\, b]\\)\u003c/span>에서 감소하고, 구간 \u003cspan class=\"heq\">\\([b,\\, \\infty )\\)\u003c/span>에서 증가한다. 시각 \u003cspan class=\"heq\">\\(t=a\\)\u003c/span>에서 \u003cspan class=\"heq\">\\(t=b\\)\u003c/span>까지 점 \u003cspan class=\"heq\">\\({{Q}}\\)\u003c/span>가 움직인 거리는? (단, \u003cspan class=\"heq\">\\(0&lt;a&lt;b\\)\u003c/span>) [4점]\u003c/p>\u003cdiv class=\"hchoices\">\u003cdiv class=\"hch\">① \u003cspan class=\"heq\">\\(\\frac{15}{2}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">② \u003cspan class=\"heq\">\\(\\frac{17}{2}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">③ \u003cspan class=\"heq\">\\(\\frac{19}{2}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">④ \u003cspan class=\"heq\">\\(\\frac{21}{2}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">⑤ \u003cspan class=\"heq\">\\(\\frac{23}{2}\\)\u003c/span>\u003c/div>\u003c/div>","questionText":"시각 $t=0$일 때 동시에 원점을 출발하여 수직선 위를 움직이는 두 점 ${{P}}$, ${{Q}}$의 시각 $t \\, \\left(t \\geq 0 \\right)$에서의 속도가 각각\n $v _{1} \\left(t \\right)=t ^{2} -6t+5$, $v _{2} \\left(t \\right)=2t-7$\n이다. 시각 $t$에서의 두 점 ${{P}}$, ${{Q}}$ 사이의 거리를 $f(t)$라 할 때, 함수 $f(t)$는 구간 $[0,\\, a]$에서 증가하고, 구간 $[a,\\, b]$에서 감소하고, 구간 $[b,\\, \\infty )$에서 증가한다. 시각 $t=a$에서 $t=b$까지 점 ${{Q}}$가 움직인 거리는? (단, $0\u003ca\u003cb$) [4점]\n① $\\frac{15}{2}$ ② $\\frac{17}{2}$ ③ $\\frac{19}{2}$ ④ $\\frac{21}{2}$ ⑤ $\\frac{23}{2}$","sourceHash":"5b1cbf215ba3545fed703e6bbb856645fb8bd4475daeaa05bb7d875fc0d6984c","sourceKind":"csat","sourceLabel":"2023년 시행 수능 · 2024학년도 · 공통 · 10번","steps":[{"id":"s1","latex":"x_P(t)-x_Q(t)=\\int_{0}^{t}(s^{2}-8s+12)\\,ds=\\frac13t(t-6)^{2}\\ge0"},{"id":"s2","latex":"f(t)=\\frac13t(t-6)^{2},\\qquad f'(t)=(t-2)(t-6)"},{"id":"s3","latex":"\\text{증가ㆍ감소 구간과 비교하면 }a=2,\\ b=6\\text{ 이다.}"},{"id":"s4","latex":"v_2(t)=2t-7\\text{은 }t=\\frac72\\text{에서 부호가 바뀐다.}"},{"explanation":{"body":"이동거리는 변위와 달리 되돌아간 길이도 더합니다. \\(v_2(t)=2t-7\\)이 \\(t=\\frac72\\)에서 음수에서 양수로 바뀌므로, 그 앞에서는 \\(-(2t-7)\\), 뒤에서는 \\(2t-7\\)을 적분해야 합니다.","skillTags":["절댓값적분","속도부호"],"title":"왜 속도의 부호에서 나누나"},"id":"s5","latex":"\\int_{2}^{6}|2t-7|\\,dt=\\int_{2}^{7/2}(7-2t)\\,dt+\\int_{7/2}^{6}(2t-7)\\,dt"},{"id":"s6","latex":"=\\frac94+\\frac{25}{4}=\\frac{17}{2}"},{"id":"s7","latex":"\\therefore\\ \\boxed{\\frac{17}{2}}\\;(②)"}],"track":"공통"};</script>
