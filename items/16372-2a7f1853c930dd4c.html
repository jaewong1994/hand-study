<script>window.HandStudyRecord={"itemId":16372,"sourceLabel":"2019 교육청 고3 수리나형 10월 30번","adminYear":2019,"grade":3,"month":10,"number":30,"track":"수리나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"양수 $a\\,$에 대하여 최고차항의 계수가 $1\\,$인 이차함수 $f \\left(x \\right)\\,$와 최고차항의 계수가 $1\\,$인 삼차함수 $g \\left( x \\right)$가 다음 조건을 만족시킨다.\n(가) $f \\left( 0 \\right) \\,$$=g \\left( 0 \\right)$ (나) $\\lim _{x\\, -> \\,0} {\\, \\frac{f(x)}{x}}$$=0$, $\\lim _{x\\, -> \\,a} {\\, \\frac{g(x)}{x-a}}$$=0$ (다) $\\int _{0} ^{a} {\\left\\{ g(x)-f(x) \\right\\}\\, dx}\\,$$=36$\n$3 \\int _{0} ^{a} {\\left| f(x)-g(x) \\right|$$dx} \\,$의 값을 구하시오. [4점]","answer":"340","sourceHash":"94cc9d12bd280d3893c3e39710358a7f3e0b6c9c8817b1db9fe1a22ac5e7f842","steps":[{"id":"s1","latex":"\\lim_{x\\to0}\\frac{f(x)}x=0\\Rightarrow f(0)=f\\prime(0)=0\\Rightarrow f(x)=x^2"},{"id":"s2","latex":"g(0)=0,\\quad\\lim_{x\\to a}\\frac{g(x)}{x-a}=0\\Rightarrow g(a)=g\\prime(a)=0"},{"id":"s3","latex":"g(x)=x(x-a)^2"},{"id":"s4","latex":"\\int_0^a(g-f)\\,dx=\\frac{a^4}{12}-\\frac{a^3}{3}=36"},{"id":"s5","latex":"a^3(a-4)=432,\\ a>0\\Rightarrow a=6"},{"id":"s6","latex":"g(x)-f(x)=x(x-4)(x-9)"},{"id":"s7","latex":"F(x)=\\int_0^x(g-f)\\,dt=\\frac{x^4}{4}-\\frac{13x^3}{3}+18x^2"},{"id":"s8","latex":"\\int_0^6|f-g|\\,dx=2F(4)-F(6)=\\frac{340}{3}"},{"id":"s9","latex":"3\\int_0^6|f-g|\\,dx=\\boxed{340}"}],"diagram":null,"contentHash":"53f15ddd1dd9b52f4c106f350603a79607d9dcecf5eff19a48f6738e93b6051c","questionHtml":"\u003cp class=\"hp\">양수 \u003cspan class=\"heq\">\\(a\\,\\)\u003c/span>에 대하여 최고차항의 계수가 \u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>인 이차함수 \u003cspan class=\"heq\">\\(f \\left(x \\right)\\,\\)\u003c/span>와 최고차항의 계수가 \u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>인 삼차함수 \u003cspan class=\"heq\">\\(g \\left( x \\right)\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가)\u003cspan class=\"heq\">\\(f \\left( 0 \\right) \\,\\)\u003c/span>\u003cspan class=\"heq\">\\(=g \\left( 0 \\right)\\)\u003c/span>\u003c/p>\u003cp class=\"hp htall\">(나)\u003cspan class=\"heq\">\\(\\lim\\limits_{x\\, \\to  \\,0} {\\, \\dfrac{f(x)}{x}}\\)\u003c/span>\u003cspan class=\"heq\">\\(=0\\)\u003c/span>, \u003cspan class=\"heq\">\\(\\lim\\limits_{x\\, \\to  \\,a} {\\, \\dfrac{g(x)}{x-a}}\\)\u003c/span>\u003cspan class=\"heq\">\\(=0\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">(다)\u003cspan class=\"heq\">\\(\\int_{0}^{a} {\\left\\{ g(x)-f(x) \\right\\}\\, dx}\\,\\)\u003c/span>\u003cspan class=\"heq\">\\(=36\\)\u003c/span>\u003c/p>\u003c/div>\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(3 \\int_{0}^{a} {\\left| f(x)-g(x) \\right| }\\)\u003c/span>\u003cspan class=\"heq\">\\(dx \\,\\)\u003c/span>의 값을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"2a7f1853c930dd4c8375b61bd3769c7942180a2a1717f985bc0248419742cc7d"};</script>
<script>window.HandStudyGuide={"itemId":16372,"sourceHash":"94cc9d12bd280d3893c3e39710358a7f3e0b6c9c8817b1db9fe1a22ac5e7f842","contentHash":"53f15ddd1dd9b52f4c106f350603a79607d9dcecf5eff19a48f6738e93b6051c","overview":{"goal":"두 극한에서 함수의 근과 중근을 찾아낸 뒤, 부호가 바뀌는 점을 기준으로 절댓값 적분을 계산해요.","firstLook":"분모가 \\(0\\)으로 가는데 몫의 극한이 \\(0\\)이에요. 먼저 분자도 그 점에서 \\(0\\)이어야 한다는 사실을 읽으면 두 다항식이 거의 결정돼요.","conditions":[{"label":"(가)","meaning":"첫 극한에서 얻는 \\(f(0)=0\\)을 이용하면 \\(g(0)=0\\)도 따라와요."},{"label":"(나)","meaning":"\\(0\\)은 \\(f\\)의 적어도 이중근이고, \\(a\\)는 \\(g\\)의 적어도 이중근이 되게 해요."},{"label":"(다)","meaning":"정적분값으로 양수 \\(a\\)를 정하고, 같은 적분값을 마지막 절댓값 계산에도 다시 써요."}]},"chapters":[{"id":"c1","label":"극한에서 근의 개수를 읽어요","stepIds":["s1","s2","s3"],"question":"두 몫의 극한이 \\(0\\)이라는 조건은 왜 단순한 근보다 더 강할까요?","hint":"다항식을 해당 점에서 나누어질 만큼 먼저 묶은 뒤, 나눈 식의 극한도 \\(0\\)이어야 해요.","explanation":"최고차항의 계수가 \\(1\\)인 이차함수를 \\(f(x)=x^2+px+q\\)로 두어요. \\(f(x)/x\\)의 극한이 유한하려면 먼저 \\(q=f(0)=0\\)이어야 하고, 그러면 \\(f(x)/x=x+p\\)예요. 그 극한이 \\(0\\)이므로 \\(p=0\\), 따라서 \\(f(x)=x^2\\)예요.\n\n(가)에서 \\(g(0)=f(0)=0\\)이에요. 또 \\(g(x)/(x-a)\\)의 극한이 \\(0\\)이므로 \\(g(a)=0\\)이고, \\(g(x)=(x-a)Q(x)\\)로 놓았을 때 \\(Q(a)=0\\)이에요. 즉 \\(a\\)는 \\(g\\)의 이중근이에요. \\(g\\)는 최고차항의 계수가 \\(1\\)인 삼차함수이고 \\(0,a,a\\)를 근으로 가지므로 \\(g(x)=x(x-a)^2\\)로 정해져요.","check":{"prompt":"\\(g(a)=0\\)만으로 부족하고 \\(a\\)가 이중근이어야 하는 이유는 무엇인가요?","answer":"\\(g(x)=(x-a)Q(x)\\)로 나눈 뒤의 극한 \\(Q(a)\\)도 \\(0\\)이어야 하므로 \\(Q(a)=0\\), 곧 \\((x-a)^2\\)가 인수이기 때문이에요."}},{"id":"c2","label":"정적분으로 양수인 계수를 정해요","stepIds":["s4","s5"],"question":"적분 조건에서 나온 방정식은 왜 양의 해 \\(a=6\\) 하나만 가질까요?","hint":"\\(0<a\\le4\\)와 \\(a>4\\)를 나누고, 뒤 구간에서 \\(a^3(a-4)\\)가 어떻게 변하는지 봐요.","explanation":"두 함수를 빼면 \\(g(x)-f(x)=x(x-a)^2-x^2\\)예요. 항별로 \\(0\\)부터 \\(a\\)까지 적분하면\n\n\\(\\int_0^a(g-f)\\,dx=\\dfrac{a^4}{4}-\\dfrac{(2a+1)a^3}{3}+\\dfrac{a^4}{2}=\\dfrac{a^4}{12}-\\dfrac{a^3}{3}\\)\n\n이고, (다)에 따라 \\(a^3(a-4)=432\\)예요. \\(0<a\\le4\\)에서는 왼쪽이 \\(0\\) 이하라서 불가능해요. \\(a>4\\)에서는 그 식의 도함수가 \\(4a^2(a-3)>0\\)이므로 값이 계속 커져요. \\(a=6\\)을 넣으면 \\(6^3(6-4)=432\\)이므로 양의 해는 \\(6\\) 하나뿐이에요.","check":{"prompt":"\\(a=6\\)을 찾은 뒤 다른 양의 해가 없다고 말할 수 있는 근거는 무엇인가요?","answer":"\\(0<a\\le4\\)에서는 왼쪽이 양수가 아니고, \\(a>4\\)에서는 \\(a^3(a-4)\\)가 계속 증가하므로 \\(432\\)를 한 번만 지나기 때문이에요."}},{"id":"c3","label":"절댓값 앞에서 부호를 나눠요","stepIds":["s6","s7"],"question":"구간 \\([0,6]\\)에서 \\(g-f\\)의 부호는 어디에서 바뀔까요?","hint":"\\(a=6\\)을 넣고 완전히 인수분해한 뒤, 세 인수의 부호를 구간별로 확인해요.","explanation":"\\(a=6\\)을 넣으면\n\n\\(g(x)-f(x)=x(x-6)^2-x^2=x(x^2-13x+36)=x(x-4)(x-9)\\)\n\n이에요. \\(0<x<4\\)에서는 \\(x\\)는 양수이고 \\(x-4,x-9\\)는 둘 다 음수이므로 \\(g-f>0\\)이에요. \\(4<x\\le6\\)에서는 \\(x-4\\)가 양수로 바뀌지만 \\(x-9\\)는 여전히 음수라서 \\(g-f<0\\)이에요. 따라서 절댓값을 벗길 경계는 \\(x=4\\)예요.\n\n계산을 짧게 정리하려고 \\(\\mathrm{F}(x)=\\int_0^x(g(t)-f(t))\\,dt\\)로 두면 \\(\\mathrm{F}(x)=x^4/4-13x^3/3+18x^2\\)예요.","check":{"prompt":"\\(x=9\\)도 근인데 적분 구간을 거기서 나누지 않는 이유는 무엇인가요?","answer":"적분 구간이 \\([0,6]\\)이므로 \\(9\\)는 구간 밖에 있고, 구간 안에서 부호가 바뀌는 내부점은 \\(4\\)뿐이에요."}},{"id":"c4","label":"두 넓이를 부호에 맞게 더해요","stepIds":["s8","s9"],"question":"절댓값 적분이 왜 \\(2\\mathrm{F}(4)-\\mathrm{F}(6)\\)이 될까요?","hint":"\\([0,4]\\)에서는 그대로, \\([4,6]\\)에서는 부호를 바꾸어 적분해요.","explanation":"\\(|f-g|=|g-f|\\)이고 앞 장의 부호를 쓰면\n\n\\(\\int_0^6|f-g|\\,dx=\\int_0^4(g-f)\\,dx-\\int_4^6(g-f)\\,dx=2\\mathrm{F}(4)-\\mathrm{F}(6)\\)\n\n이에요. 실제로 \\(\\mathrm{F}(4)=64-832/3+288=224/3\\)이고, (다) 또는 직접 계산으로 \\(\\mathrm{F}(6)=36\\)이에요. 따라서\n\n\\(2\\mathrm{F}(4)-\\mathrm{F}(6)=\\dfrac{448}{3}-36=\\dfrac{340}{3}\\)\n\n이고, 문제에서 이 값의 \\(3\\)배를 물었으므로 답은 \\(340\\)이에요.","check":{"prompt":"\\([4,6]\\)의 적분 앞에 음의 부호가 붙는 이유와 최종값을 말해 보세요.","answer":"그 구간에서는 \\(g-f<0\\)이어서 절댓값을 벗기면 \\(-(g-f)\\)가 되고, 전체 절댓값 적분은 \\(340/3\\), 요구값은 \\(340\\)이에요."}}],"takeaway":["다항식을 일차식으로 나눈 몫의 극한이 \\(0\\)이면 그 점이 이중근인지 확인해요.","양수 해의 유일성은 구간의 부호와 증가를 나누어 확인해요.","절댓값 적분은 적분 구간 안에 있는 영점만 골라 실제 부호를 조사한 뒤 나눠요."]};</script>
