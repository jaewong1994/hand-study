<script>window.HandStudyRecord={"itemId":8856,"sourceLabel":"2022 교육청 고2 수학 6월 30번","adminYear":2022,"grade":2,"month":6,"number":30,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"두 실수 $a\\,$, $b\\,$와 두 함수\n $f \\left( x \\right) =\\sin\\,x\\,$, $g \\left( x \\right) =a \\,\\cos\\,x+b\\,$\n에 대하여 $0 \\leq x \\leq 2\\pi\\,$에서 정의된 함수\n $h \\left( x \\right) = \\frac{\\left| f \\left( x \\right) -g \\left( x \\right) \\right| +f \\left( x \\right) +g \\left( x \\right)}{2} \\,$\n가 다음 조건을 만족시킨다. \n (가) 함수 $h \\left( x \\right)\\,$의 최솟값은 $- \\sqrt{\\frac}{3}{2}\\,$이다. (나) $0<c< \\frac{\\pi }{2} \\,$인 어떤 실수 $c\\,$에 대하여 $h \\left( c \\right) =h \\left( c+ \\pi \\right) = \\frac{1}{2} \\,$이다.\n상수 $k\\,$$\\left( k> \\frac{1}{2} \\right) \\,$에 대하여 방정식 $h \\left( x \\right) =k\\,$가 서로 다른 세 실근을 가질 때, $a+20\\left( \\frac{k}{b} \\right) ^{2}\\,$의 값을 구하시오. [4점]","answer":"59","sourceHash":"c687f55b18d58e84624480fa9ff3fbe76c91b1335dec761a89e1259fa8fde40a","steps":[{"id":"s1","latex":"h(x)=\\begin{cases}\\sin x&(\\sin x\\ge g(x))\\\\g(x)&(\\sin x<g(x))\\end{cases},\\quad g(c+\\pi)=\\frac12,\\ g(c)\\le\\frac12"},{"id":"s2","latex":"2a\\cos c=g(c)-g(c+\\pi)\\le0\\Rightarrow a\\le0"},{"id":"s3","latex":"a=0\\Rightarrow b=\\frac12\\Rightarrow h(x)\\ge\\frac12\\text{이므로 주어진 최솟값을 가질 수 없다}"},{"id":"s4","latex":"a<0\\Rightarrow g(c)<\\frac12\\Rightarrow\\sin c=\\frac12\\Rightarrow c=\\frac\\pi6"},{"id":"s5","latex":"g(7\\pi/6)=\\frac12,\\quad g\\text{는 }[\\pi,2\\pi]\\text{에서 감소}"},{"id":"s6","latex":"h(x)\\text{의 최솟값이 }-1\\text{보다 크므로 }3\\pi/2<x<2\\pi\\text{에서 }\\sin x=g(x)\\text{인 점에서 최솟값을 갖는다}"},{"id":"s7","latex":"\\sin x=-\\frac{\\sqrt3}{2},\\quad\\frac{3\\pi}{2}<x<2\\pi\\Rightarrow x=\\frac{5\\pi}{3}"},{"id":"s8","latex":"-\\frac{\\sqrt3}{2}a+b=\\frac12,\\quad\\frac12a+b=-\\frac{\\sqrt3}{2}\\Rightarrow a=-1,\\ b=\\frac{1-\\sqrt3}{2}"},{"id":"s9","latex":"g(5\\pi/6)=\\sin(5\\pi/6)=\\frac12,\\quad g(\\pi)=\\frac{3-\\sqrt3}{2}=M"},{"id":"s10","latex":"\\frac12<k<M:\\ \\#=4,\\quad k=M:\\ \\#=3,\\quad M<k<1:\\ \\#=2"},{"id":"s11","latex":"k\\ge1:\\ \\#\\le1\\Rightarrow k=M,\\quad k/b=-\\sqrt3"},{"id":"s12","latex":"a+20(k/b)^2=-1+60=59"}],"diagram":null,"contentHash":"ab1182ac8bbee695527be79856d37a01c7f4beca9a03a51fe1c1b6339c105393","questionHtml":"<p class=\"hp\">두 실수 <span class=\"heq\">\\(a\\,\\)<\/span>, <span class=\"heq\">\\(b\\,\\)<\/span>와 두 함수<\/p><p class=\"hp\">&emsp;<span class=\"heq\">\\(f \\left( x \\right) =\\sin\\,x\\,\\)<\/span>, <span class=\"heq\">\\(g \\left( x \\right) =a \\,\\cos\\,x+b\\,\\)<\/span><\/p><p class=\"hp\">에 대하여 <span class=\"heq\">\\(0 \\leq x \\leq 2\\pi\\,\\)<\/span>에서 정의된 함수<\/p><p class=\"hp htall\">&emsp;<span class=\"heq\">\\(h \\left( x \\right) = \\dfrac{\\left| f \\left( x \\right) -g \\left( x \\right) \\right| +f \\left( x \\right) +g \\left( x \\right)}{2} \\,\\)<\/span><\/p><p class=\"hp\">가 다음 조건을 만족시킨다.<\/p><div class=\"hbox\"><p class=\"hp htall\">(가) 함수 <span class=\"heq\">\\(h \\left( x \\right)\\,\\)<\/span>의 최솟값은 <span class=\"heq\">\\(- \\dfrac{\\sqrt{3}}{2}\\,\\)<\/span>이다.<\/p><p class=\"hp htall\">(나) <span class=\"heq\">\\(0\\lt c\\lt  \\dfrac{\\pi }{2} \\,\\)<\/span>인 어떤 실수 <span class=\"heq\">\\(c\\,\\)<\/span>에 대하여<br><span class=\"heq\">\\(h \\left( c \\right) =h \\left( c+ \\pi \\right) = \\dfrac{1}{2} \\,\\)<\/span>이다.<\/p><\/div><p class=\"hp htall\">상수 <span class=\"heq\">\\(k\\,\\)<\/span><span class=\"heq\">\\(\\left( k\\gt  \\dfrac{1}{2} \\right) \\,\\)<\/span>에 대하여 방정식 <span class=\"heq\">\\(h \\left( x \\right) =k\\,\\)<\/span>가 서로 다른 세 실근을 가질 때, <span class=\"heq\">\\(a+20\\left( \\dfrac{k}{b} \\right)^{2}\\,\\)<\/span>의 값을 구하시오. <span class=\"hscore\">[4점]<\/span><\/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"dea67323945be3bf4e23e24f552dbc565299ca4fa19f14e3103069fb57c52d66"};</script>
<script>window.HandStudyGuide={"itemId":8856,"sourceHash":"c687f55b18d58e84624480fa9ff3fbe76c91b1335dec761a89e1259fa8fde40a","contentHash":"ab1182ac8bbee695527be79856d37a01c7f4beca9a03a51fe1c1b6339c105393","overview":{"goal":"\\(h\\)가 \\(\\sin x\\)와 \\(a\\cos x+b\\) 중 더 큰 값을 고르는 함수임을 이용해 \\(a,b,k\\)를 정해요.","firstLook":"\\((|u-v|+u+v)/2\\)는 \\(u\\ge v\\)일 때 \\(u\\), \\(u<v\\)일 때 \\(v\\)예요.","conditions":[{"label":"두 같은 함숫값","meaning":"\\(c\\)와 \\(c+\\pi\\)에서 사인과 코사인의 부호가 함께 바뀌는 점을 이용해 \\(a\\)의 부호를 정해요."},{"label":"세 실근","meaning":"수평선 높이를 움직일 때 교점 수가 네 개에서 세 개로 바뀌는 정확한 경계값을 찾아요."}]},"chapters":[{"id":"c1","label":"조건에서 a의 부호와 c를 정해요","stepIds":["s1","s2","s3","s4"],"question":"왜 \\(a<0\\), \\(c=\\pi/6\\)인가요?","hint":"\\(c+\\pi\\)에서 사인은 음수이므로 함숫값 \\(1/2\\)를 어느 식이 만드는지 먼저 봐요.","explanation":"\\(h(x)\\)는 \\(\\sin x\\ge g(x)\\)이면 \\(\\sin x\\), 반대이면 \\(g(x)\\)와 같아요. \\(0<c<\\pi/2\\)에서 \\(\\sin(c+\\pi)<0\\)인데 \\(h(c+\\pi)=1/2\\)이므로 \\(g(c+\\pi)=1/2\\)예요. 또 \\(h(c)=1/2\\)이려면 \\(g(c)\\le1/2\\)예요.\n\n\\(g(c)-g(c+\\pi)=2a\\cos c\\le0\\)이고 \\(\\cos c>0\\)이므로 \\(a\\le0\\)예요. \\(a=0\\)이면 \\(g\\equiv1/2\\)라서 \\(h(x)\\ge1/2\\)가 되어 음의 최솟값 조건과 모순이에요. 따라서 \\(a<0\\), 그래서 \\(g(c)<1/2\\)이고 \\(h(c)=\\sin c=1/2\\)예요. 범위에서 \\(c=\\pi/6\\)이에요.","check":{"prompt":"\\(a=0\\)일 때 왜 바로 탈락하나요?","answer":"\\(g\\)가 항상 \\(1/2\\)라서 둘 중 큰 값을 고르는 \\(h\\)가 \\(1/2\\)보다 작아질 수 없기 때문이에요."}},{"id":"c2","label":"최솟값이 생기는 교점을 찾아요","stepIds":["s5","s6","s7","s8"],"question":"최솟값 \\(-\\sqrt3/2\\)는 왜 \\(x=5\\pi/3\\)에서 나오나요?","hint":"\\([\\pi,2\\pi]\\)에서 \\(g\\)가 감소하고, \\(h\\)는 두 그래프 중 위쪽을 따라가요.","explanation":"\\(g(7\\pi/6)=1/2\\)이고 \\(a<0\\)이므로 \\([\\pi,2\\pi]\\)에서 \\(g\\)는 감소해요. \\(h\\)는 두 그래프 중 더 큰 값을 따라가므로, 음의 가장 작은 값은 \\(3\\pi/2<x<2\\pi\\)에서 두 그래프가 만나는 점에서 생겨요. 그 값이 \\(-\\sqrt3/2\\)이므로 이 구간의 \\(\\sin x=-\\sqrt3/2\\) 해는 \\(x=5\\pi/3\\)이에요.\n\n따라서 \\(g(7\\pi/6)=1/2\\)에서 \\(-a\\sqrt3/2+b=1/2\\), \\(g(5\\pi/3)=-\\sqrt3/2\\)에서 \\(a/2+b=-\\sqrt3/2\\)예요. 두 식을 풀면 \\(a=-1,b=(1-\\sqrt3)/2\\)예요.","check":{"prompt":"\\(x=4\\pi/3\\)을 고르지 않는 이유는 무엇인가요?","answer":"최솟값을 만드는 두 그래프의 교점은 \\(3\\pi/2<x<2\\pi\\)에 있고, \\(4\\pi/3\\)은 그 구간 밖이에요."}},{"id":"c3","label":"세 교점이 되는 높이를 찾아요","stepIds":["s9","s10","s11"],"question":"왜 \\(k=g(\\pi)\\)일 때만 실근이 세 개인가요?","hint":"\\(1/2\\) 바로 위에서 수평선을 올리며 교점 수가 바뀌는 높이를 봐요.","explanation":"구한 식에서 \\(g(5\\pi/6)=\\sin(5\\pi/6)=1/2\\)이고 \\(g(\\pi)=(3-\\sqrt3)/2\\)예요. 이 값을 \\(M\\)이라 하자. \\(1/2<k<M\\)에서는 수평선이 \\(h\\)와 네 점에서 만나고, \\(k=M\\)에서는 그중 두 교점이 \\(x=\\pi\\)에서 하나로 합쳐져 세 점이 돼요. \\(M<k<1\\)에서는 두 점, \\(k\\ge1\\)에서는 한 점 이하예요. 따라서 \\(k=M\\)이에요.\n\n\\(k/b=(3-\\sqrt3)/(1-\\sqrt3)=-\\sqrt3\\)이므로 \\((k/b)^2=3\\)이에요.","check":{"prompt":"경계 \\(k=M\\)를 별도로 세어야 하는 이유는 무엇인가요?","answer":"경계에서는 두 교점이 같은 점으로 합쳐져 서로 다른 실근의 개수가 한 개 줄기 때문이에요."}},{"id":"c4","label":"요구식을 계산해요","stepIds":["s12"],"question":"마지막 값은 얼마인가요?","hint":"\\(a=-1\\), \\((k/b)^2=3\\)을 넣어요.","explanation":"\\(a+20(k/b)^2=-1+20\\cdot3=59\\)예요.","check":{"prompt":"비 \\(k/b\\)의 부호가 최종값에 영향을 주나요?","answer":"제곱하므로 부호는 사라지고 값은 \\(3\\)만 사용해요."}}],"takeaway":["절댓값으로 만든 두 함수의 식은 어느 함수가 더 큰지에 따라 조각으로 풀어 써요.","두 그래프 중 위쪽을 따르는 함수의 최솟값은 두 그래프의 교점에서 생길 수 있어요.","교점 수가 바뀌는 경계 높이에서는 겹친 교점을 한 번만 세어요."]};</script>
