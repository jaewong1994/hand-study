<script>window.HandStudyRecord={"adminYear":2025,"answer":"15","contentHash":"9f73935dd466daa694ca81d7244a7e81013a6073cc628713937c7a375cd096be","diagram":null,"editionHash":"fa2490457c8b0a734099b31e773344335c96ef9cbdc50f053c33786ffa76b8f5","grade":3,"graphHash":"","graphPlan":null,"itemId":18253,"learningHash":"54abc5e5ef5ebf158568e1e735bf0f9c4b7ea042e9cf277915a23e4a066805dc","month":5,"number":30,"points":4,"preview":false,"questionHtml":"\u003cp class=\"hp\">수열 \u003cspan class=\"heq\">\\(\\left\\{a_{n} \\right\\}\\,\\)\u003c/span>은 모든 항이 양수인 등비수열이고, 수열 \u003cspan class=\"heq\">\\(\\left\\{b_{n} \\right\\}\\,\\)\u003c/span>을 모든 자연수 \u003cspan class=\"heq\">\\(n\\,\\)\u003c/span>에 대하여\u003c/p>\u003cp class=\"hp htall\">&emsp;&emsp;\u003cspan class=\"heq\">\\(b_{n}= \\begin{cases}\\, \\left(-1 \\right)^{n} & & \\left(a_{n} \\lt  1 \\right) \\\\ \\, a_{n} & & \\left(a_{n} \\geq 1 \\right)\\end{cases}\\,\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">이라 할 때, 수열 \u003cspan class=\"heq\">\\(\\left\\{b_{n} \\right\\}\\,\\)\u003c/span>이 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp htall\">(가) 급수 \u003cspan class=\"heq\">\\(\\sum\\limits_{n=1}^{ \\infty } \\left(3b_{3n-2}-7b_{3n-1}+2b_{3n} \\right)\\,\\)\u003c/span>은 수렴한다.\u003c/p>\u003cp class=\"hp htall\">(나) \u003cspan class=\"heq\">\\(b_{5}^{2} =b_{4} b_{6} - \\dfrac{9}{4}\\)\u003c/span>\u003c/p>\u003c/div>\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(90a_{3}\\,\\)\u003c/span>의 값을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","questionText":"수열 $\\left\\{a_{n} \\right\\}\\,$은 모든 항이 양수인 등비수열이고, 수열 $\\left\\{b_{n} \\right\\}\\,$을 모든 자연수 $n\\,$에 대하여\n $b_{n}= \\begin{cases}\\, \\left(-1 \\right)^{n} & & \\left(a_{n} \u003c 1 \\right) \\\\ \\, a_{n} & & \\left(a_{n} \\geq 1 \\right)\\end{cases}\\,$\n이라 할 때, 수열 $\\left\\{b_{n} \\right\\}\\,$이 다음 조건을 만족시킨다.\n(가) 급수 $\\sum_{n=1}^{ \\infty } \\left(3b_{3n-2}-7b_{3n-1}+2b_{3n} \\right)\\,$은 수렴한다.(나) $b _{5}^{2} =b _{4} b _{6} - \\frac{9}{4}$\n$90a_{3}\\,$의 값을 구하시오. [4점]","scoreStatus":"confirmed_4_direct","sourceHash":"506e3693f9badf17d6b64555825c1666622cf83fd3f917b055f7814fe513128a","sourceLabel":"2025 교육청 고3 수학미적분 5월 30번","stepExplanations":{"s2":{"body":"모든 \\(a_n\\)이 양수이므로 \\(r>0\\)입니다. \\(0\u003cr\u003c1\\)이면 충분히 큰 \\(n\\)에서 \\(b_j=(-1)^j\\)가 되어 \\(c_n=12(-1)^n\\)이고, \\(r=1\\)이면 \\(a_n\u003c1\\)일 때 같은 값, \\(a_n\\ge1\\)일 때 \\(c_n=-2a_n\\)이므로 어느 쪽도 0으로 가지 않습니다. \\(r>1\\)이면 충분히 큰 \\(n\\)에서 세 항 모두 \\(b_j=a_j\\)가 되어 \\(c_n=a_{3n-2}(2r-1)(r-3)\\)이고, 급수의 일반항이 0으로 가려면 \\(r=3\\)입니다.","skillTags":["series-necessary-condition","geometric-factorization"],"title":"급수의 일반항이 0이 되게 하는 공비"},"s6":{"body":"\\(a_5\u003c1\\le a_6\\)이면 \\(b_4=1,b_5=-1,b_6=9t\\)입니다. 조건은 \\(1=9t-9/4\\)가 되어 \\(t=13/36\\), 따라서 \\(a_5=3t=13/12>1\\)입니다. 처음 둔 \\(a_5\u003c1\\)과 모순입니다.","skillTags":["piecewise-boundary","case-elimination"],"title":"경계가 a5와 a6 사이면 생기는 모순"},"s7":{"body":"\\(a_4\u003c1\\le a_5\\)이면 \\(b_4=1,b_5=3t,b_6=9t\\)입니다. \\((3t)^2=9t-9/4\\)를 정리하면 \\((2t-1)^2=0\\)이므로 \\(t=1/2\\)이고, 실제로 \\(a_4\u003c1\\le a_5\\)도 만족합니다.","skillTags":["piecewise-case","double-root-equation"],"title":"남는 경계에서 t가 하나로 정해진다"}},"steps":[{"id":"s1","latex":"a_n=Ar^{n-1},\\quad c_n=3b_{3n-2}-7b_{3n-1}+2b_{3n}"},{"id":"s2","latex":"r\\le1\\Rightarrow c_n\\not\\to0,\\qquad r>1\\Rightarrow c_n=a_{3n-2}(2r-1)(r-3)"},{"id":"s3","latex":"c_n\\to0\\Rightarrow r=3"},{"id":"s4","latex":"t=a_4:\\quad(a_4,a_5,a_6)=(t,3t,9t)"},{"id":"s5","latex":"a_6\u003c1\\text{ 또는 }a_4\\ge1:\\quad b_4b_6-b_5^2=0\\ne9/4"},{"id":"s6","latex":"a_5\u003c1\\le a_6\\Rightarrow a_5=\\frac{13}{12}\\ \\text{모순}"},{"id":"s7","latex":"a_4\u003c1\\le a_5:\\quad9t^2=9t-\\frac94\\Rightarrow t=\\frac12"},{"id":"s8","latex":"a_3=\\frac16\\Rightarrow90a_3=15"}],"track":"미적분"};</script>
<script>window.HandStudyGuide={"itemId":18253,"sourceHash":"506e3693f9badf17d6b64555825c1666622cf83fd3f917b055f7814fe513128a","contentHash":"9f73935dd466daa694ca81d7244a7e81013a6073cc628713937c7a375cd096be","overview":{"goal":"묶음 급수의 일반항이 0으로 가는 조건으로 공비를 정하고, 세 연속 항이 기준 1을 넘는 위치를 나누어 \\(a_3\\)을 구해요.","firstLook":"급수가 수렴하면 괄호로 묶인 한 항이 0으로 가야 해요. 큰 번호에서 \\(a_n\\)이 1보다 큰지 작은지가 공비를 결정해요.","conditions":[{"label":"모든 항이 양수인 등비수열","meaning":"첫째항과 공비가 모두 양수예요."},{"label":"기준값 1에 따른 조각","meaning":"\\(a_4,a_5,a_6\\)이 1을 처음 넘는 위치를 네 경우로 나눠요."}]},"chapters":[{"id":"c1","label":"급수 수렴으로 공비 정하기","stepIds":["s1","s2","s3"],"question":"공비가 1 이하일 때 묶음항이 0으로 가지 않는 이유는 무엇인가요?","hint":"충분히 큰 번호에서 \\(a_n<1\\)이 되는 경우와 \\(r=1\\)인 경우를 따로 보세요.","explanation":"\\(a_n=Ar^{n-1}\\)이고 \\(c_n=3b_{3n-2}-7b_{3n-1}+2b_{3n}\\)로 두어요. 급수가 수렴하려면 \\(c_n\\to0\\)이어야 해요. \\(0<r<1\\)이면 뒤에서는 모든 \\(a_n<1\\)이라 \\(b_n=(-1)^n\\)이고, 세 첨자의 홀짝을 넣으면 \\(c_n=12(-1)^n\\)이 되어 0으로 가지 않아요. \\(r=1\\)도 \\(b_n\\)이 번갈거나 일정하여 \\(c_n\\)이 0으로 가지 않아요.\n\n따라서 \\(r>1\\)이고, 충분히 큰 번호에서는 \\(b_n=a_n\\)이에요. 그러면 \\(c_n=a_{3n-2}(3-7r+2r^2)=a_{3n-2}(2r-1)(r-3)\\)예요. \\(a_{3n-2}\\)는 커지므로 곱이 0으로 가려면 계수가 0이어야 하고 \\(r>1\\)에서 \\(r=3\\)만 가능해요.","check":{"prompt":"\\(r=1/2\\)가 인수에서 나오는데 제외되는 이유는 무엇인가요?","answer":"앞에서 급수 수렴을 위해 \\(r>1\\)이어야 함을 확인했기 때문이에요."}},{"id":"c2","label":"세 항의 경계 경우 모두 검사하기","stepIds":["s4","s5","s6"],"question":"\\(a_4=t\\)로 두면 \\(a_5,a_6\\)은 무엇이고, 기준 1을 넘는 위치는 어떤 경우들이 있나요?","hint":"공비가 3이므로 \\(t,3t,9t\\)가 증가한다는 점을 이용하세요.","explanation":"\\(a_4=t\\)로 두면 \\((a_4,a_5,a_6)=(t,3t,9t)\\)예요. 세 수가 증가하므로 모두 1보다 작은 경우, 모두 1 이상인 경우, \\(a_6\\)에서 처음 1 이상인 경우, \\(a_5\\)에서 처음 1 이상인 경우만 있어요.\n\n모두 작은 경우에는 \\((b_4,b_5,b_6)=(1,-1,1)\\)이라 조건 (나)가 맞지 않고, 모두 큰 경우에는 등비수열 관계로 \\(b_5^2=b_4b_6\\)라 역시 \\(9/4\\) 차이가 생길 수 없어요. \\(a_5<1\\le a_6\\)이면 \\((b_4,b_5,b_6)=(1,-1,9t)\\)이고 \\(1=9t-9/4\\)에서 \\(a_5=3t=13/12>1\\)이 되어 가정과 모순이에요.","check":{"prompt":"공비가 3인데 \\(a_4\\ge1>a_5\\) 같은 경우를 따로 볼 필요가 없는 이유는 무엇인가요?","answer":"항들이 \\(t,3t,9t\\)로 계속 커지므로 앞 항이 1 이상이면 뒤 항도 모두 1 이상이에요."}},{"id":"c3","label":"남은 경우 계산하고 검산하기","stepIds":["s7","s8"],"question":"\\(a_4<1\\le a_5\\)인 경우 각 \\(b\\)값을 넣으면 \\(t\\)에 대한 어떤 식이 되나요?","hint":"\\(b_4=1\\), \\(b_5=3t\\), \\(b_6=9t\\)를 조건 (나)에 넣으세요.","explanation":"남은 경우에는 \\(b_4=1\\), \\(b_5=3t\\), \\(b_6=9t\\)예요. 조건 (나)는 \\(9t^2=9t-9/4\\), 즉 \\((t-1/2)^2=0\\)이므로 \\(t=1/2\\)예요. 실제로 \\(a_4=1/2<1\\), \\(a_5=3/2\\ge1\\)이라 조각 선택도 맞아요. \\(a_3=a_4/3=1/6\\)이므로 \\(90a_3=15\\)예요.","check":{"prompt":"\\(t=1/2\\)를 얻은 뒤 반드시 확인해야 하는 두 부등식은 무엇인가요?","answer":"\\(a_4=t<1\\)과 \\(a_5=3t\\ge1\\)이에요."}}],"takeaway":["급수 수렴은 먼저 묶음 일반항이 0으로 가야 한다는 조건을 줘요.","증가하는 수열이 조각의 기준을 넘는 위치는 순서에 맞는 경우만 나누면 돼요.","방정식의 해를 얻은 뒤 사용한 조각 부등식에 다시 대입해 확인해요."]};</script>
