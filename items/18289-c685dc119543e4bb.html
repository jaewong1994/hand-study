  <script>window.HandStudyRecord={"itemId":18289,"sourceLabel":"2025 교육청 고3 수학확통 5월 30번","adminYear":2025,"grade":3,"month":5,"number":30,"track":"확통","points":4,"scoreStatus":"confirmed_4_direct","questionText":"$1\\,$부터 $6\\,$까지의 자연수가 하나씩 적혀 있는 $6\\,$개의 전구가 있다. 이 $6\\,$개의 전구는 모두 꺼져 있고, 각 전구는 전원 버튼을 누를 때마다 켜짐과 꺼짐이 전환된다. 이 $6\\,$개의 전구와 한 개의 주사위를 사용하여 다음 시행을 한다.\n주사위를 한 번 던져 나온 눈의 수가 $n\\,$일 때, $n$ 이하의 숫자가 적힌 모든 전구의 전원 버튼을 한 번씩 누른다.\n이 시행을 $5\\,$번 반복할 때, 나오는 눈의 수를 차례로 $a$, $b$, $c$, $d$, $e\\,$라 하자. $5\\,$번째 시행 후 전구가 모두 켜져 있도록 하는 모든 순서쌍 $\\left(a,\\,b,\\,c,\\,d,\\,e \\right)\\,$의 개수를 구하시오. [4점]","answer":"376","sourceHash":"f7f68681d6e033b0120b81b0f75539f7f4a2af1aae15bcdc8dead342ef805278","steps":[{"id":"s1","latex":"m_j=\\#\\{\\text{눈 }j\\},\\quad\\#\\{\\text{전구 }k\\text{ 누름}\\}=\\sum_{j=k}^6m_j\\equiv1\\pmod2"},{"id":"s2","latex":"m_1,\\ldots,m_5\\equiv0\\pmod2,\\quad m_6\\equiv1\\pmod2,\\quad\\sum m_j=5"},{"id":"s3","latex":"m_6=5:\\ 1"},{"id":"s4","latex":"m_6=3:\\ 5\\cdot\\frac{5!}{3!2!}=50"},{"id":"s5","latex":"m_6=1:\\ 5\\cdot\\frac{5!}{4!}+{5\\choose2}\\frac{5!}{2!2!}=325"},{"id":"s6","latex":"1+50+325=376"}],"diagram":null,"contentHash":"2f568f24d497b54b3a72026f0c0bc75d14ab68d6de23c12bbde95a7f453cdb78","questionHtml":"\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>부터 \u003cspan class=\"heq\">\\(6\\,\\)\u003c/span>까지의 자연수가 하나씩 적혀 있는 \u003cspan class=\"heq\">\\(6\\,\\)\u003c/span>개의 전구가 있다. 이 \u003cspan class=\"heq\">\\(6\\,\\)\u003c/span>개의 전구는 모두 꺼져 있고, 각 전구는 전원 버튼을 누를 때마다 켜짐과 꺼짐이 전환된다. 이 \u003cspan class=\"heq\">\\(6\\,\\)\u003c/span>개의 전구와 한 개의 주사위를 사용하여 다음 시행을 한다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">주사위를 한 번 던져 나온 눈의 수가 \u003cspan class=\"heq\">\\(n\\,\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(n\\)\u003c/span> 이하의 숫자가 적힌 모든 전구의 전원 버튼을 한 번씩 누른다.\u003c/p>\u003c/div>\u003cp class=\"hp\">이 시행을 \u003cspan class=\"heq\">\\(5\\,\\)\u003c/span>번 반복할 때, 나오는 눈의 수를 차례로 \u003cspan class=\"heq\">\\(a\\)\u003c/span>, \u003csp
