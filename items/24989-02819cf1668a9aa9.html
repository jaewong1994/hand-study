<script>window.HandStudyRecord={"adminYear":2025,"answer":"②","contentHash":"7570a070d1ece238b8dcf5217899017650aff6d12d1224b170b6ba6441603c13","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24989,"month":11,"number":28,"points":4,"preview":false,"questionHtml":"\u003cp>\u003cspan class=\"heq\">\\(16\\,\\)\u003c/span>개의 공과 \u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>부터 \u003cspan class=\"heq\">\\(6\\,\\)\u003c/span>까지의 자연수가 하나씩 적혀 있는 여섯 개의 빈 상자가 있다. 한 개의 주사위를 사용하여 다음 시행을 한다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp>주사위를 한 번 던져 나온 눈의 수가 \u003cspan class=\"heq\">\\(k\\,\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(k\\,\\)\u003c/span>가 홀수이면 \u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(3\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(5\\,\\)\u003c/span>가 적힌 상자에 공을 각각 \u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>개씩 넣고, \u003cspan class=\"heq\">\\(k\\,\\)\u003c/span>가 짝수이면 \u003cspan class=\"heq\">\\(k\\,\\)\u003c/span>의 약수가 적힌 상자에 공을 각각 \u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>개씩 넣는다.\u003c/p>\u003c/div>\u003cp>이 시행을 \u003cspan class=\"heq\">\\(4\\,\\)\u003c/span>번 반복한 후 여섯 개의 상자에 들어 있는 모든 공의 개수의 합이 홀수일 때, \u003cspan class=\"heq\">\\(3\\,\\)\u003c/span>이 적힌 상자에 들어 있는 공의 개수가 \u003cspan class=\"heq\">\\(2\\,\\)\u003c/span>가 적힌 상자에 들어 있는 공의 개수보다 \u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>개 더 많을 확률은?\u003c/p>\u003cp>[4점]\u003c/p>\u003cdiv class=\"hchoices\">\u003cdiv class=\"hch\">① \u003cspan class=\"heq\">\\(\\frac{1}{8}\\,\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">② \u003cspan class=\"heq\">\\(\\frac{3}{16}\\,\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">③ \u003cspan class=\"heq\">\\(\\frac{1}{4}\\,\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">④ \u003cspan class=\"heq\">\\(\\frac{5}{16}\\,\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">⑤ \u003cspan class=\"heq\">\\(\\frac{3}{8}\\)\u003c/span>\u003c/div>\u003c/div>","questionText":"$16\\,$개의 공과 $1\\,$부터 $6\\,$까지의 자연수가 하나씩 적혀 있는 여섯 개의 빈 상자가 있다. 한 개의 주사위를 사용하여 다음 시행을 한다.\n주사위를 한 번 던져 나온 눈의 수가 $k\\,$일 때, $k\\,$가 홀수이면 $1\\,$, $3\\,$, $5\\,$가 적힌 상자에 공을 각각 $1\\,$개씩 넣고, $k\\,$가 짝수이면 $k\\,$의 약수가 적힌 상자에 공을 각각 $1\\,$개씩 넣는다.\n이 시행을 $4\\,$번 반복한 후 여섯 개의 상자에 들어 있는 모든 공의 개수의 합이 홀수일 때, $3\\,$이 적힌 상자에 들어 있는 공의 개수가 $2\\,$가 적힌 상자에 들어 있는 공의 개수보다 $1\\,$개 더 많을 확률은?\n[4점]\n① $\\frac{1}{8}\\,$ ② $\\frac{3}{16}\\,$ ③ $\\frac{1}{4}\\,$ ④ $\\frac{5}{16}\\,$ ⑤ $\\frac{3}{8}$","sourceHash":"d18cb880a97a00dd2ba3272ca8b643683e9ea668834acd4eb03829dad68d8302","sourceKind":"csat","sourceLabel":"2025년 시행 수능 · 2026학년도 · 확률과 통계 · 28번","steps":[{"id":"s1","latex":"\\text{한 시행에서 공의 총수가 홀수인 눈은 }1,3,4,5\\text{이고, 짝수인 눈은 }2,6\\text{이다.}"},{"id":"s2","latex":"P(A)=\\frac23,\\quad P(B)=\\frac13"},{"id":"s3","latex":"E=\\{\\text{네 시행 뒤 총수가 홀수}\\}\\text{는 }A\\text{가 }3\\text{회 또는 }1\\text{회인 사건이다.}"},{"id":"s4","latex":"P(E)={}_4C_3\\left(\\frac23\\right)^3\\frac13+{}_4C_1\\frac23\\left(\\frac13\\right)^3=\\frac{40}{81}"},{"id":"s5","latex":"C=\\{3\\text{번 상자의 공 수가 }2\\text{번보다 }1\\text{ 많음}\\}\\text{라 하자.}"},{"explanation":{"body":"6은 2번과 3번 상자에 동시에 하나씩 넣어 둘의 차를 바꾸지 않습니다. 홀수 눈의 횟수를 \\(o\\), 2 또는 4의 횟수를 \\(d\\), 6의 횟수를 \\(z\\)라 두면 차이 조건은 \\(o-d=1\\), 네 번 시행했으므로 \\(o+d+z=4\\)입니다. 두 식에서 \\(2d+z=3\\)이므로 \\(z\\)는 홀수, 즉 1번 또는 3번입니다.","skillTags":["조건부확률","경우분기"],"title":"6의 횟수로 경우를 나누기"},"id":"s6","latex":"o=\\#\\{1,3,5\\},\\ d=\\#\\{2,4\\},\\ z=\\#\\{6\\}\\text{라 하면 }C\\text{에서 }o-d=1,\\quad o+d+z=4\\Rightarrow2d+z=3"},{"id":"s7","latex":"6\\text{이 }3\\text{회이면 나머지는 홀수: }\\frac{12}{6^{4}}"},{"id":"s8","latex":"6\\text{이 }1\\text{회이면 }4\\text{가 }1\\text{회, 홀수가 }2\\text{회: }\\frac{108}{6^{4}}"},{"id":"s9","latex":"P(E\\cap C)=\\frac{120}{6^{4}},\\qquad P(C\\mid E)=\\frac{120/6^{4}}{40/81}=\\frac3{16}"},{"id":"s10","latex":"\\therefore\\ \\boxed{\\frac3{16}}\\;(②)"}],"track":"확률과 통계"};</script>
