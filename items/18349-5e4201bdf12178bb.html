<script>window.HandStudyRecord={"itemId":18349,"sourceLabel":"2025 평가원 고3 수학기하 9월 21번","adminYear":2025,"grade":3,"month":9,"number":21,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"최고차항의 계수가 $1\\,$인 삼차함수 $f \\left(x \\right)\\,$가 다음 조건을 만족시킬 때, $f' \\left(10 \\right)\\,$의 값을 구하시오. [4점]\n$0\\,$이 아닌 모든 실수 $x\\,$에 대하여 $\\frac{f' \\left(x \\right)}{2}+x^{2}-2 \\leq\\frac{f \\left(2x \\right)-f \\left(0 \\right)}{2x} \\leq x^{4}\\,$ 이다.","answer":"296","sourceHash":"3473cb0afb344fa5ba035cdd41319b2afaa519ec880a52ded273ae4aab5a542c","steps":[{"id":"s1","latex":"f(x)=x^3+px^2+qx+s,\\quad\\frac{f(2x)-f(0)}{2x}=4x^2+2px+q"},{"id":"s2","latex":"\\frac32x^2+px+\\frac q2+2\\ge0,\\qquad x^4-4x^2-2px-q\\ge0\\quad(x\\ne0)"},{"id":"s3","latex":"p^2-3q-12\\le0\\Rightarrow q\\ge\\frac{p^2-12}{3}"},{"id":"s4","latex":"x=\\pm\\sqrt2\\Rightarrow q\\le-4-2\\sqrt2|p|"},{"id":"s5","latex":"\\frac{p^2-12}{3}\\le-4-2\\sqrt2|p|\\Rightarrow p=0,\\ q=-4"},{"id":"s6","latex":"x^4-4x^2+4=(x^2-2)^2\\ge0"},{"id":"s7","latex":"f\\prime(10)=3\\cdot10^2-4=296"}],"diagram":null,"contentHash":"6da67f843dc364eec320a91645d1b08b91f636b4ee28d2abe246ff16c4243bb7","questionHtml":"\u003cp class=\"hp\">최고차항의 계수가 \u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>인 삼차함수 \u003cspan class=\"heq\">\\(f \\left(x \\right)\\,\\)\u003c/span>가 다음 조건을 만족시킬 때, \u003cspan class=\"heq\">\\(f' \\left(10 \\right)\\,\\)\u003c/span>의 값을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(0\\,\\)\u003c/span>이 아닌 모든 실수 \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>에 대하여\u003c/p>\u003cp class=\"hp htall\">\u003cspan class=\"heq\">\\(\\dfrac{f' \\left(x \\right)}{2}+x^{2}-2 \\leq\\dfrac{f \\left(2x \\right)-f \\left(0 \\right)}{2x} \\leq x^{4}\\,\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">이다.\u003c/p>\u003c/div>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"5e4201bdf12178bb8421586ef23e274a526d6b182f00411ee18 <script>window.HandStudyGuide={"itemId":18349,"sourceHash":"3473cb0afb344fa5ba035cdd41319b2afaa519ec880a52ded273ae4aab5a542c","contentHash":"6da67f843dc364eec320a91645d1b08b91f636b4ee28d2abe246ff16c4243bb7","overview":{"goal":"두 부등식을 계수에 관한 조건으로 바꾸고, 같은 계수의 위아래 경계를 맞물려 삼차함수의 도함수를 정해요.","firstLook":"삼차함수를 일반형으로 놓으면 가운데 몫은 이차식이 돼요. 왼쪽 부등식에서는 항상 0 이상인 이차식, 오른쪽 부등식에서는 특정 두 값에서의 부호를 확인해요.","conditions":[{"label":"왼쪽 부등식","meaning":"모든 0이 아닌 실수에서 한 이차식이 0 이상이어야 해요."},{"label":"오른쪽 부등식","meaning":"사차식이 모든 0이 아닌 실수에서 0 이상이어야 해요."}]},"chapters":[{"id":"c1","label":"일반형을 넣어 두 부등식을 분리해요","stepIds":["s1","s2"],"question":"가운데 몫에서 상수항 \\(s\\)가 사라지는 이유는 무엇일까요?","hint":"\\(f(2x)-f(0)\\)를 직접 전개해요.","explanation":"\\(f(x)=x^3+px^2+qx+s\\)로 두면 \\(f(2x)-f(0)=8x^3+4px^2+2qx\\)예요. \\(2x\\)로 나누어 \\(4x^2+2px+q\\)를 얻어요. 왼쪽 식과의 차, 오른쪽 식과의 차가 각각 0 이상이어야 하므로\n\n\\(\\dfrac32x^2+px+\\dfrac q2+2\\ge0\\),\n\n\\(x^4-4x^2-2px-q\\ge0\\)\n\n가 모든 \\(x\ne0\\)에서 성립해야 해요. 두 다항식은 연속이므로 빠진 \\(x=0\\)에서도 극한으로 같은 부등식이 성립해요.","check":{"prompt":"첫 부등식의 \\(x^2\\)계수가 왜 \\(3/2\\)인가요?","answer":"가운데 식의 \\(4x^2\\)에서 \\(f'(x)/2\\)의 \\(3x^2/2\\)와 추가된 \\(x^2\\)를 빼면 \\(4-3/2-1=3/2\\)예요."}},{"id":"c2","label":"한 계수의 아래 경계와 위 경계를 맞춰요","stepIds":["s3","s4","s5"],"question":"오른쪽 사차식을 전부 분석하지 않고 왜 \\(x=\\pm\\sqrt2\\)를 넣을까요?","hint":"\\(x^4-4x^2\\)가 두 점에서 같은 가장 작은 값 \\(-4\\)를 가져요.","explanation":"첫 이차식이 모든 실수에서 0 이상이려면 판별식이 0 이하이므로 \\(p^2-3q-12\\le0\\), 즉 \\(q\\ge(p^2-12)/3\\)이에요. 둘째 식에 \\(x=\\sqrt2\\)와 \\(x=-\\sqrt2\\)를 넣으면 각각 \\(q\\le-4-2\\sqrt2p\\), \\(q\\le-4+2\\sqrt2p\\)예요. 둘을 동시에 만족하려면 \\(q\\le-4-2\\sqrt2|p|\\)예요.\n\n따라서 \\((p^2-12)/3\\le-4-2\\sqrt2|p|\\)이고, 정리하면 \\(p^2+6\\sqrt2|p|\\le0\\)이에요. 두 항이 모두 0 이상이므로 \\(p=0\\)뿐이고, 두 경계에서 \\(q\\ge-4\\), \\(q\\le-4\\)가 되어 \\(q=-4\\)예요.","check":{"prompt":"\\(p^2+6\\sqrt2|p|\\le0\\)에서 왜 다른 \\(p\\)가 없나요?","answer":"두 항이 모두 0 이상이고 합이 0 이하이려면 둘 다 0이어야 하므로 \\(p=0\\)이에요."}},{"id":"c3","label":"구한 계수가 실제로 조건을 만족하는지 확인해요","stepIds":["s6","s7"],"question":"\\(p=0,q=-4\\)가 필요조건일 뿐 아니라 실제 해라는 것은 어떻게 확인할까요?","hint":"처음의 두 차식에 다시 넣어 각각 제곱이나 양수 꼴로 만들어요.","explanation":"첫 차식은 \\(3x^2/2\\ge0\\)이 되고, 둘째 차식은 \\(x^4-4x^2+4=(x^2-2)^2\\ge0\\)이 돼요. 따라서 모든 \\(x\ne0\\)에서 원래 두 부등식이 실제로 성립해요. 이제 \\(f'(x)=3x^2-4\\)이므로 \\(f'(10)=300-4=296\\)이에요.","check":{"prompt":"상수항 \\(s\\)를 몰라도 답을 구할 수 있는 이유는 무엇인가요?","answer":"조건의 차와 \\(f'(10)\\)에서 \\(s\\)가 모두 사라지고, 도함수는 \\(p,q\\)만으로 정해지기 때문이에요."}}],"takeaway":["모든 실수에서 성립하는 부등식은 다항식의 판별식이나 특별한 대입값으로 계수의 범위를 만들 수 있어요.","아래 경계와 위 경계가 맞물리면 각 항의 비음성으로 등호 조건을 정해요.","구한 계수는 원래 부등식에 다시 넣어 실제 성립 여부를 확인해요."]};</script>
