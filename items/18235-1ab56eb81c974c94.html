 class=\"hbox\">\u003cp class=\"hp\">실수 전체의 집합에서 정의된 함수\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\(g \\left(x \\right)= \\begin{cases}\\,f \\left(x \\right)+2 & & \\left(x \\lt  0\\,\\text{또는}\\,x \\gt  2 \\right) \\\\ \\, -2 \\cos\\, \\left(\\dfrac{ \\pi }{4}f \\left(x \\right) \\right) & & \\left(0 \\leq x \\leq 2 \\right)\\end{cases}\\,\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">는 역함수 \u003cspan class=\"heq\">\\(h \\left(x \\right)\\,\\)\u003c/span>를 갖는다.\u003c/p>\u003c/div>","questionText":"함수 $f \\left(x \\right)=ax^{3}-2ax^{2}+bx-b-2\\,$가 다음 조건을 만족시키도록 하는 두 정수 $a\\, \\left(a \\neq 0 \\right)\\,$, $b\\,$에 대하여 $h' \\left(- \\sqrt{2} \\right)\\,$의 최댓값이 $\\frac{k}{ \\pi }\\,$일 때, $k^{2}\\,$의 값을 구하시오. [4점]\n실수 전체의 집합에서 정의된 함수 $g \\left(x \\right)= \\begin{cases}\\,f \\left(x \\right)+2 & & \\left(x \u003c 0\\,또는\\,x > 2 \\right) \\\\ \\, -2 \\cos\\, \\left(\\frac{ \\pi }{4}f \\left(x \\right) \\right) & & \\left(0 \\leq x \\leq 2 \\right)\\end{cases}\\,$ 는 역함수 $h \\left(x \\right)\\,$를 갖는다.","scoreStatus":"confirmed_4_direct","sourceHash":"a0f70af4d79d568a8c3bfd122e39c130ab9f1950f9e6b6455797a29ab2612f6f","sourceLabel":"2025 교육청 고3 수학미적분 10월 30번","stepExplanations":{"s2":{"body":"\\(f(x)=F(x)-2\\)이므로 \\(-2\\cos\\{\\pi(F-2)/4\\}=-2\\sin(\\pi F/4)\\)입니다. 이렇게 쓰면 바깥 조각 \\(F(x)\\)와 가운데 조각의 경계값을 같은 문자로 비교할 수 있습니다.","skillTags":["phase-shift","piecewise-rewrite"],"title":"가운데 조각을 F로 바꾸는 계산"},"s3":{"body":"역함수가 있으므로 \\(g\\)의 값은 겹치지 않고, 가운데 \\(0\\le x\\le2\\)에서는 \\(F\\)도 한 방향으로 움직여야 합니다. \\(F(0)=-b,F(2)=b\\)이므로 \\(b\\ne0\\)이고, \\(a,b\\)의 부호가 다르면 양쪽 바깥 조각의 값의 범위가 겹치므로 두 수의 부호는 같습니다. 가운데에서 \\(F\\)가 \\(-b\\)부터 \\(b\\)까지 지나갈 때 \\(-2\\sin(\\pi F/4)\\)의 값이 겹치지 않으려면 \\(|b|\\le2\\)입니다. 정수 \\(b=\\pm1,\\pm2\\)와 \\(F'(2/3)=b-4a/3\\)의 단조 방향을 대조하면 \\(|b|\\ge4|a|/3\\)이고, \\((a,b)=(-1,-2),(1,2)\\)만 남습니다. 두 후보는 실제로 세 조각의 값의 범위가 서로 겹치지 않습니다.","skillTags":["inverse-function","piecewise-range"],"title":"두 경계에서 값의 범위를 겹치지 않게 나누기"},"s6":{"body":"두 후보 모두 \\(g(x)=-\\sqrt2\\)인 가운데 조각의 점에서는 \\(F(x)=1\\)입니다. \\(g'(x)=-(\\pi/2)\\cos(\\pi F(x)/4)F'(x)\\)이므로 \\(a=1,b=2\\)에서는 \\(F'(x)>0\\)라 \\(h'(-\\sqrt2)\u003c0\\), \\(a=-1,b=-2\\)에서는 \\(F'(x)\u003c0\\)라 \\(h'(-\\sqrt2)>0\\)입니다. 최댓값은 두 번째 후보에서 나오고, 이때 \\(F(1)=1,F'(1)=-1\\)입니다.","skillTags":["inverse-derivative","candidate-comparison"],"title":"두 후보의 역함수 미분값 부호 비교"}},"steps":[{"id":"s1","latex":"F(x)=f(x)+2=ax^3-2ax^2+bx-b"},{"id":"s2","latex":"0\\le x\\le2:\\quad g(x)=-2\\sin\\frac{\\pi F(x)}4"},{"id":"s3","latex":"g\\text{가 역함수를 가지는 조건}\\Rightarrow(a,b)=(-1,-2)\\text{ 또는 }(1,2)"},{"id":"s4","latex":"(a,b)=(1,2)\\Rightarrow h'(-\\sqrt2)\u003c0,\\quad(a,b)=(-1,-2)\\Rightarrow h'(-\\sqrt2)>0"},{"id":"s5","latex":"F(1)=1\\Rightarrow h(-\\sqrt2)=1"},{"id":"s6","latex":"g'(1)=-\\frac\\pi2\\cos\\frac\\pi4\\,F'(1)=\\frac{\\pi\\sqrt2}{4}"},{"id":"s7","latex":"h'(-\\sqrt2)=\\frac1{g'(1)}=\\frac{2\\sqrt2}{\\pi}=\\frac{k}{\\pi}\\Rightarrow k^2=8"}],"track":"미적분"};</script>
<script>window.HandStudyGuide={"itemId":18235,"sourceHash":"a0f70af4d79d568a8c3bfd122e39c130ab9f1950f9e6b6455797a29ab2612f6f","contentHash":"29ffdeed1641961e2c247b943bfd85f8ee683548d799889b2a64c8c1908876cd","overview":{"goal":"조각함수 \\(g\\)가 역함수를 가진다는 조건으로 \\((a,b)\\) 후보를 좁히고, 역함수 \\(h\\)의 도함숫값이 더 큰 후보를 골라요.","firstLook":"바깥 구간의 식 \\(f(x)+2\\)를 \\(F(x)\\)로 놓으면 가운데 삼각함수도 \\(F\\)로 간단히 쓸 수 있어요. 역함수가 존재하려면 전체 그래프에서 같은 함숫값이 두 번 나오지 않아야 합니다.","conditions":[{"label":"조각 정의","meaning":"\\(x<0\\) 또는 \\(x>2\\)에서는 \\(g=F\\), \\(0\\le x\\le2\\)에서는 삼각함수 식이에요."},{"label":"역함수 존재","meaning":"서로 다른 두 \\(x\\)가 같은 \\(g(x)\\)를 가져서는 안 됩니다."},{"label":"비교 대상","meaning":"가능한 계수들 중 \\(h^{\\prime}(-\\sqrt2)\\)가 더 큰 경우를 선택해요."}]},"chapters":[{"id":"c1","label":"가운데 식을 같은 문자로 정리하기","stepIds":["s1","s2"],"question":"왜 \\(F(x)=f(x)+2\\)를 새로 두면 유리할까요?","hint":"\\(f=F-2\\)를 가운데의 코사인 식에 넣고 각을 정리해 보세요.","explanation":"\\(F(x)=ax^3-2ax^2+bx-b\\)로 두면 바깥 조각은 그대로 \\(F\\)예요. 가운데에서는 \\(-2\\cos\\{\\pi(F-2)/4\\}=-2\\sin(\\pi F/4)\\)가 됩니다. 이제 경계값과 단조성을 모두 \\(F\\) 하나로 비교할 수 있어요.","check":{"prompt":"\\(F(0)\\)과 \\(F(2)\\)는 각각 무엇인가요?","answer":"\\(F(0)=-b\\), \\(F(2)=b\\)입니다."}},{"id":"c2","label":"역함수 조건으로 계수 후보 좁히기","stepIds":["s3"],"question":"같은 함숫값이 겹치지 않게 하려면 \\(a,b\\)에 어떤 제한이 생길까요?","hint":"가운데에서 \\(F\\)가 \\(-b\\)부터 \\(b\\)까지 지나고, 바깥 두 조각의 값범위도 겹치지 않아야 해요.","explanation":"먼저 \\(a>0\\)을 보면, 바깥의 왼쪽 조각과 오른쪽 조각의 값범위가 겹치지 않으려면 \\(b\\ge0\\)이어야 하고 \\(b=0\\)이면 경계에서 같은 값이 생기므로 \\(b>0\\)이에요. 가운데에서 \\(F\\)는 \\(-b\\)에서 \\(b\\)까지 증가해야 하므로 \\(0\\le x\\le2\\)에서 \\(F^{\\prime}(x)\\ge0\\)이어야 합니다. \\(F^{\\prime}\\)의 가장 작은 값이 \\(x=2/3\\)에서 \\(b-4a/3\\)이므로 \\(b\\ge4a/3\\)이에요. 또 \\(-2\\sin(\\pi F/4)\\)가 값을 반복하지 않으려면 \\(b\\le2\\)여야 합니다. 정수 조건에서 \\((a,b)=(1,2)\\)만 남아요. \\(a<0\\)에서는 부호를 반대로 적용해 \\((-1,-2)\\)를 얻습니다. 두 후보 모두 바깥 조각의 값범위는 \\(( -\\infty,-2)\\)와 \\((2,\\infty)\\), 가운데 조각의 값범위는 \\([-2,2]\\)라 서로 겹치지 않고, 각 조각 안에서도 같은 값을 반복하지 않아요.","check":{"prompt":"\\(a>0\\)에서 가운데 \\(F\\)가 증가해야 한다는 조건은 어떤 부등식으로 바뀌나요?","answer":"\\(F^{\\prime}\\)의 가장 작은 값 \\(b-4a/3\\)이 0 이상이어야 하므로 \\(b\\ge4a/3\\)입니다."}},{"id":"c3","label":"역함수 도함수의 부호로 후보 고르기","stepIds":["s4"],"question":"두 후보 중 어느 쪽이 더 큰 \\(h^{\\prime}(-\\sqrt2)\\)를 만들까요?","hint":"역함수의 도함수는 대응하는 점에서 \\(1/g^{\\prime}\\)이고, 먼저 \\(g^{\\prime}\\)의 부호를 보세요.","explanation":"두 후보 모두 \\(g(x)=-\\sqrt2\\)에 대응하는 가운데 점을 가지지만 진행 방향이 반대예요. \\((1,2)\\)에서는 \\(g\\)가 그 점에서 감소해 \\(h^{\\prime}(-\\sqrt2)<0\\)이고, \\((-1,-2)\\)에서는 증가해 \\(h^{\\prime}(-\\sqrt2)>0\\)입니다. 따라서 더 큰 값은 \\((-1,-2)\\)에서 나와요.","check":{"prompt":"정확한 크기를 계산하기 전에 부호만으로 제외되는 후보는 무엇인가요?","answer":"\\(h^{\\prime}(-\\sqrt2)<0\\)인 \\((a,b)=(1,2)\\)입니다."}},{"id":"c4","label":"대응점과 기울기 계산하기","stepIds":["s5","s6","s7"],"question":"\\(-\\sqrt2\\)에 대응하는 \\(x\\)와 그곳의 \\(g^{\\prime}\\)를 어떻게 찾을까요?","hint":"선택한 후보에서 \\(F(1)\\)과 \\(F^{\\prime}(1)\\)을 계산하세요.","explanation":"\\((-1,-2)\\)에서 \\(F(1)=1\\)이므로 \\(g(1)=-2\\sin(\\pi/4)=-\\sqrt2\\), 따라서 \\(h(-\\sqrt2)=1\\)이에요. \\(g^{\\prime}(x)=-(\\pi/2)\\cos(\\pi F/4)F^{\\prime}(x)\\)이고 \\(F^{\\prime}(1)=-1\\)이므로 \\(g^{\\prime}(1)=\\pi\\sqrt2/4\\)입니다. 역함수 미분법으로 \\(h^{\\prime}(-\\sqrt2)=1/g^{\\prime}(1)=2\\sqrt2/\\pi\\)예요.","check":{"prompt":"\\(h^{\\prime}(-\\sqrt2)=k/\\pi\\)일 때 \\(k^2\\)은 얼마인가요?","answer":"\\(k=2\\sqrt2\\)이므로 \\(k^2=8\\)입니다."}}],"takeaway":["역함수 존재 조건은 각 조각의 단조성뿐 아니라 서로 다른 조각의 값범위가 겹치는지도 확인해야 해요.","후보의 대소를 묻는 문제에서는 정확한 계산 전에 부호 비교만으로 후보를 줄일 수 있어요.","역함수 도함수는 먼저 원함수에서 대응점을 찾은 뒤 그 점의 기울기를 뒤집어 계산해요."]};</script>
