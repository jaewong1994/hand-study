<script>window.HandStudyRecord={"itemId":7732,"sourceLabel":"2019 교육청 고2 수학가형 11월 15번","adminYear":2019,"grade":2,"month":11,"number":15,"track":"수학가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 자연수 $n$에 대하여 함수 $y=a ^{x} -1$$\\left( a>1 \\right)$의 그래프가 두 직선 $y=n$, $y=n+1$과 만나는 점을 각각 $A _{n}$, $A _{n+1}$이라 하자. 선분 $A _{n} A _{n+1}$을 대각선으로 하고, 각 변이 $x$축 또는 $y$축과 평행한 직사각형의 넓이를 $S _{n}$이라 하자. $\\sum _{n=1} ^{14} S _{n} =6$일 때, 상수 $a$의 값은? [4점]\n$O$$x$$y$$y=n+1$$y=n$$y=a ^{x} -1$$A _{ n+1 }$$A _{n}$\n① $\\sqrt{2}$ ② $\\sqrt{3}$ ③ $2$ ④ $\\sqrt{5}$ ⑤ $\\sqrt{6}$","answer":"①","sourceHash":"bbe6176de0bd436f184a99cbe7ae0e12b81b3dd9b023fe03bb864465563effd1","steps":[{"id":"s1","latex":"A_n=\\left(\\log_a(n+1),n\\right),\\quad A_{n+1}=\\left(\\log_a(n+2),n+1\\right)"},{"id":"s2","latex":"S_n=1\\cdot\\left\\{\\log_a(n+2)-\\log_a(n+1)\\right\\}=\\log_a\\frac{n+2}{n+1}"},{"id":"s3","latex":"\\sum_{n=1}^{14}S_n=\\log_a\\left(\\frac32\\cdot\\frac43\\cdots\\frac{16}{15}\\right)=\\log_a8"},{"id":"s4","latex":"\\log_a8=6\\Rightarrow a^6=8,\\quad a>1\\Rightarrow a=\\sqrt2"}],"diagram":null,"contentHash":"785c8bac0a9619fdd6a88d99ed86495cef6801ed2052b45795b44ded9f79768e","questionHtml":"\u003cp class=\"hp htall\">그림과 같이 자연수 \u003cspan class=\"heq\">\\(n\\)\u003c/span>에 대하여 함수 \u003cspan class=\"heq\">\\(y=a^{x} -1\\)\u003c/span>\u003cspan class=\"heq\">\\(\\left( a\\gt 1 \\right)\\)\u003c/span>의 그래프가 두 직선 \u003cspan class=\"heq\">\\(y=n\\)\u003c/span>, \u003cspan class=\"heq\">\\(y=n+1\\)\u003c/span>과 만나는 점을 각각 \u003cspan class=\"heq\">\\(A_{n}\\)\u003c/span>, \u003cspan class=\"heq\">\\(A_{n+1}\\)\u003c/span>이라 하자. 선분 \u003cspan class=\"heq\">\\(A_{n} A_{n+1}\\)\u003c/span>을 대각선으로 하고, 각 변이 \u003cspan class=\"heq\">\\(x\\)\u003c/span>축 또는 \u003cspan class=\"heq\">\\(y\\)\u003c/span>축과 평행한 직사각형의 넓이를 \u003cspan class=\"heq\">\\(S_{n}\\)\u003c/span>이라 하자.\u003cbr>\u003cspan class=\"heq\">\\(\\sum\\limits_{n=1}^{14} S_{n} =6\\)\u003c/span>일 때, 상수 \u003cspan class=\"
