<script>window.HandStudyRecord={"itemId":11717,"sourceLabel":"2020 교육청 고1 수학 9월 28번","adminYear":2020,"grade":1,"month":9,"number":28,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 이차함수 ${f \\left( x \\right) = -x ^{2} +2kx+k ^{2} +4 }{{from^2020^09^인천교고1^중}}$ $\\left( k>0 \\right)$의 그래프가 $y$축과 만나는 점을 ${ A$라 하자. 점 ${ A$를 지나고 $x$축에 평행한 직선이 이차함수 $y=f \\left( x \\right)$의 그래프와 만나는 점 중 ${ A$가 아닌 점을 ${ B$라 하고, 점 ${ B$에서 $x$축에 내린 수선의 발을 ${ C$라 하자. 사각형 ${ OCBA$의 둘레의 길이를 $g \\left( k \\right)$라 할 때, 부등식 $14\\leq g \\left( k \\right) \\leq78$을 만족시키는 모든 자연수 $k$의 값의 합을 구하시오. (단, ${ O$는 원점이다.) [4점]","answer":"15","sourceHash":"9fc8c355554430273e66dd4455de5d4a785ee0955cd9ef449b53c1e9a9f730b0","steps":[{"id":"s1","latex":"A=(0,k^2+4)"},{"id":"s2","latex":"f(x)=f(0)\\Rightarrow-x^2+2kx=0\\Rightarrow x=0,2k"},{"id":"s3","latex":"B=(2k,k^2+4),\\quad C=(2k,0)"},{"id":"s4","latex":"g(k)=2\\{2k+(k^2+4)\\}=2k^2+4k+8"},{"id":"s5","latex":"14\\le g(k)\\le78\\iff3\\le k^2+2k\\le35"},{"id":"s6","latex":"k\\in\\mathbb N\\Rightarrow k\\in\\{1,2,3,4,5\\}"},{"id":"s7","latex":"1+2+3+4+5=15"}],"diagram":null,"contentHash":"d71c5b1d031feeaf3baec4c9baf53cf5df6e2a6c9a7064898961073230c393e3","questionHtml":"\u003cp class=\"hp\">그림과 같이 이차함수 \u003cspan class=\"heq\">\\({f \\left( x \\right) = -x^{2} +2kx+k^{2} +4 }\\)\u003c/span> \u003cspan class=\"heq\">\\(\\left( k\\gt 0 \\right)\\)\u003c/span>의 그래프가 \u003cspan class=\"heq\">\\(y\\)\u003c/span>축과 만나는 점을 \u003cspan class=\"heq\">\\({A }\\)\u003c/span>라 하자. 점 \u003cspan class=\"heq\">\\({A }\\)\u003c/span>를 지나고 \u003cspan class=\"heq\">\\(x\\)\u003c/span>축에 평행한 직선이 이차함수 \u003cspan class=\"heq\">\\(y=f \\left( x \\right)\\)\u003c/span>의 그래프와 만나는 점 중 \u003cspan class=\"heq\">\\({A }\\)\u003c/span>가 아닌 점을 \u003cspan class=\"heq\">\\({B }\\)\u003c/span>라 하고, 점 \u003cspan class=\"heq\">\\({B }\\)\u003c/span>에서 \u003cspan class=\"heq\">\\(x\\)\u003c/span>축에 내린 수선의 발을 \u003cspan class=\"heq\">\\({C }\\)\u003c/span>라 하자. 사각형
