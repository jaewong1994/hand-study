  <script>window.HandStudyRecord={"itemId":16968,"sourceLabel":"2021 교육청 고3 수학기하 10월 14번","adminYear":2021,"grade":3,"month":10,"number":14,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"모든 자연수 $n$에 대하여 직선 $l \\,: x-2y+ \\sqrt{5} =0$ 위의 점 ${ P}_{n}$과 $x$축 위의 점 ${ Q}_{n}$이 다음 조건을 만족시킨다.\n∙ 직선 ${ P}_{n}{ Q}_{n}$과 직선 $l$이 서로 수직이다.∙ $\\overline{{ P}_{n}{ Q}_{n}} \\,=\\overline{{ P}_{n}{ P}_{n \\,+1}}$이고 점 ${ P}_{n+1}$의 $x$좌표는 점 ${ P}_{n}$의 $x$좌표 보다 크다.\n다음은 점 ${ P}_{1}$이 원 $x^{2}+y^{2}=1$과 직선 $l$의 접점일 때, $2$ 이상의 모든 자연수 $n$에 대하여 삼각형 ${ OQ _{ n}P_{ n}}$의 넓이를 구하는 과정이다. (단, ${ O}$는 원점이다.)\n 자연수 $n$에 대하여 점 ${ Q}_{n}$을 지나고 직선 $l$ 과 평행한 직선이 선분 ${ P}_{n+1}{ Q}_{n+1}$과 만나는 점을 ${ R}_{n+1}$이라 하면 사각형 ${ P}_{n}{ Q}_{n}{ R}_{n+1}{ P}_{n+1}$은 정사각형이다.직선 $l$ 의 기울기가 $\\frac{1}{2}$이므로 ${\\overline{{ R}_{n\\,+1}{ Q}_n+1}}=\\,box{ ^{}\\,(가)\\,}\\,×{\\overline{{ P}_n{ P}_{n\\,+1}}}$ 이고 $\\overline{{ P}_{n\\,+1}{ Q}_n+1}=(1+\\,box{ ^{}\\,(가)\\,}\\, )×\\overline{{ P}_n{ Q}_n}$ 이다. 이때, $\\overline{{ P}_{1}{ Q}_{1}}\\,=1$이므로 $\\overline{{ P}_n{ Q}_n}\\,=\\,box{ ^{}\\,(나)\\,}\\,$ 이다.그러므로 $2$ 이상의 자연수 $n$ 에 대하여 $\\overline{{ P}_1{ P}_n}\\,=\\sum_{k=1}^{n-1} {\\,}\\overline{{ P}_k{ P}_{k\\,+1}}=\\,box{ ^{}\\,(다)\\,}\\,$ 이다. 따라서 $2$ 이상의 자연수 $n$에 대하여 삼각형 ${ OQ _{ n}P_{ n}}$의 넓이는 $\\frac{1}{2}×\\overline{{ P}_n{ Q}_n}×\\overline{{ P}_1{ P}_n}\\,=\\frac{1}{2}×\\,box{ ^{}\\,(나)\\,}\\,×( \\,box{ ^{}\\,(다)\\,}\\, )$ 이다.\n위의 (가)에 알맞은 수를 $p$, (나)와 (다)에 알맞은 식을 각각 $f(n)$, $g(n)$ 이라 할 때, $f(6p)+g(8p)$의 값은? [4점]\n① $3$ ② $4$ ③ $5$ ④ $6$ ⑤ $7$","answer":"⑤","sourceHash":"04ccf77219a718806c5edb2f624a61ae9a78e0a88d5ff37c39af56f068f39b78","steps":[{"id":"s1","latex":"\\tan\\angle R_{n+1}Q_nQ_{n+1}=\\frac12\\Rightarrow R_{n+1}Q_{n+1}=\\frac12P_nP_{n+1}"},{"id":"s2","latex":"p=\\frac12,\\quad P_{n+1}Q_{n+1}=\\frac32P_nQ_n"},{"id":"s3","latex":"f(n)=\\left(\\frac32\\right)^{n-1}"},{"id":"s4","latex":"g(n)=\\sum_{k=1}^{n-1}\\left(\\frac32\\right)^{k-1}=2\\left(\\frac32\\right)^{n-1}-2"},{"id":"s5","latex":"6p=3,\\quad8p=4,\\quad f(3)+g(4)=\\frac94+\\frac{19}4=7"}],"diagram":null,"contentHash":"37076f8fb336250955a59383a89ab69ce0d6ad6153c45cfdb5005b712edcbec5","questionHtml":"\u003cp class=\"hp\">모든 자연수 \u003cspan class=\"heq\">\\(n\\)\u003c/span>에 대하여 직선 \u003cspan class=\"heq\">\\(l \\,: x-2y+ \\sqrt{5} =0\\)\u003c/span> 위의 점 \u003cspan class=\"heq\">\\({P}_{n}\\)\u003c/span>과 \u003cspan class=\"heq\">\\(x\\)\u003c/span>축 위의 점 \u003cspan class=\"heq\">\\({Q}_{n}\\)\u003c/span>이 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">∙ 직선 \u003cspan class=\"heq\">\\({P}_{n}{Q}_{n}\\)\u003c/span>과 직선 \u003cspan class=\"heq\">\\(l\\)\u003c/span>이 서로 수직이다.\u003c/p>\u003cp class=\"hp htall\">∙ \u003cspan class=\"heq\">\\(\\overline{{P}_{n}{Q}_{n}} \\,=\\overline{{P}_{n}{P}_{n \\,+1}}\\)\u003c/span>이고 점 \u003cspan class=\"heq\">\\({P}_{n+1}\\)\u003c/span>의 \u003cspan class=\"heq\">\\(x\\)\u003c/span>좌표는 점 \u003cspan class=\"heq\">\\({P}_{n}\\)\u003c/span>의 \u003cspan class=\"heq\">\\(x\\)\u003c/span>좌표 보다 크다.\u003c/p>\u003c/div>\u003cp class=\"hp\">다음은 점 \u003cspan class=\"heq\">\\({P}_{1}\\)\u003c/span>이 원 \u003cspan class=\"heq\">\\(x^{2}+y^{2}=1\\)\u003c/span>과 직선 \u003cspan class=\"heq\">\\(l\\)\u003c/span>의 접점일 때, \u003cspan class=\"heq\">\\(2\\)\u003c/span> 이상의 모든 자연수 \u003cspan class=\"heq\">\\(n\\)\u003c/span>에 대하여 삼각형 \u003cspan class=\"heq\">\\({OQ_{ n}P_{ n}}\\)\u003c/span>의 넓이를 구하는 과정이다. (단, \u003cspan class=\"heq\">\\({O}\\)\u003c/span>는 원점이다.)\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/99472fcf99f4a90d1e53d076.png\" style=\"width:243px;max-width:100%\">\u003c/p>\u003cp class=\"hp\">자연수 \u003cspan class=\"heq\">\\(n\\)\u003c/span>에 대하여 점 \u003cspan class=\"heq\">\\({Q}_{n}\\)\u003c/span>을 지나고 직선 \u003cspan class=\"heq\">\\(l\\)\u003c/span> 과 평행한 직선이 선분 \u003cspan class=\"heq\">\\({P}_{n+1}{Q}_{n+1}\\)\u003c/span>과 만나는 점을 \u003cspan class=\"heq\">\\({R}_{n+1}\\)\u003c/span>이라 하면 \u003cbr>사각형 \u003cspan class=\"heq\">\\({P}_{n}{Q}_{n}{R}_{n+1}{P}_{n+1}\\)\u003c/span>은 정사각형이다.\u003c/p>\u003cp class=\"hp htall\">직선 \u003cspan class=\"heq\">\\(l\\)\u003c/span> 의 기울기가 \u003cspan class=\"heq\">\\(\\dfrac{1}{2}\\)\u003c/span>이므로\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\({\\overline{{R}_{n\\,+1}{Q}_{n+1}}}=\\,\\boxed{\\vphantom{(}^{}\\,(\\text{가})\\,}\\,\\times {\\overline{{P}_{n}{P}_{n\\,+1}}}\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">이고\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\(\\overline{{P}_{n\\,+1}{Q}_{n+1}}=(1+\\,\\boxed{\\vphantom{(}^{}\\,(\\text{가})\\,}\\, )\\times \\overline{{P}_{n}{Q}_{n}}\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">이다. 이때,\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\(\\overline{{P}_{1}{Q}_{1}}\\,=1\\)\u003c/span>이므로 \u003cspan class=\"heq\">\\(\\overline{{P}_{n}{Q}_{n}}\\,=\\,\\boxed{\\vphantom{(}^{}\\,(\\text{나})\\,}\\,\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">이다.\u003c/p>\u003cp class=\"hp\">그러므로 \u003cspan class=\"heq\">\\(2\\)\u003c/span> 이상의 자연수 \u003cspan class=\"heq\">\\(n\\)\u003c/span> 에 대하여\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\(\\overline{{P}_{1}{P}_{n}}\\,=\\sum\\limits_{k=1}^{n-1} {\\,}\\overline{{P}_{k}{P}_{k\\,+1}}=\\,\\boxed{\\vphantom{(}^{}\\,(\\text{다})\\,}\\,\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">이다. 따라서 \u003cspan class=\"heq\">\\(2\\)\u003c/span> 이상의 자연수 \u003cspan class=\"heq\">\\(n\\)\u003c/span>에 대하여 삼각형 \u003cspan class=\"heq\">\\({OQ_{ n}P_{ n}}\\)\u003c/span>의 넓이는\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\(\\dfrac{1}{2}\\times \\overline{{P}_{n}{Q}_{n}}\\times \\overline{{P}_{1}{P}_{n}}\\,=\\dfrac{1}{2}\\times \\,\\boxed{\\vphantom{(}^{}\\,(\\text{나})\\,}\\,\\times ( \\,\\boxed{\\vphantom{(}^{}\\,(\\text{다})\\,}\\, )\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">이다.\u003c/p>\u003c/div>\u003cp class=\"hp\">위의 (가)에 알맞은 수를 \u003cspan class=\"heq\">\\(p\\
