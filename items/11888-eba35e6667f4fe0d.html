  <script>window.HandStudyRecord={"itemId":11888,"sourceLabel":"2022 교육청 고1 수학 9월 19번","adminYear":2022,"grade":1,"month":9,"number":19,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"좌표평면 위에 네 점 $A \\left( \\,-1\\,,\\,4\\, \\right)\\,$, $B \\left( \\,-3\\,,\\,0\\, \\right)\\,$, $C \\left( \\,0\\,,\\,-2\\, \\right)$, $D \\left( \\,1\\,,\\,3\\, \\right) \\,$이 있다. 다음은 네 점 $A\\,$, $B\\,$, $C\\,$, $D\\,$가 각각 네 변 \n$PQ\\,$, $QR\\,$, $RS\\,$, $SP$ 위에 있도록 하는 정사각형 $PQRS\\,$의 한 변의 길이를 구하는 과정이다.\n[그림 1]\n점 $A\\,$를 지나고 두 점 $B\\,$와 $D\\,$를 지나는 직선에 수직인\n직선 $l_{1} \\,$의 방정식은 $y=\\, {\\boxed{\\vphantom{(}\\,(\\text{가})\\,}} \\,$이다.\n점 $A\\,$를 중심으로 하고 반지름의 길이가 ${\\overline{BD}} \\,$인 원을\n$C\\,$라 하자. 원 $C\\,$와 직선 $l_{1} \\,$이 만나는 두 점 중 점 $C\\,$와의 거리가 더 작은 점을 $E\\,$라 하고, 두 점 $C\\,$와 $E\\,$를 지나는\n직선을 $l_{2} \\,$라 하면 직선 $l_{2} \\,$의 방정식은 $y=\\, {\\boxed{\\vphantom{(}\\,(\\text{나})\\,}} \\,$이다.\n[그림 2]\n두 점 $B\\,$와 $D\\,$에서 직선 $l_{2} \\,$에 내린 수선의 발을 각각\n$R\\,$, $S\\,$라 하자. 점 $A\\,$를 지나고 직선 $l_{2} \\,$와 평행한 직선을\n$l_{3} \\,$이라 하고, 두 점 $B\\,$와 $D\\,$에서 직선 $l_{3} \\,$에 내린 수선의\n발을 각각 $Q\\,$, $P\\,$라 하자.\n사각형 $PQRS\\,$는 네 점 $A\\,$, $B\\,$, $C\\,$, $D\\,$가 각각 네 변\n$PQ\\,$, $QR\\,$, $RS\\,$, $SP$ 위에 있고 한 변의 길이가\n${\\overline{PQ}} \\,$$= {\\overline{QR}} \\,$$=\\, {\\boxed{\\vphantom{(}\\,(\\text{다})\\,}} \\,$인 정사각형이다.\n위의 (가), (나)에 알맞은 식을 각각 $f \\left( x \\right)\\,$, $g \\left( x \\right) \\,$라 하고, (다)에 알맞은 수를 $\\alpha \\,$라 할 때, $\\dfrac{3}{4} f \\left( \\alpha \\right)$$-g \\left( \\alpha \\right) \\,$의 값은? [4점]\n① $4-3 \\sqrt{2}$ ② $4-4 \\sqrt{2}$ ③ $4-5 \\sqrt{2}$\n④ $4-6 \\sqrt{2}$ ⑤ $4-7 \\sqrt{2}$","answer":"⑤","sourceHash":"57e434a80d9b72c738c94f3da86792179eff2d5cc01e0c8f7b7864622eb89603","steps":[{"id":"s1","latex":"\\operatorname{slope}(BD)=\\frac34\\Rightarrow l_1:\\ y=-\\frac43x+\\frac83"},{"id":"s2","latex":"BD=5,\\quad(x+1)^2+(y-4)^2=25"},{"id":"s3","latex":"l_1\\cap C=\\{(2,0),(-4,8)\\}"},{"id":"s4","latex":"d((2,0),C)=2\\sqrt2\u003c2\\sqrt{29}=d((-4,8),C)\\Rightarrow E=(2,0)"},{"id":"s5","latex":"l_2=CE:\\ y=x-2"},{"id":"s6","latex":"l_3:\\ y=x+5"},{"id":"s7","latex":"\\alpha=d(l_2,l_3)=\\frac7{\\sqrt2}=\\frac{7\\sqrt2}{2}"},{"id":"s8","latex":"f(x)=-\\frac43x+\\frac83,\\quad g(x)=x-2"},{"id":"s9","latex":"\\frac34f(\\alpha)-g(\\alpha)=(-\\alpha+2)-(\\alpha-2)=4-7\\sqrt2"}],"diagram":null,"contentHash":"6cd4d0a4a3bb915d29210b280678b57433423c0d419baebcaeb4edb0bc3d3388","questionHtml":"\u003cp class=\"hp\">좌표평면 위에 네 점 \u003cspan class=\"heq\">\\(A \\left( \\,-1\\,,\\,4\\, \\right)\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(B \\left( -3\\,,\\,0\\, \\right)\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(C \\left( 0\\,,\\,-2\\, \\right)\\)\u003c/span>, \u003cspan class=\"heq\">\\(D \\left( \\,1\\,,\\,3\\, \\right) \\,\\)\u003c/span>이 있다. 다음은 네 점 \u003cspan class=\"heq\">\\(A\\)\u003c/span>, \u003cspan class=\"heq\">\\(B\\)\u003c/span>, \u003cspan class=\"heq\">\\(C\\)\u003c/span>, \u003cspan class=\"heq\">\\(D\\)\u003c/span>가 각각 네 변 \u003cbr>\u003cspan class=\"heq\">\\(PQ\\)\u003c/span>, \u003cspan class=\"heq\">\\(QR\\)\u003c/span>, \u003cspan class=\"heq\">\\(RS\\)\u003c/span>, \u003cspan class=\"heq\">\\(SP\\)\u003c/span> 위에 있도록 하는 정사각형 \u003cspan class=\"heq\">\\(PQRS\\)\u003c/span>의 한 변의 길이를 구하는 과정이다.\u003c/p>\u003ctable class=\"htbl\">\u003ctr>\u003ctd colspan=\"3\" style=\"width:412px;border-top:1px solid #333;border-bottom:none;border-left:1px solid #333;border-right:1px solid #333\">&nbsp;\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"width:7px;border-top:none;border-bottom:none;border-left:1px solid #333;border-right:none\">&nbsp;\u003c/td>\u003ctd style=\"width:397px;border-top:none;border-bottom:none;border-left:none;border-right:none\">\u003cdiv class=\"hbox\">\u003cp class=\"hp\">\u003cspan class=\"hfigwrap\" style=\"position:relative;display:inline-block;width:219px;aspect-ratio:16430/15848;max-width:100%;vertical-align:middle\">\u003cspan class=\"hfiglayer\" style=\"position:absolute;overflow:hidde     </section>

    <div class="hs-controls" aria-label="손풀이 조작">
      <button class="hs-button" id="hs-reset" type="button">가리기</button>
      <button class="hs-button" id="hs-prev" type="button" aria-label="이전 풀이 줄">이전</button>
      <button class="hs-button hs-button-primary" id="hs-next" type="button">다음 줄</button>
      <button class="hs-button" id="hs-all" type="button">전체 보기</button>
      <button class="hs-button" id="hs-play" type="button" aria-pressed="false">무음 재생</button>
      <label class="hs-speed-wrap" for="hs-speed">속도
        <select class="hs-speed" id="hs-speed">
          <option value="4000">천천히</option>
          <option value="2200" selected>보통</option>
          <option value="1200">빠르게</option>
        </select>
      </label>
    </div>

    <article class="hs-paper" aria-label="순차 손풀이">
      <figure class="hs-diagram" id="hs-diagram" hidden></figure>
      <div class="hs-steps" id="hs-steps"></div>
      <p class="hs-prompt" id="hs-prompt">먼저 풀어 보세요.<br>다음 줄을 눌러 한 단계씩 확인합니다.</p>
      <div class="hs-answer" id="hs-answer" hidden></div>
    </article>
    <p class="hs-error" id="hs-error" role="alert"></p>
    <p class="hs-sr-only" id="hs-live" aria-live="polite"></p>

    <p class="hs-help"><kbd>→</kbd> 다음 · <kbd>←</kbd> 이전 · <kbd>H</kbd> 가리기 · <kbd>A</kbd> 전체 · <kbd>P</kbd> 재생</p>
  </main>
</body>
</html>
