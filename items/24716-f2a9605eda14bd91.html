<script>window.HandStudyRecord={"adminYear":2020,"answer":"②","contentHash":"3bc5ff76200053cb4d8a0f6364d3b66beca0638afaea489c2a823eaaa5b47897","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24716,"month":12,"number":15,"points":4,"preview":false,"questionHtml":"\u003cp>\u003cspan class=\"heq\">\\(x &gt; 0\\)\u003c/span>서 미분가능한 함수 \u003cspan class=\"heq\">\\(f(x)\\)\u003c/span>에 대하여\u003c/p>\u003cp> \u003cspan class=\"heq\">\\(f&#x27;(x) = 2 - \\frac{3}{x^2}\\)\u003c/span>, \u003cspan class=\"heq\">\\(f(1) = 5\\)\u003c/span>\u003c/p>\u003cp>이다. \u003cspan class=\"heq\">\\(x&lt;0\\)\u003c/span>에서 미분가능한 함수 \u003cspan class=\"heq\">\\(g(x)\\)\u003c/span>가 다음 조건을 만족시킬 때, \u003cspan class=\"heq\">\\(g(-3)\\)\u003c/span>의 값은? [4점]\u003c/p>\u003cdiv class=\"hbox hcond\">\u003cp class=\"hcondr\">(가) \u003cspan class=\"heq\">\\(x&lt;0\\)\u003c/span>인 모든 실수 \u003cspan class=\"heq\">\\(x\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(g&#x27;(x) = f&#x27;(-x)\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hcondr\">(나) \u003cspan class=\"heq\">\\(f(2) + g(-2) = 9\\)\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"hchoices\">\u003cdiv class=\"hch\">① \u003cspan class=\"heq\">\\(1\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">② \u003cspan class=\"heq\">\\(2\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">③ \u003cspan class=\"heq\">\\(3\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">④ \u003cspan class=\"heq\">\\(4\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">⑤ \u003cspan class=\"heq\">\\(5\\)\u003c/span>\u003c/div>\u003c/div>","questionText":"$x > 0$서 미분가능한 함수 $f(x)$에 대하여\n $f'(x) = 2 - \\frac{3}{x}^2$, $f(1) = 5$\n이다. $x\u003c0$에서 미분가능한 함수 $g(x)$가 다음 조건을 만족시킬 때, $g(-3)$의 값은? [4점]\n(가) $x\u003c0$인 모든 실수 $x$에 대하여 $g'(x) = f'(-x)$이다.(나) $f(2) + g(-2) = 9$\n① $1$ ② $2$ ③ $3$ ④ $4$ ⑤ $5$","sourceHash":"02121ca4973e858cd4db313edd4dbf90b0a325c4969cf46bdab461b453642f8a","sourceKind":"csat","sourceLabel":"2020년 시행 수능 · 2021학년도 · 가형 · 15번","steps":[{"id":"s1","latex":"f\\prime(x)=2-\\frac3{x^2}\\ \\Rightarrow\\ f(x)=2x+\\frac3x+C\\quad(x>0)"},{"id":"s2","latex":"f(1)=5\\ \\Rightarrow\\ C=0,\\quad f(2)=\\frac{11}2"},{"explanation":{"body":"주어진 것은 \\(g\\prime(x)=f\\prime(-x)\\)예요. \\(f(-x)\\)를 미분하면 안쪽 \\(-x\\) 때문에 \\(-f\\prime(-x)\\)가 되므로 \\(g=f(-x)+C\\)로 쓰면 안 돼요. 여기서는 도함수에 \\(-x\\)를 먼저 대입해 \\(2-3/x^2\\)를 얻고, 이 식을 적분하면 \\(g(x)=2x+3/x+D\\)가 돼요.","skillTags":["integration.reflected-argument"],"title":"f(-x)를 그대로 적으면 부호가 달라져요"},"id":"s3","latex":"g\\prime(x)=f\\prime(-x)=2-\\frac3{x^2}\\ \\Rightarrow\\ g(x)=2x+\\frac3x+D\\quad(x\u003c0)"},{"id":"s4","latex":"f(2)+g(-2)=9\\ \\Rightarrow\\ g(-2)=\\frac72"},{"id":"s5","latex":"-4-\\frac32+D=\\frac72\\ \\Rightarrow\\ D=9"},{"id":"s6","latex":"g(-3)=-6-1+9=\\boxed2\\quad\\text{②}"}],"track":"가형"};</script>
