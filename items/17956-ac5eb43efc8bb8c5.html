tle":"요구값"}],"title":"2024 교육청 고3 수학미적분 3월 30번 · 정확 조각삼차","version":1},"itemId":17956,"learningHash":"f4064c997bb42e92602c24e3c54f8d58a495aad04d68f12d2fd3f40513b35478","month":3,"number":30,"points":4,"preview":false,"questionHtml":"\u003cp class=\"hp\">최고차항의 계수가 \u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>인 삼차함수 \u003cspan class=\"heq\">\\(f \\left( x \\right)\\,\\)\u003c/span>와 자연수 \u003cspan class=\"heq\">\\(m\\,\\)\u003c/span>에 대하여 구간 \u003cspan class=\"heq\">\\(\\left( 0,\\, \\infty \\right)\\,\\)\u003c/span>에서 정의된 함수 \u003cspan class=\"heq\">\\(g \\left( x \\right)\\,\\)\u003c/span>를\u003c/p>\u003cp class=\"hp htall\">&emsp;&emsp;\u003cspan class=\"heq\">\\(g \\left( x \\right) = \\lim\\limits_{n\\, \\rightarrow \\, \\infty } {} \\dfrac{f \\left( x \\right) \\left( \\dfrac{x}{m} \\right)^{n} +x}{ \\left( \\dfrac{x}{m} \\right)^{n} +1}\\,\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">라 하자. 함수 \u003cspan class=\"heq\">\\(g \\left( x \\right)\\,\\)\u003c/span>는 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) 함수 \u003cspan class=\"heq\">\\(g \\left( x \\right)\\,\\)\u003c/span>는 구간 \u003cspan class=\"heq\">\\(\\left( 0,\\, \\infty \\right)\\,\\)\u003c/span>에서 미분가능하고,\u003cbr> \u003cspan class=\"heq\">\\(g' \\left( m+1 \\right) \\leq 0\\,\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp\">(나) \u003cspan class=\"heq\">\\(g \\left( k \\right) g \\left( k+1 \\right) =0\\,\\)\u003c/span>을 만족시키는 자연수 \u003cspan class=\"heq\">\\(k\\,\\)\u003c/span>의 개수는 \u003cspan class=\"heq\">\\(3\\,\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp\">(다) \u003cspan class=\"heq\">\\(g \\left( l \\right) \\geq g \\left( l+1 \\right)\\,\\)\u003c/span>을 만족시키는 자연수 \u003cspan class=\"heq\">\\(l\\,\\)\u003c/span>의 개수는 \u003cspan class=\"heq\">\\(3\\,\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(g \\left( 12 \\right)\\,\\)\u003c/span>의 값을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","questionText":"최고차항의 계수가 $1\\,$인 삼차함수 $f \\left( x \\right)\\,$와 자연수 $m\\,$에 대하여 구간 $\\left( 0,\\, \\infty \\right)\\,$에서 정의된 함수 $g \\left( x \\right)\\,$를\n $g \\left( x \\right) = \\lim _{n\\, \\rightarrow \\, \\infty } {} \\frac{f \\left( x \\right) \\left( \\frac{x}{m} \\right) ^{n} +x}{ \\left( \\frac{x}{m} \\right) ^{n} +1}\\,$\n라 하자. 함수 $g \\left( x \\right)\\,$는 다음 조건을 만족시킨다.\n (가) 함수 $g \\left( x \\right)\\,$는 구간 $\\left( 0,\\, \\infty \\right)\\,$에서 미분가능하고, $g' \\left( m+1 \\right) \\leq 0\\,$이다. (나) $g \\left( k \\right) g \\left( k+1 \\right) =0\\,$을 만족시키는 자연수 $k\\,$의 개수는 $3\\,$이다. (다) $g \\left( l \\right) \\geq g \\left( l+1 \\right)\\,$을 만족시키는 자연수 $l\\,$의 개수는 $3\\,$이다.\n$g \\left( 12 \\right)\\,$의 값을 구하시오. [4점]","scoreStatus":"confirmed_4_direct","sourceHash":"5a27f0e1bca59b4d933cdb23bbe5033665d68d38346d92fbb4dc4f36a2df308c","sourceLabel":"2024 교육청 고3 수학미적분 3월 30번","stepExplanations":{"s2":{"body":"\\(0\u003cx\u003cm\\)이면 \\((\\frac xm)^n\\to0\\)이므로 \\(g(x)=x\\)이고, \\(x>m\\)이면 분자·분모를 \\((\\frac xm)^n\\)으로 나누어 \\(g(x)=f(x)\\)를 얻어요. \\(x=m\\)에서는 \\(g(m)=\\frac{f(m)+m}2\\)예요. 연속이려면 \\(f(m)=m\\), 미분가능하려면 오른쪽의 기울기도 1이어야 하므로 \\(f^{\\prime}(m)=1\\)이에요. 최고차항의 계수가 1인 삼차식에 이 두 조건을 넣으면 \\(f(m+t)=m+t+At^2+t^3\\)으로 쓸 수 있어요.","skillTags":["calculus.limit","calculus.derivative"],"title":"분기점에서는 함숫값과 기울기가 모두 맞아야 해요"},"s5":{"body":"\\(l\u003cm\\)이면 \\(g(l+1)-g(l)=1>0\\)이므로 조건 (다)에 들어가지 않아요. \\(l=m+s\\)에서 \\(s\\ge0\\)인 정수이면 그 차는 \\(D_s\\)예요. \\(A\\le-2\\)이므로 \\(D_0=A+2\\le0\\)이고, 위로 열린 이차식 \\(D_s\\)는 \\(s\\ge0\\)에서 0 이하인 부분이 처음부터 이어져요. 따라서 해당 자연수 \\(l\\)이 정확히 세 개이려면 \\(s=0,1,2\\)에서만 \\(D_s\\le0\\)이어야 해서 \\(D_2\\le0\u003cD_3\\)이에요. 이를 풀면 \\(-\\frac{38}{7}\u003cA\\le-4\\)예요.","skillTags":["reasoning.casework","algebra.calculation"],"title":"자연수 l을 m보다 작은 때와 큰 때로 나누어요"},"s7":{"body":"\\(x\\le m\\)인 양수에서는 \\(g(x)=x>0\\)이므로 자연수인 근은 모두 \\(m\\)보다 커요. 근이 \\(r\\)이면 조건 (나)에 들어가는 \\(k\\)는 \\(r-1,r\\) 두 개예요. 한편 \\(f(m+t)=t^3+At^2+t+m\\)이 양수인 자연수 근을 세 개 갖는다면 세 근의 곱은 상수항의 반대인 \\(-m\u003c0\\)이어야 해서 불가능해요. 따라서 자연수인 근은 많아야 두 개예요. 두 근이 이웃하지 않으면 \\(k\\)가 네 개, 이웃하면 가운데 하나가 겹쳐 세 개가 되므로 근은 \\(m+s,m+s+1\\) 꼴이어야 해요.","skillTags":["algebra.calculation","reasoning.casework"],"title":"근이 하나일 때 만들어지는 k 두 개를 세어요"},"s8":{"body":"두 근의 함숫값이 모두 0이므로 \\(D_s=0\\)이에요. 앞의 \\(A\\) 범위에서 \\(D_1=8+3A\u003c0\\), \\(D_2=20+5A\\le0\\), \\(D_3=38+7A>0\\)이고 이후에는 양수이므로 자연수 \\(s\\)가 될 수 있는 값은 2뿐이에요. 따라서 \\(D_2=0\\)에서 \\(A=-4\\), \\(f(m+2)=m-6=0\\)에서 \\(m=6\\)이에요. 이때 \\(g\\)의 자연수 근은 8,9여서 \\(k=7,8,9\\)이고, \\(D_0=-2,D_1=-4,D_2=0\\) 뒤에는 양수여서 조건 (다)도 정확히 세 개예요. \\(f^{\\prime}(m+1)=-4\\le0\\)도 만족해요.","skillTags":["reasoning.casework","geometry.reasoning"],"title":"연속한 두 근 사이에서는 차가 0이에요"}},"steps":[{"id":"s1","latex":"g(x)=\\begin{cases}x&0\u003cx\u003cm\\\\\\frac{f(m)+m}2&x=m\\\\f(x)&x>m\\end{cases}"},{"id":"s2","latex":"f(m)=m,\\ f\\prime(m)=1\\Rightarrow f(m+t)=m+t+At^2+t^3"},{"id":"s3","latex":"f\\prime(m+1)=4+2A\\le0\\Rightarrow A\\le-2"},{"id":"s4","latex":"D_s=f(m+s+1)-f(m+s)=3s^2+(3+2A)s+(2+A)"},{"id":"s5","latex":"D_0\\le0:\\quad\\text{조건을 만족하는 자연수 }l\\text{이 3개}\\iff D_2\\le0\u003cD_3"},{"id":"s6","latex":"20+5A\\le0\u003c38+7A\\Rightarrow-38/7\u003cA\\le-4"},{"id":"s7","latex":"\\text{자연수인 근 하나는 }k=r-1,r\\text{를 만듦};\\quad\\text{근은 }m+s,m+s+1\\ (s\\ge1)"},{"id":"s8","latex":"s\\ge1,\\quad D_s=0;\\quad D_1\u003c0,\\ D_3>0\\Rightarrow s=2,\\ A=-4"},{"id":"s9","latex":"f(m+2)=m-6=0\\Rightarrow m=6"},{"id":"s10","latex":"f(x)=(x-5)(x-8)(x-9),\\quad g(12)=7\\cdot4\\cdot3=84"}],"track":"미적분"};</script>
