  <script>window.HandStudyRecord={"itemId":16210,"sourceLabel":"2019 교육청 고3 수리가형 10월 18번","adminYear":2019,"grade":3,"month":10,"number":18,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"숫자 $1$, $2$, $3$, $6$, $18\\,$이 하나씩 적혀 있는 $5\\,$장의 카드가 있다. 다음은 이 $5\\,$장의 카드를 일렬로 나열할 때, 이웃한 두 카드에 적혀 있는 수의 곱이 모두 $6\\,$의 배수가 되도록 나열하는 경우의 수를 구하는 과정이다.\n이웃한 두 카드에 적힌 수의 곱이 $6\\,$의 배수가 되지 않는 경우는 $1\\,$, $2\\,$가 적힌 두 카드가 서로 이웃하는 경우와 $1\\,$, $3\\,$이 적힌 두 카드가 서로 이웃하는 경우이다.\n(ⅰ)$1\\,$, $2\\,$가 적힌 두 카드가 서로 이웃하는 경우\n이 두 카드를 한 묶음으로 생각하고, 두 카드의 자리를 바꾸는 것을 고려하면 $1\\,$, $2\\,$가 적힌 두 카드가 이웃하도록 $5\\,$장의 카드를 나열하는 경우의 수는 ${\\boxed{\\vphantom{(}\\,(\\text{가})\\,}} \\,$이다.\n(ⅱ)$1\\,$, $3\\,$이 적힌 두 카드가 서로 이웃하는 경우\n(ⅰ)과 마찬가지로 경우의 수는 ${\\boxed{\\vphantom{(}\\,(\\text{가})\\,}} \\,$이다.\n(ⅲ)(ⅰ)과 (ⅱ)가 동시에 일어나는 경우\n$1\\,$, $2$, $3\\,$이 적힌 세 카드를 한 묶음으로 생각하고, \n세 카드 중 $1\\,$이 적힌 카드가 가운데에 위치하도록 \n$5\\,$장의 카드를 나열하는 경우의 수는 ${\\boxed{\\vphantom{(}\\,(\\text{나})\\,}} \\,$이다.\n$5\\,$장의 카드를 일렬로 나열하는 모든 경우의 수는 $5! =120\\,$\n이므로 (ⅰ), (ⅱ), (ⅲ)에 의해 구하는 경우의 수는\n${\\boxed{\\vphantom{(}\\,(\\text{다})\\,}} \\,$이다.\n위의 (가), (나), (다)에 알맞은 수를 각각 $p$, $q$, $r\\,$라 할 때,\n$p+q+r\\,$의 값은? [4점]\n① $96$ ② $100$ ③ $104$ ④ $108$ ⑤ $112$","answer":"①","sourceHash":"8f773b08720872bc43b47ad999f0120cb58df5d9b160f076a5ef0107b5657ecc","steps":[{"id":"s1","latex":"A=\\{1\\text{과 }2\\text{가 이웃}\\},\\qquad B=\\{1\\text{과 }3\\text{가 이웃}\\}"},{"id":"s2","latex":"p=|A|=|B|=4!\\cdot2=48"},{"id":"s3","latex":"q=|A\\cap B|=3!\\cdot2=12"},{"id":"s4","latex":"r=5!-|A\\cup B|=120-(48+48-12)=36"},{"id":"s5","latex":"p+q+r=48+12+36=\\boxed{96}"}],"diagram":null,"contentHash":"b3970c1324f793e43a222c484aea3099e1d94f5b0242b6552f778083e99c2874","questionHtml":"\u003cp class=\"hp\">숫자 \u003cspan class=\"heq\">\\(1\\)\u003c/span>, \u003cspan class=\"heq\">\\(2\\)\u003c/span>, \u003cspan class=\"heq\">\\(3\\)\u003c/span>, \u003cspan class=\"heq\">\\(6\\)\u003c/span>, \u003cspan class=\"heq\">\\(18\\,\\)\u003c/span>이 하나씩 적혀 있는 \u003cspan class=\"heq\">\\(5\\,\\)\u003c/span>장의 카드가 있다. 다음은 이 \u003cspan class=\"heq\">\\(5\\,\\)\u003c/span>장의 카드를 일렬로 나열할 때, 이웃한 두 카드에 적혀 있는 수의 곱이 모두 \u003cspan class=\"heq\">\\(6\\,\\)\u003c/span>의 배수가 되도록 나열하는 경우의 수를 구하는 과정이다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">이웃한 두 카드에 적힌 수의 곱이 \u003cspan class=\"heq\">\\(6\\,\\)\u003c/span>의 배수가 되지 않는 경우는 \u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(2\\,\\)\u003c/span>가 적힌 두 카드가 서로 이웃하는 경우와 \u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(3\\,\\)\u003c/span>이 적힌 두 카드가 서로 이웃하는 경우이다.\u003c/p>\u003cp class=\"hp htall\">(ⅰ)\u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(2\\,\\)\u003c/span>가 적힌 두 카드가 서로 이웃하는 경우\u003cbr>이 두 카드를 한 묶음으로 생각하고, 두 카드의 자리를 바꾸는 것을 고려하면 \u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(2\\,\\)\u003c/span>가 적힌 두 카드가 이웃하도록 \u003cspan class=\"heq\">\\(5\\,\\)\u003c/span>장의 카드를 나열하는 경우의 수는 \u003cspan class=\"heq\">\\({\\boxed{\\vphantom{(}\\,(\\text{가})\\,}} \\,\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp htall\">(ⅱ)\u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(3\\,\\)\u003c/span>이 적힌 두 카드가 서로 이웃하는 경우\u003cbr>(ⅰ)과 마찬가지로 경우의 수는 \u003cspan class=\"heq\">\\({\\boxed{\\vphantom{(}\\,(\\text{가})\\,}} \\,\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp htall\">(ⅲ)(ⅰ)과 (ⅱ)가 동시에 일어나는 경우\u003cbr>\u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(2\\)\u003c/span>, \u003cspan class=\"heq\">\\(3\\,\\)\u003c/span>이 적힌 세 카드를 한 묶음으로 생각하고, \u003cbr>세 카드 중 \u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>이 적힌 카드가 가운데에 위치하도록 \u003cbr>\u003cspan class=\"heq\">\\(5\\,\\)\u003c/span>장의 카드를 나열하는 경우의 수는 \u003cspan class=\"heq\">\\({\\boxed{\\vphantom{(}\\,(\\text{나})\\,}} \\,\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(5\\,\\)\u003c/span>장의 카드를 일렬로 나열하는 모든 경우의 수는 \u003cspan class=\"heq\">\\(5! =120\\,\\)\u003c/span>\u003
