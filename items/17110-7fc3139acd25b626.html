  <script>window.HandStudyRecord={"itemId":17110,"sourceLabel":"2021 교육청 고3 수학미적분 7월 30번","adminYear":2021,"grade":3,"month":7,"number":30,"track":"미적분","points":4,"scoreStatus":"confirmed_4_direct","questionText":"두 자연수 $a,\\,b$에 대하여 이차함수 $f \\left( x \\right)$$=ax ^{2} +b$가 있다. 함수 $g \\left( x \\right)$를\n $g \\left( x \\right)$$=\\ln\\,f \\left( x \\right) - \\frac{1}{10} \\left\\{ f \\left( x \\right) -1 \\right\\}$\n이라 하자. 실수 $t$에 대하여 직선 $y$$= \\left| \\,g \\left( t \\right) \\, \\right|$와 함수 $y$$= \\left| \\,g \\left( x \\right) \\, \\right|$의 그래프가 만나는 점의 개수를 $h \\left( t \\right)$라 하자. 두 함수 $g \\left( x \\right)$, $h \\left( t \\right)$가 다음 조건을 만족시킨다.\n(가) 함수 $g \\left( x \\right)$는 $x=0$에서 극솟값을 갖는다.(나) 함수 $h \\left( t \\right)$가 $t$$=k$에서 불연속인 $k$의 값의 개수는 $7$이다.\n$\\int _{0} ^{a} {} e ^{x} \\,f \\left( x \\right) \\,dx$$=me ^{a} -19$일 때, 자연수 $m$의 값을 구하시오. [4점]","answer":"586","sourceHash":"3d4a4c79cde6f6d04fed7e2441f5fd7bacccfe9dc38ed078a6455f2ff566c41e","steps":[{"id":"s1","latex":"g'(x)=\\frac{2ax\\{10-f(x)\\}}{10f(x)},\\quad f(x)=ax^2+b>0"},{"id":"s2","latex":"x=0\\text{에서 극소}\\Rightarrow b\u003c10,\\quad f(x)=10\\text{인 }x=\\pm r\\text{에서 극대}"},{"id":"s3","latex":"m_0=g(0)=\\ln b-\\frac{b-1}{10},\\quad M=\\ln10-\\frac9{10}"},{"id":"s4","latex":"b\\in\\{1,\\ldots,9\\}\\Rightarrow0\\le m_0\u003cM"},{"id":"s5","latex":"m_0>0:\\quad |g(t)|=0,m_0,M\\text{에서 }h\\text{ 불연속}\\Rightarrow2+5+4=11\\text{개}"},{"id":"s6","latex":"m_0=0:\\quad |g(t)|=0,M\\text{에서 }h\\text{ 불연속}\\Rightarrow3+4=7\\text{개}\\Rightarrow b=1"},{"id":"s7","latex":"\\int_0^ae^x(ax^2+1)\\,dx=e^a(a^3-2a^2+2a+1)-(2a+1)"},{"id":"s8","latex":"=me^a-19\\Rightarrow a=9,\\quad m=9^3-2\\cdot9^2+2\\cdot9+1=586"}],"diagram":null,"contentHash":"570af538887b7233547de10cef89f3fd1eba6c11f3b7f7b2074ef55244cfdac9","questionHtml":"\u003cp class=\"hp\">두 자연수 \u003cspan class=\"heq\">\\(a,\\,b\\)\u003c/span>에 대하여 이차함수 \u003cspan class=\"heq\">\\(f \\left( x \\right)\\)\u003c/span>\u003cspan class=\"heq\">\\(=ax^{2} +b\\)\u003c/span>가 있다. \u003cbr>함수 \u003cspan class=\"heq\">\\(g \\left( x \\right)\\)\u003c/span>를\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\(g \\left( x \\right)\\)\u003c/span>\u003cspan class=\"heq\">\\(=\\ln\\,f \\left( x \\right) - \\dfrac{1}{10} \\left\\{ f \\left( x \\right) -1 \\right\\}\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">이라 하자. 실수 \u003cspan class=\"heq\">\\(t\\)\u003c/span>에 대하여 직선 \u003cspan class=\"heq\">\\(y\\)\u003c/span>\u003cspan class=\"heq\">\\(= \\left| \\,g \\left( t \\right) \\, \\right|\\)\u003c/span>와 함수 \u003cspan class=\"heq\">\\(y\\)\u003c/span>\u003cspan class=\"heq\">\\(= \\left| \\,g \\left( x \\right) \\, \\right|\\)\u003c/span>의 그래프가 만나는 점의 개수를 \u003cspan class=\"heq\">\\(h \\left( t \\right)\\)\u003c/span>라 하자. 두 함수 \u003cspan class=\"heq\">\\(g \\left( x \\right)\\)\u003c/span>, \u003cspan class=\"heq\">\\(h \\left( t \\right)\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) 함수 \u003cspan class=\"heq\">\\(g \\left( x \\right)\\)\u003c/span>는 \u003cspan class=\"heq\">\\(x=0\\)\u003c/span>에서 극솟값을 갖는다.\u003c/p>\u003cp class=\"hp\">(나) 함수 \u003cspan class=\"heq\">\\(h \\left( t \\right)\\)\u003c/span>가 \u003cspan class=\"heq\">\\(t\\)\u003c/span>\u003cspan class=\"heq\">\\(=k\\)\u003c/span>에서 불연속인 \u003cspan class=\"heq\">\\(k\\)\u003c/span>의 값의 개수는 \u003cbr>\u003cspan class=\"heq\">\\(7\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(\\int_{0}^{a} {} e^{x} \\,f \\left( x \\right) \\,dx\\)\u003c/span>\u003cspan class=\"heq\">\\(=me^{a} -19\\)\u003c/span>일 때, 자연수 \u003cspan class=\"heq\">\\(m\\)\u003c/span>의 값을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"7fc3139acd25b626f49c4beed60ed5a217d44890004306981828ccefc8443741"};</script>
