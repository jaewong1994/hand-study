<script>window.HandStudyRecord={"itemId":16303,"sourceLabel":"2019 교육청 고3 수리가형 5월 21번","adminYear":2019,"grade":3,"month":5,"number":21,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"양의 실수 전체의 집합에서 이계도함수가 존재하는 함수 $f(x)\\,$와 미분가능한 함수 $g(x)\\,$가 다음 조건을 만족시킨다.\n(가) $\\lim _{h-> 0} {} \\frac{f'(4+h)-1}{h} =1$ (나) 모든 양수 $x\\,$에 대하여 $\\int _{4} ^{x} {} f(t)dt= \\int _{4} ^{x} {} \\left\\{ \\frac{g \\left( \\sqrt{t} \\right)}{x} - \\frac{g \\left( \\sqrt{t} \\right)}{t} \\right\\} dt$ 이다.\n곡선 $y=g(x)\\,$위의 점 $\\left( \\,2\\,,\\,g(2) \\right)$에서의 접선의 $y\\,$절편은? [4점]\n① 232 ② 234 ③ 236 ④ 238 ⑤ 240\n단답형","answer":"⑤","sourceHash":"704c6b38ea6276967aa65cbf97752de3e34389683c302ac4c8efd08485aa943d","steps":[{"id":"s1","latex":"\\lim_{h\\to0}\\dfrac{f'(4+h)-1}{h}=1\\Rightarrow f'(4)=1,\\quad f''(4)=1"},{"id":"s2","latex":"G(x)=\\int_4^xg(\\sqrt t)\\,dt"},{"id":"s3","latex":"\\int_4^xf(t)dt=\\dfrac{G(x)}x-\\int_4^x\\dfrac{g(\\sqrt t)}t\\,dt"},{"id":"s4","latex":"f(x)=-\\dfrac{G(x)}{x^2}\\Rightarrow x^2f(x)=-G(x)"},{"id":"s5","latex":"2xf+x^2f'=-g(\\sqrt x)"},{"id":"s6","latex":"2f+4xf'+x^2f''=-\\dfrac{g'(\\sqrt x)}{2\\sqrt x}"},{"id":"s7","latex":"f(4)=0\\Rightarrow g(2)=-16,\\quad g'(2)=-128"},{"id":"s8","latex":"y=-128(x-2)-16\\Rightarrow y\\text{절편}=240"}],"diagram":null,"contentHash":"4a9557b199e85d2493ce0d0b35d9ae6c67df3fb3bb61aca979a67046b889a214","questionHtml":"\u003cp class=\"hp\">양의 실수 전체의 집합에서 이계도함수가 존재하는 함수 \u003cspan class=\"heq\">\\(f(x)\\,\\)\u003c/span>와 미분가능한 함수 \u003cspan class=\"heq\">\\(g(x)\\,\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cp class=\"hp htall\">\u003cdiv class=\"hbox\">\u003cp class=\"hp htall\">(가) \u003cspan class=\"heq\">\\(\\lim\\limits_{h\\to  0} {} \\dfrac{f'(4+h)-1}{h} =1\\)\u003c/span>\u003c/p>\u003cp class=\"hp htall\">(나) 모든 양수 \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>에 대하여\u003cbr>\u003cspan class=\"heq\">\\(\\int_{4}^{x} {} f(t)dt= \\int_{4}^{x} {} \\left\\{ \\dfrac{g \\left( \\sqrt{t} \\right)}{x} - \\dfrac{g \\left( \\sqrt{t} \\right)}{t} \\right\\} dt\\)\u003c/span> 이다.\u003c/p>\u003c/div>\u003c/p>\u003cp class=\"hp\">곡선 \u003cspan class=\"heq\">\\(y=g(x)\\,\\)\u003c/span>위의 점 \u003cspan class=\"heq\">\\(\\left( \\,2\\,,\\,g(2) \\right)\\)\u003c/span>에서의 접선의 \u003cspan class=\"heq\">\\(y\\,\\)\u003c/span>절편은? \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">① 232&emsp;② 234&emsp;③ 236&emsp;④ 238&emsp;⑤ 240\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"47a1c3591aa95028b8ac645c64f220fcffa8f1fcb756318938bdae6fd1eea2c9"};</script>
<script>window.HandStudyGuide={"itemId":16303,"sourceHash":"704c6b38ea6276967aa65cbf97752de3e34389683c302ac4c8efd08485aa943d","contentHash":"4a9557b199e85d2493ce0d0b35d9ae6c67df3fb3bb61aca979a67046b889a214","overview":{"goal":"극한에서 \\(f'(4),f''(4)\\)를 읽고, 매개변수가 들어간 적분식을 미분해 \\(g(2),g'(2)\\)를 구해요.","firstLook":"오른쪽 적분에는 적분변수 \\(t\\)와 바깥 변수 \\(x\\)가 함께 있어요. \\(g(\\sqrt t)\\)의 적분을 새 함수로 묶으면 미분할 부분이 또렷해져요.","conditions":[{"label":"극한 조건","meaning":"분자가 \\(0\\)으로 가야 하므로 먼저 \\(f'(4)=1\\), 이어서 도함수의 정의로 \\(f''(4)=1\\)을 얻어요."},{"label":"적분 조건","meaning":"모든 양수 \\(x\\)에서 성립하므로 양변을 \\(x\\)에 대하여 미분할 수 있어요."}]},"chapters":[{"id":"c1","label":"극한에서 두 값을 차례로 읽어요","stepIds":["s1"],"question":"주어진 극한이 존재하려면 왜 \\(f'(4)=1\\)이어야 할까요?","hint":"\\(h\\)가 \\(0\\)으로 갈 때 분모만 \\(0\\)이 되면 몫은 유한한 값으로 갈 수 없어요.","explanation":"\\(\\lim_{h\\to0}\\frac{f'(4+h)-1}{h}=1\\)에서 분모는 \\(0\\)으로 가요. 극한값이 유한하려면 분자도 \\(0\\)으로 가야 하므로 \\(f'(4)-1=0\\), 곧 \\(f'(4)=1\\)이에요. 이제 분자의 \\(1\\)을 \\(f'(4)\\)로 바꾸면\n\n\\(\\lim_{h\\to0}\\frac{f'(4+h)-f'(4)}{h}=f''(4)=1\\)\n\n이 돼요. 한 극한에서 필요한 두 값을 순서대로 얻은 셈이에요.","check":{"prompt":"처음부터 주어진 극한을 \\(f''(4)\\)라고 부를 수 없는 이유는 무엇인가요?","answer":"분자에 \\(f'(4)\\)가 아니라 \\(1\\)이 적혀 있으므로, 먼저 극한의 존재를 이용해 \\(f'(4)=1\\)을 확인해야 해요."}},{"id":"c2","label":"적분을 묶어 첫 미분을 해요","stepIds":["s2","s3","s4"],"question":"오른쪽을 미분했을 때 \\(g(\\sqrt x)/x\\) 두 항은 왜 서로 없어질까요?","hint":"\\(G(x)=\\int_4^x g(\\sqrt t)\\,dt\\)로 놓고 \\(G(x)/x\\)를 곱의 미분법으로 미분해요.","explanation":"\\(G(x)=\\int_4^xg(\\sqrt t)\\,dt\\)로 두면 \\(G'(x)=g(\\sqrt x)\\)예요. 원래 식의 오른쪽은\n\n\\(\\frac{G(x)}x-\\int_4^x\\frac{g(\\sqrt t)}t\\,dt\\)\n\n로 쓸 수 있어요. 양변을 미분하면 첫 항에서 \\(g(\\sqrt x)/x-G(x)/x^2\\), 둘째 항에서 \\(-g(\\sqrt x)/x\\)가 나와 \\(g(\\sqrt x)/x\\)끼리 없어져요. 따라서 \\(f(x)=-G(x)/x^2\\), 곧 \\(x^2f(x)=-G(x)\\)예요.","check":{"prompt":"\\(\\frac{G(x)}x\\)의 미분 결과를 빠짐없이 쓰면 무엇인가요?","answer":"\\(\\frac{G'(x)}x-\\frac{G(x)}{x^2}=\\frac{g(\\sqrt x)}x-\\frac{G(x)}{x^2}\\)예요."}},{"id":"c3","label":"한 번 더 미분해 접선 자료를 얻어요","stepIds":["s5","s6","s7"],"question":"\\(x=4\\)를 넣을 때 \\(f(4)\\)는 어떻게 알 수 있을까요?","hint":"\\(G(4)\\)는 아래끝값과 위끝값이 같은 정적분이에요.","explanation":"\\(x^2f(x)=-G(x)\\)를 미분하면\n\n\\(2xf(x)+x^2f'(x)=-g(\\sqrt x)\\)\n\n이에요. \\(G(4)=0\\)이므로 \\(f(4)=0\\)이고, \\(x=4\\)를 넣으면 \\(16=-g(2)\\), 따라서 \\(g(2)=-16\\)이에요. 이 식을 다시 미분하면\n\n\\(2f(x)+4xf'(x)+x^2f''(x)=-\\frac{g'(\\sqrt x)}{2\\sqrt x}\\)\n\n예요. \\(x=4\\), \\(f(4)=0\\), \\(f'(4)=f''(4)=1\\)을 넣으면 왼쪽은 \\(0+16+16=32\\)이고 오른쪽은 \\(-g'(2)/4\\)예요. 그래서 \\(g'(2)=-128\\)이에요.","check":{"prompt":"두 번째 미분식에 \\(x=4\\)를 넣은 실제 등식은 무엇인가요?","answer":"\\(32=-g'(2)/4\\)이므로 \\(g'(2)=-128\\)이에요."}},{"id":"c4","label":"접선의 절편을 계산해요","stepIds":["s8"],"question":"기울기와 접점을 알 때 \\(y\\)절편은 어떻게 얻을까요?","hint":"점기울기식에 \\(x=0\\)을 넣어요.","explanation":"접점은 \\((2,-16)\\), 기울기는 \\(-128\\)이므로 접선은 \\(y+16=-128(x-2)\\)예요. 정리하면 \\(y=-128x+240\\)이어서 \\(y\\)절편은 \\(240\\), 정답은 ⑤예요.","check":{"prompt":"접선에 \\(x=0\\)을 넣었을 때 \\(y\\)는 얼마인가요?","answer":"\\(y=-16-128(0-2)=240\\)이에요."}}],"takeaway":["미분계수 꼴의 극한은 분자에 기준값이 정확히 들어 있는지 먼저 확인해요.","적분 바깥의 변수와 적분변수를 구분하고, 반복되는 적분은 새 함수로 묶어 미분해요.","접선 문제에서는 함숫값과 미분계수를 구한 뒤 점기울기식으로 절편을 확인해요."]};</script>
