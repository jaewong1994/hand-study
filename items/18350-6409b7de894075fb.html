<script>window.HandStudyRecord={"adminYear":2025,"answer":"73","contentHash":"35cdebaec68cf06c91594126016580dfd20737ca1848e39bbc733ef355d1e378","diagram":null,"editionHash":"6409b7de894075fb78415f3bbd2f6cdd2194e5ac69b81e5a118effeedb0bed1d","grade":3,"graphHash":"","graphPlan":null,"itemId":18350,"learningHash":"26299a0f6b3ac81b1c96464ce0dac3461b633a772d9c4dfb3a6af23ae600a7ba","month":9,"number":22,"points":4,"preview":false,"questionHtml":"\u003cp class=\"hp\">곡선 \u003cspan class=\"heq\">\\(y= \\log_{2}\\,x\\)\u003c/span> 위에 서로 다른 두 점 \u003cspan class=\"heq\">\\({{A}}\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\({{B}}\\,\\)\u003c/span>가 있다. 점 \u003cspan class=\"heq\">\\({{A}}\\,\\)\u003c/span>에서 직선 \u003cspan class=\"heq\">\\(y=x\\,\\)\u003c/span>에 내린 수선의 발을 \u003cspan class=\"heq\">\\({{P}}\\,\\)\u003c/span>라 하고, 점 \u003cspan class=\"heq\">\\({{B}}\\,\\)\u003c/span>를 직선 \u003cspan class=\"heq\">\\(y=x\\,\\)\u003c/span>에 대하여 대칭이동한 점을 \u003cspan class=\"heq\">\\({{Q}}\\,\\)\u003c/span>라 할 때, 네 점 \u003cspan class=\"heq\">\\({{A}}\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\({{B}}\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\({{P}}\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\({{Q}}\\,\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp htall\">(가) (직선 \u003cspan class=\"heq\">\\({{AP}}\\,\\)\u003c/span>의 \u003cspan class=\"heq\">\\(y\\,\\)\u003c/span>절편)\u003cspan class=\"heq\">\\(-\\)\u003c/span>(직선 \u003cspan class=\"heq\">\\({{BQ}}\\,\\)\u003c/span>의 \u003cspan class=\"heq\">\\(y\\,\\)\u003c/span>절편) \u003cspan class=\"heq\">\\(=\\dfrac{13}{2}\\)\u003c/span>\u003c/p>\u003cp class=\"hp htall\">(나) 직선 \u003cspan class=\"heq\">\\({{AB}}\\,\\)\u003c/span>의 기울기는 \u003cspan class=\"heq\">\\(\\dfrac{6}{7}\\,\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp class=\"hp htall\">사각형 \u003cspan class=\"heq\">\\({{APQB}}\\,\\)\u003c/span>의 넓이가 \u003cspan class=\"heq\">\\(\\dfrac{q}{p}\\,\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(p+q\\,\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(p\\,\\)\u003c/span>와 \u003cspan class=\"heq\">\\(q\\,\\)\u003c/span>는 서로소인 자연수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","questionText":"곡선 $y= \\log_{2}\\,x$ 위에 서로 다른 두 점 ${{A}}\\,$, ${{B}}\\,$가 있다. 점 ${{A}}\\,$에서 직선 $y=x\\,$에 내린 수선의 발을 ${{P}}\\,$라 하고, 점 ${{B}}\\,$를 직선 $y=x\\,$에 대하여 대칭이동한 점을 ${{Q}}\\,$라 할 때, 네 점 ${{A}}\\,$, ${{B}}\\,$, ${{P}}\\,$, ${{Q}}\\,$가 다음 조건을 만족시킨다.\n(가) (직선 ${{AP}}\\,$의 $y\\,$절편)$-$(직선 ${{BQ}}\\,$의 $y\\,$절편) $=\\frac{13}{2}$ (나) 직선 ${{AB}}\\,$의 기울기는 $\\frac{6}{7}\\,$이다.\n사각형 ${{APQB}}\\,$의 넓이가 $\\frac{q}{p}\\,$일 때, $p+q\\,$의 값을 구하시오. (단, $p\\,$와 $q\\,$는 서로소인 자연수이다.) [4점]\n5 지선다형 사각형입니다. 2025년 9월 고3 모의고사 문제지제 2 교시 수학 영역(기하)","scoreStatus":"confirmed_4_direct","sourceHash":"a22a2e4e5f234611563ea5fca70d29a4f3a58598b9f221d6cb2713129e967b24","sourceLabel":"2025 평가원 고3 수학기하 9월 22번","stepExplanations":{"s2":{"body":"\\(y=x\\)의 기울기는 1이므로 이에 수직인 직선의 기울기는 \\(-1\\)이에요. \\(\\mathrm{A}\\)를 지나는 직선은 \\(y=-x+a+\\log_2a\\), \\(\\mathrm{B}\\)를 지나는 직선은 \\(y=-x+b+\\log_2b\\)가 됩니다. 대칭인 두 점을 이은 \\(\\mathrm{BQ}\\)도 \\(y=x\\)에 수직이에요. 따라서 두 절편의 차를 그대로 주어진 \\(\\frac{13}{2}\\)와 같게 놓을 수 있어요.","skillTags":["line.perpendicular","line.intercept"],"title":"수선의 기울기를 절편 조건으로 옮겨요"},"s4":{"body":"\\(a-b\\)를 \\(d\\), \\(\\log_2a-\\log_2b\\)를 \\(e\\)라고 놓아 볼게요. 앞의 두 조건은 \\(d+e=\\frac{13}{2}\\), \\(e=\\frac67d\\)예요. 따라서 \\(\\frac{13}{7}d=\\frac{13}{2}\\)에서 \\(d=\\frac72\\), \\(e=3\\)을 얻습니다. \\(\\log_2(a/b)=3\\)이므로 \\(a=8b\\)이고, \\(a-b=7b=\\frac72\\)에서 \\(b=\\frac12\\), \\(a=4\\)예요.","skillTags":["equation.elimination","logarithm.ratio"],"title":"좌표 차 두 개를 먼저 구하면 쉬워져요"},"s5":{"body":"\\(\\mathrm{A}=(4,2)\\)를 지나는 수선은 \\(y=-x+6\\)이에요. \\(y=x\\)와 연립하면 \\(\\mathrm{P}=(3,3)\\)입니다. 한편 \\(y=x\\)에 대한 대칭이동은 두 좌표를 바꾸므로 \\(\\mathrm{B}=(\\frac12,-1)\\)에서 \\(\\mathrm{Q}=(-1,\\frac12)\\)를 얻어요. 수선의 발은 대칭점과 다르다는 점을 확인해요.","skillTags":["line.intersection","geometry.reflection"],"title":"수선의 발과 대칭점을 따로 구해요"},"s6":{"body":"\\(\\mathrm{AP}\\)와 \\(\\mathrm{BQ}\\)는 모두 기울기가 \\(-1\\)이므로 평행해요. 두 점 사이의 거리로 구하면 \\(\\overline{\\mathrm{AP}}=\\sqrt2\\), \\(\\overline{\\mathrm{BQ}}=\\frac32\\sqrt2\\)입니다. 두 직선은 \\(x+y=6\\), \\(x+y=-\\frac12\\)이므로, 이들 사이의 거리는 점과 직선 사이의 거리 공식을 써서 \\(\\frac{6+1/2}{\\sqrt2}=\\frac{13}{2\\sqrt2}\\)예요. 이것이 사다리꼴의 높이입니다. 따라서 넓이는 \\(\\frac12(\\sqrt2+\\frac32\\sqrt2)\\frac{13}{2\\sqrt2}=\\frac{65}{8}\\)이에요.","skillTags":["geometry.trapezoid-area","line.distance"],"title":"평행한 두 변을 찾아 사다리꼴 넓이로 계산해요"}},"steps":[{"id":"s1","latex":"A=(a,\\log_2a),\\quad B=(b,\\log_2b)"},{"id":"s2","latex":"(a+\\log_2a)-(b+\\log_2b)=\\frac{13}{2}"},{"id":"s3","latex":"\\frac{\\log_2a-\\log_2b}{a-b}=\\frac67"},{"id":"s4","latex":"a-b=\\frac72,\\quad\\log_2\\frac ab=3\\Rightarrow(a,b)=\\left(4,\\frac12\\right)"},{"id":"s5","latex":"A=(4,2),\\ B=\\left(\\frac12,-1\\right),\\ P=(3,3),\\ Q=\\left(-1,\\frac12\\right)"},{"id":"s6","latex":"[APQB]=\\frac{65}{8}\\Rightarrow p+q=8+65=73"}],"track":"기하"};</script>
<script>window.HandStudyGuide={"itemId":18350,"sourceHash":"a22a2e4e5f234611563ea5fca70d29a4f3a58598b9f221d6cb2713129e967b24","contentHash":"35cdebaec68cf06c91594126016580dfd20737ca1848e39bbc733ef355d1e378","overview":{"goal":"로그곡선 위 두 점의 수선과 대칭이동 조건을 절편·기울기 식으로 바꾸어 네 점을 찾고 사다리꼴 넓이를 계산해요.","firstLook":"\\(A=(a,\\log_2a)\\), \\(B=(b,\\log_2b)\\)로 놓으면 수선 \\(AP\\)와 \\(BQ\\)는 모두 기울기 \\(-1\\)인 직선이에요. 그래서 y절편 차와 \\(AB\\)의 기울기 조건이 \\(a-b\\), \\(\\log_2a-\\log_2b\\)에 대한 두 식이 됩니다.","conditions":[{"label":"수선과 대칭","meaning":"\\(y=x\\)에 수직인 직선의 기울기는 \\(-1\\)이고, 대칭이동은 두 좌표를 바꿔요."},{"label":"절편 차","meaning":"\\(AP\\)와 \\(BQ\\)의 y절편 차가 \\(13/2\\)예요."},{"label":"AB의 기울기","meaning":"좌표 차의 비가 \\(6/7\\)이에요."}]},"chapters":[{"id":"c1","label":"그림 조건을 두 좌표 차로 번역하기","stepIds":["s1","s2","s3"],"question":"두 조건에서 반복되는 두 차를 어떻게 잡으면 좋을까요?","hint":"\\(d=a-b\\), \\(e=\\log_2a-\\log_2b\\)를 생각해 보세요.","explanation":"\\(A\\)를 지나는 수선은 \\(y=-x+a+\\log_2a\\)이고, \\(BQ\\)도 \\(y=x\\)에 수직이라 y절편은 \\(b+\\log_2b\\)예요. 따라서 절편 차 조건은 \\(d+e=13/2\\)입니다. 한편 \\(AB\\)의 기울기는 \\(e/d=6/7\\)이므로 두 조건이 같은 두 미지수에 대한 식으로 정리돼요.","check":{"prompt":"왜 \\(d=a-b\\)는 0이 아닌가요?","answer":"문제에서 \\(A,B\\)가 서로 다른 점이고 기울기 \\(6/7\\)가 정의되어 있기 때문입니다."}},{"id":"c2","label":"두 로그점의 좌표 확정하기","stepIds":["s4"],"question":"\\(d,e\\)를 구한 뒤 \\(a,b\\)는 어떻게 찾을까요?","hint":"\\(e=\\log_2(a/b)\\)를 비 \\(a:b\\)로 바꾸세요.","explanation":"\\(e=(6/7)d\\)를 \\(d+e=13/2\\)에 넣으면 \\(d=7/2\\), \\(e=3\\)이에요. \\(\\log_2(a/b)=3\\)이므로 \\(a=8b\\), 또 \\(a-b=7b=7/2\\)이므로 \\(b=1/2,a=4\\)입니다.","check":{"prompt":"점 \\(A,B\\)의 좌표는 무엇인가요?","answer":"\\(A=(4,2)\\), \\(B=(1/2,-1)\\)입니다."}},{"id":"c3","label":"P,Q를 찾고 사다리꼴 넓이 계산하기","stepIds":["s5","s6"],"question":"사각형 \\(APQB\\)에서 평행한 두 변과 높이는 무엇인가요?","hint":"\\(AP\\)와 \\(BQ\\)의 기울기가 둘 다 \\(-1\\)임을 이용하세요.","explanation":"\\(A\\)를 지나는 수선 \\(y=-x+6\\)과 \\(y=x\\)의 교점은 \\(P=(3,3)\\)이고, \\(B\\)를 \\(y=x\\)에 대칭이동하면 \\(Q=(-1,1/2)\\)예요. 평행한 두 변의 길이는 \\(AP=\\sqrt2\\), \\(BQ=3\\sqrt2/2\\)입니다. 두 직선 \\(x+y=6\\), \\(x+y=-1/2\\) 사이 거리는 \\(13/(2\\sqrt2)\\)이므로 사다리꼴 넓이는 \\(\\frac12(\\sqrt2+3\\sqrt2/2)\\cdot13/(2\\sqrt2)=65/8\\)이에요.","check":{"prompt":"\\(65/8=q/p\\)일 때 \\(p+q\\)는 얼마인가요?","answer":"\\(8+65=73\\)입니다."}}],"takeaway":["기하 조건을 좌표 차 두 개로 묶으면 절편과 기울기 조건을 동시에 다루기 쉬워요.","대칭이동과 수선의 발은 서로 다른 조작이므로 각 점을 구하는 방법을 구분해요.","사다리꼴 넓이는 평행한 두 변의 길이와 그 직선 사이의 수직거리를 확인해 계산해요."]};</script>
