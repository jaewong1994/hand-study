  <script>window.HandStudyRecord={"itemId":18350,"sourceLabel":"2025 평가원 고3 수학기하 9월 22번","adminYear":2025,"grade":3,"month":9,"number":22,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"곡선 $y= \\log_{2}\\,x$ 위에 서로 다른 두 점 ${{A}}\\,$, ${{B}}\\,$가 있다. 점 ${{A}}\\,$에서 직선 $y=x\\,$에 내린 수선의 발을 ${{P}}\\,$라 하고, 점 ${{B}}\\,$를 직선 $y=x\\,$에 대하여 대칭이동한 점을 ${{Q}}\\,$라 할 때, 네 점 ${{A}}\\,$, ${{B}}\\,$, ${{P}}\\,$, ${{Q}}\\,$가 다음 조건을 만족시킨다.\n(가) (직선 ${{AP}}\\,$의 $y\\,$절편)$-$(직선 ${{BQ}}\\,$의 $y\\,$절편) $=\\frac{13}{2}$ (나) 직선 ${{AB}}\\,$의 기울기는 $\\frac{6}{7}\\,$이다.\n사각형 ${{APQB}}\\,$의 넓이가 $\\frac{q}{p}\\,$일 때, $p+q\\,$의 값을 구하시오. (단, $p\\,$와 $q\\,$는 서로소인 자연수이다.) [4점]\n5 지선다형 사각형입니다. 2025년 9월 고3 모의고사 문제지제 2 교시 수학 영역(기하)","answer":"73","sourceHash":"a22a2e4e5f234611563ea5fca70d29a4f3a58598b9f221d6cb2713129e967b24","steps":[{"id":"s1","latex":"A=(a,\\log_2a),\\quad B=(b,\\log_2b)"},{"id":"s2","latex":"(a+\\log_2a)-(b+\\log_2b)=\\frac{13}{2}"},{"id":"s3","latex":"\\frac{\\log_2a-\\log_2b}{a-b}=\\frac67"},{"id":"s4","latex":"a-b=\\frac72,\\quad\\log_2\\frac ab=3\\Rightarrow(a,b)=\\left(4,\\frac12\\right)"},{"id":"s5","latex":"A=(4,2),\\ B=\\left(\\frac12,-1\\right),\\ P=(3,3),\\ Q=\\left(-1,\\frac12\\right)"},{"id":"s6","latex":"[APQB]=\\frac{65}{8}\\Rightarrow p+q=8+65=73"}],"diagram":null,"contentHash":"35cdebaec68cf06c91594126016580dfd20737ca1848e39bbc733ef355d1e378","questionHtml":"\u003cp class=\"hp\">곡선 \u003cspan class=\"heq\">\\(y= \\log_{2}\\,x\\)\u003c/span> 위에 서로 다른 두 점 \u003cspan class=\"heq\">\\({{A}}\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\({{B}}\\,\\)\u003c/span>가 있다. 점 \u003cspan class=\"heq\">\\({{A}}\\,\\)\u003c/span>에서 직선 \u003cspan class=\"heq\">\\(y=x\\,\\)\u003c/span>에 내린 수선의 발을 \u003cspan class=\"heq\">\\({{P}}\\,\\)\u003c/span>라 하고, 점 \u003cspan class=\"heq\">\\({{B}}\\,\\)\u003c/span>를 직선 \u003cspan class=\"heq\">\\(y=x\\,\\)\u003c/span>에 대하여 대칭이동한 점을 \u003cspan class=\"heq\">\\({{Q}}\\,\\)\u003c/span>라 할 때, 네 점 \u003cspan class=\"heq\">\\({{A}}\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\({{B}}\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\({{P}}\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\({{Q}}\\,\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp htall\">(가) (직선 \u003cspan class=\"heq\">\\({{AP}}\\,\\)\u003c/span>의 \u003cspan class=\"heq\">\\(y\\,\\)\u003c/span>절편)\u003cspan class=\"heq\">\\(-\\)\u003c/span>(직선 \u003cspan class=\"heq\">\\({{BQ}}\\,\\)\u003c/span>의 \u003cspan class=\"heq\">\\(y\\,\\)\u003c/span>절편) \u003cspan class=\"heq\">\\(=\\dfrac{13}{2}\\)\u003c/span>\u003c/p>\u003cp class=\"hp htall\">(나) 직선 \u003cspan class=\"heq\">\\({{AB}}\\,\\)\u003c/span>의 기울기는 \u003cspan class=\"heq\">\\(\\dfrac{6}{7}\\,\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp class=\"hp htall\">사각형 \u003cspan class=\"heq\">\\({{APQB}}\\,\\)\u003c/span>의 넓이가 \u003cspan class=\"heq\">\\(\\dfrac{q}{p}\\,\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(p+q\\,\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(p\\,\\)\u003c/span>와 \u003cspan class=\"heq\">\\(q\\,\\)\u003c/span>는 서로소인 자연수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"6409b7de894075fb78415f3bbd2f6cdd2194e5ac69b81e5a118effeedb0bed1d"};</script>
