<script>window.HandStudyGuide={"itemId":16489,"sourceHash":"5e9bb6a0fd4dd8c51a6a075696f6e38b4db8d8893489a82ab4d08b9e590c7dd9","contentHash":"597547deddedd995b2785aa7cdb76fefc6518e2878984b38c21e9a276660110e","overview":{"goal":"등차수열의 합을 이차식으로 나타내고 같은 합이 되는 두 첨자의 짝을 찾아 집합의 원소 수를 세어요.","firstLook":"\\(S_9=S_{18}\\)에서 첫째항과 공차의 관계를 먼저 구하면 \\(S_n\\)이 대칭인 이차식으로 간단해져요.","conditions":[{"label":"같은 두 합","meaning":"첫째항을 공차로 나타내고 대칭의 중심을 정해요."},{"label":"첫째항이 0이 아님","meaning":"공차도 0이 아니어서 서로 다른 합을 비교할 때 약분할 수 있어요."}]},"chapters":[{"id":"c1","label":"합의 식을 대칭인 꼴로 만들어요","stepIds":["s1","s2"],"question":"\\(S_n\\)은 어떤 이차식이 될까요?","hint":"첫째항을 \\(a\\), 공차를 \\(d\\)라 하고 \\(S_9=S_{18}\\)을 써요.","explanation":"\\(S_9=9(2a+8d)/2\\), \\(S_{18}=18(2a+17d)/2\\)이므로 같은 값으로 놓으면 \\(a=-13d\\)예요. 따라서 \\(S_n=n\\{2a+(n-1)d\\}/2=dn(n-27)/2\\)예요. 첫째항 \\(a\\ne0\\)이므로 \\(d\\ne0\\)이에요.","check":{"prompt":"\\(d=0\\)을 왜 제외할 수 있나요?","answer":"\\(a=-13d\\)이므로 \\(d=0\\)이면 첫째항 \\(a=0\\)이 되어 조건에 어긋나요."}},{"id":"c2","label":"같은 합을 만드는 첨자 짝을 찾아요","stepIds":["s3","s4"],"question":"\\(S_j=S_k\\)가 되는 서로 다른 첨자는 어떤 관계일까요?","hint":"\\(j(j-27)=k(k-27)\\)을 인수분해해요.","explanation":"\\(d\\ne0\\)이므로 \\(S_j=S_k\\)는 \\(j(j-27)=k(k-27)\\)와 같아요. 정리하면 \\((j-k)(j+k-27)=0\\)이어서, 서로 다른 첨자라면 \\(j+k=27\\)이에요. 따라서 \\(S_k=S_{27-k}\\)이고, \\(S_1,\\ldots,S_{13}\\)은 서로 달라요. \\(S_{14}=S_{13}\\)부터 \\(S_{26}=S_1\\)까지는 앞에서 나온 값의 반복이에요.","check":{"prompt":"\\(S_1,\\ldots,S_{13}\\)끼리 중복되지 않는 이유는 무엇인가요?","answer":"서로 다른 두 첨자의 합이 27이어야 중복되는데, 1부터 13 사이 두 수의 합은 많아야 25예요."}},{"id":"c3","label":"원소 수가 유지되는 범위를 정해요","stepIds":["s5","s6"],"question":"\\(|T_n|=13\\)인 자연수 \\(n\\)은 어디부터 어디까지일까요?","hint":"\\(n=13\\)에서 13개가 되고, \\(14\\)부터 \\(26\\)까지는 기존 값만 반복돼요.","explanation":"\\(n=13\\)에서 원소 수가 13이 되고, \\(14\\le n\\le26\\)에서는 새 값이 생기지 않아 계속 13이에요. 하지만 \\(S_{27}=d\\cdot27\\cdot0/2=0\\)이고, 앞의 \\(S_1,\\ldots,S_{26}\\)에는 0이 없으므로 새 원소가 추가돼요. 따라서 \\(|T_n|=13\\)은 \\(13\\le n\\le26\\)일 때뿐이에요.","check":{"prompt":"\\(S_{27}=0\\)이 앞의 값과 겹치지 않는 이유는 무엇인가요?","answer":"\\(S_k=dk(k-27)/2\\)에서 \\(d\\ne0\\)이고 \\(1\\le k\\le26\\)이면 두 인수 \\(k\\), \\(k-27\\)이 모두 0이 아니기 때문이에요."}},{"id":"c4","label":"가능한 자연수를 모두 더해요","stepIds":["s7"],"question":"\\(13\\)부터 \\(26\\)까지의 합은 얼마일까요?","hint":"첫 항과 끝 항의 평균에 항의 개수를 곱해요.","explanation":"항의 개수는 \\(26-13+1=14\\)개이므로 합은 \\((13+26)\\times14/2=39\\times7=273\\)이에요.","check":{"prompt":"끝값 \\(26\\)을 포함하는 이유는 무엇인가요?","answer":"\\(S_{26}=S_1\\)이라 새 원소가 생기지 않고 원소 수가 여전히 13이기 때문이에요."}}],"takeaway":["수열의 합이 이차식이면 같은 값을 만드는 두 첨자의 합이 일정한 대칭을 찾아요.","집합의 원소 수는 중복이 시작되는 지점과 새로운 값이 다시 생기는 지점을 따로 확인해요."]};</script>
