  <script>window.HandStudyRecord={"itemId":8785,"sourceLabel":"2019 교육청 고2 수학나형 11월 19번","adminYear":2019,"grade":2,"month":11,"number":19,"track":"수학나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"다음은 $21$ 이하의 서로 다른 $4$개의 자연수\n$a$, $b$, $c$, $d$$\\left( \\,a\\lt b\\lt c\\lt d \\right)$에 대하여 $2b=a+d$를 만족시키는 모든 순서쌍 $\\left( \\,a,\\,b,\\,c,\\,d \\right)$의 개수를 구하는 과정이다.\n세 자연수 $a$, $b$, $d$는 $2b=a+d$를 만족시키므로 \n이 순서대로 등차수열을 이룬다.\n이 등차수열의 공차가 될 수 있는 가장 작은 값은 $2$, \n가장 큰 값은 $\\left. {\\boxed{\\vphantom{(}\\,(\\text{가}) \\,}} \\right.$이다.\n이 등차수열의 공차를 $k$$\\left( 2 \\leq k \\leq \\left. {\\boxed{\\vphantom{(}\\,(\\text{가}) \\,}} \\right. \\, \\right)$라 하면\n$a\\lt a+k\\lt c\\lt a+2k$이므로\n$c$가 될 수 있는 모든 자연수의 개수는 $k-1$이고\n $a$가 될 수 있는 모든 자연수의 개수는 $\\left. {\\boxed{\\vphantom{(}\\,(\\text{나}) \\,}} \\right.$이다.\n따라서 구하는 모든 순서쌍 $\\left( \\,a,\\,b,\\,c,\\,d \\right)$의 개수는\n$\\sum\\limits_{k=2}^{{} {\\boxed{\\vphantom{(}\\,(\\text{가}) \\,}} } \\left\\{ \\left( \\,k-1 \\right) \\, \\times \\left( \\, {\\boxed{\\vphantom{(}\\,(\\text{나}) \\,}} \\, \\right) \\right\\} = {\\boxed{\\vphantom{(}\\,(\\text{다}) \\,}} \\,$\n위의 (가), (다)에 알맞은 수를 각각 $p$, $q$라 하고, \n(나)에 알맞은 식을 $f \\left( k \\right)$라 할 때, $p+q+f \\left( 3 \\right)$의 값은? [4점]\n① $304$ ② $307$ ③ $310$ ④ $313$ ⑤ $316$","answer":"③","sourceHash":"97241d3e997d6c7c83009fccd3230c442fece709f1858d719563418c0b9c7581","steps":[{"id":"s1","latex":"b=a+k,\\ d=a+2k,\\quad2\\le k\\le10"},{"id":"s2","latex":"\\#c=k-1,\\quad\\#a=21-2k"},{"id":"s3","latex":"q=\\sum_{k=2}^{10}(k-1)(21-2k)=285"},{"id":"s4","latex":"p+q+f(3)=10+285+15=310"}],"diagram":null,"contentHash":"9a65768c243a0e5f86479908c71bf4f032b838314b70330f7015246dcdac3c2a","questionHtml":"\u003cp class=\"hp\">다음은 \u003cspan class=\"heq\">\\(21\\)\u003c/span> 이하의 서로 다른 \u003cspan class=\"heq\">\\(4\\)\u003c/span>개의 자연수\u003cbr>\u003cspan class=\"heq\">\\(a\\)\u003c/span>, \u003cspan class=\"heq\">\\(b\\)\u003c/span>, \u003cspan class=\"heq\">\\(c\\)\u003c/span>, \u0
