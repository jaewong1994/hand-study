<script>window.HandStudyRecord={"itemId":16363,"sourceLabel":"2019 교육청 고3 수리나형 10월 21번","adminYear":2019,"grade":3,"month":10,"number":21,"track":"수리나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"최고차항의 계수가 $1\\,$인 삼차함수 $f \\left( x \\right) \\,$가 다음 조건을 만족시킨다.\n(가) 방정식 $f \\left( x \\right) \\,$$=0\\,$의 실근은 $\\alpha$, $\\beta\\,$($\\alpha<\\beta\\,$)뿐이다.(나) 함수 $f \\left( x \\right) \\,$의 극솟값은 $-4\\,$이다.\n<보기>에서 옳은 것만을 있는 대로 고른 것은? [4점]\n< 보 기 >ㄱ. $f' \\left( \\alpha \\right)$$=0\\,$ ㄴ. $\\beta \\,$$= \\alpha +3\\,$ ㄷ. $f \\left( 0 \\right)\\,$$=16\\,$이면 $\\alpha ^{\\,2} +\\beta ^{\\,2} =18\\,$이다.\n① ㄱ ② ㄱ, ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","answer":"②","sourceHash":"12a9bbbeb8ea14417574401a2290049921f8a2c33d89bed927454db216560d2d","steps":[{"id":"s1","latex":"f(x)=(x-\\alpha)^2(x-\\beta),\\qquad \\alpha<\\beta"},{"id":"s2","latex":"f\\prime(x)=(x-\\alpha)(3x-\\alpha-2\\beta)\\Rightarrow f\\prime(\\alpha)=0\\quad(\\mathrm I)"},{"id":"s3","latex":"\\text{극소가 되는 }x\\text{를 }t\\text{라 하면 }t=\\frac{\\alpha+2\\beta}{3}"},{"id":"s4","latex":"f(t)=-\\frac{4(\\beta-\\alpha)^3}{27}=-4\\Rightarrow\\beta-\\alpha=3\\quad(\\mathrm{II})"},{"id":"s5","latex":"f(0)=16\\Rightarrow-\\alpha^2(\\alpha+3)=16"},{"id":"s6","latex":"(\\alpha+4)(\\alpha^2-\\alpha+4)=0\\Rightarrow(\\alpha,\\beta)=(-4,-1)"},{"id":"s7","latex":"\\alpha^2+\\beta^2=17\\ne18\\quad(\\mathrm{III}\\text{ 거짓})"},{"id":"s8","latex":"\\boxed{\\mathrm{I,II}}"}],"diagram":null,"contentHash":"98ec9462e3e7c7bee7f8367c0dafd17ab314f22bd7880c461622233c61a40218","questionHtml":"<p class=\"hp\">최고차항의 계수가 <span class=\"heq\">\\(1\\,\\)<\/span>인 삼차함수 <span class=\"heq\">\\(f \\left( x \\right) \\,\\)<\/span>가 다음 조건을 만족시킨다.<\/p><div class=\"hbox\"><p class=\"hp\">(가)방정식 <span class=\"heq\">\\(f \\left( x \\right) \\,\\)<\/span><span class=\"heq\">\\(=0\\,\\)<\/span>의 실근은 <span class=\"heq\">\\(\\alpha\\)<\/span>, <span class=\"heq\">\\(\\beta\\,\\)<\/span>(<span class=\"heq\">\\(\\alpha\\lt \\beta\\,\\)<\/span>)뿐이다.<\/ <script>window.HandStudyGuide={"itemId":16363,"sourceHash":"12a9bbbeb8ea14417574401a2290049921f8a2c33d89bed927454db216560d2d","contentHash":"98ec9462e3e7c7bee7f8367c0dafd17ab314f22bd7880c461622233c61a40218","overview":{"goal":"실근이 두 개뿐인 최고차항 1의 삼차함수에서 중근을 정하고, 극솟값으로 두 근의 간격을 구해 보기를 판정해요.","firstLook":"삼차함수의 서로 다른 실근이 두 개뿐이면 한 근은 중근이에요. 극솟값이 음수이므로 작은 근이 중근인 모양을 먼저 그려 보세요.","conditions":[{"label":"실근 두 개","meaning":"\\(\\alpha\\)에서는 그래프가 \\(x\\)축에 닿고 \\(\\beta\\)에서는 가로지르므로 \\(f=(x-\\alpha)^2(x-\\beta)\\)예요."}]},"chapters":[{"id":"c1","label":"함수꼴과 극솟점 위치를 구해요","stepIds":["s1","s2","s3"],"question":"미분하면 두 임계점은 어디인가요?","hint":"인수분해된 꼴을 미분하세요.","explanation":"극솟값이 음수이고 \\(\\alpha<\\beta\\)이므로 \\(f(x)=(x-\\alpha)^2(x-\\beta)\\)예요. 미분하면 \\(f'(x)=(x-\\alpha)(3x-\\alpha-2\\beta)\\)여서 \\(f'(\\alpha)=0\\), ㄱ은 참이에요. 다른 임계점 \\((\\alpha+2\\beta)/3\\)이 두 근 사이의 극솟점이에요.","check":{"prompt":"왜 \\(\\beta\\)가 두 번 인수로 들어가는 꼴은 안 되나요?","answer":"그 꼴에서는 두 근 사이의 극값 배치가 달라져 주어진 음의 극솟값을 만들지 못해요."}},{"id":"c2","label":"극솟값으로 근 사이 거리를 구해요","stepIds":["s4"],"question":"극솟점에 대입하면 \\((\\beta-\\alpha)^3\\)이 어떻게 나오나요?","hint":"\\(d=\\beta-\\alpha\\)로 두고 두 인수를 각각 \\(d\\)의 배수로 쓰세요.","explanation":"극솟점에서 \\(x-\\alpha=2(\\beta-\\alpha)/3\\), \\(x-\\beta=-(\\beta-\\alpha)/3\\)이므로 극솟값은 \\(-4(\\beta-\\alpha)^3/27\\)이에요. 이것이 \\(-4\\)이므로 \\((\\beta-\\alpha)^3=27\\), 따라서 \\(\\beta=\\alpha+3\\)이고 ㄴ도 참이에요.","check":{"prompt":"\\(\\beta-\\alpha\\)가 \\(-3\\)이 아니라 3인 이유는 무엇인가요?","answer":"처음부터 \\(\\alpha<\\beta\\)라 차가 양수이기 때문이에요."}},{"id":"c3","label":"추가 조건으로 마지막 보기를 확인해요","stepIds":["s5","s6","s7","s8"],"question":"\\(f(0)=16\\)은 \\(\\alpha\\)에 관한 어떤 방정식을 주나요?","hint":"\\(\\beta=\\alpha+3\\)을 인수식에 넣으세요.","explanation":"\\(f(0)=(-\\alpha)^2(-\\beta)=-\\alpha^2(\\alpha+3)=16\\)이에요. 정리하면 \\((\\alpha+4)(\\alpha^2-\\alpha+4)=0\\)이고 이차식의 판별식은 음수이므로 \\(\\alpha=-4,\\beta=-1\\)이에요. 따라서 \\(\\alpha^2+\\beta^2=16+1=17\\ne18\\), ㄷ은 거짓이고 정답은 ②예요.","check":{"prompt":"이차인수에 실근이 없는 이유는 무엇인가요?","answer":"판별식 \\((-1)^2-16=-15<0\\)이기 때문이에요."}}],"takeaway":["삼차함수의 서로 다른 실근이 두 개면 어느 근이 두 번 인수로 들어가는지 그래프의 극값과 함께 판단해요.","극값을 근 사이 거리 하나로 나타내면 계산이 짧아져요."]};</script>
