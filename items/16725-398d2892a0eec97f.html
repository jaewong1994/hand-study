<script>window.HandStudyRecord={"itemId":16725,"sourceLabel":"2020 교육청 고3 수리가형 7월 30번","adminYear":2020,"grade":3,"month":7,"number":30,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"함수 $f \\left( x \\right) =\\sin \\frac{\\pi }{2} x$와 $0$이 아닌 두 실수 $a$, $b$에 대하여 함수 $g \\left( x \\right)$를\n $g \\left( x \\right) =e ^{af \\left( x \\right)} +bf \\left( x \\right) \\,(0\u003cx\u003c12)$\n라 하자. 함수 $g \\left( x \\right)$가 $x= \\alpha$에서 극대 또는 극소인 모든 $\\alpha$를 작은 수부터 크기순으로 나열한 것을 $\\alpha _{1}$, $\\alpha _{2}$, $\\alpha _{3}$, $\\cdots$, $\\alpha _{m}$($m$은 자연수)라 할 때, $m$ 이하의 자연수 $n$에 대하여 $\\alpha _{n}$은 다음 조건을 만족시킨다.\n(가) $n$이 홀수일 때, $\\alpha _{n} =n$이다.\n(나) $n$이 짝수일 때, $g \\left( \\alpha _{n} \\right) =0$이다. \n함수 $g \\left( x \\right)$가 서로 다른 두 개의 극댓값을 갖고 그 합이 $e ^{3} +e ^{-3}$일 때, $m \\pi \\int _{\\alpha _{3}} ^{\\alpha _{4}} {g \\left( x \\right) \\cos \\frac{\\pi }{2} xdx} =pe ^{3} +qe$이다. $p-q$의 값을 구하시오. (단, $p$와 $q$는 정수이다.) [4점]","answer":"48","sourceHash":"e27b7488711eda2d12c1dd9c5d9cc4682ee7769d5344f7e990848663ead3ca8d","steps":[{"id":"s1","latex":"g^{\\prime}=f^{\\prime}(ae^{af}+b)"},{"id":"s2","latex":"\\alpha_1=1,\\ m=12\\Rightarrow -1\u003cs=1/a\u003c0"},{"id":"s3","latex":"e^{as}+bs=0,\\ ae^{as}+b=0\\Rightarrow b=-ae"},{"id":"s4","latex":"e^3+e^{-3}\\Rightarrow a=-3,\\ b=3e"},{"id":"s5","latex":"12\\pi\\int_{-1}^{-1/3}(e^{-3u}+3eu)\\,2du/\\pi=8e^3-40e"},{"id":"s6","latex":"p-q=\\boxed{48}"}],"diagram":null,"contentHash":"35eaab25be8ff507bf5bcd8bb0e9125dd308c048463c01590ed8c4502fc55719","questionHtml":"\u003cp class=\"hp htall\">함수 \u003cspan class=\"heq\">\\(f \\left( x \\right) =\\sin \\dfrac{\\pi }{2} x\\)\u003c/span>와 \u003cspan class=\"heq\">\\(0\\)\u003c/span>이 아닌 두 실수 \u003cspan class=\"heq\">\\(a\\)\u003c/span>, \u003cspan class=\"heq\">\\(b\\)\u003c/span>에 대하여 함수 \u003cspan class=\"heq\">\\(g \\left( x \\right)\\)\u003c/span>를\u003c/p>\u003cp class=\"hp\">&emsp;\u003cspan class=\"heq\">\\(g \\left( x \\right) =e^{af \\left( x \\right)} +bf \\left( x \\right) \\,(0\\lt x\\lt 12)\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">라 하자. 함수 \u003cspan class=\"heq\">\\(g \\left( x \\right)\\)\u003c/span>가 \u003cspan class=\"heq\">\\(x= \\alpha\\)\u003c/span>에서 극대 또는 극소인 모든 \u003cspan class=\"heq\">\\(\\alpha\\)\u003c/span>를 작은 수부터 크기순으로 나열한 것을 \u003cspan class=\"heq\">\\(\\alpha_{1}\\)\u003c/span>, \u003cspan class=\"heq\">\\(\\alpha_{2}\\)\u003c/span>, \u003cspan class=\"heq\">\\(\\alpha_{3}\\)\u003c/span>, \u003cspan class=\"heq\">\\(\\cdots\\)\u003c/span>, \u003cspan class=\"heq\">\\(\\alpha_{m}\\)\u003c/span>(\u003cspan class=\"heq\">\\(m\\)\u003c/span>은 자연수)라 할 때, \u003cspan class=\"heq\">\\(m\\)\u003c/span> 이하의 자연수 \u003cspan class=\"heq\">\\(n\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(\\alpha_{n}\\)\u003c/span>은 다음 조건을 만족시킨다.\u003c/p>\u003cp class=\"hp\">\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) \u003cspan class=\"heq\">\\(n\\)\u003c/span>이 홀수일 때, \u003cspan class=\"heq\">\\(\\alpha_{n} =n\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp\">(나) \u003cspan class=\"heq\">\\(n\\)\u003c/span>이 짝수일 때, \u003cspan class=\"heq\">\\(g \\left( \\alpha_{n} \\right) =0\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003c/p>\u003cp class=\"hp htall\">함수 \u003cspan class=\"heq\">\\(g \\left( x \\right)\\)\u003c/span>가 서로 다른 두 개의 극댓값을 갖고 그 합이 \u003cspan class=\"heq\">\\(e^{3} +e^{-3}\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(m \\pi \\int_{\\alpha_{3}}^{\\alpha_{4}} {g \\left( x \\right) \\cos \\dfrac{\\pi }{2} xdx} =pe^{3} +qe\\)\u003c/span>이다. \u003cbr>\u003cspan class=\"heq\">\\(p-q\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(p\\)\u003c/span>와 \u003cspan class=\"heq\">\\(q\\)\u003c/span>는 정수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"398d2892a0eec97f81494cb7e9f3c1e075b8811528b164f6405e51c5f420be8e"};</script>
<script>window.HandStudyGuide={"itemId":16725,"sourceHash":"e27b7488711eda2d12c1dd9c5d9cc4682ee7769d5344f7e990848663ead3ca8d","contentHash":"35eaab25be8ff507bf5bcd8bb0e9125dd308c048463c01590ed8c4502fc55719","overview":{"goal":"합성된 함수의 극값 위치와 함숫값 조건으로 \\(a,b\\)를 정하고, 치환으로 정적분을 계산해요.","firstLook":"\\(g(x)\\)는 \\(f(x)\\)의 값만으로 정해져요. \\(f'(x)=0\\)인 홀수 위치와 \\(ae^{af(x)}+b=0\\)인 위치가 번갈아 극값을 만들어요.","conditions":[{"label":"(가)","meaning":"나열된 극값 위치 중 홀수 번째는 \\(1,3,5,\\ldots\\)로, \\(f'(x)=0\\)인 점들이에요."},{"label":"(나)","meaning":"짝수 번째 극값 위치에서는 도함수의 두 번째 인수가 \\(0\\)일 뿐 아니라 \\(g\\)의 값도 \\(0\\)이에요."},{"label":"두 극댓값","meaning":"\\(f=1\\)일 때와 \\(f=-1\\)일 때의 서로 다른 두 함숫값의 합이 주어져요."}]},"chapters":[{"id":"c1","label":"극값이 생기는 두 가지 길을 찾아요","stepIds":["s1","s2"],"question":"극값 위치가 왜 홀수 정수와 그 사이의 점으로 번갈아 나오고, 전체 개수는 왜 \\(12\\)일까요?","hint":"\\(g'(x)\\)를 두 인수로 나누고, \\(f(x)=\\sin(\\pi x/2)\\)가 길이 \\(12\\)에서 몇 번 반복되는지 봐요.","explanation":"미분하면 \\(g'(x)=f'(x)\\{ae^{af(x)}+b\\}\\)예요. 첫 인수 \\(f'(x)\\)는 \\(x=1,3,5,7,9,11\\)에서 \\(0\\)이 되고, 이것이 조건 (가)의 홀수 번째 극값 위치예요. 짝수 번째 위치에서는 두 번째 인수가 \\(0\\)이에요. 그때의 \\(f(x)\\) 값을 \\(s\\)라 두면, 홀수 정수 사이마다 \\(f\\)가 \\(1\\)에서 \\(-1\\)로 또는 반대로 움직일 때 \\(f(x)=s\\)를 한 번 만나야 해요. 따라서 \\(-1<s<0\\)이고 \\(0<x<12\\)에서 홀수 정수 6개와 그 사이의 점 6개가 번갈아 나와 \\(m=12\\)예요.","check":{"prompt":"\\(s\\)가 \\(-1\\)이나 \\(0\\)이면 왜 현재의 나열 구조와 맞지 않나요?","answer":"\\(s=-1\\)이면 이미 홀수 정수에서 생긴 극값 위치와 겹치고, \\(s=0\\)이면 뒤에서 얻는 \\(s=1/a\\)와 \\(a\\ne0\\)에 맞지 않아요. 조건의 짝수 번째 위치는 두 홀수 위치 사이에 따로 있어야 해요."}},{"id":"c2","label":"짝수 번째 조건으로 계수를 정해요","stepIds":["s3","s4"],"question":"짝수 번째 극값에서 도함숫값과 함숫값이 모두 \\(0\\)이라는 조건은 \\(a,b\\)를 어떻게 묶을까요?","hint":"\\(f(\\alpha_n)=s\\)라 두고 \\(g(\\alpha_n)=0\\)과 \\(g'(\\alpha_n)=0\\)에서 나온 두 식을 함께 풀어요.","explanation":"짝수 번째 위치에서는 \\(e^{as}+bs=0\\)이고, \\(f'(x)\\ne0\\)인 위치이므로 \\(ae^{as}+b=0\\)도 성립해요. 둘째 식에서 \\(b=-ae^{as}\\)를 첫째 식에 넣으면 \\(e^{as}(1-as)=0\\)이어서 \\(as=1\\)이에요. 따라서 \\(s=1/a\\), \\(b=-ae\\)예요. 앞에서 \\(-1<s<0\\)이므로 \\(a<-1\\)도 알 수 있어요.\n\n\\(f=1\\)과 \\(f=-1\\)에서 생기는 서로 다른 두 극댓값의 합은 \\(e^a+b+e^{-a}-b=e^a+e^{-a}\\)예요. 이것이 \\(e^3+e^{-3}\\)이고 \\(a<-1\\)이므로 \\(a=-3\\), \\(b=3e\\)로 정해져요.","check":{"prompt":"극댓값의 합에서 \\(b\\)가 사라지는 이유는 무엇인가요?","answer":"\\(f=1\\)일 때는 \\(g=e^a+b\\), \\(f=-1\\)일 때는 \\(g=e^{-a}-b\\)라서 두 값을 더하면 \\(+b\\)와 \\(-b\\)가 없어지기 때문이에요."}},{"id":"c3","label":"사인값을 새 변수로 바꿔 적분해요","stepIds":["s5","s6"],"question":"\\(\\alpha_3\\)부터 \\(\\alpha_4\\)까지의 적분이 왜 \\(-1\\)부터 \\(-1/3\\)까지의 적분으로 바뀔까요?","hint":"\\(u=f(x)\\)로 두면 \\(du=(\\pi/2)\\cos(\\pi x/2)dx\\)이고, 두 끝점의 \\(f\\) 값을 확인해요.","explanation":"\\(\\alpha_3=3\\)이므로 아래끝에서 \\(u=f(3)=-1\\)이에요. 다음 극값 위치 \\(\\alpha_4\\)에서는 \\(u=s=1/a=-1/3\\)이에요. \\(u=f(x)\\)로 두면 \\(du=\\frac\\pi2\\cos(\\pi x/2)dx\\)이므로\n\n\\(12\\pi\\int_{\\alpha_3}^{\\alpha_4}g(x)\\cos(\\pi x/2)dx=24\\int_{-1}^{-1/3}(e^{-3u}+3eu)du\\)\n\n예요. 부정적분은 \\(-\\frac13e^{-3u}+\\frac32eu^2\\)이고, 양 끝값을 넣으면 괄호 안 적분은 \\(e^3/3-5e/3\\)이에요. 여기에 \\(24\\)를 곱해 \\(8e^3-40e\\)를 얻어요. 따라서 \\(p=8\\), \\(q=-40\\)이므로 \\(p-q=48\\)이에요.","check":{"prompt":"마지막에 \\(p-q\\)가 \\(8-40\\)이 아니라 \\(48\\)인 이유는 무엇인가요?","answer":"식이 \\(8e^3-40e\\)이므로 \\(q=-40\\)이에요. 따라서 \\(p-q=8-(-40)=48\\)이에요."}}],"takeaway":["합성된 함수의 극값은 바깥 함수의 변화가 멈추는 경우와 안쪽 함수의 변화가 멈추는 경우를 나누어 찾아요.","같은 위치에서 함숫값과 도함숫값이 모두 \\(0\\)이면 두 식을 함께 풀어 매개변수 관계를 정해요.","적분에 안쪽 함수의 도함수가 보이면 새 변수와 두 끝값을 함께 바꿔요."]};</script>
