  <script>window.HandStudyRecord={"itemId":16211,"sourceLabel":"2019 교육청 고3 수리가형 10월 19번","adminYear":2019,"grade":3,"month":10,"number":19,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 한 모서리의 길이가 $1\\,$인 정사면체 $A B C D\\,$에서 선분 $A B\\,$의 중점을 $M$, 선분 $C D\\,$를 $3:1\\,$로 내분하는 점을 $N\\,$이라 하자. 선분 $A C$ 위에 ${\\overline{\\mp}} + {\\overline{PN}} \\,$의 값이 최소가 되도록 점 $P\\,$를 잡고, 선분 $A D$ 위에 ${\\overline{MQ}} + {\\overline{QN}}$의 값이 최소가 되도록 점 $Q\\,$를 잡는다. 삼각형 $M P Q\\,$의 평면 $B C D$ 위로의 정사영의 넓이는?\n[4점]\n① $\\frac{\\sqrt{3}}{30}$ ② $\\frac{\\sqrt{3}}{15}$ ③ $\\frac{\\sqrt{3}}{10}$ ④ $\\frac{2 \\sqrt{3}}{15}$ ⑤ $\\frac{\\sqrt{3}}{6}$","answer":"②","sourceHash":"29e2c9e82c34a64435a83a036ed63f63d806ceea419637d2f1505159de7375bb","steps":[{"id":"s1","latex":"h=\\sqrt3/2:\\quad\\text{두 면을 }AC\\text{에서 전개하여 }A=(0,0),C=(1,0),B=(1/2,h),D=(1/2,-h)"},{"id":"s2","latex":"M=(1/4,h/2),\\quad N=(5/8,-3h/4),\\quad P=MN\\cap AC=(2/5,0)"},{"id":"s3","latex":"AD\\text{에서 전개하면 }M=(1/4,h/2),\\ N=(7/8,-h/4)\\Rightarrow AQ/AD=2/3"},{"id":"s4","latex":"A'\\text{는 }BCD\\text{의 무게중심},\\quad A'B=A'C=A'D=1/\\sqrt3"},{"id":"s5","latex":"A'M'=1/(2\\sqrt3),\\quad A'P'=2/(5\\sqrt3),\\quad A'Q'=2/(3\\sqrt3)"},{"id":"s6","latex":"[M'P'Q']=\\tfrac12\\sin120^\\circ\\{1/15+4/45+1/9\\}=\\sqrt3/15"}],"diagram":null,"contentHash":"43f4928b4dac5f5e7abe61753a01ed9d47744d8b527fdc78d7036f08f92266a1","questionHtml":"\u003cp class=\"hp htall\">그림과 같이 한 모서리의 길이가 \u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>인 정사면체 \u003cspan class=\"heq\">\\(A B C D\\,\\)\u003c/span>에서 선분 \u003cspan class=\"heq\">\\(A B\\,\\)\u003c/span>의 중점을 \u003cspan class=\"heq\">\\(M\\)\u003c/span>, 선분 \u003cspan class=\"heq\">\\(C D\\,\\)\u003c/span>를 \u003cspan class=\"heq\">\\(3:1\\,\\)\u003c/span>로 내분하는 점을 \u003cspan class=\"heq\">\\(N\\,\\)\u003c/span>이라 하자. 선분 \u003cspan class=\"heq\">\\(A C\\)\u003c/span> 위에 \u003cspan class=\"heq\">\\({\\overline{MP}} + {\\overline{PN}} \\,\\)\u003c/span>의 값이 최소가 되도록 점 \u0
