<script>window.HandStudyRecord={"adminYear":2019,"answer":"29","contentHash":"c7e22e566c9b1b1deaac5115c62fdb571fd9dfd9bcb56180ae27d9767a5c330f","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24670,"month":11,"number":29,"points":4,"preview":false,"questionHtml":"\u003cp>좌표공간에서 두 점 \u003cspan class=\"heq\">\\({A}(3,\\, - 3,\\, 3)\\)\u003c/span>, \u003cspan class=\"heq\">\\({B}(- 2,\\, 7,\\, - 2)\\)\u003c/span>에 대하여 선분 \u003cspan class=\"heq\">\\({A B}\\)\u003c/span>를 포함하고 구 \u003cspan class=\"heq\">\\(x^{2}+y^{2}+z^{2}=1\\)\u003c/span>에 접하는 두 평면을 \u003cspan class=\"heq\">\\(\\alpha\\)\u003c/span>, \u003cspan class=\"heq\">\\(\\beta\\)\u003c/span> 라 하자. 두 평면 \u003cspan class=\"heq\">\\(\\alpha\\)\u003c/span> , \u003cspan class=\"heq\">\\(\\beta\\)\u003c/span> 와 구 \u003cspan class=\"heq\">\\(x^{2}+y^{2}+z^{2}=1\\)\u003c/span>의 접점을 각각 \u003cspan class=\"heq\">\\({ C}\\)\u003c/span>, \u003cspan class=\"heq\">\\({D}\\)\u003c/span>라 할 때, 사면체 \u003cspan class=\"heq\">\\({A B C D}\\)\u003c/span>의 부피는 \u003cspan class=\"heq\">\\(\\frac{q \\sqrt{3}}{p}\\)\u003c/span>이다. \u003cspan class=\"heq\">\\(p +q\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(p\\)\u003c/span> 와 \u003cspan class=\"heq\">\\(q\\)\u003c/span> 는 서로소인 자연수이다.) [4점]\u003c/p>","questionText":"좌표공간에서 두 점 ${A}(3,\\, - 3,\\, 3)$, ${B}(- 2,\\, 7,\\, - 2)$에 대하여 선분 ${A B}$를 포함하고 구 $x^{2}+y^{2}+z^{2}=1$에 접하는 두 평면을 $\\alpha$, $\\beta$ 라 하자. 두 평면 $\\alpha$ , $\\beta$ 와 구 $x^{2}+y^{2}+z^{2}=1$의 접점을 각각 ${ C}$, ${D}$라 할 때, 사면체 ${A B C D}$의 부피는 $\\frac{q \\sqrt{3}}{p}$이다. $p +q$의 값을 구하시오. (단, $p$ 와 $q$ 는 서로소인 자연수이다.) [4점]","sourceHash":"e282f5865825473c3e976dbcbabc91b660deeb8daa5c909589a9cb4387b407e6","sourceKind":"csat","sourceLabel":"2019년 시행 수능 · 2020학년도 · 가형 · 29번","steps":[{"id":"s1","latex":"\\vec u=(1,-2,1),\\quad\\mathrm P=(3+t,-3-2t,3+t)\\in\\mathrm{AB}"},{"id":"s2","latex":"\\overrightarrow{\\mathrm{OP}}\\cdot\\vec u=12+6t=0\\ \\Rightarrow\\ t=-2,\\quad\\mathrm P=(1,1,1)"},{"id":"s3","latex":"\\mathrm{OP}=\\sqrt3,\\quad\\mathrm{AB}=5\\sqrt6"},{"id":"s4","latex":"\\mathrm{OC}\\perp\\alpha,\\quad\\mathrm{OD}\\perp\\beta\\ \\Rightarrow\\ \\mathrm{OC},\\mathrm{OD},\\mathrm{OP}\\perp\\mathrm{AB}"},{"id":"s5","latex":"\\text{평면 }\\mathrm{OCDP}\\text{는 }\\mathrm{AB}\\text{에 수직이고 }\\mathrm{PC}=\\mathrm{PD}=\\sqrt{3-1}=\\sqrt2"},{"id":"s6","latex":"\\mathrm H=\\mathrm{CD}\\cap\\mathrm{OP}:\\quad\\mathrm{OH}=\\frac{\\mathrm{OC}^2}{\\mathrm{OP}}=\\frac1{\\sqrt3}"},{"id":"s7","latex":"\\mathrm{PH}=\\frac2{\\sqrt3},\\quad\\mathrm{CH}=\\mathrm{DH}=\\sqrt{1-\\frac13}=\\frac{\\sqrt2}{\\sqrt3}"},{"id":"s8","latex":"[\\triangle\\mathrm{PCD}]=\\frac12\\cdot\\frac{2\\sqrt2}{\\sqrt3}\\cdot\\frac2{\\sqrt3}=\\frac{2\\sqrt2}{3}"},{"id":"s9","latex":"\\mathrm P\\text{는선분 }\\mathrm{AB}\\text{의 내부에 있으므로 }V=\\frac13[\\triangle\\mathrm{PCD}]\\cdot\\mathrm{AB}"},{"id":"s10","latex":"V=\\frac13\\cdot\\frac{2\\sqrt2}3\\cdot5\\sqrt6=\\frac{20\\sqrt3}{9}\\ \\Rightarrow\\ \\boxed{p+q=29}"}],"track":"가형"};</script>
<script>window.HandStudyGuide={"itemId":24670,"sourceHash":"e282f5865825473c3e976dbcbabc91b660deeb8daa5c909589a9cb4387b407e6","contentHash":"c7e22e566c9b1b1deaac5115c62fdb571fd9dfd9bcb56180ae27d9767a5c330f","overview":{"goal":"직선 AB에서 원점에 가장 가까운 점을 찾고, 그 점을 지나는 수직 단면에서 두 접점과 이루는 삼각형의 넓이를 구해 사면체 부피를 계산해요.","firstLook":"두 접평면은 모두 직선 \\(AB\\)를 포함해요. \\(AB\\)와 원점 사이의 가장 짧은 선분을 기준으로 수직 단면을 자르면 공간 문제가 한 원에 그은 두 접선 문제로 바뀌어요.","conditions":[{"label":"구","meaning":"중심은 원점 O이고 반지름은 1이에요."},{"label":"두 접평면","meaning":"각 평면은 직선 \\(AB\\)를 포함하면서 구에 한 점에서 접해요."},{"label":"부피 표현","meaning":"마지막 부피를 서로소인 자연수 \\(p,q\\)로 \\(\\frac{q\\sqrt3}{p}\\) 꼴로 정리해요."}]},"chapters":[{"id":"c1","label":"직선 AB의 방향과 수선의 발을 구해요","stepIds":["s1","s2","s3"],"question":"원점에서 직선 \\(AB\\)에 내린 수선의 발 \\(P\\)는 어디일까요?","hint":"\\(\\overrightarrow{AB}=5(-1,2,-1)\\)이므로 간단한 방향벡터를 잡고 \\(OP\\perp AB\\)를 써요.","explanation":"\\(\\overrightarrow{AB}=(-5,10,-5)\\)이므로 방향벡터를 \\(\\vec u=(1,-2,1)\\)로 잡을 수 있어요. 직선 위의 점을 \\(P=(3+t,-3-2t,3+t)\\)라 두어요.\n\n\\(OP\\perp AB\\)이므로 좌표의 곱을 더하면 \\((3+t)+2(3+2t)+(3+t)=12+6t=0\\)이에요. 따라서 \\(t=-2\\), \\(P=(1,1,1)\\)이고 \\(OP=\\sqrt3\\)이에요. 또 \\(|\\overrightarrow{AB}|=\\sqrt{25+100+25}=5\\sqrt6\\)이에요. \\(t=-2\\)는 \\(A\\)에서 \\(B\\)까지의 매개변수 범위 안에 있으므로 \\(P\\)는 선분 \\(AB\\)의 내부에 있어요.","check":{"prompt":"\\(P=(1,1,1)\\)에서 \\(OP\\)의 길이는 얼마인가요?","answer":"\\(\\sqrt{1^2+1^2+1^2}=\\sqrt3\\)이에요."}},{"id":"c2","label":"수직 단면에서 두 접점을 살펴봐요","stepIds":["s4","s5"],"question":"왜 O,P,C,D가 한 평면에 놓이고 그 평면이 AB에 수직일까요?","hint":"접점의 반지름은 접평면에 수직이고, 접평면 안에는 AB가 들어 있어요.","explanation":"반지름 \\(OC\\)는 접평면 \\(\\alpha\\)에 수직이고 \\(AB\\subset\\alpha\\)이므로 \\(OC\\perp AB\\)예요. 같은 이유로 \\(OD\\perp AB\\)이고, 앞에서 \\(OP\\perp AB\\)였어요. 한 점 \\(O\\)를 지나 \\(AB\\)에 수직인 평면은 하나이므로 \\(O,C,D,P\\)가 그 평면에 놓여요.\n\n이 단면에서 \\(PC\\)와 \\(PD\\)는 반지름 \\(1\\)인 원에 점 \\(P\\)에서 그은 두 접선이에요. 직각삼각형 \\(OPC\\)에서 \\(PC^2=OP^2-OC^2=3-1=2\\)이므로 \\(PC=PD=\\sqrt2\\)예요.","check":{"prompt":"접선의 길이 PC와 PD가 같은 이유는 무엇인가요?","answer":"한 점 P에서 같은 원에 그은 두 접선의 길이는 같기 때문이에요."}},{"id":"c3","label":"접점 현의 길이와 단면 삼각형 넓이를 구해요","stepIds":["s6","s7","s8"],"question":"삼각형 \\(PCD\\)의 밑변과 높이는 각각 얼마일까요?","hint":"접점 현 \\(CD\\)와 \\(OP\\)의 교점을 \\(H\\)라 하면 \\(CD\\perp OP\\)이고 \\(OC^2=OH\\cdot OP\\)예요.","explanation":"두 접점은 \\(OP\\)에 대하여 대칭이므로 \\(CD\\perp OP\\)이고 \\(H=CD\\cap OP\\)는 \\(CD\\)의 중점이에요. 직각삼각형 \\(OPC\\)에서 높이의 성질을 쓰면 \\(OC^2=OH\\cdot OP\\)이므로 \\(OH=1/\\sqrt3\\)이에요.\n\n따라서 \\(PH=OP-OH=\\sqrt3-1/\\sqrt3=2/\\sqrt3\\)이고, 직각삼각형 \\(OHC\\)에서 \\(CH=\\sqrt{OC^2-OH^2}=\\sqrt{1-1/3}=\\sqrt2/\\sqrt3\\)예요. 그러므로 \\(CD=2CH=2\\sqrt2/\\sqrt3\\)이고\n\\[\n[\\triangle PCD]=\\frac12\\cdot CD\\cdot PH\n=\\frac12\\cdot\\frac{2\\sqrt2}{\\sqrt3}\\cdot\\frac2{\\sqrt3}\n=\\frac{2\\sqrt2}{3}.\n\\]","check":{"prompt":"\\(H\\)가 \\(CD\\)의 중점이므로 \\(CD\\)는 \\(CH\\)의 몇 배인가요?","answer":"두 배이므로 \\(CD=2\\sqrt2/\\sqrt3\\)예요."}},{"id":"c4","label":"AB를 높이로 써 사면체 부피를 구해요","stepIds":["s9","s10"],"question":"왜 사면체 \\(ABCD\\)의 부피를 \\(\\frac13[\\triangle PCD]\\cdot AB\\)로 계산할 수 있을까요?","hint":"평면 \\(PCD\\)가 \\(AB\\)에 수직이고 \\(P\\)가 선분 \\(AB\\) 안에 있어요.","explanation":"평면 \\(PCD\\)는 \\(AB\\)에 수직이고 \\(P\\)가 선분 \\(AB\\) 안에 있으므로 사면체 \\(ABCD\\)를 \\(APCD\\)와 \\(BPCD\\)로 나눌 수 있어요. 두 사면체의 높이는 각각 \\(AP,PB\\)이고 합이 \\(AB\\)이므로 전체 부피는 \\(\\frac13[\\triangle PCD](AP+PB)=\\frac13[\\triangle PCD]\\cdot AB\\)예요.\n\n따라서 \\(V=\\frac13\\cdot\\frac{2\\sqrt2}{3}\\cdot5\\sqrt6=\\frac{10\\sqrt{12}}9=\\frac{20\\sqrt3}{9}\\)예요. \\(p=9,q=20\\)은 서로소이므로 \\(p+q=29\\)예요.","check":{"prompt":"\\(\\sqrt2\\cdot\\sqrt6\\)을 간단히 하면 무엇인가요?","answer":"\\(\\sqrt{12}=2\\sqrt3\\)이므로 분자는 \\(20\\sqrt3\\)이 돼요."}}],"takeaway":["공간에서 한 직선과 구가 함께 나오면 그 직선에 수직인 단면으로 접선 문제를 만들 수 있어요.","한 점에서 그은 두 접선의 접점 현은 중심과 그 점을 이은 선에 수직이에요.","수직 단면이 사면체의 한 변과 직교하면 그 변을 높이의 합으로 써 부피를 계산할 수 있어요."]};</script>
