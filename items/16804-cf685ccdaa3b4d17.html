  <script>window.HandStudyRecord={"itemId":16804,"sourceLabel":"2020 교육청 고3 수리나형 4월 19번","adminYear":2020,"grade":3,"month":4,"number":19,"track":"수리나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"매주 월요일부터 수요일까지 총 $4$주에 걸쳐 서로 다른 세 종류의 봉사활동 $A,\\,B,\\,C$를 반드시 하루에 한 종류씩 다음 규칙에 따라 신청하려고 한다.\n[그림 1]\n◦ 봉사활동 $A,\\,B,\\,C$를 각각 $3$회, $3$회, $6$회 신청한다.\n◦ 첫째 주에는 봉사활동 $A,\\,B,\\,C$를 모두 신청한다.\n◦ 같은 요일에는 두 종류 이상의 봉사활동을 신청한다.\n다음은 봉사활동을 신청하는 경우의 수를 구하는 과정이다.\n규칙에 따라 봉사활동을 신청하는 경우는\n첫째 주에 봉사활동 $A,\\,B,\\,C$를 모두 신청한 후\n‘(ⅰ) 첫째 주를 제외한 $3$주간의 봉사활동을 신청하는 경우’\n에서 ‘(ⅱ) 첫째 주에 봉사활동 $C$를 신청한 요일과 같은 요일에 모두 봉사활동 $C$를 신청하는 경우’를 제외하면 된다.\n첫째 주에 봉사활동 $A,\\,B,\\,C$를 모두 신청하는 경우의 수는 $3!$이다.\n(ⅰ)의 경우 :\n봉사활동 $A,\\,B,\\,C$를 각각 $2$회, $2$회, $5$회 신청하는 \n경우의 수는 ${\\boxed{\\vphantom{(}\\,(\\text{가})\\,}} \\,$이다.\n(ⅱ)의 경우 : \n첫째 주에 봉사활동 $C$를 신청한 요일과 같은 요일에 \n모두 봉사활동 $C$를 신청하는 경우의 수는 ${\\boxed{\\vphantom{(}\\,(\\text{나})\\,}} \\,$이다.\n(ⅰ), (ⅱ)에 의해\n구하는 경우의 수는 $3! \\times \\left( \\, {\\boxed{\\vphantom{(}\\,(\\text{가})\\,}} \\,- {\\boxed{\\vphantom{(}\\,(\\text{나})\\,}} \\, \\right)$이다.\n위의 (가), (나)에 알맞은 수를 각각 $p,\\,q$라 할 때, $p+q$의 값은?\n[4점]\n① $825$ ② $832$ ③ $839$ ④ $846$ ⑤ $853$","answer":"④","sourceHash":"c8a1707a857158cb67b0a4d94c44e594cd91295870b2b5f53c05c2109c2d5f65","steps":[{"id":"s1","latex":"p=9!/(2!2!5!)=756"},{"id":"s2","latex":"q=6!/(2!2!2!)=90"},{"id":"s3","latex":"p+q=846"},{"id":"s4","latex":"\\boxed{846}"}],"diagram":null,"contentHash":"e3131727543d9e765076ee6c5440840383293c29422c0a9e7e596225fc158289","questionHtml":"\u003cp class=\"hp\">매주 월요일부터 수요일까지 총 \u003cspan class=\"heq\">\\(4\\)\u003c/span>주에 걸쳐 서로 다른 세 종류의 봉사활동 \u003cspan class=\"heq\">\\(A,\\,B,\\,C\\)\u003c/span>를 반드시 하루에 한 종류씩 다음 규칙에 따라 신청하려고 한다.\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/86df25542de96f963f44e53c.png\" style=\"width:273px;max-width:100%\">\u003c/p>\u003cp class=\"hp\">\u003cdiv class=\"hbox\">\u003cp class=\"hp\">◦ 봉사활동 \u003cspan class=\"heq\">\\(A,\\,B,\\,C\\)\u003c/span>를 각각 \u003cspan class=\"heq\">\\(3\\)\u003c/span>회, \u003cspan class=\"heq\">\\(3\\)\u003c/span>회, \u003cspan class=\"heq\">\\(6\\)\u003c/span>회 신청한다.\u003c/p>\u003cp class=\"hp\">◦ 첫째 주에는 봉사활동 \u003cspan class=\"heq\">\\(A,\\,B,\\,C\\)\u003c/span>를 모두 신청한다.\u003c/p>\u003cp class=\"hp\">◦ 같은 요일에는 두 종류 이상의 봉사활동을 신청한다.\u003c/p>\u003c/div>\u003c/p>\u003cp class=\"hp\">다음은 봉사활동을 신청하는 경우의 수를 구하는 과정이다.\u003c/p>\u003cp class=\"hp htall\">\u003cdiv class=\"hbox\">\u003cp class=\"hp\">규칙에 따라 봉사활동을 신청하는 경우는\u003c/p>\u003cp class=\"hp\">첫째 주에 봉사활동 \u003cspan class=\"heq\">\\(A,\\,B,\\,C\\)\u003c/span>를 모두 신청한 후\u003c/p>\u003cp class=\"hp\">‘(ⅰ) 첫째 주를 제외한 \u003cspan class=\"heq\">\\(3\\)\u003c/span>주간의 봉사활동을 신청하는 경우’\u003c/p>\u003cp class=\"hp\">에서 ‘(ⅱ) 첫째 주에 봉사활동 \u003cspan class=\"heq\">\\(C\\)\u003c/span>를 신청한 요일과 같은 요일에 모두 봉사활동 \u003cspan class=\"heq\">\\(C\\)\u003c/span>를 신청하는 경우’를 제외하면 된다.\u003c/p>\u003cp class=\"hp\">첫째 주에 봉사활동 \u003cspan class=\"heq\">\\(A,\\,B,\\,C\\)\u003c/span>를 모두 신청하는 경우의 수는 \u003cspan class=\"heq\">\\(3!\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp htall\">(ⅰ)의 경우 :\u003cbr>봉사활동 \u003cspan class=\"heq\">\\(A,\\,B,\\,C\\)\u003c/span>를 각각 \u003cspan class=\"heq\">\\(2\\)\u003c/span>회, \u003cspan class=\"heq\">\\(2\\)\u003c/span>회, \u003cspan class=\"heq\">\\(5\\)\u003c/span>회 신청하는 \u003cbr>경우의 수는 \u003cspan class=\"heq\">\\({\\boxed{\\vphantom{(}\\,(\\text{가})\\,}} \\,\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp htall\">(ⅱ)의 경우 : \u003cbr>첫째 주에 봉사활동 \u003cspan class=\"heq\">\\(C\\)\u003c/span>를 신청한 요일과 같은 요일에 \u003cbr>모두 봉사활동 \u003cspan class=\"heq\">\\(C\\)\u003c/span>를 신청하는 경우의 수는 \u003cspan class=\"heq\">\\({\\boxed{\\vphantom{(}\\,(\\text{나})\\,}} \\,\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp\">(ⅰ), (ⅱ)에 의해\u003c/p>\u003cp class=\"hp htall\">구하는 경우의 수는 \u003cspan class=\"heq\">\\(3! \\times \\left( \\, {\\boxed{\\vphantom{(}\\,(\\text{가})\\,}} \\,- {\\boxed{\\vphantom{(}\\,(\\text{나})\\,}} \\, \\right)\\)\u003c/span>이다.\u003
