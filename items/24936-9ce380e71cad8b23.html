<script>window.HandStudyGuide={"itemId":24936,"sourceHash":"e29b476ca79a180a12663ebf1f18a9c979a398791611bdde43136ed7a8ffe428","contentHash":"9449d51fd49f94585f47a79007fc2efa6b3c38072a74203c46f14d4720fd3f8d","overview":{"goal":"두 무한급수로 등비수열을 정하고 부호가 반복되는 합의 극한을 계산해요.","firstLook":"\\(|a_n|+a_n\\)과 \\(|a_n|-a_n\\)을 더하고 빼면 절댓값 합과 원래 합이 나와요.","conditions":[{"label":"두 급수의 합","meaning":"\\(\\sum|a_n|=10\\), \\(\\sum a_n=10/3\\)으로 바꿔요."},{"label":"네 항마다 반복되는 부호","meaning":"같은 부호인 두 항씩 묶어 새 등비급수를 만들어요."}]},"chapters":[{"id":"c1","label":"공비와 첫째항 찾기","stepIds":["s1","s2","s3","s4"],"question":"공비가 음수여야 하는 이유는 무엇인가요?","hint":"공비가 0 이상이면 \\(a_n\\)과 \\(|a_n|\\)의 합을 비교하세요.","explanation":"두 식을 더하고 빼면 \\(\\sum|a_n|=10\\), \\(\\sum a_n=10/3\\)예요. 후자가 양수이므로 \\(a_1>0\\). 공비가 0 이상이면 두 합이 같아져 모순이므로 \\(-1<r<0\\)예요. 등비급수 공식을 비교하면 \\(10(1+r)=\\frac{10}{3}(1-r)\\), 따라서 \\(r=-1/2,a_1=5\\)예요.","check":{"prompt":"수렴 조건에서 공비의 범위는 무엇인가요?","answer":"절댓값 급수도 수렴하므로 \\(|r|<1\\)예요."}},{"id":"c2","label":"부호 두 항씩 묶기","stepIds":["s5","s6","s7","s8"],"question":"왜 \\(k=2j-1,2j\\)를 한 쌍으로 묶나요?","hint":"앞의 부호를 네 항까지 적어 보세요.","explanation":"부호는 \\(-,-,+,+\\)로 반복되므로 두 항씩 같은 부호예요. 한 쌍의 합은 \\(a_{m+2j-1}(1+r)\\)이고 쌍 사이 공비는 \\(-r^2=-1/4\\)예요. 무한합을 계산하면 전체 극한이 \\((-1/2)^{m-1}\\)로 정리돼요.","check":{"prompt":"쌍 사이의 공비가 왜 \\(-1/4\\)인가요?","answer":"원래 두 칸 이동으로 \\(r^2=1/4\\)가 곱해지고, 쌍의 앞 부호가 번갈아 바뀌어 음수가 붙어요."}},{"id":"c3","label":"부등식과 자연수 범위","stepIds":["s9","s10","s11"],"question":"부등식이 성립하려면 \\(m\\)의 홀짝은 어떻게 되어야 하나요?","hint":"오른쪽은 양수예요.","explanation":"\\((-1/2)^{m-1}>1/700\\)이므로 지수 \\(m-1\\)은 짝수, 즉 \\(m\\)은 홀수여야 해요. 크기는 \\(2^{m-1}<700\\)이고 \\(2^8<700<2^{10}\\)이므로 \\(m=1,3,5,7,9\\). 합은 25예요.","check":{"prompt":"\\(m=11\\)은 왜 제외되나요?","answer":"\\(2^{10}=1024>700\\)이라 \\(2^{-10}<1/700\\)이기 때문이에요."}}],"takeaway":["절댓값이 섞인 두 식은 합과 차로 분리해요.","주기적 부호는 같은 부호인 항을 묶으면 등비급수가 보여요."]};</script>
