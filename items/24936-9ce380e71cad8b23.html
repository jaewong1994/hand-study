  <script>window.HandStudyRecord={"adminYear":2024,"answer":"25","contentHash":"9449d51fd49f94585f47a79007fc2efa6b3c38072a74203c46f14d4720fd3f8d","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24936,"month":11,"number":29,"points":4,"preview":false,"questionHtml":"\u003cp>등비수열 \u003cspan class=\"heq\">\\(\\left\\{a_{n} \\right\\}\\,\\)\u003c/span>이\u003c/p>\u003cp> \u003cspan class=\"heq\">\\(\\sum _{n=1} ^{\\infty } \\left( \\left|\\, a _{n} \\,\\right| +a _{n} \\right) = \\frac{40}{3}\\)\u003c/span>, \u003cspan class=\"heq\">\\(\\, \\sum _{n=1} ^{\\infty } \\left( \\left|\\, a _{n} \\,\\right| -a _{n} \\right) = \\frac{20}{3}\\)\u003c/span>\u003c/p>\u003cp>을 만족시킨다. 부등식\u003c/p>\u003cp> \u003cspan class=\"heq\">\\(\\lim _{n \\,\\rightarrow\\, \\infty } \\sum_{k=1}^{2 n} \\left( \\left(-1 \\right)^{\\frac{k \\left(k+1 \\right)}{2}} \\times a_{m+k} \\right)&gt;\\frac{1}{700}\\)\u003c/span>\u003c/p>\u003cp>을 만족시키는 모든 자연수 \u003cspan class=\"heq\">\\(m\\,\\)\u003c/span>의 값의 합을 구하시오. [4점]\u003c/p>","questionText":"등비수열 $\\left\\{a_{n} \\right\\}\\,$이\n $\\sum _{n=1} ^{\\infty } \\left( \\left|\\, a _{n} \\,\\right| +a _{n} \\right) = \\frac{40}{3}$, $\\, \\sum _{n=1} ^{\\infty } \\left( \\left|\\, a _{n} \\,\\right| -a _{n} \\right) = \\frac{20}{3}$\n을 만족시킨다. 부등식\n $\\lim _{n \\,\\rightarrow\\, \\infty } \\sum_{k=1}^{2 n} \\left( \\left(-1 \\right)^{\\frac{k \\left(k+1 \\right)}{2}} \\times a_{m+k} \\right)>\\frac{1}{700}$\n을 만족시키는 모든 자연수 $m\\,$의 값의 합을 구하시오. [4점]","sourceHash":"e29b476ca79a180a12663ebf1f18a9c979a398791611bdde43136ed7a8ffe428","sourceKind":"csat","sourceLabel":"2024년 시행 수능 · 2025학년도 · 미적분 · 29번","steps":[{"id":"s1","latex":"\\sum_{n=1}^{\\infty}|a_n|=10,\\quad\\sum_{n=1}^{\\infty}a_n=\\frac{10}{3}"},{"id":"s2","latex":"-1\u003cr\u003c1,\\quad\\frac{|a_1|}{1-|r|}=10,\\quad\\frac{a_1}{1-r}=\\frac{10}{3}>0\\quad\\Rightarrow\\quad a_1>0"},{"id":"s3","latex":"r\\ge0\\text{이면 두 합이 같아 모순}\\quad\\Rightarrow\\quad-1\u003cr\u003c0"},{"id":"s4","latex":"10(1+r)=\\frac{10}{3}(1-r)\\quad\\Rightarrow\\quad r=-\\frac12,\\quad a_1=5"},{"id":"s5","latex":"(-1)^{(2j-1)2j/2}=(-1)^{2j(2j+1)/2}=(-1)^j"},{"explanation":{"body":"\\(k=1,2,3,4\\)를 넣으면 앞의 부호가 차례로 \\(-,-,+,+\\)예요. 그래서 \\(k=2j-1,2j\\)인 두 항을 한 쌍으로 묶어요. 두 지수의 홀짝이 모두 \\(j\\)의 홀짝과 같아서 공통 부호 \\((-1)^j\\)를 밖으로 꺼낼 수 있어요. 그다음 \\(a_{m+2j}=ra_{m+2j-1}\\)를 쓰면 쌍의 합도 등비수열로 정리돼요.","skillTags":["series.grouping","sequence.geometric"],"title":"부호가 같은 두 항씩 묶어 볼게요"},"id":"s6","latex":"\\sum_{k=1}^{2n}(-1)^{k(k+1)/2}a_{m+k}=\\sum_{j=1}^{n}(-1)^j(a_{m+2j-1}+a_{m+2j})"},{"id":"s7","latex":"=\\frac52\\left(-\\frac12\\right)^{m-2}\\sum_{j=1}^{n}\\left(-\\frac14\\right)^j"},{"id":"s8","latex":"\\lim_{n\\to\\infty}\\sum_{k=1}^{2n}(-1)^{k(k+1)/2}a_{m+k}=\\left(-\\frac12\\right)^{m-1}"},{"id":"s9","latex":"\\left(-\\frac12\\right)^{m-1}>\\frac1{700}\\quad\\Rightarrow\\quad m\\text{는 홀수},\\quad2^{m-1}\u003c700"},{"id":"s10","latex":"2^8=256\u003c700\u003c1024=2^{10}\\quad\\Rightarrow\\quad m=1,3,5,7,9"},{"id":"s11","latex":"1+3+5+7+9=25"}],"track":"미적분"};</script>
