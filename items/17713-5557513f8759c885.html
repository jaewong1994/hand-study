  <script>window.HandStudyRecord={"itemId":17713,"sourceLabel":"2023 교육청 고3 수학확통 4월 30번","adminYear":2023,"grade":3,"month":4,"number":30,"track":"확통","points":4,"scoreStatus":"confirmed_4_direct","questionText":"세 문자 $a$, $b$, $c$ 중에서 중복을 허락하여 각각 $5$개 이하씩 모두 $7$개를 택해 다음 조건을 만족시키는 $7$자리의 문자열을 만들려고 한다.\n(가) 한 문자가 연달아 $3$개 이어지고 그 문자는 $a$뿐이다.(나) 어느 한 문자도 연달아 $4$개 이상 이어지지 않는다.\n예를 들어, $baaacca$, $ccbbaaa$는 조건을 만족시키는 문자열이고 $aabbcca$, $aaabccc$, $ccbaaaa$는 조건을 만족시키지 않는 문자열이다. 만들 수 있는 모든 문자열의 개수를 구하시오. [4점]","answer":"188","sourceHash":"6c06ab99e467b14156121492d22d56b440464dfc0186e5871f17936d05301b7d","steps":[{"id":"s1","latex":"aaa\\text{ 블록은 정확히 하나},\\qquad \\#a\\in\\{3,4,5\\}"},{"id":"s2","latex":"g(n)=\\#\\{b,c\\text{로 만든 길이 }n\\text{ 문자열}:bbb,ccc\\text{ 없음}\\}"},{"id":"s3","latex":"(g(0),g(1),g(2),g(3),g(4))=(1,2,4,6,10)"},{"id":"s4","latex":"\\#a=3:\\quad\\sum_{i=0}^{4}g(i)g(4-i)=60"},{"latex":"\\#a=4:\\quad aaa\\text{와 }a\\text{의 순서 두 가지, 사이 }j\\ge1\\text{개의 }b,c","id":"s5"},{"latex":"2\\sum_{j=1}^3 g(j)\\sum_{i+k=3-j}g(i)g(k)=2(24+16+6)=92","id":"s6"},{"latex":"\\#a=5:\\quad(aaa,aa)\\text{는 두 순서},\\quad(aaa,a,a)\\text{는 세 순서}","id":"s7"},{"id":"s8","latex":"\\#a=5:\\quad2(8+4)+3g(1)^2=36"},{"id":"s9","latex":"60+92+36=188"}],"diagram":null,"contentHash":"2df46d76aa9bb1a8a67f595624cd4c012539d7c6f59a72f48649064f07206509","questionHtml":"\u003cp class=\"hp\">세 문자 \u003cspan class=\"heq\">\\(a\\)\u003c/span>, \u003cspan class=\"heq\">\\(b\\)\u003c/span>, \u003cspan class=\"heq\">\\(c\\)\u003c/span> 중에서 중복을 허락하여 각각 \u003cspan class=\"heq\">\\(5\\)\u003c/span>개 이하씩 모두 \u003cspan class=\"heq\">\\(7\\)\u003c/span>개를 택해 다음 조건을 만족시키는 \u003cspan class=\"heq\">\\(7\\)\u003c/span>자리의 문자열을 만들려고 한다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) 한 문자가 연달아 \u003cspan class=\"heq\">\\(3\\)\u003c/span>개 이어지고 그 문자는 \u003cspan class=\"heq\">\\(a\\)\u003c/span>뿐이다.\u003c/p>\u003cp class=\"hp\">(나) 어느 한 문자도 연달아 \u003cspan class=\"heq\">\\(4\\)\u003c/span>개 이상 이어지지 않는다.\u003c
