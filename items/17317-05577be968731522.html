<script>window.HandStudyRecord={"itemId":17317,"sourceLabel":"2022 교육청 고3 수학기하 4월 15번","adminYear":2022,"grade":3,"month":4,"number":15,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 반지름의 길이가 $R$($5\\lt R\\lt 5 \\sqrt{5}$)인 원에 내접하는 사각형 $A B C D$가 다음 조건을 만족시킨다.\n(가) ${\\overline{AB}}$$= {\\overline{AD}}$이고 ${\\overline{AC}}$$=10$이다.\n(나) 사각형 $A B C D$의 넓이는 $40$이다.\n[그림 1]\n다음은 선분 $B D$의 길이와 $R$의 비를 구하는 과정이다.\n${\\overline{AB}}$$= {\\overline{AD}}$$=k$라 할 때\n두 삼각형 $A B C$, $A C D$에서 각각 코사인법칙에 의하여\n$\\cos\\, \\left( \\angle ACB \\right)$$= \\dfrac{1}{20} \\left( {\\overline{BC}} + \\dfrac{{\\boxed{\\vphantom{(}\\, \\left( \\text{가} \\right) \\,}}}{{\\overline{BC}}} \\right)$,\n$\\cos\\, \\left( \\angle DCA \\right)$$= \\dfrac{1}{20} \\left( {\\overline{CD}} + \\dfrac{{\\boxed{\\vphantom{(}\\, \\left( \\text{가} \\right) \\,}}}{{\\overline{CD}}} \\right)$\n이다.\n이때 두 호 $A B$, $A D$에 대한 원주각의 크기가 같으므로\n$\\cos\\, \\left( \\angle ACB \\right)$$=\\cos\\, \\left( \\angle DCA \\right)$이다.\n사각형 $A B C D$의 넓이는\n두 삼각형 $A B D$, $B C D$의 넓이의 합과 같으므로\n$\\dfrac{1}{2} k^{2} \\,\\sin\\, \\left( \\angle BAD \\right) + \\dfrac{1}{2} \\times {\\overline{BC}} \\times {\\overline{CD}} \\times \\sin\\, \\left( \\pi- \\angle BAD \\right)$$=40$\n에서 $\\sin\\, \\left( \\angle BAD \\right)$$= {\\boxed{\\vphantom{(}\\, \\left( \\text{나} \\right) \\,}}$이다.\n따라서 삼각형 $A B D$에서 사인법칙에 의하여\n${\\overline{BD}} \\,:\\,R$$= {\\boxed{\\vphantom{(}\\, \\left( \\text{다} \\right) \\,}} \\,:\\,1$이다.\n위의 (가)에 알맞은 식을 $f \\left( k \\right)$라 하고, (나), (다)에 알맞은 수를 각각 $p$, $q$라 할 때, $\\dfrac{f \\left( 10p \\right)}{q}$의 값은? [4점]\n① $\\dfrac{25}{2}$ ② $15$ ③ $\\dfrac{35}{2}$ ④ $20$ ⑤ $\\dfrac{45}{2}$","answer":"⑤","sourceHash":"d183e4a4ccffadc161733f727e95cd536d4b5fcf8e9b098f7811cb091ae23d2c","steps":[{"id":"s1","latex":"u=BC,\\ v=CD:\\quad\\cos\\angle ACB=(u+(100-k^2)/u)/20"},{"id":"s2","latex":"AB=AD\\Rightarrow u+(100-k^2)/u=v+(100-k^2)/v"},{"id":"s3","latex":"u=v\\Rightarrow AC\\tex
