<script>window.HandStudyRecord={"itemId":18271,"sourceLabel":"2025 교육청 고3 수학확통 10월 30번","adminYear":2025,"grade":3,"month":10,"number":30,"track":"확통","points":4,"scoreStatus":"confirmed_4_direct","questionText":"두 상자 ${{A}}\\,$, ${{B}}\\,$에 각각 $8\\,$개의 공이 들어 있다. 두 상자 ${{A}}\\,$, ${{B}}\\,$와 한 개의 주사위를 사용하여 다음 시행을 한다.\n주사위를 한 번 던져나온 눈의 수가 $3\\,$의 배수이면상자 ${{A}}\\,$에서 $2\\,$개의 공을 꺼내어 상자 ${{B}}\\,$에 넣고,나온 눈의 수가 $3\\,$의 배수가 아니면상자 ${{B}}\\,$에서 $1\\,$개의 공을 꺼내어 상자 ${{A}}\\,$에 넣는다.\n이 시행을 $4\\,$번 반복한 후 상자 ${{A}}\\,$에 들어 있는 공의 개수가 상자 ${{B}}\\,$에 들어 있는 공의 개수보다 많을 때, 주사위의 짝수의 눈이 $4\\,$번 나왔을 확률은 $\\frac{q}{p}\\,$이다. $p+q\\,$의 값을 구하시오. (단, $p\\,$와 $q\\,$는 서로소인 자연수이다.) [4점]","answer":"17","sourceHash":"9c903f41e32a2bf126b3c2a81d2afae1b431ee113744063b074f59a78a471ef2","steps":[{"id":"s1","latex":"n=\\#\\{3\\text{의 배수 눈}\\},\\quad A=12-3n,\\quad B=4+3n"},{"id":"s2","latex":"A>B\\iff n\\le1"},{"id":"s3","latex":"P(E)=\\left(\\frac23\\right)^4+\\binom41\\frac13\\left(\\frac23\\right)^3=\\frac{48}{81}"},{"id":"s4","latex":"P(E\\cap F)=\\left(\\frac13\\right)^4+\\binom41\\frac16\\left(\\frac13\\right)^3=\\frac3{81}"},{"id":"s5","latex":"P(F\\mid E)=\\frac3{48}=\\frac1{16}\\Rightarrow p+q=17"}],"diagram":null,"contentHash":"56ae1146dc65ae72683fd223b7c7353c111f3f94984397d2e375de8468f4b02f","questionHtml":"\u003cp class=\"hp\">두 상자 \u003cspan class=\"heq\">\\({{A}}\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\({{B}}\\,\\)\u003c/span>에 각각 \u003cspan class=\"heq\">\\(8\\,\\)\u003c/span>개의 공이 들어 있다. 두 상자 \u003cspan class=\"heq\">\\({{A}}\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\({{B}}\\,\\)\u003c/span>와 한 개의 주사위를 사용하여 다음 시행을 한다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">주사위를 한 번 던져\u003c/p>\u003cp class=\"hp\">나온 눈의 수가 \u003cspan class=\"heq\">\\(3\\,\\)\u003c/span>의 배수이면\u003c/p>\u003cp class=\"hp\">상자 \u003cspan class=\"heq\">\\({{A}}\\,\\)\u003c/span>에서 \u003cspan class=\"heq\">\\(2\\,\\)\u003c/span>개의 공을 꺼내어 상자 \u003cspan class=\"heq\">\\({{B}}\\,\\)\u003c/span>에 넣고,\u003c/p>\u003cp class=\"hp\">나온 눈의 수가 \u003cspan class=\"heq\">\\(3\\,\\)\u003c/span>의 배수가 아니면\u003c/p>\u003cp class=\"hp\">상자 \u003cspan class=\"heq\">\\({{B}}\\,\\)\u003c/span>에서 \u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>개의 공을 꺼내어 상자 \u003cspan class=\"heq\">\\({{A}}\\,\\)\u003c/span>에 넣는다.\u003c/p>\u003c/div>\u003cp class=\"hp htall\">이 시행을 \u003cspan class=\"heq\">\\(4\\,\\)\u003c/span>번 반복한 후 상자 \u003cspan class=\"heq\">\\({{A}}\\,\\)\u003c/span>에 들어 있는 공의 개수가 상자 \u003cspan class=\"heq\">\\({{B}}\\,\\)\u003c/span>에 들어 있는 공의 개수보다 많을 때, 주사위의 짝수의 눈이 \u003cspan class=\"heq\">\\(4\\,\\)\u003c/span>번 나왔을 확률은 \u003cspan class=\"heq\">\\(\\dfrac{q}{p}\\,\\)\u003c/span>이다. \u003cspan class=\"heq\">\\(p+q\\,\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(p\\,\\)\u003c/span>와 \u003cspan class=\"heq\">\\(q\\,\\)\u003c/span>는 서로소인 자연수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/695bdb1e794d16b4d633b2a7.png\" style=\"width:449px;max-width:100%\">\u003cimg class=\"hfig\" src=\"../assets/figures/7dbfc2dd177dc7cf26cfca95.png\" style=\"width:148px;max-width:100%\">\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"ebe0b94ee4b33198150c9aa78808121b6aa5af81954783f074c5d46864456f9b"};</script>
<script>window.HandStudyGuide={"itemId":18271,"sourceHash":"9c903f41e32a2bf126b3c2a81d2afae1b431ee113744063b074f59a78a471ef2","contentHash":"56ae1146dc65ae72683fd223b7c7353c111f3f94984397d2e375de8468f4b02f","overview":{"goal":"상자 A가 더 많은 사건을 먼저 정리하고, 그 조건 아래 네 번 모두 짝수가 나올 조건부확률을 구해요.","firstLook":"한 시행에서 3의 배수면 A가 2개 줄고, 아니면 A가 1개 늘어요. 3의 배수가 나온 횟수만 알면 마지막 공 수가 정해져요.","conditions":[{"label":"조건 사건","meaning":"네 번 뒤 A의 공이 B보다 많아요."},{"label":"구할 사건","meaning":"네 번의 주사위 눈이 모두 짝수예요."}]},"chapters":[{"id":"c1","label":"조건 사건을 횟수로 바꿔요","stepIds":["s1","s2"],"question":"3의 배수가 n번 나오면 A의 공은 왜 \\(12-3n\\)개일까요?","hint":"먼저 네 번 모두 3의 배수가 아니라고 생각한 뒤 바뀐 시행을 고쳐요.","explanation":"네 번 모두 3의 배수가 아니면 A는 매번 1개씩 받아 \\(12\\)개가 돼요. 그중 한 번을 3의 배수 시행으로 바꾸면 +1 대신 -2가 되어 A가 3개 줄어요. 따라서 \\(A=12-3n\\), 전체가 16개이므로 \\(B=4+3n\\)이에요. \\(A>B\\)는 \\(12-3n>4+3n\\), 곧 \\(n<4/3\\)이므로 정수 n은 0 또는 1이에요.","check":{"prompt":"조건 사건에서 허용되는 3의 배수 횟수는 무엇인가요?","answer":"\\(n=0\\) 또는 \\(n=1\\)이에요."}},{"id":"c2","label":"조건 사건의 확률을 구해요","stepIds":["s3"],"question":"3의 배수가 나올 확률과 아닌 확률은 각각 얼마인가요?","hint":"주사위 눈 3,6 두 개가 3의 배수예요.","explanation":"3의 배수 확률은 \\(1/3\\), 아닌 확률은 \\(2/3\\)이에요. 조건 사건 E는 3의 배수가 0번 또는 1번이므로 \\(P(E)=(2/3)^4+{}_4\\mathrm C_1(1/3)(2/3)^3=16/81+32/81=48/81\\)이에요.","check":{"prompt":"한 번 나오는 경우에 \\({}_4\\mathrm C_1\\)을 곱하는 이유는 무엇인가요?","answer":"네 시행 중 3의 배수가 나올 한 자리를 고르는 네 방법을 세기 때문이에요."}},{"id":"c3","label":"모두 짝수인 경우만 다시 세어요","stepIds":["s4","s5"],"question":"모두 짝수이면서 3의 배수가 아닌 한 눈의 확률은 왜 \\(1/3\\)일까요?","hint":"짝수 2,4,6 중 3의 배수가 아닌 눈은 2,4예요.","explanation":"모두 짝수인 사건 F와 E가 함께 일어나려면 6이 0번 또는 1번 나와야 해요. 6의 확률은 \\(1/6\\), 짝수이면서 3의 배수가 아닌 2 또는 4의 확률은 \\(1/3\\)이에요. 따라서 \\(P(E\\cap F)=(1/3)^4+{}_4\\mathrm C_1(1/6)(1/3)^3=1/81+2/81=3/81\\)이에요. 조건부확률은 \\((3/81)/(48/81)=1/16\\)이므로 \\(p+q=17\\)이에요.","check":{"prompt":"조건부확률의 분모는 왜 P(E)인가요?","answer":"A의 공이 더 많다는 조건 아래에서 모두 짝수일 확률을 묻기 때문이에요."}}],"takeaway":["반복 시행 뒤 상태는 특정 결과가 나온 횟수 하나로 표현해요.","조건부확률의 분모에는 주어진 조건 사건 전체를 넣어요.","교집합에서는 원래 눈의 범주를 더 세밀하게 나누어 확률을 다시 계산해요."]};</script>
