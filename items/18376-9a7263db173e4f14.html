<script>window.HandStudyRecord={"adminYear":2025,"answer":"31","contentHash":"519e2d0999ebab6fbcc1838de043f12c7c81430637ccd194a397a8251e3a31ab","diagram":null,"editionHash":"9a7263db173e4f140d79e5a1ae516e08b707a8c1c37338c4fd1cfc0136f5b796","grade":3,"graphHash":"","graphPlan":null,"itemId":18376,"learningHash":"574cfa2c327cd79702b8d3cb2ecd1aee23e73df739ef911e56da40086f04f7f4","month":9,"number":30,"points":4,"preview":false,"questionHtml":"\u003cp class=\"hp\">실수 전체의 집합에서 미분가능한 함수 \u003cspan class=\"heq\">\\(f \\left(x \\right)\\,\\)\u003c/span>와 실수 전체의 집합에서 연속인 함수 \u003cspan class=\"heq\">\\(g \\left(x \\right)\\,\\)\u003c/span>는 모든 실수 \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>에 대하여\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\(f \\left(x \\right)= \\ln\\, \\left(\\dfrac{g \\left(x \\right)}{1+xf' \\left(x \\right)} \\right)\\,\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">를 만족시킨다. \u003cspan class=\"heq\">\\(f \\left(1 \\right)=4 \\ln\\, 2\\,\\)\u003c/span>이고\u003c/p>\u003cp class=\"hp\">&emsp;\u003cspan class=\"heq\">\\(\\int_{1}^{2}g \\left(x \\right)\\,dx=34\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(\\int_{1}^{2}xg \\left(x \\right)\\,dx=53\\,\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">일 때, \u003cspan class=\"heq\">\\(\\int_{1}^{2}xe^{f \\left(x \\right)}\\,dx\\,\\)\u003c/span>의 값을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","questionText":"실수 전체의 집합에서 미분가능한 함수 $f \\left(x \\right)\\,$와 실수 전체의 집합에서 연속인 함수 $g \\left(x \\right)\\,$는 모든 실수 $x\\,$에 대하여\n $f \\left(x \\right)= \\ln\\, \\left(\\frac{g \\left(x \\right)}{1+xf' \\left(x \\right)} \\right)\\,$\n를 만족시킨다. $f \\left(1 \\right)=4 \\ln\\, 2\\,$이고\n $\\int_{1}^{2}g \\left(x \\right)\\,dx=34\\,$, $\\int_{1}^{2}xg \\left(x \\right)\\,dx=53\\,$\n일 때, $\\int_{1}^{2}xe^{f \\left(x \\right)}\\,dx\\,$의 값을 구하시오. [4점]","scoreStatus":"confirmed_4_direct","sourceHash":"e5471e3c4ef8b955ad263a164ffa91e45d9f7d57b26900c0622a3c9b5307407e","sourceLabel":"2025 평가원 고3 수학미적분 9월 30번","stepExplanations":{"s1":{"body":"로그를 지수식으로 바꾸면 \\(g(x)=e^{f(x)}+xe^{f(x)}f^{\\prime}(x)\\)가 나와요. 첫 항은 \\(x\\)를 미분했을 때, 둘째 항은 \\(e^{f(x)}\\)를 미분했을 때 생기는 모양이에요. 그래서 \\(F(x)=xe^{f(x)}\\)로 두면 \\(F^{\\prime}(x)=g(x)\\)가 됩니다. 아래의 \\(F\\)는 이렇게 정한 함수예요.","skillTags":["derivative.product","integration.recognize-antiderivative"],"title":"왜 이 곱을 미분해 볼까요?"},"s3":{"body":"\\(\\int_1^2xg(x)\\,dx=\\int_1^2xF^{\\prime}(x)\\,dx\\)에서 \\(x\\)는 미분하고 \\(F^{\\prime}(x)\\)는 적분해요. 그러면 \\([xF(x)]_1^2-\\int_1^2F(x)\\,dx\\)입니다. 남은 적분이 바로 구하려는 \\(I\\)이므로, 함수를 전부 구하지 않아도 주어진 두 적분값으로 \\(I\\)를 계산할 수 있어요.","skillTags":["integration.by-parts"],"title":"부분적분으로 구하려는 적분을 남겨요"}},"steps":[{"id":"s1","latex":"e^{f(x)}=\\dfrac{g(x)}{1+xf'(x)}\\qquad g(x)=e^{f(x)}\\left(1+xf'(x)\\right)\\qquad \\dfrac{d}{dx}\\left(x\\,e^{f(x)}\\right)=e^{f(x)}+x\\,e^{f(x)}f'(x)=e^{f(x)}\\left(1+xf'(x)\\right)"},{"id":"s2","latex":"e^{f(1)}=e^{4\\ln 2}=2^{4}=16\\qquad F(1)=1\\cdot e^{f(1)}=16\\qquad \\int_{1}^{2}g(x)\\,dx=\\Big[\\,x\\,e^{f(x)}\\,\\Big]_{1}^{2}=2e^{f(2)}-16=34"},{"id":"s3","latex":"\\displaystyle I=\\int_{1}^{2}x\\,e^{f(x)}\\,dx\\qquad \\int_{1}^{2}x\\,g(x)\\,dx=\\int_{1}^{2}x\\,F'(x)\\,dx=\\Big[\\,x\\,F(x)\\,\\Big]_{1}^{2}-\\int_{1}^{2}F(x)\\,dx=\\Big[\\,x\\,F(x)\\,\\Big]_{1}^{2}-I"},{"id":"s4","latex":"\\Big[\\,x\\,F(x)\\,\\Big]_{1}^{2}=2F(2)-1\\cdot F(1)=2\\cdot 50-16=84\\qquad \\displaystyle\\int_{1}^{2}x\\,g(x)\\,dx=53\\qquad 84-I=53\\qquad \\boxed{\\vphantom{(}\\ \\int_{1}^{2}x\\,e^{f(x)}\\,dx=31\\ }"}],"track":"미적분"};</script>
<script>window.HandStudyGuide={"itemId":18376,"sourceHash":"e5471e3c4ef8b955ad263a164ffa91e45d9f7d57b26900c0622a3c9b5307407e","contentHash":"519e2d0999ebab6fbcc1838de043f12c7c81430637ccd194a397a8251e3a31ab","overview":{"goal":"로그 관계에서 숨은 도함수를 찾고, 부분적분으로 목표 적분을 구해요.","firstLook":"\\(e^{f(x)}(1+xf'(x))\\)는 \\(x\\)와 \\(e^{f(x)}\\)의 곱을 미분한 모양이에요.","conditions":[{"label":"함수 관계","meaning":"로그를 지수화하면 \\(g\\)를 하나의 도함수로 묶을 수 있어요."},{"label":"두 적분값","meaning":"먼저 \\(F(2)\\)를 정하고, 다음 부분적분에서 목표 \\(\\int F\\)를 꺼내요."}]},"chapters":[{"id":"c1","label":"숨은 도함수와 양 끝값을 찾아요","stepIds":["s1","s2"],"question":"어떤 곱을 미분하면 \\(g(x)\\)와 정확히 같아질까요?","hint":"\\((xe^{f(x)})'\\)을 곱의 미분과 합성함수 미분으로 펼쳐 봐요.","explanation":"주어진 식을 지수화하면 \\(e^{f(x)}=g(x)/(1+xf'(x))\\), 즉 \\(g(x)=e^{f(x)}(1+xf'(x))\\)예요. 한편\n\n\\((xe^{f(x)})'=e^{f(x)}+xe^{f(x)}f'(x)=e^{f(x)}(1+xf'(x))\\)이므로 \\(F(x)=xe^{f(x)}\\)로 두면 \\(F'(x)=g(x)\\)예요. \\(F(1)=e^{4\\ln2}=16\\)이고, \\(34=\\int_1^2g(x)\\,dx=F(2)-F(1)\\)이므로 \\(F(2)=50\\)이에요.","check":{"prompt":"\\(F'(x)=g(x)\\)가 되는 실제 미분 전개는 무엇인가요?","answer":"\\((xe^{f(x)})'=e^{f(x)}+xe^{f(x)}f'(x)=g(x)\\)예요."}},{"id":"c2","label":"부분적분으로 목표 적분을 꺼내요","stepIds":["s3","s4"],"question":"\\(\\int_1^2xg(x)\\,dx\\)에서 왜 \\(x\\)를 미분하는 쪽으로 고를까요?","hint":"\\(g=F'\\)이고 목표 적분이 \\(\\int F\\)이므로 \\(dv=F'(x)dx\\)로 두면 바로 연결돼요.","explanation":"\\(g=F'\\)이므로 주어진 적분은 \\(\\int_1^2xF'(x)\\,dx\\)예요. 부분적분에서 \\(u=x\\), \\(dv=F'(x)\\,dx\\)로 두면 \\(du=dx\\), \\(v=F(x)\\)라서\n\n\\(53=[xF(x)]_1^2-\\int_1^2F(x)\\,dx\\)예요.\n\n경계항은 \\(2F(2)-F(1)=2\\cdot50-16=84\\)예요. 또 \\(F(x)=xe^{f(x)}\\)이므로 남은 적분이 바로 문제의 목표예요. 따라서 목표 적분은 \\(84-53=31\\)이에요.","check":{"prompt":"부분적분에서 고른 \\(u,dv\\)와 경계항은 무엇인가요?","answer":"\\(u=x,dv=F'(x)dx\\)이고, 경계항은 \\([xF(x)]_1^2=84\\)예요."}}],"takeaway":["곱의 미분 모양이 보이면 새 함수로 묶어 식을 단순하게 만들어요.","부분적분은 적분하면 목표식이 나오는 항을 \\(dv\\)로 골라요.","경계항과 남은 적분을 각각 실제 값으로 계산해 부호를 확인해요."]};</script>
