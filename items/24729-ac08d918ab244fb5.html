<script>window.HandStudyRecord={"adminYear":2020,"answer":"72","contentHash":"8c536dfbd38b3d2b6c650c8c579212074b95aa593bfc87b407c945a788f7f485","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24729,"month":12,"number":28,"points":4,"preview":false,"questionHtml":"\u003cp>두 상수 \u003cspan class=\"heq\">\\(a,\\,b\\)\u003c/span>(\u003cspan class=\"heq\">\\(a&lt;b\\)\u003c/span>)에 대하여 함수 \u003cspan class=\"heq\">\\(f(x)\\)\u003c/span>를 \u003cspan class=\"heq\">\\(f(x) \\,=\\, (x-a)(x-b)^2\\)\u003c/span> 이라 하자. 함수 \u003cspan class=\"heq\">\\(g(x) \\,=\\, x^3 +x+1\\)\u003c/span>의 역함수 \u003cspan class=\"heq\">\\(g^{-1} (x)\\)\u003c/span>에 대하여 합성함수 \u003cspan class=\"heq\">\\(h(x) \\,=\\, (f \\circ g^-1 )(x)\\)\u003c/span>가 다음 조건을 만족시킬 때, \u003cspan class=\"heq\">\\(f(8)\\)\u003c/span>의 값을 구하시오. [4점]\u003c/p>\u003cdiv class=\"hbox hcond\">\u003cp class=\"hcondr\">(가) 함수 \u003cspan class=\"heq\">\\((x-1)|\\,h(x)\\,|\\,\\)\u003c/span>가 실수 전체의 집합에서 미분가능하다.\u003c/p>\u003cp class=\"hcondr\">(나) \u003cspan class=\"heq\">\\(h&#x27;(3) \\,=\\,2\\)\u003c/span>\u003c/p>\u003c/div>","questionText":"두 상수 $a,\\,b$($a\u003cb$)에 대하여 함수 $f(x)$를 $f(x) \\,=\\, (x-a)(x-b)^2$ 이라 하자. 함수 $g(x) \\,=\\, x^3 +x+1$의 역함수 $g^{-1} (x)$에 대하여 합성함수 $h(x) \\,=\\, (f \\circ g^-1 )(x)$가 다음 조건을 만족시킬 때, $f(8)$의 값을 구하시오. [4점]\n(가) 함수 $(x-1)|\\,h(x)\\,|\\,$가 실수 전체의 집합에서 미분가능하다.(나) $h\\,'(3) \\,=\\,2$","sourceHash":"7071ab134ae4526603201346aebfe9300deebe208a83525d6047dd81bbd4a7ac","sourceKind":"csat","sourceLabel":"2020년 시행 수능 · 2021학년도 · 가형 · 28번","steps":[{"id":"s1","latex":"g\\prime(x)=3x^2+1>0\\ \\Rightarrow\\ g^{-1}\\text{는 모든 실수에서 미분가능}"},{"id":"s2","latex":"f(x)=(x-a)(x-b)^2\\text{는 }x=a\\text{에서 단순히 부호가 바뀌고 }x=b\\text{에서는 부호가 바뀌지 않는다.}"},{"id":"s3","latex":"|h(x)|\\text{가 미분불가능한 점은 }x=g(a)\\text{ 하나}"},{"id":"s4","latex":"(x-1)|h(x)|\\text{가 미분가능하려면 }g(a)=1"},{"id":"s5","latex":"a^3+a+1=1\\ \\Rightarrow\\ a(a^2+1)=0\\ \\Rightarrow\\ a=0"},{"explanation":{"body":"\\(g(1)=3\\)이므로 \\(x=3\\)에 대응하는 원래 변수는 1이에요. 역함수의 미분계수는 그 점에서 \\(1/g\\prime(1)=1/4\\)이고, 바깥 함수 \\(f\\)의 미분계수 \\(f\\prime(1)\\)와 곱해야 해요. 그래서 \\(h\\prime(3)=f\\prime(1)/4\\)이며, 주어진 값 2를 그대로 \\(f\\prime(1)\\)로 두면 안 돼요.","skillTags":["derivatives.inverse-chain"],"title":"역함수 쪽 기울기는 4로 나눠요"},"id":"s6","latex":"g(1)=3,\\quad h\\prime(3)=\\frac{f\\prime(1)}{g\\prime(1)}=\\frac{f\\prime(1)}4=2"},{"id":"s7","latex":"f(x)=x(x-b)^2\\ \\Rightarrow\\ f\\prime(1)=(1-b)^2+2(1-b)=8"},{"id":"s8","latex":"b^2-4b-5=(b-5)(b+1)=0,\\quad b>a=0\\ \\Rightarrow\\ b=5"},{"id":"s9","latex":"\\text{이때 }x=1\\text{에서 }(x-1)|h(x)|\\text{의 좌우 미분계수는 모두 }0"},{"id":"s10","latex":"f(8)=8(8-5)^2=\\boxed{72}"}],"track":"가형"};</script>
