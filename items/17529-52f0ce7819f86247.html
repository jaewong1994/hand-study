<script>window.HandStudyGuide={"itemId":17529,"sourceHash":"a7cca683b23f03193984ca9d1c3c8754113669d2946b9cccfecbb63077f50a8a","contentHash":"c699855bf5c0651b9b97b7bc353dd45abf9cf76d86a7c79b3e9a4f3c79254512","overview":{"goal":"네 수의 평균 조건을 합 조건으로 바꾸고, 각 수가 6 이하라는 제한을 반영해 확률을 구해요.","firstLook":"카드를 다시 넣으므로 네 번의 결과는 각각 \\(1\\)부터 \\(6\\)까지에서 독립적으로 나와요. 모든 결과 \\(6^4\\)개가 같은 가능성을 가지니 합이 \\(11\\)인 결과만 세면 돼요.","conditions":[{"label":"다시 넣기","meaning":"매 시행에서 여섯 카드의 확률이 다시 같아져 전체 결과 수가 \\(6^4\\)이에요."},{"label":"평균 조건","meaning":"네 수의 평균이 \\(11/4\\)이므로 네 수의 합은 \\(11\\)이에요."},{"label":"카드의 범위","meaning":"각 결과는 \\(1\\) 이상 \\(6\\) 이하라서 치환 뒤에도 위쪽 제한을 꼭 빼 주어야 해요."}]},"chapters":[{"id":"c1","label":"평균을 합으로 바꿔요","stepIds":["s1","s2"],"question":"평균 조건을 자연수 해의 개수 문제로 어떻게 바꿀까요?","hint":"네 결과를 \\(x_1,x_2,x_3,x_4\\)라 하고, 최솟값 \\(1\\)을 각각 빼요.","explanation":"네 번 확인한 수를 차례대로 \\(x_1,x_2,x_3,x_4\\)라 하면 \\((x_1+x_2+x_3+x_4)/4=11/4\\)이므로 \\(x_1+x_2+x_3+x_4=11\\)이에요. 각 수에서 \\(1\\)씩 뺀 \\(y_i=x_i-1\\)을 쓰면 \\(y_1+y_2+y_3+y_4=7\\)이고 \\(0\\le y_i\\le5\\)가 돼요. 이렇게 바꾸면 0도 허용하는 네 수의 합으로 셀 수 있어요.","check":{"prompt":"\\(x_i\\le6\\)은 \\(y_i\\)에 어떤 제한을 주나요?","answer":"\\(y_i=x_i-1\\)이므로 \\(y_i\\le5\\)예요. 이 제한을 놓치면 카드에 없는 \\(7\\) 이상의 수까지 세게 돼요."}},{"id":"c2","label":"제한이 없는 해에서 넘친 경우를 빼요","stepIds":["s3","s4","s5"],"question":"\\(y_i\\le5\\)를 어긴 해는 정확히 몇 개일까요?","hint":"먼저 위쪽 제한 없이 세고, 어느 한 \\(y_i\\)가 \\(6\\) 이상인 경우를 빼요.","explanation":"위쪽 제한을 잠시 무시하면 \\(y_1+y_2+y_3+y_4=7\\)의 음이 아닌 정수해는 중복조합으로 \\({}_{4}\\mathrm{H}_{7}={}_{10}\\mathrm{C}_{3}=120\\)개예요. 이제 \\(y_i\\ge6\\)인 해를 빼야 해요. 그런 \\(i\\)를 고르는 방법이 \\(4\\)가지이고, 예를 들어 \\(y_1\\ge6\\)이면 \\(z_1=y_1-6\\)으로 두어 \\(z_1+y_2+y_3+y_4=1\\)을 얻어요. 합이 \\(1\\)인 음이 아닌 정수해는 \\({}_{4}\\mathrm{H}_{1}=4\\)개이므로 빼야 할 해는 \\(4\\times4=16\\)개예요. 두 변수가 동시에 \\(6\\) 이상이면 합이 적어도 \\(12\\)라서 합 \\(7\\)에서는 생길 수 없어요. 따라서 유리한 순서 있는 결과는 \\(120-16=104\\)개예요.","check":{"prompt":"왜 \\(y_i\\ge6\\)인 두 변수가 겹치는 경우를 다시 더하지 않아도 되나요?","answer":"두 변수가 각각 \\(6\\) 이상이면 네 변수의 합이 적어도 \\(12\\)인데, 실제 합은 \\(7\\)이므로 그런 해가 아예 없어요."}},{"id":"c3","label":"전체 결과로 나누고 약분해요","stepIds":["s6","s7"],"question":"유리한 결과 \\(104\\)개를 어떤 전체 결과 수로 나눌까요?","hint":"다시 넣는 네 번의 시행에서 매번 가능한 카드 수가 몇 개인지 생각해요.","explanation":"카드를 확인한 뒤 다시 넣으므로 매 시행마다 가능한 수는 \\(6\\)개이고, 네 번의 순서 있는 전체 결과는 \\(6^4=1296\\)개예요. 따라서 확률은 \\(104/1296\\)예요. 분자와 분모를 \\(8\\)로 나누면 \\(13/162\\)이고, \\(13\\)은 \\(162\\)를 나누지 않으므로 서로소예요. 문제의 \\(q/p\\)와 비교하면 \\(q=13\\), \\(p=162\\)이므로 \\(p+q=175\\)예요.","check":{"prompt":"전체 경우의 수가 \\({}_{6}\\mathrm{C}_{4}\\)가 아니라 \\(6^4\\)인 이유는 무엇인가요?","answer":"같은 카드를 여러 번 뽑을 수 있고 뽑힌 차례도 결과를 구분하므로, 네 자리마다 여섯 수 중 하나를 고르는 \\(6^4\\)개예요."}}],"takeaway":["평균이 주어지면 자료의 개수를 곱해 합 조건으로 먼저 바꿔요.","각 변수에 위쪽 제한이 있으면 제한 없이 센 뒤 범위를 넘는 해를 구체적으로 빼요.","복원추출에서는 시행마다 가능한 결과 수가 같고, 순서 있는 전체 결과 수는 거듭제곱으로 세어요."]};</script>
