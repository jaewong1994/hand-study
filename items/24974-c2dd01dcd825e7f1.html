  <script>window.HandStudyRecord={"adminYear":2025,"answer":"360","contentHash":"a4659a7d163244df36bf470e10cd40ee879c134afcf5e241af34bd1e35df174b","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24974,"month":11,"number":29,"points":4,"preview":false,"questionHtml":"\u003cp>그림과 같이 초점이 \u003cspan class=\"heq\">\\({{F}} \\left(p,\\,0 \\right)\\, \\left(p &gt; 0 \\right)\\,\\)\u003c/span>이고 준선이 \u003cspan class=\"heq\">\\(x=\\,-p\\,\\)\u003c/span>인 포물선 위의 점 중 제\u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>사분면에 있는 점 \u003cspan class=\"heq\">\\({{A}}\\,\\)\u003c/span>에서 포물선의 준선에 내린 수선의 발을 \u003cspan class=\"heq\">\\({{H}}\\,\\)\u003c/span>라 하고, 두 초점이 \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>축 위에 있고 세 점 \u003cspan class=\"heq\">\\({{F}}\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\({{A}}\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\({{H}}\\,\\)\u003c/span>를 지나는 타원의 \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>좌표가 양수인 초점을 \u003cspan class=\"heq\">\\({{B}}\\,\\)\u003c/span>라 하자. 삼각형 \u003cspan class=\"heq\">\\({{AHB}}\\,\\)\u003c/span>의 둘레의 길이가 \u003cspan class=\"heq\">\\(p+27\\,\\)\u003c/span>, 넓이가 \u003cspan class=\"heq\">\\(2p+12\\,\\)\u003c/span>일 때, 선분 \u003cspan class=\"heq\">\\({{HF}}\\,\\)\u003c/span>의 길이를 \u003cspan class=\"heq\">\\(k\\,\\)\u003c/span>라 하자. \u003cspan class=\"heq\">\\(k^{2}\\,\\)\u003c/span>의 값을 구하시오. [4점]\u003c/p>\u003cfigure>\u003cimg class=\"hfig\" src=\"../assets/csat/24974-5a1791a51d381fda.png\" alt=\"2025년 시행 수능 29번 문항 그림 \" style=\"max-width:100%;width:420px\">\u003c/figure>","questionText":"그림과 같이 초점이 ${{F}} \\left(p,\\,0 \\right)\\, \\left(p > 0 \\right)\\,$이고 준선이 $x=\\,-p\\,$인 포물선 위의 점 중 제$1\\,$사분면에 있는 점 ${{A}}\\,$에서 포물선의 준선에 내린 수선의 발을 ${{H}}\\,$라 하고, 두 초점이 $x\\,$축 위에 있고 세 점 ${{F}}\\,$, ${{A}}\\,$, ${{H}}\\,$를 지나는 타원의 $x\\,$좌표가 양수인 초점을 ${{B}}\\,$라 하자. 삼각형 ${{AHB}}\\,$의 둘레의 길이가 $p+27\\,$, 넓이가 $2p+12\\,$일 때, 선분 ${{HF}}\\,$의 길이를 $k\\,$라 하자. $k^{2}\\,$의 값을 구하시오. [4점]","sourceHash":"33901b804df919e48bd259d7ab1fa58a9c7f1cf2dadc3852a11c84255f9e1d18","sourceKind":"csat","sourceLabel":"2025년 시행 수능 · 2026학년도 · 기하 · 29번","steps":[{"id":"s1","latex":"A=(x_1,y_1),\\quad H=(-p,y_1),\\quad y_1^{2}=4px_1"},{"id":"s2","latex":"AH=x_1+p,\\quad O=\\left(\\frac{x_1-p}{2},0\\right)\\text{는 타원의 중심}"},{"id":"s3","latex":"H\\text{의 }x\\text{좌표 }-p\\text{가 }F\\text{의 }x\\text{좌표 }p\\text{보다 작으므로 }F\\text{는 왼쪽 꼭짓점일 수 없다. 따라서 }F\\text{는 오른쪽 꼭짓점이고 }2a=3p-x_1"},{"explanation":{"body":"수평인 현 \\(AH\\)의 중점은 타원의 중심과 같은 세로선 위에 있으므로 중심은 \\(O=((x_1-p)/2,0)\\)입니다. 타원 위의 점 \\(H\\)의 \\(x\\)좌표 \\(-p\\)가 \\(F\\)의 \\(x\\)좌표 \\(p\\)보다 작으므로 \\(F\\)는 왼쪽 꼭짓점일 수 없고 오른쪽 꼭짓점입니다. 따라서 \\(2a=2(p-O_x)=3p-x_1\\)이고, 타원 중심을 지나는 \\(y\\)축과 평행한 직선에 대한 대칭으로 \\(AB=HB'\\)이므로 둘레는 \\(4p\\)입니다.","skillTags":["타원대칭","거리합"],"title":"타원의 거리합을 둘레에 넣기"},"id":"s4","latex":"AB=HB'\\text{이므로 }AH+AB+BH=AH+HB'+HB=(x_1+p)+(3p-x_1)=4p"},{"id":"s5","latex":"p+27=4p\\Rightarrow p=9"},{"id":"s6","latex":"[\\triangle AHB]=\\frac12(x_1+p)y_1=2p+12=30"},{"id":"s7","latex":"(x_1+9)y_1=60,\\qquad y_1^{2}=36x_1"},{"id":"s8","latex":"\\left(\\frac{60}{x_1+9}\\right)^2=36x_1\\Rightarrow x_1(x_1+9)^2=100"},{"id":"s9","latex":"(x_1-1)(x_1^{2}+19x_1+100)=0\\Rightarrow x_1=1,\\ y_1=6"},{"id":"s10","latex":"H=(-9,6),\\quad F=(9,0)"},{"id":"s11","latex":"HF^{2}=18^{2}+6^{2}=360"},{"id":"s12","latex":"\\therefore\\ \\boxed{360}"}],"track":"기하"};</script>
