<script>window.HandStudyRecord={"adminYear":2025,"answer":"360","contentHash":"1ed6cecb5a1165e6c863a43a1928f764a87b652a38fe9fff28e9bdaaebc85125","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24974,"month":11,"number":29,"points":4,"preview":false,"questionHtml":"<p>그림과 같이 초점이 <span class=\"heq\">\\({{F}} \\left(p,\\,0 \\right)\\, \\left(p &gt; 0 \\right)\\,\\)<\/span>이고 준선이 <span class=\"heq\">\\(x=\\,-p\\,\\)<\/span>인 포물선 위의 점 중 제<span class=\"heq\">\\(1\\,\\)<\/span>사분면에 있는 점 <span class=\"heq\">\\({{A}}\\,\\)<\/span>에서 포물선의 준선에 내린 수선의 발을 <span class=\"heq\">\\({{H}}\\,\\)<\/span>라 하고, 두 초점이 <span class=\"heq\">\\(x\\,\\)<\/span>축 위에 있고 세 점 <span class=\"heq\">\\({{F}}\\,\\)<\/span>, <span class=\"heq\">\\({{A}}\\,\\)<\/span>, <span class=\"heq\">\\({{H}}\\,\\)<\/span>를 지나는 타원의 <span class=\"heq\">\\(x\\,\\)<\/span>좌표가 양수인 초점을 <span class=\"heq\">\\({{B}}\\,\\)<\/span>라 하자. 삼각형 <span class=\"heq\">\\({{AHB}}\\,\\)<\/span>의 둘레의 길이가 <span class=\"heq\">\\(p+27\\,\\)<\/span>, 넓이가 <span class=\"heq\">\\(2p+12\\,\\)<\/span>일 때, 선분 <span class=\"heq\">\\({{HF}}\\,\\)<\/span>의 길이를 <span class=\"heq\">\\(k\\,\\)<\/span>라 하자. <span class=\"heq\">\\(k^{2}\\,\\)<\/span>의 값을 구하시오. [4점]<\/p><figure><img class=\"hfig\" src=\"../assets/csat/24974-5a1791a51d381fda.png\" alt=\"2025년 시행 수능 29번 문항 그림 \" style=\"max-width:100%;width:420px\"><\/figure>","questionText":"그림과 같이 초점이 ${{F}} \\left(p,\\,0 \\right)\\, \\left(p > 0 \\right)\\,$이고 준선이 $x=\\,-p\\,$인 포물선 위의 점 중 제$1\\,$사분면에 있는 점 ${{A}}\\,$에서 포물선의 준선에 내린 수선의 발을 ${{H}}\\,$라 하고, 두 초점이 $x\\,$축 위에 있고 세 점 ${{F}}\\,$, ${{A}}\\,$, ${{H}}\\,$를 지나는 타원의 $x\\,$좌표가 양수인 초점을 ${{B}}\\,$라 하자. 삼각형 ${{AHB}}\\,$의 둘레의 길이가 $p+27\\,$, 넓이가 $2p+12\\,$일 때, 선분 ${{HF}}\\,$의 길이를 $k\\,$라 하자. $k^{2}\\,$의 값을 구하시오. [4점]","sourceHash":"33901b804df919e48bd259d7ab1fa58a9c7f1cf2dadc3852a11c84255f9e1d18","sourceKind":"csat","sourceLabel":"2025년 시행 수능 · 2026학년도 · 기하 · 29번","steps":[{"id":"s1","latex":"A=(x_1,y_1),\\quad H=(-p,y_1),\\quad y_1^{2}=4px_1"},{"id":"s2","latex":"AH=x_1+p,\\quad O=\\left(\\frac{x_1-p}{2},0\\right)\\text{는 타원의 중심}"},{"id":"s3","latex":"H\\text{의 }x\\text{좌표 }-p\\text{가 }F\\text{의 }x\\text{좌표 }p\\text{보다 작으므로 }F\\text{는 왼쪽 꼭짓점일 수 없다. 따라서 }F\\text{는 오른쪽 꼭짓점이고 }2a=3p-x_1"},{"explanation":{"body":"수평인 현 \\(AH\\)의 중점은 타원의 중심과 같은 세로선 위에 있으므로 중심은 \\(O=((x_1-p)/2,0)\\)입니다. 타원 위의 점 \\(H\\)의 \\(x\\)좌표 \\(-p\\)가 \\(F\\)의 \\(x\\)좌표 \\(p\\)보다 작으므로 \\(F\\)는 왼쪽 꼭짓점일 수 없고 오른쪽 꼭짓점입니다. 따라서 \\(2a=2(p-O_x)=3p-x_1\\)이고, 타원 중심을 지나는 \\(y\\)축과 평행한 직선에 대한 대칭으로 \\(AB=HB'\\)이므로 둘레는 \\(4p\\)입니다.","skillTags":["타원대칭","거리합"],"title":"타원의 거리합을 둘레에 넣기"},"id":"s4","latex":"B'\\text{을 }x\\text{좌표가 음수인 타원의 초점이라 하면 }AB=HB'\\text{이고, }AH+AB+BH=(x_1+p)+(3p-x_1)=4p"},{"id":"s5","latex":"p+27=4p\\Rightarrow p=9"},{"id":"s6","latex":"[\\triangle AHB]=\\frac12(x_1+p)y_1=2p+12=30"},{"id":"s7","latex":"(x_1+9)y_1=60,\\qquad y_1^{2}=36x_1"},{"id":"s8","latex":"\\left(\\frac{60}{x_1+9}\\right)^2=36x_1\\Rightarrow x_1(x_1+9)^2=100"},{"id":"s9","latex":"(x_1-1)(x_1^{2}+19x_1+100)=0\\Rightarrow x_1=1,\\ y_1=6"},{"id":"s10","latex":"H=(-9,6),\\quad F=(9,0)"},{"id":"s11","latex":"HF^{2}=18^{2}+6^{2}=360"},{"id":"s12","latex":"\\therefore\\ \\boxed{360}"}],"track":"기하","editionHash":"6ba7da86fa8bcd5af5aca92343511534a8ac66a29cd2bf726eca5bb39cb122f4"};</script>
<script>window.HandStudyGuide={"itemId":24974,"sourceHash":"33901b804df919e48bd259d7ab1fa58a9c7f1cf2dadc3852a11c84255f9e1d18","contentHash":"1ed6cecb5a1165e6c863a43a1928f764a87b652a38fe9fff28e9bdaaebc85125","overview":{"goal":"포물선의 좌표 관계와 타원의 대칭·거리합을 연결해 \\(p\\)와 점 \\(A\\)를 정해요.","firstLook":"점 \\(A\\)의 좌표를 \\((x_1,y_1)\\)로 두면 포물선에서 \\(y_1^2=4px_1\\), 수선의 발은 \\(H=(-p,y_1)\\)예요. 타원에서는 수평인 현 \\(AH\\)의 중점으로 중심을 찾는 것이 핵심이에요.","conditions":[{"label":"포물선","meaning":"\\(A\\)에서 초점까지 거리와 준선까지 거리가 같고 식은 \\(y^2=4px\\)예요."},{"label":"타원","meaning":"\\(A,H,F\\)가 타원 위에 있고 두 초점은 \\(x\\)축 위에 있어요."},{"label":"둘레와 넓이","meaning":"둘레로 \\(p\\)를 먼저 정하고, 넓이로 \\(A\\)의 좌표를 정해요."}]},"chapters":[{"id":"c1","label":"포물선과 타원의 중심을 좌표로 잡아요","stepIds":["s1","s2","s3"],"question":"타원의 중심은 왜 \\(((x_1-p)/2,0)\\)이고, \\(F\\)는 왜 오른쪽 꼭짓점일까요?","hint":"\\(A,H\\)는 같은 높이의 타원 위 두 점이고, \\(F=(p,0)\\)도 타원 위의 \\(x\\)축 점이에요.","explanation":"포물선의 꼭짓점은 원점이므로 식은 \\(y^2=4px\\)예요. 따라서 \\(A=(x_1,y_1)\\)에 대해 \\(y_1^2=4px_1\\)이고, 준선 \\(x=-p\\)에 내린 수선의 발은 \\(H=(-p,y_1)\\), \\(AH=x_1+p\\)예요. 타원의 두 초점이 \\(x\\)축 위에 있으므로 중심도 \\(x\\)축 위에 있고 축은 좌표축과 나란해요. 수평인 현 \\(AH\\)의 중점은 중심을 지나는 세로선 위에 있으므로 중심은 \\(O=((x_1-p)/2,0)\\)예요. 또 \\(F=(p,0)\\)는 타원 위의 \\(x\\)축 점이라 좌우 꼭짓점 중 하나예요. 타원 위의 \\(H\\)가 \\(F\\)보다 왼쪽에 있으므로 \\(F\\)가 왼쪽 꼭짓점일 수는 없고 오른쪽 꼭짓점이에요. 장축의 길이는 \\(2a=2(p-(x_1-p)/2)=3p-x_1\\)이에요.","check":{"prompt":"\\(F\\)가 왼쪽 꼭짓점이라고 하면 어떤 점 때문에 모순인가요?","answer":"왼쪽 꼭짓점보다 더 왼쪽에는 타원 위 점이 없어야 하는데, 타원 위의 \\(H\\)는 \\(x=-p<p\\)에 있어요."}},{"id":"c2","label":"타원의 대칭으로 둘레를 줄여요","stepIds":["s4","s5"],"question":"삼각형 \\(AHB\\)의 둘레가 왜 언제나 \\(4p\\)로 정리될까요?","hint":"음의 쪽 초점을 \\(B'\\)라 하고, 중심의 세로선에 대한 대칭을 이용해 \\(AB=HB'\\)를 얻어요.","explanation":"타원의 음의 쪽 초점을 \\(B'\\)라 해요. 중심을 지나는 세로선에 대해 \\(A\\)와 \\(H\\), \\(B\\)와 \\(B'\\)가 서로 대칭이므로 \\(AB=HB'\\)예요. 따라서 둘레는 \\(AH+AB+BH=AH+HB'+HB\\)예요. 한 타원 위 점 \\(H\\)에서 두 초점까지 거리의 합은 장축의 길이 \\(2a\\)이므로 이 값은 \\((x_1+p)+(3p-x_1)=4p\\)예요. 주어진 둘레와 비교하면 \\(p+27=4p\\), 따라서 \\(p=9\\)예요.","check":{"prompt":"둘레 식에서 \\(x_1\\)이 사라지는 계산은 무엇인가요?","answer":"\\((x_1+p)+(3p-x_1)=4p\\)에서 \\(x_1\\)과 \\(-x_1\\)이 없어져요."}},{"id":"c3","label":"넓이와 포물선 식을 함께 풀어요","stepIds":["s6","s7","s8","s9"],"question":"\\(x_1(x_1+9)^2=100\\)에서 왜 \\(x_1=1\\)만 남나요?","hint":"넓이로 \\((x_1+9)y_1=60\\)을 얻고, \\(y_1^2=36x_1\\)과 결합해 인수분해해요.","explanation":"\\(AH\\)는 수평이고 \\(B\\)는 \\(x\\)축 위이므로 삼각형의 높이는 \\(y_1\\)이에요. 넓이 조건은 \\((1/2)(x_1+9)y_1=30\\), 즉 \\((x_1+9)y_1=60\\)이에요. 한편 포물선 식은 \\(y_1^2=36x_1\\)이에요. 첫 식에서 \\(y_1=60/(x_1+9)\\)를 넣으면 \\(x_1(x_1+9)^2=100\\)이고, \\((x_1-1)(x_1^2+19x_1+100)=0\\)으로 인수분해돼요. 이차식의 판별식은 \\(19^2-400=-39<0\\)이라 실근이 없으므로 \\(x_1=1\\)이에요. 제1사분면이므로 \\(y_1=6\\)을 택해요.","check":{"prompt":"\\(y_1^2=36\\)에서 \\(-6\\)을 택하지 않는 이유는 무엇인가요?","answer":"점 \\(A\\)가 제1사분면에 있으므로 \\(y_1>0\\)이어야 해요."}},{"id":"c4","label":"마지막 거리를 제곱해요","stepIds":["s10","s11","s12"],"question":"\\(HF^2\\)는 좌표 차로 어떻게 계산하나요?","hint":"\\(H=(-9,6)\\), \\(F=(9,0)\\)의 가로 차와 세로 차를 써요.","explanation":"\\(H=(-9,6)\\), \\(F=(9,0)\\)이므로 가로 차는 \\(18\\), 세로 차는 \\(-6\\)이에요. 따라서 \\(k^2=HF^2=18^2+(-6)^2=324+36=360\\)이에요.","check":{"prompt":"거리 \\(k\\)를 먼저 제곱근으로 구할 필요가 없는 이유는 무엇인가요?","answer":"문제가 바로 \\(k^2\\)을 묻기 때문에 좌표 차의 제곱합이 곧 답이에요."}}],"takeaway":["축과 나란한 타원에서 수평인 현의 중점은 중심을 지나는 세로선 위에 있어요.","대칭인 점과 두 초점까지의 거리합을 연결하면 둘레의 여러 선분을 장축 길이로 바꿀 수 있어요.","제1사분면 조건은 제곱식에서 생기는 두 부호 중 양수를 고르게 해요."]};</script>
