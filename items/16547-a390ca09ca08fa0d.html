<script>window.HandStudyRecord={"itemId":16547,"sourceLabel":"2019 평가원 고3 수리가형 9월 27번","adminYear":2019,"grade":3,"month":9,"number":27,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"초점이 $F$인 포물선 $y^{2 }= 4x$ 위에 서로 다른 두 점 $A$, $B$가 있다. 두 점 $A$, $B$의 $x$좌표는 $1$ 보다 큰 자연수이고 삼각형 $AFB$의 무게중심의 $x$좌표가 $6$일 때, $\\overline{AF} \\times \\overline{BF}$의 최댓값을 구하시오. [4점]","answer":"90","sourceHash":"60637f8631fac56220f61615259a63b343f6936e3b1bb70f2fac8e5322ea42bb","steps":[{"id":"s1","latex":"F=(1,0),\\qquad AF=x_A+1,\\quad BF=x_B+1"},{"id":"s2","latex":"\\frac{x_A+x_B+1}{3}=6\\Rightarrow x_A+x_B=17"},{"id":"s3","latex":"AF\\cdot BF=(x_A+1)(x_B+1)=x_Ax_B+18"},{"id":"s4","latex":"x_A,x_B\\in\\mathbb N,\\ x_A,x_B>1,\\ x_A\\ne x_B"},{"id":"s5","latex":"x_A+x_B=17\\Rightarrow\\max x_Ax_B=8\\cdot9"},{"id":"s6","latex":"\\max(AF\\cdot BF)=72+18=\\boxed{90}"}],"diagram":null,"contentHash":"63d4491aa8f6c9ee3819ffa3d726333fee869396de57b264b9c7498e760c26de","questionHtml":"\u003cp class=\"hp htall\">초점이 \u003cspan class=\"heq\">\\({F }\\)\u003c/span>인 포물선 \u003cspan class=\"heq\">\\(y^{2 }= 4x\\)\u003c/span> 위에 서로 다른 두점 \u003cspan class=\"heq\">\\({A}\\)\u003c/span>, \u003cspan class=\"heq\">\\({B}\\)\u003c/span>가 있다. 두 점 \u003cspan class=\"heq\">\\({A}\\)\u003c/span>, \u003cspan class=\"heq\">\\({B}\\)\u003c/span>의 \u003cspan class=\"heq\">\\(x\\)\u003c/span>좌표는 \u003cspan class=\"heq\">\\(1\\)\u003c/span> 보다 큰 자연수이고 삼각형 \u003cspan class=\"heq\">\\({A F B}\\)\u003c/span>의 무게중심의 \u003cspan class=\"heq\">\\(x\\)\u003c/span>좌표가 \u003cspan class=\"heq\">\\(6\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(\\overline{{A F}} \\times  \\overline{{B F}}\\)\u003c/span>의 최댓값을 구하시오.\u003c/p>\u003cp class=\"hp\">\u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/81b58decfec50f4439825274.png\" style=\"width:307px;max-width:100%\">\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash"
