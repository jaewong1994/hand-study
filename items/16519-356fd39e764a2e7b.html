<script>window.HandStudyRecord={"itemId":16519,"sourceLabel":"2019 평가원 고3 수리가형 6월 29번","adminYear":2019,"grade":3,"month":6,"number":29,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"좌표평면에서 곡선 $C\\,:\\,y= \\sqrt{8-x ^{2}} (2 \\leq x \\leq 2 \\sqrt{2} )$ 위의 점 ${P}$에 대하여 $\\overline{{O Q}} = 2$, $∠{P O Q} = \\frac{ \\pi}{4}$를 만족시키고 직선 ${O P}$의 아랫부분에 있는 점을 ${Q}$라 하자. 점 ${P}$가 곡선 $C$ 위를 움직일 때, 선분 ${O P}$ 위를 움직이는 점 ${X}$와 선분 ${O Q}$ 위를 움직이는 점 ${Y}$에 대하여 \n $\\vec{OZ}=\\vec{OP}+\\vec{OX}+\\vec{OY}$\n를 만족시키는 점 ${Z}$가 나타내는 영역을 $D$라 하자. 영역 $D$에 속하는 점 중에서 $y$축과의 거리가 최소인 점을 ${R}$라 할 때, 영역 $D$에 속하는 점 ${Z}$에 대하여 $\\vec{{O R}} \\cdot \\vec{{O Z}}$의 최댓값과 최솟값의 합이 $a+b \\sqrt{2}$이다. $a+ b$의 값을 구하시오. (단, ${O}$는 원점이고, $a$와 $b$는 유리수이다.) [4점]","answer":"24","sourceHash":"6d8cd386e01728a5440b5254b6e7cc22fc60d89c756ccd79cdcf2703ec5fc041","steps":[{"id":"s1","latex":"\\overrightarrow{OX}=s\\overrightarrow{OP},\\quad\\overrightarrow{OY}=t\\overrightarrow{OQ}\\quad(0\\le s,t\\le1)"},{"id":"s2","latex":"\\overrightarrow{OP}=2\\sqrt2(\\cos\\theta,\\sin\\theta),\\quad0\\le\\theta\\le\\dfrac\\pi4"},{"id":"s3","latex":"\\overrightarrow{OQ}=2\\left(\\cos\\!\\left(\\theta-\\dfrac\\pi4\\right),\\sin\\!\\left(\\theta-\\dfrac\\pi4\\right)\\right)"},{"id":"s4","latex":"\\overrightarrow{OZ}=(1+s)\\overrightarrow{OP}+t\\overrightarrow{OQ}"},{"id":"s5","latex":"x_Z\\text{의 최솟값은 }2\\Rightarrow R=(2,2)"},{"id":"s6","latex":"\\overrightarrow{OR}\\cdot\\overrightarrow{OZ}=8(1+s)\\cos\\!\\left(\\theta-\\dfrac\\pi4\\right)+4\\sqrt2\\,t\\sin\\theta"},{"id":"s7","latex":"\\overrightarrow{OR}\\cdot\\overrightarrow{OZ}\\text{의 최댓값은 }20\\ (\\theta=\\tfrac\\pi4,s=t=1),\\quad\\text{최솟값은 }4\\sqrt2\\ (\\theta=0,s=t=0)"},{"id":"s8","latex":"a+b=20+4=24"}],"diagram":null,"contentHash":"d56b2607872033a9533883aaa0735a82339dd698f63a9c834f7c15ca5b7dcc51","questionHtml":"<p class=\"hp htall\">좌표평면에서 곡선 <span class=\"heq\">\\(C\\,:\\,y= \\sqrt{8-x^{2}} (2 \\leq x \\leq 2 \\sqrt{2} )\\)<\/span> 위의 점 <span class=\"heq\">\\({P}\\)<\/span>에 대하여 <span class=\"heq\">\\(\\overline{{O Q}} = 2\\)<\/span>, <span class=\"heq\">\\(∠{P O Q} = \\dfrac{ \\pi}{4}\\)<\/span>를 만족시키고 직선 <span class=\"heq\">\\({O P}\\)<\/span>의 아랫부분에 있는 점을 <span class=\"heq\">\\({Q}\\)<\/span>라 하자. <br>점 <span class=\"heq\">\\({P}\\)<\/span>가 곡선 <span class=\"heq\">\\(C\\)<\/span> 위를 움직일 때, 선분 <span class=\"heq\">\\({O P}\\)<\/span> 위를 움직이는 점 <span class=\"heq\">\\({X}\\)<\/span>와 선분 <span class=\"heq\">\\({O Q}\\)<\/span> 위를 움직이는 점 <span class=\"heq\">\\({Y}\\)<\/span>에 대하여<\/p><p class=\"hp\">&emsp;<span class=\"heq\">\\(\\overrightarrow{OZ}=\\overrightarrow{OP}+\\overrightarrow{OX}+\\overrightarrow{OY}\\)<\/span><\/p><p class=\"hp\">를 만족시키는 점 <span class=\"heq\">\\({Z}\\)<\/span>가 나타내는 영역을 <span class=\"heq\">\\(D\\)<\/span>라 하자. <br>영역 <span class=\"heq\">\\(D\\)<\/span>에 속하는 점 중에서 <span class=\"heq\">\\(y\\)<\/span>축과의 거리가 최소인 점을 <span class=\"heq\">\\({R}\\)<\/span>라 할 때, 영역 <span class=\"heq\">\\(D\\)<\/span>에 속하는 점 <span class=\"heq\">\\({Z}\\)<\/span>에 대하여 <span class=\"heq\">\\(\\vec{{O R}} \\cdot \\vec{{O Z}}\\)<\/span>의 최댓값과 최솟값의 합이 <span class=\"heq\">\\(a+b \\sqrt{2}\\)<\/span>이다. <span class=\"heq\">\\(a+ b\\)<\/span>의 값을 구하시오. (단, <span class=\"heq\">\\({O}\\)<\/span>는 원점이고, <span class=\"heq\">\\(a\\)<\/span>와 <span class=\"heq\">\\(b\\)<\/span>는 유리수이다.) <span class=\"hscore\">[4점]<\/span><\/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"2737c5eae16363cf2bc8c694f002fd92fac83d419c67576221df53e84f110993"};</script>
<script>window.HandStudyGuide={"itemId":16519,"sourceHash":"6d8cd386e01728a5440b5254b6e7cc22fc60d89c756ccd79cdcf2703ec5fc041","contentHash":"d56b2607872033a9533883aaa0735a82339dd698f63a9c834f7c15ca5b7dcc51","overview":{"goal":"움직이는 세 선분의 매개변수를 정리해 영역의 가장 왼쪽 점과 내적의 범위를 구해요.","firstLook":"점 \\(P\\)는 반지름 \\(2\\sqrt2\\)인 원호 위를 움직이고, \\(X,Y\\)는 각 선분의 비율로 나타낼 수 있어요.","conditions":[{"label":"원호","meaning":"\\(0\\le\\theta\\le\\pi/4\\)에서 \\(OP=2\\sqrt2\\)예요."},{"label":"선분 위 점","meaning":"\\(0\\le s,t\\le1\\)인 비율을 사용해요."}]},"chapters":[{"id":"c1","label":"모든 움직임을 세 매개변수로 나타내요","stepIds":["s1","s2","s3","s4"],"question":"\\(OZ\\)는 \\(s,t,\\theta\\)로 어떻게 나타나나요?","hint":"\\(X,Y\\)가 각 선분을 얼마나 갔는지 비율로 놓아요.","explanation":"\\(OX=sOP\\), \\(OY=tOQ\\)로 놓으면 \\(0\\le s,t\\le1\\)이에요. 원호에서 \\(OP=2\\sqrt2(\\cos\\theta,\\sin\\theta)\\), \\(0\\le\\theta\\le\\pi/4\\)이고, \\(Q\\)는 \\(OP\\)보다 아래로 \\(45^\\circ\\) 돌아간 길이 \\(2\\)의 점이므로 \\(OQ=2(\\cos(\\theta-\\pi/4),\\sin(\\theta-\\pi/4))\\)예요. 따라서 \\(OZ=(1+s)OP+tOQ\\)예요.","check":{"prompt":"\\(s,t\\)의 범위에 양 끝이 모두 포함되는 이유는 무엇인가요?","answer":"\\(X,Y\\)가 각각 원점과 선분의 다른 끝점에도 놓일 수 있기 때문이에요."}},{"id":"c2","label":"영역에서 가장 왼쪽 점을 찾아요","stepIds":["s5"],"question":"\\(x_Z\\)의 최솟값은 왜 \\(2\\)인가요?","hint":"두 항이 모두 음이 아닌 것을 이용해 가장 작은 선택을 해요.","explanation":"\\(x_Z=2\\sqrt2(1+s)\\cos\\theta+2t\\cos(\\theta-\\pi/4)\\)예요. 주어진 범위에서 두 코사인은 음이 아니므로 \\(s=t=0\\)일 때 가장 작아질 수 있어요. 그러면 \\(x_Z=2\\sqrt2\\cos\\theta\\)이고 이는 \\(\\theta=\\pi/4\\)에서 \\(2\\)로 최소예요. 그때 \\(Z=P=(2,2)\\)이므로 \\(y\\)축과 거리가 가장 짧은 점은 \\(R=(2,2)\\)예요.","check":{"prompt":"최솟값을 만드는 \\(s,t,\\theta\\)는 무엇인가요?","answer":"\\(s=0,t=0,\\theta=\\pi/4\\)예요."}},{"id":"c3","label":"내적을 매개변수식으로 바꿔요","stepIds":["s6"],"question":"\\(OR\\cdot OZ\\)는 어떤 식이 되나요?","hint":"\\(OR=(2,2)\\)와 두 방향벡터를 각각 내적해요.","explanation":"\\(OR=(2,2)\\)이고 \\(OZ=(1+s)OP+tOQ\\)예요. \\(OR\\cdot OP=4\\sqrt2(\\cos\\theta+\\sin\\theta)=8\\cos(\\theta-\\pi/4)\\), \\(OR\\cdot OQ=4\\{\\cos(\\theta-\\pi/4)+\\sin(\\theta-\\pi/4)\\}=4\\sqrt2\\sin\\theta\\)예요. 따라서 내적은 \\(8(1+s)\\cos(\\theta-\\pi/4)+4\\sqrt2t\\sin\\theta\\)예요.","check":{"prompt":"\\(OR\\cdot OP\\)를 합각으로 바꾸면 무엇인가요?","answer":"\\(8\\cos(\\theta-\\pi/4)\\)예요."}},{"id":"c4","label":"최댓값과 최솟값을 끝점에서 확인해요","stepIds":["s7","s8"],"question":"내적의 최대와 최소는 어디에서 생기나요?","hint":"각 항의 계수가 음이 아니므로 먼저 \\(s,t\\)의 끝값을 정해요.","explanation":"최댓값은 \\(s=t=1\\)에서 찾으면 되고, 두 삼각함수 모두 \\(0\\le\\theta\\le\\pi/4\\)에서 \\(\\theta=\\pi/4\\)일 때 가장 커서 \\(16+4=20\\)이에요. 최솟값은 \\(s=t=0\\)에서 \\(8\\cos(\\theta-\\pi/4)\\)를 최소로 하면 되고, \\(\\theta=0\\)에서 \\(4\\sqrt2\\)예요. 합은 \\(20+4\\sqrt2\\)이므로 \\(a=20,b=4\\), 따라서 \\(a+b=24\\)예요.","check":{"prompt":"최솟값에서 \\(t=0\\)을 고르는 이유는 무엇인가요?","answer":"\\(4\\sqrt2t\\sin\\theta\\ge0\\)이라 이 항을 없애야 작아져요."}}],"takeaway":["선분 위 점은 \\(0\\)부터 \\(1\\) 사이의 비율 매개변수로 표현해요.","좌표의 최솟값을 구할 때 각 항의 부호를 먼저 확인해요.","여러 매개변수의 극값은 각 변수의 단조성과 끝점 실현을 함께 확인해요."]};</script>
