<script>window.HandStudyRecord={"itemId":18298,"sourceLabel":"2025 교육청 고3 수학확통 7월 30번","adminYear":2025,"grade":3,"month":7,"number":30,"track":"확통","points":4,"scoreStatus":"confirmed_4_direct","questionText":"$1\\,$부터 $4\\,$까지의 자연수가 하나씩 적힌 $4\\,$장의 카드가 들어 있는 주머니 ${{A}}\\,$와 $2\\,$부터 $5\\,$까지의 자연수가 하나씩 적힌 $4\\,$장의 카드가 들어 있는 주머니 ${{B}}\\,$가 있다. 두 주머니 ${{A}}$, ${{B}}\\,$와 한 개의 주사위를 사용하여 다음 시행을 한다.\n 주사위를 한 번 던져 나온 눈의 수가 $k\\,$일 때,$k\\,$가 $3\\,$의 배수이면주머니 ${{A}}\\,$에서 임의로 $2\\,$장의 카드를 동시에 꺼낸 후 주머니 ${{B}}\\,$에서 임의로 $2\\,$장의 카드를 동시에 꺼내고,$k\\,$가 $3\\,$의 배수가 아니면주머니 ${{A}}\\,$에서 임의로 $1\\,$장의 카드를 꺼낸 후 주머니 ${{B}}\\,$에서 임의로 $1\\,$장의 카드를 꺼낸다.\n이 시행을 한 번 하여 두 주머니 ${{A}}$, ${{B}}\\,$에서 꺼낸 카드 중 같은 숫자가 적힌 카드가 있을 때, 꺼낸 카드 중 숫자 $4\\,$가 적힌 카드의 개수가 $2\\,$일 확률은 $\\frac{q}{p}\\,$이다. $p+q\\,$의 값을 구하시오. (단, $p\\,$와 $q\\,$는 서로소인 자연수이다.) [4점]\n${{A}}$$B$","answer":"34","sourceHash":"5ab2e78bb47a71ff1b9ff9a9693cbb0592919c4dcb64b903d066f81d0e590af1","steps":[{"id":"s1","latex":"K\\equiv0\\pmod3:\\quad\\#\\Omega=\\binom42^2=36"},{"id":"s2","latex":"E=\\{\\text{공통 숫자 존재}\\}:\\quad\\#E=24"},{"id":"s3","latex":"F=\\{E\\text{이고 숫자 }4\\text{ 카드가 두 장}\\}:\\quad\\#F=3\\cdot3=9"},{"id":"s4","latex":"K\\not\\equiv0\\pmod3:\\quad\\#\\Omega=16,\\quad\\#E=3,\\quad\\#F=1"},{"id":"s5","latex":"P(F\\mid E)=\\frac{\\frac13\\frac9{36}+\\frac23\\frac1{16}}{\\frac13\\frac{24}{36}+\\frac23\\frac3{16}}=\\frac9{25}"},{"id":"s6","latex":"p+q=25+9=34"}],"diagram":null,"contentHash":"dc29a8cdb50427f5aaf5dd66fe1a11662c95441359b88ec2798d6b11db49e1a2","questionHtml":"\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>부터 \u003cspan class=\"heq\">\\(4\\,\\)\u003c/span>까지의 자연수가 하나씩 적힌 \u003cspan class=\"heq\">\\(4\\,\\)\u003c/span>장의 카드가 들어 있는 주머니 \u003cspan class=\"heq\">\\({{A}}\\,\\)\u003c/span>와 \u003cspan class=\"heq\">\\(2\\,\\)\u003c/span>부터 \u003cspan class=\"heq\">\\(5\\,\\)\u003c/span>까지의 자연수가 하나씩 적힌 \u003cspan class=\"heq\">\\(4\\,\\)\u003c/span>장의 카드가 들어 있는 주머니 \u003cspan class=\"heq\">\\({{B}}\\ <script>window.HandStudyGuide={"itemId":18298,"sourceHash":"5ab2e78bb47a71ff1b9ff9a9693cbb0592919c4dcb64b903d066f81d0e590af1","contentHash":"dc29a8cdb50427f5aaf5dd66fe1a11662c95441359b88ec2798d6b11db49e1a2","overview":{"goal":"한 장씩 뽑는 경우와 두 장씩 뽑는 경우를 나누어 조건부확률을 계산해요.","firstLook":"주사위가 \\(3\\)의 배수일 확률은 \\(1/3\\), 아닐 확률은 \\(2/3\\)이에요.","conditions":[{"label":"조건 사건","meaning":"두 주머니에서 뽑은 카드 사이에 같은 숫자가 하나라도 있어요."},{"label":"목표 사건","meaning":"조건을 만족하면서 숫자 \\(4\\) 카드 두 장을 모두 뽑아요."}]},"chapters":[{"id":"c1","label":"두 장씩 뽑는 경우를 세어요","stepIds":["s1","s2","s3"],"question":"이 경우 조건 사건과 목표 사건은 각각 몇 가지인가요?","hint":"전체 \\(36\\)가지에서 공통 숫자가 없는 경우를 빼요.","explanation":"각 주머니에서 두 장씩 고르는 전체 경우는 \\(\\binom42^2=36\\)가지예요. 공통 가능한 숫자는 \\(2,3,4\\)이고 직접 여집합을 세면 공통 숫자가 없는 경우가 \\(12\\)가지여서 조건 사건은 \\(24\\)가지예요. 숫자 \\(4\\) 두 장을 모두 포함하려면 각 주머니에서 나머지 한 장을 고르는데, \\(A\\)에서는 \\(3\\)가지, \\(B\\)에서도 \\(3\\)가지라 \\(9\\)가지이고 모두 공통 숫자 \\(4\\)를 가져요.","check":{"prompt":"목표 사건 \\(9\\)가지는 조건 사건에 모두 포함되나요?","answer":"두 주머니에서 모두 \\(4\\)를 뽑으므로 포함돼요."}},{"id":"c2","label":"한 장씩 뽑는 경우를 세어요","stepIds":["s4"],"question":"이 경우 조건 사건은 몇 가지인가요?","hint":"같은 숫자는 두 주머니에 공통으로 들어 있는 수만 가능해요.","explanation":"한 장씩 뽑으면 순서쌍은 \\(4\\cdot4=16\\)가지예요. 같은 숫자는 공통 원소 \\(2,3,4\\)이므로 조건 사건은 \\(3\\)가지이고, 그중 숫자 \\(4\\) 카드가 두 장인 경우는 \\((4,4)\\) 한 가지예요.","check":{"prompt":"공통으로 들어 있는 숫자는 무엇인가요?","answer":"\\(2,3,4\\)예요."}},{"id":"c3","label":"주사위 확률을 가중해 조건부확률을 구해요","stepIds":["s5","s6"],"question":"요구한 조건부확률은 얼마인가요?","hint":"분자와 분모에 주사위 경우의 확률을 각각 곱해 더해요.","explanation":"목표 사건의 전체 확률은 \\(\\frac13\\frac9{36}+\\frac23\\frac1{16}=1/8\\)이고, 조건 사건의 전체 확률은 \\(\\frac13\\frac{24}{36}+\\frac23\\frac3{16}=25/72\\)예요. 따라서 조건부확률은 \\((1/8)/(25/72)=9/25\\)예요. 서로소인 \\(p=25,q=9\\)이므로 \\(p+q=34\\)예요.","check":{"prompt":"분모에는 어떤 확률이 들어가나요?","answer":"같은 숫자 카드가 적어도 한 쌍 있는 조건 사건의 전체 확률이에요."}}],"takeaway":["먼저 주사위 결과에 따라 표본공간을 나누고 각 경우의 사건 수를 세어요.","조건부확률의 분자와 분모 모두 경우별 확률을 가중해 더해요.","목표 사건이 조건 사건에 포함되는지도 확인해요."]};</script>
