  <script>window.HandStudyRecord={"adminYear":2021,"answer":"③","contentHash":"d4e9ee46549875ee76cec74b5193fc54aeda9cea780bafd542c950a3d2216608","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24772,"month":11,"number":11,"points":4,"preview":false,"questionHtml":"\u003cp>양수 \u003cspan class=\"heq\">\\(a\\)\u003c/span>에 대하여 집합 \u003cspan class=\"heq\">\\(\\left\\{x\\,\\middle|\\,-\\frac a2&lt;x\\le a,\\ x\\ne\\frac a2\\right\\}\\)\u003c/span>에서 정의된 함수\u003c/p>\u003cp> \u003cspan class=\"heq\">\\(f \\left( x \\right)\\)\u003c/span>\u003cspan class=\"heq\">\\(=\\tan\\, \\frac{\\pi\\,x}{a}\\)\u003c/span>\u003c/p>\u003cp>가 있다. 그림과 같이 함수 \u003cspan class=\"heq\">\\(y\\)\u003c/span>\u003cspan class=\"heq\">\\(=f \\left( x \\right)\\)\u003c/span>의 그래프 위의 세 점 \u003cspan class=\"heq\">\\(O\\)\u003c/span>, \u003cspan class=\"heq\">\\(A\\)\u003c/span>, \u003cspan class=\"heq\">\\(B\\)\u003c/span>를 지나는 직선이 있다. 점 \u003cspan class=\"heq\">\\(A\\)\u003c/span>를 지나고 \u003cspan class=\"heq\">\\(x\\)\u003c/span>축에 평행한 직선이 함수 \u003cspan class=\"heq\">\\(y\\)\u003c/span>\u003cspan class=\"heq\">\\(=f \\left( x \\right)\\)\u003c/span>의 그래프와 만나는 점 중 \u003cspan class=\"heq\">\\(A\\)\u003c/span>가 아닌 점을 \u003cspan class=\"heq\">\\(C\\)\u003c/span>라 하자. 삼각형 \u003cspan class=\"heq\">\\(A B C\\)\u003c/span>가 정삼각형일 때, 삼각형 \u003cspan class=\"heq\">\\(A B C\\)\u003c/span>의 넓이는? (단, \u003cspan class=\"heq\">\\(O\\)\u003c/span>는 원점이다.) [4점]\u003c/p>\u003cfigure>\u003cimg class=\"hfig\" src=\"../assets/csat/24772-4959136fe4acb90e.png\" alt=\"2021년 시행 수능 11번 문항 그림 \" style=\"max-width:100%;width:420px\">\u003c/figure>\u003cdiv class=\"hchoices\">\u003cdiv class=\"hch\">① \u003cspan class=\"heq\">\\(\\frac{3 \\sqrt{3}}{2}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">② \u003cspan class=\"heq\">\\(\\frac{17 \\sqrt{3}}{12}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">③ \u003cspan class=\"heq\">\\(\\frac{4 \\sqrt{3}}{3}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">④ \u003cspan class=\"heq\">\\(\\frac{5 \\sqrt{3}}{4}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">⑤ \u003cspan class=\"heq\">\\(\\frac{7 \\sqrt{3}}{6}\\)\u003c/span>\u003c/div>\u003c/div>","questionText":"양수 $a$에 대하여 집합 $\\left\\{ x\\, \\left| \\,- \\frac{a}{2} \u003cx \\leq a \\right. ,\\,x != \\frac{a}{2} \\right.$$\\left. \\pi \\leq {#} \\right\\}$에서 정의된 함수\n $f \\left( x \\right)$$=\\tan\\, \\frac{\\pi\\,x}{a}$\n가 있다. 그림과 같이 함수 $y$$=f \\left( x \\right)$의 그래프 위의 세 점 $O$, $A$, $B$를 지나는 직선이 있다. 점 $A$를 지나고 $x$축에 평행한 직선이 함수 $y$$=f \\left( x \\right)$의 그래프와 만나는 점 중 $A$가 아닌 점을 $C$라 하자. 삼각형 $A B C$가 정삼각형일 때, 삼각형 $A B C$의 넓이는? (단, $O$는 원점이다.) [4점]\n\n① $\\frac{3 \\sqrt{3}}{2}$ ② $\\frac{17 \\sqrt{3}}{12}$ ③ $\\frac{4 \\sqrt{3}}{3}$ ④ $\\frac{5 \\sqrt{3}}{4}$ ⑤ $\\frac{7 \\sqrt{3}}{6}$","sourceHash":"ea61e7962ea3376eaa43ee0ad3b73210a59d6df6b81130d5971a81ce44448264","sourceKind":"csat","sourceLabel":"2021년 시행 수능 · 2022학년도 · 공통 · 11번","steps":[{"id":"s1","latex":"\\text{주기}=a\\quad\\Rightarrow\\quad\\overline{\\mathrm{AC}}=a"},{"id":"s2","latex":"\\triangle\\mathrm{ABC}\\text{가 정삼각형},\\quad\\mathrm{AC}\\parallel x\\text{축}\\quad\\Rightarrow\\quad\\mathrm{AB}:y=\\sqrt3x"},{"id":"s3","latex":"\\mathrm B=(t,\\sqrt3t),\\quad\\mathrm A=(-t,-\\sqrt3t)\\quad(t>0)"},{"id":"s4","latex":"\\overline{\\mathrm{AB}}=\\sqrt{(2t)^2+(2\\sqrt3t)^2}=4t=a"},{"id":"s5","latex":"\\mathrm C=(3t,-\\sqrt3t),\\quad-\\sqrt3t=\\tan\\frac{3\\pi t}{4t}=-1"},{"id":"s6","latex":"t=\\frac1{\\sqrt3},\\quad\\text{넓이}=\\frac{\\sqrt3}{4}\\left(\\frac4{\\sqrt3}\\right)^2=\\frac{4\\sqrt3}{3}\\quad\\therefore\\text{③}"}],"track":"공통"};</script>
