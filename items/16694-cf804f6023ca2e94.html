<script>window.HandStudyRecord={"itemId":16694,"sourceLabel":"2020 교육청 고3 수리가형 4월 29번","adminYear":2020,"grade":3,"month":4,"number":29,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"어느 학교 도서관에서 독서프로그램 운영을 위해 철학, 사회과학, 자연과학, 문학, 역사 분야에 해당하는 책을 각 분야별로 $10$권씩 총 $50$권을 준비하였다. 한 학급에서 이 $50$권의 책 중 $24$권의 책을 선택하려고 할 때, 다음 조건을 만족시키도록 선택하는 경우의 수를 구하시오. (단, 같은 분야에 해당하는 책은 서로 구별하지 않는다.) [4점]\n(가) 철학, 사회과학, 자연과학 각각의 분야에 해당하는 책은 $4$권 이상씩 선택한다.(나) 문학 분야에 해당하는 책은 선택하지 않거나 $4$권 이상 선택한다.(다) 역사 분야에 해당하는 책은 선택하지 않거나 $4$권 이상 선택한다.","answer":"396","sourceHash":"bf4ce72622426aaae5d7d9946fc32ac8fa8486456ba239c7189973b90cccce70","steps":[{"id":"s1","latex":"N_1={}_3H_{12}-3{}_3H_5=28"},{"id":"s2","latex":"N_2={}_4H_8-4{}_4H_1=149"},{"id":"s3","latex":"N_3={}_5H_4=70"},{"id":"s4","latex":"N=28+2\\cdot149+70=\\boxed{396}"}],"diagram":null,"contentHash":"ae04ea33858c23b62976bde6256384f7b5acaaf30f801b50ed7ffb38ddb66d10","questionHtml":"\u003cp class=\"hp\">어느 학교 도서관에서 독서프로그램 운영을 위해 철학, 사회과학, 자연과학, 문학, 역사 분야에 해당하는 책을 각 분야별로 \u003cspan class=\"heq\">\\(10\\)\u003c/span>권씩 총 \u003cspan class=\"heq\">\\(50\\)\u003c/span>권을 준비하였다. 한 학급에서 이 \u003cspan class=\"heq\">\\(50\\)\u003c/span>권의 책 중 \u003cspan class=\"heq\">\\(24\\)\u003c/span>권의 책을 선택하려고 할 때, 다음 조건을 만족시키도록 선택하는 경우의 수를 구하시오. (단, 같은 분야에 해당하는 책은 서로 구별하지 않는다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) 철학, 사회과학, 자연과학 각각의 분야에 해당하는 책은 \u003cspan class=\"heq\">\\(4\\)\u003c/span>권 이상씩 선택한다.\u003c/p>\u003cp class=\"hp\">(나) 문학 분야에 해당하는 책은 선택하지 않거나 \u003cspan class=\"heq\">\\(4\\)\u003c/span>권 이상 선택한다.\u003c/p>\u003cp class=\"hp\">(다) 역사 분야에 해당하는 책은 선택하지 않거나 \u003cspan class=\"heq\">\\(4\\)\u003c/span>권 이상 선택한다.\u003c/p>\u003c/div>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/d0982bd83403cc78e7762598.png\" style=\"width:276px;max-width:100%\">\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","edit <script>window.HandStudyGuide={"itemId":16694,"sourceHash":"bf4ce72622426aaae5d7d9946fc32ac8fa8486456ba239c7189973b90cccce70","contentHash":"ae04ea33858c23b62976bde6256384f7b5acaaf30f801b50ed7ffb38ddb66d10","overview":{"goal":"문학과 역사를 선택하는 분야 수로 경우를 나누고, 각 분야의 최소 선택량을 먼저 뺀 뒤 분야별 10권 상한을 포함배제로 처리해요.","firstLook":"철학·사회과학·자연과학은 항상 4권 이상이고, 문학·역사는 0권 또는 4권 이상이에요. 따라서 뒤의 두 분야 중 실제 선택하는 분야가 0개, 1개, 2개인 경우를 나눠요.","conditions":[{"label":"분야별 상한","meaning":"각 분야에서 최대 10권까지 선택할 수 있어요."},{"label":"같은 분야","meaning":"같은 분야의 책은 구별하지 않으므로 분야별 선택 권수만 세어요."},{"label":"전체 권수","meaning":"다섯 분야에서 고른 권수의 합은 24권이에요."}]},"chapters":[{"id":"c1","label":"문학과 역사를 모두 고르지 않는 경우를 세어요","stepIds":["s1"],"question":"첫 세 분야에서만 24권을 고르면 몇 가지인가요?","hint":"각 4권을 먼저 배정하고 남은 12권을 세 분야에 나누되 추가분은 6 이하예요.","explanation":"첫 세 분야에 \\(4\\)권씩 먼저 배정하면 남은 \\(12\\)권을 세 변수에 나눠요. 상한을 무시하면 \\({}_3\\mathrm H_{12}=91\\)가지예요.\n\n어느 한 분야의 추가분이 \\(7\\) 이상이면 그 분야 총수가 \\(11\\)권 이상이라 안 돼요. 그 분야에서 \\(7\\)을 빼면 남은 \\(5\\)를 세 분야에 나누는 \\({}_3\\mathrm H_5=21\\)가지이고, 위반 분야 선택이 \\(3\\)가지예요. 두 분야가 동시에 \\(7\\) 이상일 수는 합이 \\(14>12\\)라 교집합이 없어요. 따라서 \\(91-3\\cdot21=28\\)가지예요.","check":{"prompt":"추가분의 허용 최댓값이 6인 이유는 무엇인가요?","answer":"이미 4권을 골랐고 분야별 책은 10권뿐이므로 더 고를 수 있는 것은 6권이에요."}},{"id":"c2","label":"문학과 역사 중 한 분야만 고르는 경우를 세어요","stepIds":["s2"],"question":"선택한 추가 분야를 고정하면 몇 가지인가요?","hint":"네 활성 분야에 최소 4권씩 배정한 뒤 남은 8권을 나누어요.","explanation":"문학 또는 역사 중 한 분야만 활성화했다고 고정해요. 네 분야에 \\(4\\)권씩 배정하면 남은 \\(8\\)권을 네 변수에 나누므로 상한 없이 \\({}_4\\mathrm H_8=165\\)가지예요.\n\n추가분이 \\(7\\) 이상인 분야를 하나 정하면 \\(7\\)을 빼고 남은 \\(1\\)을 네 분야에 나누는 \\({}_4\\mathrm H_1=4\\)가지예요. 위반 분야도 \\(4\\)개라 \\(165-4\\cdot4=149\\)가지예요. 실제 활성화할 분야가 문학 또는 역사 두 가지이므로 마지막에 두 배 해요.","check":{"prompt":"두 분야가 동시에 상한을 넘을 수 있나요?","answer":"남은 추가분이 8뿐인데 두 분야가 각각 7 이상이면 14 이상이 필요해 불가능해요."}},{"id":"c3","label":"문학과 역사를 모두 고르는 경우를 세어요","stepIds":["s3"],"question":"다섯 분야가 모두 활성화되면 상한을 따로 뺄 필요가 없는 이유는 무엇인가요?","hint":"각 분야에 4권씩 배정한 뒤 남는 권수를 봐요.","explanation":"다섯 분야에 \\(4\\)권씩 먼저 배정하면 \\(20\\)권을 썼고 남은 것은 \\(4\\)권이에요. 어느 분야에 모두 더해도 총 \\(8\\)권이라 상한 \\(10\\)을 넘지 않아요. 따라서 남은 \\(4\\)권을 다섯 분야에 나누는 \\({}_5\\mathrm H_4={}_8\\mathrm C_4=70\\)가지예요.","check":{"prompt":"한 분야가 받을 수 있는 총권수의 이 경우 최댓값은 얼마인가요?","answer":"기본 4권에 남은 4권을 모두 받아 8권이에요."}},{"id":"c4","label":"서로 겹치지 않는 세 경우를 더해요","stepIds":["s4"],"question":"전체 선택 방법은 몇 가지인가요?","hint":"선택한 선택적 분야 수가 0,1,2인 경우를 더해요.","explanation":"전체는 \\(28+2\\cdot149+70=28+298+70=396\\)가지예요.","check":{"prompt":"149를 두 배 하는 이유는 무엇인가요?","answer":"활성화하는 한 분야가 문학일 수도 있고 역사일 수도 있기 때문이에요."}}],"takeaway":["0권 또는 일정 수 이상이라는 조건은 실제 선택하는 분야 수로 경우를 나누어요.","각 분야의 최소 선택량을 먼저 배정하면 남은 권수를 중복조합으로 셀 수 있어요.","분야별 상한은 초과량을 미리 빼는 포함배제로 처리하고 교집합 가능성도 확인해요."]};</script>
