<script>window.HandStudyRecord={"adminYear":2025,"answer":"16","contentHash":"7adff541e137cbe37639c390503350d1fcd0f2b8b735a4c795a17b720dea7332","diagram":null,"editionHash":"f1d5061c9f0622e7506a5e543c70a54ce1f97ab0de0e7c71ab2ff4ed6621ffbf","grade":3,"graphHash":"","graphPlan":null,"itemId":18261,"learningHash":"5dd41804ac14b8621ad7f781ff3ddb2ae79a8750f79305b8cee4f6df512e5138","month":7,"number":29,"points":4,"preview":false,"questionHtml":"\u003cp class=\"hp htall\">첫째항이 자연수이고 공비가 \u003cspan class=\"heq\">\\(-\\dfrac{1}{2}\\,\\)\u003c/span>인 등비수열 \u003cspan class=\"heq\">\\(\\left\\{a_{n} \\right\\}\\,\\)\u003c/span>이\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\(\\sum\\limits_{n=1}^{ \\infty } \\left( \\left|\\, a_{n}+1\\,\\right| -a_{n}-1 \\right)=26\\)\u003c/span>\u003c/p>\u003cp class=\"hp htall\">을 만족시킨다. \u003cspan class=\"heq\">\\(\\sum\\limits_{n=1}^{ \\infty }a_{n}\\,\\)\u003c/span>의 값을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","questionText":"첫째항이 자연수이고 공비가 $-\\frac{1}{2}\\,$인 등비수열 $\\left\\{a_{n} \\right\\}\\,$이\n $\\sum_{n=1}^{ \\infty } \\left( \\left|\\, a_{n}+1\\,\\right| -a_{n}-1 \\right)=26$\n을 만족시킨다. $\\sum_{n=1}^{ \\infty }a_{n}\\,$의 값을 구하시오. [4점]","scoreStatus":"confirmed_4_direct","sourceHash":"6ef63b69217ed8dd7c8ed2cc39e42b6abdfd2d17826bdab539fd66b32e696515","sourceLabel":"2025 교육청 고3 수학미적분 7월 29번","stepExplanations":{"s2":{"body":"\\(|a_n+1|-a_n-1\\)은 \\(a_n\\ge-1\\)이면 0이고 \\(a_n\u003c-1\\)이면 \\(-2(a_n+1)\\)입니다. 공비가 \\(-1/2\\)이므로 음수인 짝수 번째 항 중 절댓값이 1보다 큰 항만 합에 남습니다.","skillTags":["absolute-value-case","alternating-geometric"],"title":"합에 실제로 기여하는 항"},"s4":{"body":"\\(a_2=-a_1/2\\)와 \\(a_4=-a_1/8\\)은 \\(-1\\)보다 작고, \\(a_6=-a_1/32\\)는 \\(-1\\) 이상입니다. 따라서 합은 \\(2(a_1/2-1)+2(a_1/8-1)\\)이고, 이를 26과 같게 두면 \\(a_1=24\\)입니다.","skillTags":["active-term-range","piecewise-sum"],"title":"8\u003ca1\u003c=32에서 두 항만 남는다"},"s6":{"body":"\\(a_1=A>2\\)에서 각 짝수 항의 기여는 \\(A/2^{2j-1}>1\\)일 때 \\(2(A/2^{2j-1}-1)\\), 그렇지 않을 때 0입니다. \\(A\\)가 커지면 어느 항의 기여도 줄지 않고, 이미 남아 있는 \\(a_2\\)의 기여는 엄격히 커지므로 전체 합 26을 만드는 \\(A\\)는 하나뿐입니다.","skillTags":["monotonic-parameter","uniqueness"],"title":"다른 크기의 첫째항이 다시 답이 될 수 없다"}},"steps":[{"id":"s1","latex":"a_n=a_1\\left(-\\frac12\\right)^{n-1},\\quad a_1\\in\\mathbb N"},{"id":"s2","latex":"|a_n+1|-a_n-1=\\begin{cases}0&a_n\\ge-1\\\\-2(a_n+1)&a_n\u003c-1\\end{cases}"},{"id":"s3","latex":"a_1\\le2:\\ 0,\\qquad2\u003ca_1\\le8:\\ a_1-2\\ne26"},{"id":"s4","latex":"8\u003ca_1\\le32:\\quad2\\left(\\frac{a_1}{2}-1\\right)+2\\left(\\frac{a_1}{8}-1\\right)=26"},{"id":"s5","latex":"a_1=24\\quad(8\u003ca_1\\le32)"},{"id":"s6","latex":"A>2:\\quad\\sum(|a_n+1|-a_n-1)\\text{는 }A=a_1\\text{에 대해 엄격히 증가}\\Rightarrow a_1=24\\text{는 유일}"},{"id":"s7","latex":"\\sum_{n=1}^{\\infty}a_n=\\frac{24}{1+1/2}=16"}],"track":"미적분"};</script>
<script>window.HandStudyGuide={"itemId":18261,"sourceHash":"6ef63b69217ed8dd7c8ed2cc39e42b6abdfd2d17826bdab539fd66b32e696515","contentHash":"7adff541e137cbe37639c390503350d1fcd0f2b8b735a4c795a17b720dea7332","overview":{"goal":"절댓값 식에 실제로 값을 더하는 음수항만 골라 첫째항을 정하고 원래 등비급수의 합을 구해요.","firstLook":"\\(|a_n+1|-(a_n+1)\\)은 \\(a_n+1\\ge0\\)이면 0이고, \\(a_n<-1\\)일 때만 양의 값이 생겨요.","conditions":[{"label":"공비가 음의 이분의 일","meaning":"음수항은 짝수 번째에만 있고 그 절댓값은 네 번째마다 1/4배가 돼요."},{"label":"첫째항이 자연수","meaning":"기여하는 짝수항 개수가 바뀌는 경계 사이에서 방정식의 해를 찾고 범위를 재확인해요."}]},"chapters":[{"id":"c1","label":"값을 더하는 항만 가려내기","stepIds":["s1","s2","s3"],"question":"어떤 \\(a_n\\)에서 절댓값 식의 한 항이 0이 아니게 될까요?","hint":"\\(a_n+1\\)의 부호를 두 경우로 나누세요.","explanation":"\\(a_n=a_1(-1/2)^{n-1}\\)이에요. \\(a_n\\ge-1\\)이면 \\(|a_n+1|-a_n-1=0\\)이고, \\(a_n<-1\\)이면 값은 \\(-2(a_n+1)\\)이에요. 음수항은 짝수 번째뿐이에요.\n\n\\(a_1\\le2\\)이면 둘째항도 -1 이상이라 합은 0이에요. \\(2<a_1\\le8\\)이면 둘째항만 기여하여 값이 \\(2(a_1/2-1)=a_1-2\\)인데 이 범위에서는 26이 될 수 없어요.","check":{"prompt":"\\(a_n=-1\\)인 경계에서 기여값은 얼마인가요?","answer":"\\(|0|-(-1)-1=0\\)이므로 기여하지 않아요."}},{"id":"c2","label":"두 음수항이 기여하는 범위 풀기","stepIds":["s4","s5"],"question":"\\(8<a_1\\le32\\)에서는 어느 두 항이 -1보다 작을까요?","hint":"\\(a_2=-a_1/2\\), \\(a_4=-a_1/8\\), \\(a_6=-a_1/32\\)를 비교하세요.","explanation":"\\(8<a_1\\le32\\)이면 \\(a_2=-a_1/2<-1\\), \\(a_4=-a_1/8<-1\\)이고 \\(a_6=-a_1/32\\ge-1\\)이에요. 따라서 합은 \\(2(a_1/2-1)+2(a_1/8-1)=5a_1/4-4\\)예요. 이것이 26이므로 \\(5a_1/4=30\\), \\(a_1=24\\)예요. 실제로 \\(8<24\\le32\\)라 사용한 범위와 맞아요.","check":{"prompt":"\\(a_6\\)은 \\(a_1=24\\)에서 얼마이고 왜 기여하지 않나요?","answer":"\\(a_6=-24/32=-3/4\\)라 -1보다 크므로 해당 항의 값은 0이에요."}},{"id":"c3","label":"다른 해 배제하고 급수합 구하기","stepIds":["s6","s7"],"question":"더 큰 첫째항 구간에서 또 다른 해가 생기지 않는다고 어떻게 알 수 있을까요?","hint":"둘째항의 기여 \\(a_1-2\\)는 계속 증가하고 다른 기여도 줄어들지 않아요.","explanation":"\\(a_1>2\\)에서는 둘째항의 기여 \\(a_1-2\\)가 엄격히 증가해요. \\(a_1\\)이 커지면서 추가되는 다른 짝수항의 기여도 0에서 시작해 증가하므로 전체 합은 \\(a_1\\)이 커질수록 엄격히 증가해요. 이미 \\(a_1=24\\)에서 26이 되었으므로 다른 자연수 해는 없어요.\n\n원래 등비급수의 합은 \\(\\frac{24}{1-(-1/2)}=\\frac{24}{3/2}=16\\)이에요.","check":{"prompt":"새 짝수항이 기여하기 시작하는 경계에서 합이 갑자기 줄어들 수 있나요?","answer":"아니요. 경계에서는 그 새 항의 기여가 0에서 시작하고 이후 양수로 증가해요."}}],"takeaway":["절댓값 식은 안쪽 값의 부호를 먼저 나누어 0이 아닌 항만 골라요.","음의 공비에서는 부호가 번갈아 나타나므로 기여 가능한 번호를 먼저 정해요.","범위별 방정식의 해는 그 범위에 다시 넣고 전체 합의 증가로 유일성을 확인해요."]};</script>
