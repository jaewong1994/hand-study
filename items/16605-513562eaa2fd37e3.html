<script>window.HandStudyRecord={"itemId":16605,"sourceLabel":"2019 평가원 고3 수리나형 9월 30번","adminYear":2019,"grade":3,"month":9,"number":30,"track":"수리나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"최고차항의 계수가 $1$인 사차함수 $f(x)$에 대하여 네 개의 수 $f(- 1)$, $f(0)$, $f(1)$, $f(2)$가 이 순서대로 등차수열을 이루고, 곡선 $y = f(x)$ 위의 점 $(- 1,\\, f(- 1))$에서의 접선과 점 $(2,\\, f(2))$에서의 접선이 점 $(k,\\, 0)$에서 만난다. $f(2k)= 20$일 때, $f(4k)$의 값을 구하시오. (단, $k$는 상수이다.) [4점]","answer":"42","sourceHash":"3bd414809835fc3c5c32239d3215f423095589cbc57b4ce925a4d3968117cebd","steps":[{"id":"s1","latex":"f(x)=(x+1)x(x-1)(x-2)+dx+c"},{"id":"s2","latex":"f'(-1)=d-6,\\quad f'(2)=d+6"},{"id":"s3","latex":"(c-d)+(d-6)(k+1)=0"},{"id":"s4","latex":"(2d+c)+(d+6)(k-2)=0"},{"id":"s5","latex":"\\text{두 식의 차}\\Rightarrow12k=6\\Rightarrow k=\\frac12"},{"id":"s6","latex":"f(1)=d+c=20,\\quad c+\\frac d2=9"},{"id":"s7","latex":"d=22,\\ c=-2\\Rightarrow f(2)=2d+c=42"}],"diagram":null,"contentHash":"b94712f9df441f8fbf248f161a527e5f50f81cd72a46c041d47cb74e469f5edb","questionHtml":"\u003cp class=\"hp\">최고차항의 계수가 \u003cspan class=\"heq\">\\(1\\)\u003c/span>인 사차함수 \u003cspan class=\"heq\">\\(f(x)\\)\u003c/span>에 대하여 네 개의 수 \u003cspan class=\"heq\">\\(f(- 1)\\)\u003c/span>, \u003cspan class=\"heq\">\\(f(0)\\)\u003c/span>, \u003cspan class=\"heq\">\\(f(1)\\)\u003c/span>, \u003cspan class=\"heq\">\\(f(2)\\)\u003c/span>가 이 순서대로 등차수열을 이루고, 곡선 \u003cspan class=\"heq\">\\(y = f(x)\\)\u003c/span> 위의 점 \u003cspan class=\"heq\">\\((- 1,\\, f(- 1))\\)\u003c/span>에서의 접선과 점 \u003cspan class=\"heq\">\\((2,\\, f(2))\\)\u003c/span>에서의 접선이 점 \u003cspan class=\"heq\">\\((k,\\, 0)\\)\u003c/span>에서 만난다. \u003cspan class=\"heq\">\\(f(2k)= 20\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(f(4k)\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(k\\)\u003c/span>는 상수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"513562eaa2fd37e369a7bd812ab0351e39f99966345a74f3faf74a31b <script>window.HandStudyGuide={"itemId":16605,"sourceHash":"3bd414809835fc3c5c32239d3215f423095589cbc57b4ce925a4d3968117cebd","contentHash":"b94712f9df441f8fbf248f161a527e5f50f81cd72a46c041d47cb74e469f5edb","overview":{"goal":"네 함숫값이 등차수열이라는 조건을 선형함수와의 차로 바꾸고, 두 접선의 공통 x절편에서 k와 계수를 정해요.","firstLook":"네 점 \\(-1,0,1,2\\)에서 등차수열 값을 만드는 함수는 선형식이에요. \\(f\\)에서 그 선형식을 빼면 네 점을 모두 근으로 갖는 최고차항 계수 1의 사차식이 남아요.","conditions":[{"label":"등차수열","meaning":"\\(f(-1),f(0),f(1),f(2)\\)는 공차가 일정해요."},{"label":"두 접선","meaning":"두 접선 모두 같은 점 \\((k,0)\\)을 지나요."},{"label":"추가 함숫값","meaning":"\\(f(2k)=20\\)으로 남은 두 계수를 정해요."}]},"chapters":[{"id":"c1","label":"등차수열 조건을 사차식의 네 근으로 바꿔요","stepIds":["s1","s2"],"question":"함수 f는 왜 네 인수의 곱에 일차식을 더한 꼴일까요?","hint":"등차수열의 네 항을 x에 대한 일차식의 값으로 생각해요.","explanation":"등차수열 \\(f(-1),f(0),f(1),f(2)\\)와 같은 값을 네 점에서 갖는 일차식을 \\(dx+c\\)라 둘 수 있어요. 그러면 \\(f(x)-(dx+c)\\)는 \\(-1,0,1,2\\)를 모두 근으로 갖고 최고차항 계수가 \\(1\\)인 사차식이에요. 따라서\n\\[\nf(x)=(x+1)x(x-1)(x-2)+dx+c\n\\]\n예요.\n\n네 인수의 곱을 각 근에서 미분하면 \\(x=-1\\)에서 기울기는 \\((-1)(-2)(-3)=-6\\), \\(x=2\\)에서는 \\(3\\cdot2\\cdot1=6\\)이에요. 따라서 \\(f'(-1)=d-6\\), \\(f'(2)=d+6\\)이에요.","check":{"prompt":"\\(f(-1)\\)과 \\(f(2)\\)는 각각 무엇인가요?","answer":"곱 부분이 \\(0\\)이므로 \\(f(-1)=c-d\\), \\(f(2)=2d+c\\)예요."}},{"id":"c2","label":"두 접선이 같은 x절편을 지나게 해요","stepIds":["s3","s4"],"question":"점 \\((k,0)\\)이 두 접선 위에 있다는 조건은 어떤 두 식을 만들까요?","hint":"점과 기울기로 쓴 접선식에 \\(x=k\\), \\(y=0\\)을 넣어요.","explanation":"\\(x=-1\\)에서의 접선은 \\(y=(c-d)+(d-6)(x+1)\\)이므로 \\((k,0)\\)을 넣으면 \\((c-d)+(d-6)(k+1)=0\\)이에요.\n\n\\(x=2\\)에서의 접선은 \\(y=(2d+c)+(d+6)(x-2)\\)이므로 \\((2d+c)+(d+6)(k-2)=0\\)이에요.","check":{"prompt":"첫 번째 접선식에서 x+1이 나타나는 이유는 무엇인가요?","answer":"접점의 \\(x\\)좌표가 \\(-1\\)이어서 \\(x-(-1)=x+1\\)이기 때문이에요."}},{"id":"c3","label":"두 접선식을 빼 k를 먼저 구해요","stepIds":["s5"],"question":"두 식에서 \\(c,d\\)가 사라지면 \\(k\\)는 얼마인가요?","hint":"둘째 식에서 첫째 식을 빼고 같은 항을 정리해요.","explanation":"둘째 식에서 첫째 식을 빼 정리하면 \\(12k=6\\)이 남아요. 따라서 \\(k=1/2\\)예요. 접선의 기울기와 함숫값에 들어 있던 \\(c,d\\)는 두 접점이 대칭적으로 떨어져 있어 소거돼요.","check":{"prompt":"\\(2k\\)와 \\(4k\\)는 각각 얼마인가요?","answer":"\\(2k=1\\), \\(4k=2\\)예요."}},{"id":"c4","label":"추가 함숫값으로 계수를 정하고 답을 구해요","stepIds":["s6","s7"],"question":"\\(f(2k)=20\\)과 접선식은 \\(c,d\\)를 어떻게 정할까요?","hint":"\\(2k=1\\)이므로 \\(f(1)=d+c\\)예요.","explanation":"\\(f(1)=20\\)에서 \\(d+c=20\\)이에요. 또 \\(k=1/2\\)를 첫 접선식에 넣으면 \\(c-d+\\frac32(d-6)=0\\), 즉 \\(c+d/2=9\\)예요.\n\n두 식을 풀면 \\(d=22,c=-2\\)예요. 구하려는 값은 \\(f(4k)=f(2)\\)이고 곱 부분이 \\(0\\)이므로 \\(f(2)=2d+c=44-2=42\\)예요.","check":{"prompt":"\\(f(2)\\)에서 사차 곱 부분이 0인 이유는 무엇인가요?","answer":"인수 \\(x-2\\)에 \\(x=2\\)를 넣으면 \\(0\\)이 되기 때문이에요."}}],"takeaway":["연속한 정수에서 등차수열을 이루는 함숫값은 일차식을 빼 네 근을 만드는 방식으로 표현할 수 있어요.","서로 다른 두 접선이 같은 점을 지나면 두 접선식을 세워 빼면서 공통 계수를 없애요.","k를 먼저 구하면 주어진 f(2k)와 목표 f(4k)가 이미 아는 정수점의 함숫값으로 바뀔 수 있어요."]};</script>
