  <script>window.HandStudyRecord={"itemId":17029,"sourceLabel":"2021 교육청 고3 수학기하 4월 15번","adminYear":2021,"grade":3,"month":4,"number":15,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 $1$보다 큰 실수 $k$에 대하여 두 곡선 $y$$=\\log _{ 2} \\left| kx \\right|$와 $y$$=\\log _{2} \\left( x+4 \\right)$가 만나는 서로 다른 두 점을 $A,\\,B$라 하고, 점 $B$를 지나는 곡선 $y$$=\\log _{2} \\left( -x+m \\right)$이 곡선 $y$$=\\log _{ 2} \\left| kx \\right|$와 만나는 점 중 $B$가 아닌 점을 $C$라 하자. 세 점 $A,\\,B,\\,C$의 $x$좌표를 각각 $x _{1} ,\\,x _{2} ,\\,x _{3}$이라 할 때, \u003c보기>에서 옳은 것만을 있는 대로 고른 것은? (단, $x _{1} \u003cx _{2}$이고, $m$은 실수이다.) [4점]\n \n| 보기 |ㄱ. $x _{2}$$= -2x _{1}$이면 $k=3$이다.ㄴ. $x _{2} ^{2}$$=x _{1} x _{3}$ ㄷ. 직선 $A B$의 기울기와 직선 $A C$의 기울기의 합이 $0$일 때, $m+k ^{2}$$=19$이다.\n① ㄱ ② ㄷ ③ ㄱ, ㄴ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ\n단답형","answer":"③","sourceHash":"4f423c3a579ce3d6afc58d0527cc49628cdc225d4f55d69d16f2f134b4ca822f","steps":[{"id":"s1","latex":"|kx|=x+4\\Rightarrow x_1=-\\frac4{k+1},\\ x_2=\\frac4{k-1}"},{"id":"s2","latex":"x_2=-2x_1\\Rightarrow k=3"},{"id":"s3","latex":"|kx|=-x+m\\Rightarrow x_2=\\frac m{k+1},\\ x_3=-\\frac m{k-1}"},{"id":"s4","latex":"m=\\frac{4(k+1)}{k-1}\\Rightarrow x_1x_3=x_2^2"},{"id":"s5","latex":"y_A=\\log_2\\frac{4k}{k+1},\\ y_B=\\log_2\\frac{4k}{k-1},\\ y_C=\\log_2\\frac{4k(k+1)}{(k-1)^2}"},{"id":"s6","latex":"m_{AB}+m_{AC}=0\\iff k^2-1=(k-1)^2(k+1)"},{"id":"s7","latex":"k=2,\\ m=12\\Rightarrow m+k^2=16"},{"id":"s8","latex":"\\therefore\\ \\text{첫째와 둘째 명제만 참}"}],"diagram":null,"contentHash":"efe56f609537cd60f49db8cdb0ecf0155c204e7b194c4dc8f565b896e6374697","questionHtml":"\u003cp class=\"hp\">그림과 같이 \u003cspan class=\"heq\">\\(1\\)\u003c/span>보다 큰 실수 \u003cspan class=\"heq\">\\(k\\)\u003c/span>에 대하여 두 곡선 \u003cspan class=\"heq\">\\(y\\)\u003c/span>\u003cspan class=\"heq\">\\(=\\log_{ 2} \\left| kx \\right|\\)\u003c/span>와 \u003cspan class=\"heq\">\\(y\\)\u003c/span>\u003cspan class=\"heq\">\\(=\\log_{2} \\left( x+4 \\right)\\)\u003c/span>가 만나는 서로 다른 두 점을 \u003cspan class=\"heq\">\\(A,\\,B\\)\u003c/span>라 하고, 점 \u003cspan class=\"heq\">\\(B\\)\u003c/span>를 지나는 곡선 \u003cspan class=\"heq\">\\(y\\)\u003c/span>\u003cspan class=\"heq\">\\(=\\log_{2} \\left( -x+m \\right)\\)\u003c/span>이 곡선 \u003cspan class=\"heq\">\\(y\\)\u003c/span>\u003cspan class=\"heq\">\\(=\\log_{ 2} \\left| kx \\right|\\)\u003c/span>와 만나는 점 중 \u003cspan class=\"heq\">\\(B\\)\u003c/span>가 아닌 점을 \u003cspan class=\"heq\">\\(C\\)\u003c/span>라 하자. 세 점 \u003cspan class=\"heq\">\\(A,\\,B,\\,C\\)\u003c/span>의 \u003cspan class=\"heq\">\\(x\\)\u003c/span>좌표를 각각 \u003cspan class=\"heq\">\\(x_{1} ,\\,x_{2} ,\\,x_{3}\\)\u003c/span>이라 할 때, &lt;보기&gt;에서 옳은 것만을 있는 대로 고른 것은? (단, \u003cspan class=\"heq\">\\(x_{1} \\lt x_{2}\\)\u003c/span>이고, \u003cspan class=\"heq\">\\(m\\)\u003c/span>은 실수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/5d84a747d01c6df9886f7e1c.png\" style=\"width:397px;max-width:100%\">\u003c/p>\u003cdiv class=\"hbox\">\u003cdiv style=\"text-align:center;font-weight:700;margin:0 0 6px\">&lt; 보 기 &gt;\u003c/div>\u003cp class=\"hp\">ㄱ. \u003cspan class=\"heq\">\\(x_{2}\\)\u003c/span>\u003cspan class=\"heq\">\\(= -2x_{1}\\)\u003c/span>이면 \u003cspan class=\"heq\">\\(k=3\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp\">ㄴ. \u003cspan class=\"heq\">\\(x_{2}^{2}\\)\u003c/span>\u003cspan class=\"heq\">\\(=x_{1} x_{3}\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">ㄷ. 직선 \u003cspan class=\"heq\">\\(A B\\)\u003c/span>의 기울기와 직선 \u003cspan class=\"heq\">\\(A C\\)\u003c/span>의 기울기의 합이 \u003cspan class=\"heq\">\\(0\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(m+k^{2}\\)\u003c/span>\u003cspan class=\"heq\">\\(=19\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp class=\"hp\">① ㄱ&emsp;② ㄷ&emsp;③ ㄱ, ㄴ\u003c/p>\u003cp class=\"hp\">④ ㄴ, ㄷ&emsp;⑤ ㄱ, ㄴ, ㄷ\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"df5159f0c4a19cdf2ef43661eda966bed284c86d8eda602063593a1dcbc54289"};</script>
