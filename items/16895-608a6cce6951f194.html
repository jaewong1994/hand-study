<script>window.HandStudyGuide={"itemId":16895,"sourceHash":"92f01e2a689a71bce619afb3071fed0efc2d826d79d69e62cb42fe244ddafe21","contentHash":"04a1eca5c70f3bd2a65c278a957e175522ce2634c866362ec830bcb7f82865b9","overview":{"goal":"한 교점의 사인값이 같은 모든 점에서도 코사인값이 같아지게 하는 주기를 찾아 자연수 \\(k\\)를 세어요.","firstLook":"\\(f(x)=a\\)의 해는 같은 사인값을 만드는 평행이동과 대칭의 두 가족이에요. 두 가족 모두에서 \\(g(x)=a\\)가 유지되어야 해요.","conditions":[{"label":"교점의 높이","meaning":"어떤 \\(\\alpha\\)에서 \\(f(\\alpha)=g(\\alpha)=a\\)예요."},{"label":"해집합의 포함","meaning":"같은 \\(f\\)값을 갖는 모든 \\(x\\)에서 \\(g\\)도 같은 값을 가져야 해요."}]},"chapters":[{"id":"c1","label":"같은 사인값의 두 해 가족을 써요","stepIds":["s1","s2"],"question":"\\(\\sin kx=\\sin k\\alpha\\)의 해는 어떤 두 꼴인가요?","hint":"사인함수의 주기와 \\(\\sin u=\\sin(\\pi-u)\\)를 쓰세요.","explanation":"교점 \\(\\alpha\\)에서 \\(f(\\alpha)=3\\cos12\\alpha=a\\)예요. \\(f(x)=a\\)이면 \\(\\sin kx=\\sin k\\alpha\\)이므로 \\(x=\\alpha+2n\\pi/k\\) 또는 \\(x=(2n+1)\\pi/k-\\alpha\\)예요. 닫힌구간 안에 들어오는 이 해들에서 모두 \\(3\\cos12x=a\\)여야 해요.","check":{"prompt":"해가 한 가족만 있는 것이 아닌 이유는 무엇인가요?","answer":"사인은 한 주기 안에서도 \\(u\\)와 \\(\\pi-u\\)에서 같은 값을 가지기 때문이에요."}},{"id":"c2","label":"코사인값이 유지되는 주기를 찾아요","stepIds":["s3"],"question":"두 해 가족에서 \\(\\cos12x\\)가 같으려면 어떤 조건이 필요한가요?","hint":"평행이동량 \\(2\\pi/k\\)와 대칭축 이동량 \\(\\pi/k\\)에 \\(12\\)를 곱하세요.","explanation":"첫 가족에서 \\(x\\)가 \\(2\\pi/k\\)만큼 바뀔 때 \\(12x\\)는 \\(24\\pi/k\\)만큼 바뀌어요. 코사인값이 항상 같으려면 이것이 \\(2\\pi\\)의 정수배여야 해요. 둘째 가족의 대칭까지 같은 값을 만들려면 \\(12\\pi/k\\)가 \\(2\\pi\\)의 정수배여야 하고, 이는 \\(12/k\\)가 짝수인 자연수라는 조건이에요.","check":{"prompt":"단지 \\(k\\mid12\\)만으로 부족한 이유는 무엇인가요?","answer":"대칭 해 가족에서는 \\(12\\pi/k\\)가 코사인의 한 주기 정수배여야 하므로 몫이 짝수여야 해요."}},{"id":"c3","label":"가능한 자연수를 세어요","stepIds":["s4","s5"],"question":"\\(12/k\\)가 짝수인 자연수가 되게 하는 \\(k\\)는 무엇인가요?","hint":"12의 약수 중 몫을 확인하세요.","explanation":"\\(k\\mid12\\)인 약수 \\(1,2,3,4,6,12\\) 중 \\(12/k\\)가 짝수인 것은 \\(k=1,2,3,6\\)이에요. 따라서 개수는 \\(4\\)이고 정답은 ②예요.","check":{"prompt":"\\(k=4\\)가 제외되는 이유는 무엇인가요?","answer":"\\(12/4=3\\)은 홀수라 대칭 해에서 코사인값이 반대로 바뀔 수 있어요."}}],"takeaway":["삼각방정식은 주기 해와 대칭 해를 모두 써요.","해집합 포함 조건은 각 해 가족에서 다른 함수값이 유지되는지 검사해요.","나눗셈 조건에서는 약수뿐 아니라 몫의 홀짝도 확인해요."]};</script>
