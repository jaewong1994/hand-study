  <script>window.HandStudyRecord={"itemId":16420,"sourceLabel":"2019 교육청 고3 수리나형 4월 18번","adminYear":2019,"grade":3,"month":4,"number":18,"track":"수리나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"${\\overline{ B _{1} C _{1} }} =8$이고 $\\angle B _{1} A _{1} C _{1} =120 ^{\\circ}$인 이등변삼각형 $A _{1} B _{1} C _{1}$이 있다. 그림과 같이 중심이 선분 $B _{1} C _{1}$ 위에 있고 직선 $A _{1} B _{1}$과 직선 $A _{1} C _{1}$에 동시에 접하는 원 $O _{1}$을 그리고 이등변삼각형 $A _{1} B _{1} C _{1}$의 내부와 원 $O _{1}$의 외부의 공통부분에 색칠하여 얻은 그림을 $R _{1}$이라 하자. 그림 $R _{1}$에서 원 $O _{1}$과 선분 $B _{1} C _{1}$이 만나는 점을 각각 $B _{2}$, $C _{2}$라 할 때, 삼각형 $A _{1} B _{1} C _{1}$ 내부의 점 $A _{2}$를 삼각형 $A _{2} B _{2} C _{2}$가 $\\angle B _{2} A _{2} C _{2} =120 ^{\\circ}$인 이등변삼각형이 되도록 잡는다. 중심이 선분 $B _{2} C _{2}$ 위에 있고 직선 $A _{2} B _{2}$와 직선 $A _{2} C _{2}$에 동시에 접하는 원 $O _{2}$를 그리고 이등변삼각형 $A _{2} B _{2} C _{2}$의 내부와 원 $O _{2}$의 외부의 공통부분에 색칠하여 얻은 그림을 $R _{2}$라 하자. 이와 같은 과정을 계속하여 $n$번째 얻은 그림 $R _{n}$에 색칠되어 있는 부분의 넓이를 $S _{n}$이라 할 때, $\\lim _{n\\, -> \\, \\infty } {S _{n}}$의 값은? [4점]\n$A _{1}$$A _{1}$$B _{1}$$C _{1}$$C _{1}$$O _{1}$$O _{2}$$B _{2}$$C _{2}$$R _{1}$$R _{2}$$\\vdots$$B _{1}$$O _{1}$$A _{2}$$\\vdots$\n① $\\frac{32}{3} \\sqrt{3} - \\frac{8}{3} \\pi$ ② $\\frac{32}{3} \\sqrt{3} - \\frac{4}{3} \\pi$ ③ $\\frac{64}{9} \\sqrt{3} - \\frac{8}{3} \\pi$ ④ $\\frac{64}{9} \\sqrt{3} - \\frac{5}{3} \\pi$ ⑤ $\\frac{64}{9} \\sqrt{3} - \\frac{4}{3} \\pi$","answer":"③","sourceHash":"9049c270281eb131c92df0bc98717e71f39e397470d36641c72a955663d37632","steps":[{"id":"s1","latex":"A_1M=\\dfrac{4\\sqrt3}{3},\\quad\\text{반원의 반지름}=2"},{"id":"s2","latex":"S_1=\\dfrac12\\cdot8\\cdot\\dfrac{4\\sqrt3}{3}-\\dfrac12\\pi\\cdot2^2=\\dfrac{16\\sqrt3}{3}-2\\pi"},{"id":"s3","latex":"B_2C:B_1C=1:2\\Rightarrow\\text{넓이비}=\\dfrac14"},{"id":"s4","latex":"\\lim S_n=\\dfrac{16\\sqrt3/3-2\\pi}{1-1/4}=\\dfrac{64\\sqrt3}{9}-\\dfrac{8\\pi}{3}"}],"diagram":null,"contentHash":"49ef96636ebffae96a86ca6257fe7cc546329e92f87599ed6f29034a1174e559","questionHtml":"\u003cp class=
