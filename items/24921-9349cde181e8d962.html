<script>window.HandStudyRecord={"adminYear":2024,"answer":"64","contentHash":"8c6fa27af6faedc4ebfab219eae6f4910ee3002aa42687f16080fee233c2ed5d","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24921,"month":11,"number":22,"points":4,"preview":false,"questionHtml":"\u003cp>모든 항이 정수이고 다음 조건을 만족시키는 모든 수열 \u003cspan class=\"heq\">\\(\\left\\{a_{n} \\right\\}\\,\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(\\left|\\, a _{1} \\,\\right|\\,\\)\u003c/span>의 값의 합을 구하시오. [4점]\u003c/p>\u003cdiv class=\"hbox hcond\">\u003cp class=\"hcondr\">(가) 모든 자연수 \u003cspan class=\"heq\">\\(n\\,\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(a _{n+1} = {\\begin{cases}\\,a _{n} -3&amp;&amp;\\left( \\left|\\, a _{n} \\,\\right| 이\\,홀수인\\,경우 \\right) \\\\ \\,\\frac{1}{2} a _{n}&amp;&amp;\\left( a _{n} =0\\,또는\\, \\left|\\, a _{n} \\,\\right| 이\\,짝수인\\,경우 \\right)\\end{cases}}\\)\u003c/span> 이다.\u003c/p>\u003cp class=\"hcondr\">(나) \u003cspan class=\"heq\">\\(\\left|\\, a _{m} \\,\\right| = \\left|\\, a _{m+2} \\,\\right|\\,\\)\u003c/span>인 자연수 \u003cspan class=\"heq\">\\(m\\,\\)\u003c/span>의 최솟값은 \u003cspan class=\"heq\">\\(3\\,\\)\u003c/span>이다.\u003c/p>\u003c/div>","questionText":"모든 항이 정수이고 다음 조건을 만족시키는 모든 수열 $\\left\\{a_{n} \\right\\}\\,$에 대하여 $\\left|\\, a _{1} \\,\\right|\\,$의 값의 합을 구하시오. [4점]\n(가) 모든 자연수 $n\\,$에 대하여 $a _{n+1} = {\\begin{cases}\\,a _{n} -3&&\\left( \\left|\\, a _{n} \\,\\right| 이\\,홀수인\\,경우 \\right) \\\\ \\,\\frac{1}{2} a _{n}&&\\left( a _{n} =0\\,또는\\, \\left|\\, a _{n} \\,\\right| 이\\,짝수인\\,경우 \\right)\\end{cases}}$ 이다.(나) $\\left|\\, a _{m} \\,\\right| = \\left|\\, a _{m+2} \\,\\right|\\,$인 자연수 $m\\,$의 최솟값은 $3\\,$이다.","sourceHash":"cc02d76c986e75daa38610cf5091e91e0ed881d4cee7763c925526108118ff07","sourceKind":"csat","sourceLabel":"2024년 시행 수능 · 2025학년도 · 공통 · 22번","steps":[{"id":"s1","latex":"a_3=x,\\quad |a_5|=|x|,\\quad |a_1|\\ne|a_3|,\\quad |a_2|\\ne|a_4|"},{"id":"s2","latex":"x\\text{가 홀수}:\\quad a_5=\\frac{x-3}{2},\\quad\\left|\\frac{x-3}{2}\\right|=|x|\\ \\Rightarrow\\ x=-3,1"},{"id":"s3","latex":"x=0:\\ a_4=a_5=0"},{"id":"s4","latex":"x\\ne0\\text{인 짝수},\\quad\\frac{x}{2}\\text{가 짝수}:\\quad |a_5|=\\frac{|x|}{4}\\ne|x|"},{"id":"s5","latex":"x\\text{가 짝수},\\quad\\frac{x}{2}\\text{가 홀수}:\\quad\\left|\\frac{x}{2}-3\\right|=|x|\\ \\Rightarrow\\ x=-6,2"},{"id":"s6","latex":"a_{n+1}=y\\quad\\Rightarrow\\quad a_n=2y\\text{ 또는 }y+3\\ (y\\text{가 짝수})"},{"id":"s7","latex":"a_3=-3,1\\quad\\Rightarrow\\quad a_2=-6,2\\quad\\Rightarrow\\quad |a_2|=|a_4|\\quad\\text{제외}"},{"id":"s8","latex":"\\begin{array}{c|c|c}a_3&a_2\\ (|a_2|\\ne|a_4|)&a_1\\\\\\hline-6&-12&-24,-9\\\\2&4,5&8,7,10\\\\0&3&6\\end{array}"},{"id":"s9","latex":"\\text{모든 후보에서 }|a_1|\\ne|a_3|"},{"id":"s10","latex":"24+9+8+7+10+6=64"}],"track":"공통"};</script>
<script>window.HandStudyGuide={"itemId":24921,"sourceHash":"cc02d76c986e75daa38610cf5091e91e0ed881d4cee7763c925526108118ff07","contentHash":"8c6fa27af6faedc4ebfab219eae6f4910ee3002aa42687f16080fee233c2ed5d","overview":{"goal":"\\(m=3\\)에서 처음 성립한다는 조건으로 \\(a_3\\)를 먼저 찾고, 거꾸로 \\(a_1\\)의 후보를 복원해요.","firstLook":"첫째항부터 무작정 계산하지 말고, 값이 같아지는 두 항 \\(a_3,a_5\\)부터 묶어 보세요.","conditions":[{"label":"모든 항은 정수","meaning":"매 단계에서 홀수이면 3을 빼고, 짝수 또는 0이면 2로 나누는 규칙을 적용해요. 음수도 홀짝에 따라 같은 규칙을 써요."},{"label":"\\(|a_m|=|a_{m+2}|\\)인 자연수 \\(m\\)의 최솟값은 3","meaning":"\\(|a_3|=|a_5|\\)는 성립하고, \\(|a_1|=|a_3|\\)과 \\(|a_2|=|a_4|\\)는 성립하지 않아야 해요."},{"label":"모든 \\(|a_1|\\)의 값의 합","meaning":"수열의 첫째항 후보를 빠짐없이 찾은 뒤, 각 절댓값을 더해야 해요."}]},"chapters":[{"id":"c1","label":"처음이라는 말 풀어 읽기","stepIds":["s1"],"question":"\\(m=3\\)에서 성립한다는 사실만 확인하면 충분할까요?","hint":"자연수 중 3보다 작은 값도 조건에 넣어 보세요.","explanation":"충분하지 않아요. \\(a_3=x\\)로 놓고 \\(|a_5|=|x|\\)를 만족하는 값을 찾되, 나중에 \\(m=1,2\\)에서는 등식이 성립하지 않는지도 확인해야 해요. 이렇게 세 조건으로 풀어 적어 두면 후보를 거를 때 기준이 분명해져요.","check":{"prompt":"뒤에서 \\(m=4\\)에도 등식이 성립하면 탈락인가요?","answer":"아니요. 최솟값이 3이라는 조건은 1과 2에서의 성립만 막아요. 3보다 큰 값에서 다시 성립하는 것은 괜찮아요."}},{"id":"c2","label":"두 번 진행하여 셋째항 찾기","stepIds":["s2","s3","s4","s5"],"question":"\\(x\\)에서 두 번 진행한 값은 홀짝에 따라 어떻게 달라질까요?","hint":"\\(x\\)가 홀수이면 첫 시행 뒤에는 짝수가 돼요. 짝수이면 \\(x/2\\)의 홀짝도 나누어 보세요.","explanation":"홀수 \\(x\\)는 \\(x-3\\), \\((x-3)/2\\)로 진행하므로 절댓값 등식에서 \\(-3,1\\)이 나와요. \\(x=0\\)은 계속 0이므로 따로 남겨요. 0이 아닌 짝수에서 \\(x/2\\)도 짝수이면 절댓값이 4분의 1이 되어 돌아올 수 없어요. \\(x/2\\)가 홀수이면 두 번째 값은 \\(x/2-3\\)이고, 등식에서 \\(-6,2\\)가 나와요. 따라서 셋째항 후보는 \\(-3,1,0,-6,2\\)예요.","check":{"prompt":"음수인 \\(-6\\)에도 짝수일 때의 규칙을 쓸 수 있나요?","answer":"네. \\(-6\\to-3\\to-6\\)이므로 두 칸 뒤 절댓값이 같아요. 양수라는 조건은 없어요."}},{"id":"c3","label":"거꾸로 올라가며 앞선 성립 제외하기","stepIds":["s6","s7","s8"],"question":"다음 항이 \\(y\\)일 때 바로 앞 항은 무엇일 수 있을까요?","hint":"2로 나누어 \\(y\\)가 된 경우와 3을 빼서 \\(y\\)가 된 경우를 각각 거꾸로 풀어 보세요.","explanation":"앞 항이 짝수였으면 \\(2y\\)예요. 앞 항이 홀수였으면 \\(y+3\\)인데, 이 수가 홀수여야 하므로 이 후보는 \\(y\\)가 짝수일 때만 가능해요. \\(a_3=-3,1\\)은 앞 항이 각각 \\(-6,2\\)로 정해져 \\(|a_2|=|a_4|\\)가 되어 탈락해요. 남은 셋째항 -6, 2, 0에서 같은 규칙으로 거꾸로 올라가고 \\(m=2\\) 조건을 검사하면 표의 첫째항 여섯 개가 남아요.","check":{"prompt":"\\(a_3=0\\)일 때 \\(a_2=0\\)을 남길 수 있나요?","answer":"없어요. 이때 \\(a_4=0\\)이라 \\(|a_2|=|a_4|\\)가 되어 \\(m=2\\)부터 성립해요. \\(a_2=3\\)을 골라야 해요."}},{"id":"c4","label":"첫째항까지 검사하고 합하기","stepIds":["s9","s10"],"question":"표에서 얻은 첫째항은 마지막으로 어떤 조건을 확인해야 할까요?","hint":"아직 검사하지 않은 \\(m=1\\)의 등식을 떠올려 보세요.","explanation":"첫째항은 \\(-24,-9,8,7,10,6\\)이에요. 각각 대응하는 셋째항의 절댓값 6, 6, 2, 2, 2, 0과 다르므로 \\(m=1\\)에서도 등식이 성립하지 않아요. 실제로 두 번 진행하면 표의 셋째항으로 돌아가고, 그 뒤 두 칸에서 절댓값이 같아져요. 이제 첫째항의 절댓값 \\(24,9,8,7,10,6\\)을 더해 64를 얻어요.","check":{"prompt":"첫째항이 \\(-9\\)인 경우 처음 다섯 항을 확인해 볼까요?","answer":"\\(-9,-12,-6,-3,-6\\)이에요. 절댓값을 두 칸씩 비교하면 \\(m=1,2\\)에서는 다르고 \\(m=3\\)에서 같아요."}}],"takeaway":["처음 성립하는 위치를 주면, 그 위치의 등식과 앞선 위치의 부등식을 함께 적어요.","점화식을 거꾸로 풀 때는 후보가 원래의 홀짝 조건도 만족하는지 확인해요."]};</script>
