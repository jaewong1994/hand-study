<script>window.HandStudyRecord={"itemId":16634,"sourceLabel":"2020 교육청 고3 수리가형 10월 29번","adminYear":2020,"grade":3,"month":10,"number":29,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"다음 조건을 만족시키는 자연수 $a$, $b$, $c\\,$의 모든 순서쌍 $\\left( a,\\,b,\\,c \\right)\\,$의 개수를 구하시오. [4점]\n(가) $a\u003cb\u003cc \\leq 20$ (나) 세 변의 길이가 $a$, $b$, $c\\,$인 삼각형이 존재한다.","answer":"525","sourceHash":"1a7276fdb76a09a28f46c5100daad109b9854e5f6fefdaee2df20fe68bc05d6a","steps":[{"id":"s1","latex":"a\u003cb\u003cc,\\ a+b>c\\Rightarrow c-b\u003ca\u003cb"},{"id":"s2","latex":"c=2m\\Rightarrow N_c=(m-1)^2"},{"id":"s3","latex":"c=2m+1\\Rightarrow N_c=m(m-1)"},{"id":"s4","latex":"N=\\sum_{m=2}^{10}(m-1)^2+\\sum_{m=1}^{9}m(m-1)"},{"id":"s5","latex":"N=285+240=\\boxed{525}"}],"diagram":null,"contentHash":"bf7c4e5d5fbe1e7359788cd99fc46807fc30c5bd4ef4c656463a4cab69d460e3","questionHtml":"\u003cp class=\"hp\">다음 조건을 만족시키는 자연수 \u003cspan class=\"heq\">\\(a\\)\u003c/span>, \u003cspan class=\"heq\">\\(b\\)\u003c/span>, \u003cspan class=\"heq\">\\(c\\,\\)\u003c/span>의 모든 순서쌍 \u003cspan class=\"heq\">\\(\\left( a,\\,b,\\,c \\right)\\,\\)\u003c/span>의 개수를 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가)\u003cspan class=\"heq\">\\(a\\lt b\\lt c \\leq 20\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">(나)세 변의 길이가 \u003cspan class=\"heq\">\\(a\\)\u003c/span>, \u003cspan class=\"heq\">\\(b\\)\u003c/span>, \u003cspan class=\"heq\">\\(c\\,\\)\u003c/span>인 삼각형이 존재한다.\u003c/p>\u003c/div>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"878dc76ec8bc1ad152b8fec24a03fcc278e6837ced923b2a3e6c96d12f57737e"};</script>
<script>window.HandStudyGuide={"itemId":16634,"sourceHash":"1a7276fdb76a09a28f46c5100daad109b9854e5f6fefdaee2df20fe68bc05d6a","contentHash":"bf7c4e5d5fbe1e7359788cd99fc46807fc30c5bd4ef4c656463a4cab69d460e3","overview":{"goal":"가장 긴 변 c를 고정하고 삼각형 부등식을 만족하는 a,b를 세어, c의 짝홀에 따른 합을 계산해요.","firstLook":"\\(a<b<c\\)라 가장 긴 변은 \\(c\\)예요. 삼각형이 되는 조건은 \\(a+b>c\\) 하나만 확인하면 되고, 이는 \\(c-b<a<b\\)라는 정수 범위를 만들어요.","conditions":[{"label":"자연수 변","meaning":"\\(a,b,c\\)는 양의 정수이고 서로 \\(a<b<c\\) 순서로 달라요."},{"label":"삼각형 부등식","meaning":"가장 긴 변이 c이므로 나머지 두 변의 합이 c보다 커야 해요."},{"label":"상한","meaning":"\\(c\\le20\\)인 모든 값을 짝수와 홀수로 나누어 합해요."}]},"chapters":[{"id":"c1","label":"고정된 b,c에서 가능한 a를 세어요","stepIds":["s1"],"question":"삼각형 조건은 \\(a\\)에 어떤 열린 정수 구간을 줄까요?","hint":"\\(a+b>c\\)와 \\(a<b\\)를 한 줄로 합쳐요.","explanation":"가장 긴 변이 \\(c\\)이므로 삼각형이 존재할 필요충분조건은 \\(a+b>c\\)예요. 따라서 \\(c-b<a<b\\)이고, 고정된 \\(b,c\\)에서 가능한 정수 \\(a\\)는 \\(c-b+1\\)부터 \\(b-1\\)까지예요.\n\n그 개수는 \\((b-1)-(c-b+1)+1=2b-c-1\\)이에요. 이 수가 양수가 되려면 \\(b>c/2\\)여야 해요.","check":{"prompt":"\\(a=c-b\\)를 포함하지 않는 이유는 무엇인가요?","answer":"그때 \\(a+b=c\\)가 되어 삼각형이 아니라 일직선으로 펴지기 때문이에요."}},{"id":"c2","label":"c가 짝수일 때 홀수들의 합을 얻어요","stepIds":["s2"],"question":"\\(c=2m\\)이면 가능한 순서쌍 수가 왜 \\((m-1)^2\\)일까요?","hint":"\\(b=m+1,\\ldots,2m-1\\)로 두고 각 \\(b\\)에서의 \\(a\\) 개수를 써요.","explanation":"\\(c=2m\\)이면 \\(b>m\\), \\(b<c\\)이므로 \\(b=m+1,\\ldots,2m-1\\)이에요. \\(b=m+r\\), \\(r=1,\\ldots,m-1\\)로 두면 가능한 \\(a\\)의 수는 \\(2b-c-1=2r-1\\)이에요.\n\n따라서 고정된 짝수 \\(c\\)에서의 개수는 \\(1+3+\\cdots+\\{2(m-1)-1\\}=(m-1)^2\\)이에요.","check":{"prompt":"\\(c=8\\), 즉 \\(m=4\\)이면 개수는 얼마인가요?","answer":"\\((4-1)^2=9\\)개예요."}},{"id":"c3","label":"c가 홀수일 때 짝수들의 합을 얻어요","stepIds":["s3"],"question":"\\(c=2m+1\\)이면 가능한 순서쌍 수는 얼마인가요?","hint":"\\(b=m+1,\\ldots,2m\\)에서 첫 값은 가능한 \\(a\\)가 0개일 수 있어요.","explanation":"\\(c=2m+1\\)이면 \\(b=m+1,\\ldots,2m\\)이에요. \\(b=m+r\\), \\(r=1,\\ldots,m\\)로 두면 가능한 \\(a\\)의 수는 \\(2b-c-1=2r-2\\)예요.\n\n따라서 개수는 \\(0+2+4+\\cdots+2(m-1)=m(m-1)\\)이에요. 첫 항이 0인 것은 \\(b=m+1\\)일 때 \\(c-b=m\\)과 \\(b=m+1\\) 사이에 정수가 없기 때문이에요.","check":{"prompt":"\\(c=7\\), 즉 \\(m=3\\)이면 개수는 얼마인가요?","answer":"\\(3\\cdot2=6\\)개예요."}},{"id":"c4","label":"c가 20 이하인 모든 경우를 더해요","stepIds":["s4","s5"],"question":"짝수와 홀수 c의 개수를 모두 더하면 얼마인가요?","hint":"짝수 \\(c=2m\\)은 \\(m=2\\)부터 \\(10\\), 홀수 \\(c=2m+1\\)은 \\(m=1\\)부터 \\(9\\)예요.","explanation":"짝수 \\(c=4,6,\\ldots,20\\)의 합은 \\(\\sum_{m=2}^{10}(m-1)^2=1^2+\\cdots+9^2=285\\)예요. 홀수 \\(c=3,5,\\ldots,19\\)의 합은\n\\[\n\\sum_{m=1}^{9}m(m-1)=\\sum_{m=1}^{9}m^2-\\sum_{m=1}^{9}m=285-45=240\n\\]\n이에요. 따라서 전체는 \\(285+240=525\\)개예요.","check":{"prompt":"\\(c=1,2\\)에서는 왜 따로 더할 것이 없나요?","answer":"서로 다른 양의 정수 a<b<c를 세 개 고를 수 없어 삼각형 후보가 없기 때문이에요."}}],"takeaway":["세 변을 크기순으로 정했으면 삼각형 부등식은 작은 두 변의 합과 가장 긴 변만 비교하면 돼요.","고정된 가장 긴 변에서 가운데 변을 움직이면 가능한 가장 작은 변의 개수가 일정한 간격으로 늘어나요.","짝수와 홀수에서 생기는 홀수합·짝수합을 각각 계산한 뒤 합쳐요."]};</script>
