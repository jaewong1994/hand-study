<script>window.HandStudyGuide={"itemId":17241,"sourceHash":"c4b2e1aed30ee77e12d8112880583cb7ac30dbf9b1771851f56743badf092898","contentHash":"c346b63255992669b730378dbd003af6cbabb69dc5de0950194d23cb0128a2f4","overview":{"goal":"5를 중심으로 대칭인 두 확률분포에서 확률이 옮겨진 위치만 보고 분산의 변화를 계산해요.","firstLook":"두 분포 모두 1과 9, 3과 7의 확률이 서로 같아서 평균은 5예요. \\(X\\)에서 \\(Y\\)로 갈 때 5의 확률 \\(1/10\\)이 양 끝 1과 9에 \\(1/20\\)씩 옮겨져요.","conditions":[{"label":"대칭","meaning":"5에서 같은 거리만큼 떨어진 두 값의 확률이 같아요."},{"label":"확률 이동","meaning":"5의 확률은 \\(1/10\\) 줄고 1과 9의 확률은 각각 \\(1/20\\) 늘어요."}]},"chapters":[{"id":"c1","label":"대칭으로 평균과 분산을 읽어요","stepIds":["s1","s2"],"question":"두 확률변수의 평균이 모두 5인 이유는 무엇인가요?","hint":"1과 9, 3과 7을 각각 한 쌍으로 묶어 보세요.","explanation":"1과 9는 5에서 각각 4만큼, 3과 7은 각각 2만큼 떨어져 있고 각 쌍의 확률이 같아요. 따라서 각 대칭 쌍의 평균 위치가 5이고, 가운데 값도 5라서 \\(E(X)=E(Y)=5\\)예요.\n\n\\(X\\)의 분산은 5에서 떨어진 거리의 제곱에 확률을 곱해 더하면 돼요. 1과 9의 기여는 \\(2a\\times4^2=32a\\), 3과 7의 기여는 \\(2b\\times2^2=8b\\), 5의 기여는 0이에요. 그래서 \\(V(X)=32a+8b=31/5\\)예요.","check":{"prompt":"가운데 값 5의 확률 \\(c\\)가 \\(V(X)\\) 식에 나타나지 않는 이유는 무엇인가요?","answer":"평균이 5이므로 \\((5-5)^2=0\\)이라 분산에 더하는 값이 0이기 때문이에요."}},{"id":"c2","label":"확률이 옮겨진 위치를 비교해요","stepIds":["s3","s4"],"question":"5에서 양 끝으로 옮겨진 확률은 분산을 얼마나 늘릴까요?","hint":"가운데 5의 거리 제곱은 0이고, 1과 9의 거리 제곱은 각각 16이에요.","explanation":"\\(Y\\)에서는 5의 확률이 \\(1/10\\) 줄고, 1과 9의 확률이 각각 \\(1/20\\) 늘어요. 변화량의 합은 \\(1/20+1/20-1/10=0\\)이라 전체 확률은 그대로이고, 좌우로 같은 양을 옮겨 평균 5도 유지돼요.\n\n5에서 줄어든 확률은 \\((5-5)^2=0\\)이라 분산을 바꾸지 않아요. 반면 양 끝에서는 각각 거리 제곱이 16이므로 분산 증가는 \\(16(1/20)+16(1/20)=8/5\\)예요.","check":{"prompt":"1과 9 중 한쪽의 증가량만 세면 안 되는 이유는 무엇인가요?","answer":"두 끝의 확률이 각각 \\(1/20\\)씩 늘어 분산에 똑같이 기여하므로 두 항을 모두 더해야 해요."}},{"id":"c3","label":"분산의 변화를 더해요","stepIds":["s5"],"question":"\\(V(Y)\\)와 문제에서 요구한 값은 얼마인가요?","hint":"주어진 \\(V(X)=31/5\\)에 방금 구한 증가량 \\(8/5\\)를 더해요.","explanation":"\\(V(Y)=V(X)+8/5=31/5+8/5=39/5\\)예요. 따라서 문제에서 요구한 값은 \\(10V(Y)=10\\times39/5=78\\)이에요.","check":{"prompt":"확률을 중심에서 양 끝으로 옮겼을 때 분산이 증가하는 까닭은 무엇인가요?","answer":"평균 5에서 더 멀리 떨어진 값 1과 9의 확률이 늘어 거리 제곱의 평균이 커지기 때문이에요."}}],"takeaway":["확률분포가 어떤 값을 중심으로 대칭이면 평균을 그 중심으로 바로 읽을 수 있어요.","분산은 평균에서 떨어진 거리의 제곱을 사용하므로 중심에 있는 확률은 분산에 기여하지 않아요.","두 분포의 차이가 일부 확률 이동뿐이면 바뀐 항만 계산해 분산의 차를 구할 수 있어요."]};</script>
