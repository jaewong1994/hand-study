<script>window.HandStudyRecord={"itemId":27052,"sourceLabel":"2026 평가원 고3 수학기하 9월 29번","adminYear":2026,"grade":3,"month":9,"number":29,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"두 초점이 ${{F}} \\left(c,\\,0 \\right)\\,$, ${{F}}\\,' \\left(-c,\\,0 \\right)\\, \\left(c > 0 \\right)\\,$인 쌍곡선 $\\frac{x^{2}}{16}-\\frac{y^{2}}{b^{2}}=1\\, \\left(b > 0 \\right)\\,$이 있다. 점 ${{P}} \\left(0,\\,p \\right)\\, \\left(p > 0 \\right)\\,$에 대하여 이 쌍곡선과 두 선분 ${{PF}}\\,$, ${{PF}}\\,'\\,$이 만나는 점을 각각 ${{A}}\\,$, ${{B}}\\,$라 할 때, 두 초점이 ${{A}}\\,$, ${{B}}\\,$인 타원이 두 점 ${{F}}\\,$, ${{P}}\\,$를 지난다. 점 ${{P}}\\,$를 지나고 $x\\,$축에 평행한 직선이 직선 ${{AF}}\\,'\\,$과 만나는 점을 ${{C}}\\,$라 하자. $\\angle {{APF}}\\,'= \\angle {{APC}}\\,$일 때, 삼각형 ${{ACP}}\\,$의 둘레의 길이를 구하시오. [4점]","answer":"60","sourceHash":"ed83b8c6ab14a65465f488817a2558ee838506e3dc8297b63640cbe7d28b48d6","steps":[{"id":"s1","latex":"\\angle\\mathrm{FPO}=\\angle\\mathrm{F^{\\prime}PO}=\\theta,\\quad\\mathrm{PC}\\perp\\mathrm{PO}"},{"id":"s2","latex":"\\angle\\mathrm{APF^{\\prime}}=2\\theta,\\quad\\angle\\mathrm{APC}=\\frac\\pi2-\\theta"},{"id":"s3","latex":"\\theta=\\angle\\mathrm{FPO}:\\quad2\\theta=\\frac\\pi2-\\theta\\Rightarrow\\theta=\\frac\\pi6,\\quad\\overline{\\mathrm{PF}}=2c"},{"id":"s4","latex":"k=\\overline{\\mathrm{AP}},\\quad q=\\overline{\\mathrm{AF}},\\quad r=\\overline{\\mathrm{AF'}}"},{"id":"s5","latex":"\\overline{\\mathrm{BP}}=k,\\quad\\overline{\\mathrm{BF}}=r\\quad\\text{(}y\\text{축 대칭)}"},{"id":"s6","latex":"\\text{타원}:\\ q+r=2k,\\quad\\text{쌍곡선}:\\ r-q=8,\\quad\\mathrm P,\\mathrm A,\\mathrm F\\text{ 일직선}:\\ k+q=2c"},{"id":"s7","latex":"q+r=2k,\\quad r-q=8,\\quad k+q=2c"},{"id":"s8","latex":"k=c+2,\\quad q=c-2,\\quad r=c+6"},{"id":"s9","latex":"(c+6)^2=(c+2)^2+4c^2-2c(c+2)"},{"id":"s10","latex":"(c+2)(c-8)=0\\Rightarrow c=8"},{"id":"s11","latex":"\\mathrm A,\\mathrm P,\\mathrm F\\text{ 일직선},\\quad\\mathrm A,\\mathrm C,\\mathrm F^{\\prime}\\text{ 일직선},\\quad\\mathrm{PC}\\parallel\\mathrm{F^{\\pri -8,0]],"color":"teal","text":""},{"id":"Fprime","type":"point","x":-8,"y":0,"text":"Fprime","color":"teal"},{"id":"F","type":"point","x":8,"y":0,"text":"F","color":"teal"},{"id":"P","type":"point","x":0,"y":13.856406,"text":"P","color":"teal"},{"id":"A","type":"point","x":5,"y":5.196152,"text":"A","color":"teal"},{"id":"C","type":"point","x":26.666667,"y":13.856406,"text":"C","color":"teal"},{"id":"ACP","type":"polygon","points":[[5,5.196152],[26.666667,13.856406],[0,13.856406]],"color":"amber","text":""},{"id":"L","type":"label","x":12,"y":4,"text":"L=60","color":"amber"}]}],"graphHash":"dec8bcb97d11668a91db6ca8f8badb4db02fe04675319cf5d36a0e9d7e7803a3"},"graphHash":"dec8bcb97d11668a91db6ca8f8badb4db02fe04675319cf5d36a0e9d7e7803a3","editionHash":"23e6b7e6bb671ddd5d8a590117792ff80732e24d959781562d3590f7278ab877"};</script>
<script>window.HandStudyGuide={"itemId":27052,"sourceHash":"ed83b8c6ab14a65465f488817a2558ee838506e3dc8297b63640cbe7d28b48d6","contentHash":"872ed4e8a0ea5ed6d42d7115f92af5cf1dff748d09975f78e27bf0a377853c82","overview":{"conditions":[{"meaning":"초점 A,B에서 F와 P까지 거리의 합이 같아 \\(AF+BF=AP+BP\\)예요.","label":"타원이 F와 P를 지남"},{"meaning":"각 점에서 두 초점까지 거리의 차의 절댓값은 주축 길이 8이에요.","label":"쌍곡선 위의 A,B"},{"meaning":"대칭축과 평행선이 만드는 각을 \\(\\theta\\)로 놓으면 \\(2\\theta=\\pi/2-\\theta\\)가 돼요.","label":"두 각이 같음"}],"firstLook":"P는 y축 위에 있고 F,F′은 y축에 대칭이므로 \\(PF=PF′\\)이에요. A는 선분 PF 위에 있으므로 문제의 각 두 개를 \\(\\theta\\) 하나로 바꾸는 것이 첫 단계예요.","goal":"각 조건으로 초점거리 c를 정하고, 마지막에는 닮은 두 삼각형의 둘레비를 사용해요."},"chapters":[{"question":"왜 \\(\\angle APF^\\prime\\)은 \\(2\\theta\\)이고 \\(\\angle APC\\)는 \\(\\pi/2-\\theta\\)일까요?","check":{"prompt":"\\(PF=2c\\)에서 사용한 삼각비의 분자와 분모는 무엇인가요?","answer":"\\(\\theta=\\angle FPO\\)에서 마주 보는 변은 \\(OF=c\\), 빗변은 PF이므로 \\(\\sin\\theta=c/PF=1/2\\)예요."},"hint":"A는 PF 위에 있고 PF와 PF′은 y축을 기준으로 대칭이며, PC는 x축과 평행해요.","label":"각 조건에서 각의 크기를 정해요","id":"c1","explanation":"\\(\\angle FPO=\\angle F^\\prime PO=\\theta\\)라 하면 A는 선분 PF 위에 있으므로 PA와 PF가 같은 반직선이에요. 따라서 \\(\\angle APF^\\prime=\\angle FPF^\\prime=2\\theta\\)예요. 또 PO는 y축 방향이고 PC는 x축과 평행하므로 서로 수직이에요. PA와 PO 사이가 \\(\\theta\\)이므로 \\(\\angle APC=\\pi/2-\\theta\\)예요. 주어진 두 각이 같아 \\(2\\theta=\\pi/2-\\theta\\), 따라서 \\(\\theta=\\pi/6\\)이에요. 직각삼각형 POF에서 \\(OF=c\\), \\(\\sin\\theta=OF/PF=1/2\\)이므로 \\(PF=2c\\)예요.","stepIds":["s1","s2","s3"]},{"question":"타원 조건 \\(q+r=2k\\)는 어떤 두 거리의 합을 서로 비교한 결과일까요?","check":{"prompt":"쌍곡선 식에서 r-q가 -8이 아니라 8인 이유는 무엇인가요?","answer":"A는 오른쪽 가지에 있어 오른쪽 초점 F에 더 가까워요. 따라서 \\(AF^\\prime=r\\)가 \\(AF=q\\)보다 크고 \\(r-q=8\\)이에요."},"hint":"타원의 초점이 A,B이므로 점 F와 점 P에서의 초점거리 합이 같아요. B는 A의 y축 대칭점이에요.","label":"세 거리식을 한꺼번에 풀어요","id":"c2","explanation":"\\(AP=k,AF=q,AF^\\prime=r\\)라 해요. 대칭으로 \\(BP=k\\), \\(BF=r\\)예요. 타원이 F와 P를 지나므로 F에서의 초점거리 합 \\(AF+BF=q+r\\)와 P에서의 합 \\(AP+BP=2k\\)가 같아 \\(q+r=2k\\)예요. A가 쌍곡선의 오른쪽 가지에 있으므로 \\(AF^\\prime-AF=r-q=8\\)이에요. 또 P,A,F 순서로 한 직선 위이고 \\(PF=2c\\)라 \\(k+q=2c\\)예요. 앞의 두 식에서 \\(r=q+8\\), \\(k=q+4\\), 이를 \\(k+q=2c\\)에 넣으면 \\(q=c-2,k=c+2,r=c+6\\)이에요.","stepIds":["s4","s5","s6","s7","s8"]},{"question":"삼각형 \\(AF^\\prime P\\)에서 어느 각을 써야 \\(r,c,k\\)가 한 식에 들어갈까요?","check":{"prompt":"방정식의 다른 근 \\(c=-2\\)를 버리는 근거는 무엇인가요?","answer":"초점이 \\((\\pm c,0)\\)이고 문제에서 \\(c>0\\)이라 했으므로 \\(c=-2\\)는 허용되지 않아요."},"hint":"\\(\\angle APF^\\prime=2\\theta=\\pi/3\\)이고 \\(PF^\\prime=2c\\)예요.","label":"코사인법칙으로 c를 정해요","id":"c3","explanation":"삼각형 \\(APF^\\prime\\)에서 \\(AP=k=c+2\\), \\(PF^\\prime=2c\\), \\(AF^\\prime=r=c+6\\), 끼인각 \\(\\angle APF^\\prime=\\pi/3\\)이에요. 코사인법칙을 쓰면 \\((c+6)^2=(c+2)^2+(2c)^2-2(c+2)(2c)\\cos(\\pi/3)\\)예요. \\(\\cos(\\pi/3)=1/2\\)이므로 오른쪽은 \\((c+2)^2+4c^2-2c(c+2)\\)이고, 정리하면 \\((c+2)(c-8)=0\\)이에요. \\(c>0\\)이므로 \\(c=8\\), 따라서 \\(AP=10,AF=6,AF^\\prime=14\\)예요.","stepIds":["s9","s10"]},{"question":"삼각형 ACP와 \\(AF^\\prime F\\)의 대응변은 어떻게 정해질까요?","check":{"prompt":"닮음비를 6/10으로 거꾸로 쓰지 않았는지 어떻게 확인하나요?","answer":"구하는 삼각형 ACP의 변 \\(AP=10\\)이 기준 삼각형의 대응변 \\(AF=6\\)보다 길어요. 따라서 ACP의 둘레는 36보다 큰 \\(36\\cdot10/6=60\\)이어야 해요."},"hint":"A,P,F는 한 직선, A,C,F′도 한 직선이고 \\(PC\\parallel F^\\prime F\\)예요.","label":"닮음비로 둘레를 옮겨요","id":"c4","explanation":"A,P,F가 한 직선이고 A,C,F′가 한 직선이며 PC는 x축과 평행하므로 \\(PC\\parallel F^\\prime F\\)예요. 따라서 \\(\\triangle ACP\\sim\\triangle AF^\\prime F\\)이고, AP는 AF에 대응해 닮음비는 \\(AP/AF=10/6=5/3\\)예요. 기준 삼각형 \\(AF^\\prime F\\)의 세 변은 \\(AF^\\prime=14\\), \\(F^\\prime F=2c=16\\), \\(AF=6\\)이므로 둘레는 36이에요. 닮은 도형의 둘레도 같은 비로 변하므로 \\(L_{ACP}=36\\cdot5/3=60\\)이에요.","stepIds":["s11","s12","s13"]}],"takeaway":["대칭점과 평행선이 보이면 여러 각을 한 문자로 묶어 각 조건을 방정식으로 만들어요.","타원은 거리의 합, 쌍곡선은 거리의 차를 같은 거리 문자에 동시에 적용해요.","닮음에서는 대응변을 실제 길이로 확인해 비의 방향을 정해요."]};</script>
