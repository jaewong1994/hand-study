<script>window.HandStudyGuide={"itemId":16490,"sourceHash":"02a8fcbfa78a6fa4445d684d7adc9f2469ba70a04f88803bccf57d74e054db12","contentHash":"c9b8bbb559dbbf34082c5b1d6af196e7029e5003c15d22bcd5445ffb4374500f","overview":{"goal":"절댓값 적분과 연속 조건으로 삼차함수 \\(f\\)를 정해요.","firstLook":"\\(x\\ge-3\\)에서 \\(g'(x)=|f'(x)|\\ge0\\)이므로 경계에서 두 조각을 이어 봐요.","conditions":[{"label":"연속","meaning":"\\(f(-3)=g(-3)=-16\\)이에요."},{"label":"극값 위치","meaning":"\\(f'\\)의 두 근은 \\(-3,a\\)예요."}]},"chapters":[{"id":"c1","label":"세 함숫값을 정해요","stepIds":["s1","s2","s3"],"question":"왜 \\(f(-3)\\)과 \\(f(0)\\)이 모두 \\(-16\\)일까요?","hint":"연속 조건과 절댓값 적분을 함숫값 차로 바꿔요.","explanation":"오른쪽에서 \\(g'=|f'|\\ge0\\)이므로 \\(g\\)는 감소하지 않아요. (다)의 극솟값은 경계 \\(x=-3\\)에서 생겨야 하므로 왼쪽의 \\(f\\)는 \\(-3\\)까지 감소하고, 두 극점 사이에서는 증가해요. 또 \\(g(0)=0\\), \\(g(a)=-8\\)이므로 \\(-3<a<0\\)이에요. 연속성에서 \\(f(-3)=g(-3)=-16\\)이고, \\(a<x<0\\)에서 \\(f'<0\\)이므로 \\(g(a)=\\int_0^a|f'|dt=f(0)-f(a)=-8\\)이에요. 한편 \\([-3,a]\\)에서는 \\(f'>0\\), \\([a,0]\\)에서는 \\(f'<0\\)이므로 \\(g(-3)=f(-3)+f(0)-2f(a)=-16\\)이에요. 따라서 \\(f(0)=2f(a)\\)이고 두 식을 풀면 \\(f(a)=-8, f(0)=-16\\)이에요.","check":{"prompt":"연속 조건이 직접 주는 등식은 무엇인가요?","answer":"\\(f(-3)=g(-3)=-16\\)이에요."}},{"id":"c2","label":"근의 구조로 함수를 정해요","stepIds":["s4","s5","s6"],"question":"\\(f(x)+16\\)에 왜 \\((x+3)^2\\)가 곱해질까요?","hint":"\\(x=-3\\)에서 값이 \\(-16\\)이고 동시에 극값을 가져요.","explanation":"\\(f(-3)+16=0,f'(-3)=0\\)이므로 \\(-3\\)은 같은 인수가 두 번 곱해진 근이에요. 또 \\(f(0)+16=0\\)이어서 \\(f(x)+16=kx(x+3)^2\\)예요. 미분하면 \\(f'(x)=3k(x+3)(x+1)\\)이므로 \\(a=-1\\)이고, \\(f(-1)=-8\\)에서 \\(k=-2\\)예요.","check":{"prompt":"\\(f(x)+16\\)의 근을 인수를 센 횟수와 함께 말해 보세요.","answer":"\\(-3\\)이 두 번, \\(0\\)이 한 번이에요."}},{"id":"c3","label":"합이 일정한 구간을 적분해요","stepIds":["s7","s8"],"question":"\\(x\\ge-1\\)에서 왜 \\(f(x)+g(x)=-16\\)일까요?","hint":"이 구간에서 \\(|f'(x)|=-f'(x)\\)예요.","explanation":"\\(k=-2\\)이면 \\(x\\ge-1\\)에서 \\(f'(x)=-6(x+3)(x+1)\\le0\\)이에요. 따라서 \\(g(x)=g(-1)+\\int_{-1}^x-f'(t)dt=-8-\\{f(x)-f(-1)\\}=-16-f(x)\\)예요. 그러므로 \\(\\left|\\int_{-1}^4(f+g)dx\\right|=|-16\\cdot5|=80\\)이에요.","check":{"prompt":"절댓값 전 정적분은 얼마인가요?","answer":"\\(-80\\)이고 요구값은 \\(80\\)이에요."}}],"takeaway":["절댓값 도함수의 적분은 도함수 부호를 먼저 확인해요.","극값 위치의 특정 함숫값은 같은 인수가 두 번 곱해진 근을 만들어요.","\\(|f'|=-f'\\)인 구간에서는 \\(f+g\\)가 일정할 수 있어요."]};</script>
