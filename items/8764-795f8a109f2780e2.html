<script>window.HandStudyGuide={"itemId":8764,"sourceHash":"79f616c76574403965922a14462957862ab4ef7be481250377e8a63fade34c87","contentHash":"9981f86e2c8a25293ab07ab86dd648613c0ad31ade01588ef2dec5b9e31fc678","overview":{"goal":"두 원의 중심에서 직선까지의 거리가 반지름보다 작다는 조건으로 \\(m+n\\)을 제한해요.","firstLook":"직선과 서로 다른 두 점에서 만나려면 중심과 직선 사이의 거리가 반지름 3보다 작아야 해요.","conditions":[{"label":"첫 원","meaning":"중심은 \\((2+m,3)\\)이고 \\(m\\le3\\)이에요."},{"label":"둘째 원","meaning":"중심은 \\((2+m,3+n)\\)이고 \\(|4m-1-3n|<15\\)예요."}]},"chapters":[{"id":"c1","label":"첫 번째 원에서 m의 범위를 얻어요","stepIds":["s1"],"question":"거리 식의 분자 \\(4m-1\\)은 어떻게 나오나요?","hint":"중심 좌표를 직선식 \\(4x-3y\\)에 넣어요.","explanation":"\\(C_1\\)의 중심은 \\((2+m,3)\\)이므로 직선까지 거리는 \\(|4(2+m)-3\\cdot3|/5=|4m-1|/5\\)예요. 두 점에서 만나려면 이 값이 3보다 작아야 하므로 \\(|4m-1|<15\\)예요. \\(m\\)은 자연수이므로 \\(m\\le3\\)이에요.","check":{"prompt":"\\(m=4\\)가 안 되는 이유는 무엇인가요?","answer":"거리가 \\(|16-1|/5=3\\)이라 한 점에서 접할 뿐 두 점에서 만나지 않아요."}},{"id":"c2","label":"합의 상한과 실현을 확인해요","stepIds":["s2","s3","s4","s5"],"question":"\\(m+n\\le11\\)만 얻고 끝내면 왜 부족할까요?","hint":"등호를 만드는 자연수 순서쌍이 두 원의 조건을 모두 만족하는지 확인해야 해요.","explanation":"\\(C_2\\)의 중심은 \\((2+m,3+n)\\)이므로 \\(|4m-1-3n|<15\\)예요. 특히 \\(4m-1-3n>-15\\)에서 \\(3n<4m+14\\)이고 \\(m\\le3\\)이므로 \\(m+n<(7m+14)/3\\le35/3\\)이에요. 합이 자연수라 \\(m+n\\le11\\)이에요. 실제로 \\((m,n)=(3,8)\\)이면 첫 거리는 \\(11/5<3\\), 둘째 거리는 \\(|12-1-24|/5=13/5<3\\)이므로 두 조건을 만족해요. 따라서 최댓값은 11이에요.","check":{"prompt":"\\((3,8)\\)에서 둘째 원은 직선과 두 점에서 만나나요?","answer":"중심과 직선의 거리가 \\(13/5\\)로 반지름 3보다 작으므로 두 점에서 만나요."}}],"takeaway":["원과 직선이 두 점에서 만나는 조건은 중심과 직선 사이의 거리와 반지름을 비교해요.","자연수의 최댓값은 상한을 구한 뒤 그 값을 만드는 후보를 원래 조건에 넣어 확인해요."]};</script>
