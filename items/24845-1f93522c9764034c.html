  <script>window.HandStudyRecord={"adminYear":2022,"answer":"31","contentHash":"b84f6b866bbef55294e7860dc830ea47f8fb5d5d4f2ffe8cdb80e21fa11fbc7c","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24845,"month":11,"number":30,"points":4,"preview":false,"questionHtml":"\u003cp>최고차항의 계수가 양수인 삼차함수 \u003cspan class=\"heq\">\\(f \\left( x \\right)\\)\u003c/span>와 함수 \u003cspan class=\"heq\">\\(g \\left( x \\right)=e^{\\sin\\,\\pi x}-1\\)\u003c/span>에 대하여 실수 전체의 집합에서 정의된 합성함수 \u003cspan class=\"heq\">\\(h \\left( x \\right)=g \\left( f \\left( x \\right) \\right)\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox hcond\">\u003cp class=\"hcondr\">(가) 함수 \u003cspan class=\"heq\">\\(h \\left( x \\right)\\)\u003c/span>는 \u003cspan class=\"heq\">\\(x=0\\)\u003c/span>에서 극댓값 \u003cspan class=\"heq\">\\(0\\)\u003c/span>을 갖는다.\u003c/p>\u003cp class=\"hcondr\">(나) 열린구간 \u003cspan class=\"heq\">\\(\\left( \\,0,\\,3\\, \\right)\\)\u003c/span>에서 방정식 \u003cspan class=\"heq\">\\(h \\left( x \\right)=1\\)\u003c/span>의 서로 다른 실근의 개수는 \u003cspan class=\"heq\">\\(7\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp>\u003cspan class=\"heq\">\\(f \\left( 3 \\right)= \\frac{ 1}{ 2}\\)\u003c/span>, \u003cspan class=\"heq\">\\(f&#x27; \\left( 3 \\right)=0\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(f \\left( 2 \\right)= \\frac{ q}{ p}\\)\u003c/span>이다. \u003cspan class=\"heq\">\\(p+q\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(p\\)\u003c/span>와 \u003cspan class=\"heq\">\\(q\\)\u003c/span>는 서로소인 자연수이다.) [4점]\u003c/p>","questionText":"최고차항의 계수가 양수인 삼차함수 $f \\left( x \\right)$와 함수 $g \\left( x \\right)=e^{\\sin\\,\\pi x}-1$에 대하여 실수 전체의 집합에서 정의된 합성함수 $h \\left( x \\right)=g \\left( f \\left( x \\right) \\right)$가 다음 조건을 만족시킨다.\n(가) 함수 $h \\left( x \\right)$는 $x=0$에서 극댓값 $0$을 갖는다.(나) 열린구간 $\\left( \\,0,\\,3\\, \\right)$에서 방정식 $h \\left( x \\right)=1$의 서로 다른 실근의 개수는 $7$이다.\n$f \\left( 3 \\right)= \\frac{ 1}{ 2}$, $f\\,' \\left( 3 \\right)=0$일 때, $f \\left( 2 \\right)= \\frac{ q}{ p}$이다. $p+q$의 값을 구하시오. (단, $p$와 $q$는 서로소인 자연수이다.) [4점]","sourceHash":"1ab8a434a767b78969d8ba425b43b685108f8e8eed9381e180291d986becb84a","sourceKind":"csat","sourceLabel":"2022년 시행 수능 · 2023학년도 · 미적분 · 30번","steps":[{"id":"s1","latex":"f(x)=ax^3+bx^2+cx+d,\\quad a>0"},{"id":"s2","latex":"h(0)=0\\ \\Rightarrow\\sin\\pi d=0\\ \\Rightarrow\\ d\\text{는 정수}"},{"id":"s3","latex":"h\\prime(0)=\\pi\\cos\\pi d\\,c=0,\\quad\\cos\\pi d=\\pm1\\ \\Rightarrow\\ c=0"},{"id":"s4","latex":"f\\prime(3)=27a+6b=0\\ \\Rightarrow\\ b=-\\frac92a\u003c0"},{"id":"s5","latex":"f(3)=\\frac12\\ \\Rightarrow\\ d=\\frac12+\\frac{27}2a>\\frac12"},{"explanation":{"body":"\\(f\\)는 \\(0\\)의 양옆에서 \\(d\\)보다 조금 작아져요. 이때 바깥 함수 \\(g\\)가 증가해야 \\(g(f(x))\u003cg(d)=0\\)이 되어 극대가 돼요. \\(g\\prime(d)=\\pi\\cos\\pi d\\)이므로 \\(d\\)가 짝수여야 해요. 합성함수의 극값에서는 안쪽 함수의 증감뿐 아니라 바깥 함수가 그 근처에서 증가하는지도 함께 봐야 해요.","skillTags":["derivatives.composition-extrema"],"title":"정수라는 조건만으로는 부족해요"},"id":"s6","latex":"0\\text{에서 }f\\text{는 극대이고 }f(x)-d\u003c0\\text{이므로 }h\\text{가 극대이려면 }\\cos\\pi d>0"},{"id":"s7","latex":"d\\text{는 양의 짝수},\\quad d=2k\\quad(k\\text{는 자연수})"},{"id":"s8","latex":"f\\prime(x)=3ax(x-3)\u003c0\\quad(0\u003cx\u003c3)\\ \\Rightarrow\\ \\frac12\u003cf(x)\u003cd"},{"id":"s9","latex":"0\u003c\\alpha\u003c\\frac12,\\quad\\sin\\pi\\alpha=\\ln2\\text{라 두면 양의 해는 }2j+\\alpha,\\ 2j+1-\\alpha"},{"id":"s10","latex":"\\frac12\u003ct\u003c2k\\text{에는 첫 양의 반주기에서 }1\\text{개, 이후 }k-1\\text{개 반주기에서 각각 }2\\text{개}"},{"id":"s11","latex":"1+2(k-1)=2k-1=d-1=7\\ \\Rightarrow\\ d=8"},{"id":"s12","latex":"a=\\frac59,\\quad b=-\\frac52,\\quad f(2)=\\frac{40}9-10+8=\\frac{22}9"},{"id":"s13","latex":"\\boxed{p+q=9+22=31}"}],"track":"미적분"};</script>
