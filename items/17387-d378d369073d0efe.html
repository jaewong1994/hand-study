<script>window.HandStudyGuide={"itemId":17387,"sourceHash":"400e362305a916332a6756ba1cf9d86853d69a72cd09f16557946028155d70a1","contentHash":"6bf7c63725a84ca425313e628004b9f895951eb0a1f82483a4c8e9bec975dca9","overview":{"goal":"첫 색칠 도형의 넓이와 다음 도형의 길이비를 좌표로 구하고, 넓이비를 공비로 하는 무한합을 계산해요.","firstLook":"첫 직사각형을 좌표축에 놓으면 반원과 두 선분의 교점, 부채꼴의 중심각을 정확히 구할 수 있어요.","conditions":[{"label":"매 단계 같은 방법으로 만드는 도형","meaning":"모든 색칠 도형은 닮음이고 넓이는 길이비의 제곱배가 돼요."},{"label":"다음 직사각형의 꼭짓점이 반원 위","meaning":"반원 방정식에 꼭짓점 좌표를 넣어 길이비를 정해요."}]},"chapters":[{"id":"c1","label":"첫 도형의 교점 구하기","stepIds":["s1","s2","s3"],"question":"반원과 두 직선을 연립할 때 원점 \\(B_1\\)이 아닌 교점은 각각 무엇인가요?","hint":"\\(B_1=(0,0)\\)으로 두고 직사각형과 내분점 좌표부터 적으세요.","explanation":"\\(B_1=(0,0)\\), \\(C_1=(2\\sqrt3,0)\\), \\(A_1=(0,2)\\), \\(D_1=(2\\sqrt3,2)\\)로 두면 \\(E_1=(2\\sqrt3/3,2)\\)예요. 반원의 중심은 \\(O=(\\sqrt3,0)\\), 방정식은 \\((x-\\sqrt3)^2+y^2=3\\)이에요. 두 선분의 직선은 \\(B_1E_1:y=\\sqrt3x\\), \\(B_1D_1:y=x/\\sqrt3\\)예요.\n\n각 직선을 반원과 연립하고 \\(B_1\\)이 아닌 교점을 고르면 \\(F_1=(\\sqrt3/2,3/2)\\), \\(G_1=(3\\sqrt3/2,3/2)\\)예요. 두 반지름의 내적으로 확인하면 중심각 \\(\\angle F_1OG_1=\\pi/3\\)이에요.","check":{"prompt":"\\(F_1,G_1\\)이 반원의 윗부분에 있는지 어떤 좌표로 확인하나요?","answer":"두 점 모두 \\(y=3/2>0\\)이고 반원 방정식을 만족해요."}},{"id":"c2","label":"첫 색칠 넓이 계산하기","stepIds":["s4","s5"],"question":"색칠 영역에서 빠지는 곡선 쪽 영역을 삼각형과 활꼴로 나누면 어떤 항들이 서로 없어질까요?","hint":"큰 삼각형 \\(B_1E_1D_1\\)에서 \\(B_1F_1G_1\\)과 활꼴을 빼세요.","explanation":"좌표로 \\([\\triangle B_1E_1D_1]=4\\sqrt3/3\\), \\([\\triangle B_1F_1G_1]=3\\sqrt3/4\\)예요. 부채꼴 \\(F_1OG_1\\)의 넓이는 \\(\\frac12\\cdot3\\cdot\\frac\\pi3=\\pi/2\\)이고, 삼각형 \\(F_1OG_1\\)의 넓이는 \\(3\\sqrt3/4\\)라 활꼴은 \\(\\pi/2-3\\sqrt3/4\\)예요.\n\n색칠 넓이는 큰 삼각형에서 \\(B_1F_1G_1\\)과 활꼴을 빼는 값이에요. 두 \\(3\\sqrt3/4\\) 항이 서로 없어져 \\(S_1=4\\sqrt3/3-\\pi/2=(8\\sqrt3-3\\pi)/6\\)이에요.","check":{"prompt":"활꼴 넓이는 부채꼴에서 무엇을 빼서 구하나요?","answer":"두 반지름과 현으로 이루어진 삼각형 \\(F_1OG_1\\)의 넓이를 빼요."}},{"id":"c3","label":"반복 길이비 구하기","stepIds":["s6","s7"],"question":"다음 직사각형의 닮음비를 \\(t\\)라 할 때 어느 꼭짓점을 반원 방정식에 넣을까요?","hint":"호 위에 있는 \\(D_2=(4\\sqrt3t,2t)\\)를 사용하세요.","explanation":"첫 직사각형과 다음 직사각형의 길이비를 \\(t\\)라 하면 배치에서 \\(A_2=(2\\sqrt3t,2t)\\), \\(D_2=(4\\sqrt3t,2t)\\)예요. \\(D_2\\)가 첫 반원 위에 있으므로 \\((4\\sqrt3t-\\sqrt3)^2+(2t)^2=3\\)이에요. 정리하면 \\(52t^2-24t=0\\)이고 길이비는 양수이므로 \\(t=6/13\\)이에요.","check":{"prompt":"방정식의 해 \\(t=0\\)을 쓰지 않는 이유는 무엇인가요?","answer":"다음 직사각형은 길이가 양수인 도형이므로 닮음비도 양수여야 해요."}},{"id":"c4","label":"넓이의 무한합 계산하기","stepIds":["s8"],"question":"길이비가 \\(6/13\\)일 때 색칠 넓이의 공비는 얼마인가요?","hint":"넓이는 길이비의 제곱배예요.","explanation":"매 단계 같은 방법으로 만든 닮은 도형이므로 넓이 공비는 \\((6/13)^2=36/169\\)예요. 따라서 극한으로 쌓인 전체 색칠 넓이는 \\(\\frac{S_1}{1-36/169}\\)이고, 계산하면 \\(\\frac{169}{798}(8\\sqrt3-3\\pi)\\)예요. 정답은 ②예요.","check":{"prompt":"분모의 798은 어떻게 나오나요?","answer":"\\(1-36/169=133/169\\)이고 \\(S_1\\)의 분모 6과 곱해 \\(6\\cdot133=798\\)이 돼요."}}],"takeaway":["반복 도형은 첫 넓이와 길이 닮음비를 따로 구해요.","활꼴은 부채꼴에서 중심과 현이 만드는 삼각형을 뺀 넓이예요.","닮은 도형의 넓이 공비는 길이비의 제곱이에요."]};</script>
