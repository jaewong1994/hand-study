<script>window.HandStudyRecord={"itemId":11829,"sourceLabel":"2022 교육청 고1 수학 11월 20번","adminYear":2022,"grade":1,"month":11,"number":20,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"양수 $k$에 대하여 좌표평면 위에 두 점 $A (k,\\, 0 )$, $B (0,\\, k )$가 있다. 삼각형 $OAB$의 내부에 있으며 $\\angle AOP = \\angle BAP$를 만족시키는 점 $P$에 대하여 점 $P$의 $y$좌표의 최댓값을 $M (k)$라 하자. 다음은 $M(k)$를 구하는 과정이다. (단, $O$는 원점이고, $\\angle AOP \u003c 180°$, $\\angle BAP \u003c 180°$이다.)\n원의 접선과 그 접점을 지나는 현이 이루는 각의 크기는 이 각의 내부에 있는 호에 대한 원주각의 크기와 같다.\n그러므로 점 $O$를 지나고 직선 $AB$와 점 $A$에서 접하는 원을 $C\\,$라 할 때, 삼각형 $OAB$의 내부에 있으며 $\\angle AOP = \\angle BAP$를 만족시키는 점 $P$는 원 $C\\,$ 위의 점이다.\n원 $C\\,$의 중심을 $C$라 하면 $\\angle OAC = 45°$이므로 점 $C\\,$의 좌표는 $\\left( \\frac{k}{2} ,\\, \\boxed{\\,\\text{(가)}\\,} \\, \\right)$이고 원 $C\\,$의 반지름의 길이는 $\\boxed{\\,\\text{(나)}\\,}\\,$이다.\n점 $P$의 $y$좌표는 $\\angle PCO = 45°$일 때 최대이므로 $M(k) = \\left( \\, \\boxed{\\,\\text{(다)}\\,} \\, \\right) \\times k$이다.\n위의 (가), (나)에 알맞은 식을 각각 $f(k)$, $g(k)$라 하고, (다)에 알맞은 수를 $p$라 할 때, $f(p) + g \\left( \\frac{1}{2} \\right)$의 값은? [4점]\n① $\\frac{\\sqrt{2}}{16}$ ② $\\frac{1}{8}$ ③ $\\frac{\\sqrt{2}}{8}$ ④ $\\frac{1}{4}$ ⑤ $\\frac{\\sqrt{2}}{4}$","answer":"④","sourceHash":"575a919008e0a4667401328c4cb9bded2234d839f08c0b7be5de205e8a0351b4","steps":[{"id":"s1","latex":"C\\in\\left\\{x=\\frac k2\\right\\},\\quad AC\\perp AB"},{"id":"s2","latex":"AB:\\ y=-x+k\\Rightarrow AC:\\ y=x-k"},{"id":"s3","latex":"C=\\left(\\frac k2,-\\frac k2\\right),\\quad CO=\\frac{\\sqrt2}{2}k"},{"id":"s4","latex":"f(k)=-\\frac k2,\\quad g(k)=\\frac{\\sqrt2}{2}k"},{"id":"s5","latex":"M(k)=-\\frac k2+\\frac{\\sqrt2}{2}k=\\frac{\\sqrt2-1}{2}k"},{"id":"s6","latex":"p=\\frac{\\sqrt2-1}{2}"},{"id":"s7","latex":"f(p)+g\\left(\\frac12\\right)=\\frac{1-\\sqrt2}{4}+\\frac{\\sqrt2}{4}=\\frac14"}],"diagram":null,"contentHash":"cc8a95fe97862e8d1d126c30e76c0b99ce723b353aa9af52ea5e95d8576ca59d","questionHtml":"\u003cp class=\"hp\">양수 \u003cspan class=\"heq\">\\(k\\)\u003c/span>에 대하여 좌표평면 위에 두 점 \u003cspan class=\"heq\">\\(A (k,\\, 0 )\\)\u003c/span>, \u003cspan class=\"heq\">\\(B (0,\\, k )\\)\u003c/span>가 있다. 삼각형 \u003cspan class=\"heq\">\\(OAB\\)\u003c/span>의 내부에 있으며 \u003cspan class=\"heq\">\\(\\angle AOP = \\angle BAP\\)\u003c/span>를 만족시키는 점 \u003cspan class=\"heq\">\\(P\\)\u003c/span>에 대하여 점 \u003cspan class=\"heq\">\\(P\\)\u003c/span>의 \u003cspan class=\"heq\">\\(y\\)\u003c/span>좌표의 최댓값을 \u003cspan class=\"heq\">\\(M (k)\\)\u003c/span>라 하자.\u003cbr>다음은 \u003cspan class=\"heq\">\\(M(k)\\)\u003c/span>를 구하는 과정이다.\u003cbr>(단, \u003cspan class=\"heq\">\\(O\\)\u003c/span>는 원점이고, \u003cspan class=\"heq\">\\(\\angle AOP \\lt  180^{\\circ}\\)\u003c/span>, \u003cspan class=\"heq\">\\(\\angle BAP \\lt  180^{\\circ}\\)\u003c/span>이다.)\u003c/p>\u003cp class=\"hp htall\">\u003cdiv class=\"hbox\">\u003cp class=\"hp\">원의 접선과 그 접점을 지나는 현이 이루는 각의 크기는\u003c/p>\u003cp class=\"hp\">이 각의 내부에 있는 호에 대한 원주각의 크기와 같다.\u003c/p>\u003cp class=\"hp\">그러므로 점 \u003cspan class=\"heq\">\\(O\\)\u003c/span>를 지나고 직선 \u003cspan class=\"heq\">\\(AB\\)\u003c/span>와 점 \u003cspan class=\"heq\">\\(A\\)\u003c/span>에서 접하는 \u003cbr>원을 \u003cspan class=\"heq\">\\(C\\,\\)\u003c/span>라 할 때, 삼각형 \u003cspan class=\"heq\">\\(OAB\\)\u003c/span>의 내부에 있으며\u003cbr>\u003cspan class=\"heq\">\\(\\angle AOP = \\angle BAP\\)\u003c/span>를 만족시키는 점\u003cspan class=\"heq\">\\(P\\)\u003c/span>는 원\u003cspan class=\"heq\">\\(C\\,\\)\u003c/span> 위의 점이다.\u003c/p>\u003cp class=\"hp\">원 \u003cspan class=\"heq\">\\(C\\,\\)\u003c/span>의 중심을 \u003cspan class=\"heq\">\\(C\\)\u003c/span>라 하면 \u003cspan class=\"heq\">\\(\\angle OAC = 45^{\\circ}\\)\u003c/span>이므로\u003c/p>\u003cp class=\"hp htall\">점 \u003cspan class=\"heq\">\\(C\\,\\)\u003c/span>의 좌표는 \u003cspan class=\"heq\">\\(\\left( \\dfrac{k}{2} ,\\, \\boxed{\\vphantom{(}\\, (\\text{가})\\, } \\, \\right)\\)\u003c/span>이고\u003cbr>원 \u003cspan class=\"heq\">\\(C\\,\\)\u003c/span>의 반지름의 길이는 \u003cspan class=\"heq\">\\(\\boxed{\\vphantom{(}\\, (\\text{나})\\, \\, }\\
