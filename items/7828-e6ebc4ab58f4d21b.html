<script>window.HandStudyRecord={"itemId":7828,"sourceLabel":"2019 교육청 고2 수학나형 3월 21번","adminYear":2019,"grade":2,"month":3,"number":21,"track":"수학나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"최고차항의 계수가 양수인 이차함수 $f(x)\\,$에 대하여 함수 $g(x)\\,$를 다음과 같이 정의하자. \n $g(x)= \\begin{cases} -x+4 & \\left( x\u003c -2 \\right) \\\\ f(x) & \\left( -2 \\leq x \\leq 1 \\right) \\\\ -x-2 & \\left( x>1 \\right)\\end{cases}$\n함수 $g(x)\\,$의 치역이 실수 전체의 집합이고, 함수 $g(x)\\,$의 역함수가 존재할 때, \u003c보기>에서 옳은 것만을 있는 대로 고른 것은?\n[4점]\n\u003c보기>\nㄱ. $f(-2)+f(1)=3$\nㄴ. $g(0)= -1\\,$, $g(1)= -3\\,$이면 곡선 $y=f(x)\\,$의 꼭짓점의 $x\\,$좌표는 $\\frac{5}{2} \\,$이다.\nㄷ. 곡선 $y=f(x)\\,$의 꼭짓점의 $x\\,$좌표가 $-2\\,$이면 $g ^{\\,-1} (1)=0\\,$ 이다. \n① ㄱ ② ㄴ ③ ㄱ, ㄴ \n④ ㄱ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","answer":"⑤","sourceHash":"ece70520b1a05a3ca57b9fd27bc991530636dca56929323b813a4c300eee515d","steps":[{"id":"s1","latex":"g(( -\\infty,-2))=(6,\\infty),\\quad g((1,\\infty))=(-\\infty,-3)"},{"id":"s2","latex":"g\\text{가 전단사}\\Rightarrow f([-2,1])=[-3,6]\\text{이고 }f\\text{는 단조}"},{"id":"s3","latex":"f(-2)+f(1)=3\\Rightarrow\\text{첫째 명제는 참}"},{"id":"s4","latex":"f(0)=-1,\\ f(1)=-3,\\ f(-2)=6\\Rightarrow f(x)=\\frac12x^2-\\frac52x-1"},{"id":"s5","latex":"x_{\\rm vertex}=\\frac52\\Rightarrow\\text{둘째 명제는 참}"},{"id":"s6","latex":"x_{\\rm vertex}=-2\\Rightarrow f(x)=(x+2)^2-3"},{"id":"s7","latex":"f(0)=1\\Rightarrow g^{-1}(1)=0\\Rightarrow\\text{셋째 명제는 참}"}],"diagram":null,"contentHash":"2238e1219c097b9d0d7c91a29ff8a5eaadeedb933bf1323a507c8e23c852099b","questionHtml":"\u003cp class=\"hp\">최고차항의 계수가 양수인 이차함수 \u003cspan class=\"heq\">\\(f(x)\\,\\)\u003c/span>에 대하여 함수 \u003cspan class=\"heq\">\\(g(x)\\,\\)\u003c/span>를 다음과 같이 정의하자.\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\(g(x)= {\\begin{cases}\\,-x+4 &\\, \\left( x\\lt  -2 \\right) \\\\ \\,f(x) &\\, \\left( -2 \\leq x \\leq 1 \\right) \\, \\\\ \\,-x-2 &\\, \\left( x\\gt 1 \\right) \\end{cases}}\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">함수 \u003cspan class=\"heq\">\\(g(x)\\,\\)\u003c/span>의 치역이 실수 전체의 집합이고, 함수 \u003cspan class=\"heq\">\\(g(x)\\,\\)\u003c/span>의 역함수가 존재할 때, &lt;보기&gt;에서 옳은 것만을 있는 대로 고른 것은?\u003c/p>\u003cp class=\"hp\">\u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cdiv class=\"hbox\">\u003cdiv style=\"text-align:center;font-weight:700;margin:0 0 6px\">&lt; 보 기 &gt;\u003c/div>\u003cp class=\"hp\">ㄱ.\u003cspan class=\"heq\">\\(f(-2)+f(1)=3\\)\u003c/span>\u003c/p>\u003cp class=\"hp htall\">ㄴ.\u003cspan class=\"heq\">\\(g(0)= -1\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(g(1)= -3\\,\\)\u003c/span>이면 곡선 \u003cspan class=\"heq\">\\(y=f(x)\\,\\)\u003c/span>의 꼭짓점의 \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>좌표는 \u003cspan class=\"heq\">\\(\\dfrac{5}{2} \\,\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp\">ㄷ.곡선 \u003cspan class=\"heq\">\\(y=f(x)\\,\\)\u003c/span>의 꼭짓점의 \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>좌표가 \u003cspan class=\"heq\">\\(-2\\,\\)\u003c/span>이면 \u003cspan class=\"heq\">\\(g^{\\,-1} (1)=0\\,\\)\u003c/span> 이다.\u003c/p>\u003c/div>\u003cp class=\"hp\">① ㄱ &emsp;② ㄴ &emsp;③ ㄱ, ㄴ\u003c/p>\u003cp class=\"hp\">④ ㄱ, ㄷ &emsp;⑤ ㄱ, ㄴ, ㄷ\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"e6ebc4ab58f4d21bf40d58d5690f28ceabdf6b5758632decd3223a9186a56587"};</script>
<script>window.HandStudyGuide={"itemId":7828,"sourceHash":"ece70520b1a05a3ca57b9fd27bc991530636dca56929323b813a4c300eee515d","contentHash":"2238e1219c097b9d0d7c91a29ff8a5eaadeedb933bf1323a507c8e23c852099b","overview":{"goal":"세 조각의 치역이 겹치지 않고 실수 전체를 덮도록 이차함수의 끝값과 단조성을 정해요.","firstLook":"왼쪽 조각의 치역은 \\((6,\\infty)\\), 오른쪽 조각의 치역은 \\((-\\infty,-3)\\)예요. 역함수가 있으려면 가운데 조각이 빠진 \\([-3,6]\\)을 한 번씩 채워야 해요.","conditions":[{"label":"전단사","meaning":"가운데 치역은 \\([-3,6]\\)이고 그 구간에서 일대일이어야 해요."},{"label":"끝값","meaning":"\\(f(-2),f(1)\\)은 6과 -3이에요."},{"label":"꼭짓점","meaning":"주어진 값들로 이차함수를 정해요."}]},"chapters":[{"id":"c1","label":"치역과 끝값을 정해요","stepIds":["s1","s2","s3"],"question":"가운데 조각이 왜 정확히 \\([-3,6]\\)을 가져야 할까요?","hint":"양쪽 조각이 이미 만드는 값과 아직 빠진 값을 비교해요.","explanation":"\\(x<-2\\)에서 \\(-x+4>6\\)이므로 치역은 \\((6,\\infty)\\), \\(x>1\\)에서 \\(-x-2<-3\\)이므로 치역은 \\((-\\infty,-3)\\)예요. 전체 치역이 실수 전체이고 같은 함숫값이 두 번 나오면 안 되므로 \\(f\\)는 \\([-2,1]\\)에서 \\([-3,6]\\)을 한 번씩 채워야 해요. 따라서 이 구간에서 한쪽 끝값은 -3, 다른 끝값은 6이고 두 값의 순서는 증가하는 경우와 감소하는 경우에 따라 달라질 수 있어요. 어느 경우든 \\(f(-2)+f(1)=3\\)이라 ㄱ은 참이에요.","check":{"prompt":"끝값 6과 -3을 열린 바깥 치역이 대신 만들 수 있나요?","answer":"바깥 조각의 정의역 끝점이 제외되어 6과 -3은 나오지 않으므로 가운데 조각이 만들어야 해요."}},{"id":"c2","label":"ㄴ과 ㄷ을 확인해요","stepIds":["s4","s5","s6","s7"],"question":"\\(f(0)=-1,f(1)=-3,f(-2)=6\\)에서 이차함수를 어떻게 정할까요?","hint":"\\(f(x)=ux^2+vx+w\\)에 세 값을 넣어요.","explanation":"세 값을 넣으면 \\(w=-1\\), \\(u+v=-2\\), \\(4u-2v=7\\)이라 \\(u=1/2,v=-5/2\\)예요. 꼭짓점의 x좌표는 \\(-v/(2u)=5/2\\)라 ㄴ은 참이에요. 꼭짓점의 x좌표가 -2이고 최고차항의 계수가 양수이면 \\(f\\)는 \\([-2,1]\\)에서 증가해요. 따라서 끝값의 순서는 \\(f(-2)=-3,f(1)=6\\)이고, 이를 만족하는 식은 \\(f(x)=(x+2)^2-3\\)이에요. \\(f(0)=1\\)이고 다른 두 조각에서는 1이 나오지 않으므로 \\(g^{-1}(1)=0\\), ㄷ도 참이에요. 답은 ⑤예요.","check":{"prompt":"ㄷ에서 역함숫값이 0임을 확정하려면 무엇을 확인해야 하나요?","answer":"\\(g(0)=1\\)뿐 아니라 전단사 조건 때문에 1을 만드는 다른 입력이 없다는 점을 확인해야 해요."}}],"takeaway":["조각함수의 역함수가 존재하면 각 조각의 치역이 겹치지 않고 전체 치역을 빠짐없이 채워야 해요.","끝점이 정의역에 포함되는 조각이 경계 함숫값을 맡아요."]};</script>
