<script>window.HandStudyRecord={"itemId":7828,"sourceLabel":"2019 교육청 고2 수학나형 3월 21번","adminYear":2019,"grade":2,"month":3,"number":21,"track":"수학나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"최고차항의 계수가 양수인 이차함수 $f(x)\\,$에 대하여 함수 $g(x)\\,$를 다음과 같이 정의하자. \n $g(x)= \\begin{cases} -x+4 & \\left( x\u003c -2 \\right) \\\\ f(x) & \\left( -2 \\leq x \\leq 1 \\right) \\\\ -x-2 & \\left( x>1 \\right)\\end{cases}$\n함수 $g(x)\\,$의 치역이 실수 전체의 집합이고, 함수 $g(x)\\,$의 역함수가 존재할 때, \u003c보기>에서 옳은 것만을 있는 대로 고른 것은?\n[4점]\n\u003c보기>\nㄱ. $f(-2)+f(1)=3$\nㄴ. $g(0)= -1\\,$, $g(1)= -3\\,$이면 곡선 $y=f(x)\\,$의 꼭짓점의 $x\\,$좌표는 $\\frac{5}{2} \\,$이다.\nㄷ. 곡선 $y=f(x)\\,$의 꼭짓점의 $x\\,$좌표가 $-2\\,$이면 $g ^{\\,-1} (1)=0\\,$ 이다. \n① ㄱ ② ㄴ ③ ㄱ, ㄴ \n④ ㄱ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","answer":"⑤","sourceHash":"ece70520b1a05a3ca57b9fd27bc991530636dca56929323b813a4c300eee515d","steps":[{"id":"s1","latex":"g(( -\\infty,-2))=(6,\\infty),\\quad g((1,\\infty))=(-\\infty,-3)"},{"id":"s2","latex":"g\\text{가 전단사}\\Rightarrow f([-2,1])=[-3,6]\\text{이고 }f\\text{는 단조}"},{"id":"s3","latex":"f(-2)+f(1)=3\\Rightarrow\\text{첫째 명제는 참}"},{"id":"s4","latex":"f(0)=-1,\\ f(1)=-3,\\ f(-2)=6\\Rightarrow f(x)=\\frac12x^2-\\frac52x-1"},{"id":"s5","latex":"x_{\\rm vertex}=\\frac52\\Rightarrow\\text{둘째 명제는 참}"},{"id":"s6","latex":"x_{\\rm vertex}=-2\\Rightarrow f(x)=(x+2)^2-3"},{"id":"s7","latex":"f(0)=1\\Rightarrow g^{-1}(1)=0\\Rightarrow\\text{셋째 명제는 참}"}],"diagram":null,"contentHash":"2238e1219c097b9d0d7c91a29ff8a5eaadeedb933bf1323a507c8e23c852099b","questionHtml":"\u003cp class=\"hp\">최고차항의 계수가 양수인 이차함수 \u003cspan class=\"heq\">\\(f(x)\\,\\)\u003c/span>에 대하여 함수 \u003cspan class=\"heq\">\\(g(x)\\,\\)\u003c/span>를 다음과 같이 정의하자.\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\(g(x)= {\\begin{cases}\\,-x+4 &\\, \\left( x\\lt  -2 \\right) \\\\ \\,f(x) &\\, \\left( -2 \\leq x \\leq 1 \\right) \\, \\\\ \\,-x-2 &\\, \\left( x\\gt 1 \\right) \\end{cases}}\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">함수 \u003cspan class=\"heq
