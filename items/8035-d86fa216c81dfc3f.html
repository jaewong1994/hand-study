  <script>window.HandStudyRecord={"itemId":8035,"sourceLabel":"2021 교육청 고2 수학 3월 18번","adminYear":2021,"grade":2,"month":3,"number":18,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"어느 학교에서는 ‘확률과 통계’, ‘미적분’, ‘기하’의 수학 과목 $3\\,$개와 ‘물리학Ⅱ’, ‘화학Ⅱ’, ‘생명과학Ⅱ’, ‘지구과학Ⅱ’의 과학 과목 $4\\,$개를 선택 교육 과정으로 운영한다. 두 학생 $A$, $B\\,$가 이 $7\\,$개의 과목 중에서 다음 조건을 만족시키도록 과목을 선택하려고 한다.\n⦁$A$, $B$는 각자 $1\\,$개 이상의 수학 과목을 포함한 $3\\,$개의 과목을 선택한다.\n⦁$A$가 선택하는 $3\\,$개의 과목과 $B$가 선택하는 $3\\,$개의 과목 중에서 서로 일치하는 과목의 개수는 $1\\,$이다.\n다음은 $A$, $B$가 과목을 선택하는 경우의 수를 구하는 과정이다.\n$A$, $B$가 선택하는 과목 중에서 서로 일치하는 과목이 수학 과목인 경우와 과학 과목인 경우로 나누어 구할 수 있다.\n(ⅰ)서로 일치하는 과목이 수학 과목일 때\n$3\\,$개의 수학 과목 중에서 $1\\,$개를 선택하는 경우의 수는\n${}_{3}\\mathrm{C}_{1}=3$\n위의 각 경우에 대하여 나머지 $6\\,$개의 과목 중에서 $A$가 $2\\,$개를 선택하고, 나머지 $4\\,$개의 과목 중에서 $B$가 $2\\,$개를 선택하는 경우의 수는\n$\\boxed{\\vphantom{(}\\, (\\text{가}) \\,}$\n이때의 경우의 수는\n$3 \\times \\, {\\boxed{\\vphantom{(}\\, (\\text{가}) \\,}}$\n(ⅱ)서로 일치하는 과목이 과학 과목일 때\n$4\\,$개의 과학 과목 중에서 $1\\,$개를 선택하는 경우의 수는\n${}_{4}\\mathrm{C}_{1}=4$\n위의 각 경우에 대하여 나머지 $6\\,$개의 과목 중에서 $A$, $B$는 수학 과목을 $1\\,$개 이상 선택해야 하므로 다음 두 가지 경우로 나눌 수 있다.\n(ⅱ-1)$A$, $B$ 모두 수학 과목 $1\\,$개와 과학 과목 $1\\,$개를 선택하는 경우의 수는\n$\\left({}_{3}\\mathrm{C}_{1} \\times {}_{3}\\mathrm{C}_{1}\\right) \\times \\left({}_{2}\\mathrm{C}_{1} \\times {}_{2}\\mathrm{C}_{1}\\right)=36$\n(ⅱ-2)$A$, $B$ 중 한 명은 수학 과목 $2\\,$개를 선택하고, 다른 한 명은 수학 과목 $1\\,$개와 과학 과목 $1\\,$개를 선택하는 경우의 수는 \n${\\boxed{\\vphantom{(}\\, (\\text{나}) \\,}}$\n이때의 경우의 수는\n$4 \\times \\left( \\,36+\\, {\\boxed{\\vphantom{(}\\, (\\text{나}) \\,}} \\, \\right)$\n(ⅰ), (ⅱ)에 의하여 구하는 경우의 수는\n$3 \\times \\, {\\boxed{\\vphantom{(}\\, (\\text{가}) \\,}} \\,+4 \\times \\left( \\,36+\\, {\\boxed{\\vphantom{(}\\, (\\text{나}) \\,}} \\, \\right)$이다.\n위의 (가), (나)에 알맞은 수를 각각 $p$, $q\\,$라 할 때, $p+q\\,$의 값은?\n[4점]\n① $102$ ② $108$ ③ $114$ ④ $120$ ⑤ $126$","answer":"②","sourceHash":"07fbff257a41c06e5e7117c24a10e5f17fed2503d26b02c8b3c5b7b68e3ba586","steps":[{"id":"s1","latex":"p={}_6C_2\\cdot{}_4
