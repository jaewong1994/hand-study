<script>window.HandStudyRecord={"itemId":16597,"sourceLabel":"2019 평가원 고3 수리나형 9월 21번","adminYear":2019,"grade":3,"month":9,"number":21,"track":"수리나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"함수 $f(x) = x^{3 }+ x^{2 }+ ax + b$에 대하여 함수 $g(x)$를 $g(x) = f(x) + (x - 1)f' (x)$ 라 하자. <보기>에서 옳은 것만을 있는 대로 고른 것은? (단, $a$, $b$는 상수이다.) [4점]\n<보 기>\nㄱ. 함수 $h(x)$가 $h(x) = (x - 1)f(x)$이면 $h ' (x) = g(x)$이다.\nㄴ. 함수 $f(x)$가 $x = - 1$에서 극값 $0$을 가지면 $\\int _{0}^{1} {\\,} g(x) \\,dx = - 1$이다.\nㄷ. $f(0) = 0$이면 방정식 $g(x) = 0$은 열린구간 $(0,\\, 1)$에서 적어도 하나의 실근을 갖는다.\n① ㄱ ② ㄴ ③ ㄱ, ㄴ\n④ ㄱ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","answer":"⑤","sourceHash":"eced822638d15cf1fdc91c5f326ea5c59fe8372af62e3d0854a8d5c130e957db","steps":[{"id":"s1","latex":"h(x)=(x-1)f(x)\\Rightarrow h\\prime(x)=f(x)+(x-1)f\\prime(x)=g(x)\\quad(\\mathrm I)"},{"id":"s2","latex":"\\int_0^1g(x)\\,dx=[(x-1)f(x)]_0^1=f(0)=b"},{"id":"s3","latex":"f(-1)=f\\prime(-1)=0\\Rightarrow a=-1,\\ b=-1\\Rightarrow\\int_0^1g=-1\\quad(\\mathrm{II})"},{"id":"s4","latex":"f(0)=0\\Rightarrow b=0\\Rightarrow\\int_0^1g(x)\\,dx=0"},{"id":"s5","latex":"g\\text{ 연속},\\ \\int_0^1g=0\\Rightarrow\\exists c\\text{ with }0<c<1:\\ g(c)=0\\quad(\\mathrm{III})"},{"id":"s6","latex":"\\boxed{\\mathrm{I,II,III}}"}],"diagram":null,"contentHash":"00bbd6d866a97bdad728ae311b42685a14cc0886ced8d37fad844069072a4624","questionHtml":"<p class=\"hp\">함수 <span class=\"heq\">\\(f(x) = x^{3 }+ x^{2 }+ ax + b\\)<\/span>에 대하여 함수 <span class=\"heq\">\\(g(x)\\)<\/span>를<br>&emsp;&emsp;<span class=\"heq\">\\(g(x) = f(x) + (x - 1)f' (x)\\)<\/span><br>라 하자. &lt;보기&gt;에서 옳은 것만을 있는 대로 고른 것은? <br>(단, <span class=\"heq\">\\(a\\)<\/span>, <span class=\"heq\">\\(b\\)<\/span>는 상수이다.) <span class=\"hscore\">[4점]<\/span><\/p><table class=\"htbl\"><tr><td style=\"width:171px;border-top:none;border-bottom:1px solid #333;border-left:none;border-right:none\">&nbsp;<\/td><td rowspan=\"2\" style=\"width:81px;border-top:none;border-bottom:none;border-left:none;border-right:none\"><p class=\"hp\"> <script>window.HandStudyGuide={"itemId":16597,"sourceHash":"eced822638d15cf1fdc91c5f326ea5c59fe8372af62e3d0854a8d5c130e957db","contentHash":"00bbd6d866a97bdad728ae311b42685a14cc0886ced8d37fad844069072a4624","overview":{"goal":"\\(g\\)가 한 곱의 도함수임을 찾아 정적분과 영점 문제를 한꺼번에 판단해요.","firstLook":"\\(f+(x-1)f'\\)는 곱 \\((x-1)f(x)\\)를 미분할 때 그대로 나와요. 이 구조를 ㄱ부터 ㄷ까지 계속 사용해요.","conditions":[{"label":"ㄱ","meaning":"곱의 미분으로 \\(g\\)의 부정적분을 찾는 주장입니다."},{"label":"ㄴ","meaning":"극값 0 조건은 \\(f(-1)=0\\)과 \\(f'(-1)=0\\)을 함께 줘요."},{"label":"ㄷ","meaning":"정적분이 0일 때 연속함수 \\(g\\)의 내부 영점이 있는지 판단해요."}]},"chapters":[{"id":"c1","label":"곱의 미분과 정적분을 연결해요","stepIds":["s1","s2"],"question":"\\(\\int_0^1g(x)dx\\)가 왜 단순히 \\(f(0)\\)이 될까요?","hint":"\\(h(x)=(x-1)f(x)\\)의 양 끝값을 넣어요.","explanation":"곱의 미분으로 \\(h'(x)=f(x)+(x-1)f'(x)=g(x)\\)이므로 ㄱ은 참이에요. 따라서 \\(\\int_0^1g(x)dx=[(x-1)f(x)]_0^1=0-(-f(0))=f(0)=b\\)예요.","check":{"prompt":"윗끝 \\(x=1\\)에서 항이 0이 되는 이유는 무엇인가요?","answer":"곱의 첫 인수 \\(x-1\\)이 0이기 때문이에요."}},{"id":"c2","label":"극값 0으로 두 계수를 정해요","stepIds":["s3"],"question":"\\(x=-1\\)에서 극값 0이라는 말은 어떤 두 식을 주나요?","hint":"함숫값과 도함숫값을 각각 써요.","explanation":"\\(f(-1)=0\\)에서 \\(-1+1-a+b=0\\), 즉 \\(b=a\\)예요. \\(f'(-1)=0\\)에서 \\(3-2+a=0\\), 즉 \\(a=-1\\)이고 \\(b=-1\\)이에요. 앞의 적분값은 \\(b\\)였으므로 \\(\\int_0^1g=-1\\), ㄴ도 참이에요.","check":{"prompt":"극값이라는 말에서 \\(f(-1)=0\\)만 쓰면 무엇이 부족한가요?","answer":"극값을 갖는 내부점에서는 \\(f'(-1)=0\\)도 성립해야 하므로 이 식까지 써야 \\(a,b\\)가 정해져요."}},{"id":"c3","label":"적분이 0이면 내부 영점이 생김을 확인해요","stepIds":["s4","s5","s6"],"question":"연속함수의 적분이 0이라는 사실만으로 내부 영점을 어떻게 보일까요?","hint":"내부에서 0이 한 번도 없다면 연속성 때문에 부호가 하나로 고정돼요.","explanation":"\\(f(0)=0\\)이면 \\(b=0\\)이고 앞 식에서 \\(\\int_0^1g=0\\)이에요. 다항함수 \\(g\\)는 연속이에요. 만약 열린구간 \\((0,1)\\)에서 영점이 없다면 연속성 때문에 그 구간 전체에서 양수이거나 전체에서 음수여야 해요. 그러면 정적분도 각각 양수 또는 음수가 되어 0일 수 없어요. 따라서 \\(0<c<1\\)인 어떤 실수 \\(c\\)에서 \\(g(c)=0\\)이고 ㄷ도 참이에요. 정답은 ㄱ, ㄴ, ㄷ인 ⑤예요.","check":{"prompt":"영점이 끝점에만 있어도 적분이 0이 될 수 있나요?","answer":"내부에서 계속 같은 엄격한 부호라면 끝점의 값과 관계없이 구간 넓이가 양수 또는 음수가 되므로 0일 수 없어요."}}],"takeaway":["합이 보이면 곱의 미분 결과인지 확인하면 정적분을 끝값 차로 바꿀 수 있어요.","극값과 그 값이 함께 주어지면 함숫값 조건과 도함숫값 조건을 모두 써요.","연속함수의 적분이 0이고 내부 영점이 없다고 가정하면 부호 고정으로 모순을 만들 수 있어요."]};</script>
