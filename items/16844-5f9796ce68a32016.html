<script>window.HandStudyRecord={"itemId":16844,"sourceLabel":"2020 교육청 고3 수리나형 7월 30번","adminYear":2020,"grade":3,"month":7,"number":30,"track":"수리나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"$t \\geq 6-3 \\sqrt{2} \\,$인 실수 $t\\,$에 대하여 실수 전체의 집합에서 정의된 함수 $f \\left( x \\right) \\,$가\n $f \\left( x \\right) = {\\begin{cases}\\,3x ^{2} +tx\\,(\\,x\u003c0\\,) \\\\ \\\\ \\,-3x ^{2} +tx\\,(\\,x \\geq 0\\,)\\end{cases}}$\n일 때, 다음 조건을 만족시키는 실수 $k\\,$의 최솟값을 $g \\left( t \\right) \\,$라 하자.\n(가) 닫힌구간 $\\left[ k-1,\\,k \\right] \\,$에서 함수 $f \\left( x \\right) \\,$는 $x=k\\,$에서 최댓값을 갖는다.(나) 닫힌구간 $\\left[ k,\\,k+1 \\right] \\,$에서 함수 $f \\left( x \\right) \\,$는 $x=k+1\\,$에서 최솟값을 갖는다.\n$3 \\int _{2} ^{4} {\\left\\{ 6g \\left( t \\right) -3 \\right\\} ^{2} \\,dt\\,}$의 값을 구하시오. [4점]","answer":"37","sourceHash":"4b00c381f92f0179ac964a669aecc212136427479b973197b5a1953b62547d13","steps":[{"id":"s1","latex":"2\\le t\\le4:\\quad f\\text{의 극값 위치는 }-t/6,\\ t/6"},{"id":"s2","latex":"k\u003c0:\\quad\\text{(가)}\\Rightarrow k\\ge(3-t)/6,\\quad\\text{(나)}\\Rightarrow t-3-6k(k+1)\\le0"},{"id":"s3","latex":"t\u003c3\\text{이면 첫 부등식 불가};\\quad3\\le t\\le4\\text{이면 }-1/6\\le k\u003c0\\text{에서 둘째 부등식 불가}"},{"id":"s4","latex":"0\\le k\\le t/6\u003c1:\\quad\\text{(가)}\\iff f(k)\\ge f(k-1)\\iff6k^2-6k+3-t\\le0"},{"id":"s5","latex":"\\text{(나)}\\iff f(k+1)\\le f(k)\\iff k\\ge t/6-1/2"},{"id":"s6","latex":"g(t)=\\begin{cases}\\frac12-\\frac{\\sqrt{24t-36}}{12}&2\\le t\\le3\\\\\\frac t6-\\frac12&3\\le t\\le4\\end{cases}"},{"id":"s7","latex":"3\\int_2^4\\{6g(t)-3\\}^2dt=3\\int_2^3(6t-9)dt+3\\int_3^4(t-6)^2dt=37"}],"diagram":null,"contentHash":"52c36264dca35f0353809fd196e0a688d0dfc8588b086405672af6884b31490d","questionHtml":"\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(t \\geq 6-3 \\sqrt{2} \\,\\)\u003c/span>인 실수 \u003cspan class=\"heq\">\\(t\\,\\)\u003c/span>에 대하여 실수 전체의 집합에서 정의된 함수 \u003cspan class=\"heq\">\\(f \\left( x \\right) \\,\\)\u003c/span>가\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\(f \\left( x \\right) = {\\begin{cases}\\,3x^{2} +tx\\,(\\,x\\lt 0\\,) \\\\ \\\\ \\,-3x^{2} +tx\\,(\\,x \\geq 0\\,)\\end{cases}}\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">일 때, 다음 조건을 만족시키는 실수 \u003cspan class=\"heq\">\\(k\\,\\)\u003c/span>의 최솟값을 \u003cspan class=\"heq\">\\(g \\left( t \\right) \\,\\)\u003c/span>라 하자.\u003c/p>\u003cp class=\"hp\">\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) 닫힌구간 \u003cspan class=\"heq\">\\(\\left[ k-1,\\,k \\right] \\,\\)\u003c/span>에서 함수 \u003cspan class=\"heq\">\\(f \\left( x \\right) \\,\\)\u003c/span>는\u003cbr>\u003cspan class=\"heq\">\\(x=k\\,\\)\u003c/span>에서 최댓값을 갖는다.\u003c/p>\u003cp class=\"hp\">(나) 닫힌구간 \u003cspan class=\"heq\">\\(\\left[ k,\\,k+1 \\right] \\,\\)\u003c/span>에서 함수 \u003cspan class=\"heq\">\\(f \\left( x \\right) \\,\\)\u003c/span>는\u003cbr>\u003cspan class=\"heq\">\\(x=k+1\\,\\)\u003c/span>에서 최솟값을 갖는다.\u003c/p>\u003c/div>\u003c/p>\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(3 \\int_{2}^{4} {\\left\\{ 6g \\left( t \\right) -3 \\right\\}^{2} \\,dt\\,}\\)\u003c/span>의 값을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"5f9796ce68a32016d6717246d31ed911bd848ad0cab145d0ea36cc464c305c3a"};</script>
<script>window.HandStudyGuide={"itemId":16844,"sourceHash":"4b00c381f92f0179ac964a669aecc212136427479b973197b5a1953b62547d13","contentHash":"52c36264dca35f0353809fd196e0a688d0dfc8588b086405672af6884b31490d","overview":{"goal":"두 구간의 끝점이 각각 최댓값과 최솟값을 주게 하는 가장 작은 \\(k\\)를 찾고 정적분을 계산해요.","firstLook":"적분에서는 \\(2\\le t\\le4\\)만 다루어요. 이 범위에서 두 포물선의 꼭짓점은 \\(-t/6\\)과 \\(t/6\\)이므로, 먼저 \\(k<0\\)이 가능한지 없애고 \\(k\\ge0\\)에서 끝점 값을 비교해요.","conditions":[{"label":"(가)","meaning":"길이 1인 구간의 오른쪽 끝 \\(k\\)가 모든 점보다 크거나 같은 함숫값을 가져야 해요."},{"label":"(나)","meaning":"다음 길이 1인 구간의 오른쪽 끝 \\(k+1\\)이 모든 점보다 작거나 같은 함숫값을 가져야 해요."},{"label":"최솟값의 함수","meaning":"두 조건을 만족하는 \\(k\\) 가운데 가장 작은 값을 \\(g(t)\\)로 정해요."}]},"chapters":[{"id":"c1","label":"음수인 후보를 먼저 제외해요","stepIds":["s1","s2","s3"],"question":"\\(k<0\\)인 후보가 \\(2\\le t\\le4\\)에서 하나도 남지 않는 이유는 무엇일까요?","hint":"(가)에서 얻는 \\(k\\ge(3-t)/6\\)과 (나)의 부등식을 같은 범위에서 함께 봐요.","explanation":"왼쪽 포물선 \\(3x^2+tx\\)의 꼭짓점은 \\(x=-t/6\\), 오른쪽 포물선 \\(-3x^2+tx\\)의 꼭짓점은 \\(x=t/6\\)이에요. \\(k<0\\)이면 (가)의 구간은 음수 쪽에 있고, 오른쪽 끝 \\(k\\)의 값이 왼쪽 끝 \\(k-1\\)의 값보다 작지 않아야 해요. 두 값을 빼면 \\(6k-3+t\\ge0\\), 즉 \\(k\\ge(3-t)/6\\)을 얻어요.\n\n또 (나)에서 \\(k+1\\)의 값이 \\(k\\)의 값보다 작거나 같아야 하므로 \\(t-3-6k(k+1)\\le0\\)이 필요해요. \\(t<3\\)이면 첫 부등식의 오른쪽이 양수라 \\(k<0\\)과 바로 모순이에요. \\(3\\le t\\le4\\)이면 첫 부등식 때문에 \\(-1/6\\le k<0\\)인데, 이 범위에서는 \\(k(k+1)<0\\)이므로 \\(t-3-6k(k+1)>0\\)이에요. 둘째 부등식을 만족할 수 없으므로 음수인 \\(k\\)는 모두 제외돼요.","check":{"prompt":"\\(3\\le t\\le4\\)에서 \\(-6k(k+1)\\)의 부호는 왜 양수인가요?","answer":"\\(-1/6\\le k<0\\)이면 \\(k<0\\), \\(k+1>0\\)이라 \\(k(k+1)<0\\)이고, 여기에 \\(-6\\)을 곱하면 양수가 되기 때문이에요."}},{"id":"c2","label":"두 끝점 비교로 최소 후보를 정해요","stepIds":["s4","s5","s6"],"question":"\\(k\\ge0\\)에서 두 조건은 각각 어떤 하한을 만들고, 왜 \\(t=3\\)에서 식이 바뀔까요?","hint":"(가)의 이차부등식에서 작은 근을 찾고, (나)의 일차부등식과 어느 쪽이 더 큰지 비교해요.","explanation":"조건 (가)를 만족하려면 오른쪽 포물선에서 \\(k\\)가 꼭짓점 \\(t/6\\)의 오른쪽으로 넘어가면 안 되므로 \\(0\\le k\\le t/6<1\\)이에요. 이때 구간 \\([k-1,k]\\)의 양 끝값을 비교하면\n\n\\(f(k)\\ge f(k-1)\\iff6k^2-6k+3-t\\le0\\)\n\n이에요. 따라서 작은 쪽 경계는 \\(k=\\frac12-\\frac{\\sqrt{24t-36}}{12}\\)예요. 조건 (나)의 구간은 음이 아닌 쪽에 있고 아래로 볼록한 것이 아니라 위로 열린 방향과 반대인 포물선의 일부이므로 최솟값은 끝점에서 비교하면 돼요. \\(f(k+1)\\le f(k)\\)을 정리하면 \\(k\\ge t/6-1/2\\)예요.\n\n두 하한 중 더 큰 값이 가장 작은 \\(k\\)예요. \\(2\\le t\\le3\\)에서는 이차부등식의 작은 근이 더 크고, \\(3\\le t\\le4\\)에서는 \\(t/6-1/2\\)가 더 커요. 그래서\n\n\\(g(t)=\\begin{cases}\\frac12-\\frac{\\sqrt{24t-36}}{12}&(2\\le t\\le3),\\\\ \\frac t6-\\frac12&(3\\le t\\le4)\\end{cases}\\)\n\n가 돼요. \\(t=3\\)에서는 두 식이 모두 \\(0\\)이어서 이어져요.","check":{"prompt":"두 조건에서 나온 하한 중 작은 값을 택하면 안 되는 이유는 무엇인가요?","answer":"두 조건을 동시에 만족해야 하므로 각각의 하한보다 모두 커야 해요. 따라서 두 하한 가운데 더 큰 값부터 가능해요."}},{"id":"c3","label":"구간별 식을 제곱해 적분해요","stepIds":["s7"],"question":"근호가 있는 첫 구간의 제곱은 어떻게 간단해지고, 두 적분은 각각 얼마일까요?","hint":"각 구간에서 \\(6g(t)-3\\)을 먼저 따로 계산한 뒤 제곱해요.","explanation":"\\(2\\le t\\le3\\)에서는 \\(6g(t)-3=-\\frac12\\sqrt{24t-36}\\)이므로 제곱하면 \\(6t-9\\)예요. \\(3\\le t\\le4\\)에서는 \\(6g(t)-3=t-6\\)이에요. 따라서\n\n\\(3\\int_2^4\\{6g(t)-3\\}^2dt=3\\int_2^3(6t-9)dt+3\\int_3^4(t-6)^2dt\\)\n\n예요. 첫 항은 \\(3[3t^2-9t]_2^3=18\\), 둘째 항은 \\([(t-6)^3]_3^4=19\\)이므로 합은 \\(18+19=37\\)이에요.","check":{"prompt":"첫 구간에서 \\(6g(t)-3\\)의 부호를 버려도 되는 이유는 무엇인가요?","answer":"적분하는 식이 \\(\\{6g(t)-3\\}^2\\)이므로 제곱할 때 부호가 사라지고 \\(\\frac14(24t-36)=6t-9\\)가 되기 때문이에요."}}],"takeaway":["조각함수의 구간 끝에서 최댓값·최솟값을 요구하면 꼭짓점의 위치와 양 끝값 비교를 함께 써요.","두 조건이 각각 변수의 하한을 주면 두 하한 가운데 더 큰 값이 동시에 만족하는 첫 값이에요.","구간별 함수가 만나는 경계에서는 두 식의 값이 같은지 확인한 뒤 정적분을 나눠 계산해요."]};</script>
