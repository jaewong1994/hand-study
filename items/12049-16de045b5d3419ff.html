  <script>window.HandStudyRecord={"itemId":12049,"sourceLabel":"2024 교육청 고1 수학 6월 30번","adminYear":2024,"grade":1,"month":6,"number":30,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"두 이차함수 $f(x)$, $g(x)$가 다음 조건을 만족시킨다.\n(가) 모든 실수 $x$에 대하여 $f(x) \\leq 0 \\leq g(x)$이다.\n(나) $k-2 \\leq x \\leq k+2$에서 함수 $f(x)$의 최댓값과 $k-2 \\leq x \\leq k+2$에서 함수 $g(x)$의 최솟값이 같게 되도록 하는 실수 $k$의 최솟값은 $0$, 최댓값은 $1$이다.\n(다) 방정식 $f(x)=f(0)$의 모든 실근의 합은 음수이다.\n$f \\left(1 \\right)=\\,-2$, $g \\left(1 \\right)=2$일 때, $f(3)+g(11)$의 값을 구하시오. [4점]","answer":"154","sourceHash":"57efdd3731129563c5847f65e463dc458b950c2b11be0c29e17e5bc17cf408b0","steps":[{"id":"s1","latex":"f\\le0\\le g\\Rightarrow f\\text{ opens down},\\quad g\\text{ opens up}"},{"id":"s2","latex":"\\max_{[k-2,k+2]}f=\\min_{[k-2,k+2]}g\\Rightarrow\\text{both values}=0"},{"id":"s3","latex":"f(x)=-a(x-p)^2,\\quad g(x)=b(x-q)^2,\\quad a,b>0"},{"id":"s4","latex":"|k-p|\\le2,\\ |k-q|\\le2\\Rightarrow k\\in[p-2,p+2]\\cap[q-2,q+2]=[0,1]"},{"id":"s5","latex":"\\{p,q\\}=\\{-1,2\\}"},{"id":"s6","latex":"f(x)=f(0)\\text{ has root sum }2p\u003c0\\Rightarrow(p,q)=(-1,2)"},{"id":"s7","latex":"f(1)=-2,\\ g(1)=2\\Rightarrow a=\\frac12,\\ b=2"},{"id":"s8","latex":"f(3)+g(11)=-8+162=154"}],"diagram":null,"contentHash":"872a9e66d73b87a821cd9e323584f570dbda70a5fbe981f13d2182466606be3b","questionHtml":"\u003cp class=\"hp\">두 이차함수 \u003cspan class=\"heq\">\\(f(x)\\)\u003c/span>, \u003cspan class=\"heq\">\\(g(x)\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) 모든 실수 \u003cspan class=\"heq\">\\(x\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(f(x) \\leq 0 \\leq g(x)\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp\">(나) \u003cspan class=\"heq\">\\(k-2 \\leq x \\leq k+2\\)\u003c/span>에서 함수 \u003cspan class=\"heq\">\\(f(x)\\)\u003c/span>의 최댓값과 \u003cbr>\u003cspan class=\"heq\">\\(k-2 \\leq x \\leq k+2\\)\u003c/span>에서 함수 \u003cspan class=\"heq\">\\(g(x)\\)\u003c/span>의 최솟값이 같게 되도록 하는 실수 \u003cspan class=\"heq\">\\(k\\)\u003c/span>의 최솟값은 \u003cspan class=\"heq\">\\(0\\)\u003c/span>, 최댓값은 \u003cspan class=\"heq\">\\(1\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp\">(다) 방정식 \u003cspan class=\"heq\">\\(f(x)=f(0)\\)\u003c/span>의 모든 실근의 합은 음수이다.\u003c/p>\u003c/div>\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(f \\left(1 \\right)=\\,-2\\)\u003c/span>, \u003cspan class=\"heq\">\\(g \\left(1 \\right)=2\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(f(3)+g(11)\\)\u003c/span>의 값을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"16de045b5d3419ffb3fd7c504a99451d42ba4598d4ee37f04fde45fe5b9427f6"};</script>
