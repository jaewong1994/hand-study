<script>window.HandStudyRecord={"itemId":16393,"sourceLabel":"2019 교육청 고3 수리나형 3월 21번","adminYear":2019,"grade":3,"month":3,"number":21,"track":"수리나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 함수 $y=2\\sqrt{x\\,}$의 그래프 위를 움직이는 점 $P\\,$와 직선 $y= x+2$ 위를 움직이는 점 $\\Q\\,$에 대하여 선분 $\\PQ\\,$의 중점을 $\\M\\,$이라 하자. 점 $\\M\\,$과 점 $\\A(0,\\,8)$ 사이의 거리의 최솟값은?\n[4점]\n① $\\frac{13 \\sqrt{2}}{4}$ ② $\\frac{27 \\sqrt{2}}{8}$ ③ $\\frac{7 \\sqrt{2}}{2}$\n④ $\\frac{29\\sqrt{2}}{8}$ ⑤ $\\frac{15 \\sqrt{2}}{4}$\n단답형","answer":"①","sourceHash":"7bfb1bab12151414954e75faf5d880aed5c2cee159acad080b5a46377cc1a67e","steps":[{"id":"s1","latex":"P=(a,2\\sqrt a),\\quad a\\ge0,\\quad\\ell:y=x+2"},{"id":"s2","latex":"M=\\dfrac{P+Q}{2}\\Rightarrow M\\text{의 자취는 }\\ell\\text{과 평행}"},{"id":"s3","latex":"d(A,\\ell)=\\dfrac{|0-8+2|}{\\sqrt2}=3\\sqrt2"},{"id":"s4","latex":"d(P,\\ell)=\\dfrac{a-2\\sqrt a+2}{\\sqrt2}=\\dfrac{(\\sqrt a-1)^2+1}{\\sqrt2}"},{"id":"s5","latex":"d(P,\\ell)\\text{의 최솟값은 }\\dfrac1{\\sqrt2}\\quad(a=1)"},{"id":"s6","latex":"AM\\text{의 최솟값은 }3\\sqrt2+\\dfrac12\\cdot\\dfrac1{\\sqrt2}=\\dfrac{13\\sqrt2}{4}"}],"diagram":null,"contentHash":"c1d1f44a544e52e45099cb7616aa8f5b56ae724096f3358d5fc5894e5d2b39f1","questionHtml":"<p class=\"hp\">그림과 같이 함수 <span class=\"heq\">\\(y=2\\sqrt{x\\,}\\)<\/span>의 그래프 위를 움직이는 점 <span class=\"heq\">\\(P\\,\\)<\/span>와 직선 <span class=\"heq\">\\(y= x+2\\)<\/span> 위를 움직이는 점 <span class=\"heq\">\\(Q\\,\\)<\/span>에 대하여 선분 <span class=\"heq\">\\(PQ\\,\\)<\/span>의 중점을 <span class=\"heq\">\\(M\\,\\)<\/span>이라 하자. 점 <span class=\"heq\">\\(M\\,\\)<\/span>과 점 <span class=\"heq\">\\(A(0,\\,8)\\)<\/span> 사이의 거리의 최솟값은?<\/p><p class=\"hp\"><span class=\"hscore\">[4점]<\/span><\/p><p class=\"hp\"><img class=\"hfig\" src=\"../assets/figures/fe2a229a89b84b0984cc6728.png\" style=\"width:276px;max-width:100%\"><\/p><p class=\"hp htall\">① <span class=\"heq\">\\(\\dfrac{13 \\sqrt{2}}{4}\\)<\/span>&emsp;② <span class=\"heq\">\\(\\dfrac{27 \\sqrt{2}}{8}\\)<\/span>&emsp;③ <span class=\"heq\">\\(\\dfrac{7 \\sqrt{2}}{2}\\)<\/span><\/p><p class=\"hp htall\">④ <span class=\"heq\">\\(\\dfrac{29\\sqrt{2}}{8}\\)<\/span>&emsp;⑤ <span class=\"heq\">\\(\\dfrac{15 \\sqrt{2}}{4}\\)<\/span><\/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"a213ba406667e65ab900ce94027554a7b9b1f88d95cdecc7a327558c4a6c782e"};</script>
<script>window.HandStudyGuide={"itemId":16393,"sourceHash":"7bfb1bab12151414954e75faf5d880aed5c2cee159acad080b5a46377cc1a67e","contentHash":"c1d1f44a544e52e45099cb7616aa8f5b56ae724096f3358d5fc5894e5d2b39f1","overview":{"goal":"중점 \\(M\\)의 자취를 고정한 \\(P\\)마다 직선으로 보고 점 \\(A\\)까지의 거리를 최소로 만들어요.","firstLook":"\\(P\\)를 정하면 \\(Q\\)가 직선 위를 움직일 때 중점 \\(M=(P+Q)/2\\)도 그 직선과 평행한 직선 위를 움직여요.","conditions":[{"label":"중점 자취","meaning":"\\(M\\)의 직선은 \\(y=x+2\\)를 절반 축소하고 \\(P/2\\)만큼 옮긴 모양이에요."},{"label":"거리","meaning":"A에서 이 직선까지의 거리는 기준 거리와 P의 거리 차로 표현돼요."}]},"chapters":[{"id":"c1","label":"두 평행선 사이의 거리를 비교해요","stepIds":["s1","s2","s3","s4"],"question":"고정한 P에서 M이 움직이는 직선은 왜 기울기 1일까요?","hint":"Q의 좌표 변화가 중점에서는 절반으로 줄지만 방향은 같아요.","explanation":"\\(P=(a,2\\sqrt a)\\), \\(a\\ge0\\)로 두어요. \\(Q\\)가 \\(y=x+2\\) 위를 움직이면 \\(M=(P+Q)/2\\)의 자취는 기울기 1인 직선이에요. 점 \\(A=(0,8)\\)에서 기준 직선 \\(y=x+2\\)까지 거리는 \\(3\\sqrt2\\)예요. 한편 \\(P\\)에서 기준 직선까지 거리는 \\(|a-2\\sqrt a+2|/\\sqrt2=((\\sqrt a-1)^2+1)/\\sqrt2\\)이고 항상 양수예요. 그림의 위치에서 중점 자취는 기준 직선과 P 사이에 있으므로 A까지 거리는 \\(3\\sqrt2\\)에 이 거리의 절반을 더한 값이에요.","check":{"prompt":"절댓값을 없앨 수 있는 이유는 무엇인가요?","answer":"\\(a-2\\sqrt a+2=(\\sqrt a-1)^2+1>0\\)이기 때문이에요."}},{"id":"c2","label":"거리의 최솟값을 구해요","stepIds":["s5","s6"],"question":"\\((\\sqrt a-1)^2+1\\)은 언제 가장 작을까요?","hint":"제곱은 0보다 작을 수 없어요.","explanation":"\\((\\sqrt a-1)^2\\ge0\\)이므로 \\(P\\)와 직선 사이의 거리는 \\(a=1\\)에서 \\(1/\\sqrt2\\)로 가장 작아요. 이때 실제 \\(P=(1,2)\\)는 곡선 위에 있어요. 따라서 \\(AM\\)의 최솟값은 \\(3\\sqrt2+\\frac12\\cdot1/\\sqrt2=13\\sqrt2/4\\)이고 답은 ①이에요.","check":{"prompt":"\\(a=1\\)은 정의역 경계 밖의 형식적 후보가 아닌가요?","answer":"\\(a\\ge0\\) 안에 있고 \\(P=(1,2)\\)가 실제 그래프 위에 있으므로 최솟값이 실현돼요."}}],"takeaway":["중점의 자취는 한 끝점이 움직이는 직선과 평행하고 이동 거리는 절반이 돼요.","거리의 최솟값은 제곱식의 하한뿐 아니라 그 값을 만드는 점이 실제 존재하는지도 확인해요."]};</script>
