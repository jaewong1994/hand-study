<script>window.HandStudyRecord={"adminYear":2021,"answer":"191","contentHash":"eddd99f8118d32a197af6734ccb6f3314c50419e1e449053bcf1ff560db22523","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24807,"month":11,"number":30,"points":4,"preview":false,"questionHtml":"\u003cp>흰 공과 검은 공이 각각 \u003cspan class=\"heq\">\\(10\\)\u003c/span>개 이상 들어 있는 바구니와 비어 있는 주머니가 있다. 한 개의 주사위를 사용하여 다음 시행을 한다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp>주사위를 한 번 던져 나온 눈의 수가 \u003cspan class=\"heq\">\\(5\\)\u003c/span> 이상이면바구니에 있는 흰 공 \u003cspan class=\"heq\">\\(2\\)\u003c/span>개를 주머니에 넣고, 나온 눈의 수가 \u003cspan class=\"heq\">\\(4\\)\u003c/span> 이하이면 바구니에 있는 검은 공 \u003cspan class=\"heq\">\\(1\\)\u003c/span>개를 주머니에 넣는다.\u003c/p>\u003c/div>\u003cp>위의 시행을 \u003cspan class=\"heq\">\\(5\\)\u003c/span>번 반복할 때, \u003cspan class=\"heq\">\\(n\\, \\left( 1 \\leq n \\leq 5 \\right)\\)\u003c/span>번째 시행 후 주머니에 들어 있는 흰 공과 검은 공의 개수를 각각 \u003cspan class=\"heq\">\\(a _{n} ,\\,b _{n}\\)\u003c/span>이라 하자. \u003cspan class=\"heq\">\\(a _{5} +b _{5} \\geq 7\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(a _{k} =b _{k}\\)\u003c/span>인 자연수 \u003cspan class=\"heq\">\\(k\\, \\left( 1 \\leq k \\leq 5 \\right)\\)\u003c/span>가 존재할 확률은 \u003cspan class=\"heq\">\\(\\frac{q}{p}\\)\u003c/span>이다. \u003cspan class=\"heq\">\\(p+q\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(p\\)\u003c/span>와 \u003cspan class=\"heq\">\\(q\\)\u003c/span>는 서로소인 자연수이다.) [4점]\u003c/p>","questionText":"흰 공과 검은 공이 각각 $10$개 이상 들어 있는 바구니와 비어 있는 주머니가 있다. 한 개의 주사위를 사용하여 다음 시행을 한다.\n주사위를 한 번 던져 나온 눈의 수가 $5$ 이상이면바구니에 있는 흰 공 $2$개를 주머니에 넣고, 나온 눈의 수가 $4$ 이하이면 바구니에 있는 검은 공 $1$개를 주머니에 넣는다.\n위의 시행을 $5$번 반복할 때, $n\\, \\left( 1 \\leq n \\leq 5 \\right)$번째 시행 후 주머니에 들어 있는 흰 공과 검은 공의 개수를 각각 $a _{n} ,\\,b _{n}$이라 하자. $a _{5} +b _{5} \\geq 7$일 때, $a _{k} =b _{k}$인 자연수 $k\\, \\left( 1 \\leq k \\leq 5 \\right)$가 존재할 확률은 $\\frac{q}{p}$이다. $p+q$의 값을 구하시오. (단, $q$와 $q$는 서로소인 자연수이다.) [4점]","sourceHash":"bf8b85c2b383edb3f2ec5ab1ba37497f77481591f03bf2f0e7de295edcaa861d","sourceKind":"csat","sourceLabel":"2021년 시행 수능 · 2022학년도 · 확률과 통계 · 30번","steps":[{"id":"s1","latex":"\\text{흰 공 두 개가 들어갈 확률 }\\frac13,\\quad\\text{검은 공 한 개가 들어갈 확률 }\\frac23"},{"id":"s2","latex":"W=\\text{다섯 번 중 흰 공을 넣은 횟수},\\quad\\text{전체 공의 수}=5+W"},{"id":"s3","latex":"A:\\ W\\ge2,\\quad\\mathrm P(A)=\\frac{{}_5C_2\\,2^3+{}_5C_3\\,2^2+{}_5C_4\\,2+1}{3^5}=\\frac{131}{243}"},{"id":"s4","latex":"k\\text{번째 직후 흰 공과 검은 공의 수가 같으면 }2w=k-w\\quad\\Rightarrow\\quad k=3w"},{"id":"s5","latex":"1\\le k\\le5\\text{이므로 }k=3,\\ w=1\\quad\\Rightarrow\\quad B:\\text{처음 세 번 중 흰 공 시행 한 번}"},{"id":"s6","latex":"\\mathrm P(A\\cap B)={}_3C_1\\frac13\\left(\\frac23\\right)^2\\left\\{1-\\left(\\frac23\\right)^2\\right\\}=\\frac{60}{243}"},{"id":"s7","latex":"\\mathrm P(B\\mid A)=\\frac{60}{131}\\quad\\Rightarrow\\quad p+q=191"}],"track":"확률과 통계"};</script>
<script>window.HandStudyGuide={"itemId":24807,"sourceHash":"bf8b85c2b383edb3f2ec5ab1ba37497f77481591f03bf2f0e7de295edcaa861d","contentHash":"eddd99f8118d32a197af6734ccb6f3314c50419e1e449053bcf1ff560db22523","overview":{"goal":"마지막 공의 수 조건을 분모 사건으로, 중간에 두 색 공이 같아지는 조건을 분자 사건으로 세어요.","firstLook":"흰 공을 넣은 시행 횟수를 \\(W\\)라 두면 흰 공은 \\(2W\\)개, 검은 공은 \\(5-W\\)개예요.","conditions":[{"label":"한 번의 시행","meaning":"흰 공 두 개를 넣을 확률은 \\(1/3\\), 검은 공 한 개를 넣을 확률은 \\(2/3\\)이에요."},{"label":"조건 사건","meaning":"다섯 번 뒤 전체 공이 \\(7\\)개 이상이라는 조건 아래의 확률이므로 이 사건의 확률로 나눠요."}]},"chapters":[{"id":"c1","label":"조건 사건의 범위를 바꿔 써요","stepIds":["s1","s2","s3"],"question":"다섯 번 뒤 전체 공의 수가 \\(7\\)개 이상이라는 것은 \\(W\\)에 어떤 조건일까요?","hint":"흰 시행 하나는 기본 한 개보다 공을 하나 더 늘려요.","explanation":"흰 시행의 확률은 \\(2/6=1/3\\), 검은 시행의 확률은 \\(4/6=2/3\\)이에요. 흰 시행이 \\(W\\)번이면 흰 공은 \\(2W\\)개, 검은 공은 \\(5-W\\)개라 전체는 \\(5+W\\)개예요. 따라서 조건 사건 \\(A\\)는 \\(W\\ge2\\)예요. 각 시행 결과를 분모 \\(3^5\\)의 가중 경우로 세면\n\n\\(\\mathrm P(A)=\\dfrac{{}_5\\mathrm C_2\\,2^3+{}_5\\mathrm C_3\\,2^2+{}_5\\mathrm C_4\\,2+1}{3^5}=\\dfrac{131}{243}\\)\n\n이에요.","check":{"prompt":"전체 공의 수가 \\(5+W\\)가 되는 이유는 무엇인가요?","answer":"다섯 시행마다 적어도 한 개씩 넣고, 흰 시행에서는 한 개를 더 넣기 때문이에요."}},{"id":"c2","label":"같아질 수 있는 시점을 하나로 좁혀요","stepIds":["s4","s5"],"question":"\\(k\\)번째 뒤 두 색 공의 수가 같다면 왜 \\(k\\)는 \\(3\\)의 배수여야 할까요?","hint":"첫 \\(k\\)번 중 흰 시행 횟수를 \\(w\\)라 두어요.","explanation":"첫 \\(k\\)번 중 흰 시행이 \\(w\\)번이면 흰 공은 \\(2w\\)개, 검은 공은 \\(k-w\\)개예요. 두 수가 같으면 \\(2w=k-w\\), 즉 \\(k=3w\\)예요. \\(1\\le k\\le5\\)에서 가능한 양의 배수는 \\(k=3\\)뿐이고, 이때 \\(w=1\\)이에요. 따라서 사건 \\(B\\)는 처음 세 시행 중 흰 시행이 정확히 한 번 일어나는 사건이에요.","check":{"prompt":"\\(k=0\\)이나 \\(k=6\\)을 세지 않는 이유는 무엇인가요?","answer":"문제에서 자연수 \\(k\\)의 범위를 \\(1\\le k\\le5\\)로 정했기 때문이에요."}},{"id":"c3","label":"처음 셋과 마지막 둘을 나눠 세어요","stepIds":["s6","s7"],"question":"\\(B\\)가 일어났을 때 \\(A\\)까지 만족하려면 마지막 두 시행에는 무엇이 더 필요할까요?","hint":"처음 세 번에서 흰 시행은 이미 한 번이에요.","explanation":"\\(B\\)의 확률은 \\({}_3\\mathrm C_1(1/3)(2/3)^2\\)예요. 그런데 \\(A\\)는 다섯 번 전체에서 흰 시행이 두 번 이상이어야 하므로 마지막 두 번이 모두 검은 시행인 경우만 빼야 해요. 따라서\n\n\\(\\mathrm P(A\\cap B)={}_3\\mathrm C_1\\dfrac13\\left(\\dfrac23\\right)^2\\left\\{1-\\left(\\dfrac23\\right)^2\\right\\}=\\dfrac{60}{243}\\)\n\n이에요. 조건부확률은 \\(\\mathrm P(B\\mid A)=\\dfrac{60/243}{131/243}=60/131\\)이고, \\(p+q=131+60=191\\)이에요.","check":{"prompt":"마지막 두 번에서 빼는 한 가지 경우는 무엇인가요?","answer":"두 번 모두 검은 시행이어서 전체 흰 시행 횟수가 여전히 한 번뿐인 경우예요."}}],"takeaway":["조건부확률에서는 분모 사건과 분자에서 함께 만족할 사건을 먼저 이름 붙여요.","중간 시점의 개수는 그 시점까지의 시행 횟수를 새 문자로 두어 식으로 바꿔요.","앞부분의 횟수가 정해지면 뒷부분에서 조건을 채우는 경우와 못 채우는 경우를 따로 세어요."]};</script>
