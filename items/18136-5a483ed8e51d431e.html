<script>window.HandStudyRecord={"itemId":18136,"sourceLabel":"2025 교육청 고3 수학기하 10월 30번","adminYear":2025,"grade":3,"month":10,"number":30,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"좌표평면에 한 변의 길이가 $8\\,$인 정사각형 ${{ABCD}}\\,$와\n ${ \\vec{{AE}}}={ \\vec{{AD}}}-\\frac{1}{2}{ \\vec{{AB}}}\\,$\n를 만족시키는 점 ${{E}}\\,$가 있다. 선분 ${{BC}}\\,$를 지름으로 하는 원 위를 움직이는 점 ${{P}}\\,$에 대하여 점 ${{Q}}\\,$가 다음 조건을 만족시킨다.\n${ \\vec{{AE}}} bullet { \\vec{{AP}}} \\geq 0\\,$이면 ${ \\vec{{BQ}}}+{ \\vec{{CQ}}}=4{ \\vec{{PQ}}}\\,$이고,${ \\vec{{AE}}} bullet { \\vec{{AP}}} \u003c 0\\,$이면 ${ \\vec{{BQ}}}+{ \\vec{{CQ}}}=6{ \\vec{{PQ}}}\\,$이다.\n${ \\vec{{AE}}} bullet { \\vec{{AQ}}}\\,$의 최댓값과 최솟값을 각각 $M\\,$, $m\\,$이라 할 때, $\\left(M\\,+m \\right)^{2}\\,$의 값을 구하시오. [4점]","answer":"320","sourceHash":"90017c16086412687c8b11223c273f9a93c4425ca7791baf9501eaa380a026ef","steps":[{"id":"s1","latex":"A=(0,0),\\ B=(8,0),\\ C=(8,8),\\quad\\overrightarrow{AE}=(-4,8)"},{"id":"s2","latex":"N=(8,4),\\quad|NP|=4,\\quad s=\\overrightarrow{AE}\\cdot\\overrightarrow{NP}"},{"id":"s3","latex":"-16\\sqrt5\\le s\\le16\\sqrt5"},{"id":"s4","latex":"s\\ge0:\\quad\\overrightarrow{NQ}=2\\overrightarrow{NP}\\Rightarrow\\overrightarrow{AE}\\cdot\\overrightarrow{AQ}=2s"},{"id":"s5","latex":"s\u003c0:\\quad\\overrightarrow{NQ}=\\frac32\\overrightarrow{NP}\\Rightarrow\\overrightarrow{AE}\\cdot\\overrightarrow{AQ}=\\frac32s"},{"id":"s6","latex":"M=32\\sqrt5,\\quad m=-24\\sqrt5"},{"id":"s7","latex":"(M+m)^2=(8\\sqrt5)^2=320"}],"diagram":null,"contentHash":"e7b0dc22437971973e57571baa85139c3718add693b7f20b527f5e735d6742f4","questionHtml":"\u003cp class=\"hp\">좌표평면에 한 변의 길이가 \u003cspan class=\"heq\">\\(8\\,\\)\u003c/span>인 정사각형 \u003cspan class=\"heq\">\\({{ABCD}}\\,\\)\u003c/span>와\u003c/p>\u003cp class=\"hp htall\">&emsp;&emsp;\u003cspan class=\"heq\">\\({ \\vec{{AE}}}={ \\vec{{AD}}}-\\dfrac{1}{2}{ \\vec{{AB}}}\\,\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">를 만족시키는 점 \u003cspan class=\"heq\">\\({{E}}\\,\\)\u003c/span>가 있다. 선분 \u003cspan class=\"heq\">\\({{BC}}\\,\\)\u003c/span>를 지름으로 하는 원 위를 움직이는 점 \u003cspan class=\"heq\">\\({{P}}\\,\\)\u003c/span>에 대하여 점 \u003cspan class=\"heq\">\\({{Q}}\\,\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">\u003cspan class=\"heq\">\\({ \\vec{{AE}}} \\cdot { \\vec{{AP}}} \\geq 0\\,\\)\u003c/span>이면 \u003cspan class=\"heq\">\\({ \\vec{{BQ}}}+{ \\vec{{CQ}}}=4{ \\vec{{PQ}}}\\,\\)\u003c/span>이고,\u003c/p>\u003cp class=\"hp\">\u003cspan class=\"heq\">\\({ \\vec{{AE}}} \\cdot { \\vec{{AP}}} \\lt  0\\,\\)\u003c/span>이면 \u003cspan class=\"heq\">\\({ \\vec{{BQ}}}+{ \\vec{{CQ}}}=6{ \\vec{{PQ}}}\\,\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp class=\"hp\">\u003cspan class=\"heq\">\\({ \\vec{{AE}}} \\cdot { \\vec{{AQ}}}\\,\\)\u003c/span>의 최댓값과 최솟값을 각각 \u003cspan class=\"heq\">\\(M\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(m\\,\\)\u003c/span>이라 할 때, \u003cbr>\u003cspan class=\"heq\">\\(\\left(M\\,+m \\right)^{2}\\,\\)\u003c/span>의 값을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/b9bb70d5dab51e47d21e9c17.png\" style=\"width:370px;max-width:100%\">\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"5a483ed8e51d431eb5f1edeff8f89928360c6f4af692cbc66f589d3e90b70c61"};</script>
<script>window.HandStudyGuide={"itemId":18136,"sourceHash":"90017c16086412687c8b11223c273f9a93c4425ca7791baf9501eaa380a026ef","contentHash":"e7b0dc22437971973e57571baa85139c3718add693b7f20b527f5e735d6742f4","overview":{"goal":"원의 중심 N을 기준으로 P와 Q의 벡터 관계를 단순화하고, AE 방향 성분의 범위에서 최댓값과 최솟값을 구합니다.","firstLook":"조건식의 BQ와 CQ를 더하면 원의 중심 N이 자연스럽게 나타납니다. 그러면 Q는 NP를 일정한 배율로 늘린 점이 됩니다.","conditions":[{"label":"원의 지름","meaning":"P는 중심 N, 반지름 4인 원 위를 움직입니다."},{"label":"두 갈래 정의","meaning":"AE·AP의 부호에 따라 Q의 확대 비율이 2 또는 3/2가 됩니다."}]},"chapters":[{"id":"c1","label":"원과 방향 성분의 범위를 정합니다","stepIds":["s1","s2","s3"],"question":"AE 방향으로 본 NP의 값은 어디까지 움직이나요?","hint":"원의 중심 N과 반지름을 쓰고 내적의 최댓값을 이용하세요.","explanation":"\\(A=(0,0)\\), \\(B=(8,0)\\), \\(C=(8,8)\\)로 두면 \\(AE=(-4,8)\\)입니다. \\(BC\\)를 지름으로 하는 원의 중심은 \\(N=(8,4)\\), 반지름은 4입니다. \\(s=AE\\cdot NP\\)라 두면 \\(|AE|=4\\sqrt5\\), \\(|NP|=4\\)이므로 \\(-16\\sqrt5\\le s\\le16\\sqrt5\\)이고 양끝은 NP가 AE와 같은 방향 또는 반대 방향일 때 실제로 얻어집니다.","check":{"prompt":"s의 양끝이 단순한 범위가 아니라 실제로 가능한 값인 이유는 무엇인가요?","answer":"P가 원 전체를 움직이므로 NP를 AE와 같은 방향이나 정확히 반대 방향으로 잡을 수 있기 때문입니다."}},{"id":"c2","label":"Q의 위치를 두 경우로 바꿉니다","stepIds":["s4","s5"],"question":"주어진 벡터식에서 NQ는 NP의 몇 배가 되나요?","hint":"두 벡터 \\(BQ\\), \\(CQ\\)의 합을 중점 N을 기준으로 바꾸세요.","explanation":"중점 N에 대해 \\(BQ+CQ=2NQ\\)입니다. 첫 경우에는 \\(2NQ=4PQ=4(NQ-NP)\\)이므로 \\(NQ=2NP\\)입니다. 둘째 경우에는 \\(2NQ=6(NQ-NP)\\)이므로 \\(NQ=3NP/2\\)입니다. 또한 \\(AE\\cdot AN=0\\)이어서 \\(AE\\cdot AQ=AE\\cdot NQ\\)입니다. 원래 분기 부호도 \\(AE\\cdot AP=s\\)와 같습니다. 따라서 \\(s\\ge0\\)에서는 값이 \\(2s\\), \\(s<0\\)에서는 \\(3s/2\\)입니다.","check":{"prompt":"분기 조건을 AP에서 NP로 바꾸어도 되는 이유는 무엇인가요?","answer":"\\(AP=AN+NP\\)이고 \\(AE\\cdot AN=0\\)이므로 \\(AE\\cdot AP=AE\\cdot NP=s\\)이기 때문입니다."}},{"id":"c3","label":"양끝값을 넣어 마무리합니다","stepIds":["s6","s7"],"question":"최댓값과 최솟값은 각각 어느 분기에서 나오나요?","hint":"양수 쪽은 2배, 음수 쪽은 3/2배입니다.","explanation":"양수 범위에서 최댓값은 \\(M=2\\cdot16\\sqrt5=32\\sqrt5\\)입니다. 음수 범위에서 최솟값은 \\(m=(3/2)(-16\\sqrt5)=-24\\sqrt5\\)입니다. 따라서 \\((M+m)^2=(8\\sqrt5)^2=320\\)입니다.","check":{"prompt":"음수 쪽에서 2배를 적용하면 안 되는 이유는 무엇인가요?","answer":"문제의 정의가 내적이 음수일 때 계수 6인 둘째 벡터식을 사용하도록 나누어져 있기 때문입니다."}}],"takeaway":["두 점에 대한 벡터의 합은 두 점의 중점을 기준으로 바꾸면 간단해집니다.","조각 정의의 최댓값과 최솟값은 각 분기의 배율과 부호 구간을 따로 적용합니다."]};</script>
