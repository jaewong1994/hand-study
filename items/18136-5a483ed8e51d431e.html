  <script>window.HandStudyRecord={"itemId":18136,"sourceLabel":"2025 교육청 고3 수학기하 10월 30번","adminYear":2025,"grade":3,"month":10,"number":30,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"좌표평면에 한 변의 길이가 $8\\,$인 정사각형 ${{ABCD}}\\,$와\n ${ \\vec{{AE}}}={ \\vec{{AD}}}-\\frac{1}{2}{ \\vec{{AB}}}\\,$\n를 만족시키는 점 ${{E}}\\,$가 있다. 선분 ${{BC}}\\,$를 지름으로 하는 원 위를 움직이는 점 ${{P}}\\,$에 대하여 점 ${{Q}}\\,$가 다음 조건을 만족시킨다.\n${ \\vec{{AE}}} bullet { \\vec{{AP}}} \\geq 0\\,$이면 ${ \\vec{{BQ}}}+{ \\vec{{CQ}}}=4{ \\vec{{PQ}}}\\,$이고,${ \\vec{{AE}}} bullet { \\vec{{AP}}} \u003c 0\\,$이면 ${ \\vec{{BQ}}}+{ \\vec{{CQ}}}=6{ \\vec{{PQ}}}\\,$이다.\n${ \\vec{{AE}}} bullet { \\vec{{AQ}}}\\,$의 최댓값과 최솟값을 각각 $M\\,$, $m\\,$이라 할 때, $\\left(M\\,+m \\right)^{2}\\,$의 값을 구하시오. [4점]","answer":"320","sourceHash":"90017c16086412687c8b11223c273f9a93c4425ca7791baf9501eaa380a026ef","steps":[{"id":"s1","latex":"A=(0,0),\\ B=(8,0),\\ C=(8,8),\\quad\\overrightarrow{AE}=(-4,8)"},{"id":"s2","latex":"N=(8,4),\\quad|NP|=4,\\quad s=\\overrightarrow{AE}\\cdot\\overrightarrow{NP}"},{"id":"s3","latex":"-16\\sqrt5\\le s\\le16\\sqrt5"},{"id":"s4","latex":"s\\ge0:\\quad\\overrightarrow{NQ}=2\\overrightarrow{NP}\\Rightarrow\\overrightarrow{AE}\\cdot\\overrightarrow{AQ}=2s"},{"id":"s5","latex":"s\u003c0:\\quad\\overrightarrow{NQ}=\\frac32\\overrightarrow{NP}\\Rightarrow\\overrightarrow{AE}\\cdot\\overrightarrow{AQ}=\\frac32s"},{"id":"s6","latex":"M=32\\sqrt5,\\quad m=-24\\sqrt5"},{"id":"s7","latex":"(M+m)^2=(8\\sqrt5)^2=320"}],"diagram":null,"contentHash":"e7b0dc22437971973e57571baa85139c3718add693b7f20b527f5e735d6742f4","questionHtml":"\u003cp class=\"hp\">좌표평면에 한 변의 길이가 \u003cspan class=\"heq\">\\(8\\,\\)\u003c/span>인 정사각형 \u003cspan class=\"heq\">\\({{ABCD}}\\,\\)\u003c/span>와\u003c/p>\u003cp class=\"hp htall\">&emsp;&emsp;\u003cspan class=\"heq\">\\({ \\vec{{AE}}}={ \\vec{{AD}}}-\\dfrac{1}{2}{ \\vec{{AB}}}\\,\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">를 만족시키는 점 \u003cspan class=\"heq\">\\({{E}}\\,\\)\u003c/
