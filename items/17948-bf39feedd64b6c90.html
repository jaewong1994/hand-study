<script>window.HandStudyRecord={"itemId":17948,"sourceLabel":"2024 교육청 고3 수학미적분 3월 22번","adminYear":2024,"grade":3,"month":3,"number":22,"track":"미적분","points":4,"scoreStatus":"confirmed_4_direct","questionText":"함수 $f \\left( x \\right) = \\left| x ^{3} -3x+8 \\right|\\,$과 실수 $t\\,$에 대하여 닫힌구간 $\\left[ t,\\, t+2 \\right]\\,$에서의 $f \\left(x \\right)\\,$의 최댓값을 $g \\left(t \\right)\\,$라 하자. 서로 다른 두 실수 $\\alpha\\,$, $\\beta\\,$에 대하여 함수 $g \\left(t \\right)\\,$는 $t= \\alpha \\,$와 $t= \\beta \\,$에서만 미분가능하지 않다. $\\alpha \\beta =m+n \\sqrt{6}\\,$일 때, $m+n\\,$의 값을 구하시오. (단, $m\\,$, $n\\,$은 정수이다.) [4점]\n 사각형입니다. 2024년 3월 고3 모의고사 문제지제 2 교시 수학 영역(미적분) \n5 지선다형","answer":"2","sourceHash":"79dde161a6c012443a1df01835d23836a8e7ef8609bd419311461ab81c9304f9","steps":[{"id":"s1","latex":"p=x^3-3x+8,\\ p(-1)=10,\\ p(1)=6"},{"id":"s2","latex":"f(-3)=f(-1)=10\\Rightarrow\\alpha=-3"},{"id":"s3","latex":"p(t+2)-p(t)=6t^2+12t+2"},{"id":"s4","latex":"\\beta=-1+\\sqrt6/3"},{"id":"s5","latex":"\\alpha\\beta=3-\\sqrt6\\Rightarrow\\boxed2"}],"diagram":null,"contentHash":"1d1c29743464da947217202188a2bfa6d958eca18cd7354d1d91649b263bf3be","questionHtml":"\u003cp class=\"hp\">함수 \u003cspan class=\"heq\">\\(f \\left( x \\right) = \\left| x^{3} -3x+8 \\right|\\,\\)\u003c/span>과 실수 \u003cspan class=\"heq\">\\(t\\,\\)\u003c/span>에 대하여 닫힌구간 \u003cbr>\u003cspan class=\"heq\">\\(\\left[ t,\\, t+2 \\right]\\,\\)\u003c/span>에서의 \u003cspan class=\"heq\">\\(f \\left(x \\right)\\,\\)\u003c/span>의 최댓값을 \u003cspan class=\"heq\">\\(g \\left(t \\right)\\,\\)\u003c/span>라 하자. 서로 다른 두 실수 \u003cspan class=\"heq\">\\(\\alpha\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(\\beta\\,\\)\u003c/span>에 대하여 함수 \u003cspan class=\"heq\">\\(g \\left(t \\right)\\,\\)\u003c/span>는 \u003cspan class=\"heq\">\\(t= \\alpha \\,\\)\u003c/span>와 \u003cspan class=\"heq\">\\(t= \\beta \\,\\)\u003c/span>에서만 미분가능하지 않다. \u003cspan class=\"heq\">\\(\\alpha \\beta =m+n \\sqrt{6}\\,\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(m+n\\,\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(m\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(n\\,\\)\u003c/span>은 정수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"bf39feedd64b6c90b0b8d443d9168d549d7e1bf1f94bef8a792e747be2cbcc66"};</script>
<script>window.HandStudyGuide={"itemId":17948,"sourceHash":"79dde161a6c012443a1df01835d23836a8e7ef8609bd419311461ab81c9304f9","contentHash":"1d1c29743464da947217202188a2bfa6d958eca18cd7354d1d91649b263bf3be","overview":{"goal":"절댓값 삼차함수의 증가·감소와 길이 2인 구간에서 최댓값을 만드는 점의 교체를 찾아 g의 두 비미분점을 구해요.","firstLook":"구간이 이동할 때 최댓값을 담당하는 점이 한 끝점이나 고정된 극댓점에서 다른 점으로 바뀌는 순간 g의 식이 꺾일 수 있어요.","conditions":[{"label":"원래 삼차식","meaning":"\\(p(x)=x^3-3x+8\\)이라 두면 \\(f(x)=|p(x)|\\)예요."},{"label":"움직이는 구간","meaning":"길이 \\(2\\)인 닫힌구간 \\([t,t+2]\\)에서 가장 큰 \\(f\\)값을 택해요."},{"label":"두 비미분점","meaning":"최댓값을 만드는 후보가 같은 높이에서 실제로 교체되는 두 시점을 찾아요."}]},"chapters":[{"id":"c1","label":"삼차식의 극값과 왼쪽 교체점을 찾아요","stepIds":["s1","s2"],"question":"구간 \\([-3,-1]\\)에서 왜 양 끝의 \\(f\\)값이 모두 \\(10\\)인가요?","hint":"\\(p(-1)=10\\), \\(p(-3)=-10\\)을 계산하고 \\(p'(x)=3(x^2-1)\\)의 부호를 봐요.","explanation":"\\(p'(x)=3(x^2-1)\\)이므로 \\(p\\)는 \\(x=-1\\)에서 극댓값 \\(10\\), \\(x=1\\)에서 극솟값 \\(6\\)을 가져요. 또 \\(p(-3)=-10\\)이어서 \\(f(-3)=|-10|=10=f(-1)\\)이에요.\n\n\\(t=-3\\)일 때 구간의 왼쪽 끝과 고정된 극댓점 \\(-1\\)이 같은 최대값을 만들어요. \\(t\\)가 이 점을 지나면 구간에서 최댓값을 담당하는 후보가 바뀌며 좌우 변화율이 달라지므로 첫 비미분점은 \\(\\alpha=-3\\)이에요.","check":{"prompt":"\\(p(1)\\)은 얼마이고 절댓값을 취해도 같은가요?","answer":"\\(p(1)=6>0\\)이므로 \\(f(1)=6\\)이에요."}},{"id":"c2","label":"오른쪽에서는 두 끝점의 값을 같게 놓아요","stepIds":["s3"],"question":"구간이 극댓점 \\(-1\\)을 지난 뒤 끝점끼리 교체되는 조건은 무엇인가요?","hint":"두 끝에서 \\(p\\)가 양수인 구간에서는 \\(p(t+2)=p(t)\\)를 풀어요.","explanation":"오른쪽으로 이동해 구간이 \\(-1\\)을 포함하지 않으면 내부의 \\(x=1\\)은 극솟점이므로 최대값 후보는 두 끝점이에요. 두 끝값의 차는\n\\[\np(t+2)-p(t)=6t^2+12t+2.\n\\]\n따라서 두 끝점이 같은 높이가 되는 때가 교체 후보예요.","check":{"prompt":"내부의 \\(x=1\\)이 최대 후보가 아닌 이유는 무엇인가요?","answer":"\\(p\\)가 그 점에서 극솟값을 가지며 이 구간에서는 \\(p>0\\)이라 \\(f=p\\)이기 때문이에요."}},{"id":"c3","label":"두 방정식의 해 중 실제 교체점만 남겨요","stepIds":["s4"],"question":"방정식의 두 해 중 왜 \\(-1+\\sqrt6/3\\)만 두 번째 비미분점일까요?","hint":"작은 해의 구간은 여전히 \\(x=-1\\)을 포함해 그 점의 값 \\(10\\)이 더 커요.","explanation":"\\(6t^2+12t+2=0\\)의 해는 \\(t=-1\\pm\\sqrt6/3\\)이에요. 작은 해 \\(t=-1-\\sqrt6/3\\)에서 구간 \\([t,t+2]\\)은 \\(x=-1\\)을 포함하고, 양 끝의 같은 값보다 \\(f(-1)=10\\)이 커서 끝점 교체가 최댓값에 영향을 주지 않아요.\n\n큰 해 \\(t=-1+\\sqrt6/3\\)에서는 구간이 \\(-1\\) 오른쪽에 있고 내부 극솟점만 포함하므로 두 끝점이 실제 최대 후보로 교체돼요. 따라서 \\(\\beta=-1+\\sqrt6/3\\)이에요.","check":{"prompt":"작은 해를 제외하는 근거는 단순히 값이 작아서인가요?","answer":"아니요. 그 구간 안의 고정된 극댓점 -1이 양 끝보다 더 큰 값을 만들어 끝점 교체가 g에 나타나지 않기 때문이에요."}},{"id":"c4","label":"두 비미분점의 곱을 정리해요","stepIds":["s5"],"question":"\\(\\alpha\\beta\\)에서 \\(m+n\\)은 얼마인가요?","hint":"\\(\\alpha=-3\\)을 곱해 \\(m+n\\sqrt6\\) 꼴로 맞춰요.","explanation":"\\[\n\\alpha\\beta=-3\\left(-1+\\frac{\\sqrt6}{3}\\right)=3-\\sqrt6.\n\\]\n따라서 \\(m=3,n=-1\\)이고 \\(m+n=2\\)예요.","check":{"prompt":"무리수 계수 \\(n\\)은 얼마인가요?","answer":"\\(\\sqrt6\\)의 계수가 \\(-1\\)이므로 \\(n=-1\\)이에요."}}],"takeaway":["움직이는 구간의 최댓값 함수는 최대를 담당하는 후보가 교체될 때 꺾일 수 있어요.","끝점 값이 같아도 구간 안에 더 큰 극댓값이 있으면 실제 최댓값의 식은 바뀌지 않아요.","절댓값 함수에서는 원래 함수의 양수 극값뿐 아니라 음수 값의 크기도 비교해요."]};</script>
