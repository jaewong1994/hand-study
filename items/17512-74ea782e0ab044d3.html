<script>window.HandStudyGuide={"itemId":17512,"sourceHash":"2a54fd0d33e01da48c85d0cb1af1a33dfeda728a0160b88981dff1db79eefcd3","contentHash":"619f99aa1ae6a762036cc54a8906efa4d1d2277d2970266f9716b554c8efd965","overview":{"goal":"부호 조건으로 사차함수를 정한 뒤 \\(g\\)의 정적분을 계산해요.","firstLook":"(나)의 왼쪽은 \\(g(x+3)\\ge0\\)과 제곱의 곱이에요. 그래서 먼저 \\(x>-3\\)에서 \\(f'(x)\\ge0\\)임을 읽어요.","conditions":[{"label":"(가)","meaning":"\\(-3\\)은 \\(x\\le-3\\)에서 가장 작은 함숫값을 주는 경계점이에요."},{"label":"(나)","meaning":"\\(x>-3\\)에서는 \\(f'(x)\\)가 음수가 될 수 없고, 마지막에는 \\(g\\)를 \\(f\\)와 \\(f'\\)로 바꿀 수 있어요."}]},"chapters":[{"id":"c1","label":"도함수의 남은 근을 정해요","stepIds":["s1","s2","s3","s4","s5","s6"],"question":"\\(f'(0)=0\\)을 안 뒤, 남은 근이 왜 정확히 \\(-3\\)이어야 할까요?","hint":"\\(x>-3\\)의 부호로 먼저 \\(r\\le-3\\)을 얻고, \\(r<-3\\)인 경우를 (가)에 넣어 봐요.","explanation":"\\(x=0\\)을 (나)에 넣으면 \\({f(0)-f(0)}^2=0\\)이므로 \\(f'(0)=0\\)이에요. 또 \\(x>-3\\)에서 \\(g(x+3)\\ge0\\)이고 제곱도 음수가 아니므로 \\(f'(x)\\ge0\\)이에요. 사차함수의 최고차항 계수가 \\(1\\)이므로 도함수의 최고차항은 \\(4x^3\\)이고, \\(0\\)에서 부호가 바뀌지 않으려면 \\(0\\)은 적어도 이중근이에요. 따라서 \\(f'(x)=4x^2(x-r)\\)로 둘 수 있어요.\n\n\\(x>-3\\)에서 이 식이 음수가 되지 않으려면 \\(r\\le-3\\)이어야 해요. 그런데 \\(r<-3\\)이면 \\(r<x<-3\\)에서 \\(f'(x)>0\\)이므로 \\(f(-3)-f(r)=\\int_r^{-3}f'(x)\\,dx>0\\)이에요. 곧 \\(f(r)<f(-3)\\)가 되어 (가)와 모순이에요. 그래서 \\(r=-3\\), \\(f'(x)=4x^2(x+3)\\)로 확정돼요.","check":{"prompt":"\\(r<-3\\)일 때 (가)와 모순이 되는 실제 적분식은 무엇인가요?","answer":"\\(f(-3)-f(r)=\\int_r^{-3}4x^2(x-r)\\,dx>0\\)이므로 \\(f(r)<f(-3)\\)가 돼요."}},{"id":"c2","label":"두 번의 치환에서 구간도 바꿔요","stepIds":["s7","s8","s9"],"question":"\\(g\\)의 적분을 \\(u^{-2}\\)의 적분으로 바꿀 때 변수와 양 끝값은 어떻게 움직일까요?","hint":"먼저 \\(s=x+3\\)으로 \\(g(s)\\)를 (나)에 맞추고, 다음에 \\(u=f(x)-f(0)\\)으로 둬요.","explanation":"\\(f'(x)=4x^2(x+3)\\)을 \\(0\\)부터 \\(x\\)까지 적분하면 \\(f(x)-f(0)=x^4+4x^3=x^3(x+4)\\)예요. 이제 원래 적분의 변수를 \\(s\\)라 쓰고 \\(s=x+3\\), \\(ds=dx\\)로 둬요. \\(s=4,5\\)는 각각 \\(x=1,2\\)가 되므로\n\n\\(\\int_4^5g(s)\\,ds=\\int_1^2\\frac{f'(x)}{\\{f(x)-f(0)\\}^2}\\,dx\\)예요.\n\n여기서 \\(u=f(x)-f(0)\\)로 두면 \\(du=f'(x)\\,dx\\)예요. 양 끝값도 \\(u(1)=1^3(1+4)=5\\), \\(u(2)=2^3(2+4)=48\\)로 함께 바뀌어요. 따라서 적분은 \\(\\int_5^{48}u^{-2}\\,du\\)가 돼요.","check":{"prompt":"첫 치환과 둘째 치환에서 각각 바뀌는 양 끝값은 무엇인가요?","answer":"\\(s=x+3\\)에서는 \\(4,5\\to1,2\\), \\(u=f(x)-f(0)\\)에서는 \\(1,2\\to5,48\\)이에요."}},{"id":"c3","label":"끝값을 넣어 분수를 확인해요","stepIds":["s10","s11"],"question":"\\(u^{-2}\\)를 적분한 뒤 왜 \\(43/240\\)이 나오나요?","hint":"미분하면 \\(u^{-2}\\)가 되는 \\(-u^{-1}\\)에 위끝값 \\(48\\)과 아래끝값 \\(5\\)를 차례로 넣어요.","explanation":"\\(\\int_5^{48}u^{-2}\\,du=[-u^{-1}]_5^{48}=-1/48-(-1/5)=1/5-1/48\\)이에요. 통분하면 \\((48-5)/240=43/240\\)이에요. \\(43\\)은 \\(240\\)을 나누지 않으므로 이미 서로소이고, \\(p=240\\), \\(q=43\\)이어서 \\(p+q=283\\)이에요.","check":{"prompt":"마지막에 확인해야 할 \\(p,q\\)와 정답은 무엇인가요?","answer":"\\(p=240,q=43\\)이고, 정답은 \\(283\\)이에요."}}],"takeaway":["곱에 제곱이 있으면 나머지 인수의 부호를 먼저 읽어요.","부호로 근의 범위를 좁힌 뒤 경계 조건을 적분식으로 확인해 등호를 정해요.","치환할 때 새 변수와 미분관계뿐 아니라 양 끝값도 매번 함께 바꿔요."]};</script>
