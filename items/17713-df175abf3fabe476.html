<script>window.HandStudyRecord={"itemId":17713,"sourceLabel":"2023 교육청 고3 수학확통 4월 30번","adminYear":2023,"grade":3,"month":4,"number":30,"track":"확통","points":4,"scoreStatus":"confirmed_4_direct","questionText":"세 문자 $a$, $b$, $c$ 중에서 중복을 허락하여 각각 $5$개 이하씩 모두 $7$개를 택해 다음 조건을 만족시키는 $7$자리의 문자열을 만들려고 한다.\n(가) 한 문자가 연달아 $3$개 이어지고 그 문자는 $a$뿐이다.(나) 어느 한 문자도 연달아 $4$개 이상 이어지지 않는다.\n예를 들어, $baaacca$, $ccbbaaa$는 조건을 만족시키는 문자열이고 $aabbcca$, $aaabccc$, $ccbaaaa$는 조건을 만족시키지 않는 문자열이다. 만들 수 있는 모든 문자열의 개수를 구하시오. [4점]","answer":"188","sourceHash":"6c06ab99e467b14156121492d22d56b440464dfc0186e5871f17936d05301b7d","steps":[{"id":"s1","latex":"aaa\\text{ 블록은 정확히 하나},\\qquad \\#a\\in\\{3,4,5\\}"},{"id":"s2","latex":"g(n)=\\#\\{b,c\\text{로 만든 길이 }n\\text{ 문자열}:bbb,ccc\\text{ 없음}\\}"},{"id":"s3","latex":"(g(0),g(1),g(2),g(3),g(4))=(1,2,4,6,10)"},{"id":"s4","latex":"\\#a=3:\\quad\\sum_{i=0}^{4}g(i)g(4-i)=60"},{"latex":"\\#a=4:\\quad aaa\\text{와 }a\\text{의 순서 두 가지, 사이 }j\\ge1\\text{개의 }b,c","id":"s5"},{"latex":"2\\sum_{j=1}^3 g(j)\\sum_{i+k=3-j}g(i)g(k)=2(24+16+6)=92","id":"s6"},{"latex":"\\#a=5:\\quad(aaa,aa)\\text{는 두 순서},\\quad(aaa,a,a)\\text{는 세 순서}","id":"s7"},{"id":"s8","latex":"\\#a=5:\\quad2(8+4)+3g(1)^2=36"},{"id":"s9","latex":"60+92+36=188"}],"diagram":null,"contentHash":"2df46d76aa9bb1a8a67f595624cd4c012539d7c6f59a72f48649064f07206509","questionHtml":"\u003cp class=\"hp\">세 문자 \u003cspan class=\"heq\">\\(a\\)\u003c/span>, \u003cspan class=\"heq\">\\(b\\)\u003c/span>, \u003cspan class=\"heq\">\\(c\\)\u003c/span> 중에서 중복을 허락하여 각각 \u003cspan class=\"heq\">\\(5\\)\u003c/span>개 이하씩 모두 \u003cspan class=\"heq\">\\(7\\)\u003c/span>개를 택해 다음 조건을 만족시키는 \u003cspan class=\"heq\">\\(7\\)\u003c/span>자리의 문자열을 만들려고 한다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) 한 문자가 연달아 \u003cspan class=\"heq\">\\(3\\)\u003c/span>개 이어지고 그 문자는 \u003cspan class=\"heq\">\\(a\\)\u003c/span>뿐이다.\u003c/p>\u003cp class=\"hp\">(나) 어느 한 문자도 연달아 \u003cspan class=\"heq\">\\(4\\)\u003c/span>개 이상 이어지지 않는다.\u003c/p>\u003c/div>\u003cp class=\"hp\">예를 들어, \u003cspan class=\"heq\">\\(baaacca\\)\u003c/span>, \u003cspan class=\"heq\">\\(ccbbaaa\\)\u003c/span>는 조건을 만족시키는 문자열이고\u003cbr>\u003cspan class=\"heq\">\\(aabbcca\\)\u003c/span>, \u003cspan class=\"heq\">\\(aaabccc\\)\u003c/span>, \u003cspan class=\"heq\">\\(ccbaaaa\\)\u003c/span>는 조건을 만족시키지 않는 문자열이다. 만들 수 있는 모든 문자열의 개수를 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"df175abf3fabe476874c228a8e2fe9432bc1aa9bf58f56c68e560d4c9c1deeef"};</script>
<script>window.HandStudyGuide={"itemId":17713,"sourceHash":"6c06ab99e467b14156121492d22d56b440464dfc0186e5871f17936d05301b7d","contentHash":"2df46d76aa9bb1a8a67f595624cd4c012539d7c6f59a72f48649064f07206509","overview":{"goal":"유일한 aaa 블록을 기준으로 a의 총개수를 나누고, 사이의 b,c 문자열이 세 글자 연속을 만들지 않도록 세어요.","firstLook":"조건은 aaa가 정확히 한 번 나타나고 bbb, ccc, aaaa는 나타나지 않는다는 뜻이에요. aaa를 한 덩어리로 보고 나머지 a블록과 b,c 구간을 배치해요.","conditions":[{"label":"a의 개수","meaning":"aaa가 필요하고 각 문자는 \\(5\\)개 이하이므로 \\(a\\)는 \\(3,4,5\\)개예요."},{"label":"유일한 세 연속","meaning":"aaa 블록은 정확히 하나이며 다른 a와 붙어 네 개 이상이 되거나 또 다른 aaa를 만들면 안 돼요."},{"label":"b와 c","meaning":"b와 c도 세 개 연속이면 조건 (가)에 어긋나므로 각 b,c 구간에는 bbb와 ccc가 없어야 해요."}]},"chapters":[{"id":"c1","label":"b와 c만으로 된 짧은 문자열 수를 준비해요","stepIds":["s1","s2","s3"],"question":"길이 \\(0\\)부터 \\(4\\)까지 bbb와 ccc가 없는 문자열 수는 얼마인가요?","hint":"길이 3에서는 전체 8개 중 두 개를 빼고, 길이 4에서는 직접 끝의 연속 길이를 확인해요.","explanation":"bbb와 ccc가 없는 길이 \\(n\\)의 b,c 문자열 수를 \\(g(n)\\)이라 할게요. 빈 문자열은 \\(g(0)=1\\), 길이 \\(1,2\\)에서는 제한이 없어 \\(g(1)=2,g(2)=4\\)예요.\n\n길이 \\(3\\)에서는 전체 \\(8\\)개 중 bbb와 ccc를 빼 \\(g(3)=6\\)이에요. 길이 \\(4\\)에서는 조건을 만족하는 길이 \\(3\\) 문자열 뒤에 같은 문자를 붙여 세 연속이 되는 경우만 제외해 세면 \\(g(4)=10\\)이에요. 따라서 \\((g(0),\\ldots,g(4))=(1,2,4,6,10)\\)이에요.","check":{"prompt":"길이 \\(3\\)에서 제외되는 두 문자열은 무엇인가요?","answer":"bbb와 ccc예요."}},{"id":"c2","label":"a가 3개인 경우를 세어요","stepIds":["s4"],"question":"aaa 한 블록과 b,c 네 글자를 어떻게 나누나요?","hint":"aaa의 앞 길이를 i라 하면 뒤 길이는 4-i이고 두 구간은 블록으로 분리돼요.","explanation":"\\(a\\)가 \\(3\\)개이면 반드시 aaa가 하나의 블록이고, 나머지 네 글자는 b,c예요. aaa 앞에 \\(i\\)글자, 뒤에 \\(4-i\\)글자를 놓으면 두 구간은 aaa로 끊겨 각각 독립적으로 bbb,ccc를 피하면 돼요.\n\n따라서 경우의 수는 \\(\\sum_{i=0}^4g(i)g(4-i)=10+12+16+12+10=60\\)이에요.","check":{"prompt":"\\(i=2\\)인 경우의 수는 얼마인가요?","answer":"앞뒤가 각각 길이 \\(2\\)라 \\(g(2)g(2)=4\\cdot4=16\\)이에요."}},{"id":"c3","label":"a가 4개인 경우를 세어요","stepIds":["s5","s6"],"question":"aaa 블록과 홀로 있는 a를 분리하는 b,c 구간을 어떻게 셀까요?","hint":"두 a블록의 순서는 두 가지이고, 사이 구간 길이 j는 적어도 1이에요.","explanation":"a블록은 길이 \\(3\\)과 \\(1\\)이고 순서는 \\(2\\)가지예요. 두 블록이 붙으면 aaaa가 되므로 사이의 b,c 구간 길이 \\(j\\)는 \\(1,2,3\\) 중 하나예요. 남은 \\(3-j\\)글자는 양 끝에 길이 \\(i,k\\)로 나눠 놓아요.\n\n고정된 \\(j\\)의 수는 \\(g(j)\\sum_{i+k=3-j}g(i)g(k)\\)예요. \\(j=1,2,3\\)에서 각각 \\(24,16,6\\)이므로, 블록 순서까지 곱해 \\(2(24+16+6)=92\\)가지예요.","check":{"prompt":"사이 길이 \\(j=1\\)일 때 괄호 안의 값이 \\(24\\)인 계산은 무엇인가요?","answer":"\\(g(1)\\{g(0)g(2)+g(1)g(1)+g(2)g(0)\\}=2(4+4+4)=24\\)예요."}},{"id":"c4","label":"a가 5개인 두 블록형을 세어 합해요","stepIds":["s7","s8","s9"],"question":"a 다섯 개를 허용되는 블록으로 나누면 어떤 두 형태가 나오나요?","hint":"aaa가 하나 있어야 하고 길이 4 이상 블록은 금지돼요.","explanation":"a블록은 \\((3,2)\\) 또는 \\((3,1,1)\\)뿐이에요. \\((3,2)\\)에서는 두 블록 순서가 \\(2\\)가지예요. b,c 두 글자 중 사이에 한 글자를 놓으면 나머지 한 글자를 양 끝 중 하나에 두어 \\(8\\)가지이고, 두 글자를 모두 사이에 놓으면 \\(g(2)=4\\)가지예요. 따라서 \\(2(8+4)=24\\)가지예요.\n\n\\((3,1,1)\\)에서는 aaa 블록의 위치가 세 블록 중 \\(3\\)가지이고, 두 b,c 글자는 두 사이에 하나씩 놓여 각각 \\(g(1)^2=4\\)가지예요. 따라서 \\(3\\cdot4=12\\)가지예요. a가 다섯 개인 경우는 \\(36\\)가지이고 전체는 \\(60+92+36=188\\)가지예요.","check":{"prompt":"(3,1,1)에서 두 b,c 글자를 양 끝에 놓을 수 없는 이유는 무엇인가요?","answer":"세 a블록을 서로 분리하려면 두 블록 사이 두 곳에 적어도 한 글자씩 필요해 두 글자를 모두 사이에 써야 하기 때문이에요."}}],"takeaway":["특정 연속 블록이 정확히 한 번 나오는 문자열은 그 블록을 하나의 덩어리로 보고 나머지 같은 문자의 블록 크기를 나눠요.","금지 연속이 있는 두 문자 문자열의 짧은 길이별 개수를 미리 구하면 분리된 구간을 곱해 셀 수 있어요.","블록 사이에는 최소 한 글자가 필요하므로 먼저 채운 뒤 남은 글자를 양 끝과 사이에 분배해요."]};</script>
