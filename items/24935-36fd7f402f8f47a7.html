  <script>window.HandStudyRecord={"adminYear":2024,"answer":"②","contentHash":"50967b58ae89da6dad24df929f4908840d9e1a5164f949eff060e67f10f7e2f2","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24935,"month":11,"number":28,"points":4,"preview":false,"questionHtml":"\u003cp>실수 전체의 집합에서 미분가능한 함수 \u003cspan class=\"heq\">\\(f \\left(x \\right)\\,\\)\u003c/span>의 도함수 \u003cspan class=\"heq\">\\(f&#x27; \\left(x \\right)\\,\\)\u003c/span>가\u003c/p>\u003cp> \u003cspan class=\"heq\">\\(f&#x27; \\left(x \\right)=\\,-x+e^{1-x^{2}}\\)\u003c/span>\u003c/p>\u003cp>이다. 양수 \u003cspan class=\"heq\">\\(t\\,\\)\u003c/span>에 대하여 곡선 \u003cspan class=\"heq\">\\(y=f \\left(x \\right)\\,\\)\u003c/span> 위의 점 \u003cspan class=\"heq\">\\(\\left(t,\\, f \\left(t \\right) \\right)\\,\\)\u003c/span>에서의 접선과 곡선 \u003cspan class=\"heq\">\\(y=f \\left(x \\right)\\,\\)\u003c/span> 및 \u003cspan class=\"heq\">\\(y\\,\\)\u003c/span>축으로 둘러싸인 부분의 넓이를 \u003cspan class=\"heq\">\\(g \\left(t \\right)\\,\\)\u003c/span>라 하자. \u003cspan class=\"heq\">\\(g \\left(1 \\right)+g&#x27; \\left(1 \\right)\\,\\)\u003c/span>의 값은? [4점]\u003c/p>\u003cdiv class=\"hchoices\">\u003cdiv class=\"hch\">① \u003cspan class=\"heq\">\\(\\frac{1}{2} e+\\frac{1}{2}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">② \u003cspan class=\"heq\">\\(\\frac{1}{2} e+\\frac{2}{3}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">③ \u003cspan class=\"heq\">\\(\\frac{1}{2} e+\\frac{5}{6}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">④ \u003cspan class=\"heq\">\\(\\frac{2}{3} e+\\frac{1}{2}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">⑤ \u003cspan class=\"heq\">\\(\\frac{2}{3} e+\\frac{2}{3}\\)\u003c/span>\u003c/div>\u003c/div>","questionText":"실수 전체의 집합에서 미분가능한 함수 $f \\left(x \\right)\\,$의 도함수 $f\\,' \\left(x \\right)\\,$가\n $f\\,' \\left(x \\right)=\\,-x+e^{1-x^{2}}$\n이다. 양수 $t\\,$에 대하여 곡선 $y=f \\left(x \\right)\\,$ 위의 점 $\\left(t,\\, f \\left(t \\right) \\right)\\,$에서의 접선과 곡선 $y=f \\left(x \\right)\\,$ 및 $y\\,$축으로 둘러싸인 부분의 넓이를 $g \\left(t \\right)\\,$라 하자. $g \\left(1 \\right)+g\\,' \\left(1 \\right)\\,$의 값은? [4점]\n① $\\frac{1}{2} e+\\frac{1}{2}$ ② $\\frac{1}{2} e+\\frac{2}{3}$ ③ $\\frac{1}{2} e+\\frac{5}{6}$\n④ $\\frac{2}{3} e+\\frac{1}{2}$ ⑤ $\\frac{2}{3} e+\\frac{2}{3}$","sourceHash":"a27dfbc9c901a8d595f8ff5e5c6d7668d8952ebe5cd9e042f9ae1cf6e0b0c369","sourceKind":"csat","sourceLabel":"2024년 시행 수능 · 2025학년도 · 미적분 · 28번","steps":[{"id":"s1","latex":"f\\prime\\prime(x)=-1-2xe^{1-x^2}\u003c0\\quad(x\\ge0)"},{"explanation":{"body":"넓이는 ‘위의 함수−아래의 함수’를 적분해야 해요. 여기서는 \\(f^{\\prime\\prime}(x)\u003c0\\)이므로 접선이 곡선보다 위에 있어요. 접선의 식을 먼저 쓰고 거기서 \\(f(x)\\)를 빼면 넓이를 나타낼 수 있어요.","skillTags":["integration.area","derivative.concavity"],"title":"접선이 위에 있는지 먼저 확인해요"},"id":"s2","latex":"\\text{접선 }y=f(t)+f\\prime(t)(x-t)\\text{는 }0\\le x\\le t\\text{에서 곡선 위}"},{"id":"s3","latex":"g(t)=\\int_0^t\\{f(t)+f\\prime(t)(x-t)-f(x)\\}\\,dx"},{"id":"s4","latex":"g(t)=tf(t)-\\frac{t^2}{2}f\\prime(t)-\\int_0^tf(x)\\,dx"},{"explanation":{"body":"\\(tf(t)\\)의 도함수는 \\(f(t)+tf^{\\prime}(t)\\)이고, \\(\\frac{t^2}{2}f^{\\prime}(t)\\)의 도함수는 \\(tf^{\\prime}(t)+\\frac{t^2}{2}f^{\\prime\\prime}(t)\\)예요. 마지막 적분을 미분하면 \\(f(t)\\)가 나오니, 서로 지워지고 \\(-\\frac{t^2}{2}f^{\\prime\\prime}(t)\\)만 남아요.","skillTags":["derivative.product","integration.fundamental-theorem"],"title":"곱의 미분을 펼치면 두 항이 지워져요"},"id":"s5","latex":"g\\prime(t)=-\\frac{t^2}{2}f\\prime\\prime(t)\\quad\\Rightarrow\\quad g\\prime(1)=\\frac32"},{"explanation":{"body":"\\(f(x)\\)를 직접 적분하려고 하면 막혀요. 반면 \\(f^{\\prime}(x)\\)는 주어져 있으니 부분적분으로 바꿔 볼게요. \\(\\int_0^1xf^{\\prime}(x)\\,dx=[xf(x)]_0^1-\\int_0^1f(x)\\,dx\\)이므로 오른쪽은 정확히 \\(f(1)-\\int_0^1f(x)\\,dx\\)가 돼요. 이처럼 ‘끝점의 곱−적분’이 보이면 부분적분식을 거꾸로 이용할 수 있어요.","skillTags":["integration.by-parts"],"title":"모르는 f(x) 대신, 주어진 f′(x)를 써요"},"id":"s6","latex":"f\\prime(1)=0,\\quad g(1)=f(1)-\\int_0^1f(x)\\,dx=\\int_0^1xf\\prime(x)\\,dx"},{"explanation":{"body":"\\(\\int_0^1xe^{1-x^2}\\,dx\\)에서 지수 \\(1-x^2\\)를 미분하면 앞의 \\(x\\)와 연결돼요. \\(u=1-x^2\\)로 놓으면 \\(du=-2x\\,dx\\)이고, \\(x=0,1\\)은 각각 \\(u=1,0\\)이에요. 따라서 \\(-\\frac12\\int_1^0e^u\\,du=\\frac12\\int_0^1e^u\\,du=\\frac{e-1}{2}\\)가 됩니다. 마이너스 부호와 뒤집힌 적분 구간을 함께 확인해요.","skillTags":["integration.substitution","integration.bounds"],"title":"지수 안쪽을 치환하고 적분 구간도 바꿔요"},"id":"s7","latex":"g(1)=\\int_0^1(-x^2+xe^{1-x^2})\\,dx=-\\frac13+\\frac{e-1}{2}=\\frac e2-\\frac56"},{"id":"s8","latex":"g(1)+g\\prime(1)=\\frac e2+\\frac23\\quad\\therefore\\text{②}"}],"track":"미적분"};</script>
