  <script>window.HandStudyRecord={"itemId":11943,"sourceLabel":"2023 교육청 고1 수학 6월 14번","adminYear":2023,"grade":1,"month":6,"number":14,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"분자 사이에 인력이나 반발력이 작용하지 않고 분자의 크기를 무시할 수 있는 가상의 기체를 이상 기체라 한다. 강철 용기에 들어 있는 이상 기체의 부피를 $V\\, \\left( L \\right) \\,$, 몰수를 $n \\left( \\mathrm{mol} \\right)$, 절대 온도를 $T\\, \\left( K \\right) \\,$, 압력을 $P\\, \\left( atm \\right) \\,$이라 할 때, 다음과 같은 관계식이 성립한다.\n $V\\,=\\,R\\, \\left( \\frac{nT}{P} \\right) \\,$ (단, $R\\,$는 기체 상수이다.)\n강철 용기 $A\\,$와 강철 용기 $B\\,$에 부피가 각각 $V _{A} \\,$, $V _{B} \\,$인 이상 기체가 들어 있다. 강철 용기 $A\\,$에 담긴 이상 기체의 몰수는 강철 용기 $B\\,$에 담긴 이상 기체의 몰수의 $\\frac{1}{4} \\,$배이고, 강철 용기 $A\\,$에 담긴 이상 기체의 압력은 강철 용기 $B\\,$에 담긴 이상 기체의 압력의 $\\frac{3}{2} \\,$배이다. 강철 용기 $A\\,$와 강철 용기 $B\\,$에 담긴 이상 기체의 절대 온도가 같을 때, $\\frac{V _{A}}{V _{B}} \\,$의 값은? [4점]\n① $\\frac{1}{6}$ ② $\\frac{1}{3}$ ③ $\\frac{1}{2}$ ④ $\\frac{2}{3}$ ⑤ $\\frac{5}{6}$","answer":"①","sourceHash":"f8a4252f225fb20d168b3a1a82cb3c1530b6c5ab844621d36396ee05f7c6a757","steps":[{"id":"s1","latex":"V=R\\frac{nT}{P}"},{"id":"s2","latex":"\\frac{V_A}{V_B}=\\frac{n_A}{n_B}\\frac{T_A}{T_B}\\frac{P_B}{P_A}=\\frac14\\cdot1\\cdot\\frac23=\\frac16"}],"diagram":null,"contentHash":"5beb924025c103b77f22bbbefc59cf156547636e8f90c1cab762b59b5023a11f","questionHtml":"\u003cp class=\"hp\">분자 사이에 인력이나 반발력이 작용하지 않고 분자의 크기를 무시할 수 있는 가상의 기체를 이상 기체라 한다. 강철 용기에 들어 있는 이상 기체의 부피를 \u003cspan class=\"heq\">\\(V\\, \\left( L \\right) \\,\\)\u003c/span>, 몰수를 \u003cspan class=\"heq\">\\(n \\left( \\mathrm{mol} \\right)\\)\u003c/span>, 절대 온도를 \u003cspan class=\"heq\">\\(T\\, \\left( K \\right) \\,\\)\u003c/span>, 압력을 \u003cspan class=\"heq\">\\(P\\, \\left( atm \\right) \\,\\)\u003c/span>이라 할 때, 다음과 같은 관계식이 성립한다.\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\(V\\,=\\,R\\, \\left( \\dfrac{nT}{P} \\right) \\,\\)\u003c/span> (단, \u003cspan class=\"heq\">\\(R\\,\\)\u003c/span>는 기체 상수이다.)\u003c/p>\u003cp class=\"hp hta
