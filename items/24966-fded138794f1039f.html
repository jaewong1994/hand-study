<script>window.HandStudyRecord={"adminYear":2025,"answer":"65","contentHash":"10938df1b798cf53430251514fd7736b539e3f504690e2f8979c9c9d6d4653f6","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24966,"month":11,"number":21,"points":4,"preview":false,"questionHtml":"\u003cp>최고차항의 계수가 양수인 삼차함수 \u003cspan class=\"heq\">\\(f \\left(x \\right)\\,\\)\u003c/span>와 실수 \u003cspan class=\"heq\">\\(t\\,\\)\u003c/span>에 대하여 함수\u003c/p>\u003cp> \u003cspan class=\"heq\">\\(g \\left(x \\right)= \\begin{cases}\\,-f \\left(x \\right) &amp; &amp; \\left(x &lt; t \\right) \\\\ \\, f \\left(x \\right) &amp; &amp; \\left(x \\geq t \\right)\\end{cases}\\,\\)\u003c/span>\u003c/p>\u003cp>는 실수 전체의 집합에서 연속이고 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox hcond\">\u003cp class=\"hcondr\">(가) 모든 실수 \u003cspan class=\"heq\">\\(a\\,\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(\\lim_{x\\,\\rightarrow\\, a+}\\frac{g \\left(x \\right)}{x \\left(x-2 \\right)}\\,\\)\u003c/span>의 값이 존재한다.\u003c/p>\u003cp class=\"hcondr\">(나) \u003cspan class=\"heq\">\\(\\lim_{x\\,\\rightarrow\\, m+}\\frac{g \\left(x \\right)}{x \\left(x-2 \\right)}\\,\\)\u003c/span>의 값이 음수가 되도록 하는 자연수 \u003cspan class=\"heq\">\\(m\\,\\)\u003c/span>의 집합은 \u003cspan class=\"heq\">\\(\\left\\{g \\left(-1 \\right),\\,-\\frac{7}{2}g \\left(1 \\right) \\right\\}\\,\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp>\u003cspan class=\"heq\">\\(g \\left(-5 \\right)\\,\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(g \\left(-1 \\right) \\neq -\\frac{7}{2}g \\left(1 \\right)\\)\u003c/span>) [4점]\u003c/p>","questionText":"최고차항의 계수가 양수인 삼차함수 $f \\left(x \\right)\\,$와 실수 $t\\,$에 대하여 함수\n $g \\left(x \\right)= \\begin{cases}\\,-f \\left(x \\right) & & \\left(x \u003c t \\right) \\\\ \\, f \\left(x \\right) & & \\left(x \\geq t \\right)\\end{cases}\\,$\n는 실수 전체의 집합에서 연속이고 다음 조건을 만족시킨다.\n(가) 모든 실수 $a\\,$에 대하여 $\\lim_{x\\,\\rightarrow\\, a+}\\frac{g \\left(x \\right)}{x \\left(x-2 \\right)}\\,$의 값이 존재한다.(나) $\\lim_{x\\,\\rightarrow\\, m+}\\frac{g \\left(x \\right)}{x \\left(x-2 \\right)}\\,$의 값이 음수가 되도록 하는 자연수 $m\\,$의 집합은 $\\left\\{g \\left(-1 \\right),\\,-\\frac{7}{2}g \\left(1 \\right) \\right\\}\\,$이다.\n$g \\left(-5 \\right)\\,$의 값을 구하시오. $\\left( \\pi \\leq {\\,#\\,} \\right.\\,$단, $g \\left(-1 \\right) \\neq\\,-\\frac{7}{2}g \\left(1 \\right) \\pi \\leq {\\,#\\,} \\right)$ [4점]","sourceHash":"7f100b05c6105b459357252f76fae3e5b7b45cda8fa6201c9233f424ed09ec5c","sourceKind":"csat","sourceLabel":"2025년 시행 수능 · 2026학년도 · 공통 · 21번","steps":[{"id":"s1","latex":"g\\text{가 }x=t\\text{에서 연속이므로 }f(t)=0"},{"explanation":{"body":"\\(x=0,2\\)에서 분모 \\(x(x-2)\\)가 0입니다. 오른쪽 극한이 유한하려면 분자 \\(g(x)\\)도 같은 점에서 0이어야 하므로 \\(g(0)=g(2)=0\\), 결국 \\(f(0)=f(2)=0\\)입니다.","skillTags":["극한","영점조건"],"title":"분모가 0일 때 유한한 극한"},"id":"s2","latex":"x\\to0+,\\ 2+\\text{에서 }\\frac{g(x)}{x(x-2)}\\text{가 유한하려면 }f(0)=f(2)=0"},{"id":"s3","latex":"f(x)=cx(x-2)(x-r)\\quad(c>0),\\qquad t\\in\\{0,2,r\\}"},{"id":"s4","latex":"\\frac{g(x)}{x(x-2)}=\\begin{cases}-c(x-r)&(x\u003ct)\\\\c(x-r)&(x\\ge t)\\end{cases}"},{"id":"s5","latex":"\\text{음의 우극한을 주는 자연수가 두 개이므로 }t\\ne r"},{"id":"s6","latex":"t=0\\text{이면 자연수 집합은 }\\{1,2\\}\\text{이나 }-\\frac72g(1)\u003c0\\text{이어서 불가능하다.}"},{"id":"s7","latex":"t=2\\text{이고 }3\u003cr\\le4\\text{이며 음의 값을 주는 자연수는 }\\{2,3\\}"},{"id":"s8","latex":"g(-1)=3c(r+1),\\qquad -\\frac72g(1)=\\frac72c(r-1)"},{"id":"s9","latex":"3c(r+1)>\\frac72c(r-1)\\text{이므로 각각 }3,2\\text{이다.}"},{"id":"s10","latex":"c(r+1)=1,\\quad c(r-1)=\\frac47\\Rightarrow r=\\frac{11}{3},\\ c=\\frac3{14}"},{"id":"s11","latex":"g(-5)=-f(-5)=\\frac3{14}\\cdot35\\cdot\\frac{26}{3}=65"},{"id":"s12","latex":"\\therefore\\ \\boxed{65}"}],"track":"공통"};</script>
<script>window.HandStudyGuide={"itemId":24966,"sourceHash":"7f100b05c6105b459357252f76fae3e5b7b45cda8fa6201c9233f424ed09ec5c","contentHash":"10938df1b798cf53430251514fd7736b539e3f504690e2f8979c9c9d6d4653f6","overview":{"goal":"연속과 우극한 조건으로 삼차함수의 세 근을 잡고, 음의 우극한을 만드는 자연수 두 개를 이용해 계수를 정해요.","firstLook":"분모 \\(x(x-2)\\)는 \\(0,2\\)에서 0이 돼요. 모든 오른쪽 극한이 존재하려면 분자도 이 두 점에서 0이어야 하므로 \\(f\\)의 두 근을 바로 얻을 수 있어요.","conditions":[{"label":"연속 조건","meaning":"부호가 바뀌는 경계 \\(x=t\\)에서 좌우 함숫값이 같아야 해요."},{"label":"우극한 조건","meaning":"\\(0,2\\)에서 분모가 0이므로 분자의 영점과 약분 뒤의 부호를 확인해요."},{"label":"자연수 집합","meaning":"음의 우극한을 만드는 자연수가 정확히 두 개이고, 그 두 수가 주어진 두 함숫값이에요."}]},"chapters":[{"id":"c1","label":"연속과 유한한 우극한으로 세 근을 잡아요","stepIds":["s1","s2","s3","s4"],"question":"왜 \\(f(x)\\)를 \\(cx(x-2)(x-r)\\) 꼴로 둘 수 있을까요?","hint":"\\(x=t\\)에서의 연속과 \\(x=0,2\\)에서 분모가 0이 되는 상황을 각각 사용해요.","explanation":"\\(x=t\\)의 왼쪽에서 \\(g(x)=-f(x)\\), 오른쪽과 그 점에서 \\(g(x)=f(x)\\)예요. 연속이려면 \\(-f(t)=f(t)\\)여야 하므로 \\(f(t)=0\\)이에요. 또 \\(x=0,2\\)에서 \\(x(x-2)=0\\)이에요. 오른쪽 극한이 유한한 값으로 존재하려면 \\(g(0)=g(2)=0\\)이어야 하고, 부호만 다를 뿐이므로 \\(f(0)=f(2)=0\\)이에요. 따라서 최고차항 계수가 양수인 삼차함수는\n\n\\(f(x)=cx(x-2)(x-r)\\), \\(c>0\\)\n\n로 둘 수 있고, \\(t\\)는 \\(0,2,r\\) 중 하나예요. 약분하면 오른쪽에서 보는 구간에 따라 몫은 \\(-c(x-r)\\) 또는 \\(c(x-r)\\)가 돼요.","check":{"prompt":"\\(x=t\\)에서 연속이라는 조건이 주는 등식을 좌우 함숫값으로 써 보세요.","answer":"왼쪽 극한은 \\(-f(t)\\), 함숫값과 오른쪽 극한은 \\(f(t)\\)이므로 \\(-f(t)=f(t)\\), 따라서 \\(f(t)=0\\)이에요."}},{"id":"c2","label":"경계의 세 후보를 자연수 부호로 걸러요","stepIds":["s5","s6","s7"],"question":"\\(t=0\\)과 \\(t=r\\)은 왜 조건의 두 자연수를 만들 수 없을까요?","hint":"각 경우에 자연수 \\(m\\)이 경계의 어느 쪽에 있는지 보고, 약분한 일차식의 부호를 조사해요.","explanation":"먼저 \\(t=r\\)이면 \\(m<r\\)에서는 \\(-c(m-r)>0\\), \\(m\\ge r\\)에서는 \\(c(m-r)\\ge0\\)이므로 음의 값이 하나도 없어요. \\(t=0\\)이면 모든 자연수에서 \\(c(m-r)\\)를 보게 돼요. 음수가 되는 자연수가 두 개라면 그 집합은 \\(\\{1,2\\}\\)이고 \\(2<r\\le3\\)이어야 해요. 그런데 이때 \\(g(1)=f(1)=c(r-1)>0\\)이므로 \\(-7g(1)/2<0\\)예요. 주어진 집합의 원소가 자연수일 수 없어 모순이에요. 따라서 \\(t=2\\)예요. 이때 \\(m=1\\)에서는 \\(-c(1-r)>0\\)이고, \\(m\\ge2\\)에서는 \\(c(m-r)<0\\)인 자연수가 정확히 \\(2,3\\)이어야 하므로 \\(3<r\\le4\\)이고 음의 우극한을 주는 집합은 \\(\\{2,3\\}\\)이에요.","check":{"prompt":"\\(t=2\\), \\(3<r\\le4\\)일 때 \\(m=1,2,3,4\\)의 부호는 어떻게 되나요?","answer":"\\(m=1\\)에서는 \\(-c(1-r)>0\\), \\(m=2,3\\)에서는 \\(c(m-r)<0\\), \\(m=4\\)에서는 \\(c(4-r)\\ge0\\)이에요."}},{"id":"c3","label":"두 집합 원소의 순서를 정해요","stepIds":["s8","s9","s10"],"question":"\\(g(-1)\\)과 \\(-7g(1)/2\\) 중 어느 값이 \\(3\\)인지 어떻게 정할까요?","hint":"두 값을 \\(c,r\\)로 나타내고, \\(3<r\\le4\\)에서 직접 크기를 비교해요.","explanation":"\\(-1<2\\)와 \\(1<2\\)이므로 둘 다 \\(g=-f\\)인 쪽이에요. 계산하면\n\n\\(g(-1)=3c(r+1)\\), \\(-7g(1)/2=7c(r-1)/2\\)\n\n예요. 두 값의 차는 \\(c(13-r)/2\\)이고 \\(3<r\\le4\\)에서 양수예요. 따라서 더 큰 \\(g(-1)\\)이 \\(3\\), 다른 값이 \\(2\\)예요. 곧 \\(c(r+1)=1\\), \\(c(r-1)=4/7\\)이고, 두 식을 나누면 \\((r-1)/(r+1)=4/7\\)이에요. \\(7r-7=4r+4\\)에서 \\(r=11/3\\), 이어서 \\(c=3/14\\)를 얻어요.","check":{"prompt":"두 값의 차가 양수임을 \\(r\\)의 범위로 확인해 보세요.","answer":"\\(3c(r+1)-7c(r-1)/2=c(13-r)/2\\)이고, \\(r\\le4<13\\), \\(c>0\\)이므로 양수예요."}},{"id":"c4","label":"구한 함수에 마지막 입력을 넣어요","stepIds":["s11","s12"],"question":"\\(x=-5\\)에서는 왜 \\(g(-5)=-f(-5)\\)를 써야 할까요?","hint":"이미 정한 경계는 \\(t=2\\)예요.","explanation":"\\(-5<2=t\\)이므로 정의에 따라 \\(g(-5)=-f(-5)\\)예요. 따라서\n\n\\(g(-5)=-\\dfrac3{14}(-5)(-7)(-5-11/3)\\)\n\n\\(=\\dfrac3{14}\\cdot35\\cdot\\dfrac{26}{3}=65\\)\n\n예요. 이 값은 자연수 집합을 정할 때 얻은 \\(t=2\\), \\(3<r\\le4\\)에도 맞아요.","check":{"prompt":"\\(-5-r\\)와 마지막 곱을 각각 계산해 보세요.","answer":"\\(-5-11/3=-26/3\\)이고, 부호를 반영하면 \\((3/14)\\cdot35\\cdot(26/3)=65\\)예요."}}],"takeaway":["분모가 0이 되는 점에서 유한한 극한이 존재하면 분자의 영점 조건부터 확인해요.","조각함수의 경계 후보는 약분한 식의 부호가 바뀌는 자연수를 직접 나열해 걸러요.","집합의 두 원소를 식과 대응시킬 때는 값의 크기를 비교해 순서를 정해요."]};</script>
