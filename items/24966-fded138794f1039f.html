ow\\, m+}\\frac{g \\left(x \\right)}{x \\left(x-2 \\right)}\\,$의 값이 음수가 되도록 하는 자연수 $m\\,$의 집합은 $\\left\\{g \\left(-1 \\right),\\,-\\frac{7}{2}g \\left(1 \\right) \\right\\}\\,$이다.\n$g \\left(-5 \\right)\\,$의 값을 구하시오. $\\left( \\pi \\leq {\\,#\\,} \\right.\\,$단, $g \\left(-1 \\right) \\neq\\,-\\frac{7}{2}g \\left(1 \\right) \\pi \\leq {\\,#\\,} \\right)$ [4점]","sourceHash":"7f100b05c6105b459357252f76fae3e5b7b45cda8fa6201c9233f424ed09ec5c","sourceKind":"csat","sourceLabel":"2025년 시행 수능 · 2026학년도 · 공통 · 21번","steps":[{"id":"s1","latex":"g\\text{가 }x=t\\text{에서 연속이므로 }f(t)=0"},{"explanation":{"body":"\\(x=0,2\\)에서 분모 \\(x(x-2)\\)가 0입니다. 오른쪽 극한이 유한하려면 분자 \\(g(x)\\)도 같은 점에서 0이어야 하므로 \\(g(0)=g(2)=0\\), 결국 \\(f(0)=f(2)=0\\)입니다.","skillTags":["극한","영점조건"],"title":"분모가 0일 때 유한한 극한"},"id":"s2","latex":"x\\to0+,\\ 2+\\text{에서 }\\frac{g(x)}{x(x-2)}\\text{가 유한하려면 }f(0)=f(2)=0"},{"id":"s3","latex":"f(x)=cx(x-2)(x-r)\\quad(c>0),\\qquad t\\in\\{0,2,r\\}"},{"id":"s4","latex":"\\frac{g(x)}{x(x-2)}=\\begin{cases}-c(x-r)&(x\u003ct)\\\\c(x-r)&(x\\ge t)\\end{cases}"},{"id":"s5","latex":"\\text{음의 우극한을 주는 자연수가 두 개이므로 }t\\ne r"},{"id":"s6","latex":"t=0\\text{이면 자연수 집합은 }\\{1,2\\}\\text{이나 }-\\frac72g(1)\u003c0\\text{이어서 불가능하다.}"},{"id":"s7","latex":"t=2\\text{이고 }3\u003cr\\le4\\text{이며 음의 값을 주는 자연수는 }\\{2,3\\}"},{"id":"s8","latex":"g(-1)=3c(r+1),\\qquad -\\frac72g(1)=\\frac72c(r-1)"},{"id":"s9","latex":"3c(r+1)>\\frac72c(r-1)\\text{이므로 각각 }3,2\\text{이다.}"},{"id":"s10","latex":"c(r+1)=1,\\quad c(r-1)=\\frac47\\Rightarrow r=\\frac{11}{3},\\ c=\\frac3{14}"},{"id":"s11","latex":"g(-5)=-f(-5)=\\frac3{14}\\cdot35\\cdot\\frac{26}{3}=65"},{"id":"s12","latex":"\\therefore\\ \\boxed{65}"}],"track":"공통"};</script>
