  <script>window.HandStudyRecord={"itemId":11797,"sourceLabel":"2021 교육청 고1 수학 9월 18번","adminYear":2021,"grade":1,"month":9,"number":18,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 좌표평면 위에 두 점 $A \\left( 0,\\,1 \\right)$, $B \\left( 1,\\,0 \\right)$이 있다. 양수 $n$과 원점 $O$에 대하여 선분 $O A$를 $1\\,:\\,n$으로 내분하는 점을 $P$, 선분 $O B$를 $1\\,:\\,n$으로 내분하는 점을 $Q$, 선분 $A Q$와 선분 $B P$가 만나는 점을 $R$라 하자. 다음은 사각형 $P O Q R$의 넓이가 $\\dfrac{1}{42}$일 때, $n$의 값을 구하는 과정이다.\n[그림 1]\n점 $P$의 좌표는 $\\left( 0,\\, \\dfrac{1}{n+1} \\right)$,\n점 $Q$의 좌표는 $\\left( \\dfrac{1}{n+1} ,\\,0 \\right)$이다.\n직선 $A Q$의 방정식은 $y$$= - \\left( n+1 \\right) x+1$,\n직선 $B P$의 방정식은 $y$$= {\\boxed{\\vphantom{(}\\, \\left( \\text{가} \\right) \\,}} \\times x+ \\dfrac{1}{n+1}$이다.\n두 직선 $A Q$, $B P$가 만나는 점 $R$의 $x$좌표는 ${\\boxed{\\vphantom{(}\\, \\left( \\text{나} \\right) \\,}}$이고\n삼각형 $P O R$의 넓이는 $\\dfrac{1}{2} \\times \\dfrac{1}{n+1} \\times {\\boxed{\\vphantom{(}\\, \\left( \\text{나} \\right) \\,}}$이다.\n두 삼각형 $P O R$과 삼각형 $Q O R$에서\n선분 $O R$가 공통이고 ${\\overline{OP}}$$= {\\overline{OQ}}$, $\\angle POR$$= \\angle QOR$이므로\n삼각형 $P O R$과 삼각형 $Q O R$는 합동이다.\n따라서 사각형 $P O Q R$의 넓이는 삼각형 $P O R$의 넓이의\n$2$배이므로 $n$$= {\\boxed{\\vphantom{(}\\, \\left( \\text{다} \\right) \\,}}$이다.\n위의 (가), (나)에 알맞은 식을 각각 $f \\left( n \\right)$, $g \\left( n \\right)$이라 하고, (다)에 알맞은 수를 $k$라 할 때, $\\dfrac{g \\left( k \\right)}{f \\left( k \\right)}$의 값은? [4점]\n① $- \\dfrac{5}{7}$ ② $- \\dfrac{6}{7}$ ③ $-1$ ④ $- \\dfrac{8}{7}$ ⑤ $- \\dfrac{9}{7}$","answer":"②","sourceHash":"a0d50b992cbddd45c29cb94c3215a0976c18dcf38d4d327d4139c722051f28bc","steps":[{"id":"s1","latex":"P=\\left(0,\\frac1{n+1}\\right),\\quad Q=\\left(\\frac1{n+1},0\\right)"},{"id":"s2","latex":"f(n)=m_{BP}=-\\frac1{n+1}"},{"id":"s3","latex":"R=AQ\\cap BP\\Rightarrow g(n)=x_R=\\frac1{n+2}"},{"id":"s4","latex":"[POQR]=\\frac1{(n+1)(n+2)}=\\frac1{42}"},{"id":"s5","latex":"(n+1)(n+2)=42\\Rightarrow n=k=5"},{"id":"s6","latex":"\\frac{g(k)}{f(k)}=\\frac{1/7}{-1/6}=-\\frac67"}],"diagram":null,"contentHash":"16404a33a5ec93ae965e8a5e8eb70d85a2a055fb02c2a88c76eb11ca4f59417f","questionHtml":"\u003cp class=\"hp htall\">그림과 같이 좌표평면 위에 두 점 \u003cspan class=\"heq\">\\(A \\left( 0,\\,1 \\right)\\)\u003c/span>, \u003cspan class=\"heq\">\\(B \\left( 1,\\,0 \\right)\\)\u003c/span>이 있다. 양수 \u003cspan class=\"heq\">\\(n\\)\u003c/span>과 원점 \u003cspan class=\"heq\">\\(O\\)\u003c/span>에 대하여 선분 \u003cspan class=\"heq\">\\(O A\\)\u003c/span>를 \u003cspan class=\"heq\">\\(1\\,:\\,n\\)\u003c/span>으로 내분하는 점을 \u003cspan class=\"heq\">\\(P\\)\u003c/span>, 선분 \u003cspan class=\"heq\">\\(O B\\)\u003c/span>를 \u003cspan class=\"heq\">\\(1\\,:\\,n\\)\u003c/span>으로 내분하는 점을 \u003cspan class=\"heq\">\\(Q\\)\u003c/span>, 선분 \u003cspan class=\"heq\">\\(A Q\\)\u003c/span>와 선분 \u003cspan class=\"heq\">\\(B P\\)\u003c/span>가 만나는 점을 \u003cspan class=\"heq\">\\(R\\)\u003c/span>라 하자. 다음은 사각형 \u003cspan class=\"heq\">\\(P O Q R\\)\u003c/span>의 넓이가 \u003cspan class=\"heq\">\\(\\dfrac{1}{42}\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(n\\)\u003c/span>의 값을 구하는 과정이다.\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/9f10c63762ab6331b57c2e41.png\" style=\"width:258px;max-width:100%\">\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp htall\">점 \u003cspan class=\"heq\">\\(P\\)\u003c/span>의 좌표는 \u003cspan class=\"heq\">\\(\\left( 0,\\, \\dfrac{1}{n+1} \\right)\\)\u003c/span>,\u003c/p>\u003cp class=\"hp htall\">점 \u003cspan class=\"heq\">\\(Q\\)\u003c/span>의 좌표는 \u003cspan class=\"heq\">\\(\\left( \\dfrac{1}{n+1} ,\\,0 \\right)\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp\">직선 \u003cspan class=\"heq\">\\(A Q\\)\u003c/span>의 방정식은 \u003cspan class=\"heq\">\\(y\\)\u003c/span>\u003cspan class=\"heq\">\\(= - \\left( n+1 \\right) x+1\\)\u003c/span>,\u003c/p>\u003cp class=\"hp htall\">직선 \u003cspan class=\"heq\">\\(B P\\)\u003c/span>의 방정식은 \u003cspan class=\"heq\">\\(y\\)\u003c/span>\u003cspan class=\"heq\">\\(= {\\boxed{\\vphantom{(}\\, \\left( \\text{가} \\right) \\,}} \\times x+ \\dfrac{1}{n+1}\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp htall\">두 직선 \u003cspan class=\"heq\">\\(A Q\\)\u003c/span>, \u003cspan class=\"heq\">\\(B P\\)\u003c/span>가 만나는 점 \u003cspan class=\"heq\">\\(R\\)\u003c/span>의 \u003cspan class=\"heq\">\\(x\\)\u003c/span>좌표는 \u003cspan class=\"heq\">\\({\\boxed{\\vphantom{(}\\, \\left( \\text{나} \\right) \\,}}\\)\u003c/span>이고\u003c/p>\u003cp class=\"hp htall\">삼각형 \u003cspan class=\"heq\">\\(P O R\\)\u003c/span>의 넓이는 \u003cspan class=\"heq\">\\(\\dfrac{1}{2} \\times \\dfrac{1}{n+1} \\times {\\boxed{\\vphantom{(}\\, \\left( \\text{나} \\right) \\,}}\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp\">두 삼각형 \u003cspan class=\"heq\">\\(P O R\\)\u003c/span>과 삼각형 \u003cspan class=\"heq\">\\(Q O R\\)\u003c/span>에서\u003c/p>\u003cp class=\"hp htall\">선분 \u003cspan class=\"heq\">\\(O R\\)\u003c/span>가 공통이고 \u003cspan class=\"heq\">\\({\\overline{OP}}\\)\u003c/span>\u003cspan class=\"heq\">\\(= {\\overline{OQ}}\\)\u003c/span>, \u003cspan class=\"heq\">\\(\\angle POR\\)\u003c/span>\u003cspan class=\"heq\">\\(= \\angle QOR\\)\u003c/span>이므로\u003c/p>\u003cp class=\"hp\">삼각형 \u003cspan class=\"heq\">\\(P O R\\)\u003c/span>과 삼각형 \u003cspan class=\"heq\">\\(Q O R\\)\u003c/span>는 합동이다.\u003c/p>\u003cp class=\"hp\">따라서 사각형 \u003cspan class=\"heq\">\\(P O Q R\\)\u003c/span>의 넓이는 삼각형 \u003cspan class=\"heq\">\\(P O R\\)\u003c/span>의 넓이의\u003c/p>\u003cp class=\"hp htall\">\u003cspan class=\"heq\">\\(2\\)\u003c/span>배이므로 \u003cspan class=\"heq\">\\(n\\)\u003c/span>\u003cspan class=\"heq\">\\(= {\\boxed{\\vphantom{(}\\, \\left( \\text{다} \\right) \\,}}\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp class=\"hp htall\">위의 (가), (나)에 알맞은 식을 각각 \u003cspan class=\"heq\">\\(f \\left( n \\right)\\)\u003c/span>, \u003cspan class=\"heq\">\\(g \\left( n \\right)\\)\u003c/span>이라 하고, (다)에 알맞은 수를 \u003cspan class=\"heq\">\\(k\\)\u003c/span>라 할 때, \u003cspan class=\"heq\">\\(\\dfrac{g \\left( k \\right)}{f \\left( k \\right)}\\)\u003
