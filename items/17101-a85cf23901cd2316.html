<script>window.HandStudyRecord={"itemId":17101,"sourceLabel":"2021 교육청 고3 수학미적분 4월 30번","adminYear":2021,"grade":3,"month":4,"number":30,"track":"미적분","points":4,"scoreStatus":"confirmed_4_direct","questionText":"함수 $f \\left( x \\right)$를\n $f \\left( x \\right)$$= \\lim _{n -> \\infty } {} \\frac{ax ^{2n} +bx ^{2n-1} +x}{x ^{2n} +2}$ ($a,\\,b$는 양의 상수)\n라 하자. 자연수 $m$에 대하여 방정식 $f \\left( x \\right)$$=2 \\left( x-1 \\right) +m$의 실근의 개수를 $c _{m}$이라 할 때, $c _{k}$$=5$인 자연수 $k$가 존재한다. $k+ \\sum _{m=1} ^{\\infty } \\left( c _{m} -1 \\right)$의 값을 구하시오. [4점]","answer":"13","sourceHash":"7619507d1f05823a4251d1713a9062a31eb53198b6798814fb7d4a4c0b0fdd67","steps":[{"id":"s1","latex":"f(x)=\\begin{cases}x/2&(|x|\u003c1)\\\\a+b/x&(|x|>1)\\end{cases}"},{"id":"s2","latex":"f(1)=\\frac{a+b+1}{3},\\quad f(-1)=\\frac{a-b-1}{3}"},{"id":"s3","latex":"c_k=5\\Rightarrow f(1)=k,\\ f(-1)=k-4"},{"id":"s4","latex":"a=3k-6,\\ b=5,\\quad a>0,\\ k\\le3\\Rightarrow k=3"},{"id":"s5","latex":"(a,b)=(3,5)"},{"id":"s6","latex":"c_1=c_2=2,\\ c_3=5,\\ c_4=\\cdots=c_7=2,\\ c_m=1\\ (m\\ge8)"},{"id":"s7","latex":"\\sum_{m\\ge1}(c_m-1)=10\\Rightarrow k+10=13"}],"diagram":null,"contentHash":"837843ac6fab5de97fa7306b1fabab0ea67e32e3fde17e0a8c4619159bbde79e","questionHtml":"\u003cp class=\"hp\">함수 \u003cspan class=\"heq\">\\(f \\left( x \\right)\\)\u003c/span>를\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\(f \\left( x \\right)\\)\u003c/span>\u003cspan class=\"heq\">\\(= \\lim\\limits_{n \\to  \\infty } {} \\dfrac{ax^{2n} +bx^{2n-1} +x}{x^{2n} +2}\\)\u003c/span> (\u003cspan class=\"heq\">\\(a,\\,b\\)\u003c/span>는 양의 상수)\u003c/p>\u003cp class=\"hp htall\">라 하자. 자연수 \u003cspan class=\"heq\">\\(m\\)\u003c/span>에 대하여 방정식 \u003cspan class=\"heq\">\\(f \\left( x \\right)\\)\u003c/span>\u003cspan class=\"heq\">\\(=2 \\left( x-1 \\right) +m\\)\u003c/span>의 실근의 개수를 \u003cspan class=\"heq\">\\(c_{m}\\)\u003c/span>이라 할 때, \u003cspan class=\"heq\">\\(c_{k}\\)\u003c/span>\u003cspan class=\"heq\">\\(=5\\)\u003c/span>인 자연수 \u003cspan class=\"heq\">\\(k\\)\u003c/span>가 존재한다.\u003cbr>\u003cspan class=\"heq\">\\(k+ \\sum\\limits_{m=1}^{\\infty } \\left( c_{m} -1 \\right)\\)\u003c/span>의 값을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"a85cf23901cd23166056a58f9cd68c44071a8b53fac07306cf97d53895f32bf2"};</script>
<script>window.HandStudyGuide={"itemId":17101,"sourceHash":"7619507d1f05823a4251d1713a9062a31eb53198b6798814fb7d4a4c0b0fdd67","contentHash":"837843ac6fab5de97fa7306b1fabab0ea67e32e3fde17e0a8c4619159bbde79e","overview":{"goal":"수열의 극한으로 생긴 세 구간의 함수와 직선의 교점을 빠짐없이 세어 \\(k\\)와 무한합을 구해요.","firstLook":"\\(|x|<1\\), \\(x=\\pm 1\\), \\(|x|>1\\)은 극한값이 서로 달라서 반드시 따로 봐야 해요.","conditions":[{"label":"교점 5개","meaning":"안쪽 1개, 경계 2개, 바깥 양·음의 근 2개가 모두 존재해야 해요."},{"label":"바깥 조각","meaning":"이차방정식의 양의 근이 1보다 큰지, 음의 근이 -1보다 작은지를 경계값으로 판단해요."}]},"chapters":[{"id":"c1","label":"극한으로 세 조각 만들기","stepIds":["s1","s2"],"question":"\\(x=\\pm 1\\)에서는 왜 양옆 조각식을 그대로 쓸 수 없나요?","hint":"\\(x^{2n}\\)과 \\(x^{2n-1}\\)을 원래 식에 직접 넣으세요.","explanation":"\\(|x|<1\\)에서는 높은 거듭제곱이 0으로 가서 \\(f(x)=x/2\\), \\(|x|>1\\)에서는 분자와 분모를 \\(x^{2n}\\)으로 나누어 \\(f(x)=a+b/x\\)예요. 하지만 \\(x=1\\)에서는 거듭제곱이 모두 1이고 \\(x=-1\\)에서는 홀수 거듭제곱만 -1이므로, 원래 식에서 \\(f(1)=(a+b+1)/3\\), \\(f(-1)=(a-b-1)/3\\)을 따로 계산해요.","check":{"prompt":"\\(x=-1\\)에서 \\(bx^{2n-1}\\)의 부호는 무엇인가요?","answer":"홀수 거듭제곱이므로 \\(-b\\)가 돼요."}},{"id":"c2","label":"교점 다섯 개로 계수 결정","stepIds":["s3","s4","s5"],"question":"바깥 조각의 양의 근과 음의 근이 각각 영역 안에 있으려면 어떤 부등식이 필요한가요?","hint":"\\(2x^2+(m-2-a)x-b=0\\)을 \\(x=1,-1\\)에서 확인하세요.","explanation":"직선은 \\(y=2x+m-2\\)예요. 안쪽 조각에서는 \\(x/2=2x+m-2\\)의 해 \\(x=(4-2m)/3\\)가 \\(-1<x<1\\)에 있어야 하므로 \\(m=1,2,3\\)일 때 한 점이 생겨요. 교점이 5개인 \\(m=k\\)에서는 두 경계도 모두 교점이어야 하므로 \\(f(1)=k\\), \\(f(-1)=k-4\\). 이를 풀면 \\(a=3k-6,b=5\\)예요. 바깥 조각의 방정식은 \\(2x^2+(k-2-a)x-b=0\\)이고 두 근의 곱이 \\(-b/2<0\\)라 양의 근과 음의 근이 하나씩 있어요. 양의 근이 1보다 큰 조건은 \\(k<a+b\\), 음의 근이 -1보다 작은 조건은 \\(k>4+a-b\\)예요. \\(a=3k-6,b=5\\)를 넣으면 뒤 조건에서 \\(k\\le 3\\), 또 \\(a>0\\)에서 \\(k\\ge 3\\)이므로 \\(k=3\\), \\((a,b)=(3,5)\\)예요.","check":{"prompt":"\\(k=3\\)에서 교점 다섯 종류는 무엇인가요?","answer":"\\(-1,1)\\) 안의 한 점, 경계 \\(x=-1,1\\) 두 점, 바깥의 음의 근과 양의 근 두 점이에요."}},{"id":"c3","label":"모든 자연수에서 교점 수 세기","stepIds":["s6","s7"],"question":"\\((a,b)=(3,5)\\)일 때 바깥 양의 근과 음의 근은 각각 어떤 \\(m\\)에서 세나요?","hint":"조건 \\(m<a+b\\), \\(m>4+a-b\\)에 값을 넣으세요.","explanation":"\\(a+b=8\\)이므로 바깥 양의 근은 \\(m<8\\)에서, \\(4+a-b=2\\)이므로 바깥 음의 근은 \\(m>2\\)에서 생겨요. 안쪽 근은 \\(m=1,2,3\\), 두 경계점은 \\(m=3\\)에서만 생겨요. 따라서 \\(c_1=c_2=2\\), \\(c_3=5\\), \\(c_4=\\cdots=c_7=2\\), \\(m\\ge 8\\)에서는 \\(c_m=1\\)예요. 그러므로 \\(\\sum_{m=1}^{\\infty}(c_m-1)=1+1+4+4=10\\), 요구값은 \\(k+10=13\\)예요.","check":{"prompt":"\\(m\\ge 8\\)에서 교점이 하나만 남는 이유는 무엇인가요?","answer":"안쪽·경계·바깥 양의 근은 모두 사라지고, \\(m>2\\)에서 존재하는 바깥 음의 근만 남기 때문이에요."}}],"takeaway":["극한으로 정의된 함수는 경계점 값을 원래 식에서 따로 계산해요.","조각별 교점 수는 근이 실제 조각의 범위 안에 있는지 끝점 부호로 확인해요."]};</script>
