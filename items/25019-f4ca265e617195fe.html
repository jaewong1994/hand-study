  <script>window.HandStudyRecord={"itemId":25019,"sourceLabel":"2026 평가원 고3 수학확통 6월 28번","adminYear":2026,"grade":3,"month":6,"number":28,"track":"확통","points":4,"scoreStatus":"confirmed_4_direct","questionText":"앞면에 숫자 $1\\,$, $2\\,$, $3\\,$, $4\\,$, $5\\,$, $6\\,$이 하나씩 적혀 있는 카드 $6\\,$장이 있다. 각 카드의 뒷면에는 앞면에 적힌 숫자와 같은 숫자가 적혀 있다. 이 $6\\,$장의 카드가 다음과 같이 놓여 있다.\n숫자 $1\\,$, $6\\,$이 적힌 카드는 뒷면이 보이도록 놓여 있고, 숫자 $2\\,$, $3\\,$, $4\\,$, $5\\,$가 적힌 카드는 앞면이 보이도록 놓여 있다.\n이 $6\\,$장의 카드와 한 개의 주사위를 사용하여 다음 시행을 한다.\n주사위를 한 번 던져 나온 눈의 수가 $k\\,$일 때, $k\\,$가 홀수이면 $k$ 이하의 수가 적힌 카드를 모두 한 번씩 뒤집고, $k\\,$가 짝수이면 $k$ 이상의 수가 적힌 카드를 모두 한 번씩 뒤집는다.\n이 시행을 $4\\,$번 반복한 후 $6\\,$장의 카드가 모두 앞면이 보이도록 놓여 있을 확률은?\n① $\\frac{19}{162}\\,$ ② $\\frac{13}{108}\\,$ ③ $\\frac{10}{81}\\,$\n④ $\\frac{41}{324}\\,$ ⑤ $\\frac{7}{54}$","answer":"③","sourceHash":"1c20a8553a62eb0784a6c3c0137ee0dd9c010a634cff5fb2505f438ff5c93b21","steps":[{"id":"s1","latex":"\\text{뒤집은 횟수의 홀짝}=(1,0,0,0,0,1)\\pmod2"},{"id":"s2","latex":"\\begin{array}{c|rrrrrr}\\text{눈}&1&2&3&4&5&6\\\\\\hline\\text{뒤집는 카드}&1&2\\sim6&1\\sim3&4\\sim6&1\\sim5&6\\end{array}"},{"id":"s3","latex":"\\text{카드 }1,6\\text{의 뒤집힘 횟수 홀수}\\Rightarrow\\text{홀수 눈, 짝수 눈 횟수 모두 홀수}"},{"id":"s4","latex":"(\\text{홀수 횟수},\\text{짝수 횟수})=(1,3),\\ (3,1)"},{"id":"s5","latex":"\\begin{array}{c|c|c}\\text{홀수 눈}&\\text{짝수 눈 세 개}&\\text{경우의 수}\\\\\\hline1&(6,6,6),(6,4,4),(6,2,2)&4+12+12\\\\3&(2,4,6)&24\\\\5&(2,2,2),(2,4,4),(2,6,6)&4+12+12\\end{array}"},{"id":"s6","latex":"\\text{홀수 }1:\\ (6,6,6),(6,4,4),(6,2,2)\\Rightarrow\\frac{4!}{3!},\\frac{4!}{2!},\\frac{4!}{2!}"},{"id":"s7","latex":"\\text{홀수 }3:\\ (2,4,6)\\Rightarrow4!,\\qquad\\text{홀수 }5:\\ (2,2,2),(2,4,4),(2,6,6)"},{"id":"s8","latex":"1\\leftrightarrow6,\\ 2\\leftrightarrow5,\\ 3\\leftrightarrow4:\\quad(1,3)\\leftrightarrow(3,1)"},{"id":"s9","latex":"\\frac{2(28+24+28)}{6^4}=\\frac{10}{81}"}],"diagram":null,"contentHash":"cb39dcc50fe8c77d70f924e8c35eee01e26f8cad0902de7ad51be0fafa5ad8a4","questionHtml":"\u003cdiv>앞면에 숫자 $1\\,$, $2\\,$, $3\\,$, $4\\,$, $5\\,$, $6\\,$이 하나씩 적혀 있는 카드 $6\\,$장이 있다. 각 카드의 뒷면에는 앞면에 적힌 숫자와 같은 숫자가 적혀 있다. 이 $6\\,$장의 카드가 다음과 같이 놓여 있다.\u003cbr>숫자 $1\\,$, $6\\,$이 적힌 카드는 뒷면이 보이도록 놓여 있고, 숫자 $2\\,$, $3\\,$, $4\\,$, $5\\,$가 적힌 카드는 앞면이 보이도록 놓여 있다.\u003cbr>이 $6\\,$장의 카드와 한 개의 주사위를 사용하여 다음 시행을 한다.\u003cbr>주사위를 한 번 던져 나온 눈의 수가 $k\\,$일 때, $k\\,$가 홀수이면 $k$ 이하의 수가 적힌 카드를 모두 한 번씩 뒤집고, $k\\,$가 짝수이면 $k$ 이상의 수가 적힌 카드를 모두 한 번씩 뒤집는다.\u003cbr>이 시행을 $4\\,$번 반복한 후 $6\\,$장의 카드가 모두 앞면이 보이도록 놓여 있을 확률은?\u003cbr>① $\\frac{19}{162}\\,$ ② $\\frac{13}{108}\\,$ ③ $\\frac{10}{81}\\,$\u003cbr>④ $\\frac{41}{324}\\,$ ⑤ $\\frac{7}{54}$\u003c/div>\u003cp>\u003cimg src=\"../assets/figures/603cb9efc540ca81a170091b.png\" alt=\"문항 도형\">\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"f4ca265e617195fe622b32d95f306a5ec578fcdcb9a5f5c4289d1596f73d738d"};</script>
