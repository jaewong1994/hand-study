<script>window.HandStudyGuide={"itemId":18031,"sourceHash":"f6800dc50d5d634d3a1cfe7eceb74995f8e009d91b6c24ac79bafdc690aefff5","contentHash":"67bcec61fb9be90d5a5da9fa097a31deeaa5870e03fdfc885f58679077f685f1","overview":{"goal":"도함수의 세 근을 배치하고 수평선이 세 번 이상 만나는 첫 높이로 남은 근을 정해요.","firstLook":"\\(f'(1)=0\\)이고, \\(f'(a)\\le0\\)인 가장 큰 \\(a\\)가 2이므로 도함수의 가장 큰 근은 2예요.","conditions":[{"label":"도함수 부호의 끝","meaning":"\\(f'\\le0\\)인 구간의 오른쪽 끝이 2예요."},{"label":"세 교점의 첫 높이","meaning":"두 극솟값 가운데 높은 쪽의 높이가 \\(8/3\\)이에요."}]},"chapters":[{"id":"c1","label":"도함수의 세 근으로 함수를 적분해요","stepIds":["s1","s2"],"question":"\\(f'(x)\\)와 두 극값은 \\(c\\)로 어떻게 나타날까요?","hint":"도함수의 최고차항 계수는 4이고 근을 \\(1,2,c\\)로 둬요.","explanation":"\\(f'(x)=4(x-1)(x-2)(x-c)\\)로 둘 수 있고, 가장 큰 근이 2여야 하므로 \\(c\\le2\\)예요. 이를 전개해 적분하고 \\(f(0)=0\\)을 쓰면 \\(f(1)=1-10c/3\\), \\(f(2)=-8c/3\\)을 얻어요.","check":{"prompt":"도함수 앞의 계수가 왜 4인가요?","answer":"최고차항이 \\(x^4\\)인 사차함수를 미분하면 최고차항이 \\(4x^3\\)이기 때문이에요."}},{"id":"c2","label":"극점의 순서를 먼저 좁혀요","stepIds":["s3","s4"],"question":"왜 남은 근은 \\(c<1\\)이어야 할까요?","hint":"\\(1\\le c\\le2\\)일 때 두 극솟값의 높이가 \\(8/3\\)이 될 수 있는지 봐요.","explanation":"\\(1<c<2\\)이면 극솟값은 \\(f(1)\\), \\(f(2)\\)인데 둘 다 음수라 세 교점 이상이 처음 생기는 높이 \\(8/3\\)과 맞지 않아요. \\(c=1\\)이나 \\(c=2\\)에서는 도함수에 중근이 생겨 극솟점이 하나뿐이라 세 교점을 만드는 첫 높이라는 조건을 만족하지 못해요. 따라서 \\(c<1\\)이고, 극솟점은 \\(x=c,2\\), 극댓점은 \\(x=1\\)이에요.","check":{"prompt":"\\(1<c<2\\)에서 \\(f(1),f(2)\\)가 모두 음수인 이유는 무엇인가요?","answer":"\\(f(1)=1-10c/3<1-10/3<0\\), \\(f(2)=-8c/3<0\\)이기 때문이에요."}},{"id":"c3","label":"두 극솟값 후보를 비교해요","stepIds":["s5","s6"],"question":"높이 \\(8/3\\)은 왜 \\(f(2)\\)여야 할까요?","hint":"\\(f(c)\\)를 직접 정리해 부호를 확인해요.","explanation":"수평선이 세 점 이상에서 처음 만나는 높이는 두 극솟값 \\(f(c),f(2)\\) 가운데 높은 값이에요. 그런데 \\(f(c)=-c^2\\{(c-3)^2+3\\}/3\\le0\\)이라 \\(8/3\\)이 될 수 없어요. 따라서 \\(f(2)=8/3\\)이고 \\(-8c/3=8/3\\)에서 \\(c=-1\\)이에요.","check":{"prompt":"왜 두 극솟값 가운데 높은 값에서 세 교점이 처음 생기나요?","answer":"낮은 우물만 수평선이 가로지를 때는 교점이 둘뿐이고, 다른 극솟점에 닿는 순간 그 접점이 더해져 처음 세 점이 되기 때문이에요."}},{"id":"c4","label":"함수를 완성해 값을 구해요","stepIds":["s7","s8"],"question":"\\(c=-1\\)일 때 \\(f(3)\\)은 얼마일까요?","hint":"도함수를 적분한 식에 \\(c=-1\\)을 넣어요.","explanation":"\\(f(x)=x^4-8x^3/3-2x^2+8x\\)이고, \\(f(3)=81-72-18+24=15\\)예요.","check":{"prompt":"\\(f(2)\\)를 다시 넣으면 조건과 맞나요?","answer":"\\(16-64/3-8+16=8/3\\)이어서 주어진 높이와 맞아요."}}],"takeaway":["도함수 부호 조건은 근의 순서를 정하고, 수평선 교점 수 조건은 여러 극값의 높이를 비교하게 해요.","세 교점이 처음 생기는 높이는 두 극솟값 가운데 높은 쪽임을 그래프 모양으로 확인해요."]};</script>
