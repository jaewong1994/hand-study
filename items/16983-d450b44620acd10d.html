<script>window.HandStudyRecord={"itemId":16983,"sourceLabel":"2021 교육청 고3 수학기하 10월 29번","adminYear":2021,"grade":3,"month":10,"number":29,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 두 초점이 ${ F}$, ${ F'}$인 쌍곡선 $x^{2}-\\frac{y^{2}}{ 16}=1$이 있다. 쌍곡선 위에 있고 제$1$사분면에 있는 점 ${ P}$에 대하여 점 ${ F}$에서 선분 ${ PF '}$에 내린 수선의 발을 ${ Q}$라 하고, $∠{ FQP }$의 이등분선이 선분 ${ PF }$와 만나는 점을 ${ R}$라 하자. $4\\,\\overline{ PR }\\,=3\\,\\overline{ RF }$일 때, 삼각형 ${ PF 'F }$의 넓이를 구하시오. (단, 점 ${ F}$의 $x$ 좌표는 양수이고, $∠{ F' PF } \u003c 90°$이다.) [4점]","answer":"32","sourceHash":"ea5894ca2ce0f5fba005a1eb7c8884b6e62a5f88c01c85079bf8643c3153cfc3","steps":[{"id":"s1","latex":"QR\\text{는 }\\angle PQF\\text{의 이등분선}\\Rightarrow PQ:QF=PR:RF=3:4"},{"id":"s2","latex":"PQ=3k,\\ QF=4k,\\quad PF=5k"},{"id":"s3","latex":"P\\text{는 오른쪽 가지}\\Rightarrow PF'=PF+2=5k+2"},{"id":"s4","latex":"Q\\in PF'\\Rightarrow QF'=PF'-PQ=2k+2"},{"id":"s5","latex":"FF'=2\\sqrt{17},\\quad (2\\sqrt{17})^2=(4k)^2+(2k+2)^2"},{"id":"s6","latex":"(5k-8)(k+2)=0,\\ k>0\\Rightarrow k=\\frac85"},{"id":"s7","latex":"PF'=10,\\ QF=\\frac{32}5\\Rightarrow S=\\frac12\\cdot10\\cdot\\frac{32}5=32"}],"diagram":null,"contentHash":"7c10f59c0cf74e2094acad82e943dd87b6ba7683556369b56b00b587af115920","questionHtml":"\u003cp class=\"hp htall\">그림과 같이 두 초점이 \u003cspan class=\"heq\">\\({F}\\)\u003c/span>, \u003cspan class=\"heq\">\\({F'}\\)\u003c/span>인 쌍곡선 \u003cspan class=\"heq\">\\(x^{2}-\\dfrac{y^{2}}{ 16}=1\\)\u003c/span>이 있다. 쌍곡선 위에 있고 제\u003cspan class=\"heq\">\\(1\\)\u003c/span>사분면에 있는 점 \u003cspan class=\"heq\">\\({P}\\)\u003c/span>에 대하여 점 \u003cspan class=\"heq\">\\({F}\\)\u003c/span>에서 선분 \u003cspan class=\"heq\">\\({PF'}\\)\u003c/span>에 내린 수선의 발을 \u003cspan class=\"heq\">\\({Q}\\)\u003c/span>라 하고, \u003cspan class=\"heq\">\\(∠{FQP }\\)\u003c/span>의 이등분선이 선분 \u003cspan class=\"heq\">\\({PF }\\)\u003c/span>와 만나는 점을 \u003cspan class=\"heq\">\\({R}\\)\u003c/span>라 하자. \u003cspan class=\"heq\">\\(4\\,\\overline{PR }\\,=3\\,\\overline{RF }\\)\u003c/span>일 때, 삼각형 \u003cspan class=\"heq\">\\({PF'F }\\)\u003c/span>의 넓이를 구하시오. (단, 점 \u003cspan class=\"heq\">\\({F}\\)\u003c/span>의 \u003cspan class=\"heq\">\\(x\\)\u003c/span> 좌표는 양수이고,\u003cbr>\u003cspan class=\"heq\">\\(∠{F'PF } \\lt  90^{\\circ}\\)\u003c/span>이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/a6e488db54411cb34c54f9be.png\" style=\"width:290px;max-width:100%\">\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"d450b44620acd10d2ef752013c01e9e5abad488e801a29c030781ad9b8fc7188"};</script>
<script>window.HandStudyGuide={"itemId":16983,"sourceHash":"ea5894ca2ce0f5fba005a1eb7c8884b6e62a5f88c01c85079bf8643c3153cfc3","contentHash":"7c10f59c0cf74e2094acad82e943dd87b6ba7683556369b56b00b587af115920","overview":{"goal":"직각삼각형의 각의 이등분선으로 길이의 비를 만들고, 쌍곡선의 초점 거리차와 초점 사이 거리로 크기를 정해 넓이를 구해요.","firstLook":"\\(Q\\)는 \\(F\\)에서 \\(PF'\\)에 내린 수선의 발이라 삼각형 \\(PQF\\)가 직각이에요. 각의 이등분선 조건이 이 직각삼각형을 3:4:5로 정해 줘요.","conditions":[{"label":"이등분선","meaning":"삼각형 \\(PQF\\)에서 \\(PR:RF=PQ:QF\\)예요."},{"label":"오른쪽 가지","meaning":"양의 x좌표 초점 F가 P에 더 가까워 \\(PF'-PF=2\\)예요."}]},"chapters":[{"id":"c1","label":"직각삼각형의 세 변을 비로 나타내요","stepIds":["s1","s2"],"question":"\\(4PR=3RF\\)에서 왜 \\(PQ:QF=3:4\\)일까요?","hint":"R은 각 \\(PQF\\)의 이등분선과 반대편 \\(PF\\)의 교점이에요.","explanation":"\\(4PR=3RF\\)이므로 \\(PR:RF=3:4\\)예요. 삼각형 \\(PQF\\)에서 \\(QR\\)은 \\(\\angle PQF\\)의 이등분선이므로 각의 이등분선 정리에 따라 \\(PQ:QF=PR:RF=3:4\\)예요.\n\n또 \\(FQ\\perp PF'\\)이고 \\(P,Q,F'\\)가 일직선이므로 \\(PQ\\perp QF\\)예요. 따라서 \\(PQ=3k,QF=4k\\)로 두면 피타고라스 정리로 \\(PF=5k\\)예요. \\(k>0\\)은 실제 길이의 비례상수예요.","check":{"prompt":"\\(PF=5k\\)는 어떤 수직 관계에서 나오나요?","answer":"Q가 F에서 선분 PF'에 내린 수선의 발이므로 \\(PQ\\perp QF\\)이고, 삼각형 PQF가 3:4:5 직각삼각형이 돼요."}},{"id":"c2","label":"쌍곡선의 초점 거리와 점 순서를 연결해요","stepIds":["s3","s4","s5"],"question":"\\(QF'=2k+2\\)와 초점 사이 거리 식은 어떻게 나오나요?","hint":"오른쪽 가지의 거리차와 선분 \\(PF'\\) 위 순서 \\(P,Q,F'\\)를 사용해요.","explanation":"쌍곡선은 \\(x^2-y^2/16=1\\)이므로 \\(a=1,c=\\sqrt{17}\\), 초점 사이 거리는 \\(FF'=2\\sqrt{17}\\)이에요. P가 오른쪽 가지에 있어 \\(PF'-PF=2a=2\\)이므로 \\(PF'=5k+2\\)예요.\n\nQ는 선분 \\(PF'\\) 위의 수선의 발이고 주어진 각도 예각이라 그림의 순서는 \\(P,Q,F'\\)예요. 따라서 \\(QF'=PF'-PQ=(5k+2)-3k=2k+2\\)예요. 직각삼각형 \\(FQF'\\)에서 \\(QF=4k\\), \\(QF'=2k+2\\), 빗변 \\(FF'=2\\sqrt{17}\\)이므로 \\((4k)^2+(2k+2)^2=68\\)이에요.","check":{"prompt":"\\(QF'=PF'+PQ\\)로 쓰지 않는 이유는 무엇인가요?","answer":"Q가 선분 PF' 안에 있고 순서가 P,Q,F'이므로 전체 PF'에서 부분 PQ를 빼야 해요."}},{"id":"c3","label":"양의 길이 해를 골라 넓이를 구해요","stepIds":["s6","s7"],"question":"이차식의 두 해 중 어느 것을 택하고 넓이는 어떻게 구할까요?","hint":"\\((5k-8)(k+2)=0\\)에서 길이의 비례상수는 양수예요.","explanation":"식을 정리하면 \\((5k-8)(k+2)=0\\)이므로 \\(k=8/5\\) 또는 \\(-2\\)예요. 길이 \\(PQ=3k,QF=4k\\)가 양수여야 하므로 \\(k=8/5\\)만 가능해요.\n\n이때 \\(PF'=5k+2=10\\), \\(QF=4k=32/5\\)예요. \\(QF\\)는 \\(PF'\\)에 수직이므로 삼각형 \\(PF'F\\)에서 밑변을 \\(PF'\\)로 잡았을 때의 높이예요. 따라서 넓이는 \\((1/2)\\times10\\times(32/5)=32\\)예요.","check":{"prompt":"넓이의 높이로 \\(QF\\)를 쓸 수 있는 이유는 무엇인가요?","answer":"Q가 선분 PF' 위에 있고 FQ가 PF'에 수직이므로 F에서 밑변 PF'까지의 수직거리이기 때문이에요."}}],"takeaway":["각의 이등분선 정리와 직각 조건이 함께 있으면 세 변의 비를 피타고라스 수로 나타낼 수 있어요.","쌍곡선의 거리차는 점이 있는 가지와 가까운 초점을 확인해 부호를 정해요.","수선의 발이 실제 선분 안에 있는지 확인하면 길이의 덧셈과 뺄셈 방향, 넓이의 높이가 분명해져요."]};</script>
