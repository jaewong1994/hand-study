<script>window.HandStudyRecord={"adminYear":2026,"answer":"③","contentHash":"366bc5536f8795f9e211c63481c1f41bfa40655d056233afbb3b384cb63c4853","diagram":null,"editionHash":"0e0bd6325df08c5e8acb2dd11c423862cbc86e8c6985ec9eb4ed9e4d064655d0","grade":3,"graphHash":"","graphPlan":null,"itemId":25027,"learningHash":"eb67ae064ab60009522b2a7b111047a9285b7ec23344a10941d6006774449cc0","month":6,"number":28,"points":4,"preview":false,"questionHtml":"\u003cdiv>좌표평면에서 양수 $t\\,$에 대하여 직선 $y=t\\,$가 두 곡선 $y=e^{2x}-e^{-x}+1\\,$, $y=e^{2x}\\,$과 만나는 점을 각각 ${{P}}\\,$, ${{Q}}\\,$라 하자. 점 ${{P}}\\,$를 지나고 $x\\,$축에 수직인 직선이 곡선 $y=e^{2x}\\,$과 만나는 점의 $y\\,$좌표를 $f \\left(t \\right)\\,$, 점 ${{Q}}\\,$를 지나고 $x\\,$축에 수직인 직선이 곡선 $y=e^{2x}-e^{-x}+1\\,$과 만나는 점의 $y\\,$좌표를 $g \\left(t \\right)\\,$라 할 때, 두 함수 $f \\left(t \\right)\\,$, $g \\left(t \\right)\\,$는 구간 $\\left(0,\\, \\infty \\right)\\,$에서 미분가능한 함수이다. $\\lim_{t\\,\\rightarrow\\, 1}\\frac{9f&#x27; \\left(t \\right)-4g&#x27; \\left(t \\right)}{t-1}\\,$의 값은?\u003cbr>① $1\\,$ ② $3\\,$ ③ $5\\,$\u003cbr>④ $7\\,$ ⑤ $9$\u003c/div>\u003cp>\u003cimg src=\"../assets/figures/a4fc7dd9384764aedc751da5.png\" alt=\"문항 도형\">\u003c/p>","questionText":"좌표평면에서 양수 $t\\,$에 대하여 직선 $y=t\\,$가 두 곡선 $y=e^{2x}-e^{-x}+1\\,$, $y=e^{2x}\\,$과 만나는 점을 각각 ${{P}}\\,$, ${{Q}}\\,$라 하자. 점 ${{P}}\\,$를 지나고 $x\\,$축에 수직인 직선이 곡선 $y=e^{2x}\\,$과 만나는 점의 $y\\,$좌표를 $f \\left(t \\right)\\,$, 점 ${{Q}}\\,$를 지나고 $x\\,$축에 수직인 직선이 곡선 $y=e^{2x}-e^{-x}+1\\,$과 만나는 점의 $y\\,$좌표를 $g \\left(t \\right)\\,$라 할 때, 두 함수 $f \\left(t \\right)\\,$, $g \\left(t \\right)\\,$는 구간 $\\left(0,\\, \\infty \\right)\\,$에서 미분가능한 함수이다. $\\lim_{t\\,\\rightarrow\\, 1}\\frac{9f\\,' \\left(t \\right)-4g\\,' \\left(t \\right)}{t-1}\\,$의 값은?\n① $1\\,$ ② $3\\,$ ③ $5\\,$\n④ $7\\,$ ⑤ $9$","scoreEvidenceOverlay":"inventory/score-evidence-10.json","scoreStatus":"confirmed_4_direct","sourceHash":"402c3786ae884d6133bfae65ab99ae62e4401a27b6741f814d5860259da817a0","sourceLabel":"2026 평가원 고3 수학미적분 6월 28번","stepExplanations":{"s2":{"body":"\\(t=e^{2u}-e^{-u}+1\\)은 \\(u\\)를 초등식으로 풀기 어렵습니다. 대신 양변을 \\(t\\)로 미분하면 \\(1=(2e^{2u}+e^{-u})u'\\)이고, \\(f=e^{2u}\\)에 연결하여 \\(f'=2e^{2u}u'=2e^{3u}/(2e^{3u}+1)\\)을 얻습니다.","skillTags":["implicit-differentiation","parameter-function"],"title":"P의 x좌표를 직접 풀지 않고 미분하기"},"s4":{"body":"\\(f'(t)=2e^{3u}/(2e^{3u}+1)\\)을 먼저 \\(u\\)로 미분하면 \\(6e^{3u}/(2e^{3u}+1)^2\\)입니다. 여기에 \\(u'=1/(2e^{2u}+e^{-u})\\)를 곱하고 \\(t=1,u=0\\)을 넣으면 \\(f''(1)=2/9\\)입니다.","skillTags":["second-derivative","chain-rule"],"title":"f''(1)의 중간 계산"},"s7":{"body":"\\(H(t)=9f'(t)-4g'(t)\\)로 놓으면 \\(H(1)=0\\)입니다. 따라서 주어진 극한은 \\(\\lim_{t\\to1}\\{H(t)-H(1)\\}/(t-1)=H'(1)\\)로, 미분계수의 정의 그 자체입니다. \\(H'(1)=9f''(1)-4g''(1)=2+3=5\\)입니다.","skillTags":["derivative-definition","second-derivative"],"title":"미분계수의 정의로 마지막 극한 계산하기"}},"steps":[{"id":"s1","latex":"\\mathrm P=(u,t),\\quad t=e^{2u}-e^{-u}+1,\\quad f(t)=e^{2u}"},{"id":"s2","latex":"u'=\\frac1{2e^{2u}+e^{-u}},\\quad f'(t)=\\frac{2e^{3u}}{2e^{3u}+1}"},{"id":"s3","latex":"t=1\\Rightarrow u=0,\\quad f'(1)=\\frac23"},{"id":"s4","latex":"f''(t)=\\frac{6e^{3u}}{(2e^{3u}+1)^2}\\,u'\\Rightarrow f''(1)=\\frac29"},{"id":"s5","latex":"g(t)=t-t^{-1/2}+1,\\quad g'(1)=\\frac32,\\quad g''(1)=-\\frac34"},{"id":"s6","latex":"9f'(1)-4g'(1)=0"},{"id":"s7","latex":"\\lim_{t\\to1}\\frac{9f'(t)-4g'(t)}{t-1}=9f''(1)-4g''(1)=5"}],"track":"미적분"};</script>
<script>window.HandStudyGuide={"itemId":25027,"sourceHash":"402c3786ae884d6133bfae65ab99ae62e4401a27b6741f814d5860259da817a0","contentHash":"366bc5536f8795f9e211c63481c1f41bfa40655d056233afbb3b384cb63c4853","overview":{"goal":"교점의 좌표로 정의된 \\(f(t),g(t)\\)를 매개변수로 미분하고, 마지막 극한을 도함수의 정의로 계산해요.","firstLook":"점 \\(P\\)의 \\(x\\)좌표를 \\(u\\)라고 두면 \\(t\\)와 \\(f(t)\\)가 모두 \\(u\\)의 식으로 나타나요. \\(u\\)를 직접 풀기보다 이 관계를 그대로 미분하는 것이 핵심입니다.","conditions":[{"label":"점 P","meaning":"\\(t=e^{2u}-e^{-u}+1\\), \\(f(t)=e^{2u}\\)를 동시에 만족해요."},{"label":"점 Q","meaning":"\\(y=e^{2x}\\)와 \\(y=t\\)의 교점에서 \\(x\\)를 구해 다른 곡선의 높이 \\(g(t)\\)를 만들어요."},{"label":"미분가능성","meaning":"교점 관계에서 얻은 매끄러운 식을 한 번 더 미분해 \\(t=1\\) 근처의 변화율을 계산할 수 있어요."}]},"chapters":[{"id":"c1","label":"P의 좌표를 매개변수로 미분하기","stepIds":["s1","s2"],"question":"\\(u\\)를 \\(t\\)의 식으로 풀지 않고도 \\(f^{\\prime}(t)\\)를 구할 수 있을까요?","hint":"\\(t=e^{2u}-e^{-u}+1\\)과 \\(f=e^{2u}\\)를 모두 \\(t\\)로 미분하세요.","explanation":"\\(u=u(t)\\)로 보고 미분하면 \\(1=(2e^{2u}+e^{-u})u^{\\prime}\\)예요. 한편 \\(f^{\\prime}(t)=2e^{2u}u^{\\prime}\\)이므로 두 식을 합쳐 \\(f^{\\prime}(t)=2e^{3u}/(2e^{3u}+1)\\)을 얻습니다. 복잡한 교점의 \\(x\\)좌표를 먼저 풀 필요가 없어요.","check":{"prompt":"\\(t=1\\)일 때 \\(u\\)는 얼마인가요?","answer":"\\(e^{2u}-e^{-u}=0\\)에서 \\(e^{3u}=1\\)이므로 \\(u=0\\)입니다."}},{"id":"c2","label":"f의 두 번째 도함숫값 구하기","stepIds":["s3","s4"],"question":"마지막 극한에 왜 \\(f^{\\prime\\prime}(1)\\)이 필요할까요?","hint":"분자에 \\(f^{\\prime}(t)\\)가 있으므로 \\(t=1\\) 근처의 변화율을 생각하세요.","explanation":"먼저 \\(u=0\\)을 넣어 \\(f^{\\prime}(1)=2/3\\)을 얻어요. \\(f^{\\prime}(t)=2e^{3u}/(2e^{3u}+1)\\)을 다시 \\(t\\)로 미분하면 \\(6e^{3u}(2e^{3u}+1)^{-2}u^{\\prime}\\)이고, \\(u=0\\), \\(u^{\\prime}=1/3\\)을 넣으면 \\(f^{\\prime\\prime}(1)=2/9\\)입니다.","check":{"prompt":"\\(t=1\\)에서 \\(u^{\\prime}\\)의 값은 얼마인가요?","answer":"\\(1/(2e^{0}+e^{0})=1/3\\)입니다."}},{"id":"c3","label":"Q에서 g를 t의 식으로 만들기","stepIds":["s5"],"question":"점 \\(Q\\)를 이용한 \\(g(t)\\)는 어떻게 바로 나타낼 수 있을까요?","hint":"\\(e^{2x}=t\\)이면 \\(e^{-x}\\)를 \\(t\\)로 나타내세요.","explanation":"\\(Q\\)에서는 \\(e^{2x}=t\\)이고 \\(e^{-x}=t^{-1/2}\\)예요. 따라서 다른 곡선의 높이는 \\(g(t)=t-t^{-1/2}+1\\)입니다. 미분하면 \\(g^{\\prime}(1)=3/2\\), \\(g^{\\prime\\prime}(1)=-3/4\\)를 얻어요.","check":{"prompt":"\\(t>0\\) 조건이 필요한 이유는 무엇인가요?","answer":"\\(e^{2x}=t\\)의 교점과 \\(t^{-1/2}\\) 표현이 양수 \\(t\\)에서 정의되기 때문입니다."}},{"id":"c4","label":"극한을 도함수 정의로 읽기","stepIds":["s6","s7"],"question":"분자가 \\(t=1\\)에서 0이 되는 것을 어떻게 활용할까요?","hint":"\\(h(t)=9f^{\\prime}(t)-4g^{\\prime}(t)\\)로 묶어 보세요.","explanation":"\\(9f^{\\prime}(1)-4g^{\\prime}(1)=6-6=0\\)이므로 분자는 \\(h(t)-h(1)\\)로 쓸 수 있어요. 따라서 주어진 극한은 \\(h^{\\prime}(1)\\)이라는 도함수의 정의 그대로입니다. 계산하면 \\(9f^{\\prime\\prime}(1)-4g^{\\prime\\prime}(1)=2+3=5\\)예요.","check":{"prompt":"이 계산에서 별도의 근삿값 전개가 필요한가요?","answer":"아니요. \\(h(1)=0\\)을 확인하면 도함수의 정의로 바로 계산할 수 있습니다."}}],"takeaway":["교점 좌표를 직접 풀기 어렵다면 좌표를 매개변수로 두고 두 관계를 함께 미분해요.","마지막에 도함수의 변화율이 나오면 필요한 미분 차수를 거꾸로 판단해 미리 계산해요.","\\(0/0\\) 모양의 극한은 분자를 \\(h(t)-h(1)\\)로 만들 수 있는지 먼저 확인해요."]};</script>
