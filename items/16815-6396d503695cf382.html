<script>window.HandStudyRecord={"itemId":16815,"sourceLabel":"2020 교육청 고3 수리나형 4월 30번","adminYear":2020,"grade":3,"month":4,"number":30,"track":"수리나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"양의 실수 $t$와 최고차항의 계수가 $1$인 삼차함수 $f(x)$에 대하여 함수\n $g(t)= \\frac{f(t)-f(0)}{t}$\n이라 하자. 두 함수 $f(x)$와 $g(t)$가 다음 조건을 만족시킨다.\n(가) 함수 $g(t)$의 최솟값은 $0$이다.(나) $x$에 대한 방정식 $f'(x)=g(a)$를 만족시키는 $x$의 값은 $a$와 $\\frac{5}{3}$이다. (단, $a> \\frac{5}{3}$인 상수이다.)\n자연수 $m$에 대하여 집합 $A _{m}$을\n $A _{m} = \\left\\{ x\\,|\\,f'(x)=g(m),\\,0\u003cx{\\leq}m \\right\\}$\n이라 할 때, $n(A _{m} )=2$를 만족시키는 모든 자연수 $m$의 값의 합을 구하시오. [4점]","answer":"35","sourceHash":"a75cc8a7ede0ec88e4cd66394ccbb0deeb1ac352783da88c081b6977c796c565","steps":[{"id":"s1","latex":"g(t)=(t-k)^2\\ (k>0),\\quad f(x)-f(0)=x(x-k)^2"},{"id":"s2","latex":"f\\prime(x)=(x-k)(3x-k),\\quad f\\prime(a)=g(a)\\Rightarrow2a(a-k)=0\\Rightarrow a=k"},{"id":"s3","latex":"k/3=5/3\\Rightarrow k=a=5"},{"id":"s4","latex":"h_m(x)=f\\prime(x)-g(m)=3x^2-20x+25-(m-5)^2"},{"id":"s5","latex":"\\text{꼭짓점 }x=10/3,\\quad h_m(10/3)=-25/3-(m-5)^2\u003c0"},{"id":"s6","latex":"\\text{두 근이 }(0,m]\\text{에 있음}\\iff m>10/3,\\ h_m(0)>0,\\ h_m(m)\\ge0"},{"id":"s7","latex":"0\u003cm\u003c10,\\quad2m(m-5)\\ge0\\Rightarrow m=5,6,7,8,9"},{"id":"s8","latex":"5+6+7+8+9=35"}],"diagram":null,"contentHash":"8494a3990c64c39008614210d045ebed502baeeb7bcad7d4e6dbfe6c45427a81","questionHtml":"\u003cp class=\"hp\">양의 실수 \u003cspan class=\"heq\">\\(t\\)\u003c/span>와 최고차항의 계수가 \u003cspan class=\"heq\">\\(1\\)\u003c/span>인 삼차함수 \u003cspan class=\"heq\">\\(f(x)\\)\u003c/span>에 대하여 함수\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\(g(t)= \\dfrac{f(t)-f(0)}{t}\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">이라 하자. 두 함수 \u003cspan class=\"heq\">\\(f(x)\\)\u003c/span>와 \u003cspan class=\"heq\">\\(g(t)\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cp class=\"hp htall\">\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) 함수 \u003cspan class=\"heq\">\\(g(t)\\)\u003c/span>의 최솟값은 \u003cspan class=\"heq\">\\(0\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp htall\">(나) \u003cspan class=\"heq\">\\(x\\)\u003c/span>에 대한 방정식 \u003cspan class=\"heq\">\\(f'(x)=g(a)\\)\u003c/span>를 만족시키는 \u003cspan class=\"heq\">\\(x\\)\u003c/span>의 값은 \u003cspan class=\"heq\">\\(a\\)\u003c/span>와 \u003cspan class=\"heq\">\\(\\dfrac{5}{3}\\)\u003c/span>이다. (단, \u003cspan class=\"heq\">\\(a\\gt  \\dfrac{5}{3}\\)\u003c/span>인 상수이다.)\u003c/p>\u003c/div>\u003c/p>\u003cp class=\"hp\">자연수 \u003cspan class=\"heq\">\\(m\\)\u003c/span>에 대하여 집합 \u003cspan class=\"heq\">\\(A_{m}\\)\u003c/span>을\u003c/p>\u003cp class=\"hp\">&emsp;\u003cspan class=\"heq\">\\(A_{m} = \\left\\{ x\\,|\\,f'(x)=g(m),\\,0\\lt x{\\leq}m \\right\\}\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">이라 할 때, \u003cspan class=\"heq\">\\(n(A_{m} )=2\\)\u003c/span>를 만족시키는 모든 자연수 \u003cspan class=\"heq\">\\(m\\)\u003c/span>의 값의 합을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"6396d503695cf3829bfe9516d4f356efbdf0e5ef717a2c02637cf5d074b59e5d"};</script>
<script>window.HandStudyGuide={"itemId":16815,"sourceHash":"a75cc8a7ede0ec88e4cd66394ccbb0deeb1ac352783da88c081b6977c796c565","contentHash":"8494a3990c64c39008614210d045ebed502baeeb7bcad7d4e6dbfe6c45427a81","overview":{"goal":"할선의 기울기 \\(g(t)\\)의 최솟값으로 삼차함수를 정하고, 이차방정식의 두 근이 주어진 구간 안에 드는 자연수 \\(m\\)을 찾아요.","firstLook":"\\(f\\)가 최고차항 계수 \\(1\\)인 삼차함수이므로 \\(g(t)\\)는 최고차항 계수 \\(1\\)인 이차함수예요.","conditions":[{"label":"(가)","meaning":"양수 범위에서 이차함수 \\(g\\)가 최솟값 \\(0\\)을 가지므로 \\(g(t)=(t-k)^2\\), \\(k>0\\)이에요."},{"label":"(나)","meaning":"같은 방정식의 두 근 \\(a,5/3\\)을 이용해 \\(k\\)를 정해요."}]},"chapters":[{"id":"c1","label":"최솟값에서 삼차함수의 꼴을 정해요","stepIds":["s1","s2","s3"],"question":"왜 \\(g(t)\\)를 \\((t-k)^2\\)로 둘 수 있고 \\(k\\)는 양수여야 할까요?","hint":"정의역이 양수이고 최솟값 \\(0\\)을 실제로 가져야 해요.","explanation":"\\(g(t)=\\{f(t)-f(0)\\}/t\\)는 최고차항 계수가 \\(1\\)인 이차함수예요. 양수 \\(t\\)에서 최솟값 \\(0\\)을 가지므로 \\(g(t)=(t-k)^2\\), \\(k>0\\)으로 쓸 수 있어요. 따라서 \\(f(x)-f(0)=x(x-k)^2\\), \\(f'(x)=(x-k)(3x-k)\\)예요. \\(x=a\\)가 \\(f'(x)=g(a)\\)의 근이므로 \\((a-k)(3a-k)=(a-k)^2\\), 즉 \\(2a(a-k)=0\\)이에요. \\(a>0\\)이라 \\(a=k\\)이고, 이때 방정식의 두 근은 \\(k,k/3\\)이에요. 다른 근이 \\(5/3\\)이므로 \\(k=a=5\\)예요.","check":{"prompt":"\\(2a(a-k)=0\\)에서 \\(a=0\\)을 버리는 근거는 무엇인가요?","answer":"원문에서 \\(a>5/3\\)이라고 주었기 때문에 \\(a>0\\)이에요."}},{"id":"c2","label":"두 근이 들어갈 구간의 끝값을 검사해요","stepIds":["s4","s5","s6"],"question":"위로 열린 이차식의 두 근이 모두 \\((0,m]\\)에 있으려면 왜 세 부등식이 필요할까요?","hint":"꼭짓점이 구간 안에 있고, 왼쪽 끝에서는 양수, 오른쪽 끝에서는 음이 아닌지 봐요.","explanation":"\\(k=5\\)를 넣으면 \\(h_m(x)=f'(x)-g(m)=3x^2-20x+25-(m-5)^2\\)예요. 꼭짓점은 \\(x=10/3\\)이고 그 값은 \\(-25/3-(m-5)^2<0\\)라 두 실근 사이에서는 음수예요. 두 근이 모두 \\((0,m]\\)에 있으려면 꼭짓점이 오른쪽 끝보다 왼쪽인 \\(m>10/3\\), \\(0\\)이 왼쪽 근보다 왼쪽이 되게 \\(h_m(0)>0\\), \\(m\\)이 오른쪽 근 이상이 되게 \\(h_m(m)\\ge0\\)이어야 해요. \\(h_m(0)=25-(m-5)^2>0\\)이고 \\(h_m(m)=2m(m-5)\\)예요.","check":{"prompt":"\\(h_m(0)=0\\)을 허용하지 않는 이유는 무엇인가요?","answer":"근 \\(0\\)은 집합의 조건 \\(0<x\\le m\\)에 포함되지 않아 두 근을 모두 세지 못하기 때문이에요."}},{"id":"c3","label":"자연수 범위를 모아 더해요","stepIds":["s7","s8"],"question":"세 조건을 함께 만족하는 자연수는 왜 \\(5\\)부터 \\(9\\)까지일까요?","hint":"\\(h_m(0)>0\\)과 \\(h_m(m)\\ge0\\)을 각각 \\(m\\)의 범위로 바꿔요.","explanation":"\\(h_m(0)>0\\)에서 \\(|m-5|<5\\), 즉 \\(0<m<10\\)이에요. \\(m>0\\)에서 \\(h_m(m)=2m(m-5)\\ge0\\)은 \\(m\\ge5\\)를 뜻하고, \\(m>10/3\\)도 자동으로 만족해요. 따라서 자연수 \\(m\\)은 \\(5,6,7,8,9\\)이고 합은 \\(35\\)예요.","check":{"prompt":"끝값 \\(m=5\\)는 왜 포함되고 \\(m=10\\)은 왜 제외되나요?","answer":"\\(m=5\\)에서는 오른쪽 근이 끝점에 있어 포함되지만, \\(m=10\\)에서는 \\(x=0\\)이 근이 되어 열린 왼쪽 끝 조건을 어겨요."}}],"takeaway":["할선 기울기로 만든 함수의 차수와 최고차항 계수를 먼저 확인해요.","이차방정식의 두 근이 구간에 있는지는 꼭짓점과 양 끝의 부호로 검사해요.","열린 끝점에서는 함수값이 \\(0\\)인 경계가 제외된다는 점을 따로 확인해요."]};</script>
