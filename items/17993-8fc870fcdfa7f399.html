  <script>window.HandStudyRecord={"itemId":17993,"sourceLabel":"2024 교육청 고3 수학확통 5월 22번","adminYear":2024,"grade":3,"month":5,"number":22,"track":"확통","points":4,"scoreStatus":"confirmed_4_direct","questionText":"최고차항의 계수가 $4$이고 서로 다른 세 극값을 갖는 사차함수 $f(x)$와 두 함수 $g(x)$, \n $h \\left(x \\right)= {\\begin{cases}4x+2&& \\left(x\u003ca \\right) \\\\ -2x-3&& \\left(x \\geq a \\right)\\end{cases}}$\n가 있다. 세 함수 $f(x)$, $g(x)$, $h(x)$가 다음 조건을 만족시킨다.\n(가) 모든 실수 $x$에 대하여 $\\left| g \\left(x \\right) \\right| =f \\left(x \\right)$, $\\lim _{t\\, \\rightarrow \\,0+} {} \\frac{g \\left(x+t \\right)-g \\left(x \\right)}{t} = \\left| f' \\left(x \\right) \\right|$ 이다.(나) 함수 $g(x) h(x)$는 실수 전체의 집합에서 연속이다.\n$g(0)=\\frac{40}{3}$일 때, $g(1) \\times h(3)$의 값을 구하시오. (단, $a$는 상수이다.) [4점]","answer":"114","sourceHash":"8a2446b8ccf7db0249a1d92960cf8c73a872be9a2ffd32cdc4fd6c144593bae7","steps":[{"id":"s1","latex":"f\\ge0,\\quad f^{\\prime}>0\\Rightarrow g=f,\\quad f^{\\prime}\u003c0\\Rightarrow g=-f"},{"id":"s2","latex":"f\\text{의 극값은 서로 다름}\\Rightarrow g\\text{는 양의 극값점 두 곳 이상에서 부호가 바뀜}"},{"id":"s3","latex":"gh\\text{ 연속}\\Rightarrow\\text{그 두 곳은 }h\\text{의 영점과 }a;\\quad h(a-)+h(a)=0"},{"id":"s4","latex":"4a+2-2a-3=0\\Rightarrow a=1/2,\\quad h\\text{의 영점}=-1/2"},{"id":"s5","latex":"g(0)>0\\Rightarrow f^{\\prime}(0)>0\\Rightarrow f^{\\prime}(x)=16(x^2-1/4)(x-s),\\ s>1/2"},{"id":"s6","latex":"f(x)=4x^4-\\frac{16s}{3}x^3-2x^2+4sx+\\frac{40}{3}"},{"id":"s7","latex":"f(s)=0\\Rightarrow(s^2-4)(2s^2+5)=0\\Rightarrow s=2"},{"id":"s8","latex":"g(1)=-f(1)=-38/3,\\quad h(3)=-9\\Rightarrow g(1)h(3)=114"}],"diagram":null,"contentHash":"b6f22dd323fe23c5034771b739b1d81777eb8c2d0f545fe592d42f5f1e96b2fd","questionHtml":"\u003cp class=\"hp\">최고차항의 계수가 \u003cspan class=\"heq\">\\(4\\)\u003c/span>이고 서로 다른 세 극값을 갖는 사차함수 \u003cspan class=\"heq\">\\(f(x)\\)\u003c/span>와 두 함수 \u003cspan class=\"heq\">\\(g(x)\\)\u003c/span>,\u003c/p>\u003cp class=\"hp htall\">&emsp;&emsp;\u003cspan class=\"heq\">\\(h \\left(x \\right)
