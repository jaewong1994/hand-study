<script>window.HandStudyRecord={"adminYear":2019,"answer":"⑤","contentHash":"616f43ba0ffa11b3ef2a021375f0cc3dfddd70bb7569490820f58ae775a6212b","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24662,"month":11,"number":21,"points":4,"preview":false,"questionHtml":"\u003cp>실수 \u003cspan class=\"heq\">\\(t\\)\u003c/span>에 대하여 곡선 \u003cspan class=\"heq\">\\(y = e^{x}\\)\u003c/span> 위의 점 \u003cspan class=\"heq\">\\((t,\\, e^{t})\\)\u003c/span>에서의 접선의 방정식을 \u003cspan class=\"heq\">\\(y = f(x)\\)\u003c/span>라 할 때, 함수 \u003cspan class=\"heq\">\\(y = \\left|\\,f(x) +k - \\ln\\, x \\, \\right|\\)\u003c/span>가 양의 실수 전체의 집합에서 미분가능하도록 하는 실수 \u003cspan class=\"heq\">\\(k\\)\u003c/span>의 최솟값을 \u003cspan class=\"heq\">\\(g(t)\\)\u003c/span>라 하자. 두 실수 \u003cspan class=\"heq\">\\(a\\)\u003c/span>, \u003cspan class=\"heq\">\\(b\\)\u003c/span> \u003cspan class=\"heq\">\\(( a &lt; b )\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(\\int_{a}^{b} {\\,}g(t)\\,dt = m\\)\u003c/span>이라 할 때, &lt;보기&gt;에서 옳은 것만을 있는 대로 고른 것은? [4점]\u003c/p>\u003cp>&lt;보 기&gt;ㄱ. \u003cspan class=\"heq\">\\(m &lt; 0\\)\u003c/span> 이 되도록 하는 두 실수 \u003cspan class=\"heq\">\\(a\\)\u003c/span> , \u003cspan class=\"heq\">\\(b\\)\u003c/span> \u003cspan class=\"heq\">\\(( a &lt; b )\\)\u003c/span>가 존재한다.ㄴ. 실수 \u003cspan class=\"heq\">\\(c\\)\u003c/span> 에 대하여 \u003cspan class=\"heq\">\\(g(c) = 0\\)\u003c/span> 이면 \u003cspan class=\"heq\">\\(g(-c)=0\\)\u003c/span>이다.ㄷ. \u003cspan class=\"heq\">\\(a=\\alpha\\)\u003c/span> , \u003cspan class=\"heq\">\\(b= \\beta \\,( \\alpha &lt; \\beta )\\)\u003c/span>일 때 \u003cspan class=\"heq\">\\(m\\)\u003c/span> 의 값이 최소이면 \u003cspan class=\"heq\">\\(\\frac{1 +g &#x27; (\\beta)}{1+g &#x27; (\\alpha)}&lt; -e^{2}\\)\u003c/span>이다.\u003c/p>\u003cdiv class=\"hchoices\">\u003cdiv class=\"hch\">① ㄱ\u003c/div>\u003cdiv class=\"hch\">② ㄴ\u003c/div>\u003cdiv class=\"hch\">③ ㄱ, ㄴ\u003c/div>\u003cdiv class=\"hch\">④ ㄱ, ㄷ\u003c/div>\u003cdiv class=\"hch\">⑤ ㄱ, ㄴ, ㄷ\u003c/div>\u003c/div>","questionText":"실수 $t$에 대하여 곡선 $y = e^{x}$ 위의 점 $(t,\\, e^{t})$에서의 접선의 방정식을 $y = f(x)$라 할 때, 함수 $y = \\left|\\,f(x) +k - \\ln\\, x \\, \\right|$가 양의 실수 전체의 집합에서 미분가능하도록 하는 실수 $k$의 최솟값을 $g(t)$라 하자. 두 실수 $a$, $b$ $( a \u003c b )$에 대하여 $\\int_{a}^{b} {\\,}g(t)\\,dt = m$이라 할 때, \u003c보기>에서 옳은 것만을 있는 대로 고른 것은? [4점]\n\u003c보 기>ㄱ. $m \u003c 0$ 이 되도록 하는 두 실수 $a$ , $b$ $( a \u003c b )$가 존재한다.ㄴ. 실수 $c$ 에 대하여 $g(c) = 0$ 이면 $g(-c)=0$이다.ㄷ. $a=\\alpha$ , $b= \\beta \\,( \\alpha \u003c \\beta )$일 때 $m$ 의 값이 최소이면 $\\frac{1 +g ' (\\beta)}{1+g ' (\\alpha)}\u003c -e^{2}$이다.\n① ㄱ ② ㄴ ③ ㄱ, ㄴ\n④ ㄱ, ㄷ ⑤ ㄱ, ㄴ, ㄷ\n단답형","sourceHash":"35af88ded2a1fe14dad37b16493ee7f53363ebfccf77a937c3fc945b12c3815d","sourceKind":"csat","sourceLabel":"2019년 시행 수능 · 2020학년도 · 가형 · 21번","steps":[{"id":"s1","latex":"f(x)=e^t(x-t+1),\\quad h(x)=f(x)+k-\\ln x\\quad(x>0)"},{"id":"s2","latex":"h\\prime(x)=e^t-\\frac1x,\\quad h\\prime\\prime(x)=\\frac1{x^2}>0"},{"explanation":{"body":"절댓값 안의 식이 0을 지나며 부호를 바꿀 때 기울기가 0이 아니면 그래프가 꺾여요. 여기서는 양끝에서 식이 무한히 커지고 아래로 볼록하므로 가장 작은 값만 확인하면 돼요. 최솟값이 0보다 작으면 두 곳에서 꺾이고, 0 이상이면 절댓값을 없애도 식이 그대로예요. 그래서 미분가능해지는 가장 작은 \\(k\\)는 최솟값을 0으로 만드는 값이에요.","skillTags":["derivatives.absolute-value"],"title":"왜 가장 작은 함숫값을 볼까요?"},"id":"s3","latex":"\\text{함수 }h(x)\\text{의 최솟값은 }h(e^{-t})=1+(1-t)e^t+k+t"},{"id":"s4","latex":"\\lim_{x\\to0+}h(x)=\\lim_{x\\to\\infty}h(x)=\\infty"},{"id":"s5","latex":"h(x)\\text{의 최솟값이 }0\\text{보다 작으면 두 교점에서 }h\\prime\\ne0\\text{이므로 }|h|\\text{는 미분불가능}"},{"id":"s6","latex":"h(x)\\text{의 최솟값이 }0\\text{보다 크거나 같으면 }|h|=h\\text{이므로 미분가능}"},{"id":"s7","latex":"g(t)=(t-1)e^t-t-1,\\quad g(0)=-2\u003c0\\ \\Rightarrow\\ \\text{ㄱ 참}"},{"id":"s8","latex":"g\\prime(t)=te^t-1\u003c0\\quad(t\\le0)"},{"id":"s9","latex":"t>0\\text{에서 }te^t\\text{는 }0\\text{부터 }\\infty\\text{까지 증가하므로 }g\\text{의 극소점은 하나}"},{"id":"s10","latex":"\\lim_{t\\to-\\infty}g(t)=\\lim_{t\\to\\infty}g(t)=\\infty\\ \\Rightarrow\\ g(t)=0\\text{의 근은 두 개}"},{"id":"s11","latex":"g(c)=0\\ \\Rightarrow\\ (c-1)e^c=c+1,\\quad c\\ne\\pm1"},{"id":"s12","latex":"g(-c)=-(c+1)e^{-c}+c-1=0\\ \\Rightarrow\\ \\text{ㄴ 참}"},{"id":"s13","latex":"\\text{양의 근을 }c\\text{라 하면 }g(1)=-2\\text{이므로 }c>1"},{"id":"s14","latex":"g(t)\u003c0\\quad(-c\u003ct\u003cc),\\quad g(t)>0\\quad(t\u003c-c\\text{ 또는 }t>c)"},{"explanation":{"body":"\\(g\\)가 음수인 부분을 적분하면 값이 작아지고, 양수인 부분까지 넣으면 다시 커져요. 따라서 적분값을 가장 작게 하려면 음수인 구간 전체를 포함하고 양수인 부분은 포함하지 않아야 해요. 여기서는 음수인 곳이 \\(-c\u003ct\u003cc\\) 하나뿐이므로 양끝을 \\(-c,c\\)로 정할 수 있어요. 음수인 구간이 여러 개라면 그 사이 양수 부분까지 함께 비교해야 해요.","skillTags":["integration.signed-area"],"title":"적분 구간은 어디까지 잡아야 할까요?"},"id":"s15","latex":"\\int_a^b g(t)\\,dt\\text{가 최소일 때 }\\alpha=-c,\\quad\\beta=c"},{"id":"s16","latex":"\\frac{1+g\\prime(\\beta)}{1+g\\prime(\\alpha)}=\\frac{ce^c}{-ce^{-c}}=-e^{2c}\u003c-e^2\\ \\Rightarrow\\ \\text{ㄷ 참}"},{"id":"s17","latex":"\\boxed{\\text{ㄱ, ㄴ, ㄷ}}\\quad\\text{⑤}"}],"track":"가형"};</script>
<script>window.HandStudyGuide={"itemId":24662,"sourceHash":"35af88ded2a1fe14dad37b16493ee7f53363ebfccf77a937c3fc945b12c3815d","contentHash":"616f43ba0ffa11b3ef2a021375f0cc3dfddd70bb7569490820f58ae775a6212b","overview":{"goal":"절댓값 안의 함수가 꺾이지 않을 조건으로 \\(g(t)\\)를 구하고, 그 부호와 영점으로 보기 세 개를 판단해요.","firstLook":"절댓값 안의 식을 \\(h(x)\\)라 두면 \\(h''(x)>0\\)이에요. 따라서 \\(h\\)의 가장 작은 함숫값이 어디에 있는지부터 찾는 것이 출발점이에요.","conditions":[{"label":"접선의 식","meaning":"접점 \\((t,e^t)\\)와 기울기 \\(e^t\\)를 쓰면 \\(f(x)=e^t(x-t+1)\\)이에요."},{"label":"미분가능 조건","meaning":"\\(|h(x)|\\)가 양의 실수 전체에서 꺾이지 않게 하는 가장 작은 \\(k\\)를 찾아야 해요."},{"label":"적분의 최솟값","meaning":"\\(g\\)가 음수인 구간은 모두 넣고 양수인 부분은 빼야 적분값이 가장 작아져요."}]},"chapters":[{"id":"c1","label":"절댓값이 꺾이지 않는 경계를 찾아요","stepIds":["s1","s2","s3","s4","s5","s6"],"question":"왜 \\(h\\)의 가장 작은 함숫값을 정확히 \\(0\\)으로 만드는 \\(k\\)가 답일까요?","hint":"\\(h''(x)>0\\)이고 양쪽 끝에서 \\(h(x)\\)가 커질 때, 가장 작은 함숫값이 음수인 경우와 음수가 아닌 경우를 나누어 봐요.","explanation":"접선의 기울기는 \\(e^t\\)이므로 \\(f(x)=e^t(x-t)+e^t=e^t(x-t+1)\\)이에요. 절댓값 안을 \\(h(x)=f(x)+k-\\ln x\\)라 두면\n\n\\(h'(x)=e^t-\\frac1x,\\qquad h''(x)=\\frac1{x^2}>0\\)\n\n이에요. 그래서 \\(h\\)는 \\(h'(x)=0\\)인 \\(x=e^{-t}\\)에서 가장 작아요. 그 값은\n\n\\(h(e^{-t})=1+(1-t)e^t+k+t\\)\n\n예요. 또 \\(x\\)가 \\(0\\)의 오른쪽에서 가까워질 때에는 \\(-\\ln x\\) 때문에, \\(x\\)가 한없이 커질 때에는 \\(e^t x\\) 때문에 \\(h(x)\\)가 한없이 커져요. 따라서 가장 작은 함숫값이 음수이면 \\(h(x)=0\\)인 점이 두 개 생기고, 그 두 점에서는 \\(h'(x)\\ne0\\)이어서 \\(|h(x)|\\)의 그래프가 꺾여요. 반대로 가장 작은 함숫값이 \\(0\\) 이상이면 \\(h(x)\\ge0\\)이므로 \\(|h(x)|=h(x)\\)이고 미분가능해요. 가능한 \\(k\\) 가운데 가장 작은 값은 경계인 \\(h(e^{-t})=0\\)에서 정해져요.","check":{"prompt":"가장 작은 함숫값을 \\(0\\)보다 더 크게 잡지 않고 \\(0\\)으로 잡는 이유는 무엇인가요?","answer":"\\(0\\) 이상이면 모두 미분가능하지만, 문제는 그런 \\(k\\)의 최솟값을 묻고 있어요. 따라서 미분가능해지기 시작하는 경계인 최솟값 \\(0\\)을 써야 해요."}},{"id":"c2","label":"함수를 구해 첫 번째 보기를 확인해요","stepIds":["s7"],"question":"\\(g(t)\\)의 식은 무엇이고, 적분값이 음수가 되는 구간이 실제로 있을까요?","hint":"앞에서 얻은 가장 작은 함숫값을 \\(0\\)으로 놓고 \\(k\\)를 정한 뒤 \\(t=0\\)을 넣어 봐요.","explanation":"\\(1+(1-t)e^t+k+t=0\\)에서\n\n\\(g(t)=k=(t-1)e^t-t-1\\)\n\n을 얻어요. 특히 \\(g(0)=-2<0\\)이에요. \\(g\\)는 연속이므로 \\(0\\)을 포함하는 충분히 짧은 구간에서는 계속 음수예요. 그 구간의 왼쪽 끝을 \\(a\\), 오른쪽 끝을 \\(b\\)로 잡으면 \\(\\int_a^b g(t)\\,dt<0\\)이므로 ㄱ은 참이에요.","check":{"prompt":"\\(g(0)<0\\) 한 줄만으로 적분값이 음수인 구간의 존재를 말할 수 있는 까닭은 무엇인가요?","answer":"\\(g\\)가 연속이어서 \\(0\\) 주변의 어떤 구간에서도 \\(g(t)<0\\)이 유지되기 때문이에요. 그 구간에서의 정적분은 음수가 돼요."}},{"id":"c3","label":"영점의 개수와 대칭을 확인해요","stepIds":["s8","s9","s10","s11","s12","s13","s14"],"question":"\\(g(t)=0\\)의 두 근이 왜 서로 반대 부호이고, 양의 근은 왜 \\(1\\)보다 클까요?","hint":"먼저 \\(g'(t)=te^t-1\\)의 부호로 감소와 증가를 확인하고, \\(g(c)=0\\)에서 얻은 식을 \\(g(-c)\\)에 넣어 봐요.","explanation":"도함수는 \\(g'(t)=te^t-1\\)이에요. \\(t\\le0\\)이면 \\(te^t\\le0\\)이므로 \\(g'(t)<0\\)이고, \\(t>0\\)에서는 \\(te^t\\)가 \\(0\\)에서 한없이 커지도록 증가하므로 \\(g'(t)=0\\)인 점이 하나뿐이에요. 따라서 \\(g\\)는 계속 감소하다가 한 번만 증가로 바뀌어요. 한편\n\n\\(\\lim_{t\\to-\\infty}g(t)=\\infty,\\qquad \\lim_{t\\to\\infty}g(t)=\\infty\\)\n\n이고 \\(g(0)=-2\\)이므로 영점은 음수 쪽과 양수 쪽에 하나씩, 모두 두 개예요.\n\n이제 \\(g(c)=0\\)이면 \\((c-1)e^c=c+1\\)이에요. \\(c=1\\)과 \\(c=-1\\)은 이 식을 만족하지 않으므로 나누는 과정에 문제가 없고,\n\n\\(e^{-c}=\\frac{c-1}{c+1}\\)\n\n이에요. 이를 넣으면\n\n\\(g(-c)=-(c+1)e^{-c}+c-1=-(c-1)+c-1=0\\)\n\n이 돼요. 따라서 한 영점 \\(c\\)가 있으면 \\(-c\\)도 영점이므로 ㄴ은 참이에요. 양의 영점을 \\(c\\)라 하면 \\(g(1)=-2<0\\)이고 그 뒤에 영점을 만나므로 \\(c>1\\)이에요. 결국 \\(-c<t<c\\)에서는 \\(g(t)<0\\), 그 바깥에서는 \\(g(t)>0\\)이에요.","check":{"prompt":"\\(g(c)=0\\)에서 \\(g(-c)=0\\)을 만들 때 꼭 확인해야 하는 두 값은 무엇인가요?","answer":"\\(c=1\\)과 \\(c=-1\\)이 원래 영점이 아님을 확인해야 해요. 그래야 \\(c-1\\)과 \\(c+1\\)을 분모로 쓰는 과정이 허용돼요."}},{"id":"c4","label":"음수인 구간 전체를 적분해요","stepIds":["s15","s16","s17"],"question":"적분값이 가장 작을 때 양 끝점이 왜 \\(-c,c\\)이고, 도함수의 비는 어떻게 비교할까요?","hint":"구간을 음수인 부분 안에서 넓히면 적분값은 더 작아지고, 양수인 부분까지 넓히면 다시 커져요.","explanation":"\\(g(t)<0\\)인 곳이 하나의 구간 \\((-c,c)\\)이고 그 바깥에서는 \\(g(t)>0\\)이에요. 따라서 적분값을 가장 작게 하려면 음수인 부분은 빠짐없이 넣고 양수인 부분은 넣지 않아야 해요. 그래서 \\(\\alpha=-c\\), \\(\\beta=c\\)예요.\n\n\\(g'(t)=te^t-1\\)이므로\n\n\\(1+g'(c)=ce^c,\\qquad 1+g'(-c)=-ce^{-c}\\)\n\n예요. 따라서\n\n\\(\\frac{1+g'(\\beta)}{1+g'(\\alpha)}=\\frac{ce^c}{-ce^{-c}}=-e^{2c}\\)\n\n이고, \\(c>1\\)이므로 \\(-e^{2c}<-e^2\\)예요. ㄷ도 참이어서 정답은 ㄱ, ㄴ, ㄷ인 ⑤예요.","check":{"prompt":"\\(c>1\\)일 때 \\(-e^{2c}<-e^2\\)에서 부등호 방향이 이렇게 되는 이유는 무엇인가요?","answer":"\\(e^{2c}>e^2\\)이지만 양변에 음수를 붙이면 대소가 뒤집혀 \\(-e^{2c}<-e^2\\)가 되기 때문이에요."}}],"takeaway":["절댓값 안의 함수가 아래로 볼록하면, 영점에서 생기는 꺾임과 가장 작은 함숫값의 부호를 함께 봐요.","함수값 한 점의 부호에서 적분 부호를 말할 때에는 연속성으로 같은 부호가 유지되는 구간을 확인해요.","정적분의 최솟값은 피적분함수가 음수인 구간을 어디까지 포함해야 하는지 부호표로 판단해요."]};</script>
