  <script>window.HandStudyRecord={"itemId":11738,"sourceLabel":"2021 교육청 고1 수학 11월 19번","adminYear":2021,"grade":1,"month":11,"number":19,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"한 변의 길이가 $3$인 정삼각형 $A B C$가 있다. $0\\lt k\\lt 1$인 실수 $k$에 대하여 두 선분 $A B$, $B C$를 $\\left( 1-k \\right) \\,:\\,k$로 내분하는 점을 각각 $P,\\,Q$라 하고 두 선분 $A B$, $B C$를 $k\\,:\\, \\left( k+1 \\right)$로 외분하는 점을 각각 $P',\\,Q'$이라 하자. 삼각형 $P B Q$의 넓이를 $S_{1}$, 삼각형 $P'Q'B$의 넓이를 $S_{2}$라 할 때, 다음은 $S_{1} \\,:\\,S_{2} =1\\,:\\,4$가 되도록 하는 $k$의 값을 구하는 과정이다.\n[그림 1]\n두 선분 $A B$, $B C$의 길이가 모두 $3$이므로\n $\\overline{A P}=\\overline{B Q}=\\, {\\boxed{\\vphantom{(}\\, \\left( \\text{가} \\right) \\,}}$, $\\overline{A P'}=\\overline{B Q'}=3k$\n이다.\n두 점 $P,\\,P'$에서 선분 $B C$에 내린 수선의 발을 각각 $H,\\,H'$이라 하면\n두 삼각형 $P B H$와 $P'BH'$에서\n${\\overline{PH }} \\,:\\, {\\overline{P' H' }} = {\\overline{PB }} \\,:\\, {\\overline{P' B }} = \\left\\{ 3- \\left( \\, {\\boxed{\\vphantom{(}\\, \\left( \\text{가} \\right) \\,}} \\, \\right) \\right\\} \\,:\\, \\left( \\, {\\boxed{\\vphantom{(}\\, \\left( \\text{나} \\right) \\,}} \\, \\right) \\,$\n이므로\n$S_{1} \\,:\\,S_{2}$$= \\left( \\dfrac{1}{2} \\times {\\overline{BQ }} \\times {\\overline{PH }} \\right) \\,:\\, \\left( \\dfrac{1}{2} \\times {\\overline{BQ' }} \\times {\\overline{P' H' }} \\right)$\n$= \\left( {\\overline{BQ }} \\times {\\overline{PB }} \\right) \\,:\\, \\left( {\\overline{BQ' }} \\times {\\overline{P'B }} \\right)$\n이다. 따라서 $k=\\, {\\boxed{\\vphantom{(}\\, \\left( \\text{다} \\right) \\,}}$이다.\n위의 (가), (나)에 알맞은 식을 각각 $f \\left( k \\right)$, $g \\left( k \\right)$라 하고 (다)에 알맞은 수를 $p$라 할 때, $f \\left( p \\right) \\times g \\left( p \\right)$의 값은? [4점]\n① $\\dfrac{128}{25}$ ② $\\dfrac{132}{25}$ ③ $\\dfrac{136}{25}$ ④ $\\dfrac{28}{5}$ ⑤ $\\dfrac{144}{25}$","answer":"⑤","sourceHash":"7b2be8c00a3c5bf5d2b4e78b23715e9e9f249872d6367103a31373912ab51687","steps":[{"id":"s1","latex":"AP=BQ=3(1-k),\\quad PB=3k\\Rightarrow f(k)=3(1-k)"},{"id":"s2","latex":"P\\prime\\text{는 외분점}\\Rightarrow P\\prime B=3(k+1)\\Rightarrow g(k)=3(k+1)"},{"id":"s3","latex":"S_1:S_2=(BQ\\cdot PB):(BQ\\prime\\cdot P\\prime B)=(1-k):(1+k)=1:4"},{"id":"s4","latex":"4(1-k)=1+k\\Rightarrow k=p=\\frac35"},{"id":"s5","latex":"f(p)g(p)=3\\cdot\\frac25\\cdot3\\cdot\\frac85=\\frac{144}{25}"}],"diagram":null,"contentHash":"6434cbb984387c71f031fdfb648b031e18bf4cf38a08127d9d268acaf1246e8a","questionHtml":"\u003cp class=\"hp\">한 변의 길이가 \u003cspan class=\"heq\">\\(3\\)\u003c/span>인 정삼각형 \u003cspan class=\"heq\">\\(A B C\\)\u003c/span>가 있다. \u003cspan class=\"heq\">\\(0\\lt k\\lt 1\\)\u003c/span>인 실수 \u003cspan class=\"heq\">\\(k\\)\u003c/span>에 대하여 두 선분 \u003cspan class=\"heq\">\\(A B\\)\u003c/span>, \u003cspan class=\"heq\">\\(B C\\)\u003c/span>를 \u003cspan class=\"heq\">\\(\\left( 1-k \\right) \\,:\\,k\\)\u003c/span>로 내분하는 점을 각각 \u003cspan class=\"heq\">\\(P,\\,Q\\)\u003c/span>라 하고 두 선분 \u003cspan class=\"heq\">\\(A B\\)\u003c/span>, \u003cspan class=\"heq\">\\(B C\\)\u003c/span>를 \u003cspan class=\"heq\">\\(k\\,:\\, \\left( k+1 \\right)\\)\u003c/span>로 외분하는 점을 각각 \u003cspan class=\"heq\">\\(P',\\,Q'\\)\u003c/span>이라 하자. 삼각형 \u003cspan class=\"heq\">\\(P B Q\\)\u003c/span>의 넓이를 \u003cspan class=\"heq\">\\(S_{1}\\)\u003c/span>, 삼각형 \u003cspan class=\"heq\">\\(P'Q'B\\)\u003c/span>의 넓이를 \u003cspan class=\"heq\">\\(S_{2}\\)\u003c/span>라 할 때, 다음은 \u003cspan class=\"heq\">\\(S_{1} \\,:\\,S_{2} =1\\,:\\,4\\)\u003c/span>가 되도록 하는 \u003cspan class=\"heq\">\\(k\\)\u003c/span>의 값을 구하는 과정이다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/b7281e3dd575401050aea2cd.png\" style=\"width:311px;max-width:100%\">\u003c/p>\u003cp class=\"hp\">두 선분 \u003cspan class=\"heq\">\\(A B\\)\u003c/span>, \u003cspan class=\"heq\">\\(B C\\)\u003c/span>의 길이가 모두 \u003cspan class=\"heq\">\\(3\\)\u003c/span>이므로\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\(\\overline{A P}=\\overline{B Q}=\\, {\\boxed{\\vphantom
