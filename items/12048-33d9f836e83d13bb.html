  <script>window.HandStudyRecord={"itemId":12048,"sourceLabel":"2024 교육청 고1 수학 6월 29번","adminYear":2024,"grade":1,"month":6,"number":29,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 반지름의 길이가 $1$이고 중심각의 크기가 $90 ^{\\circ}$인 부채꼴 ${{OAB}}$가 있다. 호 ${{AB}}$ 위의 점 ${{C}}$에 대하여 선분 ${{BC}}$를 지름으로 하는 원을 그린다. 선분 ${{BC}}$의 중점을 지나고 직선 ${{OB}}$에 평행한 직선이 원과 만나는 점 중 점 ${{B}}$에 가까운 점을 ${{P}}$라 하자. $\\frac{}{l} i n e{{{BC}} }=x$일 때, 삼각형 ${{OAP}}$의 넓이를 $S(x)$라 하자. $S(x)$의 최댓값이 $\\frac{q}{p}$일 때, $p+q$의 값을 구하시오. (단, $0\u003cx\u003c \\sqrt{2}$이고, $p$와 $q$는 서로소인 자연수이다.) [4점]","answer":"13","sourceHash":"83ee878624832eab525f2ad5d24ebf9567fe7c15d461b601f0e3fb491a2fae91","steps":[{"id":"s1","latex":"O=(0,0),\\ A=(1,0),\\ B=(0,1),\\quad C=(u,v),\\ u^2+v^2=1"},{"id":"s2","latex":"BC=x\\Rightarrow x^2=u^2+(v-1)^2=2-2v\\Rightarrow v=1-\\frac{x^2}{2}"},{"id":"s3","latex":"M_{BC}=\\left(\\frac u2,\\frac{1+v}{2}\\right),\\quad r=\\frac x2"},{"id":"s4","latex":"P\\text{ nearer }B\\Rightarrow y_P=\\frac{1+v}{2}+\\frac x2"},{"id":"s5","latex":"S(x)=\\frac12y_P=\\frac12+\\frac x4-\\frac{x^2}{8}=\\frac58-\\frac{(x-1)^2}{8}"},{"id":"s6","latex":"0\u003cx\u003c\\sqrt2\\Rightarrow\\max S=\\frac58,\\quad p+q=8+5=13"}],"diagram":null,"contentHash":"5201977f09b7ccf92cc55831276dfbc849d384392b530af56c6c5938f0142086","questionHtml":"\u003cp class=\"hp htall\">그림과 같이 반지름의 길이가 \u003cspan class=\"heq\">\\(1\\)\u003c/span>이고 중심각의 크기가 \u003cspan class=\"heq\">\\(90^{\\circ}\\)\u003c/span>인 부채꼴 \u003cspan class=\"heq\">\\({{OAB}}\\)\u003c/span>가 있다. 호 \u003cspan class=\"heq\">\\({{AB}}\\)\u003c/span> 위의 점 \u003cspan class=\"heq\">\\({{C}}\\)\u003c/span>에 대하여 선분 \u003cspan class=\"heq\">\\({{BC}}\\)\u003c/span>를 지름으로 하는 원을 그린다. 선분 \u003cspan class=\"heq\">\\({{BC}}\\)\u003c/span>의 중점을 지나고 직선 \u003cspan class=\"heq\">\\({{OB}}\\)\u003c/span>에 평행한 직선이 원과 만나는 점 중 점 \u003cspan class=\"heq\">\\({{B}}\\)\u003c/span>에 가까운 점을 \u003cspan class=\"heq\">\\({{P}}\\)\u003c/span>라 하자. \u003cspan class=\"heq\">\\(\\overline{{{BC}} }=x\\)\u003c/span>일 때, 삼각형 \u003cspan class=\"heq\">\\({{OAP}}\\)\u003c/span>의 넓이를 \u003cspan class=\"heq\">\\(S(x)\\)\u003c/span>라 하자. \u003cspan class=\"heq\">\\(S(x)\\)\u003c/span>의 최댓값이 \u003cspan class=\"heq\">\\(\\dfrac{q}{p}\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(p+q\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(0\\lt x\\lt  \\sqrt{2}\\)\u003c/span>이고, \u003cspan class=\"heq\">\\(p\\)\u003c/span>와 \u003cspan class=\"heq\">\\(q\\)\u003c/span>는 서로소인 자연수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/77b5cec62a55990b205c1058.png\" style=\"width:271px;max-width:100%\">\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"33d9f836e83d13bbb834705982153025364ed025858960b9bb4a0b2d9e520dc7"};</script>
