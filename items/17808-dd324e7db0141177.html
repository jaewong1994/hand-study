  <script>window.HandStudyRecord={"itemId":17808,"sourceLabel":"2023 평가원 고3 수학확통 6월 29번","adminYear":2023,"grade":3,"month":6,"number":29,"track":"확통","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 $2$장의 검은색 카드와 $1$부터 $8$까지의 자연수가 하나씩 적혀 있는 $8$장의 흰색 카드가 있다. 이 카드를 모두 한 번씩 사용하여 왼쪽에서 오른쪽으로 일렬로 배열할 때, 다음 조건을 만족시키는 경우의 수를 구하시오. (단, 검은색 카드는 서로 구별하지 않는다.) [4점]\n (가) 흰색 카드에 적힌 수가 작은 수부터 크기순으로 왼쪽에서 오른쪽으로 배열되도록 카드가 놓여 있다. (나) 검은색 카드 사이에는 흰색 카드가 $2$장 이상 놓여 있다. (다) 검은색 카드 사이에는 $3$의 배수가 적힌 흰색 카드가 $1$장 이상 놓여 있다.","answer":"25","sourceHash":"0710bd11e6b5ba8cf3c64dd8abfe5354238e0f1b0af96382ad16bb4380241fbd","steps":[{"id":"s1","latex":"x_0,x_1,x_2:=\\text{왼쪽, 사이, 오른쪽의 흰 카드 수}"},{"id":"s2","latex":"x_0+x_1+x_2=8\\quad(x_i\\ge0),\\qquad x_1\\ge2"},{"id":"s3","latex":"\\#\\{(x_0,x_1,x_2)\\}=\\sum_{x_1=2}^{8}(9-x_1)=28"},{"id":"s4","latex":"\\{3,6\\}\\cap\\{x_0+1,\\ldots,x_0+x_1\\}=\\varnothing"},{"id":"s5","latex":"(x_0,x_1)=(0,2),(3,2),(6,2)\\quad\\Rightarrow\\quad3\\text{가지}"},{"id":"s6","latex":"28-3=25"}],"diagram":null,"contentHash":"c48d2b1b34b4ed19b416aeabb8b5295a02d3c4761516cf76e7f6daa3f67667d1","questionHtml":"\u003cp class=\"hp\">그림과 같이 \u003cspan class=\"heq\">\\(2\\)\u003c/span>장의 검은색 카드와 \u003cspan class=\"heq\">\\(1\\)\u003c/span>부터 \u003cspan class=\"heq\">\\(8\\)\u003c/span>까지의 자연수가 하나씩 적혀 있는 \u003cspan class=\"heq\">\\(8\\)\u003c/span>장의 흰색 카드가 있다. 이 카드를 모두 한 번씩 사용하여 왼쪽에서 오른쪽으로 일렬로 배열할 때, 다음 조건을 만족시키는 경우의 수를 구하시오. (단, 검은색 카드는 서로 구별하지 않는다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) 흰색 카드에 적힌 수가 작은 수부터 크기순으로 왼쪽에서 오른쪽으로 배열되도록 카드가 놓여 있다.\u003c/p>\u003cp class=\"hp\">(나) 검은색 카드 사이에는 흰색 카드가 \u003cspan class=\"heq\">\\(2\\)\u003c/span>장 이상 놓여 있다.\u003c/p>\u003cp class=\"hp\">(다) 검은색 카드 사이에는 \u003cspan class=\"heq\">\\(3\\)\u003c/span>의 배수가 적힌 흰색 카드가 \u003cspan class=\"heq\">\\(1\\)\u003c/span>장 이상 놓여 있다.\u003c/p>\u003c/div>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/cb
