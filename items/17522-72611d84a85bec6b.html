  <script>window.HandStudyRecord={"itemId":17522,"sourceLabel":"2022 평가원 고3 수학확통 9월 22번","adminYear":2022,"grade":3,"month":9,"number":22,"track":"확통","points":4,"scoreStatus":"confirmed_4_direct","questionText":"최고차항의 계수가 $1$이고 $x=3$에서 극댓값 $8$을 갖는 삼차함수 $f(x)$가 있다. 실수 $t$에 대하여 함수 $g(x)$를\n $g(x)=\\begin{cases}f(x) && (x \\geq t) \\\\ -f(x)+2 f(t) && (x\u003ct)\\end{cases}$\n라 할 때, 방정식 $g(x)=0$의 서로 다른 실근의 개수를 $h(t)$라 하자. 함수 $h(t)$가 $t=a$에서 불연속인 $a$의 값이 두 개일 때, $f(8)$의 값을 구하시오. [4점]\n 사각형입니다. 2022년 9월 고3 모의고사 문제지제 2 교시 수학 영역(확률과 통계) \n5 지선다형","answer":"58","sourceHash":"672719153971575fffc4bef60484ddea214092c3afbb4b447e509c03d5fcbc48","steps":[{"id":"s1","latex":"f(x)=(x-3)^2(x-b)+8,\\quad b>3"},{"id":"s2","latex":"f'(x)=(x-3)(3x-2b-3)"},{"id":"s3","latex":"\\text{극솟점 }u=\\frac{2b+3}{3},\\quad \\mu=f(u)=8-\\frac{4(b-3)^3}{27}"},{"id":"s4","latex":"h(t)=\\#\\{x\\ge t:f(x)=0\\}+\\#\\{x\u003ct:f(x)=2f(t)\\}"},{"latex":"\\mu\u003c0:\\quad f=0\\text{의 세 단순근에서 모두 불연속}\\Rightarrow\\text{적어도 세 개}","id":"s5"},{"latex":"\\mu=0:\\quad\\text{왼쪽 단순근, 극솟점 }u,\\ u\\text{보다 큰 }f(t)=4\\text{인 점에서 불연속}","id":"s6"},{"latex":"\\mu>0:\\quad\\text{왼쪽 영점 한 개와 }t>3,\\ f(t)=4\\text{인 점들만 불연속}","id":"s7"},{"latex":"0\u003c\\mu\u003c4:\\ 3\\text{개};\\quad\\mu=4:\\ 2\\text{개};\\quad\\mu>4:\\ 1\\text{개}\\Rightarrow\\mu=4","id":"s8"},{"id":"s9","latex":"8-\\frac{4(b-3)^3}{27}=4\\Rightarrow b=6"},{"id":"s10","latex":"f(8)=(8-3)^2(8-6)+8=\\boxed{58}"}],"diagram":null,"contentHash":"077228842bb1e32541b28c4e2c86aeac2c515dff18ce1efb7357d3f16ef7c42e","questionHtml":"\u003cp class=\"hp\">최고차항의 계수가 \u003cspan class=\"heq\">\\(1\\)\u003c/span>이고 \u003cspan class=\"heq\">\\(x=3\\)\u003c/span>에서 극댓값 \u003cspan class=\"heq\">\\(8\\)\u003c/span>을 갖는 삼차함수 \u003cspan class=\"heq\">\\(f(x)\\)\u003c/span>가 있다. 실수 \u003cspan class=\"heq\">\\(t\\)\u003c/span>에 대하여 함수 \u003cspan class=\"heq\">\\(g(x)\\)\u003c/span>를\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\(g(x)=\\begin{cases}f(x) && (x \\geq t) \\\\ -f(x)+2 f(t) && (x\\lt t)\\end{cases}\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">라 할 때, 방정식 \u003cspan class=\"heq\">\\(g(x)=0\\)\u003c/span>의 서로 다른 실근의 개수를 \u003cspan class=\"heq\">\\(h(t)\\)\u003c/span>라 하자. 함수 \u003cspan class=\"heq\">\\(h(t)\\)\u003c/span>가 \u003cspan class=\"heq\">\\(t=a\\)\u003c/span>에서 불연속인 \u003cspan class=\"heq\">\\(a\\)\u003c/span>의 값이 두 개일 때, \u003cspan class=\"heq\">\\(f(8)\\)\u003c/span>의 값을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"72611d84a85bec6b7a5a528a9986f48303f78eeb4bd7df4a6fe1c05937cfd16a"};</script>
