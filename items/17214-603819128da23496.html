<script>window.HandStudyRecord={"itemId":17214,"sourceLabel":"2021 평가원 고3 수학미적분 6월 29번","adminYear":2021,"grade":3,"month":6,"number":29,"track":"미적분","points":4,"scoreStatus":"confirmed_4_direct","questionText":"$t>2e$인 실수 $t$에 대하여 함수 $f \\left( x \\right)$$=t\\, \\left( \\ln x \\right) ^{2} -x ^{2}$이 $x=k$에서 극대일 때, 실수 $k$의 값을 $g \\left( t \\right)$라 하면 $g \\left( t \\right)$는 미분가능한 함수이다. $g \\left( \\alpha \\right)$$=e ^{2}$인 실수 $\\alpha$에 대하여 $\\alpha \\times \\left\\{ g' \\left( \\alpha \\right) \\right\\} ^{2}$$= \\frac{q}{p}$일 때, $p+q$의 값을 구하시오. (단, $p$와 $q$는 서로소인 자연수이다.) [4점]","answer":"17","sourceHash":"ea9eac16574e7d27856eb233421c68588f813a36e0388d36b92049a99b077ea3","steps":[{"id":"s1","latex":"f(x)=t(\\ln x)^2-x^2,\\quad f'(x)=\\frac{2(t\\ln x-x^2)}x"},{"id":"s2","latex":"t>2e\\Rightarrow h(x)=t\\ln x-x^2\\text{는 서로 다른 두 영점을 가짐}"},{"id":"s3","latex":"k=g(t)\\text{는 큰 영점}\\Rightarrow t\\ln g(t)=g(t)^2"},{"id":"s4","latex":"g(\\alpha)=e^2\\Rightarrow2\\alpha=e^4\\Rightarrow\\alpha=\\frac{e^4}{2}"},{"id":"s5","latex":"\\ln g+t\\frac{g'}g=2gg'"},{"id":"s6","latex":"t=\\alpha:\\quad2+\\frac{e^2}{2}g'(\\alpha)=2e^2g'(\\alpha)"},{"id":"s7","latex":"g'(\\alpha)=\\frac4{3e^2}"},{"id":"s8","latex":"\\alpha\\{g'(\\alpha)\\}^2=\\frac89\\Rightarrow p+q=17"}],"diagram":null,"contentHash":"973abfcb9a1de0e4733b208cbf966b5e1edfed95a9cc3bfb874c799d103b7fe4","questionHtml":"\u003cp class=\"hp htall\">\u003cspan class=\"heq\">\\(t\\gt 2e\\)\u003c/span>인 실수 \u003cspan class=\"heq\">\\(t\\)\u003c/span>에 대하여 함수 \u003cspan class=\"heq\">\\(f \\left( x \\right)\\)\u003c/span>\u003cspan class=\"heq\">\\(=t\\, \\left( \\ln x \\right)^{2} -x^{2}\\)\u003c/span>이 \u003cspan class=\"heq\">\\(x=k\\)\u003c/span>에서 극대일 때, 실수 \u003cspan class=\"heq\">\\(k\\)\u003c/span>의 값을 \u003cspan class=\"heq\">\\(g \\left( t \\right)\\)\u003c/span>라 하면 \u003cspan class=\"heq\">\\(g \\left( t \\right)\\)\u003c/span>는 미분가능한 함수이다. \u003cspan class=\"heq\">\\(g \\left( \\alpha \\right)\\)\u003c/span>\u003 <script>window.HandStudyGuide={"itemId":17214,"sourceHash":"ea9eac16574e7d27856eb233421c68588f813a36e0388d36b92049a99b077ea3","contentHash":"973abfcb9a1de0e4733b208cbf966b5e1edfed95a9cc3bfb874c799d103b7fe4","overview":{"goal":"극대점 \\(k=g(t)\\)가 만족하는 식을 직접 미분해 \\(g'(\\alpha)\\)를 구해요.","firstLook":"우선 \\(f'(x)=0\\)을 정리하면 \\(t\\)와 극대점 \\(x\\) 사이의 관계식 하나가 생겨요.","conditions":[{"label":"\\(t>2e\\)","meaning":"도함수가 \\(0\\)인 양의 점이 두 개이고, 그중 큰 점에서 증가에서 감소로 바뀌어요."},{"label":"\\(g\\) 미분가능","meaning":"\\(t\\ln g(t)=g(t)^2\\)의 양변을 \\(t\\)로 미분할 수 있어요."}]},"chapters":[{"id":"c1","label":"어느 영점이 극대점인지 고르기","stepIds":["s1","s2","s3"],"question":"\\(t\\ln x-x^2=0\\)의 두 해 중 왜 큰 해를 골라야 할까요?","hint":"작은 해와 큰 해의 앞뒤에서 \\(f'(x)\\)의 부호를 확인해 봐요.","explanation":"\\(f'(x)=\\dfrac{2(t\\ln x-x^2)}{x}\\)이고 \\(x>0\\)이므로 부호는 \\(t\\ln x-x^2\\)가 정해요. \\(t>2e\\)일 때 이 식은 서로 다른 두 양의 영점을 갖고, 큰 영점에서는 \\(f'\\)이 양수에서 음수로 바뀌어. 그래서 극대점 \\(k=g(t)\\)는 큰 영점이고, 반드시 \\(t\\ln g(t)=g(t)^2\\)를 만족해요.","check":{"prompt":"작은 영점에서는 어떤 극값을 갖는가?","answer":"\\(f'\\)이 음수에서 양수로 바뀌므로 극솟값을 가져요."}},{"id":"c2","label":"먼저 매개변수 값 구하기","stepIds":["s4"],"question":"\\(g(\\alpha)=e^2\\)를 관계식에 넣으면 어떤 계산이 나오나요?","hint":"\\(\\ln(e^2)=2\\)부터 써 봐요.","explanation":"\\(\\alpha\\ln g(\\alpha)=g(\\alpha)^2\\)에 \\(g(\\alpha)=e^2\\)를 넣으면 \\(\\alpha\\cdot2=e^4\\). 따라서 \\(\\alpha=\\dfrac{e^4}{2}\\)예요.","check":{"prompt":"\\(\\alpha\\)의 값은?","answer":"\\(e^4/2\\)이에요."}},{"id":"c3","label":"관계식 미분을 한 줄씩 계산하기","stepIds":["s5","s6","s7"],"question":"\\(t\\ln g(t)\\)를 미분할 때 두 항은 무엇일까요?","hint":"\\(t\\)와 \\(\\ln g(t)\\)의 곱이에요.","explanation":"곱과 합성함수를 차례로 미분하면 \\(\\ln g(t)+t\\dfrac{g'(t)}{g(t)}=2g(t)g'(t)\\). 이제 \\(t=\\alpha=\\dfrac{e^4}{2}\\), \\(g(\\alpha)=e^2\\)를 넣어 봐요. 왼쪽은 \\(2+\\dfrac{e^4}{2}\\dfrac{g'(\\alpha)}{e^2}=2+\\dfrac{e^2}{2}g'(\\alpha)\\), 오른쪽은 \\(2e^2g'(\\alpha)\\)예요. 따라서 \\(2=\\dfrac{3e^2}{2}g'(\\alpha)\\), 곧 \\(g'(\\alpha)=\\dfrac{4}{3e^2}\\)가 돼요.","check":{"prompt":"\\(g'(\\alpha)\\)를 고립시키기 직전 식은?","answer":"\\(2=(3e^2/2)g'(\\alpha)\\)이에요."}},{"id":"c4","label":"지수항을 소거해 답 확인","stepIds":["s8"],"question":"\\(\\alpha\\{g'(\\alpha)\\}^2\\)에서 \\(e\\)는 어떻게 사라질까요?","hint":"\\(e^4\\)와 \\(e^{-4}\\)가 곱해져.","explanation":"\\(\\alpha\\{g'(\\alpha)\\}^2=\\dfrac{e^4}{2}\\left(\\dfrac{4}{3e^2}\\right)^2=\\dfrac{e^4}{2}\\cdot\\dfrac{16}{9e^4}=\\dfrac89\\). 이미 서로소이므로 \\(p=9,q=8\\), 답은 \\(p+q=17\\)이에요.","check":{"prompt":"최종 분수와 답은?","answer":"\\(8/9\\), 따라서 \\(17\\)이에요."}}],"takeaway":["극값 방정식의 여러 해는 도함수 부호 변화로 종류를 가려요.","움직이는 해는 그 해가 만족하는 관계식을 곱·합성 미분으로 직접 미분해요.","값을 대입한 뒤 계수를 한 줄씩 정리하면 지수항 소거까지 확인할 수 있어요."]};</script>
