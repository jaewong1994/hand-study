<script>window.HandStudyRecord={"itemId":17222,"sourceLabel":"2021 평가원 고3 수학미적분 9월 28번","adminYear":2021,"grade":3,"month":9,"number":28,"track":"미적분","points":4,"scoreStatus":"confirmed_4_direct","questionText":"좌표평면에서 원점을 중심으로 하고 반지름의 길이가 $2$인 원 $C$와 두 점 $A \\left( 2,\\,0 \\right)$, $B \\left( 0,\\,-2 \\right)$가 있다. 원 $C$ 위에 있고 $x$좌표가 음수인 점 $P$에 대하여 $\\angle PAB= \\theta$라 하자. 점 $Q \\left( 0,\\,2\\cos \\theta \\right)$에서 직선 $B P$에 내린 수선의 발을 $R$라 하고, 두 점 $P$와 $R$ 사이의 거리를 $f \\left( \\theta \\right)$라 할 때, $\\int _{\\frac{\\pi }{6}} ^{\\frac{\\pi }{3}} {f \\left( \\theta \\right) d \\theta }$의 값은?\n[4점]\n① $\\frac{2 \\sqrt{3} -3}{2}$ ② $\\sqrt{3} -1$ ③ $\\frac{3 \\sqrt{3} -3}{2}$\n④ $\\frac{2 \\sqrt{3} -1}{2}$ ⑤ $\\frac{4 \\sqrt{3} -3}{2}$\n단답형","answer":"①","sourceHash":"78e6cad8ccea70400b3ea0bc6b82cf2ea178024e87ea0a8ce870a4c0e590ad4f","steps":[{"id":"s1","latex":"A=(2,0),\\ B=(0,-2)\\Rightarrow\\angle AOB=\\frac\\pi2"},{"id":"s2","latex":"\\angle APB=\\frac\\pi4,\\quad\\angle ABP=\\frac{3\\pi}4-\\theta"},{"id":"s3","latex":"BP=4\\sin\\theta,\\quad QB=2(1+\\cos\\theta)"},{"id":"s4","latex":"\\angle QBR=\\frac\\pi2-\\theta\\Rightarrow BR=2(1+\\cos\\theta)\\sin\\theta"},{"id":"s5","latex":"f(\\theta)=PR=BP-BR=2\\sin\\theta(1-\\cos\\theta)"},{"id":"s6","latex":"\\int_{\\pi/6}^{\\pi/3}f(\\theta)d\\theta=[-2\\cos\\theta-\\sin^2\\theta]_{\\pi/6}^{\\pi/3}"},{"id":"s7","latex":"=\\sqrt3-\\frac32=\\frac{2\\sqrt3-3}{2}"}],"diagram":null,"contentHash":"9a65f72a77aca0539982d4b18b92adcd3ae2143f6dc448daf6b570f2af8f1d18","questionHtml":"\u003cp class=\"hp htall\">좌표평면에서 원점을 중심으로 하고 반지름의 길이가 \u003cspan class=\"heq\">\\(2\\)\u003c/span>인 원 \u003cspan class=\"heq\">\\(C\\)\u003c/span>와 두 점 \u003cspan class=\"heq\">\\(A \\left( 2,\\,0 \\right)\\)\u003c/span>, \u003cspan class=\"heq\">\\(B \\left( 0,\\,-2 \\right)\\)\u003c/span>가 있다. 원 \u003cspan class=\"heq\">\\(C\\)\u003c/span> 위에 있고 \u003cspan class=\"heq\">\\(x\\)\u003c/span>좌표가 음수인 점 \u003cspan class=\"heq\">\\(P\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(\\angle PAB= \\theta\\)\u003c/span>라 하자.\u003cbr>점 \u003cspan class=\"heq\">\\(Q \\left( 0,\\,2\\cos \\theta \\right)\\)\u003c/span>에서 직선 \u003cspan class=\"heq\">\\(B P\\)\u003c/span>에 내린 수선의 발을 \u003cspan class=\"heq\">\\(R\\)\u003c/span>라 하고, 두 점 \u003cspan class=\"heq\">\\(P\\)\u003c/span>와 \u003cspan class=\"heq\">\\(R\\)\u003c/span> 사이의 거리를 \u003cspan class=\"heq\">\\(f \\left( \\theta \\right)\\)\u003c/span>라 할 때, \u003cspan class=\"heq\">\\(\\int_{\\dfrac{\\pi }{6}}^{\\dfrac{\\pi }{3}} {f \\left( \\theta \\right) d \\theta }\\)\u003c/span>의 값은?\u003c/p>\u003cp class=\"hp\">\u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp htall\">① \u003cspan class=\"heq\">\\(\\dfrac{2 \\sqrt{3} -3}{2}\\)\u003c/span>&emsp;② \u003cspan class=\"heq\">\\(\\sqrt{3} -1\\)\u003c/span>&emsp;③ \u003cspan class=\"heq\">\\(\\dfrac{3 \\sqrt{3} -3}{2}\\)\u003c/span>\u003c/p>\u003cp class=\"hp htall\">④ \u003cspan class=\"heq\">\\(\\dfrac{2 \\sqrt{3} -1}{2}\\)\u003c/span>&emsp;⑤ \u003cspan class=\"heq\">\\(\\dfrac{4 \\sqrt{3} -3}{2}\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig hfigr\" src=\"../assets/figures/ce18d5058d352e482a6a76ad.png\" style=\"float:right;margin:4px 0 8px 12px;width:335px;max-width:45%\">\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"8493e5b1788b6faba54c1b23f45d9f05bced0be85def0bccf18608d8919fa898"};</script>
<script>window.HandStudyGuide={"itemId":17222,"sourceHash":"78e6cad8ccea70400b3ea0bc6b82cf2ea178024e87ea0a8ce870a4c0e590ad4f","contentHash":"9a65f72a77aca0539982d4b18b92adcd3ae2143f6dc448daf6b570f2af8f1d18","overview":{"goal":"원주각과 직각삼각형으로 \\(PR\\)을 \\(\\theta\\)의 식으로 만든 뒤 정적분을 계산해요.","firstLook":"\\(PR\\)은 같은 직선 위의 \\(BP\\)에서 \\(BR\\)을 뺀 길이예요. 두 길이를 모두 \\(\\sin\\theta\\), \\(\\cos\\theta\\)로 나타내요.","conditions":[{"label":"반지름 \\(2\\)","meaning":"\\(AB\\)에 대한 중심각이 \\(\\pi/2\\)이므로 현 \\(AB=2\\sqrt2\\), 원주각 \\(\\angle APB=\\pi/4\\)예요."},{"label":"수선의 발 \\(R\\)","meaning":"\\(QR\\perp BP\\)이므로 직각삼각형 \\(QBR\\)의 삼각비로 \\(BR\\)을 구할 수 있어요."}]},"chapters":[{"id":"c1","label":"두 선분의 길이를 같은 각으로 나타내요","stepIds":["s1","s2","s3","s4"],"question":"\\(BP\\)와 \\(BR\\)을 모두 \\(\\theta\\)의 식으로 어떻게 바꿀까요?","hint":"\\(BP\\)에는 삼각형 \\(ABP\\)의 사인법칙을, \\(BR\\)에는 직각삼각형 \\(QBR\\)의 삼각비를 써요.","explanation":"\\(\\angle AOB=\\pi/2\\)이므로 같은 호 \\(AB\\)를 보는 원주각은 \\(\\angle APB=\\pi/4\\)예요. 따라서 삼각형 \\(ABP\\)에서 \\(\\angle ABP=\\pi-\\theta-\\pi/4=3\\pi/4-\\theta\\)예요. 또 \\(AB=2\\sqrt2\\)이므로 사인법칙에서\n\n\\(\\frac{BP}{\\sin\\theta}=\\frac{AB}{\\sin(\\pi/4)}=\\frac{2\\sqrt2}{\\sqrt2/2}=4\\),\n\n곧 \\(BP=4\\sin\\theta\\)예요. 한편 \\(QB=2\\cos\\theta-(-2)=2(1+\\cos\\theta)\\)이고, \\(\\angle QBR=\\pi/2-\\theta\\)예요. 직각삼각형에서 \\(BR=QB\\cos(\\pi/2-\\theta)=QB\\sin\\theta=2(1+\\cos\\theta)\\sin\\theta\\)예요.","check":{"prompt":"\\(BP=4\\sin\\theta\\)에서 \\(4\\)는 어떻게 나오나요?","answer":"\\(AB/\\sin(\\pi/4)=2\\sqrt2/(\\sqrt2/2)=4\\)에서 나와요."}},{"id":"c2","label":"거리식을 만들고 항별로 적분해요","stepIds":["s5","s6"],"question":"\\(PR=2\\sin\\theta(1-\\cos\\theta)\\)를 어떤 두 적분으로 나누면 계산이 쉬울까요?","hint":"괄호를 펼쳐 \\(2\\sin\\theta-2\\sin\\theta\\cos\\theta\\)로 써요.","explanation":"점의 순서가 \\(B-R-P\\)이므로 \\(PR=BP-BR\\)예요. 따라서\n\n\\(PR=4\\sin\\theta-2(1+\\cos\\theta)\\sin\\theta=2\\sin\\theta(1-\\cos\\theta)\\)예요.\n\n이를 펼치면 \\(2\\sin\\theta-2\\sin\\theta\\cos\\theta\\)예요. 첫 항은 \\(\\int2\\sin\\theta\\,d\\theta=-2\\cos\\theta\\)예요. 둘째 항은 \\(u=\\sin\\theta\\), \\(du=\\cos\\theta\\,d\\theta\\)로 두면 \\(\\int2\\sin\\theta\\cos\\theta\\,d\\theta=\\int2u\\,du=u^2=\\sin^2\\theta\\)예요. 따라서 미분하면 원래 식이 되는 함수의 하나는 \\(-2\\cos\\theta-\\sin^2\\theta\\)예요.","check":{"prompt":"둘째 항의 치환 변수와 미분관계는 무엇인가요?","answer":"\\(u=\\sin\\theta\\), \\(du=\\cos\\theta\\,d\\theta\\)예요."}},{"id":"c3","label":"양 끝값을 하나씩 넣어요","stepIds":["s7"],"question":"위끝값과 아래끝값을 넣으면 각각 어떤 값이 나오나요?","hint":"\\(F(\\pi/3)-F(\\pi/6)\\)을 두 줄로 나눠 계산해요.","explanation":"\\(F(\\theta)=-2\\cos\\theta-\\sin^2\\theta\\)라 두면 \\(F(\\pi/3)=-1-3/4=-7/4\\)예요. 또 \\(F(\\pi/6)=-\\sqrt3-1/4\\)예요. 따라서\n\n\\(F(\\pi/3)-F(\\pi/6)=-7/4+\\sqrt3+1/4=\\sqrt3-3/2=(2\\sqrt3-3)/2\\)예요. 정답은 ①이에요.","check":{"prompt":"아래끝값을 뺄 때 부호가 어떻게 바뀌나요?","answer":"\\(-7/4)-(-\\sqrt3-1/4)=-7/4+\\sqrt3+1/4\\)로 바뀌어요."}}],"takeaway":["원에서는 중심각과 원주각을 먼저 연결해요.","수선의 발이 나오면 직각삼각형의 삼각비로 필요한 길이를 구해요.","적분 결과를 바로 쓰지 말고 항을 나눈 이유와 치환식, 양 끝값 대입을 차례로 적어요."]};</script>
