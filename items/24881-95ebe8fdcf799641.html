{H}}$를 중심으로 하고 점 ${{Q}}$를 지나는 평면 $\\beta$ 위의 원은 반지름의 길이가 $4$이고 직선 ${{AB}}$에 접한다. 두 평면 $\\alpha$, $\\beta$가 이루는 각의 크기를 $\\theta$라 할 때, $\\cos \\theta$의 값은? (단, 점 ${{P}}$는 평면 $\\beta$ 위에 있지 않다.) [4점]\n① $\\frac{2 \\sqrt{66}}{33}$ ② $\\frac{4 \\sqrt{69}}{69}$ ③ $\\frac{ \\sqrt{2}}{3}$\n④ $\\frac{4 \\sqrt{3}}{15}$ ⑤ $\\frac{2 \\sqrt{78}}{39}$\n단답형","sourceHash":"34a87da0b06b58250b2667e9d56c38fbea44584fbe4fead78163239aa9cbed51","sourceKind":"csat","sourceLabel":"2023년 시행 수능 · 2024학년도 · 기하 · 28번","steps":[{"id":"s1","latex":"AB=18\\text{이므로 원 }C_1\\text{의 반지름은 }9\\text{이다. }O\\text{를 }AB\\text{의 중점으로 둔다.}"},{"id":"s2","latex":"H\\text{에서 }AB\\text{에 내린 수선의 발을 }H'\\text{라 하면 }HH'=4"},{"id":"s3","latex":"\\angle HFF'=\\frac\\pi6\\Rightarrow FH=8,\\quad FH'=4\\sqrt3"},{"id":"s4","latex":"F,H,Q\\text{가 한 직선 위이고 }HQ=4,\\ FH\u003cFQ\\Rightarrow FQ=12"},{"id":"s5","latex":"FQ+F'Q=18\\Rightarrow F'Q=6"},{"id":"s6","latex":"\\frac{F'Q}{FQ}=\\frac12=\\sin\\frac\\pi6\\Rightarrow F'Q\\perp AB,\\quad FF'=12\\cos\\frac\\pi6=6\\sqrt3"},{"id":"s7","latex":"OF=3\\sqrt3,\\quad OH'=FH'-OF=\\sqrt3"},{"id":"s8","latex":"PH'=\\sqrt{OP^{2}-OH'^{2}}=\\sqrt{81-3}=\\sqrt{78}"},{"id":"s9","latex":"\\theta=\\angle PH'H,\\quad \\cos\\theta=\\frac{HH'}{PH'}=\\frac4{\\sqrt{78}}=\\frac{2\\sqrt{78}}{39}"},{"id":"s10","latex":"\\therefore\\ \\boxed{\\frac{2\\sqrt{78}}{39}}\\;(⑤)"}],"track":"기하"};</script>
