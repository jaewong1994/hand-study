<script>window.HandStudyGuide={"itemId":17560,"sourceHash":"7af8d067854fa085bc95dbbd0577ee62b054a67303faaa49e7c57d3c5c28ba13","contentHash":"612dd3cb48aff03b8b93d4d2692273fd7f4667e78abb93a67649317a4ef9fd54","overview":{"goal":"구의 두 단면에서 길이와 각을 구해 정사영 넓이를 계산해요.","firstLook":"원 \\(C\\)의 지름 \\(AB\\)를 좌표축 방향으로 놓으면, \\(AB\\)에 수직인 평면 \\(BCD\\)가 구의 세로 단면이 돼요.","conditions":[{"label":"밑면 단면","meaning":"구와 \\(xy\\)평면의 교선 원 반지름은 \\(2\\)예요."},{"label":"수직 평면","meaning":"\\(BC,BD\\)는 모두 \\(AB\\)에 수직이에요."}]},"chapters":[{"id":"c1","label":"밑면 원과 수직 단면을 잡아요","stepIds":["s1","s2","s3","s4"],"question":"두 단면의 반지름은 각각 얼마인가요?","hint":"구의 중심에서 각 평면까지의 거리와 구의 반지름 \\(3\\)을 써요.","explanation":"구의 중심은 \\(O_s=(0,0,\\sqrt5)\\), 반지름은 \\(3\\)이에요. \\(xy\\)평면까지 거리가 \\(\\sqrt5\\)이므로 교선 원의 반지름은 \\(\\sqrt{9-5}=2\\), 따라서 지름 \\(AB=4\\)예요. 회전해 \\(A=(-2,0,0),B=(2,0,0)\\)로 놓아요. \\(AB\\)에 수직이고 \\(B\\)를 지나는 평면은 \\(x=2\\)이고, 구의 중심에서 이 평면까지 거리가 \\(2\\)이므로 단면 원 반지름은 \\(\\sqrt{9-4}=\\sqrt5\\)예요.","check":{"prompt":"\\(AB\\)의 길이가 \\(4\\)인 이유는 무엇인가요?","answer":"반지름 \\(2\\)인 밑면 원의 지름이기 때문이에요."}},{"id":"c2","label":"단면 원에서 중심각을 구해요","stepIds":["s5","s6"],"question":"왜 \\(\\angle CBD=60^\\circ\\)인가요?","hint":"단면 원의 중심을 \\(H\\)라 하고 두 이등변삼각형을 보세요.","explanation":"평면 \\(x=2\\)의 단면 원 중심을 \\(H=(2,0,\\sqrt5)\\)라 하면 \\(HB=HC=HD=\\sqrt5\\)예요. \\(BC=\\sqrt{15}\\)이므로 코사인법칙에서 \\(15=5+5-10\\cos\\angle BHC\\), 따라서 \\(\\angle BHC=120^\\circ\\)예요. 그러면 이등변삼각형 \\(BHC\\)의 밑각 \\(\\angle HBC=30^\\circ\\)이고 \\(D\\)도 같아요. \\(C,D\\)는 조건을 만족하는 서로 다른 두 점이므로 \\(BH\\)의 양쪽에 놓여 \\(\\angle CBD=30^\\circ+30^\\circ=60^\\circ\\)예요.","check":{"prompt":"\\(\\triangle BHC\\)의 꼭짓각은 얼마인가요?","answer":"코사인법칙으로 \\(120^\\circ\\)예요."}},{"id":"c3","label":"원래 삼각형의 넓이를 구해요","stepIds":["s7"],"question":"삼각형 \\(ABC\\)는 왜 직각삼각형인가요?","hint":"\\(AB\\)가 평면 \\(BCD\\)에 수직이라는 조건을 써요.","explanation":"\\(BC\\)는 평면 \\(BCD\\) 위에서 \\(B\\)를 지나므로 \\(AB\\perp BC\\)예요. 따라서 \\(\\triangle ABC\\)는 \\(B\\)에서 직각이고, 넓이는 \\([ABC]=\\frac12\\cdot AB\\cdot BC=\\frac12\\cdot4\\cdot\\sqrt{15}=2\\sqrt{15}\\)예요.","check":{"prompt":"직각을 이루는 두 변은 무엇인가요?","answer":"\\(AB\\)와 \\(BC\\)예요."}},{"id":"c4","label":"두 평면 사이의 각으로 정사영해요","stepIds":["s8"],"question":"정사영 넓이에 곱할 코사인은 왜 \\(\\cos60^\\circ\\)일까요?","hint":"교선 \\(AB\\)에 각각 수직인 \\(BC,BD\\)를 비교해요.","explanation":"평면 \\(ABC\\)와 평면 \\(ABD\\)의 교선은 \\(AB\\)예요. 두 평면 안에서 교선에 수직인 선은 각각 \\(BC,BD\\)이므로 두 평면 사이의 각은 \\(\\angle CBD=60^\\circ\\)예요. 따라서 정사영 넓이는 \\(k=[ABC]\\cos60^\\circ=2\\sqrt{15}\\cdot\\frac12=\\sqrt{15}\\), 곧 \\(k^2=15\\)예요.","check":{"prompt":"정사영 넓이 \\(k\\)는 원래 넓이보다 작은가요?","answer":"\\(\\cos60^\\circ=1/2\\)를 곱하므로 절반이 되어 작아요."}}],"takeaway":["구의 평면 단면 반지름은 중심에서 평면까지의 거리로 구해요.","두 평면 사이의 각은 교선에 각각 수직인 두 직선의 각으로 찾을 수 있어요.","정사영 넓이는 원래 넓이에 두 평면 사이 각의 코사인을 곱해요."]};</script>
