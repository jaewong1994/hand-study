  <script>window.HandStudyRecord={"itemId":16665,"sourceLabel":"2020 교육청 고3 수리가형 3월 30번","adminYear":2020,"grade":3,"month":3,"number":30,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"최고차항의 계수가 $4\\,$인 삼차함수 $f(x)\\,$와 실수 $t\\,$에 대하여 함수 $g(x)\\,$를\n $g(x)= \\int_t^x {f(s)}ds\\,$\n라 하자. 상수 $a\\,$에 대하여 두 함수 $f(x)\\,$와 $g(x)\\,$가 다음 조건을 만족시킨다.\n(가) $f'(a)=0\\,$ (나) 함수 $\\left| g(x) - g(a) \\right| \\,$가 미분가능하지 않은 $x\\,$의 개수는 $1\\,$이다.\n실수 $t\\,$에 대하여 $g(a)\\,$의 값을 $h(t)\\,$라 할 때, $h (3 )=0\\,$이고 함수 $h(t)\\,$는 $t=2\\,$에서 최댓값 $27\\,$을 가진다. $f(5)\\,$의 값을 구하시오. \n[4점]","answer":"432","sourceHash":"90545ee0d86e7e8ea7638d2fa780543c94a9c6b9a96084cd271bde6ca960129a","steps":[{"id":"s1","latex":"F\\prime=f,\\qquad g(x)-g(a)=F(x)-F(a)"},{"id":"s2","latex":"\\#\\{\\text{비미분점 of }|F(x)-F(a)|\\}=1\\Rightarrow F(x)-F(a)=(x-p)(x-q)^3"},{"id":"s3","latex":"f(x)=(x-q)^2(4x-q-3p),\\qquad f\\prime(x)=6(x-q)(2x-p-q)"},{"id":"s4","latex":"F(a)-F(a)=0,\\ f\\prime(a)=0\\Rightarrow a=q"},{"id":"s5","latex":"h(t)=F(a)-F(t)=-(t-p)(t-a)^3"},{"id":"s6","latex":"h\\text{의 부호변화 극점 }t=\\frac{a+3p}{4}=2\\Rightarrow a+3p=8"},{"id":"s7","latex":"h(3)=0\\Rightarrow(3-p)(3-a)^3=0"},{"id":"s8","latex":"h(2)=27\\Rightarrow(2-p)(2-a)^3=-27"},{"id":"s9","latex":"a=3\\Rightarrow p=\\frac53\\text{은 마지막 식 불만족}\\Rightarrow p=3,\\ a=-1"},{"id":"s10","latex":"f(x)=4(x+1)^2(x-2)\\Rightarrow f(5)=4\\cdot36\\cdot3=\\boxed{432}"}],"diagram":null,"contentHash":"4874b55e6e6ec805ce339ab1c718e49ba176bfd3f52ee720f97f2fcb94e062d1","questionHtml":"\u003cp class=\"hp\">최고차항의 계수가 \u003cspan class=\"heq\">\\(4\\,\\)\u003c/span>인 삼차함수 \u003cspan class=\"heq\">\\(f(x)\\,\\)\u003c/span>와 실수 \u003cspan class=\"heq\">\\(t\\,\\)\u003c/span>에 대하여 함수 \u003cspan class=\"heq\">\\(g(x)\\,\\)\u003c/span>를\u003c/p>\u003cp class=\"hp\">&emsp;\u003cspan class=\"heq\">\\(g(x)= \\int_{t}^{x} {f(s)}ds\\,\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">라 하자. 상수 \u003cspan class=\"heq\">\\(a\\,\\)\u003c/span>에 대하여 두 함수 \u
