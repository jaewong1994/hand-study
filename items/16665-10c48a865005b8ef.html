<script>window.HandStudyRecord={"itemId":16665,"sourceLabel":"2020 교육청 고3 수리가형 3월 30번","adminYear":2020,"grade":3,"month":3,"number":30,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"최고차항의 계수가 $4\\,$인 삼차함수 $f(x)\\,$와 실수 $t\\,$에 대하여 함수 $g(x)\\,$를\n $g(x)= \\int_t^x {f(s)}ds\\,$\n라 하자. 상수 $a\\,$에 대하여 두 함수 $f(x)\\,$와 $g(x)\\,$가 다음 조건을 만족시킨다.\n(가) $f'(a)=0\\,$ (나) 함수 $\\left| g(x) - g(a) \\right| \\,$가 미분가능하지 않은 $x\\,$의 개수는 $1\\,$이다.\n실수 $t\\,$에 대하여 $g(a)\\,$의 값을 $h(t)\\,$라 할 때, $h (3 )=0\\,$이고 함수 $h(t)\\,$는 $t=2\\,$에서 최댓값 $27\\,$을 가진다. $f(5)\\,$의 값을 구하시오. \n[4점]","answer":"432","sourceHash":"90545ee0d86e7e8ea7638d2fa780543c94a9c6b9a96084cd271bde6ca960129a","steps":[{"id":"s1","latex":"F\\prime=f,\\qquad g(x)-g(a)=F(x)-F(a)"},{"id":"s2","latex":"\\#\\{\\text{비미분점 of }|F(x)-F(a)|\\}=1\\Rightarrow F(x)-F(a)=(x-p)(x-q)^3"},{"id":"s3","latex":"f(x)=(x-q)^2(4x-q-3p),\\qquad f\\prime(x)=6(x-q)(2x-p-q)"},{"id":"s4","latex":"F(a)-F(a)=0,\\ f\\prime(a)=0\\Rightarrow a=q"},{"id":"s5","latex":"h(t)=F(a)-F(t)=-(t-p)(t-a)^3"},{"id":"s6","latex":"h\\text{의 부호변화 극점 }t=\\frac{a+3p}{4}=2\\Rightarrow a+3p=8"},{"id":"s7","latex":"h(3)=0\\Rightarrow(3-p)(3-a)^3=0"},{"id":"s8","latex":"h(2)=27\\Rightarrow(2-p)(2-a)^3=-27"},{"id":"s9","latex":"a=3\\Rightarrow p=\\frac53\\text{은 마지막 식 불만족}\\Rightarrow p=3,\\ a=-1"},{"id":"s10","latex":"f(x)=4(x+1)^2(x-2)\\Rightarrow f(5)=4\\cdot36\\cdot3=\\boxed{432}"}],"diagram":null,"contentHash":"4874b55e6e6ec805ce339ab1c718e49ba176bfd3f52ee720f97f2fcb94e062d1","questionHtml":"\u003cp class=\"hp\">최고차항의 계수가 \u003cspan class=\"heq\">\\(4\\,\\)\u003c/span>인 삼차함수 \u003cspan class=\"heq\">\\(f(x)\\,\\)\u003c/span>와 실수 \u003cspan class=\"heq\">\\(t\\,\\)\u003c/span>에 대하여 함수 \u003cspan class=\"heq\">\\(g(x)\\,\\)\u003c/span>를\u003c/p>\u003cp class=\"hp\">&emsp;\u003cspan class=\"heq\">\\(g(x)= \\int_{t}^{x} {f(s)}ds\\,\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">라 하자. 상수 \u003cspan class=\"heq\">\\(a\\,\\)\u003c/span>에 대하여 두 함수 \u003cspan class=\"heq\">\\(f(x)\\,\\)\u003c/span>와 \u003cspan class=\"heq\">\\(g(x)\\,\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가)\u003cspan class=\"heq\">\\(f'(a)=0\\,\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">(나)함수 \u003cspan class=\"heq\">\\(\\left| g(x) - g(a) \\right| \\,\\)\u003c/span>가 미분가능하지 않은 \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>의 개수는 \u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp class=\"hp\">실수 \u003cspan class=\"heq\">\\(t\\,\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(g(a)\\,\\)\u003c/span>의 값을 \u003cspan class=\"heq\">\\(h(t)\\,\\)\u003c/span>라 할 때, \u003cspan class=\"heq\">\\(h (3 )=0\\,\\)\u003c/span>이고 함수 \u003cspan class=\"heq\">\\(h(t)\\,\\)\u003c/span>는 \u003cspan class=\"heq\">\\(t=2\\,\\)\u003c/span>에서 최댓값 \u003cspan class=\"heq\">\\(27\\,\\)\u003c/span>을 가진다. \u003cspan class=\"heq\">\\(f(5)\\,\\)\u003c/span>의 값을 구하시오.\u003c/p>\u003cp class=\"hp\">\u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"10c48a865005b8ef83c15bed3242c910815d810f8e99c82855f9f36d1aabe8b4"};</script>
<script>window.HandStudyGuide={"itemId":16665,"sourceHash":"90545ee0d86e7e8ea7638d2fa780543c94a9c6b9a96084cd271bde6ca960129a","contentHash":"4874b55e6e6ec805ce339ab1c718e49ba176bfd3f52ee720f97f2fcb94e062d1","overview":{"goal":"절댓값이 미분되지 않는 영점의 모양으로 정적분 함수를 인수분해하고 \\(f(5)\\)를 구해요.","firstLook":"\\(F'(x)=f(x)\\)인 함수를 두면 \\(g(x)-g(a)=F(x)-F(a)\\)라서 아래끝 \\(t\\)가 사라져요.","conditions":[{"label":"(가)","meaning":"\\(a\\)는 \\(f'(x)=0\\)의 근이에요."},{"label":"(나)","meaning":"\\(|F(x)-F(a)|\\)가 꺾이는 영점은 정확히 하나예요."},{"label":"함수 h","meaning":"\\(h(t)=F(a)-F(t)\\)의 영점과 최댓값이 두 근의 위치를 정해요."}]},"chapters":[{"id":"c1","label":"절댓값이 꺾이는 영점을 표시해요","stepIds":["s1","s2","s3","s4"],"question":"왜 \\(F(x)-F(a)\\)를 \\((x-p)(x-q)^3\\)로 둘 수 있고 \\(a=q\\)일까요?","hint":"사차식의 영점에서 부호가 바뀌면 절댓값이 꺾여요. 그 인수들이 몇 번씩 곱해지는지와 \\(f'(a)=0\\)을 함께 봐요.","explanation":"\\(F'=f\\)로 두면 \\(g(x)-g(a)=F(x)-F(a)\\)예요. \\(f\\)의 최고차항 계수가 \\(4\\)이므로 \\(F(x)-F(a)\\)의 최고차항 계수는 \\(1\\)이에요. 절댓값이 미분되지 않는 영점이 하나라는 조건과 \\(x=a\\)가 영점이라는 사실을 함께 쓰면 \\(F(x)-F(a)=(x-p)(x-q)^3\\)로 둘 수 있어요. 미분하면 \\(f(x)=(x-q)^2(4x-q-3p)\\), 다시 미분하면 \\(f'(x)=6(x-q)(2x-p-q)\\)예요. \\(a\\)는 \\(p,q\\) 중 하나이면서 \\(f'(a)=0\\)이어야 하고 \\(p\ne q\\)이므로 공통으로 가능한 값은 \\(a=q\\)예요.","check":{"prompt":"\\(a=p\\)가 \\(f'(a)=0\\)을 만족하지 않는 이유는 무엇인가요?","answer":"\\(f'(p)=6(p-q)(p-q)\\)이고 \\(p\ne q\\)이므로 \\(0\\)이 아니기 때문이에요."}},{"id":"c2","label":"최댓값 위치와 영점 조건을 식으로 써요","stepIds":["s5","s6","s7","s8"],"question":"\\(h(t)\\)의 최댓값 위치는 왜 \\((a+3p)/4\\)일까요?","hint":"\\(h(t)=-(t-p)(t-a)^3\\)을 미분하고 실제로 부호가 바뀌는 인수를 찾아요.","explanation":"\\(a=q\\)이므로 \\(h(t)=F(a)-F(t)=-(t-p)(t-a)^3\\)이에요. 미분하면 \\(h'(t)=-(t-a)^2(4t-a-3p)\\)예요. \\(t=a\\)에서는 제곱인수 때문에 도함수 부호가 바뀌지 않고, 극값을 만드는 점은 \\(t=(a+3p)/4\\)예요. 주어진 최댓값 위치가 \\(2\\)이므로 \\(a+3p=8\\)이에요. 또 \\(h(3)=0\\)에서 \\((3-p)(3-a)^3=0\\), \\(h(2)=27\\)에서 \\((2-p)(2-a)^3=-27\\)을 얻어요.","check":{"prompt":"\\(h'(a)=0\\)인데도 \\(t=a\\)를 최댓값 위치로 쓰지 않는 이유는 무엇인가요?","answer":"도함수에 \\((t-a)^2\\)가 곱해져 있어 \\(a\\)의 양쪽에서 도함수 부호가 바뀌지 않기 때문이에요."}},{"id":"c3","label":"두 영점 후보를 수치로 걸러요","stepIds":["s9","s10"],"question":"\\(h(3)=0\\)에서 나온 \\(a=3\\)과 \\(p=3\\) 중 어느 쪽이 남을까요?","hint":"\\(a+3p=8\\)로 다른 문자를 정한 뒤 \\(h(2)=27\\)의 식에 넣어요.","explanation":"\\(a=3\\)이면 \\(p=5/3\\)인데 \\((2-p)(2-a)^3=-1/3\\)이라 \\(-27\\)이 되지 않아요. 따라서 \\(p=3\\)이고 \\(a+9=8\\)에서 \\(a=-1\\)이에요. 그러면 \\(f(x)=(x+1)^2(4x+1-9)=4(x+1)^2(x-2)\\)이고 \\(f(5)=4\\cdot36\\cdot3=432\\)예요.","check":{"prompt":"최종 함수의 최고차항 계수는 주어진 값과 맞나요?","answer":"\\(4(x+1)^2(x-2)\\)의 최고차항은 \\(4x^3\\)이므로 계수 \\(4\\)와 맞아요."}}],"takeaway":["적분의 아래끝이 다른 두 값을 빼면 부정적분 함수의 차로 바꾸어 매개변수를 없앨 수 있어요.","절댓값이 꺾이는 영점은 인수가 홀수 번 곱해져 부호가 바뀌는지 확인해요.","도함숫값이 0이어도 부호가 바뀌지 않으면 극대나 극소가 아닐 수 있어요."]};</script>
