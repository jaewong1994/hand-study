  <script>window.HandStudyRecord={"itemId":16360,"sourceLabel":"2019 교육청 고3 수리나형 10월 18번","adminYear":2019,"grade":3,"month":10,"number":18,"track":"수리나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"$1\\,$부터 $9\\,$까지의 자연수가 각각 하나씩 적힌 $9\\,$개의 공이 들어 있는 주머니에서 임의로 $1\\,$개의 공을 꺼내어 적힌 수를 더하는 시행을 반복한다. 꺼낸 공은 다시 넣지 않으며, 첫 번째 꺼낸 공에 적힌 수가 짝수이거나 꺼낸 공에 적힌 수를 차례로 더하다가 그 합이 짝수가 되면 이 시행을 멈추기로 한다. 시행을 멈출 때까지 꺼낸 공의 개수를 확률변수 $X\\,$라 하자. 다음은 $E \\left( X\\, \\right)\\,$를 구하는 과정이다. (단, 모든 공의 크기와 재질은 서로 같다.)\n첫 번째 꺼낸 공에 적힌 수가 홀수일 때, 꺼낸 공에 적힌 모든 수의 합이 짝수가 되려면 그 이후 시행에서 홀수가 적힌 공이 한 번 더 나와야 한다. 이때 짝수가 적힌 공은 $4\\,$개이므로 확률변수 $X\\,$가 가질 수 있는 값 중 가장 큰 값을 $m\\,$이라 하면 $m= BOX{\\, \\left(가 \\right)^\\,}\\,$이다.(ⅰ) $X=1 \\,$인 경우 첫 번째 꺼낸 공에 적힌 수가 짝수이므로 $P \\left( X=1 \\right)\\,$$= \\frac{4}{9}$ (ⅱ) $X=2\\,$인 경우 첫 번째와 두 번째 꺼낸 공에 적힌 수가 모두 홀수이므로 $P \\left( X=2 \\,\\right)\\,$$= \\frac{{} _{5}\\, P _{2}}{{} _{9}\\, P _{2}}$$= \\frac{5}{18} \\,$ (ⅲ) $X=k\\,$($3 \\leq k \\leq m$)인 경우 첫 번째와 $k\\,$번째 꺼낸 공에 적힌 수가 홀수이고, 두 번째부터 ($k-1$)번째까지 꺼낸 공에 적힌 수가 모두 짝수이므로 $P \\left( X=k \\,\\right)\\,$$= \\frac{\\, BOX{\\, \\left(나 \\right)^\\, \\,}}{{} _{9}\\, P _{ k } } \\,$ 따라서 $E \\left( X\\, \\right)\\,$$= \\sum _{i=1} ^{m} \\, \\left\\{ i \\times P\\, \\left( X=i\\, \\right) \\right\\} \\,$$=2$\n위의 (가)에 알맞은 수를 $a\\,$라 하고, (나)에 알맞은 식을 $f \\left(k \\right)\\,$라 할 때, $a+f \\left(4 \\right)\\,$의 값은? [4점]\n① $246$ ② $248$ ③ $250$ ④ $252$ ⑤ $254$","answer":"①","sourceHash":"65548dee0ead41e726eeaff7d7851d786f8fd37f804da458bb5ea5787281414d","steps":[{"id":"s1","latex":"\\#\\{\\text{홀수 공}\\}=5,\\qquad\\#\\{\\text{짝수 공}\\}=4"},{"id":"s2","latex":"X_{\\max}:\\quad\\mathrm O\\,\\mathrm E\\,\\mathrm E\\,\\mathrm E\\,\\mathrm E\\,\\mathrm O\\Rightarrow a=6"},{"id":"s3","latex":"3\\le k\\le6:\\quad \\mathrm O\\,\\underbrace{\\mathrm E\\cdots\\mathrm E}_{k-2}\\,\\mathrm O"},{"id":"s4","latex":"f(k)=5\\cdot{}_4\\mathrm P_{k-2}\\cdot4=20\\cdot{}_4\\mathrm P_{k-2}"},{"id":"s5","latex":"f(4)=20\\cdot{}_4\\mathrm P_2=
