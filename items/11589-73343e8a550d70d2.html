  <script>window.HandStudyRecord={"itemId":11589,"sourceLabel":"2019 교육청 고1 수학 6월 20번","adminYear":2019,"grade":1,"month":6,"number":20,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 좌표평면 위의 네 점 $O \\left( 0\\,,\\,0 \\right) \\,$, $A \\left( 1\\,,\\,0 \\right) \\,$, $B \\left( 1\\,,\\,2 \\right) \\,$, $C \\left( 0\\,,\\,1 \\right) \\,$을 꼭짓점으로 하는 사각형 $OABC\\,$가 있다. 실수 $k\\,$($0\u003ck\u003c1\\,$)에 대하여 직선 $y=k\\,$가 세 선분 $OC\\,$, $OB\\,$, $AB\\,$와 만나는 점을 각각 $D\\,$, $E\\,$, $F\\,$라 하자. 삼각형 $OED\\,$의 넓이를 $S _{1} \\,$, 사각형 $OAFE\\,$의 넓이를 $S _{2} \\,$, 삼각형 $EFB\\,$의 넓이를 $S _{3} \\,$, 사각형 $DEBC\\,$의 넓이를 $S _{4} \\,$라 할 때, $\\left(S _{1} -S _{3} \\right) ^{2} +\\left(S _{2} -S _{4} \\right) ^{2} \\,$의 최솟값은? [4점]\n$O$$y=k$$y$$x$$B$$C$$A$$D$$E$$F$\n① $\\frac{1}{8}$ ② $\\frac{3}{16}$ ③ $\\frac{1}{4}$ ④ $\\frac{5}{16}$ ⑤ $\\frac{3}{8}$","answer":"①","sourceHash":"a98f6e312c9ac9ca2b1a6418b1b8dd38232fc952f1f47cb6a54d8a483e605652","steps":[{"id":"s1","latex":"[OABC]=\\frac32,\\quad E=\\left(\\frac k2,k\\right)"},{"id":"s2","latex":"S_1=\\frac{k^2}{4},\\quad S_3=\\frac{(2-k)^2}{4}\\Rightarrow S_1-S_3=k-1"},{"id":"s3","latex":"S_1+S_2=k,\\quad S_3+S_4=\\frac32-k"},{"id":"s4","latex":"S_2-S_4=k-\\frac12"},{"id":"s5","latex":"(S_1-S_3)^2+(S_2-S_4)^2=(k-1)^2+\\left(k-\\frac12\\right)^2"},{"id":"s6","latex":"=2\\left(k-\\frac34\\right)^2+\\frac18\\ge\\frac18"}],"diagram":null,"contentHash":"e939621cb476cccc569eff8211c3a0e6b2fc1f07dd16bd49d11815a71ebb6671","questionHtml":"\u003cp class=\"hp\">그림과 같이 좌표평면 위의 네 점 \u003cspan class=\"heq\">\\(O \\left( 0\\,,\\,0 \\right) \\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(A \\left( 1\\,,\\,0 \\right) \\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(B \\left( 1\\,,\\,2 \\right) \\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(C \\left( 0\\,,\\,1 \\right) \\,\\)\u003c/span>을 꼭짓점으로 하는 사각형 \u003cspan class=\"heq\">\\(OABC\\)\u003c/span>가 있다.\u003cbr>실수 \u003cspan class=\"heq\">\\(k\\)\u003c/span>(\u003cspan class=\"he
