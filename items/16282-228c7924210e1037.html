<script>window.HandStudyRecord={"itemId":16282,"sourceLabel":"2019 교육청 고3 수리가형 4월 30번","adminYear":2019,"grade":3,"month":4,"number":30,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"삼차함수 $f \\left( x \\right) =x ^{3} +ax ^{2} +bx$($a$, $b$는 정수)에 대하여 함수 $g \\left( x \\right) =e ^{f\\, \\left( x \\right)} -f \\left( x \\right)$는 $x= \\alpha$, $x=-1$, $x=\\beta$ $\\left( \\alpha < -1< \\beta \\right)$에서만 극값을 갖는다. 함수 $y= \\left| g \\left( x \\right) -g \\left( \\alpha \\right) \\right|$가 미분가능하지 않은 점의 개수가 $2$일 때, $\\left\\{ f \\left( -1 \\right) \\right\\} ^{2}$의 최댓값을 구하시오. [4점]","answer":"9","sourceHash":"0aaf8bc3eabe92b3568136ea74b5515670d1e70e46800c71961407b58dee7090","steps":[{"id":"s1","latex":"g'(x)=f'(x)(e^{f(x)}-1),\\quad g'(x)\\text{의 부호는 }f(x)f'(x)\\text{의 부호와 같다}"},{"id":"s2","latex":"g(x)\\ge1,\\quad g(x)=1\\Leftrightarrow f(x)=0"},{"id":"s3","latex":"f(-1)=0\\Rightarrow f(x)=x(x+1)(x-r)"},{"id":"s4","latex":"r\\notin\\{-1,0\\}\\Rightarrow3\\text{개의 영점과 그 사이의 }2\\text{개의 }f'\\text{의 근}\\Rightarrow g\\text{의 극값이 }5\\text{개}"},{"id":"s5","latex":"r\\in\\{-1,0\\}\\Rightarrow g\\text{의 모든 극값 위치가 }-1\\text{ 이상}\\Rightarrow\\alpha<-1\\text{과 모순}"},{"id":"s6","latex":"\\therefore f'(-1)=0,\\quad f(-1)\\ne0"},{"id":"s7","latex":"f'\\text{의 다른 근을 }c\\text{라 하면 극값 세 점은 }c,-1,0\\Rightarrow c<-1"},{"id":"s8","latex":"f(x)=x(x^2+ax+b),\\quad f'(-1)=0\\Rightarrow b=2a-3"},{"latex":"x^2+ax+b\\text{의 서로 다른 두 근이 모두 }0\\text{이 아니면}\\quad g\\text{의 극값은 }5\\text{개}","id":"s9"},{"latex":"b=0:\\quad f=x^2(x+a),\\quad f\\prime=x(3x+2a)","id":"s10"},{"latex":"f\\prime(-1)=0\\Rightarrow a=3/2\\notin\\mathbb Z\\quad\\text{이므로 제외}","id":"s11"},{"id":"s12","latex":"x^2+ax+b=(x-c)^2\\Rightarrow f=x(x-c)^2,\\quad Z_{f'}=\\left\\{c,\\dfrac c3\\right\\}"},{"id":"s13","latex":"f(-1)\\ne0,\\ f'(-1)=0\\Rightarrow c=-3"},{"id":"s14","latex":"c=-3\\Rightarrow g(c)=1\\Rightarrow|g-g(c)|=g-1\\text{은 모든 점에서 미분가능}"},{"id":"s15","latex":"\\therefore x^2+ax+b\\text{는 실근이 없고 }a^2-4b<0"},{"id":"s16","latex":"c+(-1)=-\\dfrac{2a}{3}\\Rightarrow c=1-\\dfrac{2a}{3}<-1\\Rightarrow a>3"},{"id":"s17","latex":"a^2-4(2a-3)<0\\Rightarrow2<a<6"},{"id":"s18","latex":"a\\in\\mathbb Z\\Rightarrow a\\in\\{4,5\\},\\quad f(-1)=2-a"},{"latex":"a=4,5:\\quad g(c)>1;\\quad g(x)=g(c)\\text{는 }(-1,0),\\ (0,\\infty)\\text{에서 각각 한 번 횡단}","id":"s19"},{"id":"s20","latex":"f(-1)^2\\text{의 최댓값은 }4,9\\text{ 중 }9"}],"diagram":null,"contentHash":"4c2c9115a0a152b09f676dbb3fe5fc0674f64dd99a1852083e91740afa536151","questionHtml":"<p class=\"hp\">삼차함수 <span class=\"heq\">\\(f \\left( x \\right) =x^{3} +ax^{2} +bx\\)<\/span>(<span class=\"heq\">\\(a\\)<\/span>, <span class=\"heq\">\\(b\\)<\/span>는 정수)에 대하여 <br>함수 <span class=\"heq\">\\(g \\left( x \\right) =e^{f\\, \\left( x \\right)} -f \\left( x \\right)\\)<\/span>는 <br><span class=\"heq\">\\(x= \\alpha\\)<\/span>, <span class=\"heq\">\\(x=-1\\)<\/span>, <span class=\"heq\">\\(x=\\beta\\)<\/span> <span class=\"heq\">\\(\\left( \\alpha \\lt  -1\\lt  \\beta \\right)\\)<\/span>에서만 극값을 갖는다. <br>함수 <span class=\"heq\">\\(y= \\left| g \\left( x \\right) -g \\left( \\alpha \\right) \\right|\\)<\/span>가 미분가능하지 않은 점의 개수가 <span class=\"heq\">\\(2\\)<\/span>일 때, <span class=\"heq\">\\(\\left\\{ f \\left( -1 \\right) \\right\\}^{2}\\)<\/span>의 최댓값을 구하시오. <span class=\"hscore\">[4점]<\/span><\/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"8a0dde9ca24cc30ce317c1c153b25e246659b38d6fd7a1bc540a752bdbaaa792"};</script>
<script>window.HandStudyGuide={"itemId":16282,"sourceHash":"0aaf8bc3eabe92b3568136ea74b5515670d1e70e46800c71961407b58dee7090","contentHash":"4c2c9115a0a152b09f676dbb3fe5fc0674f64dd99a1852083e91740afa536151","overview":{"goal":"\\(g\\)의 극값 위치와 절댓값의 미분불가능한 점을 이용해 정수 계수 \\(a,b\\)를 좁혀요.","firstLook":"\\(e^u-1\\)은 \\(u\\)와 부호가 같으므로 \\(g'=f'(e^f-1)\\)의 부호는 \\(f\\)와 \\(f'\\)의 부호를 함께 보면 돼요.","conditions":[{"label":"극값 세 곳","meaning":"\\(g'\\)의 부호가 바뀌는 점이 \\(\\alpha,-1,\\beta\\)뿐이에요."},{"label":"미분불가능한 점 두 곳","meaning":"\\(|g-g(\\alpha)|\\)에서 영점을 가로지르는 곳이 정확히 두 곳이어야 해요."}]},"chapters":[{"id":"c1","label":"마이너스 일에서 어떤 인수가 영인지 정해요","stepIds":["s1","s2","s3","s4","s5","s6","s7"],"question":"왜 \\(f(-1)=0\\)이 아니라 \\(f'(-1)=0\\)이어야 할까요?","hint":"\\(f\\)의 영점과 \\(f'\\)의 영점이 만드는 \\(g\\)의 극값 개수를 세어요.","explanation":"\\(g'(x)=f'(x)(e^{f(x)}-1)\\)이고 \\(e^{f(x)}-1\\)은 \\(f(x)\\)와 부호가 같아요. 또 \\(e^u-u\\ge1\\)이며 등호는 \\(u=0\\)일 때뿐이에요. 만약 \\(f(-1)=0\\)이면 \\(f=x(x+1)(x-r)\\)예요. \\(r\\)이 \\(-1,0\\)과 다르면 세 영점과 그 사이의 두 \\(f'\\)의 근에서 모두 부호 변화가 생겨 극값이 다섯 개예요. \\(r=-1\\) 또는 \\(0\\)이면 모든 극값 위치가 \\(-1\\) 이상이라 \\(\\alpha<-1\\)과 맞지 않아요. 따라서 \\(f'(-1)=0\\), \\(f(-1)\\ne0\\)이고, \\(f'\\)의 다른 근 \\(c\\)는 \\(c<-1\\)이에요.","check":{"prompt":"\\(f(-1)=0\\)인 두 갈래가 모두 탈락하는 이유를 구분해 말해 보세요.","answer":"서로 다른 세 영점이면 극값이 다섯 개이고, 중복된 영점이면 \\(-1\\)보다 왼쪽의 극값 \\(\\alpha\\)를 만들 수 없어요."}},{"id":"c2","label":"이차인수의 실근을 없애요","stepIds":["s8","s9","s10","s11","s12","s13","s14","s15"],"question":"\\(x^2+ax+b\\)가 실근을 가지면 왜 조건을 만족하지 못할까요?","hint":"서로 다른 두 근, \\(b=0\\), 같은 두 근의 세 경우를 빠짐없이 봐요.","explanation":"\\(f=x(x^2+ax+b)\\)이고 \\(f'(-1)=0\\)에서 \\(b=2a-3\\)이에요. 이차인수에 서로 다른 0이 아닌 두 실근이 있으면 \\(f\\)의 세 영점과 \\(f'\\)의 두 근이 \\(g\\)의 극값 다섯 개를 만들어요. \\(b=0\\)이면 \\(f=x^2(x+a)\\), \\(f'=x(3x+2a)\\)이고 \\(f'(-1)=0\\)에서 \\(a=3/2\\)라 정수 조건에 어긋나요. 이차인수가 \\((x-c)^2\\)이면 \\(f=x(x-c)^2\\), \\(f'\\)의 근은 \\(c,c/3\\)이고 \\(-1\\)이 근이려면 \\(c=-3\\)이에요. 그런데 이때 \\(g(c)=1\\)이라 \\(|g-g(c)|=g-1\\)은 모든 점에서 미분가능해 두 곳이라는 조건에 어긋나요. 따라서 이차인수는 실근이 없어 \\(a^2-4b<0\\)이에요.","check":{"prompt":"같은 두 근인 경우 절댓값 함수가 매끄러운 이유는 무엇인가요?","answer":"\\(g(c)=1\\)은 \\(g\\)의 가장 작은 값이라 \\(g-1\\ge0\\)이고, 절댓값을 씌워도 함수가 바뀌지 않아요."}},{"id":"c3","label":"정수 후보를 두 개로 줄여요","stepIds":["s16","s17","s18"],"question":"\\(c<-1\\)과 판별식 조건은 \\(a\\)를 어떤 범위로 좁힐까요?","hint":"\\(f'\\)의 두 근의 합과 \\(b=2a-3\\)을 사용해요.","explanation":"삼차식 \\(f'=3x^2+2ax+b\\)의 두 근은 \\(c,-1\\)이므로 \\(c-1=-2a/3\\), 곧 \\(c=1-2a/3\\)이에요. \\(c<-1\\)에서 \\(a>3\\)을 얻어요. 판별식 조건은 \\(a^2-4(2a-3)<0\\), 즉 \\((a-2)(a-6)<0\\)이므로 \\(2<a<6\\)이에요. 정수이면서 \\(a>3\\)인 후보는 \\(a=4,5\\)이고 \\(f(-1)=2-a\\)예요.","check":{"prompt":"두 후보에서 \\(f(-1)\\)은 각각 얼마인가요?","answer":"\\(a=4\\)이면 \\(-2\\), \\(a=5\\)이면 \\(-3\\)이에요."}},{"id":"c4","label":"절댓값의 두 모서리와 최종값을 확인해요","stepIds":["s19","s20"],"question":"두 후보가 미분불가능한 점 두 개를 실제로 만들까요?","hint":"\\(g(c)>1\\)인 높이를 \\(g\\)가 어느 구간에서 가로지르는지 봐요.","explanation":"\\(a=4,5\\)에서는 \\(g(c)>1\\)이고, 방정식 \\(g(x)=g(c)\\)는 \\((-1,0)\\)과 \\((0,\\infty)\\)에서 각각 한 번씩 그래프를 가로질러요. 이 두 점에서 \\(g-g(c)\\)의 부호가 바뀌므로 절댓값 그래프에 모서리가 정확히 두 개 생겨요. 따라서 두 후보 모두 가능하고 \\(f(-1)^2\\)는 \\(4,9\\)예요. 그중 최댓값은 \\(9\\)예요.","check":{"prompt":"후보별 제곱값과 답은 무엇인가요?","answer":"\\((-2)^2=4\\), \\((-3)^2=9\\)이므로 답은 \\(9\\)예요."}}],"takeaway":["\\(e^{f(x)}-1\\)의 부호를 \\(f(x)\\)의 부호로 바꾸면 도함수 부호를 셀 수 있어요.","극값 개수는 \\(f\\)와 \\(f'\\)의 영점이 실제로 부호를 바꾸는지 확인해 세어요.","절댓값이 미분불가능한 곳은 안쪽 함수가 0을 가로지르는 점인지 확인해요."]};</script>
