  <script>window.HandStudyRecord={"itemId":7795,"sourceLabel":"2019 교육청 고2 수학가형 9월 18번","adminYear":2019,"grade":2,"month":9,"number":18,"track":"수학가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"일반항이 $a_{n} =n^{2} \\,$인 수열 $\\left\\{ a_{n} \\right\\} \\,$의 첫째항부터 제$n\\,$항까지의 \n합을 $S_{n} \\,$이라 하자. 다음은 모든 자연수 $n\\,$에 대하여 \n $(n+1)S_{n} - \\sum\\limits_{k=1}^{n} S_{k} = \\sum\\limits_{k=1}^{n} k^{3} \\,$ $\\cdots \\cdots \\,(＊)$\n이 성립함을 수학적 귀납법으로 증명한 것이다.\n(i) $n=1\\,$일 때,\n (좌변)$=2S_{1} -S_{1} =1\\,$, (우변)$=1\\,$이므로\n (＊)이 성립한다.\n(ii) $n=m\\,$일 때 (＊)이 성립한다고 가정하면\n$(m+1)S_{m} - \\sum\\limits_{k=1}^{m} S_{k} = \\sum\\limits_{k=1}^{m} k^{3} \\,$이다.\n$n=m+1\\,$일 때 (＊)이 성립함을 보이자.\n$(m+2)S_{m+1} - \\sum\\limits_{k=1}^{m+1} S_{k}$\n$= {\\boxed{\\vphantom{(}\\,(\\text{가})\\,}} \\,S_{m+1} - \\sum\\limits_{k=1}^{m} S_{k}$\n$= {\\boxed{\\vphantom{(}\\,(\\text{가})\\,}} \\,S_{m} +$ ${\\boxed{\\vphantom{(}\\,(\\text{나})\\,}} \\,$$- \\sum\\limits_{k=1}^{m} S_{k}$\n$= \\sum\\limits_{k=1}^{m+1} k^{3} \\,$이다.\n따라서 $n=m+1\\,$일 때도 (＊)이 성립한다.\n(i), (ii)에 의하여 주어진 식은 모든 자연수 $n\\,$에 대하여 성립한다.\n위의 (가), (나)에 알맞은 식을 각각 $f(m)\\,$, $g(m)\\,$이라 할 때, $f(2)+g(1)\\,$의 값은? [4점]\n① $7$ ② $8$ ③ $9$ ④ $10$ ⑤ $11\\,$","answer":"⑤","sourceHash":"76bfa271ed3cb75cc08c007fc4b9f57a1a6a0914458f1ba139ecedfd4d24cc35","steps":[{"id":"s1","latex":"(m+2)S_{m+1}-\\sum_{k=1}^{m+1}S_k=(m+1)S_{m+1}-\\sum_{k=1}^mS_k"},{"id":"s2","latex":"S_{m+1}=S_m+(m+1)^2"},{"id":"s3","latex":"(m+1)S_{m+1}=(m+1)S_m+(m+1)^3"},{"id":"s4","latex":"f(m)=m+1,\\quad g(m)=(m+1)^3"},{"id":"s5","latex":"f(2)+g(1)=3+8=11"}],"diagram":null,"contentHash":"c7780bc967b4e38b72b4e2db3fafe16efa4733d9033f07d479aae300ed7d1943","questionHtml":"\u003cp class=\"hp htall\">일반항이 \u003cspan class=\"heq\">\\(a_{n} =n^{2} \\,\\)\u003c/span>인 수열 \u003cspan class=\"heq\">\\(\\left\\{ a_{n} \\right\\} \\,\\)\u003c/span>의 첫째항부터 제\u003cspan class=\"heq\">\\(n\\,\\)\u003c/span>항까지의 \u003cbr>합을 \u003cspan class=\"heq\">\\(S_{n} \\,\\)\u003c/span>이라 하
