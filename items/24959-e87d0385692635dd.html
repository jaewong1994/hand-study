s=\"hch\">① \u003cspan class=\"heq\">\\(\\frac{6 \\sqrt{15}}{5}\\,\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">② \u003cspan class=\"heq\">\\(\\frac{38 \\sqrt{10}}{25}\\,\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">③ \u003cspan class=\"heq\">\\(\\frac{14 \\sqrt{3}}{5}\\,\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">④ \u003cspan class=\"heq\">\\(\\frac{32 \\sqrt{15}}{25}\\,\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">⑤ \u003cspan class=\"heq\">\\(\\frac{8 \\sqrt{10}}{5}\\)\u003c/span>\u003c/div>\u003c/div>","questionText":"그림과 같이 ${ \\overline{{AB}}}=3\\,$, ${ \\overline{{BC}}}=4\\,$이고 $ang \\leq {{B}}=\\frac{ \\pi }{2}\\,$인 직각삼각형 ${{ABC}}\\,$가 있다. 선분 ${{AB}}\\,$를 $2\\,:\\,1\\,$로 내분하는 점을 ${{D}}\\,$, 점 ${{A}}\\,$를 중심으로 하고 반지름의 길이가 ${ \\overline{{AD}}}\\,$인 원이 선분 ${{AC}}\\,$와 만나는 점을 ${{E}}\\,$, 직선 ${{AB}}\\,$가 이 원과 만나는 점 중 ${{D}}\\,$가 아닌 점을 ${{F}}\\,$라 하고, 호 ${{EF}}$ 위의 점 ${{G}}\\,$를 ${ \\overline{{CG}}}=2 \\sqrt{6}\\,$이 되도록 잡는다. 세 점 ${{C}}\\,$, ${{E}}\\,$, ${{G}}\\,$를 지나는 원 위의 점 ${{H}}\\,$가 $ang \\leq {{HCG}}= ang \\leq {{BAC}}\\,$를 만족시킬 때, 선분 ${{GH}}\\,$의 길이는? [4점]\n① $\\frac{6 \\sqrt{15}}{5}\\,$ ② $\\frac{38 \\sqrt{10}}{25}\\,$ ③ $\\frac{14 \\sqrt{3}}{5}\\,$\n④ $\\frac{32 \\sqrt{15}}{25}\\,$ ⑤ $\\frac{8 \\sqrt{10}}{5}$","sourceHash":"c619d2d4a26d157bc35538e9b89fee9678b5b082cd0628d60a7a624755c6e271","sourceKind":"csat","sourceLabel":"2025년 시행 수능 · 2026학년도 · 공통 · 14번","steps":[{"id":"s1","latex":"AB=3,\\ BC=4,\\ \\angle B=\\frac\\pi2\\Rightarrow AC=5,\\quad \\sin\\angle BAC=\\frac45"},{"id":"s2","latex":"AD=AE=AG=2,\\quad CE=AC-AE=3"},{"id":"s3","latex":"CG^{2}=AC^{2}+AG^{2}-2\\cdot AC\\cdot AG\\cos\\angle CAG"},{"id":"s4","latex":"24=25+4-20\\cos\\angle CAG\\Rightarrow \\cos\\angle EAG=\\frac14"},{"id":"s5","latex":"EG^{2}=2^{2}+2^{2}-2\\cdot2\\cdot2\\cdot\\frac14=6"},{"id":"s6","latex":"\\triangle CEG\\text{에서 }CE=3,\\ EG=\\sqrt6,\\ CG=2\\sqrt6"},{"id":"s7","latex":"\\cos\\angle CGE=\\frac{EG^{2}+CG^{2}-CE^{2}}{2\\,EG\\,CG}=\\frac78"},{"id":"s8","latex":"\\sin\\angle CGE=\\frac{\\sqrt{15}}8\\Rightarrow 2R=\\frac{CE}{\\sin\\angle CGE}=\\frac{8\\sqrt{15}}5"},{"id":"s9","latex":"C,E,G,H\\text{가 한 원 위이고 }\\sin\\angle HCG=\\sin\\angle BAC=\\frac45"},{"id":"s10","latex":"GH=2R\\sin\\angle HCG=\\frac{8\\sqrt{15}}5\\cdot\\frac45=\\frac{32\\sqrt{15}}{25}"},{"id":"s11","latex":"\\therefore\\ \\boxed{\\frac{32\\sqrt{15}}{25}}\\;(④)"}],"track":"공통"};</script>
