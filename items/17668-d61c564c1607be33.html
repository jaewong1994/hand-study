<script>window.HandStudyGuide={"itemId":17668,"sourceHash":"f42a807cc882d85e361883fa2379beab4520e7e46b91df9dbf23bc11c3dbe411","contentHash":"021d1fb922e8c8d14d1b20eefb46406442b731ac549e59fdb296c90c711e227a","overview":{"goal":"극한으로 정의된 함수를 세 구간으로 나눈 뒤, 확대된 조각들의 양의 함숫값 범위에서 빠지는 높이를 찾아 합해요.","firstLook":"\\(f\\)의 식은 \\(|x|\\)가 1보다 작은지, 같은지, 큰지에 따라 달라져요. 경계값을 따로 계산해야 빠지는 높이를 정확히 찾을 수 있어요.","conditions":[{"label":"거듭제곱의 극한","meaning":"\\(|x|<1\\)에서는 높은 거듭제곱이 0으로 가고, \\(|x|>1\\)에서는 최고차항으로 나누어 판단해요."},{"label":"절댓값 띠의 반열린 구간","meaning":"각 조각에서 어느 끝점이 포함되는지가 특정 높이의 누락을 결정해요."}]},"chapters":[{"id":"c1","label":"극한함수의 세 경우 구하기","stepIds":["s1"],"question":"\\(|x|=1\\)에서는 왜 양옆에서 얻은 식을 쓰지 않고 원래 식에 직접 대입해야 할까요?","hint":"\\(x^{2n}\\)과 \\(x^{2n+1}\\)의 값을 \\(x=1,-1\\)에서 각각 계산하세요.","explanation":"\\(|x|<1\\)이면 \\(x^{2n}\\)과 \\(x^{2n+1}\\)이 모두 0으로 가므로 \\(f(x)=-x\\)예요. \\(|x|>1\\)이면 분자와 분모를 \\(x^{2n}\\)으로 나누어 \\(\\frac{x-x/x^{2n}}{1+1/x^{2n}}\\)로 볼 수 있으므로 \\(f(x)=x\\)예요. 경계에서는 원래 식을 직접 계산해요. \\(x=1\\)이면 분자가 \\(1-1=0\\), \\(x=-1\\)이면 분자가 \\(-1-(-1)=0\\)이어서 둘 다 \\(f(x)=0\\)이에요.","check":{"prompt":"\\(f(1)\\)을 \\(|x|>1\\)에서의 식 \\(f(x)=x\\)로 계산하면 안 되는 이유는 무엇인가요?","answer":"\\(|x|>1\\)에서 구한 극한은 경계 \\(|x|=1\\)을 포함하지 않아요. 경계에서는 원래 수열을 직접 계산해야 해요."}},{"id":"c2","label":"각 띠에서 함수의 식 정하기","stepIds":["s2","s3","s4"],"question":"\\(\\left|x/(2k-1)\\right|\\)가 1보다 작은지 같은지 큰지에 따라 \\(g(x)\\)는 어떻게 달라질까요?","hint":"경계 \\(|x|=2k-1\\)을 따로 떼고 앞에서 구한 \\(f\\)의 세 식을 대입하세요.","explanation":"\\(2k-2\\le|x|<2k-1\\)에서는 \\(\\left|x/(2k-1)\\right|<1\\)이므로 \\(g(x)=(2k-1)(-x/(2k-1))=-x\\)예요. \\(|x|=2k-1\\)에서는 \\(f(\\pm1)=0\\)이므로 \\(g(x)=0\\)이에요. \\(2k-1<|x|<2k\\)에서는 비의 절댓값이 1보다 크므로 \\(g(x)=x\\)예요. 같은 띠에서도 경계에서 값이 0으로 바뀐다는 점을 놓치면 안 돼요.","check":{"prompt":"\\(|x|=2k-1\\)에서 \\(g(x)\\)가 \\(x\\)나 \\(-x\\)가 아니라 0인 이유는 무엇인가요?","answer":"그때 \\(f\\)의 입력이 \\(1\\) 또는 \\(-1\\)이고, 두 경계값 모두 0이기 때문이에요."}},{"id":"c3","label":"양의 높이의 범위 찾기","stepIds":["s5","s6"],"question":"양의 \\(x\\)와 음의 \\(x\\)에서 양의 함숫값이 나오는 구간은 각각 어디인가요?","hint":"\\(x>0\\)에서는 \\(g=x\\), \\(x<0\\)에서는 \\(g=-x\\)가 양수가 되는 조각만 남기세요.","explanation":"\\(x>0\\)에서는 \\(g(x)>0\\)인 부분이 \\(2k-1<x<2k\\)이고, 그때 함숫값도 \\(2k-1<g(x)<2k\\)예요. \\(x<0\\)에서는 안쪽 조각에서 \\(g(x)=-x=|x|\\)이므로 \\(2k-2\\le|x|<2k-1\\)의 높이가 나와요. 따라서 양의 치역은 각 \\(k\\)에 대해 \\([2k-2,2k-1)\\)과 \\((2k-1,2k)\\)에서 0을 뺀 부분이에요. 가운데 홀수 높이 \\(2k-1\\)만 양쪽 모두 열린 끝점이라 빠져요.","check":{"prompt":"짝수 높이 \\(2k\\)도 첫 구간에서는 열린 끝점인데 왜 전체 치역에서 빠지지 않나요?","answer":"다음 띠의 음의 \\(x\\) 쪽 구간이 \\([2k,2k+1)\\)로 시작하며 왼쪽 끝 \\(2k\\)를 포함하기 때문이에요."}},{"id":"c4","label":"빠진 높이 합하기","stepIds":["s7","s8"],"question":"0보다 크고 10보다 작은 범위에서 홀수 높이는 어떤 것들이 있나요?","hint":"1부터 9까지의 홀수만 적고 합하세요.","explanation":"그래프와 만나지 않는 양의 높이는 홀수 \\(2k-1\\)뿐이에요. \\(0<t<10\\)에서는 \\(1,3,5,7,9\\)이고 합은 \\(1+3+5+7+9=25\\)예요.","check":{"prompt":"높이 10을 합에 넣지 않는 이유는 무엇인가요?","answer":"문제의 범위가 \\(0<t<10\\)이라 10은 포함되지 않아요."}}],"takeaway":["극한으로 조각함수를 만들 때 경계값은 원래 식에서 직접 확인해요.","반열린 구간은 다음 조각과 합쳤을 때 끝점이 보충되는지도 살펴봐요.","그래프와 만나지 않는 높이는 전체 치역의 빈틈으로 찾아요."]};</script>
