<script>window.HandStudyGuide={"itemId":18187,"sourceHash":"0de97adbdff0e11d8540c8afb4b403d4fa41cbe38ff66d25701d5994a18acaee","contentHash":"463a2894a0bc0ce9c330d5275d008ae857f402ae6aa55254f8dbe7c370bd1a2c","overview":{"goal":"수평선 교점 수가 바뀌는 높이와 불연속점의 상쇄를 이용해 \\(a\\)와 삼차함수를 정해요.","firstLook":"삼차함수와 수평선의 교점 수는 두 극값의 높이에서만 바뀌어요. \\(g(t-4)\\)는 그 불연속점을 오른쪽으로 \\(4\\)만큼 옮겨요.","conditions":[{"label":"불연속점 두 개","meaning":"가운데 두 불연속이 서로 상쇄되고 양 끝 두 점만 남아야 해요."},{"label":"원점을 지나는 조건","meaning":"확정한 두 모양의 삼차함수 중 가능한 두 경우를 모두 계산해 비교해요."}]},"chapters":[{"id":"c1","label":"불연속점의 간격을 정해요","stepIds":["s1","s2","s3"],"question":"왜 극솟값과 극댓값의 차가 \\(4\\)이고 \\(a=8\\)인가요?","hint":"\\(g\\)의 불연속점을 \\(m<M\\)라 쓰면 \\(g(t-4)\\)의 불연속점은 \\(m+4,M+4\\)예요.","explanation":"삼차함수의 극솟값을 \\(m\\), 극댓값을 \\(M\\)이라 하면 수평선 교점 수 \\(g(t)\\)는 \\(m,M\\)에서만 바뀌어요. \\(g(t-4)\\)는 \\(t=m+4,M+4\\)에서 바뀌어요. 합의 불연속점이 두 개만 남으려면 가운데의 변화가 같은 점에서 반대 방향으로 상쇄되어야 하므로 \\(M=m+4\\)예요.\n\n그러면 남는 두 불연속점은 \\(m\\)과 \\(M+4=m+8\\)이에요. 이것이 \\(0,a\\)이고 \\(a>0\\)이므로 \\(m=0,M=4,a=8\\)이에요.","check":{"prompt":"\\(m+4=M\\)에서 두 변화가 상쇄되는 이유는 무엇인가요?","answer":"\\(g\\)는 극댓값 \\(M\\)을 지날 때 교점 수가 줄고, \\(g(t-4)\\)는 극솟값 \\(m\\)을 지날 때 교점 수가 늘어 변화량이 반대이기 때문이에요."}},{"id":"c2","label":"극값 차로 두 근의 간격을 구해요","stepIds":["s4","s5"],"question":"삼차함수를 왜 \\((x-p)^2(x-q)\\)로 둘 수 있나요?","hint":"극솟값이 \\(0\\)이므로 그래프가 \\(x\\)축에 접하는 이중근이 있어요.","explanation":"극솟값이 \\(0\\)이므로 어떤 \\(x=p\\)에서 그래프가 \\(x\\)축에 접해요. 최고차항 계수가 \\(1\\)인 삼차식이므로 \\(f(x)=(x-p)^2(x-q)\\)로 둘 수 있고, 극댓값이 왼쪽에 오도록 \\(q<p\\)예요.\n\n이 함수의 다른 극점은 \\(x=(p+2q)/3\\)이고 그 함숫값은 \\(4(p-q)^3/27\\)이에요. 이것이 극댓값 \\(4\\)이므로 \\(p-q=3\\)이에요. 또 \\(f(0)=0\\)이므로 \\(p=0\\) 또는 \\(q=0\\)이에요.","check":{"prompt":"\\(f(0)=0\\)에서 왜 두 경우만 생기나요?","answer":"\\(f(0)=p^2(-q)=0\\)이므로 곱이 \\(0\\)이 되려면 \\(p=0\\) 또는 \\(q=0\\)이에요."}},{"id":"c3","label":"두 경우의 값을 비교해요","stepIds":["s6"],"question":"\\(f(8)\\)의 두 후보는 무엇인가요?","hint":"\\(p-q=3\\)과 \\(p=0\\) 또는 \\(q=0\\)을 각각 써요.","explanation":"\\(p=0\\)이면 \\(q=-3\\)이고 \\(f(x)=x^2(x+3)\\)이라 \\(f(8)=64\\cdot11=704\\)예요. \\(q=0\\)이면 \\(p=3\\)이고 \\(f(x)=x(x-3)^2\\)라 \\(f(8)=8\\cdot25=200\\)이에요. 두 함수 모두 극솟값 \\(0\\), 극댓값 \\(4\\), \\(f(0)=0\\)을 만족하므로 가능한 값 중 최솟값은 \\(200\\)이에요.","check":{"prompt":"작은 값만 남기기 전에 두 함수가 원래 극값 조건을 모두 만족하나요?","answer":"네. 두 경우 모두 \\(p-q=3\\)이라 극값의 높이 차가 \\(4\\)이고, \\(0\\)도 근이에요."}}],"takeaway":["수평선 교점 수는 삼차함수의 두 극값 높이에서 바뀌어요.","평행이동된 두 교점 수 함수의 불연속이 상쇄되려면 변화점의 위치와 방향을 함께 봐요.","마지막 조건이 두 경우를 남기면 둘 다 원래 조건에 재대입한 뒤 요구한 최솟값을 골라요."]};</script>
