ht)= \\begin{cases}\\,-x^{2} & & \\left(x \u003c 0 \\right) \\\\ \\, x^{2}-x & & \\left(x \\geq 0 \\right)\\end{cases}\\,$\n이고, 양수 $a\\,$에 대하여 함수 $g \\left(x \\right)\\,$를\n $g \\left(x \\right)= \\begin{cases}\\,ax+a & & \\left(x \u003c\\,-1 \\right) \\\\ \\, 0 & & \\left(-1 \\leq x \u003c 1 \\right) \\\\ \\, ax-a & & \\left(x \\geq 1 \\right)\\end{cases}\\,$\n이라 하자. 함수 $h \\left(x \\right)= \\int_{0}^{x} \\left(g \\left(t \\right)-f \\left(t \\right) \\right)\\,dt\\,$가 오직 하나의 극값을 갖도록 하는 $a\\,$의 최댓값을 $k\\,$라 하자. $a=k\\,$일 때, $k+h \\left(3 \\right)\\,$의 값은? [4점]\n① $\\frac{9}{2}\\,$ ② $\\frac{11}{2}\\,$ ③ $\\frac{13}{2}\\,$ ④ $\\frac{15}{2}\\,$ ⑤ $\\frac{17}{2}$\n단답형","sourceHash":"b86c771f7d4e1b84437508112d54ed4218c8630129ca05888cc91edf85e62172","sourceKind":"csat","sourceLabel":"2025년 시행 수능 · 2026학년도 · 공통 · 15번","steps":[{"id":"s1","latex":"h'(x)=g(x)-f(x)=\\begin{cases}x^{2}+ax+a&(x\u003c-1)\\\\x^{2}&(-1\\le x\u003c0)\\\\x(1-x)&(0\\le x\u003c1)\\\\-(x-1)(x-a)&(x\\ge1)\\end{cases}"},{"id":"s2","latex":"-1\u003cx\u003c1\\text{에서는 }h'(x)\\ge0"},{"id":"s3","latex":"x\\ge1\\text{에서는 }0\u003ca\\le1\\text{이면 }x=1,\\ a>1\\text{이면 }x=a\\text{에서만 }h'\\text{가 양에서 음으로 바뀐다.}"},{"id":"s4","latex":"\\text{극값이 하나뿐이려면 }x\u003c-1\\text{에서 }x^{2}+ax+a\\text{의 부호가 바뀌지 않아야 한다.}"},{"explanation":{"body":"이차식은 \\(x=-1\\)에서 양수입니다. 축 \\(-a/2\\)가 \\(-1\\)의 왼쪽에 있고 판별식이 양수이면 \\(x\u003c-1\\)에서 두 근을 지나며 부호가 두 번 바뀝니다. \\(a=4\\)는 중근이라 부호가 바뀌지 않으므로 허용됩니다.","skillTags":["도함수부호","판별식","중근경계"],"title":"왼쪽 조각에서 극값이 더 생기는 때"},"id":"s5","latex":"x^{2}+ax+a\\text{의 축이 }-1\\text{보다 왼쪽이고 두 근이 생기는 때는 }a>4"},{"id":"s6","latex":"\\therefore\\ 0\u003ca\\le4,\\quad k=4"},{"id":"s7","latex":"h(3)=\\int_{0}^{1}(x-x^{2})\\,dx+\\int_{1}^{3}-(x-1)(x-4)\\,dx"},{"id":"s8","latex":"=\\frac16+\\frac{10}{3}=\\frac72"},{"id":"s9","latex":"k+h(3)=4+\\frac72=\\frac{15}{2}"},{"id":"s10","latex":"\\therefore\\ \\boxed{\\frac{15}{2}}\\;(④)"}],"track":"공통"};</script>
