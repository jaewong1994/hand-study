  <script>window.HandStudyRecord={"itemId":16269,"sourceLabel":"2019 교육청 고3 수리가형 4월 17번","adminYear":2019,"grade":3,"month":4,"number":17,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"다음은 비어 있는 세 주머니 $A$, $B$, $C$에 먼저 흰 공 $6$개를 남김없이 나누어 넣은 후 검은 공 $6$개를 남김없이 나누어 넣을 때, 빈 주머니가 생기지 않도록 나누어 넣는 경우의 수를 구하는 과정이다. (단, 같은 색의 공은 구별하지 않는다.)\n빈 주머니가 생기지 않도록 나누어 넣는 경우의 수는\n세 주머니 $A$, $B$, $C$에 먼저 흰 공 $6$개를 남김없이 나누어 넣은 후 검은 공 $6$개를 남김없이 나누어 넣을 때, \n흰 공을 넣지 않은 주머니가 있으면 그 주머니에는 검은 공이 $1$개 이상 들어가도록 나누어 넣는 경우의 수와 같다.\n흰 공을 넣은 주머니의 개수를 $n$이라 하면\n(ⅰ) $n=3$일 때\n세 주머니 $A$, $B$, $C$에 흰 공을 각각 $1$개 이상 나누어 넣은 후, 검은 공을 나누어 넣는 경우이므로 \n이 경우의 수는 ${}_{3} H_{3} \\times \\left. {\\boxed{\\vphantom{(}\\,(\\text{가}) \\,}} \\right.$이다.\n(ⅱ) $n=2$일 때\n세 주머니 $A$, $B$, $C$ 중 $2$개의 주머니에 흰 공을 각각 $1$개 이상 나누어 넣은 후, 검은 공을 나누어 넣는 경우이므로\n이 경우의 수는 $\\left. {\\boxed{\\vphantom{(}\\,(\\text{나}) \\,}} \\right.$이다.\n(ⅲ) $n=1$일 때\n세 주머니 $A$, $B$, $C$ 중 $1$개의 주머니에 흰 공을 넣은 후, \n검은 공을 나누어 넣는 경우이므로\n이 경우의 수는 $\\left. {\\boxed{\\vphantom{(}\\,(\\text{다}) \\,}} \\right.$이다.\n따라서 (ⅰ), (ⅱ), (ⅲ)에 의하여 구하는 경우의 수는\n${}_{3} H_{3} \\times \\left. {\\boxed{\\vphantom{(}\\,(\\text{가}) \\,}} \\right. \\,+\\, \\left. {\\boxed{\\vphantom{(}\\,(\\text{나}) \\,}} \\right. \\,+\\, \\left. {\\boxed{\\vphantom{(}\\,(\\text{다}) \\,}} \\right.$이다.\n위의 (가), (나), (다)에 알맞은 수를 각각 $p$, $q$, $r$라 할 때, \n$p+q+r$의 값은? [4점]\n① $374$ ② $381$ ③ $388$ ④ $395$ ⑤ $402$","answer":"③","sourceHash":"1eafba8e3d2fc0f35f9c75b3a48535e5352729d518e505a05b59e09329dff5be","steps":[{"id":"s1","latex":"p={}_3\\mathrm H_6={}_8\\mathrm C_6=28"},{"id":"s2","latex":"q={}_3\\mathrm C_2{}_2\\mathrm H_4{}_3\\mathrm H_5=3\\cdot5\\cdot21=315"},{"id":"s3","latex":"r={}_3\\mathrm C_1{}_3\\mathrm H_4=3\\cdot15=45"},{"id":"s4","latex":"p+q+r=388"}],"diagram":null,"contentHash":"0e2f7eb2547d2fe2b16fffa2d52d63c87e88c6ed123f1dfffee33720ad951a19","questionHtml":"\u003cp class=\"hp\">다음은 비어 있는 세 주머니 \u003cspan class=\"heq\">\\(A\\)\u003c/span>, \u003cspan cl
