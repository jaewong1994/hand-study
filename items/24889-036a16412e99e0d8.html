  <script>window.HandStudyRecord={"adminYear":2023,"answer":"②","contentHash":"05c6915777ae849244623d4f7c81ed9799e8627e0aa4d8a7db4d92be10ee3c41","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24889,"month":11,"number":28,"points":4,"preview":false,"questionHtml":"\u003cp>실수 전체의 집합에서 연속인 함수 \u003cspan class=\"heq\">\\(f(x)\\)\u003c/span>가 모든 실수 \u003cspan class=\"heq\">\\(x\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(f(x) \\geq 0\\)\u003c/span>이고, \u003cspan class=\"heq\">\\(x&lt;0\\)\u003c/span>일 때 \u003cspan class=\"heq\">\\(f \\left(x \\right)=\\,-4xe ^{4x ^{2}}\\)\u003c/span>이다. 모든 양수 \u003cspan class=\"heq\">\\(t\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(x\\)\u003c/span>에 대한 방정식 \u003cspan class=\"heq\">\\(f(x)=t\\)\u003c/span>의 서로 다른 실근의 개수는 \u003cspan class=\"heq\">\\(2\\)\u003c/span>이고, 이 방정식의 두 실근 중 작은 값을 \u003cspan class=\"heq\">\\(g(t)\\)\u003c/span>, 큰 값을 \u003cspan class=\"heq\">\\(h(t)\\)\u003c/span>라 하자. 두 함수 \u003cspan class=\"heq\">\\(g(t)\\)\u003c/span>, \u003cspan class=\"heq\">\\(h(t)\\)\u003c/span>는 모든 양수 \u003cspan class=\"heq\">\\(t\\)\u003c/span>에 대하여\u003c/p>\u003cp> \u003cspan class=\"heq\">\\(2g \\left( t \\right) +h \\left( t \\right) =k \\, \\left( k \\right.\\)\u003c/span>는 상수\u003cspan class=\"heq\">\\()\\)\u003c/span>\u003c/p>\u003cp>를 만족시킨다. \u003cspan class=\"heq\">\\(\\int _{0} ^{7} {} f \\left(x \\right)dx=e ^{4} -1\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(\\frac{f \\left(9 \\right)}{f \\left(8 \\right)}\\)\u003c/span>의 값은? [4점]\u003c/p>\u003cdiv class=\"hchoices\">\u003cdiv class=\"hch\">① \u003cspan class=\"heq\">\\(\\frac{3}{2} e^{5}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">② \u003cspan class=\"heq\">\\(\\frac{4}{3} e^{7}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">③ \u003cspan class=\"heq\">\\(\\frac{5}{4} e^{9}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">④ \u003cspan class=\"heq\">\\(\\frac{6}{5} e^{11}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">⑤ \u003cspan class=\"heq\">\\(\\frac{7}{6} e^{13}\\)\u003c/span>\u003c/div>\u003c/div>","questionText":"실수 전체의 집합에서 연속인 함수 $f(x)$가 모든 실수 $x$에 대하여 $f(x) \\geq 0$이고, $x\u003c0$일 때 $f \\left(x \\right)=\\,-4xe ^{4x ^{2}}$이다. 모든 양수 $t$에 대하여 $x$에 대한 방정식 $f(x)=t$의 서로 다른 실근의 개수는 $2$이고, 이 방정식의 두 실근 중 작은 값을 $g(t)$, 큰 값을 $h(t)$라 하자. 두 함수 $g(t)$, $h(t)$는 모든 양수 $t$에 대하여\n $2g \\left( t \\right) +h \\left( t \\right) =k \\, \\left( k \\right.$는 상수$)$\n를 만족시킨다. $\\int _{0} ^{7} {} f \\left(x \\right)dx=e ^{4} -1$일 때, $\\frac{f \\left(9 \\right)}{f \\left(8 \\right)}$의 값은? [4점]\n① $\\frac{3}{2} e^{5}$ ② $\\frac{4}{3} e^{7}$ ③ $\\frac{5}{4} e^{9}$\n④ $\\frac{6}{5} e^{11}$ ⑤ $\\frac{7}{6} e^{13}$\n단답형","sourceHash":"808eb4b1e16c293bd5a5adcde3cef4ed35896fca545d80815520b64002b09b09","sourceKind":"csat","sourceLabel":"2023년 시행 수능 · 2024학년도 · 미적분 · 28번","steps":[{"id":"s1","latex":"x\u003c0\\text{에서 }f(x)=-4xe^{4x^{2}}\\text{는 감소하며 }(0,\\infty)\\text{를 한 번씩 지난다.}"},{"id":"s2","latex":"f(g(t))=f(h(t))=t,\\quad 2g(t)+h(t)=k\\Rightarrow h(t)=k-2g(t)"},{"explanation":{"body":"같은 높이 \\(t\\)를 만드는 두 근이 \\(g(t),h(t)\\)이고 \\(2g+h=k\\)이므로, 양의 근을 \\(x=h(t)\\)라 두면 음의 근은 \\(g(t)=\\frac{k-x}{2}\\)로 바로 표현됩니다.","skillTags":["역함수관계","변수치환"],"title":"음의 근을 양의 근으로 옮기기"},"id":"s3","latex":"x=h(t)>0\\text{로 두면 }g(t)=\\frac{k-x}{2}"},{"id":"s4","latex":"f(x)=-4\\frac{k-x}{2}e^{4((k-x)/2)^2}=-2(k-x)e^{(k-x)^2}\\quad(x\\ge k)"},{"id":"s5","latex":"\\text{연속성과 }f\\ge0\\text{으로 }0\\le x\u003ck\\text{에서는 }f(x)=0"},{"explanation":{"body":"\\((k-x)^2=u\\)로 두면 \\(du=-2(k-x)dx\\)입니다. 적분식에 이 미분이 그대로 들어 있으므로 \\(\\int-2(k-x)e^{(k-x)^2}dx\\)는 \\(\\int e^u du\\)로 바뀝니다.","skillTags":["치환적분","지수함수"],"title":"지수 적분의 안쪽 식을 치환"},"id":"s6","latex":"\\int_{0}^{7}f(x)\\,dx=\\int_{k}^{7}-2(k-x)e^{(k-x)^2}\\,dx=e^{(7-k)^2}-1"},{"id":"s7","latex":"e^{(7-k)^2}-1=e^{4}-1,\\quad 0\u003ck\u003c7\\Rightarrow k=5"},{"id":"s8","latex":"\\frac{f(9)}{f(8)}=\\frac{2(9-5)e^{(9-5)^2}}{2(8-5)e^{(8-5)^2}}=\\frac43e^{7}"},{"id":"s9","latex":"\\therefore\\ \\boxed{\\frac
