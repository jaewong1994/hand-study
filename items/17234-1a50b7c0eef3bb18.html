  <script>window.HandStudyRecord={"itemId":17234,"sourceLabel":"2021 평가원 고3 수학확통 9월 22번","adminYear":2021,"grade":3,"month":9,"number":22,"track":"확통","points":4,"scoreStatus":"confirmed_4_direct","questionText":"최고차항의 계수가 $1$인 삼차함수 $f \\left( x \\right)$에 대하여 함수\n $g \\left( x \\right) =f \\left( x-3 \\right) \\times \\lim _{h\\to 0+} {} \\frac{\\left| f(x+h) \\right| - \\left| f(x-h) \\right|}{h}$\n가 다음 조건을 만족시킬 때, $f \\left( 5 \\right)$의 값을 구하시오. [4점]\n(가) 함수 $g \\left( x \\right)$는 실수 전체의 집합에서 연속이다.(나) 방정식 $g \\left( x \\right)$$=0$은 서로 다른 네 실근 $\\alpha _{1} ,\\, \\alpha _{2} ,\\, \\alpha _{3} ,\\, \\alpha _{4}$를 갖고 $\\alpha _{1} + \\alpha _{2} + \\alpha _{3} + \\alpha _{4}$$=7$이다.","answer":"108","sourceHash":"431577d3fa03461fb2fed7bbc7a3131d077b155dace4cf24413d51a6c7596aac","steps":[{"id":"s1","latex":"L(x)=\\lim_{h\\to0+}\\frac{|f(x+h)|-|f(x-h)|}{h}=|f|_+\\prime(x)+|f|_-\\prime(x)"},{"id":"s2","latex":"f(x)\\ne0\\Rightarrow L(x)=2\\operatorname{sgn}(f(x))f\\prime(x),\\qquad f(r)=0\\Rightarrow L(r)=0"},{"id":"s3","latex":"f(r)=0,\\ f\\prime(r)\\ne0\\Rightarrow L(r-)=-2|f\\prime(r)|,\\quad L(r+)=2|f\\prime(r)|"},{"id":"s4","latex":"g(x)=f(x-3)L(x)\\text{ 연속}\\Rightarrow f(r-3)=0\\quad\\text{(모든 단순근 }r\\text{)}"},{"id":"s5","latex":"\\text{가장 작은 실근은 단순근일 수 없음}\\Rightarrow\\text{중근 또는 삼중근}"},{"id":"s6","latex":"f(x)=(x-p)^3\\Rightarrow g(x)=0\\text{의 서로 다른 근은 }p,p+3\\text{뿐}\\quad\\text{모순}"},{"id":"s7","latex":"\\therefore\\ f(x)=(x-p)^2(x-q),\\quad q>p"},{"id":"s8","latex":"q\\text{는 단순근},\\ f(q-3)=0\\Rightarrow q-3=p\\Rightarrow q=p+3"},{"id":"s9","latex":"f(x)=(x-p)^2(x-p-3),\\qquad f\\prime(x)=3(x-p)(x-p-2)"},{"id":"s10","latex":"g(x)=0\\Rightarrow x\\in\\{p,p+2,p+3,p+6\\}"},{"id":"s11","latex":"4p+11=7\\Rightarrow p=-1"},{"id":"s12","latex":"f(5)=(5+1)^2(5-2)=\\boxed{108}"}],"diagram":null,"contentHash":"6790319ea8f35d4151ed9c3cbc6f0b6a7e140040173cd7c62425b4fa6b8b99aa","questionHtml":"\u003cp class=\"hp\">최고차항의 계수가 \u003cspan class=\"heq\">\\(1\\)\u003c/spa
