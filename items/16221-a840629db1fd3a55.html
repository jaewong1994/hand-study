<script>window.HandStudyRecord={"itemId":16221,"sourceLabel":"2019 교육청 고3 수리가형 10월 29번","adminYear":2019,"grade":3,"month":10,"number":29,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"좌표공간의 세 점 $A \\left( -1,\\,0,\\,6 \\right)$, $B \\left( 2,\\,- \\sqrt{3} ,\\,0 \\right)$, $C \\left( 3,\\,0,\\,0 \\right)$에 대하여 두 점 $P$, $Q$가\n $\\left| {\\vec{AP}} \\right| =2\\,$, $\\left| {\\vec{CQ}} \\right| =2 \\sqrt{3}$, ${\\vec{BC}} \\cdot {\\vec{CQ}} =6$\n을 만족시킨다. $\\left| {\\vec{PQ}} \\right|$의 최댓값을 구하시오. [4점]","answer":"12","sourceHash":"2e2022afbfe2c6db2bb51d05a3ccac93073f805e9d7ea71c12d208e631990aca","steps":[{"id":"s1","latex":"\\vec{BC}=(1,\\sqrt3,0),\\quad|\\vec{BC}|=2,\\quad|\\vec{CQ}|=2\\sqrt3"},{"id":"s2","latex":"\\vec{BC}\\cdot\\vec{CQ}=6\\Rightarrow\\cos\\theta=\\frac{\\sqrt3}{2}"},{"id":"s3","latex":"D=C+\\frac{6}{|\\vec{BC}|^2}\\vec{BC}=(9/2,3\\sqrt3/2,0)"},{"id":"s4","latex":"Q:\\quad\\text{중심 }D,\\ \\text{반지름 }\\sqrt3,\\ \\vec{BC}\\text{에 수직인 평면 위의 원}"},{"id":"s5","latex":"\\vec{AD}=\\left(\\frac{11}{2},\\frac{3\\sqrt3}{2},-6\\right),\\quad|\\vec{AD}|^2=73"},{"id":"s6","latex":"H=A\\text{에서 }Q\\text{가 움직이는 원의 평면에 내린 수선의 발}"},{"id":"s7","latex":"AH=\\left|\\vec{AD}\\cdot\\frac{\\vec{BC}}{|\\vec{BC}|}\\right|=5,\\quad HD=\\sqrt{73-25}=4\\sqrt3"},{"id":"s8","latex":"AQ\\text{의 최댓값}=\\sqrt{AH^2+(HD+\\sqrt3)^2}=\\sqrt{25+75}=10"},{"id":"s9","latex":"PQ\\text{의 최댓값}=AQ\\text{의 최댓값}+AP=10+2=\\boxed{12}"}],"diagram":null,"contentHash":"b93cbfd398212291598a30394b2e09c1f2a945c115fab86752c842e5d3e66998","questionHtml":"<p class=\"hp\">좌표공간의 세 점 <span class=\"heq\">\\(A \\left( -1,\\,0,\\,6 \\right)\\)<\/span>, <span class=\"heq\">\\(B \\left( 2,\\,- \\sqrt{3} ,\\,0 \\right)\\)<\/span>, <span class=\"heq\">\\(C \\left( 3,\\,0,\\,0 \\right)\\)<\/span>에 대하여 두 점 <span class=\"heq\">\\(P\\)<\/span>, <span class=\"heq\">\\(Q\\)<\/span>가<\/p><p class=\"hp\">&emsp;<span class=\"heq\">\\(\\left| {\\overrightarrow{AP}} \\right| =2\\,\\)<\/span>,  <span class=\"heq\">\\(\\left| {\\overrightarrow{CQ}} \\right| =2 \\sqrt{3}\\)<\/span>,  <span class=\"heq\">\\({\\overrightarrow{BC}} \\cdot {\\overrightarrow{CQ}} =6\\)<\/span><\/p><p class=\"hp\">을 만족시킨다. <span class=\"heq\">\\(\\left| {\\overrightarrow{PQ}} \\right|\\)<\/span>의 최댓값을 구하시오. <span class=\"hscore\">[4점]<\/span><\/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"05a65df94d2a93b091304091b9eed4c02369e15d50f95049aece2cc16e8f9680"};</script>
<script>window.HandStudyGuide={"itemId":16221,"sourceHash":"2e2022afbfe2c6db2bb51d05a3ccac93073f805e9d7ea71c12d208e631990aca","contentHash":"b93cbfd398212291598a30394b2e09c1f2a945c115fab86752c842e5d3e66998","overview":{"goal":"내적 조건으로 점 \\(Q\\)의 자취인 원을 찾고, 점 \\(A\\)에서 가장 먼 \\(Q\\)와 점 \\(P\\)를 차례로 정해요.","firstLook":"\\(\\overrightarrow{CQ}\\)의 길이와 \\(\\overrightarrow{BC}\\) 방향 성분이 고정되어 있으므로 \\(Q\\)는 한 평면 위의 원을 움직여요.","conditions":[{"label":"점 P","meaning":"\\(P\\)는 중심 \\(A\\), 반지름 \\(2\\)인 구 위를 움직여요."},{"label":"점 Q의 길이","meaning":"\\(Q\\)는 \\(C\\)에서 거리가 \\(2\\sqrt3\\)으로 고정돼요."},{"label":"점 Q의 내적","meaning":"\\(\\overrightarrow{CQ}\\)의 \\(\\overrightarrow{BC}\\) 방향 성분이 고정돼 자취의 평면을 정해요."}]},"chapters":[{"id":"c1","label":"점 Q가 움직이는 원을 찾아요","stepIds":["s1","s2","s3","s4"],"question":"내적 조건에서 원의 중심 \\(D\\)와 반지름은 어떻게 나오나요?","hint":"\\(\\overrightarrow{CQ}\\)를 \\(\\overrightarrow{BC}\\)와 나란한 성분과 수직인 성분으로 나눠요.","explanation":"\\(\\overrightarrow{BC}=(1,\\sqrt3,0)\\)이고 길이는 \\(2\\)예요. 내적이 \\(6\\)이므로 \\(\\overrightarrow{CQ}\\)의 \\(\\overrightarrow{BC}\\) 방향 성분의 길이는 \\(6/2=3\\)이에요. 그 성분의 끝점을 \\(D\\)라 하면\n\n\\(D=C+\\frac{6}{|\\overrightarrow{BC}|^2}\\overrightarrow{BC}=(9/2,3\\sqrt3/2,0)\\)\n\n이에요. 전체 길이가 \\(2\\sqrt3\\)이므로 수직 성분의 길이는 \\(\\sqrt{12-9}=\\sqrt3\\)이에요. 따라서 \\(Q\\)는 중심 \\(D\\), 반지름 \\(\\sqrt3\\)인 원 위를 움직이고, 그 원의 평면은 \\(\\overrightarrow{BC}\\)에 수직이에요.","check":{"prompt":"원의 반지름을 \\(2\\sqrt3-3\\)으로 빼면 안 되는 이유는 무엇인가요?","answer":"두 성분은 서로 수직이라 길이를 바로 빼지 않고 피타고라스 관계 \\((2\\sqrt3)^2=3^2+r^2\\)를 써야 해요."}},{"id":"c2","label":"점 A에서 원까지의 가장 먼 거리를 구해요","stepIds":["s5","s6","s7","s8"],"question":"공간의 점 \\(A\\)에서 이 원 위의 점까지의 가장 먼 거리는 왜 \\(10\\)일까요?","hint":"\\(A\\)에서 원의 평면에 내린 수선의 발을 \\(H\\)라 하고 \\(AH\\), \\(HD\\)를 분리해요.","explanation":"\\(\\overrightarrow{AD}=(11/2,3\\sqrt3/2,-6)\\)이라 \\(AD^2=73\\)이에요. \\(AH\\)는 원의 평면에 수직이고 \\(BC\\)도 그 평면에 수직이므로 두 선분은 서로 나란해요. 따라서 \\(|\\overrightarrow{AD}\\cdot\\overrightarrow{BC}|=AH\\cdot BC\\)이고, 실제 좌표를 넣으면 \\(AH=10/2=5\\)예요. 직각삼각형 \\(AHD\\)에서 \\(HD=\\sqrt{AD^2-AH^2}=\\sqrt{73-25}=4\\sqrt3\\)이에요.\n\n평면 안에서 \\(H\\)와 가장 먼 원 위의 점은 \\(D\\)에서 \\(H\\)의 반대쪽으로 반지름만큼 간 점이라 \\(HQ=HD+\\sqrt3=5\\sqrt3\\)이에요. 직각삼각형 \\(AHQ\\)에서 \\(AQ=\\sqrt{AH^2+HQ^2}=\\sqrt{25+75}=10\\)이 가장 커요.","check":{"prompt":"평면 안에서 \\(HQ\\)의 가장 큰 값이 왜 \\(HD+\\sqrt3\\)인가요?","answer":"중심이 \\(D\\)이고 반지름이 \\(\\sqrt3\\)인 원에서 \\(H,D,Q\\)가 한 직선 위에 놓이고 \\(Q\\)가 \\(H\\)의 반대편에 있을 때 두 길이가 더해지기 때문이에요."}},{"id":"c3","label":"점 P를 반대 방향에 놓아요","stepIds":["s9"],"question":"\\(AQ=10\\)인 점 \\(Q\\)를 골랐을 때 \\(PQ\\)를 어떻게 \\(12\\)로 만들 수 있나요?","hint":"중심 \\(A\\), 반지름 \\(2\\)인 구에서 \\(Q\\)와 반대 방향의 점을 골라요.","explanation":"\\(AP=2\\)이므로 고정된 \\(Q\\)에 대해 \\(P\\)를 직선 \\(AQ\\) 위에서 \\(Q\\)의 반대쪽에 잡으면 \\(PQ=AQ+AP\\)가 돼요. 앞에서 \\(AQ\\)의 가장 큰 값이 \\(10\\)이었으므로 \\(PQ\\)의 최댓값은 \\(10+2=12\\)예요.","check":{"prompt":"삼각부등식의 위쪽 경계 \\(PQ\\le AQ+AP\\)에서 실제로 등호를 만들 수 있나요?","answer":"네. \\(A\\)를 사이에 두고 \\(P,A,Q\\)를 한 직선 위에 놓으면 \\(PQ=PA+AQ\\)가 돼요."}}],"takeaway":["길이와 한 방향의 내적이 고정된 벡터의 끝점은 그 방향에 수직인 평면 위의 원을 그려요.","공간의 점에서 평면 위 원까지의 거리는 수선 거리와 평면 안 거리를 직각삼각형으로 합쳐요.","독립적으로 움직이는 두 점의 최대 거리는 각 단계의 등호가 실제로 동시에 가능한지 확인해요."]};</script>
