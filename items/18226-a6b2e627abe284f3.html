<script>window.HandStudyGuide={"itemId":18226,"sourceHash":"af3c31272af3545e8152a13141ccea6f2d9d8f510cd461e8b865a07b051ec26e","contentHash":"7129da9ffe81851b742d3a63718ff6ab96d2894e99db945c2dff34fb1a837e33","overview":{"goal":"네 꼭짓점으로 향하는 벡터의 합을 평행사변형 중심으로 바꾸고, 두 벡터가 같음을 보여 거리의 최댓값을 구합니다.","firstLook":"네 벡터를 따로 계산할 필요가 없습니다. 평행사변형의 중심 M은 네 꼭짓점의 평균 위치이므로 합이 4PM이 됩니다.","conditions":[{"label":"점 P의 자취","meaning":"벡터 합의 길이 조건은 중심 M에서 거리가 1인 원을 만듭니다."},{"label":"점 Q의 정의","meaning":"평행사변형의 벡터 관계를 쓰면 DQ가 PB와 같은 벡터가 됩니다."}]},"chapters":[{"id":"c1","label":"점 P의 자취를 원으로 바꿉니다","stepIds":["s1","s2","s3"],"question":"왜 네 벡터의 합이 \\(4PM\\)이고 반지름은 1인가요?","hint":"평행사변형 중심 M에 대해 반대 꼭짓점 벡터를 묶으세요.","explanation":"평행사변형 중심 M에 대해 \\(PA+PC=2PM\\), \\(PB+PD=2PM\\)이므로 네 벡터의 합은 \\(4PM\\)입니다. \\(\\angle BAD=\\pi-\\angle ABC\\)이므로 \\(\\cos\\angle BAD=-1/4\\)입니다. 따라서 \\(BD^2=6^2+4^2-2\\cdot6\\cdot4(-1/4)=64\\), 즉 \\(BD=8\\)입니다. 조건에서 \\(4PM=BD/2=4\\)이므로 \\(PM=1\\)입니다.","check":{"prompt":"대각선 BD의 길이를 계산할 때 코사인의 부호가 바뀌는 이유는 무엇인가요?","answer":"평행사변형의 이웃각은 합이 180도이므로 \\(\\cos\\angle BAD=-\\cos\\angle ABC=-1/4\\)이기 때문입니다."}},{"id":"c2","label":"내적을 거리의 제곱으로 바꿉니다","stepIds":["s4","s5"],"question":"왜 DQ와 PB가 같은 벡터인가요?","hint":"\\(AC=AB+AD\\)와 \\(AP\\)를 이용해 \\(AQ\\)를 전개하세요.","explanation":"\\(AQ=AC-AP=(AB+AD)-AP\\)입니다. 따라서 \\(DQ=AQ-AD=AB-AP=PB\\)입니다. 그러므로 \\(PB\\cdot DQ=PB\\cdot PB=|PB|^2\\)가 되어 내적의 최댓값 문제는 거리 PB의 최댓값 문제로 바뀝니다.","check":{"prompt":"벡터가 같은 방향이라는 것만으로 충분한가요?","answer":"여기서는 방향뿐 아니라 \\(DQ=PB\\)로 크기까지 정확히 같으므로 내적이 \\(|PB|^2\\)가 됩니다."}},{"id":"c3","label":"원 위에서 가장 먼 점을 잡습니다","stepIds":["s6","s7"],"question":"중심 M에서 B까지 거리와 P의 위치는 어떻게 정하나요?","hint":"M은 대각선 BD의 중점입니다.","explanation":"\\(BM=BD/2=4\\)이고 P는 중심 M, 반지름 1인 원 위에 있습니다. 따라서 B에서 가장 먼 P는 B, M, P가 이 순서로 한 직선 위에 있을 때이며 \\(PB=BM+MP=5\\)입니다. 이 위치는 실제 원 위에 있으므로 최댓값이 달성됩니다. 따라서 \\(PB\\cdot DQ=|PB|^2=25\\)입니다.","check":{"prompt":"거리의 상한 5가 실제로 달성되는 이유는 무엇인가요?","answer":"M에서 B의 반대 방향으로 길이 1만큼 간 원 위의 점 P를 잡으면 세 점이 일직선이 되어 \\(PB=4+1\\)이기 때문입니다."}}],"takeaway":["평행사변형의 네 꼭짓점 벡터 합은 중심을 이용하면 한 벡터의 배수로 줄어듭니다.","원의 점과 바깥 점 사이 최대거리는 중심거리와 반지름의 합이며 일직선 위치에서 달성됩니다."]};</script>
