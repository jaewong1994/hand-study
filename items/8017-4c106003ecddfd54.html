<script>window.HandStudyRecord={"itemId":8017,"sourceLabel":"2021 교육청 고2 수학 11월 30번","adminYear":2021,"grade":2,"month":11,"number":30,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"두 자연수 $a,\\,b$에 대하여 함수 $f \\left( x \\right) =x ^{2} -2ax+b$라 할 때, 함수 $g \\left( x \\right)$를\n $g \\left( x \\right) =\\, {\\begin{cases}f \\left( x+a \\right) \\,&\\left( x \\leq a \\right) \\\\ \\left| f \\left( x \\right) \\right|&\\left( x>a \\right)\\end{cases}}$\n라 하자. 실수 $t$에 대하여 직선 $y=t$와 함수 $y=g \\left( x \\right)$의 그래프가 만나는 서로 다른 점의 개수를 $h \\left( t \\right)$라 할 때, 함수 $h \\left( t \\right)$는 다음 조건을 만족시킨다.\n$k \\geq 24$인 임의의 실수 $k$에 대해서만함수 $\\left\\{ h \\left( t \\right) -2 \\right\\} h \\left( t-k \\right)$가 실수 전체의 집합에서 연속이다.\n$10a+b$의 값을 구하시오. [4점]","answer":"44","sourceHash":"b8eeb09630877f2119b2d3686d3f443573cdac8637f6d2d3575c5c773aeb0d0d","steps":[{"id":"s1","latex":"c=a^2-b,\\quad g(x)=\\begin{cases}x^2-c&x\\le a\\\\|(x-a)^2-c|&x>a\\end{cases}"},{"id":"s2","latex":"c\\le b\\text{이면 }h(b)=3\\text{이고 바로 위에서 }h=2\\text{라 연속인 }k\\text{의 하한이 포함되지 않는다. 따라서 }c>b,\\quad h(t)=0,1,2,3,4,3,2\\text{ across }-c,0,b,c"},{"id":"s3","latex":"h(t)-2=0\\Longleftrightarrow-c<t<0\\ \\text{ 또는 }\\ t\\ge c"},{"id":"s4","latex":"h(t-k)=0\\Longleftrightarrow t<k-c"},{"id":"s5","latex":"(h(t)-2)h(t-k)\\text{ continuous}\\Longleftrightarrow2c\\le k"},{"id":"s6","latex":"k\\ge24\\Rightarrow c=12"},{"id":"s7","latex":"a^2-b=12,\\quad c>b\\Rightarrow(a,b)=(4,4)"},{"id":"s8","latex":"10a+b=44"}],"diagram":null,"contentHash":"ed0a3f663999929c338ec461337c642fa7a813314e0d57813a978576b4484b92","questionHtml":"<p class=\"hp\">두 자연수 <span class=\"heq\">\\(a,\\,b\\)<\/span>에 대하여 함수 <span class=\"heq\">\\(f \\left( x \\right) =x^{2} -2ax+b\\)<\/span>라 할 때, 함수 <span class=\"heq\">\\(g \\left( x \\right)\\)<\/span>를<\/p><p class=\"hp htall\">&emsp;&emsp;<span class=\"heq\">\\(g \\left( x \\right) =\\, {\\begin{cases}f \\left( x+a \\right) \\,&\\left( x \\leq a \\right) \\\\ \\left| f \\left( x \\right) \\right|&\\left( x\\gt a \\right)\\end{cases}}\\)<\/span><\/p><p class=\"hp\">라 하자. 실수 <span class=\"heq\">\\(t\\)<\/span>에 대하여 직선 <span class=\"heq\">\\(y=t\\)<\/span>와 함수 <span class=\"heq\">\\(y=g \\left( x \\right)\\)<\/span>의 그래프가 만나는 서로 다른 점의 개수를 <span class=\"heq\">\\(h \\left( t \\right)\\)<\/span>라 할 때, 함수 <span class=\"heq\">\\(h \\left( t \\right)\\)<\/span>는 다음 조건을 만족시킨다.<\/p><div class=\"hbox\"><p class=\"hp\"><span class=\"heq\">\\(k \\geq 24\\)<\/span>인 임의의 실수 <span class=\"heq\">\\(k\\)<\/span>에 대해서만<\/p><p class=\"hp\">함수 <span class=\"heq\">\\(\\left\\{ h \\left( t \\right) -2 \\right\\} h \\left( t-k \\right)\\)<\/span>가 실수 전체의 집합에서 연속이다.<\/p><\/div><p class=\"hp\"><span class=\"heq\">\\(10a+b\\)<\/span>의 값을 구하시오. <span class=\"hscore\">[4점]<\/span><\/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"af9c880c9ecec85e182e626b3c3faed4b5b9c8735ea3445a8143f30765edac86"};</script>
<script>window.HandStudyGuide={"itemId":8017,"sourceHash":"b8eeb09630877f2119b2d3686d3f443573cdac8637f6d2d3575c5c773aeb0d0d","contentHash":"ed0a3f663999929c338ec461337c642fa7a813314e0d57813a978576b4484b92","overview":{"goal":"두 포물선 조각을 꼭짓점형으로 바꾸어 높이별 교점 수 \\(h(t)\\)를 구하고, 두 계단함수의 곱이 모든 점에서 이어지는 이동량의 경계로 \\(a,b\\)를 정해요.","firstLook":"\\(c=a^2-b\\)로 두면 두 조각이 \\(x^2-c\\)와 \\(|(x-a)^2-c|\\)가 돼요. 먼저 높이 \\(t\\)가 \\(-c,0,b,c\\)를 지날 때 교점 수가 어떻게 바뀌는지 세어요.","conditions":[{"label":"연속 조건의 범위","meaning":"곱이 연속이 되는 실수 \\(k\\)의 집합이 정확히 \\(k\\ge24\\)예요."},{"label":"자연수 조건","meaning":"마지막에 \\(a^2-b=12\\)과 \\(12>b\\)를 만족하는 자연수 쌍을 찾아요."}]},"chapters":[{"id":"c1","label":"꼭짓점형으로 두 조각의 교점 수를 세어요","stepIds":["s1","s2"],"question":"첫 조각에서 높이 \\(t\\)의 양의 제곱근이 언제 정의역 \\(x\\le a\\) 안에 있나요?","hint":"\\(x^2-c=t\\)의 양의 해와 \\(a\\)를 비교해요.","explanation":"\\(c=a^2-b\\)로 두면 \\(x\\le a\\)에서 \\(g=x^2-c\\), \\(x>a\\)에서 \\(g=|(x-a)^2-c|\\)예요. 만약 \\(c\\le b\\)라면 높이 \\(t=b\\)에서 교점은 3개이고 바로 위에서는 2개예요. 이 끝점의 실제값 때문에 곱의 점프를 막는 이동량의 경계가 포함되지 않아, 연속이 되는 \\(k\\)의 범위가 문제처럼 닫힌 범위 \\(k\\ge24\\)가 될 수 없어요. 따라서 \\(c>b>0\\)이어야 해요. 이제 첫 조각의 \\(x^2-c=t\\)는 \\(t\\le b\\)일 때 두 해가 모두 \\(x\\le a\\), \\(t>b\\)일 때 음의 해 하나만 남아요. 둘째 조각은 \\(u=x-a>0\\)로 보면 \\(|u^2-c|=t\\)이고, \\(0\\le t<c\\)에서는 두 해, \\(t\\ge c\\)에서는 한 해예요. 이를 합치면 \\(h(t)\\)는 경계 \\(-c,0,b,c\\)를 지날 때 차례로 \\(0,1,2,3,4,3,2\\)의 값을 가져요.","check":{"prompt":"\\(t=c\\)에서 둘째 조각의 \\(u=0\\) 해를 세지 않는 이유는 무엇인가요?","answer":"둘째 조각의 정의역은 \\(x>a\\), 즉 \\(u>0\\)이므로 \\(u=0\\)은 포함되지 않아요."}},{"id":"c2","label":"곱을 0으로 만드는 두 구간을 찾아요","stepIds":["s3","s4"],"question":"\\(h(t)-2\\)가 0인 구간과 \\(h(t-k)\\)가 0인 구간은 어디인가요?","hint":"앞에서 센 계단값에서 \\(h=2\\)와 \\(h=0\\)인 부분을 읽어요.","explanation":"교점 수 표에서 \\(h(t)=2\\)인 곳은 \\(-c<t<0\\)과 \\(t\\ge c\\)예요. 따라서 그곳에서는 첫 인수 \\(h(t)-2\\)가 0이에요. 또 \\(h(s)=0\\)인 곳은 \\(s<-c\\)이므로 \\(s=t-k\\)를 넣으면 \\(h(t-k)=0\\)인 곳은 \\(t<k-c\\)예요. 곱은 두 인수 중 하나가 0인 구간에서는 0이 돼요.","check":{"prompt":"\\(t=k-c\\)에서 둘째 인수가 0이 아닌 이유는 무엇인가요?","answer":"그때 \\(t-k=-c\\)이고 \\(h(-c)=1\\)이므로 0 구간은 엄격히 \\(t<k-c\\)예요."}},{"id":"c3","label":"이동한 경계가 오른쪽 영구간에 닿게 해요","stepIds":["s5","s6"],"question":"왜 \\(k-c\\ge c\\), 즉 \\(k\\ge2c\\)이면 곱이 모든 곳에서 0이 되나요?","hint":"\\(t<k-c\\)에서는 둘째 인수, 그 이후에서는 첫째 인수를 확인해요.","explanation":"\\(k-c\\ge c\\)이면 \\(t<k-c\\)에서는 \\(h(t-k)=0\\)이고, \\(t\\ge k-c\\ge c\\)에서는 \\(h(t)-2=0\\)이에요. 경계에서도 첫째 인수가 0이라 곱은 실수 전체에서 0인 연속함수가 돼요. 반대로 \\(k\\le0\\)이면 \\(t=-c\\)에서 두 인수가 모두 0이 아니어서 곱이 0이 아니고, 더 왼쪽에서는 곱이 0이므로 연속일 수 없어요. \\(0<k<2c\\)이면 \\(k-c<c\\)이므로 \\(k-c<t<c\\)이면서 \\(t\\ge0\\)인 \\(t\\)를 잡을 수 있어요. 이때도 두 인수가 모두 0이 아니어서 곱이 일부 구간에서 0이 아니고, 양끝에서 0인 계단함수와 이어질 수 없어요. 따라서 연속인 \\(k\\)는 정확히 \\(k\\ge2c\\)예요. 문제에서 그 범위가 정확히 \\(k\\ge24\\)라고 했으므로 \\(2c=24\\), \\(c=12\\)예요.","check":{"prompt":"\\(k=2c\\)인 경계값도 포함되는 이유는 무엇인가요?","answer":"\\(t=k-c=c\\)에서 \\(h(c)-2=0\\)이므로 둘째 인수가 뛰어도 곱은 양쪽에서 0이에요."}},{"id":"c4","label":"자연수 조건으로 한 쌍만 남겨요","stepIds":["s7","s8"],"question":"\\(a^2-b=12\\)에서 가능한 자연수 \\(a\\)를 어떻게 좁힐까요?","hint":"\\(c>b\\)이므로 \\(0<b<12\\)예요.","explanation":"\\(b=a^2-12\\)이고 자연수이며 \\(0<b<12\\)예요. 따라서 \\(12<a^2<24\\)이고 자연수 제곱 중 이 범위에 있는 것은 \\(16\\)뿐이에요. 그래서 \\(a=4,b=4\\)이고 실제로 \\(c=12>b=4\\)예요. 구하는 값은 \\(10a+b=40+4=44\\)예요.","check":{"prompt":"\\(a=3\\)과 \\(a=5\\)는 각각 왜 제외되나요?","answer":"\\(a=3\\)이면 \\(b=-3\\)으로 자연수가 아니고, \\(a=5\\)이면 \\(b=13\\)이라 \\(c>b\\)를 만족하지 않아요."}}],"takeaway":["조각 포물선의 교점 수는 꼭짓점 높이와 정의역 경계에서 빠지는 해를 함께 세어요.","계단함수의 곱을 연속으로 만들 때는 한 인수의 0 구간이 다른 인수의 점프를 덮는지 확인해요.","연속이 되는 매개변수의 범위가 주어지면 그 범위의 시작점을 등식으로 맞춰요."]};</script>
