"heq\">\\(30+25 \\sqrt{3}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">④ \u003cspan class=\"heq\">\\(36+30 \\sqrt{3}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">⑤ \u003cspan class=\"heq\">\\(42+35 \\sqrt{3}\\)\u003c/span>\u003c/div>\u003c/div>","questionText":"그림과 같이 삼각형 $ABC\\,$에서 선분 $AB\\,$ 위에 ${\\overline{ AD }} \\,:\\, {\\overline{ DB }} =3 \\,:\\, 2\\,$인 점 $D\\,$를 잡고, 점 $A\\,$를 중심으로 하고 점 $D\\,$를 지나는 원을 $O\\,$, 원 $O\\,$와 선분 $AC\\,$가 만나는 점을 $E\\,$라 하자. $\\sin \\,A\\,:\\, \\sin \\,C\\,=8\\,:\\, 5\\,$이고, 삼각형 $ADE\\,$와 삼각형 $ABC\\,$의 넓이의 비가 $9\\,:\\, 35\\,$이다. 삼각형 $ABC\\,$의 외접원의 반지름의 길이가 $7\\,$일 때, 원 $O\\,$ 위의 점 $P\\,$에 대하여 삼각형 $PBC\\,$의 넓이의 최댓값은? (단, $\\overline{{{AB}} }\u003c \\overline{{{AC}} }$) [4점]\n① $18+15 \\sqrt{3}$ ② $24+20 \\sqrt{3}$ ③ $30+25 \\sqrt{3}$\n④ $36+30 \\sqrt{3}$ ⑤ $42+35 \\sqrt{3}$","sourceHash":"689a308a7cb62d1c1f414fae7ca74f50b036622a0456f9853f997b12c495cb2d","sourceKind":"csat","sourceLabel":"2024년 시행 수능 · 2025학년도 · 공통 · 14번","steps":[{"id":"s1","latex":"\\overline{\\mathrm{AD}}=3t,\\quad\\overline{\\mathrm{DB}}=2t,\\quad\\overline{\\mathrm{AB}}=5t\\quad(t>0)"},{"id":"s2","latex":"\\frac{\\overline{\\mathrm{BC}}}{\\overline{\\mathrm{AB}}}=\\frac{\\sin A}{\\sin C}=\\frac85\\quad\\Rightarrow\\quad\\overline{\\mathrm{BC}}=8t"},{"id":"s3","latex":"\\overline{\\mathrm{AE}}=3t,\\quad\\frac{[\\mathrm{ADE}]}{[\\mathrm{ABC}]}=\\frac{3t\\cdot3t}{5t\\cdot\\overline{\\mathrm{AC}}}=\\frac9{35}"},{"id":"s4","latex":"\\overline{\\mathrm{AC}}=7t,\\quad\\cos B=\\frac{(5t)^2+(8t)^2-(7t)^2}{2\\cdot5t\\cdot8t}=\\frac12"},{"id":"s5","latex":"\\sin B=\\frac{\\sqrt3}{2},\\quad\\frac{7t}{\\sin B}=14\\quad\\Rightarrow\\quad t=\\sqrt3"},{"id":"s6","latex":"\\mathrm{AH}\\perp\\mathrm{BC},\\quad\\overline{\\mathrm{AH}}=5\\sqrt3\\cdot\\frac{\\sqrt3}{2}=\\frac{15}{2}"},{"id":"s7","latex":"\\text{점 P에서 직선 BC까지의 거리의 최댓값}=\\frac{15}{2}+3\\sqrt3"},{"id":"s8","latex":"[\\mathrm{PBC}]\\text{의 최댓값}=\\frac12\\cdot8\\sqrt3\\left(\\frac{15}{2}+3\\sqrt3\\right)=36+30\\sqrt
