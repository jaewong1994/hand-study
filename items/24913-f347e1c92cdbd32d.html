  <script>window.HandStudyRecord={"adminYear":2024,"answer":"④","contentHash":"90f3c0312c0f1873e708471392ffc7eba8e2e0b9908d4b1ed9e823d50af20245","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24913,"month":11,"number":14,"points":4,"preview":false,"questionHtml":"\u003cp>그림과 같이 삼각형 \u003cspan class=\"heq\">\\(ABC\\,\\)\u003c/span>에서 선분 \u003cspan class=\"heq\">\\(AB\\,\\)\u003c/span> 위에 \u003cspan class=\"heq\">\\({\\overline{ AD }} \\,:\\, {\\overline{ DB }} =3 \\,:\\, 2\\,\\)\u003c/span>인 점 \u003cspan class=\"heq\">\\(D\\,\\)\u003c/span>를 잡고, 점 \u003cspan class=\"heq\">\\(A\\,\\)\u003c/span>를 중심으로 하고 점 \u003cspan class=\"heq\">\\(D\\,\\)\u003c/span>를 지나는 원을 \u003cspan class=\"heq\">\\(O\\,\\)\u003c/span>, 원 \u003cspan class=\"heq\">\\(O\\,\\)\u003c/span>와 선분 \u003cspan class=\"heq\">\\(AC\\,\\)\u003c/span>가 만나는 점을 \u003cspan class=\"heq\">\\(E\\,\\)\u003c/span>라 하자. \u003cspan class=\"heq\">\\(\\sin \\,A\\,:\\, \\sin \\,C\\,=8\\,:\\, 5\\,\\)\u003c/span>이고, 삼각형 \u003cspan class=\"heq\">\\(ADE\\,\\)\u003c/span>와 삼각형 \u003cspan class=\"heq\">\\(ABC\\,\\)\u003c/span>의 넓이의 비가 \u003cspan class=\"heq\">\\(9\\,:\\, 35\\,\\)\u003c/span>이다. 삼각형 \u003cspan class=\"heq\">\\(ABC\\,\\)\u003c/span>의 외접원의 반지름의 길이가 \u003cspan class=\"heq\">\\(7\\,\\)\u003c/span>일 때, 원 \u003cspan class=\"heq\">\\(O\\,\\)\u003c/span> 위의 점 \u003cspan class=\"heq\">\\(P\\,\\)\u003c/span>에 대하여 삼각형 \u003cspan class=\"heq\">\\(PBC\\,\\)\u003c/span>의 넓이의 최댓값은? (단, \u003cspan class=\"heq\">\\(\\overline{{{AB}} }&lt; \\overline{{{AC}} }\\)\u003c/span>) [4점]\u003c/p>\u003cfigure>\u003cimg class=\"hfig\" src=\"../assets/csat/24913-c37574c5146aced6.png\" alt=\"2024년 시행 수능 14번 문항 그림 \" style=\"max-width:100%;width:420px\">\u003c/figure>\u003cdiv class=\"hchoices\">\u003cdiv class=\"hch\">① \u003cspan class=\"heq\">\\(18+15 \\sqrt{3}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">② \u003cspan class=\"heq\">\\(24+20 \\sqrt{3}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">③ \u003cspan class=\"heq\">\\(30+25 \\sqrt{3}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">④ \u003cspan class=\"heq\">\\(36+30 \\sqrt{3}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">⑤ \u003cspan class=\"heq\">\\(42+35 \\sqrt{3}\\)\u003c/span>\u003c/div>\u003c/div>","questionText":"그림과 같이 삼각형 $ABC\\,$에서 선분 $AB\\,$ 위에 ${\\overline{ AD }} \\,:\\, {\\overline{ DB }} =3 \\,:\\, 2\\,$인 점 $D\\,$를 잡고, 점 $A\\,$를 중심으로 하고 점 $D\\,$를 지나는 원을 $O\\,$, 원 $O\\,$와 선분 $AC\\,$가 만나는 점을 $E\\,$라 하자. $\\sin \\,A\\,:\\, \\sin \\,C\\,=8\\,:\\, 5\\,$이고, 삼각형 $ADE\\,$와 삼각형 $ABC\\,$의 넓이의 비가 $9\\,:\\, 35\\,$이다. 삼각형 $ABC\\,$의 외접원의 반지름의 길이가 $7\\,$일 때, 원 $O\\,$ 위의 점 $P\\,$에 대하여 삼각형 $PBC\\,$의 넓이의 최댓값은? (단, $\\overline{{{AB}} }\u003c \\overline{{{AC}} }$) [4점]\n① $18+15 \\sqrt{3}$ ② $24+20 \\sqrt{3}$ ③ $30+25 \\sqrt{3}$\n④ $36+30 \\sqrt{3}$ ⑤ $42+35 \\sqrt{3}$","sourceHash":"689a308a7cb62d1c1f414fae7ca74f50b036622a0456f9853f997b12c495cb2d","sourceKind":"csat","sourceLabel":"2024년 시행 수능 · 2025학년도 · 공통 · 14번","steps":[{"id":"s1","latex":"\\overline{\\mathrm{AD}}=3t,\\quad\\overline{\\mathrm{DB}}=2t,\\quad\\overline{\\mathrm{AB}}=5t\\quad(t>0)"},{"id":"s2","latex":"\\frac{\\overline{\\mathrm{BC}}}{\\overline{\\mathrm{AB}}}=\\frac{\\sin A}{\\sin C}=\\frac85\\quad\\Rightarrow\\quad\\overline{\\mathrm{BC}}=8t"},{"id":"s3","latex":"\\overline{\\mathrm{AE}}=3t,\\quad\\frac{[\\mathrm{ADE}]}{[\\mathrm{ABC}]}=\\frac{3t\\cdot3t}{5t\\cdot\\overline{\\mathrm{AC}}}=\\frac9{35}"},{"id":"s4","latex":"\\overline{\\mathrm{AC}}=7t,\\quad\\cos B=\\frac{(5t)^2+(8t)^2-(7t)^2}{2\\cdot5t\\cdot8t}=\\frac12"},{"id":"s5","latex":"\\sin B=\\frac{\\sqrt3}{2},\\quad\\frac{7t}{\\sin B}=14\\quad\\Rightarrow\\quad t=\\sqrt3"},{"id":"s6","latex":"\\mathrm{AH}\\perp\\mathrm{BC},\\quad\\overline{\\mathrm{AH}}=5\\sqrt3\\cdot\\frac{\\sqrt3}{2}=\\frac{15}{2}"},{"id":"s7","latex":"\\text{점 P에서 직선 BC까지의 거리의 최댓값}=\\frac{15}{2}+3\\sqrt3"},{"id":"s8","latex":"[\\mathrm{PBC}]\\text{의 최댓값}=\\frac12\\cdot8\\sqrt3\\left(\\frac{15}{2}+3\\sqrt3\\right)=36+30\\sqrt3\\quad\\therefore\\text{④}"}],"track":"공통"};</script>
