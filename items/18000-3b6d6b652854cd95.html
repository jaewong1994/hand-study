<script>window.HandStudyGuide={"itemId":18000,"sourceHash":"7175d76a3297ecde6cc2e6b044edce19e3df97d753483312a7456e689a4028bd","contentHash":"d380e9fed6967770eb2582f348a4b5613250754e4c3c0c573af5e00d57f604a4","overview":{"goal":"짝수인 항의 개수와 위치를 먼저 정하고, 남는 합을 중복조합으로 세어요.","firstLook":"다섯 자연수의 합이 홀수이므로 홀수인 항의 개수도 홀수예요. 조건 (다)와 함께 보면 짝수인 항은 2개 또는 4개예요.","conditions":[{"label":"합의 홀짝","meaning":"합이 11이므로 홀수인 항의 개수는 홀수예요."},{"label":"앞 두 항","meaning":"\\(a+b\\)가 짝수이므로 \\(a,b\\)는 둘 다 짝수이거나 둘 다 홀수예요."}]},"chapters":[{"id":"c1","label":"짝수의 개수와 위치를 정해요","stepIds":["s1","s2"],"question":"짝수인 항은 왜 2개 또는 4개이고, 2개일 때 위치는 왜 4가지일까요?","hint":"다섯 항 중 홀수의 개수가 홀수여야 하고, \\(a,b\\)는 같은 홀짝이어야 해요.","explanation":"짝수인 항의 개수를 \\(k\\)라 하면 홀수인 항은 \\(5-k\\)개예요. 합이 홀수이려면 홀수 항의 개수가 홀수여야 하므로 \\(k\\)는 0,2,4 중 하나예요. 그런데 짝수가 2개 이상이므로 \\(k=2\\) 또는 \\(4\\)예요.\n\n\\(k=2\\)일 때 \\(a,b\\)는 같은 홀짝이어야 해요. 둘 다 짝수이면 짝수 위치는 \\(\\{a,b\\}\\) 한 가지예요. 둘 다 홀수이면 짝수 두 자리 모두를 \\(c,d,e\\)에서 골라 \\({}_3\\mathrm C_2=3\\)가지예요. 합해서 위치는 4가지예요.","check":{"prompt":"\\(k=2\\)일 때 짝수 위치 하나가 \\(a\\), 하나가 \\(c\\)인 경우를 제외하는 이유는 무엇인가요?","answer":"그때 \\(a\\)는 짝수이고 \\(b\\)는 홀수라서 \\(a+b\\)가 홀수가 되기 때문이에요."}},{"id":"c2","label":"각 홀짝 배치에서 합을 세어요","stepIds":["s3","s4"],"question":"정한 홀짝의 가장 작은 자연수를 빼면 남는 합은 어떻게 바뀔까요?","hint":"홀수는 \\(1+2x\\), 양의 짝수는 \\(2+2x\\)로 나타내요.","explanation":"\\(k=2\\)이면 짝수 두 개의 최소 합은 4, 홀수 세 개의 최소 합은 3이어서 기본 합은 7이에요. 각 항을 홀수이면 \\(1+2x_i\\), 짝수이면 \\(2+2x_i\\)로 쓰면 \\(7+2\\sum x_i=11\\), 즉 \\(\\sum x_i=2\\)예요. 5개의 0 이상인 정수의 합이 2인 경우는 \\({}_6\\mathrm C_4=15\\)가지예요.\n\n\\(k=4\\)이면 기본 합은 \\(4\\times2+1=9\\)이므로 \\(9+2\\sum x_i=11\\), \\(\\sum x_i=1\\)이에요. 경우의 수는 \\({}_5\\mathrm C_4=5\\)가지예요. 이때 \\(a,b\\)는 둘 다 짝수여야 하므로 유일한 홀수 위치는 \\(c,d,e\\) 중 하나인 3가지예요.","check":{"prompt":"짝수를 \\(2x_i\\)로 두지 않고 \\(2+2x_i\\)로 두는 이유는 무엇인가요?","answer":"문제의 자연수는 1 이상이므로 짝수의 가장 작은 값은 2이고 0은 허용되지 않기 때문이에요."}},{"id":"c3","label":"위치와 값의 수를 합쳐요","stepIds":["s5"],"question":"두 홀짝 경우에서 전체 순서쌍은 몇 개인가요?","hint":"각 홀짝 위치마다 값 배치 수가 같으므로 곱한 뒤 두 경우를 더해요.","explanation":"\\(k=2\\)에서는 홀짝 위치 4가지마다 값이 15가지이므로 \\(4\\times15=60\\)가지예요. \\(k=4\\)에서는 홀수 위치 3가지마다 값이 5가지이므로 \\(3\\times5=15\\)가지예요. 두 경우는 짝수 항의 개수가 달라 겹치지 않으므로 전체는 \\(60+15=75\\)가지예요.","check":{"prompt":"\\(k=0\\)을 마지막 합에 넣지 않는 이유는 무엇인가요?","answer":"조건 (다)가 짝수의 개수를 2 이상이라고 했으므로 제외돼요."}}],"takeaway":["합의 홀짝은 홀수인 항의 개수의 홀짝으로 바꾸어 경우를 좁혀요.","양의 자연수의 홀짝을 나타낼 때 홀수는 \\(1+2x\\), 짝수는 \\(2+2x\\)로 두어 최솟값을 보존해요.","위치를 고르는 수와 각 위치에 값을 배치하는 수는 독립적으로 정해질 때 곱해요."]};</script>
