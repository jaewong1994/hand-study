<script>window.HandStudyRecord={"itemId":17839,"sourceLabel":"2024 교육청 고3 수학기하 10월 21번","adminYear":2024,"grade":3,"month":10,"number":21,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"두 자연수 $a$, $b\\,$에 대하여 함수 $f \\left( x \\right)\\,$는\n $f \\left( x \\right) = {\\begin{cases}\\,\\frac{4}{x-3} +a&&\\left( x<2 \\right) \\\\ \\, \\left|\\, 5\\log_{2} x-b \\,\\right|&&\\left( x \\geq 2 \\right)\\end{cases}}$\n이다. 실수 $t\\,$에 대하여 $x\\,$에 대한 방정식 $f \\left( x \\right) =t\\,$의 서로 다른 실근의 개수를 $g \\left( t \\right)\\,$라 하자. 함수 $g \\left( t \\right)\\,$가 다음 조건을 만족시킬 때, $a+b\\,$의 최솟값을 구하시오. [4점]\n(가) 함수 $g \\left( t \\right)\\,$의 치역은 $\\left\\{ 0,\\, 1,\\, 2 \\right\\}\\,$이다.(나) $g \\left( t \\right) =2\\,$인 자연수 $t\\,$의 개수는 $6\\,$이다.","answer":"15","sourceHash":"687d5df33f2ffd10f2698506d9b0531ba84564f5c8d2c7599ea9fdc1045f2a5a","steps":[{"id":"s1","latex":"x<2\\text{일 때 }f(x)\\text{의 치역은 }(a-4,a)"},{"id":"s2","latex":"b\\le5\\text{이면 }g(t)=2\\text{인 자연수 }t\\text{가 최대 }3\\text{개이므로 불가}"},{"id":"s3","latex":"b\\ge6:\\quad0<t\\le b-5\\text{에서 오른쪽 가지의 해가 두 개}"},{"id":"s4","latex":"g(t)=3\\text{을 막으려면 }a-4\\ge b-5"},{"id":"s5","latex":"g(t)=2\\text{인 자연수는 }1,\\ldots,b-5\\text{와 }a-3,a-2,a-1"},{"id":"s6","latex":"(b-5)+3=6\\Rightarrow b=8"},{"id":"s7","latex":"a\\ge7,\\ b=8\\text{이므로 }a+b\\text{의 최솟값은 }7+8=15"}],"diagram":null,"contentHash":"05747d781300bf1dd9a8340378de07b552984a5fba1870ead05c6ca642cd31b4","questionHtml":"<p class=\"hp\">두 자연수 <span class=\"heq\">\\(a\\)<\/span>, <span class=\"heq\">\\(b\\,\\)<\/span>에 대하여 함수 <span class=\"heq\">\\(f \\left( x \\right)\\,\\)<\/span>는<\/p><p class=\"hp htall\">&emsp;<span class=\"heq\">\\(f \\left( x \\right) = {\\begin{cases}\\,\\dfrac{4}{x-3} +a&&\\left( x\\lt 2 \\right) \\\\ \\, \\left|\\, 5\\log_{2} x-b \\,\\right|&&\\left( x \\geq 2 \\right)\\end{cases}}\\)<\/span><\/p><p class=\"hp\">이다. 실수 <span class=\"heq\">\\(t\\,\\)<\/span>에 대하여 <span class=\"heq\">\\(x\\,\\)<\/span>에 대한 방정식 <span class=\"heq\">\\(f \\left( x \\right) =t\\,\\)<\/span>의 서로 다른 실근의 개수를 <span class=\"heq\">\\(g \\left( t \\right)\\,\\)<\/span>라 하자. 함수 <span class=\"heq\">\\(g \\left( t \\right)\\,\\)<\/span>가 다음 조건을 만족시킬 때, <span class=\"heq\">\\(a+b\\,\\)<\/span>의 최솟값을 구하시오. <span class=\"hscore\">[4점]<\/span><\/p><div class=\"hbox\"><p class=\"hp\">(가) 함수 <span class=\"heq\">\\(g \\left( t \\right)\\,\\)<\/span>의 치역은 <span class=\"heq\">\\(\\left\\{ 0,\\, 1,\\, 2 \\right\\}\\,\\)<\/span>이다.<\/p><p class=\"hp\">(나) <span class=\"heq\">\\(g \\left( t \\right) =2\\,\\)<\/span>인 자연수 <span class=\"heq\">\\(t\\,\\)<\/span>의 개수는 <span class=\"heq\">\\(6\\,\\)<\/span>이다.<\/p><\/div>","preview":false,"graphPlan":{"version":1,"itemId":17839,"sourceHash":"687d5df33f2ffd10f2698506d9b0531ba84564f5c8d2c7599ea9fdc1045f2a5a","contentHash":"05747d781300bf1dd9a8340378de07b552984a5fba1870ead05c6ca642cd31b4","title":"교점 개수 g(t)의 실제 계단","bounds":[-1,10,-1,4],"aspect":"free","stages":[{"stepId":"s6","title":"b=8인 오른쪽 가지의 해 개수","layers":[{"id":"axis-t","type":"polyline","points":[[-1,0],[10,0]],"color":"muted","text":""},{"id":"axis-g","type":"polyline","points":[[0,-0.5],[0,3.5]],"color":"muted","text":""},{"id":"right-two","type":"polyline","points":[[0.001,2],[3,2]],"color":"navy","text":""},{"id":"right-one","type":"polyline","points":[[3,1],[10,1]],"color":"navy","text":""}]},{"stepId":"s7","title":"a=7,b=8의 전체 g","layers":[{"id":"axis-t","type":"polyline","points":[[-1,0],[10,0]],"color":"muted","text":""},{"id":"axis-g","type":"polyline","points":[[0,-0.5],[0,3.5]],"color":"muted","text":""},{"id":"g-two","type":"polyline","points":[[0.001,2],[6.999,2]],"color":"teal","text":""},{"id":"g-one","type":"polyline","points":[[7,1],[10,1]],"color":"teal","text":""},{"id":"g0","type":"point","x":0,"y":1,"text":"g(0)=1","color":"teal"},{"id":"six","type":"label","x":3.5,"y":2.5,"text":"자연수 1~6","color":"amber"}]}],"graphHash":"4f1e66d53f4c805a0966f8b80d09de59d018007558ec4b2848d5353e6ca3f520"},"graphHash":"4f1e66d53f <script>window.HandStudyGuide={"itemId":17839,"sourceHash":"687d5df33f2ffd10f2698506d9b0531ba84564f5c8d2c7599ea9fdc1045f2a5a","contentHash":"05747d781300bf1dd9a8340378de07b552984a5fba1870ead05c6ca642cd31b4","overview":{"goal":"두 조각 그래프에서 수평선과의 교점 수를 따져 자연수 \\(a,b\\)의 가장 작은 합을 구해요.","firstLook":"왼쪽 조각은 함숫값의 범위가 길이 \\(4\\)인 열린 구간이고, 오른쪽 조각은 \\(b\\ge6\\)일 때 꼭짓점이 있는 V자 모양이에요.","conditions":[{"label":"치역","meaning":"어떤 \\(t\\)에서도 전체 교점 수가 \\(3\\)이 되면 안 돼요."},{"label":"자연수 높이","meaning":"교점이 두 개인 높이 중 자연수인 것의 개수가 정확히 \\(6\\)이에요."}]},"chapters":[{"id":"c1","label":"두 조각의 해 개수를 따져요","stepIds":["s1","s2","s3"],"question":"각 조각은 어떤 \\(t\\)에서 해를 몇 개 만들까요?","hint":"\\(x<2\\) 조각은 끝값을, 로그 조각은 절댓값 안이 \\(0\\)이 되는 점의 위치를 봐요.","explanation":"\\(x<2\\)에서 \\(4/(x-3)+a\\)는 감소하고, \\(x\\to-\\infty\\)일 때 \\(a\\)에 가까워지며 \\(x\\to2-\\)일 때 \\(a-4\\)에 가까워져 치역은 \\((a-4,a)\\)예요. 이 구간의 높이마다 왼쪽 해가 하나예요.\n\n오른쪽은 \\(x\\ge2\\)에서 \\(|5\\log_2x-b|\\)예요. \\(b\\le5\\)이면 절댓값 안이 처음부터 음수가 아니어서 오른쪽 해가 하나뿐이고, 자연수 높이 여섯 개에서 전체 해가 두 개가 될 수 없어요. \\(b\\ge6\\)이면 \\(0<t\\le b-5\\)에서 오른쪽 해가 두 개예요. \\(t=0\\)에서는 꼭짓점 한 개뿐이므로 자연수 목록은 \\(1,\\ldots,b-5\\)예요.","check":{"prompt":"오른쪽 조각에서 \\(t=b-5\\)도 해가 두 개인가요?","answer":"네. 한 해는 끝점 \\(x=2\\)이고 다른 해는 꼭짓점 오른쪽에 있으므로 두 개예요."}},{"id":"c2","label":"세 교점이 생기지 않게 해요","stepIds":["s4","s5"],"question":"왼쪽의 열린 구간과 오른쪽의 두 해 구간은 어떻게 놓여야 할까요?","hint":"두 구간이 겹치면 같은 높이에서 왼쪽 한 개와 오른쪽 두 개가 합쳐져요.","explanation":"\\((a-4,a)\\)와 \\((0,b-5]\\)가 겹치면 그 높이에서 해가 세 개가 되어 치역 조건을 어겨요. \\(a,b\\)가 자연수이고 왼쪽 구간이 양의 쪽에 있으므로 겹치지 않으려면 \\(a-4\\ge b-5\\)여야 해요. 등호일 때 왼쪽 끝은 열린 끝점이라 겹치지 않아요.\n\n교점이 두 개인 자연수 높이는 오른쪽에서 \\(1,\\ldots,b-5\\), 왼쪽 열린 구간에서 \\(a-3,a-2,a-1\\)이에요. 두 묶음은 위 조건으로 겹치지 않아요.","check":{"prompt":"\\(a-4=b-5\\)일 때 교점이 세 개가 되지 않는 이유는 무엇인가요?","answer":"높이 \\(a-4\\)는 왼쪽 조각의 치역에 포함되지 않는 열린 끝점이기 때문이에요."}},{"id":"c3","label":"개수 조건으로 가장 작은 합을 정해요","stepIds":["s6","s7"],"question":"자연수 높이 여섯 개라는 조건은 \\(a,b\\)를 어떻게 정하나요?","hint":"두 묶음의 개수를 더한 뒤 겹침이 없음을 이용해요.","explanation":"오른쪽 묶음은 \\(b-5\\)개, 왼쪽 묶음은 항상 \\(3\\)개이므로 \\((b-5)+3=6\\)에서 \\(b=8\\)이에요. 겹치지 않을 조건은 \\(a-4\\ge3\\), 즉 \\(a\\ge7\\)이에요. 따라서 가장 작은 합은 \\(a+b=7+8=15\\)예요. \\(a=7,b=8\\)이면 실제로 두 해인 자연수 높이는 \\(1,2,3,4,5,6\\)이고, 어느 높이에서도 세 해가 생기지 않아요.","check":{"prompt":"가장 작은 \\(a=7\\)을 넣었을 때 두 해인 자연수 높이 여섯 개는 무엇인가요?","answer":"오른쪽에서 \\(1,2,3\\), 왼쪽에서 \\(4,5,6\\)이에요."}}],"takeaway":["조각함수의 교점 수는 각 조각의 치역과 끝점 포함 여부를 따로 적어 합쳐요.","전체 해가 세 개가 되는 겹침 구간을 먼저 막아야 해요.","자연수 높이의 개수를 셀 때 열린 구간의 양 끝은 포함하지 않아요."]};</script>
