<script>window.HandStudyRecord={"itemId":7915,"sourceLabel":"2020 교육청 고2 수학 3월 18번","adminYear":2020,"grade":2,"month":3,"number":18,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"좌표평면의 제$\\,1\\,$사분면에 있는 두 점 $A$, $B\\,$와 원점 $O\\,$에 대하여 삼각형 $O A B\\,$의 무게중심 $G\\,$의 좌표는 $\\left( 8,\\,4 \\right) \\,$이고, 점 $B\\,$와 직선 $OA$ 사이의 거리는 $6 \\sqrt{2} \\,$이다. \n다음은 직선 $OB\\,$의 기울기가 직선 $O A\\,$의 기울기보다 클 때, 직선 $OA\\,$의 기울기를 구하는 과정이다.\n선분 $O A\\,$의 중점을 $M\\,$이라 하자.\n[그림 1]\n점 $G\\,$가 삼각형 $O A B\\,$의 무게중심이므로\n ${\\overline{BG }} \\,:\\, {\\overline{GM }}$$=2\\,:\\,1$\n이고, 점 $B\\,$와 직선 $OA$ 사이의 거리가 $6 \\sqrt{2} \\,$이므로 점 $G\\,$와 직선 $OA$ 사이의 거리는 ${\\boxed{\\vphantom{(}\\, (\\text{가}) \\,}} \\,$이다.\n직선 $O A\\,$의 기울기를 $m\\,$이라 하면 점 $G\\,$와 직선 $OA$ 사이의 거리는\n$\\dfrac{{\\boxed{\\vphantom{(}\\, (\\text{나}) \\,}} \\,}{\\sqrt{m^{2} + \\left( -1 \\right)^{2}}}$\n이고 ${\\boxed{\\vphantom{(}\\, (\\text{가}) \\,}} \\,$와 같다. 즉,\n${\\boxed{\\vphantom{(}\\, (\\text{나}) \\,}} \\,$$= {\\boxed{\\vphantom{(}\\, (\\text{가}) \\,}} \\, \\times \\sqrt{m^{2} +1}$\n이다. 양변을 제곱하여 $m\\,$의 값을 구하면\n$m= {\\boxed{\\vphantom{(}\\,}}$ 또는 $m= {\\boxed{\\vphantom{(}\\, \\,}} \\,$\n이다.\n이때 직선 $O G\\,$의 기울기가 $\\dfrac{1}{2} \\,$이므로 직선 $O A\\,$의 기울기는 ${\\boxed{\\vphantom{(}\\, (\\text{다}) \\,}} \\,$이다.\n위의 (가), (다)에 알맞은 수를 각각 $p$, $q\\,$라 하고, (나)에 알맞은 식을 $f(m)\\,$이라 할 때, $\\dfrac{f(q)}{p^{2}} \\,$의 값은? [4점]\n① $\\dfrac{2}{7}$ ② $\\dfrac{5}{14}$ ③ $\\dfrac{3}{7}$ ④ $\\dfrac{1}{2}$ ⑤ $\\dfrac{4}{7}$","answer":"②","sourceHash":"e11e028b0dbf077955e6581d58334d9503e4a54c6cfee7376f14bf15670dc8ce","steps":[{"id":"s1","latex":"d(G,OA)=\\dfrac13d(B,OA)=2\\sqrt2"},{"id":"s2","latex":"OA:\\ y=mx\\Rightarrow d(G,OA)=\\dfrac{|8m-4|}{\\sqrt{m^2+1}}"},{"id":"s3","latex":"|8m-4|=2\\sqrt2\\sqrt{m^2+1}"},{"id":"s4","latex":"7m^2-8m+1=0\\Rightarrow m=1,\\dfrac17"},{"id":"s5","latex":"m_{OA}\u003cm_{OG}=\\dfrac12\u003cm_{OB}\\Rightarrow q=\\dfrac17"},{"id":"s6","latex":"p=2\\sqrt2,\\quad f(m)=4-8m\\ (m\u003c1/2)"},{"id
