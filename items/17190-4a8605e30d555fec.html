  <script>window.HandStudyRecord={"itemId":17190,"sourceLabel":"2021 평가원 고3 수학기하 9월 14번","adminYear":2021,"grade":3,"month":9,"number":14,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"최고차항의 계수가 $1$이고 $f' \\left( 0 \\right)$$=f' \\left( 2 \\right)$$=0$인 삼차함수 $f \\left( x \\right)$와 양수 $p$에 대하여 함수 $g \\left( x \\right)$를\n $g \\left( x \\right) = {\\begin{cases}f \\left( x \\right) -f \\left( 0 \\right)&\\, \\left( x \\leq 0 \\right) \\\\ eqalign{ \\\\ f \\left( x+p \\right) -f \\left( p \\right)}&eqalign{ \\\\ \\, \\left( x\\gt 0 \\right)}\\end{cases}}$\n이라 하자. \u003c보기>에서 옳은 것만을 있는 대로 고른 것은? [4점]\n\u003c 보 기 >\nㄱ. $p$$=1$일 때, $g' \\left( 1 \\right)$$=0$이다.\nㄴ. $g \\left( x \\right)$가 실수 전체의 집합에서 미분가능하도록 하는\n양수 $p$의 개수는 $1$이다.\nㄷ. $p \\geq 2$일 때, $\\int_{-1}^{1} {} g \\left( x \\right) \\,dx$$\\geq 0$이다.\n① ㄱ ② ㄱ, ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","answer":"⑤","sourceHash":"f65b6bbcbd9864df5b95f9412ccb809705b26af5bf27cc373681b902b63343ed","steps":[{"id":"s1","latex":"f\\prime(x)=3x(x-2)\\Rightarrow f(x)=x^3-3x^2+C"},{"id":"s2","latex":"g(x)=\\begin{cases}x^3-3x^2&x\\le0\\\\x^3+(3p-3)x^2+(3p^2-6p)x&x>0\\end{cases}"},{"id":"s3","latex":"p=1:\\quad g\\prime(1)=f\\prime(2)=0\\quad\\text{(첫째 참)}"},{"id":"s4","latex":"g\\prime(0-)=0,\\quad g\\prime(0+)=3p(p-2)\\Rightarrow p=2\\quad\\text{(둘째 참)}"},{"id":"s5","latex":"\\int_{-1}^1g(x)\\,dx=-\\frac54+\\frac14+(p-1)+\\frac{3p^2-6p}{2}"},{"id":"s6","latex":"=\\frac{(3p+2)(p-2)}2\\ge0\\quad(p\\ge2)\\quad\\text{(셋째 참)}"},{"id":"s7","latex":"\\therefore\\text{세 명제 모두 참}"}],"diagram":null,"contentHash":"e0c78f8faa56b9226cea9fe46387f292853de6530b3b5ba5d486a177e896c4e3","questionHtml":"\u003cp class=\"hp\">최고차항의 계수가 \u003cspan class=\"heq\">\\(1\\)\u003c/span>이고 \u003cspan class=\"heq\">\\(f' \\left( 0 \\right)\\)\u003c/span>\u003cspan class=\"heq\">\\(=f' \\left( 2 \\right)\\)\u003c/span>\u003cspan class=\"heq\">\\(=0\\)\u003c/span>인 삼차함수 \u003cspan class=\"heq\">\\(f \\left( x \\right)\\)\u003c/span>와 양수 \u003cspan class=\"heq\">\\(p\\)\u003c/span>에 대하여 함수 \u003cspan class=\"heq\">\\(g \\left( x \\right)\\)\u003c/span>를\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\(g(x)=\\begin{cases}f(x)-f(0)&x\\le0\\\\f(x+p)-f(p)&x\\gt0\\end{cases}\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">이라 하자. &lt;보기&gt;에서 옳은 것만을 있는 대로 고른 것은? \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cdiv class=\"hbox\">\u003cdiv style=\"text-align:center;font-weight:700;margin:0 0 6px\">&lt; 보 기 &gt;\u003c/div>\u003cp class=\"hp\">ㄱ. \u003cspan class=\"heq\">\\(p\\)\u003c/span>\u003cspan class=\"heq\">\\(=1\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(g' \\left( 1 \\right)\\)\u003c/span>\u003cspan class=\"heq\">\\(=0\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp\">ㄴ. \u003cspan class=\"heq\">\\(g \\left( x \\right)\\)\u003c/span>가 실수 전체의 집합에서 미분가능하도록 하는\u003cbr>양수 \u003cspan class=\"heq\">\\(p\\)\u003c/span>의 개수는 \u003cspan class=\"heq\">\\(1\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp\">ㄷ. \u003cspan class=\"heq\">\\(p \\geq 2\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(\\int_{-1}^{1} {} g \\left( x \\right) \\,dx\\)\u003c/span>\u003cspan class=\"heq\">\\(\\geq 0\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp class=\"hp\">① ㄱ&emsp;② ㄱ, ㄴ&emsp;③ ㄱ, ㄷ\u003c/p>\u003cp class=\"hp\">④ ㄴ, ㄷ&emsp;⑤ ㄱ, ㄴ, ㄷ\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"4a8605e30d555feccb81e492e4f01a34209d117f748c714dbe789fa6eb1c0dfe"};</script>
