<script>window.HandStudyRecord={"itemId":17271,"sourceLabel":"2022 교육청 고3 수학기하 10월 29번","adminYear":2022,"grade":3,"month":10,"number":29,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"두 점 $F _{1} (4\\,,\\,0)$, $F _{2} (-6\\,,\\,0)$에 대하여 포물선 $y ^{2} =16x$ 위의 점 중 제 $1$사분면에 있는 점 $P$가 ${\\overline{ PF _{2}}} - {\\overline{ PF _{1}}} =6$을 만족시킨다. 포물선 $y ^{2} =16x$ 위의 점 $P$에서의 접선이 $x$축과 만나는 점을 $F _{3}$이라 하면 두 점 $F_{ 1}$, $F _{3}$을 초점으로 하는 타원의 한 꼭짓점은 선분 $P F _{3}$ 위에 있다. 이 타원의 장축의 길이가 $2a$일 때, $a^{ 2}$의 값을 구하시오. [4점]","answer":"54","sourceHash":"46463862f6c2988a401f19c7bdc28ed7c0c0232d522578c7cd2cc622de881b77","steps":[{"id":"s1","latex":"F_1=(4,0),\\quad \\text{준선}:x=-4"},{"id":"s2","latex":"P=(x,y):\\quad PF_1=x+4,\\quad PF_2=x+10"},{"id":"s3","latex":"(x+6)^2+16x=(x+10)^2\\Rightarrow x=8"},{"id":"s4","latex":"P=(8,8\\sqrt2)"},{"id":"s5","latex":"8\\sqrt2y=8(x+8)\\Rightarrow F_3=(-8,0)"},{"id":"s6","latex":"\\text{타원 중심}=(-2,0),\\quad c=6"},{"id":"s7","latex":"PF_3:\\ y=\\frac{\\sqrt2}{2}(x+8)"},{"id":"s8","latex":"x=-2\\Rightarrow b=3\\sqrt2"},{"id":"s9","latex":"a^2=b^2+c^2=18+36=\\boxed{54}"}],"diagram":null,"contentHash":"a727582369f4b5be7f048678f9793391caa30b3d51b57206788f681e19aa0c7f","questionHtml":"\u003cp class=\"hp htall\">두 점 \u003cspan class=\"heq\">\\(F_{1} (4\\,,\\,0)\\)\u003c/span>, \u003cspan class=\"heq\">\\(F_{2} (-6\\,,\\,0)\\)\u003c/span>에 대하여 포물선 \u003cspan class=\"heq\">\\(y^{2} =16x\\)\u003c/span> 위의 점 중 제 \u003cspan class=\"heq\">\\(1\\)\u003c/span>사분면에 있는 점 \u003cspan class=\"heq\">\\(P\\)\u003c/span>가 \u003cspan class=\"heq\">\\({\\overline{PF_{2}}} - {\\overline{PF_{1}}} =6\\)\u003c/span>을 만족시킨다.\u003cbr>포물선 \u003cspan class=\"heq\">\\(y^{2} =16x\\)\u003c/span> 위의 점 \u003cspan class=\"heq\">\\(P\\)\u003c/span>에서의 접선이 \u003cspan class=\"heq\">\\(x\\)\u003c/span>축과 만나는 점을 \u003cspan class=\"heq\">\\(F_{3}\\)\u003c/span>이라 하면 두 점 \u003cspan class=\"heq\">\\(F_{ 1}\\)\u003c/span>, \u003cspan class=\"heq\">\\(F_{3}\\)\u00 <script>window.HandStudyGuide={"itemId":17271,"sourceHash":"46463862f6c2988a401f19c7bdc28ed7c0c0232d522578c7cd2cc622de881b77","contentHash":"a727582369f4b5be7f048678f9793391caa30b3d51b57206788f681e19aa0c7f","overview":{"goal":"포물선의 거리 성질로 \\(P\\)를 찾고, 접선과 타원의 꼭짓점 위치로 짧은반지름을 구해요.","firstLook":"포물선의 초점은 \\(F_1=(4,0)\\), 준선은 \\(x=-4\\)예요. \\(PF_2-PF_1=6\\)에서 두 거리를 좌표식으로 바꾸면 \\(P\\)가 정해져요.","conditions":[{"label":"제1사분면","meaning":"포물선에서 얻는 두 \\(y\\)값 중 양수를 택해요."},{"label":"꼭짓점 위치","meaning":"타원의 꼭짓점 중 실제로 선분 \\(PF_3\\) 위에 있는 점을 확인해야 해요."}]},"chapters":[{"id":"c1","label":"거리차로 P를 찾아요","stepIds":["s1","s2","s3","s4"],"question":"\\(PF_1\\)과 \\(PF_2\\)를 어떻게 좌표식으로 바꿀까요?","hint":"포물선의 정의로 \\(PF_1=x+4\\)를 얻고, 거리차 조건으로 \\(PF_2\\)를 정해요.","explanation":"\\(y^2=16x\\)의 초점은 \\(F_1=(4,0)\\), 준선은 \\(x=-4\\)예요. \\(P=(x,y)\\)에서 초점까지 거리는 준선까지 거리와 같으므로 \\(PF_1=x+4\\)예요. 조건 \\(PF_2-PF_1=6\\)에서 \\(PF_2=x+10\\)이에요.\n\n한편 \\(F_2=(-6,0)\\)이므로 \\(PF_2^2=(x+6)^2+y^2=(x+6)^2+16x\\)예요. 이를 \\((x+10)^2\\)와 같게 두면 \\(x=8\\)이고, \\(y^2=128\\)이에요. \\(P\\)가 제1사분면이므로 \\(y=8\\sqrt2\\), 즉 \\(P=(8,8\\sqrt2)\\)예요. 이 점에서 실제로 \\(PF_1=12,PF_2=18\\)이라 거리차 6도 맞아요.","check":{"prompt":"\\(y=-8\\sqrt2\\)를 제외하는 원래 조건은 무엇인가요?","answer":"점 \\(P\\)가 제1사분면에 있으므로 \\(y>0\\)이어야 해요."}},{"id":"c2","label":"접선과 타원 중심을 정해요","stepIds":["s5","s6","s7"],"question":"접점 \\(P\\)에서의 접선과 타원의 중심은 어떻게 구할까요?","hint":"포물선의 접선 식과 두 초점의 중점을 사용해요.","explanation":"포물선 \\(y^2=16x\\)에서 \\(P=(8,8\\sqrt2)\\)인 접선은 \\((8\\sqrt2)y=8(x+8)\\)이므로 \\(y=(x+8)/\\sqrt2\\)예요. \\(x\\)축과 만날 때 \\(y=0\\)이어서 \\(F_3=(-8,0)\\)이에요.\n\n타원의 초점은 \\(F_1=(4,0),F_3=(-8,0)\\)이므로 중심은 중점 \\((-2,0)\\), 초점 사이 거리의 절반은 \\(c=6\\)이에요. 선분 \\(PF_3\\)의 직선은 \\(y=(\\sqrt2/2)(x+8)\\)이에요.","check":{"prompt":"\\(F_3\\)가 실제로 선분 \\(PF_3\\)의 왼쪽 끝점이라는 것은 좌표에서 어떻게 보이나요?","answer":"\\(F_3=(-8,0)\\), \\(P=(8,8\\sqrt2)\\)이고 선분의 점들은 x좌표가 -8부터 8까지, y좌표가 0 이상이에요."}},{"id":"c3","label":"선분 위 꼭짓점이 짧은축 끝임을 확인해요","stepIds":["s8","s9"],"question":"선분 위의 타원 꼭짓점은 왜 \\((-2,3\\sqrt2)\\)일까요?","hint":"중심의 \\(x\\)좌표 \\(-2\\)를 선분의 직선에 넣고, 장축 끝점 가능성도 위치로 배제해요.","explanation":"초점이 \\(x\\)축 위에 있으므로 타원의 긴축은 \\(x\\)축, 짧은축은 중심을 지나는 수직선 \\(x=-2\\)예요. 선분 \\(PF_3\\)와 \\(x=-2\\)의 교점은 \\(y=(\\sqrt2/2)\\times6=3\\sqrt2\\)여서 \\((-2,3\\sqrt2)\\)예요. 이 점은 \\(x=-2\\)가 -8과 8 사이이고 \\(y>0\\)이므로 실제 선분 위에 있어요.\n\n선분이 \\(x\\)축과 만나는 점은 \\(F_3=(-8,0)\\)뿐인데 초점은 타원의 장축 끝점이 될 수 없으므로, 주어진 꼭짓점은 위쪽 짧은축 끝점이에요. 따라서 \\(b=3\\sqrt2\\), \\(b^2=18\\)이고 타원의 관계 \\(a^2=b^2+c^2\\)에서 \\(a^2=18+36=54\\)예요.","check":{"prompt":"직선과 \\(x=-2\\)의 교점이 선분 바깥이 아닌지 어떻게 확인하나요?","answer":"교점의 x좌표 -2가 양 끝의 -8과 8 사이이고, 직선에서 나온 y좌표도 0과 \\(8\\sqrt2\\) 사이여서 선분 안에 있어요."}}],"takeaway":["포물선의 초점 거리와 준선 거리를 같게 두면 거리 조건을 좌표식으로 바꿀 수 있어요.","타원의 초점이 놓인 직선이 긴축이고, 두 초점의 중점이 타원의 중심이에요.","‘선분 위의 꼭짓점’은 직선과의 교점만 구하지 말고 그 점이 실제 선분 안에 있고 어느 축의 끝인지 확인해요."]};</script>
