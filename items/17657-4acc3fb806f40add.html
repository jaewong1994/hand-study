<script>window.HandStudyGuide={"itemId":17657,"sourceHash":"c60efc17c42e5faa4ef19e2a1d70f1549bbb168c1dd4e328a0d25ca2a67f79c7","contentHash":"6f5bb115277c0641728966c41ee482c314dc32d4f33aba0a3b4e7bbf829dc61b","overview":{"goal":"\\(ab=0\\)인 두 경우의 적분을 같은 식으로 바꾸고, 가능한 네 순서쌍의 \\(a-b\\)를 비교해요.","firstLook":"서로 다른 두 수라는 조건 때문에 0이 아닌 쪽의 값을 \\(c\\)라 두면 \\(c\\ne 0\\)이고, 두 경우 모두 \\(\\int_0^1ue^{cu}du\\)로 모을 수 있어요.","conditions":[{"label":"\\(ab=0\\)","meaning":"\\(b=0\\) 또는 \\(a=0\\)으로 나누되 \\((0,0)\\)은 제외해요."},{"label":"두 치환의 구간","meaning":"\\(u=\\sin x\\)와 \\(u=\\cos x\\)에서 미분관계의 부호와 양 끝값을 함께 바꿔요."}]},"chapters":[{"id":"c1","label":"두 경우를 같은 적분으로 만들기","stepIds":["s1","s2"],"question":"\\(a=0\\)일 때 \\(u=\\cos x\\)로 치환하면 왜 적분구간이 다시 0부터 1이 되나요?","hint":"\\(du=-\\sin x\\,dx\\)와 \\(x=0,\\pi/2\\)에서의 \\(u\\) 값을 함께 적으세요.","explanation":"\\(ab=0\\)이고 \\(a,b\\)가 서로 다르므로 \\((0,0)\\)은 아니에요. \\(b=0\\)이면 \\(c=a\\ne 0\\), \\(u=\\sin x\\), \\(du=\\cos x\\,dx\\)라서 적분은 \\(\\int_0^1ue^{cu}du\\)가 돼요. \\(a=0\\)이면 \\(c=b\\ne 0\\), \\(u=\\cos x\\), \\(du=-\\sin x\\,dx\\)이고 양 끝이 \\(1\\to 0\\)이므로 \\(\\int_1^0ue^{cu}(-du)=\\int_0^1ue^{cu}du\\)예요.","check":{"prompt":"두 경우에서 \\(c=0\\)을 따로 계산하지 않아도 되는 이유는 무엇인가요?","answer":"\\(c=0\\)이면 \\(a=b=0\\)이 되어 서로 다른 두 실수 조건에 어긋나기 때문이에요."}},{"id":"c2","label":"부분적분으로 상수 찾기","stepIds":["s3","s4","s5"],"question":"\\(I(c)=\\int_0^1ue^{cu}du\\)에서 어느 항을 미분해야 계산이 줄어드나요?","hint":"\\(u\\)를 미분하면 1이 되고, \\(e^{cu}\\)는 \\(e^{cu}/c\\)로 적분돼요.","explanation":"\\(u\\)를 미분하고 \\(e^{cu}\\)를 적분하면 \\(I(c)=[ue^{cu}/c]_0^1-\\int_0^1e^{cu}/c\\,du=e^c/c-(e^c-1)/c^2\\)예요. 원래 조건 \\(I(c)=1/c^2-2e^c\\)에 넣고 \\(c^2\\)을 곱하면 \\(ce^c-e^c+1=1-2c^2e^c\\). \\(e^c>0\\)이므로 \\(2c^2+c-1=0\\), 따라서 \\(c=1/2\\) 또는 \\(c=-1\\)예요.","check":{"prompt":"방정식에서 \\(e^c\\)를 없앨 수 있는 이유는 무엇인가요?","answer":"정리하면 \\(e^c(2c^2+c-1)=0\\)이고 지수함수 값 \\(e^c\\)는 항상 양수이기 때문이에요."}},{"id":"c3","label":"네 순서쌍 직접 비교","stepIds":["s6","s7"],"question":"가능한 네 순서쌍에서 \\(a-b\\)를 각각 계산하면 어떤 값들이 나오나요?","hint":"\\(c\\)가 \\(a\\)인 경우와 \\(b\\)인 경우를 모두 적으세요.","explanation":"\\(b=0\\)일 때는 \\((a,b)=(1/2,0),(-1,0)\\), \\(a=0\\)일 때는 \\((0,1/2),(0,-1)\\)예요. 이 순서대로 \\(a-b\\)는 \\(1/2,-1,-1/2,1\\)이고, 네 값 가운데 가장 작은 값은 \\(-1\\)이므로 ④예요.","check":{"prompt":"\\((0,-1)\\)에서 \\(a-b\\)는 얼마인가요?","answer":"\\(0-(-1)=1\\)예요."}}],"takeaway":["치환에서 미분관계가 음수이면 양 끝값의 순서도 함께 바뀌는지 확인해요.","경우별 후보는 축약 기호에 숨기지 말고 실제 값을 모두 계산해 비교해요."]};</script>
