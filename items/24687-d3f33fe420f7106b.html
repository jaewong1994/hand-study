u003ctd class=\"htbld\">\u003cspan class=\"heq\">\\(\\frac{1}{2}\\)\u003c/span>\u003c/td>\u003ctd class=\"htbld\">\u003cspan class=\"heq\">\\(1\\)\u003c/span>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>따라서 모평균 \u003cspan class=\"heq\">\\(m\\)\u003c/span>과 모분산 \u003cspan class=\"heq\">\\(\\sigma^{2}\\)\u003c/span>는 \u003cspan class=\"heq\">\\(m={E}(X)=\\frac{7}{3}\\)\u003c/span>, \u003cspan class=\"heq\">\\(\\sigma^{2}={V}(X)=\\)\u003c/span>\u003cspan class=\"heq\">\\(\\boxed{\\,㈎\\,}\\)\u003c/span>이다.모집단에서 크기가 \u003cspan class=\"heq\">\\(10\\)\u003c/span>인 표본을 임의추출하여 구한표본평균을 \u003cspan class=\"heq\">\\(\\overline{X\\,}\\)\u003c/span>라 하면 \u003cspan class=\"heq\">\\({E}(\\,\\overline{X\\,})=\\frac{7}{3}\\)\u003c/span>, \u003cspan class=\"heq\">\\({V}(\\,\\overline{X\\,})=\\)\u003c/span>\u003cspan class=\"heq\">\\(\\boxed{\\,㈏\\,}\\)\u003c/span>이다.주머니에서 \u003cspan class=\"heq\">\\(n\\)\u003c/span>번째 꺼낸 공에 적혀 있는 수를 \u003cspan class=\"heq\">\\(X_{n}\\)\u003c/span>이라 하면 \u003cspan class=\"heq\">\\(Y= \\sum _{n=1}^{10} {\\,}X_{n}=10\\,\\overline{X\\,}\\)\u003c/span>이므로 \u003cspan class=\"heq\">\\({E}(Y)=\\frac{70}{3}\\)\u003c/span>, \u003cspan class=\"heq\">\\({V}(Y)=\\)\u003c/span>\u003cspan class=\"heq\">\\(\\boxed{\\,㈐\\,}\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp>위의 (가), (나), (다)에 알맞은 수를 각각 \u003cspan class=\"heq\">\\(p\\)\u003c/span> , \u003cspan class=\"heq\">\\(q\\)\u003c/span> , \u003cspan class=\"heq\">\\(r\\)\u003c/span> 라 할 때, \u003cspan class=\"heq\">\\(p +q +r\\)\u003c/span> 의 값은? [4점]\u003c/p>\u003cdiv class=\"hchoices\">\u003cdiv class=\"hch\">① \u003cspan class=\"heq\">\\(\\frac{31}{6}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">② \u003cspan class=\"heq\">\\(\\frac{11}{2}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">③ \u003cspan class=\"heq\">\\(\\frac{35}{6}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">④ \u003cspan class=\"heq\">\\(\\frac{37}{6}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">⑤ \u003cspan class=\"heq\">\\(\\frac{13}{2}\\)\u003c/span>\u003c/div>\u003c/div>","questionText":"숫자 $1$이 적혀 있는 공 $10$개, 숫자 $2$가 적혀 있는 공 $20$개, 숫자 $3$이 적혀 있는 공 $30$개가 들어 있는 주머니가 있다. 이 주머니에서 임의로 한 개의 공을 꺼내어 공에 적혀 있는 수를 확인한 후 다시 넣는다. 이와 같은 시행을 $10$번 반복하여 확인한 $10$개의 수의 합을 확률변수 $Y$라 하자. 다음은 확률변수 $Y$의 평균 ${E}(Y)$와 분산 ${V}(Y)$를 구하는 과정이다.\n주머니에 들어 있는 $60$개의 공을 모집단으로 하자.이 모집단에서 임의로 한 개의 공을 꺼낼 때, 이 공에 적혀 있는 수를 확률변수 $X$라 하면 $X$의 확률분포,즉 모집단의 확률분포는 다음 표와 같다.따라서 모평균 $m$과 모분산 $\\sigma^{2}$는 $m={E}(X)=\\frac{7}{3}$, $\\sigma^{2}={V}(X)=$$\\boxed{\\,㈎\\,}$이다.모집단에서 크기가 $10$인 표본을 임의추출하여 구한표본평균을 $\\overline{X\\,}$라 하면 ${E}(\\,\\overline{X\\,})=\\frac{7}{3}$, ${V}(\\,\\overline{X\\,})=$$\\boxed{\\,㈏\\,}$이다.주머니에서 $n$번째 꺼낸 공에 적혀 있는 수를 $X_{n}$이라 하면 $Y= \\sum _{n=1}^{10} {\\,}X_{n}=10\\,\\overline{X\\,}$이므로 ${E}(Y)=\\frac{70}{3}$, ${V}(Y)=$$\\boxed{\\,㈐\\,}$이다.\n위의 (가), (나), (다)에 알맞은 수를 각각 $p$ , $q$ , $r$ 라 할 때, $p +q +r$ 의 값은? [4점]\n① $\\frac{31}{6}$ ② $\\frac{11}{2}$ ③ $\\frac{35}{6}$ ④ $\\frac{37}{6}$ ⑤ $\\frac{13}{2}$","sourceHash":"5deff2f097e9009d28c197f54cd855ab34a2e1d8c3af8619e97a89743309cc55","sourceKind":"csat","sourceLabel":"2019년 시행 수능 · 2020학년도 · 나형 · 16번","steps":[{"id":"s1","latex":"\\mathrm P(X=1)=\\frac16,\\quad \\mathrm P(X=2)=\\frac13,\\quad \\mathrm P(X=3)=\\frac12"},{"id":"s2","latex":"\\mathrm E(X)=\\frac73,\\quad \\mathrm E(X^2)=\\frac16+\\frac43+\\frac92=6"},{"id":"s3","latex":"p=\\mathrm V(X)=6-\\left(\\frac73\\right)^2=\\frac59"},{"id":"s4","latex":"\\text{복원추출이므로 }q=\\mathrm V(\\overline X)=\\frac{\\mathrm V(X)}{10}=\\frac1{18}"},{"id":"s5","latex":"Y=10\\overline X\\ \\Rightarrow\\ r=\\mathrm V(Y)=100\\cdot\\frac1{18}=\\frac{50}9"},{"id":"s6","latex":"p+q+r=\\frac59+\\frac1{18}+\\frac{50}9=\\boxed{\\frac{37}6}\\quad\\text{④}"}],"track":"나형"};</script>
