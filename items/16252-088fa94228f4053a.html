<script>window.HandStudyRecord={"itemId":16252,"sourceLabel":"2019 교육청 고3 수리가형 3월 30번","adminYear":2019,"grade":3,"month":3,"number":30,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"다음 조건을 만족시키며 최고차항의 계수가 $1\\,$인 모든 사차함수 $f(x)\\,$에 대하여 $f(0)\\,$의 최댓값과 최솟값의 합을 구하시오. (단, $\\lim _{x\\, -> \\, \\infty } {} \\frac{x}{e ^{x}} =0$) [4점]\n(가) $f(1)=0$, $f'(1)=0$ (나) 방정식 $f(x)=0\\,$의 모든 실근은 $10$ 이하의 자연수이다.(다) 함수 $g(x)= \\frac{3x}{e ^{x-1}} +k\\,$에 대하여 함수 $\\left| (f \\circ g)(x) \\right| \\,$가 실수 전체의 집합에서 미분가능하도록 하는 자연수 $k\\,$의 개수는 $4\\,$이다.","answer":"77","sourceHash":"1ce2c617c7de57e3c349610bbde1c3ebc15edf418cd377b1e96de50337ec0672","steps":[{"id":"s1","latex":"f(x)=(x-1)^2q(x),\\quad q\\text{는 최고차항 계수가 }1\\text{인 이차식}"},{"id":"s2","latex":"g'(x)=3(1-x)e^{1-x},\\quad g\\text{는 }x=1\\text{에서 최댓값 }g(1)=k+3\\text{을 갖는다}"},{"id":"s3","latex":"|f(g(x))|\\text{가 미분 가능}\\Rightarrow f\\text{의 모든 단순근 }\\alpha\\ge k+3"},{"id":"s4","latex":"\\text{조건을 만족하는 자연수 }k\\text{가 }4\\text{개}\\Rightarrow\\text{단순근 }\\beta=7"},{"id":"s5","latex":"f(x)=(x-1)^3(x-7)\\text{ 또는 }(x-1)^2(x-7)(x-\\gamma)"},{"id":"s6","latex":"\\gamma\\in\\{8,9,10\\}"},{"id":"s7","latex":"f(0)\\in\\{7,56,63,70\\}"},{"id":"s8","latex":"f(0)\\text{의 최댓값과 최솟값의 합}=70+7=77"}],"diagram":null,"contentHash":"c6757c6067f8b69551dc25341627a497f6990609bdfb32c5bbb4410296fc95f9","questionHtml":"<p class=\"hp htall\">다음 조건을 만족시키며 최고차항의 계수가 <span class=\"heq\">\\(1\\,\\)<\/span>인 모든 사차함수 <span class=\"heq\">\\(f(x)\\,\\)<\/span>에 대하여 <span class=\"heq\">\\(f(0)\\,\\)<\/span>의 최댓값과 최솟값의 합을 구하시오. (단, <span class=\"heq\">\\(\\lim\\limits_{x\\, \\to  \\, \\infty } {} \\dfrac{x}{e^{x}} =0\\)<\/span>) <span class=\"hscore\">[4점]<\/span><\/p><p class=\"hp htall\"><div class=\"hbox\"><p class=\"hp\">(가)<span class=\"heq\">\\(f(1)=0\\)<\/span>, <span class=\"heq\">\\(f'(1)=0\\)<\/span><\/p><p class=\"hp\">(나)방정식 <span class=\"heq\">\\(f(x)=0\\,\\)<\/span>의 모든 실근은 <span class=\"heq\">\\(10\\)<\/span> 이하의 자연수이다.<\/p><p class=\"hp htall\">(다)함수 <span class=\"heq\">\\(g(x)= \\dfrac{3x}{e^{x-1}} +k\\,\\)<\/span>에 대하여 함수 <span class=\"heq\">\\(\\left| (f \\circ g)(x) \\right| \\,\\)<\/span>가 실수 전체의 집합에서 미분가능하도록 하는 자연수 <span class=\"heq\">\\(k\\,\\)<\/span>의 개수는 <span class=\"heq\">\\(4\\,\\)<\/span>이다.<\/p><\/div><\/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"19ceda5c649aa98bd2c7c929de60d779bc80553b84aeeef996dce3f534c9e831"};</script>
<script>window.HandStudyGuide={"itemId":16252,"sourceHash":"1ce2c617c7de57e3c349610bbde1c3ebc15edf418cd377b1e96de50337ec0672","contentHash":"c6757c6067f8b69551dc25341627a497f6990609bdfb32c5bbb4410296fc95f9","overview":{"goal":"절댓값 합성함수가 미분가능하려면 단순한 영점이 g의 값 범위 안에 들어오지 않아야 함을 이용해 f의 근을 정합니다.","firstLook":"함수 g는 왼쪽에서 음의 무한대로부터 증가해 한 점에서 가장 큰 값을 갖고, 오른쪽에서는 k를 향해 감소합니다. 절댓값 합성함수의 뾰족점은 중복되지 않은 영점이 g의 값으로 실제 나타날 때 생깁니다.","conditions":[{"label":"사차함수의 근","meaning":"1은 적어도 중근이고, 모든 실근은 10 이하 자연수입니다."},{"label":"자연수 k의 개수","meaning":"미분가능하게 만드는 k가 정확히 네 개가 되도록 단순한 영점의 위치가 정해집니다."}]},"chapters":[{"id":"c1","label":"g의 값 범위를 읽습니다","stepIds":["s1","s2"],"question":"f의 모양과 g의 가장 큰 값은 어떻게 되나요?","hint":"주어진 함수값과 도함숫값 조건, 그리고 도함수의 부호를 쓰세요.","explanation":"\\(f(x)=(x-1)^2q(x)\\)이고 q는 최고차항 계수가 1인 이차식입니다. \\(g'(x)=3(1-x)e^{1-x}\\)이므로 \\(x<1\\)에서 증가, \\(x>1\\)에서 감소합니다. \\(x\\to-\\infty\\)이면 \\(3xe^{1-x}\\to-\\infty\\)이고, 주어진 극한으로 \\(x\\to\\infty\\)이면 \\(3x/e^{x-1}\\to0\\)입니다. 따라서 가장 큰 값은 \\(g(1)=k+3\\)이고 실제 값 범위는 \\(( -\\infty,k+3]\\)입니다.","check":{"prompt":"함수 g의 가장 큰 값이 가운데 지점에서 나오는 이유는 무엇인가요?","answer":"도함수가 그 지점의 왼쪽에서 양수, 오른쪽에서 음수로 바뀌기 때문입니다."}},{"id":"c2","label":"단순한 영점의 위치를 정합니다","stepIds":["s3","s4"],"question":"미분가능하게 만드는 자연수가 네 개라는 말은 중복되지 않은 근을 어디에 놓게 하나요?","hint":"절댓값은 안쪽 함수가 단순하게 0을 지날 때 뾰족해집니다.","explanation":"f의 중복되지 않은 근을 \\(\\alpha\\)라 하면 증가 구간에서 \\(g(x)=\\alpha\\)를 가로지를 때 \\(|f(g(x))|\\)에 뾰족점이 생깁니다. 다만 \\(\\alpha=k+3\\)이면 g가 최댓값에서 근에 접해 \\(g(x)-\\alpha\\)가 이차로 작아지므로 미분가능합니다. 따라서 가장 작은 중복되지 않은 근을 \\(\\beta\\)라 할 때 필요한 조건은 \\(k+3\\le\\beta\\)입니다. 이를 만족하는 자연수 k가 정확히 네 개이려면 \\(k=1,2,3,4\\)가 되고 \\(\\beta=7\\)이어야 합니다.","check":{"prompt":"경계값 7에서 k가 4까지 나오는 계산은 무엇인가요?","answer":"\\(k+3\\le7\\)에서 자연수 k는 1, 2, 3, 4의 네 개입니다."}},{"id":"c3","label":"가능한 사차함수를 모두 셉니다","stepIds":["s5","s6","s7","s8"],"question":"근 1과 7 외의 근은 어떤 값이 가능한가요?","hint":"차수 4와 모든 실근이 자연수라는 조건을 함께 쓰세요.","explanation":"가능한 꼴은 \\(f(x)=(x-1)^3(x-7)\\) 또는 \\(f(x)=(x-1)^2(x-7)(x-\\gamma)\\)입니다. 추가된 중복되지 않은 근이 7보다 작으면 경계를 바꾸고, 같은 근 7이면 중근이 되어 조건이 달라집니다. 따라서 \\(\\gamma=8,9,10\\)입니다. \\(f(0)\\)은 첫 꼴에서 7, 둘째 꼴에서 \\(7\\gamma\\)이므로 \\(7,56,63,70\\)입니다. 최댓값과 최솟값의 합은 \\(70+7=77\\)입니다.","check":{"prompt":"추가 근으로 7을 포함하지 않는 이유는 무엇인가요?","answer":"그러면 7이 중근이 되어 절댓값 합성함수의 미분가능성을 제한하는 중복되지 않은 근이 사라지기 때문입니다."}}],"takeaway":["절댓값 함수의 미분가능성은 안쪽 함수가 0을 지나는 방식과 근의 중복 여부를 함께 봅니다.","개수 조건은 경계값을 실제 자연수 목록으로 바꾸어 확인합니다."]};</script>
