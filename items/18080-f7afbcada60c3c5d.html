<script>window.HandStudyRecord={"itemId":18080,"sourceLabel":"2024 평가원 고3 수학미적분 9월 22번","adminYear":2024,"grade":3,"month":9,"number":22,"track":"미적분","points":4,"scoreStatus":"confirmed_4_direct","questionText":"양수 $k\\,$에 대하여 $a_{1}=k\\,$인 수열 $\\left\\{ a_{n} \\right\\} \\,$이 다음 조건을 만족시킨다.\n(가) $a_{2} \\times a_{3}\u003c0$ (나) 모든 자연수 $n\\,$에 대하여 $\\left(a_{n+1}-a_{n}+\\frac{2}{3} k \\right) \\left(a_{n+1}+k a_{n} \\right)=0\\,$ 이다. \n$a_{5}=0\\,$이 되도록 하는 서로 다른 모든 양수 $k\\,$에 대하여 $k^{2}\\,$의 값의 합을 구하시오. [4점]\n 사각형입니다. 2024년 9월 고3 모의고사 문제지제 2 교시 수학 영역(미적분) \n5 지선다형","answer":"8","sourceHash":"ada9c93065e90332eeb8b59e80d9971317a7d22eb7f80992da2ad8c79c8f2bab","steps":[{"id":"s1","latex":"L(x)=x-2k/3,\\quad M(x)=-kx,\\quad a_1=k>0"},{"id":"s2","latex":"LL:(a_2,a_3)=(k/3,-k/3),\\quad LM:(k/3,-k^2/3)"},{"id":"s3","latex":"ML:(-k^2,-k^2-2k/3)\\text{는 불가},\\quad MM:(-k^2,k^3)"},{"id":"s4","latex":"LLML:\\ a_5=k^2/3-2k/3=0\\Rightarrow k=2"},{"id":"s5","latex":"LMML:\\ a_5=k^3/3-2k/3=0\\Rightarrow k^2=2"},{"id":"s6","latex":"MMLL:\\ a_5=k^3-4k/3=0\\Rightarrow k^2=4/3"},{"id":"s7","latex":"MMLM:\\ a_5=-k(k^3-2k/3)=0\\Rightarrow k^2=2/3"},{"id":"s8","latex":"\\text{나머지 경로는 }a_5\\ne0,\\quad\\sum k^2=4+2+4/3+2/3=8"}],"diagram":null,"contentHash":"22914e00087c1689d2ac90ebdb1c664a40cf4fe73f0ba9a0aa9b3d8bce9de32b","questionHtml":"\u003cp class=\"hp\">양수 \u003cspan class=\"heq\">\\(k\\,\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(a_{1}=k\\,\\)\u003c/span>인 수열 \u003cspan class=\"heq\">\\(\\left\\{ a_{n} \\right\\} \\,\\)\u003c/span>이 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) \u003cspan class=\"heq\">\\(a_{2} \\times a_{3}\\lt 0\\)\u003c/span>\u003c/p>\u003cp class=\"hp htall\">(나) 모든 자연수 \u003cspan class=\"heq\">\\(n\\,\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(\\left(a_{n+1}-a_{n}+\\dfrac{2}{3} k \\right) \\left(a_{n+1}+k a_{n} \\right)=0\\,\\)\u003c/span>\u003cbr>이다.\u003c/p>\u003c/div>\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(a_{5}=0\\,\\)\u003c/span>이 되도록 하는 서로 다른 모든 양수 \u003cspan class=\"heq\">\\(k\\,\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(k^{2}\\,\\)\u003c/span>의 값의 합을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"f7afbcada60c3c5de29215f1b9a7e603df1c189452e1e770b14cdcfce2031d3e"};</script>
<script>window.HandStudyGuide={"itemId":18080,"sourceHash":"ada9c93065e90332eeb8b59e80d9971317a7d22eb7f80992da2ad8c79c8f2bab","contentHash":"22914e00087c1689d2ac90ebdb1c664a40cf4fe73f0ba9a0aa9b3d8bce9de32b","overview":{"goal":"매 단계에서 두 선택 중 하나를 적용하되 둘째 항과 셋째 항의 부호 조건으로 경로를 줄이고, 다섯째 항이 0인 양수 k를 찾습니다.","firstLook":"한 단계의 두 규칙을 L과 M으로 표시하면 네 번째 선택까지의 경로를 빠짐없이 검사할 수 있습니다. 먼저 앞의 두 선택 중 불가능한 경로를 없앱니다.","conditions":[{"label":"초항","meaning":"k는 양수이므로 각 경로에서 부호를 곧바로 판단할 수 있습니다."},{"label":"부호가 반대","meaning":"둘째 항과 셋째 항의 곱이 음수인 경로만 남깁니다."}]},"chapters":[{"id":"c1","label":"앞의 두 선택을 분류합니다","stepIds":["s1","s2","s3"],"question":"둘째 항과 셋째 항의 부호가 반대인 경로는 무엇인가요?","hint":"\\(L(x)=x-2k/3\\), \\(M(x)=-kx\\)를 차례로 적용하세요.","explanation":"\\(a_1=k\\)에서 LL이면 \\((a_2,a_3)=(k/3,-k/3)\\), LM이면 \\((k/3,-k^2/3)\\)라서 둘 다 부호가 반대입니다. ML이면 \\((-k^2,-k^2-2k/3)\\)로 둘 다 음수여서 제외됩니다. MM이면 \\((-k^2,k^3)\\)로 부호가 반대입니다. 따라서 앞 두 글자는 LL, LM, MM만 가능합니다.","check":{"prompt":"ML 경로를 모든 양수 k에 대해 제외할 수 있는 이유는 무엇인가요?","answer":"두 항 \\(-k^2\\), \\(-k^2-2k/3\\)가 양수 k에서 모두 음수이기 때문입니다."}},{"id":"c2","label":"다섯째 항이 0인 경로를 찾습니다","stepIds":["s4","s5","s6","s7"],"question":"남은 경로에서 마지막 두 선택은 어떻게 정해지나요?","hint":"각 경로의 다섯째 항을 0으로 놓고 양수 k를 구하세요.","explanation":"LL 뒤에는 ML을 붙일 때 \\(a_5=k^2/3-2k/3=0\\)이 되어 \\(k=2\\)입니다. LM 뒤의 ML에서는 \\(a_5=k^3/3-2k/3=0\\)이므로 \\(k^2=2\\)입니다. MM 뒤의 LL에서는 \\(a_5=k^3-4k/3=0\\)이므로 \\(k^2=4/3\\), MM 뒤의 LM에서는 \\(a_5=-k(k^3-2k/3)=0\\)이므로 \\(k^2=2/3\\)입니다. 여기서 \\(k>0\\)이므로 식을 k로 나누어도 됩니다.","check":{"prompt":"각 식에서 \\(k=0\\)을 답으로 넣지 않는 이유는 무엇인가요?","answer":"문제에서 k가 양수라고 했으므로 0은 처음부터 허용되지 않습니다."}},{"id":"c3","label":"나머지 경로와 합을 확인합니다","stepIds":["s8"],"question":"서로 다른 모든 k의 제곱 합은 얼마인가요?","hint":"얻은 네 제곱값이 서로 다른지 확인하세요.","explanation":"남은 경로도 빠짐없이 확인합니다. LLLL, LLLM에서는 \\(a_5=-5k/3, k^2\\), LMLL, LMLM에서는 \\(a_5=-k(k+4)/3, k^2(k+2)/3\\), LLMM, LMMM에서는 \\(a_5=-k^3/3, -k^4/3\\), MMML, MMMM에서는 \\(a_5=-k^4-2k/3, k^5\\)입니다. 모두 \\(k>0\\)에서 0이 아니므로 추가 해가 없습니다. 얻은 값 \\(4,2,4/3,2/3\\)은 모두 서로 다르고 각각 양수 k 하나를 정합니다. 따라서 합은 \\(4+2+4/3+2/3=6+2=8\\)입니다.","check":{"prompt":"k 자체가 아니라 그 제곱값을 바로 더해도 되는 이유는 무엇인가요?","answer":"문제가 요구하는 양이 각 양수 \\(k\\)의 제곱의 합이고, 각 양의 제곱값은 양수 \\(k\\)를 하나씩 정하기 때문입니다."}}],"takeaway":["두 갈래 점화식은 경로 기호를 붙여 앞 조건으로 먼저 가지를 줄입니다.","양수 조건은 식을 나눌 때와 0인 근을 제외할 때 다시 확인합니다."]};</script>
