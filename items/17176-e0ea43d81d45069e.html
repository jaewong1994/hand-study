<script>window.HandStudyRecord={"itemId":17176,"sourceLabel":"2021 평가원 고3 수학기하 6월 30번","adminYear":2021,"grade":3,"month":6,"number":30,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"좌표평면 위의 네 점 $A \\left( 2,\\,0 \\right)$, $B \\left( 0,\\,2 \\right)$, $C \\left( -2,\\,0 \\right)$, $D \\left( 0,\\,-2 \\right)$를 꼭짓점으로 하는 정사각형 $A B C D$의 네 변 위의 두 점 $P,\\,Q$가 다음 조건을 만족시킨다.\n(가) $\\left( {\\vec{ PQ}}  \\cdot  {\\vec{ AB}} \\right) \\left( {\\vec{ PQ}}  \\cdot  {\\vec{ AD}} \\right)=0$\n(나) ${\\vec{ OA}}  \\cdot  {\\vec{ OP}} \\geq -2$이고 ${\\vec{ OB}}  \\cdot  {\\vec{ OP}} \\geq 0$이다.\n(다) ${\\vec{ OA }}  \\cdot  {\\vec{ OQ }} \\geq -2$이고 ${\\vec{ OB }}  \\cdot  {\\vec{ OQ }} \\leq 0$이다.\n점 $R \\left( 4,\\,4 \\right)$에 대하여 ${\\vec{ RP}}  \\cdot  {\\vec{ RQ}}$의 최댓값을 $M$, 최솟값을 $m$이라 할 때, $M+m$의 값을 구하시오. (단, $O$는 원점이다.) [4점]","answer":"48","sourceHash":"cab6e4da9af29d59dc43c37c95d694e9390b7a59299314427c209a8a94efd527","steps":[{"id":"s1","latex":"P=(x_1,y_1),\\ Q=(x_2,y_2),\\quad|x|+|y|=2"},{"id":"s2","latex":"PQ\\parallel(1,1)\\text{ 또는 }PQ\\parallel(1,-1)"},{"id":"s3","latex":"x+y=k:\\quad RP\\cdot RQ=\\frac{(k-10)(k-6)}2\\in[16,30]"},{"id":"s4","latex":"x-y=k:\\quad RP\\cdot RQ=\\frac{k^2+60}{2}\\in[30,32]"},{"id":"s5","latex":"\\text{경계 }k=2\\text{까지 포함하면 }m=16,\\ M=32"},{"id":"s6","latex":"M+m=48"}],"diagram":null,"contentHash":"4a8745a169d5ff32d9887dcf71327762598b89a8d1d47191da6377b41636c4d0","questionHtml":"\u003cp class=\"hp\">좌표평면 위의 네 점 \u003cspan class=\"heq\">\\(A \\left( 2,\\,0 \\right)\\)\u003c/span>, \u003cspan class=\"heq\">\\(B \\left( 0,\\,2 \\right)\\)\u003c/span>, \u003cspan class=\"heq\">\\(C \\left( -2,\\,0 \\right)\\)\u003c/span>, \u003cspan class=\"heq\">\\(D \\left( 0,\\,-2 \\right)\\)\u003c/span>를 꼭짓점으로 하는 정사각형 \u003cspan class=\"heq\">\\(A B C D\\)\u003c/span>의 네 변 위의 두 점 \u003cspan class=\"heq\">\\(P,\\,Q\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) \u003cspan class=\"heq\">\\(\\left( {\\overrightarrow{PQ}}  \\cdot  {\\overrightarrow{AB}} \\right) \\left( {\\overrightarrow{PQ}}  \\cdot  {\\overrightarrow{AD}} \\right)\\)\u003c/span>\u003cspan class=\"heq\">\\(=0\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">(나) \u003cspan class=\"heq\">\\({\\overrightarrow{OA}}  \\cdot  {\\overrightarrow{OP}} \\geq -2\\)\u003c/span>이고 \u003cspan class=\"heq\">\\({\\overrightarrow{OB}}  \\cdot  {\\overrightarrow{OP}} \\geq 0\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp\">(다) \u003cspan class=\"heq\">\\({\\overrightarrow{OA}}  \\cdot  {\\overrightarrow{OQ}} \\geq -2\\)\u003c/span>이고 \u003cspan class=\"heq\">\\({\\overrightarrow{OB}}  \\cdot  {\\overrightarrow{OQ}} \\leq 0\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp class=\"hp\">점 \u003cspan class=\"heq\">\\(R \\left( 4,\\,4 \\right)\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\({\\overrightarrow{RP}}  \\cdot  {\\overrightarrow{RQ}}\\)\u003c/span>의 최댓값을 \u003cspan class=\"heq\">\\(M\\)\u003c/span>, 최솟값을 \u003cspan class=\"heq\">\\(m\\)\u003c/span>이라 할 때, \u003cspan class=\"heq\">\\(M+m\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(O\\)\u003c/span>는 원점이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"e0ea43d81d45069e0e23ce5de397eb6c7e9476a61061546cea78a1aa4d605dcc"};</script>
<script>window.HandStudyGuide={"itemId":17176,"sourceHash":"cab6e4da9af29d59dc43c37c95d694e9390b7a59299314427c209a8a94efd527","contentHash":"4a8745a169d5ff32d9887dcf71327762598b89a8d1d47191da6377b41636c4d0","overview":{"goal":"내적 조건으로 P,Q가 놓일 수 있는 변 구간과 PQ의 두 방향을 정하고, 각 방향에서 RP·RQ를 한 변수의 이차식으로 비교해요.","firstLook":"정사각형의 경계는 \\(|x|+|y|=2\\)이고, 조건 (나), (다)는 \\(P\\)를 위쪽에, \\(Q\\)를 아래쪽에 남겨요. 첫 내적 조건은 \\(PQ\\)가 두 변 중 하나와 평행함을 뜻해요.","conditions":[{"label":"점 P의 범위","meaning":"\\(P=(x_1,y_1)\\)는 경계에서 \\(x_1\\ge-1,y_1\\ge0\\)인 부분에 있어요."},{"label":"점 Q의 범위","meaning":"\\(Q=(x_2,y_2)\\)는 경계에서 \\(x_2\\ge-1,y_2\\le0\\)인 부분에 있어요."},{"label":"두 방향","meaning":"\\(PQ\\)는 기울기 \\(1\\) 또는 \\(-1\\)인 방향이에요."}]},"chapters":[{"id":"c1","label":"두 점의 허용 경계와 PQ의 방향을 정해요","stepIds":["s1","s2"],"question":"좌표 조건과 내적 조건은 도형에서 무엇을 뜻할까요?","hint":"\\(\\overrightarrow{AB}=(-2,2)\\), \\(\\overrightarrow{AD}=(-2,-2)\\)를 사용해요.","explanation":"정사각형 경계는 \\(|x|+|y|=2\\)예요. \\(\\overrightarrow{OA}\\cdot\\overrightarrow{OP}=2x_1\\ge-2\\), \\(\\overrightarrow{OB}\\cdot\\overrightarrow{OP}=2y_1\\ge0\\)이므로 \\(P\\)는 위쪽 경계 중 \\(x\\ge-1\\)인 부분에 있어요. 같은 방식으로 \\(Q\\)는 아래쪽 경계 중 \\(x\\ge-1\\)인 부분에 있어요.\n\n두 내적의 곱이 \\(0\\)이므로 적어도 하나가 \\(0\\)이에요. \\(PQ\\perp AB\\)이면 \\(PQ\\parallel AD\\), \\(PQ\\perp AD\\)이면 \\(PQ\\parallel AB\\)예요. 따라서 \\(PQ\\)는 기울기 \\(1\\) 또는 \\(-1\\)이에요.","check":{"prompt":"조건 (나)에서 \\(y_1\\ge0\\)은 어느 내적에서 나오나요?","answer":"\\(\\overrightarrow{OB}=(0,2)\\)이므로 \\(\\overrightarrow{OB}\\cdot\\overrightarrow{OP}=2y_1\\ge0\\)에서 나와요."}},{"id":"c2","label":"기울기 -1인 평행선에서 범위를 구해요","stepIds":["s3"],"question":"\\(x+y=k\\) 위의 두 교점에서 내적은 어떤 범위를 가질까요?","hint":"허용된 위쪽 왼쪽 변과 아래쪽 오른쪽 변의 교점 좌표를 구해요.","explanation":"기울기 \\(-1\\)인 선을 \\(x+y=k\\)라 두면 허용된 두 경계와 만나는 점은\n\\[\nP=\\left(\\frac{k-2}{2},\\frac{k+2}{2}\\right),\\quad\nQ=\\left(\\frac{k+2}{2},\\frac{k-2}{2}\\right)\n\\]\n이고 조건에서 \\(0\\le k\\le2\\)예요. \\(R=(4,4)\\)를 빼서 내적을 계산하면\n\\[\n\\overrightarrow{RP}\\cdot\\overrightarrow{RQ}\n=\\frac{(k-10)(k-6)}2.\n\\]\n이 식은 구간에서 감소하므로 \\(k=0\\)에서 \\(30\\), \\(k=2\\)에서 \\(16\\)이에요. \\(k=2\\)에서 한 점이 같은 방향의 변 위를 더 움직이는 경계 경우도 값이 \\(16\\)부터 \\(20\\) 사이여서 이 범위를 넓히지 않아요.","check":{"prompt":"\\(k=2\\)의 대표 교점은 어떤 두 꼭짓점인가요?","answer":"\\(P=B=(0,2)\\), \\(Q=A=(2,0)\\)예요."}},{"id":"c3","label":"기울기 1인 평행선에서도 범위를 구해요","stepIds":["s4"],"question":"\\(x-y=k\\)인 경우 내적의 범위는 어떻게 달라지나요?","hint":"이번에는 위쪽 오른쪽 변과 아래쪽 왼쪽 변의 교점을 사용해요.","explanation":"기울기 \\(1\\)인 선을 \\(x-y=k\\)라 두면\n\\[\nP=\\left(\\frac{k+2}{2},\\frac{2-k}{2}\\right),\\quad\nQ=\\left(\\frac{k-2}{2},\\frac{-2-k}{2}\\right),\n\\]\n역시 \\(0\\le k\\le2\\)예요. 계산하면\n\\[\n\\overrightarrow{RP}\\cdot\\overrightarrow{RQ}=\\frac{k^2+60}{2}.\n\\]\n따라서 \\(k=0\\)에서 \\(30\\), \\(k=2\\)에서 \\(32\\)이고 범위는 \\(30\\)부터 \\(32\\)까지예요. 경계에서 같은 변 위를 움직이는 경우도 이 범위를 벗어나지 않아요.","check":{"prompt":"이 식은 \\(0\\le k\\le2\\)에서 증가하나요?","answer":"\\(k^2\\)이 \\(0\\)에서 \\(4\\)까지 증가하므로 전체도 \\(30\\)에서 \\(32\\)까지 증가해요."}},{"id":"c4","label":"두 방향의 범위를 합쳐 양 끝값을 정해요","stepIds":["s5","s6"],"question":"전체 최댓값 \\(M\\)과 최솟값 \\(m\\)의 합은 얼마인가요?","hint":"두 방향에서 얻은 범위의 가장 작은 값과 큰 값을 비교해요.","explanation":"기울기 \\(-1\\)인 경우의 전체 범위는 \\(16\\)부터 \\(30\\), 기울기 \\(1\\)인 경우는 \\(30\\)부터 \\(32\\)예요. 경계 \\(k=2\\)도 포함되므로 \\(m=16,M=32\\)가 실제로 달성돼요. 따라서 \\(M+m=48\\)이에요.","check":{"prompt":"두 방향의 범위가 만나는 값은 얼마인가요?","answer":"둘 다 \\(30\\)을 포함해요."}}],"takeaway":["마름모꼴 정사각형의 경계는 절댓값 좌표식으로 나타내고 내적 부등식은 좌표 범위를 바로 정해요.","벡터가 한 변에 수직이면 정사각형의 다른 변과 평행하므로 두 방향만 조사하면 돼요.","끝점에서 선이 변과 겹치는 경우도 빠뜨리지 말고 값의 범위를 실제로 넓히는지 확인해요."]};</script>
