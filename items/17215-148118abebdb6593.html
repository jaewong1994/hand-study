<script>window.HandStudyGuide={"itemId":17215,"sourceHash":"3b5a28d4169d03ac8dbced6713192b0942b805734d1fa14fbe00e4e32b401d0a","contentHash":"4f9f622e4834f453acfd3d8e5069e3a7ec59eba40e56425a9a18416b562f4fb9","overview":{"goal":"두 교점의 지수값을 구해 같은 직선 위 두 점 사이의 거리를 나타내고 그 변화율을 계산해요.","firstLook":"교점 식에서 로그를 지운 뒤 \\(u=e^x>0\\)로 두면 이차방정식이 인수분해돼요.","conditions":[{"label":"두 곡선의 교점","meaning":"로그의 양변을 지수로 바꾸고 \\(e^x\\)를 한 변수로 묶어요."},{"label":"두 교점이 놓인 기울기 1인 직선","meaning":"세로 좌표 차와 가로 좌표 차가 같아서 거리는 가로 차의 \\(\\sqrt2\\)배예요."}]},"chapters":[{"id":"c1","label":"교점의 두 가로좌표 구하기","stepIds":["s1","s2","s3"],"question":"\\(u=e^x\\)로 바꾼 이차식은 어떤 두 일차식으로 나뉠까요?","hint":"두 근의 합과 곱을 \\(e^t\\), \\(1-e^{-2t}\\)와 맞춰 보세요.","explanation":"교점에서는 \\(\\ln(1+e^{2x}-e^{-2t})=x+t\\)이므로 \\(1+e^{2x}-e^{-2t}=e^{x+t}\\)예요. \\(u=e^x>0\\)로 두면 \\(u^2-e^tu+1-e^{-2t}=0\\)이고, 이는 \\((u-e^{-t})(u-e^t+e^{-t})=0\\)으로 나뉘어요. 두 근은 \\(u=e^{-t}\\), \\(u=e^t-e^{-t}\\)예요.\n\n\\(t>\\frac12\\ln2\\)이면 \\(e^{2t}>2\\)이므로 둘째 근도 양수이고 두 근이 서로 달라요. 따라서 두 교점의 가로좌표는 \\(-t\\)와 \\(\\ln(e^t-e^{-t})\\)예요.","check":{"prompt":"\\(e^t-e^{-t}\\)가 \\(e^{-t}\\)보다 큰 조건은 무엇인가요?","answer":"\\(e^t>2e^{-t}\\), 즉 \\(e^{2t}>2\\)이고 이는 주어진 \\(t>\\frac12\\ln2\\)와 같아요."}},{"id":"c2","label":"두 점 사이 거리 나타내기","stepIds":["s4"],"question":"기울기가 1인 직선 위 두 점의 가로 차가 \\(d\\)이면 거리는 왜 \\(\\sqrt2d\\)인가요?","hint":"세로 차도 \\(d\\)이므로 거리 공식에 두 번 들어가요.","explanation":"두 점은 \\(y=x+t\\) 위에 있으므로 가로좌표 차와 세로좌표 차가 같아요. 가로 차는 \\(\\ln(e^t-e^{-t})-(-t)=\\ln\\frac{e^t-e^{-t}}{e^{-t}}=\\ln(e^{2t}-1)\\)예요. 따라서 거리 함수는 \\(f(t)=\\sqrt2\\ln(e^{2t}-1)\\)이에요.","check":{"prompt":"가로좌표의 큰 값과 작은 값의 순서는 어떻게 확인했나요?","answer":"주어진 t 범위에서 \\(e^t-e^{-t}>e^{-t}\\)이므로 그 로그가 \\(-t\\)보다 커요."}},{"id":"c3","label":"거리의 변화율 계산하기","stepIds":["s5","s6"],"question":"\\(\\ln(e^{2t}-1)\\)을 미분할 때 분자에는 어떤 식이 나오나요?","hint":"로그 안쪽 식을 먼저 미분해 연쇄법칙을 적용하세요.","explanation":"\\(e^{2t}-1\\)의 미분은 \\(2e^{2t}\\)이므로 \\(f'(t)=\\sqrt2\\frac{2e^{2t}}{e^{2t}-1}\\)예요. \\(t=\\ln2\\)이면 \\(e^{2t}=4\\)이므로 \\(f'(\\ln2)=\\frac{8\\sqrt2}{3}\\)예요. 따라서 \\(q=8\\), \\(p=3\\)이고 \\(p+q=11\\)이에요.","check":{"prompt":"\\(e^{2\\ln2}\\)는 왜 4인가요?","answer":"\\(e^{\\ln2}=2\\)이므로 그 제곱은 4예요."}}],"takeaway":["로그와 지수가 섞인 교점 식은 \\(u=e^x>0\\)로 바꾸어 근의 부호와 순서를 확인해요.","기울기 1인 직선에서는 두 좌표 차가 같아 거리가 가로 차의 \\(\\sqrt2\\)배예요.","로그 합성함수의 미분은 안쪽 식의 미분을 분자에 빠뜨리지 않아요."]};</script>
