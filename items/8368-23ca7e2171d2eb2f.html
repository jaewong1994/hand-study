  <script>window.HandStudyRecord={"itemId":8368,"sourceLabel":"2024 교육청 고2 수학 3월 21번","adminYear":2024,"grade":2,"month":3,"number":21,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 두 직선 $l _{1} :y=mx \\, \\left(m>1 \\right)\\,$과 $l_{2}: y=\\frac{1}{m} x\\,$에 동시에 접하는 원의 중심을 ${{A}} \\,$라 하자. 직선 $l_{1}\\,$과 원의 접점을 ${{P}} \\,$, 직선 $l_{2}\\,$와 원의 접점을 ${{Q}} \\,$, 직선 ${{PQ}} \\,$가 $x\\,$축과 만나는 점을 ${{R}} \\,$이라 할 때, 세 점 ${{P}} \\,$, ${{Q}} \\,$, ${{R}} \\,$이 다음 조건을 만족시킨다.\n (가) $\\frac{}{line}{{{PQ}} }\\frac{=}{line}{{{QR}} }\\,$ (나) 삼각형 ${{OPQ}} \\,$의 넓이는 $24\\,$이다.\n직선 $l_{1}\\,$과 직선 ${{AQ}} \\,$의 교점을 ${{B}} \\,$라 할 때, 선분 ${{BQ}} \\,$의 길이는? (단, 원의 중심 ${{A}} \\,$는 제$1\\,$사분면 위에 있고, ${{O}} \\,$는 원점이다.) [4점]\n① $\\frac{3}{2} \\sqrt{5}\\,$ ② $2 \\sqrt{5}\\,$ ③ $\\frac{5}{2} \\sqrt{5}\\,$\n④ $3 \\sqrt{5}\\,$ ⑤ $\\frac{7}{2} \\sqrt{5}\\,$\n단답형","answer":"④","sourceHash":"fbdae2b62eed71c1f60061b7e3a60f9be241f0cb291ec91df254a4ea163a6bf2","steps":[{"id":"s1","latex":"d(A,l_1)=d(A,l_2),\\quad A\\text{ in quadrant I}\\Rightarrow A\\in\\{y=x\\}"},{"id":"s2","latex":"Q=\\left(u,\\frac um\\right),\\quad P=\\left(\\frac um,u\\right)"},{"id":"s3","latex":"PQ:y=-x+u+\\frac um,\\quad R=\\left(u+\\frac um,0\\right)"},{"id":"s4","latex":"PQ=\\sqrt2\\left(u-\\frac um\\right),\\quad QR=\\frac{\\sqrt2u}{m}"},{"id":"s5","latex":"PQ=QR\\Rightarrow m=2"},{"id":"s6","latex":"[OPQ]=\\frac38u^2=24\\Rightarrow u=8"},{"id":"s7","latex":"P=(4,8),\\quad Q=(8,4),\\quad AQ:y=-2x+20"},{"id":"s8","latex":"B=(5,10)\\Rightarrow BQ=\\sqrt{3^2+6^2}=3\\sqrt5"}],"diagram":null,"contentHash":"99868142edf9f75a01251632862f8111fa4cd42b327f931b499bd9d8ad7f1093","questionHtml":"\u003cp class=\"hp htall\">그림과 같이 두 직선 \u003cspan class=\"heq\">\\(l_{1} :y=mx \\, \\left(m\\gt 1 \\right)\\,\\)\u003c/span>과 \u003cspan class=\"heq\">\\(l_{2}: y=\\dfrac{1}{m} x\\,\\)\u003c/span>에 동시에 접하는 원의 중심을 \u003cspan class=\"heq\">\\({{A}} \\,\\)\u003c/span>라 하자. 직선 \u003cspan class=\"heq\">\\(l_{1}\\,\\)\u003c/span>과 원의 접점을 \u003cspan class=\"heq\">\\({{P}} \\,\\)\u003c/span>, 직선 \u003cspan class=\"heq\">\\(l_{2}\\,\\)\u003c/span>와 원의 접점을 \u003cspan class=\"heq\">\\({{Q}} \\,\\)\u003c/span>, 직선 \u003cspan class=\"heq\">\\({{PQ}} \\,\\)\u003c/span>가 \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>축과 만나는 점을 \u003cspan class=\"heq\">\\({{R}} \\,\\)\u003c/span>이라 할 때, 세 점 \u003cspan class=\"heq\">\\({{P}} \\,\\)\u003c/span>, \u003cspan class=\"heq\">\\({{Q}} \\,\\)\u003c/span>, \u003cspan class=\"heq\">\\({{R}} \\,\\)\u003c/span>이 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp htall\">(가) \u003cspan class=\"heq\">\\(\\overline{{{PQ}} }= \\overline{{{QR}} }\\,\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">(나) 삼각형 \u003cspan class=\"heq\">\\({{OPQ}} \\,\\)\u003c/span>의 넓이는 \u003cspan class=\"heq\">\\(24\\,\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp class=\"hp\">직선 \u003cspan class=\"heq\">\\(l_{1}\\,\\)\u003c/span>과 직선 \u003cspan class=\"heq\">\\({{AQ}} \\,\\)\u003c/span>의 교점을 \u003cspan class=\"heq\">\\({{B}} \\,\\)\u003c/span>라 할 때, 선분 \u003cspan class=\"heq\">\\({{BQ}} \\,\\)\u003c/span>의 길이는? \u003cbr>(단, 원의 중심 \u003cspan class=\"heq\">\\({{A}} \\,\\)\u003c/span>는 제\u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>사분면 위에 있고, \u003cspan class=\"heq\">\\({{O}} \\,\\)\u003c/span>는 원점이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/b0e7c1c8b65d6479f95ef381.png\" style=\"width:313px;max-width:100%\">\u003c/p>\u003cp class=\"hp htall\">① \u003cspan class=\"heq\">\\(\\dfrac{3}{2} \\sqrt{5}\\,\\)\u003c/span>&emsp;② \u003cspan class=\"heq\">\\(2 \\sqrt{5}\\,\\)\u003c/span>&emsp;③ \u003cspan class=\"heq\">\\(\\dfrac{5}{2} \\sqrt{5}\\,\\)\u003c/span>\u003c/p>\u003cp class=\"hp htall\">④ \u003cspan class=\"heq\">\\(3 \\sqrt{5}\\,\\)\u003c/span>&emsp;⑤ \u003cspan class=\"heq\">\\(\\dfrac{7}{2} \\sqrt{5}\\,\\)\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editio
