( x+t \\right) } \\times \\lim _{ t\\,->\\, 2+}\\, g \\left( x+t \\right)$에 대하여 \u003c보기>에서 옳은 것만을 있는 대로 고른 것은? [4점]\n\u003c보기> ㄱ. $h \\left( 1 \\right) = 3$ㄴ. 함수 $h \\left( x \\right)$는 실수 전체의 집합에서 연속이다.ㄷ. 함수 $g \\left( x \\right)$가 닫힌구간 $\\left[\\,-1, \\, 1 \\,\\right]$에서 감소하고 $g \\left( -1 \\right) = -2$이면 함수 $h \\left( x \\right)$는 실수 전체의 집합에서 최솟값을 갖는다.\n① ㄱ ② ㄴ ③ ㄱ, ㄴ\n④ ㄱ, ㄷ ⑤ ㄴ, ㄷ","sourceHash":"086b002f67833a151a5db3678d28b9f5b3ba0196d5d363faffb1f16078cba9b2","sourceKind":"csat","sourceLabel":"2022년 시행 수능 · 2023학년도 · 공통 · 14번","steps":[{"id":"s1","latex":"i(x)=\\lim_{t\\to0+}g(x+t)=\\begin{cases}f(x)&(-1\\le x\u003c1)\\\\x&(x\u003c-1\\text{ 또는 }x\\ge1)\\end{cases}"},{"id":"s2","latex":"h(x)=i(x)i(x+2)"},{"id":"s3","latex":"h(x)=\\begin{cases}x(x+2)&(x\u003c-3)\\\\x f(x+2)&(-3\\le x\u003c-1)\\\\(x+2)f(x)&(-1\\le x\u003c1)\\\\x(x+2)&(x\\ge1)\\end{cases}"},{"id":"s4","latex":"\\text{ㄱ: }h(1)=1\\cdot3=3\\quad\\text{참}"},{"id":"s5","latex":"\\text{ㄴ: }f(x)=0\\text{이면 }\\lim_{x\\to1-}h(x)=0\\ne h(1)=3\\quad\\text{거짓}"},{"id":"s6","latex":"\\text{ㄷ: }f(x)=-x-3\\text{으로 두면 }[-1,1]\\text{에서 감소하고 }f(-1)=-2"},{"id":"s7","latex":"-1\\le x\u003c1:\\quad h(x)=-(x+2)(x+3),\\quad h\\prime(x)=-2x-5\u003c0"},{"id":"s8","latex":"\\lim_{x\\to1-}h(x)=-12\\text{이지만 이 값은 갖지 않는다.}"},{"id":"s9","latex":"x\u003c-3\\text{ 또는 }x\\ge1:\\ h=x(x+2)>0;\\quad-3\\le x\u003c-1:\\ h=-x(x+5)>0"},{"id":"s10","latex":"\\text{따라서 최솟값이 없다. ㄷ 거짓}\\quad\\boxed{\\text{ㄱ}}\\quad\\text{①}"}],"track":"공통"};</script>
