  <script>window.HandStudyRecord={"itemId":16967,"sourceLabel":"2021 교육청 고3 수학기하 10월 13번","adminYear":2021,"grade":3,"month":10,"number":13,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"실수 전체의 집합에서 정의된 함수 $f(x)$와 역함수가 존재하는 삼차함수 $g(x)=x^{3}+ax^{2}+bx+c$ 가 다음 조건을 만족시킨다.\n모든 실수 $x$ 에 대하여 $2f(x)=g(x)-g(-x)$이다.\n\u003c보기>에서 옳은 것만을 있는 대로 고른 것은? (단, $a$, $b$, $c$ 는 상수이다.) [4점]\n\u003c보 기>ㄱ. $a^{2}≤ 3b$ ㄴ. 방정식 $f'(x)=0$은 서로 다른 두 실근을 갖는다.ㄷ. 방정식 $f'(x)=0$이 실근을 가지면 $g '(1)=1$이다.\n① ㄱ ② ㄱ, ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","answer":"①","sourceHash":"60ba4cbff3d1b9d26bcff40c4ec1b2c2b72e586aacae18a251b106a2e04d3b6e","steps":[{"id":"s1","latex":"g^{-1}\\text{ 존재}\\Rightarrow g'(x)=3x^2+2ax+b\\ge0\\quad(\\forall x)"},{"id":"s2","latex":"(2a)^2-12b\\le0\\Rightarrow b\\ge\\frac{a^2}{3}\\ge0"},{"id":"s3","latex":"2f(x)=g(x)-g(-x)=2x^3+2bx\\Rightarrow f'(x)=3x^2+b"},{"id":"s4","latex":"b\\ge0\\Rightarrow f'(x)=0\\text{은 서로 다른 두 실근을 갖지 않음}"},{"id":"s5","latex":"f'(x)=0\\text{이 실근을 가지면 }b=0\\Rightarrow a=0,\\quad g'(1)=3"},{"id":"s6","latex":"\\therefore\\ \\text{첫째 명제만 참}"}],"diagram":null,"contentHash":"4bf80bfa580c6d11ecf06b541b18200d12f44b7bd59626555669996048b9736f","questionHtml":"\u003cp class=\"hp\">실수 전체의 집합에서 정의된 함수 \u003cspan class=\"heq\">\\(f(x)\\)\u003c/span>와 역함수가 존재하는 삼차함수 \u003cspan class=\"heq\">\\(g(x)=x^{3}+ax^{2}+bx+c\\)\u003c/span> 가 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">모든 실수 \u003cspan class=\"heq\">\\(x\\)\u003c/span> 에 대하여 \u003cspan class=\"heq\">\\(2f(x)=g(x)-g(-x)\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp class=\"hp\">&lt;보기&gt;에서 옳은 것만을 있는 대로 고른 것은? (단, \u003cspan class=\"heq\">\\(a\\)\u003c/span>, \u003cspan class=\"heq\">\\(b\\)\u003c/span>, \u003cspan class=\"heq\">\\(c\\)\u003c/span> 는 상수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003ctable class=\"htbl\">\u003ctr>\u003ctd style=\"width:177px;border-top:none;border-bottom:1px solid #333;border-left:none;border-right:none\">&nbsp;\u003
