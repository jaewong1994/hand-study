  <script>window.HandStudyRecord={"itemId":16363,"sourceLabel":"2019 교육청 고3 수리나형 10월 21번","adminYear":2019,"grade":3,"month":10,"number":21,"track":"수리나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"최고차항의 계수가 $1\\,$인 삼차함수 $f \\left( x \\right) \\,$가 다음 조건을 만족시킨다.\n(가) 방정식 $f \\left( x \\right) \\,$$=0\\,$의 실근은 $\\alpha$, $\\beta\\,$($\\alpha\u003c\\beta\\,$)뿐이다.(나) 함수 $f \\left( x \\right) \\,$의 극솟값은 $-4\\,$이다.\n\u003c보기>에서 옳은 것만을 있는 대로 고른 것은? [4점]\n\u003c 보 기 >ㄱ. $f' \\left( \\alpha \\right)$$=0\\,$ ㄴ. $\\beta \\,$$= \\alpha +3\\,$ ㄷ. $f \\left( 0 \\right)\\,$$=16\\,$이면 $\\alpha ^{\\,2} +\\beta ^{\\,2} =18\\,$이다.\n① ㄱ ② ㄱ, ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","answer":"②","sourceHash":"12a9bbbeb8ea14417574401a2290049921f8a2c33d89bed927454db216560d2d","steps":[{"id":"s1","latex":"f(x)=(x-\\alpha)^2(x-\\beta),\\qquad \\alpha\u003c\\beta"},{"id":"s2","latex":"f\\prime(x)=(x-\\alpha)(3x-\\alpha-2\\beta)\\Rightarrow f\\prime(\\alpha)=0\\quad(\\mathrm I)"},{"id":"s3","latex":"x_{\\min}=\\frac{\\alpha+2\\beta}{3}"},{"id":"s4","latex":"f(x_{\\min})=-\\frac{4(\\beta-\\alpha)^3}{27}=-4\\Rightarrow\\beta-\\alpha=3\\quad(\\mathrm{II})"},{"id":"s5","latex":"f(0)=16\\Rightarrow-\\alpha^2(\\alpha+3)=16"},{"id":"s6","latex":"(\\alpha+4)(\\alpha^2-\\alpha+4)=0\\Rightarrow(\\alpha,\\beta)=(-4,-1)"},{"id":"s7","latex":"\\alpha^2+\\beta^2=17\\ne18\\quad(\\mathrm{III}\\text{ 거짓})"},{"id":"s8","latex":"\\boxed{\\mathrm{I,II}}"}],"diagram":null,"contentHash":"7bb76336aa328c04ec0000523cdaeb4d27ac92de9ddd1304ef807c63eed3fd41","questionHtml":"\u003cp class=\"hp\">최고차항의 계수가 \u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>인 삼차함수 \u003cspan class=\"heq\">\\(f \\left( x \\right) \\,\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가)방정식 \u003cspan class=\"heq\">\\(f \\left( x \\right) \\,\\)\u003c/span>\u003cspan class=\"heq\">\\(=0\\,\\)\u003c/span>의 실근은 \u003cspan class=\"heq\">\\(\\alpha\\)\u003c/span>, \u003cspan class=\"heq\">\\(\\beta\\,\\)\u003c/span>(\u003cspan class=\"heq\">\\(\\alpha\\lt \\beta\\,\\)\u003c/span>)뿐이다.\u003c/p>\u003cp class=\"hp\">(나)함수 \u003cspan class=\"heq\">\\(f \\left( x \\right) \\,\\)\u003c/span>의 극솟값은 \u003cspan class=\"heq\">\\(-4\\,\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp class=\"hp\">&lt;보기&gt;에서 옳은 것만을 있는 대로 고른 것은? \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cdiv class=\"hbox\">\u003cdiv style=\"text-align:center;font-weight:700;margin:0 0 6px\">&lt; 보 기 &gt;\u003c/div>\u003cp class=\"hp\">ㄱ.\u003cspan class=\"heq\">\\(f' \\left( \\alpha \\right)\\)\u003c/span>\u003cspan class=\"heq\">\\(=0\\,\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">ㄴ.\u003cspan class=\"heq\">\\(\\beta \\,\\)\u003c/span>\u003cspan class=\"heq\">\\(= \\alpha +3\\,\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">ㄷ.\u003cspan class=\"heq\">\\(f \\left( 0 \\right)\\,\\)\u003c/span>\u003cspan class=\"heq\">\\(=16\\,\\)\u003c/span>이면 \u003cspan class=\"heq\">\\(\\alpha^{\\,2} +\\beta^{\\,2} =18\\,\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp class=\"hp\">① ㄱ&emsp;② ㄱ, ㄴ&emsp;③ ㄱ, ㄷ\u003c/p>\u003cp class=\"hp\">④ ㄴ, ㄷ&emsp;⑤ ㄱ, ㄴ, ㄷ\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"b68ae186b7427c64d016c91f510d49a2bf9d3db25e25e7d9816167f0db7dd5cc"};</script>
