<script>window.HandStudyRecord={"itemId":8796,"sourceLabel":"2019 교육청 고2 수학나형 11월 30번","adminYear":2019,"grade":2,"month":11,"number":30,"track":"수학나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"좌표평면에서 실수 $m$에 대하여 함수\n $f \\left( x \\right) = {\\begin{cases}\\,x ^{2} +ax+b _{{}_{\\,}} \\,&\\left( x\u003cm \\right) _{\\,} \\\\ \\, \\frac{1}{4} \\left( x-3 \\right) ^{2 ^{{}^{\\,}}}&\\left( x \\geq m \\right)\\end{cases}}$\n의 그래프가 직선 $y=mx$와 만나는 점의 개수를 $g \\left( m \\right)$이라 하자. $m \\leq 0$에서 함수 $g \\left( m \\right)$이 연속이 되도록 하는 상수 $a$, $b$에 대하여 $a+b$의 값을 구하시오. [4점]","answer":"48","sourceHash":"23ff5c8eefccc9b03b28d4d97492c256d1a3a52ec5824ba7de54b9225f3ce96b","steps":[{"id":"s1","latex":"P_m(x)=x^2+(a-m)x+b\\ (x\u003cm),\\qquad Q_m(x)=x^2-(6+4m)x+9\\ (x\\ge m)"},{"id":"s2","latex":"N_Q(m)=\\begin{cases}1&m\\le-3\\\\0&-3\u003cm\u003c0\\\\1&m=0\\end{cases}"},{"id":"s3","latex":"m=0\\text{에서 }N_P\\text{가 }1\\text{ 감소}\\Rightarrow a^2-4b=0,\\quad a>0"},{"id":"s4","latex":"m=-3\\text{에서 근이 경계 }x=m\\text{을 통과}\\Rightarrow P_{-3}(-3)=b-3a=0"},{"id":"s5","latex":"b=\\frac{a^2}{4}=3a,\\ a>0\\Rightarrow(a,b)=(12,36)"},{"id":"s6","latex":"(N_P,N_Q)=\\begin{cases}(1,1)&m\\le-3\\\\(2,0)&-3\u003cm\u003c0\\\\(1,1)&m=0\\end{cases}\\Rightarrow g(m)=2"},{"id":"s7","latex":"a+b=48"}],"diagram":null,"contentHash":"b40da2340dc8ebd36cd233f87205f859b042b2b9ba1ff4cb4fadc51c29a20b46","questionHtml":"\u003cp class=\"hp\">좌표평면에서 실수 \u003cspan class=\"heq\">\\(m\\)\u003c/span>에 대하여 함수\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\(f \\left( x \\right) = {\\begin{cases}\\,x^{2} +ax+b \\,&\\left( x\\lt m \\right) \\\\ \\, \\dfrac{1}{4} \\left( x-3 \\right)^{2 }&\\left( x \\geq m \\right)\\end{cases}}\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">의 그래프가 직선 \u003cspan class=\"heq\">\\(y=mx\\)\u003c/span>와 만나는 점의 개수를 \u003cspan class=\"heq\">\\(g \\left( m \\right)\\)\u003c/span>이라 하자. \u003cspan class=\"heq\">\\(m \\leq 0\\)\u003c/span>에서 함수 \u003cspan class=\"heq\">\\(g \\left( m \\right)\\)\u003c/span>이 연속이 되도록 하는 상수 \u003cspan class=\"heq\">\\(a\\)\u003c/span>, \u003cspan class=\"heq\">\\(b\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(a+b\\)\u003c/span>의 값을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"0d0fe0a53e869b8094d30c5c24b251f8a45b4de117d1b28bc7ff1a8eb46e1eb4"};</script>
<script>window.HandStudyGuide={"itemId":8796,"sourceHash":"23ff5c8eefccc9b03b28d4d97492c256d1a3a52ec5824ba7de54b9225f3ce96b","contentHash":"b40da2340dc8ebd36cd233f87205f859b042b2b9ba1ff4cb4fadc51c29a20b46","overview":{"goal":"두 조각에서 직선과 만나는 점을 따로 세고, \\(m=-3,0\\)에서 개수 변화가 서로 보상되도록 \\(a,b\\)를 정해요.","firstLook":"교점은 각 조각에서 \\(f(x)=mx\\)를 푼 뒤 그 근이 해당 조각의 범위에 들어가는지 확인해야 해요. 교점 개수는 정수이므로 \\(m\\le0\\)에서 연속이면 일정해요.","conditions":[{"label":"왼쪽 조각","meaning":"\\(P_m(x)=0\\)의 근 중 \\(x<m\\)인 것만 세어요."},{"label":"오른쪽 조각","meaning":"\\(Q_m(x)=0\\)의 근 중 \\(x\\ge m\\)인 것만 세어요."},{"label":"연속 조건","meaning":"정수값을 갖는 \\(g(m)\\)은 연결된 구간 \\(m\\le0\\)에서 같은 값을 유지해야 해요."}]},"chapters":[{"id":"c1","label":"두 이차방정식으로 나눠요","stepIds":["s1","s2"],"question":"오른쪽 조각의 교점 수가 바뀌는 \\(m\\)은 왜 \\(-3\\)과 \\(0\\)일까요?","hint":"\\(Q_m\\)의 판별식과 경계 \\(x=m\\)을 함께 봐요.","explanation":"왼쪽에서는 \\(x^2+ax+b=mx\\)이므로 \\(P_m(x)=x^2+(a-m)x+b\\)이고 \\(x<m\\)인 근만 세요. 오른쪽에서는 \\((x-3)^2/4=mx\\)이므로\n\n\\(Q_m(x)=x^2-(6+4m)x+9\\)\n\n이고 \\(x\\ge m\\)인 근만 세요. \\(Q_m\\)의 판별식은 \\(16m(m+3)\\)이에요. 그래서 \\(m<-3\\)에서는 서로 다른 두 실근 중 경계 오른쪽의 한 근만 남고, \\(m=-3\\)에서는 경계 \\(x=-3\\)에서 한 근, \\(-3<m<0\\)에서는 실근이 없어요. \\(m=0\\)에서는 \\(Q_0(x)=(x-3)^2\\)이라 한 교점이 생겨요. 따라서 오른쪽 교점 수는 \\(1,0,1\\)로 바뀌어요.","check":{"prompt":"\\(m=0\\)일 때 오른쪽 조각의 교점은 어디인가요?","answer":"\\(Q_0(x)=(x-3)^2=0\\)에서 \\(x=3\\)이고, \\(3\\ge0\\)이므로 한 교점이에요."}},{"id":"c2","label":"영에서 줄어드는 한 점을 맞춰요","stepIds":["s3"],"question":"\\(m=0\\)에서 오른쪽 교점이 하나 늘 때 왼쪽 교점은 어떻게 변해야 할까요?","hint":"전체 개수가 일정하려면 왼쪽에서는 두 근이 한 근으로 합쳐져야 해요.","explanation":"\\(m<0\\)에서 \\(0\\)에 가까워질 때 오른쪽 교점은 \\(0\\)개지만 \\(m=0\\)에서는 \\(1\\)개예요. 전체 교점 수가 같으려면 왼쪽 교점 수는 하나 줄어야 해요. \\(P_0(x)=x^2+ax+b\\)의 서로 다른 두 근이 \\(m=0\\)에서 한 근으로 합쳐져야 하므로 판별식이 \\(a^2-4b=0\\)이에요. 합쳐진 근 \\(-a/2\\)가 왼쪽 범위 \\(x<0\\)에 들어가야 하므로 \\(a>0\\)도 필요해요.","check":{"prompt":"\\(a<0\\)이면 판별식이 \\(0\\)이어도 왜 안 되나요?","answer":"합쳐진 근 \\(-a/2\\)가 양수가 되어 \\(x<0\\)인 왼쪽 조각의 교점으로 세어지지 않기 때문이에요."}},{"id":"c3","label":"마이너스 삼에서 늘어나는 한 점을 맞춰요","stepIds":["s4","s5"],"question":"\\(m=-3\\)을 지날 때 왼쪽 교점 수가 바뀌려면 어떤 근이 경계를 지나야 할까요?","hint":"경계는 \\(x=m\\)이므로 \\(P_{-3}(-3)=0\\)을 써요.","explanation":"\\(m=-3\\)에서 오른쪽 교점이 사라지는 변화를 왼쪽 교점 하나가 보상해야 해요. 왼쪽에서 세는 범위가 \\(x<m\\)이므로 근 하나가 경계 \\(x=m\\)을 통과해야 하고, 따라서 \\(P_{-3}(-3)=0\\)이에요. 실제로\n\n\\(P_{-3}(-3)=9+(a+3)(-3)+b=b-3a\\)\n\n이므로 \\(b=3a\\)예요. 앞의 \\(b=a^2/4\\)와 함께 쓰면 \\(a^2/4=3a\\)이고 \\(a>0\\)이므로 \\(a=12\\), \\(b=36\\)이에요.","check":{"prompt":"\\(a^2/4=3a\\)의 해 중 \\(a=0\\)을 제외하는 이유는 무엇인가요?","answer":"\\(m=0\\)에서 합쳐진 근이 왼쪽 범위에 들어가려면 \\(a>0\\)이어야 하기 때문이에요."}},{"id":"c4","label":"세 구간에서 개수를 다시 세어요","stepIds":["s6","s7"],"question":"구한 \\(a,b\\)가 실제로 모든 \\(m\\le0\\)에서 같은 교점 수를 만들까요?","hint":"경계 \\(-3,0\\)을 포함해 왼쪽과 오른쪽 개수를 쌍으로 확인해요.","explanation":"\\(a=12,b=36\\)일 때 왼쪽과 오른쪽 교점 수는 \\(m\\le-3\\)에서 각각 \\(1,1\\), \\(-3<m<0\\)에서 \\(2,0\\), \\(m=0\\)에서 \\(1,1\\)이에요. 어느 경우나 합은 \\(2\\)이므로 \\(g(m)=2\\)로 일정해 연속이에요. 따라서 \\(a+b=12+36=48\\)이에요.","check":{"prompt":"\\(m=-3\\)과 \\(m=0\\)도 빠뜨리지 않고 센 전체 교점 수는 얼마인가요?","answer":"두 경계에서도 왼쪽 한 점과 오른쪽 한 점으로 모두 \\(2\\)개예요."}}],"takeaway":["조각함수의 교점은 방정식의 근을 구한 뒤 각 조각의 범위 조건으로 다시 걸러요.","교점 수처럼 정수인 함수가 한 구간에서 연속이면 그 값은 일정해요.","매개변수에 따라 근의 개수가 바뀔 때 판별식이 \\(0\\)인 순간과 근이 조각의 경계를 지나는 순간을 확인해요."]};</script>
