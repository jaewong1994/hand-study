<script>window.HandStudyGuide={"itemId":17752,"sourceHash":"210ba7b1c39094742a0e107d0f4f13f86bed28b6e78ecad448b69c36281bcc8a","contentHash":"975d1ccfc8f565c1eaf85da0165a86b8fd72d018a2dd2c3af2945876cdc2ee4a","overview":{"goal":"직선 방향으로 타원을 평행이동해 생기는 띠를 구하고, 제1사분면과 겹치는 삼각형의 넓이를 계산해요.","firstLook":"\\(P\\)를 더하면 \\(Q\\)를 기울기 \\(-2\\)인 직선 방향으로 움직이는 셈이에요. 그래서 \\(2x+y\\)의 값만 타원이 정한 범위에 남아요.","conditions":[{"label":"직선 위의 점","meaning":"\\(2x+y=0\\) 방향으로 자유롭게 이동시켜요."},{"label":"타원 위의 점","meaning":"타원 위에서 \\(2x+y\\)의 최솟값과 최댓값을 정해요."},{"label":"두 벡터를 더한 점","meaning":"두 좌표가 모두 \\(0\\) 이상인 부분만 남겨요."}]},"chapters":[{"id":"c1","label":"이동해도 남는 값을 찾아요","stepIds":["s1"],"question":"왜 \\(2x+y\\)는 P를 더해도 바뀌지 않나요?","hint":"\\(P=(t,-2t)\\)를 대입하세요.","explanation":"\\(P=(t,-2t)\\), \\(Q=(x_1,y_1)\\)이면 \\(X=(t+x_1,-2t+y_1)\\)예요. 따라서 \\(2x+y=2x_1+y_1\\)로 \\(P\\)의 매개변수 \\(t\\)가 소거돼요. 즉 가능한 \\(X\\)는 타원 위의 \\(Q\\)가 만드는 \\(2x_1+y_1\\)의 범위에 해당하는 평행한 띠예요.","check":{"prompt":"P의 이동 방향과 띠의 경계선은 어떤 관계인가요?","answer":"P는 경계선 \\(2x+y=상수\\)와 평행한 방향으로 움직여요."}},{"id":"c2","label":"타원에 평행한 두 접선을 그어요","stepIds":["s2","s3"],"question":"\\(2x+y\\)의 양끝은 어떻게 구하나요?","hint":"기울기 \\(-2\\)인 직선 \\(y=-2x+c\\)가 타원에 접하는 조건을 쓰세요.","explanation":"직선을 타원에 대입하면 \\(2x^2+(-2x+c)^2=3\\)이에요. 이 이차방정식이 중근을 갖는 조건을 적용하면 \\(c=\\pm3\\)이에요. 따라서 타원 위에서 \\(-3\\le2x+y\\le3\\)이고, 점 \\(X\\)가 나타내는 전체 영역은 두 평행선 사이의 띠예요.","check":{"prompt":"경계선도 영역에 포함되나요?","answer":"접점에 해당하는 Q가 실제 타원 위에 있으므로 두 경계선도 포함돼요."}},{"id":"c3","label":"제1사분면의 삼각형을 구해요","stepIds":["s4","s5"],"question":"두 좌표가 음이 아닌 부분에서 어느 부등식만 남나요?","hint":"\\(x,y\\ge0\\)이면 \\(2x+y\\ge0\\)이에요.","explanation":"제1사분면에서는 아래 경계 \\(-3\\le2x+y\\)가 자동으로 성립하고 \\(2x+y\\le3\\)만 남아요. 좌표축과 직선의 교점은 \\((3/2,0)\\), \\((0,3)\\)이므로 영역은 이 두 점과 원점을 꼭짓점으로 하는 삼각형이에요. 넓이는 \\(\\frac12\\times\\frac32\\times3=9/4\\)이고 \\(p+q=4+9=13\\)이에요.","check":{"prompt":"아래쪽 접선 \\(2x+y=-3\\)이 넓이에 영향을 주지 않는 이유는 무엇인가요?","answer":"제1사분면에서는 \\(2x+y\\ge0\\)라서 항상 \\(-3\\) 이상이기 때문이에요."}}],"takeaway":["한 직선 방향의 평행이동에서는 그 직선에 수직인 일차식의 값이 보존돼요.","타원에서 일차식의 범위는 평행한 접선 두 개로 구해요.","사분면 조건을 적용한 뒤 실제로 남는 경계만 사용해요."]};</script>
