<script>window.HandStudyGuide={"itemId":17100,"sourceHash":"e03f07d60f497394623184de7815f775d1e1bf7e5a1a9f66092213c76f55ee2a","contentHash":"d508a0c22459df4ff3ca2b0aa11a4fd6172c1993c63c952eb2778dea6e8b0cc8","overview":{"goal":"등변삼각형에서 각의 관계를 만든 뒤 주어진 \\(\\cos^2\\alpha\\)로 \\(2\\alpha\\)의 삼각비를 구해 \\(\\tan\\beta\\)를 계산해요.","firstLook":"\\(BD=CD\\)이므로 삼각형 \\(BCD\\)의 두 밑각이 같아요. \\(A,D,B\\)가 한 직선 위라는 사실과 합치면 \\(\\beta\\)를 \\(\\alpha\\)로 나타낼 수 있어요.","conditions":[{"label":"두 변의 길이가 같은 작은 삼각형","meaning":"\\(\\angle DBC=\\angle DCB=\\alpha\\)이고 꼭짓점의 외각을 구해요."},{"label":"큰 삼각형의 둔각","meaning":"삼각형 \\(ACD\\)의 내각 합으로 \\(\\beta=\\pi/3-2\\alpha\\)를 얻어요."}]},"chapters":[{"id":"c1","label":"도형에서 각 관계 만들기","stepIds":["s1","s2"],"question":"삼각형 \\(BCD\\)의 꼭짓점 각과 그 옆의 \\(\\angle ADC\\)는 각각 얼마인가요?","hint":"등변삼각형의 내각 합과 일직선의 각을 차례로 쓰세요.","explanation":"\\(BD=CD\\)이므로 \\(\\angle DBC=\\angle DCB=\\alpha\\)예요. 따라서 \\(\\angle BDC=\\pi-2\\alpha\\)이고 \\(A,D,B\\)가 한 직선 위이므로 \\(\\angle ADC=2\\alpha\\)예요. 삼각형 \\(ACD\\)에서 \\(\\angle CAD=2\\pi/3\\)이므로 \\(2\\pi/3+2\\alpha+\\beta=\\pi\\), 즉 \\(\\beta=\\pi/3-2\\alpha\\)예요.","check":{"prompt":"\\(\\angle ADC\\)가 \\(\\pi-2\\alpha\\)가 아니라 \\(2\\alpha\\)인 이유는 무엇인가요?","answer":"\\(\\pi-2\\alpha\\)는 \\(\\angle BDC\\)이고, \\(\\angle ADC\\)는 그 각과 일직선을 이루는 이웃각이에요."}},{"id":"c2","label":"두 배 각의 삼각비 구하기","stepIds":["s3","s4"],"question":"주어진 \\(\\cos^2\\alpha\\)에서 \\(\\cos2\\alpha\\)와 \\(\\sin2\\alpha\\)는 어떻게 구할까요?","hint":"\\(\\cos2\\alpha=2\\cos^2\\alpha-1\\)을 쓰고 각의 범위로 사인의 부호를 정하세요.","explanation":"\\(\\cos2\\alpha=2\\cos^2\\alpha-1=\\sqrt{21}/7\\)이에요. 또 \\(\\beta>0\\)이므로 \\(0<2\\alpha<\\pi/3\\), 따라서 \\(\\sin2\\alpha>0\\)이에요. \\(\\sin^22\\alpha=1-21/49=28/49\\)이므로 \\(\\sin2\\alpha=2\\sqrt7/7\\)이에요. 따라서 \\(\\tan2\\alpha=(2\\sqrt7/7)/(\\sqrt{21}/7)=2/\\sqrt3\\)예요.","check":{"prompt":"\\(\\sin2\\alpha\\)의 음의 값을 버리는 근거는 무엇인가요?","answer":"\\(\\beta=\\pi/3-2\\alpha>0\\)이어서 \\(0<2\\alpha<\\pi/3\\)이므로 사인이 양수예요."}},{"id":"c3","label":"차각의 탄젠트 계산하기","stepIds":["s5","s6"],"question":"\\(\\tan(\\pi/3-2\\alpha)\\)의 분자와 분모는 각각 무엇이 되나요?","hint":"탄젠트의 차 공식에 \\(\\sqrt3\\)과 \\(2/\\sqrt3\\)을 넣으세요.","explanation":"\\(\\tan\\beta=\\frac{\\sqrt3-2/\\sqrt3}{1+\\sqrt3(2/\\sqrt3)}=\\frac{1/\\sqrt3}{3}=\\frac1{3\\sqrt3}\\)예요. 분모는 3이라 0이 아니에요. 따라서 \\(54\\sqrt3\\tan\\beta=54\\sqrt3\\cdot\\frac1{3\\sqrt3}=18\\)이에요.","check":{"prompt":"차 공식의 분모에서 \\(\\sqrt3\\cdot2/\\sqrt3\\)은 얼마인가요?","answer":"2이므로 전체 분모는 \\(1+2=3\\)이에요."}}],"takeaway":["등변삼각형과 일직선의 이웃각을 차례로 써서 큰 삼각형의 각을 정리해요.","\\(\\cos^2\\)에서 두 배 각을 구할 때 사인의 부호는 도형의 각 범위로 결정해요.","탄젠트 차 공식은 분모가 0이 아닌지도 함께 확인해요."]};</script>
