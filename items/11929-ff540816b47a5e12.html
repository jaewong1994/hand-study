(x \\right)=t\\)\u003c/span>, \u003cspan class=\"heq\">\\(x\\)\u003c/span>는 실수\u003cspan class=\"heq\">\\(\\}\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">의 모든 원소의 합을 \u003cspan class=\"heq\">\\(h(t)\\)\u003c/span>라 하자. 함수 \u003cspan class=\"heq\">\\(h(t)\\)\u003c/span>의 치역의 모든 원소의 합이 \u003cspan class=\"heq\">\\(19\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(m\\)\u003c/span>의 값을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"ff540816b47a5e122c3c2830f942667a8e11d8b52c228b9e784891ea0ee9930d"};</script>
<script>window.HandStudyGuide={"itemId":11929,"sourceHash":"1bba8b7bb331ebaff08f1c6777cc412867d96dee8891a5585c05f68bf4a4ffa8","contentHash":"03579f7a641d8c7967e43d0047253103aa1747b55ce232384de93adf9aed7916","overview":{"goal":"두 이차방정식의 실근을 합친 집합에서 공통근을 한 번만 세어 \\(h(t)\\)의 치역을 구해요.","firstLook":"\\(t>-1\\)이면 \\(f(x)=t\\)는 항상 서로 다른 두 실근을 갖고 그 합은 \\(-2\\)예요. \\(g(x)=t\\)의 실근 개수는 \\(t\\)와 꼭짓점의 높이 \\(m\\)의 크기에 따라 달라져요.","conditions":[{"label":"집합의 원소","meaning":"두 방정식에 같은 실근이 생겨도 집합에서는 그 값을 한 번만 더해요."},{"label":"양수 m","meaning":"\\(t=m\\), 공통점의 높이, 그 밖의 높이에서 생기는 네 치역 값이 서로 달라요."}]},"chapters":[{"id":"c1","label":"각 방정식의 근 개수와 합을 구해요","stepIds":["s1","s2"],"question":"\\(t\\)의 범위에 따라 두 방정식의 실근은 어떻게 달라지나요?","hint":"\\(f(x)=(x+1)^2-1\\), \\(g(x)=(x-m)^2+m\\)의 꼭짓점 높이를 비교해요.","explanation":"\\(f(x)=t\\)는 \\((x+1)^2=t+1\\)이고 \\(t>-1\\)이므로 서로 다른 두 실근을 가져요. 두 근의 합은 근과 계수의 관계로 \\(-2\\)예요. \\(g(x)=t\\)는 \\((x-m)^2=t-m\\)이므로 \\(t<m\\)에서는 실근이 없고, \\(t=m\\)에서는 \\(x=m\\) 한 개, \\(t>m\\)에서는 서로 다른 두 실근을 가져요. 마지막 경우 두 근의 합은 \\(2m\\)이에요.","check":{"prompt":"\\(t=m\\)일 때 \\(g(x)=t\\)의 실근과 그 합은 무엇인가요?","answer":"실근은 \\(x=m\\) 하나이고, 집합에 더하는 값도 \\(m\\)이에요."}},{"id":"c2","label":"공통근이 생기는 높이를 따로 처리해요","stepIds":["s3","s4","s5"],"question":"두 방정식의 공통근은 언제 생기고, \\(h(t)\\)에서 무엇을 한 번 빼야 하나요?","hint":"\\(f(x)=g(x)\\)를 풀어 공통점의 \\(x\\)좌표와 높이를 구해요.","explanation":"\\(f(x)=g(x)\\)를 풀면 두 이차항이 없어져 \\(x=m/2\\)이고, 그때의 높이는 \\(t_0=m^2/4+m\\)이에요. \\(m>0\\)이므로 \\(t_0>m\\)이에요. 이제 \\(-1<t<m\\)에서는 \\(f\\)의 두 근만 있어 \\(h(t)=-2\\)예요. \\(t=m\\)에서는 여기에 \\(g\\)의 한 근 \\(m\\)을 더해 \\(h(t)=m-2\\)예요. \\(t>m\\), \\(t\\ne t_0\\)에서는 두 방정식의 네 근이 서로 달라 합이 \\(-2+2m=2m-2\\)예요. \\(t=t_0\\)에서는 공통근 \\(m/2\\)가 두 근의 합에 각각 들어 있지만 집합에서는 한 번만 세므로 한 번 빼서 \\(h(t)=2m-2-m/2=3m/2-2\\)예요.","check":{"prompt":"공통근 \\(m/2\\)를 한 번 빼는 이유는 무엇인가요?","answer":"두 방정식의 근의 합을 더하면 같은 실수 \\(m/2\\)를 두 번 세지만, 문제의 대상은 집합이라 중복 원소를 한 번만 세기 때문이에요."}},{"id":"c3","label":"치역의 네 값을 더해요","stepIds":["s6","s7"],"question":"네 값이 서로 겹치지 않는 이유와 \\(m\\)의 값은 무엇인가요?","hint":"세 값 \\(m-2\\), \\(3m/2-2\\), \\(2m-2\\)는 \\(m>0\\)에서 순서대로 커지고 모두 \\(-2\\)보다 커요.","explanation":"\\(m>0\\)이므로 \\(-2<m-2<3m/2-2<2m-2\\)예요. 따라서 치역의 네 원소는 정확히 \\(-2,m-2,3m/2-2,2m-2\\)이고 중복 없이 모두 더해야 해요. 합은 \\(-8+9m/2\\)이고 이것이 \\(19\\)이므로 \\(m=6\\)이에요. 실제 치역은 \\(\\{-2,4,7,10\\}\\)이고 합은 \\(19\\)예요.","check":{"prompt":"\\(m=6\\)일 때 공통근이 생기는 높이는 얼마인가요?","answer":"\\(t_0=6^2/4+6=15\\)이고, 이때 \\(h(t_0)=7\\)이에요."}}],"takeaway":["방정식 두 개의 해집합을 합칠 때 공통근은 한 번만 세어요.","접하는 높이와 두 그래프가 만나는 높이는 서로 다른 경계이므로 따로 처리해요.","치역의 원소를 더하기 전에는 매개변수 조건에서 값들이 실제로 서로 다른지 확인해요."]};</script>
