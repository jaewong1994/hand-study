<script>window.HandStudyGuide={"itemId":18245,"sourceHash":"497bdc063b94d6ca492994b2d897a457c4d3351d53bd2e541961aacf9670f548","contentHash":"3b0d8bd2f13bebd27e295156cf8875f072305c67471f03e49b3a1400cb652cf3","overview":{"goal":"점화식을 함수의 반복으로 보고 \\(a_3=a_5\\)가 되는 값부터 찾은 뒤 \\(a_1\\)로 거슬러 올라가요.","firstLook":"\\(a_{n+1}=F(a_n)\\)로 쓰면 조건은 \\(F(F(a_3))=a_3\\)이에요. \\(F(a_3)\\)의 부호가 바뀌는 경계까지 나누어야 해요.","conditions":[{"label":"(가)","meaning":"처음 두 항은 같은 부호이고 둘 다 \\(0\\)이 아니어야 해요."},{"label":"(나)","meaning":"입력이 \\(0\\) 이하인지 양수인지에 따라 다음 항을 계산하는 식이 달라져요."}]},"chapters":[{"id":"c1","label":"두 번 적용한 뒤 돌아오는 값을 찾아요","stepIds":["s1","s1b","s1c","s2"],"question":"\\(F(F(t))=t\\)를 풀 때 왜 \\(t=0\\), \\(3/2\\)도 경계로 따로 봐야 할까요?","hint":"첫 적용 결과 \\(F(t)\\)의 부호에 따라 둘째 적용 식이 달라져요.","explanation":"\\(F(x)=x^2\\) for \\(x\\le0\\), \\(F(x)=-2x+3\\) for \\(x>0\\)으로 두어요. \\(t<0\\)이면 \\(F(t)=t^2>0\\)이라 \\(F(F(t))=-2t^2+3=t\\)에서 음수 해 \\(t=-3/2\\)를 얻어요. \\(t=0\\)은 직접 넣어 그대로 돌아와요. \\(0<t<3/2\\)이면 \\(F(t)>0\\)이라 \\(F(F(t))=4t-3=t\\)에서 \\(t=1\\)이에요. \\(t\\ge3/2\\)이면 \\(F(t)\\le0\\)이라 \\((3-2t)^2=t\\)이고, 두 근 \\(1,9/4\\) 중 범위에 맞는 \\(9/4\\)만 남아요. 따라서 \\(a_3\\)은 \\(-3/2,0,1,9/4\\) 중 하나예요.","check":{"prompt":"\\((3-2t)^2=t\\)의 두 근 중 \\(1\\)을 버리는 이유는 무엇인가요?","answer":"이 식은 \\(t\\ge3/2\\)인 갈래에서 세웠는데 \\(1\\)은 그 범위에 들어가지 않기 때문이에요."}},{"id":"c2","label":"처음 두 항의 부호로 범위를 정해요","stepIds":["s3","s4"],"question":"\\(a_1a_2>0\\)은 왜 \\(0<a_1<3/2\\)를 뜻할까요?","hint":"\\(a_1\\le0\\)과 \\(a_1>0\\)을 나누어 \\(a_2\\)의 부호를 보세요.","explanation":"\\(a_1<0\\)이면 \\(a_2=a_1^2>0\\)이라 곱이 음수이고, \\(a_1=0\\)이면 곱이 \\(0\\)이라 모두 불가능해요. 따라서 \\(a_1>0\\)이고 \\(a_2=-2a_1+3\\)도 양수여야 하므로 \\(0<a_1<3/2\\)예요. 이 범위에서는 \\(a_2>0\\)이므로 \\(a_3=-2a_2+3=4a_1-3\\)이에요.","check":{"prompt":"\\(a_1<0\\)에서 두 항의 곱이 양수가 될 수 없는 이유는 무엇인가요?","answer":"\\(a_2=a_1^2>0\\)이어서 음수인 \\(a_1\\)과의 곱이 음수가 되기 때문이에요."}},{"id":"c3","label":"네 값을 처음 항으로 되돌려요","stepIds":["s5","s6","s7"],"question":"네 \\(a_3\\) 후보는 각각 어떤 \\(a_1\\)을 줄까요?","hint":"\\(4a_1-3=a_3\\)을 후보마다 풀어요.","explanation":"\\(a_3=-3/2,0,1,9/4\\)를 \\(a_3=4a_1-3\\)에 넣으면 \\(a_1=3/8,3/4,1,21/16\\)이에요. 네 값은 모두 \\(0<a_1<3/2\\)라 (가)를 만족해요. 합은 \\(3/8+3/4+1+21/16=55/16\\)이고, \\(p+q=16+55=71\\)이에요.","check":{"prompt":"얻은 네 \\(a_1\\)을 다시 검사할 공통 범위는 무엇인가요?","answer":"모두 \\(0<a_1<3/2\\)인지 확인하면 \\(a_1\\)과 \\(a_2\\)가 같은 양의 부호임을 보장해요."}}],"takeaway":["조각 점화식을 두 번 적용할 때는 첫 결과의 부호가 바뀌는 경계까지 나눠요.","후보 해는 그 해를 만든 갈래의 범위에 다시 넣어 걸러요.","뒤 항의 후보를 찾은 뒤 처음 조건으로 거슬러 올라가 모든 후보를 재검사해요."]};</script>
