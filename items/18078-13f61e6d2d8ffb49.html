  <script>window.HandStudyRecord={"adminYear":2024,"answer":"55","contentHash":"24fe15046b40ad6632fa72c0142a3bf2ed97e3cdd7ce282b7e6ed8288f090498","diagram":null,"editionHash":"13f61e6d2d8ffb49b07794f76f2217ff353a5d6ef90555577812d237f7ef06ac","grade":3,"graphHash":"","graphPlan":null,"itemId":18078,"learningHash":"cd5eaa6afb88f47c272d81bcf2c22bba8c81fcf86b1aacd29eeb8000f4399951","month":6,"number":29,"points":4,"preview":false,"questionHtml":"\u003cp class=\"hp\">함수\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\(f \\left(x \\right)= \\dfrac{1}{3} x^{3} -x^{2} + \\ln\\, \\left( 1+x^{2} \\right) +a\\)\u003c/span> (\u003cspan class=\"heq\">\\(a\\)\u003c/span>는 상수\u003cspan class=\"heq\">\\()\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">와 두 양수 \u003cspan class=\"heq\">\\(b\\)\u003c/span>, \u003cspan class=\"heq\">\\(c\\)\u003c/span>에 대하여 함수\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\(g \\left( x \\right) = {\\begin{cases}\\,f \\left( x \\right)&&\\left( x \\geq b \\right) \\\\ \\,-f \\left( x-c \\right)&&\\left( x\\lt b \\right)\\end{cases}}\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">는 실수 전체의 집합에서 미분가능하다. \u003cspan class=\"heq\">\\(a+b+c=p+q \\ln\\, 2\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(30(p+q)\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(p\\)\u003c/span>, \u003cspan class=\"heq\">\\(q\\)\u003c/span>는 유리수이고, \u003cspan class=\"heq\">\\(\\ln 2\\)\u003c/span>는 무리수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","questionText":"함수 \n $f \\left(x \\right)= \\frac{1}{3} x ^{3} -x ^{2} + \\ln\\, \\left( 1+x ^{2} \\right) +a$ ($a$는 상수$)$\n와 두 양수 $b$, $c$에 대하여 함수\n $g \\left( x \\right) = {\\begin{cases}\\,f \\left( x \\right)&&\\left( x \\geq b \\right) \\\\ \\,-f \\left( x-c \\right)&&\\left( x\u003cb \\right)\\end{cases}}$\n는 실수 전체의 집합에서 미분가능하다. $a+b+c=p+q \\ln\\, 2$일 때, $30(p+q)$의 값을 구하시오. (단, $p$, $q$는 유리수이고, $\\ln 2$는 무리수이다.) [4점]","scoreStatus":"confirmed_4_direct","sourceHash":"1a69abbbab23f1dde8cf6f586309dbb8e99257d9f7146faed8e15dd32915efe6","sourceLabel":"2024 평가원 고3 수학미적분 6월 29번","stepExplanations":{"s3":{"body":"\\(f^{\\prime}(x)=\\frac{x^2(x-1)^2}{1+x^2}\\)에서 분모는 양수이고 분자는 제곱들의 곱이에요. 따라서 모든 \\(x\\)에서 \\(f^{\\prime}(x)\\ge0\\)예요. 미분가능 조건 \\(-f^{\\prime}(b-c)=f^{\\prime}(b)\\)를 옮기면 두 음이 아닌 수의 합이 0이므로 둘 다 0이어야 해요. 도함수가 0이 되는 값은 0과 1뿐이에요.","skillTags":["reasoning.casework","algebra.calculation"],"title":"0 이상인 두 수의 합이 0이면 둘 다 0이에요"},"s4":{"body":"\\(f^{\\prime}(b)=0\\)에서 \\(b\\)는 0 또는 1인데, \\(b>0\\)이므로 \\(b=1\\)이에요. 또 \\(b-c\\)도 0 또는 1이고 \\(c>0\\)이므로 \\(b-c\u003cb=1\\)이에요. 따라서 \\(b-c=0\\), \\(c=1\\)로 정해져요.","skillTags":["reasoning.casework"],"title":"양수 조건으로 후보를 한 쌍만 남겨요"},"s6":{"body":"미분가능하면 연속이므로 접합점에서 \\(-f(0)=f(1)\\)이어야 해요. \\(f(0)=a\\), \\(f(1)=\\frac{1}{3}-1+\\ln2+a=-\\frac{2}{3}+\\ln2+a\\)를 넣으면 \\(2a=\\frac{2}{3}-\\ln2\\)예요. 이 값과 \\(b=c=1\\)에서는 양쪽 함숫값이 같고 양쪽 미분계수도 0이어서 미분가능 조건을 모두 만족해요.","skillTags":["calculus.derivative","algebra.calculation"],"title":"미분계수만 맞추지 말고 함숫값도 맞춰요"}},"steps":[{"id":"s1","latex":"f'(x)=x^2-2x+\\dfrac{2x}{1+x^2}=\\dfrac{x^2(x-1)^2}{1+x^2}\\ge0"},{"id":"s2","latex":"g'(b-0)=-f'(b-c),\\qquad g'(b+0)=f'(b)"},{"id":"s3","latex":"f'(b)=-f'(b-c)\\Rightarrow f'(b)=f'(b-c)=0"},{"id":"s4","latex":"b>0,\\ c>0\\Rightarrow b=1,\\quad b-c=0,\\quad c=1"},{"id":"s5","latex":"g(b-0)=g(b+0)\\Rightarrow -f(0)=f(1)"},{"id":"s6","latex":"-a=-\\dfrac23+\\ln2+a\\Rightarrow a=\\dfrac13-\\dfrac12\\ln2"},{"id":"s7","latex":"a+b+c=\\dfrac73-\\dfrac12\\ln2\\Rightarrow30(p+q)=55"}],"track":"미적분"};</script>
