<script>window.HandStudyRecord={"itemId":17093,"sourceLabel":"2021 교육청 고3 수학미적분 4월 22번","adminYear":2021,"grade":3,"month":4,"number":22,"track":"미적분","points":4,"scoreStatus":"confirmed_4_direct","questionText":"실수 $a$에 대하여 두 함수 $f \\left( x \\right)$, $g \\left( x \\right)$를\n $f \\left( x \\right)=3x+a$, $g \\left( x \\right)= \\int _{2} ^{x} {} \\left( t+a \\right) f \\left( t \\right) dt$\n라 하자. 함수 $h \\left( x \\right)=f \\left( x \\right) g \\left( x \\right)$가 다음 조건을 만족시킬 때, $h \\left( -1 \\right)$의 최솟값은 $\\frac{q}{p}$이다. $p+q$의 값을 구하시오. (단, $p$와 $q$는 서로소인 자연수이다.) [4점]\n(가) 곡선 $y=h \\left( x \\right)$ 위의 어떤 점에서의 접선이 $x$축이다.\n(나) 곡선 $y= \\left| h \\left( x \\right) \\right|$가 $x$축과 평행한 직선과 만나는 서로 다른 점의 개수의 최댓값은 $4$이다.","answer":"251","sourceHash":"9609a2701736ae43fa0d3b9f7e7a42c72faa7da1ce8bc7c1550a1aefc3f8df77","steps":[{"id":"s1","latex":"g=x(x+a)^2-2(a+2)^2,\\quad g'=(x+a)(3x+a),\\quad h=(3x+a)g"},{"id":"s2","latex":"h(c)=h'(c)=0\\Rightarrow\\begin{cases}c=-a,\\ g(-a)=-2(a+2)^2=0,\\\\c=-\\frac a3,\\ g(-\\frac a3)=-\\frac2{27}(a+6)^2(2a+3)=0\\end{cases}"},{"id":"s3","latex":"a\\in\\left\\{-2,-6,-\\frac32\\right\\}"},{"id":"s4","latex":"a=-2:\\ h=x(3x-2)(x-2)^2\\Rightarrow |h(x)|=c\\text{의 서로 다른 실근의 개수의 최댓값은 }6\\quad(\\text{제외})"},{"id":"s5","latex":"a=-2:\\quad 0<y\\text{가 충분히 작으면 }h(x)=y\\text{는 }4\\text{근},\\ h(x)=-y\\text{는 }2\\text{근}"},{"id":"s6","latex":"a=-6:\\ h=3(x-2)^3(x-8),\\quad h(-1)=729"},{"id":"s7","latex":"a=-\\frac32:\\ h=3(x-\\frac12)^3(x-2),\\quad h(-1)=\\frac{243}{8}"},{"id":"s8","latex":"h=3(x-r)^3(x-s),\\ r<s:\\quad h^{\\prime}=3(x-r)^2(4x-r-3s)\\Rightarrow|h|\\text{의 수평선 교점은 최대 }4\\text{개}"},{"id":"s9","latex":"h(-1)\\text{의 최솟값은 }\\frac{243}{8}\\Rightarrow p+q=251"}],"diagram":null,"contentHash":"9bf20c47e821f441b3d9048741833f76980d09d3fc9b5f1268afd0359e53c5da","questionHtml":"<p class=\"hp\">실수 <span class=\"heq\">\\(a\\)<\/span>에 대하여 두 함수 <span class=\"heq\">\\(f \\left( x \\right)\\)<\/span>, <span class=\"heq\">\\(g \\left( x \\right)\\)<\/span>를<\/p><p class=\"hp\">&emsp;<span class=\"heq\">\\(f \\left( x \\right)\\)<\/span><span class=\"heq\">\\(=3x+a\\)<\/span>, <span class=\"heq\">\\(g \\left( x \\right)\\)<\/span><span class=\"heq\">\\(= \\int_{2}^{x} {} \\left( t+a \\right) f \\left( t \\right) dt\\)<\/span><\/p><p class=\"hp htall\">라 하자. 함수 <span class=\"heq\">\\(h \\left( x \\right)\\)<\/span><span class=\"heq\">\\(=f \\left( x \\right) g \\left( x \\right)\\)<\/span>가 다음 조건을 만족시킬 때, <span class=\"heq\">\\(h \\left( -1 \\right)\\)<\/span>의 최솟값은 <span class=\"heq\">\\(\\dfrac{q}{p}\\)<\/span>이다. <span class=\"heq\">\\(p+q\\)<\/span>의 값을 구하시오. (단, <span class=\"heq\">\\(p\\)<\/span>와 <span class=\"heq\">\\(q\\)<\/span>는 서로소인 자연수이다.) <span class=\"hscore\">[4점]<\/span><\/p><div class=\"hbox\"><p class=\"hp\">(가) 곡선 <span class=\"heq\">\\(y\\)<\/span><span class=\"heq\">\\(=h \\left( x \\right)\\)<\/span> 위의 어떤 점에서의 접선이 <span class=\"heq\">\\(x\\)<\/span>축이다.<\/p><p class=\"hp\">(나) 곡선 <span class=\"heq\">\\(y\\)<\/span><span class=\"heq\">\\(= \\left| h \\left( x \\right) \\right|\\)<\/span>가 <span class=\"heq\">\\(x\\)<\/span>축과 평행한 직선과 만나는 서로 다른 점의 개수의 최댓값은 <span class=\"heq\">\\(4\\)<\/span>이다.<\/p><\/div>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"4e75457d192844e502df277b8af66c3f76c306b1829de33880063f0f7d34f3aa"};</script>
<script>window.HandStudyGuide={"itemId":17093,"sourceHash":"9609a2701736ae43fa0d3b9f7e7a42c72faa7da1ce8bc7c1550a1aefc3f8df77","contentHash":"9bf20c47e821f441b3d9048741833f76980d09d3fc9b5f1268afd0359e53c5da","overview":{"goal":"접선 조건으로 가능한 \\(a\\)를 찾고, 수평선과 만나는 점의 개수로 후보를 가려 \\(h(-1)\\)의 최솟값을 구해요.","firstLook":"접선이 \\(x\\)축이라는 말은 접점에서 함숫값과 미분계수가 모두 \\(0\\)이라는 뜻이에요. 먼저 \\(g\\)와 \\(g'\\)를 정확히 구해 이 두 조건을 함께 써요.","conditions":[{"label":"접선 조건","meaning":"어떤 실수 \\(c\\)에서 \\(h(c)=0\\)이고 \\(h'(c)=0\\)이에요."},{"label":"교점 개수 조건","meaning":"\\(|h(x)|=d\\)가 가질 수 있는 서로 다른 실근의 최대 개수가 정확히 \\(4\\)여야 해요."}]},"chapters":[{"id":"c1","label":"적분부터 풀어 써요","stepIds":["s1"],"question":"\\(g(x)\\)를 계산할 때 아래끝값 \\(2\\)에서 생기는 상수는 무엇일까요?","hint":"적분할 식을 먼저 전개한 뒤, 위끝값과 아래끝값의 값을 차례로 빼 봐요.","explanation":"적분할 식은 \\((t+a)(3t+a)=3t^2+4at+a^2\\)예요. 따라서 미분하면 이 식이 되는 함수는 \\(t^3+2at^2+a^2t=t(t+a)^2\\)이고, 아래끝값 \\(2\\)에서의 값은 \\(2(a+2)^2\\)예요. 그래서\n\n\\(g(x)=x(x+a)^2-2(a+2)^2\\)\n\n이고, 직접 미분하면 \\(g'(x)=(x+a)(3x+a)\\)예요. 이제 \\(h(x)=(3x+a)g(x)\\)로 놓고 접선 조건을 적용할 준비가 됐어요.","check":{"prompt":"왜 \\(g(x)\\)에서 \\(2(a+2)^2\\)를 빼야 하나요?","answer":"정적분의 아래끝값이 \\(2\\)이므로 \\(t(t+a)^2\\)에 \\(2\\)를 넣은 \\(2(a+2)^2\\)를 위끝값의 결과에서 빼야 해요."}},{"id":"c2","label":"접점에서 두 식을 함께 써요","stepIds":["s2","s3"],"question":"\\(h(c)=h'(c)=0\\)이면 왜 \\(c=-a\\) 또는 \\(c=-a/3\\)만 확인하면 될까요?","hint":"\\(h=(3x+a)g\\)에서 \\(h(c)=0\\)인 두 경우를 나누고, 각 경우에 \\(h'(c)=0\\)을 다시 넣어요.","explanation":"\\(h(c)=0\\)이면 \\(3c+a=0\\)이거나 \\(g(c)=0\\)이에요. 먼저 \\(3c+a=0\\), 곧 \\(c=-a/3\\)이면 \\(h'(c)=3g(c)\\)이므로 \\(g(-a/3)=0\\)이어야 해요. 계산하면\n\n\\(g(-a/3)=-\\frac{2}{27}(a+6)^2(2a+3)\\)\n\n이므로 \\(a=-6\\) 또는 \\(a=-3/2\\)예요. 반대로 \\(g(c)=0\\)이면 \\(h'(c)=(3c+a)g'(c)\\)예요. 이미 \\(3c+a=0\\)인 경우는 앞에서 다뤘으므로, 새 경우는 \\(g'(c)=0\\)이면서 \\(3c+a\\neq0\\)인 때예요. \\(g'(x)=(x+a)(3x+a)\\)에서 새 근은 \\(c=-a\\)이고, \\(g(-a)=-2(a+2)^2=0\\)에서 \\(a=-2\\)를 얻어요. 따라서 후보는 \\(-2,-6,-3/2\\)뿐이에요.","check":{"prompt":"\\(c=-a/3\\)일 때 \\(h'(c)=0\\)이 \\(g(c)=0\\)을 뜻하는 이유는 무엇인가요?","answer":"\\(h'=3g+(3x+a)g'\\)이고 \\(3c+a=0\\)이므로 \\(h'(c)=3g(c)\\)만 남기 때문이에요."}},{"id":"c3","label":"여섯 교점이 생기는 후보를 제외해요","stepIds":["s4","s5"],"question":"\\(a=-2\\)일 때 작은 양수 높이에서 왜 교점이 여섯 개나 생길까요?","hint":"\\(h=x(3x-2)(x-2)^2\\)에서 한 번 곱해진 두 근과 같은 인수가 두 번 곱해진 근을 따로 살펴봐요.","explanation":"\\(a=-2\\)이면 \\(h(x)=x(3x-2)(x-2)^2\\)예요. \\(x=0\\)과 \\(x=2/3\\)에서는 해당 인수가 한 번씩 곱해져 있어 함수의 부호가 바뀌어요. 따라서 \\(d>0\\)을 충분히 작게 잡으면 각 근의 양옆에서 \\(|h(x)|=d\\)인 점이 하나씩 생겨 모두 네 점이에요.\n\n한편 \\(x=2\\)에서는 같은 인수 \\(x-2\\)가 두 번 곱해져 있고, 그 근처에서는 \\(x(3x-2)>0\\)이므로 \\(h(x)\\ge0\\)이며 \\(x=2\\)에서만 \\(0\\)이에요. 그래서 같은 작은 \\(d\\)에 대해 \\(x=2\\)의 왼쪽과 오른쪽에서도 \\(h(x)=d\\)인 점이 하나씩 더 생겨요. 합하면 서로 다른 교점이 여섯 개이므로, 교점 수의 최댓값이 \\(4\\)라는 조건에 어긋나 \\(a=-2\\)는 제외돼요.","check":{"prompt":"이중근 \\(x=2\\) 근처에서 추가되는 교점은 몇 개이며, 왜 그런가요?","answer":"두 개예요. \\(x=2\\)에서 \\(h\\)가 \\(0\\)인 채 부호를 바꾸지 않고 다시 커지므로, 작은 양수 높이와 왼쪽·오른쪽에서 한 번씩 만나요."}},{"id":"c4","label":"남은 두 후보가 조건을 만족하는지 확인해요","stepIds":["s6","s7","s8"],"question":"\\(3(x-r)^3(x-s)\\)에서 절댓값 그래프의 수평선 교점은 왜 네 개를 넘지 않을까요?","hint":"도함수의 부호가 실제로 바뀌는 점과 삼중근에서의 부호를 구분해요.","explanation":"\\(a=-6\\)이면 \\(h(x)=3(x-2)^3(x-8)\\), \\(a=-3/2\\)이면 \\(h(x)=3(x-1/2)^3(x-2)\\)예요. 둘 다 \\(r<s\\)인 \\(3(x-r)^3(x-s)\\) 꼴이에요. 도함수는\n\n\\(h'(x)=3(x-r)^2(4x-r-3s)\\)\n\n이므로 \\(x=(r+3s)/4\\)에서만 증가와 감소가 바뀌어요. \\(x=r\\)에서는 도함수가 \\(0\\)이지만 \\((x-r)^2\\) 때문에 도함수의 부호는 바뀌지 않아요. 그래프는 왼쪽에서 내려오며 \\(r\\)을 지나 음수가 되고, \\((r+3s)/4\\)에서 한 번 가장 낮아진 뒤 올라가 \\(s\\)를 지나 양수가 돼요. 따라서 \\(h(x)=d\\)는 바깥쪽에서 두 점, \\(h(x)=-d\\)는 가운데 골짜기에서 많아야 두 점이어서 \\(|h(x)|=d\\)의 해는 많아야 네 개예요. 골짜기의 깊이보다 작은 양수 \\(d\\)를 고르면 실제로 네 개가 생기므로 두 후보는 모두 조건을 만족해요.","check":{"prompt":"\\(x=r\\)이 수평인 점인데도 새로운 극값을 만들지 않는 이유는 무엇인가요?","answer":"도함수에 \\((x-r)^2\\)가 곱해져 있어 \\(x=r\\)의 양쪽에서 도함수 부호가 같기 때문이에요."}},{"id":"c5","label":"두 함숫값을 비교해 답을 정해요","stepIds":["s9"],"question":"남은 두 \\(a\\) 중 어느 것이 \\(h(-1)\\)을 더 작게 만들까요?","hint":"각 인수분해식에 \\(x=-1\\)을 직접 넣고 두 양수를 비교해요.","explanation":"\\(a=-6\\)일 때는 \\(h(-1)=3(-3)^3(-9)=729\\)예요. \\(a=-3/2\\)일 때는\n\n\\(h(-1)=3(-3/2)^3(-3)=243/8\\)\n\n이에요. 따라서 최솟값은 \\(243/8\\)이고, \\(p=8\\), \\(q=243\\)은 서로소예요. 문제에서 요구한 값은 \\(p+q=8+243=251\\)이에요.","check":{"prompt":"\\(a=-3/2\\)일 때 \\(h(-1)\\)의 계산과 최종 답은 무엇인가요?","answer":"\\(3(-3/2)^3(-3)=243/8\\)이고, \\(p+q=8+243=251\\)이에요."}}],"takeaway":["접선이 좌표축이라는 조건은 접점의 함숫값과 미분계수를 동시에 확인해요.","절댓값 그래프의 수평선 교점은 원래 함수의 양수 높이와 음수 높이 교점을 합쳐 세어요.","도함수가 \\(0\\)인 점에서도 부호가 바뀌는지 확인해야 실제 극값인지 판단할 수 있어요."]};</script>
