<script>window.HandStudyRecord={"adminYear":2024,"answer":"19","contentHash":"49d46fbad6707fbc6d570a642d681ec0182bab2bf0c435253a03621616a2adaf","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24945,"month":11,"number":30,"points":4,"preview":false,"questionHtml":"\u003cp>탁자 위에 \u003cspan class=\"heq\">\\(5\\)\u003c/span>개의 동전이 일렬로 놓여 있다. 이 \u003cspan class=\"heq\">\\(5\\,\\)\u003c/span>개의 동전 중 \u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>번째 자리와 \u003cspan class=\"heq\">\\(2\\,\\)\u003c/span>번째 자리의 동전은 앞면이 보이도록 놓여 있고, 나머지 자리의 \u003cspan class=\"heq\">\\(3\\,\\)\u003c/span>개의 동전은 뒷면이 보이도록 놓여 있다. 이 \u003cspan class=\"heq\">\\(5\\,\\)\u003c/span>개의 동전과 한 개의 주사위를 사용하여 다음 시행을 한다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp>주사위를 한 번 던져 나온 눈의 수가 \u003cspan class=\"heq\">\\(k\\,\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(k \\leq 5\\,\\)\u003c/span>이면 \u003cspan class=\"heq\">\\(k\\,\\)\u003c/span>번째 자리의 동전을 한 번 뒤집어 제자리에 놓고, \u003cspan class=\"heq\">\\(k=6\\,\\)\u003c/span>이면 모든 동전을 한 번씩 뒤집어 제자리에 놓는다.\u003c/p>\u003c/div>\u003cp>위의 시행을 \u003cspan class=\"heq\">\\(3\\,\\)\u003c/span>번 반복한 후 이 \u003cspan class=\"heq\">\\(5\\,\\)\u003c/span>개의 동전이 모두 앞면이 보이도록 놓여 있을 확률은 \u003cspan class=\"heq\">\\(\\frac{q}{p}\\,\\)\u003c/span>이다. \u003cspan class=\"heq\">\\(p+q\\,\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(p\\,\\)\u003c/span>와 \u003cspan class=\"heq\">\\(q\\,\\)\u003c/span>는 서로소인 자연수이다.) [4점]\u003c/p>","questionText":"탁자 위에 $5$개의 동전이 일렬로 놓여 있다. 이 $5\\,$개의 동전 중 $1\\,$번째 자리와 $2\\,$번째 자리의 동전은 앞면이 보이도록 놓여 있고, 나머지 자리의 $3\\,$개의 동전은 뒷면이 보이도록 놓여 있다. 이 $5\\,$개의 동전과 한 개의 주사위를 사용하여 다음 시행을 한다.\n주사위를 한 번 던져 나온 눈의 수가 $k\\,$일 때, $k \\leq 5\\,$이면 $k\\,$번째 자리의 동전을 한 번 뒤집어 제자리에 놓고, $k=6\\,$이면 모든 동전을 한 번씩 뒤집어 제자리에 놓는다.\n위의 시행을 $3\\,$번 반복한 후 이 $5\\,$개의 동전이 모두 앞면이 보이도록 놓여 있을 확률은 $\\frac{q}{p}\\,$이다. $p+q\\,$의 값을 구하시오. (단, $p\\,$와 $q\\,$는 서로소인 자연수이다.) [4점]","sourceHash":"d686706f4e92cd1ac32bb9c1a28f071e6f8bc27ee4cda3a2bf2ac76cc33eff61","sourceKind":"csat","sourceLabel":"2024년 시행 수능 · 2025학년도 · 확률과 통계 · 30번","steps":[{"id":"s1","latex":"\\text{처음 뒷면: }3,4,5\\text{번 자리}"},{"id":"s2","latex":"6\\text{이 0번}:\\quad3,4,5\\text{가 한 번씩}\\quad\\Rightarrow\\quad3!=6"},{"id":"s3","latex":"6\\text{이 1번}:\\quad1,2,6\\text{이 한 번씩}\\quad\\Rightarrow\\quad3!=6"},{"id":"s4","latex":"6\\text{이 2번}:\\quad\\text{전체 뒤집기 2번은 상쇄, 한 자리만 뒤집어 불가능}"},{"id":"s5","latex":"6\\text{이 3번}:\\quad\\text{처음의 앞뒤가 모두 바뀌어 불가능}"},{"id":"s6","latex":"\\mathrm P=\\frac{6+6}{6^3}=\\frac1{18}\\quad\\Rightarrow\\quad p+q=19"}],"track":"확률과 통계"};</script>
<script>window.HandStudyGuide={"itemId":24945,"sourceHash":"d686706f4e92cd1ac32bb9c1a28f071e6f8bc27ee4cda3a2bf2ac76cc33eff61","contentHash":"49d46fbad6707fbc6d570a642d681ec0182bab2bf0c435253a03621616a2adaf","overview":{"goal":"주사위에서 6이 나온 횟수에 따라 전체 뒤집기의 효과를 나누고, 세 번 뒤집어 목표 상태가 되는 순서를 세어요.","firstLook":"동전은 같은 자리를 두 번 뒤집으면 원래대로 돌아와요. 따라서 각 자리가 홀수 번 뒤집혔는지만 보면 돼요.","conditions":[{"label":"처음 상태","meaning":"\\(1,2\\)번은 앞면이고 \\(3,4,5\\)번은 뒷면이에요."},{"label":"주사위 눈","meaning":"\\(1\\)부터 \\(5\\)는 해당 자리 하나만, \\(6\\)은 다섯 자리를 모두 뒤집어요."},{"label":"시행 횟수","meaning":"세 번의 주사위 결과는 순서를 구별하며 모두 같은 확률을 가져요."}]},"chapters":[{"id":"c1","label":"전체 뒤집기가 없는 경우를 세어요","stepIds":["s1","s2"],"question":"6이 한 번도 나오지 않으면 어떤 세 자리만 뒤집어야 할까요?","hint":"처음 뒷면인 자리만 각각 홀수 번 뒤집혀야 해요.","explanation":"처음 뒷면인 것은 \\(3,4,5\\)번 자리예요. 전체 뒤집기가 없고 시행이 세 번뿐이므로 이 세 자리를 각각 정확히 한 번 뒤집어야 모두 앞면이 돼요. 주사위 결과는 \\(3,4,5\\)의 순열이므로 \\(3!=6\\)가지예요.","check":{"prompt":"같은 자리 하나를 세 번 뒤집는 경우가 빠지는 이유는 무엇인가요?","answer":"그 자리만 앞뒤가 바뀌고 나머지 두 뒷면 자리는 그대로라 모두 앞면이 되지 않아요."}},{"id":"c2","label":"전체 뒤집기가 한 번인 경우를 세어요","stepIds":["s3"],"question":"6이 한 번 나오면 나머지 두 번에는 어떤 눈이 나와야 할까요?","hint":"전체를 한 번 뒤집은 직후 어떤 자리들이 뒷면인지 생각해요.","explanation":"처음 상태에서 전체를 뒤집으면 \\(1,2\\)번은 뒷면, \\(3,4,5\\)번은 앞면이 돼요. 따라서 남은 두 번에는 \\(1\\)번과 \\(2\\)번을 각각 한 번씩 뒤집어야 해요. 세 번의 결과는 \\(1,2,6\\)의 순열이므로 \\(3!=6\\)가지예요. 뒤집기들은 순서가 달라도 최종 상태는 같지만 주사위 결과의 순서는 서로 다른 시행 결과로 세어요.","check":{"prompt":"결과가 \\(6,1,2\\)일 때 최종적으로 모두 앞면이 되나요?","answer":"6으로 전체 상태가 바뀐 뒤 1번과 2번을 각각 되돌리므로 모두 앞면이 돼요."}},{"id":"c3","label":"전체 뒤집기가 두세 번인 경우를 제외해요","stepIds":["s4","s5"],"question":"6이 두 번 또는 세 번 나오는 경우는 왜 불가능할까요?","hint":"전체 뒤집기 두 번은 서로 상쇄돼요.","explanation":"6이 두 번 나오면 전체 뒤집기 두 번이 상쇄되어 처음 상태로 돌아오고, 남은 한 번으로는 한 자리만 바꿀 수 있어요. 처음의 뒷면 세 자리를 모두 바꿀 수 없으므로 불가능해요.\n\n6이 세 번 나오면 전체 뒤집기를 홀수 번 한 것과 같아서 처음의 모든 앞뒤가 반대로 돼요. 그러면 \\(1,2\\)번이 뒷면이므로 역시 모두 앞면이 아니에요.","check":{"prompt":"전체 뒤집기를 두 번 하면 각 동전은 총 몇 번 뒤집히나요?","answer":"각 동전이 두 번씩 뒤집혀 모두 원래 상태로 돌아와요."}},{"id":"c4","label":"유리한 순서를 전체 순서로 나눠요","stepIds":["s6"],"question":"최종 확률과 p+q는 얼마인가요?","hint":"세 번의 주사위 결과 전체는 \\(6^3\\)가지이고 유리한 결과는 앞의 두 경우를 더해요.","explanation":"유리한 순서는 \\(6+6=12\\)가지이고 전체 순서는 \\(6^3=216\\)가지예요. 따라서 확률은 \\(12/216=1/18\\)이에요. \\(p=18,q=1\\)은 서로소이므로 \\(p+q=19\\)예요.","check":{"prompt":"두 경우의 6가지를 더할 수 있는 이유는 무엇인가요?","answer":"한 경우는 6이 0번, 다른 경우는 1번이라 같은 주사위 결과가 겹치지 않기 때문이에요."}}],"takeaway":["동전 뒤집기에서는 각 자리가 홀수 번 바뀌었는지만 추적하면 돼요.","전체를 뒤집는 시행 횟수로 경우를 나누면 필요한 개별 뒤집기가 분명해져요.","순서가 있는 반복 시행은 유리한 결과의 순열 수를 전체 결과 수로 나누어요."]};</script>
