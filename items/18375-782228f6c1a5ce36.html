<script>window.HandStudyRecord={"adminYear":2025,"answer":"91","contentHash":"df518bc182cab0d107f0ed5476066b38a2635e4fdc81f0bee13edd40df721cb1","diagram":null,"editionHash":"782228f6c1a5ce3610d65277644745e97748c10b7b8a3f1e2fccbba35e01a3bb","grade":3,"graphHash":"","graphPlan":null,"itemId":18375,"learningHash":"b57949f13b0907952d1702a272de1f8cec2a183d4077a5f24969acbec0f0f380","month":9,"number":29,"points":4,"preview":false,"questionHtml":"\u003cp class=\"hp htall\">첫째항이 양수이고 공비가 유리수인 등비수열 \u003cspan class=\"heq\">\\(\\left\\{a_{n} \\right\\}\\,\\)\u003c/span>에 대하여 급수 \u003cspan class=\"heq\">\\(\\sum\\limits_{n=1}^{ \\infty }a_{n}\\,\\)\u003c/span>이 수렴하고, 수열 \u003cspan class=\"heq\">\\(\\left\\{a_{n} \\right\\}\\,\\)\u003c/span>이 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) \u003cspan class=\"heq\">\\(a_{1}+a_{2} \\lt  10\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">(나) 수열 \u003cspan class=\"heq\">\\(\\left\\{a_{n} \\right\\}\\,\\)\u003c/span>의 정수인 항의 개수는 \u003cspan class=\"heq\">\\(3\\,\\)\u003c/span>이고, 이 세 항의 곱은 \u003cspan class=\"heq\">\\(216\\,\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp class=\"hp htall\">\u003cspan class=\"heq\">\\(\\sum\\limits_{n=1}^{ \\infty }a_{n}=\\dfrac{q}{p}\\,\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(p+q\\,\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(p\\,\\)\u003c/span>와 \u003cspan class=\"heq\">\\(q\\,\\)\u003c/span>는 서로소인 자연수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","questionText":"첫째항이 양수이고 공비가 유리수인 등비수열 $\\left\\{a_{n} \\right\\}\\,$에 대하여 급수 $\\sum_{n=1}^{ \\infty }a_{n}\\,$이 수렴하고, 수열 $\\left\\{a_{n} \\right\\}\\,$이 다음 조건을 만족시킨다.\n(가) $a_{1}+a_{2} \u003c 10$ (나) 수열 $\\left\\{a_{n} \\right\\}\\,$의 정수인 항의 개수는 $3\\,$이고, 이 세 항의 곱은 $216\\,$이다.\n$\\sum_{n=1}^{ \\infty }a_{n}=\\frac{q}{p}\\,$일 때, $p+q\\,$의 값을 구하시오. (단, $p\\,$와 $q\\,$는 서로소인 자연수이다.) [4점]","scoreStatus":"confirmed_4_direct","sourceHash":"465dec52269b113fc67311b4103471781ecd21f96153c8aa59d80ff19fd8b976","sourceLabel":"2025 평가원 고3 수학미적분 9월 29번","stepExplanations":{"s1":{"body":"\\(r=p/q\\)를 기약분수로 쓰면 \\(a_{i+d}=a_i p^d/q^d\\)입니다. 두 끝항이 정수이면 \\(q^d\\)가 \\(a_i\\)에 들어 있어 중간의 \\(a_i p^k/q^k\\)도 모두 정수입니다. 따라서 정수항이 정확히 세 개라면 그 첨자는 연속한 \\(j,j+1,j+2\\)입니다.","skillTags":["rational-ratio","integer-block"],"title":"정수항 세 개가 이어져 있어야 한다"},"s2":{"body":"등비수열의 연속한 세 항은 \\(a_ja_{j+1}a_{j+2}=a_{j+1}^3\\)을 만족합니다. 곱이 216이므로 가운데 정수항은 \\(a_{j+1}=6\\)이고, 양옆의 \\(6/r,6r\\)도 정수여야 합니다.","skillTags":["geometric-middle-term","integer-factor"],"title":"세 항의 곱에서 가운데 항을 구하기"},"s6":{"body":"\\(a_1>0\\)이고 \\(a_{j+1}=6>0\\)입니다. 공비가 음수이면 홀수 번째 항이 양수이므로 \\(j+1\\)은 홀수, 즉 \\(j\\)는 짝수입니다. \\(6=a_1(-2/3)^j\\)에서 \\(a_1+a_2=a_1/3=3(3/2)^{j-1}\\)도 얻습니다.","skillTags":["alternating-sign","index-parity"],"title":"r=-2/3에서 j가 짝수인 이유"}},"steps":[{"id":"s1","latex":"r=p/q\\text{ (기약분수)},\\quad a_i,a_{i+d}\\in\\mathbb Z\\Rightarrow q^d\\mid a_i\\Rightarrow a_i,\\ldots,a_{i+d}\\in\\mathbb Z"},{"id":"s2","latex":"\\text{세 정수항 }a_j,a_{j+1},a_{j+2}:\\quad a_{j+1}^3=216\\Rightarrow a_{j+1}=6"},{"id":"s3","latex":"6r,6/r\\in\\mathbb Z,\\ 0\u003c|r|\u003c1\\Rightarrow |r|\\in\\{1/2,1/3,1/6,2/3\\}"},{"id":"s4","latex":"|r|=1/2,1/3,1/6:\\quad\\text{앞 항도 정수이므로 }j=1,\\ r>0,\\ a_1+a_2\\ge18"},{"id":"s5","latex":"r=2/3:\\quad a_1\\ge9\\Rightarrow a_1+a_2\\ge15"},{"id":"s6","latex":"r=-2/3:\\quad j\\text{는 짝수},\\quad a_1=9(3/2)^{j-1},\\quad a_1+a_2=3(3/2)^{j-1}\u003c10"},{"id":"s7","latex":"j=2:\\ 9/2\u003c10,\\quad j\\ge4:\\ 3(3/2)^{j-1}\\ge81/8>10"},{"id":"s8","latex":"a_1=27/2,\\quad\\sum a_n=\\frac{27/2}{1+2/3}=81/10\\Rightarrow p+q=91"}],"track":"미적분"};</script>
