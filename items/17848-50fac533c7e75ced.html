<script>window.HandStudyGuide={"itemId":17848,"sourceHash":"fde027c83d7b1912f69ecf2ba49b414df2111a7c6b702479e5d90dfcb07ebadb","contentHash":"0999ffc517e03159d2440614b058d44a212ac46aa752154b52439fda35eac2e3","overview":{"goal":"네 점을 지나는 구의 중심과 반지름을 찾고, 그 구에서 직선 AB에 가장 가까운 점을 좌표로 구해 정사영 넓이를 계산합니다.","firstLook":"그림에서 C, P, Q는 밑면에 있고 R만 옆모서리 위에 있습니다. 네 점과 같은 거리에 있는 밑면의 점 M을 먼저 찾습니다.","conditions":[{"label":"정사각뿔의 길이","meaning":"밑면 좌표를 잡으면 꼭짓점 A의 높이는 피타고라스 정리로 정해집니다."},{"label":"거리의 최솟값","meaning":"구의 중심에서 직선 AB에 내린 수선 방향으로 구 위의 점을 잡습니다."}]},"chapters":[{"id":"c1","label":"구의 중심과 반지름을 찾습니다","stepIds":["s1","s2","s3"],"question":"네 점 C, P, Q, R과 같은 거리에 있는 점은 어디인가요?","hint":"밑면을 좌표평면으로 놓고 네 거리의 제곱을 비교하세요.","explanation":"\\(A=(0,0,\\sqrt{14})\\), \\(B=(-1,-1,0)\\), \\(C=(1,-1,0)\\), \\(D=(1,1,0)\\)로 둡니다. 이는 \\(AB^2=1+1+14=16\\)을 만족합니다. 중점은 \\(P=(0,-1,0)\\), \\(Q=(1,0,0)\\), 내분점은 \\(R=(7/8,-7/8,\\sqrt{14}/8)\\)입니다. 밑면의 세 점 C, P, Q가 만드는 직각삼각형의 외심은 \\((1/2,-1/2,0)\\)이므로 구의 중심을 \\(N=(1/2,-1/2,h)\\)라 둘 수 있습니다. \\(NC^2=1/2+h^2\\)이고 \\(NR^2=1/2-(\\sqrt{14}/4)h+h^2\\)이므로 두 거리가 같으려면 \\(h=0\\)입니다. 따라서 중심은 \\(M=(1/2,-1/2,0)\\)이고 \\(MC^2=MP^2=MQ^2=MR^2=1/2\\), 반지름은 \\(\\sqrt2/2\\)입니다.","check":{"prompt":"점 R의 좌표에서 A의 비율이 \\(1/8\\)인 이유는 무엇인가요?","answer":"R은 CA를 1:7로 내분하므로 C에서 A 쪽으로 전체의 1/8만큼 간 점이기 때문입니다."}},{"id":"c2","label":"직선에 가장 가까운 구 위의 점을 찾습니다","stepIds":["s4","s5","s6"],"question":"구의 어느 방향에 점 S가 있어야 하나요?","hint":"중심 M에서 직선 AB에 내린 수선의 발 H를 구하세요.","explanation":"직선 \\(AB\\) 위의 점을 \\(X(t)=(-1+t,-1+t,t\\sqrt{14})\\)라 두면 \\(MX(t)^2=(-3/2+t)^2+(-1/2+t)^2+14t^2=16(t-1/8)^2+9/4\\)입니다. 따라서 거리가 가장 짧은 점은 \\(t=1/8\\)일 때의 \\(H=(-7/8,-7/8,\\sqrt{14}/8)\\)이고 \\(MH=3/2\\)입니다. 중심과 직선 사이 거리가 반지름보다 크므로 가장 가까운 구 위의 점은 M에서 H 쪽으로 반지름만큼 간 점입니다. 따라서 \\(S=M+(\\sqrt2/3)(H-M)\\)이고, \\(S_x=1/2-11\\sqrt2/24\\), \\(S_y=-1/2-3\\sqrt2/24\\)입니다.","check":{"prompt":"H를 지나 더 멀리 가는 방향이 아니라 M에서 H 쪽을 택하는 이유는 무엇인가요?","answer":"직선까지의 거리를 줄이려면 중심에서 수선의 발 H를 향해 이동해야 하기 때문입니다."}},{"id":"c3","label":"밑면에 내린 넓이를 계산합니다","stepIds":["s7","s8"],"question":"정사영된 삼각형의 넓이가 왜 좌표 차 하나로 정해지나요?","hint":"A와 B를 밑면에 내리면 두 점은 원점과 (-1,-1)입니다.","explanation":"밑면에 내린 A는 \\((0,0)\\), B는 \\((-1,-1)\\), S는 \\((S_x,S_y)\\)입니다. 따라서 넓이는 행렬식으로 \\(\\frac12|(-1)S_y-(-1)S_x|=\\frac12|S_x-S_y|\\)입니다. \\(S_x-S_y=1-\\sqrt2/3\\)이므로 넓이는 \\(1/2-\\sqrt2/6\\)입니다. \\(p=1/2\\), \\(q=-1/6\\)이어서 \\(60(p+q)=20\\)입니다.","check":{"prompt":"q가 음수여도 조건에 맞나요?","answer":"문제에서 p와 q는 유리수라고만 했으므로 q가 음수인 것도 허용됩니다."}}],"takeaway":["네 점을 지나는 구는 네 점까지 거리의 제곱이 같은 중심을 찾아 정합니다.","구와 직선 사이의 최단점은 중심에서 직선에 내린 수선 방향에 있습니다."]};</script>
