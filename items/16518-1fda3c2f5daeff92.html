  <script>window.HandStudyRecord={"itemId":16518,"sourceLabel":"2019 평가원 고3 수리가형 6월 28번","adminYear":2019,"grade":3,"month":6,"number":28,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 길이가 $2$인 선분 ${A B}$를 지름으로 하는 반원의 호 ${A B}$ 위에 점 ${P}$가 있다. 중심이 ${A}$이고 반지름의 길이가 $\\overline{{A P}}$인 원과 선분 ${A B}$의 교점을 ${Q}$라 하자. 호 ${P B}$ 위에 점 ${R}$를 호 ${P R}$와 호 ${R B}$의 길이의 비가 $3 : 7$이 되도록 잡는다. 선분 ${A B}$의 중점을 ${O}$라 할 때, 선분 ${O R}$와 호 ${P Q}$의 교점을 ${T}$, 점 ${O}$에서 선분 ${A P}$에 내린 수선의 발을 ${H}$라 하자. 세 선분 ${P H}$, ${H O}$, ${O T}$와 호 ${T P}$로 둘러싸인 부분의 넓이를 $S_1$, 두 선분 ${R T}$, ${Q B}$와 두 호 ${T Q}$, ${B R}$로 둘러싸인 부분의 넓이를 $S_2$라 하자. $∠{P A B} = \\theta$라 할 때, $\\lim _{ \\theta \\,->\\, 0 +}\\frac{S _{1 }-S _{2 }}{\\overline{{O H}}}= a$이다. $50a$의 값을 구하시오. (단, $0 \u003c \\theta \u003c \\frac{ \\pi}{4}$) [4점]","answer":"40","sourceHash":"86170e467f6b38ad9b564cfada8763be70b16ad2ba2af2d0d232793abc438fcc","steps":[{"id":"s1","latex":"A=(0,0),\\ B=(2,0),\\ O=(1,0),\\qquad AP=2\\cos\\theta"},{"id":"s2","latex":"P=(2\\cos^2\\theta,2\\sin\\theta\\cos\\theta),\\quad H=(\\cos^2\\theta,\\sin\\theta\\cos\\theta)"},{"id":"s3","latex":"OH=\\sin\\theta,\\qquad \\angle ROB=\\dfrac75\\theta"},{"id":"s4","latex":"R=\\left(1+\\cos\\dfrac{7\\theta}{5},\\sin\\dfrac{7\\theta}{5}\\right),\\quad T=\\left(2+O(\\theta^2),\\dfrac75\\theta+O(\\theta^2)\\right)"},{"id":"s5","latex":"S_2=O(\\theta^3)\\Rightarrow\\lim_{\\theta\\to0+}\\dfrac{S_2}{OH}=0"},{"id":"s6","latex":"S_1=\\dfrac12\\left|-\\theta+\\dfrac75\\theta+\\dfrac65\\theta\\right|+O(\\theta^2)=\\dfrac45\\theta+O(\\theta^2)"},{"id":"s7","latex":"a=\\lim_{\\theta\\to0+}\\dfrac{S_1-S_2}{\\sin\\theta}=\\dfrac45\\Rightarrow50a=40"}],"diagram":null,"contentHash":"c2052637f75da0326c7348f97f994235b729e714dcdb6de0d5d6266d306b255a","questionHtml":"\u003cp class=\"hp htall\">그림과 같이 길이가 \u003cspan class=\"heq\">\\(2\\)\u003c/span>인 선분 \u003cspan class=\"heq\">\\({A B}\\)\u003c/span>를 지름으로 하는 반원의 호 \u003cspan class=\"heq\">\\({A B}\\)\u003c/span> 위에 점 \u003cspan class=\"heq\">\\({P}\\)\u003c/span>가 있다. 중심이 \u003cspan class=\"heq\">\\({A}\\)\u003c/span>이고 반지름의 길이가 \u003cspan class=\"heq\">\\(\\overline{{A P}}\\)\u003c/span>인 원과 선분 \u003cspan class=\"heq\">\\({A B}\\)\u003c/span>의 교점을 \u003cspan class=\"heq\">\\({Q}\\)\u003c/span>라 하자. \u003cbr>호\u003cspan class=\"heq\">\\({P B}\\)\u003c/span> 위에 점\u003cspan class=\"heq\">\\({R}\\)\u003c/span>를 호\u003cspan class=\"heq\">\\({P R}\\)\u003c/span>와 호\u003cspan class=\"heq\">\\({R B}\\)\u003c/span>의 길이의 비가 \u003cspan class=\"heq\">\\(3 : 7\\)\u003c/span>이 되도록 잡는다. 선분\u003cspan class=\"heq\">\\({A B}\\)\u003c/span>의 중점을 \u003cspan class=\"heq\">\\({O}\\)\u003c/span>라 할 때, 선분 \u003cspan class=\"heq\">\\({O R}\\)\u003c/span>와 호 \u003cspan class=\"heq\">\\({P Q}\\)\u003c/span>의 교점을 \u003cspan class=\"heq\">\\({T}\\)\u003c/span>, 점 \u003cspan class=\"heq\">\\({O}\\)\u003c/span>에서 선분\u003cspan class=\"heq\">\\({A P}\\)\u003c/span>에 내린 수선의 발을 \u003cspan class=\"heq\">\\({H}\\)\u003c/span>라 하자.\u003cbr>세 선분 \u003cspan class=\"heq\">\\({P H}\\)\u003c/span>, \u003cspan class=\"heq\">\\({H O}\\)\u003c/span>, \u003cspan class=\"heq\">\\({O T}\\)\u003c/span>와 호 \u003cspan class=\"heq\">\\({T P}\\)\u003c/span>로 둘러싸인 부분의 넓이를 \u003cspan class=\"heq\">\\(S_{1}\\)\u003c/span>, 두 선분 \u003cspan class=\"heq\">\\({R T}\\)\u003c/span>, \u003cspan class=\"heq\">\\({Q B}\\)\u003c/span>와 두 호 \u003cspan class=\"heq\">\\({T Q}\\)\u003c/span>, \u003cspan class=\"heq\">\\({B R}\\)\u003c/span>로 둘러싸인 부분의 넓이를 \u003cspan class=\"heq\">\\(S_{2}\\)\u003c/span>라 하자. \u003cspan class=\"heq\">\\(∠{P A B} = \\theta\\)\u003c/span>라 할 때, \u003cspan class=\"heq\">\\(\\lim\\limits_{ \\theta \\,\\to \\, 0 +}\\dfrac{S_{1 }-S_{2 }}{\\overline{{O H}}}= a\\)\u003c/span>이다. \u003cbr>\u003cspan class=\"heq\">\\(50a\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(0 \\lt  \\theta \\lt  \\dfrac{ \\pi}{4}\\)\u003c/span>) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">
