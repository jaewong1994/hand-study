<script>window.HandStudyRecord={"itemId":7736,"sourceLabel":"2019 교육청 고2 수학가형 11월 19번","adminYear":2019,"grade":2,"month":11,"number":19,"track":"수학가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 길이가 $2$인 선분 $AB$를 지름으로 하는 반원과 선분 $AB$의 중점 $O$가 있다. 호 $AB$ 위의 점 $P$에 대하여 점 $P$를 지나고 직선 $AB$와 평행한 직선과 점 $B$를 지나고 직선 $OP$와 평행한 직선이 만나는 점을 $Q$라 하자. ${\\overline{BP}} =t$라 할 때, $\\lim _{t\\, -> \\,0+} {\\frac{3- {\\overline{ AQ }}}{t ^{2}}}$의 값은? (단, $0\u003ct\u003c \\sqrt{2}$) [4점]\n$A$$O$$B$$Q$$P$\n① $\\frac{1}{6}$ ② $\\frac{1}{3}$ ③ $\\frac{1}{2}$ ④ $\\frac{2}{3}$ ⑤ $\\frac{5}{6}$","answer":"②","sourceHash":"9ffe210af08dff81f2282f32c71ce920695c0402ecfa6ef9fe904b02ec7ecb88","steps":[{"id":"s1","latex":"A=(-1,0),\\ O=(0,0),\\ B=(1,0),\\ P=(u,v)\\quad(v>0)"},{"id":"s2","latex":"BP^2=(u-1)^2+v^2=2-2u=t^2\\Rightarrow u=1-\\frac{t^2}{2},\\quad v=\\frac t2\\sqrt{4-t^2}"},{"id":"s3","latex":"PQ\\parallel AB,\\ BQ\\parallel OP\\Rightarrow Q=(1+u,v)"},{"id":"s4","latex":"AQ^2=(2+u)^2+v^2=\\left(3-\\frac{t^2}{2}\\right)^2+\\frac{t^2}{4}(4-t^2)=9-2t^2"},{"id":"s5","latex":"\\lim_{t\\to0+}\\frac{3-AQ}{t^2}=\\lim_{t\\to0+}\\frac{2}{3+\\sqrt{9-2t^2}}=\\frac13"}],"diagram":null,"contentHash":"175e93c020936d4cbbcc21ab4ec631d81cadb8844e12f3b6712e8224c7a22ede","questionHtml":"\u003cp class=\"hp htall\">그림과 같이 길이가 \u003cspan class=\"heq\">\\(2\\)\u003c/span>인 선분 \u003cspan class=\"heq\">\\(A B\\)\u003c/span>를 지름으로 하는 반원과 선분 \u003cspan class=\"heq\">\\(A B\\)\u003c/span>의 중점 \u003cspan class=\"heq\">\\(O\\)\u003c/span>가 있다. 호 \u003cspan class=\"heq\">\\(A B\\)\u003c/span> 위의 점 \u003cspan class=\"heq\">\\(P\\)\u003c/span>에 대하여 점 \u003cspan class=\"heq\">\\(P\\)\u003c/span>를 지나고 직선 \u003cspan class=\"heq\">\\(A B\\)\u003c/span>와 평행한 직선과 점 \u003cspan class=\"heq\">\\(B\\)\u003c/span>를 지나고 직선 \u003cspan class=\"heq\">\\(O P\\)\u003c/span>와 평행한 직선이 만나는 점을 \u003cspan class=\"heq\">\\(Q\\)\u003c/span>라 하자. \u003cspan class=\"heq\">\\({\\overline{B P}} =t\\)\u003c/span>라 할 때,\u00
