<script>window.HandStudyRecord={"itemId":18394,"sourceLabel":"2025 평가원 고3 수학확통 9월 30번","adminYear":2025,"grade":3,"month":9,"number":30,"track":"확통","points":4,"scoreStatus":"confirmed_4_direct","questionText":"학생 ${{A}}\\,$는 숫자 $1\\,$, $8\\,$이 각각 하나씩 적혀 있는 $2\\,$장의 카드 중 임의로 한 장의 카드를 선택하여 선택한 카드에 적힌 수가 $8\\,$일 때만 선택한 카드를 바닥에 내려놓고, 학생 ${{B}}\\,$는 숫자 $2\\,$, $3\\,$, $4\\,$, $5\\,$, $6\\,$, $7\\,$이 각각 하나씩 적혀 있는 $6\\,$장의 카드 중 임의로 한 장의 카드를 선택하여 선택한 카드에 적힌 수가 자연수 $n\\,$보다 작거나 같을 때만 선택한 카드를 바닥에 내려놓는다. 다음 규칙에 따라 학생 ${{A}}\\,$가 귤을 받을 확률을 $p\\,$, 학생 ${{B}}\\,$가 귤을 받을 확률을 $q\\,$라 하자.\n⦁카드를 내려놓은 학생이 $2\\,$명이면 더 큰 수가 적힌 카드를 내려놓은 학생만 귤을 받는다.⦁카드를 내려놓은 학생이 $1\\,$명이면 카드를 내려놓지 않은 학생만 귤을 받는다.⦁카드를 내려놓은 학생이 없으면 어느 학생도 귤을 받지 못한다.\n$p=q\\,$일 때, $24 \\left(n+p \\right)\\,$의 값을 구하시오. (단, $n\\,$은 $7$ 이하의 자연수이다.) [4점]","answer":"80","sourceHash":"cd3562c5171ded9abf56f3922c4474ee2776898629641f1c7234b49efe6e53b6","steps":[{"id":"s1","latex":"p=\\frac{n-1}{6},\\quad q=\\frac{7-n}{12}"},{"id":"s2","latex":"p=q\\Rightarrow2(n-1)=7-n\\Rightarrow n=3,\\ p=\\frac13"},{"id":"s3","latex":"24(n+p)=24\\left(3+\\frac13\\right)=80"}],"diagram":null,"contentHash":"cc42518bba66d982edf4d4d1e2074eb7b04488578700b254c2a940979c8f2b35","questionHtml":"\u003cp class=\"hp\">학생 \u003cspan class=\"heq\">\\({{A}}\\,\\)\u003c/span>는 숫자 \u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(8\\,\\)\u003c/span>이 각각 하나씩 적혀 있는 \u003cspan class=\"heq\">\\(2\\,\\)\u003c/span>장의 카드 중 임의로 한 장의 카드를 선택하여 선택한 카드에 적힌 수가 \u003cspan class=\"heq\">\\(8\\,\\)\u003c/span>일 때만 선택한 카드를 바닥에 내려놓고, 학생 \u003cspan class=\"heq\">\\({{B}}\\,\\)\u003c/span>는 숫자 \u003cspan class=\"heq\">\\(2\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(3\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(4\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(5\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(6\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(7\\,\\)\u003c/span>이 각각 하나씩 적혀 있는 \u003cspan class=\"heq\">\\(6\\,\\)\u003c/span>장의 카드 중 임의로 한 장의 카드를 선택하여 선택한 카드에 적힌 수가 자연수 \u003cspan class=\"heq\">\\(n\\,\\)\u003c/span>보다 작거나 같을 때만 선택한 카드를 바닥에 내려놓는다. \u003cbr>다음 규칙에 따라 학생 \u003cspan class=\"heq\">\\({{A}}\\,\\)\u003c/span>가 귤을 받을 확률을 \u003cspan class=\"heq\">\\(p\\,\\)\u003c/span>, 학생 \u003cspan class=\"heq\">\\({{B}}\\,\\)\u003c/span>가 귤을 받을 확률을 \u003cspan class=\"heq\">\\(q\\,\\)\u003c/span>라 하자.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">⦁카드를 내려놓은 학생이 \u003cspan class=\"heq\">\\(2\\,\\)\u003c/span>명이면 더 큰 수가 적힌 카드를 내려놓은 학생만 귤을 받는다.\u003c/p>\u003cp class=\"hp\">⦁카드를 내려놓은 학생이 \u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>명이면 카드를 내려놓지 않은 학생만 귤을 받는다.\u003c/p>\u003cp class=\"hp\">⦁카드를 내려놓은 학생이 없으면 어느 학생도 귤을 받지 못한다.\u003c/p>\u003c/div>\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(p=q\\,\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(24 \\left(n+p \\right)\\,\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(n\\,\\)\u003c/span>은 \u003cspan class=\"heq\">\\(7\\)\u003c/span> 이하의 자연수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"5566f66164468dd6676b0ea9af5cd54ae028a2596dc4a03182992c48b17dc319"};</script>
<script>window.HandStudyGuide={"itemId":18394,"sourceHash":"cd3562c5171ded9abf56f3922c4474ee2776898629641f1c7234b49efe6e53b6","contentHash":"cc42518bba66d982edf4d4d1e2074eb7b04488578700b254c2a940979c8f2b35","overview":{"goal":"두 학생이 귤을 받는 사건을 카드 선택과 내려놓기 여부로 나누어 두 확률을 같게 만들어요.","firstLook":"A가 8을 뽑았는지와 B의 수가 n 이하인지가 각각 내려놓기 여부를 정해요. 네 조합에서 실제로 귤을 받는 학생을 먼저 표시해요.","conditions":[{"label":"A의 행동","meaning":"A는 8을 뽑을 확률이 1/2이고, 이때만 카드를 내려놓아요."},{"label":"B의 행동","meaning":"B가 뽑은 수는 2부터 7까지이고, n 이하인 수는 n-1개예요."}]},"chapters":[{"id":"c1","label":"두 학생이 받는 경우를 세어요","stepIds":["s1"],"question":"A와 B는 각각 어떤 경우에 귤을 받을까요?","hint":"A가 1과 8 중 무엇을 뽑았는지, B가 \\(n\\) 이하의 수를 뽑았는지를 함께 나누어 규칙을 적용해 보세요.","explanation":"A가 1을 뽑고 B가 \\(n\\) 이하의 수를 뽑으면 B만 카드를 내려놓아요. 카드를 한 명만 내려놓았으므로 내려놓지 않은 A가 귤을 받아요. 이 확률은 \\(\\frac12\\times\\frac{n-1}{6}\\)이에요.\n\nA가 8을 뽑고 B도 카드를 내려놓으면 두 명이 모두 내려놓고, \\(8\\)이 B의 어떤 카드보다 크므로 A가 받아요. 확률은 다시 \\(\\frac12\\times\\frac{n-1}{6}\\)이에요. 따라서 \\(p=2\\times\\frac12\\times\\frac{n-1}{6}=\\frac{n-1}{6}\\)이에요.\n\nB가 받는 경우는 A가 8을 뽑아 내려놓고 B는 \\(n\\)보다 큰 수를 뽑아 내려놓지 않을 때뿐이에요. 이때 내려놓은 학생이 한 명이므로 내려놓지 않은 B가 받아요. B의 카드 중 \\(n\\)보다 큰 수는 \\(n+1,n+2,\\ldots,7\\)의 \\(7-n\\)개예요. 따라서 \\(q=\\frac12\\times\\frac{7-n}{6}=\\frac{7-n}{12}\\)예요.","check":{"prompt":"A가 8을 뽑고 B도 내려놓을 때 A가 받는 이유는 무엇이며, 이때 B도 받을 수 있나요?","answer":"두 카드 중 A의 8이 B의 2부터 7까지 어떤 수보다도 크므로 A가 받고, B는 받을 수 없어요."}},{"id":"c2","label":"두 확률을 같게 해요","stepIds":["s2","s3"],"question":"확률이 같아지는 자연수와 마지막 값은 무엇일까요?","hint":"두 분수의 분모를 12로 맞춰 보세요.","explanation":"\\(p=q\\)를 쓰면 \\(\\frac{n-1}{6}=\\frac{7-n}{12}\\)예요. 양변에 \\(12\\)를 곱하면 \\(2(n-1)=7-n\\), 따라서 \\(3n=9\\)이고 \\(n=3\\)이에요.\n\n이때 \\(p=\\frac{3-1}{6}=\\frac13\\)이고 \\(24(n+p)=24\\left(3+\\frac13\\right)=24\\times\\frac{10}{3}=80\\)이에요.","check":{"prompt":"구한 자연수를 넣었을 때 두 확률은 정말 같은가요?","answer":"두 확률은 모두 삼분의 일이어서 같아요."}}],"takeaway":["확률을 식으로 쓰기 전에 행동 조합별로 누가 받는지 먼저 판정해요.","한 명만 내려놓으면 받는 사람이 반대편이라는 규칙을 놓치지 않아요.","구한 매개변수는 두 확률에 각각 다시 넣어 같음을 확인해요."]};</script>
