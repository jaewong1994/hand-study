<script>window.HandStudyRecord={"itemId":18394,"sourceLabel":"2025 평가원 고3 수학확통 9월 30번","adminYear":2025,"grade":3,"month":9,"number":30,"track":"확통","points":4,"scoreStatus":"confirmed_4_direct","questionText":"학생 ${{A}}\\,$는 숫자 $1\\,$, $8\\,$이 각각 하나씩 적혀 있는 $2\\,$장의 카드 중 임의로 한 장의 카드를 선택하여 선택한 카드에 적힌 수가 $8\\,$일 때만 선택한 카드를 바닥에 내려놓고, 학생 ${{B}}\\,$는 숫자 $2\\,$, $3\\,$, $4\\,$, $5\\,$, $6\\,$, $7\\,$이 각각 하나씩 적혀 있는 $6\\,$장의 카드 중 임의로 한 장의 카드를 선택하여 선택한 카드에 적힌 수가 자연수 $n\\,$보다 작거나 같을 때만 선택한 카드를 바닥에 내려놓는다. 다음 규칙에 따라 학생 ${{A}}\\,$가 귤을 받을 확률을 $p\\,$, 학생 ${{B}}\\,$가 귤을 받을 확률을 $q\\,$라 하자.\n⦁카드를 내려놓은 학생이 $2\\,$명이면 더 큰 수가 적힌 카드를 내려놓은 학생만 귤을 받는다.⦁카드를 내려놓은 학생이 $1\\,$명이면 카드를 내려놓지 않은 학생만 귤을 받는다.⦁카드를 내려놓은 학생이 없으면 어느 학생도 귤을 받지 못한다.\n$p=q\\,$일 때, $24 \\left(n+p \\right)\\,$의 값을 구하시오. (단, $n\\,$은 $7$ 이하의 자연수이다.) [4점]","answer":"80","sourceHash":"cd3562c5171ded9abf56f3922c4474ee2776898629641f1c7234b49efe6e53b6","steps":[{"id":"s1","latex":"p=\\frac{n-1}{6},\\quad q=\\frac{7-n}{12}"},{"id":"s2","latex":"p=q\\Rightarrow2(n-1)=7-n\\Rightarrow n=3,\\ p=\\frac13"},{"id":"s3","latex":"24(n+p)=24\\left(3+\\frac13\\right)=80"}],"diagram":null,"contentHash":"cc42518bba66d982edf4d4d1e2074eb7b04488578700b254c2a940979c8f2b35","questionHtml":"\u003cp class=\"hp\">학생 \u003cspan class=\"heq\">\\({{A}}\\,\\)\u003c/span>는 숫자 \u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(8\\,\\)\u003c/span>이 각각 하나씩 적혀 있는 \u003cspan class=\"heq\">\\(2\\,\\)\u003c/span>장의 카드 중 임의로 한 장의 카드를 선택하여 선택한 카드에 적힌 수가 \u003cspan class=\"heq\">\\(8\\,\\)\u003c/span>일 때만 선택한 카드를 바닥에 내려놓고, 학생 \u003cspan class=\"heq\">\\({{B}}\\,\\)\u003c/span>는 숫자 \u003cspan class=\"heq\">\\(2\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(3\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(4\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(5\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(6\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(7\\,\\)\u003c/span>이 각각 하나씩 적혀 있는 \u003cspan class=\"heq\">\\(6\\,\\)\u003c/span>장의 카드 중 임의로 한 장의
