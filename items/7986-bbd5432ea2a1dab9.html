<script>window.HandStudyRecord={"itemId":7986,"sourceLabel":"2020 교육청 고2 수학 9월 29번","adminYear":2020,"grade":2,"month":9,"number":29,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 ${1}{{from^2020^09^인천교고2^중}}$보다 큰 두 실수 $a$, $t$에 대하여 직선 $y=-x+t$가 두 곡선 $y=a^{x}$, $y=\\log_{a} x$와 만나는 점을 각각 $A$, $B$라 하자. 점 $A$에서 $x$축에 내린 수선의 발을 $H$라 할 때, 세 점 $A$, $B$, $H$는 다음 조건을 만족시킨다.\n(가) ${\\overline{ OH}} \\,:\\, {\\overline{ AB}} =1\\,:\\,2$ (나) 삼각형 $AOB$의 외접원의 반지름의 길이는 $\\frac{\\sqrt{2}}{2}$이다.\n$200(t-a)$의 값을 구하시오. (단, $O$는 원점이다.) [4점]","answer":"50","sourceHash":"4cd90cd937174e71dec85f0382278866d327ae950cbe8071270718180b682e29","steps":[{"id":"s1","latex":"A=(u,v),\\quad B=(v,u),\\quad v=a^u,\\quad u+v=t"},{"id":"s2","latex":"OH=u,\\quad AB=\\sqrt2(v-u)=2u\\Rightarrow v=(1+\\sqrt2)u"},{"id":"s3","latex":"\\sin\\angle AOB=\\dfrac{v^2-u^2}{v^2+u^2}=\\dfrac{\\sqrt2}{2}"},{"id":"s4","latex":"R=\\dfrac{AB}{2\\sin\\angle AOB}=\\dfrac{2u}{\\sqrt2}=\\dfrac{\\sqrt2}{2}"},{"id":"s5","latex":"u=\\dfrac12,\\quad v=\\dfrac{1+\\sqrt2}{2}"},{"id":"s6","latex":"a=v^2=\\dfrac{3+2\\sqrt2}{4},\\quad t=u+v=1+\\dfrac{\\sqrt2}{2}"},{"id":"s7","latex":"200(t-a)=50"}],"diagram":null,"contentHash":"ecc1391a3a9ec2886a7be7adbdfbd401665d19530166589a5e0fca20c9f14084","questionHtml":"\u003cp class=\"hp\">그림과 같이 \u003cspan class=\"heq\">\\({1}\\)\u003c/span>보다 큰 두 실수 \u003cspan class=\"heq\">\\(a\\)\u003c/span>, \u003cspan class=\"heq\">\\(t\\)\u003c/span>에 대하여 직선\u003cbr>\u003cspan class=\"heq\">\\(y=-x+t\\)\u003c/span>가 두 곡선 \u003cspan class=\"heq\">\\(y=a^{x}\\)\u003c/span>, \u003cspan class=\"heq\">\\(y=\\log_{a} x\\)\u003c/span>와 만나는 점을 각각 \u003cspan class=\"heq\">\\(A\\)\u003c/span>, \u003cspan class=\"heq\">\\(B\\)\u003c/span>라 하자. 점 \u003cspan class=\"heq\">\\(A\\)\u003c/span>에서 \u003cspan class=\"heq\">\\(x\\)\u003c/span>축에 내린 수선의 발을 \u003cspan class=\"heq\">\\(H\\)\u003c/span>라 할 때, 세 점 \u003cspan class=\"heq\">\\(A\\)\u003c/span>, \u003cspan class=\"heq\">\\(B\\
