<script>window.HandStudyRecord={"adminYear":2025,"answer":"③","contentHash":"c624d982cc05e69ec5243a3a7e6ec5f02e6fc548bdf8dd2a6fa3e3108bd12397","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24956,"month":11,"number":11,"points":4,"preview":false,"questionHtml":"\u003cp>시각 \u003cspan class=\"heq\">\\(t=0\\,\\)\u003c/span>일 때 원점을 출발하여 수직선 위를 움직이는 점 \u003cspan class=\"heq\">\\({{P}}\\,\\)\u003c/span>가 있다. 실수 \u003cspan class=\"heq\">\\(k\\,\\)\u003c/span>에 대하여 시각이 \u003cspan class=\"heq\">\\(t\\, \\left(t \\geq 0 \\right)\\,\\)\u003c/span>일 때 점 \u003cspan class=\"heq\">\\({{P}}\\,\\)\u003c/span>의 속도 \u003cspan class=\"heq\">\\(v \\left(t \\right)\\,\\)\u003c/span>가\u003c/p>\u003cp> \u003cspan class=\"heq\">\\(v \\left(t \\right)=t^{2}-kt+4\\,\\)\u003c/span>\u003c/p>\u003cp>이다. &lt;보기&gt;에서 옳은 것만을 있는 대로 고른 것은? [4점]\u003c/p>\u003cp>&lt;보 기&gt;ㄱ. \u003cspan class=\"heq\">\\(k=0\\,\\)\u003c/span>이면, 시각 \u003cspan class=\"heq\">\\(t=1\\,\\)\u003c/span>일 때 점 \u003cspan class=\"heq\">\\({{P}}\\,\\)\u003c/span>의 위치는 \u003cspan class=\"heq\">\\(\\frac{13}{3}\\,\\)\u003c/span>이다.ㄴ. \u003cspan class=\"heq\">\\(k=3\\,\\)\u003c/span>이면, 출발한 후 점 \u003cspan class=\"heq\">\\({{P}}\\,\\)\u003c/span>의 운동 방향이 한 번 바뀐다.ㄷ. \u003cspan class=\"heq\">\\(k=5\\,\\)\u003c/span>이면, 시각 \u003cspan class=\"heq\">\\(t=0\\,\\)\u003c/span>에서 \u003cspan class=\"heq\">\\(t=2\\,\\)\u003c/span>까지 점 \u003cspan class=\"heq\">\\({{P}}\\,\\)\u003c/span>가 움직인 거리는 \u003cspan class=\"heq\">\\(3\\,\\)\u003c/span>이다.\u003c/p>\u003cdiv class=\"hchoices\">\u003cdiv class=\"hch\">① ㄱ\u003c/div>\u003cdiv class=\"hch\">② ㄱ, ㄴ\u003c/div>\u003cdiv class=\"hch\">③ ㄱ, ㄷ\u003c/div>\u003cdiv class=\"hch\">④ ㄴ, ㄷ\u003c/div>\u003cdiv class=\"hch\">⑤ ㄱ, ㄴ, ㄷ\u003c/div>\u003c/div>","questionText":"시각 $t=0\\,$일 때 원점을 출발하여 수직선 위를 움직이는 점 ${{P}}\\,$가 있다. 실수 $k\\,$에 대하여 시각이 $t\\, \\left(t \\geq 0 \\right)\\,$일 때 점 ${{P}}\\,$의 속도 $v \\left(t \\right)\\,$가\n $v \\left(t \\right)=t^{2}-kt+4\\,$\n이다. \u003c보기>에서 옳은 것만을 있는 대로 고른 것은? [4점]\n\u003c보 기>ㄱ. $k=0\\,$이면, 시각 $t=1\\,$일 때 점 ${{P}}\\,$의 위치는 $\\frac{13}{3}\\,$이다.ㄴ. $k=3\\,$이면, 출발한 후 점 ${{P}}\\,$의 운동 방향이 한 번 바뀐다.ㄷ. $k=5\\,$이면, 시각 $t=0\\,$에서 $t=2\\,$까지 점 ${{P}}\\,$가 움직인 거리는 $3\\,$이다.\n① ㄱ ② ㄱ, ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","sourceHash":"d2ad81b57e94550212afa992cd74500bf083a66a62b3d3c4cc3a8483e56012bf","sourceKind":"csat","sourceLabel":"2025년 시행 수능 · 2026학년도 · 공통 · 11번","steps":[{"id":"s1","latex":"\\text{ㄱ. }k=0\\Rightarrow x(1)=\\int_{0}^{1}(t^{2}+4)\\,dt=\\frac{13}{3}\\quad(\\text{참})"},{"id":"s2","latex":"\\text{ㄴ. }k=3\\Rightarrow v(t)=t^{2}-3t+4\\text{의 판별식은 }9-16\u003c0"},{"id":"s3","latex":"v(t)>0\\text{이므로 운동 방향은 바뀌지 않는다.}\\quad(\\text{거짓})"},{"id":"s4","latex":"\\text{ㄷ. }k=5\\Rightarrow v(t)=(t-1)(t-4)"},{"id":"s5","latex":"0\u003ct\u003c1\\text{에서 }v>0,\\quad1\u003ct\u003c2\\text{에서 }v\u003c0"},{"id":"s6","latex":"V(t)=\\frac{t^{3}}3-\\frac52t^{2}+4t,\\quad V(1)=\\frac{11}{6},\\ V(2)=\\frac23"},{"id":"s7","latex":"\\int_{0}^{2}|v(t)|\\,dt=V(1)-V(0)+V(1)-V(2)=3\\quad(\\text{참})"},{"id":"s8","latex":"\\therefore\\ \\boxed{\\text{ㄱ, ㄷ}}\\;(③)"}],"track":"공통"};</script>
