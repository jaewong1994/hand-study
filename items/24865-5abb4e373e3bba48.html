  <script>window.HandStudyRecord={"adminYear":2023,"answer":"③","contentHash":"8789157e192fa980b77cb6cbf00df53c97b91e31fd2e88dd1b0ee30fa31c8d7c","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24865,"month":11,"number":12,"points":4,"preview":false,"questionHtml":"\u003cp>함수 \u003cspan class=\"heq\">\\(f \\left(x \\right)= \\frac{1}{9} x \\left(x-6 \\right) \\left(x-9 \\right)\\)\u003c/span>와 실수 \u003cspan class=\"heq\">\\(t \\, \\left(0&lt;t&lt;6 \\right)\\)\u003c/span>에 대하여 함수 \u003cspan class=\"heq\">\\(g(x)\\)\u003c/span>는\u003c/p>\u003cp> \u003cspan class=\"heq\">\\(g \\left(x \\right)= {\\begin{cases}f \\left(x \\right)&amp;&amp; \\left(x&lt;t \\right) \\\\ - \\left(x-t \\right)+f \\left(t \\right)&amp;&amp; \\left(x \\geq t \\right)\\end{cases}}\\)\u003c/span>\u003c/p>\u003cp>이다. 함수 \u003cspan class=\"heq\">\\(y=g(x)\\)\u003c/span>의 그래프와 \u003cspan class=\"heq\">\\(x\\)\u003c/span>축으로 둘러싸인 영역의 넓이의 최댓값은? [4점]\u003c/p>\u003cdiv class=\"hchoices\">\u003cdiv class=\"hch\">① \u003cspan class=\"heq\">\\(\\frac{125}{4}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">② \u003cspan class=\"heq\">\\(\\frac{127}{4}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">③ \u003cspan class=\"heq\">\\(\\frac{129}{4}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">④ \u003cspan class=\"heq\">\\(\\frac{131}{4}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">⑤ \u003cspan class=\"heq\">\\(\\frac{133}{4}\\)\u003c/span>\u003c/div>\u003c/div>","questionText":"함수 $f \\left(x \\right)= \\frac{1}{9} x \\left(x-6 \\right) \\left(x-9 \\right)$와 실수 $t \\, \\left(0\u003ct\u003c6 \\right)$에 대하여 함수 $g(x)$는\n $g \\left(x \\right)= {\\begin{cases}f \\left(x \\right)&& \\left(x\u003ct \\right) \\\\ - \\left(x-t \\right)+f \\left(t \\right)&& \\left(x \\geq t \\right)\\end{cases}}$\n이다. 함수 $y=g(x)$의 그래프와 $x$축으로 둘러싸인 영역의 넓이의 최댓값은? [4점]\n① $\\frac{125}{4}$ ② $\\frac{127}{4}$ ③ $\\frac{129}{4}$ ④ $\\frac{131}{4}$ ⑤ $\\frac{133}{4}$","sourceHash":"d06ffd016a8663226aee28cb9ac2ac70863c5f9f8f756bc901bc53da4fe043b1","sourceKind":"csat","sourceLabel":"2023년 시행 수능 · 2024학년도 · 공통 · 12번","steps":[{"id":"s1","latex":"0\u003ct\u003c6\\text{에서 }f(t)>0\\text{이고, 오른쪽 직선은 }x=t+f(t)\\text{에서 }x\\text{축과 만난다.}"},{"explanation":{"body":"\\(0\u003ct\u003c6\\)에서는 \\(f(t)>0\\)입니다. \\(x\u003ct\\) 쪽은 곡선 아래 넓이 \\(\\int_0^t f(x)dx\\), \\(x\\ge t\\) 쪽은 밑변과 높이가 모두 \\(f(t)\\)인 직각삼각형이라 \\(\\frac12f(t)^2\\)입니다.","skillTags":["넓이분해","정적분"],"title":"넓이를 두 조각으로 잡기"},"id":"s2","latex":"S(t)=\\int_{0}^{t}f(x)\\,dx+\\frac12\\{f(t)\\}^{2}"},{"explanation":{"body":"첫 항은 미적분의 기본정리로 \\(f(t)\\), 둘째 항은 연쇄법칙으로 \\(f(t)f'(t)\\)가 됩니다. 따라서 공통인수 \\(f(t)\\)를 묶어 증감의 기준을 \\(1+f'(t)\\)로 줄입니다.","skillTags":["미적분기본정리","연쇄법칙"],"title":"합성된 넓이식 미분"},"id":"s3","latex":"S'(t)=f(t)\\{1+f'(t)\\}"},{"id":"s4","latex":"f'(t)=\\frac13(t^{2}-10t+18)\\text{이므로 }1+f'(t)=\\frac13(t-3)(t-7)"},{"id":"s5","latex":"0\u003ct\u003c6\\text{에서 }S'(t)>0\\ (t\u003c3),\\quad S'(t)\u003c0\\ (t>3)"},{"id":"s6","latex":"\\text{따라서 넓이는 }t=3\\text{에서 최대이다.}"},{"id":"s7","latex":"f(3)=6,\\qquad S(3)=\\int_{0}^{3}\\frac19x(x-6)(x-9)\\,dx+\\frac12\\cdot6^{2}"},{"id":"s8","latex":"=\\frac{57}{4}+18=\\frac{129}{4}"},{"id":"s9","latex":"\\therefore\\ \\boxed{\\frac{129}{4}}\\;(③)"}],"track":"공통"};</script>
