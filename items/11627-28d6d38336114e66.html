  <script>window.HandStudyRecord={"itemId":11627,"sourceLabel":"2019 교육청 고1 수학 9월 28번","adminYear":2019,"grade":1,"month":9,"number":28,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"반지름의 길이가 $6\\,$인 원 모양의 종이가 있을 때, 다음과 같은 방법으로 새로운 원을 그린다.\nⅠ. 원의 중심 $O\\,$를 지나는 직선을 그렸을 때, 원과 만나는 두 점을 각각 $A\\,$, $B\\,$라 하자. 원과 두 점에서 만나도록 직선 $A B\\,$와 평행한 직선을 그렸을 때, 원과 만나는 두 점을 각각 $C\\,$, $D\\,$라 하자.\nⅡ. 점 $A\\,$를 지나는 현을 접는 선으로 하여 직선 $C D\\,$에 접하도록 종이를 접고, 그 접점을 $E\\,$라 하자.\nⅢ. 점 $A\\,$를 지나는 현이 원과 만나는 점 중 점 $A\\,$가 아닌 점을 $F\\,$라 하자. 세 점 $A\\,$, $E\\,$, $F\\,$를 지나는 새로운 원을 그린다.\n원의 중심 $O\\,$를 좌표평면의 원점으로 하고, 두 점 $A\\,$, $B\\,$를 지나는 직선을 $y\\,$축으로 하는 좌표평면을 그렸을 때, 세 점 $A\\,$, $E\\,$, $F\\,$를 지나는 원의 중심을 $O ' (a,\\,b)\\,$라 하자. 삼각형 $AEO ' \\,$의 넓이가 $12\\,$일 때, $a^2 +b^2 \\,$의 값을 구하시오. (단, 종이의 두께는 무시한다.) [4점]","answer":"24","sourceHash":"55d188f01e885645d5d12bb45085ab359f86127552484eabd9f8c5333a972809","steps":[{"id":"s1","latex":"A=(0,6),\\ B=(0,-6),\\quad CD\\parallel y\\text{축}"},{"id":"s2","latex":"AF\\text{에 대한 대칭으로 새 원의 반지름}=6"},{"id":"s3","latex":"E\\in CD,\\ O^\\prime E\\perp CD\\Rightarrow O^\\prime E=6\\text{이고 }O^\\prime E\\parallel x\\text{축}"},{"id":"s4","latex":"[\\triangle AEO^\\prime]=\\frac12\\cdot6\\cdot|6-b|=12"},{"id":"s5","latex":"b\\in\\{2,10\\},\\quad E\\text{가 원 종이 안}\\Rightarrow b=2"},{"id":"s6","latex":"O^\\prime A=6\\Rightarrow a^2+(b-6)^2=36\\Rightarrow a^2=20"},{"id":"s7","latex":"a^2+b^2=20+4=24"}],"diagram":null,"contentHash":"879ad931fbe0e6928c9ace64c3a4c97b58dab2904071e6b7fe4b00ad377a62c3","questionHtml":"\u003cp class=\"hp\">반지름의 길이가 \u003cspan class=\"heq\">\\(6\\,\\)\u003c/span>인 원 모양의 종이가 있을 때, 다음과 같은 방법으로 새로운 원을 그린다.\u003c/p>\u003ctable class=\"htbl\">\u003ctr>\u003ctd style=\"width:27px;border-top:1px solid #333;border-bottom:1px solid #333;border-left:1px solid #333;border-right:1px solid #333\">\u003cp class=\"hp\">Ⅰ\u003c/p>\u003c/td>\u003ctd style=\"width:181px;border-top:1px solid #333;border-bottom:1px solid #333;border-le
