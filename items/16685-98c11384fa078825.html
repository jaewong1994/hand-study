  <script>window.HandStudyRecord={"itemId":16685,"sourceLabel":"2020 교육청 고3 수리가형 4월 20번","adminYear":2020,"grade":3,"month":4,"number":20,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"집합 $X= \\left\\{ 1,\\,2,\\,3,\\,4,\\,5 \\right\\}$에 대하여 함수 $f\\,:\\,X\\, \\to \\,X\\,$의 치역을 $A$, 합성함수 $f \\circ f$의 치역을 $B$라 할 때, 두 집합 $A,\\,B$가 다음 조건을 만족시킨다.\n◦ $n(A){\\geq}3$\n◦ 집합 $A$의 모든 원소의 합이 $3$의 배수이다.\n◦ $n(A)\\gt n(B)$\n다음은 함수 $f$의 개수를 구하는 과정이다.\n(ⅰ) $n(A)=3$이고 모든 원소의 합이 $3$의 배수인 집합 $A$는\n$\\left\\{ 1,\\,2,\\,3 \\right\\}$, $\\left\\{ 1,\\,3,\\,5 \\right\\}$, $\\left\\{ 2,\\,3,\\,4 \\right\\}$, $\\left\\{ 3,\\,4,\\,5 \\right\\}$\n이다.\n$A= \\left\\{ 1,\\,2,\\,3 \\right\\}$인 경우 $n(B)\\lt 3$이므로\n집합 $B$는\n$\\left\\{ 1 \\right\\} ,\\, \\left\\{ 2 \\right\\} ,\\, \\left\\{ 3 \\right\\} ,\\, \\left\\{ 1,\\,2 \\right\\} ,\\, \\left\\{ 1,\\,3 \\right\\} ,\\, \\left\\{ 2,\\,3 \\right\\}$\n이다.\n$A= \\left\\{ 1,\\,2,\\,3 \\right\\}$, $B= \\left\\{ 1 \\right\\}$인 경우\n함수 $f$의 개수는 ${\\boxed{\\vphantom{(}\\,(\\text{가})\\,}} \\,$이고\n$A= \\left\\{ 1,\\,2,\\,3 \\right\\}$, $B= \\left\\{ 1,\\,2 \\right\\}$인 경우\n함수 $f$의 개수는 ${\\boxed{\\vphantom{(}\\,(\\text{나})\\,}} \\,$이므로\n$n(A)=3$, $n(B)\\lt 3$이고 집합 $A$의 모든 원소의 합이 \n$3$의 배수가 되도록 하는 함수 $f$의 개수는\n$4 \\times \\left( 3 \\times {\\boxed{\\vphantom{(}\\,(\\text{가})\\,}} \\,+3 \\times {\\boxed{\\vphantom{(}\\,(\\text{나})\\,}} \\, \\right)$이다.\n(ⅱ) $n(A)=4$이고 모든 원소의 합이 $3$의 배수인 집합 $A$는 $\\left\\{ 1,\\,2,\\,4,\\,5 \\right\\}$뿐이므로 이 경우 $n(B)\\lt 4$를 만족시키는 함수 $f$의 개수는 ${\\boxed{\\vphantom{(}\\,(\\text{다})\\,}} \\,$이다.\n(ⅲ) $n(A)=5$인 경우 함수 $f$는 일대일대응이고 \n$n(B)=5$이므로 $n(A)\\gt n(B)$를 만족시키는 \n함수 $f$는 존재하지 않는다.\n(ⅰ), (ⅱ), (ⅲ)에 의하여 구하는 함수 $f$의 개수는\n$4 \\times \\left( 3 \\times {\\boxed{\\vphantom{(}\\,(\\text{가})\\,}} \\,+3 \\times {\\boxed{\\vphantom{(}\\,(\\text{나})\\,}} \\, \\right) + {\\boxed{\\vphantom{(}\\,(\\text{다})\\,}} \\,$이다.\n위의 (가), (나), (다)에 알맞은 수를 각각 $p,\\,q,\\,r$라 할 때,\n$p+q+r$의 값은? [4점]\n① $164$ ② $168$ ③ $172$ ④ $176$ ⑤ $180$","answer":"④","sourceHash":"a54e37f392d3d599fff6bd39d72f36b1ab9370e61cbeebf66cdc7388e1a72d97","steps":[{"id":"s1","latex":"B=\\{f(x)\\mid x\\in A\\}"},{"id":"s2","latex":"A=\\{1,2,3\\},\\ B=\\{1\\}:\\quad f(1)=f(2)=f(3)=1,\\quad(f(4),f(5))=(2,3),(3,2)\\Rightarrow p=2"},{"id":"s3","latex":"B=\\{1,2\\}:\\quad(f(1),f(2),f(3))\\text{에서 }1,2\\text{가 모두 등장}:\\quad2^3-2=6"},{"id":"s4","latex":"(f(4),f(5))\\text{에 }3\\text{이 등장}:\\quad3^2-2^2=5\\Rightarrow q=30"},{"id":"s5","latex":"A=\\{1,2,4,5\\}:\\quad n(B)=3;\\quad\\text{빠질 값 }4\\text{가지, 같은 값을 가질 입력 쌍 }{}_4C_2\\text{가지}"},{"id":"s6","latex":"r=4\\cdot{}_4C_2\\cdot3!=144\\Rightarrow p+q+r=176"}],"diagram":null,"contentHash":"d01eedbaa097af69c79d9c08bfaa84e60efe816929e1a54708da6a69687cc1bf","questionHtml":"\u003cp class=\"hp\">집합 \u003cspan class=\"heq\">\\(X= \\left\\{ 1,\\,2,\\,3,\\,4,\\,5 \\right\\}\\)\u003c/span>에 대하여 함수 \u003cspan class=\"heq\">\\(f\\,:\\,X\\, \\to  \\,X\\,\\)\u003c/span>의 치역을 \u003cspan class=\"heq\">\\(A\\)\u003c/span>, 합성함수 \u003cspan class=\"heq\">\\(f \\circ f\\)\u003c/span>의 치역을 \u003cspan class=\"heq\">\\(B\\)\u003c/span>라 할 때, 두 집합 \u003cspan class=\"heq\">\\(A,\\,B\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cp class=\"hp\">\u003cdiv class=\"hbox\">\u003cp class=\"hp\">◦ \u003cspan class=\"heq\">\\(n(A){\\geq}3\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">◦ 집합 \u003cspan class=\"heq\">\\(A\\)\u003c/span>의 모든 원소의 합이 \u003cspan class=\"heq\">\\(3\\)\u003c/span>의 배수이다.\u003c/p>\u003cp class=\"hp\">◦ \u003cspan class=\"heq\">\\(n(A)\\gt n(B)\\)\u003c/span>\u003c/p>\u003c/div>\u003c/p>\u003cp class=\"hp\">다음은 함수 \u003cspan class=\"heq\">\\(f\\)\u003c/span>의 개수를 구하는 과정이다.\u003c/p>\u003cp class=\"hp htall\">\u003cdiv class=\"hbox\">\u003cp class=\"hp htall\">(ⅰ) \u003cspan class=\"heq\">\\(n(A)=3\\)\u003c/span>이고 모든 원소의 합이 \u003cspan class=\"heq\">\\(3\\)\u003c/span>의 배수인 집합 \u003cspan class=\"heq\">\\(A\\)\u003c/span>는\u003cbr>\u003cspan class=\"heq\">\\(\\left\\{ 1,\\,2,\\,3 \\right
