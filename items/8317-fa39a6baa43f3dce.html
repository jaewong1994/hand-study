<script>window.HandStudyRecord={"itemId":8317,"sourceLabel":"2023 교육청 고2 수학 9월 30번","adminYear":2023,"grade":2,"month":9,"number":30,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"두 양수 $a$, $b \\, \\left(a<b \\right)$에 대하여 함수 $f(x)$는\n $f \\left(x \\right)= {\\begin{cases} \\left| -ax ^{2} +b \\right|&& \\left(x \\leq 0 \\right) \\\\ x ^{2} -2ax+b ^{2}&& \\left(x>0 \\right)\\end{cases}}$\n이다. 양의 실수 $t$에 대하여 직선 $y=t$가 함수 $y=f(x)$의 그래프와 만나는 서로 다른 점의 개수를 $g(t)$라 하자. 함수 $g(t)$는 최솟값 $2$를 갖고, 두 상수 $\\alpha$, $\\beta$에 대하여 다음 조건을 만족시킨다.\n(가) $\\left| \\lim _{t\\, \\rightarrow \\, \\alpha -} {} g \\left(t \\right)- \\lim _{t\\, \\rightarrow \\, \\alpha +} {} g \\left(t \\right) \\right| =2$ (나) $\\lim _{t \\,\\to \\, \\beta -} {} g \\left(t \\right)- \\lim _{t \\,\\to \\, \\beta +} {} g \\left(t \\right)+1=g \\left( \\beta \\right)$ (다) $g \\left( \\alpha \\right) \\ne  g \\left( \\beta \\right)$\n$f \\left( \\frac{1}{2} \\right) = \\alpha$, $\\alpha +24 \\beta =30$일 때, $f \\left(-2 \\right)+f \\left(1 \\right)= \\frac{q}{p}$이다. $p+q$의 값을 구하시오. (단, $p$와 $q$는 서로소인 자연수이다.) [4점]","answer":"311","sourceHash":"2b11a368c55ca0caa1d78f31f9cdaaf735195ea94753b4301baff3609c21ae77","steps":[{"id":"s1","latex":"x\\le0:\\ N_L(t)=\\begin{cases}2&0<t\\le b\\\\1&t>b\\end{cases}"},{"id":"s2","latex":"x>0:\\ c=b^2-a^2,\\quad N_R(t)=\\begin{cases}0&t<c\\\\1&t=c\\text{ 또는 }t\\ge b^2\\\\2&c<t<b^2\\end{cases}"},{"id":"s3","latex":"g(t)\\ge2\\text{이고 어떤 양의 }t\\text{에서는 }g(t)=2\\Rightarrow c\\le b,\\quad c=b\\text{이면 (가)에 어긋나므로 }c<b"},{"id":"s4","latex":"\\alpha=c=b^2-a^2,\\quad\\beta=b^2"},{"id":"s5","latex":"f\\left(\\frac12\\right)=\\frac14-a+b^2=b^2-a^2\\Rightarrow\\left(a-\\frac12\\right)^2=0"},{"id":"s6","latex":"a=\\frac12"},{"id":"s7","latex":"\\alpha+24\\beta=25b^2-\\frac14=30\\Rightarrow b=\\frac{11}{10}"},{"id":"s8","latex":"f(-2)=\\left|\\frac{11}{10}-2\\right|=\\frac9{10}"},{"id":"s9","latex":"f(1)=1-1+\\frac{121}{100}=\\frac{121}{100}"},{"id":"s10","latex":"f(-2)+f(1)=\\frac{211}{100}\\Rightarrow p+q=311"}],"diagram":null,"contentHash":"8c2a8408be8206e4efa61f03778fbb3eb4feb5bbd2249cb68e760c5dc5ab5d3d","questionHtml":"<p class=\"hp\">두 양수 <span class=\"heq\">\\(a\\)<\/span>, <span class=\"heq\">\\(b \\, \\left(a\\lt b \\right)\\)<\/span>에 대하여 함수 <span class=\"heq\">\\(f(x)\\)<\/span>는<\/p><p class=\"hp htall\">&emsp;<span class=\"heq\">\\(f \\left(x \\right)= {\\begin{cases} \\left| -ax^{2} +b \\right|&& \\left(x \\leq 0 \\right) \\\\ x^{2} -2ax+b^{2}&& \\left(x\\gt 0 \\right)\\end{cases}}\\)<\/span><\/p><p class=\"hp\">이다. 양의 실수 <span class=\"heq\">\\(t\\)<\/span>에 대하여 직선 <span class=\"heq\">\\(y=t\\)<\/span>가 함수 <span class=\"heq\">\\(y=f(x)\\)<\/span>의 그래프와 만나는 서로 다른 점의 개수를 <span class=\"heq\">\\(g(t)\\)<\/span>라 하자. 함수 <span class=\"heq\">\\(g(t)\\)<\/span>는 최솟값 <span class=\"heq\">\\(2\\)<\/span>를 갖고, 두 상수 <span class=\"heq\">\\(\\alpha\\)<\/span>, <span class=\"heq\">\\(\\beta\\)<\/span>에 대하여 다음 조건을 만족시킨다.<\/p><div class=\"hbox\"><p class=\"hp\">(가) <span class=\"heq\">\\(\\left| \\lim\\limits_{t\\, \\rightarrow \\, \\alpha -} {} g \\left(t \\right)- \\lim\\limits_{t\\, \\rightarrow \\, \\alpha +} {} g \\left(t \\right) \\right| =2\\)<\/span><\/p><p class=\"hp\">(나) <span class=\"heq\">\\(\\lim\\limits_{t \\,\\to \\, \\beta -} {} g \\left(t \\right)- \\lim\\limits_{t \\,\\to \\, \\beta +} {} g \\left(t \\right)+1=g \\left( \\beta \\right)\\)<\/span><\/p><p class=\"hp\">(다) <span class=\"heq\">\\(g \\left( \\alpha \\right)  \\neq  g \\left( \\beta \\right)\\)<\/span><\/p><\/div><p class=\"hp htall\"><span class=\"heq\">\\(f \\left( \\dfrac{1}{2} \\right) = \\alpha\\)<\/span>, <span class=\"heq\">\\(\\alpha +24 \\beta =30\\)<\/span>일 때, <span class=\"heq\">\\(f \\left(-2 \\right)+f \\left(1 \\right)= \\dfrac{q}{p}\\)<\/span>이다.<br><span class=\"heq\">\\(p+q\\)<\/span>의 값을 구하시오. (단, <span class=\"heq\">\\(p\\)<\/span>와 <span class=\"heq\">\\(q\\)<\/span>는 서로소인 자연수이다.) <span class=\"hscore\">[4점]<\/span><\/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"a9c0a64707869b71a18c8b634d3a4f881ccf40152ef3f864a604c92ba4c714f1"};</script>
<script>window.HandStudyGuide={"itemId":8317,"sourceHash":"2b11a368c55ca0caa1d78f31f9cdaaf735195ea94753b4301baff3609c21ae77","contentHash":"8c2a8408be8206e4efa61f03778fbb3eb4feb5bbd2249cb68e760c5dc5ab5d3d","overview":{"goal":"왼쪽 절댓값 그래프와 오른쪽 포물선에서 높이 \\(t\\)의 교점 수를 따로 세고, 교점 수가 바뀌는 높이로 \\(\\alpha,\\beta\\)를 정해 매개변수를 계산해요.","firstLook":"왼쪽 조각은 높이 \\(b\\), 오른쪽 조각은 꼭짓점 높이 \\(c=b^2-a^2\\)와 경계 높이 \\(b^2\\)에서 교점 수가 바뀌어요.","conditions":[{"label":"교점 수의 하한","meaning":"모든 양의 \\(t\\)에서 전체 교점 수가 2 이상이고 실제로 2인 구간이 있어요."},{"label":"좌우극한 조건","meaning":"\\(\\alpha,\\beta\\)는 교점 수가 뛰는 높이들 중 조건식에 맞는 서로 다른 두 높이예요."}]},"chapters":[{"id":"c1","label":"두 조각의 교점 수를 따로 세어요","stepIds":["s1","s2","s3"],"question":"오른쪽 포물선에서 \\(t=b^2\\)일 때 교점이 하나뿐인 이유는 무엇인가요?","hint":"두 해 중 \\(x=0\\)은 오른쪽 조각의 정의역 \\(x>0\\)에 포함되지 않아요.","explanation":"왼쪽에서 \\(|-ax^2+b|=t\\), \\(x\\le0\\)을 풀면 \\(0<t\\le b\\)에서는 두 점, \\(t>b\\)에서는 한 점이에요. 오른쪽 식은 \\((x-a)^2+c\\), \\(c=b^2-a^2\\)이고 꼭짓점 \\(x=a>0\\)의 높이가 \\(c\\)예요. 따라서 \\(t<c\\)에서는 0개, \\(t=c\\)에서는 1개, \\(c<t<b^2\\)에서는 2개예요. \\(t=b^2\\)에서는 해가 \\(x=0,2a\\)지만 \\(x>0\\)이므로 \\(2a\\)만 남고, 그보다 높아도 오른쪽 해 하나만 남아요. 모든 교점 수가 2 이상이려면 \\(c\\le b\\)여야 해요. 만약 \\(c=b\\)이면 같은 높이에서 왼쪽 교점 수는 2에서 1로 줄고 오른쪽은 0에서 1로 늘어 좌우극한 차가 1뿐이어서 조건 (가)의 차 2를 만들 수 없어요. 따라서 실제로는 \\(c<b\\)예요.","check":{"prompt":"왼쪽에서 \\(t=b\\)일 때도 교점이 두 개인 이유는 무엇인가요?","answer":"\\(-ax^2+b=b\\)에서 \\(x=0\\), \\(-ax^2+b=-b\\)에서 음의 해 하나가 생겨 서로 다른 두 점이에요."}},{"id":"c2","label":"교점 수의 점프로 두 높이를 식별해요","stepIds":["s4"],"question":"조건 (가)의 점프 크기 2는 어느 높이에서 생기나요?","hint":"오른쪽 포물선이 0개에서 2개로 바뀌는 꼭짓점 높이를 봐요.","explanation":"먼저 \\(b<1\\)이면 \\(b^2<b\\)이고, \\(t=b^2\\), \\(t=b\\) 어디에서도 조건 (나)의 좌우극한과 실제값 식이 맞지 않아요. \\(b=1\\)이면 \\(\\beta=1\\)에서 (나)는 맞지만 \\(g(\\alpha)=g(\\beta)=3\\)이 되어 (다)에 어긋나요. 따라서 \\(b>1\\)이고, 앞의 \\(c<b\\)와 합쳐 \\(c<b<b^2\\)예요. 양의 \\(t\\)가 \\(c\\)를 지날 때 전체 교점 수는 2에서 4로 뛰며 \\(t=c\\) 자체에서는 3이에요. 그래서 조건 (가)의 \\(\\alpha=c=b^2-a^2\\)예요. \\(t=b\\)에서는 좌우값이 4와 3이지만 조건 (나)의 식이 실제값 4와 맞지 않아요. \\(t=b^2\\)에서는 좌우값이 3과 2이고 \\(3-2+1=2=g(b^2)\\)이므로 \\(\\beta=b^2\\)예요. 실제로 \\(g(\\alpha)=3\\), \\(g(\\beta)=2\\)라 조건 (다)도 맞아요.","check":{"prompt":"\\(\\beta=b\\)가 조건 (나)에 실패하는 수를 써 보세요.","answer":"왼쪽 극한 4, 오른쪽 극한 3이라 식의 왼쪽은 \\(4-3+1=2\\)인데 \\(g(b)=4\\)여서 같지 않아요."}},{"id":"c3","label":"주어진 함숫값으로 두 매개변수를 정해요","stepIds":["s5","s6","s7"],"question":"\\(f(1/2)=\\alpha\\)에서 왜 \\(a=1/2\\)가 바로 나오나요?","hint":"\\(1/2>0\\)이므로 오른쪽 조각을 사용하고 \\(\\alpha=b^2-a^2\\)를 넣어요.","explanation":"\\(f(1/2)=1/4-a+b^2=b^2-a^2\\)이므로 \\(a^2-a+1/4=0\\), 즉 \\((a-1/2)^2=0\\)이에요. 따라서 \\(a=1/2\\)예요. 또 \\(\\alpha+24\\beta=(b^2-1/4)+24b^2=30\\)이므로 \\(25b^2=121/4\\), 양수 \\(b=11/10\\)이에요. 이 값들은 \\(a<b\\), \\(c=24/25<b<b^2=121/100\\)을 실제로 만족해요.","check":{"prompt":"\\(b^2=121/100\\)에서 왜 \\(b=-11/10\\)은 고려하지 않나요?","answer":"문제에서 \\(b\\)가 양수라고 했기 때문에 양의 제곱근만 골라요."}},{"id":"c4","label":"두 조각에 입력을 나누어 넣어요","stepIds":["s8","s9","s10"],"question":"\\(f(-2)\\)와 \\(f(1)\\)은 각각 어느 조각을 사용하나요?","hint":"입력의 부호로 정의를 나눠요.","explanation":"\\(-2\\le0\\)이므로 \\(f(-2)=|-a\\cdot4+b|=|-2+11/10|=9/10\\)이에요. \\(1>0\\)이므로 \\(f(1)=1-2a+b^2=1-1+121/100=121/100\\)이에요. 합은 \\(90/100+121/100=211/100\\)이고 서로소이므로 \\(p=100,q=211\\), \\(p+q=311\\)이에요.","check":{"prompt":"\\(211/100\\)이 이미 기약분수인 이유는 무엇인가요?","answer":"\\(211\\)은 2나 5로 나누어지지 않아 \\(100\\)과 공약수가 없어요."}}],"takeaway":["조각함수의 교점 수는 각 조각에서 따로 센 뒤 정의역 경계에서 빠지는 해를 확인해요.","교점 수 함수의 좌우극한은 꼭짓점 높이와 조각 경계 높이에서 따로 계산해요.","매개변수를 구한 뒤 처음 가정한 임계높이의 순서를 실제 수로 다시 확인해요."]};</script>
