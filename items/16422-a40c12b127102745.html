  <script>window.HandStudyRecord={"itemId":16422,"sourceLabel":"2019 교육청 고3 수리나형 4월 20번","adminYear":2019,"grade":3,"month":4,"number":20,"track":"수리나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"다음은 $40$ 이하의 서로 다른 두 자연수 $a$, $b$의 최대공약수가 $3$인 $a$, $b$의 모든 순서쌍 $(\\,a,\\,b)$의 개수를 구하는 과정이다.\n$40$ 이하의 서로 다른 두 자연수 $a$, $b$의 최대공약수가 $3$이므로 서로소인 두 자연수 $m$, $n$에 대하여 $a=3m$, $b=3n$이라 하면 $m$과 $n$은 $13$ 이하의 자연수이다.\n순서쌍 $(\\,a,\\,b)$를 선택하는 경우는 \n‘(ⅰ) 서로 다른 두 자연수 $m$, $n$을 선택하는 경우’에서 \n‘(ⅱ) 서로 다른 두 자연수 $m$과 $n$이 서로소가 아닌 경우’를 제외하면 된다.\n(ⅰ)의 경우 : \n$13$개의 자연수에서 서로 다른 두 자연수 $m$, $n$을 선택하는 경우의 수는 $\\, \\left. {\\boxed{\\vphantom{(}\\,(\\text{가}) \\,}} \\right.$이다.\n(ⅱ)의 경우 : \n$m$과 $n$이 $2$의 배수인 경우의 수는 ${}_{6} P_{2}$이고,\n$m$과 $n$이 $3$의 배수인 경우의 수는 ${}_{4} P_{2}$이고,\n$m$과 $n$이 $5$의 배수인 경우의 수는 ${}_{2} P_{2}$이다.\n이 때, $m$과 $n$이 $\\, \\left. {\\boxed{\\vphantom{(}\\,(\\text{나}) \\,}} \\right.$의 배수인 경우가 중복되므로 \n서로 다른 두 자연수 $m$과 $n$이 서로소가 아닌 경우의 수는 \n$\\, \\left. {\\boxed{\\vphantom{(}\\,(\\text{다}) \\,}} \\right.$이다.\n따라서 $40$ 이하의 서로 다른 두 자연수 $a$, $b$의 최대공약수가 $3$인 $a$, $b$의 모든 순서쌍 $(\\,a,\\,b)$의 개수는 \n$\\, \\left. {\\boxed{\\vphantom{(}\\,(\\text{가}) \\,}} \\right. \\,- \\left. {\\boxed{\\vphantom{(}\\,(\\text{다}) \\,}} \\right.$\n이다.\n위의 (가), (나), (다)에 알맞은 수를 각각 $p$, $q$, $r$라 할 때, \n$p+q+r$의 값은? [4점]\n① $192$ ② $196$ ③ $200$ ④ $204$ ⑤ $208$","answer":"④","sourceHash":"c13e44a33b80da990819e3589d8bdbe6931f8bab7fa60c9476233536b2f073da","steps":[{"id":"s1","latex":"a=3m,\\ b=3n\\Rightarrow1\\le m,n\\le13,\\quad m\\ne n"},{"id":"s2","latex":"p={}_{13}\\mathrm P_2=156"},{"id":"s3","latex":"2\\text{의 배수 쌍}=30,\\quad3\\text{의 배수 쌍}=12,\\quad5\\text{의 배수 쌍}=2"},{"id":"s4","latex":"2\\text{와 }3\\text{에서 중복되는 공배수는 }q=6"},{"id":"s5","latex":"r=30+12+2-2=42"},{"id":"s6","latex":"p+q+r=156+6+42=204"}],"diagram":null,"contentHash":"a69a858f95c2a2c1c2af8bea0c3584dfef8d1bff631e51695eb89c6be0ffe3a9","questionHtml":"\u003cp class=\"hp\">다음은 \u003cspan class=\"heq\">\\(40\\)\u003c/span> 이
