<script>window.HandStudyRecord={"itemId":16540,"sourceLabel":"2019 평가원 고3 수리가형 9월 20번","adminYear":2019,"grade":3,"month":9,"number":20,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 반지름의 길이가 $1$이고 중심각의 크기가 $\\frac{ \\pi}{2}$인 부채꼴 ${O A B}$가 있다. 호 ${A B}$ 위의 점 ${P}$에서 선분 ${O A}$에 내린 수선의 발을 ${H}$, 점 ${P}$에서 호 ${A B}$에 접하는 직선과 직선 ${O A}$의 교점을 ${Q}$라 하자. 점 ${Q}$를 중심으로 하고 반지름의 길이가 ${\\overline{QA}}$인 원과 선분 $PQ$의 교점을 $R$라 하자. $\\angle POA= \\theta$일 때, 삼각형 ${O H P}$의 넓이를 $f( \\theta)$, 부채꼴 ${Q R A}$의 넓이를 $g( \\theta)$라 하자. $\\lim_{ \\theta \\,->\\, 0 +}\\,\\frac{ \\sqrt{g( \\theta)}}{ \\theta ×f( \\theta)}$의 값은? (단, $0 \u003c \\theta \u003c \\frac{ \\pi}{2}$) [4점]\n① $\\frac{ \\sqrt{\\pi}}{5}$ ② $\\frac{ \\sqrt{\\pi}}{4}$ ③ $\\frac{ \\sqrt{\\pi}}{3}$ ④ $\\frac{ \\sqrt{\\pi}}{2}$ ⑤ $\\sqrt{\\pi}$","answer":"④","sourceHash":"4d93e141bad4fea736a27a3ccc8fe280123dc7f2e82e36953d6e691dc58fa092","steps":[{"id":"s1","latex":"O=(0,0),\\ A=(1,0),\\ P=(\\cos\\theta,\\sin\\theta),\\ H=(\\cos\\theta,0)"},{"id":"s2","latex":"f(\\theta)=\\frac12\\sin\\theta\\cos\\theta"},{"id":"s3","latex":"\\text{접선 }PQ:\\quad x\\cos\\theta+y\\sin\\theta=1\\Rightarrow Q=(\\sec\\theta,0)"},{"id":"s4","latex":"QA=\\sec\\theta-1,\\qquad\\angle RQA=\\frac\\pi2-\\theta"},{"id":"s5","latex":"g(\\theta)=\\frac12(\\sec\\theta-1)^2\\left(\\frac\\pi2-\\theta\\right)"},{"id":"s6","latex":"\\frac{\\sqrt{g(\\theta)}}{\\theta f(\\theta)}=\\frac{(\\sec\\theta-1)\\sqrt{(\\pi/2-\\theta)/2}}{\\theta\\sin\\theta\\cos\\theta/2}"},{"id":"s7","latex":"\\lim_{\\theta\\to0+}\\frac{\\sec\\theta-1}{\\theta^2}=\\frac12\\Rightarrow\\boxed{\\frac{\\sqrt\\pi}{2}}"}],"diagram":null,"contentHash":"0d7baa198a69ea87ff101998d2434e4c359085cdf9933c4e3725c5214c557e16","questionHtml":"\u003cp class=\"hp htall\">그림과 같이 반지름의 길이가 \u003cspan class=\"heq\">\\(1\\)\u003c/span>이고 중심각의 크기가 \u003cspan class=\"heq\">\\(\\dfrac{ \\pi}{2}\\)\u003c/span>인 부채꼴 \u003cspan class=\"heq\">\\({O A B}\\)\u003c/span>가 있다. 호
