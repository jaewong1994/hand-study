<script>window.HandStudyRecord={"itemId":16540,"sourceLabel":"2019 평가원 고3 수리가형 9월 20번","adminYear":2019,"grade":3,"month":9,"number":20,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 반지름의 길이가 $1$이고 중심각의 크기가 $\\frac{ \\pi}{2}$인 부채꼴 ${O A B}$가 있다. 호 ${A B}$ 위의 점 ${P}$에서 선분 ${O A}$에 내린 수선의 발을 ${H}$, 점 ${P}$에서 호 ${A B}$에 접하는 직선과 직선 ${O A}$의 교점을 ${Q}$라 하자. 점 ${Q}$를 중심으로 하고 반지름의 길이가 ${\\overline{QA}}$인 원과 선분 $PQ$의 교점을 $R$라 하자. $\\angle POA= \\theta$일 때, 삼각형 ${O H P}$의 넓이를 $f( \\theta)$, 부채꼴 ${Q R A}$의 넓이를 $g( \\theta)$라 하자. $\\lim_{ \\theta \\,->\\, 0 +}\\,\\frac{ \\sqrt{g( \\theta)}}{ \\theta ×f( \\theta)}$의 값은? (단, $0 \u003c \\theta \u003c \\frac{ \\pi}{2}$) [4점]\n① $\\frac{ \\sqrt{\\pi}}{5}$ ② $\\frac{ \\sqrt{\\pi}}{4}$ ③ $\\frac{ \\sqrt{\\pi}}{3}$ ④ $\\frac{ \\sqrt{\\pi}}{2}$ ⑤ $\\sqrt{\\pi}$","answer":"④","sourceHash":"4d93e141bad4fea736a27a3ccc8fe280123dc7f2e82e36953d6e691dc58fa092","steps":[{"id":"s1","latex":"O=(0,0),\\ A=(1,0),\\ P=(\\cos\\theta,\\sin\\theta),\\ H=(\\cos\\theta,0)"},{"id":"s2","latex":"f(\\theta)=\\frac12\\sin\\theta\\cos\\theta"},{"id":"s3","latex":"\\text{접선 }PQ:\\quad x\\cos\\theta+y\\sin\\theta=1\\Rightarrow Q=(\\sec\\theta,0)"},{"id":"s4","latex":"QA=\\sec\\theta-1,\\qquad\\angle RQA=\\frac\\pi2-\\theta"},{"id":"s5","latex":"g(\\theta)=\\frac12(\\sec\\theta-1)^2\\left(\\frac\\pi2-\\theta\\right)"},{"id":"s6","latex":"\\frac{\\sqrt{g(\\theta)}}{\\theta f(\\theta)}=\\frac{(\\sec\\theta-1)\\sqrt{(\\pi/2-\\theta)/2}}{\\theta\\sin\\theta\\cos\\theta/2}"},{"id":"s7","latex":"\\lim_{\\theta\\to0+}\\frac{\\sec\\theta-1}{\\theta^2}=\\frac12\\Rightarrow\\boxed{\\frac{\\sqrt\\pi}{2}}"}],"diagram":null,"contentHash":"0d7baa198a69ea87ff101998d2434e4c359085cdf9933c4e3725c5214c557e16","questionHtml":"\u003cp class=\"hp htall\">그림과 같이 반지름의 길이가 \u003cspan class=\"heq\">\\(1\\)\u003c/span>이고 중심각의 크기가 \u003cspan class=\"heq\">\\(\\dfrac{ \\pi}{2}\\)\u003c/span>인 부채꼴 \u003cspan class=\"heq\">\\({O A B}\\)\u003c/span>가 있다. 호 \u003cspan class=\"heq\">\\({A B}\\)\u003c/span> 위의 점 \u003cspan class=\"heq\">\\({P}\\)\u003c/span>에서 선분 \u003cspan class=\"heq\">\\({O A}\\)\u003c/span>에 내린 수선의 발을 \u003cspan class=\"heq\">\\({H}\\)\u003c/span>, 점 \u003cspan class=\"heq\">\\({P}\\)\u003c/span>에서 호 \u003cspan class=\"heq\">\\({A B}\\)\u003c/span>에 접하는 직선과 직선 \u003cspan class=\"heq\">\\({O A}\\)\u003c/span>의 교점을 \u003cspan class=\"heq\">\\({Q}\\)\u003c/span>라 하자. 점 \u003cspan class=\"heq\">\\({Q}\\)\u003c/span>를 중심으로 하고 반지름의 길이가 \u003cspan class=\"heq\">\\({\\overline{QA}}\\)\u003c/span>인 원과 선분 \u003cspan class=\"heq\">\\(PQ\\)\u003c/span>의 교점을 \u003cspan class=\"heq\">\\(R\\)\u003c/span>라 하자. \u003cspan class=\"heq\">\\(\\angle POA= \\theta\\)\u003c/span>일 때, 삼각형 \u003cspan class=\"heq\">\\({O H P}\\)\u003c/span>의 넓이를 \u003cspan class=\"heq\">\\(f( \\theta)\\)\u003c/span>, 부채꼴 \u003cspan class=\"heq\">\\({Q R A}\\)\u003c/span>의 넓이를 \u003cspan class=\"heq\">\\(g( \\theta)\\)\u003c/span>라 하자.\u003cbr>\u003cspan class=\"heq\">\\(\\lim\\limits_{ \\theta \\,\\to \\, 0 +}\\,\\dfrac{ \\sqrt{g( \\theta)}}{ \\theta \\times f( \\theta)}\\)\u003c/span>의 값은? (단, \u003cspan class=\"heq\">\\(0 \\lt  \\theta \\lt  \\dfrac{ \\pi}{2}\\)\u003c/span>) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp htall\">① \u003cspan class=\"heq\">\\(\\dfrac{ \\sqrt{\\pi}}{5}\\)\u003c/span>&emsp;② \u003cspan class=\"heq\">\\(\\dfrac{ \\sqrt{\\pi}}{4}\\)\u003c/span>&emsp;③ \u003cspan class=\"heq\">\\(\\dfrac{ \\sqrt{\\pi}}{3}\\)\u003c/span>&emsp;④ \u003cspan class=\"heq\">\\(\\dfrac{ \\sqrt{\\pi}}{2}\\)\u003c/span>&emsp;⑤ \u003cspan class=\"heq\">\\(\\sqrt{\\pi}\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/eff436a6f354553d32e3cac9.png\" style=\"width:246px;max-width:100%\">\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"ac921762c596605a4f15725b879400a36d6c0b2fa49a500434b9f878bd71a1a7"};</script>
<script>window.HandStudyGuide={"itemId":16540,"sourceHash":"4d93e141bad4fea736a27a3ccc8fe280123dc7f2e82e36953d6e691dc58fa092","contentHash":"0d7baa198a69ea87ff101998d2434e4c359085cdf9933c4e3725c5214c557e16","overview":{"goal":"단위원 위 점의 좌표와 접선으로 두 넓이를 나타내고, 기본 삼각함수 극한으로 비의 극한을 계산해요.","firstLook":"\\(OA\\)를 \\(x\\)축으로 두면 \\(P=(\\cos\\theta,\\sin\\theta)\\)예요. 접선의 축 절편에서 작은 부채꼴의 반지름과 중심각을 읽어요.","conditions":[{"label":"삼각형 넓이","meaning":"밑변 \\(OH=\\cos\\theta\\), 높이 \\(PH=\\sin\\theta\\)예요."},{"label":"접선","meaning":"단위원의 \\(P\\)에서 접선은 \\(x\\cos\\theta+y\\sin\\theta=1\\)이에요."},{"label":"극한 방향","meaning":"\\(0<\\theta<\\pi/2\\)에서 모든 길이와 제곱근이 양수예요."}]},"chapters":[{"id":"c1","label":"좌표로 첫 넓이와 접점을 적어요","stepIds":["s1","s2","s3"],"question":"접선이 \\(x\\)축과 만나는 점 \\(Q\\)의 좌표는 무엇인가요?","hint":"접선식에서 \\(y=0\\)을 넣어요.","explanation":"반지름이 1이므로 \\(P=(\\cos\\theta,\\sin\\theta)\\), \\(H=(\\cos\\theta,0)\\)예요. 따라서 \\(f(\\theta)=\\sin\\theta\\cos\\theta/2\\)예요. 단위원의 점 \\(P\\)에서 접선은 \\(x\\cos\\theta+y\\sin\\theta=1\\)이고, \\(y=0\\)을 넣으면 \\(Q=(\\sec\\theta,0)\\)예요.","check":{"prompt":"삼각형 \\(OHP\\)의 두 직각변은 무엇인가요?","answer":"\\(OH=\\cos\\theta\\), \\(PH=\\sin\\theta\\)이므로 넓이는 두 길이의 곱의 절반이에요."}},{"id":"c2","label":"작은 부채꼴의 반지름과 중심각을 구해요","stepIds":["s4","s5"],"question":"\\(\\angle RQA\\)가 \\(\\pi/2-\\theta\\)인 이유는 무엇일까요?","hint":"접선 \\(PQ\\)는 반지름 \\(OP\\)와 수직이고, \\(QA\\)는 \\(OA\\)와 같은 직선 위예요.","explanation":"\\(Q\\)와 \\(A=(1,0)\\)은 \\(x\\)축 위이므로 반지름 \\(QA=\\sec\\theta-1\\)이에요. 또 \\(QP\\perp OP\\)이고 \\(OP\\)가 \\(x\\)축과 이루는 각이 \\(\\theta\\)이므로 \\(QP\\)와 왼쪽 방향의 \\(QA\\)가 이루는 작은 각은 \\(\\pi/2-\\theta\\)예요. 따라서 부채꼴 넓이는 \\(g(\\theta)=(\\sec\\theta-1)^2(\\pi/2-\\theta)/2\\)예요.","check":{"prompt":"\\(QA\\)가 양수인 이유는 무엇인가요?","answer":"\\(0<\\theta<\\pi/2\\)에서 \\(\\cos\\theta<1\\)이므로 \\(\\sec\\theta>1\\)이기 때문이에요."}},{"id":"c3","label":"기본 극한을 분리해 계산해요","stepIds":["s6","s7"],"question":"핵심 비 \\((\\sec\\theta-1)/\\theta^2\\)의 극한을 어떻게 구할까요?","hint":"\\(\\sec\\theta-1=(1-\\cos\\theta)/\\cos\\theta\\)로 바꿔요.","explanation":"식을 정리하면\n\n\\(\\dfrac{\\sqrt{g(\\theta)}}{\\theta f(\\theta)}=\\dfrac{2(\\sec\\theta-1)}{\\theta^2}\\cdot\\dfrac{\\theta}{\\sin\\theta}\\cdot\\dfrac1{\\cos\\theta}\\cdot\\sqrt{\\dfrac{\\pi/2-\\theta}{2}}\\)\n\n예요. \\((\\sec\\theta-1)/\\theta^2=(1-\\cos\\theta)/(\\theta^2\\cos\\theta)\\to1/2\\), \\(\\theta/\\sin\\theta\\to1\\), \\(\\cos\\theta\\to1\\), 마지막 제곱근은 \\(\\sqrt\\pi/2\\)로 가요. 모두 곱하면 \\(\\sqrt\\pi/2\\), 선택지 ④예요.","check":{"prompt":"마지막 제곱근의 극한이 왜 \\(\\sqrt\\pi/2\\)인가요?","answer":"\\((\\pi/2-\\theta)/2\\to\\pi/4\\)이므로 그 양의 제곱근은 \\(\\sqrt{\\pi/4}=\\sqrt\\pi/2\\)예요."}}],"takeaway":["원 위 점과 접선은 좌표와 수직 관계로 절편과 각을 구해요.","부채꼴 넓이에서는 반지름의 제곱과 중심각을 모두 확인해요.","복잡한 극한은 기본 삼각함수 극한이 보이도록 여러 비의 곱으로 분리해요."]};</script>
