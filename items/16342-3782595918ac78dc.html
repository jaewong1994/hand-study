<script>window.HandStudyRecord={"itemId":16342,"sourceLabel":"2019 교육청 고3 수리가형 7월 30번","adminYear":2019,"grade":3,"month":7,"number":30,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"$x=a\\,\\left(a>0 \\right)\\,$에서 극댓값을 갖는 사차함수 $f \\left(x \\right)\\,$에 대하여 함수 $g \\left(x \\right)\\,$가 $g \\left( x \\right) = {\\begin{cases}\\frac{1-\\cos \\pi x}{f \\left( x \\right)}&\\, \\left( f \\left( x \\right) != 0 \\right) \\\\ & \\\\ \\, \\frac{7}{128} \\pi ^{2}&\\, \\left( f \\left( x \\right) =0 \\right)\\end{cases}}$ 일 때, 함수 $g \\left(x \\right)\\,$는 실수 전체의 집합에서 미분가능하고 다음 조건을 만족시킨다. \n(가) $g' \\left( 0 \\right) \\times g' \\left( 2a \\right) != 0\\,$ (나) 함수 $g \\left( x \\right) \\,$는 $x=a\\,$에서 극값을 갖는다.\n$g \\left( 1 \\right) = \\frac{2}{7} \\,$일 때, $g \\left( -1 \\right) = \\frac{q}{p} \\,$이다. $p+q\\,$의 값을 구하시오. (단, $p\\,$와 $q\\,$는 서로소인 자연수이다.) [4점]","answer":"95","sourceHash":"6d7953788d8e563ee5b5e2b6a46eac2a2ba8b54f33ffcdc874f82723d2ccc9c2","steps":[{"id":"s1","latex":"g\\text{의 }0\\text{에서 미분 가능}\\Rightarrow f(x)=kx^2h(x)"},{"id":"s2","latex":"g'(a)=0,\\ f'(a)=0\\Rightarrow\\sin a\\pi=0,\\ f(2a)=0"},{"id":"s3","latex":"f(x)=kx^2(x-2a)^2,\\quad k>0"},{"id":"s4","latex":"\\lim_{x\\to0}g(x)=\\frac{\\pi^2}{8ka^2}=\\frac7{128}\\pi^2\\Rightarrow ka^2=\\frac{16}{7}"},{"id":"s5","latex":"g(1)=\\frac2{k(1-2a)^2}=\\frac27\\Rightarrow k(1-2a)^2=7"},{"id":"s6","latex":"a\\in\\mathbb N\\Rightarrow a=4,\\ k=\\frac17"},{"id":"s7","latex":"g(-1)=\\frac{14}{81}\\Rightarrow p+q=95"}],"diagram":null,"contentHash":"2e02f812484886d106c5f0e3f2f6971f88909d6cfbe993a97286846fc6e288d5","questionHtml":"\u003cp class=\"hp htall\">\u003cspan class=\"heq\">\\(x=a\\,\\left(a\\gt 0 \\right)\\,\\)\u003c/span>에서 극댓값을 갖는 사차함수 \u003cspan class=\"heq\">\\(f \\left(x \\right)\\,\\)\u003c/span>에 대하여 함수 \u003cspan class=\"heq\">\\(g \\left(x \\right)\\,\\)\u003c/span>가 \u003cbr>\u003cbr>     \u003cspan class=\"heq\">\\(g \\left( x \\right) = {\\begin{cases}\\dfrac{1-\\cos \\pi x}{f \\left( x \\right)}&\\, \\left( f \\left( x \\right)  \\neq  0 \\right) \\\\ & \\\\ \\, \\dfrac{7}{128} \\pi^{2}&\\, \\left( f \\left( x \\right) =0 \\right)\\end{cases}}\\)\u003c/span>\u003cbr>\u003cbr>일 때, 함수 \u003cspan class=\"heq\">\\(g \\left(x \\right)\\,\\)\u003c/span>는 실수 전체의 집합에서 미분가능하고 \u003cbr>다음 조건을 만족시킨다.\u003c/p>\u003ctable class=\"htbl\">\u003ctr>\u003ctd colspan=\"3\" style=\"width:410px;border-top:1px solid #333;border-bottom:none;border-left:1px solid #333;border-right:1px solid #333\">&nbsp;\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"width:8px;border-top:none;border-bottom:none;border-left:1px solid #333;border-right:none\">&nbsp;\u003c/td>\u003ctd style=\"width:393px;border-top:none;border-bottom:none;border-left:none;border-right:none\">\u003cp class=\"hp\">(가) \u003cspan class=\"heq\">\\(g' \\left( 0 \\right) \\times g' \\left( 2a \\right)  \\neq  0\\,\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">(나) 함수 \u003cspan class=\"heq\">\\(g \\left( x \\right) \\,\\)\u003c/span>는 \u003cspan class=\"heq\">\\(x=a\\,\\)\u003c/span>에서 극값을 갖는다.\u003c/p>\u003c/td>\u003ctd style=\"width:8px;border-top:none;border-bottom:none;border-left:none;border-right:1px solid #333\">&nbsp;\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"3\" style=\"width:410px;border-top:none;border-bottom:1px solid #333;border-left:1px solid #333;border-right:1px solid #333\">&nbsp;\u003c/td>\u003c/tr>\u003c/table>\u003cp class=\"hp htall\">\u003cspan class=\"heq\">\\(g \\left( 1 \\right) = \\dfrac{2}{7} \\,\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(g \\left( -1 \\right) = \\dfrac{q}{p} \\,\\)\u003c/span>이다. \u003cspan class=\"heq\">\\(p+q\\,\\)\u003c/span>의 값을 구하시오.\u003cbr>(단, \u003cspan class=\"heq\">\\(p\\,\\)\u003c/span>와 \u003cspan class=\"heq\">\\(q\\,\\)\u003c/span>는 서로소인 자연수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"3782595918ac78dca9922afd4171e259345883c52473fd3fe0e42122f061e56f"};</scr <script>window.HandStudyGuide={"itemId":16342,"sourceHash":"6d7953788d8e563ee5b5e2b6a46eac2a2ba8b54f33ffcdc874f82723d2ccc9c2","contentHash":"2e02f812484886d106c5f0e3f2f6971f88909d6cfbe993a97286846fc6e288d5","overview":{"goal":"분수함수가 영점에서도 미분가능하려면 분모가 어떤 근을 가져야 하는지 찾아 사차함수 \\(f\\)를 정해요.","firstLook":"\\(1-\\cos\\pi x\\)는 짝수 정수 근처에서 거리의 제곱처럼 작아져요. 그런데 \\(g'\\)가 \\(0\\)이 아니려면 분모 \\(f\\)도 그 점에서 함께 \\(0\\)이어야 해요.","conditions":[{"label":"전체 미분가능","meaning":"\\(f(x)=0\\)인 점에서도 분수식의 극한과 지정된 값이 맞고 기울기도 이어져야 해요."},{"label":"(가)","meaning":"\\(0\\)과 \\(2a\\)에서 \\(g'\\)가 모두 \\(0\\)이 아니므로 두 점에서 분자만 0이 되어서는 안 돼요."},{"label":"(나)","meaning":"\\(f'(a)=0\\)와 \\(g'(a)=0\\)을 함께 써 \\(a\\)가 정수임을 얻어요."}]},"chapters":[{"id":"c1","label":"0과 2a를 f의 근으로 만들어요","stepIds":["s1","s2","s3"],"question":"\\(g'(0)\ne0\\)과 \\(g'(2a)\ne0\\)은 왜 \\(f(x)=kx^2(x-2a)^2\\)를 만들까요?","hint":"분자 \\(1-\\cos\\pi x\\)가 짝수 정수에서 어떻게 작아지는지와, 분모가 0이 아닐 때의 기울기를 봐요.","explanation":"\\(f(0)\ne0\\)이면 \\(1-\\cos\\pi x\\)가 \\(x^2\\)에 비례해 작아져 \\(g'(0)=0\\)이 되므로 조건에 어긋나요. 따라서 \\(f(0)=0\\)이고, \\(g\\)가 유한한 값으로 미분가능하려면 \\(f\\)에는 \\(x^2\\)가 곱해져야 해요.\n\n또 \\(f\\)가 \\(a\\)에서 극댓값을 가져 \\(f'(a)=0\\)이고 \\(g\\)도 \\(a\\)에서 극값을 가지므로, 몫을 미분한 식에서 \\(\\sin\\pi a=0\\)을 얻어요. \\(a>0\\)이므로 \\(a\\)는 양의 정수이고 \\(2a\\)는 짝수 정수예요. \\(2a\\)에서도 분자만 0이면 \\(g'(2a)=0\\)이 되므로 \\(f(2a)=0\\)이어야 하고, 같은 미분가능성 때문에 \\((x-2a)^2\\)가 곱해져요. \\(f\\)는 사차함수라 \\(f(x)=kx^2(x-2a)^2\\)이고, \\(a\\)에서 극대이므로 \\(k>0\\)이에요.","check":{"prompt":"\\(a\\)가 정수라는 결론에서 \\(a>0\\) 조건은 어떤 역할을 하나요?","answer":"\\(\\sin\\pi a=0\\)은 정수 전체를 주지만, 문제의 양의 상수 조건 때문에 양의 정수만 남겨요."}},{"id":"c2","label":"0에서의 극한으로 계수 관계를 얻어요","stepIds":["s4"],"question":"\\(g(0)=7\\pi^2/128\\)은 \\(k,a\\)에 어떤 식을 줄까요?","hint":"\\(1-\\cos\\pi x\\)를 \\((\\pi^2/2)x^2\\)와 비교하고 분모의 나머지 인수를 \\(x=0\\)에 넣어요.","explanation":"\\(x\\to0\\)일 때 \\((1-\\cos\\pi x)/x^2\\to\\pi^2/2\\)이고 \\((x-2a)^2\\to4a^2\\)예요. 따라서 \\(g(x)\\)의 극한은 \\(\\pi^2/(8ka^2)\\)이고 지정된 값 \\(7\\pi^2/128\\)과 같아요. 약분하면 \\(ka^2=16/7\\)이에요.","check":{"prompt":"이 계산에서 \\(\\pi^2\\)를 약분해도 되는 이유는 무엇인가요?","answer":"\\(\\pi^2\\)는 0이 아닌 양수이고 양변에 공통으로 곱해져 있기 때문이에요."}},{"id":"c3","label":"g(1)로 양의 정수 a를 확정해요","stepIds":["s5","s6","s7"],"question":"두 계수 관계와 \\(a\\)가 양의 정수라는 조건은 어떻게 \\(a=4\\)를 정할까요?","hint":"\\(g(1)=2/7\\)에서 \\(k(1-2a)^2=7\\)을 얻고 앞 식으로 나누어요.","explanation":"\\(1-\\cos\\pi=2\\)이므로 \\(g(1)=2/[k(1-2a)^2]=2/7\\), 즉 \\(k(1-2a)^2=7\\)이에요. 이를 \\(ka^2=16/7\\)과 나누면 \\((1-2a)^2/a^2=49/16\\)이에요. \\(a\\)가 양의 정수인 경우를 풀면 \\(a=4\\)이고, \\(k=1/7\\)이에요. 따라서 \\(f(-1)=k(-1)^2(-1-8)^2=81/7\\)이고 \\(g(-1)=2/(81/7)=14/81\\)이에요. \\(p=81,q=14\\)이므로 \\(p+q=95\\)예요.","check":{"prompt":"\\(g(-1)\\)의 분자도 \\(2\\)인 이유는 무엇인가요?","answer":"\\(\\cos(-\\pi)=\\cos\\pi=-1\\)이므로 \\(1-\\cos(-\\pi)=2\\)이기 때문이에요."}}],"takeaway":["분자와 분모가 함께 0이 되는 조각함수는 극한값뿐 아니라 도함숫값까지 조건과 맞는지 확인해요.","삼각함수의 영점 위치와 다항함수의 극값 조건을 함께 쓰면 매개변수가 정수로 좁혀질 수 있어요.","두 계수 관계를 나누어 공통 계수를 없앤 뒤 원래의 양수·정수 조건으로 후보를 결정해요."]};</script>
