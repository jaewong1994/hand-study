  <script>window.HandStudyRecord={"adminYear":2024,"answer":"③","contentHash":"a0cd81bcbed5c31ae9b9881e057887c92ccaeb3d5422e30788dcf82c5b4fdf34","diagram":null,"editionHash":"49e980ec1da6583eb3aa84d09b5ed31baad0d032b04cd674845025e84a34a6f5","grade":3,"graphHash":"","graphPlan":null,"itemId":18086,"learningHash":"7d12b64a1f83cce50217c3b34d56a69f5ced5062e438ff7e02710ed19bae4f4d","month":9,"number":28,"points":4,"preview":false,"questionHtml":"\u003cp class=\"hp\">함수 \u003cspan class=\"heq\">\\(f(x)\\,\\)\u003c/span>는 실수 전체의 집합에서 연속인 이계도함수를 갖고, 실수 전체의 집합에서 정의된 함수 \u003cspan class=\"heq\">\\(g(x)\\,\\)\u003c/span>를\u003c/p>\u003cp class=\"hp\">&emsp;\u003cspan class=\"heq\">\\(g \\left( x \\right) =f' \\left( 2x \\right) \\,\\sin\\, \\pi x+x\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">라 하자. 함수 \u003cspan class=\"heq\">\\(g(x)\\,\\)\u003c/span>는 역함수 \u003cspan class=\"heq\">\\(g^{-1}(x)\\,\\)\u003c/span>를 갖고,\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\(\\int_{0}^{1} {} g^{\\,-1} \\left( x \\right) \\,dx=2 \\int_{0}^{1} {} f' \\left( 2x \\right) \\,\\sin\\, \\pi x\\,dx+ \\dfrac{1}{4}\\)\u003c/span>\u003c/p>\u003cp class=\"hp htall\">을 만족시킬 때, \u003cspan class=\"heq\">\\(\\int_{0}^{2} {} f \\left( x \\right) \\,\\cos\\, \\dfrac{\\pi }{2} x\\,dx\\,\\)\u003c/span>의 값은? \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp htall\">① \u003cspan class=\"heq\">\\(-\\dfrac{1}{ \\pi}\\)\u003c/span>&emsp;② \u003cspan class=\"heq\">\\(-\\dfrac{1}{2 \\pi}\\)\u003c/span>&emsp;③ \u003cspan class=\"heq\">\\(-\\dfrac{1}{3 \\pi}\\)\u003c/span>\u003c/p>\u003cp class=\"hp htall\">④ \u003cspan class=\"heq\">\\(-\\dfrac{1}{4 \\pi}\\)\u003c/span>&emsp;⑤ \u003cspan class=\"heq\">\\(-\\dfrac{1}{5 \\pi}\\)\u003c/span>\u003c/p>","questionText":"함수 $f(x)\\,$는 실수 전체의 집합에서 연속인 이계도함수를 갖고, 실수 전체의 집합에서 정의된 함수 $g(x)\\,$를\n $g \\left( x \\right) =f' \\left( 2x \\right) \\,\\sin\\, \\pi x+x$\n라 하자. 함수 $g(x)\\,$는 역함수 $g^{-1}(x)\\,$를 갖고, \n $\\int _{0} ^{1} {} g ^{\\,-1} \\left( x \\right) \\,dx=2 \\int _{0} ^{1} {} f' \\left( 2x \\right) \\,\\sin\\, \\pi x\\,dx+ \\frac{1}{4}$\n을 만족시킬 때, $\\int _{0} ^{2} {} f \\left( x \\right) \\,\\cos\\, \\frac{\\pi }{2} x\\,dx\\,$의 값은? [4점]\n① $-\\frac{1}{ \\pi}$ ② $-\\frac{1}{2 \\pi}$ ③ $-\\frac{1}{3 \\pi}$\n④ $-\\frac{1}{4 \\pi}$ ⑤ $-\\frac{1}{5 \\pi}$","scoreStatus":"confirmed_4_direct","sourceHash":"ff414d84934a23aa9591795dd098f9e9a3d2120f6fa6ed88890f466ba4478dc8","sourceLabel":"2024 평가원 고3 수학미적분 9월 28번","stepExplanations":{"s3":{"body":"\\(g(0)=0,g(1)=1\\)이고 연속인 \\(g\\)가 역함수를 가지므로 이 구간에서 증가해요. 따라서 두 그래프의 넓이 관계에서 \\(\\int_0^1g^{-1}(x)\\,dx+\\int_0^1g(x)\\,dx=1\\)입니다. \\(g(x)\\)의 식을 적분하면 \\(A+\\frac12\\)이므로 역함수의 적분은 \\(\\frac12-A\\)가 돼요.","skillTags":["integration.inverse-function"],"title":"역함수와 원래 함수의 넓이를 더해요"},"s5":{"body":"부분적분에서 \\(u=\\sin\\pi x\\), \\(dv=f^{\\prime}(2x)\\,dx\\)로 정해요. 그러면 \\(du=\\pi\\cos\\pi x\\,dx\\), \\(v=\\frac12f(2x)\\)입니다. 끝점 항 \\([\\frac12f(2x)\\sin\\pi x]_0^1\\)은 사인값 때문에 0이에요. 그래서 \\(A=-\\frac\\pi2\\int_0^1f(2x)\\cos\\pi x\\,dx\\)만 남습니다.","skillTags":["integration.by-parts","integration.reverse-chain-rule"],"title":"f′(2x)를 적분하면 1/2이 붙어요"},"s6":{"body":"구하려는 적분에서 \\(x=2u\\)로 놓으면 \\(dx=2\\,du\\), 구간 \\([0,2]\\)는 \\([0,1]\\)이에요. 이때 \\(\\cos\\frac{\\pi x}{2}=\\cos\\pi u\\)이므로 바로 앞 적분의 두 배가 됩니다. 앞에서 \\(A=\\frac1{12}\\)였으니 결과는 \\(-\\frac4\\pi A=-\\frac1{3\\pi}\\)예요.","skillTags":["integration.substitution","integration.bounds"],"title":"구하려는 식과 같은 구간으로 바꿔요"}},"steps":[{"id":"s1","latex":"g(0)=0,\\quad g(1)=1\\Rightarrow g^{-1}(0)=0,\\ g^{-1}(1)=1"},{"id":"s2","latex":"A=\\int_0^1f'(2x)\\sin\\pi x\\,dx"},{"id":"s3","latex":"\\int_0^1g^{-1}(x)dx=1-\\int_0^1g(x)dx=\\dfrac12-A"},{"id":"s4","latex":"\\dfrac12-A=2A+\\dfrac14\\Rightarrow A=\\dfrac1{12}"},{"id":"s5","latex":"A=-\\dfrac\\pi2\\int_0^1f(2x)\\cos\\pi x\\,dx"},{"id":"s6","latex":"\\int_0^2f(x)\\cos\\dfrac{\\pi x}{2}dx=2\\int_0^1f(2u)\\cos\\pi u\\,du=-\\dfrac1{3\\pi}"}],"track":"미적분"};</script>
