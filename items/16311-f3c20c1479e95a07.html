">\\(\\dfrac{\\left| {\\overrightarrow{PA}} + {\\overrightarrow{PB}} \\right|}{\\left| {\\overrightarrow{PA}} - {\\overrightarrow{PB}} \\right|} =2\\,\\)<\/span>이고, <span class=\"heq\">\\({\\overrightarrow{PB}} \\,  \\cdot  {\\overrightarrow{PC}} \\,\\)<\/span>의 최댓값이 20이다.<\/p><\/div><\/p><p class=\"hp\">선분 <span class=\"heq\">\\(AB\\,\\)<\/span>의 길이가 <span class=\"heq\">\\(\\sqrt{p} -q\\)<\/span>일 때, <span class=\"heq\">\\(p+q\\,\\)<\/span>의 값을 구하시오.<br>(단, <span class=\"heq\">\\(p\\,,\\,q\\,\\)<\/span>는 자연수이다.) <span class=\"hscore\">[4점]<\/span><\/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"e3fd9067cb87c48d1f90961ec1d38b72ab819c6bca6281099ed781b3fb585f27"};</script>

d\\)의 벡터로 잡을 수 있어요."}},{"id":"c4","label":"길이와 답을 정해요","stepIds":["s6","s7"],"question":"이차방정식의 어느 근을 택할까요?","hint":"\\(d\\)는 길이예요.","explanation":"\\(d^2+4d=20\\)에서 \\((d+2)^2=24\\)이므로 \\(d=\\sqrt{24}-2\\)예요. 음의 근은 길이가 될 수 없어요. 따라서 \\(p=24,q=2\\), \\(p+q=26\\)이에요.","check":{"prompt":"음의 근을 버리는 근거는 무엇인가요?","answer":"\\(d=|AB|\\)는 양수이기 때문이에요."}}],"takeaway":["중점 벡터는 자취를 원으로 바꿔요.","내적 최댓값은 방향의 등호 가능성까지 확인해요.","근을 구한 뒤 원래 양의 범위를 적용해요."]};</script>
