<script>window.HandStudyRecord={"itemId":17521,"sourceLabel":"2022 평가원 고3 수학확통 6월 30번","adminYear":2022,"grade":3,"month":6,"number":30,"track":"확통","points":4,"scoreStatus":"confirmed_4_direct","questionText":"주머니에 $1$부터 $12$까지의 자연수가 각각 하나씩 적혀 있는 $12$개의 공이 들어 있다. 이 주머니에서 임의로 $3$개의 공을 동시에 꺼내어 공에 적혀 있는 수를 작은 수부터 크기 순서대로 $a,\\,b,\\,c$라 하자. $b-a \\geq 5$일 때, $c-a \\geq 10$일 확률은 $\\frac{q}{p}$이다. $p+q$의 값을 구하시오. (단, $p$와 $q$는 서로소인 자연수이다.) [4점]","answer":"9","sourceHash":"1ede09e045ef7d3d72fa58730e9fd985840285f5766ca8d09fb36880501e78b4","steps":[{"id":"s1","latex":"A=\\{b-a\\ge5\\},\\quad B=\\{c-a\\ge10\\},\\quad b'=b-4,\\ c'=c-4"},{"id":"s2","latex":"A\\iff1\\le a\u003cb'\u003cc'\\le8\\Rightarrow|A|={}_8\\mathrm C_3=56"},{"id":"s3","latex":"A\\cap B:\\quad c'-a\\ge6\\Rightarrow(a,c')=(1,7),(1,8),(2,8)"},{"id":"s4","latex":"|A\\cap B|=5+6+5=16\\Rightarrow P(B\\mid A)=16/56=2/7"},{"id":"s5","latex":"p+q=9"}],"diagram":null,"contentHash":"5b1d1df340131ddbbe2cb18af8aa2fd0ef68360875291b53acd838dbe141132d","questionHtml":"\u003cp class=\"hp htall\">주머니에 \u003cspan class=\"heq\">\\(1\\)\u003c/span>부터 \u003cspan class=\"heq\">\\(12\\)\u003c/span>까지의 자연수가 각각 하나씩 적혀 있는 \u003cspan class=\"heq\">\\(12\\)\u003c/span>개의 공이 들어 있다. 이 주머니에서 임의로 \u003cspan class=\"heq\">\\(3\\)\u003c/span>개의 공을 동시에 꺼내어 공에 적혀 있는 수를 작은 수부터 크기 순서대로 \u003cspan class=\"heq\">\\(a,\\,b,\\,c\\)\u003c/span>라 하자. \u003cspan class=\"heq\">\\(b-a \\geq 5\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(c-a \\geq 10\\)\u003c/span>일 확률은 \u003cspan class=\"heq\">\\(\\dfrac{q}{p}\\)\u003c/span>이다. \u003cspan class=\"heq\">\\(p+q\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(p\\)\u003c/span>와 \u003cspan class=\"heq\">\\(q\\)\u003c/span>는 서로소인 자연수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"a44805962d8e7fa1b7d319e4badd16177e4f1de23bd36d41252cb981c8d4b7b9"};</script>
<script>window.HandStudyGuide={"itemId":17521,"sourceHash":"1ede09e045ef7d3d72fa58730e9fd985840285f5766ca8d09fb36880501e78b4","contentHash":"5b1d1df340131ddbbe2cb18af8aa2fd0ef68360875291b53acd838dbe141132d","overview":{"goal":"주어진 간격 조건을 만족하는 세 수를 치환으로 세고, 더 큰 간격 조건을 추가한 경우를 다시 세어요.","firstLook":"\\(b-a\\ge5\\)의 간격 4를 미리 줄여 \\(b'=b-4,c'=c-4\\)로 바꾸면 보통의 세 수 선택이 돼요.","conditions":[{"label":"조건 사건","meaning":"작은 두 수의 차가 적어도 5예요."},{"label":"목표 사건","meaning":"가장 큰 수와 가장 작은 수의 차가 적어도 10이에요."}]},"chapters":[{"id":"c1","label":"조건 사건을 조합으로 세어요","stepIds":["s1","s2"],"question":"왜 \\(a<b'<c'\\)가 되나요?","hint":"\\(b'=b-4,c'=c-4\\)를 각 부등식에 넣어요.","explanation":"\\(b-a\\ge5\\)는 \\(a<b-4=b'\\)와 같아요. 또 \\(b<c\\)이면 \\(b'<c'\\)이고, \\(c\\le12\\)에서 \\(c'\\le8\\)이에요. 반대로 \\(1\\le a<b'<c'\\le8\\)을 고르면 \\(b=b'+4,c=c'+4\\)가 원래 조건을 만족해요. 따라서 조건 사건 A의 경우는 1부터 8에서 세 수를 고르는 \\({}_8\\mathrm C_3=56\\)가지예요.","check":{"prompt":"이 치환이 되돌릴 수 있어 중복이 없다는 역변환은 무엇인가요?","answer":"\\(b=b'+4,c=c'+4\\)예요."}},{"id":"c2","label":"큰 간격을 만족하는 끝값을 골라요","stepIds":["s3","s4"],"question":"\\(c-a\\ge10\\)은 치환 뒤 어떤 조건인가요?","hint":"\\(c=c'+4\\)를 넣어요.","explanation":"\\(c-a\\ge10\\)은 \\(c'-a\\ge6\\)이에요. \\(1\\le a<c'\\le8\\)에서 가능한 끝값은 \\((a,c')=(1,7),(1,8),(2,8)\\)뿐이에요. 각 끝값 사이에서 b'를 고르는 수는 차례로 5,6,5가지라 교집합은 \\(16\\)가지예요. 끝점 자체는 b'로 고를 수 없고 그 사이 정수만 세었다는 점이 중요해요.","check":{"prompt":"\\((a,c')=(1,7)\\)일 때 b'는 몇 가지인가요?","answer":"\\(2,3,4,5,6\\)의 다섯 가지예요."}},{"id":"c3","label":"조건부확률을 기약해요","stepIds":["s5"],"question":"분모와 분자에는 각각 어떤 경우 수가 들어가나요?","hint":"이미 \\(b-a\\ge5\\)라고 주어졌어요.","explanation":"분모는 조건 사건 A의 56가지, 분자는 두 조건을 함께 만족하는 16가지예요. 따라서 확률은 \\(16/56=2/7\\)이고 \\(p+q=7+2=9\\)예요.","check":{"prompt":"전체 \\({}_{12}\\mathrm C_3\\)로 나누지 않는 이유는 무엇인가요?","answer":"\\(b-a\\ge5\\)라는 조건 아래의 확률이므로 분모도 그 조건을 만족하는 경우만 써야 해요."}}],"takeaway":["간격 조건은 뒤쪽 수를 일정량 줄여 보통의 순서 선택으로 바꿀 수 있어요.","추가 간격 조건은 가능한 양 끝값부터 나열하면 누락을 막을 수 있어요.","조건부확률의 분모는 조건 사건의 경우 수예요."]};</script>
