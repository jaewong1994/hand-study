r+1)=0,\\quad r>1\\ \\Rightarrow\\ r=4,\\quad a_1=\\frac34"},{"id":"s5","latex":"a_3=1,\\quad a_6=4a_3+1=5,\\quad a_{12}=4a_6+1=21"},{"id":"s6","latex":"a_{25}=4a_{12}-2=\\boxed{82}\\quad\\text{③}"}],"track":"나형"};</script>
<script>window.HandStudyGuide={"itemId":24752,"sourceHash":"edafd4a0d83fac91550ef5cf3983b2e3bdd5e516a52c335164ef09a127106339","contentHash":"a91b234ba113e244063d0e007412245f464c375cbb511d4c046090b54b522043","overview":{"goal":"재귀식에 작은 지수를 넣어 \\(a_2\\)를 정한 뒤, 25까지 가는 지수 경로를 거꾸로 따라 계산해요.","firstLook":"\\(a_2\\)가 모든 재귀식의 곱셈 계수예요. 먼저 (가)에 \\(n=1\\)을 넣어 \\(a_2\\)와 \\(a_1\\)의 관계를 만들고, \\(a_7\\) 조건으로 \\(a_2\\)를 확정해요.","conditions":[{"label":"첫항 범위","meaning":"\\(0<a_1<1\\)이므로 \\(a_2=1/(1-a_1)>1\\)이에요."},{"label":"일곱째 항","meaning":"홀수 재귀식을 두 번 써 \\(a_7\\)을 \\(a_2\\)만의 식으로 만들어요."}]},"chapters":[{"id":"c1","label":"둘째 항을 하나의 미지수로 정해요","stepIds":["s1","s2"],"question":"왜 \\(a_2>1\\)이라는 범위가 꼭 필요할까요?","hint":"나중에 나오는 이차방정식의 두 근 중 하나를 고르는 데 사용해요.","explanation":"\\(r=a_2\\)라 두고 (가)에 \\(n=1\\)을 넣으면 \\(r=ra_1+1\\), 따라서 \\(r(1-a_1)=1\\)이에요. \\(0<a_1<1\\)이므로 \\(1-a_1>0\\)이고 \\(r=1/(1-a_1)>1\\)이에요. (나)에 \\(n=1\\)을 넣으면 \\(a_3=ra_1-2=(r-1)-2=r-3\\)이에요.","check":{"prompt":"\\(ra_1=r-1\\)은 어느 식에서 나오나요?","answer":"\\(r=ra_1+1\\)을 정리하면 \\(ra_1=r-1\\)이에요."}},{"id":"c2","label":"일곱째 항으로 계수를 확정해요","stepIds":["s3","s4"],"question":"\\(a_7\\)을 \\(r\\)만으로 나타낼 때 어떤 재귀식을 쓰나요?","hint":"\\(7=2\\cdot3+1\\)이에요.","explanation":"(나)에 \\(n=3\\)을 넣으면 \\(a_7=ra_3-2=r(r-3)-2=r^2-3r-2\\)예요. 이것이 2이므로 \\(r^2-3r-4=0\\), 즉 \\((r-4)(r+1)=0\\)이에요. 앞에서 \\(r>1\\)이므로 \\(r=4\\)만 가능하고, \\(4=4a_1+1\\)에서 \\(a_1=3/4\\)예요.","check":{"prompt":"\\(r=-1\\)을 단순히 버리는 것이 아니라 제외하는 원래 조건은 무엇인가요?","answer":"\\(0<a_1<1\\)에서 얻은 \\(r=1/(1-a_1)>1\\) 조건이에요."}},{"id":"c3","label":"25에서 거꾸로 필요한 항만 계산해요","stepIds":["s5","s6"],"question":"\\(a_{25}\\)를 구할 때 왜 \\(a_3,a_6,a_{12}\\)만 알면 될까요?","hint":"\\(25=2\\cdot12+1\\), \\(12=2\\cdot6\\), \\(6=2\\cdot3\\)으로 거꾸로 내려가요.","explanation":"\\(a_3=r-3=1\\)이에요. \\(6,12\\)는 짝수이므로 (가)를 차례로 써서 \\(a_6=4a_3+1=5\\), \\(a_{12}=4a_6+1=21\\)이에요. 마지막으로 \\(25=2\\cdot12+1\\)이므로 (나)에서 \\(a_{25}=4a_{12}-2=84-2=82\\)예요. 선택지는 ③이에요.","check":{"prompt":"마지막 단계에서 \\(+1\\)이 아니라 \\(-2\\)를 쓰는 이유는 무엇인가요?","answer":"25는 홀수이고 \\(25=2\\cdot12+1\\)이므로 조건 (나)를 적용하기 때문이에요."}}],"takeaway":["재귀식 자체에 나타나는 항을 미지수로 두면 초기조건을 범위와 함께 정리할 수 있어요.","이차방정식의 후보는 앞에서 얻은 범위 조건으로 걸러요.","큰 지수의 항은 목표 지수에서 거꾸로 필요한 선행 지수만 찾아 계산해요."]};</script>
