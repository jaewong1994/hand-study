  <script>window.HandStudyRecord={"adminYear":2019,"answer":"8","contentHash":"3842f7419bec8183159cf2a4b7a424d88935585b998fbc168e4fcde486063f23","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24668,"month":11,"number":27,"points":4,"preview":false,"questionHtml":"\u003cp>그림과 같이 한 변의 길이가 \u003cspan class=\"heq\">\\(4\\)\u003c/span>이고 \u003cspan class=\"heq\">\\(∠{B A D}=\\frac{\\pi}{3}\\)\u003c/span>인 마름모 \u003cspan class=\"heq\">\\({A B C D}\\)\u003c/span> 모양의 종이가 있다. 변 \u003cspan class=\"heq\">\\({B C}\\)\u003c/span>와 변 \u003cspan class=\"heq\">\\({C D}\\)\u003c/span>의 중점을 각각 \u003cspan class=\"heq\">\\({M}\\)\u003c/span>과 \u003cspan class=\"heq\">\\({N}\\)\u003c/span>이라 할 때, 세 선분 \u003cspan class=\"heq\">\\({A M}\\)\u003c/span>, \u003cspan class=\"heq\">\\({A N}\\)\u003c/span>, \u003cspan class=\"heq\">\\({M N}\\)\u003c/span>을 접는 선으로 하여 사면체 \u003cspan class=\"heq\">\\({P A M N}\\)\u003c/span>이 되도록 종이를 접었다. 삼각형 \u003cspan class=\"heq\">\\({A M N}\\)\u003c/span>의 평면 \u003cspan class=\"heq\">\\({P A M}\\)\u003c/span> 위로의 정사영의 넓이는 \u003cspan class=\"heq\">\\(\\frac{q}{p}\\sqrt{3}\\)\u003c/span>이다. \u003cspan class=\"heq\">\\(p +q\\)\u003c/span>의 값을 구하시오. (단, 종이의 두께는 고려하지 않으며 \u003cspan class=\"heq\">\\({P}\\)\u003c/span>는 종이를 접었을 때 세 점 \u003cspan class=\"heq\">\\({B}\\)\u003c/span>, \u003cspan class=\"heq\">\\({ C}\\)\u003c/span>, \u003cspan class=\"heq\">\\({D}\\)\u003c/span> 가 합쳐지는 점이고, \u003cspan class=\"heq\">\\(p\\)\u003c/span>와 \u003cspan class=\"heq\">\\(q\\)\u003c/span>는 서로소인 자연수이다.) [4점]\u003c/p>\u003cfigure>\u003cimg class=\"hfig\" src=\"../assets/csat/24668-69260cae83029a23.png\" alt=\"2019년 시행 수능 27번 문항 그림 \" style=\"max-width:100%;width:420px\">\u003c/figure>","questionText":"그림과 같이 한 변의 길이가 $4$이고 $∠{B A D}=\\frac{\\pi}{3}$인 마름모 ${A B C D}$ 모양의 종이가 있다. 변 ${B C}$와 변 ${C D}$의 중점을 각각 ${M}$과 ${N}$이라 할 때, 세 선분 ${A M}$, ${A N}$, ${M N}$을 접는 선으로 하여 사면체 ${P A M N}$이 되도록 종이를 접었다. 삼각형 ${A M N}$의 평면 ${P A M}$ 위로의 정사영의 넓이는 $\\frac{q}{p}\\sqrt{3}$이다. $p +q$의 값을 구하시오. (단, 종이의 두께는 고려하지 않으며 ${P}$는 종이를 접었을 때 세 점 ${B}$, ${ C}$, ${D}$ 가 합쳐지는 점이고, $p$와 $q$는 서로소인 자연수이다.) [4점]","sourceHash":"93bda1b12a0f4ae6106e1a41cd921fd80df2683a7c37b85c16b6982695c0dff4","sourceKind":"csat","sourceLabel":"2019년 시행 수능 · 2020학년도 · 가형 · 27번","steps":[{"id":"s1","latex":"\\mathrm E\\text{를 }\\mathrm{MN}\\text{의 중점이라 하면 }\\mathrm{MN}=2,\\quad\\mathrm{AE}=3\\sqrt3,\\quad\\mathrm{AM}=2\\sqrt7"},{"id":"s2","latex":"[\\triangle\\mathrm{AMN}]=\\tfrac12\\cdot2\\cdot3\\sqrt3=3\\sqrt3"},{"id":"s3","latex":"\\mathrm{PA}=4,\\quad\\mathrm{PM}=\\mathrm{PN}=2\\ \\Rightarrow\\ \\mathrm{PE}=\\sqrt3"},{"id":"s4","latex":"\\mathrm H\\text{를 }\\mathrm P\\text{에서 밑면에 내린 수선의 발이라 하면 }\\mathrm H\\text{는 직선 }\\mathrm{AE}\\text{ 위}"},{"id":"s5","latex":"\\mathrm{EH}=u:\\quad16-(3\\sqrt3-u)^2=3-u^2\\ \\Rightarrow\\ u=\\frac{7\\sqrt3}{9}"},{"id":"s6","latex":"\\mathrm{PH}^2=3-u^2=\\frac{32}{27}"},{"id":"s7","latex":"\\mathrm Q\\text{를 }\\mathrm P\\text{에서 }\\mathrm{AM}\\text{에 내린 수선의 발이라 하면 }\\mathrm{HQ}\\perp\\mathrm{AM}"},{"id":"s8","latex":"[\\triangle\\mathrm{PAM}]=\\tfrac12\\cdot4\\cdot2\\sin\\frac{2\\pi}3=2\\sqrt3\\ \\Rightarrow\\ \\mathrm{PQ}=\\frac{2\\sqrt{21}}7"},{"id":"s9","latex":"\\mathrm{HQ}^2=\\mathrm{PQ}^2-\\mathrm{PH}^2=\\frac{12}7-\\frac{32}{27}=\\frac{100}{189}"},{"id":"s10","latex":"\\cos\\theta=\\frac{\\mathrm{HQ}}{\\mathrm{PQ}}=\\frac59"},{"id":"s11","latex":"\\text{정사영 넓이}=3\\sqrt3\\cdot\\frac59=\\frac53\\sqrt3\\ \\Rightarrow\\ \\boxed{p+q=8}"}],"track":"가형"};</script>
