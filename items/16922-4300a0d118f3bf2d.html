<script>window.HandStudyGuide={"itemId":16922,"sourceHash":"8250adc58f4665522e1f396296b9163f03b4466b6daa96c355e8e1a5cd4ea810","contentHash":"8ae607f1c4aedefae87101da8127ddf1189e4b4f7e77dd421afef3a9c0216d94","overview":{"goal":"두 그래프의 교점 범위를 잡고 포물선 식과 지수함수 식을 번갈아 써 세 명제를 확인해요.","firstLook":"\\(h(x)=2^x+2x^2-2\\)의 부호를 간단한 수에서 비교하면 \\(-1<x_1<0<1/2<x_2<1\\)을 얻어요.","conditions":[{"label":"교점 범위","meaning":"연속성과 그래프의 단조 구간으로 두 근의 위치를 정해요."},{"label":"차","meaning":"포물선 식으로 \\(y_2-y_1\\)을 인수분해해요."},{"label":"곱","meaning":"지수법칙으로 \\(y_1y_2=2^{x_1+x_2}\\)를 써요."}]},"chapters":[{"id":"c1","label":"두 교점 범위와 ㄱ을 확인해요","stepIds":["s1","s2"],"question":"왜 \\(x_2>1/2\\)라고 할 수 있나요?","hint":"\\(h(1/2)\\)와 \\(h(1)\\)의 부호를 비교해요.","explanation":"교점은 \\(h(x)=2^x+2x^2-2=0\\)의 근이에요. \\(h(-1)>0,h(0)=-1<0\\)이므로 왼쪽 근은 \\(-1<x_1<0\\)에 있고, \\(h(1/2)=\\sqrt2-3/2<0,h(1)=2>0\\)이므로 오른쪽 근은 \\(1/2<x_2<1\\)에 있어 ㄱ은 참이에요. 주어진 두 교점과 각 구간의 그래프 모양으로 이 두 근이 문제의 \\(x_1,x_2\\)예요.","check":{"prompt":"\\(h(1/2)<0\\)은 어떻게 확인하나요?","answer":"\\(\\sqrt2<3/2\\)는 양변을 제곱해 \\(2<9/4\\)로 확인할 수 있어요."}},{"id":"c2","label":"ㄴ과 ㄷ을 부등식으로 확인해요","stepIds":["s3","s4","s5"],"question":"\\(x_1+x_2<0\\)은 어느 비교에서 나오나요?","hint":"\\(h(-x_1)\\)의 부호와 오른쪽 근 \\(x_2\\)의 위치를 비교해요.","explanation":"포물선 식을 빼면 \\(y_2-y_1=-2(x_2^2-x_1^2)=-2(x_1+x_2)(x_2-x_1)\\)이에요. \\(u=2^{x_1}\\)이라 두면 \\(0<u<1\\)이고 \\(h(x_1)=0\\)에서 \\(2x_1^2=2-u\\)예요. 따라서 \\(h(-x_1)=2^{-x_1}+2x_1^2-2=1/u-u>0\\)이에요. \\(x>0\\)에서 \\(2^x+2x^2-2\\)는 증가하므로 \\(-x_1\\)은 양의 근 \\(x_2\\)보다 크고, 곧 \\(x_1+x_2<0\\)이에요. 한편 \\(x_1>-1\\), \\(x_2>1/2\\)이므로 \\(x_1+x_2>-1/2\\)예요. 따라서 \\(0<-2(x_1+x_2)<1\\)이라 \\(y_2-y_1<x_2-x_1\\), ㄴ은 참이에요. 또한 \\(y_1y_2=2^{x_1+x_2}\\)이고 \\(-1/2<x_1+x_2<0\\)이므로 \\(\\sqrt2/2<y_1y_2<1\\), ㄷ도 참이라 답은 ⑤예요.","check":{"prompt":"ㄴ에서 \\(x_2-x_1\\)로 나누어도 부등호가 유지되는 이유는 무엇인가요?","answer":"\\(x_2>x_1\\)이라 \\(x_2-x_1>0\\)이기 때문이에요."}}],"takeaway":["두 그래프의 교점 문제에서는 차를 나타내는 연속함수의 부호로 x범위를 먼저 잡아요.","교점의 y값 차는 포물선 식, 곱은 지수함수 식처럼 유리한 표현을 골라 써요."]};</script>
