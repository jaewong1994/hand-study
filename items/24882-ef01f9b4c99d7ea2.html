<script>window.HandStudyRecord={"adminYear":2023,"answer":"11","contentHash":"684290a37099679b147e2bee74b9d72fd5ac2d78fbb507e767afec0824f77253","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24882,"month":11,"number":29,"points":4,"preview":false,"questionHtml":"<p>양수 <span class=\"heq\">\\(c\\)<\/span>에 대하여 두 점 <span class=\"heq\">\\({{F}} (c,\\, 0)\\)<\/span>, <span class=\"heq\">\\({{F}} &#x27; (-c,\\, 0)\\)<\/span>을 초점으로 하고, 주축의 길이가 <span class=\"heq\">\\(6\\)<\/span>인 쌍곡선이 있다. 이 쌍곡선 위에 다음 조건을 만족시키는 서로 다른 두 점 <span class=\"heq\">\\({{P}}\\)<\/span>, <span class=\"heq\">\\({{Q}}\\)<\/span>가 존재하도록 하는 모든 <span class=\"heq\">\\(c\\)<\/span>의 값의 합을 구하시오. [4점]<\/p><p> (가) 점 <span class=\"heq\">\\({{P}}\\)<\/span>는 제<span class=\"heq\">\\(1\\)<\/span>사분면 위에 있고, 점 <span class=\"heq\">\\({{Q}}\\)<\/span>는 직선 <span class=\"heq\">\\({{PF}} &#x27;\\)<\/span> 위에 있다.(나) 삼각형 <span class=\"heq\">\\({{PF}} &#x27; {{F}}\\)<\/span>는 이등변삼각형이다.(다) 삼각형 <span class=\"heq\">\\({{PQF}}\\)<\/span>의 둘레의 길이는 <span class=\"heq\">\\(28\\)<\/span>이다.<\/p>","questionText":"양수 $c$에 대하여 두 점 ${{F}} (c,\\, 0)$, ${{F}} \\,' (-c,\\, 0)$을 초점으로 하고, 주축의 길이가 $6$인 쌍곡선이 있다. 이 쌍곡선 위에 다음 조건을 만족시키는 서로 다른 두 점 ${{P}}$, ${{Q}}$가 존재하도록 하는 모든 $c$의 값의 합을 구하시오. [4점]\n (가) 점 ${{P}}$는 제$1$사분면 위에 있고, 점 ${{Q}}$는 직선 ${{PF}} \\,'$ 위에 있다.(나) 삼각형 ${{PF}} \\,' {{F}}$는 이등변삼각형이다.(다) 삼각형 ${{PQF}}$의 둘레의 길이는 $28$이다.","sourceHash":"a1a70580701cbb44af012e5702c641cc6986cd88441898e1bf5de001245a8d1d","sourceKind":"csat","sourceLabel":"2023년 시행 수능 · 2024학년도 · 기하 · 29번","steps":[{"id":"s1","latex":"\\text{주축 길이가 }6\\text{이므로 오른쪽 가지에서 }PF'-PF=6,\\text{ 왼쪽 가지에서 }QF-QF'=6"},{"id":"s2","latex":"R=F'+\\lambda(P-F')\\text{를 쌍곡선 식에 넣으면 }\\lambda=1,\\ \\frac{c^2-9}{c^2+6PF'-9}\\text{이고, 둘째 값이 }0\\text{과 }1\\text{ 사이이므로 }P-Q-F'\\text{ 순서이다.}"},{"id":"s3","latex":"PF'=u,\\ QF'=v\\text{라 하면 }PF=u-6,\\ QF=v+6,\\ PQ=u-v"},{"id":"s4","latex":"PQ+QF+PF=(u-v)+(v+6)+(u-6)=2u=28\\Rightarrow PF'=u=14"},{"id":"s5","latex":"\\triangle PF'F\\text{에서 }P\\text{가 제1사분면이므로 같은 두 변의 가능성은 }FF'=PF'\\text{ 또는 }FF'=PF\\text{이다.}"},{"id":"s6","latex":"FF'=PF'\\text{인 경우 }2c=14\\Rightarrow c=7"},{"id":"s7","latex":"FF'=PF\\text{인 경우 }PF=14-6=8,\\quad2c=8\\Rightarrow c=4"},{"id":"s8","latex":"PF'=PF\\text{는 }14\\ne8\\text{이고, }c=4,7\\text{에서는 }x_P=33/c>0,\\ y_P^2=735/16,\\ 2880/49>0\\text{이며 둘째 교점의 }\\lambda=1/13,\\ 10/31\\text{이므로 두 배치가 모두 존재한다.}"},{"id":"s9","latex":"\\therefore\\ \\sum c=7+4=\\boxed{11}"}],"track":"기하","editionHash":"17f44616e6b4c9ca30a63eb5538df853ed0c6a4fc6c5163e2abc6871d83f48fe"};</script>
<script>window.HandStudyGuide={"itemId":24882,"sourceHash":"a1a70580701cbb44af012e5702c641cc6986cd88441898e1bf5de001245a8d1d","contentHash":"684290a37099679b147e2bee74b9d72fd5ac2d78fbb507e767afec0824f77253","overview":{"goal":"쌍곡선의 거리 차와 삼각형 둘레로 \\(PF'\\)를 정하고, 이등변 조건의 세 후보를 모두 검사해요.","firstLook":"주축의 길이가 \\(6\\)이므로 오른쪽 가지의 점 \\(P\\)에서는 \\(PF'-PF=6\\)이에요. 직선 \\(PF'\\)이 쌍곡선과 다시 만나는 점의 위치를 식으로 확인한 뒤 선분의 합과 차를 써야 해요.","conditions":[{"label":"둘레","meaning":"점 \\(Q\\)가 선분 \\(PF'\\)의 내부에 있음을 확인하면 삼각형 \\(PQF\\)의 둘레가 \\(2PF'\\)로 줄어요."},{"label":"이등변","meaning":"세 변 \\(PF'\\), \\(PF\\), \\(FF'\\)에서 같은 두 변을 고르는 세 경우를 빠짐없이 검사해요."}]},"chapters":[{"id":"c1","label":"점 Q의 위치를 식으로 확인해요","stepIds":["s1","s2","s3","s4"],"question":"왜 점 \\(Q\\)는 점 \\(P\\)와 점 \\(F'\\) 사이의 왼쪽 가지에 있을까요?","hint":"쌍곡선의 식을 \\(x^2/9-y^2/(c^2-9)=1\\)로 두고 직선 위의 점을 \\(F'+\\lambda(P-F')\\)로 나타내요.","explanation":"주축의 길이가 \\(6\\)이므로 쌍곡선의 식은 \\(x^2/9-y^2/(c^2-9)=1\\)이고 \\(c>3\\)이에요. \\(u=PF'>0\\)라 하고 직선 \\(PF'\\) 위의 점을 \\(R=F'+\\lambda(P-F')\\)로 나타내어 쌍곡선 식에 넣으면 두 교점에 해당하는 값은 \\(\\lambda=1\\)과 \\(\\lambda=(c^2-9)/(c^2+6u-9)\\)예요. 둘째 값은 \\(0<\\lambda<1\\)이므로 둘째 교점 \\(Q\\)는 선분 \\(F'P\\)의 내부에 있어요. 또 그 교점의 \\(x\\)좌표는 \\(-3(c^2u+3c^2+9u-27)/(c(c^2+6u-9))<0\\)이므로 왼쪽 가지예요. 따라서 점의 순서는 \\(P-Q-F'\\)이고, \\(QF'=v\\)라 하면 \\(PQ=u-v\\)예요. 오른쪽 가지에서 \\(PF=u-6\\), 왼쪽 가지에서 \\(QF=v+6\\)이므로 둘레는 \\((u-v)+(v+6)+(u-6)=2u=28\\)이에요. 따라서 \\(PF'=u=14\\), \\(PF=8\\)이에요.","check":{"prompt":"선분 길이 \\(PQ\\)를 \\(u-v\\)로 쓰는 근거는 무엇인가요?","answer":"두 번째 교점의 매개변수 값이 \\(0\\)과 \\(1\\) 사이이므로 점의 순서가 \\(P-Q-F'\\)이고, 따라서 \\(PQ=PF'-QF'=u-v\\)예요."}},{"id":"c2","label":"이등변 후보와 실제 존재를 확인해요","stepIds":["s5","s6","s7","s8"],"question":"수치상 남은 \\(c=4,7\\)에서 제1사분면의 점 \\(P\\)와 서로 다른 점 \\(Q\\)가 실제로 존재할까요?","hint":"두 초점까지 거리가 \\(PF=8\\), \\(PF'=14\\)인 점 \\(P=(x,y)\\)의 좌표를 거리식의 차로 구해요.","explanation":"삼각형 \\(PF'F\\)의 세 변은 \\(14,8,2c\\)예요. \\(PF'=PF\\)는 \\(14=8\\)이 되어 불가능하고, \\(FF'=PF'\\)이면 \\(c=7\\), \\(FF'=PF\\)이면 \\(c=4\\)예요. 두 거리식 \\((x+c)^2+y^2=14^2\\), \\((x-c)^2+y^2=8^2\\)을 빼면 \\(x=33/c>0\\)이에요. \\(c=4\\)일 때 \\(y^2=735/16>0\\), \\(c=7\\)일 때 \\(y^2=2880/49>0\\)이므로 두 경우 모두 양의 \\(y\\)를 택한 제1사분면의 점 \\(P\\)가 실제로 있어요. 더구나 직선 \\(F'P\\)의 둘째 교점은 \\(c=4\\)에서 \\(\\lambda=1/13\\), \\(c=7\\)에서 \\(\\lambda=10/31\\)이므로 두 경우 모두 \\(P\\)와 다른 점 \\(Q\\)가 선분 \\(F'P\\) 안에 실제로 존재해요. 따라서 두 값 모두 원문의 모든 조건을 만족해요.","check":{"prompt":"삼각부등식만 확인하는 것으로 충분하지 않은 이유는 무엇인가요?","answer":"문제는 점 \\(P\\)가 제1사분면에 있고 직선 \\(PF'\\) 위에 서로 다른 쌍곡선의 점 \\(Q\\)가 존재해야 한다고 했으므로, \\(x>0\\), \\(y^2>0\\), 둘째 교점의 매개변수까지 확인해야 해요."}},{"id":"c3","label":"가능한 두 값을 합쳐요","stepIds":["s9"],"question":"모든 조건을 통과한 \\(c\\)의 합은 얼마인가요?","hint":"실제 존재까지 확인한 두 값 \\(4\\)와 \\(7\\)을 더해요.","explanation":"세 이등변 후보를 모두 검사하고 점들의 위치와 존재까지 확인했을 때 남는 값은 \\(c=4\\), \\(c=7\\)이에요. 따라서 모든 \\(c\\)의 값의 합은 \\(4+7=11\\)이에요.","check":{"prompt":"수치만 맞고 존재하지 않는 후보가 남아 있나요?","answer":"없어요. 두 값 모두 제1사분면의 \\(P\\)와 선분 \\(F'P\\) 안의 서로 다른 쌍곡선 점 \\(Q\\)가 존재함을 좌표와 교점 매개변수로 확인했어요."}}],"takeaway":["한 직선 위의 선분 차를 쓰기 전에 두 교점의 순서를 식으로 확인해요.","이등변삼각형은 같은 두 변을 고르는 세 경우를 모두 적고 각각 탈락 근거를 확인해요.","후보값을 얻은 뒤에는 좌표의 사분면 조건과 필요한 둘째 교점의 존재를 원래 조건에 다시 대입해요."]};</script>
