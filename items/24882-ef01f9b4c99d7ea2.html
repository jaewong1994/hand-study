+6)+(u-6)=2u=28\\Rightarrow PF'=u=14"},{"id":"s5","latex":"\\triangle PF'F\\text{에서 }P\\text{가 제1사분면이므로 같은 두 변의 가능성은 }FF'=PF'\\text{ 또는 }FF'=PF\\text{이다.}"},{"id":"s6","latex":"FF'=PF'\\text{인 경우 }2c=14\\Rightarrow c=7"},{"id":"s7","latex":"FF'=PF\\text{인 경우 }PF=14-6=8,\\quad2c=8\\Rightarrow c=4"},{"id":"s8","latex":"\\text{나머지 두 변을 같은 것으로 두면 초점과 가지의 위치 조건을 만족하지 않는다.}"},{"id":"s9","latex":"\\therefore\\ \\sum c=7+4=\\boxed{11}"}],"track":"기하"};</script>
