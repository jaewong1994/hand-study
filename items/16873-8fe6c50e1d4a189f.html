<script>window.HandStudyGuide={"itemId":16873,"sourceHash":"4eb93b796ee520406ae42957b80870fe5476953b68296bfd2f3f4fc9cd421d96","contentHash":"9e33ef91a14ee11c7590dcde94cf31e57426557514d244a014fea78e52f45975","overview":{"goal":"검은 볼펜을 고르는지에 따라 나누고, 선택과 두 학생 배분을 한꺼번에 세어요.","firstLook":"한 색 볼펜을 \\(k\\)자루 골라 두 학생에게 나누는 방법은 한 학생 몫을 \\(0\\)부터 \\(k\\)까지 정하는 \\(k+1\\)가지예요.","conditions":[{"label":"같은 색 비구별","meaning":"각 학생이 각 색을 몇 자루 받는지만 구별해요."},{"label":"빈 학생 허용","meaning":"한 학생이 모든 색에서 \\(0\\)자루를 받아도 돼요."}]},"chapters":[{"id":"c1","label":"한 색의 선택과 배분을 함께 세어요","stepIds":["s1"],"question":"\\(k\\)자루를 두 학생에게 주는 방법은 왜 \\(k+1\\)가지인가요?","hint":"첫째 학생의 수를 정하면 둘째 학생의 수가 정해져요.","explanation":"첫째 학생이 받는 수를 \\(0,1,\\ldots,k\\) 중 하나로 정하면 둘째 학생은 나머지 \\(k\\)에서 그 수를 뺀 만큼 받아요. 따라서 \\(k+1\\)가지이고, 이는 선택한 \\(k\\)자루를 두 학생에게 남김없이 주는 경우를 모두 포함해요.","check":{"prompt":"한 학생이 \\(0\\)자루를 받는 배분도 포함되나요?","answer":"문제에서 허용하므로 양 끝 경우도 포함돼요."}},{"id":"c2","label":"검은 볼펜을 고르지 않는 경우를 세어요","stepIds":["s2"],"question":"이 경우는 왜 \\(44\\)가지인가요?","hint":"파란 수를 \\(k\\)라 하면 빨간 수는 \\(5-k\\)예요.","explanation":"검은 볼펜을 고르지 않으면 파란색과 빨간색에서 합하여 다섯 자루를 골라야 해요. 각 색은 최대 네 자루라 \\(k=1,2,3,4\\)예요. 파란색 배분은 \\(k+1\\)가지, 빨간색 배분은 \\(6-k\\)가지이므로 합은 \\(2\\cdot5+3\\cdot4+4\\cdot3+5\\cdot2=44\\)예요.","check":{"prompt":"\\(k=0\\)과 \\(k=5\\)가 빠지는 이유는 무엇인가요?","answer":"다른 한 색에서 다섯 자루를 골라야 하지만 각 색은 네 자루뿐이에요."}},{"id":"c3","label":"검은 볼펜을 고르는 경우를 세어요","stepIds":["s3","s4"],"question":"이 경우는 왜 \\(70\\)가지인가요?","hint":"검은 볼펜을 받을 학생과 나머지 네 자루의 색별 수를 정해요.","explanation":"검은 볼펜 한 자루를 고르면 받을 학생은 두 명 중 하나라 \\(2\\)가지예요. 나머지 네 자루에서 파란색을 \\(k=0,1,2,3,4\\)자루 고르면 빨간색은 \\(4-k\\)자루이고, 두 색의 배분 수는 \\((k+1)(5-k)\\)예요. 합은 \\(1\\cdot5+2\\cdot4+3\\cdot3+4\\cdot2+5\\cdot1=35\\), 검은 볼펜 수령자 선택을 곱해 \\(70\\)가지예요. 전체는 \\(44+70=114\\)가지예요.","check":{"prompt":"검은 볼펜을 두 학생에게 나누는 방법이 두 가지인 이유는 무엇인가요?","answer":"한 자루뿐이라 어느 한 학생이 받는 두 경우예요."}}],"takeaway":["같은 물건을 두 사람에게 나누는 방법은 한 사람의 개수로 셀 수 있어요.","특별한 한 물건의 선택 여부로 나누면 나머지 색 수의 합이 고정돼요.","색별 보유량의 상한 때문에 가능한 선택 범위를 먼저 정해요."]};</script>
