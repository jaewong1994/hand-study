<script>window.HandStudyGuide={"itemId":27028,"sourceHash":"14779580569c2f4c151304e30da3bb40033f0cbe1125b538a6d87105131796b8","contentHash":"e8d43c514ef0d89c2d2a9a4a9b9c685237411355026ff08291681a220cf5ad4b","overview":{"goal":"두 조각에서 생기는 미분계수의 차를 절댓값 항이 정확히 없애도록 근의 배치를 찾고, 가능한 함숫값의 양 끝을 구해요.","firstLook":"삼차함수의 두 번 곱해진 근에서는 부호가 바뀌지 않지만 한 번 곱해진 근에서는 부호가 바뀌어요. 따라서 조각함수가 꺾일 수 있는 곳과 절댓값 항이 뾰족해지는 곳을 먼저 일치시켜야 해요.","conditions":[{"label":"서로 다른 두 실근","meaning":"두 번 곱해진 근을 \\(\\alpha\\), 한 번 곱해진 근을 \\(\\beta\\)라 하면 \\(f(x)=(x-\\alpha)^2(x-\\beta)\\)이고 \\(\\alpha\\ne\\beta\\)예요."},{"label":"모든 점에서 미분가능","meaning":"조각함수와 절댓값 항의 좌우 미분계수 차가 \\(\\beta\\)에서 크기는 같고 방향은 반대여야 해요."}]},"chapters":[{"id":"c1","label":"조각함수가 꺾이는 곳을 찾아요","stepIds":["s1","s2","s3"],"question":"두 번 곱해진 근 \\(\\alpha\\)가 아니라 한 번 곱해진 근 \\(\\beta\\)에서 조각식이 바뀌는 이유는 무엇일까요?","hint":"각 근을 지날 때 \\(f\\)의 부호가 실제로 바뀌는지 확인해요.","explanation":"\\(f(x)=(x-\\alpha)^2(x-\\beta)\\)에서 제곱인자는 \\(\\alpha\\)의 양쪽에서 음수가 아니므로 그 점을 지나도 \\(f\\)의 부호가 바뀌지 않아요. 반면 \\(\\beta\\)를 지나면 \\(x-\\beta\\)의 부호가 바뀌므로 왼쪽에서는 \\(g=7f\\), 오른쪽에서는 \\(g=-f\\)예요. 또 \\(f'(\\beta)=(\\beta-\\alpha)^2\\)이므로 \\(g'_-(\\beta)=7(\\beta-\\alpha)^2\\), \\(g'_+(\\beta)=-(\\beta-\\alpha)^2\\)예요. 따라서 오른쪽 미분계수에서 왼쪽 미분계수를 뺀 값은 \\(-8(\\alpha-\\beta)^2\\)예요.","check":{"prompt":"\\(\\alpha\\)에서 조각식의 표현이 달라질 수 있는데도 왜 꺾임이 생기지 않나요?","answer":"\\(f'(\\alpha)=0\\)이고 부호도 바뀌지 않아요. 두 조각의 함숫값과 미분계수가 모두 \\(0\\)으로 이어져요."}},{"id":"c2","label":"절댓값 안의 근을 겹쳐요","stepIds":["s4","s5","s6","s7"],"question":"절댓값 항이 \\(\\beta\\)에서만 미분계수 차를 만들려면 세 근은 어떻게 겹쳐야 할까요?","hint":"서로 다른 세 한 번 곱해진 근이면 세 곳에서 뾰족해져요. 두 근이 겹치면 그곳에서는 제곱인자가 생겨 매끄러워져요.","explanation":"\\(i(x)=(x-1)(x-a)(x-4+a)\\)라 해요. 세 근이 모두 다르면 \\(|i(x)|\\)가 세 곳에서 모두 뾰족하므로 \\(h\\)가 모든 점에서 미분가능할 수 없어요. 따라서 두 근이 겹치고 남은 한 근만 \\(\\beta\\)가 되어야 해요. \\(1=a\\), \\(1=4-a\\), \\(a=4-a\\)에서 각각 \\(a=1,3,2\\)를 얻어요. \\(a=1\\) 또는 \\(3\\)이면 \\(i=(x-1)^2(x-3)\\)이어서 \\(\\beta=3\\)이고, \\(a=2\\)이면 \\(i=(x-1)(x-2)^2\\)이어서 \\(\\beta=1\\)이에요. 세 근이 모두 같으려면 동시에 \\(a=1\\)과 \\(a=3\\)이어야 하므로 불가능해요. 이 문항에서는 삼중근의 절댓값을 일반적으로 미분불가능하다고 가정하지 않고, 세 인수가 실제로 모두 같아질 수 없다는 사실만 사용해요.","check":{"prompt":"\\(a=2\\)일 때 왜 \\(\\beta=2\\)가 아니라 \\(\\beta=1\\)인가요?","answer":"\\(i(x)=(x-1)(x-2)^2\\)이므로 \\(2\\)에서는 부호가 바뀌지 않아 \\(|i|\\)가 미분가능하고, 한 번 곱해진 근 \\(1\\)에서만 뾰족해져요."}},{"id":"c3","label":"좌우 미분계수 차를 맞춰요","stepIds":["s8","s9"],"question":"\\(\\beta\\)에서 두 미분계수 차가 상쇄되려면 \\(\\alpha\\)와 \\(\\beta\\) 사이 거리는 얼마여야 할까요?","hint":"\\(|i|\\)의 오른쪽 미분계수에서 왼쪽 미분계수를 뺀 값은 \\(2|i'(\\beta)|\\)예요.","explanation":"\\(h\\)의 좌우 미분계수가 같으려면 \\(8(\\alpha-\\beta)^2=2|i'(\\beta)|\\)여야 해요. \\(a=2\\), \\(\\beta=1\\)이면 \\(|i'(1)|=(1-2)^2=1\\)이므로 \\((\\alpha-1)^2=1/4\\), 따라서 \\(\\alpha=1/2,3/2\\)예요. \\(a=1\\) 또는 \\(3\\), \\(\\beta=3\\)이면 \\(|i'(3)|=(3-1)^2=4\\)이므로 \\((\\alpha-3)^2=1\\), 따라서 \\(\\alpha=2,4\\)예요. 네 후보 모두 \\(\\alpha\\ne\\beta\\)라 서로 다른 실근이 정확히 두 개예요.","check":{"prompt":"표의 \\(|i'(\\beta)|\\) 값 \\(1\\)과 \\(4\\)는 어떤 계산에서 나오나요?","answer":"한 번 곱해진 근을 뺀 나머지 두 인수의 곱을 계산해요. \\(\\beta=1\\)이면 \\((1-2)^2=1\\), \\(\\beta=3\\)이면 \\((3-1)^2=4\\)예요."}},{"id":"c4","label":"가능한 함숫값의 양 끝을 골라요","stepIds":["s10","s11"],"question":"\\(f(0)\\)의 네 값 가운데 최댓값과 최솟값은 무엇인가요?","hint":"\\(f(0)=-\\beta\\alpha^2\\)에 네 후보를 각각 넣어요.","explanation":"네 \\((\\beta,\\alpha)\\)는 \\((1,1/2),(1,3/2),(3,2),(3,4)\\)예요. 따라서 \\(f(0)\\)은 차례로 \\(-1/4,-9/4,-12,-48\\)이에요. 이 중 최댓값은 \\(-1/4\\), 최솟값은 \\(-48\\)이므로 곱은 \\((-1/4)(-48)=12\\)예요.","check":{"prompt":"\\(-9/4\\)가 아니라 \\(-1/4\\)이 최댓값인 이유는 무엇인가요?","answer":"네 값이 모두 음수이므로 절댓값이 가장 작은 \\(-1/4\\)이 가장 커요."}}],"takeaway":["조각함수의 꺾임은 원함수의 부호가 실제로 바뀌는 한 번 곱해진 근에서 생겨요.","절댓값 다항식은 근의 겹친 횟수를 실제로 분류한 뒤 좌우 미분계수를 계산해요.","좌우 미분계수 차를 맞춘 뒤 모든 후보를 원래 실근 조건에 다시 넣어 확인해요."]};</script>
