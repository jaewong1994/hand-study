  <script>window.HandStudyRecord={"itemId":16743,"sourceLabel":"2020 교육청 고3 수리나형 10월 18번","adminYear":2020,"grade":3,"month":10,"number":18,"track":"수리나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"$3$ 이상의 자연수 $n\\,$에 대하여 집합\n $A_{n} = \\left\\{ \\,(\\,p,\\,q)\\,|\\,p\\lt q\\, \\right.$이고 $p$, $q\\,$는 $n$ 이하의 자연수$\\left.\\, \\right\\} \\,$\n이다. 집합 $A_{n} \\,$의 모든 원소 $(\\,p,\\,q)\\,$에 대하여 $q\\,$의 값의 평균을 $a_{n} \\,$이라 하자. 다음은 $3$ 이상의 자연수 $n\\,$에 대하여 $a_{n} = \\dfrac{2n+2}{3} \\,$임을 수학적 귀납법을 이용하여 증명한 것이다.\n(ⅰ)$n=3\\,$일 때, $A_{3} = \\left\\{ (1,\\,2),\\,\\left(1,\\,3\\,\\right),\\,\\left(2,\\,3\\,\\right) \\right\\} \\,$이므로\n$a_{3} = \\dfrac{2+3+3}{3}$$= \\dfrac{8}{3} \\,$이고 $\\dfrac{2 \\times 3+2}{3}$$= \\dfrac{8}{3} \\,$이다.\n그러므로 $a_{n} = \\dfrac{2n+2}{3} \\,$가 성립한다.\n(ⅱ)$n=k\\,(k \\geq 3)\\,$일 때, $a_{k} = \\dfrac{2k+2}{3} \\,$가 성립한다고\n가정하자. $n=k+1\\,$일 때,\n$A_{k+1} =A_{k} \\cup \\left\\{ (1,\\,k+1),\\,(2,\\,k+1),\\, \\cdots ,\\,(k,\\,k+1) \\right\\} \\,$\n이고 집합 $A_{k} \\,$의 원소의 개수는 ${\\boxed{\\vphantom{(}\\,(\\text{가})^\\,}} \\,$이므로\n$a_{k+1}$$= \\dfrac{{\\boxed{\\vphantom{(}\\,(\\text{가})^\\,}} \\, \\times \\dfrac{2k+2}{3} + {\\boxed{\\vphantom{(}\\,(\\text{나})^\\,}}}{{}_{k+1} \\, C_{2} }$\n $= \\dfrac{2k+4}{3}$$= \\dfrac{2(k+1)+2}{3} \\,$\n이다. 따라서 $n=k+1\\,$일 때도 $a_{n} = \\dfrac{2n+2}{3} \\,$가 성립한다.\n(ⅰ), (ⅱ)에 의하여 $3$ 이상의 자연수 $n\\,$에 대하여\n$a_{n} = \\dfrac{2n+2}{3} \\,$이다.\n위의 (가), (나)에 알맞은 식을 각각 $f(k)$, $g(k)\\,$라 할 때,\n$f(10)+g(9)\\,$의 값은? [4점]\n① $131$ ② $133$ ③ $135$ ④ $137$ ⑤ $139$","answer":"③","sourceHash":"89cfa8e734bd5e8c79025d79f08ab8966e896a89247306340627ad103334b7d8","steps":[{"id":"s1","latex":"A_{k+1}=A_k\\cup\\{(1,k+1),\\ldots,(k,k+1)\\}"},{"id":"s2","latex":"f(k)=|A_k|={k\\choose2}=\\dfrac{k(k-1)}2"},{"id":"s3","latex":"g(k)=\\sum_{(p,q)\\in A_{k+1}\\setminus A_k}q=k(k+1)"},{"id":"s4","latex":"a_{k+1}=\\dfrac{\\frac{k(k-1)}2\\frac{2k+2}{3}+k(k+1)}{\\frac{k(k+1)}2}=\\dfrac{2k+4}{3}"},{"id":"s5","latex":"f(10)+g(9)=45+90=\\boxed{135}
