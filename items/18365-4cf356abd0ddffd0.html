<script>window.HandStudyRecord={"adminYear":2025,"answer":"①","contentHash":"359f7557c1913bba171b47f2fb981364e959425970c75330105ee3d43ab90cbb","diagram":null,"editionHash":"4cf356abd0ddffd023dd7b49341d4c7f76e1d114745fd1e46cf48409262b2097","grade":3,"graphHash":"","graphPlan":null,"itemId":18365,"learningHash":"0d545abfae6ce3f8d1d3ab04fc80313ed489a73a546f84e6532e69a89efaf9b7","month":6,"number":28,"points":4,"preview":false,"questionHtml":"\u003cp class=\"hp\">실수 전체의 집합에서 이계도함수를 갖는 함수 \u003cspan class=\"heq\">\\(f \\left(x \\right)\\,\\)\u003c/span>와 두 상수 \u003cspan class=\"heq\">\\(a\\)\u003c/span>, \u003cspan class=\"heq\">\\(b\\,\\)\u003c/span>가 다음 조건을 만족시킬 때, \u003cspan class=\"heq\">\\(a \\times e^{b}\\,\\)\u003c/span>의 값은? \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp htall\">(가) 모든 실수 \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>에 대하여\u003cbr>&emsp;\u003cspan class=\"heq\">\\(\\left(f \\left(x \\right) \\right)^{5}+ \\left(f \\left(x \\right) \\right)^{3}+ax+b= \\ln\\, \\left(x^{2}+x+\\dfrac{5}{2} \\right)\\)\u003c/span>\u003cbr>이다.\u003c/p>\u003cp class=\"hp\">(나) \u003cspan class=\"heq\">\\(f \\left(-3 \\right)f \\left(3 \\right) \\lt  0\\)\u003c/span>, \u003cspan class=\"heq\">\\(f' \\left(2 \\right) \\gt  0\\)\u003c/span>\u003c/p>\u003c/div>\u003cp class=\"hp htall\">① \u003cspan class=\"heq\">\\(-3e^{-\\dfrac{4}{3}}\\)\u003c/span>&emsp;② \u003cspan class=\"heq\">\\(-\\dfrac{5}{3}e^{-\\dfrac{4}{3}}\\)\u003c/span>&emsp;③ \u003cspan class=\"heq\">\\(-\\dfrac{1}{3}e^{-\\dfrac{4}{3}}\\)\u003c/span>\u003c/p>\u003cp class=\"hp htall\">④ \u003cspan class=\"heq\">\\(e^{-\\dfrac{4}{3}}\\)\u003c/span>&emsp;⑤ \u003cspan class=\"heq\">\\(\\dfrac{7}{3}e^{-\\dfrac{4}{3}}\\)\u003c/span>\u003c/p>","questionText":"실수 전체의 집합에서 이계도함수를 갖는 함수 $f \\left(x \\right)\\,$와 두 상수 $a$, $b\\,$가 다음 조건을 만족시킬 때, $a \\times e^{b}\\,$의 값은? [4점]\n(가) 모든 실수 $x\\,$에 대하여 $\\left(f \\left(x \\right) \\right)^{5}+ \\left(f \\left(x \\right) \\right)^{3}+ax+b= \\ln\\, \\left(x^{2}+x+\\frac{5}{2} \\right)$ 이다.(나) $f \\left(-3 \\right)f \\left(3 \\right) \u003c 0$, $f' \\left(2 \\right) > 0$\n① $-3e^{-\\frac{4}{3}}$ ② $-\\frac{5}{3}e^{-\\frac{4}{3}}$ ③ $-\\frac{1}{3}e^{-\\frac{4}{3}}$\n④ $e^{-\\frac{4}{3}}$ ⑤ $\\frac{7}{3}e^{-\\frac{4}{3}}$","scoreStatus":"confirmed_4_direct","sourceHash":"626d7337514804a144682e5e36ba140a986fc0daca4f88edb6b977bb74648339","sourceLabel":"2025 평가원 고3 수학미적분 6월 28번","stepExplanations":{"s2":{"body":"\\(f(-3)f(3)\u003c0\\)이고 \\(f\\)는 연속이므로 \\(-3\u003cx_0\u003c3\\)인 어떤 \\(x_0\\)에서 \\(f(x_0)=0\\)입니다. 이 한 점에서 오른쪽의 \\(f^5+f^3\\)뿐 아니라 그 일계·이계 미분도 모두 0이 됩니다.","skillTags":["intermediate-value","zero-location"],"title":"부호 조건에서 함숫값이 0인 점을 하나 확보하기"},"s4":{"body":"\\(R=f^5+f^3\\)를 두 번 미분한 식에 \\(f(x_0)=0\\)을 넣으면 \\(R(x_0)=R'(x_0)=R''(x_0)=0\\)입니다. 한편 로그식을 직접 두 번 미분하면 \\(R''(x)=-2(x+2)(x-1)/(x^2+x+5/2)^2\\)이므로 \\(x_0=-2\\) 또는 1입니다.","skillTags":["second-derivative","candidate-reduction"],"title":"R''의 값이 0인 점이 x0를 두 후보로 줄인다"},"s6":{"body":"\\(R'(2)=(5f(2)^4+3f(2)^2)f'(2)\\)이고 앞의 계수는 0 이상이므로 \\(R'(2)\\ge0\\)입니다. \\(R'(2)=10/17-a\\)에 두 후보 \\(-2/3,2/3\\)을 넣으면 \\(a=2/3\\)은 음수가 되어 탈락합니다.","skillTags":["sign-filter","parameter-selection"],"title":"f'(2)>0으로 a 후보를 거르기"}},"steps":[{"id":"s1","latex":"R(x)=\\ln(x^2+x+5/2)-ax-b=f(x)^5+f(x)^3"},{"id":"s2","latex":"f(-3)f(3)\u003c0\\Rightarrow f(x_0)=0\\text{인 }-3\u003cx_0\u003c3"},{"id":"s3","latex":"R'=(5f^4+3f^2)f',\\quad R''=(5f^4+3f^2)f''+(20f^3+6f)(f')^2"},{"id":"s4","latex":"R(x_0)=R'(x_0)=R''(x_0)=0,\\quad R''(x)=\\frac{-2(x+2)(x-1)}{(x^2+x+5/2)^2}"},{"id":"s5","latex":"x_0=-2,1\\Rightarrow a=-2/3,2/3;\\quad R'(2)=(5f(2)^4+3f(2)^2)f'(2)\\ge0"},{"id":"s6","latex":"R'(2)=10/17-a\\ge0\\Rightarrow a=-2/3,\\quad x_0=-2"},{"id":"s7","latex":"b=\\ln(9/2)-4/3\\Rightarrow ae^b=-3e^{-4/3}"}],"track":"미적분"};</script>
<script>window.HandStudyGuide={"itemId":18365,"sourceHash":"626d7337514804a144682e5e36ba140a986fc0daca4f88edb6b977bb74648339","contentHash":"359f7557c1913bba171b47f2fb981364e959425970c75330105ee3d43ab90cbb","overview":{"goal":"함수의 영점에서 합성식과 두 도함수가 모두 0이 되는 성질로 두 상수를 결정해요.","firstLook":"로그식에서 일차식을 뺀 부분을 \\(R\\)로 두면 \\(R=f^5+f^3\\)이라 \\(f=0\\)인 점에서 강한 조건을 얻어요.","conditions":[{"label":"두 함숫값의 곱이 음수","meaning":"중간값정리로 주어진 구간 안에 \\(f\\)의 영점을 확보해요."},{"label":"한 점에서 도함수가 양수","meaning":"두 개로 남은 상수 후보 중 부호에 맞는 하나를 골라요."}]},"chapters":[{"id":"c1","label":"영점에서 생기는 세 조건","stepIds":["s1","s2","s3"],"question":"\\(f(x_0)=0\\)이면 왜 \\(R(x_0),R'(x_0),R''(x_0)\\)가 모두 0인가요?","hint":"\\(R=f^5+f^3\\)을 한 번, 두 번 미분한 각 항의 인수를 살펴보세요.","explanation":"\\(R(x)=\\ln(x^2+x+5/2)-ax-b=f(x)^5+f(x)^3\\)로 두어요. \\(f(-3)f(3)<0\\)이고 \\(f\\)는 연속이므로 \\(-3<x_0<3\\)인 어떤 점에서 \\(f(x_0)=0\\)이에요.\n\n미분하면 \\(R'=(5f^4+3f^2)f'\\), \\(R''=(5f^4+3f^2)f''+(20f^3+6f)(f')^2\\)예요. \\(f(x_0)=0\\)을 넣으면 두 식의 모든 항이 0이고 원래 식도 0이므로 \\(R(x_0)=R'(x_0)=R''(x_0)=0\\)이에요.","check":{"prompt":"\\(R''\\)의 둘째 항도 0이 되는 직접적인 인수는 무엇인가요?","answer":"계수 \\(20f^3+6f=2f(10f^2+3)\\)에 \\(f\\)가 인수로 들어 있어요."}},{"id":"c2","label":"영점 위치와 상수 후보","stepIds":["s4","s5"],"question":"로그식을 두 번 미분하면 \\(x_0\\)는 어느 두 값으로 좁혀지나요?","hint":"분모는 항상 양수이므로 분자의 두 일차인수만 0으로 놓으세요.","explanation":"직접 미분하면 \\(R''(x)=-2(x+2)(x-1)/(x^2+x+5/2)^2\\)예요. 분모의 안쪽은 \\((x+1/2)^2+9/4>0\\)이므로 \\(R''(x_0)=0\\)에서 \\(x_0=-2\\) 또는 \\(1\\)이에요.\n\n또 \\(R'(x)=(2x+1)/(x^2+x+5/2)-a\\)이므로 \\(R'(x_0)=0\\)을 넣으면 \\(x_0=-2\\)일 때 \\(a=-2/3\\), \\(x_0=1\\)일 때 \\(a=2/3\\)이에요. 한편 \\(R'(2)=(5f(2)^4+3f(2)^2)f'(2)\\)이고 앞의 계수는 0 이상이에요.","check":{"prompt":"\\(x_0=-2\\)일 때 \\(a\\)의 계산은 어떻게 되나요?","answer":"\\(a=(-3)/(4-2+5/2)=-3/(9/2)=-2/3\\)이에요."}},{"id":"c3","label":"부호로 후보 선택하고 값 계산","stepIds":["s6","s7"],"question":"\\(a=2/3\\)을 넣으면 \\(R'(2)\\)의 부호가 왜 조건과 어긋나나요?","hint":"\\(R'(2)=10/17-a\\)와 합성식에서 얻은 부호를 비교하세요.","explanation":"\\(f'(2)>0\\)이고 계수 \\(5f(2)^4+3f(2)^2\\)는 0 이상이므로 \\(R'(2)\\ge0\\)이어야 해요. 그런데 \\(a=2/3\\)이면 \\(R'(2)=10/17-2/3=-4/51<0\\)라 탈락해요. 따라서 \\(a=-2/3,x_0=-2\\)예요.\n\n\\(R(-2)=0\\)에 넣으면 \\(0=\\ln(9/2)-(-2)(-2/3)-b\\)이므로 \\(b=\\ln(9/2)-4/3\\)이에요. 따라서 \\(ae^b=(-2/3)(9/2)e^{-4/3}=-3e^{-4/3}\\), 정답은 ①이에요.","check":{"prompt":"\\(e^b\\)를 계산할 때 \\(9/2\\)가 곱으로 나오는 이유는 무엇인가요?","answer":"\\(e^{\\ln(9/2)-4/3}=(9/2)e^{-4/3}\\)이기 때문이에요."}}],"takeaway":["부호가 바뀌는 두 함숫값 사이에는 연속함수의 영점이 있어요.","합성식에 높은 거듭제곱이 있으면 영점에서 여러 미분조건이 동시에 생겨요.","후보가 남으면 별도의 도함수 부호 조건으로 골라요."]};</script>
