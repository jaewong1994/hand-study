<script>window.HandStudyRecord={"adminYear":2020,"answer":"201","contentHash":"30dd3694db550ec93d1199da654bb96f8196f9c716cb31e35f0a51f148dbd80c","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24730,"month":12,"number":29,"points":4,"preview":false,"questionHtml":"\u003cp>네 명의 학생 \u003cspan class=\"heq\">\\(A,\\,B,\\, C,\\,D\\)\u003c/span>에게 검은색 모자 \u003cspan class=\"heq\">\\(6\\)\u003c/span>개와 흰색 모자 \u003cspan class=\"heq\">\\(6\\)\u003c/span>개를 다음 규칙에 따라 남김없이 나누어 주는 경우의 수를 구하시오.(단, 같은 색 모자끼리 서로 구별하지 않는다.) [4점]\u003c/p>\u003cdiv class=\"hbox hcond\">\u003cp class=\"hcondr\">(가) 각 학생은 \u003cspan class=\"heq\">\\(1\\)\u003c/span>개 이상의 모자를 받는다.\u003c/p>\u003cp class=\"hcondr\">(나) 학생 \u003cspan class=\"heq\">\\(A\\)\u003c/span>가 받는 검은색 모자의 개수는 \u003cspan class=\"heq\">\\(4\\)\u003c/span>이상이다.\u003c/p>\u003cp class=\"hcondr\">(다) 흰색 모자보다 검은색 모자를 더 많이 받는 학생은 \u003cspan class=\"heq\">\\(A\\)\u003c/span>를 포함하여 2명 뿐이다.\u003c/p>\u003c/div>","questionText":"네 명의 학생 $A,\\,B,\\, C,\\,D$에게 검은색 모자 $6$개와 흰색 모자 $6$개를 다음 규칙에 따라 남김없이 나누어 주는 경우의 수를 구하시오.(단, 같은 색 모자끼리 서로 구별하지 않는다.) [4점]\n(가) 각 학생은 $1$개 이상의 모자를 받는다.(나) 학생 $A$가 받는 검은색 모자의 개수는 $4$이상이다.(다) 흰색 모자보다 검은색 모자를 더 많이 받는 학생은 $A$를 포함하여 2명 뿐이다.","sourceHash":"b06bf5a0b2fb0bec6bf09396e3e3e9b45788b8b282b2f6687b6e40c598275f2a","sourceKind":"csat","sourceLabel":"2020년 시행 수능 · 2021학년도 · 가형 · 29번","steps":[{"id":"s1","latex":"\\mathrm A\\text{의 검은 모자 수를 }b\\text{라 하면 }b=4,5,6"},{"id":"s2","latex":"b=6\\text{이면 다른 학생은 검은 모자가 없어 조건(다)에 어긋난다.}"},{"id":"s3","latex":"(\\mathrm I)\\ b=5:\\quad\\text{나머지 검은 모자 1개를 받는 학생을 고른다. }3\\text{가지}"},{"id":"s4","latex":"\\text{그 학생의 흰 모자는 }0;\\quad\\mathrm A\\text{의 흰 모자를 }x,\\text{나머지를 }y,z\\text{라 하면 }x+y+z=6,\\ y,z\\ge1"},{"id":"s5","latex":"0\\le x\\le4\u003c5,\\quad\\text{경우의 수}=3\\cdot{}_6\\mathrm C_2=45"},{"id":"s6","latex":"(\\mathrm {II})\\ b=4,\\quad\\text{한 학생에게 검은 모자 2개}:3\\text{가지}"},{"id":"s7","latex":"\\text{그 학생의 흰 모자가 }0:\\quad x+y+z=6,\\ y,z\\ge1,\\ x\\le3"},{"id":"s8","latex":"3\\left({}_6\\mathrm C_2-1\\right)=42\\quad(x=4,y=z=1\\text{ 제외})"},{"id":"s9","latex":"\\text{그 학생의 흰 모자가 }1:\\quad x+y+z=5,\\ y,z\\ge1\\ \\Rightarrow\\ 3\\cdot{}_5\\mathrm C_2=30"},{"id":"s10","latex":"(\\mathrm {III})\\ b=4,\\quad\\text{두 학생에게 검은 모자 1개씩}:{}_3\\mathrm C_2=3\\text{가지}"},{"id":"s11","latex":"\\text{그 둘 중 흰 모자를 0개 받는 학생은 한 명}:2\\text{가지}"},{"id":"s12","latex":"\\text{나머지 두 학생의 흰 모자는 각각 1개 이상, }\\mathrm A\\text{의 흰 모자는 }3\\text{개 이하}"},{"id":"s13","latex":"3\\cdot2\\left({}_6\\mathrm C_2-1\\right)=84"},{"id":"s14","latex":"45+42+30+84=\\boxed{201}"}],"track":"가형"};</script>
<script>window.HandStudyGuide={"itemId":24730,"sourceHash":"b06bf5a0b2fb0bec6bf09396e3e3e9b45788b8b282b2f6687b6e40c598275f2a","contentHash":"30dd3694db550ec93d1199da654bb96f8196f9c716cb31e35f0a51f148dbd80c","overview":{"goal":"A가 받는 검은 모자 수와 나머지 검은 모자 분배를 나눈 뒤, 흰 모자 수의 조건을 빠짐없이 세어요.","firstLook":"검은 모자는 6개뿐이고 A가 적어도 4개를 받아요. 그래서 A가 4개, 5개, 6개를 받는 세 경우부터 나누면 모든 분배를 겹치지 않게 셀 수 있어요.","conditions":[{"label":"모자를 받는 조건","meaning":"각 학생은 두 색을 합하여 적어도 1개를 받아야 해요. 검은 모자가 0개인 학생은 흰 모자를 반드시 받아야 해요."},{"label":"A의 검은 모자","meaning":"A의 검은 모자 수는 4, 5, 6 중 하나예요."},{"label":"검은 모자가 더 많은 학생","meaning":"A를 포함하여 정확히 두 명만 검은 모자 수가 흰 모자 수보다 커야 해요."}]},"chapters":[{"id":"c1","label":"A가 받는 검은 모자 수부터 나눠요","stepIds":["s1","s2"],"question":"A가 검은 모자 6개를 모두 받는 경우는 왜 바로 제외할까요?","hint":"다른 세 학생이 받는 검은 모자 수가 모두 0이면, 흰 모자보다 검은 모자가 많은 학생이 또 생길 수 있는지 봐요.","explanation":"A가 받는 검은 모자 수를 \\(b\\)라 하면 \\(b=4,5,6\\)이에요. 그런데 \\(b=6\\)이면 B, C, D는 검은 모자를 하나도 받지 못해요. 이 학생들이 받는 흰 모자 수는 \\(0\\) 이상이므로 검은 모자 수가 흰 모자 수보다 클 수 없어요. 그러면 조건 (다)를 만족하는 학생은 A 한 명뿐이어서, A를 포함한 두 명이어야 한다는 조건에 어긋나요. 따라서 \\(b=6\\)은 제외하고 \\(b=5\\)와 \\(b=4\\)만 세면 돼요.","check":{"prompt":"검은 모자를 받지 않은 학생이 조건 (다)의 두 번째 학생이 될 수 없는 이유는 무엇인가요?","answer":"그 학생의 검은 모자 수는 \\(0\\)이고 흰 모자 수는 음수가 될 수 없어서, 검은 모자가 흰 모자보다 많을 수 없기 때문이에요."}},{"id":"c2","label":"A가 검은 모자 다섯 개를 받는 경우를 세어요","stepIds":["s3","s4","s5"],"question":"남은 검은 모자 한 개를 받은 학생의 흰 모자 수는 왜 \\(0\\)으로 정해질까요?","hint":"그 학생이 A와 함께 검은 모자가 더 많은 두 번째 학생이 되어야 해요.","explanation":"A가 검은 모자 5개를 받으면 남은 검은 모자 1개를 받을 학생을 B, C, D 중에서 고르는 방법은 3가지예요. 그 학생이 A와 함께 조건 (다)를 만족하려면 흰 모자를 \\(0\\)개 받아야 해요. 흰 모자를 1개 이상 받으면 검은 모자 수가 더 많지 않아요.\n\n이제 A의 흰 모자 수를 \\(x\\), 검은 모자를 받지 않은 두 학생의 흰 모자 수를 \\(y,z\\)라 하면\n\n\\(x+y+z=6,\\qquad y\\ge1,\\quad z\\ge1\\)\n\n이에요. A도 검은 모자가 더 많아야 하므로 \\(0\\le x\\le4\\)이고, 위 식에서 \\(y,z\\ge1\\)이면 이 범위는 자동으로 만족돼요. \\(y'=y-1\\), \\(z'=z-1\\)로 두면 \\(x+y'+z'=4\\)이므로 음이 아닌 정수해는 \\({}_6\\mathrm C_2=15\\)개예요. 검은 모자 한 개를 받을 학생의 선택 3가지를 곱하면 \\(3\\times15=45\\)가지예요.","check":{"prompt":"\\(x\\le4\\)인 경우를 따로 빼지 않아도 되는 이유는 무엇인가요?","answer":"\\(x+y+z=6\\)에서 \\(y,z\\ge1\\)이므로 자동으로 \\(x\\le4\\)가 되기 때문이에요."}},{"id":"c3","label":"남은 두 개를 한 학생에게 주어요","stepIds":["s6","s7","s8","s9"],"question":"검은 모자 두 개를 받은 학생의 흰 모자는 왜 \\(0\\)개 또는 \\(1\\)개만 가능할까요?","hint":"그 학생은 A와 함께 검은 모자가 더 많은 두 번째 학생이어야 해요.","explanation":"A가 검은 모자 4개를 받고, 남은 검은 모자 2개를 한 학생이 모두 받는 경우예요. 그 학생을 고르는 방법은 3가지예요. 이 학생이 검은 모자가 더 많은 두 번째 학생이 되려면 흰 모자 수는 \\(0\\) 또는 \\(1\\)이어야 해요.\n\n흰 모자를 \\(0\\)개 받는다고 해요. A의 흰 모자를 \\(x\\), 검은 모자를 받지 않은 두 학생의 흰 모자를 \\(y,z\\)라 하면 \\(x+y+z=6\\), \\(y,z\\ge1\\)이에요. 전체 음이 아닌 정수해는 \\({}_6\\mathrm C_2=15\\)개지만 A도 검은 모자가 더 많아야 하므로 \\(x\\le3\\)이어야 해요. \\(x=4\\)이면 \\(y=z=1\\)인 한 경우뿐이므로 이를 빼면 \\(15-1=14\\)개, 학생 선택까지 곱해 \\(3\\times14=42\\)가지예요.\n\n흰 모자를 \\(1\\)개 받는다면 남은 흰 모자 5개에 대하여 \\(x+y+z=5\\), \\(y,z\\ge1\\)이에요. 이때 \\(x\\le3\\)은 자동으로 만족되고 해는 \\({}_5\\mathrm C_2=10\\)개예요. 따라서 \\(3\\times10=30\\)가지예요.","check":{"prompt":"흰 모자를 \\(0\\)개 받는 경우에 제외하는 한 경우를 구체적으로 쓰면 무엇인가요?","answer":"\\(x=4,y=1,z=1\\)인 경우예요. 이때 A는 검은 모자와 흰 모자를 각각 4개 받아 검은 모자가 더 많지 않으므로 제외해요."}},{"id":"c4","label":"남은 두 개를 두 학생에게 나눠요","stepIds":["s10","s11","s12","s13","s14"],"question":"검은 모자를 한 개씩 받은 두 학생 중 왜 정확히 한 명만 흰 모자를 받지 않아야 할까요?","hint":"흰 모자를 \\(0\\)개 받은 학생만 검은 모자 한 개가 흰 모자보다 많아져요.","explanation":"A가 검은 모자 4개를 받고, B, C, D 중 두 학생이 검은 모자를 한 개씩 받는 경우예요. 그 두 학생을 고르는 방법은 \\({}_3\\mathrm C_2=3\\)가지예요. 검은 모자 한 개를 받은 학생은 흰 모자를 \\(0\\)개 받아야만 검은 모자가 더 많아져요. 조건 (다)에서 A 이외에는 한 명만 더 필요하므로, 두 학생 가운데 정확히 한 명만 흰 모자를 \\(0\\)개 받아야 해요. 그 한 명을 고르는 방법은 2가지예요.\n\n나머지 검은 모자 한 개를 받은 학생과 검은 모자를 받지 않은 학생은 각각 흰 모자를 적어도 한 개 받아야 해요. A의 흰 모자 수를 \\(x\\), 이 두 학생의 흰 모자 수를 \\(y,z\\)라 하면 다시 \\(x+y+z=6\\), \\(y,z\\ge1\\)이에요. A가 조건 (다)에 포함되려면 \\(x\\le3\\)이므로 앞과 같이 \\({}_6\\mathrm C_2-1=14\\)개예요. 따라서 이 경우는\n\n\\({}_3\\mathrm C_2\\times2\\times14=3\\times2\\times14=84\\)\n\n가지예요. 모든 경우를 더하면 \\(45+42+30+84=201\\)이므로 정답은 \\(201\\)이에요.","check":{"prompt":"검은 모자를 한 개씩 받은 두 학생이 모두 흰 모자를 \\(0\\)개 받으면 왜 안 될까요?","answer":"두 학생 모두 검은 모자가 흰 모자보다 많아져 A까지 합하면 세 명이 되므로, 정확히 두 명이라는 조건 (다)에 어긋나요."}}],"takeaway":["한 색의 수에 강한 제한이 있으면 그 색의 분배부터 겹치지 않게 경우를 나눠요.","‘검은 모자가 더 많다’는 말은 각 학생마다 두 색의 수를 비교하는 부등식으로 바꿔요.","적어도 한 개를 받아야 하는 조건과 정확히 두 명이라는 조건을 각각 확인한 뒤 경우의 수를 더해요."]};</script>
