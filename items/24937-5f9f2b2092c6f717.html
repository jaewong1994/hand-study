<script>window.HandStudyRecord={"adminYear":2024,"answer":"17","contentHash":"9ed09be346a11f3c7f1b3d3276ea300322049ac507a61029998e27b10a9fb60f","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24937,"month":11,"number":30,"points":4,"preview":false,"questionHtml":"\u003cp>두 상수 \u003cspan class=\"heq\">\\(a \\, \\left( 1 \\leq a \\leq 2 \\right)\\)\u003c/span>, \u003cspan class=\"heq\">\\(b\\,\\)\u003c/span>에 대하여 함수 \u003cspan class=\"heq\">\\(f \\left(x \\right)= \\sin \\, \\left(a x+b+ \\sin \\,x \\right)\\,\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox hcond\">\u003cp class=\"hcondr\">(가) \u003cspan class=\"heq\">\\(f \\left(0 \\right)=0\\)\u003c/span>, \u003cspan class=\"heq\">\\(f \\left(2 \\pi \\right)=2 \\pi a+b\\)\u003c/span>\u003c/p>\u003cp class=\"hcondr\">(나) \u003cspan class=\"heq\">\\(f&#x27; \\left(0 \\right)=f&#x27; \\left(t \\right)\\,\\)\u003c/span>인 양수 \u003cspan class=\"heq\">\\(t\\,\\)\u003c/span>의 최솟값은 \u003cspan class=\"heq\">\\(4 \\pi\\,\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp>함수 \u003cspan class=\"heq\">\\(f \\left(x \\right)\\,\\)\u003c/span>가 \u003cspan class=\"heq\">\\(x= \\alpha\\,\\)\u003c/span>에서 극대인 \u003cspan class=\"heq\">\\(\\alpha\\,\\)\u003c/span>의 값 중 열린구간 \u003cspan class=\"heq\">\\(\\left(0,\\,4 \\pi \\right)\\,\\)\u003c/span>에 속하는 모든 값의 집합을 \u003cspan class=\"heq\">\\(A\\,\\)\u003c/span>라 하자. 집합 \u003cspan class=\"heq\">\\(A\\,\\)\u003c/span>의 원소의 개수를 \u003cspan class=\"heq\">\\(n\\)\u003c/span>, 집합 \u003cspan class=\"heq\">\\(A\\,\\)\u003c/span>의 원소 중 가장 작은 값을 \u003cspan class=\"heq\">\\(\\alpha_{1}\\,\\)\u003c/span>이라 하면, \u003cspan class=\"heq\">\\(n \\alpha_{1}-a b=\\frac{q}{p} \\pi\\,\\)\u003c/span>이다. \u003cspan class=\"heq\">\\(p+q\\,\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(p\\,\\)\u003c/span>와 \u003cspan class=\"heq\">\\(q\\,\\)\u003c/span>는 서로소인 자연수이다.)\u003c/p>\u003cp>[4점]\u003c/p>","questionText":"두 상수 $a \\, \\left( 1 \\leq a \\leq 2 \\right)$, $b\\,$에 대하여 함수 $f \\left(x \\right)= \\sin \\, \\left(a x+b+ \\sin \\,x \\right)\\,$가 다음 조건을 만족시킨다.\n(가) $f \\left(0 \\right)=0$, $f \\left(2 \\pi \\right)=2 \\pi a+b$(나) $f\\,' \\left(0 \\right)=f\\,' \\left(t \\right)\\,$인 양수 $t\\,$의 최솟값은 $4 \\pi\\,$이다.\n함수 $f \\left(x \\right)\\,$가 $x= \\alpha\\,$에서 극대인 $\\alpha\\,$의 값 중 열린구간 $\\left(0,\\,4 \\pi \\right)\\,$에 속하는 모든 값의 집합을 $A\\,$라 하자. 집합 $A\\,$의 원소의 개수를 $n$, 집합 $A\\,$의 원소 중 가장 작은 값을 $\\alpha_{1}\\,$이라 하면, $n \\alpha_{1}-a b=\\frac{q}{p} \\pi\\,$이다. $p+q\\,$의 값을 구하시오. (단, $p\\,$와 $q\\,$는 서로소인 자연수이다.)\n[4점]","sourceHash":"5b2eb24e136afc03ce81290ced1913660e4f15edfa2fca33aae613b3c93278d7","sourceKind":"csat","sourceLabel":"2024년 시행 수능 · 2025학년도 · 미적분 · 30번","steps":[{"id":"s1","latex":"\\sin b=0,\\quad\\sin(2\\pi a+b)=2\\pi a+b\\quad\\Rightarrow\\quad b=-2\\pi a"},{"id":"s2","latex":"1\\le a\\le2,\\quad\\sin b=0\\quad\\Rightarrow\\quad a=1,\\frac32,2"},{"id":"s3","latex":"a=1\\text{ 또는 }2:\\quad f\\prime(2\\pi)=f\\prime(0)\\quad\\Rightarrow\\quad\\text{조건 (나)에 어긋남}"},{"id":"s4","latex":"a=\\frac32,\\quad b=-3\\pi,\\quad h(x)=\\frac32x+\\sin x,\\quad f(x)=-\\sin h(x)"},{"id":"s5","latex":"f\\prime(x)=-\\cos h(x)\\left(\\frac32+\\cos x\\right),\\quad f\\prime(0)=-\\frac52"},{"id":"s6","latex":"\\frac12\\le\\frac32+\\cos x\\le\\frac52,\\quad-1\\le\\cos h(x)\\le1"},{"explanation":{"body":"\\(\\frac32+\\cos t\\)는 양수이고 최대가 \\(\\frac52\\)예요. 여기에 \\(-\\cos h(t)\\)를 곱해 \\(-\\frac52\\)가 되려면, 양수인 인수는 \\(\\frac52\\), 다른 인수는 \\(-1\\)이어야 해요. 그래서 \\(\\cos t=1\\)과 \\(\\cos h(t)=1\\)을 동시에 풀어야 합니다. 둘 중 하나만 확인하면 후보가 더 많이 남아요.","skillTags":["function.equality-condition"],"title":"곱이 가장 작은 값이 되려면 두 조건이 동시에 필요해요"},"id":"s7","latex":"f\\prime(t)=-\\frac52\\ \\Leftrightarrow\\ \\cos t=1,\\ \\cos h(t)=1"},{"id":"s8","latex":"t=2j\\pi\\ (j=1,2,\\ldots),\\quad\\cos h(t)=\\cos3j\\pi=(-1)^j"},{"id":"s9","latex":"j\\text{의 최솟값}=2\\quad\\Rightarrow\\quad t\\text{의 최솟값}=4\\pi"},{"id":"s10","latex":"h\\prime(x)=\\frac32+\\cos x>0,\\quad h(0)=0,\\quad h(4\\pi)=6\\pi"},{"id":"s11","latex":"\\text{극대: }h(x)=\\frac{3\\pi}{2},\\frac{7\\pi}{2},\\frac{11\\pi}{2}\\quad\\Rightarrow\\quad n=3"},{"id":"s12","latex":"h(\\pi)=\\frac{3\\pi}{2}\\quad\\Rightarrow\\quad\\alpha_1=\\pi"},{"id":"s13","latex":"n\\alpha_1-ab=3\\pi-\\frac32(-3\\pi)=\\frac{15\\pi}{2}\\quad\\Rightarrow\\quad p+q=17"}],"track":"미적분"};</script>
<script>window.HandStudyGuide={"itemId":24937,"sourceHash":"5b2eb24e136afc03ce81290ced1913660e4f15edfa2fca33aae613b3c93278d7","contentHash":"9ed09be346a11f3c7f1b3d3276ea300322049ac507a61029998e27b10a9fb60f","overview":{"goal":"함숫값 조건으로 상수 후보를 줄이고, 도함숫값이 처음 같아지는 때를 확인한 뒤 극대가 되는 위치를 세어요.","firstLook":"복잡한 합성함수를 바로 그리기보다 \\(x=0,2\\pi\\)를 먼저 넣어 보세요. 안쪽의 \\(\\sin x\\)가 사라지는 두 점이에요.","conditions":[{"label":"\\(1\\le a\\le2\\), \\(f(0)=0\\)","meaning":"\\(\\sin b=0\\)이므로 \\(b\\)는 \\(\\pi\\)의 정수배예요. 다른 함숫값 조건과 결합하면 \\(a\\)의 후보가 줄어요."},{"label":"\\(f(2\\pi)=2\\pi a+b\\)","meaning":"\\(u=2\\pi a+b\\)라 하면 \\(\\sin u=u\\)가 돼요. 이 등식은 \\(u=0\\)일 때 성립해요."},{"label":"\\(f^{\\prime}(0)=f^{\\prime}(t)\\)인 양수 \\(t\\)의 최솟값이 \\(4\\pi\\)","meaning":"\\(4\\pi\\)에서 등식이 성립하는 것뿐 아니라, 그보다 작은 양수에서는 성립하지 않아야 해요."},{"label":"\\(0<x<4\\pi\\)에서 극대인 위치","meaning":"양 끝점은 제외하고, 도함수가 양수에서 음수로 바뀌는 위치를 세어요."}]},"chapters":[{"id":"c1","label":"상수 후보를 세 개로 줄이기","stepIds":["s1","s2"],"question":"\\(\\sin u=u\\)를 만족하는 \\(u\\)는 왜 0뿐일까요?","hint":"양수 \\(u\\)에서 \\(u-\\sin u\\)를 미분하고, 음수 쪽은 대칭으로 생각해 보세요.","explanation":"\\(u>0\\)이면 \\(u-\\sin u=\\int_0^u(1-\\cos v)\\,dv>0\\)이에요. 적분 안의 값은 0보다 크거나 같고 구간 전체에서 0은 아니기 때문이에요. 음수 쪽도 대칭으로 등식이 성립하지 않으므로 \\(b=-2\\pi a\\)예요. 여기에 \\(\\sin b=0\\), \\(1\\le a\\le2\\)를 함께 쓰면 \\(a=1,3/2,2\\)만 남아요.","check":{"prompt":"\\(a\\)를 정수라고 가정해도 되나요?","answer":"안 돼요. \\(2a\\)가 정수이므로 \\(a=3/2\\)도 포함해야 해요."}},{"id":"c2","label":"더 일찍 같은 값이 나오면 제외하기","stepIds":["s3","s4","s5"],"question":"\\(a=1,2\\)는 왜 탈락할까요?","hint":"최솟값이 \\(4\\pi\\)라는 조건에 비추어 \\(2\\pi\\)에서의 미분계수를 비교해 보세요.","explanation":"일반적으로 \\(f^{\\prime}(x)=\\cos(ax+b+\\sin x)(a+\\cos x)\\)예요. \\(a=1,2\\)이면 \\(b=-2\\pi a\\)가 \\(2\\pi\\)의 정수배라서 0과 \\(2\\pi\\)에서 미분계수가 같아요. 따라서 더 작은 양수에서 이미 같아져 탈락해요. 남은 값은 \\(a=3/2,b=-3\\pi\\)예요. 기존 풀이의 \\(h(x)=3x/2+\\sin x\\)로 안쪽 식을 묶으면 \\(f(x)=-\\sin h(x)\\), \\(f^{\\prime}(0)=-5/2\\)가 돼요.","check":{"prompt":"두 후보를 제외한 것만으로 남은 후보가 모든 조건을 만족한다고 끝내도 될까요?","answer":"아직은 아니에요. 남은 후보에서 처음 같아지는 양수가 실제로 \\(4\\pi\\)인지 확인해야 해요."}},{"id":"c3","label":"두 인수의 등호 조건 함께 보기","stepIds":["s6","s7","s8","s9"],"question":"도함숫값이 \\(-5/2\\)가 되려면 두 인수는 각각 어떤 값이어야 할까요?","hint":"\\(3/2+\\cos t\\)는 항상 양수이고 최대가 \\(5/2\\)라는 점을 이용하세요.","explanation":"\\(3/2+\\cos t\\)는 \\(1/2\\)부터 \\(5/2\\)까지이고 \\(-\\cos h(t)\\)는 -1부터 1까지예요. 곱이 \\(-5/2\\)가 되려면 두 인수가 동시에 \\(5/2,-1\\)이어야 해요. 따라서 \\(\\cos t=1\\), \\(\\cos h(t)=1\\)을 함께 풀어요. 양수인 \\(t=2j\\pi\\)를 대입하면 \\(\\cos h(t)=(-1)^j\\)이므로 가장 작은 가능한 양의 정수 \\(j\\)는 2예요. 처음 같은 값이 나오는 때는 \\(4\\pi\\)로 조건과 맞아요.","check":{"prompt":"\\(t=2\\pi\\)에서는 왜 미분계수가 같지 않나요?","answer":"첫 인수는 최대가 되지만 \\(h(2\\pi)=3\\pi\\)여서 \\(\\cos h(2\\pi)=-1\\)이에요. 도함숫값은 \\(5/2\\)가 되어 부호가 달라요."}},{"id":"c4","label":"안쪽 값의 증가로 극대 위치 세기","stepIds":["s10","s11","s12","s13"],"question":"\\(h(x)\\)가 계속 증가한다는 사실을 극대 개수에 어떻게 쓸까요?","hint":"\\(x\\)가 0부터 \\(4\\pi\\)까지 움직일 때 \\(h(x)\\)가 지나가는 범위에서 \\(-\\sin h(x)\\)의 봉우리를 세어 보세요.","explanation":"\\(h^{\\prime}(x)=3/2+\\cos x>0\\)이므로 \\(h(x)\\)는 0부터 \\(6\\pi\\)까지 한 번씩 지나가요. \\(-\\sin u\\)가 극대인 내부 값은 \\(u=3\\pi/2,7\\pi/2,11\\pi/2\\) 세 개이고, 각각에 대응하는 \\(x\\)도 하나씩 있어요. 가장 작은 위치는 \\(h(\\pi)=3\\pi/2\\)에서 \\(\\alpha_1=\\pi\\)예요. 따라서 \\(n\\alpha_1-ab=3\\pi+9\\pi/2=15\\pi/2\\), 서로소인 \\(p,q\\)는 2와 15이므로 합은 17이에요.","check":{"prompt":"안쪽 식이 증가한다는 확인 없이 봉우리 개수를 그대로 옮겨 세어도 될까요?","answer":"안 돼요. 안쪽 값이 되돌아가면 같은 값을 여러 번 지날 수 있어요. 여기서는 도함수가 항상 양수여서 한 번씩만 지나가요."}}],"takeaway":["최솟값 조건은 지정한 값에서의 성립과 그 이전에서의 불성립을 함께 확인해요.","합성함수의 극대 위치를 안쪽 값으로 셀 때는 안쪽 함수의 증감을 먼저 확인해요."]};</script>
