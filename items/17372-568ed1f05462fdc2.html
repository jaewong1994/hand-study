<script>window.HandStudyGuide={"itemId":17372,"sourceHash":"df3a08c235a097a57d6a3c6f65418590b58dcd78503733551aaa95216b6a2ca4","contentHash":"84cc7dc982d4c0f4f21325e615e87d2a80b2b7d0247894f4119dce7528352e00","overview":{"goal":"적분식의 미분가능성으로 삼차함수 \\(g\\)를 정하고, 합성방정식의 근 개수로 \\(a\\)를 구해요.","firstLook":"\\(x=2a\\)를 넣으면 \\(g(2a)=0\\)이고 상수항 조건에서 \\(g(0)=0\\)이에요. 절댓값을 포함한 왼쪽이 미분가능해야 한다는 점이 \\(2a\\)에서 같은 인수가 두 번 곱해지게 해요.","conditions":[{"label":"(가)의 값","meaning":"\\(x=2a\\)에서 적분이 \\(0\\)이므로 \\(g(2a)=0\\)이에요."},{"label":"(가)의 미분","meaning":"오른쪽이 미분가능하므로 \\(x|g(x)|\\)도 모든 점에서 미분가능해야 해요."},{"label":"(나)","meaning":"\\(g\\)의 두 서로 다른 근 \\(0,2a\\)를 \\(f(x)\\)가 몇 번 만드는지 세어요."}]},"chapters":[{"id":"c1","label":"절댓값의 미분가능성으로 g를 정해요","stepIds":["s1","s2"],"question":"\\(2a\\)가 왜 \\(g(x)\\)에서 같은 인수가 두 번 곱해진 근이어야 할까요?","hint":"\\(2a>0\\)이므로 이 점 근처에서 앞의 \\(x\\)는 \\(0\\)이 아니에요. 따라서 \\(|g(x)|\\) 자체가 미분가능해야 해요.","explanation":"\\(x=2a\\)를 (가)에 넣으면 오른쪽 적분이 \\(0\\)이고 \\(2a>0\\)이므로 \\(g(2a)=0\\)이에요. 상수항이 \\(0\\)이라 \\(g(0)=0\\)도 성립해 \\(g(x)=x(x-2a)(x-c)\\)로 둘 수 있어요. 오른쪽 적분은 연속함수의 적분이므로 미분가능하고, 따라서 \\(x|g(x)|\\)도 미분가능해요. \\(2a\\ne0\\)이므로 \\(|g(x)|\\)가 이 점에서 꺾이지 않으려면 \\(g'(2a)=0\\)이어야 해요. 그래서 \\(c=2a\\), \\(g(x)=x(x-2a)^2\\)예요.","check":{"prompt":"앞의 인수 \\(x\\)가 \\(2a\\)에서 꺾임을 없애 줄 수 없는 이유는 무엇인가요?","answer":"\\(a>0\\)라 \\(2a\ne0\\)이므로 그 인수는 \\(2a\\) 근처에서 0이 아니고 부호도 바뀌지 않기 때문이에요."}},{"id":"c2","label":"적분식을 미분해 f를 구해요","stepIds":["s3","s4"],"question":"미분한 뒤 \\(x=a\\)에서는 왜 나눗셈 대신 연속성을 써야 할까요?","hint":"먼저 \\(x\ne a\\)에서 \\(a-x\\)로 나누고, 빠진 한 점은 \\(f\\)의 연속성으로 채워요.","explanation":"\\(x|g(x)|=x|x|(x-2a)^2\\)를 미분하면 \\(4|x|(x-a)(x-2a)\\)이고, 오른쪽을 미분하면 \\((a-x)f(x)\\)예요. \\(x\ne a\\)에서는 두 식을 비교해 \\(f(x)=4|x|(2a-x)\\)를 얻어요. \\(x=a\\)에서는 \\(a-x=0\\)이라 바로 나눌 수 없지만, \\(f\\)가 연속이고 오른쪽 식도 연속이므로 같은 식이 \\(x=a\\)에서도 성립해요.","check":{"prompt":"\\(x=a\\)를 미분한 등식에 바로 넣으면 \\(f(a)\\)가 정해지나요?","answer":"양변이 모두 \\(0\\)이 되어 정해지지 않아요. 주변의 식과 \\(f\\)의 연속성을 써야 \\(f(a)=4a^2\\)를 얻어요."}},{"id":"c3","label":"근 개수로 a를 정하고 적분해요","stepIds":["s5","s6","s7","s8"],"question":"\\(g(f(x))=0\\)의 근이 네 개가 되려면 왜 \\(4a^2=2a\\)여야 할까요?","hint":"\\(f(x)=0\\)의 두 근과 \\(f(x)=2a\\)의 음수 쪽·음이 아닌 쪽 근을 따로 세어요.","explanation":"\\(g(f(x))=0\\)은 \\(f(x)=0\\) 또는 \\(f(x)=2a\\)예요. 첫 방정식의 근은 \\(0,2a\\) 두 개예요. \\(x<0\\)에서 \\(f(x)=2a\\)는 정확히 한 근을 가져서 지금까지 세 개예요. \\(x\\ge0\\)에서 \\(f(x)=4x(2a-x)\\)는 \\(x=a\\)에서 가장 큰 값 \\(4a^2\\)를 가져요. 전체 근이 네 개가 되려면 수평선 \\(y=2a\\)가 이 포물선에 한 점에서 만나야 하므로 \\(4a^2=2a\\)예요. \\(a>0\\)이어서 \\(a=1/2\\)예요.\n\n따라서 구할 적분은 \\(\\int_{-1}^{1}4|x|(1-x)dx\\)예요. \\(4|x|\\)는 좌우가 같고 \\(4x|x|\\)는 좌우에서 부호가 반대라 후자의 적분은 \\(0\\)이에요. 그러므로 값은 \\(2\\int_0^1 4x\\,dx=4\\)예요.","check":{"prompt":"\\(4a^2>2a\\)이면 음이 아닌 쪽에서 근이 몇 개 생기나요?","answer":"수평선이 포물선의 가장 큰 값보다 아래에 있어 서로 다른 두 점에서 만나므로 전체 근이 다섯 개가 돼요."}}],"takeaway":["절댓값 식이 미분가능해야 하면 영점에서 안쪽 함수의 도함숫값도 확인해요.","어떤 인수로 나눈 뒤 빠지는 점은 원래 함수의 연속성으로 따로 확인해요.","합성방정식의 근 개수는 바깥 함수의 근마다 안쪽 방정식의 근을 나누어 세어요."]};</script>
