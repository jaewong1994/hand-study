<script>window.HandStudyGuide={"itemId":17992,"sourceHash":"24a55c4d96cc8db92733a621d1bd01ad9a4fffcc32a2a7ea16114aff334ee117","contentHash":"a7ef2f9406bf8fd16c18e8930470f65c9638bd1a93081ed4a66861b96a6741e7","overview":{"goal":"서로 값을 맞바꾸는 두 원소의 위치를 단조 조건과 f(5)<f(4) 조건으로 분류해 함수 개수를 세어요.","firstLook":"맞바꾸는 두 원소를 a<b로 놓아요. 둘 다 1,2,3 안에 있으면 단조 조건과 바로 충돌하므로 4나 5가 반드시 끼어요.","conditions":[{"label":"앞 세 값 단조","meaning":"\\(f(1)\\le f(2)\\le f(3)\\)이에요."},{"label":"뒤 두 값","meaning":"\\(1<f(5)<f(4)\\)예요."}]},"chapters":[{"id":"c1","label":"가능한 맞바꿈 쌍을 찾어요","stepIds":["s1","s2","s3"],"question":"a,b가 모두 3 이하이면 왜 불가능할까요?","hint":"\\(a<b\\)와 \\(f(a)=b,f(b)=a\\)를 단조 부등식에 넣어요.","explanation":"\\(a<b\\le3\\)이면 단조 조건에서 \\(f(a)\\le f(b)\\)여야 하지만 맞바꿈 조건은 \\(b\\le a\\)를 요구해 모순이에요. 따라서 큰 원소 \\(b\\)는 \\(4\\) 또는 \\(5\\)예요. \\(b=4\\)이면 \\(f(4)=a\\), \\(f(a)=4\\)이고 \\(1<f(5)<a\\le3\\)이므로 \\(a=3\\), \\(f(5)=2\\)만 가능해요. \\(b=5\\)이고 \\(a\\le3\\)이면 \\(1<a\\)라 \\(a=2\\) 또는 \\(3\\)이에요. 마지막으로 \\(a=4,b=5\\)도 가능해요. 따라서 쌍은 \\((3,4),(2,5),(3,5),(4,5)\\) 네 가지뿐이에요.","check":{"prompt":"\\(b=4\\)일 때 \\(a=2\\)가 안 되는 이유는 무엇인가요?","answer":"\\(1<f(5)<2\\)를 만족하는 X의 원소가 없기 때문이에요."}},{"id":"c2","label":"쌍 삼사와 이오를 세어요","stepIds":["s4","s5","s6"],"question":"(3,4)에서 자유롭게 정할 값은 무엇인가요?","hint":"\\(f(3)=4,f(4)=3,f(5)=2\\)가 고정돼요.","explanation":"(3,4)에서는 \\(f(1)\\le f(2)\\le f(3)=4\\)이므로 1부터4에서 중복 허용해 두 값을 고르는 \\({}_4\\mathrm H_2=10\\)가지예요. (2,5)에서는 \\(f(2)=5,f(5)=2\\)이고 단조 조건 때문에 \\(f(3)=5\\)예요. f(1)은 1부터5까지 5가지이고, \\(2<f(4)\\)라 f(4)는 3,4,5의 3가지여서 \\(5\\cdot3=15\\)가지예요.","check":{"prompt":"(2,5)에서 f(3)가 5로 고정되는 이유는 무엇인가요?","answer":"\\(f(2)=5\\le f(3)\\)이고 공역의 가장 큰 값이 5이기 때문이에요."}},{"id":"c3","label":"쌍 삼오와 사오를 세어요","stepIds":["s7","s8"],"question":"(3,5)에서 f(4)는 왜 두 가지인가요?","hint":"\\(f(5)=3\\)보다 커야 해요.","explanation":"\\((3,5)\\)에서는 \\(f(3)=5,f(5)=3\\)이고 \\(f(4)>3\\)이라 \\(f(4)\\)는 \\(4,5\\) 두 가지예요. \\(f(1)\\le f(2)\\le5\\)는 \\(1\\)부터 \\(5\\)에서 중복 허용해 두 값을 고르는 \\({}_5\\mathrm H_2=15\\)가지라 모두 \\(30\\)가지예요. \\((4,5)\\)에서는 \\(f(4)=5,f(5)=4\\)가 고정되고 앞 세 값은 \\(1\\)부터 \\(5\\)에서 중복 허용해 세 값을 고르는 \\({}_5\\mathrm H_3=35\\)가지예요.","check":{"prompt":"\\({}_5\\mathrm H_3\\)이 세는 대상은 무엇인가요?","answer":"감소하지 않는 세 값 \\(f(1),f(2),f(3)\\)을 1부터5에서 고르는 경우예요."}},{"id":"c4","label":"네 경우가 겹치지 않음을 확인해요","stepIds":["s9"],"question":"한 함수가 두 경우에 동시에 세어질 수 있을까요?","hint":"각 경우는 \\(f(4),f(5)\\) 또는 고정된 맞바꿈 쌍이 달라요.","explanation":"네 경우의 고정값을 비교하면 서로 겹치지 않아요. 예를 들어 (3,4)는 \\(f(4)=3,f(5)=2\\), (4,5)는 \\(f(4)=5,f(5)=4\\)로 다르고, 5와 맞바꾸는 경우도 \\(f(5)=2,3,4\\)로 구별돼요. 따라서 전체는 \\(10+15+30+35=90\\)이에요.","check":{"prompt":"합하기 전에 불중복을 확인하는 기준은 무엇인가요?","answer":"각 경우에서 고정되는 \\(f(5)\\)와 맞바꿈 쌍이 서로 달라요."}}],"takeaway":["단조 조건이 있는 자리끼리 값을 맞바꾸면 순서 부등식과 충돌하는지 먼저 봐요.","가능한 맞바꿈 쌍을 완전히 분류한 뒤 남은 함숫값만 세어요.","여러 경우를 더할 때 고정된 함숫값으로 서로 겹치지 않는지 확인해요."]};</script>
