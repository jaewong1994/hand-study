<script>window.HandStudyRecord={"itemId":11989,"sourceLabel":"2023 교육청 고1 수학 9월 30번","adminYear":2023,"grade":1,"month":9,"number":30,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"이차함수 $y=f \\left(x \\right)$가 있다. 중심이 함수 $y=f \\left(x \\right)$의 그래프 위에 있고 반지름의 길이가 $1$인 원 중에서 다음 조건을 만족시키는 중심이 서로 다른 원의 개수는 $5$이다.\n 원을 $x$축의 방향으로 $m$만큼, $y$축의 방향으로 $m$만큼 평행이동한 원이 $x$축과 $y$축에 동시에 접하도록 하는 실수 $m$의 값이 $1$개 이상 존재한다.\n이 $5$개의 원의 중심의 $x$좌표를 작은 수부터 크기 순서대로 $x _{1}$, $x _{2}$, $x _{3}$, $x _{4}$, $x _{5}$라 하자.\n $x _{1} =0$, $x _{2} +x _{3} +x _{4} +x _{5} =20$\n이고 $x _{1} \\leq x \\leq x _{5}$에서 함수 $f \\left(x \\right)$의 최솟값이 $0$보다 클 때, $f \\left(20 \\right)$의 값을 구하시오. [4점]","answer":"82","sourceHash":"58d42f5a4e31ac68d379daf46f4877383a0db681ea50c993d2d10857b6df5380","steps":[{"id":"s1","latex":"(u+m,f(u)+m)\\in\\{(1,1),(1,-1),(-1,1),(-1,-1)\\}"},{"id":"s2","latex":"g(x)=f(x)-x,\\quad g(x)\\in\\{-2,0,2\\}"},{"id":"s3","latex":"\\#\\{x:g(x)\\in\\{-2,0,2\\}\\}=5\\Rightarrow g(t)\\in\\{-2,2\\}"},{"id":"s4","latex":"x_1+\\cdots+x_5=5t=20\\Rightarrow t=4"},{"id":"s5","latex":"x_1=0\\Rightarrow x_5=8"},{"id":"s6","latex":"|g(0)-g(4)|=4\\Rightarrow16|p|=4\\Rightarrow|p|=\\frac14"},{"id":"s7","latex":"g(x)=\\frac14(x-4)^2-2\\quad\\text{or}\\quad g(x)=-\\frac14(x-4)^2+2"},{"id":"s8","latex":"\\begin{array}{c|c}g(x)&\\min_{[0,8]}\\{g(x)+x\\}\\\\\\hline\\frac14(x-4)^2-2&1\\\\-\\frac14(x-4)^2+2&-2\\end{array}"},{"id":"s9","latex":"f(20)=g(20)+20=64-2+20=82"}],"diagram":null,"contentHash":"0fa413e8384e9447b5fcdacc87d1a2b8c759d0891701f02d25f05f0ffe291f1d","questionHtml":"\u003cp class=\"hp\">이차함수 \u003cspan class=\"heq\">\\(y=f \\left(x \\right)\\)\u003c/span>가 있다. 중심이 함수 \u003cspan class=\"heq\">\\(y=f \\left(x \\right)\\)\u003c/span>의 그래프 위에 있고 반지름의 길이가 \u003cspan class=\"heq\">\\(1\\)\u003c/span>인 원 중에서 다음 조건을 만족시키는 중심이 서로 다른 원의 개수는 \u003cspan class=\"heq\">\\(5\\)\u003c/span>이다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">원을 \u003cspan class=\"heq\"
