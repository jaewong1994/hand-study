  <script>window.HandStudyRecord={"itemId":16815,"sourceLabel":"2020 교육청 고3 수리나형 4월 30번","adminYear":2020,"grade":3,"month":4,"number":30,"track":"수리나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"양의 실수 $t$와 최고차항의 계수가 $1$인 삼차함수 $f(x)$에 대하여 함수\n $g(t)= \\frac{f(t)-f(0)}{t}$\n이라 하자. 두 함수 $f(x)$와 $g(t)$가 다음 조건을 만족시킨다.\n(가) 함수 $g(t)$의 최솟값은 $0$이다.(나) $x$에 대한 방정식 $f'(x)=g(a)$를 만족시키는 $x$의 값은 $a$와 $\\frac{5}{3}$이다. (단, $a> \\frac{5}{3}$인 상수이다.)\n자연수 $m$에 대하여 집합 $A _{m}$을\n $A _{m} = \\left\\{ x\\,|\\,f'(x)=g(m),\\,0\u003cx{\\leq}m \\right\\}$\n이라 할 때, $n(A _{m} )=2$를 만족시키는 모든 자연수 $m$의 값의 합을 구하시오. [4점]","answer":"35","sourceHash":"a75cc8a7ede0ec88e4cd66394ccbb0deeb1ac352783da88c081b6977c796c565","steps":[{"id":"s1","latex":"g(t)=(t-k)^2\\ (k>0),\\quad f(x)-f(0)=x(x-k)^2"},{"id":"s2","latex":"f\\prime(x)=(x-k)(3x-k),\\quad f\\prime(a)=g(a)\\Rightarrow2a(a-k)=0\\Rightarrow a=k"},{"id":"s3","latex":"k/3=5/3\\Rightarrow k=a=5"},{"id":"s4","latex":"h_m(x)=f\\prime(x)-g(m)=3x^2-20x+25-(m-5)^2"},{"id":"s5","latex":"\\text{꼭짓점 }x=10/3,\\quad h_m(10/3)=-25/3-(m-5)^2\u003c0"},{"id":"s6","latex":"\\text{두 근이 }(0,m]\\text{에 있음}\\iff m>10/3,\\ h_m(0)>0,\\ h_m(m)\\ge0"},{"id":"s7","latex":"0\u003cm\u003c10,\\quad2m(m-5)\\ge0\\Rightarrow m=5,6,7,8,9"},{"id":"s8","latex":"5+6+7+8+9=35"}],"diagram":null,"contentHash":"8494a3990c64c39008614210d045ebed502baeeb7bcad7d4e6dbfe6c45427a81","questionHtml":"\u003cp class=\"hp\">양의 실수 \u003cspan class=\"heq\">\\(t\\)\u003c/span>와 최고차항의 계수가 \u003cspan class=\"heq\">\\(1\\)\u003c/span>인 삼차함수 \u003cspan class=\"heq\">\\(f(x)\\)\u003c/span>에 대하여 함수\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\(g(t)= \\dfrac{f(t)-f(0)}{t}\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">이라 하자. 두 함수 \u003cspan class=\"heq\">\\(f(x)\\)\u003c/span>와 \u003cspan class=\"heq\">\\(g(t)\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cp class=\"hp htall\">\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) 함수 \u003cspan class=\"heq\">\\(g(t)\\)\u003c/span>의 최솟값은 \u003cspan class=\"heq\">\\(0\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp htall\">(나) \u003cspan class=\"heq\">\\(x\\)\u003c/span>에 대한 방정식 \u003cspan class=\"heq\">\\(f'(x)=g(a)\\)\u003c/span>를 만족시키는 \u003cspan class=\"heq\">\\(x\\)\u003c/span>의 값은 \u003cspan class=\"heq\">\\(a\\)\u003c/span>와 \u003cspan class=\"heq\">\\(\\dfrac{5}{3}\\)\u003c/span>이다. (단, \u003cspan class=\"heq\">\\(a\\gt  \\dfrac{5}{3}\\)\u003c/span>인 상수이다.)\u003c/p>\u003c/div>\u003c/p>\u003cp class=\"hp\">자연수 \u003cspan class=\"heq\">\\(m\\)\u003c/span>에 대하여 집합 \u003cspan class=\"heq\">\\(A_{m}\\)\u003c/span>을\u003c/p>\u003cp class=\"hp\">&emsp;\u003cspan class=\"heq\">\\(A_{m} = \\left\\{ x\\,|\\,f'(x)=g(m),\\,0\\lt x{\\leq}m \\right\\}\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">이라 할 때, \u003cspan class=\"heq\">\\(n(A_{m} )=2\\)\u003c/span>를 만족시키는 모든 자연수 \u003cspan class=\"heq\">\\(m\\)\u003c/span>의 값의 합을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"f7d9392dfd9602acb8abea65e9ef361733525a7a6e24367f133741000e75ffa2"};</script>
