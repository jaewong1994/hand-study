<script>window.HandStudyRecord={"itemId":17110,"sourceLabel":"2021 교육청 고3 수학미적분 7월 30번","adminYear":2021,"grade":3,"month":7,"number":30,"track":"미적분","points":4,"scoreStatus":"confirmed_4_direct","questionText":"두 자연수 $a,\\,b$에 대하여 이차함수 $f \\left( x \\right)$$=ax ^{2} +b$가 있다. 함수 $g \\left( x \\right)$를\n $g \\left( x \\right)$$=\\ln\\,f \\left( x \\right) - \\frac{1}{10} \\left\\{ f \\left( x \\right) -1 \\right\\}$\n이라 하자. 실수 $t$에 대하여 직선 $y$$= \\left| \\,g \\left( t \\right) \\, \\right|$와 함수 $y$$= \\left| \\,g \\left( x \\right) \\, \\right|$의 그래프가 만나는 점의 개수를 $h \\left( t \\right)$라 하자. 두 함수 $g \\left( x \\right)$, $h \\left( t \\right)$가 다음 조건을 만족시킨다.\n(가) 함수 $g \\left( x \\right)$는 $x=0$에서 극솟값을 갖는다.(나) 함수 $h \\left( t \\right)$가 $t$$=k$에서 불연속인 $k$의 값의 개수는 $7$이다.\n$\\int _{0} ^{a} {} e ^{x} \\,f \\left( x \\right) \\,dx$$=me ^{a} -19$일 때, 자연수 $m$의 값을 구하시오. [4점]","answer":"586","sourceHash":"3d4a4c79cde6f6d04fed7e2441f5fd7bacccfe9dc38ed078a6455f2ff566c41e","steps":[{"id":"s1","latex":"g'(x)=\\frac{2ax\\{10-f(x)\\}}{10f(x)},\\quad f(x)=ax^2+b>0"},{"id":"s2","latex":"x=0\\text{에서 극소}\\Rightarrow b\u003c10,\\quad f(x)=10\\text{인 }x=\\pm r\\text{에서 극대}"},{"id":"s3","latex":"m_0=g(0)=\\ln b-\\frac{b-1}{10},\\quad M=\\ln10-\\frac9{10}"},{"id":"s4","latex":"b\\in\\{1,\\ldots,9\\}\\Rightarrow0\\le m_0\u003cM"},{"id":"s5","latex":"m_0>0:\\quad |g(t)|=0,m_0,M\\text{에서 }h\\text{ 불연속}\\Rightarrow2+5+4=11\\text{개}"},{"id":"s6","latex":"m_0=0:\\quad |g(t)|=0,M\\text{에서 }h\\text{ 불연속}\\Rightarrow3+4=7\\text{개}\\Rightarrow b=1"},{"id":"s7","latex":"\\int_0^ae^x(ax^2+1)\\,dx=e^a(a^3-2a^2+2a+1)-(2a+1)"},{"id":"s8","latex":"=me^a-19\\Rightarrow a=9,\\quad m=9^3-2\\cdot9^2+2\\cdot9+1=586"}],"diagram":null,"contentHash":"570af538887b7233547de10cef89f3fd1eba6c11f3b7f7b2074ef55244cfdac9","questionHtml":"\u003cp class=\"hp\">두 자연수 \u003cspan class=\"heq\">\\(a,\\,b\\)\u003c/span>에 대하여 이차함수 \u003cspan class=\"heq\">\\(f \\left( x \\right)\\)\u003c/span>\u003cspan class=\"heq\">\\(=ax^{2} +b\\)\u003c/span>가 있다. \u003cbr>함수 \u003cspan class=\"heq\">\\(g \\left( x \\right)\\)\u003c/span>를\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\(g \\left( x \\right)\\)\u003c/span>\u003cspan class=\"heq\">\\(=\\ln\\,f \\left( x \\right) - \\dfrac{1}{10} \\left\\{ f \\left( x \\right) -1 \\right\\}\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">이라 하자. 실수 \u003cspan class=\"heq\">\\(t\\)\u003c/span>에 대하여 직선 \u003cspan class=\"heq\">\\(y\\)\u003c/span>\u003cspan class=\"heq\">\\(= \\left| \\,g \\left( t \\right) \\, \\right|\\)\u003c/span>와 함수 \u003cspan class=\"heq\">\\(y\\)\u003c/span>\u003cspan class=\"heq\">\\(= \\left| \\,g \\left( x \\right) \\, \\right|\\)\u003c/span>의 그래프가 만나는 점의 개수를 \u003cspan class=\"heq\">\\(h \\left( t \\right)\\)\u003c/span>라 하자. 두 함수 \u003cspan class=\"heq\">\\(g \\left( x \\right)\\)\u003c/span>, \u003cspan class=\"heq\">\\(h \\left( t \\right)\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) 함수 \u003cspan class=\"heq\">\\(g \\left( x \\right)\\)\u003c/span>는 \u003cspan class=\"heq\">\\(x=0\\)\u003c/span>에서 극솟값을 갖는다.\u003c/p>\u003cp class=\"hp\">(나) 함수 \u003cspan class=\"heq\">\\(h \\left( t \\right)\\)\u003c/span>가 \u003cspan class=\"heq\">\\(t\\)\u003c/span>\u003cspan class=\"heq\">\\(=k\\)\u003c/span>에서 불연속인 \u003cspan class=\"heq\">\\(k\\)\u003c/span>의 값의 개수는 \u003cbr>\u003cspan class=\"heq\">\\(7\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(\\int_{0}^{a} {} e^{x} \\,f \\left( x \\right) \\,dx\\)\u003c/span>\u003cspan class=\"heq\">\\(=me^{a} -19\\)\u003c/span>일 때, 자연수 \u003cspan class=\"heq\">\\(m\\)\u003c/span>의 값을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"53a00511e72017e6b94f48923935ccaaf8f251ef154aa686784d86ccb44cce93"};</script>
<script>window.HandStudyGuide={"itemId":17110,"sourceHash":"3d4a4c79cde6f6d04fed7e2441f5fd7bacccfe9dc38ed078a6455f2ff566c41e","contentHash":"570af538887b7233547de10cef89f3fd1eba6c11f3b7f7b2074ef55244cfdac9","overview":{"goal":"\\(|g(x)|\\)의 수평선 교점 수가 바뀌는 높이로 \\(b\\)를 정하고, 지수함수 곱의 적분에서 \\(m\\)을 구해요.","firstLook":"먼저 짝함수 \\(g\\)의 극솟값 \\(m_0\\), 극댓값 \\(M\\), 양쪽 꼬리의 모양을 그리면 불연속점의 개수를 직접 셀 수 있어요.","conditions":[{"label":"\\(x=0\\)에서 극소","meaning":"\\(b<10\\)이고, 양쪽의 \\(f(x)=10\\)인 점에서는 \\(g\\)가 극대가 돼요."},{"label":"불연속점 7개","meaning":"수평선 교점 수가 바뀌는 높이의 원상 개수를 모두 세어 \\(m_0=0\\)을 찾아요."}]},"chapters":[{"id":"c1","label":"함수의 극값과 그래프 모양","stepIds":["s1","s2","s3","s4"],"question":"\\(x=0\\)이 극소가 되려면 왜 \\(b<10\\)이어야 하나요?","hint":"\\(g'(x)\\)의 분모는 양수이고, 0 가까이에서는 \\(10-f(x)\\)의 부호가 중요해요.","explanation":"\\(f(x)=ax^2+b>0\\)이고 \\(g'(x)=2ax\\{10-f(x)\\}/(10f(x))\\)예요. \\(x=0\\)의 왼쪽에서 음수, 오른쪽에서 양수가 되려면 \\(10-b>0\\), 즉 \\(b<10\\)이어야 해요. 그러면 \\(f(x)=10\\)인 \\(x=\\pm r\\)에서 도함수 부호가 양수에서 음수로 바뀌어 극대가 돼요. 극솟값은 \\(m_0=\\ln b-(b-1)/10\\), 극댓값은 \\(M=\\ln 10-9/10\\)이고, 자연수 \\(1\\le b\\le 9\\)에서 \\(0\\le m_0<M\\)예요. 또한 \\(|x|\\to\\infty\\)이면 \\(g(x)\\to-\\infty\\)예요.","check":{"prompt":"\\(b=1\\)일 때 극솟값 \\(m_0\\)은 얼마인가요?","answer":"\\(m_0=\\ln 1-(1-1)/10=0\\)예요."}},{"id":"c2","label":"높이마다 불연속점 세기","stepIds":["s5","s6"],"question":"\\(m_0>0\\)이면 높이 \\(m_0\\)에 해당하는 \\(t\\)가 왜 5개인가요?","hint":"\\(|g(t)|=m_0\\)을 \\(g(t)=m_0\\)와 \\(g(t)=-m_0\\)로 나누세요.","explanation":"\\(|g(x)|\\)와 수평선의 교점 수는 높이가 \\(0,m_0,M\\)을 지날 때 바뀌어요. \\(m_0>0\\)이면 \\(|g(t)|=0\\)은 양쪽 꼬리의 \\(g(t)=0\\) 두 점에서 생겨 2개예요. \\(|g(t)|=m_0\\)에서는 \\(g(t)=m_0\\)인 중앙점 1개와 바깥쪽 2개, \\(g(t)=-m_0\\)인 꼬리 2개를 합쳐 5개예요. \\(|g(t)|=M\\)에서는 \\(g(t)=M\\)인 두 극대점과 \\(g(t)=-M\\)인 꼬리 두 점을 합쳐 4개라서 모두 11개가 돼요. 반면 \\(m_0=0\\)이면 \\(g(t)=0\\)이 중앙점과 양쪽 꼬리, 모두 3개이고 높이 \\(M\\)의 4개를 합쳐 정확히 7개예요. 따라서 \\(m_0=0\\). \\(1\\le b\\le 9\\)에서 \\(\\ln b-(b-1)/10\\)은 \\(b=1\\)일 때만 0이므로 \\(b=1\\)예요.","check":{"prompt":"\\(m_0=0\\)일 때 \\(|g(t)|=0\\)인 \\(t\\)가 왜 3개인가요?","answer":"중앙의 \\(t=0\\)에서 한 번, 양쪽 꼬리에서 \\(g(t)=0\\)이 각각 한 번씩 생기기 때문이에요."}},{"id":"c3","label":"적분에서 두 계수 결정","stepIds":["s7","s8"],"question":"적분 결과의 어느 부분을 \\(-19\\)와 비교해야 하나요?","hint":"\\(e^a\\)가 곱해진 항과 그렇지 않은 항을 나누어 보세요.","explanation":"\\(b=1\\)이므로 \\(f(x)=ax^2+1\\)예요. \\(x^2\\)을 미분하고 \\(e^x\\)를 적분하는 부분적분을 두 번 하면 \\(\\int x^2e^xdx=e^x(x^2-2x+2)\\)예요. 따라서 \\(\\int_0^ae^x(ax^2+1)dx=e^a(a^3-2a^2+2a+1)-(2a+1)\\). 원래 식 \\(me^a-19\\)와 비교할 때 \\(e^a\\)와 무관한 항에서 \\(2a+1=19\\), 즉 \\(a=9\\)를 얻어요. 이어 \\(m=9^3-2\\cdot 9^2+2\\cdot 9+1=586\\)예요.","check":{"prompt":"\\(a=9\\)를 정한 뒤 \\(m\\)은 어느 계수인가요?","answer":"적분 결과에서 \\(e^a\\) 앞의 계수 \\(a^3-2a^2+2a+1\\)예요."}}],"takeaway":["교점 수가 바뀌는 높이만 찾지 말고 그 높이를 만드는 입력값의 개수까지 세어요.","지수함수와 다항식의 곱은 다항식을 반복해서 미분하면 경계항과 남는 상수항을 분리할 수 있어요."]};</script>
