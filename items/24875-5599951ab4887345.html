<script>window.HandStudyRecord={"adminYear":2023,"answer":"483","contentHash":"d27f1d3a434e16861b9350417b3bc779c4056a21001f17a63a8638d16863b97b","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24875,"month":11,"number":22,"points":4,"preview":false,"questionHtml":"\u003cp>최고차항의 계수가 \u003cspan class=\"heq\">\\(1\\)\u003c/span>인 삼차함수 \u003cspan class=\"heq\">\\(f(x)\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cp>함수 \u003cspan class=\"heq\">\\(f(x)\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(f \\left(k-1 \\right)f \\left(k+1 \\right)&lt;0\\)\u003c/span>을 만족시키는 정수 \u003cspan class=\"heq\">\\(k\\)\u003c/span>는 존재하지 않는다.\u003c/p>\u003cp>\u003cspan class=\"heq\">\\(f &#x27; \\left( - \\frac{1}{4} \\right) =\\,- \\frac{1}{4}\\)\u003c/span>, \u003cspan class=\"heq\">\\(f &#x27; \\left( \\frac{1}{4} \\right) &lt;0\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(f(8)\\)\u003c/span>의 값을 구하시오. [4점]\u003c/p>","questionText":"최고차항의 계수가 $1$인 삼차함수 $f(x)$가 다음 조건을 만족시킨다.\n함수 $f(x)$에 대하여 $f \\left(k-1 \\right)f \\left(k+1 \\right)\u003c0$을 만족시키는 정수 $k$는 존재하지 않는다.\n$f \\,' \\left( - \\frac{1}{4} \\right) =\\,- \\frac{1}{4}$, $f \\,' \\left( \\frac{1}{4} \\right) \u003c0$일 때, $f(8)$의 값을 구하시오. [4점]","sourceHash":"20d7022a67e578853fa3de0af1abf75459e197bbbe6a1d298b07152e73a343fc","sourceKind":"csat","sourceLabel":"2023년 시행 수능 · 2024학년도 · 공통 · 22번","steps":[{"id":"s1","latex":"f'(x)=3(x-\\alpha)(x-\\beta),\\quad \\alpha\u003c -\\frac14\u003c\\frac14\u003c\\beta"},{"id":"s2","latex":"f'\\!\\left(-\\frac14\\right)=-\\frac14\\Rightarrow \\left(-\\frac14-\\alpha\\right)\\left(\\beta+\\frac14\\right)=\\frac1{12}"},{"id":"s3","latex":"\\beta>\\frac14\\Rightarrow -\\frac5{12}\u003c\\alpha\u003c-\\frac14"},{"id":"s4","latex":"\\begin{aligned}&f(n)f(n+2)\\ge0\\text{이므로 }f(2j),\\ f(2j+1)\\text{은}\\\\&\\text{각각 정수에서 부호가 바뀔 때 }0\\text{을 지난다.}\\\\&\\text{따라서 짝수근과 홀수근이 하나씩 있다.}\\end{aligned}"},{"explanation":{"body":"짝수열 \\(f(2j)\\)와 홀수열 \\(f(2j+1)\\)은 각각 음수에서 양수로 가므로 정수근을 하나씩 가집니다. 두 정수근의 거리가 3 이상이면 각 근을 중심으로 한 길이 2의 구간이 분리됩니다. 각 구간 양끝의 함수값 곱이 음수가 아니려면 근이 하나뿐이고 그 인수가 한 번만 곱해져 있을 수 없어 같은 인수가 곱해진 횟수를 세어 적어도 두 근이 필요하고, 두 구간에서 네 근이 필요해 삼차식과 모순입니다. 따라서 두 정수근은 이웃합니다.","skillTags":["근의배치","부호판정"],"title":"정수근이 이웃해야 하는 이유"},"id":"s5","latex":"\\begin{aligned}&\\text{두 정수근의 거리가 }3\\text{ 이상이면}\\\\&[u-1,u+1],\\ [v-1,v+1]\\text{은 서로 겹치지 않는다.}\\\\&\\text{각 구간의 양 끝 함수값의 곱이 }0\\text{ 이상이므로}\\\\&\\text{각 구간 안에는 인수를 센 횟수로 적어도 두 근이 필요해 모순이다.}\\end{aligned}"},{"id":"s6","latex":"\\begin{aligned}&\\text{따라서 두 정수근은 }j,j+1.\\\\&\\text{이들이 최솟근과 최댓근이면}\\\\&j\\le\\alpha\\le j+1,\\quad j\\le\\beta\\le j+1\\text{이어야 한다.}\\\\&-\\frac5{12}\u003c\\alpha\u003c-\\frac14\u003c\\frac14\u003c\\beta\\text{를 함께 만족하는 정수 }j\\text{는 없다.}\\end{aligned}"},{"id":"s7","latex":"\\begin{aligned}&\\text{세 근을 }p\\le q\\le s\\text{라 하면 두 정수근은 }p,q\\text{ 또는 }q,s.\\\\&p,q\\text{가 정수이면 }p\u003c\\alpha\u003cq,\\\\&\\text{따라서 }(p,q)=(-1,0).\\end{aligned}"},{"id":"s8","latex":"\\begin{aligned}&q,s=q+1\\text{이 정수이면 }q\u003c\\beta\u003cq+1\\text{이므로 }q\\ge0.\\\\&q\\ge1\\text{이라 가정하고}\\\\&p\\text{보다 큰 최소 정수 }m\\text{을 잡으면 }m\\le0\u003cq.\\end{aligned}"},{"id":"s9","latex":"\\begin{aligned}&m-2\u003cp\u003cm\u003cq\\text{이므로}\\\\&f(m-2)\u003c0\u003cf(m),\\quad f(m-2)f(m)\u003c0.\\\\&\\text{조건에 모순이므로 }(q,s)=(0,1).\\end{aligned}"},{"id":"s10","latex":"\\begin{aligned}&f(x)=(x+1)x(x-s)\\text{이면}\\\\&f'(-\\tfrac14)=-\\tfrac14\\Rightarrow s=-\\tfrac18.\\\\&\\text{그런데 }f'(\\tfrac14)=\\tfrac78>0\\text{이므로 탈락한다.}\\end{aligned}"},{"id":"s11","latex":"f(x)=x(x-1)(x-p)\\text{라 두면 }f'\\!\\left(-\\frac14\\right)=\\frac{11}{16}+\\frac32p=-\\frac14"},{"id":"s12","latex":"p=-\\frac58,\\qquad f(8)=8\\cdot7\\cdot\\frac{69}{8}=483"},{"id":"s13","latex":"f'\\!\\left(\\frac14\\right)\u003c0\\text{도 }p=-\\frac58\\text{에서 성립한다.}"},{"id":"s14","latex":"\\therefore\\ \\boxed{483}"}],"track":"공통"};</script>
<script>window.HandStudyGuide={"itemId":24875,"sourceHash":"20d7022a67e578853fa3de0af1abf75459e197bbbe6a1d298b07152e73a343fc","contentHash":"d27f1d3a434e16861b9350417b3bc779c4056a21001f17a63a8638d16863b97b","overview":{"goal":"정수 간격 2에서 부호가 바뀌지 않는 조건으로 삼차함수의 정수근 배치를 정해요.","firstLook":"조건은 모든 정수 n에서 \\(f(n)f(n+2)\\ge0\\)이라는 뜻이에요. 짝수 입력끼리와 홀수 입력끼리 부호가 바뀌려면 중간에 정수근이 필요해요.","conditions":[{"label":"정수 부호 조건","meaning":"두 칸 떨어진 정수에서 함숫값의 부호가 서로 반대일 수 없어요."},{"label":"도함수 조건","meaning":"두 극값 위치 \\(\\alpha,\\beta\\)는 \\(-1/4\\)의 양쪽에 놓이고 \\(\\beta>1/4\\)예요."}]},"chapters":[{"id":"c1","label":"도함수의 두 근 범위를 좁혀요","stepIds":["s1","s2","s3"],"question":"\\(\\alpha\\)가 왜 -5/12와 -1/4 사이에 있을까요?","hint":"\\(\\beta>1/4\\)를 곱식에 넣어 한 인수의 크기를 비교해요.","explanation":"최고차항이 1이므로 \\(f'(x)=3(x-\\alpha)(x-\\beta)\\)로 둬요. \\(f'(1/4)<0\\)이므로 \\(\\alpha<1/4<\\beta\\), 또 \\(f'(-1/4)=-1/4<0\\)이므로 \\(\\alpha<-1/4<\\beta\\)예요. 값을 넣으면 \\((-1/4-\\alpha)(\\beta+1/4)=1/12\\)예요. \\(\\beta+1/4>1/2\\)이므로 \\(0<-1/4-\\alpha<1/6\\), 따라서 \\(-5/12<\\alpha<-1/4\\)예요.","check":{"prompt":"\\(f'(-1/4)<0\\)에서 -1/4은 두 근의 어느 위치에 있나요?","answer":"\\(\\alpha<-1/4<\\beta\\)로 두 근 사이에 있어요."}},{"id":"c2","label":"정수근 두 개가 이웃함을 확인해요","stepIds":["s4","s5","s6","s7","s8","s9"],"question":"짝수근과 홀수근이 멀리 떨어질 수 없는 이유는 무엇인가요?","hint":"각 정수근 주변 길이 2 구간의 양 끝에서 부호가 반대가 되지 않아야 해요.","explanation":"삼차함수는 왼쪽에서 음수, 오른쪽에서 양수이므로 짝수열 \\(f(2j)\\)과 홀수열 \\(f(2j+1)\\)은 각각 부호가 바뀌는 과정에서 정수근을 하나씩 가져요. 두 정수근의 거리가 3 이상이면 각 근 주변의 \\([u-1,u+1]\\), \\([v-1,v+1]\\)이 겹치지 않아요. 각 구간 양 끝의 곱이 0 이상이려면 각 구간 안에서 근의 인수를 센 횟수가 적어도 2여야 해 모두 4번이 필요해 삼차식과 모순이에요. 따라서 두 정수근은 이웃해요. 세 근을 \\(p\\le q\\le s\\)라 하면 정수근은 \\(p,q\\) 또는 \\(q,s\\)예요. 앞의 경우 \\(\\alpha\\)가 사이에 있어 \\((p,q)=(-1,0)\\), 뒤의 경우 부호 조건을 다시 적용하면 \\((q,s)=(0,1)\\)만 남아요.","check":{"prompt":"두 정수근이 각각 다른 홀짝이어야 하는 이유는 무엇인가요?","answer":"짝수 입력열과 홀수 입력열이 각각 음수에서 양수로 바뀌므로 각 열에 속한 정수근이 하나씩 필요해요."}},{"id":"c3","label":"첫 근 배치를 계산해 제외해요","stepIds":["s10"],"question":"정수근이 -1,0인 경우는 어느 조건에서 탈락할까요?","hint":"남은 근 s를 도함수 값으로 정한 뒤 \\(f'(1/4)\\)을 확인해요.","explanation":"\\(f(x)=(x+1)x(x-s)\\)로 두고 \\(f'(-1/4)=-1/4\\)을 넣으면 \\(s=-1/8\\)이에요. 그러나 이 함수에서 \\(f'(1/4)=7/8>0\\)이 되어 주어진 \\(f'(1/4)<0\\)과 반대예요. 따라서 정수근 -1,0인 배치는 탈락해요.","check":{"prompt":"이 경우를 탈락시키는 계산값은 무엇인가요?","answer":"\\(f'(1/4)=7/8>0\\)이에요."}},{"id":"c4","label":"남은 근 배치에서 함수를 확정해요","stepIds":["s11","s12","s13","s14"],"question":"정수근이 0,1일 때 남은 근 p는 얼마인가요?","hint":"\\(f=x(x-1)(x-p)\\)를 미분해 -1/4을 넣어요.","explanation":"\\(f(x)=x(x-1)(x-p)\\)로 놓으면 \\(f'(-1/4)=11/16+3p/2\\)예요. 이를 -1/4과 같게 두면 \\(p=-5/8\\)이에요. 이때 \\(f'(1/4)<0\\)도 직접 확인되어 모든 조건을 만족해요. 따라서 \\(f(8)=8\\cdot7\\cdot(8+5/8)=8\\cdot7\\cdot69/8=483\\)이에요.","check":{"prompt":"마지막 곱에서 8이 약분된 뒤 남는 값은 무엇인가요?","answer":"\\(7\\cdot69=483\\)이에요."}}],"takeaway":["두 칸 떨어진 정수의 부호 조건은 짝수 입력열과 홀수 입력열을 따로 보면 정수근 배치로 바뀌어요.","근 사이에 필요한 인수의 수를 세어 삼차식이 감당할 수 없는 배치를 제외해요.","가능한 근 배치를 모두 계산한 뒤 남은 도함수 부등식으로 최종 후보를 확인해요."]};</script>
