<script>window.HandStudyRecord={"adminYear":2023,"answer":"483","contentHash":"d27f1d3a434e16861b9350417b3bc779c4056a21001f17a63a8638d16863b97b","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24875,"month":11,"number":22,"points":4,"preview":false,"questionHtml":"\u003cp>최고차항의 계수가 \u003cspan class=\"heq\">\\(1\\)\u003c/span>인 삼차함수 \u003cspan class=\"heq\">\\(f(x)\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cp>함수 \u003cspan class=\"heq\">\\(f(x)\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(f \\left(k-1 \\right)f \\left(k+1 \\right)&lt;0\\)\u003c/span>을 만족시키는 정수 \u003cspan class=\"heq\">\\(k\\)\u003c/span>는 존재하지 않는다.\u003c/p>\u003cp>\u003cspan class=\"heq\">\\(f &#x27; \\left( - \\frac{1}{4} \\right) =\\,- \\frac{1}{4}\\)\u003c/span>, \u003cspan class=\"heq\">\\(f &#x27; \\left( \\frac{1}{4} \\right) &lt;0\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(f(8)\\)\u003c/span>의 값을 구하시오. [4점]\u003c/p>","questionText":"최고차항의 계수가 $1$인 삼차함수 $f(x)$가 다음 조건을 만족시킨다.\n함수 $f(x)$에 대하여 $f \\left(k-1 \\right)f \\left(k+1 \\right)\u003c0$을 만족시키는 정수 $k$는 존재하지 않는다.\n$f \\,' \\left( - \\frac{1}{4} \\right) =\\,- \\frac{1}{4}$, $f \\,' \\left( \\frac{1}{4} \\right) \u003c0$일 때, $f(8)$의 값을 구하시오. [4점]","sourceHash":"20d7022a67e578853fa3de0af1abf75459e197bbbe6a1d298b07152e73a343fc","sourceKind":"csat","sourceLabel":"2023년 시행 수능 · 2024학년도 · 공통 · 22번","steps":[{"id":"s1","latex":"f'(x)=3(x-\\alpha)(x-\\beta),\\quad \\alpha\u003c -\\frac14\u003c\\frac14\u003c\\beta"},{"id":"s2","latex":"f'\\!\\left(-\\frac14\\right)=-\\frac14\\Rightarrow \\left(-\\frac14-\\alpha\\right)\\left(\\beta+\\frac14\\right)=\\frac1{12}"},{"id":"s3","latex":"\\beta>\\frac14\\Rightarrow -\\frac5{12}\u003c\\alpha\u003c-\\frac14"},{"id":"s4","latex":"\\begin{aligned}&f(n)f(n+2)\\ge0\\text{이므로 }f(2j),\\ f(2j+1)\\text{은}\\\\&\\text{각각 정수에서 부호가 바뀔 때 }0\\text{을 지난다.}\\\\&\\text{따라서 짝수근과 홀수근이 하나씩 있다.}\\end{aligned}"},{"explanation":{"body":"짝수열 \\(f(2j)\\)와 홀수열 \\(f(2j+1)\\)은 각각 음수에서 양수로 가므로 정수근을 하나씩 가집니다. 두
