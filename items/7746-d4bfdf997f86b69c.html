<script>window.HandStudyRecord={"itemId":7746,"sourceLabel":"2019 교육청 고2 수학가형 11월 29번","adminYear":2019,"grade":2,"month":11,"number":29,"track":"수학가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"상수 $a$와 최고차항의 계수가 $1$인 이차함수 $f \\left( x \\right)$에 대하여 함수 $g \\left( x \\right)$를 $g \\left( x \\right) = \\left( x ^{2} -x+a \\right) f \\left( x \\right)$라 할 때, 두 함수 $f \\left( x \\right)$, $g \\left( x \\right)$는 다음 조건을 만족시킨다.\n(가) $\\lim _{x\\, -> \\,1} {\\frac{g \\left( x \\right) -f \\left( x \\right)}{x-1}} =0$ (나) $g' \\left( 1 \\right) != 0$ (다) $f \\left( \\alpha \\right) =f' \\left( \\alpha \\right)$이고 $g' \\left( \\alpha \\right) =2f' \\left( \\alpha \\right)$인 실수 $\\alpha$가 존재한다.\n$g \\left( \\alpha +4 \\right) = \\frac{q}{p}$일 때, $p+q$의 값을 구하시오. (단, $p$와 $q$는 서로소인 자연수이다.) [4점]","answer":"61","sourceHash":"cfc24ca62040dc9dda5c9008713355a9e917ca55bc754aa5b94cc7d6740a2cb6","steps":[{"id":"s1","latex":"g-f=(x^2-x+a-1)f,\\quad \\lim_{x\\to1}\\frac{g-f}{x-1}=0\\Rightarrow(a-1)f(1)=0"},{"id":"s2","latex":"a\\ne1\\Rightarrow f(1)=f^{\\prime}(1)=0\\Rightarrow g^{\\prime}(1)=0\\quad\\text{모순}"},{"id":"s3","latex":"a=1,\\quad f(1)=0,\\quad f(x)=(x-1)(x-c),\\quad c\\ne1"},{"id":"s4","latex":"f(\\alpha)=f^{\\prime}(\\alpha),\\ g^{\\prime}(\\alpha)=2f^{\\prime}(\\alpha)\\Rightarrow(\\alpha+2)(\\alpha-1)f^{\\prime}(\\alpha)=0"},{"id":"s5","latex":"\\alpha=1\\ \\text{또는}\\ f^{\\prime}(\\alpha)=0\\Rightarrow f(1)=f^{\\prime}(1)=0\\quad\\text{모순}"},{"id":"s6","latex":"\\alpha=-2:\\quad3(c+2)=-5-c\\Rightarrow c=-\\frac{11}{4}"},{"id":"s7","latex":"g(\\alpha+4)=g(2)=3f(2)=\\frac{57}{4}\\Rightarrow p+q=61"}],"diagram":null,"contentHash":"6349883350e18552c99d5c1eb0145fccd44594249aef7fb1a7ea8a01dc21e13e","questionHtml":"\u003cp class=\"hp\">상수 \u003cspan class=\"heq\">\\(a\\)\u003c/span>와 최고차항의 계수가 \u003cspan class=\"heq\">\\(1\\)\u003c/span>인 이차함수 \u003cspan class=\"heq\">\\(f \\left( x \\right)\\)\u003c/span>에 대하여 함수 \u003cspan class=\"heq\">\\(g \\left( x \\rig <script>window.HandStudyGuide={"itemId":7746,"sourceHash":"cfc24ca62040dc9dda5c9008713355a9e917ca55bc754aa5b94cc7d6740a2cb6","contentHash":"6349883350e18552c99d5c1eb0145fccd44594249aef7fb1a7ea8a01dc21e13e","overview":{"goal":"극한과 도함수 조건으로 \\(a,f,\\alpha\\)를 차례로 정해 \\(g\\)의 값을 계산해요.","firstLook":"\\(g-f=(x^2-x+a-1)f\\)로 묶으면 \\(x=1\\)에서 어떤 인수가 사라져야 하는지 볼 수 있어요.","conditions":[{"label":"(가)·(나)","meaning":"극한값 \\(0\\)과 \\(g'(1)\\ne0\\)을 함께 써서 \\(a=1\\), \\(f(1)=0\\)을 정해요."},{"label":"(다)","meaning":"두 등식에서 공통인 \\(f(\\alpha)=f'(\\alpha)\\)를 사용해 \\(\\alpha\\) 후보를 좁혀요."}]},"chapters":[{"id":"c1","label":"극한과 미분 조건을 함께 적용해요","stepIds":["s1","s2","s3"],"question":"\\(a\\ne1\\)이면 왜 \\(f(1)=f'(1)=0\\)까지 강제될까요?","hint":"분자가 \\(0\\)이 된 뒤 몫의 극한을 다시 계산해요.","explanation":"\\(g-f=(x^2-x+a-1)f\\)예요. \\(a\\ne1\\)이면 분모가 \\(0\\)으로 갈 때 유한한 극한을 가지려면 먼저 \\(f(1)=0\\)이어야 하고, 그 몫의 극한이 \\(0\\)이려면 \\((a-1)f'(1)=0\\), 즉 \\(f'(1)=0\\)이어야 해요. 그러면 \\(g'(1)=0\\)이 되어 (나)와 모순이에요. 따라서 \\(a=1\\)이고, (가)의 몫은 \\(xf(x)\\)로 줄어 \\(f(1)=0\\)이에요. (나)에서 이 근은 겹치지 않아야 하므로 \\(f(x)=(x-1)(x-c)\\), \\(c\\ne1\\)이에요.","check":{"prompt":"\\(c=1\\)을 제외하는 이유를 \\(g'(1)\\)과 연결해 말해 보세요.","answer":"\\(c=1\\)이면 \\(f'(1)=0\\)이고 \\(a=1,f(1)=0\\)에서 \\(g'(1)=f'(1)=0\\)이 되어 (나)를 어겨요."}},{"id":"c2","label":"세 후보 중 모순 둘을 지워요","stepIds":["s4","s5","s6"],"question":"\\(\\alpha=1\\)과 \\(f'(\\alpha)=0\\)은 왜 모두 불가능할까요?","hint":"항상 \\(f(\\alpha)=f'(\\alpha)\\)도 함께 만족해야 해요.","explanation":"\\(a=1\\)에서 \\(g'=(2x-1)f+(x^2-x+1)f'\\)예요. \\(f(\\alpha)=f'(\\alpha)\\), \\(g'(\\alpha)=2f'(\\alpha)\\)를 넣으면 \\((\\alpha+2)(\\alpha-1)f'(\\alpha)=0\\)이에요. \\(\\alpha=1\\)이면 \\(f(1)=0=f'(1)\\)이 되어 (나)와 모순이에요. \\(f'(\\alpha)=0\\)이면 \\(f(\\alpha)=0\\)도 되어 이차함수 \\(f\\)가 \\(\\alpha\\)에서 겹치는 근을 가지는데, 이미 \\(1\\)도 근이므로 \\(\\alpha=1,c=1\\)일 수밖에 없어 역시 모순이에요. 따라서 \\(\\alpha=-2\\)예요. \\(f(-2)=3(c+2)\\), \\(f'(-2)=-5-c\\)를 같게 놓으면 \\(c=-11/4\\)예요.","check":{"prompt":"\\(f'(\\alpha)=f(\\alpha)=0\\)이 왜 \\(c=1\\)을 강제하나요?","answer":"최고차항 계수 1인 이차함수가 \\(\\alpha\\)에서 중근을 가지면서 별도의 근 \\(1\\)도 가지려면 두 근이 같아 \\(\\alpha=1\\), 곧 \\(c=1\\)이어야 해요."}},{"id":"c3","label":"확정된 식에 요구값을 넣어요","stepIds":["s7"],"question":"\\(\\alpha+4=2\\)에서 \\(g(2)\\)는 어떻게 계산할까요?","hint":"\\(x^2-x+1\\)의 값과 \\(f(2)\\)를 따로 계산해요.","explanation":"\\(\\alpha=-2\\)이므로 \\(\\alpha+4=2\\)예요. \\(f(2)=(2-1)(2+11/4)=19/4\\)이고 \\(2^2-2+1=3\\)이므로 \\(g(2)=3\\cdot19/4=57/4\\)예요. 따라서 \\(p=4,q=57\\), \\(p+q=61\\)이에요.","check":{"prompt":"최종 분수 \\(57/4\\)가 이미 기약분수인 이유는 무엇인가요?","answer":"\\(57\\)은 \\(3\\)과 \\(19\\)의 곱이고 \\(4\\)와 공약수가 없기 때문이에요."}}],"takeaway":["극한 조건과 도함수의 비영 조건은 따로 쓰지 말고 한 후보가 둘을 동시에 만족하는지 확인해요.","곱의 미분식에 함수값과 도함수값이 같다는 조건을 넣어 공통인수를 만들어요.","후보를 버릴 때는 다른 조건과 결합해 생기는 실제 중근 모순까지 설명해요."]};</script>
