  <script>window.HandStudyRecord={"itemId":7746,"sourceLabel":"2019 교육청 고2 수학가형 11월 29번","adminYear":2019,"grade":2,"month":11,"number":29,"track":"수학가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"상수 $a$와 최고차항의 계수가 $1$인 이차함수 $f \\left( x \\right)$에 대하여 함수 $g \\left( x \\right)$를 $g \\left( x \\right) = \\left( x ^{2} -x+a \\right) f \\left( x \\right)$라 할 때, 두 함수 $f \\left( x \\right)$, $g \\left( x \\right)$는 다음 조건을 만족시킨다.\n(가) $\\lim _{x\\, -> \\,1} {\\frac{g \\left( x \\right) -f \\left( x \\right)}{x-1}} =0$ (나) $g' \\left( 1 \\right) != 0$ (다) $f \\left( \\alpha \\right) =f' \\left( \\alpha \\right)$이고 $g' \\left( \\alpha \\right) =2f' \\left( \\alpha \\right)$인 실수 $\\alpha$가 존재한다.\n$g \\left( \\alpha +4 \\right) = \\frac{q}{p}$일 때, $p+q$의 값을 구하시오. (단, $p$와 $q$는 서로소인 자연수이다.) [4점]","answer":"61","sourceHash":"cfc24ca62040dc9dda5c9008713355a9e917ca55bc754aa5b94cc7d6740a2cb6","steps":[{"id":"s1","latex":"g-f=(x^2-x+a-1)f,\\quad \\lim_{x\\to1}\\frac{g-f}{x-1}=0\\Rightarrow(a-1)f(1)=0"},{"id":"s2","latex":"a\\ne1\\Rightarrow f(1)=f^{\\prime}(1)=0\\Rightarrow g^{\\prime}(1)=0\\quad\\text{모순}"},{"id":"s3","latex":"a=1,\\quad f(1)=0,\\quad f(x)=(x-1)(x-c),\\quad c\\ne1"},{"id":"s4","latex":"f(\\alpha)=f^{\\prime}(\\alpha),\\ g^{\\prime}(\\alpha)=2f^{\\prime}(\\alpha)\\Rightarrow(\\alpha+2)(\\alpha-1)f^{\\prime}(\\alpha)=0"},{"id":"s5","latex":"\\alpha=1\\ \\text{또는}\\ f^{\\prime}(\\alpha)=0\\Rightarrow f(1)=f^{\\prime}(1)=0\\quad\\text{모순}"},{"id":"s6","latex":"\\alpha=-2:\\quad3(c+2)=-5-c\\Rightarrow c=-\\frac{11}{4}"},{"id":"s7","latex":"g(\\alpha+4)=g(2)=3f(2)=\\frac{57}{4}\\Rightarrow p+q=61"}],"diagram":null,"contentHash":"6349883350e18552c99d5c1eb0145fccd44594249aef7fb1a7ea8a01dc21e13e","questionHtml":"\u003cp class=\"hp\">상수 \u003cspan class=\"heq\">\\(a\\)\u003c/span>와 최고차항의 계수가 \u003cspan class=\"heq\">\\(1\\)\u003c/span>인 이차함수 \u003cspan class=\"heq\">\\(f \\left( x \\right)\\)\u003c/span>에 대하여 함수 \u003cspan class=\"heq\">\\(g \\left( x \\r
