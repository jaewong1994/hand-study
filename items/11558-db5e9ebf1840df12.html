  <script>window.HandStudyRecord={"itemId":11558,"sourceLabel":"2019 교육청 고1 수학 11월 19번","adminYear":2019,"grade":1,"month":11,"number":19,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"곡선 $y=x^{2}$ 위의 임의의 점 $A \\left( \\, t,\\,t^{2} \\right)$ ($0\\lt t\\lt 1$)을 직선 $y=x$에 대하여 대칭이동한 점을 $B$라 하고 두 점 $A$, $B$에서 $y$축에 내린 수선의 발을 각각 $C$, $D$라 하자. \n다음은 사각형 $ABDC$의 넓이가 $\\dfrac{1}{8}$이 되는 상수 $t$의 값을 구하는 과정이다.\n점 $A$에서 $y$축에 내린 수선의 발이 $C$이므로 ${\\overline{AC }} = t$\n점 $B$에서 $y$축에 내린 수선의 발이 $D$이므로 $\\overline{BD}=t^{2}$\n${\\overline{DC }} = \\left. {\\boxed{\\vphantom{(}\\,(\\text{가}) \\,}} \\right.$이므로\n사각형 $ABDC$의 넓이는 $\\dfrac{1}{2} t^{2} \\, \\times \\left( \\, {\\boxed{\\vphantom{(}\\,(\\text{나}) \\,}} \\, \\right)$\n사각형 $ABDC$의 넓이가 $\\dfrac{1}{8}$이므로 \n$\\dfrac{1}{2} t^{2} \\, \\times \\left( \\, {\\boxed{\\vphantom{(}\\,(\\text{나}) \\,}} \\, \\right) = \\dfrac{1}{8}$\n따라서 $\\left. t= {\\boxed{\\vphantom{(}\\,(\\text{다}) \\,}} \\right.$\n위의 (가), (나)에 알맞은 식을 각각 $f \\left( t \\right)$, $g \\left( t \\right)$라 하고, (다)에 알맞은 수를 $k$라 할 때, $f \\left( k \\right) \\, \\times \\,g \\left( k \\right)$의 값은? [4점]\n① $\\dfrac{\\sqrt{2} -1}{4}$ ② $\\dfrac{\\sqrt{3} -1}{2}$ ③ $\\dfrac{\\sqrt{3} +1}{4}$ \n④ $\\dfrac{2 \\sqrt{2} -1}{2}$ ⑤ $\\dfrac{2 \\sqrt{2} +1}{4}$","answer":"①","sourceHash":"453e7c1b47f76fe2270ddda40d44a12b29f9dd1b21a4cf949cc282aea123b302","steps":[{"id":"s1","latex":"A=(t,t^2)\\Rightarrow B=(t^2,t),\\quad C=(0,t^2),\\ D=(0,t)"},{"id":"s2","latex":"f(t)=DC=t-t^2"},{"id":"s3","latex":"[ABDC]=\\frac12(AC+BD)\\cdot DC=\\frac12(t+t^2)(t-t^2)"},{"id":"s4","latex":"=\\frac12t^2(1-t^2)\\Rightarrow g(t)=1-t^2"},{"id":"s5","latex":"\\frac12t^2(1-t^2)=\\frac18\\Rightarrow(2t^2-1)^2=0"},{"id":"s6","latex":"0\u003ct\u003c1\\Rightarrow k=\\frac{\\sqrt2}{2}"},{"id":"s7","latex":"f(k)g(k)=\\left(\\frac{\\sqrt2}{2}-\\frac12\\right)\\left(\\frac12\\right)=\\frac{\\sqrt2-1}{4}"}],"diagram":null,"contentHash":"273d62e16766605aa02eaa6017c46d6c4cb405fa2b06c489d7
