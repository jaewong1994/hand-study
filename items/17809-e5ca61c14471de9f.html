<script>window.HandStudyRecord={"itemId":17809,"sourceLabel":"2023 평가원 고3 수학확통 6월 30번","adminYear":2023,"grade":3,"month":6,"number":30,"track":"확통","points":4,"scoreStatus":"confirmed_4_direct","questionText":"주머니에 숫자 $1,\\,2,\\,3,\\,4$가 하나씩 적혀 있는 흰 공 $4$개와 숫자 $4,\\,5,\\,6,\\,7$이 하나씩 적혀 있는 검은 공 $4$개가 들어 있다. 이 주머니를 사용하여 다음 규칙에 따라 점수를 얻는 시행을 한다.\n 주머니에서 임의로 $2$개의 공을 동시에 꺼내어 꺼낸 공이 서로 다른 색이면 $12$을 점수로 얻고, 꺼낸 공이 서로 같은 색이면 꺼낸 두 공에 적힌 수의 곱을 점수로 얻는다.\n이 시행을 한 번 하여 얻은 점수가 $24$ 이하의 짝수일 확률이 $\\frac{q}{p}$일 때, $p+q$ 의 값을 구하시오. (단, $p$와 $q$는 서로소인 자연수이다.) [4점]","answer":"51","sourceHash":"4aace5c35b1201cb204ef207925b18f4b78ccea1c3b751e31790d2c2e01c2ae8","steps":[{"id":"s1","latex":"\\binom82=28"},{"id":"s2","latex":"\\text{서로 다른 색}:\\ 4\\cdot4=16"},{"id":"s3","latex":"\\text{같은 색, 두 홀수}:\\binom42-1=5"},{"id":"s4","latex":"\\text{같은 색, 두 짝수}:\\ 2"},{"id":"s5","latex":"P=\\frac{16+5+2}{28}=\\frac{23}{28}\\Rightarrow p+q=51"}],"diagram":null,"contentHash":"92cde0a9a254419ad7e58d039b02e640e31515793414615747aa4005da409998","questionHtml":"\u003cp class=\"hp\">주머니에 숫자 \u003cspan class=\"heq\">\\(1,\\,2,\\,3,\\,4\\)\u003c/span>가 하나씩 적혀 있는 흰 공 \u003cspan class=\"heq\">\\(4\\)\u003c/span>개와 숫자 \u003cspan class=\"heq\">\\(4,\\,5,\\,6,\\,7\\)\u003c/span>이 하나씩 적혀 있는 검은 공 \u003cspan class=\"heq\">\\(4\\)\u003c/span>개가 들어 있다. 이 주머니를 사용하여 다음 규칙에 따라 점수를 얻는 시행을 한다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">주머니에서 임의로 \u003cspan class=\"heq\">\\(2\\)\u003c/span>개의 공을 동시에 꺼내어\u003cbr>꺼낸 공이 서로 다른 색이면 \u003cspan class=\"heq\">\\(12\\)\u003c/span>을 점수로 얻고,\u003cbr>꺼낸 공이 서로 같은 색이면 꺼낸 두 공에 적힌 수의 곱을 점수로 얻는다.\u003c/p>\u003c/div>\u003cp class=\"hp htall\">이 시행을 한 번 하여 얻은 점수가 \u003cspan class=\"heq\">\\(24\\)\u003c/span> 이하의 짝수일 확률이 \u003cspan class=\"heq\">\\(\\dfrac{q}{p}\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(p+q\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(p\\)\u003c/span>와 \u003cspan class=\"heq\">\\(q\\)\u003c/span>는 서로소인 자연수이다.) \u003cspan class=\"hscore\">[4점]\u003c/s
