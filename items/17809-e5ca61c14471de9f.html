<script>window.HandStudyRecord={"itemId":17809,"sourceLabel":"2023 평가원 고3 수학확통 6월 30번","adminYear":2023,"grade":3,"month":6,"number":30,"track":"확통","points":4,"scoreStatus":"confirmed_4_direct","questionText":"주머니에 숫자 $1,\\,2,\\,3,\\,4$가 하나씩 적혀 있는 흰 공 $4$개와 숫자 $4,\\,5,\\,6,\\,7$이 하나씩 적혀 있는 검은 공 $4$개가 들어 있다. 이 주머니를 사용하여 다음 규칙에 따라 점수를 얻는 시행을 한다.\n 주머니에서 임의로 $2$개의 공을 동시에 꺼내어 꺼낸 공이 서로 다른 색이면 $12$을 점수로 얻고, 꺼낸 공이 서로 같은 색이면 꺼낸 두 공에 적힌 수의 곱을 점수로 얻는다.\n이 시행을 한 번 하여 얻은 점수가 $24$ 이하의 짝수일 확률이 $\\frac{q}{p}$일 때, $p+q$ 의 값을 구하시오. (단, $p$와 $q$는 서로소인 자연수이다.) [4점]","answer":"51","sourceHash":"4aace5c35b1201cb204ef207925b18f4b78ccea1c3b751e31790d2c2e01c2ae8","steps":[{"id":"s1","latex":"{ {}_{8}\\mathrm{C}_{2} }=28"},{"id":"s2","latex":"\\text{서로 다른 색}:\\ 4\\cdot4=16"},{"id":"s3","latex":"\\text{같은 색, 두 홀수}:{ {}_{4}\\mathrm{C}_{2} }-1=5"},{"id":"s4","latex":"\\text{같은 색, 두 짝수}:\\ 2"},{"id":"s5","latex":"P=\\frac{16+5+2}{28}=\\frac{23}{28}\\Rightarrow p+q=51"}],"diagram":null,"contentHash":"53982c7b41729d484dfea7c8b6938bef6a8d417e342e857e33e662e7cbeae814","questionHtml":"<p class=\"hp\">주머니에 숫자 <span class=\"heq\">\\(1,\\,2,\\,3,\\,4\\)<\/span>가 하나씩 적혀 있는 흰 공 <span class=\"heq\">\\(4\\)<\/span>개와 숫자 <span class=\"heq\">\\(4,\\,5,\\,6,\\,7\\)<\/span>이 하나씩 적혀 있는 검은 공 <span class=\"heq\">\\(4\\)<\/span>개가 들어 있다. 이 주머니를 사용하여 다음 규칙에 따라 점수를 얻는 시행을 한다.<\/p><div class=\"hbox\"><p class=\"hp\">주머니에서 임의로 <span class=\"heq\">\\(2\\)<\/span>개의 공을 동시에 꺼내어<br>꺼낸 공이 서로 다른 색이면 <span class=\"heq\">\\(12\\)<\/span>을 점수로 얻고,<br>꺼낸 공이 서로 같은 색이면 꺼낸 두 공에 적힌 수의 곱을 점수로 얻는다.<\/p><\/div><p class=\"hp htall\">이 시행을 한 번 하여 얻은 점수가 <span class=\"heq\">\\(24\\)<\/span> 이하의 짝수일 확률이 <span class=\"heq\">\\(\\dfrac{q}{p}\\)<\/span>일 때, <span class=\"heq\">\\(p+q\\)<\/span>의 값을 구하시오. (단, <span class=\"heq\">\\(p\\)<\/span>와 <span class=\"heq\">\\(q\\)<\/span>는 서로소인 자연수이다.) <span class=\"hscore\">[4점]<\/span><\/p><p class=\"hp\"><img class=\"hfig\" src=\"../assets/figures/a7323b9a2323377982cb14bb.png\" style=\"width:186p <script>window.HandStudyGuide={"itemId":17809,"sourceHash":"4aace5c35b1201cb204ef207925b18f4b78ccea1c3b751e31790d2c2e01c2ae8","contentHash":"53982c7b41729d484dfea7c8b6938bef6a8d417e342e857e33e662e7cbeae814","overview":{"goal":"색이 다른 경우와 같은 경우를 나누고, 같은 색에서는 곱이 짝수이며 24 이하인지 확인해요.","firstLook":"두 공은 모두 \\({}_8\\mathrm C_2=28\\)가지로 같은 확률이에요. 다른 색이면 점수가 항상 12라 바로 포함돼요.","conditions":[{"label":"목표 점수","meaning":"짝수이면서 24 이하인 경우만 세어요."}]},"chapters":[{"id":"c1","label":"전체와 다른 색을 세어요","stepIds":["s1","s2"],"question":"서로 다른 색 두 공은 몇 쌍인가요?","hint":"흰 공 하나와 검은 공 하나를 각각 골라요.","explanation":"전체 두 공 선택은 \\({}_8\\mathrm C_2=28\\)가지예요. 서로 다른 색이면 \\(4\\cdot4=16\\)쌍이고 점수는 모두 12라 목표 사건에 들어가요.","check":{"prompt":"다른 색의 16쌍에서 숫자를 따로 볼 필요가 없는 이유는 무엇인가요?","answer":"규칙상 숫자와 관계없이 점수가 항상 12이기 때문이에요."}},{"id":"c2","label":"같은 색에서 짝수 곱을 골라요","stepIds":["s3","s4"],"question":"같은 색에서는 어느 숫자쌍이 조건을 만족할까요?","hint":"흰 공과 검은 공을 따로 적고 곱의 짝홀과 \\(24\\) 이하를 함께 확인해요.","explanation":"흰 공의 숫자 \\(1,2,3,4\\)에서 두 개를 고르는 여섯 쌍 중 \\((1,3)\\)만 곱이 홀수예요. 나머지 다섯 쌍의 곱은 모두 짝수이고 가장 큰 \\(3\\cdot4=12\\)도 \\(24\\) 이하라서 5쌍이 모두 들어가요. 검은 공의 숫자 \\(4,5,6,7\\)에서는 곱이 \\(24\\) 이하인 쌍을 직접 보면 \\((4,5)\\)의 \\(20\\), \\((4,6)\\)의 \\(24\\) 두 쌍뿐이에요. 따라서 같은 색에서 조건을 만족하는 쌍은 \\(5+2=7\\)쌍이에요.","check":{"prompt":"경계값 24인 검은 공 4와 6의 곱은 포함되나요?","answer":"조건이 24 이하이므로 포함돼요."}},{"id":"c3","label":"유리한 쌍을 전체로 나눠요","stepIds":["s5"],"question":"최종 유리한 경우는 모두 몇 쌍인가요?","hint":"다른 색 16쌍과 같은 색 7쌍을 더해요.","explanation":"유리한 경우는 \\(16+5+2=23\\)쌍이고 전체는 28쌍이에요. 따라서 확률은 \\(23/28\\)이며 서로소이므로 \\(p+q=28+23=51\\)이에요.","check":{"prompt":"분수 23/28이 기약분수인 이유는 무엇인가요?","answer":"23은 소수이고 28의 인수가 아니기 때문이에요."}}],"takeaway":["규칙이 색에 따라 달라지면 먼저 같은 색과 다른 색으로 나눠요.","곱의 짝홀은 두 인수 중 짝수가 있는지로 판단해요.","이하 조건의 경계값도 빠뜨리지 않고 직접 확인해요."]};</script>
