<script>window.HandStudyRecord={"itemId":8456,"sourceLabel":"2025 교육청 고2 수학 10월 19번","adminYear":2025,"grade":2,"month":10,"number":19,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 기울기가 $1\\,$인 직선 $l\\,$이 곡선 $y=2^{x}\\,$과 서로 다른 두 점 ${{A}}\\,$, ${{B}}\\,$에서 만나고, 곡선 $y=2^{x-1}+1\\,$과 서로 다른 두 점 ${{C}}\\,$, ${{D}}\\,$에서 만난다. 점 ${{B}}\\,$가 선분 ${{AD}}\\,$를 $3\\,:\\,1\\,$로 내분할 때, 점 ${{B}}\\,$의 $x\\,$좌표는? (단, 점 ${{B}}\\,$의 $x\\,$좌표는 점 ${{A}}\\,$의 $x\\,$좌표보다 크고, 점 ${{D}}\\,$의 $x\\,$좌표는 점 ${{C}}\\,$의 $x\\,$좌표보다 크다.) [4점]\n① $\\log_{2}\\,\\frac{23}{7}\\,$ ② $\\log_{2}\\,\\frac{24}{7}\\,$ ③ $\\log_{2}\\,\\frac{25}{7}\\,$\n④ $\\log_{2}\\,\\frac{26}{7}\\,$ ⑤ $\\log_{2}\\,\\frac{27}{7}$","answer":"②","sourceHash":"8a657b9fae653803f066e6c6866d2a4832f57d2a6b0d9f92883f1872fba5fb4e","steps":[{"id":"s1","latex":"y=2^{x-1}+1:\\quad y=2^x\\text{를 }(1,1)\\text{만큼 평행이동}"},{"id":"s2","latex":"x_C=x_A+1,\\ y_C=y_A+1,\\ x_D=x_B+1,\\ y_D=y_B+1,\\quad BD=\\sqrt2"},{"id":"s3","latex":"AB:BD=3:1,\\ \\operatorname{slope}(l)=1\\Rightarrow x_B-x_A=3,\\ y_B-y_A=3"},{"id":"s4","latex":"B=(k,2^k),\\quad A=(k-3,2^k-3)"},{"id":"s5","latex":"2^{k-3}=2^k-3\\Rightarrow\\frac{2^k}{8}=2^k-3\\Rightarrow2^k=\\frac{24}{7}"},{"id":"s6","latex":"x_B=k=\\log_2\\frac{24}{7}"}],"diagram":null,"contentHash":"a2b9287d3c0dd733c6433aef76c3298ee5f1eca3b8351c0c38094d49b02f045b","questionHtml":"<p class=\"hp\">그림과 같이 기울기가 <span class=\"heq\">\\(1\\,\\)<\/span>인 직선 <span class=\"heq\">\\(l\\,\\)<\/span>이 곡선 <span class=\"heq\">\\(y=2^{x}\\,\\)<\/span>과 서로 다른 두 점 <span class=\"heq\">\\({{A}}\\,\\)<\/span>, <span class=\"heq\">\\({{B}}\\,\\)<\/span>에서 만나고, 곡선 <span class=\"heq\">\\(y=2^{x-1}+1\\,\\)<\/span>과 서로 다른 두 점 <span class=\"heq\">\\({{C}}\\,\\)<\/span>, <span class=\"heq\">\\({{D}}\\,\\)<\/span>에서 만난다. 점 <span class=\"heq\">\\({{B}}\\,\\)<\/span>가 선분 <span class=\"heq\">\\({{AD}}\\,\\)<\/span>를 <span class=\"heq\">\\(3\\,:\\,1\\,\\)<\/span>로 내분할 때, 점 <span class=\"heq\">\\({{B}}\\,\\ <script>window.HandStudyGuide={"itemId":8456,"sourceHash":"8a657b9fae653803f066e6c6866d2a4832f57d2a6b0d9f92883f1872fba5fb4e","contentHash":"a2b9287d3c0dd733c6433aef76c3298ee5f1eca3b8351c0c38094d49b02f045b","overview":{"conditions":[{"label":"두 지수곡선","meaning":"\\(y=2^{x-1}+1\\)은 \\(y=2^x\\)를 오른쪽과 위로 각각 \\(1\\)만큼 평행이동한 그래프예요."},{"label":"교점과 내분","meaning":"기울기가 \\(1\\)인 직선의 네 교점 \\(A,B,C,D\\)에서 \\(B\\)는 \\(AD\\)를 \\(3:1\\)로 내분해요."}],"goal":"평행이동과 내분비를 좌표 변화량으로 바꾸어 교점의 x좌표를 구해요.","firstLook":"곡선 \\(y=2^{x-1}+1\\)은 \\(y=2^x\\)를 오른쪽으로 1, 위로 1만큼 옮긴 그래프예요. 같은 기울기 1의 직선 l 위의 교점도 대응하므로 C는 A에서 가로·세로 각각 1만큼, D는 B에서 가로·세로 각각 1만큼 이동한 점이에요. 따라서 \\(BD=\\sqrt2\\)예요."},"chapters":[{"check":{"prompt":"점 \\(C,D\\)의 좌표를 \\(A,B\\)로 나타내면 무엇인가요?","answer":"\\(A=(x_A,y_A)\\), \\(B=(x_B,y_B)\\)라 하면 \\(C=(x_A+1,y_A+1)\\), \\(D=(x_B+1,y_B+1)\\)이에요."},"stepIds":["s1","s2"],"question":"평행이동 뒤 대응하는 교점의 좌표는 어떻게 바뀌나요?","id":"c1","label":"조건을 좌표로 옮겨요","explanation":"곡선 \\(y=2^{x-1}+1\\)은 \\(y=2^x\\)를 오른쪽으로 1, 위로 1만큼 옮긴 그래프예요. 같은 기울기 1의 직선 l 위의 교점도 대응하므로 C는 A에서 가로·세로 각각 1만큼, D는 B에서 가로·세로 각각 1만큼 이동한 점이에요. 따라서 \\(BD=\\sqrt2\\)예요.","hint":"오른쪽과 위로 각각 \\(1\\)만큼 이동해요."},{"check":{"prompt":"\\(B=(k,2^k)\\)라 할 때 \\(A\\)의 좌표는 무엇인가요?","answer":"\\(A=(k-3,2^k-3)\\)이에요."},"stepIds":["s3","s4"],"question":"내분비와 기울기에서 \\(A,B\\)의 좌표 차는 얼마인가요?","id":"c2","label":"좌표 관계로 핵심 식을 세워요","explanation":"B가 AD를 3:1로 내분하므로 \\(AB:BD=3:1\\)이에요. l의 기울기가 1이고 A에서 B로 오른쪽 위로 가므로, B의 좌표를 \\((k,2^k)\\)라 하면 A는 가로와 세로가 각각 3 작은 \\((k-3,2^k-3)\\)예요.","hint":"\\(BD=\\sqrt2\\), \\(AB:BD=3:1\\)이고 직선의 기울기가 \\(1\\)이에요."},{"check":{"prompt":"구한 \\(2^k\\)의 값과 답은 무엇인가요?","answer":"\\(2^k=24/7\\)이므로 \\(k=\\log_2(24/7)\\)예요."},"stepIds":["s5","s6"],"question":"점 \\(A\\)를 지수곡선에 다시 넣으면 어떤 식을 얻나요?","id":"c3","label":"값과 범위를 확인해요","explanation":"A도 \\(y=2^x\\) 위에 있으므로 \\(2^{k-3}=2^k-3\\)이에요. \\(2^k/8=2^k-3\\)에서 \\(7\\cdot2^k=24\\), 따라서 \\(k=\\log_2(24/7)\\)이고 답은 ②예요.","hint":"\\(y_A=2^{x_A}\\)를 사용해요."}],"takeaway":["그래프를 평행이동하면 대응하는 교점의 좌표도 같은 양만큼 변해요.","내분비와 직선의 기울기를 함께 쓰면 두 점 사이의 가로·세로 좌표 차를 정할 수 있어요.","구한 점의 좌표를 원래 함수식에 대입해 미지수를 결정해요."]};</script>
