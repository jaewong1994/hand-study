<script>window.HandStudyRecord={"itemId":8765,"sourceLabel":"2019 교육청 고2 수학가형 3월 29번","adminYear":2019,"grade":2,"month":3,"number":29,"track":"수학가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"최고차항의 계수가 $1\\,$인 다항식 $f(x)\\,$가 다음 조건을 만족시킨다.\n(가) 다항식 $f(x)\\,$를 다항식 $g(x)\\,$로 나눈 몫과 나머지는 모두 $g(x)-2x ^{2} \\,$이다.(나) 다항식 $f(x)\\,$를 $x-1\\,$로 나눈 나머지는 $- \\frac{9}{4} \\,$이다.\n$f(6)\\,$의 값을 구하시오. [4점]","answer":"74","sourceHash":"a6357212569700a14ace5d315ac7fa94c38989758e9d7c28706fed3c8b7459b2","steps":[{"id":"s1","latex":"r(x)=g(x)-2x^2,\\quad f(x)=r(x)\\{g(x)+1\\}"},{"id":"s2","latex":"g(x)=2x^2+px+q,\\quad r(x)=px+q"},{"id":"s3","latex":"p=0\\Rightarrow \\operatorname{LC}(f)=2q=1\\Rightarrow q=\\frac12\\Rightarrow f(1)=\\frac74\\ne-\\frac94"},{"id":"s4","latex":"p\\ne0\\Rightarrow \\operatorname{LC}(f)=2p=1\\Rightarrow p=\\frac12"},{"id":"s5","latex":"f(1)=\\left(q+\\frac12\\right)\\left(q+\\frac72\\right)=-\\frac94\\Rightarrow(q+2)^2=0"},{"id":"s6","latex":"f(6)=(3-2)(72+3-1)=74"}],"diagram":null,"contentHash":"c8e84ab64e553e0c1cbe5be13b8e142580921433630c0fa745f036f689a95ce2","questionHtml":"\u003cp class=\"hp\">최고차항의 계수가 \u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>인 다항식 \u003cspan class=\"heq\">\\(f(x)\\,\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가)다항식 \u003cspan class=\"heq\">\\(f(x)\\,\\)\u003c/span>를 다항식 \u003cspan class=\"heq\">\\(g(x)\\,\\)\u003c/span>로 나눈 몫과 나머지는 \u003cbr>모두 \u003cspan class=\"heq\">\\(g(x)-2x^{2} \\,\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp htall\">(나)다항식 \u003cspan class=\"heq\">\\(f(x)\\,\\)\u003c/span>를 \u003cspan class=\"heq\">\\(x-1\\,\\)\u003c/span>로 나눈 나머지는 \u003cspan class=\"heq\">\\(- \\dfrac{9}{4} \\,\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(f(6)\\,\\)\u003c/span>의 값을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"c57e82e8de98e99490a9b4bc7431270d5c <script>window.HandStudyGuide={"itemId":8765,"sourceHash":"a6357212569700a14ace5d315ac7fa94c38989758e9d7c28706fed3c8b7459b2","contentHash":"c8e84ab64e553e0c1cbe5be13b8e142580921433630c0fa745f036f689a95ce2","overview":{"goal":"나눗셈 관계로 다항식을 인수형태로 만들고 최고차항과 나머지정리를 이용해 계수를 정해요.","firstLook":"몫과 나머지가 같은 다항식이므로 그 다항식을 \\(r\\)라 두면 \\(f=r(g+1)\\)이에요.","conditions":[{"label":"나머지 차수","meaning":"\\(r=g-2x^2\\)의 차수는 \\(g\\)보다 낮아야 해요."},{"label":"최고차항","meaning":"\\(f\\)의 최고차항 계수는 \\(1\\)이에요."}]},"chapters":[{"id":"c1","label":"나눗셈식을 계수형태로 바꿔요","stepIds":["s1","s2"],"question":"\\(g,r,f\\)는 어떻게 표현되나요?","hint":"몫과 나머지를 모두 \\(r=g-2x^2\\)라 놓아요.","explanation":"다항식 나눗셈에서 \\(f=g\\cdot r+r=r(g+1)\\)이에요. \\(g\\)의 이차항은 \\(2x^2\\)여야 나머지에서 없어지므로 \\(g(x)=2x^2+px+q\\), \\(r(x)=px+q\\)로 놓을 수 있어요.","check":{"prompt":"\\(f\\)를 \\(g,r\\)로 쓰면 무엇인가요?","answer":"\\(f=r(g+1)\\)이에요."}},{"id":"c2","label":"최고차항으로 경우를 나눠요","stepIds":["s3","s4"],"question":"왜 \\(p=0\\)인 경우가 탈락하나요?","hint":"각 경우의 \\(f\\) 최고차항 계수를 \\(1\\)과 맞춰요.","explanation":"\\(p=0\\)이면 \\(r=q\\)라 \\(f\\)의 최고차항 계수는 \\(2q\\)이고, \\(q=1/2\\)예요. 이때 \\(f(1)=r(1)(g(1)+1)=\\frac12(7/2)=7/4\\)라 주어진 나머지 \\(-9/4\\)와 맞지 않아요. 따라서 \\(p\\ne0\\)이고, 이때 삼차항 계수 \\(2p=1\\)에서 \\(p=1/2\\)예요.","check":{"prompt":"\\(p\\ne0\\)일 때 \\(f\\)의 차수는 몇 차인가요?","answer":"일차식 \\(r\\)과 이차식 \\(g+1\\)의 곱이라 삼차예요."}},{"id":"c3","label":"나머지정리로 상수항을 정해요","stepIds":["s5","s6"],"question":"\\(q\\)와 \\(f(6)\\)은 얼마인가요?","hint":"\\(f(1)=-9/4\\)를 인수형태에 넣어요.","explanation":"\\(p=1/2\\)일 때 \\(f(1)=(q+1/2)(q+7/2)=-9/4\\)예요. 옮겨 정리하면 \\((q+2)^2=0\\)이므로 \\(q=-2\\)예요. 따라서 \\(r(6)=3-2=1\\), \\(g(6)+1=72+3-2+1=74\\)라 \\(f(6)=74\\)예요.","check":{"prompt":"\\(x=6\\)에서 몫과 나머지는 각각 무엇인가요?","answer":"나머지 \\(r(6)=1\\), \\(g(6)+1=74\\)예요."}}],"takeaway":["몫과 나머지가 같으면 나눗셈식을 인수형태로 묶어요.","최고차항 계수는 계수가 사라지는 경우와 남는 경우를 나누어 비교해요.","일차식으로 나눈 나머지는 나머지정리로 함수값 조건이 돼요."]};</script>
