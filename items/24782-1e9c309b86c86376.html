<script>window.HandStudyGuide={"itemId":24782,"sourceHash":"cd1f987fd23be58ceaba8943116b928697b35b310f5cdcca4a3cfa4d9c438472","contentHash":"41ff1f66476c8f4ee29a042892b8a37bdb24391edec26f990e735c9c6846ef26","overview":{"goal":"각 항의 절댓값을 정한 뒤 전체 합에서 음수인 항의 절댓값 합을 구해 부호를 복원해요.","firstLook":"\\(|a_1|=2\\)이고 매번 절댓값이 두 배이므로 \\(|a_n|=2^n\\)이에요. 남은 것은 어느 항에 음수 부호가 붙는지예요.","conditions":[{"label":"10개 항의 합","meaning":"모두 양수일 때의 합에서 음수 항마다 절댓값의 두 배가 빠져요."}]},"chapters":[{"id":"c1","label":"음수 항의 절댓값 합을 구해요","stepIds":["s1","s2","s3"],"question":"모두 양수일 때 2046에서 −14가 되려면 얼마를 두 번 빼야 할까요?","hint":"음수인 항의 절댓값 합을 S라 두세요.","explanation":"\\(|a_n|=2^n\\)이고 \\(\\sum_{n=1}^{10}2^n=2046\\)이에요. 음수 항의 절댓값 합을 \\(S\\)라 하면 그 항들은 양수로 셌을 때보다 각각 절댓값의 두 배만큼 합을 줄이므로 \\(2046-2S=-14\\)예요. 따라서 \\(S=1030=1024+4+2=2^{10}+2^2+2^1\\)이에요.","check":{"prompt":"왜 S가 아니라 2S를 빼나요?","answer":"\\(+2^j\\)를 \\(-2^j\\)로 바꾸면 합이 \\(2\\cdot2^j\\)만큼 줄기 때문이에요."}},{"id":"c2","label":"이진 표현으로 부호를 확정해요","stepIds":["s4","s5"],"question":"1030의 거듭제곱 합 표현이 유일한 이유는 무엇인가요?","hint":"가장 큰 2의 거듭제곱은 그보다 작은 것들을 모두 더한 값보다 커요.","explanation":"서로 다른 \\(2\\)의 거듭제곱 합은 이진법 표현이라 유일해요. 실제로 \\(2^j>1+2+\\cdots+2^{j-1}\\)이므로 가장 큰 항부터 포함 여부가 강제로 정해져요. 따라서 음수 항은 \\(a_1=-2,a_2=-4,a_{10}=-1024\\)이고 \\(a_3\\)부터 \\(a_9\\)까지는 양수예요.","check":{"prompt":"a10을 빼고도 1030을 만들 수 있나요?","answer":"아니요. \\(2^1\\)부터 \\(2^9\\)까지를 모두 더해도 1022라서 1030에 못 미쳐요."}},{"id":"c3","label":"홀수 번째 항만 더해요","stepIds":["s6"],"question":"요구한 다섯 항의 부호와 크기는 무엇인가요?","hint":"확정한 음수 항 목록과 \\(|a_n|=2^n\\)을 함께 쓰세요.","explanation":"홀수 번째 항 가운데 음수는 \\(a_1\\)뿐이에요. 따라서 \\(a_1+a_3+a_5+a_7+a_9=-2+8+32+128+512=678\\)이에요.","check":{"prompt":"a9의 절댓값은 얼마인가요?","answer":"\\(2^9=512\\)예요."}}],"takeaway":["부호가 섞인 합은 모두 양수인 합에서 음수 항 절댓값의 두 배를 빼서 계산해요.","서로 다른 2의 거듭제곱 합은 이진법으로 유일해요."]};</script>
