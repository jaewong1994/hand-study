<script>window.HandStudyRecord={"itemId":8335,"sourceLabel":"2024 교육청 고2 수학 10월 18번","adminYear":2024,"grade":2,"month":10,"number":18,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 $1\\,$보다 큰 두 실수 $a$, $k\\,$에 대하여 곡선 $y=a^{x}+k\\,$와 직선 $y=3 x+2\\,$가 서로 다른 두 점 ${{A}}$, ${{B}} \\,$에서 만난다. 점 $B\\,$를 지나고 기울기가 $-1\\,$인 직선이 곡선 $y= \\log_{a} \\, \\left(x-k \\right)\\,$와 만나는 점을 $C$, 직선 $y=3 x+2\\,$가 $y\\,$축과 만나는 점을 $D\\,$라 하자. $\\overline{{{AB}} }= \\overline{{{AD}} }\\,$이고 $\\overline{{{BC}} }= \\overline{{{CD}} }\\,$일 때, $a \\times k\\,$의 값은? (단, 점 $B\\,$의 $x\\,$좌표는 점 $A\\,$의 $x\\,$좌표보다 크다.) [4점]\n① $4 \\sqrt{2}$ ② $5 \\sqrt{3}$ ③ $12$\n④ $7 \\sqrt{5}$ ⑤ $8 \\sqrt{6}$","answer":"②","sourceHash":"ed79674b28a878c0e2318e8d92c531c48390ac6ea496ba439d6edda77d784835","steps":[{"id":"s1","latex":"D=(0,2),\\quad A=(p,3p+2),\\quad AB=AD\\Rightarrow B=(2p,6p+2)"},{"id":"s2","latex":"C=(6p+2,2p)\\quad(y=x\\text{ reflection})"},{"id":"s3","latex":"BC=CD,\\quad A=\\operatorname{mid}(BD)\\Rightarrow AC\\perp BD"},{"id":"s4","latex":"\\frac{2p-(3p+2)}{6p+2-p}=-\\frac13\\Rightarrow p=2"},{"id":"s5","latex":"A=(2,8),\\ B=(4,14)\\Rightarrow a^2+k=8,\\ a^4+k=14"},{"id":"s6","latex":"a=\\sqrt3,\\quad k=5\\Rightarrow ak=5\\sqrt3"}],"diagram":null,"contentHash":"c17dbb702a6c853817008a4766507d8c2d535ad6e7f317d93a5f893a4798079e","questionHtml":"\u003cp class=\"hp htall\">그림과 같이 \u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>보다 큰 두 실수 \u003cspan class=\"heq\">\\(a\\)\u003c/span>, \u003cspan class=\"heq\">\\(k\\,\\)\u003c/span>에 대하여 곡선 \u003cspan class=\"heq\">\\(y=a^{x}+k\\,\\)\u003c/span>와 직선 \u003cspan class=\"heq\">\\(y=3 x+2\\,\\)\u003c/span>가 서로 다른 두 점 \u003cspan class=\"heq\">\\({{A}}\\)\u003c/span>, \u003cspan class=\"heq\">\\({{B}} \\,\\)\u003c/span>에서 만난다. 점 \u003cspan class=\"heq\">\\(B\\,\\)\u003c/span>를 지나고 기울기가 \u003cspan class=\"heq\">\\(-1\\,\\)\u003c/span>인 직선이 곡선 \u003cspan class=\"heq\">\\(y= \\log_{a} \\, \\left(x-k \\right)\\,\\)\u003c/span>와
