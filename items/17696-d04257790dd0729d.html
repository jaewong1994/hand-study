<script>window.HandStudyRecord={"itemId":17696,"sourceLabel":"2023 교육청 고3 수학확통 3월 22번","adminYear":2023,"grade":3,"month":3,"number":22,"track":"확통","points":4,"scoreStatus":"confirmed_4_direct","questionText":"최고차항의 계수가 $1\\,$인 사차함수 $f(x)\\,$가 있다. 실수 $t\\,$에 대하여 함수 $g(x)\\,$를 $g(x)= \\left| f(x)-t \\right| \\,$라 할 때, $\\lim _{x\\, \\rightarrow \\,k} {\\frac{g(x)-g(k)}{\\left| x-k \\right|}} \\,$의 값이 존재하는 서로 다른 실수 $k\\,$의 개수를 $h(t)\\,$라 하자. 함수 $h(t)\\,$는 다음 조건을 만족시킨다.\n(가) $\\lim _{t\\, \\rightarrow \\,4+} {h(t)} =5$ (나) 함수 $h(t)\\,$는 $t= -60\\,$과 $t=4\\,$에서만 불연속이다.\n$f(2)=4\\,$이고 $f'(2)>0\\,$일 때, $f(4)+h(4)\\,$의 값을 구하시오.\n[4점]\n 사각형입니다. 2023년 3월 고3 모의고사 문제지제 2 교시 수학 영역(확률과 통계) \n5 지선다형","answer":"729","sourceHash":"d4b8e0c8205b471e1c38ec86656d06580d4eff30ea7a27e7c2c83cdcc949b743","steps":[{"id":"s1","latex":"L_k=\\lim_{x\\to k}\\frac{|f(x)-t|-|f(k)-t|}{|x-k|}"},{"id":"s2","latex":"L_k\\text{ 존재}\\Longleftrightarrow f(k)=t\\ \\text{ 또는 }\\ f'(k)=0"},{"id":"s3","latex":"h(t)=\\#\\bigl(\\{f=t\\}\\cup\\{f'=0\\}\\bigr)"},{"id":"s4","latex":"\\lim_{t\\to4+}h(t)=5,\\quad h\\text{의 불연속점}=-60,4"},{"latex":"h(4+)=5\\Rightarrow f^{\\prime}\\text{는 서로 다른 세 근, }f\\text{는 두 극소와 한 극대}","id":"s5"},{"latex":"\\text{불연속 높이가 둘}\\Rightarrow\\text{두 극솟값은 }-60,\\quad\\text{극댓값은 }4","id":"s6"},{"id":"s7","latex":"f(x)+60=(x-\\alpha)^2(x-\\beta)^2=\\left((x-\\gamma)^2-d\\right)^2"},{"id":"s8","latex":"f(\\gamma)=4\\Rightarrow d^2-60=4\\Rightarrow d=8"},{"id":"s9","latex":"f(2)=4\\Rightarrow (2-\\gamma)^2\\in\\{0,16\\}"},{"id":"s10","latex":"f'(2)>0\\Rightarrow 2-\\gamma=4\\Rightarrow \\gamma=-2"},{"id":"s11","latex":"f(x)=\\left((x+2)^2-8\\right)^2-60,\\quad f(4)=724"},{"id":"s12","latex":"\\{f=4\\}=\\{-6,-2,2\\},\\quad \\{f'=0\\}=\\{-2-2\\sqrt2,-2,-2+2\\sqrt2\\}"},{"id":"s13","latex":"h(4)=5\\Rightarrow f(4)+h(4)=\\boxed{729}"}],"diagram":null,"contentHash":"73c9a568eefa92254c52f722171cb352947ea19690d5c22e00987ef9e28b91a6","questionHtml":"\u003cp class=\"hp htall\">최고차항의 계수가 \u003cspan c
