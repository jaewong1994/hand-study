<script>window.HandStudyRecord={"itemId":17530,"sourceLabel":"2022 평가원 고3 수학확통 9월 30번","adminYear":2022,"grade":3,"month":9,"number":30,"track":"확통","points":4,"scoreStatus":"confirmed_4_direct","questionText":"집합 $X= \\left\\{ 1,\\,2,\\,3,\\,4,\\,5 \\right\\}$와 함수 $f: X \\,\\rightarrow\\, X$에 대하여 함수 $f$의 치역을 $A$, 합성함수 $f \\circ f$의 치역을 $B$라 할 때, 다음 조건을 만족시키는 함수 $f$의 개수를 구하시오. [4점]\n(가) $n(A) \\leq 3$ (나) $n(A)=n(B)$ (다) 집합 $X$의 모든 원소 $x$에 대하여 $f(x) \\neq x$이다.","answer":"260","sourceHash":"14823b5e34a0a6ad7dcec12f1725839f08e2e71d654a5332de709f20f9bb33bb","steps":[{"id":"s1","latex":"A=f(X),\\quad B=f(A)\\subseteq A"},{"id":"s2","latex":"n(A)=n(B)\\Rightarrow B=A"},{"id":"s3","latex":"f|_A:A\\to A\\text{는 전단사}"},{"id":"s4","latex":"f(x)\\ne x\\Rightarrow f|_A\\text{는 완전순열}"},{"id":"s5","latex":"D_1=0,\\quad D_2=1,\\quad D_3=2"},{"id":"s6","latex":"n(A)=k:\\quad {}_5C_kD_k k^{5-k}"},{"id":"s7","latex":"\\sum_{k=1}^3{}_5C_kD_kk^{5-k}=10\\cdot1\\cdot2^3+10\\cdot2\\cdot3^2"},{"id":"s8","latex":"=80+180=\\boxed{260}"}],"diagram":null,"contentHash":"e4fa9e7c5eb90d73e7350086fbe7e33f6abb9c27fb6a2d2e21165c70a51ed7d7","questionHtml":"\u003cp class=\"hp\">집합 \u003cspan class=\"heq\">\\(X= \\left\\{ 1,\\,2,\\,3,\\,4,\\,5 \\right\\}\\)\u003c/span>와 함수 \u003cspan class=\"heq\">\\(f: X \\,\\rightarrow\\, X\\)\u003c/span>에 대하여 함수 \u003cspan class=\"heq\">\\(f\\)\u003c/span>의 치역을 \u003cspan class=\"heq\">\\(A\\)\u003c/span>, 합성함수 \u003cspan class=\"heq\">\\(f \\circ f\\)\u003c/span>의 치역을 \u003cspan class=\"heq\">\\(B\\)\u003c/span>라 할 때, 다음 조건을 만족시키는 함수 \u003cspan class=\"heq\">\\(f\\)\u003c/span>의 개수를 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) \u003cspan class=\"heq\">\\(n(A) \\leq 3\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">(나) \u003cspan class=\"heq\">\\(n(A)=n(B)\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">(다) 집합 \u003cspan class=\"heq\">\\(X\\)\u003c/span>의 모든 원소 \u003cspan class=\"heq\">\\(x\\)\u003c/span>에 대하 <script>window.HandStudyGuide={"itemId":17530,"sourceHash":"14823b5e34a0a6ad7dcec12f1725839f08e2e71d654a5332de709f20f9bb33bb","contentHash":"e4fa9e7c5eb90d73e7350086fbe7e33f6abb9c27fb6a2d2e21165c70a51ed7d7","overview":{"goal":"치역 \\(A\\) 안의 대응을 정한 뒤 치역 크기별로 함수 개수를 세어요.","firstLook":"\\(B=f(A)\\subseteq A\\)이고 원소 수가 같으므로 \\(B=A\\)예요.","conditions":[{"label":"치역 크기","meaning":"\\(n(A)\\)는 \\(1,2,3\\) 중 하나예요."},{"label":"고정점 없음","meaning":"모든 \\(x\\)에서 \\(f(x)\\ne x\\)예요."}]},"chapters":[{"id":"c1","label":"치역 안의 대응을 정해요","stepIds":["s1","s2","s3","s4","s5"],"question":"왜 \\(B=A\\)인가요?","hint":"\\(B=f(A)\\subseteq f(X)=A\\)와 같은 원소 수를 함께 써요.","explanation":"유한집합 \\(B\\subseteq A\\)의 원소 수가 같으므로 \\(B=A\\)예요. 따라서 \\(A\\)의 원소들이 보낸 값은 \\(A\\) 전체를 빠짐없이 채우며 서로 겹치지 않아요. 고정점도 없어야 하므로 자기 자리를 피하는 순열을 고릅니다. 크기 \\(1,2,3\\)에서 그 수는 \\(D_1=0,D_2=1,D_3=2\\)예요.","check":{"prompt":"\\(n(A)=1\\)일 때 왜 불가능한가요?","answer":"유일한 원소를 자기 자신으로 보내야 해 고정점이 생겨요."}},{"id":"c2","label":"치역 밖 원소를 보내요","stepIds":["s6"],"question":"\\(n(A)=k\\)일 때 바깥 원소는 몇 가지씩 선택하나요?","hint":"함숫값은 치역 \\(A\\) 안에 있어야 해요.","explanation":"\\(A\\) 선택은 \\({}_5\\mathrm C_k\\)가지, \\(A\\) 안의 순열은 \\(D_k\\)가지예요. 바깥의 \\(5-k\\)개 원소는 각각 \\(A\\)의 \\(k\\)개 값 중 하나로 가므로 \\(k^{5-k}\\)가지예요. \\(A\\) 안의 대응만으로 이미 치역 전체가 나타나므로 전체는 \\({}_5\\mathrm C_kD_kk^{5-k}\\)예요.","check":{"prompt":"바깥 원소의 고정점을 따로 빼지 않는 이유는 무엇인가요?","answer":"그 원소는 \\(A\\) 밖이라 자기 자신이 함숫값 후보에 없어요."}},{"id":"c3","label":"두 크기의 경우를 더해요","stepIds":["s7","s8"],"question":"실제로 기여하는 치역 크기는 무엇인가요?","hint":"크기 \\(1\\)에서는 가능한 순열이 없어요.","explanation":"\\(k=2\\)이면 \\({}_5\\mathrm C_2\\cdot1\\cdot2^3=80\\), \\(k=3\\)이면 \\({}_5\\mathrm C_3\\cdot2\\cdot3^2=180\\)이에요. 치역 크기가 달라 겹치지 않으므로 합은 \\(260\\)이에요.","check":{"prompt":"\\(k=3\\)의 인수 \\(2\\)는 무엇인가요?","answer":"세 원소를 모두 자기 아닌 곳으로 보내는 두 순열이에요."}}],"takeaway":["합성함수의 치역은 원래 치역에 함수를 한 번 더 적용한 집합이에요.","부분집합인 두 유한집합의 원소 수가 같으면 두 집합은 같아요.","치역 안을 먼저 정하면 바깥 원소는 독립적으로 셀 수 있어요."]};</script>
