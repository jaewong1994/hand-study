<script>window.HandStudyRecord={"itemId":17957,"sourceLabel":"2024 교육청 고3 수학미적분 5월 22번","adminYear":2024,"grade":3,"month":5,"number":22,"track":"미적분","points":4,"scoreStatus":"confirmed_4_direct","questionText":"최고차항의 계수가 $4$이고 서로 다른 세 극값을 갖는 사차함수 $f(x)$와 두 함수 $g(x)$, \n $h \\left(x \\right)= {\\begin{cases}4x+2&& \\left(x\u003ca \\right) \\\\ -2x-3&& \\left(x \\geq a \\right)\\end{cases}}$\n가 있다. 세 함수 $f(x)$, $g(x)$, $h(x)$가 다음 조건을 만족시킨다.\n(가) 모든 실수 $x$에 대하여 $\\left| g \\left(x \\right) \\right| =f \\left(x \\right)$, $\\lim _{t\\, \\rightarrow \\,0+} {} \\frac{g \\left(x+t \\right)-g \\left(x \\right)}{t} = \\left| f' \\left(x \\right) \\right|$ 이다.(나) 함수 $g(x) h(x)$는 실수 전체의 집합에서 연속이다.\n$g(0)=\\frac{40}{3}$일 때, $g(1) \\times h(3)$의 값을 구하시오. (단, $a$는 상수이다.) [4점]\n 사각형입니다. 2024년 5월 고3 모의고사 문제지제 2 교시 수학 영역(미적분) \n5 지선다형","answer":"114","sourceHash":"cc7b8ef62ff3065f2f9a661f77b2f97b31c9163a043d80c22e710c0d117a7f61","steps":[{"id":"s1","latex":"f=|g|\\ge0,\\quad f'(x)=16(x-p)(x-q)(x-s),\\quad p\u003cq\u003cs"},{"id":"s2","latex":"f'>0\\Rightarrow g=f,\\qquad f'\u003c0\\Rightarrow g=-f"},{"id":"s3","latex":"gh\\text{의 연속 조건에서 }4a+2=2a+3\\Rightarrow a=\\dfrac12"},{"id":"s4","latex":"h(x)=0\\Rightarrow x=-\\dfrac12,\\qquad p=-\\dfrac12,\\quad q=\\dfrac12"},{"id":"s5","latex":"f'(x)=16\\left(x^2-\\dfrac14\\right)(x-s),\\qquad f(0)=g(0)=\\dfrac{40}{3}"},{"id":"s6","latex":"f(x)=4x^4-\\dfrac{16s}{3}x^3-2x^2+4sx+\\dfrac{40}{3}"},{"id":"s7","latex":"f(s)=0\\Rightarrow(s^2-4)(2s^2+5)=0\\Rightarrow s=2"},{"id":"s8","latex":"g(1)=-f(1)=-\\dfrac{38}{3},\\qquad h(3)=-9,\\qquad g(1)h(3)=114"}],"diagram":null,"contentHash":"04ed9bb82d88d379008a19538c9895b43439169d573511893939bc462fa724dc","questionHtml":"\u003cp class=\"hp\">최고차항의 계수가 \u003cspan class=\"heq\">\\(4\\)\u003c/span>이고 서로 다른 세 극값을 갖는 사차함수 \u003cspan class=\"heq\">\\(f(x)\\)\u003c/span>와 두 함수 \u003cspan class=\"heq\">\\(g(x)\\)\u003c/span>,\u003c/p>\u003cp class=\"hp htall\">&emsp;&emsp;\u003cspan class=\"heq\">\\(h \\left(x \\right)= {\\begin{cases}4x+2&& \\left(x\\lt a \\right) \\\\ -2x-3&& \\left(x \\geq a \\right)\\end{cases}}\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">가 있다. 세 함수 \u003cspan class=\"heq\">\\(f(x)\\)\u003c/span>, \u003cspan class=\"heq\">\\(g(x)\\)\u003c/span>, \u003cspan class=\"heq\">\\(h(x)\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cp class=\"hp htall\">\u003cdiv class=\"hbox\">\u003cp class=\"hp htall\">(가) 모든 실수 \u003cspan class=\"heq\">\\(x\\)\u003c/span>에 대하여\u003cbr>&emsp;\u003cspan class=\"heq\">\\(\\left| g \\left(x \\right) \\right| =f \\left(x \\right)\\)\u003c/span>, \u003cspan class=\"heq\">\\(\\lim\\limits_{t\\, \\rightarrow \\,0+} {} \\dfrac{g \\left(x+t \\right)-g \\left(x \\right)}{t} = \\left| f' \\left(x \\right) \\right|\\)\u003c/span>\u003cbr>이다.\u003c/p>\u003cp class=\"hp\">(나) 함수 \u003cspan class=\"heq\">\\(g(x) h(x)\\)\u003c/span>는 실수 전체의 집합에서 연속이다.\u003c/p>\u003c/div>\u003c/p>\u003cp class=\"hp htall\">\u003cspan class=\"heq\">\\(g(0)=\\dfrac{40}{3}\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(g(1) \\times h(3)\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(a\\)\u003c/span>는 상수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"a20556313a77924c608796bd9c2c982cef72a7bff7fb78f0b1a525867b582650"};</script>
<script>window.HandStudyGuide={"itemId":17957,"sourceHash":"cc7b8ef62ff3065f2f9a661f77b2f97b31c9163a043d80c22e710c0d117a7f61","contentHash":"04ed9bb82d88d379008a19538c9895b43439169d573511893939bc462fa724dc","overview":{"goal":"오른쪽 미분계수 조건으로 g의 부호 변화를 정하고, gh의 연속 조건이 강제하는 극값 위치에서 사차함수를 결정합니다.","firstLook":"g는 f의 절댓값을 만드는 부호 붙은 함수입니다. 도함수의 부호가 바뀔 때 g의 부호도 바뀌어야 오른쪽 기울기가 항상 |f′|가 됩니다.","conditions":[{"label":"절댓값과 오른쪽 기울기","meaning":"g의 크기는 f이고, 오른쪽 기울기는 음수가 될 수 없습니다."},{"label":"곱의 연속","meaning":"h가 뛰는 지점에서는 g가 0이어야 곱의 좌우 값이 이어집니다."}]},"chapters":[{"id":"c1","label":"극점마다 g의 부호를 정합니다","stepIds":["s1","s2"],"question":"f′의 부호에 따라 g는 왜 f 또는 -f인가요?","hint":"오른쪽 기울기가 |f′|와 같아야 합니다.","explanation":"사차함수의 서로 다른 세 극값 위치를 \\(p<q<s\\)라 하면 최고차항 때문에 \\(f'(x)=16(x-p)(x-q)(x-s)\\)입니다. \\(g=f\\)인 곳의 기울기는 \\(f'\\), \\(g=-f\\)인 곳의 기울기는 \\(-f'\\)입니다. 이를 항상 \\(|f'|\\)로 만들려면 \\(f'>0\\)에서는 \\(g=f\\), \\(f'<0\\)에서는 \\(g=-f\\)여야 합니다.","check":{"prompt":"도함수가 음수인 구간에서 \\(g=f\\)로 둘 수 없는 이유는 무엇인가요?","answer":"그러면 g의 오른쪽 기울기가 음수인 f′가 되어 양수인 |f′|와 같지 않기 때문입니다."}},{"id":"c2","label":"연속 조건으로 두 극점 위치를 찾습니다","stepIds":["s3","s4"],"question":"h가 바뀌는 점과 h의 영점이 왜 f의 극점이 되나요?","hint":"곱 gh가 이어지려면 h의 점프 또는 영점에서 g의 값과 부호 변화를 보세요.","explanation":"극점 \\(p,q,s\\)를 지날 때 \\(g\\)는 \\(\\pm f\\) 사이에서 부호가 바뀌므로 \\(f\\)의 극값이 0이 아니면 \\(g\\)에는 점프가 생깁니다. 곱 \\(gh\\)가 연속이려면 이 점프는 \\(h\\)의 영점이나 \\(h\\) 자체의 점프에서만 상쇄될 수 있습니다. 가운데 극점 \\(q\\)는 \\(f\\)의 극댓값점이라 \\(f(q)>0\\)이므로 \\(f(q)=0\\)으로 점프를 없앨 수 없습니다. 따라서 \\(q\\)는 \\(h\\)의 점프점 \\(a\\)이고, \\(q\\)의 양쪽에서 \\(g\\)와 \\(h\\)가 함께 부호를 바꾸려면 \\(4a+2=2a+3\\)이어야 하므로 \\(a=q=1/2\\)입니다. 이때 \\(h\\)의 실제 영점은 왼쪽 식 \\(4x+2=0\\)의 \\(x=-1/2\\)뿐이므로 첫 극점은 \\(p=-1/2\\)입니다. 남은 극점 \\(s\\)에서는 \\(h\\)가 0이 아니어서 \\(g\\)의 점프가 없어야 하므로 \\(f(s)=0\\)입니다.","check":{"prompt":"g의 부호가 바뀌는 점에서 f의 값이 0이어야 하는 이유는 무엇인가요?","answer":"h가 0도 아니고 뛰지도 않는 지점에서 gh가 연속이려면 g의 좌우 값이 같아야 합니다. 그런데 극점 양쪽에서 g는 f와 -f로 바뀌므로 그 극점의 f값이 0이어야 합니다."}},{"id":"c3","label":"남은 극점과 함수를 결정합니다","stepIds":["s5","s6","s7"],"question":"조건 \\(f(0)=40/3\\)으로 적분상수까지 포함한 식을 어떻게 얻나요?","hint":"도함수를 전개해 항별로 적분하세요.","explanation":"\\(f'(x)=16(x^2-1/4)(x-s)=16x^3-16sx^2-4x+4s\\)입니다. 적분하고 \\(f(0)=40/3\\)을 쓰면 \\(f(x)=4x^4-16sx^3/3-2x^2+4sx+40/3\\)입니다. 마지막 극점에서도 부호가 바뀌므로 \\(f(s)=0\\)이고, 대입해 정리하면 \\((s^2-4)(2s^2+5)=0\\)입니다. \\(s>q=1/2\\)이므로 \\(s=2\\)입니다.","check":{"prompt":"\\(s=-2\\)를 제외하는 이유는 무엇인가요?","answer":"s는 세 극점 중 가장 오른쪽이고 이미 \\(q=1/2\\)이므로 \\(s>1/2\\)이어야 합니다."}},{"id":"c4","label":"요구한 두 함숫값을 계산합니다","stepIds":["s8"],"question":"g(1)의 부호와 h(3)의 값은 각각 무엇인가요?","hint":"1은 q와 s 사이에 있어 f′가 음수입니다.","explanation":"\\(1/2<1<2\\)에서 \\(f'<0\\)이므로 \\(g(1)=-f(1)=-38/3\\)입니다. 또 \\(3\\ge a\\)이므로 \\(h(3)=-2\\cdot3-3=-9\\)입니다. 따라서 \\(g(1)h(3)=(-38/3)(-9)=114\\)입니다.","check":{"prompt":"두 값이 모두 음수인데 곱이 양수인 것을 확인했나요?","answer":"음수끼리의 곱은 양수이고 크기는 \\(38\\times3=114\\)입니다."}}],"takeaway":["절댓값과 기울기 조건이 함께 있으면 원래 함수의 증감에 따라 부호를 붙입니다.","조각함수와의 곱이 연속이라는 조건은 점프 지점에서 다른 인수가 0이 되도록 강제할 수 있습니다."]};</script>
