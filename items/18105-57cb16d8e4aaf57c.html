<script>window.HandStudyRecord={"itemId":18105,"sourceLabel":"2024 평가원 고3 수학확통 9월 29번","adminYear":2024,"grade":3,"month":9,"number":29,"track":"확통","points":4,"scoreStatus":"confirmed_4_direct","questionText":"수직선의 원점에 점 $A\\,$가 있다. 한 개의 주사위를 사용하여 다음 시행을 한다.\n주사위를 한 번 던져 나온 눈의 수가$4$ 이하이면 점 $A\\,$를 양의 방향으로 $1\\,$만큼 이동시키고,$5$ 이상이면 점 $A\\,$를 음의 방향으로 $1\\,$만큼 이동시킨다.\n이 시행을 $16200\\,$번 반복하여 이동된 점 $A\\,$의 위치가 $5700$ 이하일 확률을 다음 표준정규분포표를 이용하여 구한 값을 $k\\,$라 하자. $1000 \\times k\\,$의 값을 구하시오. [4점]\n[표]\n$z$ | $P(0 \\leq Z \\leq z)$\n$1.0$ | $0.341$\n$1.5$ | $0.433$\n$2.0$ | $0.477$\n$2.5$ | $0.494$\n[/표]","answer":"994","sourceHash":"4157d3d08d664ff588a2228721171e3c6a9245df0e4bdb00e533d850364e846c","steps":[{"id":"s1","latex":"X\\sim\\mathrm B\\!\\left(16200,\\dfrac23\\right)"},{"id":"s2","latex":"A\\text{의 위치}=2X-16200"},{"id":"s3","latex":"2X-16200\\le5700\\Rightarrow X\\le10950"},{"id":"s4","latex":"\\mu=10800,\\quad\\sigma=\\sqrt{16200\\cdot\\dfrac23\\cdot\\dfrac13}=60"},{"id":"s5","latex":"X\\le10950\\Rightarrow Z\\le2.5"},{"id":"s6","latex":"k=0.5+0.494=0.994\\Rightarrow1000k=994"}],"diagram":null,"contentHash":"5426a065f18843c2d8ab42b570bfeb4695c2bbd5862565c6c9549879ff609934","questionHtml":"\u003cp class=\"hp\">수직선의 원점에 점 \u003cspan class=\"heq\">\\(A\\,\\)\u003c/span>가 있다. 한 개의 주사위를 사용하여 다음 시행을 한다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">주사위를 한 번 던져 나온 눈의 수가\u003c/p>\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(4\\)\u003c/span> 이하이면 점 \u003cspan class=\"heq\">\\(A\\,\\)\u003c/span>를 양의 방향으로 \u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>만큼 이동시키고,\u003c/p>\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(5\\)\u003c/span> 이상이면 점 \u003cspan class=\"heq\">\\(A\\,\\)\u003c/span>를 음의 방향으로 \u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>만큼 이동시킨다.\u003c/p>\u003c/div>\u003ctable class=\"htbl\">\u003ctr>\u003ctd style=\"width:37px;border-top:1px solid #333;border-bottom:1px solid #333;border-left:1px solid #333;border-right:1px solid #333\">\u003cp class=\"hp\"> <script>window.HandStudyGuide={"itemId":18105,"sourceHash":"4157d3d08d664ff588a2228721171e3c6a9245df0e4bdb00e533d850364e846c","contentHash":"5426a065f18843c2d8ab42b570bfeb4695c2bbd5862565c6c9549879ff609934","overview":{"goal":"양의 방향으로 움직인 횟수를 이항확률변수로 두고, 위치 조건을 표준정규분포의 범위로 바꿔요.","firstLook":"한 번에 오른쪽으로 갈 확률은 \\(4/6=2/3\\)이에요. 오른쪽 이동 횟수만 알면 왼쪽 이동 횟수와 마지막 위치도 함께 정해져요.","conditions":[{"label":"양의 방향","meaning":"주사위 눈이 1,2,3,4인 네 경우라 확률은 \\(2/3\\)이에요."},{"label":"음의 방향","meaning":"나머지 횟수만큼 1씩 왼쪽으로 움직여요."},{"label":"표 이용","meaning":"이항분포를 정규분포로 가까이 보고 표준화한 값을 표에서 찾아요."}]},"chapters":[{"id":"c1","label":"마지막 위치를 성공 횟수로 나타내요","stepIds":["s1","s2","s3"],"question":"양의 방향 이동 횟수가 \\(X\\)일 때 위치는 왜 \\(2X-16200\\)일까요?","hint":"음의 방향 이동 횟수는 전체 횟수에서 \\(X\\)를 빼면 돼요.","explanation":"양의 방향으로 움직인 횟수를 \\(X\\)라 하면 한 시행의 성공확률이 \\(2/3\\)이므로 \\(X\\)는 시행횟수 \\(16200\\), 성공확률 \\(2/3\\)인 이항분포를 따라요. 양의 이동은 \\(X\\)번, 음의 이동은 \\(16200-X\\)번이므로 마지막 위치는 \\(X-(16200-X)=2X-16200\\)이에요. 위치가 \\(5700\\) 이하라는 조건은 \\(2X-16200\\le5700\\), 즉 \\(X\\le10950\\)이에요.","check":{"prompt":"\\(X=8100\\)이면 점의 위치는 어디인가요?","answer":"오른쪽과 왼쪽 이동이 각각 8100번이라 \\(2\\times8100-16200=0\\), 즉 원점이에요."}},{"id":"c2","label":"평균과 표준편차로 표준화해요","stepIds":["s4","s5"],"question":"\\(10950\\)은 평균에서 표준편차 몇 배만큼 떨어져 있나요?","hint":"이항분포의 평균 \\(np\\), 분산 \\(np(1-p)\\)을 계산해요.","explanation":"평균은 \\(16200\\times(2/3)=10800\\)이고, 표준편차는 \\(\\sqrt{16200\\times(2/3)\\times(1/3)}=\\sqrt{3600}=60\\)이에요. 따라서 \\(X=10950\\)을 표준화하면 \\((10950-10800)/60=150/60=2.5\\)예요. 그러므로 구할 확률은 표준정규확률변수 \\(Z\\)에 대해 \\(P(Z\\le2.5)\\)로 구해요.","check":{"prompt":"표준화한 분자 \\(10950-10800\\)은 무엇을 뜻하나요?","answer":"경계값이 평균보다 \\(150\\)만큼 큰 것을 뜻하고, 이는 표준편차 \\(60\\)의 \\(2.5\\)배예요."}},{"id":"c3","label":"표의 가운데 넓이를 더해요","stepIds":["s6"],"question":"표의 \\(0.494\\)에 왜 \\(0.5\\)를 더할까요?","hint":"표가 주는 범위는 \\(0\\le Z\\le2.5\\)이고, 구하는 범위는 그 왼쪽 전체예요.","explanation":"표에서 \\(P(0\\le Z\\le2.5)=0.494\\)예요. 표준정규분포는 0을 기준으로 좌우 넓이가 각각 \\(0.5\\)이므로 \\(P(Z\\le2.5)=P(Z\\le0)+P(0\\le Z\\le2.5)=0.5+0.494=0.994\\)예요. 따라서 \\(k=0.994\\)이고 \\(1000k=994\\)예요.","check":{"prompt":"\\(2.5\\)가 양수인데 표의 값만 \\(0.494\\)로 답하면 무엇을 빠뜨린 건가요?","answer":"0보다 작은 쪽의 전체 확률 \\(0.5\\)를 빠뜨린 거예요."}}],"takeaway":["두 방향으로 한 칸씩 움직이는 문제는 한 방향의 횟수만 두고 마지막 위치를 나타내요.","이항분포의 경계값에서 평균을 빼고 표준편차로 나누어 표의 값을 찾아요.","표가 0부터의 넓이를 주는지 왼쪽 전체 넓이를 주는지 범위를 먼저 확인해요."]};</script>
