<script>window.HandStudyRecord={"itemId":17939,"sourceLabel":"2024 교육청 고3 수학미적분 10월 22번","adminYear":2024,"grade":3,"month":10,"number":22,"track":"미적분","points":4,"scoreStatus":"confirmed_4_direct","questionText":"최고차항의 계수가 $1\\,$인 삼차함수 $f \\left( x \\right)\\,$에 대하여 함수 $g \\left( x \\right)\\,$를\n $g \\left( x \\right) = {\\begin{cases}\\,f \\left( x \\right) +x&&\\left( f \\left( x \\right) \\geq 0 \\right) \\\\ \\,2f \\left( x \\right)&&\\left( f \\left( x \\right) \u003c0 \\right)\\end{cases}}$\n이라 할 때, 함수 $g \\left( x \\right)\\,$는 다음 조건을 만족시킨다.\n(가) 함수 $g \\left( x \\right)\\,$가 $x=t\\,$에서 불연속인 실수 $t\\,$의 개수는 $1\\,$이다.(나) 함수 $g \\left( x \\right)\\,$가 $x=t\\,$에서 미분가능하지 않은 실수 $t\\,$의 개수는 $2\\,$이다.\n$f \\left( -2 \\right) =\\,-2\\,$일 때, $f \\left( 6 \\right)\\,$의 값을 구하시오. [4점]\n 사각형입니다. 2024년 10월 고3 모의고사 문제지제 2 교시 수학 영역(미적분) \n5 지선다형","answer":"486","sourceHash":"4817d7758387d82abd1b9a0e34c0b83e71840ffbcac0e863d19c498d6ce2d61d","steps":[{"id":"s1","latex":"f(c)=0\\text{이고 }f\\text{가 }c\\text{에서 부호를 바꾸면 }c\\ne0\\text{에서 }g\\text{는 불연속}"},{"id":"s2","latex":"\\text{불연속점은 하나, 비미분점은 둘}\\Rightarrow f(x)=x(x-c)^2,\\quad c\u003c0"},{"id":"s3","latex":"x=0\\text{의 좌우 미분계수}=2c^2,\\ c^2+1"},{"id":"s4","latex":"f(-2)=-2(c+2)^2=-2\\Rightarrow c=-1\\text{ 또는 }-3"},{"id":"s5","latex":"c^2\\ne1\\Rightarrow c=-3"},{"id":"s6","latex":"f(6)=6(6+3)^2=486"}],"diagram":null,"contentHash":"111a61394b8d35676b52417b07bbf7e767d0ad396c08aa9d4fbed47dfe83690b","questionHtml":"\u003cp class=\"hp\">최고차항의 계수가 \u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>인 삼차함수 \u003cspan class=\"heq\">\\(f \\left( x \\right)\\,\\)\u003c/span>에 대하여 함수 \u003cspan class=\"heq\">\\(g \\left( x \\right)\\,\\)\u003c/span>를\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\(g \\left( x \\right) = {\\begin{cases}\\,f \\left( x \\right) +x&&\\left( f \\left( x \\right) \\geq 0 \\right) \\\\ \\,2f \\left( x \\right)&&\\left( f \\left( x \\right) \\lt 0 \\right)\\end{cases}}\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">이라 할 때, 함수 \u003cspan class=\"heq\">\\(g \\left( x \\right)\\,\\)\u003c/span>는 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) 함수 \u003cspan class=\"heq\">\\(g \\left( x \\right)\\,\\)\u003c/span>가 \u003cspan class=\"heq\">\\(x=t\\,\\)\u003c/span>에서 불연속인 실수 \u003cspan class=\"heq\">\\(t\\,\\)\u003c/span>의 개수는 \u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp\">(나) 함수 \u003cspan class=\"heq\">\\(g \\left( x \\right)\\,\\)\u003c/span>가 \u003cspan class=\"heq\">\\(x=t\\,\\)\u003c/span>에서 미분가능하지 않은 실수 \u003cspan class=\"heq\">\\(t\\,\\)\u003c/span>의 개수는 \u003cspan class=\"heq\">\\(2\\,\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(f \\left( -2 \\right) =\\,-2\\,\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(f \\left( 6 \\right)\\,\\)\u003c/span>의 값을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"497bca9d69fe284d759df46706e865ffd0aeeee300908c5b2d38fb908b886f11"};</script>
<script>window.HandStudyGuide={"itemId":17939,"sourceHash":"4817d7758387d82abd1b9a0e34c0b83e71840ffbcac0e863d19c498d6ce2d61d","contentHash":"111a61394b8d35676b52417b07bbf7e767d0ad396c08aa9d4fbed47dfe83690b","overview":{"goal":"조각함수의 식이 바뀌는 f의 근에서 연속성과 좌우 기울기를 조사해 삼차함수의 근 구조를 정해요.","firstLook":"\\(g\\)의 문제점은 \\(f(x)=0\\)인 곳에서만 생겨요. 그 점에서 \\(f+x\\) 쪽 값은 \\(x\\), \\(2f\\) 쪽 극한은 \\(0\\)이므로 근의 위치와 부호 변화가 중요해요.","conditions":[{"label":"삼차함수","meaning":"최고차항 계수가 1이라 가장 왼쪽에서는 음수, 가장 오른쪽에서는 양수예요."},{"label":"불연속점","meaning":"\\(g\\)가 불연속인 실수는 정확히 한 개예요."},{"label":"비미분점","meaning":"불연속점도 미분가능하지 않은 점에 포함하며, 그런 점은 모두 두 개예요."}]},"chapters":[{"id":"c1","label":"근에서 생기는 불연속과 근 구조를 정해요","stepIds":["s1","s2"],"question":"두 개수 조건은 왜 \\(f(x)=x(x-c)^2\\), \\(c<0\\)을 만들까요?","hint":"0이 아닌 근에서 두 조각의 값 0과 근의 좌표가 어떻게 다른지 봐요.","explanation":"\\(f(r)=0\\)에서 \\(f\\)가 부호를 바꾸면 한쪽 조각의 극한은 \\(2f(x)\\to0\\), 다른 쪽은 \\(f(x)+x\\to r\\)예요. 따라서 \\(r\\ne0\\)이면 불연속이에요. 세 개의 서로 다른 근이 있으면 부호가 모두 바뀌므로 불연속점 하나와 별도로 미분가능성을 잃는 점 하나를 만들려면 한 근은 \\(0\\), 나머지는 같은 위치에서 두 번 나타나야 해요.\n\n최고차항 계수가 \\(1\\)이므로 \\(f(x)=x(x-c)^2\\)로 쓸 수 있어요. \\(x=c\\) 근처의 부호는 \\(c\\)의 부호와 같아요. \\(c<0\\)이면 주변에서 \\(f<0\\)라 극한은 \\(0\\)인데 근에서 정한 값은 \\(g(c)=c\\ne0\\)여서 한 불연속점이 생겨요. \\(c>0\\)이면 주변에서도 \\(f\\ge0\\)인 조각을 써 매끄러우므로 조건에 맞지 않아요. 따라서 \\(c<0\\)이에요.","check":{"prompt":"근 \\(x=0\\)에서는 두 조각의 극한값이 왜 같나요?","answer":"\\(f(x)\\to0\\)이고 \\(x\\to0\\)이어서 \\(2f(x)\\)와 \\(f(x)+x\\)가 모두 \\(0\\)으로 가요."}},{"id":"c2","label":"0에서 좌우 기울기를 비교해요","stepIds":["s3"],"question":"\\(x=0\\)에서 두 조각의 미분계수는 각각 얼마인가요?","hint":"\\(f'(0)=c^2\\)이고 \\(x<0\\)에서는 \\(2f\\), \\(x>0\\)에서는 \\(f+x\\)를 사용해요.","explanation":"\\(f(x)=x(x-c)^2\\)에서 \\(f'(0)=c^2\\)이에요. \\(0\\)의 왼쪽에서는 \\(f<0\\)이므로 \\(g=2f\\)이고 왼쪽 미분계수는 \\(2c^2\\)예요. 오른쪽에서는 \\(f\\ge0\\)이므로 \\(g=f+x\\)이고 오른쪽 미분계수는 \\(c^2+1\\)이에요.\n\n이미 \\(x=c\\)가 불연속이라 비미분점 하나예요. 비미분점이 모두 두 개가 되려면 \\(x=0\\)에서도 두 기울기가 달라야 하므로 \\(2c^2\\ne c^2+1\\), 즉 \\(c^2\\ne1\\)이어야 해요.","check":{"prompt":"\\(c^2=1\\)이면 \\(x=0\\)에서 두 미분계수는 얼마인가요?","answer":"둘 다 2가 되어 0에서는 미분가능해져요."}},{"id":"c3","label":"주어진 함숫값에서 c 후보를 구해요","stepIds":["s4","s5"],"question":"\\(f(-2)=-2\\)는 \\(c\\)를 어떤 두 값으로 좁히고 무엇을 제외하나요?","hint":"\\(-2(-2-c)^2=-2\\)를 풀고 \\(c^2\\ne1\\)을 적용해요.","explanation":"\\(f(-2)=-2(-2-c)^2=-2(c+2)^2\\)예요. 이것이 \\(-2\\)이므로 \\((c+2)^2=1\\), 따라서 \\(c=-1\\) 또는 \\(c=-3\\)이에요.\n\n그런데 \\(c=-1\\)이면 \\(c^2=1\\)이라 \\(x=0\\)에서 좌우 미분계수가 같아지고 비미분점이 하나뿐이 돼요. 따라서 \\(c=-3\\)만 남아요.","check":{"prompt":"두 후보는 모두 \\(c<0\\)을 만족하나요?","answer":"둘 다 음수지만, 비미분점 개수 조건까지 적용하면 -3만 남아요."}},{"id":"c4","label":"확정한 함수에 6을 대입해요","stepIds":["s6"],"question":"\\(c=-3\\)일 때 \\(f(6)\\)은 얼마인가요?","hint":"\\(f(x)=x(x+3)^2\\)예요.","explanation":"\\(f(x)=x(x+3)^2\\)이므로 \\(f(6)=6(6+3)^2=6\\cdot81=486\\)이에요.","check":{"prompt":"최고차항 계수도 여전히 \\(1\\)인가요?","answer":"\\(x(x+3)^2\\)의 최고차항이 \\(x^3\\)이므로 계수는 \\(1\\)이에요."}}],"takeaway":["조각을 나누는 기준이 다항식의 부호라면 문제점은 그 다항식의 근에서만 생겨요.","연속이더라도 좌우에서 사용하는 식의 도함숫값이 다르면 미분가능하지 않아요.","불연속점과 비미분점의 개수를 함께 쓰면 근의 위치와 반복 여부를 정할 수 있어요."]};</script>
