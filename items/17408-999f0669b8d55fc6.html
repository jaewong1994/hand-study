<script>window.HandStudyRecord={"itemId":17408,"sourceLabel":"2022 교육청 고3 수학확통 3월 22번","adminYear":2022,"grade":3,"month":3,"number":22,"track":"확통","points":4,"scoreStatus":"confirmed_4_direct","questionText":"실수 전체의 집합에서 연속인 함수 $f(x)\\,$와 최고차항의 계수가 $1\\,$이고 상수항이 $0\\,$인 삼차함수 $g(x)\\,$가 있다. 양의 상수 $a\\,$에 대하여 두 함수 $f(x)$, $g(x)\\,$가 다음 조건을 만족시킨다.\n(가) 모든 실수 $x\\,$에 대하여 $x \\left| g(x) \\right| = \\int _{2a} ^{x} {} \\left( a-t \\right) f(t)\\,dt\\,$이다.(나) 방정식 $g(f(x))=0\\,$의 서로 다른 실근의 개수는 $4\\,$이다.\n$\\int _{-2a} ^{2a} {} f(x)\\,dx\\,$의 값을 구하시오. [4점]\n 사각형입니다. 2022년 3월 고3 모의고사 문제지제 2 교시 수학 영역(확률과 통계) \n5 지선다형","answer":"4","sourceHash":"e827a017a678e09c0f69a526c3030869eb39e57cd99274cce9db2ae3f73ba000","steps":[{"id":"s1","latex":"x=2a:\\quad g(2a)=0,\\quad g(0)=0\\Rightarrow g(x)=x(x-2a)(x-c)"},{"id":"s2","latex":"x|g(x)|\\text{는 미분가능}\\Rightarrow2a\\text{는 중근}\\Rightarrow c=2a,\\quad g(x)=x(x-2a)^2"},{"id":"s3","latex":"(a-x)f(x)=\\{x|x|(x-2a)^2\\}'=4|x|(x-a)(x-2a)"},{"id":"s4","latex":"f(x)=4|x|(2a-x)\\quad(x=a\\text{도 연속성으로 성립})"},{"id":"s5","latex":"g(f(x))=0\\iff f(x)=0\\text{ 또는 }f(x)=2a;\\quad f(x)=0\\text{의 근은 }0,2a"},{"id":"s6","latex":"x\u003c0:\\ f(x)=2a\\text{의 근 하나};\\quad x\\ge0:\\max f=4a^2"},{"id":"s7","latex":"\\text{총 네 근}\\Rightarrow4a^2=2a\\Rightarrow a=1/2"},{"id":"s8","latex":"\\int_{-1}^1 4|x|(1-x)\\,dx=2\\int_0^1 4x\\,dx=4"}],"diagram":null,"contentHash":"a2a8d2d334030e57c65749df1d9229f10ba320358bea2ff68ce3b163090960ac","questionHtml":"\u003cp class=\"hp\">실수 전체의 집합에서 연속인 함수 \u003cspan class=\"heq\">\\(f(x)\\,\\)\u003c/span>와 최고차항의 계수가 \u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>이고 상수항이 \u003cspan class=\"heq\">\\(0\\,\\)\u003c/span>인 삼차함수 \u003cspan class=\"heq\">\\(g(x)\\,\\)\u003c/span>가 있다. 양의 상수 \u003cspan class=\"heq\">\\(a\\,\\)\u003c/span>에 대하여 두 함수 \u003cspan class=\"heq\">\\(f(x)\\)\u003c/span>, \u003cspan class=\"heq\">\\(g(x)\\,\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가)모든 실수 \u003cs
