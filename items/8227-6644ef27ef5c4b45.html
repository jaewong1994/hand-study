ass=\"hp htall\">(가) \u003cspan class=\"heq\">\\(\\lim\\limits_{x \\rightarrow 2\\,-} {} \\dfrac{g \\left( x \\right) -4}{x-2} = \\lim\\limits_{x \\rightarrow 2\\,+} {\\,} \\dfrac{g \\left( x \\right) +4}{x-2} =g' \\left( 0 \\right)\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">(나) 방정식 \u003cspan class=\"heq\">\\(g \\left( x \\right) =4\\)\u003c/span>는 서로 다른 두 실근을 갖는다.\u003c/p>\u003c/div>\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(f(5)\\)\u003c/span>의 값을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"6644ef27ef5c4b45d8090555e89e7460d4ffe4ba1b89081c3999c086b894cae0"};</script>
<script>window.HandStudyGuide={"itemId":8227,"sourceHash":"06aae342f376b834f6c6c598e903f44c566d828a2630a3d5127373aa8590b6b2","contentHash":"0d732b817acfadb29bb1299a4c9bb4b9f8e3a868347d61bb2b53b60fe4995528","overview":{"goal":"극한이 유한하려면 분자가 0이 되어야 한다는 조건으로 \\(f\\)의 두 근을 찾고, \\(g(x)=4\\)의 근 개수에서 세 번째 근과 계수를 정해요.","firstLook":"\\(F(x)=\\int_0^xf(t)dt\\)로 두면 조각식이 짧아져요. \\(x=2\\)에서 분모가 0인 두 극한이 존재하도록 먼저 \\(F(2)\\)를 맞춰요.","conditions":[{"label":"두 극한","meaning":"왼쪽 분자 \\(F(x)-8\\)과 오른쪽 분자 \\(-F(x)+8\\)이 모두 \\(x=2\\)에서 0이어야 해요."},{"label":"도함수 부호","meaning":"\\(f'(2)<0\\)이 세 번째 근 \\(m\\)이 2보다 큼을 알려 줘요."},{"label":"근 두 개","meaning":"왼쪽 조각에서 한 근이 이미 생기므로 오른쪽 조각의 \\(F(x)=0\\)은 정확히 한 근이어야 해요."}]},"chapters":[{"id":"c1","label":"극한에서 두 영점을 얻어요","stepIds":["s1","s2","s3"],"question":"두 극한이 유한하려면 왜 \\(F(2)=8\\)이어야 할까요?","hint":"각 분자의 \\(x=2\\)에서 값을 확인해요.","explanation":"\\(F(x)=\\int_0^xf(t)dt\\)로 두어요. \\(x<2\\)에서 \\(g-4=F-8\\), \\(x\\ge2\\)에서 \\(g+4=-F+8\\)이에요. 분모 \\(x-2\\)가 0으로 가는데 극한이 유한하려면 두 분자 모두 0으로 가야 하므로 \\(F(2)=8\\)이에요. 이제 왼쪽 극한은 \\(f(2)\\), 오른쪽 극한은 \\(-f(2)\\)예요. 둘이 \\(g'(0)\\)과 같고 \\(0<2\\) 조각에서 \\(g'(0)=f(0)\\)이므로 \\(f(2)=-f(2)=f(0)\\), 따라서 \\(f(0)=f(2)=0\\)이에요.","check":{"prompt":"\\(f(2)=-f(2)\\)에서 어떤 값을 얻나요?","answer":"\\(2f(2)=0\\)이므로 \\(f(2)=0\\), 이어서 공통값 \\(f(0)\\)도 0이에요."}},{"id":"c2","label":"근 개수로 세 번째 근을 정해요","stepIds":["s4","s5","s6"],"question":"\\(F(m)=0\\)이면 왜 \\(g(x)=4\\)의 오른쪽 근이 정확히 하나가 될까요?","hint":"\\(x=2,m\\) 사이에서 \\(F\\)는 감소하고 \\(m\\) 뒤에서는 증가해요.","explanation":"최고차항 계수를 \\(c>0\\)이라 하면 \\(f(x)=cx(x-2)(x-m)\\)이에요. \\(f'(2)=2c(2-m)<0\\)이므로 \\(m>2\\)예요. \\(x<2\\)에서 \\(g=4\\)는 \\(F=8\\)이고, \\(F\\)의 증감으로 음의 구간에 한 근이 있어요. \\(x\\ge2\\)에서는 \\(g=4\\)가 \\(F=0\\)이에요. \\(F(2)=8\\)에서 \\(m\\)까지 감소하고 그 뒤 증가하므로, 오른쪽에서 근이 정확히 하나이려면 가장 낮은 값 \\(F(m)\\)이 0이어야 해요. 적분하면 \\(F(m)=cm^3(4-m)/12\\)이고 \\(c>0,m>2\\)이므로 \\(m=4\\)예요.","check":{"prompt":"\\(F(m)<0\\)이면 오른쪽에서 근이 몇 개 생기나요?","answer":"감소하면서 0을 한 번 지나고 \\(m\\) 뒤 증가하면서 다시 지나므로 두 개가 생겨 전체 근 수가 세 개가 돼요."}},{"id":"c3","label":"정적분값으로 계수를 정해요","stepIds":["s7","s8"],"question":"\\(m=4\\)일 때 \\(F(2)\\)가 왜 \\(4c\\)인가요?","hint":"\\(f(x)=cx(x-2)(x-4)\\)를 전개해 0부터 2까지 적분해요.","explanation":"\\(f(x)=c(x^3-6x^2+8x)\\)이므로 \\(F(2)=c[ x^4/4-2x^3+4x^2 ]_0^2=c(4-16+16)=4c\\)예요. 이것이 8이므로 \\(c=2\\)이고, \\(f(5)=2\\cdot5\\cdot3\\cdot1=30\\)이에요.","check":{"prompt":"구한 함수에서 \\(f'(2)<0\\)도 다시 확인해 보세요.","answer":"\\(f'(2)=2c(2-m)=4(2-4)=-8<0\\)이므로 원래 조건과 맞아요."}}],"takeaway":["분모가 0으로 가는 유한한 극한은 분자의 영점 조건부터 확인해요.","적분함수의 근 개수는 도함수인 원래 함수의 부호로 증감 구간을 그려 판단해요.","근 개수 조건으로 가장 낮은 값이 0이어야 하는 경계를 찾은 뒤 실제 적분값으로 계수를 정해요."]};</script>
