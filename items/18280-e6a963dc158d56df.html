<script>window.HandStudyGuide={"itemId":18280,"sourceHash":"5cb951fa5f85fcc4cf7982e766f130b63b53dc5674e57a1fe13f34ee9426c3e9","contentHash":"44f4ab3a8bd546d3a14e7af9e433f23393372a106a31e1e33bf2740fe3da1aa1","overview":{"goal":"먼저 \\(D,E\\)가 받는 전체 공 수를 정한 뒤, 두 색의 배분을 독립적으로 세어요.","firstLook":"\\(E\\)가 \\(e\\)개 받으면 \\(D\\)는 \\(2e\\)개라 \\(A,B,C\\)에게 남는 수는 \\(8-3e\\)개예요.","conditions":[{"label":"(가)","meaning":"\\(8-3e\\)가 홀수여야 해 \\(e\\)의 홀짝이 정해져요."},{"label":"(나)","meaning":"\\(D,E\\)가 받는 전체 공 수의 비가 \\(2:1\\)이에요."}]},"chapters":[{"id":"c1","label":"두 학생의 전체 공 수를 확정해요","stepIds":["s1","s2","s3"],"question":"왜 \\(e\\)는 \\(1\\)만 가능할까요?","hint":"홀수 조건과 \\(3e\\le8\\)을 함께 써요.","explanation":"\\(D,E\\)의 전체 공 수를 \\(d,e\\)라 하면 \\(d=2e\\)이고 \\(A,B,C\\)에게 남는 수는 \\(8-3e\\)예요. 이 수가 홀수이려면 \\(e\\)가 홀수예요. 또 \\(3e\\le8\\)이고 \\(e\\ge0\\)인 정수이므로 가능한 홀수는 \\(e=1\\)뿐이에요. 따라서 \\(E\\)는 \\(1\\)개, \\(D\\)는 \\(2\\)개를 받아요.","check":{"prompt":"\\(e=3\\)을 제외하는 실제 부등식은 무엇인가요?","answer":"\\(D,E\\)가 합쳐 \\(3e=9\\)개를 받아 전체 공 \\(8\\)개를 넘으므로 불가능해요."}},{"id":"c2","label":"두 색의 남은 수를 계산해요","stepIds":["s4","s5","s6"],"question":"\\(E\\)의 흰 공 수 \\(t\\)와 \\(D\\)의 흰 공 수 \\(s\\)를 정하면 남은 두 색 공은 몇 개일까요?","hint":"각 학생의 전체 공 수에서 흰 공 수를 빼 검은 공 수도 구해요.","explanation":"\\(E\\)의 흰 공 수는 \\(t=0,1\\), \\(D\\)의 흰 공 수는 \\(s=0,1,2\\)예요. 그러면 \\(A,B,C\\)에게 남는 흰 공은 \\(4-t-s\\)개예요. \\(E,D\\)가 받은 검은 공은 각각 \\(1-t,2-s\\)이므로 남는 검은 공은 \\(1+t+s\\)개예요. 공을 못 받는 학생도 허용하므로 세 학생에게 같은 색 공 \\(r\\)개를 나누는 수는 \\({}_{3}\\mathrm H_r={}_{r+2}\\mathrm C_2\\)예요. 따라서 한 \\((t,s)\\)의 경우 수는 \\({}_{6-t-s}\\mathrm C_2\\,{}_{3+t+s}\\mathrm C_2\\)예요.","check":{"prompt":"남은 검은 공이 \\(1+t+s\\)개가 되는 계산을 써 보세요.","answer":"\\(4-\\{(1-t)+(2-s)\\}=1+t+s\\)개예요."}},{"id":"c3","label":"여섯 경우를 빠짐없이 더해요","stepIds":["s7"],"question":"여섯 \\((t,s)\\)에서 나오는 곱을 모두 더하면 얼마인가요?","hint":"\\(t+s=0,1,2,3\\)별 값을 계산하되 같은 합이 나오는 순서쌍 수를 세어요.","explanation":"\\((t,s)=(0,0)\\)에서는 \\(45\\), 합이 \\(1\\)인 \\((0,1),(1,0)\\)에서는 각각 \\(60\\), 합이 \\(2\\)인 \\((0,2),(1,1)\\)에서도 각각 \\(60\\), \\((1,2)\\)에서는 \\(45\\)예요. 따라서 \\(45+60+60+60+60+45=330\\)이에요.","check":{"prompt":"값 \\(45\\)가 나오는 두 끝 경우는 무엇인가요?","answer":"\\((t,s)=(0,0)\\)과 \\((1,2)\\)이고 흰 공과 검은 공의 남은 수가 서로 뒤바뀌어요."}}],"takeaway":["전체 개수의 비 조건을 먼저 풀어 일부 학생의 총량을 정해요.","색별 배분에서는 각 색의 남은 수를 따로 계산한 뒤 경우의 수를 곱해요.","작은 범위의 보조변수는 가능한 순서쌍을 전부 적어 누락과 중복을 막아요."]};</script>
