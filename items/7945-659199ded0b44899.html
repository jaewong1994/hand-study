<script>window.HandStudyRecord={"itemId":7945,"sourceLabel":"2020 교육청 고2 수학 6월 18번","adminYear":2020,"grade":2,"month":6,"number":18,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 ${\\overline{O A}} = {\\overline{O B}} =1$, $\\angle AOB= \\theta$인 이등변삼각형 $O A B$가 있다. 선분 $A B$를 지름으로 하는 반원이 선분 $O A$와 만나는 점 중 $A$가 아닌 점을 $P$, 선분 $O B$와 만나는 점 중 $B$가 아닌 점을 $Q$라 하자. 선분 $A B$의 중점을 $M$이라 할 때, 다음은 부채꼴 $M P Q$의 넓이 $S \\left( \\theta \\right)$를 구하는 과정이다. (단, $0\\lt \\theta \\lt \\dfrac{\\pi}{2}$)\n [그림 1]\n삼각형 $O A M$에서 $\\angle OMA$$= \\dfrac{\\pi}{2}$, $\\angle AOM$$= \\dfrac{\\theta }{2}$이므로\n ${\\overline{M A}}$$= {\\boxed{\\vphantom{(}\\, \\left( \\text{가} \\right) \\,}}$\n이다. 한편, $\\angle OAM$$= \\dfrac{\\pi}{2} - \\dfrac{\\theta }{2}$이고 ${\\overline{M A}} = {\\overline{M P}}$이므로\n $\\angle AMP$$= {\\boxed{\\vphantom{(}\\, \\left( \\text{나} \\right) \\,}}$\n이다. 같은 방법으로\n$\\angle OBM$$= \\dfrac{\\pi}{2} - \\dfrac{\\theta }{2}$이고 ${\\overline{M B}} = {\\overline{M Q}}$이므로\n $\\angle BMQ$$= {\\boxed{\\vphantom{(}\\, \\left( \\text{나} \\right) \\,}}$\n이다. 따라서 부채꼴 $M P Q$의 넓이 $S \\left( \\theta \\right)$는\n $S \\left( \\theta \\right)$$= \\dfrac{1}{2} \\times \\left( {\\boxed{\\vphantom{(}\\, \\left( \\text{가} \\right) \\,}} \\right)^{2} \\times {\\boxed{\\vphantom{(}\\, \\left( \\text{다} \\right) \\,}}$\n이다.\n위의 (가), (나), (다)에 알맞은 식을 각각 $f \\left( \\theta \\right)$, $g \\left( \\theta \\right)$, $h \\left( \\theta \\right)$라 할 때, $\\dfrac{f \\left( \\dfrac{\\pi}{3} \\right) \\times g \\left( \\dfrac{\\pi}{6} \\right)}{h \\left( \\dfrac{\\pi}{4} \\right)}$의 값은? [4점]\n① $\\dfrac{5}{12}$ ② $\\dfrac{1}{3}$ ③ $\\dfrac{1}{4}$ ④ $\\dfrac{1}{6}$ ⑤ $\\dfrac{1}{12}$","answer":"④","sourceHash":"420cb1d3fa39bc697f83b5081e77bb37f7af6c2def6295ae32f39b253f31868c","steps":[{"id":"s1","latex":"\\angle OMA=\\dfrac\\pi2,\\quad OA=1,\\quad\\angle AOM=\\dfrac\\theta2"},{"id":"s2","latex":"f(\\theta)=MA=\\sin\\dfrac\\theta2"},{"id":"s3","latex":"MA=MP,\\quad\\ang
