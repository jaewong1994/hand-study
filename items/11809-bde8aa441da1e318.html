<script>window.HandStudyGuide={"itemId":11809,"sourceHash":"d7aefc3b345bf25a876c0bd0ac2b1474b4913ac146c2cb4c620d4b8ab47b08ce","contentHash":"3190c5dbda74fc911d720c33db295bc5071b58fb1bb3ec760e0acd4a61a8e893","overview":{"goal":"움직이는 구간에서 꼭짓점과 두 끝값을 비교해 \\(g(t)\\)를 구간별로 구하고, 수평선과의 교점이 네 개인 높이를 찾아요.","firstLook":"\\(f(x)=(x-2t)^2-4t^2+10t\\)이고 구간은 \\(t\\le x\\le t+3\\)이에요. 꼭짓점 \\(x=2t\\)가 구간 안에 있는지와 두 끝값 중 어느 것이 큰지가 바뀌는 지점을 따로 찾아요.","conditions":[{"label":"서로 다른 근 4개","meaning":"\\(H(t)=g(t)+4t\\)의 그래프와 수평선 \\(y=a\\)의 서로 다른 교점이 네 개여야 해요."}]},"chapters":[{"id":"c1","label":"꼭짓점과 끝값을 비교해요","stepIds":["s1","s2"],"question":"구간을 나누는 두 경계 \\(t=3/2\\), \\(t=3\\)은 어디서 나오나요?","hint":"꼭짓점 \\(2t\\)가 오른쪽 끝 \\(t+3\\)을 넘는 때와 두 끝값 \\(f(t)\\), \\(f(t+3)\\)가 같은 때를 구해요.","explanation":"\\(0\\le t\\le3\\)에서는 \\(t\\le2t\\le t+3\\)이므로 꼭짓점이 구간 안에 있고 최솟값은 \\(f(2t)=-4t^2+10t\\)예요. 두 끝값은 \\(f(t)=-3t^2+10t\\), \\(f(t+3)=-3t^2+4t+9\\)이고 차는 \\(f(t+3)-f(t)=9-6t\\)예요. 따라서 \\(0\\le t\\le3/2\\)에서는 오른쪽 끝값이 최댓값이고, \\(3/2\\le t\\le3\\)에서는 왼쪽 끝값이 최댓값이에요. \\(t\\ge3\\)에서는 꼭짓점이 구간의 오른쪽에 있어 함수가 구간에서 감소하므로 왼쪽 끝이 최댓값, 오른쪽 끝이 최솟값이에요. 이에 따라 \\(g(t)\\)는 차례로 \\(-7t^2+14t+9\\), \\(-7t^2+20t\\), \\(-6t^2+14t+9\\)가 돼요.","check":{"prompt":"\\(t=3/2\\)에서 최댓값을 주는 두 끝값은 어떻게 되나요?","answer":"\\(f(t)=f(t+3)\\)이므로 두 끝값이 같고, 이웃한 두 조각의 \\(g(t)\\)도 같은 값으로 이어져요."}},{"id":"c2","label":"세 조각의 높이와 증감을 확인해요","stepIds":["s3","s4"],"question":"\\(H(t)=g(t)+4t\\)의 두 봉우리와 연결점의 높이는 각각 얼마인가요?","hint":"첫째와 둘째 조각을 완전제곱식으로 보고 꼭짓점의 \\(t\\)값이 해당 구간 안에 있는지 확인해요.","explanation":"첫째 조각은 \\(H_1(t)=-7t^2+18t+9\\)이고 \\(0\\le t\\le3/2\\)에서 \\(t=9/7\\)까지 증가한 뒤 감소해요. 꼭짓점 높이는 \\(H_1(9/7)=144/7\\)이에요. 둘째 조각은 \\(H_2(t)=-7t^2+24t\\)이고 \\(3/2\\le t\\le3\\)에서 \\(t=12/7\\)까지 증가한 뒤 감소하며 꼭짓점 높이는 \\(144/7\\)이에요. 두 조각이 만나는 \\(t=3/2\\)의 높이는 \\(81/4\\)예요. 셋째 조각 \\(H_3(t)=-6t^2+18t+9\\)는 \\(t\\ge3\\)에서 감소하고 시작 높이는 \\(H_3(3)=9\\)예요.","check":{"prompt":"둘째 조각의 꼭짓점 \\(t=12/7\\)은 실제 구간 안에 있나요?","answer":"\\(3/2<12/7<3\\)이므로 둘째 조각 안에 있어 꼭짓점 높이 \\(144/7\\)이 실제로 나와요."}},{"id":"c3","label":"수평선과 네 번 만나는 높이를 찾아요","stepIds":["s5"],"question":"왜 \\(81/4<a<144/7\\)일 때만 서로 다른 교점이 네 개인가요?","hint":"이 높이에서는 첫째 조각과 둘째 조각이 각각 상승 부분과 하강 부분에서 한 번씩 만나요.","explanation":"\\(81/4<a<144/7\\)이면 첫째 조각은 꼭짓점의 양쪽에서 수평선과 두 번 만나고, 둘째 조각도 꼭짓점의 양쪽에서 두 번 만나므로 모두 네 교점이에요. 셋째 조각은 \\(t=3\\)에서의 값이 \\(9<a\\)이고 이후 감소하므로 교점을 더 만들지 않아요. \\(a=81/4\\)에서는 두 조각의 공통 끝점 \\(t=3/2\\)이 한 교점으로 합쳐져 전체가 세 개가 되고, \\(a=144/7\\)에서는 각 봉우리에서 접해 전체가 두 개가 돼요. 그러므로 두 경계는 모두 제외해요.","check":{"prompt":"\\(a=81/4\\)에서 교점이 네 개가 아닌 이유는 무엇인가요?","answer":"첫째와 둘째 조각이 함께 지나는 \\(t=3/2\\)는 같은 실근 한 개이므로 두 번 세지 않아 전체 서로 다른 근이 세 개예요."}},{"id":"c4","label":"경계값으로 답을 계산해요","stepIds":["s6"],"question":"\\(4p+7q\\)의 값은 얼마인가요?","hint":"\\(p=81/4\\), \\(q=144/7\\)을 그대로 넣어요.","explanation":"\\(4p+7q=4(81/4)+7(144/7)=81+144=225\\)예요.","check":{"prompt":"\\(p<q\\)가 실제로 성립하나요?","answer":"\\(81/4=20.25\\), \\(144/7\\approx20.57\\)이므로 성립해요."}}],"takeaway":["움직이는 구간의 최댓값과 최솟값은 꼭짓점의 포함 여부와 두 끝값을 함께 비교해요.","조각함수와 수평선의 교점 수는 각 조각의 증감, 꼭짓점, 공통 끝점을 따로 세어요.","서로 다른 근을 셀 때 조각의 연결점은 두 조각에 속해도 한 번만 세어요."]};</script>
