<script>window.HandStudyRecord={"adminYear":2023,"answer":"162","contentHash":"81a17c49454972cd9d6caeaae510e27db45fe255fbb14e609978e68f4d72110c","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24890,"month":11,"number":29,"points":4,"preview":false,"questionHtml":"\u003cp>첫째항과 공비가 각각 \u003cspan class=\"heq\">\\(0\\)\u003c/span>이 아닌 두 등비수열 \u003cspan class=\"heq\">\\(\\left\\{ a_{n} \\right\\}\\)\u003c/span>, \u003cspan class=\"heq\">\\(\\left\\{ b_{n} \\right\\}\\)\u003c/span>에 대하여 두 급수 \u003cspan class=\"heq\">\\(\\sum_{n=1}^{ \\infty } a_{n}\\)\u003c/span>, \u003cspan class=\"heq\">\\(\\sum_{n=1}^{ \\infty } b_{n}\\)\u003c/span>이 각각 수렴하고\u003c/p>\u003cp> \u003cspan class=\"heq\">\\(\\sum _{n=1} ^{\\infty } a _{n} b _{n} = \\left( \\sum _{n=1} ^{\\infty } a _{n} \\right) \\times \\left( \\sum _{n=1} ^{\\infty } b _{n} \\right)\\)\u003c/span>,\u003c/p>\u003cp> \u003cspan class=\"heq\">\\(3 \\times \\sum _{n=1} ^{\\infty } \\left| a _{2n} \\right| =7 \\times \\sum _{n=1} ^{\\infty } \\left| a _{3n} \\right|\\)\u003c/span>\u003c/p>\u003cp>이 성립한다. \u003cspan class=\"heq\">\\(\\sum _{n=1} ^{\\infty } \\frac{b _{2n-1} +b _{3n+1}}{b _{n}} =S\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(120 S\\)\u003c/span>의 값을 구하시오.\u003c/p>\u003cp>[4점]\u003c/p>","questionText":"첫째항과 공비가 각각 $0$이 아닌 두 등비수열 $\\left\\{ a_{n} \\right\\}$, $\\left\\{ b_{n} \\right\\}$에 대하여 두 급수 $\\sum_{n=1}^{ \\infty } a_{n}$, $\\sum_{n=1}^{ \\infty } b_{n}$이 각각 수렴하고\n $\\sum _{n=1} ^{\\infty } a _{n} b _{n} = \\left( \\sum _{n=1} ^{\\infty } a _{n} \\right) \\times \\left( \\sum _{n=1} ^{\\infty } b _{n} \\right)$,\n $3 \\times \\sum _{n=1} ^{\\infty } \\left| a _{2n} \\right| =7 \\times \\sum _{n=1} ^{\\infty } \\left| a _{3n} \\right|$\n이 성립한다. $\\sum _{n=1} ^{\\infty } \\frac{b _{2n-1} +b _{3n+1}}{b _{n}} =S$일 때, $120 S$의 값을 구하시오.\n[4점]","sourceHash":"b790bd918718bc0f9659d1693114a9329fd7b4329e14c2268d43a3907c2d9086","sourceKind":"csat","sourceLabel":"2023년 시행 수능 · 2024학년도 · 미적분 · 29번","steps":[{"id":"s1","latex":"a_n=a_1r^{n-1},\\ b_n=b_1s^{n-1},\\quad |r|\u003c1,\\ |s|\u003c1"},{"explanation":{"body":"두 수열의 공비를 \\(r,s\\)라 하면 곱수열의 공비는 \\(rs\\)입니다. 세 급수의 합 공식을 대입한 뒤 첫째항 \\(a_1b_1\\)을 약분하면 공비끼리의 관계 \\(r+s=2rs\\)만 남습니다.","skillTags":["무한등비급수","공비관계"],"title":"무한등비급수 식을 비교하기"},"id":"s2","latex":"\\frac{a_1b_1}{1-rs}=\\frac{a_1}{1-r}\\frac{b_1}{1-s}\\Rightarrow r+s=2rs"},{"id":"s3","latex":"3\\frac{|a_1r|}{1-r^{2}}=7\\frac{|a_1r^{2}|}{1-|r|^{3}}"},{"id":"s4","latex":"r>0\\text{이면 }r=\\frac12\\text{이나 }r+s=2rs\\text{를 만족하는 }s\\text{가 없다.}"},{"id":"s5","latex":"r\u003c0\\text{이면 }r=-\\frac12,\\quad -\\frac12+s=-s\\Rightarrow s=\\frac14"},{"explanation":{"body":"\\(b_j=b_1s^{j-1}\\)이므로 \\(b_{3n+1}/b_n=s^{(3n+1-1)-(n-1)}=s^{2n+1}\\)입니다. 지수의 \\(+1\\)을 놓치면 둘째 급수의 첫 항이 달라집니다.","skillTags":["등비수열","첨자계산"],"title":"첨자 차이가 곧 공비의 지수"},"id":"s6","latex":"\\frac{b_{2n-1}}{b_n}=s^{n-1},\\qquad \\frac{b_{3n+1}}{b_n}=s^{2n+1}"},{"id":"s7","latex":"S=\\sum_{n=1}^{\\infty}\\left\\{\\left(\\frac14\\right)^{n-1}+\\left(\\frac14\\right)^{2n+1}\\right\\}"},{"id":"s8","latex":"=\\frac1{1-1/4}+\\frac{1/64}{1-1/16}=\\frac43+\\frac1{60}=\\frac{27}{20}"},{"id":"s9","latex":"120S=120\\cdot\\frac{27}{20}=162"},{"id":"s10","latex":"\\therefore\\ \\boxed{162}"}],"track":"미적분"};</script>
<script>window.HandStudyGuide={"itemId":24890,"sourceHash":"b790bd918718bc0f9659d1693114a9329fd7b4329e14c2268d43a3907c2d9086","contentHash":"81a17c49454972cd9d6caeaae510e27db45fe255fbb14e609978e68f4d72110c","overview":{"goal":"두 등비급수의 조건에서 공비를 결정하고, 첨자 차이를 공비의 지수로 바꾸어 새로운 급수의 합을 구해요.","firstLook":"첫째항은 모두 약분되고 공비 사이의 관계만 남아요. 절댓값 급수는 공비의 크기를 먼저 정해 줘요.","conditions":[{"label":"세 등비급수의 합 관계","meaning":"공비를 \\(r,s\\)로 두어 \\(r+s=2rs\\)를 만들어요."},{"label":"절댓값을 씌운 두 부분수열","meaning":"\\(|r|\\)에 대한 방정식으로 공비의 크기를 정하고 부호를 따로 판정해요."}]},"chapters":[{"id":"c1","label":"두 공비의 관계 만들기","stepIds":["s1","s2"],"question":"세 급수의 합 공식을 대입하고 첫째항을 약분하면 어떤 관계가 남을까요?","hint":"곱수열의 공비가 \\(rs\\)라는 점을 이용하세요.","explanation":"\\(a_n=a_1r^{n-1}\\), \\(b_n=b_1s^{n-1}\\)로 두어요. 두 급수가 수렴하므로 \\(|r|<1\\), \\(|s|<1\\)이고 곱수열의 공비도 \\(rs\\)예요. 첫 조건에 합 공식을 넣으면 \\(\\frac{a_1b_1}{1-rs}=\\frac{a_1}{1-r}\\frac{b_1}{1-s}\\)예요. 첫째항들은 0이 아니므로 약분할 수 있고, \\((1-r)(1-s)=1-rs\\)를 정리하면 \\(r+s=2rs\\)예요.","check":{"prompt":"곱수열 \\(a_nb_n\\)의 첫째항과 공비는 각각 무엇인가요?","answer":"첫째항은 \\(a_1b_1\\), 공비는 \\(rs\\)예요."}},{"id":"c2","label":"절댓값 급수로 공비 정하기","stepIds":["s3","s4","s5"],"question":"절댓값 급수 조건은 \\(|r|\\)에 대해 어떤 방정식을 만들고, 두 부호 중 무엇을 남길까요?","hint":"\\(u=|r|\\)로 두고 두 부분수열의 첫 항과 공비를 적으세요.","explanation":"\\(|a_{2n}|\\)의 첫 항은 \\(|a_1|u\\), 공비는 \\(u^2\\)이고, \\(|a_{3n}|\\)의 첫 항은 \\(|a_1|u^2\\), 공비는 \\(u^3\\)이에요. 따라서 \\(3\\frac{|a_1|u}{1-u^2}=7\\frac{|a_1|u^2}{1-u^3}\\)예요. 양의 \\(|a_1|u\\)를 약분하고 인수분해하면 \\(3(1+u+u^2)=7u(1+u)\\), 곧 \\(4u^2+4u-3=0\\)이므로 \\(u=1/2\\)예요.\n\n\\(r=1/2\\)를 \\(r+s=2rs\\)에 넣으면 \\(1/2+s=s\\)가 되어 모순이에요. 따라서 \\(r=-1/2\\)이고, \\(-1/2+s=-s\\)에서 \\(s=1/4\\)예요.","check":{"prompt":"\\(u=-3/2\\)도 이차방정식의 해인데 왜 쓰지 않나요?","answer":"\\(u=|r|\\)는 0 이상이어야 하므로 음수인 해는 버려요."}},{"id":"c3","label":"첨자를 공비의 지수로 바꾸기","stepIds":["s6","s7"],"question":"\\(b_{3n+1}/b_n\\)의 지수가 \\(2n+1\\)이 되는 이유는 무엇인가요?","hint":"분자와 분모에서 \\(s\\)의 지수를 각각 쓴 뒤 빼세요.","explanation":"\\(b_{2n-1}=b_1s^{2n-2}\\), \\(b_n=b_1s^{n-1}\\)이므로 \\(\\frac{b_{2n-1}}{b_n}=s^{n-1}\\)이에요. 또 \\(b_{3n+1}=b_1s^{3n}\\)이므로 \\(\\frac{b_{3n+1}}{b_n}=s^{3n-(n-1)}=s^{2n+1}\\)이에요. \\(s=1/4\\)를 넣으면 \\(S=\\sum_{n=1}^{\\infty}\\left\\{(1/4)^{n-1}+(1/4)^{2n+1}\\right\\}\\)이에요.","check":{"prompt":"둘째 급수에서 \\(n=1\\)일 때 첫 항은 얼마인가요?","answer":"\\((1/4)^3=1/64\\)예요."}},{"id":"c4","label":"두 급수의 합 계산하기","stepIds":["s8","s9","s10"],"question":"두 번째 급수의 공비가 \\(1/4\\)가 아니라 얼마인지 확인했나요?","hint":"지수 \\(2n+1\\)은 \\(n\\)이 1 늘 때마다 2씩 늘어요.","explanation":"첫 급수의 첫 항은 1, 공비는 \\(1/4\\)라서 합은 \\(4/3\\)이에요. 둘째 급수의 첫 항은 \\(1/64\\), 공비는 \\((1/4)^2=1/16\\)이므로 합은 \\(\\frac{1/64}{1-1/16}=1/60\\)이에요. 따라서 \\(S=4/3+1/60=27/20\\)이고 \\(120S=162\\)예요.","check":{"prompt":"\\(4/3+1/60\\)의 합은 어떻게 \\(27/20\\)이 되나요?","answer":"\\(4/3=80/60\\)이므로 합은 \\(81/60=27/20\\)이에요."}}],"takeaway":["등비급수의 곱 조건에서는 첫째항을 약분해 공비 관계를 먼저 만들어요.","절댓값 급수는 공비의 크기를 정한 뒤 원래 관계식으로 부호를 고르면 돼요.","부분수열의 비를 구할 때는 첨자 자체가 아니라 공비 지수의 차를 계산해요."]};</script>
