<script>window.HandStudyRecord={"itemId":16272,"sourceLabel":"2019 교육청 고3 수리가형 4월 20번","adminYear":2019,"grade":3,"month":4,"number":20,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"좌표평면 위에 원 $x ^{2} +y ^{2} =9$와 직선 $y=4$가 있다. $t!= -3$, $t!=3$인 실수 $t$에 대하여 직선 $y=4$ 위의 점 $P \\left( \\,t,\\,4 \\right)$에서 원 $x ^{2} +y ^{2} =9$에 그은 두 접선의 기울기의 곱을 $f \\left( t \\right)$라 할 때, \u003c보기>에서 옳은 것만을 있는 대로 고른 것은? [4점]\n보 기ㄱ. $f \\left( \\sqrt{2} \\right) = -1$ ㄴ. 열린 구간 $\\left( \\,-3,\\,3 \\right)$에서 $f'' \\left( t \\right) \u003c0$이다.ㄷ. 방정식 $9f \\left( x \\right) =3 ^{x+2} -7$의 서로 다른 실근의 개수는 $2$이다.\n① ㄱ ② ㄷ ③ ㄱ, ㄴ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","answer":"③","sourceHash":"06310d5b29b52d60e1d15dcc31cd32962c1db5fcb6d14879a9aaf90c8b3fa55e","steps":[{"id":"s1","latex":"\\dfrac{|4-mt|}{\\sqrt{m^2+1}}=3\\Rightarrow(t^2-9)m^2-8tm+7=0"},{"id":"s2","latex":"f(t)=\\dfrac7{t^2-9},\\quad f(\\sqrt2)=-1"},{"id":"s3","latex":"f''(t)=\\dfrac{42(t^2+3)}{(t^2-9)^3}\u003c0\\quad(-3\u003ct\u003c3)"},{"id":"s4","latex":"9f(x)=3^{x+2}-7\\Leftrightarrow\\dfrac{7x^2}{x^2-9}=3^{x+2}"},{"id":"s5","latex":"x\u003c-3:\\quad\\dfrac{7x^2}{x^2-9}>7>3^{x+2}"},{"id":"s6","latex":"-3\u003cx\u003c3:\\quad\\frac{7x^2}{x^2-9}\\le0\u003c3^{x+2}"},{"id":"s7","latex":"x>3:\\quad\\dfrac{7x^2}{x^2-9}\\searrow7,\\qquad3^{x+2}\\nearrow\\infty"},{"id":"s8","latex":"\\therefore\\text{실근은 하나},\\quad\\text{ㄱ, ㄴ만 참}"}],"diagram":null,"contentHash":"09c17b9e8ef51391ff24df04c73eddf91de0ac40454dc49a71d17d54a4082846","questionHtml":"\u003cp class=\"hp\">좌표평면 위에 원 \u003cspan class=\"heq\">\\(x^{2} +y^{2} =9\\)\u003c/span>와 직선 \u003cspan class=\"heq\">\\(y=4\\)\u003c/span>가 있다. \u003cbr>\u003cspan class=\"heq\">\\(t \\neq  -3\\)\u003c/span>, \u003cspan class=\"heq\">\\(t \\neq 3\\)\u003c/span>인 실수 \u003cspan class=\"heq\">\\(t\\)\u003c/span>에 대하여 직선 \u003cspan class=\"heq\">\\(y=4\\)\u003c/span> 위의 점 \u003cspan class=\"heq\">\\(P \\left( \\,t,\\,4 \\right)\\)\u003c/span>에서 원 \u003cspan class=\"heq\">\\(x^{2} +y^{2} =9\\)\u003c/span>에 그은 두 접선의 기울기의 곱을 \u003cspan class=\"heq\">\\(f \\left( t \\right)\\)\u003c/span>라 할 때, &lt;보기&gt;에서 옳은 것만을 있는 대로 고른 것은? \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cdiv class=\"hbox\">\u003cdiv style=\"text-align:center;font-weight:700;margin:0 0 6px\">&lt; 보 기 &gt;\u003c/div>\u003cp class=\"hp\">ㄱ. \u003cspan class=\"heq\">\\(f \\left( \\sqrt{2} \\right) = -1\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">ㄴ. 열린 구간 \u003cspan class=\"heq\">\\(\\left( \\,-3,\\,3 \\right)\\)\u003c/span>에서 \u003cspan class=\"heq\">\\(f'' \\left( t \\right) \\lt 0\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp\">ㄷ. 방정식 \u003cspan class=\"heq\">\\(9f \\left( x \\right) =3^{x+2} -7\\)\u003c/span>의 서로 다른 실근의 개수는 \u003cspan class=\"heq\">\\(2\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp class=\"hp\">① ㄱ&emsp;② ㄷ&emsp;③ ㄱ, ㄴ\u003c/p>\u003cp class=\"hp\">④ ㄴ, ㄷ&emsp;⑤ ㄱ, ㄴ, ㄷ\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"4ebcb8d1f3a5d1602f5f8ef0ae577d3ba23931e8fac25910f4539fac3e3ebbef"};</script>
<script>window.HandStudyGuide={"itemId":16272,"sourceHash":"06310d5b29b52d60e1d15dcc31cd32962c1db5fcb6d14879a9aaf90c8b3fa55e","contentHash":"09c17b9e8ef51391ff24df04c73eddf91de0ac40454dc49a71d17d54a4082846","overview":{"goal":"두 접선의 기울기를 이차방정식의 두 근으로 보고 곱을 구한 뒤 세 명제를 판정해요.","firstLook":"기울기가 \\(m\\)인 접선은 \\(P(t,4)\\)를 지나요. 원의 중심에서 이 직선까지의 거리가 반지름 3이라는 조건을 쓰면 돼요.","conditions":[{"label":"접선 조건","meaning":"원점과 직선 사이의 거리가 3이에요."},{"label":"정의역","meaning":"\\(t=\\pm3\\)에서는 기울기 방정식의 이차항이 사라지므로 제외되어 있어요."}]},"chapters":[{"id":"c1","label":"접선 기울기의 곱을 구해요","stepIds":["s1","s2"],"question":"두 접선의 기울기 곱이 왜 \\(7/(t^2-9)\\)일까요?","hint":"직선을 \\(y-4=m(x-t)\\)로 쓰고 원점과의 거리를 3으로 놓아요.","explanation":"직선은 \\(mx-y+4-mt=0\\)이고 원점과의 거리는 \\(|4-mt|/\\sqrt{m^2+1}\\)예요. 이를 3으로 놓고 제곱하면 \\((t^2-9)m^2-8tm+7=0\\)을 얻어요. 두 접선의 기울기는 이 이차방정식의 두 근이므로 곱은 \\(f(t)=7/(t^2-9)\\)예요. 따라서 \\(f(\\sqrt2)=7/(2-9)=-1\\)이라 ㄱ은 참이에요.","check":{"prompt":"기울기 두 값을 직접 구하지 않아도 되는 이유는 무엇인가요?","answer":"두 기울기가 같은 이차방정식의 두 근이므로 근과 계수의 관계로 곱을 바로 구할 수 있어요."}},{"id":"c2","label":"둘째 도함수의 부호를 확인해요","stepIds":["s3"],"question":"\\((-3,3)\\)에서 왜 항상 \\(f''(t)<0\\)일까요?","hint":"분자는 양수이고 분모의 부호는 \\(t^2-9\\)가 정해요.","explanation":"두 번 미분하면 \\(f''(t)=42(t^2+3)/(t^2-9)^3\\)이에요. 분자 \\(42(t^2+3)\\)은 항상 양수이고, \\(-3<t<3\\)에서는 \\(t^2-9<0\\)이므로 세제곱한 분모도 음수예요. 따라서 이 구간에서 \\(f''(t)<0\\)이고 ㄴ은 참이에요.","check":{"prompt":"분모가 세제곱이라는 점이 왜 중요한가요?","answer":"홀수 번 거듭제곱이므로 \\(t^2-9\\)의 음수 부호가 그대로 유지돼요."}},{"id":"c3","label":"방정식을 세 구간에서 비교해요","stepIds":["s4","s5","s6","s7"],"question":"방정식의 실근은 각 구간에서 몇 개일까요?","hint":"식을 \\(7x^2/(x^2-9)=3^{x+2}\\)로 바꾸고 \\(-3,3\\)을 경계로 나눠요.","explanation":"\\(9f(x)=3^{x+2}-7\\)을 정리하면 \\(7x^2/(x^2-9)=3^{x+2}\\)예요. \\(x<-3\\)에서는 왼쪽이 7보다 크고 오른쪽은 \\(3^{x+2}<1/3\\)이라 해가 없어요. \\(-3<x<3\\)에서는 왼쪽이 0 이하이고 오른쪽은 양수라 해가 없어요. \\(x>3\\)에서는 왼쪽이 \\(x=3\\)의 오른쪽에서 매우 큰 값으로 시작해 7을 향해 계속 감소하고, 오른쪽은 계속 증가해요. 따라서 이 구간에서 정확히 한 번 만나 실근은 하나예요.","check":{"prompt":"\\(x>3\\)에서 교점이 정확히 하나인 이유는 무엇인가요?","answer":"왼쪽은 연속적으로 감소하고 오른쪽은 연속적으로 증가하며, 처음에는 왼쪽이 더 크고 충분히 큰 \\(x\\)에서는 오른쪽이 더 크기 때문이에요."}},{"id":"c4","label":"참인 명제를 골라요","stepIds":["s8"],"question":"ㄷ의 주장과 최종 선택지는 무엇일까요?","hint":"ㄷ은 실근이 두 개라고 주장하지만 실제로는 하나예요.","explanation":"방정식의 서로 다른 실근은 하나이므로 ㄷ은 거짓이에요. ㄱ과 ㄴ만 참이어서 정답은 ③이에요.","check":{"prompt":"\\(x=\\pm3\\)을 근으로 검사하지 않는 이유는 무엇인가요?","answer":"\\(f(x)=7/(x^2-9)\\)가 정의되지 않는 값이라 원래 방정식의 정의역에 들어가지 않아요."}}],"takeaway":["원에 그은 접선의 기울기는 거리 조건으로 만든 이차방정식의 근으로 다룰 수 있어요.","유리함수와 지수함수의 교점은 정의되지 않는 점을 경계로 나누고 부호와 증가·감소를 함께 비교해요."]};</script>
