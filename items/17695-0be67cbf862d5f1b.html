<script>window.HandStudyRecord={"itemId":17695,"sourceLabel":"2023 교육청 고3 수학확통 10월 30번","adminYear":2023,"grade":3,"month":10,"number":30,"track":"확통","points":4,"scoreStatus":"confirmed_4_direct","questionText":"주머니에 숫자 $1$, $2\\,$가 하나씩 적혀 있는 흰 공 $2\\,$개와 숫자 $1$, $2$, $3\\,$이 하나씩 적혀 있는 검은 공 $3\\,$개가 들어 있다. 이 주머니를 사용하여 다음 시행을 한다.\n주머니에서 임의로 $2\\,$개의 공을 동시에 꺼내어 꺼낸 공이 서로 같은 색이면 꺼낸 공 중 임의로 $1\\,$개의 공을 주머니에 다시 넣고, 꺼낸 공이 서로 다른 색이면 꺼낸 공을 주머니에 다시 넣지 않는다.\n이 시행을 한 번 한 후 주머니에 들어 있는 모든 공에 적힌 수의 합이 $3\\,$의 배수일 때, 주머니에서 꺼낸 $2\\,$개의 공이 서로 다른 색일 확률은 $\\frac{ q}{ p}\\,$이다. $p+q\\,$의 값을 구하시오. (단, $p\\,$와 $q\\,$는 서로소인 자연수이다.) [4점]","answer":"5","sourceHash":"1000907df93b0a255c607a2260d5a6996d37872a27812b9ebba7a19716983c4c","steps":[{"id":"s1","latex":"P(A)=3/10"},{"id":"s2","latex":"P(A\\cap B)=2/10"},{"id":"s3","latex":"P(B|A)=2/3"},{"id":"s4","latex":"p+q=\\boxed5"}],"diagram":null,"contentHash":"0ec37cf494fc945dd9a9935724daf08def614f0c8606b32c1a30a296a5040890","questionHtml":"\u003cp class=\"hp\">주머니에 숫자 \u003cspan class=\"heq\">\\(1\\)\u003c/span>, \u003cspan class=\"heq\">\\(2\\,\\)\u003c/span>가 하나씩 적혀 있는 흰 공 \u003cspan class=\"heq\">\\(2\\,\\)\u003c/span>개와 숫자 \u003cspan class=\"heq\">\\(1\\)\u003c/span>, \u003cspan class=\"heq\">\\(2\\)\u003c/span>, \u003cspan class=\"heq\">\\(3\\,\\)\u003c/span>이 하나씩 적혀 있는 검은 공 \u003cspan class=\"heq\">\\(3\\,\\)\u003c/span>개가 들어 있다. \u003cbr>이 주머니를 사용하여 다음 시행을 한다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">주머니에서 임의로 \u003cspan class=\"heq\">\\(2\\,\\)\u003c/span>개의 공을 동시에 꺼내어\u003cbr>꺼낸 공이 서로 같은 색이면 꺼낸 공 중 임의로 \u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>개의 공을 주머니에 다시 넣고, \u003cbr>꺼낸 공이 서로 다른 색이면 꺼낸 공을 주머니에 다시 넣지 않는다.\u003c/p>\u003c/div>\u003cp class=\"hp htall\">이 시행을 한 번 한 후 주머니에 들어 있는 모든 공에 적힌 수의 합이 \u003cspan class=\"heq\">\\(3\\,\\)\u003c/span>의 배수일 때, 주머니에서 꺼낸 \u003cspan class=\"heq\">\\(2\\,\\)\u003c/span>개의 공이 서로 다른 색일 확률은 \u003cspan class=\"heq\">\\(\\dfrac{ q}{ p}\\,\\)\u003c/span>이다. \u003cspan class=\"heq\">\\(p+q\\,\\)\u003c/span>의 값을 구하시오.\u003cbr>(단, \u003cspan class=\"heq\">\\(p\\,\\)\u003c/span>와 \u003cspan class=\"heq\">\\(q\\,\\)\u003c/span>는 서로소인 자연수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/39dbf450ccc43266681b7f95.png\" style=\"width:416px;max-width:100%\">\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"0be67cbf862d5f1bf722849753a31dccb67825317aabd3127c9c79d4fe0966ff"};</script>
<script>window.HandStudyGuide={"itemId":17695,"sourceHash":"1000907df93b0a255c607a2260d5a6996d37872a27812b9ebba7a19716983c4c","contentHash":"0ec37cf494fc945dd9a9935724daf08def614f0c8606b32c1a30a296a5040890","overview":{"goal":"남은 숫자합이 \\(3\\)의 배수인 경우를 같은 색과 다른 색으로 나누어 조건부확률을 구해요.","firstLook":"처음 숫자합이 \\(9\\)이므로 실제로 주머니에서 빠진 숫자합이 \\(3\\)의 배수인지 보면 돼요.","conditions":[{"label":"같은 색","meaning":"두 공 중 하나를 무작위로 돌려놓아 실제로는 한 공만 빠져요."},{"label":"다른 색","meaning":"두 공이 모두 빠져요."}]},"chapters":[{"id":"c1","label":"조건 사건의 확률을 구해요","stepIds":["s1"],"question":"남은 합이 \\(3\\)의 배수일 확률은 얼마인가요?","hint":"처음 합 \\(9\\)에서 실제로 빠진 수를 생각해요.","explanation":"서로 다른 색을 뽑는 \\(6\\)쌍 중 빠진 합이 \\(3\\)의 배수인 것은 흰 \\(1\\)과 검은 \\(2\\), 흰 \\(2\\)와 검은 \\(1\\)의 두 쌍이에요. 같은 색에서는 실제로 한 공만 빠지므로 검은 \\(3\\)이 빠져야 해요. 검은 \\(3\\)과 다른 검은 공을 뽑는 두 쌍 각각에서 \\(3\\)을 돌려놓지 않을 확률이 \\(1/2\\)이므로 이는 전체에서 \\(1/10\\)이에요. 다른 색 성공 \\(2/10\\)을 더해 조건 사건 확률은 \\(P(A)=3/10\\)이에요.","check":{"prompt":"같은 색에서 흰 공을 뽑은 경우가 성공할 수 있나요?","answer":"실제로 빠지는 수가 \\(1\\) 또는 \\(2\\)라 남은 합이 \\(3\\)의 배수가 아니어서 안 돼요."}},{"id":"c2","label":"다른 색이면서 조건을 만족하는 경우를 세어요","stepIds":["s2"],"question":"교집합 확률은 얼마인가요?","hint":"다른 색이면 두 수의 합이 \\(3\\)의 배수여야 해요.","explanation":"전체 두 공 선택은 \\(\\binom52=10\\)가지이고, 다른 색이면서 빠진 두 수의 합이 \\(3\\)인 쌍은 앞의 두 쌍뿐이에요. 따라서 \\(P(A\\cap B)=2/10\\)이에요.","check":{"prompt":"두 성공쌍은 무엇인가요?","answer":"흰 \\(1\\)·검은 \\(2\\), 흰 \\(2\\)·검은 \\(1\\)이에요."}},{"id":"c3","label":"조건부확률을 계산해요","stepIds":["s3","s4"],"question":"조건 아래 서로 다른 색일 확률은 얼마인가요?","hint":"\\(P(B|A)=P(A\\cap B)/P(A)\\)를 써요.","explanation":"\\(P(B|A)=(2/10)/(3/10)=2/3\\)이에요. 따라서 \\(p=3,q=2\\)이고 \\(p+q=5\\)예요.","check":{"prompt":"기약분수인가요?","answer":"\\(2\\)와 \\(3\\)은 서로소라 기약분수예요."}}],"takeaway":["처음 총합이 조건의 배수이면 빠진 합만 조사해도 돼요.","같은 색에서는 되돌리는 무작위 선택까지 확률에 포함해요.","조건부확률의 분모에는 같은 색 성공 경우도 포함돼요."]};</script>
