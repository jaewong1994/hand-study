<script>window.HandStudyRecord={"itemId":16776,"sourceLabel":"2020 교육청 고3 수리나형 3월 21번","adminYear":2020,"grade":3,"month":3,"number":21,"track":"수리나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"이차함수 $g(x)=x ^{\\,2} -6x+10\\,$에 대하여 삼차함수 $f(x)\\,$가 다음 조건을 만족시킨다.\n(가) 방정식 $f( x ) =0\\,$은 서로 다른 세 실근을 갖는다.(나) 함수 $\\left(\\,g \\circ f \\right)(x)\\,$의 최솟값을 $m\\,$이라 할 때, 방정식 $g(\\,f(x))=m\\,$의 서로 다른 실근의 개수는 $2\\,$이다.(다) 방정식 $g(\\,f(x))=17\\,$은 서로 다른 세 실근을 갖는다.\n함수 $f(x)\\,$의 극댓값과 극솟값의 합은? [4점]\n① $2$ ② $4$ ③ $6$ ④ $8$ ⑤ $10$\n단답형","answer":"①","sourceHash":"4c358765dcb0362a76d40d05f8fb02f8a3ae6887e8a9fb2ad890198307deb374","steps":[{"id":"s1","latex":"g(u)=(u-3)^2+1,\\qquad m=1"},{"id":"s2","latex":"g(f(x))=1\\Longleftrightarrow f(x)=3"},{"id":"s3","latex":"\\#\\{x:f(x)=3\\}=2\\Rightarrow 3\\in\\{M,N\\}"},{"id":"s4","latex":"f(x)=0\\text{이 서로 다른 세 실근}\\Rightarrow N\u003c0\u003cM\\Rightarrow M=3"},{"id":"s5","latex":"g(f(x))=17\\Longleftrightarrow f(x)=7\\text{ 또는 }f(x)=-1"},{"id":"s6","latex":"7>M\\Rightarrow\\#\\{f=7\\}=1"},{"id":"s7","latex":"\\#\\{g(f)=17\\}=3\\Rightarrow\\#\\{f=-1\\}=2\\Rightarrow N=-1"},{"id":"s8","latex":"M+N=3-1=\\boxed{2}"}],"diagram":null,"contentHash":"0b22f615700bddba7ba1b5ee74fac73caaf5d411c16944fe9c663e445cbcedbf","questionHtml":"\u003cp class=\"hp\">이차함수 \u003cspan class=\"heq\">\\(g(x)=x^{\\,2} -6x+10\\,\\)\u003c/span>에 대하여 삼차함수 \u003cspan class=\"heq\">\\(f(x)\\,\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가)방정식 \u003cspan class=\"heq\">\\(f( x ) =0\\,\\)\u003c/span>은 서로 다른 세 실근을 갖는다.\u003c/p>\u003cp class=\"hp\">(나)함수 \u003cspan class=\"heq\">\\(\\left(\\,g \\circ f \\right)(x)\\,\\)\u003c/span>의 최솟값을 \u003cspan class=\"heq\">\\(m\\,\\)\u003c/span>이라 할 때, 방정식 \u003cspan class=\"heq\">\\(g(\\,f(x))=m\\,\\)\u003c/span>의 서로 다른 실근의 개수는 \u003cspan class=\"heq\">\\(2\\,\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp\">(다)방정식 \u003cspan class=\"heq\">\\(g(\\,f(x))=17\\,\\)\u003c/span>은 서로 다른 세 실근을 갖는다.\u003c/p>\u003c/div>\u003cp class=\"hp\">함수 \u003cspan class=\"heq\">\\(f(x)\\,\\)\u003c/span>의 극댓값과 극솟값의 합은? \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">① \u003cspan class=\"heq\">\\(2\\)\u003c/span>&emsp;② \u003cspan class=\"heq\">\\(4\\)\u003c/span>&emsp;③ \u003cspan class=\"heq\">\\(6\\)\u003c/span>&emsp;④ \u003cspan class=\"heq\">\\(8\\)\u003c/span>&emsp;⑤ \u003cspan class=\"heq\">\\(10\\)\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"32f6772b0117af0069a47314d91e5fcad35c4c165b1fe1e544ee67e370098e3c"};</script>
<script>window.HandStudyGuide={"itemId":16776,"sourceHash":"4c358765dcb0362a76d40d05f8fb02f8a3ae6887e8a9fb2ad890198307deb374","contentHash":"0b22f615700bddba7ba1b5ee74fac73caaf5d411c16944fe9c663e445cbcedbf","overview":{"goal":"합성함수 방정식을 \\(f(x)\\)의 높이에 관한 방정식으로 바꾸어 삼차함수의 극댓값과 극솟값을 정해요.","firstLook":"\\(g(u)=(u-3)^2+1\\)로 완전제곱을 만들면 \\(g(f(x))\\)의 가장 작은 값과 그때의 \\(f(x)\\)가 바로 보여요.","conditions":[{"label":"세 영점","meaning":"삼차함수의 극솟값은 0보다 작고 극댓값은 0보다 커야 해요."},{"label":"실근 개수","meaning":"수평선이 삼차함수와 두 점에서 만나면 그 높이는 극값 가운데 하나예요."}]},"chapters":[{"id":"c1","label":"합성함수의 가장 작은 값을 읽어요","stepIds":["s1","s2","s3"],"question":"조건 (나)는 \\(f\\)의 어떤 높이를 알려 줄까요?","hint":"\\(g(u)=(u-3)^2+1\\)로 고쳐 써요.","explanation":"\\(g(u)=(u-3)^2+1\\)이므로 \\(g(f(x))\\ge1\\)이고, \\(f(x)=3\\)일 때 1이 돼요. 삼차함수는 모든 실숫값을 가지므로 실제 최솟값은 \\(m=1\\)이에요. 따라서 \\(g(f(x))=m\\)은 \\(f(x)=3\\)과 같고, 그 서로 다른 실근이 두 개라는 것은 높이 3이 \\(f\\)의 극댓값 또는 극솟값이라는 뜻이에요.","check":{"prompt":"왜 \\(g(f(x))\\)가 실제로 1을 가질까요?","answer":"삼차함수 \\(f\\)의 치역은 모든 실수이므로 \\(f(x)=3\\)인 실수 \\(x\\)가 존재하기 때문이에요."}},{"id":"c2","label":"세 영점으로 극댓값을 정해요","stepIds":["s4"],"question":"높이 3은 왜 극솟값이 아니라 극댓값일까요?","hint":"\\(f(x)=0\\)이 서로 다른 세 근을 가지려면 두 극값이 0의 양쪽에 있어야 해요.","explanation":"극댓값을 \\(M\\), 극솟값을 \\(N\\)이라 하면 수평선 \\(y=0\\)과 세 번 만나므로 \\(N<0<M\\)이에요. 앞에서 3은 두 극값 가운데 하나이고 양수이므로 \\(M=3\\)이에요.","check":{"prompt":"\\(N<0<M\\)에서 등호가 들어갈 수 없는 이유는 무엇인가요?","answer":"극값이 0이면 그 점에서 중근이 생겨 서로 다른 세 실근을 가질 수 없기 때문이에요."}},{"id":"c3","label":"높이 17의 세 근을 나누어 세어요","stepIds":["s5","s6","s7"],"question":"\\(g(f(x))=17\\)은 어떤 두 수평선으로 나뉠까요?","hint":"\\((f(x)-3)^2+1=17\\)을 풀어요.","explanation":"\\((f(x)-3)^2=16\\)이므로 \\(f(x)=7\\) 또는 \\(f(x)=-1\\)이에요. \\(7>M=3\\)이어서 수평선 \\(y=7\\)은 삼차함수와 한 번만 만나요. 전체 실근이 세 개이므로 \\(f(x)=-1\\)은 서로 다른 두 실근을 가져야 해요. 수평선이 두 점에서 만나는 높이는 극값이고, 극댓값은 이미 3이므로 극솟값은 \\(N=-1\\)이에요.","check":{"prompt":"두 방정식의 해가 서로 겹칠 수 있나요?","answer":"한 점에서 \\(f(x)\\)가 동시에 7과 -1일 수 없으므로 두 해집합은 겹치지 않아요."}},{"id":"c4","label":"두 극값을 더해요","stepIds":["s8"],"question":"극댓값과 극솟값의 합은 얼마일까요?","hint":"앞에서 정한 \\(M=3\\), \\(N=-1\\)을 더해요.","explanation":"\\(M+N=3+(-1)=2\\)이므로 정답은 ①이에요.","check":{"prompt":"조건 (가)와 다시 맞춰 보면 어떤가요?","answer":"\\(-1<0<3\\)이므로 높이 0에서 삼차함수와 세 번 만날 수 있는 극값 배치와 맞아요."}}],"takeaway":["합성함수의 이차식을 완전제곱으로 바꾸면 안쪽 함수가 가져야 할 높이를 읽기 쉬워요.","삼차함수와 수평선의 교점이 두 개면 그 높이는 극값이고, 세 개면 두 극값 사이에 있어요."]};</script>
