<script>window.HandStudyRecord={"itemId":18001,"sourceLabel":"2024 교육청 고3 수학확통 5월 30번","adminYear":2024,"grade":3,"month":5,"number":30,"track":"확통","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 원판에 반지름의 길이가 $1$인 원이 그려져 있고, 원의 둘레를 $6$등분하는 $6$개의 점과 원의 중심이 표시되어 있다. 이 $7$개의 점에 $1$부터 $7$까지의 숫자가 하나씩 적힌 깃발 $7$개를 각각 한 개씩 놓으려고 할 때, 다음 조건을 만족시키는 경우의 수를 구하시오. (단, 회전하여 일치하는 것은 같은 것으로 본다.) [4점]\n깃발이 놓여 있는 $7$개의 점 중 $3$개의 점을 꼭짓점으로 하는 삼각형이 한 변의 길이가 $1$인 정삼각형일 때, 세 꼭짓점에 놓여 있는 깃발에 적힌 세 수의 합은 $12$ 이하이다.","answer":"40","sourceHash":"80003349b552cfe04d68a24ad051f3dcf778f5f2f6ec5fcef609444a524b1521","steps":[{"id":"s1","latex":"c=\\text{중심},\\ v_1,\\ldots,v_6=\\text{둘레}:\\quad c+v_i+v_{i+1}\\le12\\quad(v_7=v_1)"},{"id":"s2","latex":"c\\ge4:\\quad\\text{가장 큰 둘레 수의 양옆에 놓을 서로 다른 두 수가 없음}"},{"id":"s3","latex":"c=3:\\quad6,7\\text{의 양옆은 모두 }1,2\\Rightarrow4\\text{개만으로 고리가 닫혀 불가}"},{"id":"s4","latex":"c=1:\\quad\\text{금지 이웃 }(7,5),(7,6)"},{"id":"s5","latex":"N_1=5!-2(2\\cdot4!)+2\\cdot3!=36"},{"id":"s6","latex":"c=2:\\quad7\\text{의 양옆 }1,3\\text{ 고정};\\quad\\text{나머지 경로는 }5,4,6\\text{ 또는 }6,4,5"},{"id":"s7","latex":"N_2=2\\cdot2=4\\Rightarrow N=36+4=40"}],"diagram":null,"contentHash":"8869f8a5a8d97d09ff4eaa4fbbf8de7ed1586bf2b4bdb2b404a27f46cb09b2a4","questionHtml":"\u003cp class=\"hp\">그림과 같이 원판에 반지름의 길이가 \u003cspan class=\"heq\">\\(1\\)\u003c/span>인 원이 그려져 있고, 원의 둘레를 \u003cspan class=\"heq\">\\(6\\)\u003c/span>등분하는 \u003cspan class=\"heq\">\\(6\\)\u003c/span>개의 점과 원의 중심이 표시되어 있다. 이 \u003cspan class=\"heq\">\\(7\\)\u003c/span>개의 점에 \u003cspan class=\"heq\">\\(1\\)\u003c/span>부터 \u003cspan class=\"heq\">\\(7\\)\u003c/span>까지의 숫자가 하나씩 적힌 깃발 \u003cspan class=\"heq\">\\(7\\)\u003c/span>개를 각각 한 개씩 놓으려고 할 때, 다음 조건을 만족시키는 경우의 수를 구하시오. (단, 회전하여 일치하는 것은 같은 것으로 본다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cdiv class=\"hbox\">\u003cp class=\"hp\">깃발이 놓여 있는 \u003cspan class=\"heq\">\\(7\\)\u003c/span>개의 점 중 \u003cspan class=\"heq\">\\(3\\)\u0
