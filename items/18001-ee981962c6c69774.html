<script>window.HandStudyRecord={"itemId":18001,"sourceLabel":"2024 교육청 고3 수학확통 5월 30번","adminYear":2024,"grade":3,"month":5,"number":30,"track":"확통","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 원판에 반지름의 길이가 $1$인 원이 그려져 있고, 원의 둘레를 $6$등분하는 $6$개의 점과 원의 중심이 표시되어 있다. 이 $7$개의 점에 $1$부터 $7$까지의 숫자가 하나씩 적힌 깃발 $7$개를 각각 한 개씩 놓으려고 할 때, 다음 조건을 만족시키는 경우의 수를 구하시오. (단, 회전하여 일치하는 것은 같은 것으로 본다.) [4점]\n깃발이 놓여 있는 $7$개의 점 중 $3$개의 점을 꼭짓점으로 하는 삼각형이 한 변의 길이가 $1$인 정삼각형일 때, 세 꼭짓점에 놓여 있는 깃발에 적힌 세 수의 합은 $12$ 이하이다.","answer":"40","sourceHash":"80003349b552cfe04d68a24ad051f3dcf778f5f2f6ec5fcef609444a524b1521","steps":[{"id":"s1","latex":"c=\\text{중심},\\ v_1,\\ldots,v_6=\\text{둘레}:\\quad c+v_i+v_{i+1}\\le12\\quad(v_7=v_1)"},{"id":"s2","latex":"c\\ge4:\\quad\\text{가장 큰 둘레 수의 양옆에 놓을 서로 다른 두 수가 없음}"},{"id":"s3","latex":"c=3:\\quad6,7\\text{의 양옆은 모두 }1,2\\Rightarrow4\\text{개만으로 고리가 닫혀 불가}"},{"id":"s4","latex":"c=1:\\quad\\text{금지 이웃 }(7,5),(7,6)"},{"id":"s5","latex":"N_1=5!-2(2\\cdot4!)+2\\cdot3!=36"},{"id":"s6","latex":"c=2:\\quad7\\text{의 양옆 }1,3\\text{ 고정};\\quad\\text{나머지 경로는 }5,4,6\\text{ 또는 }6,4,5"},{"id":"s7","latex":"N_2=2\\cdot2=4\\Rightarrow N=36+4=40"}],"diagram":null,"contentHash":"8869f8a5a8d97d09ff4eaa4fbbf8de7ed1586bf2b4bdb2b404a27f46cb09b2a4","questionHtml":"\u003cp class=\"hp\">그림과 같이 원판에 반지름의 길이가 \u003cspan class=\"heq\">\\(1\\)\u003c/span>인 원이 그려져 있고, 원의 둘레를 \u003cspan class=\"heq\">\\(6\\)\u003c/span>등분하는 \u003cspan class=\"heq\">\\(6\\)\u003c/span>개의 점과 원의 중심이 표시되어 있다. 이 \u003cspan class=\"heq\">\\(7\\)\u003c/span>개의 점에 \u003cspan class=\"heq\">\\(1\\)\u003c/span>부터 \u003cspan class=\"heq\">\\(7\\)\u003c/span>까지의 숫자가 하나씩 적힌 깃발 \u003cspan class=\"heq\">\\(7\\)\u003c/span>개를 각각 한 개씩 놓으려고 할 때, 다음 조건을 만족시키는 경우의 수를 구하시오. (단, 회전하여 일치하는 것은 같은 것으로 본다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cdiv class=\"hbox\">\u003cp class=\"hp\">깃발이 놓여 있는 \u003cspan class=\"heq\">\\(7\\)\u003c/span>개의 점 중 \u003cspan class=\"heq\">\\(3\\)\u003c/span>개의 점을 꼭짓점으로 하는 삼각형이 한 변의 길이가 \u003cspan class=\"heq\">\\(1\\)\u003c/span>인 정삼각형일 때, 세 꼭짓점에 놓여 있는 깃발에 적힌 세 수의 합은 \u003cspan class=\"heq\">\\(12\\)\u003c/span> 이하이다.\u003c/p>\u003c/div>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/836ba71bc8165f2a7a1bce02.png\" style=\"width:1114px;max-width:100%\">\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"ee981962c6c69774bc9651f99dba27b51580e83404291b89ffa76a2715fc9ca9"};</script>
<script>window.HandStudyGuide={"itemId":18001,"sourceHash":"80003349b552cfe04d68a24ad051f3dcf778f5f2f6ec5fcef609444a524b1521","contentHash":"8869f8a5a8d97d09ff4eaa4fbbf8de7ed1586bf2b4bdb2b404a27f46cb09b2a4","overview":{"goal":"중심 숫자와 원둘레의 이웃한 두 숫자 합 조건으로 바꾸고, 가능한 중심값별 원순열을 세어요.","firstLook":"반지름과 정육각형의 한 변이 모두 1이므로 한 변이 1인 정삼각형은 중심과 원둘레의 이웃한 두 점으로 만들어져요.","conditions":[{"label":"정삼각형","meaning":"중심과 원둘레의 서로 이웃한 두 점에 놓인 세 숫자의 합이 모두 12 이하여야 해요."},{"label":"서로 다른 숫자","meaning":"\\(1\\)부터 \\(7\\)까지를 한 번씩 사용하므로 원둘레의 이웃도 서로 다른 숫자예요."},{"label":"회전","meaning":"회전해 일치하는 배치는 같으므로 원둘레에서 한 특정 숫자의 위치를 고정해 셀 수 있어요."}]},"chapters":[{"id":"c1","label":"조건을 원둘레의 이웃 부등식으로 바꿔요","stepIds":["s1"],"question":"중심 숫자를 c라 하면 원둘레에서 어떤 조건을 확인하면 될까요?","hint":"정육각형의 각 변과 두 반지름이 정삼각형을 이뤄요.","explanation":"중심의 숫자를 \\(c\\), 원둘레를 차례로 \\(v_1,\\ldots,v_6\\)이라 하고 \\(v_7=v_1\\)로 두어요. 그림에서 한 변의 길이가 \\(1\\)인 정삼각형은 중심과 이웃한 두 둘레점으로 이루어지므로 모든 \\(i\\)에 대해 \\(c+v_i+v_{i+1}\\le12\\)이면 돼요.","check":{"prompt":"서로 마주 보는 둘레점 두 개와 중심은 왜 조사하지 않나요?","answer":"그 두 둘레점 사이 거리가 지름 2라 한 변이 1인 정삼각형이 아니기 때문이에요."}},{"id":"c2","label":"중심이 3 이상인 경우를 제외해요","stepIds":["s2","s3"],"question":"큰 중심 숫자는 왜 조건을 만족시킬 수 없을까요?","hint":"둘레의 가장 큰 숫자 7의 양옆에 올 수 있는 숫자를 봐요.","explanation":"\\(c\\ge4\\)이면 숫자 \\(7\\)의 각 이웃은 \\(12-c-7\\le1\\)이어야 해요. 서로 다른 이웃 두 개가 필요한데 가능한 숫자가 많아야 \\(1\\) 하나뿐이므로 불가능해요.\n\n\\(c=3\\)이면 \\(7\\)의 양옆은 반드시 \\(1,2\\)예요. 숫자 \\(6\\)의 양옆도 \\(3+6+\\text{이웃}\\le12\\)여야 하고 중심의 \\(3\\)은 이미 빠졌으므로 역시 \\(1,2\\)여야 해요. 그러면 원 위에서 \\(1,2,6,7\\) 네 숫자가 하나의 닫힌 고리를 이루어 남은 \\(4,5\\)를 같은 여섯 자리 고리에 넣을 수 없어요. 따라서 가능한 중심은 \\(1,2\\)뿐이에요.","check":{"prompt":"\\(c=4\\)일 때 \\(7\\)의 이웃이 될 수 있는 숫자는 무엇인가요?","answer":"부등식에서 이웃은 \\(1\\) 이하여야 하므로 숫자 \\(1\\)뿐인데, 양옆 두 자리를 채울 수 없어요."}},{"id":"c3","label":"중심이 1인 원순열을 포함배제로 세어요","stepIds":["s4","s5"],"question":"\\(c=1\\)일 때 금지되는 이웃쌍과 허용 배치 수는 무엇인가요?","hint":"둘레 숫자 2부터 7 중 합이 11을 넘는 쌍만 찾아요.","explanation":"\\(c=1\\)이면 이웃한 두 둘레 숫자의 합이 \\(11\\) 이하여야 해요. 금지쌍은 \\((7,5)\\), \\((7,6)\\)뿐이에요. 회전을 없애려고 \\(7\\)의 위치를 고정하면 나머지 다섯 숫자의 배열은 \\(5!=120\\)개예요.\n\n\\(5\\)가 \\(7\\) 옆인 배열은 양옆 선택 \\(2\\)가지와 나머지 배열 \\(4!\\)을 곱한 \\(48\\)개이고 \\(6\\)도 같아요. \\(5,6\\)이 모두 \\(7\\) 양옆인 배열은 좌우 순서 \\(2\\)가지와 나머지 \\(3!\\)을 곱한 \\(12\\)개예요. 포함배제로 \\(120-48-48+12=36\\)가지예요.","check":{"prompt":"두 금지 사건의 교집합을 다시 더하는 이유는 무엇인가요?","answer":"두 사건을 뺄 때 5와 6이 모두 7 옆인 배열을 두 번 뺐으므로 한 번 되돌려야 해요."}},{"id":"c4","label":"중심이 2인 배치를 직접 정해 더해요","stepIds":["s6","s7"],"question":"\\(c=2\\)일 때 숫자 \\(7\\)의 양옆과 남은 세 숫자의 순서는 어떻게 정해지나요?","hint":"\\(7\\)의 이웃은 합 조건 때문에 \\(1,3\\)이고, \\(4,5,6\\) 중 \\(5,6\\)은 이웃하면 안 돼요.","explanation":"\\(c=2\\)이면 \\(7\\)의 이웃은 \\(3\\) 이하인 남은 숫자 \\(1,3\\)으로 고정되고 좌우 순서는 \\(2\\)가지예요. 둘 사이의 나머지 세 자리에 \\(4,5,6\\)을 놓을 때 \\(5\\)와 \\(6\\)이 붙으면 \\(2+5+6>12\\)라 안 돼요. 따라서 \\(4\\)가 둘 사이에 놓이는 \\(5,4,6\\) 또는 \\(6,4,5\\)의 \\(2\\)가지뿐이에요.\n\n그러므로 중심이 \\(2\\)인 경우는 \\(2\\cdot2=4\\)가지이고, 전체는 \\(36+4=40\\)가지예요.","check":{"prompt":"중심이 1인 경우와 2인 경우를 더할 수 있는 이유는 무엇인가요?","answer":"중심에 놓인 숫자가 달라 같은 배치가 두 경우에 동시에 속하지 않기 때문이에요."}}],"takeaway":["도형 조건은 실제로 해당하는 작은 도형의 종류를 먼저 찾아 이웃 조건으로 바꿔요.","원순열은 특정 숫자의 위치를 고정하면 회전에 의한 중복을 없앨 수 있어요.","금지 이웃쌍이 적으면 포함배제나 큰 숫자의 양옆을 고정하는 방법이 효과적이에요."]};</script>
