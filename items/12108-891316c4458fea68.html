  <script>window.HandStudyRecord={"itemId":12108,"sourceLabel":"2025 교육청 고1 수학 10월 29번","adminYear":2025,"grade":1,"month":10,"number":29,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 정사각형 ${{ABCD}}\\,$를 밑면으로 하는 직육면체 ${{ABCD}}-{{EFGH}}\\,$가 있다. 선분 ${{AD}}$ 위의 점 ${{P}}\\,$와 선분 ${{BC}}$ 위의 점 ${{Q}}\\,$를 ${ \\overline{{AP}}}={ \\overline{{BQ}}}={ \\overline{{BF}}}\\,$가 되도록 잡고, 점 ${{P}}\\,$에서 선분 ${{EH}}\\,$에 내린 수선의 발을 ${{R}}\\,$, 점 ${{Q}}\\,$에서 선분 ${{FG}}\\,$에 내린 수선의 발을 ${{S}}\\,$라 하자. 직육면체 ${{ABCD}}-{{EFGH}}\\,$의 부피를 $V_{1}\\,$, 직육면체 ${{ABQP}}-{{EFSR}}\\,$의 부피를 $V_{2}\\,$라 하자.\n $\\left({ \\overline{{AB}}}+{ \\overline{{BF}}} \\right) \\times { \\overline{{SD}}}^{2}=\\frac{35}{4}\\,$, $V_{1}+V_{2}=\\frac{15}{4}\\,$\n일 때, $\\left({ \\overline{{AB}}}+{ \\overline{{BF}}} \\right)^{3}=\\frac{q}{p}\\,$이다. $p+q\\,$의 값을 구하시오. (단, ${ \\overline{{AB}}} >{ \\overline{{BF}}}\\,$이고, $p\\,$와 $q\\,$는 서로소인 자연수이다.) [4점]","answer":"133","sourceHash":"93e8df73a1c6557b3cd071a92c4358483bed791963e40a86113ac6892764100f","steps":[{"id":"s1","latex":"a=\\overline{AB},\\quad h=\\overline{BF},\\quad a>h>0"},{"id":"s2","latex":"\\overline{SG}=a-h,\\quad\\overline{GH}=a,\\quad\\overline{DH}=h"},{"id":"s3","latex":"\\overline{SD}^2=(a-h)^2+a^2+h^2=2(a^2-ah+h^2)"},{"id":"s4","latex":"(a+h)\\overline{SD}^2=2(a+h)(a^2-ah+h^2)=2(a^3+h^3)=\\frac{35}{4}"},{"id":"s5","latex":"a^3+h^3=\\frac{35}{8}"},{"id":"s6","latex":"V_1+V_2=a^2h+ah^2=ah(a+h)=\\frac{15}{4}"},{"id":"s7","latex":"(a+h)^3=a^3+h^3+3ah(a+h)=\\frac{35}{8}+\\frac{45}{4}=\\frac{125}{8}"},{"id":"s8","latex":"(p,q)=(8,125)\\Rightarrow p+q=133"}],"diagram":null,"contentHash":"c070b6a4d26a07098e9690f7e709a9c2953cabf45b3e12adb1f1d5b3f3268948","questionHtml":"\u003cp class=\"hp htall\">그림과 같이 정사각형 \u003cspan class=\"heq\">\\({{ABCD}}\\,\\)\u003c/span>를 밑면으로 하는 직육면체 \u003cspan class=\"heq\">\\({{ABCD}}-{{EFGH}}\\,\\)\u003c/span>가 있다. 선분 \u003cspan class=\"heq\">\\({{AD}}\\)\u003c/span> 위의 점 \u003cspan class=\"heq\">\\({{P}}\\,\\)\u003c/span>와 선분 \u003cspan class=\"heq\">\\({{BC}}\\)\u003c/span> 위의 점 \u003cspan class=\"heq\">\\({{Q}}\\,\\)\u003c/span>를 \u003cspan class=\"heq\">\\({ \\overline{{AP}}}={ \\overline{{BQ}}}={ \\overline{{BF}}}\\,\\)\u003c/span>가 되도록 잡고, 점 \u003cspan class=\"heq\">\\({{P}}\\,\\)\u003c/span>에서 선분 \u003cspan class=\"heq\">\\({{EH}}\\,\\)\u003c/span>에 내린 수선의 발을 \u003cspan class=\"heq\">\\({{R}}\\,\\)\u003c/span>, 점 \u003cspan class=\"heq\">\\({{Q}}\\,\\)\u003c/span>에서 선분 \u003cspan class=\"heq\">\\({{FG}}\\,\\)\u003c/span>에 내린 수선의 발을 \u003cspan class=\"heq\">\\({{S}}\\,\\)\u003c/span>라 하자. 직육면체 \u003cspan class=\"heq\">\\({{ABCD}}-{{EFGH}}\\,\\)\u003c/span>의 부피를 \u003cspan class=\"heq\">\\(V_{1}\\,\\)\u003c/span>, \u003cbr>직육면체 \u003cspan class=\"heq\">\\({{ABQP}}-{{EFSR}}\\,\\)\u003c/span>의 부피를 \u003cspan class=\"heq\">\\(V_{2}\\,\\)\u003c/span>라 하자.\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\(\\left({ \\overline{{AB}}}+{ \\overline{{BF}}} \\right) \\times { \\overline{{SD}}}^{2}=\\dfrac{35}{4}\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(V_{1}+V_{2}=\\dfrac{15}{4}\\,\\)\u003c/span>\u003c/p>\u003cp class=\"hp htall\">일 때, \u003cspan class=\"heq\">\\(\\left({ \\overline{{AB}}}+{ \\overline{{BF}}} \\right)^{3}=\\dfrac{q}{p}\\,\\)\u003c/span>이다. \u003cspan class=\"heq\">\\(p+q\\,\\)\u003c/span>의 값을 구하시오.\u003cbr>(단, \u003cspan class=\"heq\">\\({ \\overline{{AB}}} \\gt { \\overline{{BF}}}\\,\\)\u003c/span>이고, \u003cspan class=\"heq\">\\(p\\,\\)\u003c/span>와 \u003cspan class=\"heq\">\\(q\\,\\)\u003c/span>는 서로소인 자연수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/cc8c3806d86b18d850dad979.png\" style=\"width:521px;max-width:100%\">\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"891316c4458fea687191054aa2e747590a4ea9506ce740b29b96c1ad59533882"};</script>
