  <script>window.HandStudyRecord={"itemId":17344,"sourceLabel":"2022 교육청 고3 수학기하 7월 12번","adminYear":2022,"grade":3,"month":7,"number":12,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"첫째항이 $2\\,$인 수열 $\\left\\{a_{n} \\right\\}\\,$의 첫째항부터 제$n$항까지의 합을 $S_{n} \\,$이라 하자. 다음은 모든 자연수 $n\\,$에 대하여\n  $\\sum\\limits_{k=1}^{n} \\dfrac{3S_{k}}{k+2} =S_{n} \\,$\n이 성립할 때, $a_{10} \\,$의 값을 구하는 과정이다.\n$n \\geq 2\\,$인 모든 자연수 $n\\,$에 대하여\n$a_{n}$$=S_{n} -S_{n-1} \\,$\n$= \\sum\\limits_{k=1}^{n} \\dfrac{3S_{k}}{k+2} - \\sum\\limits_{k=1}^{n-1} \\dfrac{3S_{k}}{k+2} \\,$$= \\dfrac{3S_{n}}{n+2} \\,$\n이므로 $3S_{n} =\\left(n+2\\right)\\times a_{n}\\,$ $\\left( n \\geq 2 \\right) \\,$\n이다.\n$S_{1} =a_{1} \\,$에서 $3S_{1} =3a_{1} \\,$이므로\n$3S_{n} \\,$$= \\left( n+2 \\right) \\times a_{n} \\,$ $\\left( n \\geq 1 \\right) \\,$\n이다.\n$3a_{n}$$=3 \\left( S_{n} -S_{n-1} \\right) \\,$ \n$= \\left( n+2 \\right) \\times a_{n} - \\left( \\, {\\boxed{\\vphantom{(}\\,(\\text{가})\\,}} \\,\\right) \\times a_{n-1} \\,$ $\\left( n \\geq 2 \\right) \\,$\n$\\dfrac{a_{n}}{a_{n-1}} = {\\boxed{\\vphantom{(}\\,(\\text{나})\\,}} \\,$ $\\left( n \\geq 2 \\right) \\,$\n따라서\n$a_{10} \\,$$=a_{1} \\times \\dfrac{a_{2}}{a_{1}} \\times \\dfrac{a_{3}}{a_{2}} \\times \\dfrac{a_{4}}{a_{3}} \\times \\, \\cdots \\, \\times \\dfrac{a_{9}}{a_{8}} \\times \\dfrac{a_{10}}{a_{9}} \\,$\n$= {\\boxed{\\vphantom{(}\\,(\\text{다})\\,}}\\,$\n위의 (가), (나)에 알맞은 식을 각각 $f \\left( n \\right) \\,$, $g \\left( n \\right) \\,$이라 하고, (다)에 알맞은 수를 $p\\,$라 할 때, $\\dfrac{f \\left( p \\right)}{g \\left( p \\right)} \\,$의 값은? [4점]\n① $\\,109$ ② $112\\,$ ③ $115\\,$ ④ $118\\,$ ⑤ $121\\,$","answer":"①","sourceHash":"c81f1f9d570228c040c1469f00ee792aaa4a7bf26b127ef33243678a9dba4875","steps":[{"id":"s1","latex":"3S_n=(n+2)a_n\\quad(n\\ge1)"},{"id":"s2","latex":"3S_{n-1}=(n+1)a_{n-1}"},{"id":"s3","latex":"3a_n=(n+2)a_n-(n+1)a_{n-1}"},{"id":"s4","latex":"(n-1)a_n=(n+1)a_{n-1}"},{"id":"s5","latex":"f(n)=n+1,\\quad g(n)=\\frac{n+1}{n-1}
