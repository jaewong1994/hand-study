<script>window.HandStudyRecord={"itemId":17407,"sourceLabel":"2022 교육청 고3 수학확통 10월 30번","adminYear":2022,"grade":3,"month":10,"number":30,"track":"확통","points":4,"scoreStatus":"confirmed_4_direct","questionText":"주머니 ${A}$에 흰 공 $3$개, 검은 공 $1$개가 들어 있고, 주머니 $B$에도 흰 공 $3$개, 검은 공 $1$개가 들어 있다. 한 개의 동전을 사용하여 [실행 $1$]과 [실행 $2$]를 순서대로 하려고 한다.\n[실행 $1$] 한 개의 동전을 던져 앞면이 나오면 주머니 $A$에서 임의로 $2$개의 공을 꺼내어 주머니 $B$에 넣고, 뒷면이 나오면 주머니 $A$에서 임의로 $3$개의 공을 꺼내어 주머니 $B$에 넣는다.[실행 $2$] 주머니 $B$에서 임의로 $5$개의 공을 꺼내어 주머니 $A$에 넣는다.\n[실행 $2$]가 끝난 후 주머니 $B$에 흰 공이 남아 있지 않을 때, [실행 $1$]에서 주머니 $B$에 넣는 공 중 흰 공이 $2$개이었을 확률은 $\\frac{q}{p}$이다. $p+q$의 값을 구하시오. (단, $p$와 $q$는 서로소인 자연수이다.) [4점]","answer":"17","sourceHash":"3834683b38f59e367dce790fef125adde11741b7275c66e68469e4a42aafc876","steps":[{"id":"s1","latex":"E=\\{\\text{실행 2 뒤 }B\\text{에 흰 공이 없음}\\}"},{"id":"s2","latex":"P(H,W_2)=\\frac14,\\quad P(E\\mid H,W_2)=\\frac16"},{"id":"s3","latex":"P(H,W_1)=\\frac14,\\quad P(E\\mid H,W_1)=\\frac26"},{"id":"s4","latex":"P(T,W_3)=\\frac18,\\quad P(E\\mid T,W_3)=0"},{"id":"s5","latex":"P(T,W_2)=\\frac38,\\quad P(E\\mid T,W_2)=\\frac{{}_2C_2}{{}_7C_2}=\\frac1{21}"},{"id":"s6","latex":"P(E)=\\frac1{24}+\\frac1{12}+0+\\frac1{56}=\\frac17"},{"id":"s7","latex":"P(W_2\\cap E)=\\frac1{24}+\\frac1{56}=\\frac5{84}"},{"id":"s8","latex":"P(W_2\\mid E)=\\frac{5/84}{1/7}=\\frac5{12}"},{"id":"s9","latex":"p+q=12+5=\\boxed{17}"}],"diagram":null,"contentHash":"56e40c07a2ba946a32bd3bd4d2b11ab40b1732f22b2a3b24f7769eb0419bbf9a","questionHtml":"\u003cp class=\"hp\">주머니 \u003cspan class=\"heq\">\\({A}\\)\u003c/span>에 흰 공 \u003cspan class=\"heq\">\\(3\\)\u003c/span>개, 검은 공 \u003cspan class=\"heq\">\\(1\\)\u003c/span>개가 들어 있고, 주머니 \u003cspan class=\"heq\">\\(B\\)\u003c/span>에도 흰 공 \u003cspan class=\"heq\">\\(3\\)\u003c/span>개, 검은 공 \u003cspan class=\"heq\">\\(1\\)\u003c/span>개가 들어 있다. 한 개의 동전을 사용하여 [실행 \u003cspan class=\"heq\">\\(1\\)\u003c/span>]과 [실행 \u003cspan class=\"heq\">\\(2\\)\u003c/span>]를 순서대로 하려고 한다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">[실행 \u003cspan class=\"heq\">\\(1\\)\u003c/span>] 한 개의 동전을 던져 앞면이 나오면 주머니 \u003cspan class=\"heq\">\\(A\\)\u003c/span>에서 임의로 \u003cspan class=\"heq\">\\(2\\)\u003c/span>개의 공을 꺼내어 주머니 \u003cspan class=\"heq\">\\(B\\)\u003c/span>에 넣고,\u003cbr>뒷면이 나오면 주머니 \u003cspan class=\"heq\">\\(A\\)\u003c/span>에서 임의로 \u003cspan class=\"heq\">\\(3\\)\u003c/span>개의 공을 꺼내어 주머니 \u003cspan class=\"heq\">\\(B\\)\u003c/span>에 넣는다.\u003c/p>\u003cp class=\"hp\">[실행 \u003cspan class=\"heq\">\\(2\\)\u003c/span>] 주머니 \u003cspan class=\"heq\">\\(B\\)\u003c/span>에서 임의로 \u003cspan class=\"heq\">\\(5\\)\u003c/span>개의 공을 꺼내어 주머니 \u003cspan class=\"heq\">\\(A\\)\u003c/span>에 넣는다.\u003c/p>\u003c/div>\u003cp class=\"hp htall\">[실행 \u003cspan class=\"heq\">\\(2\\)\u003c/span>]가 끝난 후 주머니 \u003cspan class=\"heq\">\\(B\\)\u003c/span>에 흰 공이 남아 있지 않을 때, \u003cbr>[실행 \u003cspan class=\"heq\">\\(1\\)\u003c/span>]에서 주머니 \u003cspan class=\"heq\">\\(B\\)\u003c/span>에 넣는 공 중 흰 공이 \u003cspan class=\"heq\">\\(2\\)\u003c/span>개이었을 확률은 \u003cspan class=\"heq\">\\(\\dfrac{q}{p}\\)\u003c/span>이다. \u003cspan class=\"heq\">\\(p+q\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(p\\)\u003c/span>와 \u003cspan class=\"heq\">\\(q\\)\u003c/span>는 서로소인 자연수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"ed6b7e00851f27fd164b6778fbb0fabd942a17552c412df3ce6b61f5a98756b8"};</script>
<script>window.HandStudyGuide={"itemId":17407,"sourceHash":"3834683b38f59e367dce790fef125adde11741b7275c66e68469e4a42aafc876","contentHash":"56e40c07a2ba946a32bd3bd4d2b11ab40b1732f22b2a3b24f7769eb0419bbf9a","overview":{"goal":"첫 실행에서 옮긴 공의 수와 색을 나누어, 마지막에 B주머니에 흰 공이 없는 조건 아래에서 흰 공 두 개를 옮겼을 조건부확률을 구해요.","firstLook":"마지막에 B에 남는 공의 수는 동전 앞뒤에 따라 달라요. 꺼낸 다섯 공을 직접 세기보다 B에 남는 한두 공이 모두 검은 공일 확률을 세면 간단해요.","conditions":[{"label":"앞면","meaning":"A에서 공 2개를 B로 옮기므로 실행 2 직전 B에는 공 6개가 있어요."},{"label":"뒷면","meaning":"A에서 공 3개를 B로 옮기므로 실행 2 직전 B에는 공 7개가 있어요."},{"label":"조건 사건","meaning":"실행 2 뒤 B에 남은 공이 모두 검은 공이어야 해요."}]},"chapters":[{"id":"c1","label":"사건과 앞면의 두 경우를 정리해요","stepIds":["s1","s2","s3"],"question":"앞면이 나온 뒤 흰 공을 두 개 또는 한 개 옮긴 각 경우가 조건 사건에 기여할 확률은 얼마일까요?","hint":"실행 2에서 5개를 꺼내면 B에 공 하나만 남아요.","explanation":"실행 2 뒤 \\(B\\)에 흰 공이 없는 사건을 \\(E\\), 실행 1에서 흰 공을 \\(r\\)개 옮긴 사건을 \\(W_r\\)라 할게요. 앞면을 \\(H\\)라 하면 두 공을 옮겨요.\n\n흰 공 두 개를 고를 확률은 \\({}_3\\mathrm C_2/{}_4\\mathrm C_2=1/2\\)이므로 \\(P(H\\cap W_2)=\\frac12\\cdot\\frac12=\\frac14\\)예요. 이때 B에는 흰 공 5개, 검은 공 1개가 있고 마지막에 한 공이 남아요. 그 공이 검은 공일 확률은 \\(1/6\\)이에요.\n\n흰 공 하나와 검은 공 하나를 옮길 확률도 \\(3/6=1/2\\)라 \\(P(H\\cap W_1)=1/4\\)예요. 이때 B에는 흰 공 4개, 검은 공 2개가 있으므로 남은 한 공이 검은 공일 확률은 \\(2/6\\)이에요.","check":{"prompt":"앞면이며 흰 공 두 개를 옮기고 \\(E\\)가 일어날 확률은 얼마인가요?","answer":"\\(\\frac14\\cdot\\frac16=\\frac1{24}\\)예요."}},{"id":"c2","label":"뒷면의 두 경우를 정리해요","stepIds":["s4","s5"],"question":"공 세 개를 옮길 때 흰 공 수에 따른 두 경우는 조건 사건에 어떻게 기여할까요?","hint":"A에는 흰 공 3개와 검은 공 1개뿐이므로 세 공의 색 구성은 두 가지예요.","explanation":"뒷면을 \\(T\\)라 할게요. 흰 공 세 개를 모두 옮길 확률은 \\(P(T\\cap W_3)=\\frac12\\cdot\\frac14=\\frac18\\)이에요. 그러면 B에는 흰 공 6개, 검은 공 1개가 있고 실행 2 뒤 두 공이 남아요. 검은 공이 하나뿐이라 두 공 모두 검을 수 없으므로 \\(P(E\\mid T\\cap W_3)=0\\)이에요.\n\n흰 공 두 개와 검은 공 하나를 옮길 확률은 \\(P(T\\cap W_2)=\\frac12\\cdot\\frac34=\\frac38\\)이에요. 이때 B에는 흰 공 5개, 검은 공 2개가 있고 두 공이 남아요. 남은 두 공이 검은 공 두 개일 확률은 \\({}_2\\mathrm C_2/{}_7\\mathrm C_2=1/21\\)이에요.","check":{"prompt":"뒷면이며 흰 공 두 개를 옮기고 \\(E\\)가 일어날 확률은 얼마인가요?","answer":"\\(\\frac38\\cdot\\frac1{21}=\\frac1{56}\\)이에요."}},{"id":"c3","label":"조건 사건의 전체 확률을 더해요","stepIds":["s6"],"question":"사건 \\(E\\)의 확률은 네 갈래에서 얼마가 될까요?","hint":"각 갈래의 첫 실행 확률과 그 뒤 조건부확률을 곱한 뒤 더해요.","explanation":"앞면의 두 갈래와 뒷면의 두 갈래는 서로 겹치지 않고 모든 가능성을 포함해요. 따라서\n\\[\nP(E)=\\frac14\\cdot\\frac16+\\frac14\\cdot\\frac26+\\frac18\\cdot0+\\frac38\\cdot\\frac1{21}\n=\\frac1{24}+\\frac1{12}+\\frac1{56}\n=\\frac17.\n\\]","check":{"prompt":"\\(\\frac1{24}+\\frac1{12}\\)은 얼마인가요?","answer":"\\(\\frac3{24}=\\frac18\\)이고 여기에 \\(\\frac1{56}\\)을 더하면 \\(\\frac17\\)이에요."}},{"id":"c4","label":"흰 공 두 개를 옮긴 갈래만 골라 나눠요","stepIds":["s7","s8","s9"],"question":"조건 \\(E\\) 아래에서 \\(W_2\\)일 확률은 어떻게 구할까요?","hint":"앞면과 뒷면에서 흰 공 두 개를 옮긴 기여를 분자에 더해요.","explanation":"\\(W_2\\cap E\\)는 앞면 갈래의 \\(1/24\\)와 뒷면 갈래의 \\(1/56\\)을 더한 사건이에요. 따라서 \\(P(W_2\\cap E)=1/24+1/56=5/84\\)예요.\n\n조건부확률은 \\(P(W_2\\mid E)=P(W_2\\cap E)/P(E)=(5/84)/(1/7)=5/12\\)예요. \\(p=12,q=5\\)는 서로소이므로 \\(p+q=17\\)이에요.","check":{"prompt":"분자에 흰 공 세 개를 옮긴 경우를 넣지 않는 이유는 무엇인가요?","answer":"구하려는 사건은 실행 1에서 흰 공이 정확히 두 개였던 경우이기 때문이에요."}}],"takeaway":["조건부확률은 조건 사건이 일어나는 모든 갈래를 분모에, 목표와 조건이 함께 일어나는 갈래만 분자에 모아요.","많은 공을 꺼내는 문제는 남는 공의 색을 세는 편이 더 간단할 수 있어요.","나무처럼 나눈 각 갈래에서는 앞단계 확률과 뒷단계 조건부확률을 곱해요."]};</script>
