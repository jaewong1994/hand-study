<script>window.HandStudyRecord={"itemId":17099,"sourceLabel":"2021 교육청 고3 수학미적분 4월 28번","adminYear":2021,"grade":3,"month":4,"number":28,"track":"미적분","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 길이가 $4$인 선분 $A _{1} B _{1}$을 지름으로 하는 원 $O _{1}$이 있다. 원 $O _{1}$의 외부에 $\\angle B _{1} A _{1} C _{1}$$= \\frac{\\pi}{2}$, ${\\overline{ A _{1} B _{1}}} \\,:\\, {\\overline{ A _{1} C _{1}}}$$=4\\,:\\,3$이 되도록 점 $C _{1}$을 잡고 두 선분 $A _{1} C _{1} ,\\,B _{1} C _{1}$을 그린다. 원 $O _{1}$과 선분 $B _{1} C _{1}$의 교점 중 $B _{1}$이 아닌 점을 $D _{1}$이라 하고, 점 $D _{1}$을 포함하지 않는 호 $A _{1} B _{1}$과 두 선분 $A _{1} D _{1} ,\\,B _{1} D _{1}$로 둘러싸인 부분에 색칠하여 얻은 그림을 $R _{1}$이라 하자. 그림 $R _{1}$에서 호 $A _{1} D _{1}$과 두 선분 $A _{1} C _{1} ,\\,C _{1} D _{1}$에 동시에 접하는 원 $O _{2}$를 그리고 선분 $A _{1} C _{1}$과 원 $O _{2}$의 교점을 $A _{2}$, 점 $A _{2}$를 지나고 직선 $A _{1} B _{1}$과 평행한 직선이 원 $O _{2}$와 만나는 점 중 $A _{2}$가 아닌 점을 $B _{2}$라 하자. 그림 $R _{1}$에서 얻은 것과 같은 방법으로 두 점 $C _{2} ,\\,D _{2}$를 잡고, 점 $D _{2}$를 포함하지 않는 호 $A _{2} B _{2}$와 두 선분 $A _{2} D _{2} ,\\,B _{2} D _{2}$로 둘러싸인 부분에 색칠하여 얻은 그림을 $R _{2}$라 하자. 이와 같은 과정을 계속하여 $n$번째 얻은 그림 $R _{n}$에 색칠되어 있는 부분의 넓이를 $S _{n}$이라 할 때, $\\lim _{n -> \\infty } {} S _{n}$의 값은? [4점]\n① $\\frac{32}{15} \\pi+ \\frac{256}{125}$ ② $\\frac{9}{4} \\pi+ \\frac{54}{25}$ ③ $\\frac{32}{15} \\pi+ \\frac{512}{125}$\n④ $\\frac{9}{4} \\pi+ \\frac{108}{25}$ ⑤ $\\frac{8}{3} \\pi+ \\frac{128}{25}$\n단답형","answer":"③","sourceHash":"1bae08aadaed3c617414be14b4fab59ac41c800843704c6e502eb3d3382326cf","steps":[{"id":"s1","latex":"A_1B_1=4,\\ A_1C_1=3,\\ B_1C_1=5"},{"id":"s2","latex":"A_1D_1=\\frac{12}5,\\ B_1D_1=\\frac{16}5"},{"id":"s3","latex":"S_1=\\frac12\\pi\\cdot2^2+\\frac12\\cdot\\frac{12}5\\cdot\\frac{16}5=2\\pi+\\frac{96}{25}"},{"id":"s4","latex":"O_2=(\\frac12,2),\\ r_2=\\frac12\\Rightarrow A_2B_2=1"},{"id":"s5","latex":"\\frac{A_2B_2}{A_1B_1}=\\frac14\\Rightarrow\\frac{S_{n+1}}{S_n}=\\frac1{16}"},{"id":"s6","latex":"\\lim S_n=\\frac{S_1}{1-1/16}=\\frac{32}{15}\\pi+\\frac{512}{125}"}],"diagra <script>window.HandStudyGuide={"itemId":17099,"sourceHash":"1bae08aadaed3c617414be14b4fab59ac41c800843704c6e502eb3d3382326cf","contentHash":"2c88dd6c1afcfedcba7a322acd5c7f2af61927923b77098056deea4ef18cadf2","overview":{"goal":"첫 색칠 넓이와 다음 도형의 길이비를 구해 모든 색칠 넓이의 합을 계산해요.","firstLook":"매 단계 같은 모양이 반복되므로 첫 넓이와 지름의 비만 알면 넓이들이 등비수열이 돼요.","conditions":[{"label":"첫 도형","meaning":"\\(A_{1}B_{1}=4,A_{1}C_{1}=3\\)인 직각삼각형이므로 \\(B_{1}C_{1}=5\\)예요."}]},"chapters":[{"id":"c1","label":"첫 번째 색칠 넓이 구하기","stepIds":["s1","s2","s3"],"question":"\\(A_{1}D_{1}\\)과 \\(B_{1}D_{1}\\)은 어떻게 구하나요?","hint":"직각삼각형에서 빗변에 내린 높이의 발 \\(D_{1}\\)에 대한 닮음 관계를 쓰세요.","explanation":"\\(A_1B_1=4,A_1C_1=3\\)이고 \\(A_{1}\\)에서 직각이므로 \\(B_1C_1=5\\)예요. \\(A_1B_1\\)가 원의 지름이어서 \\(\\angle A_1D_1B_1=\\pi/2\\), 따라서 \\(D_{1}\\)은 \\(A_{1}\\)에서 빗변 \\(B_{1}C_{1}\\)에 내린 수선의 발이에요. 직각삼각형의 닮음에서 \\(A_1D_1=A_1B_1\\cdot A_1C_1/B_1C_1=12/5\\), \\(B_1D_1=A_1B_1^2/B_1C_1=16/5\\). 색칠 부분은 반지름 2인 반원과 삼각형 \\(A_{1}D_{1}B_{1}\\)의 합이므로 \\(S_1=\\frac12\\pi\\cdot 2^2+\\frac12(12/5)(16/5)=2\\pi+96/25\\)예요.","check":{"prompt":"삼각형 \\(A_{1}D_{1}B_{1}\\)의 두 직각변은 무엇인가요?","answer":"\\(D_{1}\\)에서 직각이므로 \\(A_{1}D_{1}=12/5\\)와 \\(B_{1}D_{1}=16/5\\)예요."}},{"id":"c2","label":"두 번째 원의 반지름 구하기","stepIds":["s4"],"question":"세 접촉 조건에서 \\(r_{2}=1/2\\)를 어떻게 얻나요?","hint":"\\(A_{1}=(0,0),B_{1}=(4,0),C_{1}=(0,3)\\)로 놓고 중심을 \\((r,3-2r)\\)로 나타내세요.","explanation":"좌표를 \\(A_1=(0,0),B_1=(4,0),C_1=(0,3)\\)로 두면 원 \\(O_{1}\\)의 중심은 \\((2,0)\\), 반지름은 2이고 직선 \\(C_{1}D_{1}\\)은 \\(3x+4y=12\\)예요. \\(O_2\\)의 반지름을 \\(r\\)라 하면 \\(A_{1}C_{1}\\)에 접하므로 중심의 \\(x\\)좌표는 \\(r\\)이고, 직선 \\(C_1D_1\\)까지의 거리도 \\(r\\)이어서 중심은 \\((r,3-2r)\\)예요. \\(O_1\\)과 바깥쪽에서 접하므로 \\((r-2)^2+(3-2r)^2=(2+r)^2\\). 해 \\(r=1/2,9/2\\) 중 접점이 두 선분 사이에 놓이는 작은 원은 \\(r=1/2\\)이고 중심은 \\((1/2,2)\\)예요. 따라서 \\(A_2B_2=2r=1\\)예요.","check":{"prompt":"\\(r=9/2\\)를 버리는 이유는 무엇인가요?","answer":"중심의 \\(y\\)좌표가 \\(3-2r=-6\\)이 되어 주어진 두 선분과 호 사이의 원이 아니기 때문이에요."}},{"id":"c3","label":"닮음비로 무한합 계산하기","stepIds":["s5","s6"],"question":"길이비 1/4가 넓이비 1/16이 되는 이유는 무엇인가요?","hint":"두 직선 사이의 각과 접촉 조건이 매 단계 같으므로 다음 도형도 같은 모양으로 닮아요.","explanation":"두 번째 지름과 첫 지름의 비는 \\(1/4\\)예요. 이후에도 같은 각과 접촉 조건으로 같은 모양이 반복되므로 \\(S_{n+1}/S_n=(1/4)^2=1/16\\). 따라서 모든 색칠 넓이의 합은 \\(S_1/(1-1/16)=\\frac{16}{15}(2\\pi+96/25)=32\\pi/15+512/125\\), 정답은 ③예요.","check":{"prompt":"공비가 1보다 작다는 확인이 왜 필요한가요?","answer":"무한등비급수의 합 공식을 쓰려면 넓이 공비의 절댓값이 1보다 작아야 해요."}}],"takeaway":["접하는 원의 반지름은 두 직선까지의 거리와 두 원의 중심 사이 거리로 구할 수 있어요.","반복 도형은 길이비를 구한 뒤 제곱하여 넓이의 공비를 만들어요."]};</script>
