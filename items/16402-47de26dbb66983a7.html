<script>window.HandStudyRecord={"itemId":16402,"sourceLabel":"2019 교육청 고3 수리나형 3월 30번","adminYear":2019,"grade":3,"month":3,"number":30,"track":"수리나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"자연수 $n\\,$에 대하여 다음 조건을 만족시키는 정사각형의 개수를 $S _{n}$이라 하자.\n(가) 정사각형은 한 변의 길이가 $1\\,$이고 꼭짓점의 $x\\,$좌표와 $y\\,$좌표가 모두 정수이다.(나) 연립부등식 $\\frac{1}{2} x ^{\\,2} \u003cy\u003cx ^{\\,2}$, $0\u003cx\u003c2n-1 \\,$을 만족시키는 점 $(x,\\,y)\\,$ 중에는 정사각형의 내부에 있는 점이 있다.\n$\\lim _{n \\,-> \\, \\infty } {\\frac{S _{n+1}- S_{n}}{n ^{\\,2}}} \\,$의 값을 구하시오. [4점]","answer":"4","sourceHash":"440ef6b86316373d2f711a5a907ab6f078bcfa3490a160c0943a10ba77712539","steps":[{"id":"s1","latex":"f(x)=x^2,\\quad g(x)=\\dfrac{x^2}{2}"},{"id":"s2","latex":"S_{n+1}-S_n\\text{은 }i=2n-1,2n\\text{인 두 세로띠의 정사각형 수}"},{"id":"s3","latex":"i=2n-1:\\quad2n^2-2n\\le j\\le4n^2-1"},{"id":"s4","latex":"\\#=2n^2+2n"},{"id":"s5","latex":"i=2n:\\quad2n^2\\le j\\le4n^2+4n"},{"id":"s6","latex":"\\#=2n^2+4n+1"},{"id":"s7","latex":"S_{n+1}-S_n=4n^2+6n+1"},{"id":"s8","latex":"\\lim_{n\\to\\infty}\\dfrac{S_{n+1}-S_n}{n^2}=4"}],"diagram":null,"contentHash":"d4fd3dd464fad28a64da25f874cdd76923761fa4d60fa2dfa54f5f388892bd49","questionHtml":"\u003cp class=\"hp\">자연수 \u003cspan class=\"heq\">\\(n\\,\\)\u003c/span>에 대하여 다음 조건을 만족시키는 정사각형의 개수를 \u003cspan class=\"heq\">\\(S_{n}\\)\u003c/span>이라 하자.\u003c/p>\u003cp class=\"hp htall\">\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가)정사각형은 한 변의 길이가 \u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>이고 꼭짓점의 \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>좌표와 \u003cspan class=\"heq\">\\(y\\,\\)\u003c/span>좌표가 모두 정수이다.\u003c/p>\u003cp class=\"hp htall\">(나)연립부등식 \u003cspan class=\"heq\">\\(\\dfrac{1}{2} x^{\\,2} \\lt y\\lt x^{\\,2}\\)\u003c/span>, \u003cspan class=\"heq\">\\(0\\lt x\\lt 2n-1 \\,\\)\u003c/span>을 만족시키는 점 \u003cspan class=\"heq\">\\((x,\\,y)\\,\\)\u003c/span> 중에는 정사각형의 내부에 있는 점이 있다.\u003c/p>\u003c/div>\u003c/p>\u003cp class=\"hp htall\">\u003cspan class=\"heq\">\\(\\lim\\limits_{n \\,\\to  \\, \\infty } {\\dfrac{S_{n+1}- S_{n}}{n^{\\,2}}} \\,\\)\u003c/span>의 값을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"47de26dbb66983a7502af051c3a5c206f28222084e19488af843e0e3571cbba6"};</script>
<script>window.HandStudyGuide={"itemId":16402,"sourceHash":"440ef6b86316373d2f711a5a907ab6f078bcfa3490a160c0943a10ba77712539","contentHash":"d4fd3dd464fad28a64da25f874cdd76923761fa4d60fa2dfa54f5f388892bd49","overview":{"goal":"영역의 오른쪽 경계가 두 칸 늘어날 때 새로 포함되는 두 세로띠의 단위 정사각형 수를 세어 극한을 구해요.","firstLook":"\\(S_n\\) 전체를 구할 필요는 없어요. \\(S_{n+1}-S_n\\)에서는 \\(x\\)범위가 \\(2n-1\\)에서 \\(2n+1\\)까지 늘어나므로 새 세로띠 두 개만 세면 돼요.","conditions":[{"label":"단위 정사각형","meaning":"왼쪽 아래 꼭짓점을 \\((i,j)\\)라 하면 내부는 \\(i<x<i+1\\), \\(j<y<j+1\\)이에요."},{"label":"곡선 사이 영역","meaning":"아래 경계는 \\(g(x)=x^2/2\\), 위 경계는 \\(f(x)=x^2\\)이고 두 부등식은 엄격한 부등식이에요."},{"label":"차이","meaning":"새로 생기는 정사각형은 왼쪽 좌표가 \\(i=2n-1\\) 또는 \\(i=2n\\)인 두 열에만 있어요."}]},"chapters":[{"id":"c1","label":"증가한 두 세로띠만 남겨요","stepIds":["s1","s2"],"question":"왜 \\(S_{n+1}-S_n\\)에서는 두 열만 세면 될까요?","hint":"두 영역의 \\(x\\)조건 \\(0<x<2n-1\\)과 \\(0<x<2n+1\\)을 비교해요.","explanation":"두 포물선을 \\(f(x)=x^2\\), \\(g(x)=x^2/2\\)라 할게요. \\(n\\)에서 \\(n+1\\)로 바뀌면 오른쪽 경계가 \\(2n-1\\)에서 \\(2n+1\\)로 이동해요. 기존 부분의 정사각형은 그대로이고, 새로 조건을 만족할 수 있는 단위 정사각형은 \\(2n-1<x<2n\\)과 \\(2n<x<2n+1\\)에 걸친 두 세로띠뿐이에요. 따라서 왼쪽 아래 꼭짓점의 \\(x\\)좌표가 \\(i=2n-1,2n\\)인 정사각형만 세면 돼요.","check":{"prompt":"경계가 2만큼 이동할 때 단위 폭의 세로띠가 몇 개 추가되나요?","answer":"폭이 각각 1인 세로띠 두 개가 추가돼요."}},{"id":"c2","label":"첫 번째 세로띠의 아래와 위 정수를 정해요","stepIds":["s3","s4"],"question":"\\(i=2n-1\\)인 열에서 가능한 \\(j\\)의 범위는 무엇인가요?","hint":"정사각형의 위쪽이 아래 곡선보다 높고, 아래쪽이 위 곡선보다 낮아야 내부가 영역과 만나요.","explanation":"열 \\(i\\)의 정사각형 내부가 영역과 만나려면 \\(j+1>g(i)\\)이고 \\(j<f(i+1)\\)이면 돼요. 두 포물선이 이 구간에서 증가하므로 왼쪽의 가장 낮은 아래 경계와 오른쪽의 가장 높은 위 경계를 비교한 조건이에요.\n\n\\(i=2n-1\\)이면 \\(g(i)=2n^2-2n+1/2\\)이므로 정수 \\(j\\)는 \\(j\\ge2n^2-2n\\)이어야 해요. 또 \\(f(i+1)=f(2n)=4n^2\\)이고 부등식이 엄격하므로 \\(j\\le4n^2-1\\)이에요. 정수의 개수는 \\((4n^2-1)-(2n^2-2n)+1=2n^2+2n\\)이에요.","check":{"prompt":"위쪽 끝에서 \\(j=4n^2\\)을 포함하지 않는 이유는 무엇인가요?","answer":"정사각형 아래쪽이 위 곡선의 가능한 최댓값과 같아 내부에 \\(y<x^2\\)인 점이 생기지 않기 때문이에요."}},{"id":"c3","label":"두 번째 세로띠도 같은 방식으로 세어요","stepIds":["s5","s6"],"question":"\\(i=2n\\)인 열에서는 몇 개의 정사각형이 추가될까요?","hint":"아래 경계 \\(g(2n)=2n^2\\)과 위 경계 \\(f(2n+1)\\)을 사용해요.","explanation":"이번에는 \\(g(2n)=2n^2\\)이에요. 엄격한 부등식 때문에 \\(j=2n^2-1\\)인 정사각형은 위쪽 변만 경계에 닿고 내부가 위로 넘어가지 못하므로 제외하고 \\(j\\ge2n^2\\)예요.\n\n위쪽에서는 \\(f(2n+1)=(2n+1)^2=4n^2+4n+1\\)이므로 \\(j\\le4n^2+4n\\)이에요. 따라서 개수는 \\((4n^2+4n)-(2n^2)+1=2n^2+4n+1\\)이에요.","check":{"prompt":"두 번째 열에서 가장 작은 \\(j\\)와 가장 큰 \\(j\\)는 무엇인가요?","answer":"각각 \\(2n^2\\)과 \\(4n^2+4n\\)이에요."}},{"id":"c4","label":"두 열의 개수를 더해 극한을 구해요","stepIds":["s7","s8"],"question":"차이를 \\(n^2\\)으로 나눈 극한은 얼마인가요?","hint":"두 개수를 더한 뒤 최고차항의 계수를 봐요.","explanation":"두 열의 개수를 더하면\n\\[\nS_{n+1}-S_n=(2n^2+2n)+(2n^2+4n+1)=4n^2+6n+1\n\\]\n이에요. 따라서 \\((S_{n+1}-S_n)/n^2=4+6/n+1/n^2\\)이고 \\(n\\to\\infty\\)일 때 극한은 \\(4\\)예요.","check":{"prompt":"낮은 차수의 두 항은 극한에서 어떻게 되나요?","answer":"\\(6/n\\)과 \\(1/n^2\\)은 모두 \\(0\\)으로 가요."}}],"takeaway":["도형 개수의 차이를 묻는 문제는 전체보다 새로 추가되는 경계 띠만 세는 것이 효율적이에요.","정사각형 내부와 열린 영역이 만나는 조건은 위아래 변이 경계를 엄격히 넘는지 확인해 정수 범위를 정해요.","극한에서는 개수식의 최고차항 계수가 남아요."]};</script>
