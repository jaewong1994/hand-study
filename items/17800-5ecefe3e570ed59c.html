<script>window.HandStudyGuide={"itemId":17800,"sourceHash":"4ffa8699a72b4f14b4114a28d5884efd96960feb7c2a8df77bf869ef79e87161","contentHash":"1e22b6ebf77a3ceae24030f5fe13b8ce931ef109a676c810ad4d5427342300df","overview":{"goal":"원의 점 \\(P\\)를 \\(\\theta\\)로 움직일 때 삼각형 \\(PCQ\\)의 넓이 변화율을 구해요.","firstLook":"\\(C\\)를 원점으로 놓으면 원의 방정식에 \\(P\\)의 극좌표를 대입해 \\(PC=t\\)의 관계식을 바로 얻을 수 있어요.","conditions":[{"label":"원과 대칭","meaning":"\\(AB=10\\)이 지름이므로 중심은 \\(C\\)에서 \\(B\\) 쪽으로 1 떨어지고 반지름은 5이며, \\(Q\\)는 \\(P\\)의 \\(AB\\)에 대한 대칭점이에요."}]},"chapters":[{"id":"c1","label":"원의 방정식으로 길이 관계 세우기","stepIds":["s1"],"question":"\\(t^2-2t\\cos\\theta-24=0\\)은 어디서 나오나요?","hint":"\\(C=(0,0), B=(6,0), A=(-4,0)\\)로 두고 \\(P=(t\\cos\\theta,t\\sin\\theta)\\)를 원의 방정식에 대입해요.","explanation":"\\(AB=10\\)이고 \\(AC=4, CB=6\\)이므로 \\(C=(0,0), A=(-4,0), B=(6,0)\\)로 둘 수 있어요. 지름 \\(AB\\)인 원의 중심은 \\((1,0)\\), 반지름은 5예요. \\(PC=t\\), \\(\\angle PCB=\\theta\\)이므로 \\(P=(t\\cos\\theta,t\\sin\\theta)\\)예요. 원의 방정식 \\((x-1)^2+y^2=25\\)에 대입하면 \\(t^2-2t\\cos\\theta-24=0\\)예요.","check":{"prompt":"상수항 -24는 어떤 길이 정보에서 나오나요?","answer":"원의 방정식을 전개한 \\(t^2-2t\\cos\\theta+1=25\\)에서 \\(1-25=-24\\)가 나와요."}},{"id":"c2","label":"넓이 식과 길이의 변화율 구하기","stepIds":["s2","s3"],"question":"삼각형 \\(PCQ\\)의 넓이가 \\(\\frac12t^2\\sin2\\theta\\)인 이유는 무엇인가요?","hint":"\\(Q\\)는 \\(P\\)의 \\(x\\)축 대칭점이므로 \\(PQ\\)와 \\(C\\)에서 직선 \\(PQ\\)까지의 거리를 구하세요.","explanation":"\\(Q\\)는 \\(P\\)의 \\(AB\\)에 대한 대칭점이므로 \\(PQ=2t\\sin\\theta\\), \\(C\\)에서 직선 \\(PQ\\)까지의 거리는 \\(t\\cos\\theta\\)예요. 따라서 \\(S(\\theta)=\\frac12(2t\\sin\\theta)(t\\cos\\theta)=\\frac12t^2\\sin2\\theta\\)예요. 구하려는 것은 특정 각에서의 변화율이므로 \\(t\\)를 근의 공식으로 먼저 풀지 않고 관계식을 그대로 미분해요. \\(t^2-2t\\cos\\theta-24=0\\)을 \\(\\theta\\)로 미분하면 \\(2tt'-2t'\\cos\\theta+2t\\sin\\theta=0\\), 따라서 \\(t'=-t\\sin\\theta/(t-\\cos\\theta)\\)예요.","check":{"prompt":"\\(t\\)를 \\(\\theta\\)의 식으로 직접 풀지 않고도 \\(t'\\)을 구할 수 있는 이유는 무엇인가요?","answer":"\\(t\\)와 \\(\\theta\\)의 관계식을 양변 미분하면 \\(t'\\)이 들어간 일차식이 되어 바로 정리할 수 있기 때문이에요."}},{"id":"c3","label":"주어진 각에서 수치 계산하기","stepIds":["s4","s5"],"question":"\\(S'(\\pi/4)\\)에서 \\(\\cos2\\theta\\) 항이 사라진 뒤 무엇이 남나요?","hint":"먼저 관계식에서 \\(t=4\\sqrt{2}\\)를 구하고 \\(t'\\)을 계산하세요.","explanation":"\\(\\theta=\\pi/4\\)를 관계식에 넣으면 \\(t^2-\\sqrt{2}t-24=0\\), 양의 길이이므로 \\(t=4\\sqrt{2}\\)예요. 이어 \\(t'=-\\frac{4\\sqrt{2}(\\sqrt{2}/2)}{4\\sqrt{2}-\\sqrt{2}/2}=-4\\sqrt{2}/7\\). \\(S'=tt'\\sin 2\\theta+t^2\\cos 2\\theta\\)이고 이때 \\(\\sin 2\\theta=1,\\cos 2\\theta=0\\)이므로 \\(S'(\\pi/4)=tt'=-32/7\\). 따라서 \\(-7S'(\\pi/4)=32\\)예요.","check":{"prompt":"이차방정식의 다른 근을 버리는 이유는 무엇인가요?","answer":"\\(t=PC\\)는 길이이므로 음의 근은 사용할 수 없어요."}}],"takeaway":["움직이는 원 위의 점은 좌표와 극좌표를 함께 쓰면 길이 관계를 간단히 세울 수 있어요.","음함수 관계를 미분한 뒤 특정 각에서 길이와 변화율을 차례로 계산해요."]};</script>
