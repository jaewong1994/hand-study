<script>window.HandStudyGuide={"itemId":18127,"sourceHash":"8e2ee34f19c8fd3e95a1f399be6a2b8f5f6da3ea0313ae3ab07a3c69754cfd83","contentHash":"eddac981c2929bfaa0b9d479518cf2fb6bc86fc5fa9d87ba05ce077f0f0f28a1","overview":{"goal":"극한 조건이 성립하는 두 점에서 사차식이 접한다는 뜻을 읽어 \\(f\\)를 정해요.","firstLook":"\\(f\\)의 최솟값이 \\(17\\)이므로 \\(f(k)>0\\)예요. 이 사실로 극한의 분자가 \\(x=k\\)에서 \\(0\\)이 되려면 \\(f(k)=2k^2\\)여야 한다고 정할 수 있어요.","conditions":[{"label":"극한의 존재","meaning":"분모가 \\(0\\)으로 가므로 먼저 분자의 값이 \\(0\\)이어야 하고, 그다음 미분계수의 정의로 분자들의 변화율을 비교해요."},{"label":"해가 두 개뿐","meaning":"\\(f(x)-2x^2\\)는 \\(x=t,-t\\)에서 값과 기울기가 모두 \\(0\\)인 최고차항 계수 \\(1\\)의 사차식이에요."}]},"chapters":[{"id":"c1","label":"극한에서 접점 조건을 꺼내요","stepIds":["s1","s2"],"question":"극한식이 성립할 때 왜 \\(f(k)=2k^2\\), \\(f'(k)=4k\\)가 될까요?","hint":"먼저 왼쪽 분자가 \\(x=k\\)에서 \\(0\\)이어야 한다는 조건을 쓰고, \\(f(k)>0\\)을 이용해요.","explanation":"오른쪽 분자는 \\(x=k\\)에서 \\(0\\)이에요. 왼쪽 극한도 유한하려면 \\(f(k)\\{2k^2-f(k)\\}=0\\)이어야 해요. 그런데 \\(f\\)의 최솟값이 \\(17\\)이므로 \\(f(k)>0\\), 따라서 \\(f(k)=2k^2\\)예요.\n\n이제 각 분자에서 \\(x=k\\)일 때의 값 \\(0\\)을 빼고 \\(x-k\\)로 나눈 꼴이므로, 이는 각 분자의 \\(x=k\\)에서의 미분계수예요. 왼쪽 분자의 미분계수는 \\(4kf(k)+2k^2f'(k)\\), 오른쪽은 \\(2f(k)f'(k)\\)예요. \\(f(k)=2k^2\\)를 넣으면 \\(8k^3+2k^2f'(k)=4k^2f'(k)\\)예요. \\(k=\\pm t\\), \\(t>1\\)이라 \\(k\\ne0\\)이므로 \\(f'(k)=4k\\)예요.","check":{"prompt":"\\(f(k)=0\\)인 가능성을 제외할 수 있는 원래 조건은 무엇인가요?","answer":"\\(f\\)의 최솟값이 \\(17\\)이므로 모든 실수 \\(x\\)에서 \\(f(x)\\ge17>0\\)이에요."}},{"id":"c2","label":"두 이중근으로 사차식을 정해요","stepIds":["s3","s4"],"question":"\\(h(x)=f(x)-2x^2\\)가 왜 \\((x^2-t^2)^2\\)와 같을까요?","hint":"\\(k=\\pm t\\)에서 \\(h(k)=0\\)뿐 아니라 \\(h'(k)=0\\)도 성립해요.","explanation":"앞에서 얻은 조건은 \\(h(\\pm t)=0\\), \\(h'(\\pm t)=0\\)이에요. 즉 \\(t\\)와 \\(-t\\)는 모두 \\(h\\)의 이중근이에요. \\(h\\)는 최고차항의 계수가 \\(1\\)인 사차식이므로 \\(h(x)=(x-t)^2(x+t)^2=(x^2-t^2)^2\\)예요. 이 식의 영점은 정확히 \\(\\pm t\\)뿐이라 원래 조건도 다시 만족해요.","check":{"prompt":"값이 \\(0\\)이라는 조건만으로는 왜 제곱 인수를 확정할 수 없나요?","answer":"\\(h(t)=0\\)만으로는 \\(x-t\\)가 한 번만 인수일 수도 있고, \\(h'(t)=0\\)까지 있어야 \\((x-t)^2\\)가 인수예요."}},{"id":"c3","label":"완전제곱으로 최솟값을 읽어요","stepIds":["s5","s6","s7"],"question":"\\(t>1\\)일 때 \\(f\\)의 최솟값이 왜 \\(2t^2-1\\)인가요?","hint":"\\(f(x)=(x^2-t^2)^2+2x^2\\)를 하나의 제곱식으로 만들어요.","explanation":"식을 정리하면 \\(f(x)=(x^2-t^2+1)^2+2t^2-1\\)이에요. \\(t>1\\)이므로 \\(x^2=t^2-1\\)을 만족하는 실수 \\(x\\)가 존재하고, 그때 제곱항이 \\(0\\)이 돼요. 따라서 최솟값은 \\(2t^2-1\\)이에요. \\(2t^2-1=17\\)에서 \\(t=3\\)이고, \\(f(4)=(16-9)^2+32=81\\)이에요.","check":{"prompt":"제곱항을 \\(0\\)으로 만드는 \\(x\\)가 실제로 존재하는 이유는 무엇인가요?","answer":"\\(t>1\\)이어서 \\(t^2-1>0\\)이므로 \\(x=\\pm\\sqrt{t^2-1}\\)가 실수로 존재해요."}}],"takeaway":["극한의 분모가 \\(0\\)으로 갈 때 먼저 분자가 \\(0\\)이 되는지 확인해요.","분자를 미분한 값을 비교한 것은 미분계수의 정의를 쓴 것이에요.","완전제곱으로 최솟값을 읽을 때 제곱항이 실제로 \\(0\\)이 될 수 있는지도 확인해요."]};</script>
