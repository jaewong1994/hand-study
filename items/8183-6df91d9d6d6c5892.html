  <script>window.HandStudyRecord={"itemId":8183,"sourceLabel":"2022 교육청 고2 수학 9월 16번","adminYear":2022,"grade":2,"month":9,"number":16,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"집합 $\\left\\{ \\,x\\, LEFT  \\,-4 \\leq x \\leq 4\\, \\right\\} \\, RIGHT .$에서 정의된 함수\n $f \\left( x \\right) =2\\,\\sin \\frac{\\pi x}{4} \\,$\n가 있다. 그림과 같이 함수 $y= f \\left( x \\right)\\,$의 그래프가 직선 $y= \\sqrt{2} \\,$와 만나는 서로 다른 두 점을 $A\\,$, $B\\,$라 하고, 두 점 $B\\,$, $O\\,$를 지나는 직선이 함수 $y=f \\left( x \\right) \\,$의 그래프와 만나는 점 중 $B\\,$와 $O\\,$가 아닌 점을 $C\\,$라 하자. $\\angle BAC= \\theta \\,$라 할 때, $\\sin\\, \\theta \\,$의 값은? (단, 점 $B\\,$의 $x\\,$좌표는 점 $A\\,$의 $x\\,$좌표보다 크고, $O\\,$는 원점이다.) [4점]\n$x$$y$$O$$A$$B$$y=f(x)$$C$$y= \\sqrt{2}$$\\theta$$4$$-4$\n① $\\frac{\\sqrt{3}}{3}$ ② $\\frac{7 \\sqrt{3}}{18}$ ③ $\\frac{4 \\sqrt{3}}{9}$ ④ $\\frac{\\sqrt{3}}{2}$ ⑤ $\\frac{5 \\sqrt{3}}{9}$","answer":"①","sourceHash":"226f21c18e263abfab9cee851369a4949ac28d315f097238445c3c8987555761","steps":[{"id":"s1","latex":"2\\sin\\dfrac{\\pi x}{4}=\\sqrt2\\Rightarrow A=(1,\\sqrt2),\\quad B=(3,\\sqrt2)"},{"id":"s2","latex":"B,O\\text{를 지나는 직선}:\\ y=\\dfrac{\\sqrt2}{3}x"},{"id":"s3","latex":"f(-3)=-\\sqrt2\\Rightarrow C=(-3,-\\sqrt2)"},{"id":"s4","latex":"|AC|=\\sqrt{(-4)^2+(-2\\sqrt2)^2}=\\sqrt{24}"},{"id":"s5","latex":"\\operatorname{dist}(C,AB)=2\\sqrt2"},{"id":"s6","latex":"\\sin\\theta=\\dfrac{\\operatorname{dist}(C,AB)}{|AC|}=\\dfrac{2\\sqrt2}{\\sqrt{24}}=\\dfrac{\\sqrt3}{3}"}],"diagram":null,"contentHash":"d19267295dbe688b10d60b5f7f7cec7e1c6244845570e14eaf30e9bc16b7394c","questionHtml":"\u003cp class=\"hp\">집합 \u003cspan class=\"heq\">\\(\\{ \\,x\\, \\mid \\,-4 \\leq x \\leq 4\\, \\} \\, \\)\u003c/span>에서 정의된 함수\u003c/p>\u003cp class=\"hp htall\">&emsp;&emsp;\u003cspan class=\"heq\">\\(f \\left( x \\right) =2\\,\\sin \\dfrac{\\pi x}{4} \\,\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">가 있다. 그림과 같이 함수 \u003cspan class=\"heq\">\\(y= f \\left( x \\right)\\,\\)\u003c/span>의 그래프가 직선 \u003cspan class=\"heq\">\\(y= \\sqrt{2} \\,\\)\u003c/span>와 만나는 서로 다른 두 점을 \u003cspan class=\"heq\">\\(A\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(B\\,\\)\u003c/span>라 하고, 두 점 \u003cspan class=\"heq\">\\(B\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(O\\,\\)\u003c/span>를 지나는 직선이 함수 \u003cspan class=\"heq\">\\(y=f \\left( x \\right) \\,\\)\u003c/span>의 그래프와 만나는 점 중 \u003cspan class=\"heq\">\\(B\\,\\)\u003c/span>와 \u003cspan class=\"heq\">\\(O\\,\\)\u003c/span>가 아닌 점을 \u003cspan class=\"heq\">\\(C\\,\\)\u003c/span>라 하자. \u003cspan class=\"heq\">\\(\\angle BAC= \\theta \\,\\)\u003c/span>라 할 때, \u003cspan class=\"heq\">\\(\\sin\\, \\theta \\,\\)\u003c/span>의 값은? (단, 점 \u003cspan class=\"heq\">\\(B\\,\\)\u003c/span>의 \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>좌표는 점 \u003cspan class=\"heq\">\\(A\\,\\)\u003c/span>의 \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>좌표보다 크고, \u003cspan class=\"heq\">\\(O\\,\\)\u003c/span>는 원점이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/source-repair/8183-figure.png\" style=\"width:380px;max-width:100%\">\u003c/p>\u003cp class=\"hp htall\">① \u003cspan class=\"heq\">\\(\\dfrac{\\sqrt{3}}{3}\\)\u003c/span>&emsp;② \u003cspan class=\"heq\">\\(\\dfrac{7 \\sqrt{3}}{18}\\)\u003c/span>&emsp;③ \u003cspan class=\"heq\">\\(\\dfrac{4 \\sqrt{3}}{9}\\)\u003c/span>&emsp;④ \u003cspan class=\"heq\">\\(\\dfrac{\\sqrt{3}}{2}\\)\u003c/span>&emsp;⑤ \u003cspan class=\"heq\">\\(\\dfrac{5 \\sqrt{3}}{9}\\)\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"6df91d9d6d6c5892bf3674c34ff0a6b3cd31408d4983ab3167e805b5ed7e51ac"};</script>
