  <script>window.HandStudyRecord={"itemId":16421,"sourceLabel":"2019 교육청 고3 수리나형 4월 19번","adminYear":2019,"grade":3,"month":4,"number":19,"track":"수리나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"좌표평면에서 두 함수 $f \\left( x \\right) = \\frac{1}{x+1} -5$, $g \\left( x \\right) = \\sqrt{x+1}$의 그래프에 대하여 \u003c보기>에서 옳은 것만을 있는 대로 고른 것은?\n[4점]\n\u003c보기>\nㄱ. 곡선 $y=f \\left( x \\right)$는 직선 $y=-5$와 만나지 않는다.\nㄴ. $0 \\leq x \\leq 8$일 때, 곡선 $y=g \\left( x \\right)$ 위에 있는 점 중에서 $y$좌표가 정수인 점의 개수는 $3$이다.\nㄷ. 두 곡선 $y=f \\left( x \\right)$, $y=g \\left( x \\right)$와 두 직선 $x=0$, $x=8$로 둘러싸인 영역의 내부 또는 그 경계에 포함되고 $x$좌표와 $y$좌표가 모두 정수인 점의 개수는 $61$이다.\n① ㄱ ② ㄱ, ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","answer":"⑤","sourceHash":"293facd4fa2daabbc49bc0d5711cf977148e1a977487bba1bd2f62591d232988","steps":[{"id":"s1","latex":"f(x)=-5\\Rightarrow\\dfrac1{x+1}=0\\text{은 불가}"},{"id":"s2","latex":"g:[0,8]\\to[1,3]\\Rightarrow g(x)\\in\\mathbb Z\\text{인 }x\\text{는 }3\\text{개}"},{"id":"s3","latex":"0\\le x\\le8:\\quad f(x)\\le y\\le g(x)"},{"id":"s4","latex":"\\#\\{y\\in\\mathbb Z:f(x)\\le y\\le g(x)\\}=\\lfloor\\sqrt{x+1}\\rfloor+5"},{"id":"s5","latex":"3\\cdot6+5\\cdot7+1\\cdot8=61"},{"id":"s6","latex":"\\therefore\\text{세 명제는 모두 참}"}],"diagram":null,"contentHash":"793ffee30f0093d586812663759d28b4d587afaf39a5d3a1d595eec510a6462b","questionHtml":"\u003cp class=\"hp htall\">좌표평면에서 두 함수 \u003cspan class=\"heq\">\\(f \\left( x \\right) = \\dfrac{1}{x+1} -5\\)\u003c/span>, \u003cspan class=\"heq\">\\(g \\left( x \\right) = \\sqrt{x+1}\\)\u003c/span>의 그래프에 대하여 &lt;보기&gt;에서 옳은 것만을 있는 대로 고른 것은?\u003c/p>\u003cp class=\"hp\">\u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cdiv class=\"hbox\">\u003cdiv style=\"text-align:center;font-weight:700;margin:0 0 6px\">&lt; 보 기 &gt;\u003c/div>\u003cp class=\"hp\">ㄱ. 곡선 \u003cspan class=\"heq\">\\(y=f \\left( x \\right)\\)\u003c/span>는 직선 \u003cspan class=\"heq\">\\(y=-5\\)\u003c/span>와 만나지 않는다.\u003c/p>\u003cp class=\"hp\">ㄴ. \u003cspan class=\"heq\">\\(0 \\leq x \\leq 8\\)\u003c/span>일 때, 곡선 \u003cspan class=\"heq\">\\(y=g \\left( x \\right)\\)\u003c/span> 위에 있는 점 중에서 \u003cbr>\u003cspan class=\"heq\">\\(y\\)\u003c/span>좌표가 정수인 점의 개수는 \u003cspan class=\"heq\">\\(3\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp\">ㄷ. 두 곡선 \u003cspan class=\"heq\">\\(y=f \\left( x \\right)\\)\u003c/span>, \u003cspan class=\"heq\">\\(y=g \\left( x \\right)\\)\u003c/span>와 두 직선 \u003cspan class=\"heq\">\\(x=0\\)\u003c/span>, \u003cspan class=\"heq\">\\(x=8\\)\u003c/span>로 \u003cbr>둘러싸인 영역의 내부 또는 그 경계에 포함되고 \u003cbr>\u003cspan class=\"heq\">\\(x\\)\u003c/span>좌표와 \u003cspan class=\"heq\">\\(y\\)\u003c/span>좌표가 모두 정수인 점의 개수는 \u003cspan class=\"heq\">\\(61\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp class=\"hp\">① ㄱ&emsp;② ㄱ, ㄴ&emsp;③ ㄱ, ㄷ\u003c/p>\u003cp class=\"hp\">④ ㄴ, ㄷ&emsp;⑤ ㄱ, ㄴ, ㄷ\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"6c5659436667c50322166fa683970d761332e7cd3235a733134dc87d96e67afe"};</script>
