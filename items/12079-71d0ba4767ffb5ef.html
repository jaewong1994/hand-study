  <script>window.HandStudyRecord={"itemId":12079,"sourceLabel":"2024 교육청 고1 수학 9월 30번","adminYear":2024,"grade":1,"month":9,"number":30,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"두 실수 $a$, $b\\,$에 대하여 이차함수 $f \\left(x \\right)=a \\left(x-b \\right) ^{2}\\,$이 있다. 중심이 함수 $y=f \\left(x \\right)\\,$의 그래프 위에 있고 직선 $y= \\frac{4}{3} x\\,$와 $x\\,$축에 동시에 접하는 서로 다른 원의 개수는 $3\\,$이다. 이 세 원의 중심의 $x\\,$좌표를 각각 $x _{1}$, $x _{2}$, $x_{3}\\,$이라 할 때, 세 실수 $x _{1}$, $x _{2}$, $x_{3}\\,$이 다음 조건을 만족시킨다.\n(가) $x _{1} \\times x _{2} \\times x _{3} >0$\n(나) 세 점 $\\left( x _{1} ,\\, f \\left( x _{1} \\right) \\right)$, $\\left( x _{2} ,\\, f \\left( x _{2} \\right) \\right)$, $\\left( x _{3} ,\\, f \\left( x _{3} \\right) \\right)\\,$을 꼭짓점으로 하는 삼각형의 무게중심의 $y\\,$좌표는 $-\\frac{7}{3}\\,$이다.\n$f \\left(4 \\right) \\times f \\left(6 \\right)\\,$의 값을 구하시오. [4점]","answer":"144","sourceHash":"c454117fcf9983e616ec317093523ca61a33550d50a304b968d0ac44a82e5098","steps":[{"id":"s1","latex":"5|y|=|4x-3y|\\Rightarrow y=\\frac x2\\ \\text{or}\\ y=-2x"},{"id":"s2","latex":"a(x-b)^2=\\frac x2:\\ D_1=8ab+1,\\qquad a(x-b)^2=-2x:\\ D_2=4-8ab"},{"id":"s3","latex":"b\\ne0,\\quad\\#\\text{centers}=3\\Longleftrightarrow(D_1,D_2)=(0,>0)\\ \\text{or}\\ (>0,0)"},{"id":"s4","latex":"\\mathrm{I}:\\ 8ab=-1\\Rightarrow a\u003c0,\\quad x_1x_2x_3=\\frac{b^2}{8a}\u003c0\\quad\\times"},{"id":"s5","latex":"\\mathrm{II}:\\ 8ab=4,\\quad\\sum y_i=\\frac{7}{4a}=-7\\Rightarrow a=-\\frac14,\\ b=-2"},{"id":"s6","latex":"x_1x_2x_3=8>0"},{"id":"s7","latex":"f(x)=-\\frac14(x+2)^2\\Rightarrow f(4)f(6)=(-9)(-16)=144"}],"diagram":null,"contentHash":"dda5268f06410d6f1da403e5e0bb689cf794f1fd122d5d480495e6330ef98413","questionHtml":"\u003cp class=\"hp htall\">두 실수 \u003cspan class=\"heq\">\\(a\\)\u003c/span>, \u003cspan class=\"heq\">\\(b\\,\\)\u003c/span>에 대하여 이차함수 \u003cspan class=\"heq\">\\(f \\left(x \\right)=a \\left(x-b \\right)^{2}\\,\\)\u003c/span>이 있다. 중심이 함수 \u003cspan class=\"heq\">\\(y=f \\left(x \\r
