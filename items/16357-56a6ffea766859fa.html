  <script>window.HandStudyRecord={"itemId":16357,"sourceLabel":"2019 교육청 고3 수리나형 10월 15번","adminYear":2019,"grade":3,"month":10,"number":15,"track":"수리나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"$A$, $B$, $C$ 세 사람이 한 개의 주사위를 각각 $5\\,$번씩 던진 후 다음 규칙에 따라 승자를 정한다.\n(가) $1\\,$의 눈이 나온 횟수가 세 사람 모두 다르면, $1\\,$의 눈이 가장 많이 나온 사람이 승자가 된다.\n(나) $1\\,$의 눈이 나온 횟수가 두 사람만 같다면, 횟수가 다른 나머지 한 사람이 승자가 된다.\n(다) $1\\,$의 눈이 나온 횟수가 세 사람 모두 같다면, 모두 승자가 된다.\n$A\\,$와 $B\\,$가 각각 주사위를 $5\\,$번씩 던진 후, $A\\,$는 $1\\,$의 눈이 $2\\,$번, $B\\,$는 $1\\,$의 눈이 $1\\,$번 나왔다. $C\\,$가 주사위를 $3\\,$번째 던졌을 때 처음으로 $1\\,$의 눈이 나왔다. $A$ 또는 $C\\,$가 승자가 될 확률은?\n[4점]\n① $\\frac{2}{3}$ ② $\\frac{13}{18}$ ③ $\\frac{7}{9}$ ④ $\\frac{5}{6}$ ⑤ $\\frac{8}{9}$","answer":"②","sourceHash":"86c278ec343f5db923de2b54db6aa095473cc4d3039f4877e3a9aad605a41224","steps":[{"id":"s1","latex":"C_3=1,\\quad K\\sim\\operatorname{Bin}\\left(2,\\frac16\\right),\\quad C_5=1+K"},{"id":"s2","latex":"K=0:\\ C_5=1\\Rightarrow A\\text{ wins}"},{"id":"s3","latex":"K=1:\\ C_5=2\\Rightarrow B\\text{ wins}"},{"id":"s4","latex":"K=2:\\ C_5=3\\Rightarrow C\\text{ wins}"},{"id":"s5","latex":"P(A\\cup C)=\\left(\\frac56\\right)^2+\\left(\\frac16\\right)^2=\\frac{13}{18}"}],"diagram":null,"contentHash":"dc3b962e0bdb35e6cb502bb0dabfe6cd73ef4b2b791933a81c963d37e60c2a26","questionHtml":"\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(A\\)\u003c/span>, \u003cspan class=\"heq\">\\(B\\)\u003c/span>, \u003cspan class=\"heq\">\\(C\\)\u003c/span> 세 사람이 한 개의 주사위를 각각 \u003cspan class=\"heq\">\\(5\\,\\)\u003c/span>번씩 던진 후 다음 규칙에 따라 승자를 정한다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가)\u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>의 눈이 나온 횟수가 세 사람 모두 다르면, \u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>의 눈이 가장 많이 나온 사람이 승자가 된다.\u003c/p>\u003cp class=\"hp\">(나)\u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>의 눈이 나온 횟수가 두 사람만 같다면, 횟수가 다른 나머지 한 사람이 승자가 된다.\u003c/p>\u003cp class=\"hp\">(다)\u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>의 눈이 나온 횟수가 세 사람 모두 같다면, 모두 승자가 된다.\u003c/p>\u003c/div>\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(A\\,\\)\u003c/span>와 \u003cspan class=\"heq\">\\(B\\,\\)\u003c/span>가 각각 주사위를 \u003cspan class=\"heq\">\\(5\\,\\)\u003c/span>번씩 던진 후, \u003cspan class=\"heq\">\\(A\\,\\)\u003c/span>는 \u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>의 눈이 \u003cspan class=\"heq\">\\(2\\,\\)\u003c/span>번, \u003cspan class=\"heq\">\\(B\\,\\)\u003c/span>는 \u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>의 눈이 \u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>번 나왔다. \u003cspan class=\"heq\">\\(C\\,\\)\u003c/span>가 주사위를 \u003cspan class=\"heq\">\\(3\\,\\)\u003c/span>번째 던졌을 때 처음으로 \u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>의 눈이 나왔다. \u003cspan class=\"heq\">\\(A\\)\u003c/span> 또는 \u003cspan class=\"heq\">\\(C\\,\\)\u003c/span>가 승자가 될 확률은?\u003c/p>\u003cp class=\"hp\">\u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp htall\">① \u003cspan class=\"heq\">\\(\\dfrac{2}{3}\\)\u003c/span>&emsp;② \u003cspan class=\"heq\">\\(\\dfrac{13}{18}\\)\u003c/span>&emsp;③ \u003cspan class=\"heq\">\\(\\dfrac{7}{9}\\)\u003c/span>&emsp;④ \u003cspan class=\"heq\">\\(\\dfrac{5}{6}\\)\u003c/span>&emsp;⑤ \u003cspan class=\"heq\">\\(\\dfrac{8}{9}\\)\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"56a6ffea766859faa7b6980666aba306257eaebad54df8a3c09b6dab1b1b1a55"};</script>
