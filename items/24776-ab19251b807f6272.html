2}$를 각각 중심으로 하고 반지름의 길이가 ${\\overline{ O _{1} O _{2}}}$인 두 원 $C _{1}$, $C _{2}$가 있다. 그림과 같이 원 $C _{1}$ 위의 서로 다른 세 점 $A$, $B$, $C$와 원 $C _{2}$ 위의 점 $D$가 주어져 있고, 세 점 $A$, $O _{1}$, $O _{2}$와 세 점 $C$, $O _{2}$, $D$가 각각 한 직선 위에 있다. 이때 $\\angle BO _{1} A$$= \\theta _{1}$, $\\angle O _{2} O _{1} C$$= \\theta _{2}$, $\\angle O _{1} O _{2} D$$= \\theta _{3}$이라 하자.\n다음은 ${\\overline{ AB}} \\,:\\, {\\overline{ O _{1} D}}$$=1\\,:\\,2 \\sqrt{2}$이고, $\\theta _{3}$$= \\theta _{1} + \\theta _{2}$일 때, 선분 $A B$와 선분 $C D$의 길이의 비를 구하는 과정이다.\n$\\angle CO _{2} O _{1} + \\angle O _{1} O _{2} D$$=\\pi$이므로 $\\theta _{3}$$= \\frac{\\pi}{2} + \\frac{\\theta _{2}}{2}$이고$\\theta _{3}$$= \\theta _{1} + \\theta _{2}$에서 $2 \\theta _{1} + \\theta _{2}$$=\\pi$이므로 $\\angle CO _{1} B$$= \\theta _{1}$이다.이때 $\\angle O _{2} O _{1} B$$= \\theta _{1} + \\theta _{2}$$= \\theta _{3}$이므로 삼각형 $O _{1} O _{2} B$와 삼각형 $O _{2} O _{1} D$는 합동이다.${\\overline{ AB}}$$=k$라 할 때,${\\overline{ BO _{2}}}$$= {\\overline{ O _{1} D}}$$=2 \\sqrt{2} k$이므로 ${\\overline{ AO _{2}}}$$= {\\boxed{\\, \\left( 가 \\right) \\,}}$이고,$\\angle BO _{2} A$$= \\frac{\\theta _{1}}{2}$이므로 $\\cos\\, \\frac{\\theta _{1}}{2}$$= {\\boxed{\\, \\left( 나 \\right) \\,}}$이다.삼각형 $O _{2} BC$에서${\\overline{ BC}}$$=k$, ${\\overline{ BO _{2}}}$$=2 \\sqrt{2} k$, $\\angle CO _{2} B$$= \\frac{\\theta _{1}}{2}$이므로코사인법칙에 의하여 ${\\overline{ O _{2} C}}$$= {\\boxed{\\, \\left( 다 \\right) \\,}}$이다.${\\overline{ CD}}$$= {\\overline{ O _{2} D}} + {\\overline{ O _{2} C}}$$= {\\overline{ O _{1} O _{2}}} + {\\overline{ O _{2} C}}$이므로${\\overline{ AB}} \\,:\\, {\\overline{ CD}}$$=k\\,:\\, \\left( \\frac{{\\overline{{\\boxed{\\, \\left( 가 \\right) \\,}} }}}{2} + {\\boxed{\\, \\left( 다 \\right) \\,}} \\right)$이다.\n위의 (가), (다)에 알맞은 식을 각각 $f \\left( k \\right)$, $g \\left( k \\right)$라 하고, (나)에 알맞은 수를 $p$라 할 때, $f \\left( p \\right) \\times g \\left( p \\right)$의 값은? [4점]\n① $\\frac{169}{27}$ ② $\\frac{56}{9}$ ③ $\\frac{167}{27}$ ④ $\\frac{166}{27}$ ⑤ $\\frac{55}{9}$\n단답형","sour
