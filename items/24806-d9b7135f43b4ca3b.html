이다. $p+q$의 값을 구하시오. (단, $p$와 $q$는 서로소인 자연수이다.) [4점]","sourceHash":"041cf1ceb20948e7d79387e19a2fbe1b925a708937d93ab3a51c8f7d44c7b7b8","sourceKind":"csat","sourceLabel":"2021년 시행 수능 · 2022학년도 · 확률과 통계 · 29번","steps":[{"id":"s1","latex":"\\int_0^6f(x)\\,dx=\\int_0^6g(x)\\,dx=1,\\quad g(x)=k-f(x)"},{"id":"s2","latex":"1=6k-1\\quad\\Rightarrow\\quad k=\\frac13"},{"id":"s3","latex":"2\\le x\\le3:\\ f(x)=\\frac{x}{12},\\qquad3\\le x\\le5:\\ f(x)=\\frac14"},{"id":"s4","latex":"\\int_2^5f(x)\\,dx=\\frac12\\left(\\frac16+\\frac14\\right)\\cdot1+\\frac14\\cdot2=\\frac{17}{24}"},{"id":"s5","latex":"\\mathrm P(2\\le Y\\le5)=\\int_2^5\\left(\\frac13-f(x)\\right)\\,dx=1-\\frac{17}{24}=\\frac7{24}"},{"id":"s6","latex":"p+q=24+7=31"}],"track":"확률과 통계"};</script>
