<script>window.HandStudyRecord={"itemId":7836,"sourceLabel":"2019 교육청 고2 수학나형 3월 29번","adminYear":2019,"grade":2,"month":3,"number":29,"track":"수학나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"좌표평면에 원 $C _{\\,1} \\,:\\, \\left( x+7 \\right) ^{2} + \\left( y-2 \\right) ^{2} =20\\,$이 있다. 그림과 같이 점 $P$$\\left( a,\\,0 \\right) \\,$에서 원 $C _{\\,1} \\,$에 그은 두 접선을 $l _{1}$, $l _{2} \\,$라 하자. 두 직선 $l _{1} \\,$, $l _{2} \\,$가 원 $C _{\\,2} \\,:\\,x ^{2} + \\left( y-b \\right) ^{2} =5\\,$에 모두 접할 때, 두 직선 $l _{1}$, $l _{2} \\,$의 기울기의 곱을 $c\\,$라 하자. $11 \\left( a+b+c \\right) \\,$의 값을 구하시오. (단, $a$, $b\\,$는 양의 상수이다.) [4점]","answer":"87","sourceHash":"33e2adf0dababd3d562743affdbf9ea9e6d07317ebf703b591f763d026a74bd4","steps":[{"id":"s1","latex":"C_1\\text{ 중심 }A=(-7,2),\\ r_1=2\\sqrt5;\\quad C_2\\text{ 중심 }B=(0,b),\\ r_2=\\sqrt5"},{"id":"s2","latex":"\\frac{PA}{PB}=\\frac{r_1}{r_2}=2\\Rightarrow B=\\frac{A+P}{2}"},{"id":"s3","latex":"P=(a,0),\\ B=(0,b)\\Rightarrow(a,b)=(7,1)"},{"id":"s4","latex":"l:\\ y=m(x-7),\\quad d(B,l)=\\sqrt5"},{"id":"s5","latex":"\\frac{|7m+1|}{\\sqrt{m^2+1}}=\\sqrt5\\Rightarrow22m^2+7m-2=0"},{"id":"s6","latex":"c=m_1m_2=-\\frac1{11}"},{"id":"s7","latex":"11(a+b+c)=11\\left(8-\\frac1{11}\\right)=87"}],"diagram":null,"contentHash":"20daa87e048fa03f4c0234f32ee9fd2cb7d0eda6740e3b4264ea6b02e0d09127","questionHtml":"\u003cp class=\"hp\">좌표평면에 원 \u003cspan class=\"heq\">\\(C_{\\,1} \\,:\\, \\left( x+7 \\right)^{2} + \\left( y-2 \\right)^{2} =20\\,\\)\u003c/span>이 있다. 그림과 같이 점 \u003cspan class=\"heq\">\\(P\\)\u003c/span>\u003cspan class=\"heq\">\\(\\left( a,\\,0 \\right) \\,\\)\u003c/span>에서 원 \u003cspan class=\"heq\">\\(C_{\\,1} \\,\\)\u003c/span>에 그은 두 접선을 \u003cspan class=\"heq\">\\(l_{1}\\)\u003c/span>, \u003cspan class=\"heq\">\\(l_{2} \\,\\)\u003c/span>라 하자. 두 직선 \u003cspan class=\"heq\">\\(l_{1} \\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(l_{2} \\,\\)\u003c/span>가 원 \u003cspan class=\"heq\">\\(C_{\\,2} \\,:\\,x^{2} + \\left( y-b \\right)^{2} =5\\,\\)\u003c/span>에 모두 접할 때, 두 직선 \u003cspan class=\"heq\">\\(l_{1}\\)\u003c/span>, \u003cspan class=\"heq\">\\(l_{2} \\,\\)\u003c/span>의 기울기의 곱을 \u003cspan class=\"heq\">\\(c\\,\\)\u003c/span>라 하자. \u003cspan class=\"heq\">\\(11 \\left( a+b+c \\right) \\,\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(a\\)\u003c/span>, \u003cspan class=\"heq\">\\(b\\,\\)\u003c/span>는 양의 상수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/ecc128b351f6daad5c583e68.png\" style=\"width:331px;max-width:100%\">\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"a0aec23c677bc0b97afa5703667fadb6f073307d305208bd2387d67a434e0b42"};</script>
<script>window.HandStudyGuide={"itemId":7836,"sourceHash":"33e2adf0dababd3d562743affdbf9ea9e6d07317ebf703b591f763d026a74bd4","contentHash":"20daa87e048fa03f4c0234f32ee9fd2cb7d0eda6740e3b4264ea6b02e0d09127","overview":{"goal":"두 공통접선에 대한 중심의 거리비로 두 원의 중심과 점 \\(P\\)의 위치를 정해요.","firstLook":"같은 두 직선 사이에 놓인 두 원은 각 직선까지의 거리가 반지름과 같아서 중심들이 각의 이등분선 위에 있어요.","conditions":[{"label":"닮음","meaning":"\\(PA/PB=r_1/r_2=2\\)예요."},{"label":"중점","meaning":"작은 원 중심 \\(B\\)는 \\(A\\)와 \\(P\\)의 중점이에요."},{"label":"기울기","meaning":"접선 조건으로 두 기울기의 곱을 구해요."}]},"chapters":[{"id":"c1","label":"두 중심의 위치를 정해요","stepIds":["s1","s2","s3"],"question":"왜 \\(B=(A+P)/2\\)인가요?","hint":"두 중심은 같은 각의 이등분선 위에 있고 꼭짓점에서의 거리는 반지름에 비례해요.","explanation":"큰 원 중심은 \\(A=(-7,2)\\), 반지름은 \\(2\\sqrt5\\), 작은 원 중심은 \\(B=(0,b)\\), 반지름은 \\(\\sqrt5\\)예요. 공통접선이 만드는 각에서 중심까지 거리의 비가 반지름의 비와 같아 \\(PA:PB=2:1\\)이에요. 그림처럼 \\(B\\)가 \\(P\\)와 \\(A\\) 사이에 있으므로 \\(B\\)는 \\(AP\\)의 중점이에요. \\(P=(a,0)\\)에서 \\((0,b)=((-7+a)/2,1)\\), 따라서 \\(a=7,b=1\\)이에요.","check":{"prompt":"중점 관계에서 b는 얼마인가요?","answer":"y좌표가 \\((2+0)/2=1\\)이므로 \\(b=1\\)이에요."}},{"id":"c2","label":"접선의 두 기울기를 구해요","stepIds":["s4","s5","s6","s7"],"question":"직선 \\(y=m(x-7)\\)이 작은 원에 접한다는 조건은 무엇인가요?","hint":"중심 \\((0,1)\\)에서 직선까지의 거리를 반지름과 같게 둬요.","explanation":"직선을 \\(mx-y-7m=0\\)으로 쓰면 \\((0,1)\\)에서의 거리는 \\(|7m+1|/\\sqrt{m^2+1}\\)이에요. 이를 \\(\\sqrt5\\)와 같게 두고 제곱하면 \\((7m+1)^2=5(m^2+1)\\), 즉 \\(22m^2+7m-2=0\\)이에요. 두 접선의 기울기 곱은 이 이차방정식의 두 근의 곱이므로 \\(c=-2/22=-1/11\\)이에요. 따라서 \\(11(a+b+c)=11(8-1/11)=87\\)이에요.","check":{"prompt":"거리식을 제곱해도 두 접선을 모두 보존하나요?","answer":"원래 식 양변이 0 이상이고 절댓값을 포함하므로 제곱한 방정식의 두 실근은 모두 접선에 해당해요."}}],"takeaway":["두 공통접선 사이의 원 중심은 각의 이등분선 위에 있고 꼭짓점까지 거리는 반지름에 비례해요.","접선 기울기 두 개를 각각 풀지 않아도 이차방정식의 두 근의 곱으로 바로 구할 수 있어요."]};</script>
