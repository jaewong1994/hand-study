<script>window.HandStudyRecord={"itemId":16481,"sourceLabel":"2019 교육청 고3 수리나형 7월 21번","adminYear":2019,"grade":3,"month":7,"number":21,"track":"수리나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"좌표평면 위의 점 $(0,\\,t)\\,$를 지나고 곡선\n $y=x ^{3} -ax ^{2} +3x-5\\,$ ($a\\,$는 자연수)\n에 접하는 서로 다른 모든 직선의 개수를 $f \\left( t \\right) \\,$라 할 때, 함수 $f \\left( t \\right) \\,$에 대하여 합성함수 $g \\left( t \\right) = \\left( f \\circ f \\right) \\left( t \\right) \\,$라 하자. 다음 조건을 만족시키는 $a\\,$의 최솟값을 $m\\,$이라 할 때, $m+g \\left( m \\right) \\,$의 값은? [4점]\n(가) 모든 실수 $t\\,$에 대하여 $g \\left( t \\right) >1\\,$이다.\n(나) 함수 $g \\left( t \\right) \\,$의 치역의 원소의 개수는 $1\\,$이다.\n① $4$ ② $6$ ③ $8$ ④ $10$ ⑤ $12$","answer":"④","sourceHash":"4f405f5141cba46e7a268267844ca760b8e39b1c347c3da3f2edd35efd09c718","steps":[{"id":"s1","latex":"h(s)=-2s^3+as^2-5\\text{와 }y=t\\text{의 교점 수}=f(t)"},{"id":"s2","latex":"h'(s)=2s(a-3s)"},{"id":"s3","latex":"\\text{극솟값}=-5,\\quad\\text{극댓값}=\\frac{a^3}{27}-5"},{"id":"s4","latex":"f(1)=f(2)=f(3)=3\\Rightarrow\\frac{a^3}{27}-5>3"},{"id":"s5","latex":"a^3>216\\Rightarrow m=7"},{"id":"s6","latex":"f(7)=3\\Rightarrow g(7)=f(3)=3"},{"id":"s7","latex":"m+g(m)=10"}],"diagram":null,"contentHash":"dfa0ad059d685b29be4914c9af46c35f0ecb0c9aab2a7ee2454aca6c9e81a832","questionHtml":"<p class=\"hp\">좌표평면 위의 점 <span class=\"heq\">\\((0,\\,t)\\,\\)<\/span>를 지나고 곡선<\/p><p class=\"hp\">&emsp;<span class=\"heq\">\\(y=x^{3} -ax^{2} +3x-5\\,\\)<\/span> <span class=\"heq\">\\((\\,\\)<\/span><span class=\"heq\">\\(a\\,\\)<\/span>는 자연수<span class=\"heq\">\\(\\,)\\)<\/span><\/p><p class=\"hp\">에 접하는 서로 다른 모든 직선의 개수를 <span class=\"heq\">\\(f \\left( t \\right) \\,\\)<\/span>라 할 때, <br>함수 <span class=\"heq\">\\(f \\left( t \\right) \\,\\)<\/span>에 대하여 합성함수 <span class=\"heq\">\\(g \\left( t \\right) = \\left( f \\circ f \\right) \\left( t \\right) \\,\\)<\/span>라 하자. <br>다음 조건을 만족시키는 <span class=\"heq\">\\(a\\,\\)<\/span>의 최솟값을 <span class=\"heq\">\\(m\\,\\)<\/span>이라 할 때, <br><span class=\"heq\">\\(m+g \\left( m \\right) \\,\\)<\/span>의 값은? <span class=\"hscore\">[4점]<\/span><\/p><table class=\"htbl\"><tr><td colspan=\"3\" style=\"width:410px;border-top:1px solid #333;border-bottom:none;border-left:1px solid #333;border-right:1px solid #333\">&nbsp;<\/td><\/tr><tr><td style=\"width:7px;border-top:none;border-bottom:none;border-left:1px solid #333;border-right:none\">&nbsp;<\/td><td style=\"width:395px;border-top:none;border-bottom:none;border-left:none;border-right:none\"><p class=\"hp\">(가) 모든 실수 <span class=\"heq\">\\(t\\,\\)<\/span>에 대하여 <span class=\"heq\">\\(g \\left( t \\right) \\gt 1\\,\\)<\/span>이다.<\/p><p class=\"hp\">(나) 함수 <span class=\"heq\">\\(g \\left( t \\right) \\,\\)<\/span>의 치역의 원소의 개수는 <span class=\"heq\">\\(1\\,\\)<\/span>이다.<\/p><\/td><td style=\"width:7px;border-top:none;border-bottom:none;border-left:none;border-right:1px solid #333\">&nbsp;<\/td><\/tr><tr><td colspan=\"3\" style=\"width:410px;border-top:none;border-bottom:1px solid #333;border-left:1px solid #333;border-right:1px solid #333\">&nbsp;<\/td><\/tr><\/table><p class=\"hp\">① <span class=\"heq\">\\(4\\)<\/span>&emsp;② <span class=\"heq\">\\(6\\)<\/span>&emsp;③ <span class=\"heq\">\\(8\\)<\/span>&emsp;④ <span class=\"heq\">\\(10\\)<\/span>&emsp;⑤ <span class=\"heq\">\\(12\\)<\/span><\/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"17ba6b33019cf90c5400dd4aea76e1aac6cbdfeebf6330fd6fd5c34607447792"};</script>
<script>window.HandStudyGuide={"itemId":16481,"sourceHash":"4f405f5141cba46e7a268267844ca760b8e39b1c347c3da3f2edd35efd09c718","contentHash":"dfa0ad059d685b29be4914c9af46c35f0ecb0c9aab2a7ee2454aca6c9e81a832","overview":{"goal":"접점에 따른 접선의 \\(y\\)절편을 함수로 만들고, 수평선과의 교점 수로 \\(f\\)와 \\(g\\)를 분석해요.","firstLook":"점 \\((0,t)\\)를 지나는 접선은 \\(y\\)절편이 \\(t\\)예요. 접점을 \\(s\\)로 두고 접선의 절편을 계산하면 접선 개수 문제가 교점 개수 문제로 바뀌어요.","conditions":[{"label":"항상 1보다 큼","meaning":"\\(g(t)\\)가 상수 1이 되는 경우를 제외해요."},{"label":"치역 원소 하나","meaning":"\\(g(t)\\)는 모든 실수 \\(t\\)에서 같은 값을 가져야 해요."}]},"chapters":[{"id":"c1","label":"접선의 절편을 접점으로 나타내요","stepIds":["s1","s2","s3"],"question":"접선 개수는 왜 \\(h(s)=-2s^3+as^2-5\\)와 \\(y=t\\)의 교점 수일까요?","hint":"원래 곡선을 \\(F(x)\\)라 하고 접점 \\(s\\)에서 접선의 \\(y\\)절편 \\(F(s)-sF'(s)\\)를 계산해요.","explanation":"접점이 \\(s\\)인 접선의 \\(y\\)절편은 \\(F(s)-sF'(s)=-2s^3+as^2-5=h(s)\\)예요. 따라서 절편이 \\(t\\)인 접선 수는 \\(h(s)=t\\)의 서로 다른 실근 수와 같아요. \\(h'(s)=2s(a-3s)\\)이므로 \\(s=0\\)에서 극솟값 \\(-5\\), \\(s=a/3\\)에서 극댓값 \\(a^3/27-5\\)를 가져요.","check":{"prompt":"서로 다른 두 접점이 같은 접선을 만들 수 있나요?","answer":"삼차함수와 한 직선이 서로 다른 두 점에서 모두 접하면 두 접점에서 각각 인수 \\((x-s)^2\\)를 가져 전체 차수가 4 이상이어야 하므로 불가능해요."}},{"id":"c2","label":"합성함수가 같은 값을 갖는 조건을 바꿔요","stepIds":["s4","s5"],"question":"왜 \\(f(1)=f(2)=f(3)=3\\)이어야 할까요?","hint":"\\(h(s)=t\\)의 교점 수는 1, 2, 3 가운데 하나이므로 \\(f(t)\\)의 치역을 먼저 봐요.","explanation":"\\(-5\\)와 극댓값 사이에서는 \\(h(s)=t\\)가 세 근, 양 끝 높이에서는 두 근, 바깥에서는 한 근을 가져서 \\(f\\)의 치역은 \\(\\{1,2,3\\}\\)이에요. 따라서 \\(g(t)=f(f(t))\\)가 모든 \\(t\\)에서 같은 값이려면 \\(f(1),f(2),f(3)\\)이 같아야 해요. 그 공통값이 1이면 조건 (가)에 어긋나요. 공통값 2도 불가능해요. \\(f(t)=2\\)가 되는 높이는 극솟값 \\(-5\\)와 극댓값 두 개뿐인데, 서로 다른 세 높이 1, 2, 3이 모두 그 둘 중 하나일 수는 없기 때문이에요. 따라서 공통값은 3이어야 하고, \\(-5<1<2<3\\)이므로 세 높이가 모두 극댓값보다 아래에 있어야 해요. 곧 \\(a^3/27-5>3\\), 즉 \\(a^3>216\\)이에요. 자연수 \\(a\\)의 최솟값은 \\(m=7\\)이에요.","check":{"prompt":"극댓값이 정확히 3이면 왜 안 되나요?","answer":"\\(t=3\\)에서는 수평선이 극댓값에 닿아 교점이 두 개라 \\(f(3)=2\\)가 되고, \\(f(1)=f(2)=3\\)과 같지 않아요."}},{"id":"c3","label":"최솟값에서 합성함숫값을 계산해요","stepIds":["s6","s7"],"question":"\\(g(7)\\)은 어떻게 구할까요?","hint":"\\(a=7\\)일 때 극댓값이 7보다 큰지 확인한 뒤 \\(f(7)\\)과 \\(f(3)\\)을 차례로 구해요.","explanation":"\\(a=7\\)이면 극댓값은 \\(343/27-5=208/27\\)이고 \\(208/27>7\\)이에요. 따라서 \\(-5<7<208/27\\)이라 \\(f(7)=3\\)이에요. 또 \\(f(3)=3\\)이므로 \\(g(7)=f(f(7))=f(3)=3\\)이고, \\(m+g(m)=7+3=10\\)이에요. 정답은 ④예요.","check":{"prompt":"\\(f(7)=3\\)을 앞의 조건만 보고 바로 말하면 안 되는 이유는 무엇인가요?","answer":"\\(7\\)도 극댓값보다 작은지 실제로 확인해야 수평선 \\(y=7\\)이 세 번 만난다고 할 수 있어요."}}],"takeaway":["한 점을 지나는 접선 수는 접점에 따른 절편 함수를 만들어 수평선 교점 수로 바꿀 수 있어요.","합성함수의 안쪽 함수가 유한한 값만 가지면 그 값들을 바깥 함수에 직접 넣어 조건을 비교해요."]};</script>
