  <script>window.HandStudyRecord={"adminYear":2025,"answer":"130","contentHash":"3379fdfa0566c83f701553270eef281984e6d2d367c8cdac7e8fdab8ee1317b9","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24965,"month":11,"number":20,"points":4,"preview":false,"questionHtml":"\u003cp>수열 \u003cspan class=\"heq\">\\(\\left\\{a_{n} \\right\\}\\,\\)\u003c/span>이 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox hcond\">\u003cp>\u003cspan class=\"heq\">\\(a_{1}=7\\,\\)\u003c/span>\u003c/p>\u003cp>\u003cspan class=\"heq\">\\(2\\)\u003c/span> 이상의 자연수 \u003cspan class=\"heq\">\\(n\\,\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(\\sum_{k=1}^{n}a_{k}=\\frac{2}{3}a_{n}+\\frac{1}{6}n^{2}-\\frac{1}{6}n+10\\,\\)\u003c/span> 이다.\u003c/p>\u003c/div>\u003cp>다음은 \u003cspan class=\"heq\">\\(\\sum_{k=1}^{12}a_{k}+ \\sum_{k=1}^{5}a_{2k+1}\\,\\)\u003c/span>의 값을 구하는 과정이다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp>\u003cspan class=\"heq\">\\(2\\)\u003c/span> 이상의 자연수 \u003cspan class=\"heq\">\\(n\\,\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(a_{n+1}= \\sum_{k=1}^{n+1}a_{k}- \\sum_{k=1}^{n}a_{k}\\,\\)\u003c/span>이므로 \u003cspan class=\"heq\">\\(a_{n+1}=\\frac{2}{3} \\left(a_{n+1}-a_{n} \\right)+ \\boxed{\\, \\left(가 \\right)\\,}\\,\\)\u003c/span>이고, 이 식을 정리하면 \u003cspan class=\"heq\">\\(2a_{n}+a_{n+1}=3 \\times \\boxed{\\, \\left(가 \\right)\\,}\\,\\)\u003c/span> \u003cspan class=\"heq\">\\(\\cdots\\)\u003c/span>\u003cspan class=\"heq\">\\(\\cdots\\)\u003c/span> ㉠이다. \u003cspan class=\"heq\">\\(\\sum_{k=1}^{n}a_{k}=\\frac{2}{3}a_{n}+\\frac{1}{6}n^{2}-\\frac{1}{6}n+10\\, \\left(n \\geq 2 \\right)\\,\\)\u003c/span>에서 양변에 \u003cspan class=\"heq\">\\(n=2\\,\\)\u003c/span>를 대입하면 \u003cspan class=\"heq\">\\(a_{2}= \\boxed{\\, \\left(나 \\right)\\,}\\,\\)\u003c/span> \u003cspan class=\"heq\">\\(\\cdots\\)\u003c/span>\u003cspan class=\"heq\">\\(\\cdots\\)\u003c/span> ㉡이다. ㉠과 ㉡에 의하여 \u003cspan class=\"heq\">\\(\\sum_{k=1}^{12}a_{k}+ \\sum_{k=1}^{5}a_{2k+1}\\)\u003c/span>\u003cspan class=\"heq\">\\(=a_{1}+a_{2}+ \\sum_{k=1}^{5} \\left(2a_{2k+1}+a_{2k+2} \\right)\\)\u003c/span> \u003cspan class=\"heq\">\\(= \\boxed{\\, \\left(다 \\right)\\,}\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp>위의 (가)에 알맞은 식을 \u003cspan class=\"heq\">\\(f \\left(n \\right)\\,\\)\u003c/span>이라 하고, (나), (다)에 알맞은 수를 각각 \u003cspan class=\"heq\">\\(p\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(q\\,\\)\u003c/span>라 할 때, \u003cspan class=\"heq\">\\(\\frac{p \\times q}{f \\left(12 \\right)}\\,\\)\u003c/span>의 값을 구하시오. [4점]\u003c/p>","questionText":"수열 $\\left\\{a_{n} \\right\\}\\,$이 다음 조건을 만족시킨다.\n $a_{1}=7\\,$ $2$ 이상의 자연수 $n\\,$에 대하여 $\\sum_{k=1}^{n}a_{k}=\\frac{2}{3}a_{n}+\\frac{1}{6}n^{2}-\\frac{1}{6}n+10\\,$ 이다.\n다음은 $\\sum_{k=1}^{12}a_{k}+ \\sum_{k=1}^{5}a_{2k+1}\\,$의 값을 구하는 과정이다.\n$2$ 이상의 자연수 $n\\,$에 대하여 $a_{n+1}= \\sum_{k=1}^{n+1}a_{k}- \\sum_{k=1}^{n}a_{k}\\,$이므로 $a_{n+1}=\\frac{2}{3} \\left(a_{n+1}-a_{n} \\right)+ \\boxed{\\, \\left(가 \\right)\\,}\\,$이고, 이 식을 정리하면 $2a_{n}+a_{n+1}=3 \\times \\boxed{\\, \\left(가 \\right)\\,}\\,$ $\\cdots$$\\cdots$ ㉠이다. $\\sum_{k=1}^{n}a_{k}=\\frac{2}{3}a_{n}+\\frac{1}{6}n^{2}-\\frac{1}{6}n+10\\, \\left(n \\geq 2 \\right)\\,$에서 양변에 $n=2\\,$를 대입하면 $a_{2}= \\boxed{\\, \\left(나 \\right)\\,}\\,$ $\\cdots$$\\cdots$ ㉡이다. ㉠과 ㉡에 의하여 $\\sum_{k=1}^{12}a_{k}+ \\sum_{k=1}^{5}a_{2k+1}$$=a_{1}+a_{2}+ \\sum_{k=1}^{5} \\left(2a_{2k+1}+a_{2k+2} \\right)$ $= \\boxed{\\, \\left(다 \\right)\\,}$이다.\n위의 (가)에 알맞은 식을 $f \\left(n \\right)\\,$이라 하고, (나), (다)에 알맞은 수를 각각 $p\\,$, $q\\,$라 할 때, $\\frac{p \\times q}{f \\left(12 \\right)}\\,$의 값을 구하시오. [4점]","sourceHash":"da253c21c61dccd90f86ff956a28efafe292c359e0da2bc8d8d781914f3f2cd5","sourceKind":"csat","sourceLabel":"2025년 시행 수능 · 2026학년도 · 공통 · 20번","steps":[{"id":"s1","latex":"S_n=\\sum_{k=1}^{n}a_k=\\frac23a_n+\\frac16n^{2}-\\frac16n+10\\quad(n\\ge2)"},{"explanation":{"body":"\\(a_{n+1}=S_{n+1}-S_n\\)을 이용합니다. 주어진 식을 \\(n+1\\)과 \\(n\\)에 각각 쓴 뒤 빼면 상수 10은 사라지고, 이차식의 차에서 \\(n/3\\)만 남습니다.","skillTags":["부분합","차분"],"title":"부분합 조건에서 한 항 꺼내기"},"id":"s2","latex":"S_{n+1}-S_n=a_{n+1}=\\frac23(a_{n+1}-a_n)+\\frac n3"},{"id":"s3","latex":"f(n)=\\frac n3,\\qquad 2a_n+a_{n+1}=n\\quad(n\\ge2)"},{"id":"s4","latex":"n=2\\text{를 원래 합의 식에 대입하면 }7+a_2=\\frac23a_2+\\frac13+10"},{"id":"s5","latex":"p=a_2=10"},{"id":"s6","latex":"2a_{2k+1}+a_{2k+2}=2k+1"},{"id":"s7","latex":"q=a_1+a_2+\\sum_{k=1}^{5}(2a_{2k+1}+a_{2k+2})=17+\\sum_{k=1}^{5}(2k+1)=52"},{"id":"s8","latex":"f(12)=4\\Rightarrow \\frac{pq}{f(12)}=\\frac{10\\cdot52}{4}=130"},{"id":"s9","latex":"\\therefore\\ \\boxed{130}"}],"track":"공통"};</script>
