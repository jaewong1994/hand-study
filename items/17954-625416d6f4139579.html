pExplanations":{"s1":{"body":"\\(2nx=x^2+n^2-1\\)을 정리하면 \\((x-n)^2=1\\)이므로 두 교점의 \\(x\\)좌표는 \\(n-1\\), \\(n+1\\)이에요. 같은 직선 위에 있으므로 \\(y\\)좌표 차는 \\(2n\\cdot2=4n\\)이고, 두 점 사이 거리는 \\(\\sqrt{2^2+(4n)^2}=2\\sqrt{4n^2+1}\\)이에요.","skillTags":["algebra.calculation","geometry.reasoning"],"title":"두 교점의 x좌표 차부터 구해요"},"s2":{"body":"삼각형의 밑변을 \\(A_nB_n\\)으로 잡으면 넓이는 점 \\(P\\)에서 직선 \\(2nx-y=0\\)까지의 거리에 비례해요. 원의 중심 \\((2,0)\\)에서 이 직선까지의 거리는 \\(\\frac{4n}{\\sqrt{4n^2+1}}\\)이에요. 원의 반지름은 1이므로, 중심에서 직선과 수직인 방향으로 직선에서 멀어지는 원 위의 점을 고르면 거리가 중심의 거리보다 정확히 1 커져요. 이것이 가능한 가장 큰 높이 \\(h_n\\)이에요.","skillTags":["geometry.reasoning","algebra.calculation"],"title":"밑변은 고정하고 높이를 가장 크게 만들어요"},"s4":{"body":"\\(S_n=\\frac12\\cdot2\\sqrt{4n^2+1}\\cdot(\\frac{4n}{\\sqrt{4n^2+1}}+1)=4n+\\sqrt{4n^2+1}\\)이에요. \\(n>0\\)이므로 \\(\\frac{S_n}n=4+\\sqrt{4+\\frac1{n^2}}\\)이고, \\(n\\to\\infty\\)일 때 \\(4+2=6\\)으로 가요.","skillTags":["algebra.calculation","calculus.limit"],"title":"n으로 나눈 뒤 양수인 n을 근호 밖으로 꺼내요"}},"steps":[{"id":"s1","latex":"A_nB_n=2\\sqrt{4n^2+1}"},{"id":"s2","latex":"\\text{높이의 최댓값을 }h_n\\text{이라 하면}\\quad h_n=\\dfrac{4n}{\\sqrt{4n^2+1}}+1"},{"id":"s3","latex":"S_n=4n+\\sqrt{4n^2+1}"},{"id":"s4","latex":"\\lim S_n/n=\\boxed6"}],"track":"미적분"};</script>
