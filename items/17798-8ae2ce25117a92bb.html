<script>window.HandStudyGuide={"itemId":17798,"sourceHash":"d7748d221d4b9054e8d04a3f89eacef11850ca699f2fe50f127e3603fc72d0c4","contentHash":"72904c805e827e527eb23fae6d9b78a23e6a6b23402cb3d1dda3618aca96d524","overview":{"goal":"절댓값 안의 적분함수가 0이 되는 곳에서 미분가능하려면 어떤 조건이 필요한지 따져 \\(a\\)의 가장 작은 값을 구해요.","firstLook":"\\(g(x)=|G(x)|\\)로 보면 핵심은 \\(G\\)의 부호예요. \\(G=0\\)인 점에서 기울기가 0이 아니면 절댓값 그래프에 뾰족한 점이 생겨요.","conditions":[{"label":"적분의 아랫끝에서 값이 영","meaning":"\\(G(-a\\pi)=0\\)이므로 그 점에서 \\(G'=f\\)도 0이어야 해요."},{"label":"음의 구간에서 음이 아닌 함수","meaning":"아랫끝부터 0까지 \\(G\\)가 감소하지 않고, \\(G(0)\\)을 주기별 넓이로 계산할 수 있어요."},{"label":"음이 아닌 구간의 사인함수","meaning":"\\(G\\)의 가장 작은 값을 구해 음수가 되는 경우를 막아요."}]},"chapters":[{"id":"c1","label":"첫 영점에서 필요한 조건 찾기","stepIds":["s1","s2"],"question":"\\(G(-a\\pi)=0\\)에서 \\(G'(-a\\pi)\\ne0\\)이면 \\(|G|\\)의 좌우 기울기는 어떻게 될까요?","hint":"절댓값은 영점을 지나며 부호가 바뀌는 그래프의 한쪽을 위로 접어요.","explanation":"\\(G(x)=\\int_{-a\\pi}^x f(t)\\,dt\\)로 두면 \\(g(x)=|G(x)|\\)이고 \\(G'(x)=f(x)\\)예요. 아랫끝에서는 \\(G(-a\\pi)=0\\)이에요. 여기서 \\(G'\\)가 0이 아니면 \\(G\\)가 영점을 가로지르고, 절댓값을 씌운 그래프의 좌우 기울기가 서로 반대가 되어 미분할 수 없어요. 따라서 \\(f(-a\\pi)=0\\)이어야 해요. \\(-a\\pi<0\\)이므로 \\(f(-a\\pi)=2|\\sin(-4a\\pi)|\\), 따라서 \\(\\sin(4a\\pi)=0\\)이고 \\(4a\\)는 정수예요.","check":{"prompt":"절댓값 안의 함수가 0이라는 사실만으로 미분가능성이 보장되나요?","answer":"아니요. 그 점에서 안쪽 함수의 미분계수도 0인지 확인해야 해요."}},{"id":"c2","label":"적분함수의 값과 가장 낮은 위치 구하기","stepIds":["s3","s4","s5"],"question":"0의 왼쪽에서 쌓인 넓이는 얼마이고, 0의 오른쪽에서 그 값은 얼마나 내려갈 수 있을까요?","hint":"\\(4a\\)가 정수이므로 \\(|\\sin u|\\)의 길이 \\(\\pi\\)짜리 구간이 정확히 \\(4a\\)개 들어가요.","explanation":"\\(x<0\\)에서는 \\(f(x)=2|\\sin4x|\\ge0\\)이므로 \\(G\\)는 아랫끝에서 0으로 갈수록 증가해요. \\(u=4t\\)로 바꾸면 \\(G(0)=\\frac12\\int_{-4a\\pi}^0|\\sin u|\\,du\\)예요. 길이 \\(\\pi\\)인 구간마다 \\(|\\sin u|\\)의 적분은 2이고 그런 구간이 \\(4a\\)개 있으므로 \\(G(0)=4a\\)예요.\n\n\\(x\\ge0\\)에서는 \\(f(x)=-\\sin(ax)\\)이므로 \\(G(x)=4a+\\int_0^x-\\sin(at)\\,dt=4a+\\frac{\\cos(ax)-1}{a}\\)예요. \\(-1\\le\\cos(ax)\\le1\\)이므로 가장 작은 값은 \\(\\cos(ax)=-1\\)일 때의 \\(4a-\\frac2a\\)예요.","check":{"prompt":"\\(G(0)=4a\\) 계산에서 \\(4a\\)가 정수라는 조건은 어디에 쓰였나요?","answer":"적분 구간을 \\(|\\sin u|\\)의 반주기인 길이 \\(\\pi\\) 구간 \\(4a\\)개로 정확히 나누는 데 쓰였어요."}},{"id":"c3","label":"부호 조건과 가능한 값 결합하기","stepIds":["s6","s7"],"question":"\\(G\\)가 오른쪽에서 음수가 되면 왜 \\(|G|\\)가 반드시 미분할 수 없는 영점을 만들까요?","hint":"처음에는 \\(G(0)>0\\)이고, 내려가며 0을 지나는 점에서는 \\(G'=f\\)가 0인지 살펴보세요.","explanation":"\\(G(0)=4a>0\\)인데 가장 작은 값이 음수라면 내려가는 중간에 \\(G=0\\)인 점이 생겨요. 그 점은 \\(\\cos(ax)=-1\\)인 최저점보다 앞에 있으므로 \\(\\sin(ax)\\ne0\\), 즉 \\(G'(x)=-\\sin(ax)\\ne0\\)이에요. 그러면 \\(|G|\\)는 그 영점에서 미분할 수 없어요. 반대로 \\(4a-\\frac2a\\ge0\\)이면 \\(G\\)는 음수가 되지 않고, 0이 되는 경우에도 최저점이라 \\(G'=0\\)이어서 문제가 없어요. 따라서 \\(a^2\\ge\\frac12\\)예요.\n\n이제 \\(4a\\)가 양의 정수이고 \\(a\\ge1/\\sqrt2\\), \\(a<2\\)를 함께 만족해야 해요. \\(a\\)는 \\(1/4\\)의 양의 정수배이고 \\(1/4,1/2\\)는 너무 작아요. 처음 가능한 값은 \\(3/4\\)이므로 정답은 ②예요.","check":{"prompt":"\\(a=1/2\\)가 탈락하는 조건은 무엇인가요?","answer":"\\(a^2=1/4<1/2\\)라서 \\(G\\)의 가장 작은 값이 음수가 되고, 기울기가 0이 아닌 영점이 생겨요."}}],"takeaway":["절댓값을 씌운 함수는 안쪽 함수의 영점과 그 점의 기울기를 함께 확인해요.","적분함수의 부호를 지키려면 시작값과 이후 감소할 수 있는 최대량을 비교해요.","연속적인 부등식 조건과 정수배 조건을 마지막에 함께 적용해요."]};</script>
