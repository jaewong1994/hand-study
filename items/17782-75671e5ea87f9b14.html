<script>window.HandStudyRecord={"itemId":17782,"sourceLabel":"2023 평가원 고3 수학기하 9월 30번","adminYear":2023,"grade":3,"month":9,"number":30,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"좌표평면에서 ${\\overline{ AB }} = {\\overline{ AC }}$이고 $\\angle BAC = \\frac{\\pi }{2}$인 직각삼각형 $ABC$에 대하여 두 점 $P$, $Q$가 다음 조건을 만족시킨다.\n (가) 삼각형 $APQ$는 정삼각형이고, $9 \\left| {\\vec{ PQ }} \\right| {\\vec{ PQ }} =4 \\left| {\\vec{ AB }} \\right| {\\vec{ AB }}$이다.\n(나) ${\\vec{ AC }}  \\cdot  {\\vec{ AQ }} <0$\n(다) ${\\vec{ PQ }}  \\cdot  {\\vec{ CB }} =24$\n선분 $AQ$ 위의 점 $X$에 대하여 $\\left| {\\vec{ XA }} + {\\vec{ XB }} \\right|$ 의 최솟값을 $m$이라 할 때, $m^{2}$의 값을 구하시오. [4점]","answer":"27","sourceHash":"bd116213ca929a20d51c4a370c670efbd9791ceacc1440e296c080fd41a1fc39","steps":[{"id":"s1","latex":"\\overrightarrow{AB}\\perp\\overrightarrow{AC},\\ |AB|=|AC|=6"},{"id":"s2","latex":"P=(-2,-2\\sqrt3),\\ Q=(2,-2\\sqrt3)"},{"id":"s3","latex":"M=\\dfrac{A+B}{2}=(3,0)"},{"id":"s4","latex":"m=3\\sqrt3"},{"id":"s5","latex":"m^2=\\boxed{27}"}],"diagram":null,"contentHash":"3c130b56cb2415a791d67f54f04ec91d52229daebae0ee16cbaae8afcd13f3ef","questionHtml":"<p class=\"hp htall\">좌표평면에서 <span class=\"heq\">\\({\\overline{AB }} = {\\overline{AC }}\\)<\/span>이고 <span class=\"heq\">\\(\\angle BAC = \\dfrac{\\pi }{2}\\)<\/span>인 직각삼각형 <span class=\"heq\">\\({{ABC}}\\)<\/span>에 대하여 두 점 <span class=\"heq\">\\({{P}}\\)<\/span>, <span class=\"heq\">\\({{Q}}\\)<\/span>가 다음 조건을 만족시킨다.<\/p><div class=\"hbox\"><p class=\"hp\">(가) 삼각형 <span class=\"heq\">\\({{APQ}}\\)<\/span>는 정삼각형이고, <span class=\"heq\">\\(9 \\left| {\\overrightarrow{PQ}} \\right| {\\overrightarrow{PQ}} =4 \\left| {\\overrightarrow{AB}} \\right| {\\overrightarrow{AB}}\\)<\/span>이다.<\/p><p class=\"hp\">(나) <span class=\"heq\">\\({\\overrightarrow{AC}}  \\cdot  {\\overrightarrow{AQ}} \\lt 0\\)<\/span><\/p><p class=\"hp\">(다) <span class=\"heq\">\\({\\overrightarrow{PQ}}  \\cdot  {\\overrightarrow{CB}} =24\\)<\/span><\/p><\/div><p class=\"h <script>window.HandStudyGuide={"itemId":17782,"sourceHash":"bd116213ca929a20d51c4a370c670efbd9791ceacc1440e296c080fd41a1fc39","contentHash":"3c130b56cb2415a791d67f54f04ec91d52229daebae0ee16cbaae8afcd13f3ef","overview":{"goal":"벡터의 크기와 방향 조건으로 삼각형의 길이와 점 \\(Q\\)를 정한 뒤, 선분까지의 최단거리를 구해요.","firstLook":"두 벡터 등식의 방향은 \\(PQ\\parallel AB\\), 크기는 \\(PQ=2AB/3\\)을 뜻해요.","conditions":[{"label":"직각이등변","meaning":"\\(AB=AC\\), \\(AB\\perp AC\\)예요."},{"label":"정삼각형","meaning":"\\(AP=AQ=PQ\\)이고 방향 조건이 두 배치를 하나로 골라요."}]},"chapters":[{"id":"c1","label":"기준 길이와 좌표를 정해요","stepIds":["s1","s2"],"question":"\\(AB\\)의 길이와 점 \\(Q\\)는 어떻게 정해지나요?","hint":"\\(PQ=d\\), \\(AB=L\\)로 놓고 두 벡터 조건의 크기를 비교해요.","explanation":"첫 벡터식의 크기를 비교하면 \\(9d^2=4L^2\\), 즉 \\(d=2L/3\\)이에요. 또 \\(PQ\\)와 \\(AB\\)는 같은 방향이에요. \\(AC\\perp AB\\), \\(PQ\\cdot CB=24\\)에서 \\(dL=24\\)이므로 \\(2L^2/3=24\\), \\(L=6,d=4\\)예요. \\(A=(0,0),B=(6,0),C=(0,6)\\)로 놓고 \\(AC\\cdot AQ<0\\)인 정삼각형 배치를 택하면 \\(Q=(2,-2\\sqrt3)\\), \\(P=(-2,-2\\sqrt3)\\)로 둘 수 있어요.","check":{"prompt":"반대쪽 정삼각형 배치를 제외하는 조건은 무엇인가요?","answer":"\\(AC\\cdot AQ<0\\)이에요."}},{"id":"c2","label":"벡터합을 중점거리로 바꿔요","stepIds":["s3"],"question":"\\(|XA+XB|\\)는 어떤 거리의 두 배인가요?","hint":"\\(AB\\)의 중점을 \\(M\\)이라 하세요.","explanation":"\\(M=(A+B)/2=(3,0)\\)라 하면 \\(XA+XB=(A-X)+(B-X)=2(M-X)=2XM\\)이에요. 따라서 문제는 선분 \\(AQ\\) 위의 점 \\(X\\)에서 고정점 \\(M\\)까지 거리의 최솟값을 구하는 문제예요.","check":{"prompt":"벡터합의 크기는 무엇과 같나요?","answer":"\\(2|XM|\\)과 같아요."}},{"id":"c3","label":"수선의 발이 선분 안인지 확인해요","stepIds":["s4","s5"],"question":"최솟값의 제곱은 얼마인가요?","hint":"점 \\(M\\)에서 직선 \\(AQ\\)까지 거리를 구하고 투영비를 확인해요.","explanation":"\\(AQ=(2,-2\\sqrt3)\\), \\(AM=(3,0)\\)이므로 직선까지 거리는 \\(|AM\\times AQ|/|AQ|=6\\sqrt3/4=3\\sqrt3/2\\)예요. 수선의 발 매개변수는 \\(AM\\cdot AQ/|AQ|^2=6/16=3/8\\)로 \\(0\\)과 \\(1\\) 사이여서 실제로 선분 \\(AQ\\) 안에 있어요. 따라서 \\(m=2\\cdot3\\sqrt3/2=3\\sqrt3\\), \\(m^2=27\\)이에요.","check":{"prompt":"직선이 아니라 선분까지 거리로 써도 되는 이유는 무엇인가요?","answer":"수선의 발의 비 \\(3/8\\)이 선분 내부 범위에 있기 때문이에요."}}],"takeaway":["크기가 곱해진 벡터식은 방향과 크기 관계를 따로 읽어요.","두 점으로 향하는 벡터의 합은 그 두 점의 중점으로 향하는 벡터의 두 배예요.","선분 위 최단거리는 수선의 발이 선분 안에 있는지 반드시 확인해요."]};</script>
