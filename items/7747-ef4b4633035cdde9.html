<script>window.HandStudyRecord={"itemId":7747,"sourceLabel":"2019 교육청 고2 수학가형 11월 30번","adminYear":2019,"grade":2,"month":11,"number":30,"track":"수학가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"두 정수 $l$, $m$에 대하여 두 등차수열 $\\left\\{ a _{n} \\right\\}$, $\\left\\{ b _{n} \\right\\}$의 일반항이 \n $a _{n} =12+ \\left( n-1 \\right) l$, \n $b _{n} =-10+ \\left( n-1 \\right) m$\n일 때,\n $\\sum _{k=1} ^{10} \\left| a _{k} +b _{k} \\right| = \\sum _{k=1} ^{10} \\left( \\left| a _{k} \\right| - \\left| b _{k} \\right| \\right) =31$\n을 만족시키는 모든 순서쌍 $\\left( \\,l,\\,m \\right)$의 개수를 구하시오. [4점]","answer":"7","sourceHash":"0d3b7580524e8416cf1f0158f5ef8004ffad45cea953c4548befe30b983be982","steps":[{"id":"s1","latex":"s=l+m,\\qquad\\sum_{j=0}^{9}|2+js|=31"},{"id":"s2","latex":"s\\ge0\\Rightarrow20+45s\\ne31,\\qquad s=-r\u003c0"},{"id":"s3","latex":"r=1\\Rightarrow\\sum_{j=0}^{9}|2-j|=31,\\qquad r\\ge2\\Rightarrow45r-16\\ge74"},{"id":"s4","latex":"l+m=-1,\\qquad m=-l-1"},{"id":"s5","latex":"\\sum_{k=1}^{10}(|a_k|-|b_k|)=\\begin{cases}29&l\\le-12\\\\31&-11\\le l\\le-5\\\\29&l=-4\\\\25&l=-3\\\\-1&l=-2\\\\-25&l\\ge-1\\end{cases}"},{"id":"s6","latex":"l=-11,-10,\\ldots,-5\\Rightarrow\\#(l,m)=7"}],"diagram":null,"contentHash":"dd958ccb96e5cc0b2d8aa99d9995f9021b2615bcb884da47d96041ac353bfbfb","questionHtml":"\u003cp class=\"hp\">두 정수 \u003cspan class=\"heq\">\\(l\\)\u003c/span>, \u003cspan class=\"heq\">\\(m\\)\u003c/span>에 대하여 두 등차수열 \u003cspan class=\"heq\">\\(\\left\\{ a_{n} \\right\\}\\)\u003c/span>, \u003cspan class=\"heq\">\\(\\left\\{ b_{n} \\right\\}\\)\u003c/span>의 일반항이\u003c/p>\u003cp class=\"hp\">&emsp;\u003cspan class=\"heq\">\\(a_{n} =12+ \\left( n-1 \\right) l\\)\u003c/span>,\u003c/p>\u003cp class=\"hp\">&emsp;\u003cspan class=\"heq\">\\(b_{n} =-10+ \\left( n-1 \\right) m\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">일 때,\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\(\\sum\\limits_{k=1}^{10} \\left| a_{k} +b_{k} \\right| = \\sum\\limits_{k=1}^{10} \\left( \\left| a_{k} \\right| - \\left| b_{k} \\right| \\right) =31\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">을 만족시키는 모든 순서쌍 \u003cspan class=\"heq\">\\(\\left( \\,l,\\,m \\right)\\)\u003c/span>의 개수를 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"ef4b4633035cdde9a64272ec50a0935dbac00f9c7313082eb8047420541588f1"};</script>
<script>window.HandStudyGuide={"itemId":7747,"sourceHash":"0d3b7580524e8416cf1f0158f5ef8004ffad45cea953c4548befe30b983be982","contentHash":"dd958ccb96e5cc0b2d8aa99d9995f9021b2615bcb884da47d96041ac353bfbfb","overview":{"goal":"두 절댓값 합 조건으로 공차의 합을 먼저 정하고, 남은 정수 공차를 부호 변화에 따라 분류해 순서쌍을 세어요.","firstLook":"첫 번째 합에는 \\(a_k+b_k\\)만 나오므로 \\(l+m\\)을 한 문자로 묶을 수 있어요. 그 값이 정해진 뒤 두 번째 합에서 \\(l\\)의 가능한 구간을 찾으면 돼요.","conditions":[{"label":"정수 공차","meaning":"\\(l,m\\)은 정수이므로 절댓값 안의 등차수열이 부호를 바꾸는 위치를 정수 구간별로 나눌 수 있어요."},{"label":"같은 합","meaning":"두 절댓값 합이 각각 31과 같으므로 첫 번째 식과 두 번째 식을 차례로 독립적으로 사용해요."},{"label":"열 개 항","meaning":"합의 번호를 \\(j=k-1\\)로 바꾸면 \\(j=0,1,\\ldots,9\\)예요."}]},"chapters":[{"id":"c1","label":"첫 번째 합으로 공차의 합을 정해요","stepIds":["s1","s2","s3"],"question":"왜 \\(l+m=-1\\)만 가능할까요?","hint":"\\(s=l+m\\)라 두면 \\(a_k+b_k=2+(k-1)s\\)예요. \\(s\\ge0\\)과 \\(s<0\\)을 나누어 봐요.","explanation":"\\(j=k-1\\)라 두면 \\(a_k+b_k=2+j(l+m)\\)이므로 \\(s=l+m\\)에 대하여 \\(\\sum_{j=0}^{9}|2+js|=31\\)이에요.\n\n\\(s\\ge0\\)이면 모든 항이 음이 아니어서 합은 \\(20+45s\\)예요. 정수 \\(s\\)에 대해 이것이 \\(31\\)일 수는 없어요. 이제 \\(s=-r<0\\), \\(r\\)은 자연수라 두어요. \\(r=1\\)이면 값들이 \\(2,1,0,-1,\\ldots,-7\\)이므로 절댓값 합은 \\(2+1+(1+2+\\cdots+7)=31\\)이에요. \\(r\\ge2\\)이면 \\(j\\ge1\\)에서 \\(2-jr\\le0\\)이므로 합은 \\(2+\\sum_{j=1}^{9}(jr-2)=45r-16\\ge74\\)예요. 따라서 오직 \\(s=-1\\), 즉 \\(l+m=-1\\)만 가능해요.","check":{"prompt":"\\(r=1\\)일 때 음수가 되는 항들의 절댓값 합은 얼마인가요?","answer":"\\(j=3,\\ldots,9\\)에서 절댓값이 \\(1,2,\\ldots,7\\)이므로 합은 \\(28\\)이고, 앞의 \\(2+1\\)을 더하면 \\(31\\)이에요."}},{"id":"c2","label":"두 번째 합을 l 하나의 식으로 바꿔요","stepIds":["s4","s5"],"question":"\\(m=-l-1\\)을 넣은 뒤 합이 \\(31\\)인 \\(l\\)의 범위는 어떻게 찾을까요?","hint":"각 항이 0을 지나는 정수 지점을 기준으로 나누고, 같은 구간에서는 절댓값을 같은 부호로 풀어요.","explanation":"\\(m=-l-1\\)이므로 \\(a_{j+1}=12+jl\\), \\(b_{j+1}=-10-j(l+1)\\)예요. 따라서 조사할 합은\n\\[\n\\sum_{j=0}^{9}\\bigl(|12+jl|-|10+j(l+1)|\\bigr)\n\\]\n이에요. \\(j=0\\)인 항의 차는 늘 \\(12-10=2\\)이고, 나머지 항은 \\(12+jl\\)과 \\(10+j(l+1)\\)의 부호가 바뀌는 정수 \\(l\\)에서만 식이 달라져요.\n\n그 경계들을 따라 정리하면 \\(l\\le-12\\)에서 \\(29\\), \\(-11\\le l\\le-5\\)에서 \\(31\\), \\(l=-4\\)에서 \\(29\\), \\(l=-3\\)에서 \\(25\\), \\(l=-2\\)에서 \\(-1\\), \\(l\\ge-1\\)에서 \\(-25\\)예요. 가운데 범위의 값이 일정한 까닭도 직접 볼 수 있어요. 예를 들어 \\(l=-5\\)이면 \\((a_k)\\)는 \\(12,7,2,-3,\\ldots,-33\\), \\((b_k)\\)는 \\(-10,-6,-2,2,\\ldots,26\\)이어서 절댓값 합의 차가 \\(147-116=31\\)이에요. 경계의 다른 쪽인 \\(l=-4\\)에서는 그 차가 \\(29\\)로 달라져요.","check":{"prompt":"합이 \\(31\\)인 구간의 양 끝에서 확인해야 할 정수는 무엇인가요?","answer":"\\(l=-11\\)과 \\(l=-5\\)를 확인하고, 바로 바깥의 \\(l=-12,-4\\)에서 값이 \\(31\\)이 아님을 확인해요."}},{"id":"c3","label":"정수 l을 세고 m을 짝지어요","stepIds":["s6"],"question":"가능한 각 l은 서로 다른 순서쌍을 몇 개 만들까요?","hint":"\\(m=-l-1\\)이므로 \\(l\\) 하나마다 \\(m\\)이 하나씩 정해져요.","explanation":"두 번째 합이 \\(31\\)인 정수는 \\(l=-11,-10,\\ldots,-5\\)예요. 정수의 개수는 \\((-5)-(-11)+1=7\\)이에요. 각 값에 대해 \\(m=-l-1\\)이 하나씩 정해지므로 서로 다른 순서쌍도 \\(7\\)개예요. 실제 양 끝은 \\((-11,10)\\), \\((-5,4)\\)이고 모두 \\(l+m=-1\\)을 만족해요.","check":{"prompt":"\\(l=-8\\)일 때 대응하는 \\(m\\)은 얼마인가요?","answer":"\\(m=-(-8)-1=7\\)이고, 두 수의 합은 \\(-1\\)이에요."}}],"takeaway":["두 수열의 합만 들어간 조건에서는 공차의 합을 먼저 묶어 변수 수를 줄여요.","절댓값 합은 내부 식이 0을 지나는 지점을 경계로 나누고 각 구간에서 부호를 고정해 계산해요.","하나의 변수가 다른 변수를 하나로 정하면 가능한 정수의 개수가 곧 순서쌍의 개수예요."]};</script>
