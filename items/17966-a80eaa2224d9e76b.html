<script>window.HandStudyGuide={"itemId":17966,"sourceHash":"211ff0c609d3cea62c67a2ea019ff4a7aac5afc819204231a4f834df76a7c67d","contentHash":"355f0ced3b94f39bbd1a0e60ff8d178e8fb1ce2f43c05c7e2c81911f3b415857","overview":{"goal":"곱의 연속성을 이용해 원래 함수의 불연속점과 영점이 어떻게 짝지어지는지 찾아요.","firstLook":"곱이 연속이려면 한 인수가 뛰는 곳에서 다른 인수의 값이 \\(0\\)이어야 해요.","conditions":[{"label":"자연수 경계","meaning":"\\(1\\le a<b<8\\)이에요."},{"label":"부호 조건","meaning":"마지막에 \\(f(k)<0\\)을 만족하는 후보만 남겨요."}]},"chapters":[{"id":"c1","label":"불연속점과 영점을 먼저 찾어요","stepIds":["s1"],"question":"곱의 연속성을 검사할 핵심 지점은 어디인가요?","hint":"조각식이 바뀌는 점과 각 조각의 영점을 구해요.","explanation":"\\(f\\)는 경계 \\(a,b\\)에서 식이 바뀌므로 이 두 곳이 불연속점 후보예요. 세 조각을 각각 \\(0\\)과 같게 놓으면 첫 조각에서 \\(x=-4,-2\\), 가운데에서 \\(x=10\\), 마지막에서 \\(x=8,10\\)이 나오고 실제 구간에 속하는 것을 모으면 영점은 \\(-4,-2,8,10\\)이에요. 곱 \\(f(x)f(x+k)\\)에서는 \\(f(x)\\)가 뛰는 \\(a,b\\)뿐 아니라 \\(f(x+k)\\)가 뛰는 \\(a-k,b-k\\)도 살펴야 해요.","check":{"prompt":"둘째 인수가 불연속인 \\(x\\)값은 무엇인가요?","answer":"\\(x=a-k,b-k\\)예요."}},{"id":"c2","label":"네 불연속점이 다를 때를 제외해요","stepIds":["s2","s3","s4"],"question":"\\(k\\ne b-a\\)인 경우는 왜 탈락하나요?","hint":"각 점에서 뛰지 않는 다른 인수가 \\(0\\)이어야 해요.","explanation":"\\(k\\ne b-a\\)이면 두 인수의 불연속점이 서로 겹쳐 상쇄되는 특별한 경우가 없어요. 그래서 \\(x=a,b\\)에서는 각각 \\(f(a+k)=f(b+k)=0\\), \\(x=a-k,b-k\\)에서는 \\(f(a-k)=f(b-k)=0\\)이어야 해요. 두 점의 차가 모두 \\(b-a\\)인 영점쌍을 찾으면 오른쪽은 \\((8,10)\\), 왼쪽은 \\((-4,-2)\\)여서 \\(b-a=2\\)이고, 식을 풀면 \\((a,b,k)=(2,4,6)\\)이에요. 하지만 이때 \\(f(6)=6-10=-4\\)가 아니라 구간을 다시 보면 \\(a\\le6\\)이고 \\(6<b\\)가 거짓이어서 마지막 조각 \\(|6-9|-1=2\\)를 써야 해 \\(f(6)=2>0\\)이에요. 조건 (나)에 어긋나므로 반드시 \\(k=b-a\\)예요.","check":{"prompt":"후보에서 \\(f(6)\\)에 어느 조각을 써야 하나요?","answer":"\\(b=4\\)이므로 \\(6\\ge b\\), 마지막 조각을 써서 \\(2\\)예요."}},{"id":"c3","label":"겹친 불연속점의 양옆을 맞춰요","stepIds":["s5","s6","s7"],"question":"\\(k=b-a\\)일 때 어떤 영점 조건이 남나요?","hint":"겹치지 않은 바깥쪽 불연속점 \\(a-k,b\\)를 먼저 봐요.","explanation":"\\(k=b-a\\)이면 \\(a=b-k\\)에서 두 인수의 경계가 겹쳐요. 나머지 경계에서는 다른 인수가 \\(0\\)이어야 하므로 \\(f(2a-b)=0\\), \\(f(2b-a)=0\\)이에요. 앞의 점은 \\(-4,-2\\), 뒤의 점은 \\(8,10\\) 중 하나이고 자연수 범위를 함께 대입하면 \\((a,b,k)=(2,6,4)\\)만 남아요. 겹친 점 \\(x=a\\)도 자동으로 넘기면 안 돼요. 왼쪽 곱은 \\(f(a-)f(b-)=4\\cdot(-4)=-16\\), 오른쪽 값은 \\(f(a)f(b)=(-8)\\cdot2=-16\\)이라 실제로 이어져요.","check":{"prompt":"겹친 경계에서 좌우 곱은 각각 얼마인가요?","answer":"둘 다 \\(-16\\)이에요."}},{"id":"c4","label":"요구한 곱을 계산해요","stepIds":["s8"],"question":"\\(f(a)f(b)f(k)\\)는 얼마인가요?","hint":"\\((a,b,k)=(2,6,4)\\)를 각 구간에 맞게 대입해요.","explanation":"\\(f(2)=2-10=-8\\), \\(f(6)=|6-9|-1=2\\), \\(f(4)=4-10=-6\\)이에요. 특히 \\(f(k)=-6<0\\)이라 부호 조건도 만족해요. 따라서 \\(f(a)f(b)f(k)=(-8)\\cdot2\\cdot(-6)=96\\)이에요.","check":{"prompt":"마지막 후보가 조건 (나)를 만족하나요?","answer":"\\(f(k)=f(4)=-6<0\\)이라 만족해요."}}],"takeaway":["곱의 연속성은 한 인수의 점프를 다른 인수의 영점으로 막는 구조예요.","두 불연속점이 겹치는 경우를 따로 나누고 실제 좌우 곱을 확인해요.","조각함수 대입에서는 경계와 구간을 먼저 확인해요."]};</script>
