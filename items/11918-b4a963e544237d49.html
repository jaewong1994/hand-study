  <script>window.HandStudyRecord={"itemId":11918,"sourceLabel":"2023 교육청 고1 수학 12월 19번","adminYear":2023,"grade":1,"month":12,"number":19,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 함수 $f \\left(x \\right)= \\sqrt{x-2}$와 그 역함수 $f^{\\,-1} \\left(x \\right)$에 대하여 기울기가 $-1$인 직선 $l$이 곡선 $y=f(x)$와 점 ${{P}}$에서 만나고 직선 $l$이 곡선 $y=f^{-1}(x)$와 점 ${{Q}}$에서 만난다.\n[그림 1]\n다음은 삼각형 ${{OPQ}}$의 외접원의 넓이가 $\\dfrac{25}{2} \\pi$일 때, 점 ${{P}}$의 $y$좌표를 구하는 과정이다. (단, ${{O}}$는 원점이다.)\n점 ${{P}}$의 $y$좌표를 $a \\, \\left(a \\geq 0 \\right)$이라 하면\n점 ${{P}}$의 좌표는 ($\\boxed{\\vphantom{(}\\, (\\text{가}) \\,}$, $a)$이다.\n두 곡선 $y=f \\left(x \\right)$와 $y=f^{\\,-1} \\left(x \\right)$는 직선 $y=x$에 대하여 \n서로 대칭이고 두 직선 $l$과 $y=x$는 서로 수직이므로\n두 점 ${{P}}$와 ${{Q}}$는 직선 $y=x$에 대하여 서로 대칭이다. \n그러므로 삼각형 ${{OPQ}}$의 외접원의 중심을 ${{C}}$라 하면\n점 ${{C}}$는 직선 $y=x$ 위에 있다.\n삼각형 ${{OPQ}}$의 외접원의 넓이가 $\\dfrac{25}{2} \\pi$일 때,\n점 ${{C}}$의 좌표는 ($\\boxed{\\vphantom{(}\\, (\\text{나}) \\,}$, $\\boxed{\\vphantom{(}\\, (\\text{나}) \\,}$$)$이고,\n$\\overline{{{CP}} }= \\overline{{{CO}} }$에서 $a=$${\\boxed{\\vphantom{(}\\,(\\text{다})\\,}}$\n따라서 점 ${{P}}$의 $y$좌표는 ${\\boxed{\\vphantom{(}\\,(\\text{다})\\,}}$이다.\n위의 (가)에 알맞은 식을 $g(a)$라 하고, (나), (다)에 알맞은 수를 각각 $m$, $n$이라 할 때, $m+g(n)$의 값은? [4점]\n① $8$ ② $\\dfrac{33}{4}$ ③ $\\dfrac{17}{2}$ ④ $\\dfrac{35}{4}$ ⑤ $9$","answer":"③","sourceHash":"c0fea2fa7a30c083cb6dcc2353dc20bd4a9180d1b49592b0df07d39948b34869","steps":[{"id":"s1","latex":"P=(a^2+2,a),\\quad Q=(a,a^2+2)"},{"id":"s2","latex":"C=(m,m),\\ m>0,\\quad\\pi CO^2=\\frac{25}{2}\\pi\\Rightarrow2m^2=\\frac{25}{2}\\Rightarrow m=\\frac52"},{"id":"s3","latex":"CP^2=CO^2\\Rightarrow\\left(a^2-\\frac12\\right)^2+\\left(a-\\frac52\\right)^2=\\frac{25}{2}"},{"id":"s4","latex":"(a-2)(a+1)(a^2+a+3)=0,\\quad a\\ge0\\Rightarrow a=2"},{"id":"s5","latex":"g(a)=a^2+2,\\quad m+g(2)=\\frac52+6=\\frac{17}{2}"}],"diagram":null,"contentHash":"4341821fa4c2d5750bc32a34ff49e9e0dc32bddcc23ecb826f049353b5879b83","questionHtml":"\u003cp class=\"hp\">그림과 같이 함수 \u003cspan class=\"heq\">\\(f \\left(x \\right)= \\sqrt{x-2}\\)\u003c/span>와 그 역함수 \u003cspan class=\"heq\">\\(f^{\\,-1} \\left(x \\right)\\)\u003c/span>에 대하여 기울기가 \u003cspan class=\"heq\">\\(-1\\)\u003c/span>인 직선 \u003cspan class=\"heq\">\\(l\\)\u003c/span>이 곡선 \u003cspan class=\"heq\">\\(y=f(x)\\)\u003c/span>와 점 \u003cspan class=\"heq\">\\({{P}}\\)\u003c/span>에서 만나고 직선 \u003cspan class=\"heq\">\\(l\\)\u003c/span>이 곡선 \u003cspan class=\"heq\">\\(y=f^{-1}(x)\\)\u003c/span>와 점 \u003cspan class=\"heq\">\\({{Q}}\\)\u003c/span>에서 만난다.\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/b8e1d1399d70fb2d6d0e3b46.png\" style=\"width:337px;max-width:100%\">\u003c/p>\u003cp class=\"hp htall\">다음은 삼각형 \u003cspan class=\"heq\">\\({{OPQ}}\\)\u003c/span>의 외접원의 넓이가 \u003cspan class=\"heq\">\\(\\dfrac{25}{2} \\pi\\)\u003c/span>일 때, 점 \u003cspan class=\"heq\">\\({{P}}\\)\u003c/span>의 \u003cspan class=\"heq\">\\(y\\)\u003c/span>좌표를 구하는 과정이다. (단, \u003cspan class=\"heq\">\\({{O}}\\)\u003c/span>는 원점이다.)\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">점 \u003cspan class=\"heq\">\\({{P}}\\)\u003c/span>의 \u003cspan class=\"heq\">\\(y\\)\u003c/span>좌표를 \u003cspan class=\"heq\">\\(a \\, \\left(a \\geq 0 \\right)\\)\u003c/span>이라 하면\u003c/p>\u003cp class=\"hp htall\">점 \u003cspan class=\"heq\">\\({{P}}\\)\u003c/span>의 좌표는 (\u003cspan class=\"heq\">\\(\\boxed{\\vphantom{(}\\, (\\text{가}) \\,}\\)\u003c/span>, \u003cspan class=\"heq\">\\(a)\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp\">두 곡선 \u003cspan class=\"heq\">\\(y=f \\left(x \\right)\\)\u003c/span>와 \u003cspan class=\"heq\">\\(y=f^{\\,-1} \\left(x \\right)\\)\u003c/span>는 직선 \u003cspan class=\"heq\">\\(y=x\\)\u003c/span>에 대하여 \u003cbr>서로 대칭이고 두 직선 \u003cspan class=\"heq\">\\(l\\)\u003c/span>과 \u003cspan class=\"heq\">\\(y=x\\)\u003c/span>는 서로 수직이므로\u003c/p>\u003cp class=\"hp\">두 점 \u003cspan class=\"heq\">\\({{P}}\\)\u003c/span>와 \u003cspan class=\"heq\">\\({{Q}}\\)\u003c/span>는 직선 \u003cspan class=\"heq\">\\(y=x\\)\u003c/span>에 대하여 서로 대칭이다. \u003cbr>그러므로 삼각형 \u003cspan class=\"heq\">\\({{OPQ}}\\)\u003c/span>의 외접원의 중심을 \u003cspan class=\"heq\">\\({{C}}\\)\u003c/span>라 하면\u003c/p>\u003cp class=\"hp\">점 \u003cspan class=\"heq\">\\({{C}}\\)\u003c/span>는 직선 \u003cspan class=\"heq\">\\(y=x\\)\u003c/span> 위에 있다.\u003c/p>\u003cp class=\"hp htall\">삼각형 \u003cspan class=\"heq\">\\({{OPQ}}\\)\u003c/span>의 외접원의 넓이가 \u003cspan class=\"heq\">\\(\\dfrac{25}{2} \\pi\\)\u003c/span>일 때,\u003c/p>\u003cp class=\"hp htall\">점 \u003cspan class=\"heq\">\\({{C}}\\)\u003c/span>의 좌표는 (\u003cspan class=\"heq\">\\(\\boxed{\\vphantom{(}\\, (\\text{나}) \\,}\\)\u003c/span>, \u003cspan class=\"heq\">\\(\\boxed{\\vphantom{(}\\, (\\text{나}) \\,}\\)\u003c/span>\u003cspan class=\"heq\">\\()\\)\u003c/span>이고,\u003c/p>\u003cp class=\"hp htall\">\u003cspan class=\"heq\">\\(\\overline{{{CP}} }= \\overline{{{CO}} }\\)\u003c/span>에서 \u003cspan class=\"heq\">\\(a=\\)\u003c/span>\u003cspan class=\"heq\">\\({\\boxed{\\vphantom{(}\\,(\\text{다})\\,}}\\)\u003c/span>\u003c/p>\u003cp class=\"hp htall\">따라서 점 \u003cspan class=\"heq\">\\({{P}}\\)\u003c/span>의 \u003cspan class=\"heq\">\\(y\\)\u003c/span>좌표는 \u003cspan class=\"heq\">\\({\\boxed{\\vphantom{(}\\,(\\text{다})\\,}}\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp class=\"hp\">위의 (가)에 알맞은 식을 \u003cspan class=\"heq\">\\(g(a)\\)\u003c/span>라 하고, (나), (다)에 알맞은 수를 각각 \u003cspan class=\"heq\">\\(m\\)\u003c/span>, \u003cspan class=\"heq\">\\(n\\)\u003c/span>이라 할 때, \u003cspan class=\"heq\">\\(m+g(n)\\)\u003c/span>의 값은? \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp htall\">① \u003cspan class=\"heq\">\\(8\\)\u003c/span>&emsp;② \u003cspan class=\"heq\">\\(\\dfrac{33}{4}\\)\u003c/span>&emsp;③ \u003cspan class=\"heq\">\\(\\dfrac{17}{2}\\)\u003c/span>&emsp;④ \u003cspan class=\"heq\">\\(\\dfrac{35}{4}\\)\u003c/span>&emsp;⑤ \u003cspan class=\"heq\">\\(9\\)\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"
