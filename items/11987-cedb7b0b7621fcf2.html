<script>window.HandStudyRecord={"itemId":11987,"sourceLabel":"2023 교육청 고1 수학 9월 28번","adminYear":2023,"grade":1,"month":9,"number":28,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 $2\u003ca\u003c4$인 실수 $a$에 대하여 두 함수 $f \\left(x \\right)=ax ^{2}$, $g \\left(x \\right)=\\,-a \\left(x-a \\right) ^{2} +a ^{2}$의 그래프가 있다. 직선 $y=4a$와 함수 $y=f \\left(x \\right)$의 그래프가 만나는 점을 각각 $A$, $B$라 하고, 직선 $y=ax$와 함수 $y=g \\left(x \\right)$의 그래프가 만나는 점을 각각 $C$, $D$라 하자. 사각형 $ACDB$의 넓이의 최댓값을 $M$이라 할 때, $8 \\times M$의 값을 구하시오. (단, 점 $A$의 $x$좌표는 점 $B$의 $x$좌표보다 작고, 점 $C$의 $x$좌표는 점 $D$의 $x$좌표보다 작다.) [4점]","answer":"121","sourceHash":"257ff76ff558ac964aa9d1c73f9e2396daac3c4c9e29719201cf0affe65d32c6","steps":[{"id":"s1","latex":"A=(-2,4a),\\quad B=(2,4a)"},{"id":"s2","latex":"ax=-a(x-a)^2+a^2\\Rightarrow(x-a)(x-a+1)=0"},{"id":"s3","latex":"C=(a-1,a(a-1)),\\quad D=(a,a^2)"},{"id":"s4","latex":"[ACDB]=\\frac12\\left|-4a^2+22a\\right|=-2a^2+11a\\quad(2\u003ca\u003c4)"},{"id":"s5","latex":"-2a^2+11a=-2\\left(a-\\frac{11}{4}\\right)^2+\\frac{121}{8}"},{"id":"s6","latex":"M=\\frac{121}{8}\\Rightarrow8M=121"}],"diagram":null,"contentHash":"4b4c153f204ccfc5e7081bb4ad8eb100759701bff087e20d05349f0aff3b03d7","questionHtml":"\u003cp class=\"hp\">그림과 같이 \u003cspan class=\"heq\">\\(2\\lt a\\lt 4\\)\u003c/span>인 실수 \u003cspan class=\"heq\">\\(a\\)\u003c/span>에 대하여 두 함수 \u003cspan class=\"heq\">\\(f \\left(x \\right)=ax^{2}\\)\u003c/span>, \u003cspan class=\"heq\">\\(g \\left(x \\right)=\\,-a \\left(x-a \\right)^{2} +a^{2}\\)\u003c/span>의 그래프가 있다. 직선 \u003cspan class=\"heq\">\\(y=4a\\)\u003c/span>와 함수 \u003cspan class=\"heq\">\\(y=f \\left(x \\right)\\)\u003c/span>의 그래프가 만나는 점을 각각 \u003cspan class=\"heq\">\\(A\\)\u003c/span>, \u003cspan class=\"heq\">\\(B\\)\u003c/span>라 하고, 직선 \u003cspan class=\"heq\">\\(y=ax\\)\u003c/span>와 함수 \u003cspan class=\"heq\">\\(y=g \\left(x \\right)\\)\u003c/span>의 그래프가 만나는 점을 각각 \u003cspan class=\"heq\">\\(C\\)\u003c/span>, \u003cspan class=\"h
