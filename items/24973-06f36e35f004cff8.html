<script>window.HandStudyRecord={"adminYear":2025,"answer":"④","contentHash":"6a4f34902e2e9d1adabec45b4860888a08191973c7666b7e0de83b210d00e9e7","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24973,"month":11,"number":28,"points":4,"preview":false,"questionHtml":"\u003cp>그림과 같이 \u003cspan class=\"heq\">\\({ \\overline{{AB}}}={ \\overline{{CD}}}=4\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\({ \\overline{{BC}}}={ \\overline{{BD}}}=2 \\sqrt{5}\\,\\)\u003c/span>인 사면체 \u003cspan class=\"heq\">\\({{ABCD}}\\,\\)\u003c/span>가 있고, 점 \u003cspan class=\"heq\">\\({{A}}\\,\\)\u003c/span>에서 직선 \u003cspan class=\"heq\">\\({{CD}}\\,\\)\u003c/span>에 내린 수선의 발 \u003cspan class=\"heq\">\\({{H}}\\,\\)\u003c/span>에 대하여 두 평면 \u003cspan class=\"heq\">\\({{ABH}}\\,\\)\u003c/span>와 \u003cspan class=\"heq\">\\({{BCD}}\\,\\)\u003c/span>는 서로 수직이고 \u003cspan class=\"heq\">\\({ \\overline{{AH}}}=4\\,\\)\u003c/span>이다. 삼각형 \u003cspan class=\"heq\">\\({{ABH}}\\,\\)\u003c/span>의 무게중심을 \u003cspan class=\"heq\">\\({{G}}\\,\\)\u003c/span>라 하고, 점 \u003cspan class=\"heq\">\\({{G}}\\,\\)\u003c/span>를 중심으로 하고 평면 \u003cspan class=\"heq\">\\({{ACD}}\\,\\)\u003c/span>에 접하는 구를 \u003cspan class=\"heq\">\\(S\\,\\)\u003c/span>라 하자. \u003cspan class=\"heq\">\\(\\angle APG=\\frac{ \\pi }{2}\\,\\)\u003c/span>인 구 \u003cspan class=\"heq\">\\(S\\,\\)\u003c/span> 위의 모든 점 \u003cspan class=\"heq\">\\({{P}}\\,\\)\u003c/span>가 나타내는 도형을 \u003cspan class=\"heq\">\\(T\\,\\)\u003c/span>라 할 때, 도형 \u003cspan class=\"heq\">\\(T\\,\\)\u003c/span>의 평면 \u003cspan class=\"heq\">\\({{ABC}}\\)\u003c/span> 위로의 정사영의 넓이는? [4점]\u003c/p>\u003cfigure>\u003cimg class=\"hfig\" src=\"../assets/csat/24973-a0c919cc4611bdae.png\" alt=\"2025년 시행 수능 28번 문항 그림 \" style=\"max-width:100%;width:420px\">\u003c/figure>\u003cdiv class=\"hchoices\">\u003cdiv class=\"hch\">① \u003cspan class=\"heq\">\\(\\frac{ \\pi }{7}\\,\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">② \u003cspan class=\"heq\">\\(\\frac{ \\pi }{6}\\,\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">③ \u003cspan class=\"heq\">\\(\\frac{ \\pi }{5}\\,\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">④ \u003cspan class=\"heq\">\\(\\frac{ \\pi }{4}\\,\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">⑤ \u003cspan class=\"heq\">\\(\\frac{ \\pi }{3}\\)\u003c/span>\u003c/div>\u003c/div>","questionText":"그림과 같이 ${ \\overline{{AB}}}={ \\overline{{CD}}}=4\\,$, ${ \\overline{{BC}}}={ \\overline{{BD}}}=2 \\sqrt{5}\\,$인 사면체 ${{ABCD}}\\,$가 있고, 점 ${{A}}\\,$에서 직선 ${{CD}}\\,$에 내린 수선의 발 ${{H}}\\,$에 대하여 두 평면 ${{ABH}}\\,$와 ${{BCD}}\\,$는 서로 수직이고 ${ \\overline{{AH}}}=4\\,$이다. 삼각형 ${{ABH}}\\,$의 무게중심을 ${{G}}\\,$라 하고, 점 ${{G}}\\,$를 중심으로 하고 평면 ${{ACD}}\\,$에 접하는 구를 $S\\,$라 하자. $ang \\leq {{APG}}=\\frac{ \\pi }{2}\\,$인 구 $S\\,$ 위의 모든 점 ${{P}}\\,$가 나타내는 도형을 $T\\,$라 할 때, 도형 $T\\,$의 평면 ${{ABC}}$ 위로의 정사영의 넓이는? [4점]\n① $\\frac{ \\pi }{7}\\,$ ② $\\frac{ \\pi }{6}\\,$ ③ $\\frac{ \\pi }{5}\\,$ ④ $\\frac{ \\pi }{4}\\,$ ⑤ $\\frac{ \\pi }{3}$","sourceHash":"453cb3cc4b051203414589cf21834b0fc27ac82ba72e3c1200d3be25b9e472fe","sourceKind":"csat","sourceLabel":"2025년 시행 수능 · 2026학년도 · 기하 · 28번","steps":[{"id":"s1","latex":"CD=4,\\ BC=BD=2\\sqrt5\\text{이므로 }CD\\text{의 중점을 }M\\text{이라 하면 }BM=4"},{"id":"s2","latex":"\\text{두 평면의 수직 조건과 삼수선의 정리로 }H=M,\\quad BH=4"},{"id":"s3","latex":"AB=AH=BH=4\\text{이므로 }\\triangle ABH\\text{는 정삼각형이다.}"},{"id":"s4","latex":"G\\text{에서 평면 }ACD\\text{까지의 거리는 }G\\text{에서 }AH\\text{까지의 거리이다.}"},{"id":"s5","latex":"\\text{따라서 구 }S\\text{의 반지름은 정삼각형의 내접반지름 }r=\\frac{2\\sqrt3}{3}"},{"id":"s6","latex":"\\begin{aligned}&AG=\\frac{4\\sqrt3}{3},\\qquad \\angle APG=\\frac\\pi2.\\\\&\\text{따라서 }P\\text{의 자취는 }AG\\text{를 지름으로 하는 구와}\\\\&\\text{구 }S\\text{의 교선이다.}\\end{aligned}"},{"explanation":{"body":"반지름이 같은 두 구의 중심을 잇는 선분의 수직이등분면에 교선 원이 놓입니다. 중심 사이 거리도 \\(r\\)이므로 구의 중심에서 교선 평면까지는 \\(r/2\\), 피타고라스 정리로 교선 반지름은 \\(\\sqrt{r^2-(r/2)^2}\\)입니다.","skillTags":["구의교선","공간거리"],"title":"두 구의 교선 반지름"},"id":"s7","latex":"\\begin{aligned}&\\text{두 구의 반지름은 모두 }r\\text{이고 중심 사이 거리도 }r.\\\\&\\text{따라서 교선 }T\\text{의 반지름은}\\\\&\\sqrt{r^2-(r/2)^2}=1.\\end{aligned}"},{"id":"s8","latex":"\\begin{aligned}&K\\text{를 }A\\text{에서 }BH\\text{에 내린 수선의 발이라 하면 }AK\\perp BCD.\\\\&\\triangle ABH\\text{가 정삼각형이므로 }A,G,K\\text{는 한 직선 위에 있어 }AG\\perp BCD.\\\\&\\text{한편 교선의 평면 }T\\text{도 }AG\\perp T.\\\\&\\text{따라서 }T\\parallel BCD.\\end{aligned}"},{"id":"s9","latex":"BK=KH=HC=2\\text{이므로 }[KBC]=\\frac12\\cdot KH\\cdot HC=\\frac12\\cdot2\\cdot2=2"},{"id":"s10","latex":"\\begin{aligned}&AB=4,\\qquad AC=BC=2\\sqrt5.\\\\&AB\\text{에 대한 높이가 }4\\text{이므로}\\\\&[ABC]=\\frac12\\cdot4\\cdot4=8.\\end{aligned}"},{"id":"s11","latex":"\\cos\\angle(ABC,BCD)=\\frac{[KBC]}{[ABC]}=\\frac14"},{"id":"s12","latex":"\\text{정사영 넓이}=\\pi\\cdot\\frac14=\\frac\\pi4"},{"id":"s13","latex":"\\therefore\\ \\boxed{\\frac\\pi4}\\;(④)"}],"track":"기하"};</script>
