<script>window.HandStudyRecord={"itemId":18385,"sourceLabel":"2025 평가원 고3 수학확통 6월 30번","adminYear":2025,"grade":3,"month":6,"number":30,"track":"확통","points":4,"scoreStatus":"confirmed_4_direct","questionText":"집합 $X\\,= \\left\\{1,\\,2,\\,3,\\,4,\\,5 \\right\\}\\,$에 대하여 다음 조건을 만족시키는 함수 $f\\,:\\,X\\,\\rightarrow\\, X\\,$의 개수를 구하시오. [4점]\n(가) $x=1$, $2$, $3$, $4\\,$일 때 $f \\left(x+1 \\right)+3 \\geq f \\left(x \\right)+x\\,$이다.(나) $f \\left(2 \\right)\\,$의 값은 홀수이다.","answer":"115","sourceHash":"3d02beddf7845d144ada491a5327e1ce040251a7dd2c38a352f23eba87bd286d","steps":[{"id":"s1","latex":"f(1) \\le f(2)+2,\\quad f(3) \\ge f(2)-1,\\quad f(3) \\le f(4),\\quad f(4)+1 \\le f(5)"},{"id":"s2","latex":"{}_{4}\\mathrm{H}_{3}={}_{6}\\mathrm{C}_{3}=20,\\quad {}_{3}\\mathrm{H}_{3}={}_{5}\\mathrm{C}_{3}=10,\\quad {}_{1}\\mathrm{H}_{3}=1"},{"id":"s3","latex":"3 \\times 20+5 \\times 10+5 \\times 1=115"}],"diagram":null,"contentHash":"be0c1f8b7f819c35f6667e1c779a5666b7733aae77f46bb9720f9d250387979e","questionHtml":"\u003cp class=\"hp\">집합 \u003cspan class=\"heq\">\\(X\\,= \\left\\{1,\\,2,\\,3,\\,4,\\,5 \\right\\}\\,\\)\u003c/span>에 대하여 다음 조건을 만족시키는 함수 \u003cspan class=\"heq\">\\(f\\,:\\,X\\,\\rightarrow\\, X\\,\\)\u003c/span>의 개수를 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) \u003cspan class=\"heq\">\\(x=1\\)\u003c/span>, \u003cspan class=\"heq\">\\(2\\)\u003c/span>, \u003cspan class=\"heq\">\\(3\\)\u003c/span>, \u003cspan class=\"heq\">\\(4\\,\\)\u003c/span>일 때 \u003cspan class=\"heq\">\\(f \\left(x+1 \\right)+3 \\geq f \\left(x \\right)+x\\,\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp\">(나) \u003cspan class=\"heq\">\\(f \\left(2 \\right)\\,\\)\u003c/span>의 값은 홀수이다.\u003c/p>\u003c/div>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"a78a9cb02de1b9ef4968ea4dfe9d6aad81086d73e3783e392922e37df9ab7468"};</script>
<script>window.HandStudyGuide={"itemId":18385,"sourceHash":"3d02beddf7845d144ada491a5327e1ce040251a7dd2c38a352f23eba87bd286d","contentHash":"be0c1f8b7f819c35f6667e1c779a5666b7733aae77f46bb9720f9d250387979e","overview":{"goal":"네 부등식을 이웃한 함숫값의 범위로 바꾸고, 둘째 함숫값이 홀수인 세 경우를 빠짐없이 세어요.","firstLook":"뒤의 세 함숫값은 아무렇게나 고를 수 없어요. 셋째 값은 넷째 값 이하이고, 다섯째 값은 넷째 값보다 커야 한다는 순서를 먼저 읽어야 해요.","conditions":[{"label":"조건 (가)","meaning":"첫째 값의 윗범위와 셋째 값의 아랫범위가 둘째 값에 따라 달라지고, 셋째·넷째·다섯째 값에는 순서가 생겨요."},{"label":"조건 (나)","meaning":"둘째 함숫값은 집합 안의 홀수인 \\(1,3,5\\)만 가능하므로 세 경우를 따로 세어 더해요."}]},"chapters":[{"id":"c1","label":"네 부등식의 뜻을 풀어요","stepIds":["s1"],"question":"각 부등식은 다섯 함숫값 사이에 어떤 범위를 만들까요?","hint":"주어진 식에 \\(x=1,2,3,4\\)를 차례로 넣고, 같은 항끼리 한쪽으로 옮겨 보세요.","explanation":"\\(x=1\\)을 넣으면 \\(f(2)+3\\ge f(1)+1\\)이므로 \\(f(1)\\le f(2)+2\\)예요. \\(x=2\\)에서는 \\(f(3)+3\\ge f(2)+2\\), 곧 \\(f(3)\\ge f(2)-1\\)을 얻어요.\n\n나머지 두 식은 순서를 정해 줘요. \\(x=3\\)에서는 \\(f(4)+3\\ge f(3)+3\\)이므로 \\(f(3)\\le f(4)\\)이고, \\(x=4\\)에서는 \\(f(5)+3\\ge f(4)+4\\)이므로 \\(f(4)<f(5)\\)예요. 따라서 뒤의 세 값은 \\(f(3)\\le f(4)<f(5)\\)를 만족해야 해요.","check":{"prompt":"마지막 부등식에서 등호가 허용되지 않는 이유는 무엇인가요?","answer":"\\(f(5)\\ge f(4)+1\\)이고 함숫값이 정수이므로 \\(f(5)\\)는 \\(f(4)\\)보다 반드시 커야 해요."}},{"id":"c2","label":"둘째 값별로 뒤의 세 값을 세어요","stepIds":["s2"],"question":"둘째 함숫값이 \\(1,3,5\\)일 때 뒤의 세 값은 각각 몇 가지일까요?","hint":"넷째 값을 먼저 고정하면 셋째 값과 다섯째 값의 선택 수를 곱해 더할 수 있어요.","explanation":"\\(f(2)=1\\)이면 \\(f(3)\\ge0\\)은 자동으로 만족돼요. \\(f(4)=1,2,3,4\\)일 때 \\(f(3)\\)은 각각 \\(1,2,3,4\\)가지, \\(f(5)\\)는 각각 \\(4,3,2,1\\)가지이므로\n\n\\(1\\times4+2\\times3+3\\times2+4\\times1=20\\)가지예요.\n\n\\(f(2)=3\\)이면 \\(f(3)\\ge2\\)예요. \\(f(4)=2,3,4\\)에 따라 선택 수는 \\(1\\times3, 2\\times2, 3\\times1\\)이므로 모두 \\(10\\)가지예요. \\(f(2)=5\\)이면 \\(f(3)\\ge4\\)이고 \\(f(3)\\le f(4)<f(5)\\)여야 하므로 \\((f(3),f(4),f(5))=(4,4,5)\\) 한 가지뿐이에요. 이것이 각각 \\({}_{4}\\mathrm H_{3}=20\\), \\({}_{3}\\mathrm H_{3}=10\\), \\({}_{1}\\mathrm H_{3}=1\\)에 해당해요.","check":{"prompt":"둘째 함숫값이 \\(5\\)일 때 왜 뒤의 세 값이 한 가지뿐인가요?","answer":"셋째 값이 \\(4\\) 이상이고 넷째 값보다 클 수 없으며 다섯째 값은 넷째 값보다 커야 해요. 값의 범위가 \\(1\\)부터 \\(5\\)까지이므로 \\((4,4,5)\\)만 남아요."}},{"id":"c3","label":"첫째 값의 선택을 곱해 합쳐요","stepIds":["s3"],"question":"각 경우에서 첫째 함숫값은 몇 가지이고, 전체 개수는 어떻게 합칠까요?","hint":"첫째 값은 \\(f(1)\\le f(2)+2\\)만 만족하면 돼요.","explanation":"\\(f(2)=1\\)이면 \\(f(1)\\le3\\)이므로 첫째 값은 \\(3\\)가지예요. 뒤의 세 값 \\(20\\)가지와 곱해 \\(3\\times20=60\\)가지를 얻어요.\n\n\\(f(2)=3\\)이면 \\(f(1)\\le5\\)라서 첫째 값은 \\(5\\)가지이고, \\(5\\times10=50\\)가지예요. \\(f(2)=5\\)일 때도 첫째 값은 집합의 다섯 원소를 모두 고를 수 있으므로 \\(5\\times1=5\\)가지예요. 세 경우는 둘째 값이 서로 달라 겹치지 않으므로 \\(60+50+5=115\\)가지예요.","check":{"prompt":"전체 계산에서 \\(3,5,5\\)를 각각 곱하는 까닭은 무엇인가요?","answer":"각 수는 해당 둘째 값에서 가능한 첫째 값의 개수예요. 뒤의 세 값을 고르는 방법과 서로 독립적으로 짝지을 수 있으므로 곱해요."}}],"takeaway":["인접한 함숫값 부등식은 각 값의 위아래 범위와 값들의 순서로 먼저 풀어 써요.","중간 값을 고정하면 양쪽에서 고를 수 있는 수를 곱해 합하는 방식으로 순서 조건을 셀 수 있어요.","경우를 나눈 기준값이 서로 다르면 각 경우는 겹치지 않으므로 마지막에 더해요."]};</script>
