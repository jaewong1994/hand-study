<script>window.HandStudyRecord={"itemId":17255,"sourceLabel":"2022 교육청 고3 수학기하 10월 13번","adminYear":2022,"grade":3,"month":10,"number":13,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 ${\\overline{AB}}$$=2$, ${\\overline{BC}}$$=3 \\sqrt{3}$, ${\\overline{CA}}$$= \\sqrt{13}$인 삼각형 $A B C$가 있다. 선분 $B C$ 위에 점 $B$가 아닌 점 $D$를 ${\\overline{AD}}$$=2$가 되도록 잡고, 선분 $A C$ 위에 양 끝점 $A$, $C$가 아닌 점 $E$를 사각형 $A B D E$가 원에 내접하도록 잡는다.\n[그림 1]\n다음은 선분 $D E$의 길이를 구하는 과정이다.\n삼각형 $A B C$에서 코사인법칙에 의하여\n$\\cos\\, \\left( \\angle ABC \\right)$$= {\\boxed{\\vphantom{(}\\, \\left( \\text{가} \\right) \\,}}$\n이다. 삼각형 $A B D$에서 $\\sin\\, \\left( \\angle ABD \\right)$$= \\sqrt{1- \\left( {\\boxed{\\vphantom{(}\\, \\left( \\text{가} \\right) \\,}} \\right)^{2}}$\n이므로 사인법칙에 의하여 삼각형 $A B D$의 외접원의 반지름의 길이는 ${\\boxed{\\vphantom{(}\\, \\left( \\text{나} \\right) \\,}}$이다.\n삼각형 $A D C$에서 사인법칙에 의하여\n$\\dfrac{{\\overline{CD}}}{\\sin\\, \\left( \\angle CAD \\right)}$$= \\dfrac{{\\overline{AD}}}{\\sin\\, \\left( \\angle ACD \\right)}$\n이므로 $\\sin\\, \\left( \\angle CAD \\right)$$= \\dfrac{{\\overline{CD}}}{{\\overline{AD}}} \\times \\sin\\, \\left( \\angle ACD \\right)$이다.\n삼각형 $A D E$에서 사인법칙에 의하여\n${\\overline{DE}}$$= {\\boxed{\\vphantom{(}\\, \\left( \\text{다} \\right) \\,}}$\n이다.\n위의 (가), (나), (다)에 알맞은 수를 각각 $p$, $q$, $r$라 할 때,\n$p \\times q \\times r$의 값은? [4점]\n① $\\dfrac{6 \\sqrt{13}}{13}$ ② $\\dfrac{7 \\sqrt{13}}{13}$ ③ $\\dfrac{8 \\sqrt{13}}{13}$\n④ $\\dfrac{9 \\sqrt{13}}{13}$ ⑤ $\\dfrac{10 \\sqrt{13}}{13}$","answer":"①","sourceHash":"d0fa741c17c5f8212e90dedec2d1f08b58b3e5f79564b7d31a0190962406723f","steps":[{"id":"s1","latex":"\\cos\\angle ABC=\\frac{2^2+(3\\sqrt3)^2-(\\sqrt{13})^2}{2\\cdot2\\cdot3\\sqrt3}=\\frac{\\sqrt3}{2}=p"},{"id":"s2","latex":"\\sin\\angle ABD=\\frac12"},{"id":"s3","latex":"q=R=\\frac{AD}{2\\sin\\angle ABD}=2"},{"id":"s4","latex":"AB=AD=2,\\quad BD=2\\sqrt3,\\quad CD=\\sqrt3"},{"id":"s5","latex":"\\sin\\angle ACD=\\frac{AB\\sin\\angle ABC}{AC}=
