<script>window.HandStudyRecord={"adminYear":2024,"answer":"16","contentHash":"2b7d4050c96d685076b589f968f8c9103e2b522b4c4bf9fb931821b1acea2ffd","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24920,"month":11,"number":21,"points":4,"preview":false,"questionHtml":"\u003cp>함수 \u003cspan class=\"heq\">\\(f \\left(x \\right)=x^{3}+a x^{2}+b x+4\\,\\)\u003c/span>가 다음 조건을 만족시키도록 하는 두 정수 \u003cspan class=\"heq\">\\(a\\)\u003c/span>, \u003cspan class=\"heq\">\\(b\\,\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(f \\left(1 \\right)\\,\\)\u003c/span>의 최댓값을 구하시오. [4점]\u003c/p>\u003cp>모든 실수 \u003cspan class=\"heq\">\\(\\alpha\\,\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(\\lim _{x \\,\\rightarrow\\, \\alpha} \\frac{f \\left(2 x+1 \\right)}{f \\left(x \\right)}\\,\\)\u003c/span>의 값이 존재한다.\u003c/p>","questionText":"함수 $f \\left(x \\right)=x^{3}+a x^{2}+b x+4\\,$가 다음 조건을 만족시키도록 하는 두 정수 $a$, $b\\,$에 대하여 $f \\left(1 \\right)\\,$의 최댓값을 구하시오. [4점]\n모든 실수 $\\alpha\\,$에 대하여 $\\lim _{x \\,\\rightarrow\\, \\alpha} \\frac{f \\left(2 x+1 \\right)}{f \\left(x \\right)}\\,$의 값이 존재한다.","sourceHash":"3b0557210a0beeb095281cdf110f991082255530f3d65ad12f111730044972e4","sourceKind":"csat","sourceLabel":"2024년 시행 수능 · 2025학년도 · 공통 · 21번","steps":[{"id":"s1","latex":"f(\\alpha)=0\\quad\\Rightarrow\\quad f(2\\alpha+1)=0"},{"id":"s2","latex":"\\beta:\\text{가장 큰 실근},\\quad\\gamma:\\text{가장 작은 실근}"},{"id":"s3","latex":"2\\beta+1\\le\\beta,\\quad 2\\gamma+1\\ge\\gamma\\quad\\Rightarrow\\quad\\beta\\le-1\\le\\gamma"},{"id":"s4","latex":"\\gamma\\le\\beta\\quad\\Rightarrow\\quad\\gamma=\\beta=-1"},{"id":"s5","latex":"f(x)=(x+1)(x^2+px+4),\\quad p\\text{는 정수}"},{"id":"s6","latex":"x^2+px+4=0\\text{의 실근이 }-1\\text{이면 }p=5\\text{이고 다른 근 }-4\\text{가 생김}"},{"id":"s7","latex":"p^2-16\u003c0\\quad\\Rightarrow\\quad p=-3,-2,-1,0,1,2,3"},{"id":"s8","latex":"\\frac{f(2x+1)}{f(x)}=\\frac{2\\{(2x+1)^2+p(2x+1)+4\\}}{x^2+px+4}\\quad(x\\ne-1)"},{"id":"s9","latex":"\\lim_{x\\to-1}\\frac{f(2x+1)}{f( <script>window.HandStudyGuide={"itemId":24920,"sourceHash":"3b0557210a0beeb095281cdf110f991082255530f3d65ad12f111730044972e4","contentHash":"2b7d4050c96d685076b589f968f8c9103e2b522b4c4bf9fb931821b1acea2ffd","overview":{"goal":"분모가 0이 되는 모든 점에서도 극한이 존재하도록 실근의 위치를 제한하고, 남은 정수 매개변수에서 함숫값을 가장 크게 해요.","firstLook":"\\(f(\\alpha)=0\\)이면 분모가 \\(0\\)으로 가므로 분자도 \\(0\\)으로 가야 해요. 따라서 실근은 \\(\\alpha\\mapsto2\\alpha+1\\)로 옮겨도 다시 실근이에요.","conditions":[{"label":"모든 실수에서 극한 존재","meaning":"분모의 모든 실근에서 분자의 영점과 약분 가능성을 확인해야 해요."}]},"chapters":[{"id":"c1","label":"실근이 옮겨지는 규칙을 써요","stepIds":["s1","s2","s3","s4"],"question":"가장 큰 실근과 가장 작은 실근에 같은 규칙을 적용하면 무엇이 생길까요?","hint":"옮긴 실근이 각각 최대·최소 범위를 벗어날 수 없다는 부등식을 쓰세요.","explanation":"\\(f(\\alpha)=0\\)인데 \\(f(2\\alpha+1)\\ne0\\)이면 분수의 분모만 \\(0\\)으로 가므로 유한한 극한이 존재할 수 없어요. 따라서 \\(f(2\\alpha+1)=0\\)이에요. 가장 큰 실근을 \\(\\beta\\)라 하면 \\(2\\beta+1\\le\\beta\\), 따라서 \\(\\beta\\le-1\\)이에요. 가장 작은 실근을 \\(\\gamma\\)라 하면 \\(2\\gamma+1\\ge\\gamma\\), 따라서 \\(\\gamma\\ge-1\\)이에요. 항상 \\(\\gamma\\le\\beta\\)이므로 \\(\\gamma=\\beta=-1\\), 즉 실근은 \\(-1\\) 하나뿐이에요.","check":{"prompt":"왜 가장 큰 실근에는 \\(\\le\\), 가장 작은 실근에는 \\(\\ge\\)가 붙나요?","answer":"\\(2\\beta+1\\)도 실근이어서 최대 실근 \\(\\beta\\)보다 클 수 없고, \\(2\\gamma+1\\)도 실근이어서 최소 실근 \\(\\gamma\\)보다 작을 수 없기 때문이에요."}},{"id":"c2","label":"나머지 이차식에 실근이 없게 해요","stepIds":["s5","s6","s7"],"question":"삼차식을 나눈 이차식은 왜 실근을 가지면 안 될까요?","hint":"실근이 있다면 전체 삼차식에 −1 이외의 실근이 생기는지 확인하세요.","explanation":"상수항이 \\(4\\)이므로 \\(f(x)=(x+1)(x^2+px+4)\\)로 쓸 수 있고 계수 조건에서 \\(p\\)는 정수예요. 이차식이 \\(-1\\)을 근으로 가지면 \\(1-p+4=0\\)에서 \\(p=5\\)이고 다른 근 \\(-4\\)가 생겨 모순이에요. 따라서 이차식은 실근이 없어야 하므로 판별식 \\(p^2-16<0\\)이고, 정수 \\(p\\)는 \\(-3,-2,-1,0,1,2,3\\)이에요.","check":{"prompt":"\\(p=\\pm4\\)도 제외되는 이유는 무엇인가요?","answer":"판별식이 0이 되어 이차식에 실근이 생기고, 전체 f에 −1 이외의 실근 또는 허용되지 않은 중근이 생기기 때문이에요."}},{"id":"c3","label":"약분 뒤 극한과 최댓값을 확인해요","stepIds":["s8","s9","s10"],"question":"허용된 p에서 원래 극한 조건이 실제로 성립하고 f(1)은 언제 가장 클까요?","hint":"x+1 인수를 먼저 약분하고 f(1)을 p의 식으로 쓰세요.","explanation":"\\(x\\ne-1\\)에서 \\(2x+2=2(x+1)\\)이므로 비는 \\(2\\{(2x+1)^2+p(2x+1)+4\\}/(x^2+px+4)\\)예요. 이차식은 실근이 없어 분모가 0이 되지 않고, \\(x\\to-1\\)에서도 분자와 분모의 이차식 값이 같아 극한은 \\(2\\)예요. 또 \\(f(1)=2(p+5)\\)이므로 허용된 가장 큰 \\(p=3\\)에서 \\(16\\)이에요.","check":{"prompt":"\\(p=3\\)에서 이차식의 판별식은 얼마인가요?","answer":"\\(3^2-16=-7<0\\)이라 추가 실근이 없어요."}}],"takeaway":["분모가 0이 되는 점의 극한은 분자의 영점과 차수를 함께 확인해요.","최대·최소 실근에 근을 옮기는 규칙을 적용하면 위치를 강하게 제한할 수 있어요."]};</script>
