  <script>window.HandStudyRecord={"adminYear":2020,"answer":"⑤","contentHash":"cb58c7b71104b36eb83b6ec8d7492f4e6d2069714fa74021b5afcbca059c6a5a","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24721,"month":12,"number":20,"points":4,"preview":false,"questionHtml":"\u003cp>함수 \u003cspan class=\"heq\">\\(f(x) = \\pi \\sin 2\\pi x\\)\u003c/span>에 대하여 정의역이 실수 전체의 집합이고 치역이 집합 \u003cspan class=\"heq\">\\(\\left\\{ 0, \\, 1 \\right\\}\\)\u003c/span>인 함수 \u003cspan class=\"heq\">\\(g(x)\\)\u003c/span>와 자연수 \u003cspan class=\"heq\">\\(n\\)\u003c/span>이 다음 조건을 만족시킬 때, \u003cspan class=\"heq\">\\(n\\)\u003c/span>의 값은? [4점]\u003c/p>\u003cp>함수 \u003cspan class=\"heq\">\\(h(x) = f(nx) g(x)\\)\u003c/span>는 실수 전체의 집합에서 연속이고 \u003cspan class=\"heq\">\\(\\int_-1^1 h(x) dx = 2\\)\u003c/span>, \u003cspan class=\"heq\">\\(\\int_-1^1 x h(x) dx = - \\frac{1}{32}\\)\u003c/span>이다.\u003c/p>\u003cdiv class=\"hchoices\">\u003cdiv class=\"hch\">① \u003cspan class=\"heq\">\\(8\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">② \u003cspan class=\"heq\">\\(10\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">③ \u003cspan class=\"heq\">\\(12\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">④ \u003cspan class=\"heq\">\\(14\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">⑤ \u003cspan class=\"heq\">\\(16\\)\u003c/span>\u003c/div>\u003c/div>","questionText":"함수 $f(x) = \\pi \\sin 2\\pi x$에 대하여 정의역이 실수 전체의 집합이고 치역이 집합 $\\left\\{ 0, \\, 1 \\right\\}$인 함수 $g(x)$와 자연수 $n$이 다음 조건을 만족시킬 때, $n$의 값은? [4점]\n함수 $h(x) = f(nx) g(x)$는 실수 전체의 집합에서 연속이고 $\\int_-1^1 h(x) dx = 2$, $\\int_-1^1 x h(x) dx = - \\frac{1}{32}$이다.\n① $8$ ② $10$ ③ $12$ ④ $14$ ⑤ $16$","sourceHash":"58d276bef892368cbe4da4dbc20fae8e13a8082af64e16666a9c7abca94f73fc","sourceKind":"csat","sourceLabel":"2020년 시행 수능 · 2021학년도 · 가형 · 20번","steps":[{"id":"s1","latex":"s(x)=f(nx)=\\pi\\sin(2n\\pi x),\\quad h(x)\\in\\{0,s(x)\\}"},{"id":"s2","latex":"\\begin{cases}h(x)\\le s(x)&(s(x)>0)\\\\h(x)\\le0&(s(x)\\le0)\\end{cases}"},{"id":"s3","latex":"\\int_0^{1/(2n)}s(x)\\,dx=\\frac1n"},{"id":"s4","latex":"-1\\le x\\le1\\text{에 양의 반주기가 }2n\\text{개이고 그 밖에서는 }h(x)\\le0\\text{이므로 }\\int_{-1}^1h(x)\\,dx\\le2n\\cdot\\frac1n=2"},{"explanation":{"body":"\\(s(x)>0\\)인 곳에서 \\(h(x)=s(x)\\), \\(s(x)\\le0\\)인 곳에서 \\(h(x)=0\\)을 고르면 적분값은 2예요. 어떤 한 점에서 이보다 작은 값을 고르면, 연속이므로 그 점 주변의 구간에서도 차이가 생겨 적분값이 2보다 작아져요. 따라서 적분값이 2가 되려면 모든 점에서 위의 식을 따라야 해요. 이 판단에는 연속이라는 조건과 앞에서 구한 적분값의 상한이 모두 필요해요.","skillTags":["integration.equality-case"],"title":"적분값이 2이면 왜 이 식으로 정해질까요?"},"id":"s5","latex":"\\int_{-1}^1h(x)\\,dx=2\\text{이고 }h\\text{가 연속이므로 }h(x)=\\begin{cases}s(x)&(s(x)>0)\\\\0&(s(x)\\le0)\\end{cases}\\quad(-1\\le x\\le1)"},{"id":"s6","latex":"s(-x)=-s(x)\\ \\Rightarrow\\ h(x)-h(-x)=s(x)"},{"id":"s7","latex":"\\int_{-1}^1xh(x)\\,dx=\\int_0^1x\\{h(x)-h(-x)\\}\\,dx=\\int_0^1\\pi x\\sin(2n\\pi x)\\,dx"},{"explanation":{"body":"부분적분에서 \\(x\\)를 미분하면 1이 되어 식이 짧아져요. 반면 \\(\\pi\\sin(2n\\pi x)\\)는 적분해서 \\(-\\cos(2n\\pi x)/(2n)\\)으로 바꿀 수 있어요. \\(2n\\pi\\)는 안쪽 각의 미분계수라서 그 값으로 나눈 거예요. 남은 코사인 적분은 정수 \\(n\\)에 대해 양끝의 사인값이 모두 0이라 사라져요.","skillTags":["integration.by-parts"],"title":"x를 미분하는 쪽으로 골라요"},"id":"s8","latex":"=\\left[-\\frac{x\\cos(2n\\pi x)}{2n}\\right]_0^1+\\frac1{2n}\\int_0^1\\cos(2n\\pi x)\\,dx=-\\frac1{2n}"},{"id":"s9","latex":"-\\frac1{2n}=-\\frac1{32}\\ \\Rightarrow\\ \\boxed{n=16}\\quad\\text{⑤}"}],"track":"가형"};</script>
