<script>window.HandStudyRecord={"itemId":17263,"sourceLabel":"2022 교육청 고3 수학기하 10월 21번","adminYear":2022,"grade":3,"month":10,"number":21,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 $a>1$인 실수 $a$에 대하여 두 곡선\n $y$$=a ^{-2x} -1$, $y$$=a ^{x} -1$\n이 있다. 곡선 $y$$=a ^{-2x} -1$과 직선 $y$$= - \\sqrt{3} x$가 서로 다른 두 점 $O$, $A$에서 만난다. 점 $A$를 지나고 직선 $O A$에 수직인 직선이 곡선 $y$$=a ^{x} -1$과 제$1$사분면에서 만나는 점 $B$라 하자. ${\\overline{ OA}} \\,:\\, {\\overline{ OB}}$$= \\sqrt{3} \\,:\\, \\sqrt{19}$일 때, 선분 $A B$의 길이를 구하시오. (단, $O$는 원점이다.) [4점]","answer":"8","sourceHash":"0b282ba8b3041986fdcdb6b6c26cc2b6e4a4b8df5fca01790de10124b7e5b09d","steps":[{"id":"s1","latex":"OA=\\sqrt3k,\\quad OB=\\sqrt{19}k,\\quad AB=4k"},{"id":"s2","latex":"A=\\left(-\\frac{\\sqrt3}{2}k,\\frac32k\\right)"},{"id":"s3","latex":"AB\\perp OA\\Rightarrow B=\\left(\\frac{3\\sqrt3}{2}k,\\frac72k\\right)"},{"id":"s4","latex":"A\\in y=a^{-2x}-1\\Rightarrow a^{\\sqrt3k}=\\frac{3k+2}{2}"},{"id":"s5","latex":"B\\in y=a^x-1\\Rightarrow a^{3\\sqrt3k/2}=\\frac{7k+2}{2}"},{"id":"s6","latex":"\\left(\\frac{3k+2}{2}\\right)^3=\\left(\\frac{7k+2}{2}\\right)^2"},{"id":"s7","latex":"k( k-2)(27k+10)=0\\Rightarrow k=2"},{"id":"s8","latex":"AB=4k=\\boxed8"}],"diagram":null,"contentHash":"fbc32c5f97ed139b512e83469491912522cb577a0b63336a9d7be44c5b3db608","questionHtml":"\u003cp class=\"hp\">그림과 같이 \u003cspan class=\"heq\">\\(a\\gt 1\\)\u003c/span>인 실수 \u003cspan class=\"heq\">\\(a\\)\u003c/span>에 대하여 두 곡선\u003c/p>\u003cp class=\"hp\">&emsp;&emsp;\u003cspan class=\"heq\">\\(y\\)\u003c/span>\u003cspan class=\"heq\">\\(=a^{-2x} -1\\)\u003c/span>, \u003cspan class=\"heq\">\\(y\\)\u003c/span>\u003cspan class=\"heq\">\\(=a^{x} -1\\)\u003c/span>\u003c/p>\u003cp class=\"hp htall\">이 있다. 곡선 \u003cspan class=\"heq\">\\(y\\)\u003c/span>\u003cspan class=\"heq\">\\(=a^{-2x} -1\\)\u003c/span>과 직선 \u003cspan class=\"heq\">\\(y\\)\u003c/span>\u003cspan class=\"heq\">\\(= - \\sqrt{3} x\\)\u003c/span>가 서로 다른 두 점 \u003cspan class=\"heq\">\\(O\\)\u003c/span>, \u003cspan class=\"heq\">\\(A\\)\u003c/span>에서 만난다. 점 \u003cspan class=\"heq\">\\(A\\)\u003c/span>를 지나고 직선 \u003cspan class=\"heq\">\\(O A\\)\u003c/span>에 수직인 직선이 곡선 \u003cspan class=\"heq\">\\(y\\)\u003c/span>\u003cspan class=\"heq\">\\(=a^{x} -1\\)\u003c/span>과 제\u003cspan class=\"heq\">\\(1\\)\u003c/span>사분면에서 만나는 점 \u003cspan class=\"heq\">\\(B\\)\u003c/span>라 하자. \u003cbr>\u003cspan class=\"heq\">\\({\\overline{OA}} \\,:\\, {\\overline{OB}}\\)\u003c/span>\u003cspan class=\"heq\">\\(= \\sqrt{3} \\,:\\, \\sqrt{19}\\)\u003c/span>일 때, 선분 \u003cspan class=\"heq\">\\(A B\\)\u003c/span>의 길이를 구하시오.\u003cbr>(단, \u003cspan class=\"heq\">\\(O\\)\u003c/span>는 원점이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/97f7436f429bd73fbdbf1c4a.png\" style=\"width:303px;max-width:100%\">\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"30da49433abf2e48e0fc137848f06f7ac3a1bb87a142dd2a6db3841225dd6afb"};</script>
<script>window.HandStudyGuide={"itemId":17263,"sourceHash":"0b282ba8b3041986fdcdb6b6c26cc2b6e4a4b8df5fca01790de10124b7e5b09d","contentHash":"fbc32c5f97ed139b512e83469491912522cb577a0b63336a9d7be44c5b3db608","overview":{"goal":"직각삼각형의 세 길이로 두 점의 좌표를 정하고 지수식 두 개에서 매개변수를 구해요.","firstLook":"\\(AB\\perp OA\\)이므로 삼각형 \\(OAB\\)는 \\(A\\)에서 직각이에요. 주어진 길이 비를 한 문자로 놓으면 \\(AB\\)도 바로 나와요.","conditions":[{"label":"길이 비","meaning":"\\(OA=\\sqrt3k\\), \\(OB=\\sqrt{19}k\\)로 놓아요."},{"label":"점의 위치","meaning":"그림과 곡선 조건에서 \\(A\\)는 제2사분면, \\(B\\)는 제1사분면에 있어 좌표 부호가 정해져요."}]},"chapters":[{"id":"c1","label":"직각삼각형의 길이와 좌표를 정해요","stepIds":["s1","s2","s3"],"question":"\\(A,B\\)의 좌표를 \\(k\\)로 어떻게 나타낼까요?","hint":"직선 \\(OA\\)의 기울기가 \\(-\\sqrt3\\)이고 \\(AB\\)는 이에 수직이에요.","explanation":"\\(OA=\\sqrt3k\\), \\(OB=\\sqrt{19}k\\)로 놓으면 피타고라스 정리에서 \\(AB=\\sqrt{19k^2-3k^2}=4k\\)예요. \\(A\\)는 제2사분면의 직선 \\(y=-\\sqrt3x\\) 위에 있으므로 \\(A=(-\\sqrt3k/2,3k/2)\\)예요. \\(A\\)에서 \\(OA\\)에 수직인 제1사분면 방향으로 길이 \\(4k\\)만큼 가면 좌표 차가 \\((2\\sqrt3k,2k)\\)이므로 \\(B=(3\\sqrt3k/2,7k/2)\\)예요.","check":{"prompt":"구한 \\(B\\)가 길이 조건을 만족하나요?","answer":"\\(OB^2=(27/4+49/4)k^2=19k^2\\)이므로 \\(OB=\\sqrt{19}k\\)예요."}},{"id":"c2","label":"두 점을 지수곡선에 넣어요","stepIds":["s4","s5","s6"],"question":"두 지수식에서 \\(a\\)를 어떻게 없앨까요?","hint":"\\(a^{\\sqrt3k}\\)를 하나의 값으로 보고 지수 \\(3/2\\)의 관계를 이용해요.","explanation":"\\(A\\)를 첫 곡선에 넣으면 \\(a^{\\sqrt3k}=(3k+2)/2\\)예요. \\(B\\)를 둘째 곡선에 넣으면 \\(a^{3\\sqrt3k/2}=(7k+2)/2\\)예요. 왼쪽의 둘째 식은 첫째 식의 \\(3/2\\)제곱이므로 양변을 제곱해 \\(\\{(3k+2)/2\\}^3=\\{(7k+2)/2\\}^2\\)를 얻어요.","check":{"prompt":"제곱 과정에서 부호 문제가 생기지 않나요?","answer":"\\(k>0\\)이고 두 식의 양변은 지수함숫값이라 모두 양수이므로 제곱해도 거짓 후보가 생기지 않아요."}},{"id":"c3","label":"길이이므로 양수인 해만 골라요","stepIds":["s7","s8"],"question":"\\(k\\)와 \\(AB\\)는 얼마일까요?","hint":"전개한 식을 인수분해하고 \\(k>0\\)을 써요.","explanation":"정리하면 \\(k(k-2)(27k+10)=0\\)이에요. 길이의 비례상수이므로 \\(k>0\\)이고, \\(k=0\\)과 \\(k=-10/27\\)은 제외돼 \\(k=2\\)예요. 따라서 \\(AB=4k=8\\)이에요.","check":{"prompt":"왜 \\(k=0\\)은 허용되지 않나요?","answer":"\\(OA=\\sqrt3k\\)가 0이면 서로 다른 두 교점 \\(O,A\\)가 같은 점이 되어 조건에 어긋나요."}}],"takeaway":["직각 조건과 두 길이의 비가 있으면 공통 배수로 놓고 피타고라스 정리로 세 번째 길이를 구해요.","직선의 기울기와 사분면을 함께 써야 좌표의 부호와 이동 방향을 정확히 정할 수 있어요."]};</script>
