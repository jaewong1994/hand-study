  <script>window.HandStudyRecord={"itemId":16391,"sourceLabel":"2019 교육청 고3 수리나형 3월 19번","adminYear":2019,"grade":3,"month":3,"number":19,"track":"수리나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 중심이 $O _{1}$, 반지름의 길이가 $2\\,$이고 중심각의 크기가 $90°\\,$인 부채꼴 $O _{1} A _{1} B _{1} \\,$에서 두 선분 $O _{1} A _{1} \\,$, $O _{1} B _{1}$ 위에 두 점 $M _{1}$, $O _{2} \\,$를 각각 $\\overline{O _{1} M _{1} }= \\frac{\\sqrt{2}}{2} \\overline{O _{1} A _{1} }\\,$, ${\\overline{O _{1} O _{2}}} = \\frac{\\sqrt{2}}{2} {\\overline{O _{1} B _{1}}} \\,$이 되도록 정하자. 두 점 $M _{1}$, $O _{2} \\,$와 호 $A _{1} B _{1}$ 위의 두 점 $C _{1}$, $A _{2} \\,$를 꼭짓점으로 하는 직사각형 $O _{2} M _{1} C _{1} A _{2} \\,$를 그리고, 직사각형 $O _{2} M _{1} C _{1} A _{2} \\,$와 삼각형 $O _{1} C _{1} A _{2} \\,$의 내부의 공통부분에 색칠하여 얻은 그림을 $R _{\\,1} \\,$이라 하자. 그림 $R _{\\,1} \\,$에 중심이 $O _{2}$, 반지름의 길이가 $\\overline{O _{2} A _{2} }\\,$이고 중심각의 크기가 $90°\\,$인 부채꼴 $O _{2} A _{2} B _{2} \\,$를 점 $B _{2} \\,$가 부채꼴 $O _{1} A _{1} B _{1} \\,$의 외부에 있도록 그리고, 두 선분 $O _{2} A _{2} \\,$, $O _{2} B _{2}$ 위에 두 점 $M _{2}$, $O _{3} \\,$을 각각 ${\\overline{O _{2} M _{2}}} = \\frac{\\sqrt{2}}{2} {\\overline{O _{2} A _{2}}} \\,$, ${\\overline{O _{2} O _{3}}} = \\frac{\\sqrt{2}}{2} {\\overline{O _{2} B _{2}}} \\,$가 되도록 정하자. 두 점 $M _{2}$, $O _{3} \\,$과 호 $A _{2} B _{2}$ 위의 두 점 $C _{2}$, $A _{3} \\,$을 꼭짓점으로 하는 직사각형 $O _{3} M _{2} C _{2} A _{3} \\,$을 그리고, 직사각형 $O _{3} M _{2} C _{2} A _{3} \\,$과 삼각형 $O _{2} C _{2} A _{3} \\,$의 내부의 공통부분에 색칠하여 얻은 그림을 $R _{\\,2} \\,$라 하자. 이와 같은 과정을 계속하여 $n\\,$번째 얻은 그림 $R _{\\,n} \\,$에 색칠되어 있는 부분의 넓이를 $S _{n} \\,$이라 할 때, $\\lim _{n \\,->\\, \\infty } {S _{n}} \\,$의 값은? [4점]\n \n① $\\frac{7}{6}$ ② $\\frac{4}{3}$ ③ $\\frac{3}{2}$ ④ $\\frac{5}{3}$ ⑤ $\\frac{11}{6}$","answer":"②","sourceHash":"e747ae654123e9e831e98cc834f5cc0587a2096d6fefb6efb9d23584cce21e82","steps":[{"id":"s1","latex":"a_n=S_n-S_{n-1},\\quad S_0=0\\quad\\text{(이번 단계에서 더해진 넓이)}"},{"id":"s2","latex":"O_1M_1=O_1O_2=\\sqrt2\\Rightarrow M_1O_2=2"},{"id":"s3","latex":"C_1A_2=M_1O_2=2,\\quad O_1C_1=O_1A_2=2"},{"id":"s4","latex":"\\therefore\\triangle O_1C_1A_2\\text{는 한 변이 }2\\text{인 정삼각형}"},{"id":"s5","latex":"\\text{점 }O_1\\text{에서 직선 }O_2M_1,\\ C_1A_2\\text{까지 거리}:\\quad1,\\ \\sqrt3"},{"id":"s6","latex":"S_1=\\left(1-\\dfrac{1^2}{(\\sqrt3)^2}\\right)\\cdot\\dfrac{\\sqrt3}{4}\\cdot2^2=\\dfrac{2\\sqrt3}{3}"},{"id":"s7","latex":"r_n=O_nA_n,\\quad r_2=O_2A_2=\\sqrt3-1,\\quad r_1=2"},{"id":"s8","latex":"\\dfrac{r_{n+1}}{r_n}=\\dfrac{\\sqrt3-1}{2}\\Rightarrow\\dfrac{a_{n+1}}{a_n}=1-\\dfrac{\\sqrt3}{2}"},{"id":"s9","latex":"\\lim_{n\\to\\infty}S_n=\\dfrac{2\\sqrt3/3}{\\sqrt3/2}=\\dfrac43"}],"diagram":null,"contentHash":"4d230e6ac8be9ca9e3e6f7304c3dce7a4ee0e99a14dc3c3756decaf50de3ae00","questionHtml":"\u003cp class=\"hp htall\">그림과 같이 중심이 \u003cspan class=\"heq\">\\(O_{1}\\)\u003c/span>, 반지름의 길이가 \u003cspan class=\"heq\">\\(2\\,\\)\u003c/span>이고 중심각의 크기가 \u003cspan class=\"heq\">\\(90^{\\circ}\\,\\)\u003c/span>인 부채꼴 \u003cspan class=\"heq\">\\(O_{1} A_{1} B_{1} \\,\\)\u003c/span>에서 두 선분 \u003cspan class=\"heq\">\\(O_{1} A_{1} \\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(O_{1} B_{1}\\)\u003c/span> 위에 두 점 \u003cspan class=\"heq\">\\(M_{1}\\)\u003c/span>, \u003cspan class=\"heq\">\\(O_{2} \\,\\)\u003c/span>를 각각 \u003cspan class=\"heq\">\\(\\overline{O_{1} M_{1} }= \\dfrac{\\sqrt{2}}{2} \\overline{O_{1} A_{1} }\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\({\\overline{O_{1} O_{2}}} = \\dfrac{\\sqrt{2}}{2} {\\overline{O_{1} B_{1}}} \\,\\)\u003c/span>이 되도록 정하자. 두 점 \u003cspan class=\"heq\">\\(M_{1}\\)\u003c/span>, \u003cspan class=\"heq\">\\(O_{2} \\,\\)\u003c/span>와 호 \u003cspan class=\"heq\">\\(A_{1} B_{1}\\)\u003c/span> 위의 두 점 \u003cspan class=\"heq\">\\(C_{1}\\)\u003c/span>, \u003cspan class=\"heq\">\\(A_{2} \\,\\)\u003c/span>를 꼭짓점으로 하는 직사각형 \u003cspan class=\"heq\">\\(O_{2} M_{1} C_{1} A_{2} \\,\\)\u003c/span>를 그리고, 직사각형 \u003cspan class=\"heq\">\\(O_{2} M_{1} C_{1} A_{2} \\,\\)\u003c/span>와 삼각형 \u003cspan class=\"heq\">\\(O_{1} C_{1} A_{2} \\,\\)\u003c/span>의 내부의 공통부분에 색칠하여 얻은 그림을 \u003cspan class=\"heq\">\\(R_{\\,1} \\,\\)\u003c/span>이라 하자.\u003cbr>그림 \u003cspan class=\"heq\">\\(R_{\\,1} \\,\\)\u003c/span>에 중심이 \u003cspan class=\"heq\">\\(O_{2}\\)\u003c/span>, 반지름의 길이가 \u003cspan class=\"heq\">\\(\\overline{O_{2} A_{2} }\\,\\)\u003c/span>이고 중심각의 크기가 \u003cspan class=\"heq\">\\(90^{\\circ}\\,\\)\u003c/span>인 부채꼴 \u003cspan class=\"heq\">\\(O_{2} A_{2} B_{2} \\,\\)\u003c/span>를 점 \u003cspan class=\"heq\">\\(B_{2} \\,\\)\u003c/span>가 부채꼴 \u003cspan class=\"heq\">\\(O_{1} A_{1} B_{1} \\,\\)\u003c/span>의 외부에 있도록 그리고, 두 선분 \u003cspan class=\"heq\">\\(O_{2} A_{2} \\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(O_{2} B_{2}\\)\u003c/span> 위에 두 점 \u003cspan class=\"heq\">\\(M_{2}\\)\u003c/span>, \u003cspan class=\"heq\">\\(O_{3} \\,\\)\u003c/span>을 각각 \u003cspan class=\"heq\">\\({\\overline{O_{2} M_{2}}} = \\dfrac{\\sqrt{2}}{2} {\\overline{O_{2} A_{2}}} \\,\\)\u003c/span>, \u003cspan class=\"heq\">\\({\\overline{O_{2} O_{3}}} = \\dfrac{\\sqrt{2}}{2} {\\overline{O_{2} B_{2}}} \\,\\)\u003c/span>가 되도록 정하자. 두 점 \u003cspan class=\"heq\">\\(M_{2}\\)\u003c/span>, \u003cspan class=\"heq\">\\(O_{3} \\,\\)\u003c/span>과 호 \u003cspan class=\"heq\">\\(A_{2} B_{2}\\)\u003c/span> 위의 두 점 \u003cspan class=\"heq\">\\(C_{2}\\)\u003c/span>, \u003cspan class=\"heq\">\\(A_{3} \\,\\)\u003c/span>을 꼭짓점으로 하는 직사각형 \u003cspan class=\"heq\">\\(O_{3} M_{2} C_{2} A_{3} \\,\\)\u003c/span>을 그리고, 직사각형 \u003cspan class=\"heq\">\\(O_{3} M_{2} C_{2} A_{3} \\,\\)\u003c/span>과 삼각형 \u003cspan class=\"heq\">\\(O_{2} C_{2} A_{3} \\,\\)\u003c/span>의 내부의 공통부분에 색칠하여 얻은 그림을 \u003cspan class=\"heq\">\\(R_{\\,2} \\,\\)\u003c/span>라 하자.\u003cbr>이와 같은 과정을 계속하여 \u003cspan class=\"heq\">\\(n\\,\\)\u003c/span>번째 얻은 그림 \u003cspan class=\"heq\">\\(R_{\\,n} \\,\\)\u003c/span>에 색칠되어 있는 부분의 넓이를 \u003cspan class=\"heq\">\\(S_{n} \\,\\)\u003c/span>이라 할 때, \u003cspan class=\"heq\">\\(\\lim\\limits_{n \\,\\to \\, \\infty } {S_{n}} \\,\\)\u003c/span>의 값은? \u003cspan cl
