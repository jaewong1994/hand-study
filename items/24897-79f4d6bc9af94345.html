  <script>window.HandStudyRecord={"adminYear":2023,"answer":"④","contentHash":"47e5dfe8c11b66392f2b58aecb5e61b30a928c24eb40c5a0f3ceb06294c22b4f","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24897,"month":11,"number":28,"points":4,"preview":false,"questionHtml":"\u003cp>하나의 주머니와 두 상자 \u003cspan class=\"heq\">\\({{A}}\\)\u003c/span>, \u003cspan class=\"heq\">\\({{B}}\\)\u003c/span>가 있다. 주머니에는 숫자 \u003cspan class=\"heq\">\\(1\\)\u003c/span>, \u003cspan class=\"heq\">\\(2\\)\u003c/span>, \u003cspan class=\"heq\">\\(3\\)\u003c/span>, \u003cspan class=\"heq\">\\(4\\)\u003c/span>가 하나씩 적힌 \u003cspan class=\"heq\">\\(4\\)\u003c/span>장의 카드가 들어 있고, 상자 \u003cspan class=\"heq\">\\({{A}}\\)\u003c/span>에는 흰 공과 검은 공이 각각 \u003cspan class=\"heq\">\\(8\\)\u003c/span>개 이상 들어 있고, 상자 \u003cspan class=\"heq\">\\({{B}}\\)\u003c/span>는 비어 있다. 이 주머니와 두 상자 \u003cspan class=\"heq\">\\({{A}}\\)\u003c/span>, \u003cspan class=\"heq\">\\({{B}}\\)\u003c/span>를 사용하여 다음 시행을 한다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp>주머니에서 임의로 한 장의 카드를 꺼내어 카드에 적힌 수를 확인한 후 다시 주머니에 넣는다.확인한 수가 \u003cspan class=\"heq\">\\(1\\)\u003c/span>이면상자 \u003cspan class=\"heq\">\\(A\\)\u003c/span>에 있는 흰 공 \u003cspan class=\"heq\">\\(1\\)\u003c/span>개를 상자 \u003cspan class=\"heq\">\\({{B}}\\)\u003c/span>에 넣고, 확인한 수가 \u003cspan class=\"heq\">\\(2\\)\u003c/span> 또는 \u003cspan class=\"heq\">\\(3\\)\u003c/span>이면상자 \u003cspan class=\"heq\">\\(A\\)\u003c/span>에 있는 흰 공 \u003cspan class=\"heq\">\\(1\\)\u003c/span>개와 검은 공 \u003cspan class=\"heq\">\\(1\\)\u003c/span>개를 상자 \u003cspan class=\"heq\">\\({{B}}\\)\u003c/span>에 넣고, 확인한 수가 \u003cspan class=\"heq\">\\(4\\)\u003c/span>이면상자 \u003cspan class=\"heq\">\\({{A}}\\)\u003c/span>에 있는 흰 공 \u003cspan class=\"heq\">\\(2\\)\u003c/span>개와 검은 공 \u003cspan class=\"heq\">\\(1\\)\u003c/span>개를 상자 \u003cspan class=\"heq\">\\({{B}}\\)\u003c/span>에 넣는다.\u003c/p>\u003c/div>\u003cp>이 시행을 \u003cspan class=\"heq\">\\(4\\)\u003c/span>번 반복한 후 상자 \u003cspan class=\"heq\">\\({{B}}\\)\u003c/span>에 들어 있는 공의 개수가 \u003cspan class=\"heq\">\\(8\\)\u003c/span>일 때, 상자 \u003cspan class=\"heq\">\\({{B}}\\)\u003c/span>에 들어 있는 검은 공의 개수가 \u003cspan class=\"heq\">\\(2\\)\u003c/span>일 확률은? [4점]\u003c/p>\u003cdiv class=\"hchoices\">\u003cdiv class=\"hch\">① \u003cspan class=\"heq\">\\(\\frac{3}{70}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">② \u003cspan class=\"heq\">\\(\\frac{2}{35}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">③ \u003cspan class=\"heq\">\\(\\frac{1}{14}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">④ \u003cspan class=\"heq\">\\(\\frac{3}{35}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">⑤ \u003cspan class=\"heq\">\\(\\frac{1}{10}\\)\u003c/span>\u003c/div>\u003c/div>","questionText":"하나의 주머니와 두 상자 ${{A}}$, ${{B}}$가 있다. 주머니에는 숫자 $1$, $2$, $3$, $4$가 하나씩 적힌 $4$장의 카드가 들어 있고, 상자 ${{A}}$에는 흰 공과 검은 공이 각각 $8$개 이상 들어 있고, 상자 ${{B}}$는 비어 있다. 이 주머니와 두 상자 ${{A}}$, ${{B}}$를 사용하여 다음 시행을 한다.\n주머니에서 임의로 한 장의 카드를 꺼내어 카드에 적힌 수를 확인한 후 다시 주머니에 넣는다.확인한 수가 $1$이면상자 $A$에 있는 흰 공 $1$개를 상자 ${{B}}$에 넣고, 확인한 수가 $2$ 또는 $3$이면상자 $A$에 있는 흰 공 $1$개와 검은 공 $1$개를 상자 ${{B}}$에 넣고, 확인한 수가 $4$이면상자 ${{A}}$에 있는 흰 공 $2$개와 검은 공 $1$개를 상자 ${{B}}$에 넣는다.\n이 시행을 $4$번 반복한 후 상자 ${{B}}$에 들어 있는 공의 개수가 $8$일 때, 상자 ${{B}}$에 들어 있는 검은 공의 개수가 $2$일 확률은? [4점]\n① $\\frac{3}{70}$ ② $\\frac{2}{35}$ ③ $\\frac{1}{14}$ ④ $\\frac{3}{35}$ ⑤ $\\frac{1}{10}$\n단답형","sourceHash":"1a142d9b5767f073fa41724b575a09e3d20bbd6ae81fe5249d6ea56499f6f2cb","sourceKind":"csat","sourceLabel":"2023년 시행 수능 · 2024학년도 · 확률과 통계 · 28번","steps":[{"id":"s1","latex":"1,\\ \\{2,3\\},\\ 4\\text{가 나온 횟수를 각각 }x,y,z\\text{라 하면 }x+y+z=4"},{"id":"s2","latex":"\\text{전체 공 수 조건은 }x+2y+3z=8\\Rightarrow y+2z=4"},{"id":"s3","latex":"(x,y,z)=(0,4,0),(1,2,1),(2,0,2)"},{"id":"s4","latex":"\\text{검은 공 수는 }y+z\\text{이므로 }2\\text{개인 경우는 }(2,0,2)\\text{뿐이다.}"},{"id":"s5","latex":"P(x,y,z)=\\frac{4!}{x!y!z!}\\left(\\frac14\\right)^x\\left(\\frac12\\right)^y\\left(\\frac14\\right)^z"},{"id":"s6","latex":"P(0,4,0)=\\frac1{16},\\quad P(1,2,1)=\\frac3{16},\\quad P(2,0,2)=\\frac3{128}"},{"explanation":{"body":"분모에는 전체 공이 8개가 되는 세 조합을 모두 더합니다. 분자에는 그중 검은 공이 2개인 \\((2,0,2)\\)만 둡니다. 각 조합은 1, {2,3}, 4가 나올 확률이 서로 달라 다항분포의 가중치를 그대로 써야 합니다.","skillTags":["조건부확률","다항분포"],"title":"조건부확률의 분모와 분자"},"id":"s7","latex":"P\\bigl(y+z=2\\mid\\text{전체 }8\\text{개}\\bigr)=\\frac{3/128}{1/16+3/16+3/128}=\\frac3{35}"},{"id":"s8","latex":"\\therefore\\ \\boxed{\\frac3{35}}\\;(④)"}],"track":"확률과 통계"};</script>
