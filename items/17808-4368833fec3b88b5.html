<script>window.HandStudyRecord={"itemId":17808,"sourceLabel":"2023 평가원 고3 수학확통 6월 29번","adminYear":2023,"grade":3,"month":6,"number":29,"track":"확통","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 $2$장의 검은색 카드와 $1$부터 $8$까지의 자연수가 하나씩 적혀 있는 $8$장의 흰색 카드가 있다. 이 카드를 모두 한 번씩 사용하여 왼쪽에서 오른쪽으로 일렬로 배열할 때, 다음 조건을 만족시키는 경우의 수를 구하시오. (단, 검은색 카드는 서로 구별하지 않는다.) [4점]\n (가) 흰색 카드에 적힌 수가 작은 수부터 크기순으로 왼쪽에서 오른쪽으로 배열되도록 카드가 놓여 있다. (나) 검은색 카드 사이에는 흰색 카드가 $2$장 이상 놓여 있다. (다) 검은색 카드 사이에는 $3$의 배수가 적힌 흰색 카드가 $1$장 이상 놓여 있다.","answer":"25","sourceHash":"0710bd11e6b5ba8cf3c64dd8abfe5354238e0f1b0af96382ad16bb4380241fbd","steps":[{"id":"s1","latex":"x_0,x_1,x_2:=\\text{왼쪽, 사이, 오른쪽의 흰 카드 수}"},{"id":"s2","latex":"x_0+x_1+x_2=8\\quad(x_i\\ge0),\\qquad x_1\\ge2"},{"id":"s3","latex":"\\#\\{(x_0,x_1,x_2)\\}=\\sum_{x_1=2}^{8}(9-x_1)=28"},{"id":"s4","latex":"\\{3,6\\}\\cap\\{x_0+1,\\ldots,x_0+x_1\\}=\\varnothing"},{"id":"s5","latex":"(x_0,x_1)=(0,2),(3,2),(6,2)\\quad\\Rightarrow\\quad3\\text{가지}"},{"id":"s6","latex":"28-3=25"}],"diagram":null,"contentHash":"c48d2b1b34b4ed19b416aeabb8b5295a02d3c4761516cf76e7f6daa3f67667d1","questionHtml":"\u003cp class=\"hp\">그림과 같이 \u003cspan class=\"heq\">\\(2\\)\u003c/span>장의 검은색 카드와 \u003cspan class=\"heq\">\\(1\\)\u003c/span>부터 \u003cspan class=\"heq\">\\(8\\)\u003c/span>까지의 자연수가 하나씩 적혀 있는 \u003cspan class=\"heq\">\\(8\\)\u003c/span>장의 흰색 카드가 있다. 이 카드를 모두 한 번씩 사용하여 왼쪽에서 오른쪽으로 일렬로 배열할 때, 다음 조건을 만족시키는 경우의 수를 구하시오. (단, 검은색 카드는 서로 구별하지 않는다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) 흰색 카드에 적힌 수가 작은 수부터 크기순으로 왼쪽에서 오른쪽으로 배열되도록 카드가 놓여 있다.\u003c/p>\u003cp class=\"hp\">(나) 검은색 카드 사이에는 흰색 카드가 \u003cspan class=\"heq\">\\(2\\)\u003c/span>장 이상 놓여 있다.\u003c/p>\u003cp class=\"hp\">(다) 검은색 카드 사이에는 \u003cspan class=\"heq\">\\(3\\)\u003c/span>의 배수가 적힌 흰색 카드가 \u003cspan class=\"heq\">\\(1\\)\u003c/span>장 이상 놓여 있다.\u003c/p>\u003c/div>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/cb7af2acbbef819755d14aaf.png\" style=\"width:368px;max-width:100%\">\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"4368833fec3b88b50e41aa6126eca65a8f82ea350e4a7f8e23bff2bdd6005008"};</script>
<script>window.HandStudyGuide={"itemId":17808,"sourceHash":"0710bd11e6b5ba8cf3c64dd8abfe5354238e0f1b0af96382ad16bb4380241fbd","contentHash":"c48d2b1b34b4ed19b416aeabb8b5295a02d3c4761516cf76e7f6daa3f67667d1","overview":{"goal":"흰 카드의 순서가 이미 정해져 있다는 점을 이용해 두 검은 카드가 들어갈 자리를 세어요.","firstLook":"흰 카드는 반드시 1부터 8까지 차례로 놓여요. 따라서 배열 전체를 다시 순열로 세지 말고, 첫 검은 카드의 왼쪽과 두 검은 카드 사이에 흰 카드가 몇 장 있는지만 정하면 돼요.","conditions":[{"label":"흰 카드 순서","meaning":"흰 카드끼리의 상대적인 순서는 1, 2, ..., 8로 하나뿐이에요."},{"label":"두 장 이상","meaning":"두 검은 카드 사이의 흰 카드 수는 2 이상이에요."},{"label":"3의 배수","meaning":"두 검은 카드 사이의 연속한 흰 카드 묶음에 3 또는 6이 들어가야 해요."}]},"chapters":[{"id":"c1","label":"검은 카드가 나누는 세 구간을 세어요","stepIds":["s1","s2","s3"],"question":"흰 카드 8장을 세 구간에 나누어 놓는 것으로 바꾸면 조건 (나)는 어떻게 나타날까요?","hint":"첫 검은 카드의 왼쪽, 두 검은 카드 사이, 둘째 검은 카드의 오른쪽에 놓이는 흰 카드 수를 차례로 정해요.","explanation":"세 구간의 흰 카드 수를 \\(x_0,x_1,x_2\\)라 하면 \\(x_0+x_1+x_2=8\\)이고 각각 0 이상이에요. 두 검은 카드 사이에는 흰 카드가 2장 이상 있어야 하므로 \\(x_1\\ge2\\)예요.\n\n\\(x_1=t\\)로 정하면 남은 \\(8-t\\)장을 왼쪽과 오른쪽에 나누는 식은 \\(x_0+x_2=8-t\\)예요. \\(x_0\\)는 \\(0,1,\\ldots,8-t\\) 중 하나이므로 \\(9-t\\)가지예요. 따라서 조건 (나)까지 만족하는 배열은 \\(\\sum_{t=2}^{8}(9-t)=7+6+5+4+3+2+1=28\\)가지예요.","check":{"prompt":"\\(x_1=5\\)일 때 왼쪽과 오른쪽에 흰 카드를 나누는 방법은 몇 가지이고, 왜 그런가요?","answer":"\\(x_0+x_2=3\\)이므로 \\((0,3),(1,2),(2,1),(3,0)\\)의 4가지예요."}},{"id":"c2","label":"3과 6이 없는 묶음을 모두 찾아요","stepIds":["s4","s5"],"question":"28가지 가운데 두 검은 카드 사이에 3과 6이 모두 없는 경우는 왜 정확히 3가지일까요?","hint":"사이의 흰 카드는 \\(x_0+1\\)부터 \\(x_0+x_1\\)까지 이어진 수들이고, 길이는 적어도 2예요.","explanation":"조건 (다)를 바로 세기보다 반대 경우를 빼는 편이 간단해요. 두 검은 카드 사이에는 \\(x_0+1,x_0+2,\\ldots,x_0+x_1\\)이 놓여요. 이 연속한 수들에 3과 6이 모두 없어야 탈락이에요.\n\n1부터 8까지에서 3과 6을 경계로 끊으면 \\(\\{1,2\\},\\{4,5\\},\\{7,8\\}\\)만 남아요. 각 묶음의 길이가 2뿐이고 사이에는 적어도 2장이 있어야 하므로, 탈락하는 구간은 이 세 묶음 전체를 택하는 경우뿐이에요. 곧 \\((x_0,x_1)=(0,2),(3,2),(6,2)\\)의 3가지예요. 길이를 3 이상으로 늘리면 반드시 3 또는 6을 포함하므로 빠진 경우는 없어요.","check":{"prompt":"두 검은 카드 사이에 흰 카드가 3장 이상이면 조건 (다)가 자동으로 성립하는 이유는 무엇인가요?","answer":"1부터 8까지의 연속한 세 자연수에는 3의 배수가 하나씩 있으므로, 그 구간에는 3 또는 6이 반드시 들어가요."}},{"id":"c3","label":"반대 경우를 빼서 답을 정해요","stepIds":["s6"],"question":"조건 (가), (나)를 만족하는 배열에서 조건 (다)를 어기는 배열을 빼면 얼마인가요?","hint":"전체 28가지에서 방금 찾은 세 구간을 빼요.","explanation":"조건 (가), (나)를 만족하는 28가지 가운데 조건 (다)를 어기는 경우가 3가지였어요. 따라서 세 조건을 모두 만족하는 경우의 수는 \\(28-3=25\\)예요. 검은 카드는 서로 구별하지 않으므로 같은 두 자리를 검은 카드의 순서를 바꾸어 다시 세지 않아요.","check":{"prompt":"마지막에 2를 곱하지 않는 이유는 무엇인가요?","answer":"두 검은 카드는 서로 구별하지 않으므로 자리가 정해지면 배열은 하나뿐이에요."}}],"takeaway":["상대적인 순서가 고정된 물건 사이에 같은 물건을 넣을 때는 각 구간의 물건 수로 바꿔 세어요.","적어도 하나를 포함한다는 조건은 포함하지 않는 연속 구간을 모두 찾은 뒤 빼면 간단해질 수 있어요.","연속 구간을 셀 때는 길이의 경계와 금지된 수 사이의 간격을 함께 확인해야 빠진 경우가 없어요."]};</script>
