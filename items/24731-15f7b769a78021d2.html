<script>window.HandStudyRecord={"adminYear":2020,"answer":"29","contentHash":"2a08c037364a38cf78d08bb0104b8a76c5681b1969fce94636b70462e6806669","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24731,"month":12,"number":30,"points":4,"preview":false,"questionHtml":"\u003cp>최고차항의 계수가 \u003cspan class=\"heq\">\\(1\\)\u003c/span>인 삼차함수 \u003cspan class=\"heq\">\\(f(x)\\)\u003c/span>에 대하여 실수 전체의 집합에서 정의된 함수 \u003cspan class=\"heq\">\\(g(x)\\,=\\, f( \\sin^2 \\pi x )\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox hcond\">\u003cp class=\"hcondr\">(가) \u003cspan class=\"heq\">\\(0 \\,&lt;\\, x \\, &lt;\\,1\\)\u003c/span>에서 함수 \u003cspan class=\"heq\">\\(g(x)\\)\u003c/span>가 극대가 되는 \u003cspan class=\"heq\">\\(x\\)\u003c/span>의 개수가 \u003cspan class=\"heq\">\\(3\\)\u003c/span>이고, 이 때 극댓값이 모두 동일하다. \u003c/p>\u003cp class=\"hcondr\">(나) 함수 \u003cspan class=\"heq\">\\(g(x)\\)\u003c/span>의 최댓값은 \u003cspan class=\"heq\">\\(\\frac{1}{2}\\)\u003c/span>이고 최솟값은 \u003cspan class=\"heq\">\\(0\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp>\u003cspan class=\"heq\">\\(f(2) \\,=\\, a+b \\sqrt{2}\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(a^2 \\,+\\, b^2\\)\u003c/span>의 값을 구하시오.(단, \u003cspan class=\"heq\">\\(a\\)\u003c/span>와 \u003cspan class=\"heq\">\\(b\\)\u003c/span>는 유리수이다.) [4점]\u003c/p>","questionText":"최고차항의 계수가 $1$인 삼차함수 $f(x)$에 대하여 실수 전체의 집합에서 정의된 함수 $g(x)\\,=\\, f( \\sin^2 \\pi x )$가 다음 조건을 만족시킨다.\n(가) $0 \\,\u003c\\, x \\, \u003c\\,1$에서 함수 $g(x)$가 극대가 되는 $x$의 개수가 $3$이고, 이 때 극댓값이 모두 동일하다. (나) 함수 $g(x)$의 최댓값은 $\\frac{1}{2}$이고 최솟값은 $0$이다.\n$f(2) \\,=\\, a+b \\sqrt{2}$일 때, $a^2 \\,+\\, b^2$의 값을 구하시오.(단, $a$와 $b$는 유리수이다.) [4점]","sourceHash":"8d8127817fef8a093964b78d65518ca0c16c7c4ec2f64d63a2cc62d9fbc44e4e","sourceKind":"csat","sourceLabel":"2020년 시행 수능 · 2021학년도 · 가형 · 30번","steps":[{"id":"s1","latex":"t=\\sin^2\\pi x:\\quad0\u003cx\u003c\\tfrac12\\text{에서는 }0\\to1,\\quad\\tfrac12\u003cx\u003c1\\text{에서는 }1\\to0"},{"id":"s2","latex":"\\text{극대점 3개를 가지려면 }f\\text{는 }0\u003cu\u003cv\u003c1\\text{에서 각각 극대, 극소를 가진다.}"},{"id":"s3","latex":"\\text{두 극대점은 }t=u,\\text{나머지 하나는 }x=\\tfrac12\\ (t=1)\\text{에 대응한다.}"},{"id":"s4","latex":"f(u)=f(1)=\\frac12,\\quad f\\prime(u)=0\\ \\Rightarrow\\ f(t)-\\frac12=(t-u)^2(t-1)"},{"id":"s5","latex":"f\\prime(t)=(t-u)(3t-u-2)\\ \\Rightarrow\\ v=\\frac{u+2}{3}"},{"id":"s6","latex":"f(v)=\\frac12-\\frac{4(1-u)^3}{27}>\\frac12-\\frac4{27}>0"},{"id":"s7","latex":"0\\le t\\le1\\text{에서 최솟값이 }0\\text{이므로 }f(0)=0"},{"id":"s8","latex":"\\frac12-u^2=0,\\quad0\u003cu\u003c1\\ \\Rightarrow\\ u=\\frac{\\sqrt2}{2}"},{"id":"s9","latex":"f(2)=\\left(2-\\frac{\\sqrt2}{2}\\right)^2+\\frac12=5-2\\sqrt2"},{"id":"s10","latex":"a=5,\\quad b=-2\\ \\Rightarrow\\ \\boxed{a^2+b^2=29}"}],"track":"가형"};</script>
<script>window.HandStudyGuide={"itemId":24731,"sourceHash":"8d8127817fef8a093964b78d65518ca0c16c7c4ec2f64d63a2cc62d9fbc44e4e","contentHash":"2a08c037364a38cf78d08bb0104b8a76c5681b1969fce94636b70462e6806669","overview":{"goal":"\\(\\sin^2\\pi x\\)의 왕복 운동을 이용해 삼차함수 \\(f\\)의 극대·극소 위치를 정해요.","firstLook":"\\(0<x<1\\)에서 \\(t=\\sin^2\\pi x\\)는 \\(0\\)에서 \\(1\\)까지 갔다가 다시 \\(0\\)으로 돌아와요. \\(f\\)의 한 내부 극대는 \\(g\\)에서 좌우 두 점의 극대로 복제돼요.","conditions":[{"label":"(가)","meaning":"극대점 세 개 중 두 개는 같은 \\(t=u\\)에서, 나머지 하나는 \\(t=1\\)에서 생겨요."},{"label":"(나)","meaning":"\\(0\\le t\\le1\\)에서 \\(f\\)의 가장 큰 값은 \\(1/2\\), 가장 작은 값은 \\(0\\)이에요."}]},"chapters":[{"id":"c1","label":"합성함수의 극대점 세 개를 해석해요","stepIds":["s1","s2","s3"],"question":"왜 \\(f\\)의 내부 극대점 하나가 \\(g\\)에서는 두 극대점으로 나타날까요?","hint":"\\(t=\\sin^2\\pi x\\)가 같은 내부값을 \\(0<x<1/2\\)와 \\(1/2<x<1\\)에서 한 번씩 가져요.","explanation":"\\(0<x<1/2\\)에서 \\(t=\\sin^2\\pi x\\)는 \\(0\\)에서 \\(1\\)까지 증가하고, \\(1/2<x<1\\)에서는 \\(1\\)에서 \\(0\\)까지 감소해요. 따라서 \\(0<u<1\\)에서 \\(f\\)가 극대이면 \\(t=u\\)가 되는 두 \\(x\\)에서 \\(g\\)가 같은 극댓값을 가져요. 극대점이 모두 세 개이므로 남은 하나는 왕복의 꼭대기 \\(x=1/2\\), 곧 \\(t=1\\)에서 생겨야 해요. 그 사이에는 \\(0<v<1\\)인 \\(f\\)의 극소점도 하나 있어야 삼차함수의 증감이 이어져요.","check":{"prompt":"\\(t=u\\)인 점은 열린구간 \\(0<x<1\\)에서 몇 개이며 어디에 하나씩 있나요?","answer":"두 개이고 \\(0<x<1/2\\)와 \\(1/2<x<1\\)에 하나씩 있어요."}},{"id":"c2","label":"같은 극댓값으로 삼차함수를 묶어요","stepIds":["s4","s5","s6"],"question":"\\(f(u)=f(1)=1/2\\)와 \\(f'(u)=0\\)은 \\(f\\)를 어떤 인수꼴로 정할까요?","hint":"\\(f(t)-1/2\\)는 \\(u\\)에서 중근, \\(1\\)에서 근을 가져요.","explanation":"두 극댓값이 같고 전체 최댓값이 \\(1/2\\)이므로 \\(f(u)=f(1)=1/2\\)예요. \\(u\\)는 내부 극대점이라 \\(f'(u)=0\\)이므로 \\(f(t)-1/2\\)는 \\(u\\)에서 두 번 겹치는 근을 가져요. 최고차항의 계수가 \\(1\\)이어서\n\n\\(f(t)-\\dfrac12=(t-u)^2(t-1)\\)\n\n로 정해져요. 미분하면 \\(f'(t)=(t-u)(3t-u-2)\\)이므로 다른 극값 위치는 \\(v=(u+2)/3\\)이에요. 여기서\n\n\\(f(v)=\\dfrac12-\\dfrac{4(1-u)^3}{27}>\\dfrac12-\\dfrac4{27}>0\\)\n\n이므로 내부 극솟값은 \\(0\\)보다 커요.","check":{"prompt":"\\(f(t)-1/2\\)에서 \\(t=u\\)가 두 번 겹치는 근인 이유는 무엇인가요?","answer":"\\(f(u)=1/2\\)이고 내부 극대점이라 \\(f'(u)=0\\)이기 때문이에요."}},{"id":"c3","label":"최솟값이 나오는 끝점을 찾아요","stepIds":["s7","s8"],"question":"내부 극솟값이 양수라면 \\(0\\le t\\le1\\)에서 최솟값 \\(0\\)은 어디에서 나와야 할까요?","hint":"\\(t=1\\)에서는 이미 \\(f(1)=1/2\\)예요.","explanation":"내부 극소점 \\(v\\)에서의 값은 양수이고 \\(f(1)=1/2\\)이므로, 구간 전체의 최솟값 \\(0\\)은 남은 끝점 \\(t=0\\)에서 나와야 해요. 인수꼴에 \\(t=0\\)을 넣으면\n\n\\(f(0)-\\dfrac12=(-u)^2(-1)=-u^2\\)\n\n이므로 \\(f(0)=0\\)에서 \\(1/2-u^2=0\\)이에요. \\(0<u<1\\)이라 \\(u=\\sqrt2/2\\)를 골라요.","check":{"prompt":"\\(u=-\\sqrt2/2\\)를 버리는 근거는 무엇인가요?","answer":"\\(u\\)는 \\(0<t<1\\) 안의 극대 위치라서 \\(0<u<1\\)이어야 하기 때문이에요."}},{"id":"c4","label":"구간 밖의 함숫값을 계산해요","stepIds":["s9","s10"],"question":"\\(f(2)\\)는 인수꼴에서 어떻게 바로 계산할까요?","hint":"\\(t=2\\)이면 \\(t-1=1\\)이에요.","explanation":"\\(u=\\sqrt2/2\\)를 \\(f(t)-1/2=(t-u)^2(t-1)\\)에 넣으면\n\n\\(f(2)=\\left(2-\\dfrac{\\sqrt2}{2}\\right)^2+\\dfrac12=5-2\\sqrt2\\)\n\n예요. 따라서 \\(a=5,\\ b=-2\\)이고 \\(a^2+b^2=25+4=29\\)예요.","check":{"prompt":"\\(f(2)=5-2\\sqrt2\\)에서 요구한 두 유리수와 최종값은 무엇인가요?","answer":"\\(a=5,b=-2\\)이고 \\(a^2+b^2=29\\)예요."}}],"takeaway":["안쪽 함수가 같은 값을 두 번 지나면 바깥 함수의 내부 극값이 합성함수에서 두 번 나타나요.","같은 함숫값과 도함수값 \\(0\\)을 함께 알면 겹치는 인수로 묶어요.","내부 극솟값이 조건보다 크면 끝점들을 비교해 실제 최솟값 위치를 찾아요."]};</script>
