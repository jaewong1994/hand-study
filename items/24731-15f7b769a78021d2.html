면 }f\\text{는 }0\u003cu\u003cv\u003c1\\text{에서 각각 극대, 극소를 가진다.}"},{"id":"s3","latex":"\\text{두 극대점은 }t=u,\\text{나머지 하나는 }x=\\tfrac12\\ (t=1)\\text{에 대응한다.}"},{"id":"s4","latex":"f(u)=f(1)=\\frac12,\\quad f\\prime(u)=0\\ \\Rightarrow\\ f(t)-\\frac12=(t-u)^2(t-1)"},{"id":"s5","latex":"f\\prime(t)=(t-u)(3t-u-2)\\ \\Rightarrow\\ v=\\frac{u+2}{3}"},{"id":"s6","latex":"f(v)=\\frac12-\\frac{4(1-u)^3}{27}>\\frac12-\\frac4{27}>0"},{"id":"s7","latex":"0\\le t\\le1\\text{에서 최솟값이 }0\\text{이므로 }f(0)=0"},{"id":"s8","latex":"\\frac12-u^2=0,\\quad0\u003cu\u003c1\\ \\Rightarrow\\ u=\\frac{\\sqrt2}{2}"},{"id":"s9","latex":"f(2)=\\left(2-\\frac{\\sqrt2}{2}\\right)^2+\\frac12=5-2\\sqrt2"},{"id":"s10","latex":"a=5,\\quad b=-2\\ \\Rightarrow\\ \\boxed{a^2+b^2=29}"}],"track":"가형"};</script>
