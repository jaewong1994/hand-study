<script>window.HandStudyRecord={"adminYear":2025,"answer":"221","contentHash":"2c0c77a0a779c1b2483e7f640da4f81d1113bda1c2e4a473e34101a5b9823afa","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24975,"month":11,"number":30,"points":4,"preview":false,"questionHtml":"\u003cp>좌표평면에서 길이가 \u003cspan class=\"heq\">\\(10 \\sqrt{2}\\,\\)\u003c/span>인 선분 \u003cspan class=\"heq\">\\({{AB}}\\,\\)\u003c/span>를 지름으로 하는 원 위의 두 점 \u003cspan class=\"heq\">\\({{P}}\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\({{Q}}\\,\\)\u003c/span>가\u003c/p>\u003cp> \u003cspan class=\"heq\">\\(\\left({ \\vec{{PA}}}+{ \\vec{{PB}}} \\right) \\cdot \\left({ \\vec{{PQ}}}+{ \\vec{{PB}}} \\right)=2 \\left|\\, { \\vec{{PQ}}}\\,\\right| ^{2}\\,\\)\u003c/span>\u003c/p>\u003cp>을 만족시킨다. \u003cspan class=\"heq\">\\(\\left|\\, { \\vec{{PB}}}\\,\\right| =14\\,\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(\\left|\\, { \\vec{{PA}}} \\cdot { \\vec{{QB}}}\\,\\right| =\\frac{q}{p}\\,\\)\u003c/span>이다. \u003cspan class=\"heq\">\\(p+q\\,\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(\\left|\\, { \\vec{{QB}}}\\,\\right| &gt; 0\\,\\)\u003c/span>이고, \u003cspan class=\"heq\">\\(p\\,\\)\u003c/span>와 \u003cspan class=\"heq\">\\(q\\,\\)\u003c/span>는 서로소인 자연수이다.) [4점]\u003c/p>","questionText":"좌표평면에서 길이가 $10 \\sqrt{2}\\,$인 선분 ${{AB}}\\,$를 지름으로 하는 원 위의 두 점 ${{P}}\\,$, ${{Q}}\\,$가\n $\\left({ \\vec{{PA}}}+{ \\vec{{PB}}} \\right) bul \\leq t \\left({ \\vec{{PQ}}}+{ \\vec{{PB}}} \\right)=2 \\left|\\, { \\vec{{PQ}}}\\,\\right| ^{2}\\,$\n을 만족시킨다. $\\left|\\, { \\vec{{PB}}}\\,\\right| =14\\,$일 때, $\\left|\\, { \\vec{{PA}}} bul \\leq t { \\vec{{QB}}}\\,\\right| =\\frac{q}{p}\\,$이다. $p+q\\,$의 값을 구하시오. (단, $\\left|\\, { \\vec{{QB}}}\\,\\right| > 0\\,$이고, $p\\,$와 $q\\,$는 서로소인 자연수이다.) [4점]","sourceHash":"84c78ce0c3c27ef6563969a25e2a5cfd49c5a14b1a745bf2edc5d3ca67069039","sourceKind":"csat","sourceLabel":"2025년 시행 수능 · 2026학년도 · 기하 · 30번","steps":[{"id":"s1","latex":"O\\text{를 원의 중심, }R\\text{을 }P\\text{의 }O\\text{에 대한 대칭점이라 하면 }\\overrightarrow{PA}+\\overrightarrow{PB}=\\overrightarrow{PR}"},{"id":"s2","latex":"PR=AB=10\\sqrt2"},{"id":"s3","latex":"\\overrightarrow{PR}\\cdot\\overrightarrow{PQ}=|PQ|^{2},\\qquad \\overrightarrow{PR}\\cdot\\overrightarrow{PB}=|PB|^{2}"},{"id":"s4","latex":"\\text{주어진 식에서 }|PQ|^{2}+|PB|^{2}=2|PQ|^{2}\\Rightarrow PQ=PB=14"},{"id":"s5","latex":"\\angle APB=\\frac\\pi2\\Rightarrow PA=\\sqrt{AB^{2}-PB^{2}}=\\sqrt{200-196}=2"},{"id":"s6","latex":"QB>0\\text{이므로 }Q\\text{는 직선 }PR\\text{에 대한 }B\\text{의 대칭점이고 }QR=BR=PA=2"},{"id":"s7","latex":"S=PR\\cap BQ\\text{라 하면 }PR\\perp BQ\\text{이고 }BS=QS"},{"explanation":{"body":"\\(S\\)는 직각삼각형 \\(PRQ\\)에서 빗변 \\(PR\\)에 내린 수선의 발입니다. 넓이를 \\(\\frac12PQ\\cdot QR\\)와 \\(\\frac12PR\\cdot QS\\)로 두 번 쓰면 \\(PQ\\cdot QR=PR\\cdot QS\\)가 됩니다.","skillTags":["직각삼각형","넓이관계"],"title":"직각삼각형의 높이 관계"},"id":"s8","latex":"\\triangle PRQ\\text{에서 }PQ\\cdot QR=PR\\cdot QS"},{"id":"s9","latex":"QS=\\frac{14\\cdot2}{10\\sqrt2}=\\frac{7\\sqrt2}{5},\\quad BS=QS"},{"id":"s10","latex":"\\overrightarrow{PA}=\\overrightarrow{BR},\\quad \\overrightarrow{BQ}=2\\overrightarrow{BS}"},{"id":"s11","latex":"|\\overrightarrow{PA}\\cdot\\overrightarrow{QB}|=2|\\overrightarrow{BR}\\cdot\\overrightarrow{BS}|=2BS^{2}=\\frac{196}{25}"},{"id":"s12","latex":"p+q=25+196=221"},{"id":"s13","latex":"\\therefore\\ \\boxed{221}"}],"track":"기하"};</script>
<script>window.HandStudyGuide={"itemId":24975,"sourceHash":"84c78ce0c3c27ef6563969a25e2a5cfd49c5a14b1a745bf2edc5d3ca67069039","contentHash":"2c0c77a0a779c1b2483e7f640da4f81d1113bda1c2e4a473e34101a5b9823afa","overview":{"goal":"원의 대칭점을 이용해 주어진 벡터식을 길이 조건으로 바꾸고 마지막 내적을 직각삼각형의 높이로 계산해요.","firstLook":"원의 중심에 대해 P와 마주 보는 점 R을 잡으면 \\(\\vec{PA}+\\vec{PB}=\\vec{PR}\\)이고 \\(PR\\)은 지름이에요.","conditions":[{"label":"지름 AB의 원","meaning":"\\(\\angle APB=90^\\circ\\)이고 P의 맞은편 점 R까지도 지름이에요."},{"label":"Q는 B와 다름","meaning":"두 원의 교점 중 자명한 점 B가 아닌 다른 점을 선택해요."}]},"chapters":[{"id":"c1","label":"벡터식을 두 길이로 바꿔요","stepIds":["s1","s2","s3","s4"],"question":"주어진 내적식에서 왜 \\(PQ=PB\\)가 나올까요?","hint":"\\(\\vec{PR}\\)과 \\(\\vec{PQ},\\vec{PB}\\)의 내적을 원의 성질로 바꿔요.","explanation":"R을 P의 중심 O에 대한 대칭점으로 잡으면 \\(\\vec{PA}+\\vec{PB}=\\vec{PR}\\), \\(PR=AB=10\\sqrt2\\)예요. 원 위의 점이 지름을 보는 각은 직각이므로 내적을 정리하면 \\(\\vec{PR}\\cdot\\vec{PQ}=|PQ|^2\\), \\(\\vec{PR}\\cdot\\vec{PB}=|PB|^2\\)예요. 이를 원래 식에 넣으면 \\(|PQ|^2+|PB|^2=2|PQ|^2\\)이므로 \\(PQ=PB\\)예요. \\(PB=14\\)라서 \\(PQ=14\\)예요.","check":{"prompt":"길이의 제곱이 같을 때 부호를 따로 고민하지 않는 이유는 무엇인가요?","answer":"\\(PQ\\)와 \\(PB\\)는 모두 선분의 길이라 \\(0\\) 이상이고 \\(PB=14\\)이므로 \\(PQ=14\\)예요."}},{"id":"c2","label":"작은 직각삼각형의 세 변을 정해요","stepIds":["s5","s6"],"question":"왜 \\(PA=2\\)이고 \\(QR=2\\)일까요?","hint":"먼저 직각삼각형 APB, 다음에 두 반지름 14인 원의 교점을 봐요.","explanation":"\\(\\angle APB=90^\\circ\\)이므로 \\(PA^2=AB^2-PB^2=200-196=4\\), 따라서 \\(PA=2\\)예요. 또 P와 B에서 거리가 각각 14인 점은 B와 P를 서로 바꾸는 대칭 구조를 가져요. Q가 B와 다르다는 조건 때문에 Q는 직선 PR에 대한 B의 대칭점이고, 이에 대응해 \\(QR=BR=PA=2\\)예요. 실제로 \\(PQ^2+QR^2=14^2+2^2=200=PR^2\\)라 삼각형 PQR은 Q에서 직각이에요.","check":{"prompt":"Q가 B와 같은 자명한 교점을 제외하는 원문 조건은 무엇인가요?","answer":"\\(|\\vec{QB}|>0\\), 곧 Q와 B가 다른 점이라는 조건이에요."}},{"id":"c3","label":"빗변에 내린 높이를 구해요","stepIds":["s7","s8","s9"],"question":"\\(QS\\)는 왜 \\(PQ\\cdot QR/PR\\)일까요?","hint":"삼각형 PQR의 넓이를 두 가지 밑변으로 계산해요.","explanation":"S를 \\(PR\\)과 \\(BQ\\)의 교점이라 하면 대칭축 PR이 BQ를 수직이등분하므로 \\(PR\\perp BQ\\), \\(BS=QS\\)예요. 직각삼각형 PQR의 넓이는 \\(\\frac12PQ\\cdot QR\\)이면서 \\(\\frac12PR\\cdot QS\\)이므로 \\(PQ\\cdot QR=PR\\cdot QS\\)예요. 따라서 \\(QS=14\\cdot2/(10\\sqrt2)=7\\sqrt2/5\\)이고 \\(BS=QS\\)예요.","check":{"prompt":"S가 BQ의 중점이라는 사실에서 얻는 길이 등식은 무엇인가요?","answer":"\\(BS=QS=7\\sqrt2/5\\)예요."}},{"id":"c4","label":"마지막 내적을 높이의 제곱으로 바꿔요","stepIds":["s10","s11","s12","s13"],"question":"\\(|\\vec{PA}\\cdot\\vec{QB}|\\)가 왜 \\(2BS^2\\)이 될까요?","hint":"\\(\\vec{PA}=\\vec{BR}\\)이고 BR을 BS와 SR 방향으로 나눠요.","explanation":"P와 R, A와 B가 각각 원의 중심에 대해 마주 보는 점이어서 \\(\\vec{PA}=\\vec{BR}\\)예요. 또 S가 BQ의 중점이므로 \\(\\vec{BQ}=2\\vec{BS}\\)이고 \\(\\vec{QB}=-2\\vec{BS}\\)예요. BR을 \\(\\vec{BS}+\\vec{SR}\\)로 나누면 SR은 PR 위, BS는 PR에 수직이라 \\(\\vec{BR}\\cdot\\vec{BS}=BS^2\\)예요. 따라서 절댓값은 \\(2BS^2=2(7\\sqrt2/5)^2=196/25\\)예요. \\(p=25,q=196\\)이므로 \\(p+q=221\\)이에요.","check":{"prompt":"분수 \\(196/25\\)가 이미 기약분수인 이유는 무엇인가요?","answer":"196은 2와 7의 거듭제곱 인수만, 25는 5의 인수만 가져 공약수가 1이에요."}}],"takeaway":["원에서 중심 대칭점을 잡으면 두 현 벡터의 합을 지름 벡터로 바꿀 수 있어요.","두 원의 공통점은 자명한 교점과 대칭된 다른 교점을 구분해요.","직각삼각형의 높이는 넓이를 두 방식으로 계산해 구할 수 있어요."]};</script>
