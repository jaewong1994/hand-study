  <script>window.HandStudyRecord={"itemId":17396,"sourceLabel":"2022 교육청 고3 수학미적분 7월 28번","adminYear":2022,"grade":3,"month":7,"number":28,"track":"미적분","points":4,"scoreStatus":"confirmed_4_direct","questionText":"실수 전체의 집합에서 도함수가 연속인 함수 $f \\left(x \\right)\\,$가 모든 실수 $x\\,$에 대하여 다음 조건을 만족시킨다.\n(가) $f \\left( -x \\right) \\,=f \\left( x \\right) \\,$ (나) $f \\left( x+2 \\right) \\,=f \\left( x \\right) \\,$\n$\\int _{-1} ^{5} {} f \\left( x \\right) \\left( x+\\cos2 \\pi x \\right) dx= \\frac{47}{2} \\,$, $\\int _{0} ^{1} {} f \\left( x \\right) dx=2\\,$일 때, $\\int _{0} ^{1} {} f' \\left( x \\right) \\sin2 \\pi x\\,dx\\,$의 값은? [4점]\n① $\\frac{\\pi}{6}$ ② $\\frac{\\pi }{4}$ ③ $\\frac{\\pi }{3}$ ④ $\\frac{5}{12} \\pi$ ⑤ $\\frac{\\pi }{2}$\n단답형","answer":"①","sourceHash":"e90a77b0efd1e30bcbbd037650a3289c66708755a09e7983cbd412b175e70d75","steps":[{"id":"s1","latex":"f(-x)=f(x),\\ f(x+2)=f(x)\\Rightarrow\\int_{-1}^1f(x)\\,dx=4,\\ \\int_{-1}^1xf(x)\\,dx=0"},{"id":"s2","latex":"\\int_{-1}^5xf(x)\\,dx=\\sum_{k=0}^2\\int_{-1}^1(t+2k)f(t)\\,dt=24"},{"id":"s3","latex":"I=\\int_0^1 f(x)\\cos2\\pi x\\,dx,\\quad \\int_{-1}^5 f(x)\\cos2\\pi x\\,dx=6I"},{"id":"s4","latex":"24+6I=47/2\\Rightarrow I=-1/12"},{"id":"s5","latex":"\\int_0^1 f'(x)\\sin2\\pi x\\,dx=[f(x)\\sin2\\pi x]_0^1-2\\pi I=\\pi/6"}],"diagram":null,"contentHash":"76d59a8c44e938ef65c5a777c73913710df1a4ea34862ce30917b9c0ab2b71e2","questionHtml":"\u003cp class=\"hp\">실수 전체의 집합에서 도함수가 연속인 함수 \u003cspan class=\"heq\">\\(f \\left(x \\right)\\,\\)\u003c/span>가 모든 실수 \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>에 대하여 다음 조건을 만족시킨다.\u003c/p>\u003cp class=\"hp\">\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) \u003cspan class=\"heq\">\\(f \\left( -x \\right) \\,=f \\left( x \\right) \\,\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">(나) \u003cspan class=\"heq\">\\(f \\left( x+2 \\right) \\,=f \\left( x \\right) \\,\\)\u003c/span>\u003c/p>\u003c/div>\u003c/p>\u003cp class=\"hp htall\">\u003cspan class=\"heq\">\\(\\int_{-1}^{5}
