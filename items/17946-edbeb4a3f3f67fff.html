<script>window.HandStudyRecord={"adminYear":2024,"answer":"5","contentHash":"b9933f8e66a6bf0d3f4c346c22c56ef4e8754b90a55c3ea48ae742baf7a28e4d","diagram":null,"editionHash":"edbeb4a3f3f67fffce5e6f90d1a9ba028f68f0a01208ce825ba6c427d098d31d","grade":3,"graphHash":"","graphPlan":null,"itemId":17946,"learningHash":"e6556ba7cf82059b1e17577643e49425c403bec836f81362e9d234082d1ae948","month":10,"number":29,"points":4,"preview":false,"questionHtml":"\u003cp class=\"hp htall\">점 \u003cspan class=\"heq\">\\(\\left( 0,\\, 1 \\right)\\,\\)\u003c/span>을 지나고 기울기가 양수인 직선 \u003cspan class=\"heq\">\\(l\\,\\)\u003c/span>과 곡선 \u003cbr>\u003cspan class=\"heq\">\\(y=e^{\\dfrac{x}{a}} -1 \\, \\left( a\\gt 0 \\right)\\,\\)\u003c/span>이 있다. 직선 \u003cspan class=\"heq\">\\(l\\,\\)\u003c/span>이 \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>축의 양의 방향과 이루는 각의 크기가 \u003cspan class=\"heq\">\\(\\theta \\,\\)\u003c/span>일 때, 직선 \u003cspan class=\"heq\">\\(l\\,\\)\u003c/span>이 곡선 \u003cspan class=\"heq\">\\(y=e^{\\dfrac{x}{a}} -1 \\, \\left( a\\gt 0 \\right)\\,\\)\u003c/span>과 제\u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>사분면에서 만나는 점의 \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>좌표를 \u003cspan class=\"heq\">\\(f \\left( \\theta \\right)\\,\\)\u003c/span>라 하자. \u003cbr>\u003cspan class=\"heq\">\\(f \\left( \\dfrac{\\pi }{4} \\right) =a\\,\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(\\sqrt{f' \\left( \\dfrac{\\pi }{4} \\right)} =pe+q\\,\\)\u003c/span>이다. \u003cspan class=\"heq\">\\(p^{2} +q^{2}\\,\\)\u003c/span>의 값을 구하시오.\u003cbr>(단, \u003cspan class=\"heq\">\\(a\\,\\)\u003c/span>는 상수이고 \u003cspan class=\"heq\">\\(p\\)\u003c/span>, \u003cspan class=\"heq\">\\(q\\,\\)\u003c/span>는 정수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","questionText":"점 $\\left( 0,\\, 1 \\right)\\,$을 지나고 기울기가 양수인 직선 $l\\,$과 곡선 $y=e ^{\\frac{x}{a}} -1 \\, \\left( a>0 \\right)\\,$이 있다. 직선 $l\\,$이 $x\\,$축의 양의 방향과 이루는 각의 크기가 $\\theta \\,$일 때, 직선 $l\\,$이 곡선 $y=e ^{\\frac{x}{a}} -1 \\, \\left( a>0 \\right)\\,$과 제$1\\,$사분면에서 만나는 점의 $x\\,$좌표를 $f \\left( \\theta \\right)\\,$라 하자. $f \\left( \\frac{\\pi }{4} \\right) =a\\,$일 때, $\\sqrt{f ' \\left( \\frac{\\pi }{4} \\right)} =pe+q\\,$이다. $p ^{2} +q ^{2}\\,$의 값을 구하시오. (단, $a\\,$는 상수이고 $p$, $q\\,$는 정수이다.) [4점]","scoreStatus":"confirmed_4_direct","sourceHash":"b9624455326ef48311c9c400282648bc3aefddb900e4b9e5d84a2176cb5e6fc0","sourceLabel":"2024 교육청 고3 수학미적분 10월 29번","stepExplanations":{"s4":{"body":"교점의 \\(x\\)좌표가 \\(f(\\theta)\\)이므로 지수 안의 \\(f\\)도 \\(\\theta\\)의 함수예요. 따라서 왼쪽을 미분하면 \\(e^{\\frac fa}\\cdot \\frac{f^{\\prime}}a\\)이고, 오른쪽의 \\(f(\\theta)\\tan\\theta\\)에는 곱의 미분법을 써서 \\(f^{\\prime}\\tan\\theta+f\\sec^2\\theta\\)를 얻어요. 여기서 \\(a\\)는 상수라서 미분하지 않아요.","skillTags":["calculus.derivative"],"title":"교점의 좌표도 각도에 따라 움직여요"},"s6":{"body":"\\(\\theta=\\frac\\pi4\\)에서는 \\(f=a\\), \\(\\tan\\theta=1\\), \\(\\sec^2\\theta=2\\)예요. 따라서 \\((e-a)f^{\\prime}(\\frac\\pi4)=2a^2\\)가 돼요. 앞에서 \\(a=e-2\\)를 구했으므로 \\(e-a=2\\)이고, \\(f^{\\prime}(\\frac\\pi4)=a^2=(e-2)^2\\)예요. 또 \\(a>0\\)이므로 제곱근은 \\(e-2\\)로 정해져요.","skillTags":["algebra.calculation","reasoning.casework"],"title":"분모에 남는 값은 2예요"}},"steps":[{"id":"s1","latex":"l:\\ y=x\\tan\\theta+1"},{"id":"s2","latex":"e^{f(\\theta)/a}-1=f(\\theta)\\tan\\theta+1"},{"id":"s3","latex":"f(\\pi/4)=a\\Rightarrow e-1=a+1\\Rightarrow a=e-2"},{"id":"s4","latex":"\\dfrac1ae^{f/a}f'=f'\\tan\\theta+f\\sec^2\\theta"},{"id":"s5","latex":"\\left(\\dfrac ea-1\\right)f'\\!\\left(\\dfrac\\pi4\\right)=2a"},{"id":"s6","latex":"f'\\!\\left(\\dfrac\\pi4\\right)=(e-2)^2"},{"id":"s7","latex":"\\sqrt{f'(\\pi/4)}=e-2\\Rightarrow p^2+q^2=5"}],"track":"미적분"};</script>
<script>window.HandStudyGuide={"itemId":17946,"sourceHash":"b9624455326ef48311c9c400282648bc3aefddb900e4b9e5d84a2176cb5e6fc0","contentHash":"b9933f8e66a6bf0d3f4c346c22c56ef4e8754b90a55c3ea48ae742baf7a28e4d","overview":{"goal":"교점 방정식을 \\(\\theta\\)에 대해 미분해 \\(x\\)좌표 함수의 도함수를 구해요.","firstLook":"교점에서는 직선식과 지수함수식이 같다는 한 식을 세워요.","conditions":[{"label":"\\(a>0\\), 기울기 양수","meaning":"\\(a=e-2>0\\)이고 마지막 제곱근의 양의 값을 택해요."}]},"chapters":[{"id":"c1","label":"교점식과 상수 결정","stepIds":["s1","s2","s3"],"question":"\\(\\theta=\\pi/4\\)에서 교점 \\(x=a\\)를 넣으면?","hint":"\\(\\tan(\\pi/4)=1\\)이에요.","explanation":"직선은 \\(y=x\\tan\\theta+1\\)이에요. 교점 \\(x=f(\\theta)\\)에서 \\(e^{f/a}-1=f\\tan\\theta+1\\)이고, \\(f(\\pi/4)=a\\)를 넣으면 \\(e-1=a+1\\)이에요. 따라서 \\(a=e-2\\)예요.","check":{"prompt":"\\(a\\)는?","answer":"\\(e-2\\)이에요."}},{"id":"c2","label":"교점식을 각으로 미분","stepIds":["s4","s5","s6"],"question":"지수항 미분에서 빠뜨리기 쉬운 인수는?","hint":"안쪽 \\(f(\\theta)/a\\)의 도함수 \\(f'/a\\)예요.","explanation":"\\((1/a)e^{f/a}f'=f'\\tan\\theta+f\\sec^2\\theta\\). \\(\\theta=\\pi/4\\), \\(f=a\\)에서 \\((e/a-1)f'=2a\\). \\(a=e-2\\)를 대입해 정리하면 \\(f'=(e-2)^2\\)이에요.","check":{"prompt":"\\(sec^2(\\pi/4)\\)는?","answer":"\\(2\\)이에요."}},{"id":"c3","label":"제곱근 부호와 답","stepIds":["s7"],"question":"왜 \\(\\sqrt{f}'=e-2\\)인가요?","hint":"\\(e-2>0\\)이에요.","explanation":"양의 제곱근은 \\(e-2\\)이므로 \\(p=1,q=-2\\). \\(p^2+q^2=5\\)예요.","check":{"prompt":"\\(p=1,q=-2\\)에서 두 제곱의 합은?","answer":"\\(5\\)이에요."}}],"takeaway":["움직이는 교점은 교점 방정식을 매개변수로 미분해요.","합성함수 미분의 안쪽 도함수를 남겨요.","제곱근은 상수의 부호를 확인한 뒤 벗겨요."]};</script>
