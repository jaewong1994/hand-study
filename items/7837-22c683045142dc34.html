<script>window.HandStudyGuide={"itemId":7837,"sourceHash":"87c5afb4a48f7ab2f734ab50c0bd930db0fd137768f353b8b31814a678d1590b","contentHash":"c59fb13f1439e67ae8342d880175806c4b44f08d368cc3c702dd871dd9e2f3b6","overview":{"goal":"수평선과 두 그래프의 후보 교점을 찾고, 서로 다른 세 점이 생기는 엄격한 부등식을 구해요.","firstLook":"\\(h\\)는 \\(f,g\\) 중 작은 값이므로 한 함수가 \\(k\\)일 때 다른 함수가 \\(k\\) 이상이어야 해요.","conditions":[{"label":"조각함수의 정의","meaning":"두 함숫값 중 작은 값을 택해요."},{"label":"매개변수의 존재","meaning":"각 \\(k\\)에 맞게 절댓값 그래프의 중심을 고를 수 있어요."}]},"chapters":[{"id":"c1","label":"높이 5를 따로 확인해요","stepIds":["s1","s2"],"question":"왜 \\(k=5\\)가 첫 후보인가요?","hint":"\\(f(x)=(x-1)^2+5\\)예요.","explanation":"\\(f\\)의 최솟값은 \\(5\\)예요. \\(k=5,t=1\\)이면 \\(x=1\\)에서 \\(f=5\\), \\(x=-5,7\\)에서 \\(g=5<f\\)이므로 세 교점이 생겨요. \\(k<5\\)에서는 포물선 쪽 후보가 없어 세 점을 만들 수 없어요.","check":{"prompt":"\\(k=5\\)의 세 교점 x좌표는 무엇인가요?","answer":"\\(-5,1,7\\)이에요."}},{"id":"c2","label":"두 포물선 교점을 덮어요","stepIds":["s3","s4"],"question":"\\(5<k<11\\)에서 \\(f=k\\)의 두 점은 어디인가요?","hint":"\\((x-1)^2=k-5\\)를 푸세요.","explanation":"두 해는 \\(u=1-\\sqrt{k-5}\\), \\(v=1+\\sqrt{k-5}\\)예요. 두 점에서 \\(h=k\\)가 되려면 \\(g\\ge k\\), 즉 \\(|x-t|\\le11-k\\)인 구간이 \\(u,v\\)를 모두 포함해야 해요.","check":{"prompt":"세 번째 교점은 어느 그래프에서 더 생겨야 하나요?","answer":"\\(g(x)=k\\)인 경계점 중 \\(u,v\\)와 겹치지 않는 점에서 생겨야 해요."}},{"id":"c3","label":"엄격한 부등식을 세워요","stepIds":["s5","s6"],"question":"교점이 세 개가 되려면 왜 등호가 아니라 큰 부등호인가요?","hint":"\\(g\\ge k\\)인 구간의 한쪽 끝을 \\(u\\)에 맞추고, 다른 끝이 \\(v\\)를 지나가게 하세요.","explanation":"\\(r=\\sqrt{k-5}\\), \\(L=11-k\\)라 두면 \\(f=k\\)의 두 점은 \\(u=1-r,v=1+r\\)이고 \\(g\\ge k\\)인 구간의 길이는 \\(2L\\)이에요. 교점 세 개를 만들려면 두 점 \\(u,v\\)를 모두 이 구간에 넣고, \\(g=k\\)인 두 끝점 중 하나를 \\(u\\) 또는 \\(v\\)와 겹치게 해야 해요. 예를 들어 왼쪽 끝을 \\(u\\)에 맞추면 \\(t=u+L\\)이고, 오른쪽 끝 \\(u+2L\\)이 \\(v\\)보다 커야 서로 다른 세 점 \\(u,v,u+2L\\)이 남아요. 따라서 \\(L>r\\), 즉 \\(11-k>\\sqrt{k-5}\\)가 필요하고 충분해요. 제곱하면 \\((k-9)(k-14)>0\\)이고 \\(5<k<11\\)에서 \\(k<9\\)예요.","check":{"prompt":"\\(k=9\\)가 제외되는 이유는 무엇인가요?","answer":"두 반길이가 모두 \\(2\\)라 \\(g=k\\)의 두 점이 \\(f=k\\)의 두 점과 겹
