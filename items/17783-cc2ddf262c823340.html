<script>window.HandStudyRecord={"itemId":17783,"sourceLabel":"2023 평가원 고3 수학미적분 6월 22번","adminYear":2023,"grade":3,"month":6,"number":22,"track":"미적분","points":4,"scoreStatus":"confirmed_4_direct","questionText":"정수 $a$ $(a != 0)$에 대하여 함수 $f(x)$를\n $f(x)=x ^{3} -2ax ^{2}$\n이라 하자. 다음 조건을 만족시키는 모든 정수 $k$의 값의 곱이 $-12$가 되도록 하는 $a$에 대하여 $f'(10)$의 값을 구하시오. [4점]\n 함수 $f(x)$에 대하여 $\\left\\{ \\frac{f(x _{1} )-f(x _{2} )}{x _{1} -x _{2}} \\right\\} \\, \\times \\, \\left\\{ \\frac{f(x _{2} )-f(x _{3} )}{x _{2} -x _{3}} \\right\\} \\,\u003c0$ 을 만족시키는 세 실수 $x _{1} ,\\,x _{2} ,\\,x _{3}$이 열린구간 $\\left( k,\\,k+ \\frac{3}{2} \\right)$에 존재한다.\n 사각형입니다. 2023년 6월 고3 모의고사 문제지제 2 교시 수학 영역(미적분) \n5 지선다형","answer":"380","sourceHash":"c583bcda5c1b8739aeaa0bfccede795af3e6250cf3a8a8e56e346f25252bda7c","steps":[{"id":"s1","latex":"f\\prime(x)=x(3x-4a),\\quad r=\\dfrac{4a}{3}"},{"id":"s2","latex":"\\text{조건을 만족하는 구간}\\Leftrightarrow0\\text{ 또는 }r\\text{를 내부에 포함}"},{"id":"s3","latex":"0\\in(k,k+\\tfrac32)\\Rightarrow k=-1"},{"id":"s4","latex":"\\prod k=-12\\Rightarrow\\text{나머지 }k\\text{의 곱}=12"},{"latex":"\\text{나머지가 }k=12\\text{ 하나라면 }25/2\\le r\\le13\\Rightarrow75/8\\le a\\le39/4\\text{에 정수 없음}","id":"s5"},{"id":"s6","latex":"\\text{가능한 이웃한 두 정수는 }\\{3,4\\}\\text{ 또는 }\\{-4,-3\\}"},{"id":"s7","latex":"\\{3,4\\}:\\ 4\u003cr\u003c\\dfrac92\\Rightarrow3\u003ca\u003c\\dfrac{27}{8}\\quad\\text{정수해 없음}"},{"id":"s8","latex":"\\{-4,-3\\}:\\ -3\u003cr\u003c-\\dfrac52\\Rightarrow-\\dfrac94\u003ca\u003c-\\dfrac{15}{8}\\Rightarrow a=-2"},{"id":"s9","latex":"f\\prime(10)=300-40a=380"}],"diagram":null,"contentHash":"c9c3235b54ab402b97270000e792b3b3d1ab84768e3d50ec7ed8f7bb2c0349e8","questionHtml":"\u003cp class=\"hp\">정수 \u003cspan class=\"heq\">\\(a\\)\u003c/span>\u003cspan class=\"heq\">\\((a  \\neq  0)\\)\u003c/span>에 대하여 함수 \u003cspan class=\"heq\">\\(f(x)\\)\u003c/span>를\u003c/p>\u003cp class=\"hp\">&emsp;\u003cspan class=\"heq\">\\(f(x)=x^{3} -2ax^{2}\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">이라 하 <script>window.HandStudyGuide={"itemId":17783,"sourceHash":"c583bcda5c1b8739aeaa0bfccede795af3e6250cf3a8a8e56e346f25252bda7c","contentHash":"c9c3235b54ab402b97270000e792b3b3d1ab84768e3d50ec7ed8f7bb2c0349e8","overview":{"goal":"두 평균변화율의 부호가 반대가 되는 구간을 극값 위치로 바꾸고 정수 \\(k\\)의 곱으로 \\(a\\)를 정해요.","firstLook":"한 열린구간 안에서 증가와 감소가 모두 나타나야 두 평균변화율의 곱을 음수로 만들 수 있어요. 따라서 도함수의 부호가 바뀌는 점이 구간 안에 있어야 해요.","conditions":[{"label":"평균변화율","meaning":"같은 열린구간에서 양수인 평균변화율과 음수인 평균변화율을 하나씩 만들 수 있어야 해요."},{"label":"열린구간","meaning":"극값 위치가 양 끝점과 같으면 포함되지 않으므로 부등호를 엄격히 지켜요."},{"label":"정수의 곱","meaning":"\\(0\\)에서 생기는 \\(k=-1\\)을 먼저 떼고 나머지 정수들의 곱을 맞춰요."}]},"chapters":[{"id":"c1","label":"평균변화율 조건을 극값 위치로 바꿔요","stepIds":["s1","s2","s3"],"question":"주어진 세 점이 존재하려면 열린구간 안에 왜 \\(0\\) 또는 \\(4a/3\\)이 있어야 할까요?","hint":"\\(f'(x)=x(3x-4a)\\)의 부호가 어디에서 바뀌는지 확인해요.","explanation":"\\(f'(x)=x(3x-4a)\\)이므로 도함수의 두 근은 \\(0\\)과 \\(r=4a/3\\)이에요. \\(a\ne0\\)이라 두 점은 다르고, 각 점에서 증가와 감소가 바뀌어요. 길이 \\(3/2\\)의 열린구간 안에 이 두 점 중 하나가 있으면 그 점의 양쪽에서 세 점을 골라 두 평균변화율의 부호를 반대로 만들 수 있어요. 반대로 둘 다 없으면 구간 전체에서 \\(f'\\)의 부호가 일정하므로 두 평균변화율의 곱은 음수가 될 수 없어요. \\(0\\in(k,k+3/2)\\)를 만족하는 정수는 \\(-3/2<k<0\\)의 \\(k=-1\\) 하나예요.","check":{"prompt":"극값 위치가 \\(k\\) 또는 \\(k+3/2\\)와 같으면 왜 세지 않나요?","answer":"문제의 구간이 열린구간이라 양 끝점은 포함되지 않기 때문이에요."}},{"id":"c2","label":"나머지 정수의 가능한 묶음을 찾아요","stepIds":["s4","s5","s6"],"question":"\\(-1\\)을 제외한 정수들의 곱이 \\(12\\)일 때 왜 후보가 \\(12\\) 또는 \\(3,4\\) 또는 \\(-4,-3\\)뿐일까요?","hint":"길이가 \\(3/2\\)인 구간에 같은 점 \\(r\\)을 넣는 정수 \\(k\\)는 하나 또는 이웃한 두 개예요.","explanation":"\\(k=-1\\)은 항상 포함되고 전체 곱이 \\(-12\\)이므로 \\(r\\)에서 새로 생기는 정수들의 곱은 \\(12\\)예요. 한 점 \\(r\\)을 포함하는 길이 \\(3/2\\) 구간의 정수 시작점은 많아야 이웃한 두 개예요. 하나만 있다면 그 정수는 \\(12\\)여야 하고, 정확히 \\(k=12\\)만 가능하려면 \\(25/2\\le r\\le13\\)이에요. 이는 \\(75/8\\le a\\le39/4\\)인데 정수 \\(a\\)가 없어요. 이웃한 두 정수의 곱이 \\(12\\)인 묶음은 \\(\\{3,4\\}\\)와 \\(\\{-4,-3\\}\\)뿐이에요.","check":{"prompt":"한 점 \\(r\\)에서 세 개의 연속된 정수 \\(k\\)가 나올 수 없는 이유는 무엇인가요?","answer":"세 시작점의 차이는 \\(2\\)인데 각 구간의 길이는 \\(3/2\\)라 한 점이 세 열린구간에 동시에 들어갈 수 없기 때문이에요."}},{"id":"c3","label":"열린구간 부등식으로 정수 a를 골라요","stepIds":["s7","s8","s9"],"question":"두 연속 정수 후보 가운데 어느 쪽이 정수 \\(a\\)를 만들까요?","hint":"두 구간에 모두 \\(r\\)이 들어가는 교집합을 먼저 구한 뒤 \\(r=4a/3\\)을 넣어요.","explanation":"\\(k=3,4\\)가 모두 가능하려면 \\(4<r<9/2\\)이고, 따라서 \\(3<a<27/8\\)이라 정수해가 없어요. \\(k=-4,-3\\)이 모두 가능하려면 \\(-3<r<-5/2\\)이고, \\(-9/4<a<-15/8\\)이므로 정수는 \\(a=-2\\) 하나예요. 마지막으로 \\(f'(10)=10(30-4a)=300-40a=380\\)이에요.","check":{"prompt":"\\(a=-2\\)일 때 \\(r\\)은 실제로 두 구간에 들어가나요?","answer":"\\(r=-8/3\\)이고 \\(-3<-8/3<-5/2\\)이므로 \\((-4,-5/2)\\)와 \\((-3,-3/2)\\)에 모두 들어가요."}}],"takeaway":["평균변화율의 부호가 모두 같을 수밖에 없는 구간은 도함수의 부호로 판정해요.","고정된 점을 포함하는 같은 길이의 열린구간들을 셀 때 시작점 정수의 범위를 엄격한 부등식으로 써요.","정수들의 곱 조건에서는 항상 포함되는 값을 먼저 떼어 나머지 가능한 연속 정수 묶음을 찾아요."]};</script>
