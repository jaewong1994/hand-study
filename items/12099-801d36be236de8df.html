  <script>window.HandStudyRecord={"itemId":12099,"sourceLabel":"2025 교육청 고1 수학 10월 20번","adminYear":2025,"grade":1,"month":10,"number":20,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"$0\\,$이 아닌 실수 $a\\,$에 대하여 좌표평면 위의 서로 다른 세 점 $A \\left(2a,\\,0 \\right)\\,$, $B\\,$, $C\\,$가 다음 조건을 만족시킨다.\n∘ 삼각형 $ABC\\,$의 무게중심의 좌표는 $\\left(0,\\,2 \\right)\\,$이다.\n∘ ${ \\overlineAB}={ \\overlineAC}$\n다음은 ${ \\overlineBC}=2 \\sqrt{a^{2}+1}\\,$일 때, 점 $B\\,$의 $x\\,$좌표와 $y\\,$좌표의 합을 구하는 과정이다. (단, 점 $B\\,$의 $x\\,$좌표는 점 $C\\,$의 $x\\,$좌표보다 크다.)\n선분 $BC\\,$의 중점을 $M \\left(b,\\,c \\right)\\,$, 삼각형 $ABC\\,$의 무게중심을 $G\\,$라 하면, 점 $G \\left(0,\\,2 \\right)\\,$는 선분 $AM\\,$을 $2\\,:\\,1\\,$로 내분하는 점이므로 $b=\\,-a\\,$, $c= \\boxed{\\,\\text{(가)}\\,}\\,$이다.${ \\overlineAB}={ \\overlineAC}\\,$이고 직선 $AM\\,$의 기울기가 $-\\frac{1}{a}\\,$이므로직선 $BC\\,$의 방정식은 $y= \\boxed{\\,\\text{(나)}\\,}\\, \\times \\left\\{x- \\left(-a \\right) \\right\\}+ \\boxed{\\,\\text{(가)}\\,}\\,$ 이다.\n점 $B\\,$의 $x\\,$좌표를 $k\\,$라 하면점 $B\\,$의 $y\\,$좌표는 $\\boxed{\\,\\text{(나)}\\,}\\, \\times \\left(k+a \\right)+ \\boxed{\\,\\text{(가)}\\,}\\,$이다.${ \\overlineBM}=\\frac{1}{2}{ \\overlineBC}\\,$이고 점 $B\\,$의 $x\\,$좌표가 점 $C\\,$의 $x\\,$좌표보다 크므로 $k= \\boxed{\\,\\text{(다)}\\,}\\,$이다.\n따라서 점 $B\\,$의 $x\\,$좌표와 $y\\,$좌표의 합은 $\\boxed{\\,\\text{(라)}\\,}\\,$이다.\n위의 (가), (라)에 알맞은 수를 각각 $p$, $q\\,$라 하고, (나), (다)에 알맞은 식을 각각 $f \\left( a \\right)$, $g \\left( a \\right)\\,$라 할 때, $f \\left( p \\right) \\times g \\left( q \\right)\\,$의 값은? [4점]\n① $-10\\,$ ② $-\\frac{19}{2}\\,$ ③ $-9\\,$ ④ $-\\frac{17}{2}\\,$ ⑤ $-8$","answer":"③","sourceHash":"105f0ac5746ddd3e2bb33b335c45f203ec10ea3b7cff04981a007a37f0401590","steps":[{"id":"s1","latex":"\\mathrm M=(b,c),\\quad\\mathrm G=\\frac{2\\mathrm M+\\mathrm A}{3}=(0,2)\\Rightarrow(b,c)=(-a,3)"},{"id":"s2","latex":"\\overline{\\mathrm{AB}}=\\overline{\\mathrm{AC}}\\Rightarrow\\mathrm{AM}\\perp\\mathrm{BC},\\quad m_{\\mathrm{AM}}=-\\frac1a\\Rightarrow m_{\\mathrm{BC}}=a"},{"id":"s3","latex":"\
