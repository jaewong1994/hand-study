  <script>window.HandStudyRecord={"itemId":11588,"sourceLabel":"2019 교육청 고1 수학 6월 19번","adminYear":2019,"grade":1,"month":6,"number":19,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"다음은 $x\\,$에 대한 방정식\n  $\\left( x^{2} +ax+a \\right) \\left( x^{2} +x+a \\right) =0\\,$\n의 근 중 서로 다른 허근의 개수가 $2\\,$이기 위한 실수 $a\\,$의 값의 범위를 구하는 과정이다.\n(1) $a=1\\,$인 경우\n주어진 방정식은 $\\left( x^{2} +x+1 \\right)^{2} =0\\,$이다.\n이 때, 방정식 $x^{2} +x+1=0\\,$의 근은\n$x= \\dfrac{-1\\pm \\sqrt{\\, {\\boxed{\\vphantom{(}\\,(\\text{가})\\,}} \\, } i}{2} \\,$ (단, $i= \\sqrt{-1} \\,$)이므로 \n방정식 $\\left( x^{2} +x+1 \\right)^{2} =0\\,$의 서로 다른 허근의 개수는 $2\\,$이다.\n(2) $a \\neq 1\\,$인 경우\n방정식 $x^{2} +ax+a=0\\,$의 근은 $x= \\dfrac{-a\\pm \\sqrt{\\, {\\boxed{\\vphantom{(}\\,(\\text{나})\\,}} \\, }}{2} \\,$이다.\n(ⅰ) ${\\boxed{\\vphantom{(}\\,(\\text{나})\\,}} \\,\\lt 0\\,$일 때, 방정식 $x^{2} +x+a=0\\,$은 실근을 가져야 하므로 실수 $a\\,$의 값의 범위는\n $0\\lt a \\leq \\dfrac{1}{4} \\,$\n이다.\n(ⅱ) ${\\boxed{\\vphantom{(}\\,(\\text{나})\\,}} \\, \\geq 0\\,$일 때, 방정식 $x^{2} +x+a=0\\,$은 허근을 가져야 하므로 실수 $a\\,$의 값의 범위는\n $a \\geq {\\boxed{\\vphantom{(}\\,(\\text{다})\\,}}\\,$\n이다.\n따라서 (1)과 (2)에 의하여\n방정식 $\\left( x^{2} +ax+a \\right) \\left( x^{2} +x+a \\right) =0\\,$의 근 중 서로 다른 허근의 개수가 $2\\,$이기 위한 실수 $a\\,$의 값의 범위는\n $0\\lt a \\leq \\dfrac{1}{4} \\,$ 또는 $a=1\\,$ 또는 $a \\geq {\\boxed{\\vphantom{(}\\,(\\text{다})\\,}}\\,$\n이다.\n위의 $(\\text{가})$, (다)에 알맞은 수를 각각 $p\\,$, $q\\,$라 하고, (나)에 알맞은 식을 $f \\left(a \\right) \\,$라 할 때, $p+q+f \\left( 5 \\right)\\,$의 값은? [4점]\n① $8$ ② $9$ ③ $10$ ④ $11$ ⑤ $12$","answer":"⑤","sourceHash":"c09b9985d99a75683e09ede1ba66dcdb6fddac149cd2c4d68ca80cb926e8a591","steps":[{"id":"s1","latex":"x^2+x+1=0\\Rightarrow x=\\frac{-1\\pm\\sqrt3i}{2}\\Rightarrow p=3"},{"id":"s2","latex":"x^2+ax+a=0:\\ \\Delta=f(a)=a^2-4a"},{"id":"s3","latex":"f(a)\\ge0\\iff a\\le0\\ \\text{또는}\\ a\\ge4"},{"id":"s4","latex":"x^2+x+a=0\\text{이 허근}\\iff1-4a\u003c0\\iff a>\\frac14"},{"id":"s5","latex":"f(a)\\ge0\\text{인 경우의 공통 범위 }a\\ge
