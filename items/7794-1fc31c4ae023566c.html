  <script>window.HandStudyRecord={"itemId":7794,"sourceLabel":"2019 교육청 고2 수학가형 9월 17번","adminYear":2019,"grade":2,"month":9,"number":17,"track":"수학가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 자연수 $n\\,$에 대하여 중심이 직선 $y= \\frac{n}{n+1} x$ 위에 있는 원이 원점을 지난다. 이 원이 $x\\,$축과 만나는 점 중에서 $x\\,$좌표가 양수인 점을 $A\\,$, $y\\,$축과 만나는 점 중에서 $y\\,$좌표가 양수인 점을 $B\\,$라 하자. $\\overline{OB}=2n\\,$이고 삼각형 $OAB\\,$의 넓이를 $S _{n} \\,$이라 할 때, $\\sum _{n=1} ^{10} \\, \\frac{1}{S _{n}} \\,$의 값은? (단, $O\\,$는 원점이다.) [4점]\n$O$$A$$B$$x$$y$$y= \\frac{n}{n+1} x$\n① $\\frac{5}{11}$ ② $\\frac{6}{11}$ ③ $\\frac{7}{11}$ ④ $\\frac{8}{11}$ ⑤ $\\frac{9}{11}$","answer":"①","sourceHash":"1250d9b3168040d4d5b3db53231fc57cd4bce97f0d18c9be2b1c6e146724f7fd","steps":[{"id":"s1","latex":"OA\\perp OB,\\quad \\dfrac{OB}{OA}=\\dfrac n{n+1}"},{"id":"s2","latex":"OB=2n\\Rightarrow OA=2(n+1)"},{"id":"s3","latex":"S_n=\\dfrac12OA\\cdot OB=2n(n+1)"},{"id":"s4","latex":"\\sum_{n=1}^{10}\\dfrac1{S_n}=\\dfrac12\\sum\\left(\\dfrac1n-\\dfrac1{n+1}\\right)=\\dfrac5{11}"}],"diagram":null,"contentHash":"f0ca4582dd26c5b26b1c52a45abb5c881211d9cb8de589e67c38c37ff1006062","questionHtml":"\u003cp class=\"hp htall\">그림과 같이 자연수 \u003cspan class=\"heq\">\\(n\\,\\)\u003c/span>에 대하여 중심이 직선 \u003cspan class=\"heq\">\\(y= \\dfrac{n}{n+1} x\\)\u003c/span> 위에 있는 원이 원점을 지난다. 이 원이 \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>축과 만나는 점 중에서 \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>좌표가 양수인 점을 \u003cspan class=\"heq\">\\(A\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(y\\,\\)\u003c/span>축과 만나는 점 중에서 \u003cspan class=\"heq\">\\(y\\,\\)\u003c/span>좌표가 양수인 점을 \u003cspan class=\"heq\">\\(B\\,\\)\u003c/span>라 하자. \u003cspan class=\"heq\">\\(\\overline{O B}=2n\\,\\)\u003c/span>이고 삼각형 \u003cspan class=\"heq\">\\(OAB\\,\\)\u003c/span>의 넓이를 \u003cspan class=\"heq\">\\(S_{n} \\,\\)\u003c/span>이라 할 때, \u003cspan class=\"heq\">\\(\\sum\\limits_{n=1}^{10} \\, \\dfrac{1}{S_{n}} \\,\\)\u003c/span>의 값은? (단, \u003cspan class=\"heq\">\\(
