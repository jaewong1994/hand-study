<script>window.HandStudyGuide={"itemId":25020,"sourceHash":"3e6d71f7c45391f129a6e738fa898642edb970f16a48bb916189f41543943346","contentHash":"fea6bf0fdb6d9530316262e4c7f69163f58d9fcd76d70528374e421b4a91bee4","overview":{"goal":"곱이 홀수라는 조건 아래에서 다섯 눈의 합이 15인 순서 있는 결과를 세어요.","firstLook":"곱이 홀수이면 다섯 주사위의 눈이 하나도 빠짐없이 홀수여야 해요. 조건을 만족한 뒤에는 각 주사위가 1, 3, 5를 똑같은 확률로 내므로 분모가 \\(3^5\\)가 돼요.","conditions":[{"label":"조건 사건","meaning":"서로 다른 다섯 주사위가 각각 1, 3, 5 중 하나를 내요."},{"label":"합 조건","meaning":"다섯 눈의 합이 15가 되도록 1, 3, 5의 개수를 정해요."}]},"chapters":[{"id":"c1","label":"조건부확률의 분모를 정해요","stepIds":["s1"],"question":"곱이 홀수라는 조건을 만족하는 결과는 왜 \\(3^5\\)가지일까요?","hint":"곱이 홀수가 되려면 각 인수가 어떤 홀짝이어야 하는지 보세요.","explanation":"다섯 눈의 곱이 홀수이려면 다섯 눈이 모두 홀수여야 해요. 각 주사위는 1, 3, 5 중 하나를 내고, 주사위 다섯 개는 서로 다르므로 조건을 만족하는 순서 있는 결과는 \\(3\\times3\\times3\\times3\\times3=3^5=243\\)가지예요. 원래 전체 \\(6^5\\)가 아니라 곱이 홀수인 243가지를 조건부확률의 분모로 써요.","check":{"prompt":"조건부확률에서 분모를 \\(6^5\\)로 잡지 않는 이유는 무엇인가요?","answer":"이미 곱이 홀수라는 조건이 주어졌으므로, 다섯 눈이 모두 홀수인 결과만 표본으로 삼아야 해요."}},{"id":"c2","label":"1과 3과 5의 개수를 풀어요","stepIds":["s2","s3"],"question":"1, 3, 5가 각각 몇 번 나와야 합이 15가 될까요?","hint":"각 개수를 \\(a,b,c\\)로 두고 전체 개수 식과 합 식을 빼 보세요.","explanation":"1, 3, 5가 나온 횟수를 각각 \\(a,b,c\\)라 하면 \\(a+b+c=5\\), \\(a+3b+5c=15\\)예요. 첫째 식의 3배를 둘째 식에서 빼면 \\(-2a+2c=0\\), 즉 \\(a=c\\)예요. 그러면 \\(2a+b=5\\)이므로 \\(a=0,1,2\\)이고, 이에 따라 \\((a,b,c)=(0,5,0),(1,3,1),(2,1,2)\\)예요. \\(a\\ge3\\)이면 \\(b=5-2a<0\\)이므로 더 이상의 경우는 없어요.","check":{"prompt":"\\(a=c\\)를 얻은 뒤 세 경우가 전부라는 것은 어떻게 확인하나요?","answer":"\\(b=5-2a\\)가 0 이상인 정수여야 해서 \\(a=0,1,2\\)만 가능해요."}},{"id":"c3","label":"서로 다른 주사위에 배치해요","stepIds":["s4","s5"],"question":"세 횟수의 경우에서 순서 있는 결과는 각각 몇 가지일까요?","hint":"주사위가 서로 다르므로 같은 눈의 개수만 정한 뒤 자리를 고르는 순열의 수를 세어요.","explanation":"\\((0,5,0)\\)은 모두 3이므로 1가지예요. \\((1,3,1)\\)은 1의 자리와 5의 자리를 고르면 되므로 \\(5\\times4=20\\)가지이고, 이는 \\(5!/3!\\)과 같아요. \\((2,1,2)\\)는 1의 자리 두 개와 5의 자리 두 개를 정하므로 \\(5!/(2!1!2!)=30\\)가지예요. 따라서 합이 15인 결과는 \\(1+20+30=51\\)가지예요.\n\n구하는 확률은 \\(51/243=17/81\\)이고, \\(p=81,q=17\\)이므로 \\(p+q=98\\)이에요.","check":{"prompt":"\\((1,3,1)\\)을 단순히 한 가지로 세면 안 되는 이유는 무엇인가요?","answer":"다섯 주사위가 서로 다르므로 1과 5가 어느 주사위에서 나왔는지에 따라 다른 결과이고, 그 배치가 20가지예요."}}],"takeaway":["조건부확률의 분모는 주어진 조건을 만족하는 결과들만으로 다시 정해요.","눈의 종류별 개수는 전체 개수 식과 합 식을 함께 풀어 빠짐없이 찾을 수 있어요.","주사위가 서로 다르면 같은 눈의 개수를 정한 뒤에도 어느 주사위에 놓이는지까지 세어야 해요."]};</script>
