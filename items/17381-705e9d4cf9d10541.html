<script>window.HandStudyGuide={"itemId":17381,"sourceHash":"9ba4471dde791f3bacae9d9e49a051d3a5c18ff2a56d63151b9b5061ea5e3773","contentHash":"a4aa29766e7cff58219ae85889f31ca4323f39650459c5f96c0b0909c36d4e28","overview":{"goal":"적분함수의 도함수 근 네 개 중 부호가 바뀌는 점이 두 개만 남도록 중복 조건을 세워요.","firstLook":"삼차함수의 도함수 두 근을 \\(r<s\\)라 하면 \\(g'\\)의 네 근은 이 둘을 \\(a\\)만큼 좌우로 옮긴 값이에요.","conditions":[{"label":"극값 두 개","meaning":"\\(g'\\)의 부호가 바뀌는 서로 다른 근이 정확히 두 개예요."},{"label":"최고차항","meaning":"\\(f'(x)=3(x-r)(x-s)\\)예요."}]},"chapters":[{"id":"c1","label":"도함수의 네 근을 배열해요","stepIds":["s1","s2"],"question":"\\(g'\\)의 근은 무엇인가요?","hint":"적분의 미분과 \\(f'\\)의 인수분해를 써요.","explanation":"미적분의 기본정리에 따라 \\(g'(x)=f'(x+a)f'(x-a)\\)예요. \\(f'(x)=3(x-r)(x-s)\\), \\(r<s\\)라 하면 \\(g'(x)=9(x-r+a)(x-s+a)(x-r-a)(x-s-a)\\)예요. 따라서 후보는 \\(r-a,s-a,r+a,s+a\\) 네 점이에요.","check":{"prompt":"\\(f'\\)의 최고차항 계수가 \\(3\\)인 이유는 무엇인가요?","answer":"\\(f\\)가 최고차항 계수 \\(1\\)인 삼차함수이기 때문이에요."}},{"id":"c2","label":"가운데 두 근을 겹치게 해요","stepIds":["s3","s4"],"question":"네 후보에서 극값이 두 개만 생기려면 어떤 관계가 필요한가요?","hint":"가운데 두 근이 같은 점에서 두 번 곱해지면 부호가 바뀌지 않아요.","explanation":"가장 바깥의 두 근에서는 일차인수가 한 번씩 나타나 부호가 바뀌고, 극값 위치가 \\(1/2,13/2\\)이므로 \\(r-a=1/2\\), \\(s+a=13/2\\)예요. 나머지 두 근까지 서로 다르면 극값이 네 개가 되므로 \\(s-a=r+a\\)로 겹쳐 두 번 곱해진 근을 만들어야 해요. 세 식을 풀면 \\(a=3/2,r=2,s=5\\)이고, \\(f'(x)=3(x-2)(x-5)=3x^2-21x+30\\)이에요.","check":{"prompt":"겹친 가운데 근에서 극값이 생기지 않는 이유는 무엇인가요?","answer":"같은 인수가 두 번 곱해져 그 점을 지나도 \\(g'\\)의 부호가 바뀌지 않기 때문이에요."}},{"id":"c3","label":"원함수를 복원해 값을 계산해요","stepIds":["s5","s6"],"question":"\\(af(1)\\)은 얼마인가요?","hint":"\\(f'\\)를 적분하고 \\(f(0)=-1/2\\)를 사용해요.","explanation":"적분하면 \\(f(x)=x^3-21x^2/2+30x+C\\)이고 \\(f(0)=-1/2\\)에서 \\(C=-1/2\\)예요. 따라서 \\(f(1)=1-21/2+30-1/2=20\\)이고, \\(a=3/2\\)이므로 \\(af(1)=30\\)이에요.","check":{"prompt":"\\(f(1)\\) 계산에서 두 분수항의 합은 얼마인가요?","answer":"\\(-21/2-1/2=-11\\)이에요."}}],"takeaway":["적분함수의 극값은 integrand인 도함수의 부호 변화로 판단해요.","네 근 중 두 근을 겹치면 그 점은 짝수 번 곱해진 근이 되어 부호가 유지돼요.","도함수로 원함수를 복원할 때 주어진 함수값으로 적분상수를 정해요."]};</script>
