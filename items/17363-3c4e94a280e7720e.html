<script>window.HandStudyRecord={"itemId":17363,"sourceLabel":"2022 교육청 고3 수학미적분 10월 22번","adminYear":2022,"grade":3,"month":10,"number":22,"track":"미적분","points":4,"scoreStatus":"confirmed_4_direct","questionText":"최고차항의 계수가 $1$인 사차함수 $f \\left( x \\right)$와 실수 $t$에 대하여 구간 $(- \\infty ,\\,t\\,]$에서 함수 $f \\left( x \\right)$의 최솟값을 $m _{1}$이라 하고, 구간 $[\\,t,\\, \\infty )$에서 함수 $f \\left( x \\right)$의 최솟값을 $m _{2}$라 할 때,\n $g \\left( t \\right)$$= m _{1} -m _{2}$\n라 하자. $k>0$인 상수 $k$와 함수 $g \\left( t \\right)$가 다음 조건을 만족시킨다.\n$g \\left( t \\right)$$=k$를 만족시키는 모든 실수 $t$의 값의 집합은 $\\left\\{ t\\, \\left| \\,0 \\leq t \\leq 2 \\right\\} \\right.$이다.\n$g \\left( 4 \\right)$$=0$일 때, $k+g \\left( -1 \\right)$의 값을 구하시오. [4점]\n 사각형입니다. 2022년 10월 고3 모의고사 문제지제 2 교시 수학 영역(미적분) \n5 지선다형","answer":"82","sourceHash":"48761be99640ae06e2afbb1bbb3e6ae0e23b92b1c1edb5488eec7698e3554ad8","steps":[{"id":"s1","latex":"g(t)=m_1(t)-m_2(t)\\text{는 감소함수}"},{"id":"s2","latex":"g(t)=k\\Longleftrightarrow0\\le t\\le2\\Rightarrow f(0)=f(2),\\quad x=0\\text{에서 극소}"},{"id":"s3","latex":"f(x)-f(0)=x^2(x-2)(x-c),\\quad c>2"},{"id":"s4","latex":"\\beta>2\\text{를 오른쪽 극소점이라 하면 }g(4)=0\\Rightarrow\\beta=4"},{"id":"s5","latex":"f'(x)=4x^3-3(c+2)x^2+4cx"},{"id":"s6","latex":"f'(4)=160-32c=0\\Rightarrow c=5"},{"id":"s7","latex":"f(x)-f(0)=x^2(x-2)(x-5)"},{"id":"s8","latex":"k=f(0)-f(4)=32"},{"id":"s9","latex":"g(-1)=f(-1)-f(4)=18+32=50"},{"id":"s10","latex":"k+g(-1)=\\boxed{82}"}],"diagram":null,"contentHash":"9499ce4fb61b2a318dc1e15438a6831e4f732260d7139165582362c38eeb0a0b","questionHtml":"\u003cp class=\"hp\">최고차항의 계수가 \u003cspan class=\"heq\">\\(1\\)\u003c/span>인 사차함수 \u003cspan class=\"heq\">\\(f \\left( x \\right)\\)\u003c/span>와 실수 \u003cspan class=\"heq\">\\(t\\)\u003c/span>에 대하여\u003cbr>구간 \u003cspan class=\"heq\">\\((- \\infty ,\\,t\\,]\\)\u003c/span>에서 함수 \u003cspan class=\"heq\">\\(f \\left( x \\right)\\)\u003c/span>의 최솟값을 \u003cspan class=\"heq\">\\(m_{1}\\)\u003c/span>이라 하고, \u003cbr>구간 \u003cspan class=\"heq\">\\([\\,t,\\, \\infty )\\)\u003c/span>에서 함수 \u003cspan class=\"heq\">\\(f \\left( x \\right)\\)\u003c/span>의 최솟값을 \u003cspan class=\"heq\">\\(m_{2}\\)\u003c/span>라 할 때,\u003c/p>\u003cp class=\"hp\">&emsp;&emsp;\u003cspan class=\"heq\">\\(g \\left( t \\right)\\)\u003c/span>\u003cspan class=\"heq\">\\(= m_{1} -m_{2}\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">라 하자. \u003cspan class=\"heq\">\\(k\\gt 0\\)\u003c/span>인 상수 \u003cspan class=\"heq\">\\(k\\)\u003c/span>와 함수 \u003cspan class=\"heq\">\\(g \\left( t \\right)\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(g \\left( t \\right)\\)\u003c/span>\u003cspan class=\"heq\">\\(=k\\)\u003c/span>를 만족시키는 모든 실수 \u003cspan class=\"heq\">\\(t\\)\u003c/span>의 값의 집합은\u003cbr>\u003cspan class=\"heq\">\\(\\left\\{ t\\, \\left| \\,0 \\leq t \\leq 2 \\right\\} \\right.\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(g \\left( 4 \\right)\\)\u003c/span>\u003cspan class=\"heq\">\\(=0\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(k+g \\left( -1 \\right)\\)\u003c/span>의 값을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"3c4e94a280e7720eaa820141869c723e01ac86a4ba5f63edf47b59acd75b3ed4"};</script>
<script>window.HandStudyGuide={"itemId":17363,"sourceHash":"48761be99640ae06e2afbb1bbb3e6ae0e23b92b1c1edb5488eec7698e3554ad8","contentHash":"9499ce4fb61b2a318dc1e15438a6831e4f732260d7139165582362c38eeb0a0b","overview":{"goal":"좌우 구간의 최솟값 차가 일정한 구간에서 사차함수의 두 골짜기 구조를 복원하고 함숫값 차를 계산해요.","firstLook":"\\(t\\)가 커지면 왼쪽 구간은 넓어져 최솟값이 내려갈 수 있고, 오른쪽 구간은 좁아져 최솟값이 올라갈 수 있어요. 그래서 \\(g(t)\\)는 감소하고, 값이 일정한 구간은 두 최솟점 사이의 구조를 알려 줘요.","conditions":[{"label":"최고차항","meaning":"계수가 1인 사차함수라 양쪽 끝에서 함숫값이 커져 각 반직선 구간의 최솟값이 존재해요."},{"label":"해집합","meaning":"\\(g(t)=k\\)가 정확히 \\(0\\le t\\le2\\)에서만 성립하고 \\(k>0\\)이에요."},{"label":"추가 조건","meaning":"\\(g(4)=0\\)이 되는 위치로 오른쪽 골짜기의 최솟점을 정해요."}]},"chapters":[{"id":"c1","label":"g의 감소성과 일정한 구간의 뜻을 읽어요","stepIds":["s1","s2"],"question":"\\(g(t)\\)가 감소하고 \\(0\\le t\\le2\\)에서만 일정하다는 것은 \\(f\\)에 어떤 정보를 줄까요?","hint":"t가 오른쪽으로 움직일 때 두 반직선 구간의 포함 관계와 최솟값 변화를 비교해요.","explanation":"\\(t\\)가 커지면 \\((-\\infty,t]\\)는 넓어지므로 \\(m_1\\)은 커지지 않고, \\([t,\\infty)\\)는 좁아지므로 \\(m_2\\)는 작아지지 않아요. 따라서 \\(g=m_1-m_2\\)는 감소해요.\n\n그런데 \\(g(t)=k>0\\)가 정확히 \\([0,2]\\)에서 일정해요. 이 구간에서는 왼쪽 최솟값이 \\(f(0)\\), 오른쪽 최솟값이 더 오른쪽 골짜기의 값으로 고정되어야 해요. 왼쪽 경계가 \\(0\\)이므로 \\(x=0\\)은 극솟점이고 \\(f'(0)=0\\)이에요. 또 \\(t=2\\)를 지나자마자 왼쪽 최솟값이 변하기 시작하려면 \\(f(2)=f(0)\\)이고 \\(2\\) 오른쪽에서 함수가 그 값 아래로 내려가야 해요.","check":{"prompt":"\\(m_1\\)은 \\(t\\)가 증가할 때 왜 증가할 수 없나요?","answer":"최솟값을 구하는 구간에 점이 더 추가되므로 기존보다 더 작은 값이 생길 수는 있어도 더 커질 수는 없어요."}},{"id":"c2","label":"함숫값 차를 인수분해해 모양을 잡아요","stepIds":["s3","s4"],"question":"조건 \\(f'(0)=0\\)과 \\(f(2)=f(0)\\)으로 \\(f(x)-f(0)\\)를 어떻게 나타낼까요?","hint":"\\(x=0\\)은 같은 함숫값을 갖는 근이면서 극솟점이라 인수 \\(x\\)가 두 번 곱해져요.","explanation":"\\(f(0)-f(0)=0\\)이고 \\(f'(0)=0\\)이므로 \\(f(x)-f(0)\\)에는 \\(x^2\\)이 곱해져요. 또 \\(f(2)=f(0)\\)이므로 \\(x-2\\)도 곱해져요. 최고차항 계수가 \\(1\\)인 사차식이어서 남은 근을 \\(c\\)라 두면\n\\[\nf(x)-f(0)=x^2(x-2)(x-c).\n\\]\n\\(2\\) 바로 오른쪽에서 값이 \\(f(0)\\)보다 작아져야 하므로 \\(c>2\\)예요.\n\n오른쪽 극솟점을 \\(\\beta\\)라 하자. \\(t<\\beta\\)에서는 오른쪽 구간의 최솟값이 \\(f(\\beta)\\)이고, \\(t=\\beta\\)에서는 왼쪽 구간도 그 값을 처음 포함해 두 최솟값이 같아져요. \\(g(4)=0\\)이므로 이 경계는 \\(\\beta=4\\)예요.","check":{"prompt":"\\(c>2\\)이면 \\(2<x<c\\)에서 \\(f(x)-f(0)\\)의 부호는 무엇인가요?","answer":"\\(x^2>0\\), \\(x-2>0\\), \\(x-c<0\\)이므로 음수예요."}},{"id":"c3","label":"오른쪽 극솟점으로 남은 근을 정해요","stepIds":["s5","s6","s7"],"question":"오른쪽 극솟점이 \\(4\\)라는 조건은 \\(c\\)를 어떻게 정할까요?","hint":"전개하지 않고 곱을 미분해도 되지만, 주어진 도함수에 \\(x=4\\)를 넣으면 빨라요.","explanation":"식을 전개해 미분하면 \\(f'(x)=4x^3-3(c+2)x^2+4cx\\)예요. \\(x=4\\)가 극솟점이므로 \\(f'(4)=0\\)이고\n\\[\n256-48(c+2)+16c=160-32c=0.\n\\]\n따라서 \\(c=5\\)이고 \\(f(x)-f(0)=x^2(x-2)(x-5)\\)예요. 실제로 \\(x=4\\)에서 이 값은 음수이고 오른쪽 골짜기가 왼쪽 골짜기보다 낮다는 \\(k>0\\) 조건과 맞아요.","check":{"prompt":"\\(160-32c=0\\)에서 \\(c\\)는 얼마인가요?","answer":"\\(32c=160\\)이므로 \\(c=5\\)예요."}},{"id":"c4","label":"두 함숫값 차를 계산해 답을 구해요","stepIds":["s8","s9","s10"],"question":"\\(k\\)와 \\(g(-1)\\)을 절댓값 없이 어떻게 계산할까요?","hint":"모두 \\(f(0)\\)과 \\(f(4)\\)를 기준으로 함숫값 차를 나누어요.","explanation":"오른쪽 최솟점은 \\(4\\)이므로 일정한 값은 \\(k=f(0)-f(4)\\)예요. \\(f(4)-f(0)=4^2(4-2)(4-5)=-32\\)이므로 \\(k=32\\)예요.\n\n\\(t=-1\\)에서는 왼쪽 구간의 최솟값이 끝점의 값 \\(f(-1)\\)이고 오른쪽 구간은 \\(x=4\\)의 최솟값을 포함해요. \\(f(-1)-f(0)=(-1)^2(-3)(-6)=18\\)이므로 \\(g(-1)=f(-1)-f(4)=18+32=50\\)이에요. 따라서 \\(k+g(-1)=32+50=82\\)예요.","check":{"prompt":"\\(f(4)-f(0)\\)가 \\(-32\\)인데 \\(k\\)가 \\(32\\)인 이유는 무엇인가요?","answer":"\\(k=f(0)-f(4)\\)로 순서가 반대이므로 부호가 바뀌어요."}}],"takeaway":["움직이는 구간의 최솟값은 구간의 포함 관계를 따라 한쪽은 내려가고 다른 쪽은 올라가요.","최솟값 차가 일정한 구간의 양 끝은 극솟점과 같은 높이로 돌아오는 점을 알려 줄 수 있어요.","함숫값 자체의 상수항이 없어도 기준값과의 차를 인수분해하면 필요한 차이를 모두 계산할 수 있어요."]};</script>
