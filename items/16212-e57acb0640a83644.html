<script>window.HandStudyRecord={"itemId":16212,"sourceLabel":"2019 교육청 고3 수리가형 10월 20번","adminYear":2019,"grade":3,"month":10,"number":20,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"함수 $f(x)= \\int_{x}^{x+2} {\\left| 2^{t} -5 \\right|} dt\\,$의 최솟값을 $m\\,$이라 할 때, $2^{m} \\,$의 값은? [4점]\n① $\\left( \\dfrac{5}{4} \\right)^{8}$ ② $\\left( \\dfrac{5}{4} \\right)^{9}$ ③ $\\left( \\dfrac{5}{4} \\right)^{10}$ ④ $\\left( \\dfrac{5}{4} \\right)^{11}$ ⑤ $\\left( \\dfrac{5}{4} \\right)^{12}$","answer":"③","sourceHash":"4b0ad805a84018a3b63ecbc4ff90c427259ef53180ce54750ee4192a2637dde8","steps":[{"id":"s1","latex":"f\\prime(x)=|2^{x+2}-5|-|2^x-5|"},{"id":"s2","latex":"u=2^x>0:\\quad f\\prime(x)=0\\Longleftrightarrow|4u-5|=|u-5|\\Longleftrightarrow u=2"},{"id":"s3","latex":"f\\prime:\\ -\\to+\\text{ at }x=1\\Rightarrow m=f(1)"},{"id":"s4","latex":"m=\\int_1^{\\log_25}(5-2^t)\\,dt+\\int_{\\log_25}^{3}(2^t-5)\\,dt"},{"id":"s5","latex":"m=10\\log_25-20"},{"id":"s6","latex":"2^m=2^{10\\log_25-20}=\\boxed{\\left(\\frac54\\right)^{10}}"}],"diagram":null,"contentHash":"f9f98ff828c4a0510e7ac2ebdd4e511f0899a69e779ea8ab9255a6c5522bfbab","questionHtml":"\u003cp class=\"hp\">함수 \u003cspan class=\"heq\">\\(f(x)= \\int_{x}^{x+2} {\\left| 2^{t} -5 \\right|} dt\\,\\)\u003c/span>의 최솟값을 \u003cspan class=\"heq\">\\(m\\,\\)\u003c/span>이라 할 때, \u003cspan class=\"heq\">\\(2^{m} \\,\\)\u003c/span>의 값은? \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp htall\">① \u003cspan class=\"heq\">\\(\\left( \\dfrac{5}{4} \\right)^{8}\\)\u003c/span>&emsp;② \u003cspan class=\"heq\">\\(\\left( \\dfrac{5}{4} \\right)^{9}\\)\u003c/span>&emsp;③ \u003cspan class=\"heq\">\\(\\left( \\dfrac{5}{4} \\right)^{10}\\)\u003c/span>&emsp;④ \u003cspan class=\"heq\">\\(\\left( \\dfrac{5}{4} \\right)^{11}\\)\u003c/span>&emsp;⑤ \u003cspan class=\"heq\">\\(\\left( \\dfrac{5}{4} \\right)^{12}\\)\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"e57ac <script>window.HandStudyGuide={"itemId":16212,"sourceHash":"4b0ad805a84018a3b63ecbc4ff90c427259ef53180ce54750ee4192a2637dde8","contentHash":"f9f98ff828c4a0510e7ac2ebdd4e511f0899a69e779ea8ab9255a6c5522bfbab","overview":{"goal":"길이가 2인 적분 구간을 움직일 때 양 끝의 함수값을 비교해 최솟값의 위치를 찾고, 절댓값이 바뀌는 점에서 적분을 나눠 계산해요.","firstLook":"적분 구간의 길이는 그대로이고 양 끝만 함께 움직여요. 도함수는 오른쪽 끝에서 새로 들어오는 값에서 왼쪽 끝에서 빠지는 값을 뺀 꼴이에요.","conditions":[{"label":"이동 구간","meaning":"도함수는 \\(|2^{x+2}-5|-|2^x-5|\\)예요."},{"label":"절댓값 경계","meaning":"\\(2^t=5\\)인 \\(t=\\log_25\\)에서 적분식을 나눠요."}]},"chapters":[{"id":"c1","label":"양 끝값으로 도함수의 부호를 정해요","stepIds":["s1","s2","s3"],"question":"\\(f'(x)=0\\)에서 왜 \\(2^x=2\\)만 남을까요?","hint":"\\(u=2^x>0\\)로 두고 두 절댓값의 제곱을 비교해요.","explanation":"이동 구간 적분을 미분하면 \\(f'(x)=|2^{x+2}-5|-|2^x-5|\\)예요. \\(u=2^x>0\\)로 두면 \\(|4u-5|=|u-5|\\)이고, 제곱한 차를 인수분해하면 \\((4u-5)^2-(u-5)^2=15u(u-2)\\)예요. \\(u>0\\)이므로 \\(u=2\\), 곧 \\(x=1\\)만 가능해요. \\(0<u<2\\)에서는 이 차가 음수라 첫 절댓값이 더 작고, \\(u>2\\)에서는 양수라 더 커요. 따라서 \\(f'\\)는 \\(x=1\\)에서 음수에서 양수로 바뀌어 최솟값은 \\(m=f(1)\\)이에요.","check":{"prompt":"절댓값을 제곱해도 두 변의 대소 부호를 판단할 수 있는 이유는 무엇인가요?","answer":"두 절댓값은 모두 0 이상이므로 제곱의 대소와 원래 값의 대소가 같기 때문이에요."}},{"id":"c2","label":"절댓값이 바뀌는 곳에서 적분을 나눠요","stepIds":["s4","s5"],"question":"구간 \\([1,3]\\) 안에서 왜 \\(\\log_25\\)가 분할점인가요?","hint":"\\(2^t-5\\)의 부호가 바뀌는 값을 찾아요.","explanation":"\\(2<5<8\\)이므로 \\(1<\\log_25<3\\)이에요. 따라서 \\(1\\le t\\le\\log_25\\)에서는 \\(|2^t-5|=5-2^t\\), 그 뒤에서는 \\(2^t-5\\)예요. \\(L=\\log_25\\)라 하면\n\n\\(\\int_1^L(5-2^t)dt=5(L-1)-3/\\ln2\\),\n\n\\(\\int_L^3(2^t-5)dt=3/\\ln2-5(3-L)\\)예요. 지수 적분에서 나온 두 항이 상쇄되어 \\(m=10L-20\\)이 돼요.","check":{"prompt":"두 적분에서 \\(1/\\ln2\\)가 붙은 항이 왜 서로 지워지나요?","answer":"첫 적분은 \\(-(5-2)/\\ln2=-3/\\ln2\\), 둘째 적분은 \\((8-5)/\\ln2=3/\\ln2\\)를 주기 때문이에요."}},{"id":"c3","label":"로그 지수를 선택지 꼴로 바꿔요","stepIds":["s6"],"question":"\\(2^{10\\log_25-20}\\)을 어떻게 \\((5/4)^{10}\\)으로 바꿀까요?","hint":"\\(2^{\\log_25}=5\\)와 \\(2^{20}=4^{10}\\)을 써요.","explanation":"\\(2^m=2^{10\\log_25}/2^{20}=5^{10}/(2^2)^{10}=(5/4)^{10}\\)이에요. 따라서 선택지는 ③이에요.","check":{"prompt":"분모 \\(2^{20}\\)이 \\(4^{10}\\)인 이유는 무엇인가요?","answer":"\\(2^{20}=(2^2)^{10}=4^{10}\\)이기 때문이에요."}}],"takeaway":["이동 구간 적분의 도함수는 들어오는 끝값에서 빠지는 끝값을 뺀 꼴이에요.","절댓값 적분은 안쪽 식의 영점이 실제 적분 구간 안에 있는지 확인해 나눠요.","로그가 지수에 있으면 밑의 정의와 같은 거듭제곱을 만들어 정리해요."]};</script>
