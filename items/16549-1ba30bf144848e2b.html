<script>window.HandStudyRecord={"itemId":16549,"sourceLabel":"2019 평가원 고3 수리가형 9월 29번","adminYear":2019,"grade":3,"month":9,"number":29,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"좌표공간에서 원점 ${O}$와 점 ${A}(4,\\, 0,\\, 0)$에 대하여 평면 $x+ y+ \\sqrt{2} z= 0$ 위의 점 ${P}$가 다음 조건을 만족시킨다.\n(가) $\\left|\\, \\vec{{O P}} \\, \\right|$는 $9$이하의 자연수이다.(나) $\\vec{{O A}}  \\cdot  \\vec{{A P}}\\,= 6$\n$\\vec{{A P}}  \\cdot  \\vec{{O P}}$의 최댓값을 ${M}$, 최솟값을 $m$이라 할 때, ${M} +m$의 값을 구하시오. [4점]","answer":"86","sourceHash":"08b325c80b0d920fa43b9ba615088df65d4e6aece121ac9df53914621b105578","steps":[{"id":"s1","latex":"P=(x,y,z),\\quad\\vec{OA}=(4,0,0),\\quad\\vec{AP}=(x-4,y,z)"},{"id":"s2","latex":"\\vec{OA}\\cdot\\vec{AP}=6\\Rightarrow4(x-4)=6\\Rightarrow x=\\frac{11}{2}"},{"id":"s3","latex":"\\vec{AP}\\cdot\\vec{OP}=|\\vec{OP}|^2-4x=|\\vec{OP}|^2-22"},{"id":"s4","latex":"P:\\quad x=\\frac{11}{2},\\qquad y+\\sqrt2z=-\\frac{11}{2}"},{"id":"s5","latex":"|OP|^2\\ge\\left(\\frac{11}{2}\\right)^2+\\left(\\frac{11}{2\\sqrt3}\\right)^2=\\frac{121}{3}"},{"id":"s6","latex":"|OP|\\in\\mathbb N,\\ |OP|\\le9\\Rightarrow |OP|\\in\\{7,8,9\\}"},{"id":"s7","latex":"M=9^2-22=59,\\qquad m=7^2-22=27"},{"id":"s8","latex":"M+m=\\boxed{86}"}],"diagram":null,"contentHash":"24d5b85f2fb311abe88601b4898cdac37a4fb63560ff831d7ee26fa1277704ca","questionHtml":"\u003cp class=\"hp\">좌표공간에서 원점 \u003cspan class=\"heq\">\\({O}\\)\u003c/span>와 점 \u003cspan class=\"heq\">\\({A}(4,\\, 0,\\, 0)\\)\u003c/span>에 대하여 평면\u003cbr>\u003cspan class=\"heq\">\\(x+ y+ \\sqrt{2} z= 0\\)\u003c/span> 위의 점 \u003cspan class=\"heq\">\\({P}\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) \u003cspan class=\"heq\">\\(\\left|\\, \\vec{{O P}} \\, \\right|\\)\u003c/span>는 \u003cspan class=\"heq\">\\(9\\)\u003c/span>이하의 자연수이다.\u003c/p>\u003cp class=\"hp\">(나) \u003cspan class=\"heq\">\\(\\vec{{O A}}  \\cdot  \\vec{{A P}}\\,= 6\\)\u003c/span>\u003c/p>\u003c/div>\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(\\vec{{A P}}  \\cdot  \\vec{{O P}}\\)\u003c/span>의 최댓값을 \u003cspan class=\"heq\">\\({M}\\)\u003c/span>, 최솟값을 \u003cspan class=\"heq\">\\(m\\)\u003c/span>이라 할 때, \u003cspan class=\"heq\">\\({M} +m\\)\u003c/span>의 값을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"1ba30bf144848e2b0d40e149fdd5ba8613599839d4430c36f47298dcac33190b"};</script>
<script>window.HandStudyGuide={"itemId":16549,"sourceHash":"08b325c80b0d920fa43b9ba615088df65d4e6aece121ac9df53914621b105578","contentHash":"24d5b85f2fb311abe88601b4898cdac37a4fb63560ff831d7ee26fa1277704ca","overview":{"goal":"한 내적 조건으로 P의 x좌표를 고정하고, 평면 위에서 가능한 OP의 자연수 길이를 찾아 목표 내적의 최댓값과 최솟값을 구해요.","firstLook":"목표 내적을 전개하면 \\(|\\overrightarrow{OP}|^2\\)에서 일정한 수를 뺀 꼴이 돼요. 따라서 가능한 \\(OP\\)의 길이 가운데 가장 작은 것과 큰 것만 찾으면 돼요.","conditions":[{"label":"평면 위의 점","meaning":"\\(P=(x,y,z)\\)는 \\(x+y+\\sqrt2z=0\\)을 만족해요."},{"label":"자연수 거리","meaning":"\\(OP\\)의 길이는 \\(9\\) 이하의 양의 정수예요."},{"label":"고정 내적","meaning":"\\(\\overrightarrow{OA}\\cdot\\overrightarrow{AP}=6\\)이 \\(x\\)좌표를 정해요."}]},"chapters":[{"id":"c1","label":"고정 내적으로 x좌표를 정해요","stepIds":["s1","s2"],"question":"점 \\(P\\)의 \\(x\\)좌표는 얼마인가요?","hint":"\\(\\overrightarrow{OA}=(4,0,0)\\), \\(\\overrightarrow{AP}=(x-4,y,z)\\)예요.","explanation":"점 \\(P=(x,y,z)\\)라 두면 \\(\\overrightarrow{OA}=(4,0,0)\\), \\(\\overrightarrow{AP}=(x-4,y,z)\\)예요. 따라서 주어진 내적은 \\(4(x-4)=6\\)이고 \\(x=11/2\\)예요.","check":{"prompt":"\\(4(x-4)=6\\)에서 \\(x-4\\)는 얼마인가요?","answer":"\\(3/2\\)이므로 \\(x=11/2\\)예요."}},{"id":"c2","label":"목표 내적을 OP의 길이로 바꿔요","stepIds":["s3","s4"],"question":"\\(\\overrightarrow{AP}\\cdot\\overrightarrow{OP}\\)는 왜 \\(|OP|^2-22\\)인가요?","hint":"\\(\\overrightarrow{AP}=\\overrightarrow{OP}-\\overrightarrow{OA}\\)를 사용해요.","explanation":"\\(\\overrightarrow{AP}=\\overrightarrow{OP}-\\overrightarrow{OA}\\)이므로\n\\[\n\\overrightarrow{AP}\\cdot\\overrightarrow{OP}\n=|\\overrightarrow{OP}|^2-\\overrightarrow{OA}\\cdot\\overrightarrow{OP}\n=|OP|^2-4x=|OP|^2-22\n\\]\n예요. 또 평면식에 \\(x=11/2\\)를 넣으면 \\(y+\\sqrt2z=-11/2\\)예요.","check":{"prompt":"목표 내적은 \\(|OP|\\)가 커질수록 어떻게 되나요?","answer":"\\(|OP|^2-22\\)이므로 자연수 범위에서 길이가 커질수록 증가해요."}},{"id":"c3","label":"평면과 직선의 교차에서 가능한 최소 거리를 구해요","stepIds":["s5","s6"],"question":"조건을 만족하는 점 \\(P\\)는 원점에서 적어도 얼마나 떨어져 있을까요?","hint":"\\((y+\\sqrt2z)^2\\le3(y^2+z^2)\\)를 사용해요.","explanation":"코시-슈바르츠 부등식으로 \\(y^2+z^2\\ge(y+\\sqrt2z)^2/3=121/12\\)예요. 따라서\n\\[\n|OP|^2=x^2+y^2+z^2\\ge\\frac{121}{4}+\\frac{121}{12}=\\frac{121}{3}.\n\\]\n즉 \\(OP\\ge11/\\sqrt3\\)이고 이는 \\(6\\)보다 크고 \\(7\\)보다 작아요. 길이는 \\(9\\) 이하의 자연수이므로 가능한 후보는 \\(7,8,9\\)예요. 제약식 \\(y+\\sqrt2z=-11/2\\) 위에서는 최소점에서 멀어질수록 \\(y^2+z^2\\)가 연속적으로 커지므로 세 길이가 모두 실제로 가능해요.","check":{"prompt":"왜 길이 \\(6\\)은 불가능한가요?","answer":"최소 거리의 제곱이 \\(121/3>36\\)이므로 모든 점에서 \\(OP>6\\)이기 때문이에요."}},{"id":"c4","label":"자연수 길이의 양 끝을 대입해요","stepIds":["s7","s8"],"question":"목표 내적의 최댓값과 최솟값의 합은 얼마인가요?","hint":"증가식 \\(|OP|^2-22\\)에 \\(9\\)와 \\(7\\)을 넣어요.","explanation":"가장 큰 길이 \\(9\\)에서 \\(M=9^2-22=59\\), 가장 작은 길이 \\(7\\)에서 \\(m=7^2-22=27\\)이에요. 따라서 \\(M+m=59+27=86\\)이에요.","check":{"prompt":"길이 \\(8\\)에서의 내적은 두 끝값 사이에 있나요?","answer":"\\(8^2-22=42\\)이고 \\(27<42<59\\)라 맞아요."}}],"takeaway":["벡터의 차를 이용하면 내적을 한 벡터의 길이 제곱으로 바꿀 수 있어요.","선형식이 고정된 두 좌표의 제곱합 최솟값은 코시-슈바르츠 부등식으로 구할 수 있어요.","길이가 자연수라는 이산 조건은 연속적인 최소 거리와 상한 사이의 정수만 남겨요."]};</script>
