<script>window.HandStudyGuide={"itemId":17502,"sourceHash":"ccc1b0e99d6af9fb27eeef136ade00398fd11df65c09fbb131ef766b487d2f29","contentHash":"db8cedc8802054d7e0cfa8bc5876871eab24ec8c0c9eb75c6cfc5db7ca36142b","overview":{"goal":"작은 \\(\\theta\\)에서 두 삼각형 넓이의 최고차항을 각각 구해 극한을 계산해요.","firstLook":"\\(f\\)는 \\(AH\\)와 \\(HQ\\)가 모두 \\(\\theta^2\\) 크기라 \\(\\theta^4\\) 크기이고, \\(g\\)는 \\(RP\\)만 \\(\\theta\\) 크기로 작아져 \\(\\theta\\) 크기예요.","conditions":[{"label":"도형의 극한 위치","meaning":"\\(\\theta \\to 0+\\)이면 \\(P\\)와 \\(R\\)은 \\(A\\)로, 각의 이등분선과 \\(OB\\)의 교점 \\(S\\)는 \\(B\\)로 가까워져요."}]},"chapters":[{"id":"c1","label":"첫 번째 삼각형의 넓이","stepIds":["s1","s2","s3"],"question":"\\(f(\\theta )\\)에 \\((1-\\cos 2\\theta )^2\\)이 생기는 이유는 무엇인가요?","hint":"\\(A=(1,0),\\,P=(\\cos 2\\theta ,\\sin 2\\theta )\\)로 두고 \\(AH\\)와 \\(HQ\\)를 차례로 구하세요.","explanation":"단위원에서 \\(A=(1,0)\\), \\(P=(\\cos 2\\theta,\\sin 2\\theta)\\)로 두면 \\(AH=1-\\cos 2\\theta\\)예요. 도형의 각 관계로 \\(HQ=AH\\tan(\\pi/4-\\theta/2)\\). 따라서 \\(f(\\theta)=\\frac12AH\\cdot HQ=\\frac12(1-\\cos 2\\theta)^2\\tan(\\pi/4-\\theta/2)\\)예요. \\((1-\\cos 2\\theta)/\\theta^2\\to 2\\), 탄젠트 항은 1로 가므로 \\(f(\\theta)/\\theta^4\\to\\frac12\\cdot 2^2=2\\)예요.","check":{"prompt":"\\(1-\\cos 2\\theta\\)를 \\(\\theta ^2\\)로 나눈 극한이 2인 이유는 무엇인가요?","answer":"\\(1-\\cos 2\\theta =2\\sin ^2\\theta\\)이고 \\(\\sin \\theta /\\theta \\to 1\\)이므로 \\(2(\\sin \\theta /\\theta )^2\\to 2\\)예요."}},{"id":"c2","label":"두 번째 삼각형의 넓이","stepIds":["s4","s5","s6"],"question":"\\(RP/\\theta\\)의 극한은 어떻게 2가 되나요?","hint":"삼각형 \\(OAP\\)에서 \\(AP=2\\sin \\theta\\)이고 각의 이등분선 정리를 적용하세요.","explanation":"현의 길이 \\(AP=2\\sin\\theta\\)예요. 삼각형 \\(OAP\\)에서 \\(AR\\)은 \\(A\\)각의 이등분선이므로 \\(OR:RP=OA:AP=1:2\\sin\\theta\\). 또 \\(OP=1\\)이어서 \\(RP=2\\sin\\theta/(1+2\\sin\\theta)\\), 따라서 \\(RP/\\theta\\to 2\\)예요. \\(\\theta\\)가 0으로 갈 때 \\(R\\to A\\), \\(S\\to B\\)이므로 \\(RS\\to AB=\\sqrt{2}\\), 그리고 \\(\\sin\\angle PRS\\to\\sqrt{2}/2\\). 따라서 \\(g(\\theta)/\\theta=\\frac12(RP/\\theta)RS\\sin\\angle PRS\\to 1\\)예요.","check":{"prompt":"\\(g\\)가 \\(\\theta\\)의 일차 크기인 이유를 한 인수로 말하면 무엇인가요?","answer":"\\(RP\\)만 0으로 가며 \\(RP/\\theta\\to2\\)이고, \\(RS\\)와 끼인각의 사인은 0이 아닌 값으로 가기 때문이에요."}},{"id":"c3","label":"두 최고차항의 비 계산하기","stepIds":["s7"],"question":"\\(\\theta^3g/f\\)를 \\(g(\\theta)/\\theta\\)와 \\(f(\\theta)/\\theta^4\\)의 비로 어떻게 바꾸나요?","hint":"\\(g\\)는 \\(\\theta\\)로, \\(f\\)는 \\(\\theta^4\\)로 나눈 꼴을 만드세요.","explanation":"\\(\\frac{\\theta^3g(\\theta)}{f(\\theta)}=\\frac{g(\\theta)/\\theta}{f(\\theta)/\\theta^4}\\)예요. 앞의 두 장에서 분자는 1, 분모는 2로 가므로 극한 \\(k\\)는 \\(1/2\\)예요. 따라서 \\(100k=50\\)예요.","check":{"prompt":"\\(g\\)가 \\(\\theta\\) 크기이고 \\(f\\)가 \\(\\theta^4\\) 크기일 때 왜 \\(\\theta^3g/f\\)가 유한한가요?","answer":"\\(\\theta^3g\\)와 \\(f\\)가 모두 \\(\\theta^4\\) 크기이므로 그 비가 유한한 값으로 가기 때문이에요."}}],"takeaway":["도형 극한은 0으로 가는 길이와 0이 아닌 값으로 가는 길이를 구분해 곱의 차수를 찾아요.","복잡한 넓이 식 전체를 전개하기보다 \\(g(\\theta)\\)를 \\(\\theta\\)로, \\(f(\\theta)\\)를 \\(\\theta^4\\)으로 나눈 두 극한을 각각 계산하면 간단해요."]};</script>
