<script>window.HandStudyGuide={"itemId":16930,"sourceHash":"06a7f9de970a6132158fe0108314a69af0baf31494cb0067315c9c8ff46e6a11","contentHash":"8d9e21e0de22b1c6269131cc611e6a70ae762d9c3b8919d7a24e550fb783340d","overview":{"goal":"\\(f(1),f(2)\\)의 네 순서쌍을 같은 값과 다른 값으로 나누어 치역이 정확히 세 개인 함수를 세어요.","firstLook":"전체 함수는 \\(4^4\\)개이고 곱 조건을 만족하는 앞의 두 값은 \\((3,3),(3,4),(4,3),(4,4)\\)뿐이에요.","conditions":[{"label":"같은 값","meaning":"앞 두 값이 같으면 나머지 두 입력이 서로 다른 새 값 둘을 만들어야 해요."},{"label":"다른 값","meaning":"앞 두 값이 3,4이면 나머지에서 1 또는 2 중 하나만 새로 나타나야 해요."}]},"chapters":[{"id":"c1","label":"앞 두 값이 같은 경우를 세어요","stepIds":["s1","s2","s3","s4"],"question":"왜 \\(f(3),f(4)\\)는 서로 다른 두 값이어야 할까요?","hint":"이미 치역에 3 또는 4 하나만 있으므로 치역 원소를 두 개 더 늘려야 해요.","explanation":"전체 함수 수는 각 입력마다 네 값을 고르는 \\(4^4=256\\)이에요. 곱 조건에서 앞 두 값이 같은 경우는 \\((3,3),(4,4)\\)의 2가지예요. 이미 나온 값 하나를 제외한 세 값 중 서로 다른 두 값을 순서 있게 \\(f(3),f(4)\\)에 놓아야 치역이 정확히 세 개이므로 \\({}_3\\mathrm P_2=6\\)가지예요. 따라서 이 경우는 \\(2\\cdot6=12\\)가지예요.","check":{"prompt":"\\(f(3)=f(4)\\)이면 왜 안 되나요?","answer":"새 치역 값이 하나만 늘어 전체 치역의 원소가 2개가 되기 때문이에요."}},{"id":"c2","label":"앞 두 값이 다른 경우를 세어요","stepIds":["s5","s6"],"question":"3과 4 외에 새 치역 값은 몇 개가 나와야 할까요?","hint":"치역의 원소가 정확히 세 개라는 조건을 써요.","explanation":"앞 두 값이 \\((3,4)\\) 또는 \\((4,3)\\)인 2가지에서 이미 치역에 3,4가 있어요. 새 값은 1 또는 2 중 하나를 고르는 2가지예요. 정한 세 값으로 \\(f(3),f(4)\\)를 고르는 \\(3^2\\)가지 중 새 값이 한 번도 나오지 않는 \\(2^2\\)가지를 빼면 5가지예요. 따라서 \\(2\\cdot2\\cdot5=20\\)가지이고, 확률은 \\((12+20)/256=1/8\\)이에요. 그러므로 \\(120p=15\\)예요.","check":{"prompt":"왜 새 값 1과 2가 둘 다 나오면 안 되나요?","answer":"그러면 치역이 1,2,3,4의 네 원소가 되어 조건 (나)를 어겨요."}}],"takeaway":["치역의 원소 수 조건은 이미 나온 값과 새로 반드시 나와야 하는 값을 나누어 세어요.","적어도 한 번 나오는 조건은 전체 배치에서 한 번도 안 나오는 배치를 빼면 간단해요."]};</script>
