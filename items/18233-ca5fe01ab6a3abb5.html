\\right)+f \\left(x \\right)-f \\left(x \\right) \\ln\\, f \\left(x \\right) \\right)\\,dx=\\dfrac{3}{2}\\)\u003c/span>\u003c/p>\u003c/div>\u003cp class=\"hp htall\">① \u003cspan class=\"heq\">\\(\\dfrac{3}{8}\\,\\)\u003c/span>&emsp;② \u003cspan class=\"heq\">\\(\\dfrac{7}{16}\\,\\)\u003c/span>&emsp;③ \u003cspan class=\"heq\">\\(\\dfrac{1}{2}\\,\\)\u003c/span>&emsp;④ \u003cspan class=\"heq\">\\(\\dfrac{9}{16}\\,\\)\u003c/span>&emsp;⑤ \u003cspan class=\"heq\">\\(\\dfrac{5}{8}\\)\u003c/span>\u003c/p>","questionText":"최고차항의 계수가 $1\\,$인 이차함수 $f \\left(x \\right)\\,$가 모든 실수 $x\\,$에 대하여 $f \\left(x \\right) > 0\\,$이다. 상수 $k\\,$에 대하여 함수 $g \\left(x \\right)\\,$를\n $g \\left(x \\right)= \\int_{k}^{x}f' \\left(t \\right) \\ln\\, f \\left(t \\right)\\,dt\\,$\n라 하자. 함수 $g \\left(x \\right)\\,$가 $x=a\\,$에서 극대 또는 극소인 모든 $a\\,$를 작은 수부터 크기순으로 나열하면 $a_{1}\\,$, $a_{2}\\,$, $a_{3}\\,$이다. 두 함수 $f \\left(x \\right)\\,$와 $g \\left(x \\right)\\,$가 다음 조건을 만족시킬 때, $f \\left(a_{2} \\right)\\,$의 값은? [4점]\n(가) 모든 실수 $x\\,$에 대하여 $g \\left(x \\right) \\geq 0\\,$이다.(나) $\\int_{a_{1}}^{a_{3}} \\left(g \\left(x \\right)+f \\left(x \\right)-f \\left(x \\right) \\ln\\, f \\left(x \\right) \\right)\\,dx=\\frac{3}{2}$\n① $\\frac{3}{8}\\,$ ② $\\frac{7}{16}\\,$ ③ $\\frac{1}{2}\\,$ ④ $\\frac{9}{16}\\,$ ⑤ $\\frac{5}{8}$","scoreStatus":"confirmed_4_direct","sourceHash":"7aab0c45cb7ccb14f3ce639183662fb50b26cbb8de84b1ce446d85ac93551871","sourceLabel":"2025 교육청 고3 수학미적분 10월 28번","stepExplanations":{"s1":{"body":"\\(g'(x)=f'(x)\\ln f(x)\\)이므로 후보는 \\(f'(x)=0\\)인 꼭짓점과 \\(f(x)=1\\)인 두 점입니다. \\(f(x)=(x-p)^2+q\\)에서 두 점이 실제로 생기려면 \\(0\u003cq\u003c1\\)이어야 하고, 그래서 세 위치가 \\(p-\\sqrt{1-q},p,p+\\sqrt{1-q}\\)가 됩니다.","skillTags":["critical-point-factorization","quadratic-level-crossing"],"title":"극값이 세 번 생기는 까닭"},"s3":{"body":"\\(u=f(t)\\)로 놓으면 \\(du=f'(t)dt\\)이고 \\(\\int \\ln u\\,du=u\\ln u-u\\)입니다. 양 끝을 \\(t=k,x\\)로 되돌리면 \\(g(x)=f(x)\\ln f(x)-f(x)-\\{f(k)\\ln f(k)-f(k)\\}\\)가 됩니다.","skillTags":["substitution","log-antiderivative"],"title":"적분 안에서 f를 한 덩어리로 보기"},"s4":{"body":"\\(H(y)=y\\ln y-y\\)라 두면 \\(H'(y)=\\ln y\\)이므로 \\(0\u003cy\u003c1\\)에서 감소하고 \\(y>1\\)에서 증가합니다. 따라서 \\(y=1\\)에서 가장 작아 값이 \\(-1\\)입니다. \\(g(k)=0\\)이고 모든 \\(g(x)\\)가 0 이상이어야 하므로 빼는 상수도 이 가장 작은 값이어야 합니다. \\(k=p\\)라면 \\(q\u003c1\\) 때문에 \\(f=1\\)인 곳에서 음수가 생기므로 탈락하고, 결국 \\(f(k)=1\\)입니다.","skillTags":["global-lower-bound","constant-selection"],"title":"왜 f(k)=1이어야 하나"}},"steps":[{"id":"s1","latex":"f(x)=(x-p)^2+q,\\quad0\u003cq\u003c1"},{"id":"s2","latex":"a_1=p-\\sqrt{1-q},\\quad a_2=p,\\quad a_3=p+\\sqrt{1-q}"},{"id":"s3","latex":"g(x)=f(x)\\ln f(x)-f(x)-\\{f(k)\\ln f(k)-f(k)\\}"},{"id":"s4","latex":"g(x)\\ge0\\Rightarrow f(k)=1\\Rightarrow g(x)=f(x)\\ln f(x)-f(x)+1"},{"id":"s5","latex":"g+f-f\\ln f=1"},{"id":"s6","latex":"a_3-a_1=2\\sqrt{1-q}=\\frac32\\Rightarrow q=\\frac7{16}"},{"id":"s7","latex":"f(a_2)=\\frac7{16}"}],"track":"미적분"};</script>
<script>window.HandStudyGuide={"itemId":18233,"sourceHash":"7aab0c45cb7ccb14f3ce639183662fb50b26cbb8de84b1ce446d85ac93551871","contentHash":"8e1ced053c3ad85bbdcad8fb8d63c36a400ec179dd1dd12bf166886979b7f153","overview":{"goal":"극값이 생기는 세 위치와 함수가 항상 0 이상인 조건으로 이차함수의 꼭짓점값을 구해요.","firstLook":"양의 이차함수를 꼭짓점형으로 쓰면 \\(g'=f'\\ln f\\)가 0이 되는 세 위치를 한눈에 정리할 수 있어요.","conditions":[{"label":"극값을 갖는 점이 세 곳","meaning":"꼭짓점 한 곳과 \\(f=1\\)인 두 곳이 서로 달라야 해요."},{"label":"함숫값이 항상 0 이상","meaning":"적분의 아래끝이 보조함수의 가장 작은 값을 만들도록 정해져요."}]},"chapters":[{"id":"c1","label":"세 극값 위치","stepIds":["s1","s2","s3"],"question":"\\(g'(x)=0\\)이 되는 세 점은 꼭짓점을 기준으로 어떻게 놓이나요?","hint":"\\(f(x)=(x-p)^2+q\\)로 두고 \\(f'=0\\)과 \\(\\ln f=0\\)을 따로 보세요.","explanation":"\\(f(x)=(x-p)^2+q\\)이고 \\(f>0\\)이므로 \\(q>0\\)이에요. \\(g'(x)=f'(x)\\ln f(x)\\)에서 한 후보는 \\(f'(p)=0\\)인 \\(p\\), 나머지는 \\(f(x)=1\\)인 두 점이에요. 세 점이 서로 다르려면 \\(0<q<1\\)이고, 순서대로 \\(a_1=p-\\sqrt{1-q}\\), \\(a_2=p\\), \\(a_3=p+\\sqrt{1-q}\\)예요.\n\n\\(u=f(t)\\)로 바꾸면 \\(du=f'(t)dt\\)이고 \\((u\\ln u-u)'=\\ln u\\)예요. 따라서 정적분을 계산하면 \\(g(x)=f(x)\\ln f(x)-f(x)-\\{f(k)\\ln f(k)-f(k)\\}\\)가 돼요.","check":{"prompt":"\\(q=1\\)이면 왜 극값 위치가 세 곳이 되지 않나요?","answer":"\\(f=1\\)의 두 해가 모두 꼭짓점 \\(x=p\\)와 겹쳐 한 위치만 남아요."}},{"id":"c2","label":"아래끝의 함수값 결정","stepIds":["s4","s5"],"question":"모든 \\(x\\)에서 \\(g(x)\\ge0\\)이 되려면 \\(f(k)\\)는 얼마여야 하나요?","hint":"\\(J(u)=u\\ln u-u\\)의 증감과 가장 작은 값을 조사하세요.","explanation":"\\(J'(u)=\\ln u\\)이므로 양수 범위에서 \\(J\\)는 \\(0<u<1\\)일 때 감소하고 \\(u>1\\)일 때 증가해요. 따라서 \\(J(1)=-1\\)이 가장 작은 값이에요. \\(g(x)=J(f(x))-J(f(k))\\)가 모든 \\(x\\)에서 0 이상이려면 빼는 값도 이 가장 작은 값이어야 하므로 \\(f(k)=1\\)이에요.\n\n그러면 \\(g(x)=f(x)\\ln f(x)-f(x)+1\\)이고, 조건 (나)의 괄호는 \\(g+f-f\\ln f=1\\)로 정확히 정리돼요.","check":{"prompt":"\\(f(k)=1\\)일 때 \\(g(x)\\ge0\\)이 실제로 성립하는 이유는 무엇인가요?","answer":"\\(g(x)=J(f(x))-J(1)\\)이고 \\(J(1)\\)이 양수 범위에서 가장 작은 값이기 때문이에요."}},{"id":"c3","label":"구간 길이로 꼭짓점값 구하기","stepIds":["s6","s7"],"question":"적분할 함수가 1이면 주어진 값 \\(3/2\\)는 무엇을 뜻하나요?","hint":"상수 1을 \\(a_1\\)부터 \\(a_3\\)까지 적분하면 구간의 길이가 돼요.","explanation":"조건 (나)의 왼쪽은 \\(\\int_{a_1}^{a_3}1\\,dx=a_3-a_1\\)이에요. 따라서 \\(2\\sqrt{1-q}=3/2\\)이고 \\(\\sqrt{1-q}=3/4\\)예요. 제곱하면 \\(1-q=9/16\\), 즉 \\(q=7/16\\)이에요. 가운데 점은 꼭짓점 \\(a_2=p\\)이므로 \\(f(a_2)=q=7/16\\), 정답은 ②예요.","check":{"prompt":"\\(a_3-a_1\\)에서 \\(p\\)가 사라지는 계산은 무엇인가요?","answer":"\\((p+\\sqrt{1-q})-(p-\\sqrt{1-q})=2\\sqrt{1-q}\\)예요."}}],"takeaway":["곱으로 된 도함수는 각 인수가 0이 되는 위치를 나누어 찾아요.","항상 0 이상인 차는 빼는 기준값이 가장 작은 값이어야 해요.","적분할 함수가 상수로 정리되면 정적분은 구간 길이가 돼요."]};</script>
