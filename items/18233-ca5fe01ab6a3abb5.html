  <script>window.HandStudyRecord={"adminYear":2025,"answer":"②","contentHash":"8e1ced053c3ad85bbdcad8fb8d63c36a400ec179dd1dd12bf166886979b7f153","diagram":null,"editionHash":"ca5fe01ab6a3abb58cfd3840c768a9ba19d8ca90c03c18ba36e21460f6d7c111","grade":3,"graphHash":"","graphPlan":null,"itemId":18233,"learningHash":"78ad97b44c1873d9bb564d7c87c8ed155c9fea532f84d3df3077aa1269fcf1d7","month":10,"number":28,"points":4,"preview":false,"questionHtml":"\u003cp class=\"hp\">최고차항의 계수가 \u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>인 이차함수 \u003cspan class=\"heq\">\\(f \\left(x \\right)\\,\\)\u003c/span>가 모든 실수 \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(f \\left(x \\right) \\gt  0\\,\\)\u003c/span>이다. 상수 \u003cspan class=\"heq\">\\(k\\,\\)\u003c/span>에 대하여 함수 \u003cspan class=\"heq\">\\(g \\left(x \\right)\\,\\)\u003c/span>를\u003c/p>\u003cp class=\"hp\">&emsp;\u003cspan class=\"heq\">\\(g \\left(x \\right)= \\int_{k}^{x}f' \\left(t \\right) \\ln\\, f \\left(t \\right)\\,dt\\,\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">라 하자. 함수 \u003cspan class=\"heq\">\\(g \\left(x \\right)\\,\\)\u003c/span>가 \u003cspan class=\"heq\">\\(x=a\\,\\)\u003c/span>에서 극대 또는 극소인 모든 \u003cspan class=\"heq\">\\(a\\,\\)\u003c/span>를 작은 수부터 크기순으로 나열하면 \u003cspan class=\"heq\">\\(a_{1}\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(a_{2}\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(a_{3}\\,\\)\u003c/span>이다. 두 함수 \u003cspan class=\"heq\">\\(f \\left(x \\right)\\,\\)\u003c/span>와 \u003cspan class=\"heq\">\\(g \\left(x \\right)\\,\\)\u003c/span>가 다음 조건을 만족시킬 때, \u003cspan class=\"heq\">\\(f \\left(a_{2} \\right)\\,\\)\u003c/span>의 값은? \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) 모든 실수 \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(g \\left(x \\right) \\geq 0\\,\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp htall\">(나) \u003cspan class=\"heq\">\\(\\int_{a_{1}}^{a_{3}} \\left(g \\left(x \\right)+f \\left(x \\right)-f \\left(x \\right) \\ln\\, f \\left(x \\right) \\right)\\,dx=\\dfrac{3}{2}\\)\u003c/span>\u003c/p>\u003c/div>\u003cp class=\"hp htall\">① \u003cspan class=\"heq\">\\(\\dfrac{3}{8}\\,\\)\u003c/span>&emsp;② \u003cspan class=\"heq\">\\(\\dfrac{7}{16}\\,\\)\u003c/span>&emsp;③ \u003cspan class=\"heq\">\\(\\dfrac{1}{2}\\,\\)\u003c/span>&emsp;④ \u003cspan class=\"heq\">\\(\\dfrac{9}{16}\\,\\)\u003c/span>&emsp;⑤ \u003cspan class=\"heq\">\\(\\dfrac{5}{8}\\)\u003c/span>\u003c/p>","questionText":"최고차항의 계수가 $1\\,$인 이차함수 $f \\left(x \\right)\\,$가 모든 실수 $x\\,$에 대하여 $f \\left(x \\right) > 0\\,$이다. 상수 $k\\,$에 대하여 함수 $g \\left(x \\right)\\,$를\n $g \\left(x \\right)= \\int_{k}^{x}f' \\left(t \\right) \\ln\\, f \\left(t \\right)\\,dt\\,$\n라 하자. 함수 $g \\left(x \\right)\\,$가 $x=a\\,$에서 극대 또는 극소인 모든 $a\\,$를 작은 수부터 크기순으로 나열하면 $a_{1}\\,$, $a_{2}\\,$, $a_{3}\\,$이다. 두 함수 $f \\left(x \\right)\\,$와 $g \\left(x \\right)\\,$가 다음 조건을 만족시킬 때, $f \\left(a_{2} \\right)\\,$의 값은? [4점]\n(가) 모든 실수 $x\\,$에 대하여 $g \\left(x \\right) \\geq 0\\,$이다.(나) $\\int_{a_{1}}^{a_{3}} \\left(g \\left(x \\right)+f \\left(x \\right)-f \\left(x \\right) \\ln\\, f \\left(x \\right) \\right)\\,dx=\\frac{3}{2}$\n① $\\frac{3}{8}\\,$ ② $\\frac{7}{16}\\,$ ③ $\\frac{1}{2}\\,$ ④ $\\frac{9}{16}\\,$ ⑤ $\\frac{5}{8}$","scoreStatus":"confirmed_4_direct","sourceHash":"7aab0c45cb7ccb14f3ce639183662fb50b26cbb8de84b1ce446d85ac93551871","sourceLabel":"2025 교육청 고3 수학미적분 10월 28번","stepExplanations":{"s1":{"body":"\\(g'(x)=f'(x)\\ln f(x)\\)이므로 후보는 \\(f'(x)=0\\)인 꼭짓점과 \\(f(x)=1\\)인 두 점입니다. \\(f(x)=(x-p)^2+q\\)에서 두 점이 실제로 생기려면 \\(0\u003cq\u003c1\\)이어야 하고, 그래서 세 위치가 \\(p-\\sqrt{1-q},p,p+\\sqrt{1-q}\\)가 됩니다.","skillTags":["critical-point-factorization","quadratic-level-crossing"],"title":"극값이 세 번 생기는 까닭"},"s3":{"body":"\\(u=f(t)\\)로 놓으면 \\(du=f'(t)dt\\)이고 \\(\\int \\ln u\\,du=u\\ln u-u\\)입니다. 양 끝을 \\(t=k,x\\)로 되돌리면 \\(g(x)=f(x)\\ln f(x)-f(x)-\\{f(k)\\ln f(k)-f(k)\\}\\)가 됩니다.","skillTags":["substitution","log-antiderivative"],"title":"적분 안에서 f를 한 덩어리로 보기"},"s4":{"body":"\\(H(y)=y\\ln y-y\\)라 두면 \\(H'(y)=\\ln y\\)이므로 \\(0\u003cy\u003c1\\)에서 감소하고 \\(y>1\\)에서 증가합니다. 따라서 \\(y=1\\)에서 가장 작아 값이 \\(-1\\)입니다. \\(g(k)=0\\)이고 모든 \\(g(x)\\)가 0 이상이어야 하므로 빼는 상수도 이 가장 작은 값이어야 합니다. \\(k=p\\)라면 \\(q\u003c1\\) 때문에 \\(f=1\\)인 곳에서 음수가 생기므로 탈락하고, 결국 \\(f(k)=1\\)입니다.","skillTags":["global-lower-bound","constant-selection"],"title":"왜 f(k)=1이어야 하나"}},"steps":[{"id":"s1","latex":"f(x)=(x-p)^2+q,\\quad0\u003cq\u003c1"},{"id":"s2","latex":"a_1=p-\\sqrt{1-q},\\quad a_2=p,\\quad a_3=p+\\sqrt{1-q}"},{"id":"s3","latex":"g(x)=f(x)\\ln f(x)-f(x)-\\{f(k)\\ln f(k)-f(k)\\}"},{"id":"s4","latex":"g(x)\\ge0\\Rightarrow f(k)=1\\Rightarrow g(x)=f(x)\\ln f(x)-f(x)+1"},{"id":"s5","latex":"g+f-f\\ln f=1"},{"id":"s6","latex":"a_3-a_1=2\\sqrt{1-q}=\\frac32\\Rightarrow q=\\frac7{16}"},{"id":"s7","latex":"f(a_2)=\\frac7{16}"}],"track":"미적분"};</script>
