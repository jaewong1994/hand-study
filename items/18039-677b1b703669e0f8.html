<script>window.HandStudyRecord={"itemId":18039,"sourceLabel":"2024 평가원 고3 수학기하 6월 29번","adminYear":2024,"grade":3,"month":6,"number":29,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"좌표평면에 곡선 $\\left| y ^{2} -1 \\right| = \\frac{x ^{2}}{a ^{2}}$과 네 점 $A (0,\\, c+1)$, $B (0,\\,-c-1)$, $C (c,\\, 0)$, $D (-c,\\, 0)$이 있다. 곡선 위의 점 중 $y$좌표의 절댓값이 $1$보다 작거나 같은 모든 점 $P$에 대하여 $\\overline{PC}+\\overline{PD}= \\sqrt{5}$이다. 곡선 위의 점 $Q$가 제$1$사분면에 있고 $\\overline{AQ}=10$일 때, 삼각형 $ABQ$의 둘레의 길이를 구하시오. (단, $a$와 $c$는 양수이다.) [4점]","answer":"25","sourceHash":"ebf0b4b01e612616cb6ce297bd21e8fc2bb5914ab042880a8d0411d8a9263369","steps":[{"id":"s1","latex":"|y|\\le1:\\quad \\dfrac{x^2}{a^2}+y^2=1,\\qquad |y|\\ge1:\\quad y^2-\\dfrac{x^2}{a^2}=1"},{"id":"s2","latex":"PC+PD=2a=\\sqrt5\\Rightarrow a=\\dfrac{\\sqrt5}{2}"},{"id":"s3","latex":"c^2=a^2-1=\\dfrac14\\Rightarrow c=\\dfrac12"},{"id":"s4","latex":"A=\\left(0,\\dfrac32\\right),\\quad B=\\left(0,-\\dfrac32\\right)"},{"id":"s5","latex":"Q\\text{가 위쪽 쌍곡선 위}\\Rightarrow QB-QA=2"},{"id":"s6","latex":"QA=10\\Rightarrow QB=12,\\qquad AB=3"},{"id":"s7","latex":"AB+AQ+BQ=3+10+12=25"}],"diagram":null,"contentHash":"e53cb336112df13273ea004a01f3729a0754f93b321dbd85b8b3ceeaa432674b","questionHtml":"\u003cp class=\"hp htall\">좌표평면에 곡선 \u003cspan class=\"heq\">\\(\\left| y^{2} -1 \\right| = \\dfrac{x^{2}}{a^{2}}\\)\u003c/span>과 \u003cbr>네 점 \u003cspan class=\"heq\">\\({{A}} (0,\\, c+1)\\)\u003c/span>, \u003cspan class=\"heq\">\\({{B}} (0,\\,-c-1)\\)\u003c/span>, \u003cspan class=\"heq\">\\({{C}} (c,\\, 0)\\)\u003c/span>, \u003cspan class=\"heq\">\\({{D}} (-c,\\, 0)\\)\u003c/span>이 있다. 곡선 위의 점 중 \u003cspan class=\"heq\">\\(y\\)\u003c/span>좌표의 절댓값이 \u003cspan class=\"heq\">\\(1\\)\u003c/span>보다 작거나 같은 모든 점 \u003cspan class=\"heq\">\\({{P}}\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(\\overline{{{PC}} }+ \\overline{{{PD}} }= \\sqrt{5}\\)\u003c/span>이다. 곡선 위의 점 \u003cspan class=\"heq\">\\({{Q}}\\)\u003c/span>가 제\u003cspan class=\"heq\">\\(1\\)\u003c/span>사분면에 있고 \u003cspan class=\"heq\">\\(\\overline{{{AQ}} }=10\\)\u003c/span>일 때, 삼각형 \u003cspan class=\"heq\">\\({{ABQ}}\\)\u003c/span>의 둘레의 길이를 구하시오. \u003cbr>(단, \u003cspan class=\"heq\">\\(a\\)\u003c/span>와 \u003cspan class=\"heq\">\\(c\\)\u003c/span>는 양수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"677b1b703669e0f8e3735cd1b91e20b00953ce348c1980c31a02111831d67254"};</script>
<script>window.HandStudyGuide={"itemId":18039,"sourceHash":"ebf0b4b01e612616cb6ce297bd21e8fc2bb5914ab042880a8d0411d8a9263369","contentHash":"e53cb336112df13273ea004a01f3729a0754f93b321dbd85b8b3ceeaa432674b","overview":{"goal":"절댓값 곡선을 안쪽 타원과 위아래 쌍곡선으로 나누어 \\(a,c\\)와 초점을 찾고, 쌍곡선의 거리차로 둘레를 구해요.","firstLook":"\\(|y|\\le1\\)에서는 타원, \\(|y|\\ge1\\)에서는 위아래로 열린 쌍곡선이에요. 같은 \\(a,c\\)가 두 곡선의 초점 정보를 이어 줘요.","conditions":[{"label":"안쪽 부분","meaning":"\\(x^2/a^2+y^2=1\\)인 타원이고 초점은 \\((\\pm c,0)\\)예요."},{"label":"바깥 부분","meaning":"\\(y^2-x^2/a^2=1\\)인 쌍곡선이고 위쪽 가지의 두 초점은 \\(A,B\\)예요."}]},"chapters":[{"id":"c1","label":"안쪽 타원에서 a와 c를 구해요","stepIds":["s1","s2","s3"],"question":"\\(|y|\\le1\\)인 곡선의 거리 합 조건은 \\(a,c\\)를 어떻게 정할까요?","hint":"절댓값을 풀어 타원 식으로 바꾸고, 타원의 거리 합과 초점 관계를 써요.","explanation":"\\(|y|\\le1\\)에서는 \\(|y^2-1|=1-y^2\\)이므로 \\(x^2/a^2+y^2=1\\)이에요. 이 타원의 긴반지름은 \\(a\\)이고 초점이 \\(C=(c,0),D=(-c,0)\\)이므로 모든 점 \\(P\\)에서 \\(PC+PD=2a\\)예요. 따라서 \\(2a=\\sqrt5\\), \\(a=\\sqrt5/2\\)예요.\n\n타원의 짧은반지름은 1이므로 \\(c^2=a^2-1=5/4-1=1/4\\)예요. \\(c>0\\)이어서 \\(c=1/2\\)예요.","check":{"prompt":"\\(c=-1/2\\)을 택하지 않는 이유는 무엇인가요?","answer":"문제에서 \\(c\\)가 양수라고 했고 C를 양의 x축 쪽 초점으로 두었기 때문이에요."}},{"id":"c2","label":"바깥 쌍곡선의 초점을 확인해요","stepIds":["s4","s5"],"question":"점 \\(A,B\\)가 위아래 쌍곡선의 초점인 이유는 무엇인가요?","hint":"\\(|y|\\ge1\\)에서 식을 \\(y^2-x^2/a^2=1\\)로 보고 초점 거리를 계산해요.","explanation":"\\(|y|\\ge1\\)에서는 \\(|y^2-1|=y^2-1\\)이므로 \\(y^2-x^2/a^2=1\\)이에요. 세로 긴반지름이 1, 가로 쪽 수가 \\(a\\)이므로 초점의 원점부터 거리는 \\(\\sqrt{1+a^2}=\\sqrt{1+5/4}=3/2\\)예요.\n\n\\(c+1=1/2+1=3/2\\)이므로 \\(A=(0,3/2),B=(0,-3/2)\\)가 바로 두 초점이에요. \\(Q\\)는 제1사분면의 위쪽 가지에 있어 위쪽 초점 A에 더 가깝고, 따라서 \\(QB-QA=2\\times1=2\\)예요.","check":{"prompt":"거리차의 부호를 \\(QA-QB\\)로 쓰지 않는 이유는 무엇인가요?","answer":"Q가 위쪽 가지에 있어 위쪽 초점 A가 더 가깝고 아래쪽 초점 B까지의 거리 QB가 더 길기 때문이에요."}},{"id":"c3","label":"세 변을 더해 둘레를 구해요","stepIds":["s6","s7"],"question":"\\(QA=10\\)에서 나머지 두 변은 얼마인가요?","hint":"쌍곡선의 거리차와 두 초점 사이 거리를 사용해요.","explanation":"\\(QB-QA=2\\)이고 \\(QA=10\\)이므로 \\(QB=12\\)예요. 또 \\(AB=3/2-(-3/2)=3\\)이에요. 따라서 삼각형 \\(ABQ\\)의 둘레는 \\(AB+AQ+BQ=3+10+12=25\\)예요. 세 길이는 \\(10+3>12\\) 등 삼각형의 길이 조건도 만족해 실제 삼각형이 만들어져요.","check":{"prompt":"Q가 아래쪽 가지였다면 거리차의 부호는 어떻게 달라질까요?","answer":"아래쪽 초점 B가 더 가까워져 \\(QA-QB=2\\)가 돼요. 여기서는 제1사분면이라 위쪽 가지예요."}}],"takeaway":["절댓값 곡선은 절댓값 안의 식의 부호가 바뀌는 경계에서 나누어 각각 어떤 이차곡선인지 확인해요.","타원의 초점 관계로 얻은 상수가 다른 가지의 쌍곡선 초점과 어떻게 연결되는지 계산해요.","쌍곡선의 거리차는 어느 가지에 점이 있는지 보고 더 먼 초점 거리에서 가까운 초점 거리를 빼요."]};</script>
