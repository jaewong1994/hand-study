<script>window.HandStudyRecord={"itemId":16222,"sourceLabel":"2019 교육청 고3 수리가형 10월 30번","adminYear":2019,"grade":3,"month":10,"number":30,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"실수 전체의 집합에서 미분가능한 두 함수 $f(x)$, $g(x)\\,$가 모든 실수 $x\\,$에 대하여 다음 조건을 만족시킨다.\n(가) $g \\left( x+1 \\right) -g(x)= - \\pi \\left( e+1 \\right) e ^{x} \\sin \\left( \\pi x \\right)$ (나) $g(x+1)= \\int _{0} ^{x} {\\left\\{ f \\left( t+1 \\right) e ^{t} -f\\,(t)e ^{t} +g(t) \\right\\}} dt\\,$\n$\\int _{0} ^{1} {f(x)} dx= \\frac{10}{9} e+4\\,$일 때, $\\int _{1} ^{10} {f(x)} dx\\,$의 값을 구하시오. [4점]","answer":"26","sourceHash":"aa78a03d3cd6d5fd47499b77a9e19e5647feaf4d8f4f52cf00ad99a6368991e9","steps":[{"id":"s1","latex":"x=0\\text{을 (나)에 대입}\\Rightarrow g(1)=0"},{"id":"s2","latex":"\\text{(나)를 미분}\\Rightarrow f(x+1)-f(x)=e^{-x}\\{g\\prime(x+1)-g(x)\\}"},{"id":"s3","latex":"\\int_t^{t+1}f-\\int_0^1f=e^{-t}g(t+1)+\\int_0^t e^{-x}\\{g(x+1)-g(x)\\}\\,dx"},{"id":"s4","latex":"g(x+1)-g(x)=-\\pi(e+1)e^x\\sin\\pi x"},{"id":"s5","latex":"\\int_t^{t+1}f=\\int_0^1f+e^{-t}g(t+1)+(e+1)(\\cos\\pi t-1)"},{"id":"s6","latex":"n\\in\\mathbb N:\\quad g(n+1)-g(n)=0,\\ g(1)=0\\Rightarrow g(n)=0"},{"id":"s7","latex":"\\int_n^{n+1}f=\\frac{10}{9}e+4+(e+1)\\{(-1)^n-1\\}"},{"id":"s8","latex":"\\int_1^{10}f=9\\left(\\frac{10}{9}e+4\\right)+(e+1)(-1-9)=\\boxed{26}"}],"diagram":null,"contentHash":"0d280c5455de056be442c5e35863bc8cf9f17eb0097fa30f5b158e2ef294063b","questionHtml":"\u003cp class=\"hp\">실수 전체의 집합에서 미분가능한 두 함수 \u003cspan class=\"heq\">\\(f(x)\\)\u003c/span>, \u003cspan class=\"heq\">\\(g(x)\\,\\)\u003c/span>가 모든 실수 \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>에 대하여 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가)\u003cspan class=\"heq\">\\(g \\left( x+1 \\right) -g(x)= - \\pi \\left( e+1 \\right) e^{x} \\sin \\left( \\pi x \\right)\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">(나)\u003cspan class=\"heq\">\\(g(x+1)= \\int_{0}^{x} {\\left\\{ f \\left( t+1 \\right) e^{t} -f\\,(t)e^{t} +g(t) \\right\\}} dt\\,\\)\u003c/span>\u003c/p>\u003c/div>\u003cp class=\"hp htall\">\u003cspan class=\"heq\">\\(\\int_{0}^{1} {f(x)} dx= \\dfrac{10}{9} e+4\\,\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(\\int_{1}^{10} {f(x)} dx\\,\\)\u003c/span>의 값을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"0ffe44a7c002d7c6f77acf4295aa154e61ec76b16a31d48fb082c0786f6b1a0d"};</script>
<script>window.HandStudyGuide={"itemId":16222,"sourceHash":"aa78a03d3cd6d5fd47499b77a9e19e5647feaf4d8f4f52cf00ad99a6368991e9","contentHash":"0d280c5455de056be442c5e35863bc8cf9f17eb0097fa30f5b158e2ef294063b","overview":{"goal":"길이가 1인 구간의 적분값을 정수마다 구한 뒤 아홉 구간을 더해요.","firstLook":"(나)를 미분하면 \\(f(x+1)-f(x)\\)가 나타나요. 이 식을 다시 적분하면 \\([t,t+1]\\)에서의 \\(f\\)의 적분을 알 수 있어요.","conditions":[{"label":"(가)","meaning":"\\(g(x+1)-g(x)\\)를 알려 주므로 부분적분 뒤 남는 항을 실제로 계산할 수 있어요."},{"label":"(나)","meaning":"\\(x=0\\)에서 \\(g(1)=0\\)을 얻고, 미분하여 \\(f\\)의 한 칸 차이를 만들어요."}]},"chapters":[{"id":"c1","label":"먼저 시작값을 확인해요","stepIds":["s1"],"question":"(나)에 \\(x=0\\)을 넣으면 왜 바로 \\(g(1)=0\\)일까요?","hint":"적분의 위끝값과 아래끝값이 같을 때 정적분값을 떠올려요.","explanation":"(나)의 오른쪽은 위끝값이 \\(0\\)인 \\(\\int_0^0\\)이므로 값이 \\(0\\)이에요. 따라서 왼쪽도 \\(g(1)=0\\)이에요. 이 값은 뒤에서 정수점의 \\(g\\)값을 차례로 정하는 출발점이 돼요.","check":{"prompt":"정수점의 \\(g\\)값을 구할 때 출발점으로 쓰는 값은 무엇인가요?","answer":"(나)에 \\(x=0\\)을 넣어 얻은 \\(g(1)=0\\)이에요."}},{"id":"c2","label":"미분한 식을 한 칸 적분해요","stepIds":["s2","s3"],"question":"\\(f(x+1)-f(x)\\)를 적분하면 왜 길이가 1인 두 적분의 차가 될까요?","hint":"\\(\\int_0^t f(x+1)\\,dx\\)에서 \\(u=x+1\\)로 바꿔 보세요.","explanation":"(나)를 미분하면 \\(g'(x+1)=e^x\\{f(x+1)-f(x)\\}+g(x)\\)이므로\n\n\\(f(x+1)-f(x)=e^{-x}\\{g'(x+1)-g(x)\\}\\)\n\n이에요. 양변을 \\(0\\)부터 \\(t\\)까지 적분하면 왼쪽은 \\(\\int_t^{t+1}f-\\int_0^1f\\)가 돼요. 오른쪽의 \\(e^{-x}g'(x+1)\\)에는 부분적분을 써요. 그러면 끝값은 \\(e^{-t}g(t+1)-g(1)\\)이고, 남은 적분과 \\(-e^{-x}g(x)\\)를 합쳐\n\n\\(\\int_t^{t+1}f-\\int_0^1f=e^{-t}g(t+1)+\\int_0^t e^{-x}\\{g(x+1)-g(x)\\}\\,dx\\)\n\n를 얻어요. 여기서는 앞에서 구한 \\(g(1)=0\\)도 사용했어요.","check":{"prompt":"부분적분 뒤 경계항에서 사라지는 값은 무엇이며 왜 사라지나요?","answer":"아래끝값에서 생기는 \\(g(1)\\)이고, 앞 장에서 \\(g(1)=0\\)을 확인했기 때문에 사라져요."}},{"id":"c3","label":"사인 적분을 끝값으로 바꿔요","stepIds":["s4","s5"],"question":"(가)를 넣은 적분은 어떻게 코사인의 차로 정리될까요?","hint":"\\(e^{-x}\\)와 (가)의 \\(e^x\\)가 없어지는 것부터 확인해요.","explanation":"(가)를 넣으면 적분 안은 \\(-\\pi(e+1)\\sin(\\pi x)\\)예요. 따라서\n\n\\(\\int_0^t-\\pi(e+1)\\sin(\\pi x)\\,dx=(e+1)\\{\\cos(\\pi t)-1\\}\\)\n\n이에요. 그래서 한 칸 적분은\n\n\\(\\int_t^{t+1}f=\\int_0^1f+e^{-t}g(t+1)+(e+1)\\{\\cos(\\pi t)-1\\}\\)\n\n로 정리돼요. 이제 \\(t\\)를 정수로 두면 코사인 값이 \\(1\\)과 \\(-1\\)로 번갈아 나와요.","check":{"prompt":"사인 적분의 아래끝값이 마지막에 \\(-1\\)을 남기는 이유는 무엇인가요?","answer":"부정적분이 \\((e+1)\\cos(\\pi x)\\)이고 아래끝값 \\(x=0\\)에서 코사인값이 \\(1\\)이기 때문이에요."}},{"id":"c4","label":"홀수 구간과 짝수 구간을 세어요","stepIds":["s6","s7","s8"],"question":"\\(1\\)부터 \\(10\\)까지 아홉 구간 중 보정항이 생기는 구간은 몇 개일까요?","hint":"\\(n=1,\\dots,9\\)에서 홀수와 짝수의 개수를 각각 세어요.","explanation":"정수 \\(n\\)에서는 (가)의 오른쪽에 \\(\\sin(\\pi n)=0\\)이 들어가므로 \\(g(n+1)=g(n)\\)이에요. \\(g(1)=0\\)에서 시작하면 모든 양의 정수 \\(n\\)에 대해 \\(g(n)=0\\)이에요. 따라서\n\n\\(\\int_n^{n+1}f=\\dfrac{10}{9}e+4+(e+1)\\{(-1)^n-1\\}\\)\n\n이에요. \\(n=1,\\dots,9\\) 중 홀수는 다섯 개라 각각 \\(-2(e+1)\\)이 더해지고, 짝수 네 개에서는 보정항이 \\(0\\)이에요. 그러므로\n\n\\(\\int_1^{10}f=9\\left(\\dfrac{10}{9}e+4\\right)-10(e+1)=10e+36-10e-10=26\\)\n\n이에요.","check":{"prompt":"마지막 합에서 \\(-10(e+1)\\)이 생기는 이유를 구간 수로 설명해 보세요.","answer":"홀수 \\(n\\)이 다섯 개이고 각 구간의 보정항이 \\(-2(e+1)\\)이므로 모두 \\(-10(e+1)\\)이에요."}}],"takeaway":["함수의 한 칸 차이를 적분하면 길이가 1인 구간 적분들의 차로 바꿀 수 있어요.","부분적분에서는 경계항과 남는 적분을 함께 적어 빠진 항이 없게 해요.","정수 구간을 합칠 때 홀수와 짝수의 개수를 실제로 세어 보정항을 확인해요."]};</script>
