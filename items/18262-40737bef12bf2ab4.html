  <script>window.HandStudyRecord={"adminYear":2025,"answer":"72","contentHash":"c3b9ee8ddbaf80e48309b0e9ee92fa92348d971623ef687ea3cc94559aae974e","diagram":null,"editionHash":"40737bef12bf2ab417f5a4768bbd25828e33c39625c0dd7ddf954dc8ebbb5eb7","grade":3,"graphHash":"","graphPlan":null,"itemId":18262,"learningHash":"4ad8e1a6a67573dabf3bc280289214c83b5f922fa6a0130c8cc107e492d0e5a5","month":7,"number":30,"points":4,"preview":false,"questionHtml":"\u003cp class=\"hp\">함수 \u003cspan class=\"heq\">\\(f \\left(x \\right)= \\int_{0}^{x}e^{ \\cos\\, \\pi t}\\,dt\\,\\)\u003c/span>의 역함수를 \u003cspan class=\"heq\">\\(g \\left(x \\right)\\,\\)\u003c/span>라 할 때, 실수 전체의 집합에서 도함수가 연속인 함수 \u003cspan class=\"heq\">\\(h \\left(x \\right)\\,\\)\u003c/span>가 모든 실수 \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>에 대하여\u003c/p>\u003cp class=\"hp\">&emsp;\u003cspan class=\"heq\">\\(h \\left(g \\left(x \\right)+2 \\right)=2x^{3}+6f \\left(1 \\right)x^{2}+1\\)\u003c/span>\u003c/p>\u003cp class=\"hp htall\">을 만족시킨다. \u003cspan class=\"heq\">\\(\\int_{3}^{7}\\dfrac{h' \\left(x \\right)}{f \\left(x \\right)}\\,dx=k \\times \\left\\{f \\left(1 \\right) \\right\\}^{2}\\,\\)\u003c/span>일 때, 실수 \u003cspan class=\"heq\">\\(k\\,\\)\u003c/span>의 값을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","questionText":"함수 $f \\left(x \\right)= \\int_{0}^{x}e^{ \\cos\\, \\pi t}\\,dt\\,$의 역함수를 $g \\left(x \\right)\\,$라 할 때, 실수 전체의 집합에서 도함수가 연속인 함수 $h \\left(x \\right)\\,$가 모든 실수 $x\\,$에 대하여\n $h \\left(g \\left(x \\right)+2 \\right)=2x^{3}+6f \\left(1 \\right)x^{2}+1$\n을 만족시킨다. $\\int_{3}^{7}\\frac{h' \\left(x \\right)}{f \\left(x \\right)}\\,dx=k \\times \\left\\{f \\left(1 \\right) \\right\\}^{2}\\,$일 때, 실수 $k\\,$의 값을 구하시오. [4점]","scoreStatus":"confirmed_4_direct","sourceHash":"f23cfe63d3226beaf6f70265936bdafb8b3fc90506b340327a23edb6823dfe41","sourceLabel":"2025 교육청 고3 수학미적분 7월 30번","stepExplanations":{"s1":{"body":"주어진 식에서 원래의 변수 자리에 \\(f(x-2)\\)를 넣어요. \\(g(f(x-2))=x-2\\)이므로 왼쪽은 \\(h(x)\\)가 되고, 오른쪽은 \\(f(x-2)\\)의 식으로 바뀝니다. 역함수 관계를 이용해 미분하기 쉬운 형태로 바꾸는 과정이에요.","skillTags":["function.inverse-composition"],"title":"역함수 안쪽을 먼저 정리해요"},"s2":{"body":"적분하는 함수 \\(e^{\\cos\\pi t}\\)의 주기는 2예요. 또한 \\(t=2-u\\)로 바꾸면 \\(\\int_1^2e^{\\cos\\pi t}\\,dt=\\int_0^1e^{\\cos\\pi u}\\,du=f(1)\\)입니다. 따라서 길이가 2인 구간의 적분값은 항상 \\(2f(1)\\)이고, \\(f(x)-f(x-2)=2f(1)\\)이 돼요.","skillTags":["integration.periodicity","integration.substitution"],"title":"주기 때문에 두 칸 옮긴 적분값의 차이가 일정해요"},"s4":{"body":"먼저 \\(u=x-2\\)로 놓으면 \\(dx=du\\)이고 구간 \\([3,7]\\)은 \\([1,5]\\)가 돼요. \\(f(u)^2\\)를 미분하면 \\(2f(u)f^{\\prime}(u)\\)이므로, 앞의 6은 적분 후 3으로 바뀝니다. 또 두 칸씩 이동하면 \\(2f(1)\\)씩 늘어나서 \\(f(5)=5f(1)\\)이에요. 그래서 \\(3(25-1)f(1)^2=72f(1)^2\\)가 됩니다.","skillTags":["integration.substitution","integration.reverse-chain-rule"],"title":"치환과 역미분을 나누어 확인해요"}},"steps":[{"id":"s1","latex":"h\\left(x\\right)=2\\left\\{f\\left(x-2\\right)\\right\\}^{3}+6f\\left(1\\right)\\left\\{f\\left(x-2\\right)\\right\\}^{2}+1"},{"id":"s2","latex":"t=1\\qquad \\displaystyle\\int_{1}^{2}e^{\\cos \\pi t}\\,dt=f\\left(1\\right)\\qquad 2f\\left(1\\right)\\qquad f\\left(x\\right)=f\\left(x-2\\right)+2f\\left(1\\right)"},{"id":"s3","latex":"h'\\left(x\\right)=6f\\left(x-2\\right)f'\\left(x-2\\right)\\left\\{f\\left(x-2\\right)+2f\\left(1\\right)\\right\\}=6f\\left(x-2\\right)f'\\left(x-2\\right)f\\left(x\\right)"},{"id":"s4","latex":"\\int_{3}^{7}\\dfrac{h'\\left(x\\right)}{f\\left(x\\right)}\\,dx=6\\int_{1}^{5}f\\left(u\\right)f'\\left(u\\right)\\,du=3\\left[\\left\\{f\\left(u\\right)\\right\\}^{2}\\right]_{1}^{5}=72\\left\\{f\\left(1\\right)\\right\\}^{2}"}],"track":"미적분"};</script>
