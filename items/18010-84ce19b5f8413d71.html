<script>window.HandStudyGuide={"itemId":18010,"sourceHash":"574d62b48fb34bae5eccb24cf8e2d5ab1d05a7e47c6dd258a1f429396b8270f4","contentHash":"05a3794e1421d4a9abe4f7d9b5111e37a5a4a68c3d4f1f9680716b1de80ef6bf","overview":{"goal":"첫 두 함수값의 차로 경우를 나누고, 뒤 두 함수값의 감소하지 않는 순서쌍을 세어요.","firstLook":"\\(A=f(1),B=f(2),C=f(3),D=f(4)\\)로 줄여 쓰면 조건은 \\(A\\le B\\), \\(B-A\\le C\\le D\\)예요.","conditions":[{"label":"공역","meaning":"네 함수값은 모두 \\(1\\)부터 \\(6\\)까지예요."},{"label":"짝수 합","meaning":"\\(A,B\\)는 같은 홀짝이고 차도 짝수예요."}]},"chapters":[{"id":"c1","label":"조건을 차이로 정리해요","stepIds":["s1","s2","s3"],"question":"\\(d=B-A\\)는 어떤 값을 가질 수 있나요?","hint":"범위와 같은 홀짝 조건을 함께 써요.","explanation":"부등식은 \\(A\\le B\\)와 \\(B-A\\le C\\le D\\)로 바뀌어요. \\(A+B\\)가 짝수이면 \\(A,B\\)가 같은 홀짝이므로 \\(d=B-A\\)는 짝수예요. 또 \\(1\\le A\\le B\\le6\\)이어서 가능한 값은 \\(d=0,2,4\\)뿐이에요.","check":{"prompt":"\\(d=6\\)이 불가능한 이유는 무엇인가요?","answer":"\\(A\\ge1\\)이면 \\(B=A+6>6\\)이 되기 때문이에요."}},{"id":"c2","label":"각 차이에서 앞뒤 순서쌍을 세어요","stepIds":["s4","s5"],"question":"각 \\(d\\)에서 경우의 수는 어떻게 나오나요?","hint":"\\(A,B)\\)는 \\(B=A+d\\), \\(C,D\\)는 \\(d\\le C\\le D\\le6\\)을 써요.","explanation":"\\(d=0,2,4\\)일 때 \\(A\\)는 각각 \\(1\\)부터 \\(6,4,2\\)까지 가능하므로 \\((A,B)\\)는 \\(6,4,2\\)가지예요. 뒤에서는 \\(C\\ge d\\)와 원래 공역의 하한 \\(1\\)을 함께 써요. 감소하지 않는 두 값을 고르면 \\(d=0\\)에서 \\({}_6H_2=21\\), \\(d=2\\)에서 \\({}_5H_2=15\\), \\(d=4\\)에서 \\({}_3H_2=6\\)가지예요.","check":{"prompt":"\\(d=4\\)일 때 \\(C,D\\)가 고를 수 있는 값은 무엇인가요?","answer":"\\(4,5,6\\)에서 감소하지 않게 두 값을 골라요."}},{"id":"c3","label":"서로 겹치지 않는 경우를 더해요","stepIds":["s6"],"question":"전체 함수 개수는 얼마인가요?","hint":"세 경우는 \\(B-A\\)가 달라 서로 겹치지 않아요.","explanation":"각 차이에서 앞의 순서쌍과 뒤의 순서쌍은 독립적으로 고르므로 곱해요. 세 경우의 차이가 서로 달라 중복이 없어서 전체는 \\(6\\cdot21+4\\cdot15+2\\cdot6=126+60+12=198\\)개예요.","check":{"prompt":"세 경우를 그대로 더해도 되는 이유는 무엇인가요?","answer":"각 경우의 \\(d=B-A\\) 값이 \\(0,2,4\\)로 서로 다르기 때문이에요."}}],"takeaway":["연쇄부등식은 함수값에 이름을 붙이고 차이를 도입하면 간단해져요.","합의 짝수 조건은 두 수가 같은 홀짝이라는 뜻이에요.","감소하지 않는 순서쌍은 중복을 허용한 선택으로 셀 수 있어요."]};</script>
