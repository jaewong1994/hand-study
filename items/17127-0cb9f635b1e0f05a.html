<script>window.HandStudyRecord={"itemId":17127,"sourceLabel":"2021 교육청 고3 수학확통 3월 29번","adminYear":2021,"grade":3,"month":3,"number":29,"track":"확통","points":4,"scoreStatus":"confirmed_4_direct","questionText":"$5$ 이하의 자연수 $a$, $b$, $c$, $d\\,$에 대하여 부등식\n $a \\leq b+1 \\leq c \\leq d\\,$\n 를 만족시키는 모든 순서쌍 $(a,\\,b,\\,c,\\,d)\\,$의 개수를 구하시오.\n[4점]","answer":"55","sourceHash":"426c3fb0daed6a52e191110c4d84952e6e54d113de14d3d6ae7751b9ad050743","steps":[{"id":"s1","latex":"b'=b+1\\Rightarrow a\\le b'\\le c\\le d"},{"id":"s2","latex":"b'\\in\\{2,3,4,5,6\\},\\quad1\\le a\\le5"},{"id":"s3","latex":"b'=2,3,4,5\\text{일 때 }a\\text{의 개수는 각각 }2,3,4,5"},{"id":"s4","latex":"b'=2,3,4,5\\text{일 때 }\\#(c,d)={}_{6-b'}\\mathrm H_2"},{"id":"s5","latex":"b'=2,3,4,5:\\quad20,18,12,5"},{"id":"s6","latex":"20+18+12+5=55"}],"diagram":null,"contentHash":"e89b4be70e3df745a005aa529b4717d7dd4c0390e3b7af39714008a143c67599","questionHtml":"<p class=\"hp\"><span class=\"heq\">\\(5\\)<\/span> 이하의 자연수 <span class=\"heq\">\\(a\\)<\/span>, <span class=\"heq\">\\(b\\)<\/span>, <span class=\"heq\">\\(c\\)<\/span>, <span class=\"heq\">\\(d\\,\\)<\/span>에 대하여 부등식<\/p><p class=\"hp\">&emsp;<span class=\"heq\">\\(a \\leq b+1 \\leq c \\leq d\\,\\)<\/span><\/p><p class=\"hp\">를 만족시키는 모든 순서쌍 <span class=\"heq\">\\((a,\\,b,\\,c,\\,d)\\,\\)<\/span>의 개수를 구하시오.<\/p><p class=\"hp\"><span class=\"hscore\">[4점]<\/span><\/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"f475f06201259cc6a93dd80c949b6ab67477b55312c002b1670a31c14fb76974"};</script>
<script>window.HandStudyGuide={"itemId":17127,"sourceHash":"426c3fb0daed6a52e191110c4d84952e6e54d113de14d3d6ae7751b9ad050743","contentHash":"e89b4be70e3df745a005aa529b4717d7dd4c0390e3b7af39714008a143c67599","overview":{"goal":"\\(b+1\\)의 값을 기준으로 \\(a\\)와 \\((c,d)\\)의 가능한 수를 세어 네 자연수의 순서쌍을 구해요.","firstLook":"가운데에 반복되는 \\(b+1\\)을 \\(b'\\)로 놓으면 \\(a\\le b'\\le c\\le d\\)가 돼요. 다만 \\(a,b,c,d\\)는 모두 5 이하이므로 \\(b'=6\\)은 뒤 조건과 함께 따로 걸러야 해요.","conditions":[{"label":"자연수 범위","meaning":"\\(a,b,c,d\\)는 모두 1부터 5까지예요."},{"label":"대소 관계","meaning":"\\(b'=b+1\\)로 두면 \\(a\\le b'\\le c\\le d\\)예요."}]},"chapters":[{"id":"c1","label":"가운데 값을 바꾸어 범위를 읽어요","stepIds":["s1","s2"],"question":"\\(b'=b+1\\)은 어떤 값을 가질 수 있고, 그중 실제로 가능한 값은 무엇일까요?","hint":"\\(b\\)만 보면 2부터 6이지만, \\(b'\\le c\\le5\\)도 함께 봐야 해요.","explanation":"\\(b'=b+1\\)로 두면 \\(a\\le b'\\le c\\le d\\)예요. \\(b\\)가 1부터 5까지이므로 처음에는 \\(b'=2,3,4,5,6\\)을 생각할 수 있어요. 그러나 \\(c\\le5\\)이면서 \\(b'\\le c\\)여야 하므로 \\(b'=6\\)은 불가능해요. 따라서 실제로 세어야 할 값은 \\(b'=2,3,4,5\\)예요.","check":{"prompt":"\\(b'=6\\)을 제외하는 데 쓰는 원래 조건은 무엇인가요?","answer":"\\(b'\\le c\\)와 \\(c\\le5\\)를 함께 쓰면 \\(6\\le c\\le5\\)가 되어 불가능해요."}},{"id":"c2","label":"왼쪽과 오른쪽의 선택 수를 각각 세어요","stepIds":["s3","s4","s5"],"question":"고정한 \\(b'\\)마다 \\(a\\)와 \\((c,d)\\)의 수는 어떻게 달라질까요?","hint":"\\(b'=2,3,4,5\\)에서는 \\(a\\)가 1부터 \\(b'\\)까지이고, \\(c,d\\)는 \\(b'\\)부터 5까지에서 중복을 허용해 두 수를 골라요.","explanation":"\\(b'=2,3,4,5\\)에서는 \\(1\\le a\\le b'\\)이므로 \\(a\\)는 각각 2,3,4,5가지예요. 한편 \\(b'\\le c\\le d\\le5\\)이므로 \\(b',b'+1,\\ldots,5\\)에서 중복을 허용해 두 수를 작은 순서로 고르면 돼요.\n\n\\(b'=2\\)일 때 \\(a\\)는 2가지, \\((c,d)\\)는 \\({}_4\\mathrm H_2={}_5\\mathrm C_2=10\\)가지이므로 20가지예요. 같은 방식으로 \\(b'=3\\)은 \\(3\\times{}_3\\mathrm H_2=3\\times6=18\\), \\(b'=4\\)는 \\(4\\times{}_2\\mathrm H_2=4\\times3=12\\), \\(b'=5\\)는 \\(5\\times{}_1\\mathrm H_2=5\\)가지예요.","check":{"prompt":"\\(b'=4\\)일 때 \\((c,d)\\)를 직접 쓰면 무엇인가요?","answer":"\\((4,4),(4,5),(5,5)\\)의 3가지이고, \\(a\\)는 1,2,3,4의 4가지예요."}},{"id":"c3","label":"서로 다른 가운데 값을 더해요","stepIds":["s6"],"question":"네 경우를 더한 최종 개수는 얼마인가요?","hint":"각 경우는 \\(b'=b+1\\)의 값이 달라 서로 겹치지 않아요.","explanation":"\\(b'=2,3,4,5\\)인 경우는 서로 겹치지 않고 가능한 \\(b'\\)를 모두 다뤘어요. 따라서 전체 순서쌍의 개수는 \\(20+18+12+5=55\\)예요.","check":{"prompt":"각 경우를 곱한 뒤 마지막에는 왜 더하나요?","answer":"한 \\(b'\\) 안에서는 \\(a\\)와 \\((c,d)\\)를 함께 정하므로 곱하고, 서로 다른 \\(b'\\)의 경우는 겹치지 않으므로 더해요."}}],"takeaway":["연속된 부등식에서 같은 식이 반복되면 새 문자로 두어 순서를 단순하게 만들어요.","치환한 문자의 겉보기 범위와 원래 변수 전체의 조건을 함께 확인해 불가능한 끝값을 걸러요.","작은 순서로 놓인 두 값을 세는 것은 중복을 허용한 조합으로 바꿀 수 있어요."]};</script>
