  <script>window.HandStudyRecord={"itemId":16389,"sourceLabel":"2019 교육청 고3 수리나형 3월 17번","adminYear":2019,"grade":3,"month":3,"number":17,"track":"수리나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"자연수 $k$에 대하여 함수\n $f(x)= \\left| \\frac{k}{2x} -2 \\right|$ $(x>0)\\,$\n의 그래프와 $x\\,$축의 교점을 $\\,A\\,$, 곡선 $y=f(x)\\,$ 위의 점 $\\mathrm{P}\\,$에서 $x\\,$축에 내린 수선의 발을 $\\mathrm{Q}\\,$라 하자. \u003c보기>에서 옳은 것만을 있는 대로 고른 것은? [4점]\n\u003c 보 기 >\nㄱ. 점 $\\mathrm{A}\\,$의 좌표는 $\\left( \\frac{k}{4} ,\\,0 \\right)\\,$이다.\nㄴ. 점 $\\mathrm{P}\\,$의 $x\\,$좌표가 점 $\\mathrm{A}\\,$의 $x\\,$좌표보다 클 때, 선분 $\\mathrm{PQ}\\,$의 길이는 $2\\,$보다 작다.\nㄷ. 점 $\\mathrm{P}\\,$의 $x\\,$좌표가 $k\\,$일 때, 삼각형 $\\mathrm{AQP}\\,$의 넓이가 자연수가 되도록 하는 $k\\,$의 최솟값은 $16\\,$이다.\n① ㄱ ② ㄱ, ㄴ ③ ㄱ,　ㄷ\n④　ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","answer":"⑤","sourceHash":"bd31945f8c5e2437bef939d0ca31fc8234002f058ae4e0441ad6089bca007dbd","steps":[{"id":"s1","latex":"f(x)=0\\Rightarrow x=\\dfrac k4\\Rightarrow A=\\left(\\dfrac k4,0\\right)"},{"id":"s2","latex":"x>\\dfrac k4\\Rightarrow PQ=2-\\dfrac{k}{2x}\u003c2"},{"id":"s3","latex":"x_P=k:\\quad AQ=\\dfrac{3k}{4},\\quad PQ=\\dfrac32"},{"id":"s4","latex":"[AQP]=\\dfrac12\\cdot\\dfrac{3k}{4}\\cdot\\dfrac32=\\dfrac{9k}{16}"},{"id":"s5","latex":"\\dfrac{9k}{16}\\in\\mathbb N\\Rightarrow\\min k=16"},{"id":"s6","latex":"\\therefore\\text{세 명제는 모두 참}"}],"diagram":null,"contentHash":"94a617ca625476576dad0b2d3ed3860250314fd32ca2b6a384a4799a42cfa6a2","questionHtml":"\u003cp class=\"hp\">자연수 \u003cspan class=\"heq\">\\(k\\)\u003c/span>에 대하여 함수\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\(f(x)= \\left| \\dfrac{k}{2x} -2 \\right|\\)\u003c/span> \u003cspan class=\"heq\">\\((x\\gt 0)\\,\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">의 그래프와 \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>축의 교점을 \u003cspan class=\"heq\">\\(\\,A\\,\\)\u003c/span>, 곡선 \u003cspan class=\"heq\">\\(y=f(x)\\,\\)\u003c/span> 위의 점 \u003cspan class=\"heq\">\\(\\mathrm{P}\\,\\)\u003c/span>에서 \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>축에 내린 수선의 발을 \u003cspan class=\"heq\">\\(\\mathrm{Q}\\,\\)\u003c/span>라 하자. &lt;보기&gt;에서 옳은 것만을 있는 대로 고른 것은? \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp htall\">\u003cdiv class=\"hbox\">\u003cp class=\"hp\">&lt; 보 기 &gt;\u003c/p>\u003cp class=\"hp htall\">ㄱ. 점 \u003cspan class=\"heq\">\\(\\mathrm{A}\\,\\)\u003c/span>의 좌표는 \u003cspan class=\"heq\">\\(\\left( \\dfrac{k}{4} ,\\,0 \\right)\\,\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp\">ㄴ. 점 \u003cspan class=\"heq\">\\(\\mathrm{P}\\,\\)\u003c/span>의 \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>좌표가 점 \u003cspan class=\"heq\">\\(\\mathrm{A}\\,\\)\u003c/span>의 \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>좌표보다 클 때, 선분 \u003cspan class=\"heq\">\\(\\mathrm{PQ}\\,\\)\u003c/span>의 길이는 \u003cspan class=\"heq\">\\(2\\,\\)\u003c/span>보다 작다.\u003c/p>\u003cp class=\"hp\">ㄷ. 점 \u003cspan class=\"heq\">\\(\\mathrm{P}\\,\\)\u003c/span>의 \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>좌표가 \u003cspan class=\"heq\">\\(k\\,\\)\u003c/span>일 때, 삼각형 \u003cspan class=\"heq\">\\(\\mathrm{AQP}\\,\\)\u003c/span>의 넓이가 자연수가 되도록 하는 \u003cspan class=\"heq\">\\(k\\,\\)\u003c/span>의 최솟값은 \u003cspan class=\"heq\">\\(16\\,\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003c/p>\u003cp class=\"hp\">① ㄱ&emsp;② ㄱ, ㄴ&emsp;③ ㄱ,　ㄷ\u003c/p>\u003cp class=\"hp\">④　ㄴ, ㄷ&emsp;⑤ ㄱ, ㄴ, ㄷ\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/c61c568ba364a28054f25844.png\" style=\"width:316px;max-width:100%\">\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"f6d874dceb0a96d8a1c9df2d77ad3dfdb8ef3af1a2fa9e918d7ed45bd1b9f828"};</script>
