  <script>window.HandStudyRecord={"itemId":8217,"sourceLabel":"2023 교육청 고2 수학 12월 20번","adminYear":2023,"grade":2,"month":12,"number":20,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"함수 $f \\left(x \\right)= \\left(x+1 \\right) \\left(x-6 \\right) ^{2}$과 양의 실수 $t$에 대하여 $g(t)$를 다음과 같이 정의한다.\n두 점 $(0,\\,0)$, $(t,\\, f(t))$를 지나는 직선의 기울기와 곡선 $y=f(x)$ 위의 점 $(k,\\, f(k))$에서의 접선의 기울기가 같아지는 양의 실수 $k$의 개수가 $1$이면 $k$의 값을 $g(t)$, $2$이면 $k$의 값 중 작은 값을 $g(t)$라 한다.\n\u003c보기>에서 옳은 것만을 있는 대로 고른 것은? [4점]\n\u003c보 기>ㄱ. $f ' \\left(0 \\right)=24$ ㄴ. $g \\left(6 \\right)= \\frac{4}{3}$ ㄷ. 함수 $g(t)$의 치역의 원소가 아닌 모든 자연수의 합은 $27$이다.\n① ㄱ ② ㄴ ③ ㄱ, ㄴ\n④ ㄱ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","answer":"⑤","sourceHash":"62218a2da5e95fc467a3778c9660cd97a0da58eeeb0e24798b3fd5042178c96a","steps":[{"id":"s1","latex":"f(x)=x^3-11x^2+24x+36,\\quad f'(x)=3x^2-22x+24"},{"id":"s2","latex":"f'(0)=24"},{"id":"s3","latex":"t=6:\\quad\\frac{f(t)}t=0,\\quad f'(k)=(3k-4)(k-6)=0\\Rightarrow g(6)=\\frac43"},{"id":"s4","latex":"m(t)=\\frac{f(t)}t=\\frac{(t+1)(t-6)^2}{t}\\in[0,\\infty)\\quad(t>0)"},{"id":"s5","latex":"f'(k)=3\\left(k-\\frac{11}{3}\\right)^2-\\frac{49}{3}"},{"id":"s6","latex":"0\\le m\u003c24\\Rightarrow0\u003cg(t)\\le\\frac43,\\qquad m\\ge24\\Rightarrow g(t)\\ge\\frac{22}{3}"},{"id":"s7","latex":"\\mathcal R(g)=\\left(0,\\frac43\\right]\\cup\\left[\\frac{22}{3},\\infty\\right)"},{"id":"s8","latex":"2+3+4+5+6+7=27"}],"diagram":null,"contentHash":"116ee920c855fe5f3962f7afd88c418eeef61025e968e2aebfa8e2c113fa422e","questionHtml":"\u003cp class=\"hp\">함수 \u003cspan class=\"heq\">\\(f \\left(x \\right)= \\left(x+1 \\right) \\left(x-6 \\right)^{2}\\)\u003c/span>과 양의 실수 \u003cspan class=\"heq\">\\(t\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(g(t)\\)\u003c/span>를 다음과 같이 정의한다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">두 점 \u003cspan class=\"heq\">\\((0,\\,0)\\)\u003c/span>, \u003cspan class=\"heq\">\\((t,\\, f(t))\\)\u003c/span>를 지나는 직선의 기울기와 곡선 \u003cspan class=\"heq\">\\(y=f(x)\\)\u003c/span> 위의 점 \u003cspan class=\"heq\">\\((k,\\, f(k))\\)\u003c/span>에서의 접선의 기울기가 같아지는 양의 실수 \u003cspan class=\"heq\">\\(k\\)\u003c/span>의 개수가 \u003cspan class=\"heq\">\\(1\\)\u003c/span>이면 \u003cspan class=\"heq\">\\(k\\)\u003c/span>의 값을 \u003cspan class=\"heq\">\\(g(t)\\)\u003c/span>, \u003cspan class=\"heq\">\\(2\\)\u003c/span>이면 \u003cspan class=\"heq\">\\(k\\)\u003c/span>의 값 중 작은 값을 \u003cspan class=\"heq\">\\(g(t)\\)\u003c/span>라 한다.\u003c/p>\u003c/div>\u003cp class=\"hp\">&lt;보기&gt;에서 옳은 것만을 있는 대로 고른 것은? \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cdiv class=\"hbox\">\u003cdiv style=\"text-align:center;font-weight:700;margin:0 0 6px\">&lt; 보 기 &gt;\u003c/div>\u003cp class=\"hp\">ㄱ. \u003cspan class=\"heq\">\\(f' \\left(0 \\right)=24\\)\u003c/span>\u003c/p>\u003cp class=\"hp htall\">ㄴ. \u003cspan class=\"heq\">\\(g \\left(6 \\right)= \\dfrac{4}{3}\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">ㄷ. 함수 \u003cspan class=\"heq\">\\(g(t)\\)\u003c/span>의 치역의 원소가 아닌 모든 자연수의 합은 \u003cbr>\u003cspan class=\"heq\">\\(27\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp class=\"hp\">① ㄱ&emsp;② ㄴ&emsp;③ ㄱ, ㄴ\u003c/p>\u003cp class=\"hp\">④ ㄱ, ㄷ&emsp;⑤ ㄱ, ㄴ, ㄷ\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"17397376a04151ef728497d35bb135ec4317e2f9c664606c3a03db547b97a0ba"};</script>
