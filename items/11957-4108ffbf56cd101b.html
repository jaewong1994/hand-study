  <script>window.HandStudyRecord={"itemId":11957,"sourceLabel":"2023 교육청 고1 수학 6월 28번","adminYear":2023,"grade":1,"month":6,"number":28,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 이차함수 $y=x ^{2} -4x+ \\frac{25}{4} \\,$의 그래프가 직선 $y=ax\\,$($a>0$)과 한 점 $A\\,$에서만 만난다. 이차함수 $y=x ^{2} -4x+ \\frac{25}{4} \\,$의 그래프가 $y\\,$축과 만나는 점을 $B\\,$, 점 $A\\,$에서 $x\\,$축에 내린 수선의 발을 $H\\,$라 하고, 선분 $OA\\,$와 선분 $BH\\,$가 만나는 점을 $C\\,$라 하자. 삼각형 $BOC\\,$의 넓이를 $S _{\\,1} \\,$, 삼각형 $ACH\\,$의 넓이를 $S _{\\,2} \\,$라 할 때, $S _{\\,1} -S _{\\,2} = \\frac{q}{p} \\,$이다. $p+q\\,$의 값을 구하시오. (단, $O\\,$는 원점이고, $p\\,$와 $q\\,$는 서로소인 자연수이다.)\n[4점]\n$H$$O$$x$$A$$B$$y=ax$$y=x ^{2} -4x+ \\frac{25}{4}$$C$$S _{\\,1}$$S _{\\,2}$$y$","answer":"91","sourceHash":"b29daca21b5f698ef8787f033bc71416b481d104c651c7a0cc620b24237fbc76","steps":[{"id":"s1","latex":"x^2-(a+4)x+\\frac{25}{4}=0,\\quad\\Delta=0"},{"id":"s2","latex":"(a+4)^2-25=0,\\quad a>0\\Rightarrow a=1"},{"id":"s3","latex":"A=\\left(\\frac52,\\frac52\\right),\\quad H=\\left(\\frac52,0\\right),\\quad B=\\left(0,\\frac{25}{4}\\right)"},{"id":"s4","latex":"OA:\\ y=x,\\quad BH:\\ y=-\\frac52x+\\frac{25}{4}"},{"id":"s5","latex":"C=\\left(\\frac{25}{14},\\frac{25}{14}\\right)"},{"id":"s6","latex":"S_1=\\frac12\\cdot\\frac{25}{4}\\cdot\\frac{25}{14}=\\frac{625}{112}"},{"id":"s7","latex":"S_2=\\frac12\\cdot\\frac52\\cdot\\left(\\frac52-\\frac{25}{14}\\right)=\\frac{25}{28}"},{"id":"s8","latex":"S_1-S_2=\\frac{75}{16}\\Rightarrow p+q=16+75=91"}],"diagram":null,"contentHash":"94405c11bbca5722e2a69f4e925722826fdb5d57ca5e1756cbab184d280281f9","questionHtml":"\u003cp class=\"hp htall\">그림과 같이 이차함수 \u003cspan class=\"heq\">\\(y=x^{2} -4x+ \\dfrac{25}{4} \\,\\)\u003c/span>의 그래프가 \u003cbr>직선 \u003cspan class=\"heq\">\\(y=ax\\)\u003c/span>(\u003cspan class=\"heq\">\\(a\\gt 0\\)\u003c/span>)과 한 점 \u003cspan class=\"heq\">\\(A\\)\u003c/span>에서만 만난다.\u003cbr>이차함수 \u003cspan class=\"heq\">\\(y=x^{2} -4x+ \\dfrac{25}{4} \\,\\)\u003c/span>의 그래프가 \
