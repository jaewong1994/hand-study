<script>window.HandStudyRecord={"adminYear":2020,"answer":"⑤","contentHash":"a407815a6b985bba000a832c1ae569c65f97a652de9ed49716f228b7fdbba809","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24720,"month":12,"number":19,"points":4,"preview":false,"questionHtml":"\u003cp>숫자 \u003cspan class=\"heq\">\\(3, \\,3, \\,4, \\,4, \\,4\\)\u003c/span>가 하나씩 적힌 \u003cspan class=\"heq\">\\(5\\)\u003c/span>개의 공이 들어 있는 주머니가 있다. 이 주머니와 한 개의 주사위를 사용하여 다음 규칙에 따라 점수를 얻는 시행을 한다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp>주머니에서 임의로 한 개의 공을 꺼내어꺼낸 공에 적힌 수가 \u003cspan class=\"heq\">\\(3\\)\u003c/span>이면 주사위를 \u003cspan class=\"heq\">\\(3\\)\u003c/span>번 던져서 나오는 세 눈의 수의 합을 점수로 하고,꺼낸 공에 적힌 수가 \u003cspan class=\"heq\">\\(4\\)\u003c/span>이면 주사위를 \u003cspan class=\"heq\">\\(4\\)\u003c/span>번 던져서 나오는 네 눈의 수의 합을 점수로 한다.\u003c/p>\u003c/div>\u003cp>이 시행을 한 번 하여 얻은 점수가 \u003cspan class=\"heq\">\\(10\\)\u003c/span>점일 확률은? [4점]\u003c/p>\u003cdiv class=\"hchoices\">\u003cdiv class=\"hch\">① \u003cspan class=\"heq\">\\(\\frac{13}{180}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">② \u003cspan class=\"heq\">\\(\\frac{41}{540}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">③ \u003cspan class=\"heq\">\\(\\frac{43}{540}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">④ \u003cspan class=\"heq\">\\(\\frac{1}{12}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">⑤ \u003cspan class=\"heq\">\\(\\frac{47}{540}\\)\u003c/span>\u003c/div>\u003c/div>","questionText":"숫자 $3, \\,3, \\,4, \\,4, \\,4$가 하나씩 적힌 $5$개의 공이 들어 있는 주머니가 있다. 이 주머니와 한 개의 주사위를 사용하여 다음 규칙에 따라 점수를 얻는 시행을 한다.\n주머니에서 임의로 한 개의 공을 꺼내어꺼낸 공에 적힌 수가 $3$이면 주사위를 $3$번 던져서 나오는 세 눈의 수의 합을 점수로 하고,꺼낸 공에 적힌 수가 $4$이면 주사위를 $4$번 던져서 나오는 네 눈의 수의 합을 점수로 한다.\n이 시행을 한 번 하여 얻은 점수가 $10$점일 확률은? [4점]\n① $\\frac{13}{180}$ ② $\\frac{41}{540}$ ③ $\\frac{43}{540}$ ④ $\\frac{1}{12}$ ⑤ $\\frac{47}{540}$","sourceHash":"c4faadbc7cafd4dc1a499e7b8b603e236712445a19dbc10145e90a84333f716b","sourceKind":"csat","sourceLabel":"2020년 시행 수능 · 2021학년도 · 가형 · 19번","steps":[{"id":"s1","latex":"\\text{공의 수가 }3\\text{일 확률}=\\frac25,\\quad4\\text{일 확률}=\\frac35"},{"id":"s2","latex":"\\text{주사위 눈에서 1씩 빼면 각 수는 }0,1,\\ldots,5"},{"id":"s3","latex":"\\text{3번 던져 합10: }u_1+u_2+u_3=7"},{"id":"s4","latex":"{}_9\\mathrm C_2-3\\cdot{}_3\\mathrm C_2=36-9=27"},{"id":"s5","latex":"\\text{어느 }u_i\\ge6\\text{인 경우를 빼며 두 수가 동시에6 이상일 수는 없다.}"},{"id":"s6","latex":"\\text{4번 던져 합10: }u_1+u_2+u_3+u_4=6"},{"id":"s7","latex":"{}_9\\mathrm C_3-4=84-4=80"},{"id":"s8","latex":"\\mathrm P=\\frac25\\frac{27}{6^3}+\\frac35\\frac{80}{6^4}=\\frac1{20}+\\frac1{27}=\\boxed{\\frac{47}{540}}\\quad\\text{⑤}"}],"track":"가형"};</script>
