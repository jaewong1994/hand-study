<script>window.HandStudyRecord={"itemId":17426,"sourceLabel":"2022 교육청 고3 수학확통 7월 22번","adminYear":2022,"grade":3,"month":7,"number":22,"track":"확통","points":4,"scoreStatus":"confirmed_4_direct","questionText":"삼차함수 $f \\left( x \\right) \\,$에 대하여 곡선 $y=f \\left( x \\right)$ 위의 점 $\\left( 0,\\,0 \\right) \\,$에서의 접선의 방정식을 $y=g \\left( x \\right) \\,$라 할 때, 함수 $h \\left( x \\right) \\,$를\n $h \\left( x \\right) = \\left| f \\left( x \\right) \\right| +g \\left( x \\right) \\,$\n라 하자. 함수 $h \\left( x \\right) \\,$가 다음 조건을 만족시킨다.\n(가) 곡선 $y=h \\left( x \\right)$ 위의 점 $\\left( k,\\,0 \\right) \\,$$\\left( k != 0 \\right) \\,$에서의 접선의 방정식은 $y=0\\,$이다.(나) 방정식 $h \\left( x \\right) =0\\,$의 실근 중에서 가장 큰 값은 $12\\,$이다.\n$h \\left( 3 \\right)= - \\frac{9}{2} \\,$일 때, $k \\times \\left\\{ h \\left( 6 \\right) -h \\left( 11 \\right) \\right\\} \\,$의 값을 구하시오. (단, $k\\,$는 상수이다.) [4점]\n 사각형입니다. 2022년 7월 고3 모의고사 문제지제 2 교시 수학 영역(확률과 통계) \n5 지선다형","answer":"121","sourceHash":"eeffa7f83dc527036728146d53336e429662c1a666960ce72714638889546ecd","steps":[{"id":"s1","latex":"f(x)=ax^3+bx^2+cx,\\quad g(x)=cx,\\quad a\\ne0"},{"id":"s2","latex":"h(3)\u003c0\\Rightarrow c\\ne0;\\quad f(k)=0\\Rightarrow ck=0\\text{이므로 불가능}"},{"id":"s3","latex":"f(k)\u003c0\\Rightarrow h(x)=-x^2(ax+b),\\ h(k)=0\\Rightarrow h'(k)=-ak^2\\ne0"},{"id":"s4","latex":"f(k)>0:\\quad h(k)=h'(k)=0\\Rightarrow b=-2ak,\\ c=ak^2/2"},{"id":"s5","latex":"f(x)=ax(x^2-2kx+k^2/2),\\quad h(x)=\\begin{cases}ax(x-k)^2&f(x)\\ge0\\\\-ax^2(x-2k)&f(x)\u003c0\\end{cases}"},{"id":"s6","latex":"f(k)=-ak^3/2>0,\\quad f(2k)=ak^3\u003c0\\Rightarrow h(x)=0\\iff x=0,k,2k"},{"id":"s7","latex":"\\max(0,k,2k)=12\\Rightarrow k=6,\\ a\u003c0"},{"id":"s8","latex":"h(3)=27a=-9/2\\Rightarrow a=-1/6,\\quad h(6)=0,\\ h(11)=-121/6"},{"id":"s9","latex":"k\\{h(6)-h(11)\\}=121"}],"diagram":null,"contentHash":"84fee1688316c146ffaa6574112754d5c3a8d3ba4ce2be9a62378ceb730936c3","questionHtml":"\u003cp class=\"hp\">삼차함수 \u003cspan class=\"heq\">\\(f \\left( x \\right
