<script>window.HandStudyRecord={"adminYear":2025,"answer":"262","contentHash":"c59bd02772fb8eae60efee6b458d6ed4bb225d00e1e720a373b8ca4adf31c205","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24991,"month":11,"number":30,"points":4,"preview":false,"questionHtml":"\u003cp>비어 있는 주머니 \u003cspan class=\"heq\">\\(10\\,\\)\u003c/span>개가 일렬로 놓여 있고, 공 \u003cspan class=\"heq\">\\(8\\,\\)\u003c/span>개가 있다. 각 주머니에 들어 있는 공의 개수가 \u003cspan class=\"heq\">\\(2\\)\u003c/span> 이하가 되도록 공을 주머니에 남김없이 나누어 넣을 때, 다음 조건을 만족시키는 경우의 수를 구하시오. (단, 공끼리는 서로 구별하지 않는다.) [4점]\u003c/p>\u003cdiv class=\"hbox hcond\">\u003cp class=\"hcondr\">(가) 들어 있는 공의 개수가 \u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>인 주머니는 \u003cspan class=\"heq\">\\(4\\,\\)\u003c/span>개 또는 \u003cspan class=\"heq\">\\(6\\,\\)\u003c/span>개이다.\u003c/p>\u003cp class=\"hcondr\">(나) 들어 있는 공의 개수가 \u003cspan class=\"heq\">\\(2\\,\\)\u003c/span>인 주머니와 이웃한 주머니에는 공이 들어 있지 않다.\u003c/p>\u003c/div>","questionText":"비어 있는 주머니 $10\\,$개가 일렬로 놓여 있고, 공 $8\\,$개가 있다. 각 주머니에 들어 있는 공의 개수가 $2$ 이하가 되도록 공을 주머니에 남김없이 나누어 넣을 때, 다음 조건을 만족시키는 경우의 수를 구하시오. (단, 공끼리는 서로 구별하지 않는다.) [4점]\n(가) 들어 있는 공의 개수가 $1\\,$인 주머니는 $4\\,$개 또는 $6\\,$개이다.(나) 들어 있는 공의 개수가 $2\\,$인 주머니와 이웃한 주머니에는 공이 들어 있지 않다.","sourceHash":"a48c1803bf2b72558b9b11b7a55302215d1907e2c3bbe7bc786cbc8a7795a6e1","sourceKind":"csat","sourceLabel":"2025년 시행 수능 · 2026학년도 · 확률과 통계 · 30번","steps":[{"id":"s1","latex":"0,1,2\\text{개의 공이 든 주머니 수를 }x,y,z\\text{라 하면 }x+y+z=10,\\ y+2z=8"},{"id":"s2","latex":"y=4\\text{이면 }(x,y,z)=(4,4,2)"},{"explanation":{"body":"2개짜리 주머니 양옆은 반드시 비어 있어야 합니다. 빈 주머니를 먼저 늘어놓으면 그 사이와 양 끝의 틈은 서로 이웃하지 않는 안전한 자리라서, 그중 필요한 수만 고르면 조건 (나)가 자동으로 지켜집니다.","skillTags":["배치","틈선택","경우의수"],"title":"빈 주머니를 먼저 놓는 이유"},"id":"s3","latex":"\\text{빈 주머니 }4\\text{개 사이와 양 끝의 }5\\text{자리 중 }2\\text{자리에 }2\\text{개짜리 주머니를 놓는다: }{}_5C_2"},{"id":"s4","latex":"\\text{남은 세 틈에 }1\\text{개짜리 주머니 }4\\text{개를 나누어 놓는다: }{}_3H_4={}_6C_2"},{"id":"s5","latex":"{}_5C_2\\cdot{}_6C_2=10\\cdot15=150"},{"id":"s6","latex":"y=6\\text{이면 }(x,y,z)=(3,6,1)"},{"id":"s7","latex":"\\text{빈 주머니 }3\\text{개가 만든 }4\\text{자리 중 }1\\text{자리에 }2\\text{개짜리를 놓는다: }{}_4C_1"},{"id":"s8","latex":"\\text{남은 세 틈에 }1\\text{개짜리 }6\\text{개를 나누어 놓는다: }{}_3H_6={}_8C_2"},{"id":"s9","latex":"{}_4C_1\\cdot{}_8C_2=4\\cdot28=112"},{"id":"s10","latex":"150+112=262"},{"id":"s11","latex":"\\therefore\\ \\boxed{262}"}],"track":"확률과 통계"};</script>
<script>window.HandStudyGuide={"itemId":24991,"sourceHash":"a48c1803bf2b72558b9b11b7a55302215d1907e2c3bbe7bc786cbc8a7795a6e1","contentHash":"c59bd02772fb8eae60efee6b458d6ed4bb225d00e1e720a373b8ca4adf31c205","overview":{"goal":"빈 주머니를 칸막이처럼 먼저 놓아 2개 든 주머니가 다른 채운 주머니와 이웃하지 않게 배치해요.","firstLook":"공의 개수가 2인 주머니 주위는 반드시 비어 있어야 해요. 빈 주머니를 먼저 늘어놓으면 그 사이와 양 끝의 자리가 서로 떨어진 안전한 자리가 돼요.","conditions":[{"label":"주머니별 공의 수","meaning":"각 주머니에는 \\(0,1,2\\)개의 공만 들어갈 수 있고 전체 공은 \\(8\\)개예요."},{"label":"한 개 든 주머니","meaning":"공이 \\(1\\)개인 주머니 수는 \\(4\\)개 또는 \\(6\\)개이므로 두 경우를 따로 세어요."},{"label":"이웃 조건","meaning":"공이 \\(2\\)개 든 주머니의 바로 왼쪽과 오른쪽에는 공이 없어야 해요."}]},"chapters":[{"id":"c1","label":"세 종류 주머니의 개수를 정해요","stepIds":["s1","s2"],"question":"공이 0개, 1개, 2개인 주머니 수는 각 경우에 어떻게 정해질까요?","hint":"그 수를 \\(x,y,z\\)라 두고 주머니 수와 공 수를 각각 식으로 나타내요.","explanation":"공이 \\(0,1,2\\)개인 주머니 수를 각각 \\(x,y,z\\)라 하면 전체 주머니 수에서 \\(x+y+z=10\\), 전체 공 수에서 \\(y+2z=8\\)이에요. \\(y=4\\)를 넣으면 \\(z=2\\), \\(x=4\\)이므로 \\((x,y,z)=(4,4,2)\\)예요. 뒤의 경우를 위해 \\(y=6\\)도 미리 보면 \\(z=1\\), \\(x=3\\)이에요.","check":{"prompt":"\\(y=4\\)일 때 \\(z\\)가 \\(2\\)인 이유는 무엇인가요?","answer":"한 개 든 주머니가 공 \\(4\\)개를 쓰므로 남은 공 \\(4\\)개는 두 개씩 들어가 \\(z=2\\)가 돼요."}},{"id":"c2","label":"한 개 든 주머니가 4개인 경우를 세어요","stepIds":["s3","s4","s5"],"question":"빈 주머니 \\(4\\)개를 먼저 놓으면 왜 \\(150\\)가지가 나올까요?","hint":"빈 주머니 사이와 양 끝의 다섯 자리를 보고, 2개짜리를 놓은 자리는 1개짜리에게 금지해요.","explanation":"빈 주머니 \\(4\\)개를 일렬로 놓으면 사이의 \\(3\\)자리와 양 끝을 합쳐 모두 \\(5\\)개의 자리가 생겨요. 각 자리에 주머니를 놓으면 서로 다른 자리의 주머니 사이에는 빈 주머니가 끼므로, 이 가운데 \\(2\\)자리를 골라 2개 든 주머니를 하나씩 놓으면 서로 이웃하지 않아요. 방법은 \\({}_5\\mathrm C_2=10\\)가지예요.\n\n2개 든 주머니가 놓인 두 자리에는 1개 든 주머니를 함께 둘 수 없어요. 남은 \\(3\\)자리에 1개 든 주머니 \\(4\\)개를 순서를 고려하지 않고 나누어 놓으며, 한 자리에 여러 개를 연달아 놓아도 돼요. 방법은 중복조합 \\({}_3\\mathrm H_4={}_6\\mathrm C_2=15\\)가지예요. 따라서 이 경우는 \\(10\\times15=150\\)가지예요.","check":{"prompt":"1개 든 주머니를 한 자리에 여러 개 놓아도 조건 (나)를 어기지 않는 이유는 무엇인가요?","answer":"그 자리에는 2개 든 주머니가 없고, 여러 1개짜리끼리 이웃하는 것은 금지되지 않았기 때문이에요."}},{"id":"c3","label":"한 개 든 주머니가 6개인 경우를 세어요","stepIds":["s6","s7","s8","s9"],"question":"빈 주머니가 \\(3\\)개이고 2개 든 주머니가 하나일 때는 몇 가지일까요?","hint":"네 자리 가운데 하나를 2개짜리에 주고, 남은 세 자리에 1개짜리 여섯 개를 나누어요.","explanation":"이번에는 \\((x,y,z)=(3,6,1)\\)이에요. 빈 주머니 \\(3\\)개가 만드는 사이와 양 끝의 자리는 \\(4\\)개이고, 그중 2개 든 주머니를 놓을 한 자리를 고르는 방법은 \\({}_4\\mathrm C_1=4\\)가지예요.\n\n그 자리를 제외한 \\(3\\)자리에 1개 든 주머니 \\(6\\)개를 나누는 방법은 \\({}_3\\mathrm H_6={}_8\\mathrm C_2=28\\)가지예요. 따라서 이 경우는 \\(4\\times28=112\\)가지예요.","check":{"prompt":"중복조합 \\({}_3\\mathrm H_6\\)을 조합으로 바꾸면 무엇인가요?","answer":"\\({}_{3+6-1}\\mathrm C_6={}_8\\mathrm C_6={}_8\\mathrm C_2=28\\)이에요."}},{"id":"c4","label":"서로 겹치지 않는 두 경우를 더해요","stepIds":["s10","s11"],"question":"마지막에는 왜 두 경우의 수를 더할까요?","hint":"한 배치에서 1개 든 주머니 수가 동시에 4개와 6개일 수 있는지 생각해요.","explanation":"첫 번째 경우는 1개 든 주머니가 \\(4\\)개이고 두 번째는 \\(6\\)개라 서로 겹치지 않아요. 따라서 두 경우를 더해 \\(150+112=262\\)예요.","check":{"prompt":"공을 구별하지 않는다는 조건은 어디에 반영되었나요?","answer":"각 자리에 몇 개의 1개짜리 주머니가 이어지는지만 세고, 개별 공의 순서를 따로 곱하지 않은 데 반영되었어요."}}],"takeaway":["이웃 금지 조건이 있으면 빈자리를 먼저 놓아 안전한 틈을 만들 수 있어요.","특별한 대상을 놓은 틈은 남은 대상의 배치에서 제외해야 이웃 조건이 자동으로 지켜져요.","서로 겹치지 않는 조건별 경우의 수는 각각 센 뒤 더해요."]};</script>
