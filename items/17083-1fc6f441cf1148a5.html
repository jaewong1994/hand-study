<script>window.HandStudyGuide={"itemId":17083,"sourceHash":"b038ea9301c229086decc3094e0dd2dd0206da31277b64f7a64bae6eb11aea6f","contentHash":"3f7841420d8da08946897ec4cc9d384f53f1e862286b6bf957ecc563ffb7b77e","overview":{"goal":"감소하는 기함수와 역함수의 미분을 이용해 \\(a,b\\)를 구해요.","firstLook":"\\(g(2)=0\\)은 \\(f(2)\\)와 \\(f^{-1}(2)\\)가 같다는 뜻이고, 감소성과 기함수 성질이 그 값을 정해 줘요.","conditions":[{"label":"도함수의 일정한 음의 부호","meaning":"\\(g(2)=0\\)은 \\(f(2)\\)와 \\(f^{-1}(2)\\)가 같다는 뜻이고, 감소성과 기함수 성질이 그 값을 정해 줘요."}]},"chapters":[{"id":"c1","label":"조건을 식으로 바꾸기","stepIds":["s1","s2","s3","s4","s5"],"question":"\\(f'(x)\\)의 부호는 왜 구간별로 일정한가요?","hint":"\\(f'(0)=-b<0\\)이고 \\(f'\\)가 0이 되지 않는다는 조건으로 전체 부호를 먼저 정하세요.","explanation":"\\(f'(0)=-b<0\\)이고 연속인 \\(f'\\)이 0이 되지 않으므로 전체에서 음수예요. 또 \\(f\\)는 기함수예요. \\(h(0)=g(0)=0\\)이므로 \\(g(2)=0\\)에서 \\(f(2)=f^{-1}(2)\\)예요. 이 공통값을 \\(y\\)라 하면 \\(f(2)=y\\), \\(f(y)=2\\)이고, 감소함수에서 \\(f(2)<f(0)=0\\)이므로 \\(y<0\\)예요. \\(z=-y>0\\)라 두면 기함수 성질에서 \\(f(2)=-z, f(z)=-2\\)예요. 만약 \\(z>2\\)이면 감소성 때문에 \\(f(z)<f(2)\\), 즉 \\(-2<-z\\)여서 \\(z<2\\)라는 모순이 생겨요. \\(z<2\\)도 같은 방식으로 \\(z>2\\)라는 모순이므로 \\(z=2\\), 곧 \\(y=-2\\)예요. 따라서 \\(f(2)=-2\\)를 대입하면 \\(4a+b=5\\)예요.","check":{"prompt":"\\(f'(x)\\)의 부호가 항상 음수인 이유는 무엇인가요?","answer":"연속인 \\(f'\\)이 0이 되는 점이 없으므로 부호가 바뀔 수 없어요."}},{"id":"c2","label":"역함수 미분으로 두 계수 결정","stepIds":["s6","s7","s8","s9","s10","s11","s12"],"question":"\\(g'(2)=0\\) 갈래는 왜 버리나요?","hint":"\\(g'(2)=0\\)이면 \\(f'(2)-1/f'(2)=0\\)이고, \\(f'(2)<0\\)인 근을 기존 식과 연립하세요.","explanation":"역함수 미분으로 \\(g'(2)=f'(2)-1/f'(2)\\). 합성함수 미분과 짝함수인 \\(g'\\)을 쓰면 \\(h'(2)=g'(2)f'(2)\\). 조건은 \\(g'(2)\\{1+5f'(2)\\}=0\\). 첫 갈래 \\(f'(2)=-1\\)은 \\(a=b\\)가 되어 제외되고, 따라서 \\(f'(2)=-1/5\\), 즉 \\(28a-3b=5\\). 연립하면 \\(a=1/2,b=3\\), 답은 \\(4(b-a)=10\\)예요.","check":{"prompt":"\\(g'(2)=0\\) 갈래는 왜 버리나요?","answer":"\\(f'(2)=-1\\)을 기존 식과 연립하면 \\(a=b=1\\)이 되어 서로 다른 양수 조건에 어긋나요."}}],"takeaway":["도함수가 연속이고 영이 되지 않으면 한 점의 부호로 전체 부호를 정할 수 있어요.","감소하는 기함수의 두 점 순환은 두 점의 순서를 비교하면 값이 서로 반대임을 확인할 수 있어요."]};</script>
