<script>window.HandStudyGuide={"itemId":24692,"sourceHash":"f99aa1026ff04322c90f04f633b10ef8b1d7df6ea4bd1fffd41df051febfaf09","contentHash":"aa31d3cc39e7009384f213257bcc1226476fc57602cb945763f993ce47f7e3e8","overview":{"goal":"20의 인덱스를 거꾸로 추적해 첫항을 구하고, 이진 구간별 합의 등비 관계로 63항까지 더해요.","firstLook":"\\(a_{2n}\\) 식은 짝수 인덱스를 절반으로 줄일 수 있어요. \\(20\\to10\\to5\\)처럼 거꾸로 가며 \\(a_1\\)을 찾으세요.","conditions":[{"label":"두 점화식","meaning":"같은 부모 \\(n\\)에서 나오는 \\(2n,\\ 2n+1\\) 두 항의 합은 \\(3a_n\\)이에요."}]},"chapters":[{"id":"c1","label":"주어진 항에서 첫항까지 거꾸로 가요","stepIds":["s1"],"question":"\\(20\\to10\\to5\\) 이후 홀수 인덱스 식은 어떻게 거꾸로 쓰나요?","hint":"\\(a_5=2a_2+1\\)을 사용하세요.","explanation":"\\(a_{20}=a_{10}-1=1\\)에서 \\(a_{10}=2\\), 이어 \\(a_5=3\\)이에요. 또 \\(a_5=2a_2+1\\)이므로 \\(a_2=1\\), \\(a_2=a_1-1\\)이므로 \\(a_1=2\\)예요.","check":{"prompt":"\\(a_{10}=2\\)에서 \\(a_5=3\\)이 되는 이유는 무엇인가요?","answer":"\\(a_{2n}=a_n-1\\)에 \\(n=5\\)를 넣으면 \\(a_{10}=a_5-1\\)이기 때문이에요."}},{"id":"c2","label":"한 층의 합이 세 배가 됨을 보여요","stepIds":["s2","s3","s4"],"question":"인덱스 n 하나가 다음 층에서 만드는 두 항의 합은 얼마인가요?","hint":"두 점화식을 더하세요.","explanation":"\\(a_{2n}+a_{2n+1}=(a_n-1)+(2a_n+1)=3a_n\\)이에요. \\(T_j=\\sum_{n=2^j}^{2^{j+1}-1}a_n\\)로 두면 다음 층의 항들은 현재 층 각 n에서 두 개씩 나오므로 \\(T_{j+1}=3T_j\\)예요. \\(T_0=a_1=2\\)라 \\(T_j=2\\cdot3^j\\)예요.","check":{"prompt":"다음 층의 인덱스 범위는 왜 정확히 두 배인가요?","answer":"\\(n\\)이 \\(2^j\\)부터 \\(2^{j+1}-1\\)까지 움직이면 \\(2n\\)과 \\(2n+1\\)이 \\(2^{j+1}\\)부터 \\(2^{j+2}-1\\)까지 빠짐없이 한 번씩 만들기 때문이에요."}},{"id":"c3","label":"63까지 층별 합을 더해요","stepIds":["s5","s6"],"question":"63은 어느 층의 마지막 인덱스인가요?","hint":"\\(63=2^6-1\\)을 사용하세요.","explanation":"1부터 63까지는 \\(j=0\\)부터 \\(j=5\\)까지 여섯 층이에요. 따라서 합은 \\(\\sum_{j=0}^5 2\\cdot3^j=2(3^6-1)/(3-1)=3^6-1=728\\)이고 정답은 ④예요.","check":{"prompt":"마지막 층은 왜 \\(j=5\\)인가요?","answer":"\\(j=5\\)인 층의 범위가 \\(2^5=32\\)부터 \\(2^6-1=63\\)까지이기 때문이에요."}}],"takeaway":["짝수·홀수 인덱스 점화식은 같은 부모에서 생기는 두 항을 묶어 합을 단순화해요.","2의 거듭제곱 구간으로 나누면 이진 점화식의 층 구조가 보여요."]};</script>
