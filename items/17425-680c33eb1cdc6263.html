<script>window.HandStudyGuide={"itemId":17425,"sourceHash":"aadb79718cff76eb7ff3f394e98c74a62a6aa231cb554e4a029899329546344c","contentHash":"841e3b1c519b9ac1290fd7e4a13ba4314858fb00120c8e0a2f77ca6ddbe78732","overview":{"goal":"원문대로 정의역과 공역이 모두 \\(X=\\{1,2,3,4,5\\}\\)임을 확인하고, 홀수 함숫값의 위치 수에 따라 치역 세 종류를 세어요.","firstLook":"다섯 함숫값의 합이 짝수이려면 홀수인 함숫값의 개수가 짝수여야 해요. \\(X\\)에는 홀수 세 종류와 짝수 두 종류가 있어요.","conditions":[{"label":"(가)","meaning":"홀수 함숫값이 나오는 입력의 개수는 \\(0,2,4\\)예요."},{"label":"(나)","meaning":"선택한 세 종류가 모두 실제로 한 번 이상 나와야 해요."}]},"chapters":[{"id":"c1","label":"홀수 함숫값 두 개인 경우를 나눠요","stepIds":["s1","s2","s3"],"question":"홀수 함숫값이 두 개일 때 치역의 홀짝 구성은 어떤 두 경우뿐일까요?","hint":"치역은 세 종류이고 실제 홀수 출력 위치는 두 자리예요.","explanation":"홀수 출력 수 \\(n\\)은 \\(0,2,4\\)예요. \\(n=0\\)이면 출력이 짝수 \\(2,4\\) 두 종류뿐이라 치역 세 종류가 될 수 없어요. \\(n=2\\)에서 치역이 홀수 한 종류·짝수 두 종류이면 홀수값 선택 \\(3\\)가지, 홀수 위치 \\({}_5\\mathrm C_2\\)가지, 남은 세 위치가 두 짝수값을 모두 쓰는 수 \\(2^3-2\\)라 \\(3\\cdot10\\cdot6=180\\)이에요. 치역이 홀수 두 종류·짝수 한 종류이면 홀수쌍 \\({}_3\\mathrm C_2\\), 짝수값 \\(2\\)가지, 홀수 위치 \\({}_5\\mathrm C_2\\), 두 홀수값을 두 자리에 모두 놓는 \\(2!\\)을 곱해 \\(120\\)이에요.","check":{"prompt":"첫 경우의 \\(2^3-2\\)에서 빼는 두 배치는 무엇인가요?","answer":"세 짝수 위치가 모두 \\(2\\)이거나 모두 \\(4\\)여서 짝수 두 종류를 다 쓰지 못하는 배치예요."}},{"id":"c2","label":"홀수 함숫값 네 개인 경우를 세어요","stepIds":["s4"],"question":"홀수 출력이 네 개면 왜 치역은 홀수 두 종류와 짝수 한 종류여야 할까요?","hint":"짝수 출력 위치가 한 자리뿐이라는 점을 사용해요.","explanation":"짝수 위치가 한 개뿐이라 서로 다른 짝수 두 종류를 동시에 쓸 수 없어요. 따라서 치역은 홀수 두 종류와 짝수 한 종류예요. 홀수쌍 \\({}_3\\mathrm C_2\\), 짝수값 \\(2\\)가지, 짝수 위치 \\(5\\)가지, 나머지 네 자리에 두 홀수값을 모두 쓰는 \\(2^4-2\\)가지를 곱해 \\(3\\cdot2\\cdot5\\cdot14=420\\)이에요.","check":{"prompt":"네 홀수 위치의 배치에서 왜 \\(2\\)를 빼나요?","answer":"네 자리 모두가 같은 한 홀수값인 두 배치는 선택한 홀수 두 종류를 모두 쓰지 못하기 때문이에요."}},{"id":"c3","label":"서로 겹치지 않는 경우를 더해요","stepIds":["s5"],"question":"세 묶음의 합은 얼마인가요?","hint":"홀수 출력 수와 치역의 홀짝 구성이 달라 서로 겹치지 않아요.","explanation":"세 경우는 각각 \\(180,120,420\\)개이고 서로 겹치지 않으므로 전체는 \\(180+120+420=720\\)개예요.","check":{"prompt":"홀수 출력이 \\(0\\)인 경우가 합에 없는 이유는 무엇인가요?","answer":"공역에서 쓸 수 있는 짝수값이 \\(2,4\\) 두 종류뿐이라 치역 원소가 세 개가 될 수 없어요."}}],"takeaway":["합의 홀짝은 홀수인 항의 개수의 홀짝으로 바꿔요.","치역의 크기가 정해지면 고른 출력값이 모두 실제로 쓰이도록 한쪽 값만 쓰는 배치를 빼요.","출력 위치 수가 적으면 여러 종류를 동시에 실현할 수 없는 치역 구성을 먼저 제외해요."]};</script>
