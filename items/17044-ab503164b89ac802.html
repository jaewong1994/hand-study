<script>window.HandStudyGuide={"itemId":17044,"sourceHash":"df37e0b8d60c37202f6ebb4eabd141ddc4032d8b5ce68454988532bc93cb3164","contentHash":"9d4483b712ea8f4618dc1b6ed00e0dcc645293a8a53541dc01616fe7c8835b10","overview":{"goal":"타원의 초점 성질과 각의 이등분선 성질로 \\(CP\\)를 구해요.","firstLook":"원은 두 직선에 모두 접하고 중심이 두 초점 사이에 있으므로 \\(PC\\)는 \\(\\angle FPF'\\)의 이등분선이에요.","conditions":[{"label":"타원","meaning":"초점은 \\((\\pm3,0)\\)이고 \\(PF+PF'=8\\)이에요."},{"label":"두 직선에 접하는 원","meaning":"중심은 두 직선에서 같은 거리에 있어 각의 이등분선 위에 있어요."}]},"chapters":[{"id":"c1","label":"초점 거리와 반각을 연결해요","stepIds":["s1","s2","s3","s4"],"question":"\\(\\cos^2\\theta\\)가 왜 \\(7/(mn)\\)이 될까요?","hint":"삼각형 \\(FPF'\\)에 코사인법칙을 쓴 뒤 반각 공식을 사용해요.","explanation":"타원의 \\(c^2=16-7=9\\)이므로 \\(F=(3,0),F'=(-3,0)\\)이고 \\(FF'=6\\)이에요. \\(m=PF,n=PF'\\)라 두면 \\(m+n=8\\)이에요. \\(\\angle FPF'=2\\theta\\)라 하면 코사인법칙으로 \\(\\cos2\\theta=(m^2+n^2-36)/(2mn)\\)예요. 따라서 \\(\\cos^2\\theta=(1+\\cos2\\theta)/2=((m+n)^2-36)/(4mn)=7/(mn)\\)이에요.","check":{"prompt":"분자에 \\(36\\)이 들어가는 이유는 무엇인가요?","answer":"두 초점 사이의 거리 \\(FF'=6\\)의 제곱이기 때문이에요."}},{"id":"c2","label":"각의 이등분선 길이와 접점을 써요","stepIds":["s5","s6","s7"],"question":"\\(PQ\\)가 \\(CP\\cos\\theta\\)인 이유는 무엇인가요?","hint":"접점 \\(Q\\)에서 반지름 \\(CQ\\)는 접선 \\(PF'\\)에 수직이에요.","explanation":"각의 이등분선 정리에 따라 \\(F'C:CF=n:m\\)이고 \\(F'F=6\\)이므로 \\(F'C=3n/4, CF=3m/4\\)예요. 각의 이등분선 길이 관계로 \\(CP^2=mn-F'C\\cdot CF=7mn/16\\)이에요. 한편 삼각형 \\(PCQ\\)는 \\(Q\\)에서 직각이고 \\(P\\)의 각이 \\(\\theta\\)이므로 \\(PQ=CP\\cos\\theta\\)예요. 제곱을 곱하면 \\(PQ^2=(7mn/16)(7/mn)=49/16\\), 따라서 \\(PQ=7/4\\)예요.","check":{"prompt":"\\(PQ\\)에서 양의 제곱근을 택하는 이유는 무엇인가요?","answer":"\\(PQ\\)는 선분의 길이이므로 양수예요."}},{"id":"c3","label":"주어진 길이 조건으로 마무리해요","stepIds":["s8","s9","s10"],"question":"\\(m,n\\)을 각각 어떻게 정할까요?","hint":"\\(2PQ=PF\\)와 \\(m+n=8\\)을 함께 써요.","explanation":"\\(2PQ=PF\\)이므로 \\(m=2\\cdot7/4=7/2\\)이고 \\(n=8-m=9/2\\)예요. 따라서 \\(CP^2=7mn/16=7(63/4)/16=441/64\\), \\(CP=21/8\\)이에요. 요구한 값은 \\(24CP=24\\cdot21/8=63\\)이에요.","check":{"prompt":"구한 두 초점 거리의 합이 타원 조건과 맞나요?","answer":"\\(7/2+9/2=8\\)이므로 맞아요."}}],"takeaway":["타원의 한 점에서 두 초점까지 거리의 합은 장축의 길이예요.","두 직선에 접하는 원의 중심은 두 직선이 이루는 각의 이등분선 위에 있어요.","접점에서 반지름과 접선이 수직이라는 사실로 길이를 연결해요."]};</script>
