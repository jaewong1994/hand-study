<script>window.HandStudyRecord={"itemId":17224,"sourceLabel":"2021 평가원 고3 수학미적분 9월 30번","adminYear":2021,"grade":3,"month":9,"number":30,"track":"미적분","points":4,"scoreStatus":"confirmed_4_direct","questionText":"최고차항의 계수가 $9$인 삼차함수 $f \\left( x \\right)$가 다음 조건을 만족시킨다.\n(가) $\\lim _{x->0} {\\frac{\\sin \\left( \\pi \\times f \\left( x \\right) \\right)}{x} =0}$ (나) $f \\left( x \\right)$의 극댓값과 극솟값의 곱은 $5$이다. \n함수 $g \\left( x \\right)$는 $0 \\leq x\u003c1$일 때 $g \\left( x \\right)$$=f \\left( x \\right)$이고 모든 실수 $x$에 대하여 $g \\left( x+1 \\right) =g \\left( x \\right)$이다. $g \\left( x \\right)$가 실수 전체의 집합에서 연속일 때, $\\int _{0} ^{5} {x\\,g \\left( x \\right) dx} = \\frac{q}{p}$이다. $p+q$의 값을 구하시오. (단, $p$와 $q$는 서로소인 자연수이다.) [4점]","answer":"115","sourceHash":"0528124ac43ac507c76bd6b43d742bdb4c84eab4f6a43abf089d67fe212f90e6","steps":[{"id":"s1","latex":"\\sin(\\pi f(0))=0\\Rightarrow f(0)\\in\\mathbb Z"},{"id":"s2","latex":"\\lim_{x\\to0}\\frac{\\sin(\\pi f(x))}{x}=0\\Rightarrow f'(0)=0"},{"id":"s3","latex":"g\\text{가 }x=1\\text{에서 연속}\\Rightarrow f(1)=f(0)"},{"id":"s4","latex":"f(x)=9x^3-9x^2+d"},{"id":"s5","latex":"f(0)f(\\frac23)=d(d-\\frac43)=5\\Rightarrow d=3"},{"id":"s6","latex":"\\int_0^5xg(x)dx=5\\int_0^1uf(u)du+10\\int_0^1f(u)du"},{"id":"s7","latex":"=5\\cdot\\frac{21}{20}+10\\cdot\\frac94=\\frac{111}4"},{"id":"s8","latex":"p+q=115"}],"diagram":null,"contentHash":"e5e4c77bbe7938a5b05f374ef845c0661131c5a5912477cf146d706d89404934","questionHtml":"\u003cp class=\"hp\">최고차항의 계수가 \u003cspan class=\"heq\">\\(9\\)\u003c/span>인 삼차함수 \u003cspan class=\"heq\">\\(f \\left( x \\right)\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp htall\">(가) \u003cspan class=\"heq\">\\(\\lim\\limits_{x\\to 0} {\\dfrac{\\sin \\left( \\pi \\times f \\left( x \\right) \\right)}{x} =0}\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">(나) \u003cspan class=\"heq\">\\(f \\left( x \\right)\\)\u003c/span>의 극댓값과 극솟값의 곱은 \u003cspan class=\"heq\">\\(5\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp class=\"hp htall\">함수 \u003cspan class=\"heq\">\\(g \\left( x \\right)\\)\u003c/span>는 \u003cspan class=\"heq\">\\(0 \\leq x\\lt 1\\)\u003c/span>일 때 \u003cspan class=\"heq\">\\(g \\left( x \\right)\\)\u003c/span>\u003cspan class=\"heq\">\\(=f \\left( x \\right)\\)\u003c/span>이고 모든 실수 \u003cspan class=\"heq\">\\(x\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(g \\left( x+1 \\right) =g \\left( x \\right)\\)\u003c/span>이다. \u003cbr>\u003cspan class=\"heq\">\\(g \\left( x \\right)\\)\u003c/span>가 실수 전체의 집합에서 연속일 때, \u003cspan class=\"heq\">\\(\\int_{0}^{5} {x\\,g \\left( x \\right) dx} = \\dfrac{q}{p}\\)\u003c/span>이다. \u003cspan class=\"heq\">\\(p+q\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(p\\)\u003c/span>와 \u003cspan class=\"heq\">\\(q\\)\u003c/span>는 서로소인 자연수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"6bb4bc056a8bf00411619c6dbf6d8b6255d9a7296e550b78a38c81dc1ceba08b"};</script>
<script>window.HandStudyGuide={"itemId":17224,"sourceHash":"0528124ac43ac507c76bd6b43d742bdb4c84eab4f6a43abf089d67fe212f90e6","contentHash":"e5e4c77bbe7938a5b05f374ef845c0661131c5a5912477cf146d706d89404934","overview":{"goal":"삼각함수의 극한과 주기함수의 연속 조건으로 삼차함수를 정한 뒤, 다섯 주기의 가중 적분을 계산해요.","firstLook":"분모가 0으로 갈 때 분자가 0이 되는 것만으로는 극한값 0이 보장되지 않아요. 분자의 일차 변화까지 확인해야 해요.","conditions":[{"label":"삼각함수가 들어 있는 극한","meaning":"먼저 \\(f(0)\\)이 정수임을 얻고, 기본극한과 도함수의 정의로 \\(f'(0)=0\\)까지 얻어요."},{"label":"주기함수의 실수 전체 연속","meaning":"한 주기의 오른쪽 끝에서 다음 주기의 왼쪽 끝으로 이어질 때 \\(f(1)=f(0)\\)이어야 해요."},{"label":"두 극값의 곱","meaning":"앞 조건들로 남은 상수를 정하고, 정수 조건으로 불가능한 해를 제외해요."}]},"chapters":[{"id":"c1","label":"극한에서 두 조건 꺼내기","stepIds":["s1","s2","s3"],"question":"분자가 0으로 가야 한다는 사실에서 한 걸음 더 나아가, 왜 \\(f'(0)=0\\)도 필요할까요?","hint":"\\(f(0)=d\\)로 두고 \\(\\sin(\\pi f(x))\\)에 \\(d\\)를 더하고 뺀 뒤 두 극한의 곱으로 나누어 보세요.","explanation":"주어진 극한이 0이므로 먼저 분자도 0으로 가야 해요. 따라서 \\(\\sin(\\pi f(0))=0\\)이고 \\(f(0)=d\\)는 정수예요. 이제 \\(f(x)-d\\)를 이용하면\n\n\\(\\frac{\\sin(\\pi f(x))}{x}=(-1)^d\\frac{\\sin(\\pi(f(x)-d))}{\\pi(f(x)-d)}\\cdot\\pi\\frac{f(x)-f(0)}x\\)\n\n로 쓸 수 있어요. 첫 번째 비는 1에 가까워지고 두 번째 비는 도함수의 정의에 의해 \\(f'(0)\\)에 가까워져요. 전체 극한이 0이므로 \\(f'(0)=0\\)이에요.\n\n또 \\(g\\)는 길이 1마다 같은 값을 반복해요. \\(x=1\\)의 왼쪽에서는 \\(g(x)=f(x)\\)이므로 극한값이 \\(f(1)\\)이고, \\(x=1\\)에서의 값은 다음 주기의 시작값 \\(f(0)\\)이에요. 연속이려면 \\(f(1)=f(0)\\)이어야 해요.","check":{"prompt":"\\(f(0)\\)이 정수라는 조건만 만족하면 주어진 극한은 언제나 0일까요?","answer":"아니요. 그때 분자는 0으로 가지만, \\(x\\)와 같은 빠르기로 변할 수 있어요. 그 일차 변화의 계수인 \\(f'(0)\\)도 0이어야 해요."}},{"id":"c2","label":"삼차함수와 남은 상수 정하기","stepIds":["s4","s5"],"question":"최고차항 계수와 두 등식 조건을 넣으면 삼차함수는 어떤 한 매개변수 꼴로 줄어들까요?","hint":"일반적인 삼차식에 \\(f'(0)=0\\)과 \\(f(1)=f(0)\\)을 차례로 대입하세요.","explanation":"\\(f(x)=9x^3+ax^2+bx+d\\)로 두어요. \\(f'(0)=0\\)에서 \\(b=0\\)이고, \\(f(1)=f(0)\\)에서 \\(9+a=0\\)이므로 \\(a=-9\\)예요. 따라서 \\(f(x)=9x^3-9x^2+d\\)예요.\n\n도함수는 \\(f'(x)=27x^2-18x=9x(3x-2)\\)이므로 극값을 갖는 점은 \\(x=0\\), \\(x=2/3\\)이에요. 두 함숫값은 \\(f(0)=d\\), \\(f(2/3)=d-4/3\\)이어서 조건에 따라 \\(d(d-4/3)=5\\)예요. 이를 정리하면 \\(3d^2-4d-15=0=(3d+5)(d-3)\\)이므로 \\(d=3\\) 또는 \\(d=-5/3\\)이에요. 그런데 앞에서 \\(d=f(0)\\)은 정수였으므로 \\(d=3\\)만 남아요.","check":{"prompt":"두 후보 가운데 \\(-5/3\\)을 제외하는 근거는 무엇인가요?","answer":"첫 번째 극한에서 \\(f(0)=d\\)가 정수라는 조건을 얻었기 때문이에요."}},{"id":"c3","label":"주기별 적분을 한꺼번에 계산하기","stepIds":["s6","s7","s8"],"question":"구간을 다섯 개로 나누었을 때 각 구간의 \\(x\\)와 \\(g(x)\\)는 한 주기 안의 변수로 어떻게 바뀔까요?","hint":"\\(j\\le x<j+1\\)에서 \\(x=j+u\\)로 두면 \\(0\\le u<1\\)이고 \\(g(x)=f(u)\\)예요.","explanation":"\\([0,5]\\)를 \\([j,j+1]\\)로 나누고 각 구간에서 \\(x=j+u\\)로 놓아요. 주기가 1이므로 \\(g(j+u)=f(u)\\)이고 \\(dx=du\\)예요. 따라서\n\n\\(\\int_0^5xg(x)\\,dx=\\sum_{j=0}^4\\int_0^1(j+u)f(u)\\,du=10\\int_0^1f(u)\\,du+5\\int_0^1u f(u)\\,du\\)\n\n예요. 여기서 \\(0+1+2+3+4=10\\)이고 같은 \\(u\\)항이 다섯 번 생겨 계수가 5가 돼요. \\(f(u)=9u^3-9u^2+3\\)을 대입하면 \\(\\int_0^1f(u)\\,du=9/4-3+3=9/4\\), \\(\\int_0^1u f(u)\\,du=9/5-9/4+3/2=21/20\\)이에요. 그러므로 전체 적분은 \\(10\\cdot9/4+5\\cdot21/20=111/4\\)예요. \\(p=4\\), \\(q=111\\)은 서로소이므로 \\(p+q=115\\)예요.","check":{"prompt":"가중치가 없는 적분의 계수는 왜 10이고, \\(u\\)가 붙은 적분의 계수는 왜 5인가요?","answer":"각 구간의 정수 부분 \\(j\\)를 모두 더하면 10이고, \\(u f(u)\\)는 다섯 구간에서 한 번씩 똑같이 나타나므로 5예요."}}],"takeaway":["분모가 0으로 가는 극한에서는 분자가 0이 되는지와 일차 변화가 사라지는지를 따로 확인해요.","주기적으로 이어 붙인 함수의 연속은 한 주기의 양 끝값이 같은지 확인하는 조건이에요.","여러 주기의 가중 적분은 각 구간에서 같은 한 주기 변수로 바꾸어 계수의 합을 계산해요."]};</script>
