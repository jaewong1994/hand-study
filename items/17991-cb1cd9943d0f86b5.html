<script>window.HandStudyRecord={"itemId":17991,"sourceLabel":"2024 교육청 고3 수학확통 3월 29번","adminYear":2024,"grade":3,"month":3,"number":29,"track":"확통","points":4,"scoreStatus":"confirmed_4_direct","questionText":"세 명의 학생에게 서로 다른 종류의 초콜릿 $3\\,$개와 같은 종류의 사탕 $5\\,$개를 다음 규칙에 따라 남김없이 나누어 주는 경우의 수를 구하시오. (단, 사탕을 받지 못하는 학생이 있을 수 있다.) \n[4점]\n (가) 적어도 한 명의 학생은 초콜릿을 받지 못한다. (나) 각 학생이 받는 초콜릿의 개수와 사탕의 개수의 합은 $2\\,$ 이상이다.","answer":"117","sourceHash":"0ba09c02e23dec1d02c10b362c360c3c6479c30845e8cbaa963ad2297fa28232","steps":[{"id":"s1","latex":"\\text{초콜릿을 받는 학생이 }2\\text{명}:\\quad3(2^3-2)=18"},{"id":"s2","latex":"\\text{초콜릿 }(1,2,0)\\Rightarrow\\text{사탕을 먼저 }(1,0,2)\\text{개 지급}"},{"id":"s3","latex":"18\\cdot{}_3\\mathrm H_2=18\\cdot6=108"},{"id":"s4","latex":"\\text{초콜릿을 받는 학생이 }1\\text{명}:\\quad3\\text{가지}"},{"id":"s5","latex":"\\text{나머지 두 학생에게 사탕을 }2\\text{개씩 지급}\\Rightarrow{}_3\\mathrm H_1=3"},{"id":"s6","latex":"3\\cdot3=9,\\qquad108+9=117"}],"diagram":null,"contentHash":"8a3ba777a51df78788294723e85d016366ada263c8a623c19cc4df9d519b9118","questionHtml":"\u003cp class=\"hp\">세 명의 학생에게 서로 다른 종류의 초콜릿 \u003cspan class=\"heq\">\\(3\\,\\)\u003c/span>개와 같은 종류의 사탕 \u003cspan class=\"heq\">\\(5\\,\\)\u003c/span>개를 다음 규칙에 따라 남김없이 나누어 주는 경우의 수를 구하시오. (단, 사탕을 받지 못하는 학생이 있을 수 있다.)\u003c/p>\u003cp class=\"hp\">\u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) 적어도 한 명의 학생은 초콜릿을 받지 못한다.\u003c/p>\u003cp class=\"hp\">(나) 각 학생이 받는 초콜릿의 개수와 사탕의 개수의 합은 \u003cbr>\u003cspan class=\"heq\">\\(2\\,\\)\u003c/span> 이상이다.\u003c/p>\u003c/div>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"cb1cd9943d0f86b5623a5eedcad21beaa92ed1de7bc421e853c646ed098bdc7c"};</script>
<script>window.HandStudyGuide={"itemId":17991,"sourceHash":"0ba09c02e23dec1d02c10b362c360c3c6479c30845e8cbaa963ad2297fa28232","contentHash":"8a3ba777a51df78788294723e85d016366ada263c8a623c19cc4df9d519b9118","overview":{"goal":"초콜릿을 받는 학생 수로 경우를 나누고, 부족한 개수만큼 사탕을 먼저 준 뒤 남은 사탕을 나눠요.","firstLook":"초콜릿을 받는 학생은 (가) 때문에 한 명 또는 두 명이에요. 서로 다른 초콜릿의 배분을 먼저 정하면 각 학생에게 최소 몇 개의 사탕이 필요한지가 결정돼요.","conditions":[{"label":"(가)","meaning":"초콜릿을 받는 학생 수는 1명 또는 2명이에요."},{"label":"(나)","meaning":"초콜릿과 사탕을 합쳐 각 학생이 적어도 2개를 받아야 해요."}]},"chapters":[{"id":"c1","label":"두 명이 초콜릿을 받는 경우를 세어요","stepIds":["s1","s2","s3"],"question":"이 경우 초콜릿 배분이 왜 \\(3(2^3-2)=18\\)가지인가요?","hint":"못 받는 학생을 먼저 고르고, 남은 두 학생이 둘 다 받도록 세 초콜릿을 배분해요.","explanation":"초콜릿을 못 받는 학생을 고르는 방법이 \\(3\\)가지예요. 서로 다른 세 초콜릿을 나머지 두 학생에게 주는 방법은 \\(2^3\\)가지지만, 한 학생이 세 개를 모두 받는 두 경우를 빼야 두 학생이 모두 받아요. 따라서 \\(3(2^3-2)=18\\)가지이고, 두 학생의 초콜릿 개수는 \\(1,2\\), 못 받는 학생은 \\(0\\)개예요. (나)를 맞추려면 각각 사탕을 최소 \\(1,0,2\\)개 먼저 줘야 해요. 사탕 3개를 먼저 썼으니 남은 2개를 세 학생에게 나누는 방법은 \\({}_{3}\\mathrm{H}_{2}={}_{4}\\mathrm{C}_{2}=6\\)가지예요. 따라서 \\(18\\times6=108\\)가지예요.","check":{"prompt":"초콜릿을 3개와 0개로 나눈 경우를 왜 여기서 빼나요?","answer":"그러면 실제로 초콜릿을 받는 학생이 한 명뿐이어서 '두 명이 받는 경우'에 속하지 않아요."}},{"id":"c2","label":"한 명만 초콜릿을 받는 경우를 세어요","stepIds":["s4","s5"],"question":"남은 사탕 한 개는 왜 세 학생 누구에게나 줄 수 있나요?","hint":"초콜릿을 못 받은 두 학생에게 필요한 사탕부터 두 개씩 주세요.","explanation":"초콜릿 세 개를 모두 받을 학생을 고르는 방법은 \\(3\\)가지예요. 이 학생은 이미 물건을 3개 받아 (나)를 만족해요. 초콜릿을 못 받은 두 학생에게는 사탕을 2개씩 먼저 주어야 하므로 사탕 4개를 쓰고 1개가 남아요. 남은 사탕 한 개는 세 학생 중 누구에게 주어도 모든 조건이 유지되므로 \\({}_{3}\\mathrm{H}_{1}=3\\)가지예요. 따라서 이 경우는 \\(3\\times3=9\\)가지예요.","check":{"prompt":"초콜릿을 받은 학생에게 남은 사탕을 줘도 되는 이유는 무엇인가요?","answer":"(나)는 합이 2 이상이라는 아래쪽 조건일 뿐, 많이 받는 것을 제한하지 않아요."}},{"id":"c3","label":"빠진 경우 없이 합쳐요","stepIds":["s6"],"question":"두 경우 외에 따로 셀 경우가 있을까요?","hint":"초콜릿 세 개를 남김없이 주면서 적어도 한 명이 못 받는다는 조건을 다시 봐요.","explanation":"초콜릿을 받는 학생이 0명일 수는 없고, 3명이 모두 받는 경우는 (가)에 어긋나요. 따라서 한 명 또는 두 명이 받는 두 경우가 전부이고 서로 겹치지 않아요. 전체 경우의 수는 \\(108+9=117\\)이에요.","check":{"prompt":"세 학생이 초콜릿을 하나씩 받는 배분은 왜 제외하나요?","answer":"초콜릿을 받지 못한 학생이 한 명도 없어 조건 (가)를 만족하지 않아요."}}],"takeaway":["서로 다른 물건을 먼저 배분하면 같은 물건으로 채워야 할 최소량이 정해져요.","각자 최소 개수 조건은 부족한 만큼 먼저 준 뒤 남은 같은 물건을 중복조합으로 나눠요.","받는 사람 수로 나눈 경우가 전체를 빠짐없이 덮는지 마지막에 확인해요."]};</script>
