<script>window.HandStudyRecord={"itemId":16656,"sourceLabel":"2020 교육청 고3 수리가형 3월 21번","adminYear":2020,"grade":3,"month":3,"number":21,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"$0\\,$이 아닌 실수 $m\\,$에 대하여 두 함수\n $f(x)=2x ^{\\,3} -8x$, \n $g(x)= {\\begin{cases}- \\frac{47}{m} x+ \\frac{4}{m ^{\\,3}} && \\left( x<0 \\right) \\\\ \\, 2m x+ \\frac{4}{m ^{\\,3}}&& \\left( x \\geq 0 \\right)\\end{cases}}$ \n이 있다. 실수 $x\\,$에 대하여 $f ( x )\\,$와 $g ( x )$ 중 크지 않은 값을 $h(x)\\,$라 할 때, <보기>에서 옳은 것만을 있는 대로 고른 것은?\n[4점]\n< 보 기 >ㄱ. $m=-1\\,$일 때, $h \\left( \\frac{1}{2} \\right) \\,$$=-5\\,$이다.ㄴ. $m= -1\\,$일 때, 함수 $h ( x ) \\,$가 미분가능하지 않은 $x\\,$의 개수는 $2\\,$이다.ㄷ. 함수 $h ( x ) \\,$가 미분가능하지 않은 $x\\,$의 개수가 $1\\,$인 양수 $m\\,$의 최댓값은 $6\\,$이다.\n① ㄱ ② ㄱ, ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ\n단답형","answer":"⑤","sourceHash":"67f1e5f30bc15dd63170e9aa87693481fe2c0b9cf2daac964853bdb29d2f5a0d","steps":[{"id":"s1","latex":"m=-1,\\ x\\ge0:\\quad g(x)=-2x-4"},{"id":"s2","latex":"f\\!\\left(\\frac12\\right)=-\\frac{15}{4},\\quad g\\!\\left(\\frac12\\right)=-5\\Rightarrow\\mathrm{I}\\text{ 참}"},{"id":"s3","latex":"m=-1,\\ x\\ge0:\\quad f-g=2(x-1)^2(x+2)\\ge0"},{"id":"s4","latex":"x<0:\\quad f-g=2x^3-55x+4\\text{의 부호변화 영점은 }1\\text{개}"},{"id":"s5","latex":"x=0\\text{에서 }h=g,\\quad (g\\prime)_-(0)=47\\ne-2=(g\\prime)_+(0)\\Rightarrow\\mathrm{II}\\text{ 참}"},{"id":"s6","latex":"m>0:\\quad x>0\\text{에서 }f-g\\text{의 부호변화 영점은 }1\\text{개}"},{"id":"s7","latex":"x<0:\\quad D_m(x)=f(x)-g(x)=2x^3-8x+\\frac{47x}{m}-\\frac4{m^3}"},{"id":"s8","latex":"\\frac{\\partial D_m(x)}{\\partial m}=-\\frac{47x}{m^2}+\\frac{12}{m^4}>0\\qquad(x<0)"},{"id":"s9","latex":"m=6:\\quad D_6(x)=\\frac1{54}(6x+1)^2(3x-1)\\le0\\qquad(x<0)"},{"id":"s10","latex":"\\text{모든 }x<0\\text{에서 }D_m(x)\\le0\\Longleftrightarrow0<m\\le6\\Rightarrow\\mathrm{III}\\text{ 참}"},{"id":"s11","latex":"\\boxed{\\mathrm{I,II,III}}"}],"diagram":null,"contentHash":"0daac1c816d468d0943767b1940c3ef398faa600122edfa6e74650ccaf2d7374","questionHtml":"<p class=\"hp\"><span class=\"heq\">\\(0\\,\\)<\/span>이 아닌 실수 <span class=\"heq\">\\(m\\,\\)<\/span>에 대하여 두 함수<\/p><p class=\"hp\">&emsp;<span class=\"heq\">\\(f(x)=2x^{\\,3} -8x\\)<\/span>,<\/p><p class=\"hp htall\">&emsp;<span class=\"heq\">\\(g(x)= {\\begin{cases}- \\dfrac{47}{m} x+ \\dfrac{4}{m^{\\,3}} && \\left( x\\lt 0 \\right) \\\\ \\, 2m x+ \\dfrac{4}{m^{\\,3}}&& \\left( x \\geq 0 \\right)\\end{cases}}\\)<\/span><\/p><p class=\"hp\">이 있다. 실수 <span class=\"heq\">\\(x\\,\\)<\/span>에 대하여 <span class=\"heq\">\\(f ( x )\\,\\)<\/span>와 <span class=\"heq\">\\(g ( x )\\)<\/span> 중 크지 않은 값을 <span class=\"heq\">\\(h(x)\\,\\)<\/span>라 할 때, &lt;보기&gt;에서 옳은 것만을 있는 대로 고른 것은?<\/p><p class=\"hp\"><span class=\"hscore\">[4점]<\/span><\/p><div class=\"hbox\"><div style=\"text-align:center;font-weight:700;margin:0 0 6px\">&lt; 보 기 &gt;<\/div><p class=\"hp htall\">ㄱ.<span class=\"heq\">\\(m=-1\\,\\)<\/span>일 때, <span class=\"heq\">\\(h \\left( \\dfrac{1}{2} \\right) \\,\\)<\/span><span class=\"heq\">\\(=-5\\,\\)<\/span>이다.<\/p><p class=\"hp\">ㄴ.<span class=\"heq\">\\(m= -1\\,\\)<\/span>일 때, 함수 <span class=\"heq\">\\(h ( x ) \\,\\)<\/span>가 미분가능하지 않은 <span class=\"heq\">\\(x\\,\\)<\/span>의 개수는 <span class=\"heq\">\\(2\\,\\)<\/span>이다.<\/p><p class=\"hp\">ㄷ.함수 <span class=\"heq\">\\(h ( x ) \\,\\)<\/span>가 미분가능하지 않은 <span class=\"heq\">\\(x\\,\\)<\/span>의 개수가 <span class=\"heq\">\\(1\\,\\)<\/span>인 양수 <span class=\"heq\">\\(m\\,\\)<\/span>의 최댓값은 <span class=\"heq\">\\(6\\,\\)<\/span>이다.<\/p><\/div><p class=\"hp\">① ㄱ&emsp;② ㄱ, ㄴ&emsp;③ ㄱ, ㄷ<\/p><p class=\"hp\">④ ㄴ, ㄷ&emsp;⑤ ㄱ, ㄴ, ㄷ<\/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"36abf40206b1e69dbdd9a6c26f9b0ba7ef7d53d4af6ae76bd888578ca3d9a899"};</script>
<script>window.HandStudyGuide={"itemId":16656,"sourceHash":"67f1e5f30bc15dd63170e9aa87693481fe2c0b9cf2daac964853bdb29d2f5a0d","contentHash":"0daac1c816d468d0943767b1940c3ef398faa600122edfa6e74650ccaf2d7374","overview":{"goal":"두 함수 중 작은 값을 고른 \\(h\\)가 어디에서 선택을 바꾸는지 조사해 세 보기를 판단해요.","firstLook":"\\(D_m(x)=f(x)-g(x)\\)의 부호가 바뀌는 교점에서는 \\(h\\)가 고르는 함수도 바뀌어요. 접하기만 하여 부호가 안 바뀌는 교점은 따로 구별해야 해요.","conditions":[{"label":"\\(m=-1\\)","meaning":"ㄱ은 두 함숫값을 직접 비교하고, ㄴ은 음수 구간의 교차와 \\(x=0\\)의 좌우 기울기를 세어요."},{"label":"\\(m>0\\)","meaning":"양수 구간의 한 교차 외에 음수 구간에서 선택이 바뀌지 않는 \\(m\\)의 범위를 찾아요."}]},"chapters":[{"id":"c1","label":"두 값 중 작은 값을 직접 골라요","stepIds":["s1","s2"],"question":"\\(m=-1,\\ x=1/2\\)에서 왜 \\(h\\)는 \\(g\\)의 값을 택할까요?","hint":"\\(f(1/2)\\)와 \\(g(1/2)\\)를 둘 다 계산해 더 작은 쪽을 고르세요.","explanation":"\\(m=-1\\)이고 \\(x\\ge0\\)이면 \\(g(x)=-2x-4\\)예요. 따라서 \\(f(1/2)=2(1/2)^3-8(1/2)=-15/4\\), \\(g(1/2)=-5\\)예요. \\(h\\)는 두 값 중 크지 않은 값을 택하므로 \\(-5<-15/4\\)에서 \\(h(1/2)=-5\\)이고 ㄱ은 참이에요.","check":{"prompt":"\\(h(1/2)\\)를 고를 때 비교하는 두 값은 무엇인가요?","answer":"\\(f(1/2)=-15/4\\)와 \\(g(1/2)=-5\\)이고, 더 작은 값은 \\(-5\\)예요."}},{"id":"c2","label":"교차와 접함을 구별해요","stepIds":["s3","s4","s5"],"question":"\\(x=1\\)에서 \\(f=g\\)인데도 미분 불가능한 점으로 세지 않는 이유는 무엇인가요?","hint":"\\(f-g=2(x-1)^2(x+2)\\)의 부호가 \\(1\\)의 양쪽에서 바뀌는지 보세요.","explanation":"\\(m=-1,\\ x\\ge0\\)에서 \\(f-g=2(x-1)^2(x+2)\\ge0\\)이므로 \\(h\\)는 계속 \\(g\\)를 선택해요. \\(x=1\\)에서는 두 함수가 만나지만 부호가 바뀌지 않아 선택이 바뀌지 않으므로 미분 불가능한 점이 아니에요. \\(x<0\\)에서는 \\(f-g=2x^3-55x+4\\)가 부호를 바꾸는 영점을 하나 가져 그 점에서 선택이 바뀌어요. 또 \\(x=0\\)의 양쪽에서도 \\(h=g\\)인데 \\(g\\)의 왼쪽 기울기는 \\(47\\), 오른쪽 기울기는 \\(-2\\)라 서로 달라요. 따라서 미분 불가능한 점은 음수 구간의 교차점과 \\(0\\), 모두 두 개라 ㄴ도 참이에요.","check":{"prompt":"함수값이 같은 점을 모두 미분 불가능한 점으로 세면 안 되는 이유는 무엇인가요?","answer":"두 함수가 접하고 같은 쪽 함수가 계속 더 작으면 \\(h\\)의 선택이 바뀌지 않아 매끄러울 수 있기 때문이에요."}},{"id":"c3","label":"양수 계수에서 음수 구간을 막아요","stepIds":["s6","s7","s8","s9","s10"],"question":"미분 불가능한 점을 하나만 남기려면 \\(x<0\\)에서 \\(D_m=f-g\\)가 어떤 부호여야 할까요?","hint":"\\(x>0\\)의 부호 변화 교점 하나는 이미 생기므로 음수 구간에서는 선택이 바뀌지 않아야 해요.","explanation":"\\(m>0\\)일 때 \\(x>0\\)에서는 \\(f-g\\)가 부호를 바꾸는 영점이 하나 있어 미분 불가능한 점 하나가 생겨요. \\(x=0\\) 근처에서는 \\(f-g<0\\)이라 \\(h=f\\)를 택하므로 조각함수 \\(g\\)의 기울기 차이는 드러나지 않아요. 따라서 음수 구간에서 추가 교차가 없으려면 모든 \\(x<0\\)에서\n\n\\(D_m(x)=2x^3-8x+\\dfrac{47x}{m}-\\dfrac4{m^3}\\le0\\)\n\n이어야 해요. 고정된 \\(x<0\\)에 대해 \\(\\partial D_m/\\partial m=-47x/m^2+12/m^4>0\\)이므로 \\(m\\)이 커질수록 \\(D_m(x)\\)도 커져요. \\(m=6\\)에서는\n\n\\(D_6(x)=\\dfrac1{54}(6x+1)^2(3x-1)\\le0\\quad(x<0)\\)\n\n이에요. 그래서 \\(0<m\\le6\\)에서는 전부 음이 아닌 쪽으로 올라오지 못하고, \\(m>6\\)이면 \\(x=-1/6\\)에서 값이 양수가 되어 추가 교차가 생겨요. 가능한 양수 \\(m\\)의 최댓값은 \\(6\\)이므로 ㄷ도 참이에요.","check":{"prompt":"\\(m>6\\)을 제외할 때 확인하기 좋은 음수 \\(x\\)는 무엇이며 왜인가요?","answer":"\\(m=6\\)에서 제곱인수로 값이 \\(0\\)이 되는 \\(x=-1/6\\)이에요. \\(D_m(x)\\)는 \\(m\\)에 따라 증가하므로 \\(m>6\\)이면 그 값이 양수가 돼요."}},{"id":"c4","label":"세 보기를 한꺼번에 확인해요","stepIds":["s11"],"question":"참인 보기를 모으면 어느 선택지가 될까요?","hint":"앞의 세 장에서 ㄱ, ㄴ, ㄷ의 판단을 차례로 모아요.","explanation":"ㄱ은 직접 함숫값 비교로 참, ㄴ은 음수 구간의 한 교차와 \\(x=0\\)을 세어 참, ㄷ은 \\(0<m\\le6\\)에서 최대가 \\(6\\)이라 참이에요. 따라서 ㄱ, ㄴ, ㄷ이 모두 옳고 정답은 ⑤예요.","check":{"prompt":"ㄴ에서 센 두 점은 어떤 종류의 점인가요?","answer":"음수 구간에서 \\(f\\)와 \\(g\\)의 대소가 바뀌는 교점 하나와 \\(g\\)의 좌우 기울기가 다른 \\(x=0\\)이에요."}}],"takeaway":["두 함수의 작은 값을 택한 함수는 교점의 개수보다 대소가 실제로 바뀌는지를 먼저 봐요.","조각함수의 경계에서는 최종적으로 선택된 함수의 좌우 기울기를 확인해요.","매개변수 경계값에서는 등호가 생기는 점을 찾아 그보다 큰 값에서 부호가 깨지는지 검사해요."]};</script>
