<script>window.HandStudyGuide={"itemId":17397,"sourceHash":"79a1399701a8af39bce337090f2fb7035dedd78ae353a7191f11c47e8e4e2af9","contentHash":"1e9976ce8cc97fb13b51a1c11d4ab8cef302c2535456cf508573ce9f1dae5282","overview":{"goal":"두 영역에서 같은 활꼴을 상쇄해 삼각형 \\(QPB\\)의 넓이만 계산해요.","firstLook":"호 \\(PB\\)와 \\(PQ\\)의 길이가 같아 두 활꼴의 넓이가 같고, 삼각형 \\(RPB\\)와 \\(SPB\\)도 합동이에요.","conditions":[{"label":"같은 호","meaning":"같은 반지름의 원에서 호의 길이가 같으면 중심각, 현의 길이, 대응 활꼴 넓이가 같아요."}]},"chapters":[{"id":"c1","label":"합동과 활꼴의 상쇄 찾기","stepIds":["s1","s2","s3"],"question":"\\(f+g\\)에서 왜 삼각형 \\(QPB\\)만 남나요?","hint":"\\(f\\)와 \\(g\\)를 삼각형 부분과 활꼴 \\(T\\)로 나누고 합동인 삼각형을 바꾸어 쓰세요.","explanation":"원주각 관계로 \\(\\angle QBP=\\angle SBP=\\theta\\)이고, 지름 \\(AB\\)에 대한 원주각 때문에 \\(\\angle RPB=\\angle SPB=\\pi/2\\)예요. 공통변 \\(PB\\)까지 같아 \\(\\triangle RPB\\cong\\triangle SPB\\). 같은 길이의 호 \\(PQ\\)와 \\(PB\\)가 만드는 활꼴 넓이를 \\(T\\)라 하면 \\(f=[PQR]+T\\), \\(g=[SPB]-T\\)예요. 따라서 \\(f+g=[PQR]+[RPB]=[QPB]\\)로 활꼴과 합동인 삼각형 부분이 모두 정리돼요.","check":{"prompt":"\\(T\\)가 없어지는 것만으로 바로 \\(QPB\\)가 되나요?","answer":"\\(T\\)가 상쇄된 뒤 \\([SPB]=[RPB]\\)로 바꾸고, \\([PQR]\\)과 \\([RPB]\\)를 합쳐 \\([QPB]\\)를 만들어야 해요."}},{"id":"c2","label":"현의 길이와 끼인각 구하기","stepIds":["s4"],"question":"\\(PB=PQ=2\\sin \\theta\\)는 어떻게 나오나요?","hint":"반지름 1인 원에서 현의 길이는 중심각 절반의 사인 두 배이에요.","explanation":"\\(AB=2\\)이므로 반원의 반지름은 1예요. \\(\\angle BAP=\\theta\\)가 보는 현 \\(PB\\)의 길이는 \\(2\\sin\\theta\\). 호 \\(PQ\\)와 \\(PB\\)의 길이가 같으므로 현도 같아 \\(PQ=PB=2\\sin\\theta\\)예요. 삼각형 \\(QPB\\)의 두 밑각이 \\(\\theta\\)이므로 끼인각 \\(\\angle QPB=\\pi-2\\theta\\)예요.","check":{"prompt":"호의 길이가 같다는 조건에서 현 \\(PQ=PB\\)도 얻을 수 있는 이유는 무엇인가요?","answer":"같은 원에서 같은 길이의 호는 같은 중심각을 가지므로 대응 현의 길이도 같아요."}},{"id":"c3","label":"삼각형 넓이의 극한 계산하기","stepIds":["s5"],"question":"\\(\\theta ^3\\)으로 나눈 뒤 어떤 기본 극한 두 개를 쓰나요?","hint":"\\(\\sin ^2\\theta\\)와 \\(\\sin 2\\theta\\)를 각각 \\(\\theta ^2,\\,\\theta\\)로 나누세요.","explanation":"\\(f+g=[QPB]=\\frac12(2\\sin\\theta)^2\\sin(\\pi-2\\theta)=2\\sin^2\\theta\\sin 2\\theta\\)예요. 따라서 \\(\\frac{f+g}{\\theta^3}=2(\\sin\\theta/\\theta)^2(\\sin 2\\theta/\\theta)\\to 2\\cdot 1^2\\cdot 2=4\\)예요.","check":{"prompt":"\\(\\sin (\\pi -2\\theta )\\)를 \\(\\sin 2\\theta\\)로 바꿀 수 있는 이유는 무엇인가요?","answer":"\\(\\sin(\\pi-x)=\\sin x\\)와 같아요."}}],"takeaway":["복잡한 영역의 합은 공통 활꼴과 합동인 삼각형을 찾아 상쇄하면 단순해져요.","현의 길이와 원주각을 이용해 남은 삼각형 넓이를 직접 계산해요."]};</script>
