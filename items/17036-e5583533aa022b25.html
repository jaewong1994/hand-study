  <script>window.HandStudyRecord={"itemId":17036,"sourceLabel":"2021 교육청 고3 수학기하 4월 22번","adminYear":2021,"grade":3,"month":4,"number":22,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"실수 $a$에 대하여 두 함수 $f \\left( x \\right)$, $g \\left( x \\right)$를\n $f \\left( x \\right)$$=3x+a$, $g \\left( x \\right)$$= \\int _{2} ^{x} {} \\left( t+a \\right) f \\left( t \\right) dt$\n라 하자. 함수 $h \\left( x \\right)$$=f \\left( x \\right) g \\left( x \\right)$가 다음 조건을 만족시킬 때, $h \\left( -1 \\right)$의 최솟값은 $\\frac{q}{p}$이다. $p+q$의 값을 구하시오. (단, $p$와 $q$는 서로소인 자연수이다.) [4점]\n(가) 곡선 $y$$=h \\left( x \\right)$ 위의 어떤 점에서의 접선이 $x$축이다.(나) 곡선 $y$$= \\left| h \\left( x \\right) \\right|$가 $x$축과 평행한 직선과 만나는 서로 다른 점의 개수의 최댓값은 $4$이다.\n 사각형입니다. 2021년 4월 고3 모의고사 문제지제 2 교시 수학 영역(기하) 5 지선다형","answer":"251","sourceHash":"6e5e9dfa45ec587c5d245b86f377daf9edd2c44b8fc488860d27de815b6deb49","steps":[{"id":"s1","latex":"g=x(x+a)^2-2(a+2)^2,\\quad g'=(x+a)(3x+a),\\quad h=(3x+a)g"},{"id":"s2","latex":"h(c)=h'(c)=0\\Rightarrow\\begin{cases}c=-a,\\ g(-a)=-2(a+2)^2=0,\\\\c=-\\frac a3,\\ g(-\\frac a3)=-\\frac2{27}(a+6)^2(2a+3)=0\\end{cases}"},{"id":"s3","latex":"a\\in\\left\\{-2,-6,-\\frac32\\right\\}"},{"id":"s4","latex":"a=-2:\\ h=x(3x-2)(x-2)^2\\Rightarrow\\max\\#\\{\\lvert h\\rvert=c\\}=6\\quad(\\text{제외})"},{"id":"s5","latex":"a=-2:\\quad 0\u003cy\\text{가 충분히 작으면 }h(x)=y\\text{는 }4\\text{근},\\ h(x)=-y\\text{는 }2\\text{근}"},{"id":"s6","latex":"a=-6:\\ h=3(x-2)^3(x-8),\\quad h(-1)=729"},{"id":"s7","latex":"a=-\\frac32:\\ h=3(x-\\frac12)^3(x-2),\\quad h(-1)=\\frac{243}{8}"},{"id":"s8","latex":"h=3(x-r)^3(x-s),\\ r\u003cs:\\quad h^{\\prime}=3(x-r)^2(4x-r-3s)\\Rightarrow|h|\\text{의 수평선 교점은 최대 }4\\text{개}"},{"id":"s9","latex":"\\min h(-1)=\\frac{243}{8}\\Rightarrow p+q=251"}],"diagram":null,"contentHash":"9d02c79f91c258a5ac0dc76bf8876376aa8dab9a26c0ca05a54a5dab23e02133","questionHtml":"\u003cp class=\"hp\">실수 \u003cspan class=\"heq\">\\(a\\)\u003c/span>에 대하여 두 함수 \u003cspan class=\"heq\">\\(f \\left( x \\right)\\)\u003c/span>, \u003cspan class=\"heq\">\\(g \\left( x \\right)\\)\u003c/span>를\u003c/p>\u003cp class=\"hp\">&emsp;\u003cspan class=\"heq\">\\(f \\left( x \\right)\\)\u003c/span>\u003cspan class=\"heq\">\\(=3x+a\\)\u003c/span>, \u003cspan class=\"heq\">\\(g \\left( x \\right)\\)\u003c/span>\u003cspan class=\"heq\">\\(= \\int_{2}^{x} {} \\left( t+a \\right) f \\left( t \\right) dt\\)\u003c/span>\u003c/p>\u003cp class=\"hp htall\">라 하자. 함수 \u003cspan class=\"heq\">\\(h \\left( x \\right)\\)\u003c/span>\u003cspan class=\"heq\">\\(=f \\left( x \\right) g \\left( x \\right)\\)\u003c/span>가 다음 조건을 만족시킬 때, \u003cspan class=\"heq\">\\(h \\left( -1 \\right)\\)\u003c/span>의 최솟값은 \u003cspan class=\"heq\">\\(\\dfrac{q}{p}\\)\u003c/span>이다. \u003cspan class=\"heq\">\\(p+q\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(p\\)\u003c/span>와 \u003cspan class=\"heq\">\\(q\\)\u003c/span>는 서로소인 자연수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) 곡선 \u003cspan class=\"heq\">\\(y\\)\u003c/span>\u003cspan class=\"heq\">\\(=h \\left( x \\right)\\)\u003c/span> 위의 어떤 점에서의 접선이 \u003cspan class=\"heq\">\\(x\\)\u003c/span>축이다.\u003c/p>\u003cp class=\"hp\">(나) 곡선 \u003cspan class=\"heq\">\\(y\\)\u003c/span>\u003cspan class=\"heq\">\\(= \\left| h \\left( x \\right) \\right|\\)\u003c/span>가 \u003cspan class=\"heq\">\\(x\\)\u003c/span>축과 평행한 직선과 만나는 서로 다른 점의 개수의 최댓값은 \u003cspan class=\"heq\">\\(4\\)\u003c/span>이다.\u003c/p>\u003c/div>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"e5583533aa022b25419d8cf479a5748e76b4cebbd99746e6150ead806945ff39"};</script>
