<script>window.HandStudyGuide={"itemId":17510,"sourceHash":"15d62daf08b13b9492fe455944c49ca3765033c5ff8273be749e5ee9b58d2418","contentHash":"6cda5bd9be8c5c4f85f88f13bfb1f091bd22bc24353d641bbdc67c31b3a9a313","overview":{"goal":"공통인 세 길이와 평행선에서 생기는 길이를 구해 두 삼각형의 넓이 비 극한을 계산해요.","firstLook":"\\(PA\\)는 반지름 1인 원의 중심각 \\(\\theta\\)에 대한 현이므로 \\(2\\sin(\\theta/2)\\)예요. 같은 길이인 \\(PC,PD\\)도 바로 정해져요.","conditions":[{"label":"세 선분의 길이가 같음","meaning":"현의 길이를 공통길이로 삼아 \\(DA\\)와 두 넓이를 계산해요."},{"label":"한 직선이 반지름과 평행","meaning":"각의 대응으로 \\(DE=DA\\)를 얻어 작은 삼각형 넓이를 단순화해요."}]},"chapters":[{"id":"c1","label":"공통 길이와 작은 두 변 구하기","stepIds":["s1","s2","s3"],"question":"현 \\(PA\\)의 길이와 이등변삼각형 \\(PAD\\)의 밑변 \\(DA\\)는 각각 얼마인가요?","hint":"현 길이 공식을 쓰고 \\(PA=PD\\)인 삼각형의 꼭짓점 각을 이용하세요.","explanation":"반지름이 1이고 중심각이 \\(\\theta\\)인 현의 길이는 \\(PA=2\\sin(\\theta/2)\\)예요. 조건에서 \\(PC=PD=PA\\)이므로 세 길이가 모두 같아요. 삼각형 \\(PAD\\)은 두 변 \\(PA,PD\\)가 같은 이등변삼각형이고 각을 정리하면 밑변은 \\(DA=2\\cdot PA\\sin(\\theta/2)=4\\sin^2(\\theta/2)\\)예요. 또 \\(DE\\parallel OP\\)인 평행선의 각 관계와 이등변삼각형의 밑각을 쓰면 \\(DE=DA\\)예요.","check":{"prompt":"\\(DA\\)가 작은 각에서 \\(\\theta^2\\) 정도의 크기가 되는 이유는 무엇인가요?","answer":"\\(DA=4\\sin^2(\\theta/2)\\)이고 \\(\\sin(\\theta/2)\\)가 \\(\\theta/2\\)와 같은 비율로 가까워지기 때문이에요."}},{"id":"c2","label":"두 삼각형 넓이 나타내기","stepIds":["s4","s5","s6","s7"],"question":"각 삼각형에서 넓이 공식에 넣을 두 변과 그 사이 각은 무엇인가요?","hint":"\\(EDA\\)에서는 \\(DA,DE,\\theta\\), \\(CDP\\)에서는 \\(PD,PC,\\pi-2\\theta\\)를 사용하세요.","explanation":"삼각형 \\(EDA\\)에서 두 변은 \\(DA=DE=4\\sin^2(\\theta/2)\\)이고 그 사이 각의 사인은 \\(\\sin\\theta\\)예요. 따라서 \\(g(\\theta)=\\frac12DA\\cdot DE\\sin\\theta=8\\sin^4(\\theta/2)\\sin\\theta\\)예요.\n\n각을 추적하면 \\(\\angle DPC=\\pi-2\\theta\\)예요. \\(PD=PC=2\\sin(\\theta/2)\\)이므로 \\(f(\\theta)=\\frac12PD\\cdot PC\\sin(\\pi-2\\theta)=2\\sin^2(\\theta/2)\\sin2\\theta\\)예요.","check":{"prompt":"\\(\\sin(\\pi-2\\theta)\\)를 \\(\\sin2\\theta\\)로 바꿀 수 있는 이유는 무엇인가요?","answer":"두 각은 서로 보각이고 보각의 사인값은 같아요."}},{"id":"c3","label":"기본극한으로 넓이 비 계산하기","stepIds":["s8","s9"],"question":"정리된 비에서 각각 어떤 두 기본극한이 남나요?","hint":"\\(\\sin(\\theta/2)/\\theta\\)와 \\(\\sin\\theta/\\sin2\\theta\\)를 분리하세요.","explanation":"두 넓이를 나누면 \\(\\frac{g(\\theta)}{\\theta^2f(\\theta)}=4\\frac{\\sin^2(\\theta/2)}{\\theta^2}\\frac{\\sin\\theta}{\\sin2\\theta}\\)예요. \\(\\sin(\\theta/2)/\\theta\\to1/2\\)이므로 제곱은 \\(1/4\\), 또 \\(\\sin\\theta/\\sin2\\theta\\to1/2\\)예요. 따라서 극한은 \\(4\\cdot1/4\\cdot1/2=1/2\\), 정답은 ④예요.","check":{"prompt":"\\(\\sin(\\theta/2)/\\theta\\)의 극한이 1/2인 이유는 무엇인가요?","answer":"\\(\\sin(\\theta/2)/(\\theta/2)\\to1\\)이고 여기에 \\(1/2\\)가 곱해진 꼴이기 때문이에요."}}],"takeaway":["원의 현 길이는 중심각의 절반 사인으로 나타내요.","삼각형 넓이를 구할 때 두 변과 그 사이 각을 명시해요.","작은 각 극한에서는 각도가 절반이나 두 배로 들어갈 때 생기는 계수를 따로 챙겨요."]};</script>
