<script>window.HandStudyRecord={"itemId":17223,"sourceLabel":"2021 평가원 고3 수학미적분 9월 29번","adminYear":2021,"grade":3,"month":9,"number":29,"track":"미적분","points":4,"scoreStatus":"confirmed_4_direct","questionText":"이차함수 $f \\left( x \\right)$에 대하여 함수 $g \\left( x \\right) =\\left\\{f \\left( x \\right) +2\\right\\}e ^{f \\left( x \\right)}$이 다음 조건을 만족시킨다.\n(가) $f \\left( a \\right) =6$인 $a$에 대하여 $g \\left( x \\right)$는 $x=a$에서 최댓값을 갖는다.(나) $g \\left( x \\right)$는 $x=b$, $x=b+6$에서 최솟값을 갖는다. \n방정식 $f \\left( x \\right) =0$의 서로 다른 두 실근을 $\\alpha ,\\, \\beta$라 할 때, $\\left( \\alpha - \\beta \\right) ^{2}$의 값을 구하시오. (단, $a,\\,b$는 실수이다.) [4점]","answer":"24","sourceHash":"74a703c11e3393c735d964c63c3edad9e38d9e0e6f9f5da3741c486e409a0f8a","steps":[{"id":"s1","latex":"h(t)=(t+2)e^t,\\quad h'(t)=(t+3)e^t"},{"id":"s2","latex":"h\\text{는 }t=-3\\text{에서 최소이고 }t>-3\\text{에서 증가}"},{"id":"s3","latex":"g=h\\circ f\\text{가 }x=a\\text{에서 최대}\\Rightarrow f(x)=-k(x-a)^2+6"},{"id":"s4","latex":"g\\text{의 두 최솟점}:\\quad f(x)=-3"},{"id":"s5","latex":"a=b+3,\\quad f(b)=-9k+6=-3\\Rightarrow k=1"},{"id":"s6","latex":"f(x)=0\\Rightarrow(x-a)^2=6"},{"id":"s7","latex":"(\\alpha-\\beta)^2=(2\\sqrt6)^2=24"}],"diagram":null,"contentHash":"7c29811808904090ec9af00135614ec3f2b20040daa21967bd62f40cb393bc8a","questionHtml":"\u003cp class=\"hp\">이차함수 \u003cspan class=\"heq\">\\(f \\left( x \\right)\\)\u003c/span>에 대하여 함수 \u003cspan class=\"heq\">\\(g \\left( x \\right) =\\left\\{f \\left( x \\right) +2\\right\\}e^{f \\left( x \\right)}\\)\u003c/span>이 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) \u003cspan class=\"heq\">\\(f \\left( a \\right) =6\\)\u003c/span>인 \u003cspan class=\"heq\">\\(a\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(g \\left( x \\right)\\)\u003c/span>는 \u003cspan class=\"heq\">\\(x=a\\)\u003c/span>에서 최댓값을 갖는다.\u003c/p>\u003cp class=\"hp\">(나) \u003cspan class=\"heq\">\\(g \\left( x \\right)\\)\u003c/span>는 \u003cspan class=\"heq\">\\(x=b\\)\u003c/span>, \u003cspan class=\"heq\">\\(x=b+6\\)\u003c/span>에서 최솟값을 갖는다.\u003c/p>\u003c/div>\u003cp class=\"hp\">방정식 \u003cspan class=\"heq\">\\(f \\left( x \\right) =0\\)\u003c/span>의 서로 다른 두 실근을 \u003cspan class=\"heq\">\\(\\alpha ,\\, \\beta\\)\u003c/span>라 할 때,\u003cbr>\u003cspan class=\"heq\">\\(\\left( \\alpha - \\beta \\right)^{2}\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(a,\\,b\\)\u003c/span>는 실수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"31e522850d7abab058956f33b83c56d4878fa00304bedecf7b0db6eaec35fb62"};</script>
<script>window.HandStudyGuide={"itemId":17223,"sourceHash":"74a703c11e3393c735d964c63c3edad9e38d9e0e6f9f5da3741c486e409a0f8a","contentHash":"7c29811808904090ec9af00135614ec3f2b20040daa21967bd62f40cb393bc8a","overview":{"goal":"바깥함수의 증감과 두 최솟점의 간격으로 이차함수를 정해요.","firstLook":"\\(h(t)=(t+2)e^t\\)로 두면 \\(g(x)=h(f(x))\\)예요. 먼저 \\(h\\)가 어느 입력에서 감소하고 증가하는지 확인해요.","conditions":[{"label":"\\(f(a)=6\\)에서 최댓값","meaning":"\\(6>-3\\)이고 이 구간에서 \\(h\\)가 증가하므로, \\(f\\)도 \\(x=a\\)에서 가장 큰 값을 가져야 해요."},{"label":"두 최솟점의 간격 \\(6\\)","meaning":"\\(h\\)의 가장 작은 값은 입력이 \\(-3\\)일 때이므로 두 점에서 \\(f(x)=-3\\)이에요."}]},"chapters":[{"id":"c1","label":"바깥함수의 증감으로 이차함수의 방향을 정해요","stepIds":["s1","s2","s3","s4"],"question":"왜 \\(f(a)=6\\)에서 \\(g\\)가 가장 크면 \\(f\\)가 아래로 열린 이차함수여야 할까요?","hint":"\\(h'(t)=(t+3)e^t\\)의 부호와 \\(6>-3\\)을 함께 봐요.","explanation":"\\(h'(t)=(t+3)e^t\\)이고 \\(e^t>0\\)이므로 \\(h\\)는 \\(t<-3\\)에서 감소하고 \\(t>-3\\)에서 증가해요. 특히 \\(t=6\\) 근처에서는 \\(h\\)가 증가하므로, \\(g(x)=h(f(x))\\)가 \\(x=a\\)에서 최댓값을 가지려면 \\(f(x)\\)도 그 점에서 가장 큰 값 \\(6\\)을 가져야 해요. 따라서 어떤 \\(k>0\\)에 대하여 \\(f(x)=-k(x-a)^2+6\\)으로 둘 수 있어요. 또 \\(h\\)의 가장 작은 값은 입력이 \\(-3\\)일 때이므로 \\(g\\)의 두 최솟점에서는 \\(f(x)=-3\\)이어야 해요.","check":{"prompt":"\\(f\\)의 꼭짓점과 열린 방향은 무엇인가요?","answer":"꼭짓점은 \\((a,6)\\)이고, \\(f(x)=-k(x-a)^2+6\\), \\(k>0\\)인 아래로 열린 이차함수예요."}},{"id":"c2","label":"두 최솟점의 간격으로 계수를 정해요","stepIds":["s5"],"question":"\\(b\\)와 \\(b+6\\)에서 같은 값 \\(-3\\)을 가지면 꼭짓점은 어디에 있나요?","hint":"이차함수에서 같은 함숫값을 갖는 두 점은 대칭축을 기준으로 같은 거리에 있어요.","explanation":"\\(f(b)=f(b+6)=-3\\)이므로 대칭축은 두 점의 중점 \\(x=b+3\\)이에요. 따라서 \\(a=b+3\\)이고, \\(b-a=-3\\)이에요. \\(f(b)=-k(-3)^2+6=-9k+6=-3\\)이므로 \\(9k=9\\), \\(k=1\\)이에요.","check":{"prompt":"\\(k\\)를 정하는 실제 방정식은 무엇인가요?","answer":"\\(-9k+6=-3\\)이고, 여기서 \\(k=1\\)이에요."}},{"id":"c3","label":"두 영점 사이 거리의 제곱을 계산해요","stepIds":["s6","s7"],"question":"\\(f(x)=0\\)의 두 근은 대칭축에서 각각 얼마나 떨어져 있나요?","hint":"\\(k=1\\)을 넣어 \\(-(x-a)^2+6=0\\)을 풀어요.","explanation":"\\(f(x)=0\\)이면 \\(-(x-a)^2+6=0\\), 즉 \\((x-a)^2=6\\)이에요. 두 근은 \\(\\alpha=a-\\sqrt6\\), \\(\\beta=a+\\sqrt6\\)이므로 \\(\\alpha-\\beta=-2\\sqrt6\\)예요. 따라서 \\((\\alpha-\\beta)^2=(-2\\sqrt6)^2=4\\cdot6=24\\)예요.","check":{"prompt":"두 근의 차와 그 제곱은 각각 무엇인가요?","answer":"차의 절댓값은 \\(2\\sqrt6\\)이고, 제곱은 \\(24\\)예요."}}],"takeaway":["합성함수의 극값은 바깥함수의 증감 구간과 안쪽함수의 움직임을 함께 봐요.","이차함수의 같은 함숫값 두 점은 대칭축에서 같은 거리에 있어요.","근 사이 거리의 제곱은 두 근을 실제로 쓴 뒤 계산해요."]};</script>
