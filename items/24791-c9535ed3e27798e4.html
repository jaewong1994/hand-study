<script>window.HandStudyRecord={"adminYear":2021,"answer":"23","contentHash":"8fcf3c8a8669291a860567effc28e7cfc9c326151f8b509e404479319556066c","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24791,"month":11,"number":30,"points":4,"preview":false,"questionHtml":"\u003cp>좌표공간에 중심 \u003cspan class=\"heq\">\\(C \\left( 2,\\, \\sqrt{5} ,\\,5 \\right)\\)\u003c/span>이고 점 \u003cspan class=\"heq\">\\(P \\left( 0,\\,0,\\,1 \\right)\\)\u003c/span>을 지나는 구\u003c/p>\u003cp> \u003cspan class=\"heq\">\\(S\\,:\\, \\left( x-2 \\right) ^{2} + \\left( y- \\sqrt{5} \\right) ^{2} + \\left( z-5 \\right) ^{2}\\)\u003c/span>\u003cspan class=\"heq\">\\(=25\\)\u003c/span>\u003c/p>\u003cp>가 있다. 구 \u003cspan class=\"heq\">\\(S\\)\u003c/span>가 평면 \u003cspan class=\"heq\">\\(O P C\\)\u003c/span>와 만나서 생기는 원 위를 움직이는 점 \u003cspan class=\"heq\">\\(Q\\)\u003c/span>, 구 \u003cspan class=\"heq\">\\(S\\)\u003c/span> 위를 움직이는 점 \u003cspan class=\"heq\">\\(R\\)\u003c/span>에 대하여 두 점 \u003cspan class=\"heq\">\\(Q\\)\u003c/span>, \u003cspan class=\"heq\">\\(R\\)\u003c/span>의 \u003cspan class=\"heq\">\\(xy\\)\u003c/span>평면 위로의 정사영을 각각 \u003cspan class=\"heq\">\\(Q _{1}\\)\u003c/span>, \u003cspan class=\"heq\">\\(R _{1}\\)\u003c/span>이라 하자. 삼각형 \u003cspan class=\"heq\">\\(O Q _{1} R _{1}\\)\u003c/span>의 넓이가 최대가 되도록 하는 두 점 \u003cspan class=\"heq\">\\(Q\\)\u003c/span>, \u003cspan class=\"heq\">\\(R\\)\u003c/span>에 대하여 삼각형 \u003cspan class=\"heq\">\\(O Q _{1} R _{1}\\)\u003c/span>의 평면 \u003cspan class=\"heq\">\\(P Q R\\)\u003c/span> 위로의 정사영의 넓이는 \u003cspan class=\"heq\">\\(\\frac{q}{p} \\sqrt{6}\\)\u003c/span>이다. \u003cspan class=\"heq\">\\(p+q\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(O\\)\u003c/span>는 원점이고 세 점 \u003cspan class=\"heq\">\\(O\\)\u003c/span>, \u003cspan class=\"heq\">\\(Q _{1}\\)\u003c/span>, \u003cspan class=\"heq\">\\(R _{1}\\)\u003c/span>은 한 직선 위에 있지 않으며, \u003cspan class=\"heq\">\\(p\\)\u003c/span>와 \u003cspan class=\"heq\">\\(q\\)\u003c/span>는 서로소인 자연수이다.)\u003c/p>\u003cp>[4점]\u003c/p>\u003cfigure>\u003cimg class=\"hfig\" src=\"../assets/csat/24791-42bb55245c3242e2.png\" alt=\"2021년 시행 수능 30번 문항 그림 \" style=\"max-width:100%;width:420px\">\u003c/figure>","questionText":"좌표공간에 중심 $C \\left( 2,\\, \\sqrt{5} ,\\,5 \\right)$이고 점 $P \\left( 0,\\,0,\\,1 \\right)$을 지나는 구\n $S\\,:\\, \\left( x-2 \\right) ^{2} + \\left( y- \\sqrt{5} \\right) ^{2} + \\left( z-5 \\right) ^{2}$$=25$\n가 있다. 구 $S$가 평면 $O P C$와 만나서 생기는 원 위를 움직이는 점 $Q$, 구 $S$ 위를 움직이는 점 $R$에 대하여 두 점 $Q$, $R$의 $xy$평면 위로의 정사영을 각각 $Q _{1}$, $R _{1}$이라 하자. 삼각형 $O Q _{1} R _{1}$의 넓이가 최대가 되도록 하는 두 점 $Q$, $R$에 대하여 삼각형 $O Q _{1} R _{1}$의 평면 $P Q R$ 위로의 정사영의 넓이는 $\\frac{q}{p} \\sqrt{6}$이다. $p+q$의 값을 구하시오. (단, $O$는 원점이고 세 점 $O$, $Q _{1}$, $R _{1}$은 한 직선 위에 있지 않으며, $p$와 $q$는 서로소인 자연수이다.)\n[4점]","sourceHash":"e9f04ee9bcf4b12a721a6fea97f192c96fd73b6e8d51e750675ad81aba746e42","sourceKind":"csat","sourceLabel":"2021년 시행 수능 · 2022학년도 · 기하 · 30번","steps":[{"id":"s1","latex":"xy\\text{평면에서 축을 회전하여 }\\mathrm C=(3,0,5),\\quad\\mathrm P=(0,0,1)\\text{로 둔다}"},{"id":"s2","latex":"\\mathrm Q\\text{는 }y=0\\text{ 위의 원 }(x-3)^2+(z-5)^2=25\\text{ 위}"},{"id":"s3","latex":"\\mathrm Q_1=(x,0,0),\\ -2\\le x\\le8\\quad\\Rightarrow\\quad\\mathrm Q=(8,0,5),\\ \\mathrm Q_1=(8,0,0)"},{"id":"s4","latex":"\\text{구의 }xy\\text{평면 위 정사영은 }(x-3)^2+y^2\\le25"},{"id":"s5","latex":"\\triangle\\mathrm{OQ_1R_1}\\text{의 넓이 최대}\\quad\\Rightarrow\\quad\\mathrm R=(3,\\pm5,5),\\quad\\text{최대 넓이}=\\frac12\\cdot8\\cdot5=20"},{"id":"s6","latex":"\\overline{\\mathrm{PQ}}^2=80,\\quad\\overline{\\mathrm{PR}}^2=\\overline{\\mathrm{QR}}^2=50\\quad\\Rightarrow\\quad\\triangle\\mathrm{PQR}\\text{의 넓이}=\\frac12\\cdot4\\sqrt5\\cdot\\sqrt{30}=10\\sqrt6"},{"id":"s7","latex":"\\text{두 평면이 이루는 예각을 }\\theta\\text{라 하면 }\\cos\\theta=\\frac{20}{10\\sqrt6}=\\frac{\\sqrt6}{3}"},{"id":"s8","latex":"\\text{구하는 넓이}=20\\cdot\\frac{\\sqrt6}{3}\\quad\\Rightarrow\\quad p+q=3+20=23"}],"track":"기하"};</script>
<script>window.HandStudyGuide={"itemId":24791,"sourceHash":"e9f04ee9bcf4b12a721a6fea97f192c96fd73b6e8d51e750675ad81aba746e42","contentHash":"8fcf3c8a8669291a860567effc28e7cfc9c326151f8b509e404479319556066c","overview":{"goal":"밑면에 내려온 두 점이 만드는 삼각형의 넓이를 먼저 최대로 하고, 두 평면이 이루는 각으로 정사영 넓이를 구합니다.","firstLook":"그림의 구를 위에서 보면 중심이 옮겨진 원판입니다. 한 점은 한 축 위, 다른 점은 그 축에서 가장 멀리 잡아야 밑면 삼각형이 커집니다.","conditions":[{"label":"원의 단면","meaning":"점 Q는 중심과 두 점 O, P를 지나는 평면 안의 큰 원 위에 있습니다."},{"label":"넓이의 최댓값","meaning":"밑변과 높이를 각각 가장 크게 할 수 있는 위치를 함께 확인합니다."}]},"chapters":[{"id":"c1","label":"좌표축을 돌려 단면을 단순화합니다","stepIds":["s1","s2","s3"],"question":"점 Q의 정사영이 움직이는 범위는 어디인가요?","hint":"중심의 밑면 좌표 방향을 새 가로축으로 잡습니다.","explanation":"밑면의 좌표축만 돌리면 길이와 넓이는 변하지 않으므로 \\(C=(3,0,5)\\), \\(P=(0,0,1)\\)로 둘 수 있습니다. 평면 \\(OPC\\)는 \\(y=0\\)이고, 단면은 \\((x-3)^2+(z-5)^2=25\\)입니다. 따라서 \\(Q_1=(x,0,0)\\)에서 \\(-2\\le x\\le8\\)입니다. 넓이의 밑변 \\(OQ_1\\)을 가장 길게 하려면 \\(x=8\\)을 택하므로 \\(Q=(8,0,5)\\)입니다.","check":{"prompt":"왜 \\(x=-2\\)보다 \\(x=8\\)을 택하나요?","answer":"밑변의 길이는 \\(|x|\\)이고 가능한 최댓값은 8이기 때문입니다."}},{"id":"c2","label":"밑면 삼각형을 가장 크게 만듭니다","stepIds":["s4","s5"],"question":"점 R의 정사영은 어디에 있어야 높이가 가장 큰가요?","hint":"구를 위에서 본 원판에서 가로축까지의 거리를 최대로 하세요.","explanation":"구를 밑면에 내리면 \\((x-3)^2+y^2\\le25\\)인 원판입니다. 밑변 \\(OQ_1\\)이 가로축 위에 있으므로 높이는 \\(|y|\\)입니다. 최댓값 5는 \\(R_1=(3,\\pm5,0)\\)에서 얻고 구 위의 점은 \\(R=(3,\\pm5,5)\\)입니다. 따라서 최대 넓이는 \\(\\frac12\\cdot8\\cdot5=20\\)입니다.","check":{"prompt":"원판의 가장 위 점에서 R의 높이 좌표가 5인 이유는 무엇인가요?","answer":"원래 구의 식에 \\((x,y)=(3,\\pm5)\\)를 넣으면 \\((z-5)^2=0\\)이기 때문입니다."}},{"id":"c3","label":"두 평면의 넓이 비를 구합니다","stepIds":["s6","s7","s8"],"question":"정사영 넓이에 곱할 각의 비는 어떻게 구하나요?","hint":"같은 삼각형을 두 평면에 내려 놓은 넓이의 비를 이용합니다.","explanation":"\\(PQ^2=80\\), \\(PR^2=QR^2=50\\)입니다. \\(PQR\\)에서 \\(QR=5\\sqrt2\\)이고 밑변의 중점까지의 높이는 \\(\\sqrt{50-25/2}=\\sqrt{75/2}\\)이므로 넓이는 \\(10\\sqrt6\\)입니다. 이 삼각형을 밑면에 내린 것이 \\(OQ_1R_1\\)이고 넓이가 20이므로 두 평면이 이루는 예각을 \\(\\theta\\)라 할 때 \\(\\cos\\theta=20/(10\\sqrt6)=\\sqrt6/3\\)입니다. 이제 밑면 삼각형을 평면 \\(PQR\\)에 내린 넓이는 \\(20\\cos\\theta=20\\sqrt6/3\\)이므로 \\(p+q=3+20=23\\)입니다.","check":{"prompt":"넓이 비가 1보다 작다는 조건을 만족하나요?","answer":"\\(\\sqrt6/3<1\\)이므로 정사영 넓이 20은 원래 삼각형 넓이 \\(10\\sqrt6\\)보다 작습니다."}}],"takeaway":["공간 좌표에서 밑면 축을 돌리면 길이와 넓이를 보존하면서 단면을 단순하게 만들 수 있습니다.","정사영 넓이의 비는 같은 도형의 두 평면에서의 넓이를 먼저 계산해 구할 수 있습니다."]};</script>
