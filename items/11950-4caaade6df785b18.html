  <script>window.HandStudyRecord={"itemId":11950,"sourceLabel":"2023 교육청 고1 수학 6월 21번","adminYear":2023,"grade":1,"month":6,"number":21,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"$1\\,$이 아닌 양수 $k\\,$에 대하여 직선 $y=k\\,$와 이차함수 $y=x ^{2} \\,$의 그래프가 만나는 두 점을 각각 $A\\,$, $B\\,$라 하고, 직선 $y=k\\,$와 이차함수 $y= x ^{2} -6x+6\\,$의 그래프가 만나는 두 점을 각각 $C\\,$, $D\\,$라 할 때, \u003c보기>에서 옳은 것만을 있는 대로 고른 것은? (단, 점 $A\\,$의 $x\\,$좌표는 점 $B\\,$의 $x\\,$좌표보다 작고, 점 $C\\,$의 $x\\,$좌표는 점 $D\\,$의 $x\\,$좌표보다 작다.) [4점]\n\u003c보 기>ㄱ. $k=6\\,$일 때, ${\\overline{ CD}}$$=6\\,$이다.ㄴ. $k\\,$의 값에 관계없이 ${\\overline{ CD}} ^{\\,2} - {\\overline{ AB}} ^{\\,2} \\,$의 값은 일정하다.ㄷ. ${\\overline{ CD}} + {\\overline{ AB}}$$=4\\,$일 때, $k+ {\\overline{ BC}}$$= \\frac{17}{16} \\,$이다.\n① ㄱ ② ㄱ, ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ\n$O$$x$$y$$y=x ^{2}$$y= x ^{2} -6x+6$","answer":"⑤","sourceHash":"ccf507c8c646cc09ff3ec170125763fb08a2c995aeb6e305f57b34dc7fbae58c","steps":[{"id":"s1","latex":"A=(-\\sqrt k,k),\\quad B=(\\sqrt k,k)"},{"id":"s2","latex":"C=(3-\\sqrt{k+3},k),\\quad D=(3+\\sqrt{k+3},k)"},{"id":"s3","latex":"AB=2\\sqrt k,\\quad CD=2\\sqrt{k+3}"},{"id":"s4","latex":"k=6\\Rightarrow CD=6"},{"id":"s5","latex":"CD^2-AB^2=4(k+3)-4k=12"},{"id":"s6","latex":"CD+AB=4\\Rightarrow\\sqrt{k+3}+\\sqrt k=2"},{"id":"s7","latex":"\\sqrt{k+3}-\\sqrt k=\\frac32\\Rightarrow\\sqrt k=\\frac14\\Rightarrow k=\\frac1{16}"},{"id":"s8","latex":"x_B=\\frac14,\\quad x_C=3-\\frac74=\\frac54\\Rightarrow BC=1"},{"id":"s9","latex":"k+BC=\\frac{17}{16}"}],"diagram":null,"contentHash":"5f0d4273ae0165fa87fd2b62151f7f723c29b19737fb6c6dfdd448c8532a0407","questionHtml":"\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>이 아닌 양수 \u003cspan class=\"heq\">\\(k\\)\u003c/span>에 대하여 직선 \u003cspan class=\"heq\">\\(y=k\\)\u003c/span>와 이차함수 \u003cspan class=\"heq\">\\(y=x^{2} \\,\\)\u003c/span>의 그래프가 만나는 두 점을 각각 \u003cspan class=\"heq\">\\(A\\)\u003c/span>, \u003cspan class=\"heq\">\\(B\\)\u003c/span>라 하고, 직선 \u003cspan class=\"heq\">\\(y=k\\)\u003c/span>와 이차함수 \u003cspan class=\"heq\">\\(y= x^{2} -6x+6\\,\\)\u003c/span>의 그래프가 만나는 두 점을 각각 \u003cspan class=\"heq\">\\(C\\)\u003c/span>, \u003cspan class=\"heq\">\\(D\\)\u003c/span>라 할 때, &lt;보기&gt;에서 옳은 것만을 있는 대로 고른 것은? (단, 점 \u003cspan class=\"heq\">\\(A\\)\u003c/span>의 \u003cspan class=\"heq\">\\(x\\)\u003c/span>좌표는 점 \u003cspan class=\"heq\">\\(B\\)\u003c/span>의 \u003cspan class=\"heq\">\\(x\\)\u003c/span>좌표보다 작고, 점 \u003cspan class=\"heq\">\\(C\\)\u003c/span>의 \u003cspan class=\"heq\">\\(x\\)\u003c/span>좌표는 점 \u003cspan class=\"heq\">\\(D\\)\u003c/span>의 \u003cspan class=\"heq\">\\(x\\)\u003c/span>좌표보다 작다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cdiv class=\"hbox\">\u003cdiv style=\"text-align:center;font-weight:700;margin:0 0 6px\">&lt; 보 기 &gt;\u003c/div>\u003cp class=\"hp htall\">ㄱ. \u003cspan class=\"heq\">\\(k=6\\,\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\({\\overline{CD}}\\)\u003c/span>\u003cspan class=\"heq\">\\(=6\\,\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp htall\">ㄴ. \u003cspan class=\"heq\">\\(k\\)\u003c/span>의 값에 관계없이 \u003cspan class=\"heq\">\\({\\overline{CD}}^{\\,2} - {\\overline{AB}}^{\\,2} \\,\\)\u003c/span>의 값은 일정하다.\u003c/p>\u003cp class=\"hp htall\">ㄷ. \u003cspan class=\"heq\">\\({\\overline{CD}} + {\\overline{AB}}\\)\u003c/span>\u003cspan class=\"heq\">\\(=4\\,\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(k+ {\\overline{BC}}\\)\u003c/span>\u003cspan class=\"heq\">\\(= \\dfrac{17}{16} \\,\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp class=\"hp\">① ㄱ&emsp;② ㄱ, ㄴ&emsp;③ ㄱ, ㄷ\u003c/p>\u003cp class=\"hp\">④ ㄴ, ㄷ&emsp;⑤ ㄱ, ㄴ, ㄷ\u003c/p>\u003cp class=\"hp\">\u003cspan class=\"hfigwrap\" style=\"position:relative;display:inline-block;width:416px;aspect-ratio:31200/25844;max-width:100%;vertical-align:middle\">\u003cspan class=\"hfiglayer\" style=\"position:absolute;overflow:hidden;left:0.00%;top:0.00%;width:100.00%;height:100.00%\">\u003cimg class=\"hfig\" src=\"../assets/figures/48c60b89f996aeee9b7d
