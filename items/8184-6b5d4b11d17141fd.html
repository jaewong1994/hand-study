  <script>window.HandStudyRecord={"itemId":8184,"sourceLabel":"2022 교육청 고2 수학 9월 17번","adminYear":2022,"grade":2,"month":9,"number":17,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"실수 $a\\,$$\\left( a\\gt 1 \\right) \\,$과 자연수 $n\\,$에 대하여 직선 $x=n\\,$이 두 함수\n  $y=3 a^{x} \\,$, $y=3 a^{x-1} \\,$\n의 그래프와 만나는 점을 각각 $P_{ n} \\,$, $Q_{ \\,n} \\,$이라 하자. 선분 $P_{ n} Q_{ \\,n} \\,$의 길이를 $l_{n} \\,$, 사다리꼴 $P_{ n} Q_{\\, n} Q_{ \\,n+2} \\,P_{ n+2} \\,$의 넓이를 $S_{\\,n} \\,$이라 하자.\n두 실수 $L\\,$, $S\\,$에 대하여 $\\sum\\limits_{k=1}^{20} \\,l_{k} =L\\,$, $\\sum\\limits_{k=1}^{5} S_{\\,4k-3} =S\\,$일 때, \n다음은 $\\dfrac{S}{L} = \\dfrac{2}{5} \\,$를 만족시키는 $a\\,$의 값을 구하는 과정이다.\n두 점 $P_{ n} \\,$, $Q_{ \\,n} \\,$의 좌표는 각각 $\\left( n,\\,3a^{n} \\right) \\,$, $\\left( n,\\,3a^{n-1} \\right) \\,$\n선분 $P_{ n} Q_{ \\,n} \\,$의 길이 $l_{n} \\,$은\n$l_{n} \\,$$=3 \\left( a-1 \\right) \\times a^{n-1} \\,$이므로\n$L= \\sum\\limits_{k=1}^{20} \\,l_{k} =3 \\times \\left( \\, {\\boxed{\\vphantom{(}\\,(\\text{가})\\,}} \\, \\right) \\,$이다.\n사다리꼴 $P_{ n} Q_{ \\,n} Q_{\\, n+2} \\,P_{ n+2} \\,$의 넓이 $S_{\\,n} \\,$은\n$S_{\\,n} =3 \\left( a-1 \\right) \\times \\left( a^{n-1} +a^{n+1} \\right) \\,$이므로\n$S\\,$$= \\sum\\limits_{k=1}^{5} S_{\\,4k-3}$\n $=S_{\\,1} +S_{\\,5} +S_{\\,9} +S_{\\,13} +S_{\\,17} \\,$\n $= \\dfrac{3}{\\left( \\, {\\boxed{\\vphantom{(}\\,(\\text{나})\\,}} \\, \\right)} \\times \\left( \\, {\\boxed{\\vphantom{(}\\,(\\text{가})\\,}} \\, \\right) \\,$이다.\n따라서\n$3$\n$\\times \\left( \\, {\\boxed{\\vphantom{(}\\,(\\text{가})\\,}} \\, \\right)$\n$1$\n$\\dfrac{S}{L}$\n$=$\n$\\left( \\, {\\boxed{\\vphantom{(}\\,(\\text{나})\\,}} \\, \\right)$\n$=$\n$=$\n$\\dfrac{2}{5}$\n$3 \\times \\left( \\, {\\boxed{\\vphantom{(}\\,(\\text{가})\\,}} \\, \\right)$\n$\\left( \\, {\\boxed{\\vphantom{(}\\,(\\text{나})\\,}} \\, \\right)$\n이므로 $a= {\\boxed{\\vphantom{(}\\,(\\text{다})\\,}} \\,$이다.\n위의 (가), (나)에 알맞은 식을 각각 $f \\left( a \\right) \\,$, $g \\left( a \\right) \\,$라 하고, (다)에 알맞은 수를 $p\\,$라 할 때, $\\dfr
