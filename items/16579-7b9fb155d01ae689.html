  <script>window.HandStudyRecord={"itemId":16579,"sourceLabel":"2019 평가원 고3 수리나형 6월 30번","adminYear":2019,"grade":3,"month":6,"number":30,"track":"수리나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"최고차항의 계수가 $1$이고 $f(2) = 3$인 삼차함수 $f(x)$에 대하여 함수 $g(x)=\\begin{cases} \\dfrac{ax-9}{x-1} & (x\u003c1) \\\\ f(x) & (x \\geq 1) \\end{cases}$ 이 다음 조건을 만족시킨다.\n함수 $y = g(x)$의 그래프와 직선 $y = t$가 서로 다른 두 점에서만 만나도록 하는 모든 실수 $t$의 값의 집합은 $\\{\\, t \\mid t=-1 \\ \\text{또는}\\ t \\geq 3 \\,\\}$이다.\n$(g \\circ g)(- 1)$의 값을 구하시오. (단, $a$는 상수이다.) [4점]","answer":"19","sourceHash":"90b0e95a27fe9f74645860881afe74488f05bda8e0866501da17ed9a91372794","steps":[{"id":"s1","latex":"x\u003c1:\\quad g(x)=a+\\dfrac{a-9}{x-1}"},{"id":"s2","latex":"t\\text{가 클 때 왼쪽 가지와 한 번 만나야 하므로 }a\u003c9,\\quad\\operatorname{range}(g|_{x\u003c1})=(a,\\infty)"},{"id":"s3","latex":"R(t)=\\#\\{x\\ge1:f(x)=t\\}\\Rightarrow R(t)=1\\ (t>a),\\quad R(t)=2\\ (t\\le a)"},{"id":"s4","latex":"\\{t:\\#\\{x:g(x)=t\\}=2\\}=\\{-1\\}\\cup[3,\\infty)\\Rightarrow a=3"},{"id":"s5","latex":"f\\text{는 }x\\ge1\\text{에서 극대값 }3,\\ \\text{극솟값 }-1"},{"id":"s6","latex":"f(x)-3=(x-p)^2(x-p-3),\\quad f(2)=3\\Rightarrow p=2"},{"id":"s7","latex":"f(x)=(x-2)^2(x-5)+3"},{"id":"s8","latex":"g(-1)=6\\Rightarrow(g\\circ g)(-1)=f(6)=19"}],"diagram":null,"contentHash":"2b3f6d417e6ce6b5429ea0c07cd81611631ddcdd35c4664b110762ae4545afb8","questionHtml":"\u003cp class=\"hp\">최고차항의 계수가 \u003cspan class=\"heq\">\\(1\\)\u003c/span>이고 \u003cspan class=\"heq\">\\(f(2) = 3\\)\u003c/span>인 삼차함수 \u003cspan class=\"heq\">\\(f(x)\\)\u003c/span>에 대하여 함수\u003cbr>&emsp;\u003c/p>\u003cp class=\"hp\">\\(g(x)=\\begin{cases}\\dfrac{ax-9}{x-1}&x\\lt1\\\\f(x)&x\\ge1\\end{cases}\\)\u003c/p>\u003cp class=\"hp\">\u003cbr>이 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">함수 \u003cspan class=\"heq\">\\(y = g(x)\\)\u003c/span>의 그래프와 직선 \u003cspan class=\"heq\">\\(y = t\\)\u003c/span>가\u003c/p>\u003cp class=\"hp\">서로 다른 두 점에서만 만나도록 하는 모든 실수 \u003cspan class=\"heq\">\\(t\\)\u003c/span>의\u003c/p>\u003cp class=\"hp\">값의 집합은 \u003cspan class=\"heq\">\\(\\{t \\,|\\, t = - 1 \\)\u003c/span> 또는 \u003cspan class=\"heq\">\\(t \\ge  3 \\}\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp class=\"hp\">\u003cspan class=\"heq\">\\((g \\circ g)(- 1)\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(a\\)\u003c/span>는 상수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"7b9fb155d01ae689ba6ee09fa7e1552c6838742d448d8e95254913d9a6b2b83d"};</script>
