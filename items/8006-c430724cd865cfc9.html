  <script>window.HandStudyRecord={"itemId":8006,"sourceLabel":"2021 교육청 고2 수학 11월 19번","adminYear":2021,"grade":2,"month":11,"number":19,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"다음은 수열 $\\left\\{ a _{n} \\right\\}$이 모든 자연수 $n$에 대하여\n $\\sum _{k=1} ^{n} \\left( \\frac{1}{k} - \\frac{1}{n+1} \\right) a _{k} =n ^{2}$\n을 만족시킬 때, $\\sum _{k=1} ^{n} a _{k}$를 구하는 과정이다.\n$T _{n} = \\sum _{k=1} ^{n} \\left( \\frac{1}{k} - \\frac{1}{n+1} \\right) a _{k}$라 하자.(ⅰ) $T _{1} =1$이므로 $a _{1} =box{\\, \\left( 가 \\right) \\,}$이다.(ⅱ) $2$이상의 자연수 $n$에 대하여 $T _{n} =n ^{2}$에서 $T _{n} -T _{n-1} =2n-1$이고 $T _{n} = \\sum _{k=1} ^{n} \\frac{a _{k}}{k} - \\frac{1}{box{\\, \\left( 나 \\right) \\,}} \\times \\sum _{k=1} ^{n} a _{k}$에서 $T _{n} -T _{n-1} = \\frac{1}{box{\\, \\left( 다 \\right) \\,}} \\times \\sum _{k=1} ^{n} a _{k}$이므로 $\\sum _{k=1} ^{n} a _{k} = \\left( 2n-1 \\right) \\times \\left( box{\\, \\left( 다 \\right) \\,} \\right)$이다.(ⅰ), (ⅱ)에 의하여 모든 자연수 $n$에 대하여$\\sum _{k=1} ^{n} a _{k} = \\left( 2n-1 \\right) \\times \\left( box{\\, \\left( 다 \\right) \\,} \\right)$이다.\n(가)에 알맞은 수를 $p$, (나), (다)에 알맞은 식을 각각 $f \\left( n \\right)$, $g \\left( n \\right)$이라 할 때, $f \\left( 2p \\right) {\\times}g \\left( 3p \\right)$의 값은? [4점]\n① $190$ ② $200$ ③ $210$ ④ $220$ ⑤ $230$","answer":"③","sourceHash":"f53d98748236e7ae11ffba6ffb7fc95a88779ef83ea23e8d2c115348046c36ac","steps":[{"id":"s1","latex":"T_1=\\frac12a_1=1\\Rightarrow p=a_1=2"},{"id":"s2","latex":"S_n=\\sum_{k=1}^na_k,\\quad T_n=\\sum_{k=1}^n\\frac{a_k}{k}-\\frac{S_n}{n+1}"},{"id":"s3","latex":"f(n)=n+1"},{"id":"s4","latex":"T_n-T_{n-1}=\\frac{S_n}{n(n+1)}\\Rightarrow g(n)=n(n+1)"},{"id":"s5","latex":"f(2p)g(3p)=f(4)g(6)=5\\cdot42=210"}],"diagram":null,"contentHash":"811d6125216d5a0a24ee1deb42467ed488590e7ccdde15c83e95e305960f8e5a","questionHtml":"\u003cp class=\"hp\">다음은 수열 \u003cspan class=\"heq\">\\(\\left\\{ a_{n} \\right\\}\\)\u003c/span>이 모든 자연수 \u003cspan class=\"heq\">\\(n\\)\u003c/span>에 대하여\u003c/p>\u003cp class=\"hp htall\">&emsp;&emsp;\u003cspan class=\"heq\">\\(\\sum\\limits_{k=1}^{n} \\left( \\dfrac{1}{k} - \\dfrac{1}{n+1} \\right) a_{k} =n^{2}\\)\u003c/span>\u003c/p>\u003cp class=\"hp htall\">을 만족시킬 때, \u003cspan class=\"heq\">\\(\\sum\\limits_{k=1}^{n} a_{k}\\)\u003c/span>를 구하는 과정이다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp htall\">\u003cspan class=\"heq\">\\(T_{n} = \\sum\\limits_{k=1}^{n} \\left( \\dfrac{1}{k} - \\dfrac{1}{n+1} \\right) a_{k}\\)\u003c/span>라 하자.\u003c/p>\u003cp class=\"hp htall\">(ⅰ) \u003cspan class=\"heq\">\\(T_{1} =1\\)\u003c/span>이므로 \u003cspan class=\"heq\">\\(a_{1} =\\boxed{\\vphantom{(}\\, \\left( \\text{가} \\right) \\,}\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp htall\">(ⅱ) \u003cspan class=\"heq\">\\(2\\)\u003c/span>이상의 자연수 \u003cspan class=\"heq\">\\(n\\)\u003c/span>에 대하여\u003cbr>\u003cspan class=\"heq\">\\(T_{n} =n^{2}\\)\u003c/span>에서\u003cbr>\u003cspan class=\"heq\">\\(T_{n} -T_{n-1} =2n-1\\)\u003c/span>이고\u003cbr>\u003cspan class=\"heq\">\\(T_{n} = \\sum\\limits_{k=1}^{n} \\dfrac{a_{k}}{k} - \\dfrac{1}{\\boxed{\\vphantom{(}\\, \\left( \\text{나} \\right) \\,}} \\times \\sum\\limits_{k=1}^{n} a_{k}\\)\u003c/span>에서\u003cbr>\u003cspan class=\"heq\">\\(T_{n} -T_{n-1} = \\dfrac{1}{\\boxed{\\vphantom{(}\\, \\left( \\text{다} \\right) \\,}} \\times \\sum\\limits_{k=1}^{n} a_{k}\\)\u003c/span>이므로\u003cbr>\u003cspan class=\"heq\">\\(\\sum\\limits_{k=1}^{n} a_{k} = \\left( 2n-1 \\right) \\times \\left( \\boxed{\\vphantom{(}\\, \\left( \\text{다} \\right) \\,} \\right)\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp\">(ⅰ), (ⅱ)에 의하여 모든 자연수 \u003cspan class=\"heq\">\\(n\\)\u003c/span>에 대하여\u003c/p>\u003cp class=\"hp htall\">\u003cspan class=\"heq\">\\(\\sum\\limits_{k=1}^{n} a_{k} = \\left( 2n-1 \\right) \\times \\left( \\boxed{\\vphantom{(}\\, \\left( \\text{다} \\right) \\,} \\right)\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp class=\"hp\">(가)에 알맞은 수를 \u003cspan class=\"heq\">\\(p\\)\u003c/span>, (나), (다)에 알맞은 식을 각각 \u003cspa
