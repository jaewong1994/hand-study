<script>window.HandStudyRecord={"itemId":7738,"sourceLabel":"2019 교육청 고2 수학가형 11월 21번","adminYear":2019,"grade":2,"month":11,"number":21,"track":"수학가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"세 실수 $a$, $b$, $c$에 대하여 함수 $f \\left( x \\right)$는\n $f \\left( x \\right) = {\\begin{cases}\\,- \\left| 2x+a \\right| _{{}_{\\,}}&\\, \\left( x\\,\u003c\\,0 \\right) _{{}_{\\,}} \\\\ \\,x ^{2} +bx+c ^{{}^{{}^{\\,}}}&\\, \\left( x\\, \\geq 0 \\right) ^{{}^{{}^{\\,}}}\\end{cases}}$\n이고, 함수 $\\left| f \\left( x \\right) \\right|$는 실수 전체의 집합에서 연속이다. 실수 $t$에 대하여 직선 $y=t$가 두 함수 $y=f \\left( x \\right)$, $y= \\left| f \\left( x \\right) \\right|$의 그래프와 만나는 점의 개수를 각각 $g \\left( t \\right)$, $h \\left( t \\right)$라 할 때, 두 함수 $g \\left( t \\right)$, $h \\left( t \\right)$가 다음 조건을 만족시킨다.\n(가) 함수 $g \\left( t \\right)$의 치역은 $\\left\\{ \\,1,\\,2,\\,3,\\,4 \\right\\}$이다.(나) $\\lim _{t\\, -> \\,2-} {h \\left( t \\right)} \\, \\times \\lim _{t\\, -> \\,2+} {h \\left( t \\right)} =12$\n$f \\left( -2 \\right) +f \\left( 6 \\right)$의 값은? [4점]\n① $12$ ② $14$ ③ $16$ ④ $18$ ⑤ $20$\n단 답 형","answer":"①","sourceHash":"4386282d5a5480ff72b494b996d9561563f08604c54afc10f4ae2e62574ea561","steps":[{"id":"s1","latex":"|f|\\text{의 }x=0\\text{에서의 연속성}\\Rightarrow |a|=|c|"},{"id":"s2","latex":"\\operatorname{range}(g)=\\{1,2,3,4\\}\\Rightarrow a>0,\\ c=\\pm a,\\ b\u003c0"},{"id":"s3","latex":"v=c-\\frac{b^2}{4}\\le0,\\qquad t>0\\Rightarrow h(t)=g(t)+g(-t)"},{"id":"s4","latex":"a\\ne2,\\ v\\ne-2\\Rightarrow h_-=h_+\\Rightarrow h_-h_+\\ne12"},{"id":"s5","latex":"a\\ne2,\\ v=-2\\Rightarrow h_--h_+=2\\Rightarrow h_-h_+\\ne12"},{"id":"s6","latex":"a=2,\\ c=-2\\Rightarrow(h_-,h_+)=(4,4)\\Rightarrow h_-h_+=16"},{"id":"s7","latex":"a=c=2:\\quad v\u003c-2:(6,4),\\quad v=-2:(6,2),\\quad -2\u003cv\u003c0:(4,2)"},{"id":"s8","latex":"h_-h_+=12\\Rightarrow v=-2\\Rightarrow 2-\\frac{b^2}{4}=-2,\\quad b=-4"},{"id":"s9","latex":"g(t)=\\begin{cases}1&t\u003c-2\\\\2&t=-2\\\\4&-2\u003ct\u003c0\\\\3&t=0\\\\2&0\u003ct\\le2\\\\1&t>2\\end{cases}"},{"id":"s10","latex":"f(-2)+f(6)=-|-4+2|+(36-24+2)=12"}],"diagram":null,"contentHash":"5c96a59ad9bf73863d8a05a738e64a2636aa8b89881f0b3856177aa3541f408f","questionHtml":"\u003cp class=\"hp\">세 실수 \u003cspan class=\"heq\">\\(a\\)\u003c/span>, \u003cspan class=\"heq\">\\(b\\)\u003c/span>, \u003cspan class=\"heq\">\\(c\\)\u003c/span>에 대하여 함수 \u003cspan class=\"heq\">\\(f \\left( x \\right)\\)\u003c/span>는\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\(f \\left( x \\right) = {\\begin{cases}\\,- \\left| 2x+a \\right| &\\, \\left( x\\,\\lt \\,0 \\right) \\\\ \\,x^{2} +bx+c &\\, \\left( x\\, \\geq 0 \\right) \\end{cases}}\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">이고, 함수 \u003cspan class=\"heq\">\\(\\left| f \\left( x \\right) \\right|\\)\u003c/span>는 실수 전체의 집합에서 연속이다.\u003cbr>실수 \u003cspan class=\"heq\">\\(t\\)\u003c/span>에 대하여 직선 \u003cspan class=\"heq\">\\(y=t\\)\u003c/span>가 두 함수 \u003cspan class=\"heq\">\\(y=f \\left( x \\right)\\)\u003c/span>, \u003cspan class=\"heq\">\\(y= \\left| f \\left( x \\right) \\right|\\)\u003c/span>의 그래프와 만나는 점의 개수를 각각 \u003cspan class=\"heq\">\\(g \\left( t \\right)\\)\u003c/span>, \u003cspan class=\"heq\">\\(h \\left( t \\right)\\)\u003c/span>라 할 때, 두 함수 \u003cspan class=\"heq\">\\(g \\left( t \\right)\\)\u003c/span>, \u003cspan class=\"heq\">\\(h \\left( t \\right)\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) 함수 \u003cspan class=\"heq\">\\(g \\left( t \\right)\\)\u003c/span>의 치역은 \u003cspan class=\"heq\">\\(\\left\\{ \\,1,\\,2,\\,3,\\,4 \\right\\}\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp\">(나) \u003cspan class=\"heq\">\\(\\lim\\limits_{t\\, \\to  \\,2-} {h \\left( t \\right)} \\, \\times \\lim\\limits_{t\\, \\to  \\,2+} {h \\left( t \\right)} =12\\)\u003c/span>\u003c/p>\u003c/div>\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(f \\left( -2 \\right) +f \\left( 6 \\right)\\)\u003c/span>의 값은? \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">① \u003cspan class=\"heq\">\\(12\\)\u003c/span>&emsp;② \u003cspan class=\"heq\">\\(14\\)\u003c/span>&emsp;③ \u003cspan class=\"heq\">\\(16\\)\u003c/span>&emsp;④ \u003cspan class=\"heq\">\\(18\\)\u003c/span>&emsp;⑤ \u003cspan class=\"heq\">\\(20\\)\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"4144b0eaf77ba3e95264a7b438857d87228a5f7550c152fd5fa9574996087c04"};</script>
<script>window.HandStudyGuide={"itemId":7738,"sourceHash":"4386282d5a5480ff72b494b996d9561563f08604c54afc10f4ae2e62574ea561","contentHash":"5c96a59ad9bf73863d8a05a738e64a2636aa8b89881f0b3856177aa3541f408f","overview":{"goal":"수평선과 두 그래프의 교점 수가 바뀌는 높이를 추적해 \\(a,b,c\\)를 정해요.","firstLook":"\\(h(t)\\)는 \\(t>0\\)에서 \\(f=t\\)인 점과 \\(f=-t\\)인 점을 모두 세므로 \\(h(t)=g(t)+g(-t)\\)예요.","conditions":[{"label":"연속성","meaning":"\\(x=0\\)에서 \\(|f|\\)의 좌우 값이 같아 \\(|a|=|c|\\)예요."},{"label":"(가)","meaning":"교점 수가 \\(1,2,3,4\\)를 모두 가져야 하므로 왼쪽 조각과 오른쪽 포물선의 위치가 제한돼요."},{"label":"(나)","meaning":"높이 \\(2\\)의 바로 아래와 위에서 교점 수의 곱이 \\(12\\)가 되게 하는 변화점을 찾아요."}]},"chapters":[{"id":"c1","label":"그래프의 경계값과 꼭짓점을 잡아요","stepIds":["s1","s2","s3"],"question":"왜 \\(h(t)\\)를 \\(g(t)+g(-t)\\)로 셀 수 있을까요?","hint":"\\(|f(x)|=t\\)는 \\(f(x)=t\\) 또는 \\(f(x)=-t\\)와 같아요.","explanation":"\\(x\\to0-\\)에서 \\(|f(x)|\\to|a|\\), \\(x=0\\)에서 \\(|f(0)|=|c|\\)이므로 연속성에서 \\(|a|=|c|\\)예요. 왼쪽 조각 \\(-|2x+a|\\)가 \\(x<0\\)에서 수평선과 두 번 만나려면 꼭짓점 \\(x=-a/2\\)가 이 구간 안에 있어야 하므로 \\(a>0\\)이에요. 이때 \\(-a<t<0\\)에서는 왼쪽 교점이 두 개이고, 그 밖의 음의 높이에서는 한 개예요. 오른쪽 포물선도 교점 두 개를 만들려면 축 \\(x=-b/2\\)가 \\(x>0\\)에 있어야 하므로 \\(b<0\\)이에요. 따라서 \\(c=\\pm a\\)이고, 꼭짓점 높이 \\(v=c-b^2/4\\)가 양수이면 음의 높이에서 두 조각의 교점 수가 합쳐져 \\(3\\)이나 \\(4\\)가 될 수 없으므로 \\(v\\le0\\)이에요. 이제 \\(t>0\\)에서 \\(|f|=t\\)의 해는 \\(f=t\\)의 해와 \\(f=-t\\)의 해가 겹치지 않으므로 \\(h(t)=g(t)+g(-t)\\)예요.","check":{"prompt":"\\(t>0\\)에서 \\(f=t\\)와 \\(f=-t\\)의 해가 겹치지 않는 이유는 무엇인가요?","answer":"한 점에서 두 식이 함께 성립하면 \\(t=-t\\), 즉 \\(t=0\\)이어야 하기 때문이에요."}},{"id":"c2","label":"높이 2에서 바뀔 수 있는 원인을 찾아요","stepIds":["s4","s5","s6","s7"],"question":"\\(h(t)\\)의 좌우 극한이 달라지려면 높이 \\(2\\)가 어떤 특별한 높이여야 할까요?","hint":"왼쪽 절댓값 조각의 꼭대기 높이 \\(a\\)와 포물선의 꼭짓점 높이 \\(v\\)를 확인해요.","explanation":"\\(a\\ne2\\)이고 \\(v\\ne-2\\)이면 \\(t=2\\)를 지날 때 \\(g(t)\\)와 \\(g(-t)\\)의 교점 수가 바뀌지 않아 두 좌우 극한이 같고, 같은 자연수의 제곱은 \\(12\\)가 될 수 없어요. \\(a\\ne2,\\ v=-2\\)이면 포물선 접점 때문에 두 값의 차가 \\(2\\)인데 가능한 교점 수를 대조해도 곱이 \\(12\\)가 되지 않아요. 따라서 \\(a=2\\)여야 해요.\n\n\\(c=-2\\)이면 좌우 교점 수가 \\((4,4)\\)라 곱이 \\(16\\)이에요. \\(c=2\\)일 때는 \\(v<-2\\)이면 \\((6,4)\\), \\(v=-2\\)이면 \\((6,2)\\), \\(-2<v<0\\)이면 \\((4,2)\\)가 돼요. 곱 \\(12\\)를 만드는 경우는 \\(c=2,\\ v=-2\\)뿐이에요.","check":{"prompt":"\\(a=2,c=2\\)에서 곱이 \\(12\\)가 되는 좌우 교점 수의 순서쌍은 무엇인가요?","answer":"\\(v=-2\\)일 때 \\((6,2)\\)이고 곱이 \\(12\\)예요."}},{"id":"c3","label":"꼭짓점 높이로 계수를 정해요","stepIds":["s8","s9"],"question":"\\(v=-2\\)가 \\(b=-4\\)를 주는 과정에서 왜 음의 해를 골라야 할까요?","hint":"앞에서 치역 조건으로 얻은 \\(b<0\\)을 다시 사용해요.","explanation":"\\(a=c=2\\)이고 \\(v=c-b^2/4=-2\\)이므로 \\(2-b^2/4=-2\\), 즉 \\(b^2=16\\)이에요. 앞에서 \\(b<0\\)을 얻었으므로 \\(b=-4\\)예요. 이때 실제 교점 수는 \\(t<-2\\)에서 \\(1\\), \\(t=-2\\)에서 \\(2\\), \\(-2<t<0\\)에서 \\(4\\), \\(t=0\\)에서 \\(3\\), \\(0<t\\le2\\)에서 \\(2\\), \\(t>2\\)에서 \\(1\\)이라 (가)의 치역도 정확히 \\(\\{1,2,3,4\\}\\)예요.","check":{"prompt":"\\(b=4\\)를 버리는 원문 근거는 무엇인가요?","answer":"교점 수의 치역을 분석하면서 포물선의 축이 양수 쪽에 오도록 \\(b<0\\)을 이미 얻었기 때문이에요."}},{"id":"c4","label":"두 조각에 각각 대입해요","stepIds":["s10"],"question":"\\(f(-2)\\)와 \\(f(6)\\)에는 각각 어느 식을 써야 할까요?","hint":"\\(-2<0\\), \\(6\\ge0\\)을 먼저 확인해요.","explanation":"\\(x=-2\\)에는 왼쪽 식을 써서 \\(f(-2)=-|-4+2|=-2\\)예요. \\(x=6\\)에는 오른쪽 식을 써서 \\(f(6)=36-24+2=14\\)예요. 따라서 합은 \\(-2+14=12\\)이고 정답은 ①이에요.","check":{"prompt":"마지막 합에서 절댓값 앞의 음수를 놓치지 않으면 두 함숫값은 각각 얼마인가요?","answer":"\\(f(-2)=-2,\\ f(6)=14\\)여서 합은 \\(12\\)예요."}}],"takeaway":["절댓값 그래프의 양의 높이 교점은 원래 함수의 \\(t\\)와 \\(-t\\) 교점을 합쳐 세어요.","교점 수의 좌우 극한이 바뀌는 높이는 조각의 끝값이나 꼭짓점 높이에서 찾아요.","매개변수의 두 부호가 나오면 앞서 얻은 그래프 위치 조건으로 골라요."]};</script>
