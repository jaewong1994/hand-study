<script>window.HandStudyRecord={"itemId":8064,"sourceLabel":"2021 교육청 고2 수학 6월 17번","adminYear":2021,"grade":2,"month":6,"number":17,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"$0\u003c\\theta\u003c \\frac{\\pi}{4}$인 임의의 실수 $\\theta$에 대하여 그림과 같이 $\\overline{AB}=3$, $\\angle {ABC}=\\theta$, $\\angle {CAB}=3\\theta$인 삼각형 $ABC$가 있다. 선분 $BC$ 위에 점 $D$를 $\\angle {DAC}=\\theta$가 되도록 잡고, 선분 $AC$ 위에 점 $E$를 $\\angle {EDC}=\\theta$가 되도록 잡는다. 다음은 삼각형 $ADE$의 넓이 $S\\, \\left( \\theta \\right)$를 구하는 과정이다.\n$\\angle {ABC}=\\theta$, $\\angle {DAB}=2\\theta$이므로 $\\angle {BDA}=\\pi-3\\theta$이다.삼각형 $ABD$에서 사인법칙에 의하여 $\\frac{\\overline{AD}}{\\sin{\\theta}} = \\frac{\\overline{AB}}{box{\\,(가)\\,}}$ 이므로 $\\overline{AD}= \\frac{3\\sin{\\theta}}{box{\\,(가)\\,}}$이다.또한 $\\angle {ADE}=2\\theta$이므로 $\\overline{DE}=box{\\,(나)\\,}\\times{\\overline{AD}} ^{2}$ 이다. 따라서 삼각형 $ADE$의 넓이 $S\\, \\left( \\theta \\right)$는 $S\\, \\left( \\theta \\right) = \\frac{9}{2} \\times \\left( \\frac{\\sin{\\theta}}{\\sin{3\\theta}} \\right) ^{3} \\times{box{\\,(다)\\,}}$ 이다.\n위의 (가), (다)에 알맞은 식을 각각 $f \\left( \\theta \\right)$, $g \\left( \\theta \\right)$라 하고, (나)에 알맞은 수를 $p$라 할 때, $p{\\times}f \\left( \\frac{\\pi}{6} \\right) \\times{g \\left( \\frac{\\pi}{12} \\right) }$의 값은? [4점]\n① $\\frac{1}{12}$ ② $\\frac{1}{6}$ ③ $\\frac{1}{4}$ ④ $\\frac{1}{3}$ ⑤ $\\frac{5}{12}$","answer":"②","sourceHash":"c64d830187e92511b60d5b8fa284c07ed488bad2efc6d0633690a5329a79ed1b","steps":[{"id":"s1","latex":"f(\\theta)=\\sin(\\pi-3\\theta)=\\sin3\\theta\\Rightarrow p=\\frac13"},{"id":"s2","latex":"g(\\theta)=\\sin2\\theta"},{"id":"s3","latex":"p f\\left(\\frac\\pi6\\right)g\\left(\\frac\\pi{12}\\right)=\\frac13\\cdot1\\cdot\\frac12=\\frac16"}],"diagram":null,"contentHash":"3e1a899b3f5bedd3e10d618cba353cd7351889e6e48bf650e04c64537906dc1b","questionHtml":"\u003cp class=\"hp htall\">\u003cspan class=\"heq\">\\(0\\lt \\theta\\lt  \\dfrac{\\pi}{4}\\)\u003c/span>인 임의의 실수 \u003cspan class=\"heq\">\\(\\theta\\)
