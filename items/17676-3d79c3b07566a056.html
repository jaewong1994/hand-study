<script>window.HandStudyGuide={"itemId":17676,"sourceHash":"3777d1c452f9584018b2ef25aa0337f89966c19d636c1122e23f419b42385ed5","contentHash":"9d376c56dc814ab93f2fa3323db079a0ba5f7eeb90da46907a2a86b78a7666ef","overview":{"goal":"작은 원의 접선 관계로 반지름과 중심 방향을 정하고, 여러 각의 차를 이용해 목표 사인값을 구해요.","firstLook":"작은 원의 중심을 \\(I\\), 반지름을 \\(\\rho\\)로 두어요. 호에 안쪽으로 접하므로 \\(O,I\\)와 접점이 한 직선 위에 있고 \\(OI=8-\\rho\\)예요.","conditions":[{"label":"두 직선과 큰 원호에 동시에 접함","meaning":"중심 \\(I\\)는 직각의 이등분선 위에 있고, 큰 원의 중심까지 거리는 두 반지름의 차예요."},{"label":"두 반지름 사이의 주어진 코사인","meaning":"접선으로 생기는 같은 각 두 개를 이용해 \\(\\angle COE=2\\beta\\)로 나타내요."}]},"chapters":[{"id":"c1","label":"작은 원의 반지름 구하기","stepIds":["s1","s2"],"question":"작은 원의 중심에서 \\(OC\\)까지의 거리와 \\(OI\\)를 이용하면 \\(\\sin\\beta\\)는 어떻게 나타날까요?","hint":"\\(\\beta=\\angle COI\\)로 두고 직선 \\(OC\\)에 내린 수선의 길이가 \\(\\rho\\)임을 쓰세요.","explanation":"작은 원이 큰 원호에 안쪽으로 접하므로 \\(OI=8-\\rho\\)예요. 또 작은 원이 \\(OC\\)에 접하므로 \\(I\\)에서 \\(OC\\)까지의 수선 길이가 \\(\\rho\\)이고, \\(\\beta=\\angle COI\\)로 두면 \\(\\sin\\beta=\\rho/(8-\\rho)\\)예요.\n\n\\(OE\\)도 작은 원의 접선이라 직각삼각형에서 \\(\\angle IOE=\\beta\\)가 되고, 그림의 배치에서 \\(\\angle COE=2\\beta\\)예요. 따라서 \\(\\cos2\\beta=7/25\\)이고 \\(\\sin^2\\beta=(1-\\cos2\\beta)/2=9/25\\)예요. \\(\\beta\\)는 예각이므로 \\(\\sin\\beta=3/5\\)예요. \\(\\rho/(8-\\rho)=3/5\\)를 풀면 \\(\\rho=3\\), \\(OI=5\\)예요.","check":{"prompt":"\\(\\sin\\beta=-3/5\\)를 쓰지 않는 이유는 무엇인가요?","answer":"\\(\\beta\\)는 도형 안의 예각이어서 사인값이 양수예요."}},{"id":"c2","label":"중심의 방향각 구하기","stepIds":["s3"],"question":"직각의 꼭짓점 \\(D\\)에서 작은 원의 중심이 가로와 세로로 각각 3만큼 떨어진다는 조건은 어떤 거리식을 만들까요?","hint":"\\(\\varphi=\\angle BOC\\)로 두고 \\(OD=8\\cos\\varphi\\)를 사용하세요.","explanation":"\\(\\varphi=\\angle BOC\\)로 두면 \\(OD=8\\cos\\varphi\\)예요. 작은 원은 서로 수직인 \\(BD,CD\\)에 접하므로 중심 \\(I\\)는 \\(D\\)에서 두 방향으로 각각 3만큼 떨어져요. 따라서 \\(OI=5\\)를 제곱한 식이 \\((8\\cos\\varphi+3)^2+3^2=25\\)예요. 여기서 \\(D\\)가 선분 \\(OC\\) 위에 있는 배치에 맞는 해는 \\(\\cos\\varphi=1/8\\)이고, \\(\\varphi\\)는 예각이므로 \\(\\sin\\varphi=3\\sqrt7/8\\)이에요.","check":{"prompt":"거리식의 다른 해 \\(\\cos\\varphi=-7/8\\)을 버리는 이유는 무엇인가요?","answer":"그 해는 \\(OD=8\\cos\\varphi<0\\)이 되어 수선의 발 \\(D\\)가 선분 \\(OC\\) 위에 있다는 그림의 배치와 맞지 않아요."}},{"id":"c3","label":"각의 차를 전개해 답 구하기","stepIds":["s4","s5"],"question":"\\(\\cos(2\\beta-\\varphi)\\)를 전개할 때 네 삼각비는 각각 얼마인가요?","hint":"\\(\\cos2\\beta=7/25\\), \\(\\sin2\\beta=24/25\\)와 앞에서 구한 값을 사용하세요.","explanation":"각의 배치에서 \\(\\sin\\angle AOE=\\cos(2\\beta-\\varphi)\\)예요. \\(\\cos2\\beta=7/25\\)이고 \\(\\beta\\)가 예각이므로 \\(\\sin2\\beta=24/25\\)예요. 따라서\n\n\\(\\cos(2\\beta-\\varphi)=\\frac7{25}\\cdot\\frac18+\\frac{24}{25}\\cdot\\frac{3\\sqrt7}{8}=\\frac7{200}+\\frac{9\\sqrt7}{25}\\)\n\n예요. \\(p=7/200\\), \\(q=9/25=72/200\\)이므로 \\(200(p+q)=79\\)예요.","check":{"prompt":"\\(q=9/25\\)를 분모 200으로 바꾸면 얼마인가요?","answer":"\\(9/25=72/200\\)이에요."}}],"takeaway":["두 원이 안쪽으로 접하면 두 중심 사이 거리는 반지름의 차예요.","한 원이 서로 수직인 두 직선에 접하면 중심에서 두 직선까지의 거리가 모두 반지름과 같아요.","도형에서 정한 각의 범위로 제곱근의 부호와 거리식의 해를 선택해요."]};</script>
