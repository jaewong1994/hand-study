<script>window.HandStudyRecord={"itemId":12109,"sourceLabel":"2025 교육청 고1 수학 10월 30번","adminYear":2025,"grade":1,"month":10,"number":30,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"두 상수 $p\\, \\left(p > 0 \\right)\\,$, $q\\,$에 대하여 이차함수 $f \\left(x \\right)=\\frac{1}{2} \\left(x-p \\right)^{2}+q\\,$가 있다. 함수 $f \\left(x \\right)\\,$와 양수 $m\\,$에 대하여 함수 $g \\left(x \\right)\\,$를\n $g \\left(x \\right)=\\,-f \\left(x-m \\right)\\,$\n이라 할 때, 방정식 $f \\left(x \\right)=g \\left(x \\right)\\,$가 서로 다른 두 실근 $\\alpha\\,$, $\\beta \\, \\left( \\alpha \u003c \\beta \\right)\\,$를 갖는다. 함수 $h \\left(x \\right)\\,$를\n $h \\left(x \\right)= \\begin{cases}\\,f \\left(x \\right) & & \\left(x \\leq \\alpha \\,또는\\,x \\geq \\beta \\right) \\\\ \\, g \\left(x \\right) & & \\left( \\alpha \u003c x \u003c \\beta \\right)\\end{cases}\\,$\n라 할 때, 함수 $h \\left(x \\right)\\,$는 다음 조건을 만족시킨다.\n$x\\,$에 대한 방정식 $h \\left(x \\right)=t\\,$의 서로 다른 실근의 개수가 $2$ 이상이면서 서로 다른 모든 실근의 합이 $4p+2m\\,$이 되도록 하는 모든 실수 $t\\,$의 값의 범위는 $g \\left(p \\right) \u003c t \u003c 5\\,$이다.\n$f \\left(m \\right)+g \\left(m \\right)=\\,-4\\,$일 때, $m \\times \\left(p-q \\right)\\,$의 값을 구하시오. [4점]","answer":"16","sourceHash":"f62b49bb3e727de4f3d2556223b87ec2655296cc3a319ff046998a747d11ebfa","steps":[{"id":"s1","latex":"g(x)=-\\frac12(x-p-m)^2-q"},{"id":"s2","latex":"f(x)=g(x)\\Rightarrow\\alpha=p+\\frac m2-w,\\ \\beta=p+\\frac m2+w,\\quad w^2=-2q-\\frac{m^2}{4}"},{"id":"s3","latex":"\\sum\\{f(x)=t\\}=2p,\\quad\\sum\\{g(x)=t\\}=2p+2m"},{"id":"s4","latex":"\\sum\\{h(x)=t\\}=4p+2m\\Rightarrow\\text{두 }f\\text{근은 }(-\\infty,\\alpha]\\cup[\\beta,\\infty),\\ \\text{두 }g\\text{근은 }(\\alpha,\\beta)"},{"id":"s5","latex":"f(\\beta)\u003ct\u003c-q\\equiv g(p)\u003ct\u003c5\\Rightarrow q=-5,\\quad f(\\beta)=g(p)"},{"id":"s6","latex":"w^2=10-\\frac{m^2}{4},\\quad\\frac12\\left(\\frac m2+w\\right)^2-5=5-\\frac{m^2}{2}"},{"id":"s7","latex":"mw=10-m^2\\Rightarrow(m^2-4)(m^2-20)=0"},{"id":"s8","latex":"m>0,\\ w>0,\\ mw= 003c/span>이 되도록 하는 모든 실수 \u003cspan class=\"heq\">\\(t\\,\\)\u003c/span>의 값의 범위는 \u003cspan class=\"heq\">\\(g \\left(p \\right) \\lt  t \\lt  5\\,\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(f \\left(m \\right)+g \\left(m \\right)=\\,-4\\,\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(m \\times \\left(p-q \\right)\\,\\)\u003c/span>의 값을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"ad9c48677c4a8b1f5f0891ed6ff81c728688521308c48aa7b95eb456cf75387e"};</script>
<script>window.HandStudyGuide={"itemId":12109,"sourceHash":"f62b49bb3e727de4f3d2556223b87ec2655296cc3a319ff046998a747d11ebfa","contentHash":"7b9c79ccecab8953e692f9718e5a11f49d357f8ba60dacc8b5d0a5ddec4fd639","overview":{"goal":"위로 열린 포물선과 이동한 아래로 열린 포물선의 네 근 합 조건으로 \\(p,q,m\\)을 정해요.","firstLook":"각 포물선과 수평선의 두 교점은 대칭축을 중심으로 대칭이므로 두 근의 합을 바로 알 수 있어요.","conditions":[{"label":"두 교점","meaning":"\\(f=g\\)의 두 근을 중심과 반폭으로 표현해 조각 경계를 잡아요."},{"label":"t의 열린 범위","meaning":"네 근이 모두 자기 조각 안에 있는 높이의 아래끝과 위끝이 각각 어떤 함숫값인지 맞춰요."}]},"chapters":[{"id":"c1","label":"두 포물선의 교점을 나타내요","stepIds":["s1","s2"],"question":"\\(\\alpha,\\beta\\)는 왜 \\(p+m/2\\)를 중심으로 대칭인가요?","hint":"\\(g(x)=-\\frac12(x-p-m)^2-q\\)를 \\(f(x)\\)와 같게 놓아요.","explanation":"\\(g(x)=-f(x-m)=-\\frac12(x-p-m)^2-q\\)예요. \\(f(x)=g(x)\\)를 정리하면 중심이 \\(p+m/2\\)인 제곱식이 되고, \\(w^2=-2q-m^2/4\\)라 두면 \\(\\alpha=p+m/2-w\\), \\(\\beta=p+m/2+w\\)예요. 서로 다른 두 실근이므로 \\(w>0\\)이에요.","check":{"prompt":"두 교점이 서로 다르다는 조건은 \\(w\\)에 어떻게 나타나나요?","answer":"반폭 \\(w\\)가 \\(0\\)보다 커야 \\(\\alpha<\\beta\\)가 돼요."}},{"id":"c2","label":"네 근의 합이 되는 높이를 찾아요","stepIds":["s3","s4","s5"],"question":"근의 합 \\(4p+2m\\)은 언제 나오나요?","hint":"\\(f(x)=t\\)의 두 근 합과 \\(g(x)=t\\)의 두 근 합을 더해요.","explanation":"\\(f(x)=t\\)의 두 근은 대칭축 \\(x=p\\)에 대칭이므로 합이 \\(2p\\)예요. \\(g(x)=t\\)의 두 근은 대칭축 \\(x=p+m\\)에 대칭이므로 합이 \\(2p+2m\\)예요. 네 근이 모두 \\(h\\)의 해당 조각에 들어가면 전체 합은 \\(4p+2m\\)이에요.\n\n이 상황은 두 \\(f\\)의 근이 바깥 구간에, 두 \\(g\\)의 근이 안쪽 구간에 있을 때예요. 높이 범위는 아래에서 \\(f(\\beta)\\)보다 크고 위에서 \\(g\\)의 꼭짓점 값 \\(-q\\)보다 작은 범위예요. 주어진 범위 \\(g(p)<t<5\\)와 끝점을 맞추면 \\(-q=5\\), 즉 \\(q=-5\\), 그리고 \\(f(\\beta)=g(p)\\)예요.","check":{"prompt":"범위의 위끝 \\(5\\)가 포함되지 않는 이유는 무엇인가요?","answer":"꼭짓점 높이에서는 \\(g(x)=t\\)의 두 근이 하나로 합쳐져 네 근 구성이 깨지기 때문이에요."}},{"id":"c3","label":"끝점 등식으로 m을 정해요","stepIds":["s6","s7","s8"],"question":"\\(m=2,w=3\\)은 어떻게 결정되나요?","hint":"\\(f(\\beta)=g(p)\\)에 \\(q=-5\\), \\(\\beta-p=m/2+w\\)를 넣어요.","explanation":"\\(q=-5\\)에서 \\(w^2=10-m^2/4\\)예요. 또 \\(f(\\beta)=\\frac12(m/2+w)^2-5\\), \\(g(p)=5-m^2/2\\)이므로 등식에서 \\(mw=10-m^2\\)를 얻어요. 이를 제곱하고 \\(w^2=10-m^2/4\\)를 넣으면 \\((m^2-4)(m^2-20)=0\\)이에요.\n\n\\(m>0,w>0\\)이고 \\(mw=10-m^2>0\\)이므로 \\(m^2<10\\)이어야 해요. 따라서 \\(m^2=20\\)은 제외되고 \\(m=2\\), 이어서 \\(w=3\\)이에요.","check":{"prompt":"제곱해서 얻은 \\(m^2=20\\)을 왜 버리나요?","answer":"원래 식 \\(mw=10-m^2\\)의 왼쪽은 양수인데 \\(m^2=20\\)이면 오른쪽이 음수이기 때문이에요."}},{"id":"c4","label":"마지막 조건으로 p를 구해요","stepIds":["s9","s10"],"question":"\\(f(m)+g(m)=-4\\)에서 \\(p\\)는 얼마인가요?","hint":"\\(m=2,q=-5\\)를 두 식에 넣고 제곱항을 정리해요.","explanation":"\\(f(m)+g(m)=\\frac12(m-p)^2-5-\\frac12p^2+5\\)예요. \\(m=2\\)를 넣으면 \\(2-2p=-4\\)이므로 \\(p=3\\)이에요. 따라서 \\(m(p-q)=2\\{3-(-5)\\}=16\\)이에요.","check":{"prompt":"구한 \\(p,q,m\\)은 문제의 부호 조건을 만족하나요?","answer":"\\(p=3>0\\), \\(m=2>0\\)이고 \\(w=3>0\\)이라 두 교점도 서로 달라요."}}],"takeaway":["포물선과 수평선의 두 교점 합은 대칭축의 두 배예요.","조각함수에서 네 근을 모두 쓰려면 각 근이 자기 조각에 들어가는 높이 범위를 찾아야 해요.","방정식을 제곱해 새 후보가 생기면 원래 부호 조건에 다시 넣어 걸러요."]};</script>
