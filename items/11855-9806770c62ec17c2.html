  <script>window.HandStudyRecord={"itemId":11855,"sourceLabel":"2022 교육청 고1 수학 6월 16번","adminYear":2022,"grade":1,"month":6,"number":16,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 한 변의 길이가 $2\\,$인 정삼각형 $ABC\\,$에 대하여 변 $BC\\,$의 중점을 $P\\,$라 하고, 선분 $AP$ 위의 점 $Q\\,$에 대하여 선분 $PQ\\,$의 길이를 $x\\,$라 하자. ${\\overline{AQ}} ^{2} + {\\overline{BQ}} ^{2} + {\\overline{CQ}} ^{2} \\,$은 $x=a\\,$에서 최솟값 $m\\,$을 가진다. $\\frac{m}{a} \\,$의 값은? (단, $0\u003cx\u003c \\sqrt{3} \\,$이고, $a\\,$는 실수이다.) [4점]\n$A$$B$$C$$P$$Q$\n① $3 \\sqrt{3}$ ② $\\frac{7}{2} \\sqrt{3}$ ③ $4 \\sqrt{3}$ ④ $\\frac{9}{2} \\sqrt{3}$ ⑤ $5 \\sqrt{3}$","answer":"③","sourceHash":"0bdd504ba016edb7d87ad82fb24d372e903d9779ad2cc730b2e3647ded794d4a","steps":[{"id":"s1","latex":"AP=\\sqrt3,\\quad BP=CP=1,\\quad PQ=x"},{"id":"s2","latex":"AQ=\\sqrt3-x,\\quad BQ^2=CQ^2=1+x^2"},{"id":"s3","latex":"F(x)=AQ^2+BQ^2+CQ^2"},{"id":"s4","latex":"F(x)=(\\sqrt3-x)^2+2(1+x^2)=3x^2-2\\sqrt3x+5"},{"id":"s5","latex":"F(x)=3\\left(x-\\frac{\\sqrt3}{3}\\right)^2+4"},{"id":"s6","latex":"a=\\frac{\\sqrt3}{3},\\quad m=4,\\quad\\frac ma=4\\sqrt3"}],"diagram":null,"contentHash":"4db0dac209202abac29b88899dfafa050b4b52b3844cfad47344526c3f17c7a3","questionHtml":"\u003cp class=\"hp htall\">그림과 같이 한 변의 길이가 \u003cspan class=\"heq\">\\(2\\,\\)\u003c/span>인 정삼각형 \u003cspan class=\"heq\">\\(ABC\\)\u003c/span>에 대하여 변 \u003cspan class=\"heq\">\\(BC\\)\u003c/span>의 중점을 \u003cspan class=\"heq\">\\(P\\)\u003c/span>라 하고, 선분 \u003cspan class=\"heq\">\\(AP\\)\u003c/span> 위의 점 \u003cspan class=\"heq\">\\(Q\\)\u003c/span>에 대하여 선분 \u003cspan class=\"heq\">\\(PQ\\)\u003c/span>의 길이를 \u003cspan class=\"heq\">\\(x\\)\u003c/span>라 하자. \u003cspan class=\"heq\">\\({\\overline{AQ}}^{2} + {\\overline{BQ}}^{2} + {\\overline{CQ}}^{2} \\,\\)\u003c/span>은 \u003cspan class=\"heq\">\\(x=a\\)\u003c/span>에서 최솟값 \u003cspan class=\"heq\">\\(m\\)\u003c/span>을 가진다. \u003cspan class=\"heq\">\\(\\dfrac{m}{a} \\,\\)\u003c/span>의 값은? (단, \u003cspan class=\"h
