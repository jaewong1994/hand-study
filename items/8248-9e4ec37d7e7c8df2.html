  <script>window.HandStudyRecord={"itemId":8248,"sourceLabel":"2023 교육청 고2 수학 3월 21번","adminYear":2023,"grade":2,"month":3,"number":21,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"좌표평면 위에 사분원의 호 $C\\,:\\,x ^{2} +y ^{2} =25\\,$($x \\leq 0$, $y \\geq 0$)과 점 $A \\left( 4,\\,2 \\right) \\,$가 있다. 호 $C$ 위를 움직이는 점 $P\\,$에 대하여 점 $Q\\,$를 삼각형 $APQ\\,$의 무게중심이 원점과 일치하도록 잡는다. 점 $A\\,$를 원점에 대하여 대칭이동한 점을 $A'\\,$이라 할 때, \u003c보기>에서 옳은 것만을 있는 대로 고른 것은? [4점]\n\u003c보기>\nㄱ. 선분 $PQ\\,$의 중점의 좌표는 $\\left( -2,\\,-1 \\right) \\,$이다.\nㄴ. 선분 $A'Q\\,$의 길이는 항상 일정하다.\nㄷ. 삼각형 $A'QP\\,$의 넓이의 최댓값과 최솟값을 각각 $M$, $m\\,$이라 할 때, $M \\times m=20 \\sqrt{5} \\,$이다.\n① ㄱ ② ㄱ, ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","answer":"②","sourceHash":"5db874555381684563f6dd5fa544869de86027299b0d3e3d556d9026132b8476","steps":[{"id":"s1","latex":"P=(p,q),\\ Q=(r,s),\\quad A+P+Q=(0,0)"},{"id":"s2","latex":"p+r=-4,\\ q+s=-2\\Rightarrow\\operatorname{mid}(PQ)=(-2,-1)\\quad\\text{(\\char\"3131 참)}"},{"id":"s3","latex":"A^\\prime=(-4,-2),\\quad Q=(-4-p,-2-q)"},{"id":"s4","latex":"A^\\prime Q=\\sqrt{p^2+q^2}=5\\quad\\text{(\\char\"3134 참)}"},{"id":"s5","latex":"[\\triangle A^\\prime QP]=2q-p"},{"id":"s6","latex":"p^2+q^2=25,\\ p\\le0,\\ q\\ge0"},{"id":"s7","latex":"M=5\\sqrt5\\text{ at }(-\\sqrt5,2\\sqrt5),\\quad m=5\\text{ at }(-5,0)"},{"id":"s8","latex":"Mm=25\\sqrt5\\ne20\\sqrt5\\quad\\text{(\\char\"3137 거짓)}"}],"diagram":null,"contentHash":"3a27ce4e55dd760b32b7abd1f93c5a329b5e1a7495fac31cc02d43ac422ccba7","questionHtml":"\u003cp class=\"hp\">좌표평면 위에 사분원의 호 \u003cspan class=\"heq\">\\(C\\,:\\,x^{2} +y^{2} =25\\,\\)\u003c/span>(\u003cspan class=\"heq\">\\(x \\leq 0\\)\u003c/span>, \u003cspan class=\"heq\">\\(y \\geq 0\\)\u003c/span>)과 점 \u003cspan class=\"heq\">\\(A \\left( 4,\\,2 \\right) \\,\\)\u003c/span>가 있다. 호 \u003cspan class=\"heq\">\\(C\\)\u003c/span> 위를 움직이는 점 \u003cspan class=\"heq\">\\(P\\,\\)\u003c/span>에 대하여 \u003cbr>점 \u003cspan class=\"heq\">\\(Q\\,\\)\u003c/span>를 삼각형 \u003cspan class=\"heq\">\\(APQ\\,\\)\u003c/span>의 무게중심이 원점과 일치하도록 잡는다. 점 \u003cspan class=\"heq\">\\(A\\,\\)\u003c/span>를 원점에 대하여 대칭이동한 점을 \u003cspan class=\"heq\">\\(A'\\,\\)\u003c/span>이라 할 때, &lt;보기&gt;에서 옳은 것만을 있는 대로 고른 것은? \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cdiv class=\"hbox\">\u003cdiv style=\"text-align:center;font-weight:700;margin:0 0 6px\">&lt; 보 기 &gt;\u003c/div>\u003cp class=\"hp\">ㄱ.선분 \u003cspan class=\"heq\">\\(P Q\\,\\)\u003c/span>의 중점의 좌표는 \u003cspan class=\"heq\">\\(\\left( -2,\\,-1 \\right) \\,\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp\">ㄴ.선분 \u003cspan class=\"heq\">\\(A'Q\\,\\)\u003c/span>의 길이는 항상 일정하다.\u003c/p>\u003cp class=\"hp\">ㄷ.삼각형 \u003cspan class=\"heq\">\\(A'QP\\,\\)\u003c/span>의 넓이의 최댓값과 최솟값을 각각 \u003cbr>\u003cspan class=\"heq\">\\(M\\)\u003c/span>, \u003cspan class=\"heq\">\\(m\\,\\)\u003c/span>이라 할 때, \u003cspan class=\"heq\">\\(M \\times m=20 \\sqrt{5} \\,\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp class=\"hp\">① ㄱ&emsp;② ㄱ, ㄴ&emsp;③ ㄱ, ㄷ\u003c/p>\u003cp class=\"hp\">④ ㄴ, ㄷ&emsp;⑤ ㄱ, ㄴ, ㄷ\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/b4cab2b79a4f5ba3ba21eb88.png\" style=\"width:259px;max-width:100%\">\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"9e4ec37d7e7c8df2a8bde225fa6449e2f28511d70ec6e8568a17eb6d393be26c"};</script>
