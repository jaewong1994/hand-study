<script>window.HandStudyRecord={"itemId":17722,"sourceLabel":"2023 교육청 고3 수학확통 7월 30번","adminYear":2023,"grade":3,"month":7,"number":30,"track":"확통","points":4,"scoreStatus":"confirmed_4_direct","questionText":"집합 $X= \\left\\{ 1,\\,2,\\,3,\\,4,\\,5,\\,6,\\,7 \\right\\}$에 대하여 다음 조건을 만족시키는 함수 $f: X \\,\\rightarrow\\, X$의 개수를 구하시오. [4점]\n (가) $f(7)-f(1)=3$\n(나) $5$ 이하의 모든 자연수 $n$에 대하여 $f \\left(n \\right) \\leq f \\left(n+2 \\right)$이다.\n(다) $\\frac{1}{3} \\left| f \\left( 2 \\right) -f \\left( 1 \\right) \\right|$과 $\\frac{1}{3} \\sum _{k=1} ^{4} f \\left( 2k-1 \\right)$의 값은 모두 자연수이다.","answer":"150","sourceHash":"cec657e127376d195080df13774693f0c1da0d3a4b4acb93e3f0759c0e4e95d1","steps":[{"id":"s1","latex":"a=f(1)\\in\\{1,2,3,4\\},\\quad u=f(3),\\ v=f(5),\\quad a\\le u\\le v\\le a+3"},{"id":"s2","latex":"2a+u+v\\text{는 }3\\text{의 배수}"},{"id":"s3","latex":"a=1:(u,v)=(1,3),(2,2),(3,4);\\quad a=2:(2,3),(3,5),(4,4)"},{"id":"s4","latex":"a=3:(u,v)=(3,3),(3,6),(4,5),(6,6);\\quad a=4:(4,6),(5,5),(6,7)"},{"id":"s5","latex":"b=f(2),\\quad|b-a|\\text{는 양의 }3\\text{의 배수},\\quad b\\le f(4)\\le f(6)\\le7"},{"id":"s6","latex":"a=1:\\ b=4,7\\Rightarrow{}_4H_2+{}_1H_2=11;\\quad a=2:\\ b=5\\Rightarrow{}_3H_2=6"},{"id":"s7","latex":"a=3:\\ b=6\\Rightarrow{}_2H_2=3;\\quad a=4:\\ b=1,7\\Rightarrow{}_7H_2+{}_1H_2=29"},{"id":"s8","latex":"3\\cdot11+3\\cdot6+4\\cdot3+3\\cdot29=150"}],"diagram":null,"contentHash":"09976e03a83bbecba9ae784964619a898092d755628126450737612ad776ce39","questionHtml":"\u003cp class=\"hp\">집합 \u003cspan class=\"heq\">\\(X= \\left\\{ 1,\\,2,\\,3,\\,4,\\,5,\\,6,\\,7 \\right\\}\\)\u003c/span>에 대하여 다음 조건을 만족시키는 함수 \u003cspan class=\"heq\">\\(f: X \\,\\rightarrow\\, X\\)\u003c/span>의 개수를 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) \u003cspan class=\"heq\">\\(f(7)-f(1)=3\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">(나) \u003cspan class=\"heq\">\\(5\\)\u003c/span> 이하의 모든 자연수 \u003cspan class=\"heq\">\\(n\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(f \\left(n \\right) \\leq f \\left(n+2 \\right)\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp htall\">(다) \u003cspan class=\"heq\">\\(\\dfrac{1}{3} \\left| f \\left( 2 \\right) -f \\left( 1 \\right) \\right|\\)\u003c/span>과 \u003cspan class=\"heq\">\\(\\dfrac{1}{3} \\sum\\limits_{k=1}^{4} f \\left( 2k-1 \\right)\\)\u003c/span>의 값은 모두 자연수이다.\u003c/p>\u003c/div>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"6b9f9b094f3c3623c7069f42fd297c4a901d39605d6c8e60aef5d10d8af0d26d"};</script>
<script>window.HandStudyGuide={"itemId":17722,"sourceHash":"cec657e127376d195080df13774693f0c1da0d3a4b4acb93e3f0759c0e4e95d1","contentHash":"09976e03a83bbecba9ae784964619a898092d755628126450737612ad776ce39","overview":{"goal":"홀수 자리와 짝수 자리의 비감소 조건을 따로 세고, 나머지 조건을 만족하는 선택 수를 첫 값별로 곱해 더해요.","firstLook":"조건 \\(f(n)\\le f(n+2)\\)는 홀수 자리끼리, 짝수 자리끼리만 연결해요. 따라서 \\(f(1)\\)을 정한 뒤 두 줄을 독립적으로 셀 수 있어요.","conditions":[{"label":"함숫값 범위","meaning":"모든 함숫값은 집합 \\(X=\\{1,2,\\ldots,7\\}\\) 안에 있어요."},{"label":"두 비감소열","meaning":"\\(f(1)\\le f(3)\\le f(5)\\le f(7)\\)과 \\(f(2)\\le f(4)\\le f(6)\\)을 만족해요."},{"label":"자연수 조건","meaning":"두 나눗셈의 값은 양의 자연수이므로 첫 번째 차는 0이 될 수 없고 두 식의 분자는 3의 배수예요."}]},"chapters":[{"id":"c1","label":"홀수 자리의 양 끝과 합동 조건을 정해요","stepIds":["s1","s2"],"question":"\\(a=f(1)\\)를 정하면 홀수 자리의 가운데 두 값은 어떤 조건을 만족할까요?","hint":"조건 (가)로 \\(f(7)=a+3\\)이고, 홀수 자리 합이 \\(3\\)의 배수예요.","explanation":"\\(a=f(1)\\)라 두면 \\(f(7)=a+3\\)이 \\(X\\) 안에 있어야 하므로 \\(a\\in\\{1,2,3,4\\}\\)예요. \\(u=f(3)\\), \\(v=f(5)\\)라 두면 비감소 조건에서 \\(a\\le u\\le v\\le a+3\\)이에요.\n\n홀수 자리 합은 \\(a+u+v+(a+3)=2a+u+v+3\\)이고 이를 \\(3\\)으로 나눈 값이 자연수예요. 따라서 \\(2a+u+v\\)가 \\(3\\)의 배수여야 해요.","check":{"prompt":"\\(a\\)가 \\(4\\)보다 클 수 없는 이유는 무엇인가요?","answer":"\\(f(7)=a+3\\le7\\)이어야 하므로 \\(a\\le4\\)예요."}},{"id":"c2","label":"홀수 자리의 가운데 값들을 직접 나열해요","stepIds":["s3","s4"],"question":"각 \\(a\\)에서 가능한 \\((u,v)\\)는 몇 쌍일까요?","hint":"네 개 연속 정수 사이에서 \\(u\\le v\\)인 쌍을 쓰고 합을 \\(3\\)으로 나눈 나머지를 확인해요.","explanation":"조건을 만족하는 쌍을 나열하면 \\(a=1\\)에서 \\((1,3),(2,2),(3,4)\\)의 \\(3\\)쌍, \\(a=2\\)에서 \\((2,3),(3,5),(4,4)\\)의 \\(3\\)쌍이에요.\n\n\\(a=3\\)에서는 \\((3,3),(3,6),(4,5),(6,6)\\)의 \\(4\\)쌍이고, \\(a=4\\)에서는 \\((4,6),(5,5),(6,7)\\)의 \\(3\\)쌍이에요. 각 쌍은 범위와 순서 조건을 만족하고 \\(2a+u+v\\)가 \\(3\\)의 배수인지 직접 확인한 목록이에요.","check":{"prompt":"\\(a=3,(u,v)=(4,5)\\)일 때 홀수 자리 합은 얼마인가요?","answer":"\\(3+4+5+6=18\\)이어서 \\(3\\)의 배수예요."}},{"id":"c3","label":"짝수 자리의 첫 값과 뒷값을 세어요","stepIds":["s5","s6","s7"],"question":"\\(b=f(2)\\)는 각 \\(a\\)에서 무엇이고, \\(f(4),f(6)\\)은 몇 가지일까요?","hint":"\\(|b-a|\\)는 양의 \\(3\\)의 배수이고 \\(1\\le b\\le7\\)이에요.","explanation":"가능한 차는 \\(3\\) 또는 \\(6\\)이에요. \\(a=1\\)이면 \\(b=4,7\\)이고, \\(b\\) 이상 \\(7\\) 이하에서 중복을 허용해 두 값 \\(f(4)\\le f(6)\\)을 고르면 \\({}_4\\mathrm H_2+{}_1\\mathrm H_2=10+1=11\\)가지예요.\n\n같은 방법으로 \\(a=2\\)이면 \\(b=5\\)라 \\({}_3\\mathrm H_2=6\\)가지, \\(a=3\\)이면 \\(b=6\\)이라 \\({}_2\\mathrm H_2=3\\)가지예요. \\(a=4\\)이면 \\(b=1,7\\)이라 \\({}_7\\mathrm H_2+{}_1\\mathrm H_2=28+1=29\\)가지예요.","check":{"prompt":"\\(b=4\\)일 때 \\(f(4),f(6)\\)의 선택이 \\({}_4\\mathrm H_2\\)인 이유는 무엇인가요?","answer":"사용할 수 있는 값 \\(4,5,6,7\\) 네 종류에서 중복을 허용해 두 값을 고르면 작은 순서대로 배치가 하나로 정해지기 때문이에요."}},{"id":"c4","label":"첫 값별 두 선택 수를 곱해 더해요","stepIds":["s8"],"question":"홀수 자리와 짝수 자리 선택 수를 어떻게 합칠까요?","hint":"a를 고정하면 두 줄 사이에 더 이상의 조건이 없으므로 곱하고, 서로 다른 a의 경우는 더해요.","explanation":"\\(a=1,2,3,4\\)에서 홀수 자리 선택 수는 각각 \\(3,3,4,3\\), 짝수 자리 선택 수는 각각 \\(11,6,3,29\\)예요. 따라서 전체 함수의 수는\n\\[\n3\\cdot11+3\\cdot6+4\\cdot3+3\\cdot29\n=33+18+12+87=150\n\\]\n이에요.","check":{"prompt":"같은 a에서 두 선택 수를 곱하는 이유는 무엇인가요?","answer":"홀수 자리의 가운데 값 선택과 짝수 자리 세 값 선택이 서로 독립이어서 각 홀수 선택마다 모든 짝수 선택을 붙일 수 있기 때문이에요."}}],"takeaway":["두 칸씩 떨어진 항의 대소 조건은 홀수 자리와 짝수 자리로 분리해 보아요.","합이 자연수라는 조건은 분자가 나눗수의 배수라는 나머지 조건으로 바꿔요.","공통으로 연결하는 첫 값을 고정하면 독립 선택은 곱하고 첫 값이 다른 경우는 더해요."]};</script>
