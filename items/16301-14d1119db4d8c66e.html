  <script>window.HandStudyRecord={"itemId":16301,"sourceLabel":"2019 교육청 고3 수리가형 5월 19번","adminYear":2019,"grade":3,"month":5,"number":19,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"집합 $X= \\left\\{ \\,1\\,,\\,2\\,,\\,3\\,,\\,4\\,,\\,5\\,,\\,6\\, \\right\\} \\,$에서 $X\\,$로의 함수 $f\\,$가\n $f(1) \\leq f(2) \\leq f(3) \\leq f(4)\\,$, $f(6)\\lt f(5)\\lt f(4)$\n를 만족시킬 때, 다음은 치역의 원소의 개수가 4인 함수 $f\\,$의 개수를 구하는 과정이다.\n함수 $f$의 치역의 원소 중에서 가장 큰 값은 $f(4)$이고,\n함수 $f$의 치역의 원소의 개수가 4이므로 $f(4) \\geq 4$이다.\n이때 $f(4)=k\\,(\\,k=4\\,,\\,5\\,,\\,6\\,)$으로 놓자.\n(ⅰ) $f(6)\\lt f(5)\\lt f(4)\\,$이므로 $f(5),\\,f(6)$의 값을 정할 때,\n 그 경우의 수는 ${\\boxed{\\vphantom{(}\\,(\\text{가})\\,}}$이다.\n(ⅱ) 함수 $f$의 치역의 원소 중 $f(4),\\,f(5),\\,f(6)$이 아닌\n원소를 $a$라 하면\n $a\\lt f(4)\\,,\\,a \\neq f(5)\\,,\\,a \\neq f(6)$\n이므로 $a$의 값을 정할 때, 그 경우의 수는 $(k-3)$이다.\n(ⅲ) (ⅱ)의 각각의 경우에 대하여 $f(1)\\,,\\,f(2)\\,,\\,f(3)\\,$의 값을 정할 때, 그 경우의 수는 ${\\boxed{\\vphantom{(}\\,(\\text{나})\\,}}$이다.\n(ⅰ), (ⅱ), (ⅲ)에서 구하는 함수 $f$의 개수는\n$\\sum\\limits_{k=4}^{6} \\left\\{ \\, {\\boxed{\\vphantom{(}\\,(\\text{가})\\,}} \\times (k-3) \\times {\\boxed{\\vphantom{(}\\,(\\text{나})\\,}} \\, \\right\\} = {\\boxed{\\vphantom{(}\\,(\\text{다})\\,}}$\n이다.\n위의 (가)에 알맞은 식을 $h(k)\\,$라 하고, (나), (다)에 알맞은 수를 각각 $p\\,,\\,q\\,$라 할 때, $h(p-5)+q\\,$의 값은? [4점]\n① 444 ② 448 ③ 452 ④ 456 ⑤ 460","answer":"④","sourceHash":"1a5be8a85b6584155a7a4b44f46b13dd60ce44c12522af115560e651224342b6","steps":[{"id":"s1","latex":"f(4)=k\\in\\{4,5,6\\}"},{"id":"s2","latex":"f(6)\u003cf(5)\u003ck\\Rightarrow h(k)={}_{k-1}\\mathrm C_2"},{"id":"s3","latex":"a\\in\\{1,\\ldots,k-1\\}\\setminus\\{f(5),f(6)\\}\\Rightarrow k-3\\text{가지}"},{"id":"s4","latex":"p={}_4\\mathrm H_3-{}_3\\mathrm H_3=20-10=10"},{"id":"s5","latex":"q=10\\sum_{k=4}^6{}_{k-1}\\mathrm C_2(k-3)=10(3+12+30)=450"},{"id":"s6","latex":"h(p-5)+q=h(5)+450=6+450=456"}],"diagram":null,"contentHash":"9f39f8c241cf788c45dc8b1b1dce0c217a0559e1606d9415fc65adf680d7aa80","questionHtml":"\u003cp class=\"hp\">집합
