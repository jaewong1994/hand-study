  <script>window.HandStudyRecord={"itemId":8157,"sourceLabel":"2022 교육청 고2 수학 3월 20번","adminYear":2022,"grade":2,"month":3,"number":20,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"두 직선 $l_1:2x+y+2=0$, $l_2:x-2y-4=0$의 교점을 $A$, 두 직선 $l_1$, $l_2\\,$가 $x\\,$축과 만나는 점을 각각 $B$, $C\\,$라 하자. 제$\\,1\\,$사분면에 있는 점 $P$와 삼각형 $ABC$의 외접원 위의 점 $Q$가 다음 조건을 만족시킨다.\n(가) 점 $Q$는 삼각형 $PBC$의 무게중심이다.\n(나) 삼각형 $PBC$의 넓이는 삼각형 $ABC$의 넓이의 $3\\,$배이다.\n\u003c보기>에서 옳은 것만을 있는 대로 고른 것은? [4점]\nㄱ. 두 직선 $l _{1}$, $l _{2} \\,$는 서로 수직이다.\nㄴ. 점 $Q$의 $y\\,$좌표는 $2\\,$이다.\nㄷ. 점 $P$의 $x\\,$좌표와 $y\\,$좌표의 합은 $10\\,$이다.\n① ㄱ ② ㄴ ③ ㄱ, ㄴ\n④ ㄱ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","answer":"③","sourceHash":"8cfd8b4d2cc1b2de56b64ac6ba697fe94ef75dcfd4d2715cc70a42873cd9ef6f","steps":[{"id":"s1","latex":"m_{l_1}m_{l_2}=(-2)\\left(\\frac12\\right)=-1"},{"id":"s2","latex":"A=(0,-2),\\quad B=(-1,0),\\quad C=(4,0)"},{"id":"s3","latex":"[PBC]=3[ABC],\\quad P\\text{ in quadrant I}\\Rightarrow y_P=6"},{"id":"s4","latex":"Q=\\operatorname{centroid}(PBC)\\Rightarrow y_Q=2"},{"id":"s5","latex":"\\left(x_Q-\\frac32\\right)^2+y_Q^2=\\frac{25}{4}\\Rightarrow x_Q=0,3"},{"id":"s6","latex":"P\\text{ in quadrant I}\\Rightarrow Q=(3,2),\\quad P=(6,6)"}],"diagram":null,"contentHash":"d980674efe088321ce975e11478c3aae672aece5d6e8632114c89a34528ab537","questionHtml":"\u003cp class=\"hp\">두 직선 \u003cspan class=\"heq\">\\(l_{1} :\\,\\)\u003c/span>\u003cspan class=\"heq\">\\(2x+y+2=0\\)\u003c/span>, \u003cspan class=\"heq\">\\(l_{2} :\\,\\)\u003c/span>\u003cspan class=\"heq\">\\(x-2y-4=0\\,\\)\u003c/span>의 교점을 \u003cspan class=\"heq\">\\(A\\)\u003c/span>,\u003cbr>두 직선 \u003cspan class=\"heq\">\\(l_{1}\\)\u003c/span>, \u003cspan class=\"heq\">\\(l_{2}\\,\\)\u003c/span>가 \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>축과 만나는 점을 각각 \u003cspan class=\"heq\">\\(B\\)\u003c/span>, \u003cspan class=\"heq\">\\(C\\,\\)\u003c/span>라 하자. 제\u003cspan class=\"heq\">\\(\\,1\\,\\)\u003c/span>사분면에 있는 점 \u003cspan class=\"heq\">\\(P\\)\u003c/span>와 삼각형 \u0
