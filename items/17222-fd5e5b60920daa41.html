  <script>window.HandStudyRecord={"itemId":17222,"sourceLabel":"2021 평가원 고3 수학미적분 9월 28번","adminYear":2021,"grade":3,"month":9,"number":28,"track":"미적분","points":4,"scoreStatus":"confirmed_4_direct","questionText":"좌표평면에서 원점을 중심으로 하고 반지름의 길이가 $2$인 원 $C$와 두 점 $A \\left( 2,\\,0 \\right)$, $B \\left( 0,\\,-2 \\right)$가 있다. 원 $C$ 위에 있고 $x$좌표가 음수인 점 $P$에 대하여 $\\angle PAB= \\theta$라 하자. 점 $Q \\left( 0,\\,2\\cos \\theta \\right)$에서 직선 $B P$에 내린 수선의 발을 $R$라 하고, 두 점 $P$와 $R$ 사이의 거리를 $f \\left( \\theta \\right)$라 할 때, $\\int _{\\frac{\\pi }{6}} ^{\\frac{\\pi }{3}} {f \\left( \\theta \\right) d \\theta }$의 값은?\n[4점]\n① $\\frac{2 \\sqrt{3} -3}{2}$ ② $\\sqrt{3} -1$ ③ $\\frac{3 \\sqrt{3} -3}{2}$\n④ $\\frac{2 \\sqrt{3} -1}{2}$ ⑤ $\\frac{4 \\sqrt{3} -3}{2}$\n단답형","answer":"①","sourceHash":"78e6cad8ccea70400b3ea0bc6b82cf2ea178024e87ea0a8ce870a4c0e590ad4f","steps":[{"id":"s1","latex":"A=(2,0),\\ B=(0,-2)\\Rightarrow\\angle AOB=\\frac\\pi2"},{"id":"s2","latex":"\\angle APB=\\frac\\pi4,\\quad\\angle ABP=\\frac{3\\pi}4-\\theta"},{"id":"s3","latex":"BP=4\\sin\\theta,\\quad QB=2(1+\\cos\\theta)"},{"id":"s4","latex":"\\angle QBR=\\frac\\pi2-\\theta\\Rightarrow BR=2(1+\\cos\\theta)\\sin\\theta"},{"id":"s5","latex":"f(\\theta)=PR=BP-BR=2\\sin\\theta(1-\\cos\\theta)"},{"id":"s6","latex":"\\int_{\\pi/6}^{\\pi/3}f(\\theta)d\\theta=[-2\\cos\\theta-\\sin^2\\theta]_{\\pi/6}^{\\pi/3}"},{"id":"s7","latex":"=\\sqrt3-\\frac32=\\frac{2\\sqrt3-3}{2}"}],"diagram":null,"contentHash":"9a65f72a77aca0539982d4b18b92adcd3ae2143f6dc448daf6b570f2af8f1d18","questionHtml":"\u003cp class=\"hp htall\">좌표평면에서 원점을 중심으로 하고 반지름의 길이가 \u003cspan class=\"heq\">\\(2\\)\u003c/span>인 원 \u003cspan class=\"heq\">\\(C\\)\u003c/span>와 두 점 \u003cspan class=\"heq\">\\(A \\left( 2,\\,0 \\right)\\)\u003c/span>, \u003cspan class=\"heq\">\\(B \\left( 0,\\,-2 \\right)\\)\u003c/span>가 있다. 원 \u003cspan class=\"heq\">\\(C\\)\u003c/span> 위에 있고 \u003cspan class=\"heq\">\\(x\\)\u003c/span>좌표가 음수인 점 \u003cspan class=\"heq\">\\(P\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(\\angle PAB= \\theta\\)\u003c/span>라 하자.\u003cbr>점 \u003cspan class=\"heq\">\\(Q \\left( 0,\\,2\\cos \\theta \\right)\\)\u003c/span>에서 직선 \u003cspan class=\"heq\">\\(B P\\)\u003c/span>에 내린 수선의 발을 \u003cspan class=\"heq\">\\(R\\)\u003c/span>라 하고, 두 점 \u003cspan class=\"heq\">\\(P\\)\u003c/span>와 \u003cspan class=\"heq\">\\(R\\)\u003c/span> 사이의 거리를 \u003cspan class=\"heq\">\\(f \\left( \\theta \\right)\\)\u003c/span>라 할 때, \u003cspan class=\"heq\">\\(\\int_{\\dfrac{\\pi }{6}}^{\\dfrac{\\pi }{3}} {f \\left( \\theta \\right) d \\theta }\\)\u003c/span>의 값은?\u003c/p>\u003cp class=\"hp\">\u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp htall\">① \u003cspan class=\"heq\">\\(\\dfrac{2 \\sqrt{3} -3}{2}\\)\u003c/span>&emsp;② \u003cspan class=\"heq\">\\(\\sqrt{3} -1\\)\u003c/span>&emsp;③ \u003cspan class=\"heq\">\\(\\dfrac{3 \\sqrt{3} -3}{2}\\)\u003c/span>\u003c/p>\u003cp class=\"hp htall\">④ \u003cspan class=\"heq\">\\(\\dfrac{2 \\sqrt{3} -1}{2}\\)\u003c/span>&emsp;⑤ \u003cspan class=\"heq\">\\(\\dfrac{4 \\sqrt{3} -3}{2}\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig hfigr\" src=\"../assets/figures/ce18d5058d352e482a6a76ad.png\" style=\"float:right;margin:4px 0 8px 12px;width:335px;max-width:45%\">\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"fd5e5b60920daa41662063703319f82b7a2751ca2372cbe8716e3d4ad6cd7637"};</script>
