<script>window.HandStudyRecord={"itemId":18328,"sourceLabel":"2025 평가원 고3 수학기하 6월 30번","adminYear":2025,"grade":3,"month":6,"number":30,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"좌표평면에 ${ \\overline{{AB}}}=6$, ${ \\overline{{AD}}}=8\\,$인 직사각형 ${{ABCD}}\\,$와 $2{ \\vec{{BE}}}=3{ \\vec{{BC}}}-{ \\vec{{BA}}}\\,$를 만족시키는 점 ${{E}}\\,$가 있다. 선분 ${{BC}}$ 위를 움직이는 점 ${{P}}\\,$에 대하여 점 ${{Q}}\\,$가\n ${ \\vec{{PQ}}} bullet \\left({ \\vec{{PQ}}}-{ \\vec{{AB}}} \\right)=0$\n을 만족시킬 때, ${ \\vec{{AE}}} bullet { \\vec{{AQ}}}\\,$의 최솟값을 구하시오. [4점]","answer":"36","sourceHash":"9eae8c277297be1b7718f9f6d7676bf678b8a8c77fed13bf96c1e0cc050dfd90","steps":[{"id":"s1","latex":"A=(0,6),\\quad B=(0,0),\\quad C=(8,0),\\quad P=(p,0)\\ (0\\le p\\le8)"},{"id":"s2","latex":"2\\overrightarrow{BE}=3\\overrightarrow{BC}-\\overrightarrow{BA}\\Rightarrow\\overrightarrow{AE}=(12,-9)"},{"id":"s3","latex":"R=P+\\overrightarrow{AB}=(p,-6)"},{"id":"s4","latex":"\\overrightarrow{PQ}\\cdot\\overrightarrow{RQ}=0\\Rightarrow Q\\text{는 지름 }PR\\text{인 원 위}"},{"id":"s5","latex":"N=\\left(p,-3\\right),\\quad NQ=3"},{"id":"s6","latex":"\\overrightarrow{AE}\\cdot\\overrightarrow{AQ}=\\overrightarrow{AE}\\cdot\\overrightarrow{AN}+\\overrightarrow{AE}\\cdot\\overrightarrow{NQ}"},{"id":"s7","latex":"\\ge12p+81-3|\\overrightarrow{AE}|=12p+81-45=12p+36"},{"id":"s8","latex":"0\\le p\\le8\\text{이고 }12p+36\\text{은 증가하므로 }p=0\\text{일 때 최솟값은 }36"}],"diagram":null,"contentHash":"155a7f96042833a5f2042d33ea24bcaf5de4f432144c562b61a7601c4aa9dae7","questionHtml":"<p class=\"hp htall\">좌표평면에 <span class=\"heq\">\\({ \\overline{{AB}}}=6\\)<\/span>, <span class=\"heq\">\\({ \\overline{{AD}}}=8\\,\\)<\/span>인 직사각형 <span class=\"heq\">\\({{ABCD}}\\,\\)<\/span>와 <br><span class=\"heq\">\\(2{ \\vec{{BE}}}=3{ \\vec{{BC}}}-{ \\vec{{BA}}}\\,\\)<\/span>를 만족시키는 점 <span class=\"heq\">\\({{E}}\\,\\)<\/span>가 있다. 선분 <span class=\"heq\">\\({{BC}}\\)<\/span> 위를 움직이는 점 <span class=\"heq\">\\({{P}}\\,\\)<\/span>에 대하여 점 <span class=\"heq\">\\({{Q}}\\,\\)<\/span>가<\/p><p class=\"hp\">&emsp;&emsp;<span class=\"heq\">\\({ \\vec{{PQ}}} \\cdot \\left({ \\vec{{PQ}}}-{ \\vec{{AB}}} \\right)=0\\)<\/span><\/p><p class=\"hp\">을 만족시킬 때, <span class=\"heq\">\\({ \\vec{{AE}}} \\cdot { \\vec{{AQ}}}\\,\\)<\/span>의 최솟값을 구하시오. <span class=\"hscore\">[4점]<\/span><\/p><p class=\"hp\"><img class=\"hfig\" src=\"../assets/figures/f0056704768de1d92123accc.png\" style=\"width:388px;max-width:100%\"><\/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"a9056597b63196b18498ffb8593dc09f3086b9c7d8c629d2dbf4c644375392b3"};</script>
<script>window.HandStudyGuide={"itemId":18328,"sourceHash":"9eae8c277297be1b7718f9f6d7676bf678b8a8c77fed13bf96c1e0cc050dfd90","contentHash":"155a7f96042833a5f2042d33ea24bcaf5de4f432144c562b61a7601c4aa9dae7","overview":{"goal":"내적 조건이 만드는 원을 찾고, 원의 중심에서 고정벡터의 반대 방향으로 갈 때 내적이 가장 작아짐을 이용해요.","firstLook":"\\(\\overrightarrow{PQ}-\\overrightarrow{AB}\\)를 끝점이 같은 두 점의 벡터로 바꾸면 두 벡터가 수직이라는 조건이 보여요. 그러면 점 \\(Q\\)의 자취는 지름이 정해진 원이에요.","conditions":[{"label":"직사각형","meaning":"좌표축을 변에 맞춰 \\(A=(0,6)\\), \\(B=(0,0)\\), \\(C=(8,0)\\)으로 둘 수 있어요."},{"label":"움직이는 P","meaning":"\\(P=(p,0)\\)이고 \\(0\\le p\\le8\\)이에요."},{"label":"점 Q","meaning":"Q는 내적 조건만 만족하므로 각 P에 대해 해당 원 전체를 움직일 수 있어요."}]},"chapters":[{"id":"c1","label":"좌표와 고정벡터를 정리해요","stepIds":["s1","s2"],"question":"\\(\\overrightarrow{AE}\\)의 좌표는 어떻게 구할까요?","hint":"주어진 식에서 \\(\\overrightarrow{BC}=(8,0)\\), \\(\\overrightarrow{BA}=(0,6)\\)을 넣고 먼저 \\(\\overrightarrow{BE}\\)를 구해요.","explanation":"직사각형을 \\(A=(0,6)\\), \\(B=(0,0)\\), \\(C=(8,0)\\), \\(D=(8,6)\\)으로 놓고 \\(P=(p,0)\\)라 하면 \\(0\\le p\\le8\\)이에요.\n\n\\(2\\overrightarrow{BE}=3(8,0)-(0,6)=(24,-6)\\)이므로 \\(\\overrightarrow{BE}=(12,-3)\\)이에요. 따라서 \\(\\overrightarrow{AE}=\\overrightarrow{AB}+\\overrightarrow{BE}=(0,-6)+(12,-3)=(12,-9)\\)이고 길이는 \\(\\sqrt{12^2+(-9)^2}=15\\)예요.","check":{"prompt":"\\(\\overrightarrow{AE}\\)의 길이는 얼마인가요?","answer":"\\(\\sqrt{144+81}=\\sqrt{225}=15\\)예요."}},{"id":"c2","label":"내적 조건을 지름이 PR인 원으로 바꿔요","stepIds":["s3","s4","s5"],"question":"점 \\(R=P+\\overrightarrow{AB}\\)를 만들면 내적 조건은 어떤 각을 직각으로 만들까요?","hint":"\\(\\overrightarrow{PQ}-\\overrightarrow{AB}=\\overrightarrow{RQ}\\)임을 확인해요.","explanation":"\\(R=P+\\overrightarrow{AB}=(p,-6)\\)으로 두면 \\(\\overrightarrow{PQ}-\\overrightarrow{AB}=Q-P-\\overrightarrow{AB}=Q-R=\\overrightarrow{RQ}\\)예요. 따라서 조건은 \\(\\overrightarrow{PQ}\\cdot\\overrightarrow{RQ}=0\\), 즉 \\(\\angle PQR=90^\\circ\\)라는 뜻이에요.\n\n그러므로 \\(Q\\)는 지름이 \\(PR\\)인 원 위에 있어요. \\(P=(p,0)\\), \\(R=(p,-6)\\)이므로 원의 중심은 중점 \\(N=(p,-3)\\), 반지름은 \\(NQ=3\\)이에요.","check":{"prompt":"선분 \\(PR\\)의 길이와 원의 반지름은 각각 얼마인가요?","answer":"\\(PR=6\\)이고 반지름은 그 절반인 \\(3\\)이에요."}},{"id":"c3","label":"원을 중심과 반지름 벡터로 나눠요","stepIds":["s6","s7"],"question":"\\(\\overrightarrow{AE}\\cdot\\overrightarrow{AQ}\\)는 원 위에서 얼마나 작아질 수 있을까요?","hint":"\\(\\overrightarrow{AQ}=\\overrightarrow{AN}+\\overrightarrow{NQ}\\)로 나누고 길이가 고정된 \\(\\overrightarrow{NQ}\\)의 방향을 정해요.","explanation":"\\(\\overrightarrow{AQ}=\\overrightarrow{AN}+\\overrightarrow{NQ}\\)이므로 내적도 두 부분으로 나뉘어요. \\(\\overrightarrow{AN}=(p,-9)\\)여서\n\\[\n\\overrightarrow{AE}\\cdot\\overrightarrow{AN}=(12,-9)\\cdot(p,-9)=12p+81\n\\]\n이에요.\n\n\\(|\\overrightarrow{NQ}|=3\\), \\(|\\overrightarrow{AE}|=15\\)이므로 두 벡터의 내적은 두 방향이 반대일 때 가장 작고 그 값은 \\(-15\\cdot3=-45\\)예요. 따라서 고정된 \\(p\\)에서 전체 내적의 최솟값은 \\(12p+81-45=12p+36\\)이에요. 실제로 \\(NQ\\)를 \\(AE\\)의 반대 방향으로 잡을 수 있으므로 등호가 성립해요.","check":{"prompt":"두 벡터가 반대 방향일 때 내적의 부호는 무엇인가요?","answer":"끼인각이 \\(180^\\circ\\)라 코사인이 \\(-1\\)이므로 내적은 음수예요."}},{"id":"c4","label":"P의 범위에서 마지막 최솟값을 정해요","stepIds":["s8"],"question":"\\(0\\le p\\le8\\)에서 \\(12p+36\\)의 가장 작은 값은 얼마인가요?","hint":"p의 계수가 양수이므로 가장 작은 p를 넣어요.","explanation":"\\(12p+36\\)은 \\(p\\)가 커질수록 증가해요. 따라서 \\(p=0\\), 즉 \\(P=B\\)일 때 가장 작고 값은 \\(36\\)이에요. 이때도 중심 \\(N=(0,-3)\\)에서 \\(\\overrightarrow{AE}\\)의 반대 방향으로 길이 \\(3\\)인 벡터를 잡아 \\(Q\\)를 정할 수 있으므로 두 단계의 최솟값이 동시에 실현돼요.","check":{"prompt":"원 위에서 얻은 등호 조건과 p의 끝점 조건이 동시에 가능한가요?","answer":"\\(p=0\\)에서 원이 정해진 뒤 그 원의 반지름을 \\(AE\\)의 반대 방향으로 잡으면 되므로 가능해요."}}],"takeaway":["두 벡터의 내적이 0이면 직각을 찾고, 직각이 보는 고정 선분을 지름으로 하는 원을 생각해요.","원 위의 점은 중심까지의 벡터와 길이가 고정된 반지름 벡터로 나누면 내적의 범위를 구하기 쉬워요.","변수가 둘 이상이면 각 단계의 등호 조건이 동시에 실현되는지 마지막에 확인해요."]};</script>
