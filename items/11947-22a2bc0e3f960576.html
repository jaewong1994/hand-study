  <script>window.HandStudyRecord={"itemId":11947,"sourceLabel":"2023 교육청 고1 수학 6월 18번","adminYear":2023,"grade":1,"month":6,"number":18,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"다음은 자연수 $n\\,$에 대하여 $x\\,$에 대한 사차방정식\n $4x^{4} -4 \\left( n+2 \\right) x^{2} + \\left( n-2 \\right)^{2} =0\\,$\n이 서로 다른 네 개의 정수해를 갖도록 하는 $20$ 이하의 모든 $n\\,$의 값을 구하는 과정이다.\n$P\\, \\left( x \\right) =4x^{4} -4 \\left( n+2 \\right) x^{2} + \\left( n-2 \\right)^{2} \\,$이라 하자.\n$x^{2} =X\\,$라 하면 주어진 방정식 $P\\, \\left( x \\right) =0\\,$은\n$4X^{2} -4 \\left( n+2 \\right) X+ \\left( n-2 \\right)^{2} =0\\,$이고\n근의 공식에 의해 $X= \\dfrac{n+2 +- \\sqrt{\\, {\\boxed{\\vphantom{(}\\,(\\text{가})^\\,}} }}{2} \\,$이다.\n그러므로 $X= \\left( \\sqrt{\\dfrac{n}{2}} +1 \\right)^{2}$ 또는 $X= \\left( \\sqrt{\\dfrac{n}{2}} -1 \\right)^{2} \\,$에서\n$x= \\sqrt{\\dfrac{n}{2}} +1$ 또는 $x= - \\sqrt{\\dfrac{n}{2}} -1$ 또는 $x= \\sqrt{\\dfrac{n}{2}} -1$\n또는 $x= - \\sqrt{\\dfrac{n}{2}} +1\\,$\n이다.\n방정식 $P\\, \\left( x \\right) =0\\,$이 정수해를 갖기 위해서는 $\\sqrt{\\dfrac{n}{2}} \\,$이 자연수가 되어야 한다.\n따라서 자연수 $n\\,$에 대하여 방정식 $P\\, \\left( x \\right) =0\\,$이 서로 다른 네 개의 정수해를 갖도록 하는 $20$ 이하의 모든 $n\\,$의 값은 ${\\boxed{\\vphantom{(}\\,(\\text{나})^\\,}} \\,$, ${\\boxed{\\vphantom{(}\\,(\\text{다})^\\,}} \\,$이다.\n위의 $\\left( \\text{가} \\right) \\,$에 알맞은 식을 $f \\left( n \\right) \\,$이라 하고, $\\left( \\text{나} \\right) \\,$, $\\left( \\text{다} \\right) \\,$에 알맞은 수를 각각 $a\\,$, $b\\,$라 할 때, $f \\left( b-a \\right) \\,$의 값은? (단, $a\\lt b$) [4점]\n① $48$ ② $56$ ③ $64$ ④ $72$ ⑤ $80$","answer":"⑤","sourceHash":"ee7fb890ce724f3f8998d7c93b893124c71162f97d91e817259acc4121e7620c","steps":[{"id":"s1","latex":"X=x^2:\\quad4X^2-4(n+2)X+(n-2)^2=0"},{"id":"s2","latex":"X=\\frac{n+2\\pm\\sqrt{(n+2)^2-(n-2)^2}}2"},{"id":"s3","latex":"(n+2)^2-(n-2)^2=8n\\Rightarrow f(n)=8n"},{"id":"s4","latex":"X=\\left(\\sqrt{\\frac n2}\\pm1\\right)^2"},{"id":"s5","latex":"\\sqrt{\\frac n2}=m\\in\\mathbb N,\\quad m\\ge2"},{"id":"s6","latex":"n=2m^2\\le20\\Rightarrow
