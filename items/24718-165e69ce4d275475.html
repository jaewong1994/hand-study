<script>window.HandStudyRecord={"adminYear":2020,"answer":"③","contentHash":"e04d66248200b6d295b87aabea8904057f6ab3c1aa4045ab199188bebdaa6a78","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24718,"month":12,"number":17,"points":4,"preview":false,"questionHtml":"\u003cp>좌표평면의 원점에 점 \u003cspan class=\"heq\">\\(P\\)\u003c/span>가 있다. 한 개의 주사위를 사용하여 다음 시행을 한다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp>주사위를 한 번 던져 나온 눈의 수가\u003cspan class=\"heq\">\\(2\\)\u003c/span>이하이면 점 \u003cspan class=\"heq\">\\(P\\)\u003c/span>를 \u003cspan class=\"heq\">\\(x\\)\u003c/span>축의 양의 방향으로 \u003cspan class=\"heq\">\\(3\\)\u003c/span>만큼,\u003cspan class=\"heq\">\\(3\\)\u003c/span>이상이면 점 \u003cspan class=\"heq\">\\(P\\)\u003c/span>를 \u003cspan class=\"heq\">\\(y\\)\u003c/span>축의 양의 방향으로 \u003cspan class=\"heq\">\\(1\\)\u003c/span>만큼 이동시킨다.\u003c/p>\u003c/div>\u003cp>이 시행을 \u003cspan class=\"heq\">\\(15\\)\u003c/span>번 반복하여 이동된 점 \u003cspan class=\"heq\">\\(P\\)\u003c/span>와 직선 \u003cspan class=\"heq\">\\(3x + 4y = 0\\)\u003c/span> 사이의 거리를 확률변수 \u003cspan class=\"heq\">\\(X\\)\u003c/span>라 하자. \u003cspan class=\"heq\">\\({ E }(X)\\)\u003c/span>의 값은? [4점]\u003c/p>\u003cdiv class=\"hchoices\">\u003cdiv class=\"hch\">① \u003cspan class=\"heq\">\\(13\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">② \u003cspan class=\"heq\">\\(15\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">③ \u003cspan class=\"heq\">\\(17\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">④ \u003cspan class=\"heq\">\\(19\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">⑤ \u003cspan class=\"heq\">\\(21\\)\u003c/span>\u003c/div>\u003c/div>","questionText":"좌표평면의 원점에 점 $P$가 있다. 한 개의 주사위를 사용하여 다음 시행을 한다.\n주사위를 한 번 던져 나온 눈의 수가$2$이하이면 점 $P$를 $x$축의 양의 방향으로 $3$만큼,$3$이상이면 점 $P$를 $y$축의 양의 방향으로 $1$만큼 이동시킨다.\n이 시행을 $15$번 반복하여 이동된 점 $P$와 직선 $3x + 4y = 0$ 사이의 거리를 확률변수 $X$라 하자. ${ E }(X)$의 값은? [4점]\n① $13$ ② $15$ ③ $17$ ④ $19$ ⑤ $21$","sourceHash":"2959608f83e09ee1f31fee8075707cd6e7c57e1ef53f1e07aa6530562e80b467","sourceKind":"csat","sourceLabel":"2020년 시행 수능 · 2021학년도 · 가형 · 17번","steps":[{"id":"s1","latex":"Y=\\text{15번 중 2 이하의 눈이 나온 횟수},\\quad Y\\sim\\mathrm B(15,\\tfrac13)"},{"id":"s2","latex":"\\mathrm E(Y)=15\\cdot\\frac13=5"},{"id":"s3","latex":"\\mathrm P=(3Y,15-Y)"},{"id":"s4","latex":"X=\\frac{|3(3Y)+4(15-Y)|}{\\sqrt{3^2+4^2}}=\\frac{|5Y+60|}{5}"},{"id":"s5","latex":"Y\\ge0\\ \\Rightarrow\\ X=Y+12"},{"id":"s6","latex":"\\mathrm E(X)=\\mathrm E(Y)+12=\\boxed{17}\\quad\\text{③}"}],"track":"가형"};</script>
