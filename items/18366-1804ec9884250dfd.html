, \\left( \\alpha > \\beta \\right)\\,$에 대하여 다음 조건을 만족시키는 수열 $\\left\\{a_{n} \\right\\}\\,$이 있다.\n모든 자연수 $n\\,$에 대하여 $a_{n}= \\alpha \\times \\sin\\,\\frac{n}{2} \\pi + \\beta \\times \\cos\\,\\frac{n}{2} \\pi$ 이고, $a_{1} \\times a_{2} \\times a_{3} \\times a_{4}=4\\,$이다.\n수열 $\\left\\{a_{n} \\right\\}\\,$과 $b_{1} > 0\\,$인 등비수열 $\\left\\{b_{n} \\right\\}\\,$에 대하여\n $\\sum_{n=1}^{ \\infty } \\left(a_{4n-2}b_{n} \\right)= \\sum_{n=1}^{ \\infty } \\left(a_{4n-3}b_{2n} \\right)=6$\n일 때, $b_{1} \\times b_{3}=\\frac{q}{p}\\,$이다. $p+q\\,$의 값을 구하시오. (단, $p\\,$와 $q\\,$는 서로소인 자연수이다.) [4점]","scoreStatus":"confirmed_4_direct","sourceHash":"faa290508afb4f69ca2af81a2f86c588f7cedc38807e554b000ca455fb8ad26d","sourceLabel":"2025 평가원 고3 수학미적분 6월 29번","stepExplanations":{"s1":{"body":"\\(a_1,a_2,a_3,a_4=\\alpha,-\\beta,-\\alpha,\\beta\\)이므로 곱은 \\((\\alpha\\beta)^2\\)입니다. 따라서 \\(|\\alpha\\beta|=2\\)이고, 뒤의 급수 조건에서 \\(\\beta\u003c0\\)까지 얻으면 가능한 정수쌍을 몇 개만 대조하면 됩니다.","skillTags":["periodic-sequence","integer-factor-pairs"],"title":"네 항의 곱으로 정수 후보 만들기"},"s2":{"body":"\\(S=\\sum b_n=b_1/(1-r)\\)라 두면 첫 급수는 \\(-\\beta S=6\\)입니다. 둘째 급수는 \\(b_{2n}=b_1r^{2n-1}\\)을 합하여 \\(\\alpha b_1r/(1-r^2)=\\alpha S\\,r/(1+r)=6\\)입니다. 두 식을 나누면 \\(r=-\\beta/(\\alpha+\\beta)\\)가 됩니다.","skillTags":["geometric-subsequence","equation-ratio"],"title":"두 급수를 같은 S로 비교하기"},"s3":{"body":"\\(\\beta\u003c0,\\alpha>\\beta,|\\alpha\\beta|=2\\)인 후보 중 \\((1,-2)\\)는 \\(r=-2\\), \\((2,-1)\\)은 \\(r=1\\)이라 수렴하지 않습니다. \\((\\alpha,\\beta)=(-1,-2)\\)만 \\(r=-2/3\\)을 주고, \\(S=3,b_1=5\\)에서 \\(b_1b_3=100/9\\)입니다.","skillTags":["convergence-filter","finite-case-check"],"title":"수렴하는 공비까지 대조하기"}},"steps":[{"id":"s1","latex":"a_n=\\alpha\\sin\\dfrac{n}{2}\\pi+\\beta\\cos\\dfrac{n}{2}\\pi\\qquad a_1=\\alpha,\\quad a_2=-\\beta,\\quad a_3=-\\alpha,\\quad a_4=\\beta\\qquad a_1a_2a_3a_4=(\\alpha\\beta)^2=4"},{"id":"s2","latex":"S=\\dfrac{b_1}{1-r}\\qquad \\sum\\limits_{n=1}^{\\infty}a_{4n-2}b_n=-\\beta S=6,\\qquad \\sum\\limits_{n=1}^{\\infty}a_{4n-3}b_{2n}=\\alpha S\\cdot\\dfrac{r}{1+r}=6\\qquad r=-\\dfrac{\\beta}{\\alpha+\\beta}"},{"id":"s3","latex":"(\\alpha,\\beta)=(-1,-2)\\qquad r=-\\dfrac23\\qquad S=-\\dfrac{6}{\\beta}=3\\qquad b_1 b_3=b_1^2 r^2=25\\cdot\\dfrac49=\\dfrac{100}{9}\\qquad \\boxed{\\vphantom{(}p+q=109}"}],"track":"미적분"};</script>

3=100/9\\). 서로소인 \\(p=9,q=100\\)이므로 \\(p+q=109\\)예요.","check":{"prompt":"\\(b_{3}\\)가 \\(b_{1}r^2\\)인 이유는 무엇인가요?","answer":"등비수열에서 세 번째 항은 첫째항에 공비를 두 번 곱한 값이기 때문이에요."}}],"takeaway":["주기수열은 한 주기의 값을 먼저 적어 급수의 계수를 상수로 만들어요.","정수 후보는 부호와 등비급수 수렴 조건으로 하나씩 제외해요."]};</script>
