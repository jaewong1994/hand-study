\\(k\\,\\)\u003c/span>가 존재할 때, \u003cbr>\u003cspan class=\"heq\">\\(g \\left(-\\dfrac{1}{2} \\right) \\times g \\left(2 \\right)\\,\\)\u003c/span>의 값은? (단, \u003cspan class=\"heq\">\\(a\\)\u003c/span>, \u003cspan class=\"heq\">\\(b\\,\\)\u003c/span>는 상수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">① \u003cspan class=\"heq\">\\(6 \\sqrt{3}\\)\u003c/span>&emsp;② \u003cspan class=\"heq\">\\(7 \\sqrt{3}\\)\u003c/span>&emsp;③ \u003cspan class=\"heq\">\\(8 \\sqrt{3}\\)\u003c/span>&emsp;④ \u003cspan class=\"heq\">\\(9 \\sqrt{3}\\)\u003c/span>&emsp;⑤ \u003cspan class=\"heq\">\\(10 \\sqrt{3}\\)\u003c/span>\u003c/p>","questionText":"삼차함수 $f \\left(x \\right)=ax^{3}+bx\\, \\left(a > 0 \\right)\\,$이 다음 조건을 만족시킨다.\n모든 실수 $x\\,$에 대하여 $\\lim_{n\\,\\rightarrow\\, \\infty }\\frac{2x^{2n+2}+x^{n}+f \\left(x \\right)}{x^{2n}+x^{n}+1}\\,$의 값이 존재한다.\n실수 전체의 집합에서 정의된 함수 $g \\left(x \\right)\\,$를\n $g \\left(x \\right)= \\lim_{n\\,\\rightarrow\\, \\infty }\\frac{2x^{2n+2}+x^{n}+f \\left(x \\right)}{x^{2n}+x^{n}+1}$\n라 하자. 함수 $y=g \\left(x \\right)\\,$의 그래프와 직선 $y=k\\,$가 만나는 점의 개수가 $1\\,$이 되도록 하는 자연수 $k\\,$가 존재할 때, $g \\left(-\\frac{1}{2} \\right) \\times g \\left(2 \\right)\\,$의 값은? (단, $a$, $b\\,$는 상수이다.) [4점]\n① $6 \\sqrt{3}$ ② $7 \\sqrt{3}$ ③ $8 \\sqrt{3}$ ④ $9 \\sqrt{3}$ ⑤ $10 \\sqrt{3}$","scoreStatus":"confirmed_4_direct","sourceHash":"58f4eca01c015022fb9cf554ccb38aa96b89c74a68e9dcaaf632731800ed4764","sourceLabel":"2025 교육청 고3 수학미적분 3월 28번","stepExplanations":{"s1":{"body":"\\(|x|\u003c1\\)이면 \\(x^n,x^{2n}\\)이 0으로 가서 분자에는 \\(f(x)\\), 분모에는 1만 남습니다. \\(|x|>1\\)이면 \\(x^{2n}\\)으로 나누었을 때 가장 높은 거듭제곱 항만 남아 \\(g(x)=2x^2\\)가 됩니다.","skillTags":["dominant-term-limit","piecewise-limit"],"title":"|x|=1 안팎에서 남는 항"},"s4":{"body":"\\(k\\ge3\\)이면 바깥 조각 \\(2x^2=k\\)에서 \\(x\u003c-1,x>1\\)인 두 교점이 생깁니다. \\(k=1\\)이면 \\(x=\\pm1\\) 두 점이 이미 교점입니다. 교점이 하나일 가능성이 남는 자연수는 \\(k=2\\)뿐입니다.","skillTags":["intersection-count","boundary-points"],"title":"자연수 k가 2뿐인 이유"},"s5":{"body":"\\((-1,1)\\)에서 \\(x^3-x\\)의 양수 쪽 꼭대기는 \\(x=-1/\\sqrt3\\)에서 \\(2\\sqrt3/9\\)입니다. \\(x^3-x=2/a\\)가 이 구간에서 서로 다른 한 근만 가지려면 수평선이 그 꼭대기에 접해야 하므로 \\(2/a=2\\sqrt3/9\\)입니다.","skillTags":["cubic-extremum","tangent-level"],"title":"한 교점이 되려면 수평선이 꼭대기에 닿아야 한다"}},"steps":[{"id":"s1","latex":"|x|\u003c1:\\ g(x)=f(x),\\qquad |x|>1:\\ g(x)=2x^2"},{"id":"s2","latex":"x=-1\\text{의 짝홀 극한 일치}\\Rightarrow f(-1)=0\\Rightarrow b=-a"},{"id":"s3","latex":"f(x)=a(x^3-x),\\quad g(1)=g(-1)=1"},{"id":"s4","latex":"k\\ge3\\Rightarrow\\#\\ge2,\\quad k=1\\Rightarrow\\#\\ge2\\Rightarrow k=2"},{"id":"s5","latex":"x^3-x=\\frac2a\\text{가 }(-1,1)\\text{에서 한 근}\\Rightarrow\\frac2a=\\frac{2\\sqrt3}{9}"},{"id":"s6","latex":"a=3\\sqrt3,\\quad g\\left(-\\frac12\\right)g(2)=\\frac{9\\sqrt3}{8}\\cdot8=9\\sqrt3"}],"track":"미적분"};</script>
<script>window.HandStudyGuide={"itemId":18242,"sourceHash":"58f4eca01c015022fb9cf554ccb38aa96b89c74a68e9dcaaf632731800ed4764","contentHash":"b81546250a7ea061db13de0683e2fff9a91560f54c5366960c8066ca2068a6e7","overview":{"goal":"수열 극한으로 정의된 \\(g\\)를 구간별 함수로 바꾸고, 자연수 높이의 수평선이 한 점에서만 만난다는 조건으로 \\(a\\)를 정해요.","firstLook":"\\(n\\to\\infty\\)에서 \\(|x|<1\\)과 \\(|x|>1\\)은 살아남는 항이 달라요. 경계 \\(x=\\pm1\\)은 짝수와 홀수 \\(n\\)의 값이 같아야 극한이 존재한다는 조건을 따로 써야 합니다.","conditions":[{"label":"모든 x에서 극한 존재","meaning":"특히 \\(x=-1\\)에서 짝수·홀수 번째 식의 극한이 일치해야 해요."},{"label":"수평선 교점","meaning":"어떤 자연수 \\(k\\)에 대해 \\(y=g(x)\\)와 \\(y=k\\)의 교점이 하나뿐이에요."},{"label":"계수","meaning":"\\(a>0\\)이고 \\(a,b\\)는 실수인 상수예요."}]},"chapters":[{"id":"c1","label":"극한을 구간별 식으로 바꾸기","stepIds":["s1","s2"],"question":"\\(|x|<1\\), \\(|x|>1\\), \\(x=-1\\)을 왜 따로 보아야 할까요?","hint":"분자와 분모를 지배하는 항이 어느 것인지, \\((-1)^n\\)이 홀짝에 따라 바뀌는지를 확인하세요.","explanation":"\\(|x|<1\\)에서는 거듭제곱 항이 0으로 가서 \\(g(x)=f(x)\\), \\(|x|>1\\)에서는 \\(x^{2n}\\)으로 나누면 \\(g(x)=2x^2\\)가 돼요. \\(x=-1\\)에서는 \\(x^n\\)의 부호가 번갈아 바뀌므로 짝수와 홀수일 때의 극한이 같아야 합니다. 그 일치 조건이 \\(f(-1)=0\\), 즉 \\(b=-a\\)를 줘요.","check":{"prompt":"\\(x=1\\)과 \\(x=-1\\)에서 정해지는 \\(g\\)의 값은 얼마인가요?","answer":"극한을 직접 계산하면 둘 다 1입니다."}},{"id":"c2","label":"가능한 자연수 높이 찾기","stepIds":["s3","s4"],"question":"교점이 하나가 될 수 있는 자연수 \\(k\\)는 왜 \\(2\\)뿐일까요?","hint":"바깥 조각 \\(2x^2\\)와 경계점 \\(x=\\pm1\\)을 먼저 보세요.","explanation":"\\(b=-a\\)이므로 안쪽은 \\(f(x)=a(x^3-x)\\), 경계에서는 \\(g(\\pm1)=1\\)이에요. \\(k\\ge3\\)이면 바깥 조각 \\(2x^2=k\\)가 왼쪽과 오른쪽에 교점 하나씩을 만들고, \\(k=1\\)이면 경계점 두 개가 이미 교점입니다. 자연수 중 교점 하나가 될 가능성이 남는 값은 \\(k=2\\)뿐이에요.","check":{"prompt":"\\(k=2\\)일 때 바깥 조각에서 교점이 생기나요?","answer":"\\(2x^2=2\\)의 해는 \\(x=\\pm1\\)인데 바깥 조각은 \\(|x|>1\\)에서만 적용되므로 바깥 교점은 없습니다."}},{"id":"c3","label":"안쪽 곡선이 한 번만 닿게 하기","stepIds":["s5","s6"],"question":"\\(y=2\\)와 안쪽 곡선이 한 점에서만 만나려면 어떤 일이 일어나야 할까요?","hint":"\\(-1<x<1\\)에서 \\(x^3-x\\)의 양의 가장 큰 값을 구하세요.","explanation":"안쪽 교점은 \\(a(x^3-x)=2\\), 즉 \\(x^3-x=2/a\\)의 해예요. \\(-1<x<1\\)에서 양의 봉우리는 \\(x=-1/\\sqrt3\\)에서 높이 \\(2\\sqrt3/9\\)입니다. 수평선이 이보다 낮으면 두 점에서 만나고, 높으면 만나지 않으므로 한 점에서만 만나려면 꼭 봉우리에서 접해야 해요. 따라서 \\(2/a=2\\sqrt3/9\\), \\(a=3\\sqrt3\\)입니다. 따라서 \\(g(-1/2)=a((-1/2)^3+1/2)=9\\sqrt3/8\\), \\(g(2)=2\\cdot2^2=8\\)이어서 곱은 \\(9\\sqrt3\\)입니다.","check":{"prompt":"\\(g(-1/2)g(2)\\)의 값은 얼마인가요?","answer":"\\((9\\sqrt3/8)\\cdot8=9\\sqrt3\\)입니다."}}],"takeaway":["수열 극한으로 정의된 함수는 밑의 절댓값이 1보다 작은지 큰지에 따라 지배항을 나눠요.","\\(x=\\pm1\\) 같은 경계에서는 일반 구간식으로 넘기지 말고 홀짝에 따른 극한을 직접 확인해요.","교점이 정확히 하나라는 조건은 곡선의 봉우리나 골에서 수평선이 접하는 상황으로 연결되는지 살펴봐요."]};</script>
