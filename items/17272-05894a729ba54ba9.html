<script>window.HandStudyRecord={"itemId":17272,"sourceLabel":"2022 교육청 고3 수학기하 10월 30번","adminYear":2022,"grade":3,"month":10,"number":30,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 한 변의 길이가 $4$인 정삼각형을 밑면으로 하고 높이가 $4+2 \\sqrt{ 3}$ 인 정삼각기둥 $A B C-DEF$와 ${\\overline{D G}} =4$인 선분 $A D$ 위의 점 $G$가 있다. 점 $H$가 다음 조건을 만족시킨다.\n(가) 삼각형 $C G H$의 평면 $A D E B$ 위로의 정사영은 정삼각형이다.(나) 삼각형 $C G H$의 평면 $D E F$ 위로의 정사영의 내부와 삼각형 $D E F$의 내부의 공통부분의 넓이는 $2\\sqrt{ 3}$이다.\n삼각형 $C G H$의 평면 $A D F C$ 위로의 정사영의 넓이를 $S\\,$라 할 때, $S^{2}$의 값을 구하시오. [4점]","answer":"48","sourceHash":"c25a6c35dde9048e7dfd67462ac4e3fd97279b552391921b747b4204750b8a85","steps":[{"id":"s1","latex":"D=(0,0,0),\\ E=(4,0,0),\\ F=(2,2\\sqrt3,0),\\quad h=4+2\\sqrt3"},{"id":"s2","latex":"C=(2,2\\sqrt3,h),\\quad G=(0,0,4)"},{"id":"s3","latex":"\\text{평면 }y=0\\text{ 위 정사영}:\\quad C_1=(2,0,h),\\quad GC_1=4"},{"id":"s4","latex":"\\triangle GC_1H_1\\text{ 정삼각형}\\Rightarrow H_1=(4,0,4)\\text{ 또는 }(-2,0,h)"},{"latex":"H=(-2,y,h):\\quad\\text{밑면과 겹친 넓이는 }2\\sqrt3\\text{ 미만이므로 제외}","id":"s5"},{"latex":"H=(4,y,4),\\ H_0=(4,y,0),\\quad J=DH_0\\cap EF:\\quad[DFJ]=\\tfrac12[DFE]\\Rightarrow J=(3,\\sqrt3,0)","id":"s6"},{"latex":"y/4=\\sqrt3/3\\Rightarrow H=(4,4\\sqrt3/3,4)","id":"s7"},{"id":"s8","latex":"H_0=(4,\\tfrac{4\\sqrt3}{3},0):\\quad\\text{밑면에서 }DF\\text{의 기울기는 }\\sqrt3,\\ H_0F\\text{의 기울기는 }-\\frac1{\\sqrt3}\\Rightarrow H_0F\\perp DF"},{"id":"s9","latex":"H_0F\\perp DF\\Rightarrow H\\text{를 평면 }ADFC\\text{에 내린 점 }H_3\\text{은 }F\\text{의 바로 위 높이 }4\\text{인 점}"},{"id":"s10","latex":"GH_3=4,\\quad H_3C=2\\sqrt3"},{"id":"s11","latex":"S=\\frac12\\cdot4\\cdot2\\sqrt3=4\\sqrt3"},{"id":"s12","latex":"S^2=\\boxed{48}"}],"diagram":null,"contentHash":"e5a06fe687eeafc153af7c7b979b383e4e4896cbd66a39c5071030584c622381","questionHtml":"<p class=\"hp htall\">그림과 같이 한 변의 길이가 <span class=\"heq\">\\(4\\)<\/span>인 정삼각형을 밑면으로 하고 높이가 <span class=\"heq\">\\(4+2 \\sqrt{ 3}\\)<\/span> 인 정삼각기둥 <span class=\"heq\">\\(A B C-DEF\\)<\/span>와 <span class=\"heq\">\\({\\overline{D G}} =4\\)<\/span>인 선분 <span class=\"heq\">\\(A D\\)<\/span> 위의 점 <span class=\"heq\">\\(G\\)<\/span>가 있다. 점 <span class=\"heq\">\\(H\\)<\/span>가 다음 조건을 만족시킨다.<\/p><div class=\"hbox\"><p class=\"hp\">(가) 삼각형 <span class=\"heq\">\\(C G H\\)<\/span>의 평면 <span class=\"heq\">\\(A D E B\\)<\/span> 위로의 정사영은 정삼각형이다.<\/p><p class=\"hp\">(나) 삼각형 <span class=\"heq\">\\(C G H\\)<\/span>의 평면 <span class=\"heq\">\\(D E F\\)<\/span> 위로의 정사영의 내부와 삼각형 <span class=\"heq\">\\(D E F\\)<\/span>의 내부의 공통부분의 넓이는 <span class=\"heq\">\\(2\\sqrt{ 3}\\)<\/span>이다.<\/p><\/div><p class=\"hp\">삼각형 <span class=\"heq\">\\(C G H\\)<\/span>의 평면 <span class=\"heq\">\\(A D F C\\)<\/span> 위로의 정사영의 넓이를 <span class=\"heq\">\\(S\\,\\)<\/span>라 할 때, <span class=\"heq\">\\(S^{2}\\)<\/span>의 값을 구하시오. <span class=\"hscore\">[4점]<\/span><\/p><p class=\"hp\"><img class=\"hfig\" src=\"../assets/figures/ed7fb8c853be98bb8ee72925.png\" style=\"width:190px;max-width:100%\"><\/p>","preview":false,"graphPlan":{"version":1,"itemId":17272,"sourceHash":"c25a6c35dde9048e7dfd67462ac4e3fd97279b552391921b747b4204750b8a85","contentHash":"e5a06fe687eeafc153af7c7b979b383e4e4896cbd66a39c5071030584c622381","title":"2022 교육청 고3 수학기하 10월 30번 · 정확 사영","bounds":[-1.0,7.0,-1.0,11.0],"aspect":"equal","stages":[{"stepId":"s1","title":"정삼각기둥 좌표","layers":[{"id":"e0","type":"polyline","points":[[0.0,0.0],[4.0,0.0]],"color":"muted","text":""},{"id":"e1","type":"polyline","points":[[4.0,0.0],[3.2124355652982137,0.8660254037844386]],"color":"muted","text":""},{"id":"e2","type":"polyline","points":[[3.2124355652982137,0.8660254037844386],[0.0,0.0]],"color":"muted","text":""},{"id":"e3","type":"polyline","points":[[0.0,7.464101615137754],[4.0,7.464101615137754]],"color":"muted","text":""},{"id":"e4","type":"polyline","points":[[4.0,7.464101615137754],[3.2124355652982137,8.330127018922193]],"color":"muted","text":""},{"id":"e5","type":"polyline","points":[[3.2124355652982137,8.3301270189221 <script>window.HandStudyGuide={"itemId":17272,"sourceHash":"c25a6c35dde9048e7dfd67462ac4e3fd97279b552391921b747b4204750b8a85","contentHash":"e5a06fe687eeafc153af7c7b979b383e4e4896cbd66a39c5071030584c622381","overview":{"goal":"두 평면에서 본 정사영 조건으로 \\(H\\)를 정하고 마지막 정사영의 넓이를 구해요.","firstLook":"밑면을 \\(z=0\\), 옆면 \\(ADEB\\)를 \\(y=0\\)으로 놓으면 높이와 밑면 위치를 따로 볼 수 있어요.","conditions":[{"label":"옆면 정사영","meaning":"\\(C,G,H\\)를 \\(y=0\\)에 내린 세 점이 정삼각형을 이뤄요."},{"label":"밑면 겹친 넓이","meaning":"밑면에 내린 삼각형과 \\(DEF\\)가 겹친 내부 넓이가 \\(2\\sqrt3\\)이에요."}]},"chapters":[{"id":"c1","label":"정삼각형의 두 후보를 만들어요","stepIds":["s1","s2","s3","s4"],"question":"옆면에 내린 \\(H\\)의 위치가 왜 두 개 나올까요?","hint":"선분 \\(GC_1\\)의 양쪽에 정삼각형을 하나씩 만들 수 있어요.","explanation":"\\(D=(0,0,0),E=(4,0,0),F=(2,2\\sqrt3,0)\\), 기둥 높이를 \\(h=4+2\\sqrt3\\)라 놓아요. 그러면 \\(C=(2,2\\sqrt3,h),G=(0,0,4)\\)예요. 옆면 \\(y=0\\)에 C를 내린 점은 \\(C_1=(2,0,h)\\)이고, \\(GC_1^2=2^2+(h-4)^2=4+12=16\\)이라 \\(GC_1=4\\)예요. 길이 4인 \\(GC_1\\)을 한 변으로 하는 정삼각형의 셋째 꼭짓점은 양쪽에 하나씩 있어 \\(H_1=(4,0,4)\\) 또는 \\(H_1=(-2,0,h)\\)예요.","check":{"prompt":"\\(GC_1=4\\)의 실제 제곱 계산은 무엇인가요?","answer":"\\(2^2+(2\\sqrt3)^2=4+12=16\\)이에요."}},{"id":"c2","label":"왼쪽 후보의 겹친 넓이를 계산해 제외해요","stepIds":["s5"],"question":"\\(H_1=(-2,0,h)\\)인 후보는 왜 넓이 조건을 절대로 채우지 못할까요?","hint":"밑면에서 H의 자리를 \\(H_0=(-2,y)\\)라 하고, 겹친 영역의 밑변이 될 \\(DK\\)를 확인해요.","explanation":"이 후보의 실제 점을 \\(H=(-2,y,h)\\)라 하면 밑면 정사영은 \\(H_0=(-2,y)\\)예요. 밑면에서 C와 G는 각각 F와 D로 내려가므로 비교할 두 삼각형은 \\(DFH_0\\)와 \\(DFE\\)예요. \\(H_0\\)가 직선 DF의 E와 반대쪽에 있으면 두 내부는 공통 넓이가 0이에요. 같은 쪽에 있으면 선분 \\(FH_0\\)가 DE와 만나는 점을 K라 할 때 공통부분은 삼각형 DFK예요. H의 x좌표가 -2이고 F의 x좌표가 2이므로 K는 선분 DE 위에서 항상 \\(0<DK<2\\)를 만족해요. 따라서\n\n\\([DFK]=\\frac12\\cdot DK\\cdot2\\sqrt3=DK\\sqrt3<2\\sqrt3\\)\n\n예요. 어느 위치에서도 요구 넓이 \\(2\\sqrt3\\)가 될 수 없어 이 후보를 제외해요.","check":{"prompt":"같은 쪽에 있을 때 등호가 아니라 엄격한 부등식이 되는 이유는 무엇인가요?","answer":"유한한 점 \\(H_0\\)에서 교점 K는 \\(DK=2\\)인 점에 도달하지 못하고 항상 \\(DK<2\\)이기 때문이에요."}},{"id":"c3","label":"남은 후보의 y좌표를 정해요","stepIds":["s6","s7"],"question":"겹친 넓이가 밑면 넓이의 절반이면 교점 J는 어디인가요?","hint":"\\([DEF]=4\\sqrt3\\)이고 J는 EF 위에 있어요.","explanation":"남은 후보는 \\(H=(4,y,4)\\)이고 밑면 정사영을 \\(H_0=(4,y)\\)라 할게요. 직선 \\(DH_0\\)과 EF의 교점을 J라 하면 공통부분은 삼각형 DFJ예요. \\([DFJ]=2\\sqrt3=\\frac12[DFE]\\)이므로 같은 꼭짓점 D를 가진 두 삼각형의 밑변비에서 J는 EF의 중점이에요. 따라서 \\(J=(3,\\sqrt3)\\)예요. D,J,H0가 한 직선이므로 \\(J_x:H_{0x}=3:4\\)와 \\(J_y:H_{0y}=3:4\\)가 같아 \\(\\sqrt3:y=3:4\\), 곧 \\(y=4\\sqrt3/3\\)이에요.","check":{"prompt":"구한 H의 좌표를 모두 쓰면 무엇인가요?","answer":"\\(H=(4,4\\sqrt3/3,4)\\)예요."}},{"id":"c4","label":"수선의 발과 높이로 마지막 넓이를 구해요","stepIds":["s8","s9","s10","s11","s12"],"question":"H를 평면 ADFC에 내린 점이 왜 F의 바로 위에 있을까요?","hint":"밑면에서 직선 DF와 \\(H_0F\\)의 기울기를 곱해 봐요.","explanation":"평면 ADFC는 밑면의 직선 DF 위로 수직하게 선 평면이에요. 밑면에서 DF의 기울기는 \\(\\sqrt3\\)이고, \\(H_0=(4,4\\sqrt3/3)\\)에서 F까지의 기울기는\n\n\\(\\frac{2\\sqrt3-4\\sqrt3/3}{2-4}=-\\frac1{\\sqrt3}\\)\n\n이에요. 두 기울기의 곱이 \\(-1\\)이므로 \\(H_0F\\perp DF\\)예요. 따라서 H를 평면 ADFC에 수직으로 내린 점 \\(H_3\\)은 F의 바로 위, 높이 4인 점이에요. G도 D의 바로 위 높이 4인 점이므로 \\(GH_3=DF=4\\)이고, C는 F의 바로 위 높이 \\(h\\)이므로 \\(H_3C=h-4=2\\sqrt3\\)예요. 평면 안에서 \\(GH_3\\)은 수평, \\(H_3C\\)는 수직이라 서로 직각이에요. 따라서 \\(S=\\frac12\\cdot4\\cdot2\\sqrt3=4\\sqrt3\\), \\(S^2=48\\)이에요.","check":{"prompt":"마지막 정사영 삼각형의 서로 수직인 두 변은 얼마인가요?","answer":"\\(GH_3=4\\), \\(H_3C=2\\sqrt3\\)예요."}}],"takeaway":["정사영에서 생기는 두 후보는 원래 넓이 조건을 실제 부등식으로 계산해 가려요.","같은 높이의 삼각형 넓이비로 선분의 중점을 찾을 수 있어요.","수직으로 선 평면에 내리는 정사영은 밑면에서 기준 직선에 내린 수선의 발과 높이로 찾을 수 있어요."]};</script>
