<script>window.HandStudyRecord={"itemId":17495,"sourceLabel":"2022 평가원 고3 수학미적분 6월 22번","adminYear":2022,"grade":3,"month":6,"number":22,"track":"미적분","points":4,"scoreStatus":"confirmed_4_direct","questionText":"두 양수 $a,\\,b$($b\\gt 3$)과 최고차항의 계수가 $1$인 이차함수 $f \\left( x \\right)$에 대하여 함수\n $g \\left( x \\right)$$= {\\begin{cases}\\, \\left( x+3 \\right) \\,f \\left( x \\right)&\\, \\left( x\\lt 0 \\right) \\\\ eqalign{ \\\\ \\, \\left( x+a \\right) \\,f \\left( x-b \\right)}&eqalign{ \\\\ \\, \\left( x \\geq 0 \\right)}\\end{cases}}$\n이 실수 전체의 집합에서 연속이고 다음 조건을 만족시킬 때, $g \\left( 4 \\right)$의 값을 구하시오. [4점]\n$\\lim\\limits_{x \\to -3} {} \\dfrac{\\sqrt{\\left| \\,g \\left( x \\right) \\, \\right| + \\left\\{ g \\left( t \\right) \\right\\}^{2}} - \\left| \\,g \\left( t \\right) \\, \\right|}{\\left( x+3 \\right)^{2}}$의 값이 존재하지 않는\n실수 $t$의 값은 $-3$과 $6$뿐이다.\n[도형 1]2022년 6월 고3 모의고사 문제지\n제2교시\n 수학영역(미적분)\n제2교시\n[도형 2]\n5지선다형","answer":"19","sourceHash":"f4d52023d28ee847ad16bb05dfcd3c9304ca499f64249d4be88a67b0d04bc111","steps":[{"id":"s1","latex":"C=|g(t)|>0:\\quad \\frac{\\sqrt{|g(x)|+C^2}-C}{(x+3)^2}=\\frac{|f(x)|}{|x+3|(\\sqrt{|g(x)|+C^2}+C)}"},{"id":"s2","latex":"f(-3)\\ne0\\Rightarrow\\text{모든 }t\\text{에서 발산}\\Rightarrow f(x)=(x+3)(x-c)"},{"id":"s3","latex":"C>0:\\ \\lim\\frac{|x-c|}{\\sqrt{|g(x)|+C^2}+C}=\\frac{|-3-c|}{2C}"},{"id":"s4","latex":"C=0:\\quad\\frac{\\sqrt{|x-c|}}{|x+3|}\\to\\infty\\quad(c=-3\\text{일 때도 발산})"},{"id":"s5","latex":"g(t)=0\\iff t=-3,6,\\quad x\\ge0:\\ g(x)=(x+a)(x-b+3)(x-b-c)"},{"id":"s6","latex":"b-3>0\\Rightarrow b=9;\\quad c\\ge0\\Rightarrow9+c\\text{가 새 근이므로 불가};\\quad c\u003c0\\Rightarrow c=-3"},{"id":"s7","latex":"f(x)=(x+3)^2,\\quad3f(0)=af(-9)\\Rightarrow a=3/4"},{"id":"s8","latex":"g(4)=(4+3/4)(-5+3)^2=19"}],"diagram":null,"contentHash":"f92f058702f7e74a080a5cb50b9dd6dd13f7f3d4adede4e7eb5c3e2dda594a9c","questionHtml":"\u003cp class=\"hp\">두 양수 \u003cspan class=\"heq\">\\(a,\\,b\\)\u003c/span>(\u003cspan class=\"heq\">\\(b\\gt 3\\)\ <script>window.HandStudyGuide={"itemId":17495,"sourceHash":"f4d52023d28ee847ad16bb05dfcd3c9304ca499f64249d4be88a67b0d04bc111","contentHash":"f92f058702f7e74a080a5cb50b9dd6dd13f7f3d4adede4e7eb5c3e2dda594a9c","overview":{"goal":"극한이 존재하지 않는 \\(t\\)가 정확히 \\(g(t)=0\\)인 점임을 밝히고 영점 두 개로 모든 계수를 정해요.","firstLook":"분자를 유리화하면 \\(t\\)는 \\(C=|g(t)|\\)로만 들어가요. \\(C>0\\)과 \\(C=0\\)에서 극한이 완전히 달라져요.","conditions":[{"label":"극한 조건","meaning":"존재하지 않는 \\(t\\)가 두 개뿐이므로 먼저 \\(x=-3\\)에서 생기는 공통 발산을 없애야 해요."},{"label":"연속성","meaning":"\\(x=0\\)에서 두 조각의 좌우 값을 같게 하여 \\(a\\)를 정해요."}]},"chapters":[{"id":"c1","label":"유리화하여 발산 원인을 나눠요","stepIds":["s1","s2","s3","s4"],"question":"왜 \\(f(-3)=0\\)이어야 하고, 그 뒤에는 \\(g(t)=0\\)일 때만 발산할까요?","hint":"\\(C=|g(t)|>0\\)과 \\(C=0\\)을 따로 유리화해요.","explanation":"\\(C=|g(t)|>0\\)라 두고 유리화하면 식은 \\(\\frac{|f(x)|}{|x+3|\\{\\sqrt{|g(x)|+C^2}+C\\}}\\)예요. \\(f(-3)\\ne0\\)이면 모든 \\(t\\)에서 발산해 원문의 두 값뿐이라는 조건과 모순이므로 \\(f(x)=(x+3)(x-c)\\)예요. 이제 \\(C>0\\)이면 약분 뒤 극한은 \\(|-3-c|/(2C)\\)로 유한해요. 반면 \\(C=0\\)이면 \\(\\sqrt{|x-c|}/|x+3|\\) 꼴로 발산하고, \\(c=-3\\)이어도 \\(1/\\sqrt{|x+3|}\\)라 발산해요. 따라서 극한이 존재하지 않는 \\(t\\)는 정확히 \\(g(t)=0\\)인 점이에요.","check":{"prompt":"\\(c=-3\\)이면 \\(C=0\\)에서 극한이 유한해지지 않는 이유는 무엇인가요?","answer":"식이 \\(1/\\sqrt{|x+3|}\\) 꼴이 되어 여전히 한없이 커지기 때문이에요."}},{"id":"c2","label":"영점이 두 개뿐이게 만들어요","stepIds":["s5","s6"],"question":"양의 구간에서 항상 생기는 영점 \\(b-3\\)은 왜 곧바로 \\(6\\)이어야 할까요?","hint":"\\(b>3\\)이므로 \\(b-3\\)은 양수이고 허용된 양의 영점은 하나뿐이에요.","explanation":"음수 구간에서는 \\(g(x)=(x+3)^2(x-c)\\), 양수 구간에서는 \\(g(x)=(x+a)(x-b+3)(x-b-c)\\)예요. 영점은 \\(-3,6\\)뿐이어야 해요. \\(b>3\\)이라 \\(b-3>0\\)은 반드시 양의 영점이므로 \\(b-3=6\\), \\(b=9\\)예요. \\(c\\ge0\\)이면 \\(9+c\\)가 \\(6\\)과 다른 새 양의 영점이라 불가능해요. \\(c<0\\)이면 음수 구간의 영점 \\(c\\)가 허용된 \\(-3\\)과 같아야 하므로 \\(c=-3\\)이고, 동시에 \\(9+c=6\\)도 맞아요.","check":{"prompt":"\\(c<0\\)에서 \\(c=-3\\)을 강제하는 이유는 무엇인가요?","answer":"왼쪽 조각의 인수 \\(x-c\\)가 음수 영점 \\(c\\)를 만드는데 허용된 음수 영점은 \\(-3\\)뿐이기 때문이에요."}},{"id":"c3","label":"연속성을 맞춘 뒤 요구값을 계산해요","stepIds":["s7","s8"],"question":"\\(x=0\\)의 좌우 값은 각각 얼마인가요?","hint":"\\(f(x)=(x+3)^2\\), \\(b=9\\)를 두 조각에 넣어요.","explanation":"\\(f(x)=(x+3)^2\\)예요. \\(x\\to0-\\)에서 \\(g(x)=(x+3)f(x)\\)이므로 값은 \\(3f(0)=27\\)이고, \\(x=0\\)에서 오른쪽 식은 \\(a f(-9)=36a\\)예요. 연속성에서 \\(36a=27\\), \\(a=3/4\\)예요. 따라서 \\(g(4)=(4+3/4)f(-5)=(19/4)\\cdot4=19\\)예요.","check":{"prompt":"연속성 방정식 \\(27=36a\\)의 두 수는 어디서 나오나요?","answer":"왼쪽은 \\(3f(0)=3\\cdot9\\), 오른쪽은 \\(a f(-9)=a\\cdot36\\)에서 나와요."}}],"takeaway":["매개변수가 들어간 극한은 그 매개변수가 만드는 상수가 \\(0\\)인지 양수인지부터 나눠요.","존재하지 않는 점의 목록은 함수의 영점 목록으로 바뀐 뒤 각 조각의 근을 빠짐없이 대조해요.","조각함수의 계수는 마지막에 경계점의 좌우 값을 직접 계산해 정해요."]};</script>
