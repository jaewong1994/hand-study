<script>window.HandStudyRecord={"itemId":8107,"sourceLabel":"2021 교육청 고2 수학 9월 30번","adminYear":2021,"grade":2,"month":9,"number":30,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"세 실수 $a\\, \\left( a != 0 \\right)$, $b,\\,k$에 대하여 함수 $f(x)$를\n $f(x)\\,= {\\begin{cases}ax ^{2} + \\left( 2b-3 \\right) x+a ^{2} -3\\,&\\left( x<k \\right) \\\\ - \\frac{1}{3} ax ^{2} + \\left( b+5 \\right) x+a ^{2} -1&\\left( x \\geq k \\right)\\end{cases}}$\n라 하자. 함수\n $g(x)= \\lim _{t-> x+} {\\frac{\\left| f(t) \\right|}{f(t)}} - \\lim _{t-> x-} {\\frac{\\left| f(t) \\right|}{f(t)}}$\n에 대하여 두 함수 $f(x)$, $g(x)$가 다음 조건을 만족시킨다.\n(가) 임의의 실수 $\\alpha$에 대하여 $\\lim _{x-> \\alpha } {f(x)}$가 존재한다.(나) 두 함수 $y=g(x)$와 $y=\\,-4 \\left| \\log _{2} \\frac{x}{2} \\right| +2$의 그래프의 서로 다른 교점의 개수는 $5$이다. \n$k=p+q \\sqrt{17}$일 때, $16 \\left( p+q \\right)$의 값을 구하시오. (단, $p,\\,q$는 유리수이다.) [4점]","answer":"28","sourceHash":"7989c045f55ae39fc22622b2276ce709650208920eab57b7235ba3783423a777","steps":[{"id":"s1","latex":"g(x)\\in\\{-2,0,2\\},\\quad h(x)=-4\\left|\\log_2\\frac{x}{2}\\right|+2"},{"id":"s2","latex":"h(x)=0\\Rightarrow x\\in\\{\\sqrt2,2\\sqrt2\\},\\quad h(x)=2\\Rightarrow x=2"},{"id":"s3","latex":"g(1)=-2,\\quad g(2)=2,\\quad g(4)=-2,\\quad g(x)=0\\ (x\\ne1,2,4)"},{"id":"s4","latex":"a(x-1)(x-2)\\Rightarrow a^2-3=2a,\\ a=3,-1;\\quad g(1)=-2\\text{이므로 }a=3,\\ b=-3"},{"id":"s5","latex":"1<k\\le2\\text{이면 }a=\\frac13,-3\\text{이지만 }f(1)=-\\frac{128}{9},-22;\\quad k=4\\text{이면 연속과 }g(4)=-2\\text{가 왼쪽 식의 세 근 }1,2,4\\text{를 강제하므로 }2<k<4"},{"id":"s6","latex":"3k^2-9k+6=-k^2+2k+8\\Rightarrow4k^2-11k-2=0"},{"id":"s7","latex":"k=\\frac{11+3\\sqrt{17}}8,\\quad16(p+q)=16\\left(\\frac{11}8+\\frac38\\right)=28"}],"diagram":null,"contentHash":"a45d157395c95299deecea5616ab93df778b11bd1ef6058cd08f17dca4444580","questionHtml":"<p class=\"hp\">세 실수 <span class=\"heq\">\\(a\\, \\left( a  \\neq  0 \\right)\\)<\/span>, <span class=\"heq\">\\(b,\\,k\\)<\/span>에 대하여 함수 <span class=\"heq\">\\(f(x)\\)<\/span>를<\/p><p class=\"hp htall\">&emsp;<span class=\"heq\">\\(f(x)\\,= {\\begin{cases}ax^{2} + \\left( 2b-3 \\right) x+a^{2} -3\\,&\\left( x\\lt k \\right) \\\\ - \\dfrac{1}{3} ax^{2} + \\left( b+5 \\right) x+a^{2} -1&\\left( x \\geq k \\right)\\end{cases}}\\)<\/span><\/p><p class=\"hp\">라 하자. 함수<\/p><p class=\"hp htall\">&emsp;<span class=\"heq\">\\(g(x)= \\lim\\limits_{t\\to  x+} {\\dfrac{\\left| f(t) \\right|}{f(t)}} - \\lim\\limits_{t\\to  x-} {\\dfrac{\\left| f(t) \\right|}{f(t)}}\\)<\/span><\/p><p class=\"hp\">에 대하여 두 함수 <span class=\"heq\">\\(f(x)\\)<\/span>, <span class=\"heq\">\\(g(x)\\)<\/span>가 다음 조건을 만족시킨다.<\/p><div class=\"hbox\"><p class=\"hp\">(가) 임의의 실수 <span class=\"heq\">\\(\\alpha\\)<\/span>에 대하여 <span class=\"heq\">\\(\\lim\\limits_{x\\to  \\alpha } {f(x)}\\)<\/span>가 존재한다.<\/p><p class=\"hp htall\">(나) 두 함수 <span class=\"heq\">\\(y=g(x)\\)<\/span>와 <span class=\"heq\">\\(y=\\,-4 \\left| \\log_{2} \\dfrac{x}{2} \\right| +2\\)<\/span>의 그래프의 서로 다른 교점의 개수는 <span class=\"heq\">\\(5\\)<\/span>이다.<\/p><\/div><p class=\"hp\"><span class=\"heq\">\\(k=p+q \\sqrt{17}\\)<\/span>일 때, <span class=\"heq\">\\(16 \\left( p+q \\right)\\)<\/span>의 값을 구하시오. <br>(단, <span class=\"heq\">\\(p,\\,q\\)<\/span>는 유리수이다.) <span class=\"hscore\">[4점]<\/span><\/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"2c59daaef60ce735dbe5955f6b64cd0d9a2273bfbbf21e7c10b23135189c8d52"};</script>
<script>window.HandStudyGuide={"itemId":8107,"sourceHash":"7989c045f55ae39fc22622b2276ce709650208920eab57b7235ba3783423a777","contentHash":"a45d157395c95299deecea5616ab93df778b11bd1ef6058cd08f17dca4444580","overview":{"goal":"교점이 될 수 있는 다섯 위치의 부호 변화를 모두 정한 뒤, 조각 경계의 연속 조건으로 \\(k\\)를 구해요.","firstLook":"\\(|f(t)|/f(t)\\)는 \\(f(t)>0\\)이면 \\(1\\), \\(f(t)<0\\)이면 \\(-1\\)이에요. 따라서 \\(g(x)\\)는 \\(f\\)의 부호가 바뀌는 곳에서만 \\(2\\) 또는 \\(-2\\)이고, 그 밖에서는 \\(0\\)이에요.","conditions":[{"label":"교점 5개","meaning":"로그 그래프와 만날 수 있는 다섯 위치가 모두 실제 교점이어야 해요."},{"label":"모든 점에서 극한 존재","meaning":"조각 경계 \\(x=k\\)에서 왼쪽 식과 오른쪽 식의 극한값이 같아야 해요."}]},"chapters":[{"id":"c1","label":"다섯 교점의 위치와 부호 변화를 확정해요","stepIds":["s1","s2","s3"],"question":"교점의 개수가 \\(5\\)라는 조건은 왜 \\(g(1)=-2\\), \\(g(2)=2\\), \\(g(4)=-2\\)를 강제할까요?","hint":"로그 그래프가 \\(y=-2,0,2\\)와 만나는 위치를 모두 적고 가능한 교점의 최대 개수를 세어요.","explanation":"로그 그래프를 \\(h(x)=-4|\\log_2(x/2)|+2\\)라 하면 \\(h(x)=0\\)의 해는 \\(\\sqrt2,2\\sqrt2\\), \\(h(x)=2\\)의 해는 \\(2\\), \\(h(x)=-2\\)의 해는 \\(1,4\\)예요. 한편 \\(g\\)의 값은 \\(-2,0,2\\)뿐이므로 두 그래프가 만날 수 있는 위치는 \\(1,\\sqrt2,2,2\\sqrt2,4\\)의 다섯 곳이 전부예요. 서로 다른 교점이 정확히 다섯 개이려면 모두 실제 교점이어야 하므로 \\(g(1)=-2\\), \\(g(2)=2\\), \\(g(4)=-2\\)이고 나머지 두 위치에서는 \\(g=0\\)이에요.","check":{"prompt":"\\(g(1)=-2\\)는 \\(x=1\\)을 지날 때 \\(f\\)의 부호가 어떻게 바뀐다는 뜻인가요?","answer":"왼쪽의 양수에서 오른쪽의 음수로 바뀐다는 뜻이에요."}},{"id":"c2","label":"조각 경계의 모든 위치를 검사해요","stepIds":["s4"],"question":"왜 조각 경계는 반드시 \\(2<k<4\\)에 있어야 하나요?","hint":"\\(k\\le1\\), \\(1<k\\le2\\), \\(2<k<4\\), \\(k\\ge4\\)에서 세 부호변화점 \\(1,2,4\\)를 어느 이차식이 맡는지 따져요.","explanation":"\\(k<1\\)이면 오른쪽 이차식이 세 점 \\(1,2,4\\)에서 모두 부호를 바꾸어야 해서 이차식의 근이 세 개가 되는 모순이에요. \\(k=1\\)이어도 연속이며 \\(g(1)=-2\\)이려면 경계값이 \\(0\\)이고, 오른쪽 식은 \\(1,2,4\\)를 모두 근으로 가져야 하므로 불가능해요.\n\n\\(1<k\\le2\\)이면 왼쪽 식은 \\(1\\)을 근으로, 오른쪽 식은 \\(2,4\\)를 근으로 가져야 해요. 오른쪽 식을 \\(-\\frac a3(x-2)(x-4)\\)와 비교하면 \\(b=2a-5\\), \\(3a^2+8a-3=0\\)이라 \\(a=1/3\\) 또는 \\(a=-3\\)이에요. 그런데 왼쪽 식의 \\(f(1)=0\\)은 \\(a^2+5a-16=0\\)을 요구하고, 앞의 두 값을 넣으면 각각 \\(-128/9\\), \\(-22\\)로 \\(0\\)이 아니어서 공통인 \\(a\\)가 없어요.\n\n\\(k>4\\)이면 왼쪽 이차식이 \\(1,2,4\\)를 모두 근으로 가져야 해 불가능해요. \\(k=4\\)에서는 연속이면서 \\(g(4)=-2\\)로 부호가 바뀌려면 양쪽 극한값이 \\(0\\)이어야 해요. 그러면 왼쪽 식은 이미 필요한 근 \\(1,2\\)에 더해 \\(4\\)도 근으로 가져야 하므로 역시 불가능해요. 따라서 남는 범위는 \\(2<k<4\\)뿐이에요.","check":{"prompt":"\\(k=4\\)에서 단순히 '연속 조건과 맞지 않는다'고만 하면 부족한 이유는 무엇인가요?","answer":"연속과 부호 변화가 함께 경계값 \\(0\\)을 강제하고, 그 결과 왼쪽 이차식에 서로 다른 세 근 \\(1,2,4\\)가 생긴다는 모순까지 보여야 해요."}},{"id":"c3","label":"두 조각의 식을 확정해요","stepIds":["s5"],"question":"\\(2<k<4\\)에서 왜 \\(a=3\\), \\(b=-3\\)만 남나요?","hint":"점 \\(1,2\\)는 왼쪽 식의 근이고, \\(g(1)=-2\\)가 주는 부호 변화 방향까지 확인해요.","explanation":"\\(2<k<4\\)이므로 \\(1,2\\)는 왼쪽 식의 근이에요. 따라서 왼쪽 식은 \\(a(x-1)(x-2)\\)이고, 상수항을 비교하면 \\(a^2-3=2a\\), 즉 \\(a=3\\) 또는 \\(a=-1\\)이에요. \\(a=-1\\)이면 \\(x=1\\)을 지날 때 음수에서 양수로 바뀌어 \\(g(1)=2\\)가 되므로 탈락해요. 따라서 \\(a=3\\)이고 \\(x\\)의 계수를 비교하면 \\(b=-3\\)이에요. 오른쪽 식은 \\(-x^2+2x+8=-(x+2)(x-4)\\)가 되어 \\(4\\)에서 양수에서 음수로 바뀌므로 \\(g(4)=-2\\)도 정확히 만족해요.","check":{"prompt":"\\(a=-1\\)을 버리는 직접적인 부호 이유는 무엇인가요?","answer":"\\(-(x-1)(x-2)\\)는 \\(1\\)을 지나며 음수에서 양수로 바뀌어 필요한 \\(g(1)=-2\\)와 반대인 \\(g(1)=2\\)를 만들어요."}},{"id":"c4","label":"연속 조건으로 k를 하나만 골라요","stepIds":["s6","s7"],"question":"두 이차식이 경계에서 이어지는 조건은 무엇인가요?","hint":"\\(x=k\\)에서 왼쪽 식과 오른쪽 식의 값을 같게 하고, 이미 증명한 \\(2<k<4\\)를 사용해요.","explanation":"조건 (가)에 따라 \\(3k^2-9k+6=-k^2+2k+8\\)이에요. 따라서 \\(4k^2-11k-2=0\\)이고 두 근은 \\((11\\pm3\\sqrt{17})/8\\)이에요. 이 중 \\(2<k<4\\)에 들어가는 것은 \\(k=(11+3\\sqrt{17})/8\\)뿐이에요. 그러므로 \\(p=11/8\\), \\(q=3/8\\)이고 \\(16(p+q)=28\\)이에요.","check":{"prompt":"음의 부호를 택한 근이 탈락하는 이유는 무엇인가요?","answer":"\\((11-3\\sqrt{17})/8<0\\)이어서 \\(2<k<4\\)에 들어가지 않아요."}}],"takeaway":["교점 수가 가능한 위치 수의 최댓값과 같으면 각 위치의 함수값과 부호 변화가 모두 강제돼요.","조각 경계의 범위는 끝점까지 따로 포함해 필요한 근의 개수와 연속 조건을 함께 검사해요.","이차식의 근뿐 아니라 근을 지날 때 부호가 어느 방향으로 바뀌는지도 확인해요."]};</script>
