<script>window.HandStudyRecord={"itemId":16655,"sourceLabel":"2020 교육청 고3 수리가형 3월 20번","adminYear":2020,"grade":3,"month":3,"number":20,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 좌표평면 위의 네 점 $O\\, \\left( 0,\\,0 \\right)$, $A \\,\\left( 0,\\,2 \\right)$, $B \\,\\left( -2,\\,2 \\right)$, $C \\,\\left( -2,\\,0 \\right)\\,$과 점 $P\\, \\left( t,\\,0 \\right) \\,$$\\left( t>0 \\right)\\,$에 대하여 직선 $l\\,$이 정사각형 $O A B C\\,$의 넓이와 직각삼각형 $A O P\\,$의 넓이를 각각 이등분한다. 양의 실수 $t\\,$에 대하여 직선 $l\\,$의 $y\\,$절편을 $f ( t )\\,$라 할 때, $\\lim _{t\\,->\\,0+} {f ( t )}\\,$의 값은? [4점]\n① $\\frac{2 - \\sqrt{2}}{2}$ ② ${2 - \\sqrt{2} }$ ③ $\\frac{2 + \\sqrt{2} }{4}$\n④ $1$ ⑤ $\\frac{2 + \\sqrt{2}}{3}$","answer":"②","sourceHash":"a00f3fc3707cc583f4c90303e9f505fb941be2328a79a68b06dc2529525e7469","steps":[{"id":"s1","latex":"l:\\ y=(b-1)x+b\\qquad\\bigl(b=f(t),\\ (-1,1)\\in l\\bigr)"},{"id":"s2","latex":"AP:\\ y=2-\\frac{2}{t}x"},{"id":"s3","latex":"D=l\\cap AO=(0,b),\\quad E=l\\cap AP,\\quad x_E=\\frac{2-b}{b-1+2/t}"},{"id":"s4","latex":"[ADE]=\\frac12[AOP]\\Rightarrow\\frac12(2-b)x_E=\\frac{t}{2}"},{"id":"s5","latex":"(2-b)^2=t(b-1)+2\\Rightarrow b^2-(4+t)b+(2+t)=0"},{"id":"s6","latex":"0\u003cb\u003c2\\Rightarrow b=\\frac{4+t-\\sqrt{t^2+4t+8}}2"},{"id":"s7","latex":"\\lim_{t\\to0+}f(t)=\\boxed{2-\\sqrt2}"}],"diagram":null,"contentHash":"b916a4fbc9a13e229b35a91b6041d850da066e4666680e1aadd9acb08e5db9a5","questionHtml":"\u003cp class=\"hp\">그림과 같이 좌표평면 위의 네 점 \u003cspan class=\"heq\">\\(O\\, \\left( 0,\\,0 \\right)\\)\u003c/span>, \u003cspan class=\"heq\">\\(A \\,\\left( 0,\\,2 \\right)\\)\u003c/span>, \u003cspan class=\"heq\">\\(B \\,\\left( -2,\\,2 \\right)\\)\u003c/span>, \u003cspan class=\"heq\">\\(C \\,\\left( -2,\\,0 \\right)\\,\\)\u003c/span>과 점 \u003cspan class=\"heq\">\\(P\\, \\left( t,\\,0 \\right) \\,\\)\u003c/span>\u003cspan class=\"heq\">\\(\\left( t\\gt 0 \\right)\\,\\)\u003c/span>에 대하여 직선 \u003cspan class=\"heq\">\\(l\\,\\)\u003c/span>이 정사각형 \u003cspan class=\"heq\">\\(O A B C\\,\\)\u003c/span>의 넓이와 직각삼각형 \u003cspan class=\"heq\">\\(A O P\\,\\)\u003c/span>의 넓이를 각각 이등분한다.  양의 실수 \u003cspan class=\"heq\">\\(t\\,\\)\u003c/span>에 대하여 직선 \u003cspan class=\"heq\">\\(l\\,\\)\u003c/span>의 \u003cspan class=\"heq\">\\(y\\,\\)\u003c/span>절편을 \u003cspan class=\"heq\">\\(f ( t )\\,\\)\u003c/span>라 할 때, \u003cspan class=\"heq\">\\(\\lim\\limits_{t\\,\\to \\,0+} {f ( t )}\\,\\)\u003c/span>의 값은? \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/f46b15b7704f937787753282.png\" style=\"width:416px;max-width:100%\">\u003c/p>\u003cp class=\"hp htall\">① \u003cspan class=\"heq\">\\(\\dfrac{2 - \\sqrt{2}}{2}\\)\u003c/span>&emsp;② \u003cspan class=\"heq\">\\({2 - \\sqrt{2} }\\)\u003c/span>&emsp;③ \u003cspan class=\"heq\">\\(\\dfrac{2 + \\sqrt{2} }{4}\\)\u003c/span>\u003c/p>\u003cp class=\"hp htall\">④ \u003cspan class=\"heq\">\\(1\\)\u003c/span>&emsp;⑤ \u003cspan class=\"heq\">\\(\\dfrac{2 + \\sqrt{2}}{3}\\)\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"e11899288b9e39d78706d62c242fdc6394b6b5bc6ad0b64fd53dba2270b84348"};</script>
<script>window.HandStudyGuide={"itemId":16655,"sourceHash":"a00f3fc3707cc583f4c90303e9f505fb941be2328a79a68b06dc2529525e7469","contentHash":"b916a4fbc9a13e229b35a91b6041d850da066e4666680e1aadd9acb08e5db9a5","overview":{"goal":"두 도형의 넓이를 반으로 나누는 같은 직선을 좌표식으로 나타내고, 작은 삼각형의 넓이 조건으로 \\(y\\)절편을 정해요.","firstLook":"정사각형은 중심대칭이므로 넓이를 이등분하는 직선은 중심 \\((-1,1)\\)을 지나요. \\(y\\)절편을 \\(b\\)로 두면 직선의 기울기가 바로 정해져요.","conditions":[{"label":"정사각형 이등분","meaning":"직선 \\(l\\)은 정사각형의 중심 \\((-1,1)\\)을 지나요."},{"label":"삼각형 이등분","meaning":"그림의 삼각형 \\(ADE\\) 넓이가 전체 \\(AOP\\) 넓이의 절반이에요."},{"label":"오른쪽 극한","meaning":"\\(t>0\\)에서 얻은 \\(b=f(t)\\) 중 도형 안의 뿌리를 고른 뒤 \\(t\\to0+\\)를 봐요."}]},"chapters":[{"id":"c1","label":"두 직선과 교점을 좌표로 적어요","stepIds":["s1","s2","s3"],"question":"정사각형을 이등분한다는 조건이 직선 \\(l\\)에 주는 고정점은 어디인가요?","hint":"정사각형의 두 대각선이 만나는 중심을 찾아요.","explanation":"정사각형의 중심은 \\((-1,1)\\)이에요. 중심을 지나는 직선은 중심대칭 때문에 정사각형의 넓이를 반으로 나눠요. 같은 기울기의 직선을 중심선에서 평행이동하면 중심선과 옮긴 직선 사이의 넓이가 한쪽에 더해져 두 부분의 넓이가 달라져요. 따라서 넓이를 정확히 이등분하는 \\(l\\)은 중심을 지나야 해요. \\(y\\)절편을 \\(b=f(t)\\)라 두면 \\((-1,1)\\)과 \\((0,b)\\)를 지나므로 \\(l:y=(b-1)x+b\\)예요. 한편 \\(A=(0,2)\\), \\(P=(t,0)\\)를 잇는 직선은 \\(AP:y=2-2x/t\\)예요. \\(D=l\\cap AO=(0,b)\\), \\(E=l\\cap AP\\)라 하면 두 직선식을 같게 놓아 \\(x_E=(2-b)/(b-1+2/t)\\)를 얻어요.","check":{"prompt":"직선 \\(l\\)의 기울기가 \\(b-1\\)인 이유는 무엇인가요?","answer":"두 점 \\((-1,1)\\), \\((0,b)\\) 사이의 기울기는 \\((b-1)/(0-(-1))=b-1\\)이기 때문이에요."}},{"id":"c2","label":"절반 넓이를 이차방정식으로 바꿔요","stepIds":["s4","s5"],"question":"삼각형 \\(ADE\\)의 밑변과 높이는 각각 무엇인가요?","hint":"세로선 \\(AO\\) 위의 \\(AD\\)와 점 \\(E\\)의 \\(x\\)좌표를 사용해요.","explanation":"\\(AD=2-b\\)이고, \\(E\\)에서 \\(y\\)축까지의 수평거리는 \\(x_E\\)예요. 따라서 \\([ADE]=(2-b)x_E/2\\)예요. 전체 직각삼각형 \\(AOP\\)의 넓이는 \\(t\\)이므로 그 절반은 \\(t/2\\)예요. 식을 세우고 \\(x_E\\)를 넣으면 \\((2-b)^2=t(b-1)+2\\), 곧 \\(b^2-(4+t)b+(2+t)=0\\)을 얻어요.","check":{"prompt":"\\([AOP]\\)가 \\(t\\)인 이유는 무엇인가요?","answer":"서로 수직인 두 변의 길이가 \\(AO=2\\), \\(OP=t\\)이므로 넓이는 \\(2t/2=t\\)예요."}},{"id":"c3","label":"도형 안의 뿌리를 골라 극한을 구해요","stepIds":["s6","s7"],"question":"이차방정식의 두 근 중 왜 작은 근을 골라야 할까요?","hint":"\\(D=(0,b)\\)가 선분 \\(AO\\) 위에 있으려면 \\(0<b<2\\)예요.","explanation":"이차방정식의 근은 \\(b=(4+t\\pm\\sqrt{t^2+4t+8})/2\\)예요. 그림처럼 \\(D\\)가 \\(AO\\)의 내부에 있으려면 \\(0<b<2\\)여야 하므로 작은 근을 골라요. 따라서 \\(f(t)=(4+t-\\sqrt{t^2+4t+8})/2\\)이고, \\(t\\to0+\\)를 대입하면 \\(2-\\sqrt2\\)예요. 선택지는 ②예요.","check":{"prompt":"큰 근은 \\(t\\to0+\\)일 때 어디로 가며 왜 도형과 맞지 않나요?","answer":"큰 근은 \\(2+\\sqrt2>2\\)로 가서 \\(D\\)가 선분 \\(AO\\)의 위쪽 밖에 놓이므로 그림의 넓이 분할과 맞지 않아요."}}],"takeaway":["중심대칭 도형을 이등분하는 직선은 중심을 지난다는 사실로 직선식을 줄일 수 있어요.","삼각형 넓이는 한 변과 그 변까지의 수직거리를 좌표에서 찾아 계산해요.","대수적으로 나온 여러 근은 교점이 실제 선분 안에 있는지 확인해 골라요."]};</script>
