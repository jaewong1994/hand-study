<script>window.HandStudyRecord={"itemId":17119,"sourceLabel":"2021 교육청 고3 수학확통 10월 30번","adminYear":2021,"grade":3,"month":10,"number":30,"track":"확통","points":4,"scoreStatus":"confirmed_4_direct","questionText":"주머니에 $12$개의 공이 들어 있다. 이 공들 각각에는 숫자 $1$, $2$, $3$, $4$ 중 하나씩이 적혀 있다. 이 주머니에서 임의로 한 개의 공을 꺼내어 공에 적혀 있는 수를 확인한 후 다시 넣는 시행을 한다. 이 시행을 $4$번 반복하여 확인한 $4$개의 수의 합을 확률변수 $X$ 라 할 때, 확률변수 $X$는 다음 조건을 만족시킨다.\n(가) ${ P}(X=4)=16×{ P}(X=16)=\\frac{1}{ 81}$ (나) ${ E}(X\\,)=9$\n${ V}(X\\,)=\\frac{q}{p}$일 때, $p+q$의 값을 구하시오. (단, $p$ 와 $q$는 서로소인 자연수이다.) [4점]","answer":"23","sourceHash":"34b269e5ae8ab32025cc65986ea8676faf3357b786414128329d7c2ca9dac277","steps":[{"id":"s1","latex":"P(X=4)=\\left(\\frac{n_1}{12}\\right)^4=\\frac1{81}\\Rightarrow n_1=4"},{"id":"s2","latex":"P(X=16)=\\left(\\frac{n_4}{12}\\right)^4=\\frac1{16\\cdot81}\\Rightarrow n_4=2"},{"id":"s3","latex":"E(X)=4E(Y)=9\\Rightarrow E(Y)=\\frac94"},{"id":"s4","latex":"n_2+n_3=6,\\quad\\frac{4+2n_2+3n_3+8}{12}=\\frac94\\Rightarrow n_2=n_3=3"},{"id":"s5","latex":"E(Y^2)=\\frac{4+12+27+32}{12}=\\frac{25}4"},{"id":"s6","latex":"V(Y)=\\frac{25}4-\\left(\\frac94\\right)^2=\\frac{19}{16}"},{"id":"s7","latex":"V(X)=4V(Y)=\\frac{19}4\\Rightarrow p+q=23"}],"diagram":null,"contentHash":"8d7288265283b598804dc37d8e085f920b96c3e2b29a8c288c79b775648e10c8","questionHtml":"\u003cp class=\"hp\">주머니에 \u003cspan class=\"heq\">\\(12\\)\u003c/span>개의 공이 들어 있다. 이 공들 각각에는 숫자 \u003cspan class=\"heq\">\\(1\\)\u003c/span>, \u003cspan class=\"heq\">\\(2\\)\u003c/span>, \u003cspan class=\"heq\">\\(3\\)\u003c/span>, \u003cspan class=\"heq\">\\(4\\)\u003c/span> 중 하나씩이 적혀 있다. 이 주머니에서 임의로 한 개의 공을 꺼내어 공에 적혀 있는 수를 확인한 후 다시 넣는 시행을 한다. 이 시행을 \u003cspan class=\"heq\">\\(4\\)\u003c/span>번 반복하여 확인한 \u003cspan class=\"heq\">\\(4\\)\u003c/span>개의 수의 합을 확률변수 \u003cspan class=\"heq\">\\(X\\)\u003c/span> 라 할 때, 확률변수 \u003cspan class=\"heq\">\\(X\\)\u003c/span>는 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp htall\">(가) \u003cspan class=\"heq\">\\({P}(X=4)=16\\times {P}(X=16)=\\dfrac{1}{ 81}\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">(나) \u003cspan class=\"heq\">\\({E}(X\\,)=9\\)\u003c/span>\u003c/p>\u003c/div>\u003cp class=\"hp htall\">\u003cspan class=\"heq\">\\({V}(X\\,)=\\dfrac{q}{p}\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(p+q\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(p\\)\u003c/span> 와 \u003cspan class=\"heq\">\\(q\\)\u003c/span>는 서로소인 자연수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"7c3979553c898ce839c937a9af0a013347a160a4402581cacbef72c4e2de022f"};</script>
<script>window.HandStudyGuide={"itemId":17119,"sourceHash":"34b269e5ae8ab32025cc65986ea8676faf3357b786414128329d7c2ca9dac277","contentHash":"8d7288265283b598804dc37d8e085f920b96c3e2b29a8c288c79b775648e10c8","overview":{"goal":"합의 양 끝 확률과 평균으로 각 숫자가 적힌 공의 개수를 정하고, 한 번의 시행의 분산에서 네 번 합의 분산을 구해요.","firstLook":"합이 \\(4\\)가 되려면 네 번 모두 \\(1\\), 합이 \\(16\\)이 되려면 네 번 모두 \\(4\\)가 나와야 해요. 두 극단 확률이 공의 개수를 바로 알려 줘요.","conditions":[{"label":"복원추출","meaning":"공을 다시 넣으므로 네 시행은 서로 독립이고 각 시행의 분포가 같아요."},{"label":"공의 총수","meaning":"숫자 \\(1,2,3,4\\)가 적힌 공의 개수 합은 \\(12\\)예요."},{"label":"합 확률변수","meaning":"한 번 확인한 수를 \\(Y\\)라 하면 \\(X\\)는 서로 독립인 네 \\(Y\\)의 합이에요."}]},"chapters":[{"id":"c1","label":"양 끝 합의 확률로 1번과 4번 공을 세어요","stepIds":["s1","s2"],"question":"숫자 \\(1\\)과 \\(4\\)가 적힌 공은 각각 몇 개일까요?","hint":"합이 가장 작거나 가장 크려면 네 번의 결과가 모두 같아야 해요.","explanation":"숫자 \\(i\\)가 적힌 공의 개수를 \\(n_i\\)라 할게요. \\(X=4\\)는 네 번 모두 \\(1\\)이 나온 경우뿐이므로 \\((n_1/12)^4=1/81=(1/3)^4\\)이고 \\(n_1=4\\)예요.\n\n또 \\(16P(X=16)=1/81\\)이므로 \\(P(X=16)=1/1296=(1/6)^4\\)예요. \\(X=16\\)은 네 번 모두 \\(4\\)가 나온 경우라 \\((n_4/12)^4=(1/6)^4\\), 따라서 \\(n_4=2\\)예요.","check":{"prompt":"\\(X=16\\)의 확률은 얼마인가요?","answer":"\\((1/81)/16=1/1296\\)이에요."}},{"id":"c2","label":"평균으로 2번과 3번 공의 개수를 정해요","stepIds":["s3","s4"],"question":"\\(E(X)=9\\)는 \\(n_2,n_3\\)에 어떤 두 식을 줄까요?","hint":"\\(E(X)=4E(Y)\\)이고 남은 공 수는 \\(6\\)개예요.","explanation":"네 시행의 합이므로 \\(E(X)=4E(Y)=9\\), 즉 \\(E(Y)=9/4\\)예요. 이미 \\(n_1=4,n_4=2\\)이므로 \\(n_2+n_3=6\\)이에요.\n\n한 번의 평균은\n\\[\nE(Y)=\\frac{1\\cdot4+2n_2+3n_3+4\\cdot2}{12}=\\frac94\n\\]\n이므로 \\(2n_2+3n_3=15\\)예요. \\(2(n_2+n_3)=12\\)를 빼면 \\(n_3=3\\), 이어서 \\(n_2=3\\)이에요.","check":{"prompt":"숫자별 공의 개수는 최종적으로 어떻게 되나요?","answer":"\\((n_1,n_2,n_3,n_4)=(4,3,3,2)\\)예요."}},{"id":"c3","label":"한 번의 제곱평균에서 합의 분산을 구해요","stepIds":["s5","s6","s7"],"question":"한 번의 시행의 분산과 네 번 합의 분산은 각각 얼마인가요?","hint":"먼저 \\(E(Y^2)\\)을 구하고, 독립인 합의 분산은 각각의 분산을 더해요.","explanation":"제곱의 평균은\n\\[\nE(Y^2)=\\frac{1^2\\cdot4+2^2\\cdot3+3^2\\cdot3+4^2\\cdot2}{12}\n=\\frac{4+12+27+32}{12}=\\frac{25}{4}\n\\]\n예요. 따라서 \\(V(Y)=25/4-(9/4)^2=100/16-81/16=19/16\\)이에요.\n\n네 시행은 독립이므로 \\(V(X)=4V(Y)=19/4\\)예요. \\(p=4,q=19\\)는 서로소이므로 \\(p+q=23\\)이에요.","check":{"prompt":"분산에 4의 제곱을 곱하지 않는 이유는 무엇인가요?","answer":"X가 같은 확률변수 하나의 4배가 아니라 서로 독립인 네 시행의 합이어서 각 분산 네 개를 더하기 때문이에요."}}],"takeaway":["합이 가질 수 있는 가장 작은 값과 큰 값의 확률은 한 번의 시행에서 양 끝값이 나올 확률을 알려 줘요.","합의 평균은 각 시행 평균의 합이고, 독립인 시행들의 합의 분산도 각 분산의 합이에요.","분산은 제곱의 평균에서 평균의 제곱을 빼 계산해요."]};</script>
