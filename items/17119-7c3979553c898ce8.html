<script>window.HandStudyRecord={"itemId":17119,"sourceLabel":"2021 교육청 고3 수학확통 10월 30번","adminYear":2021,"grade":3,"month":10,"number":30,"track":"확통","points":4,"scoreStatus":"confirmed_4_direct","questionText":"주머니에 $12$개의 공이 들어 있다. 이 공들 각각에는 숫자 $1$, $2$, $3$, $4$ 중 하나씩이 적혀 있다. 이 주머니에서 임의로 한 개의 공을 꺼내어 공에 적혀 있는 수를 확인한 후 다시 넣는 시행을 한다. 이 시행을 $4$번 반복하여 확인한 $4$개의 수의 합을 확률변수 $X$ 라 할 때, 확률변수 $X$는 다음 조건을 만족시킨다.\n(가) ${ P}(X=4)=16×{ P}(X=16)=\\frac{1}{ 81}$ (나) ${ E}(X\\,)=9$\n${ V}(X\\,)=\\frac{q}{p}$일 때, $p+q$의 값을 구하시오. (단, $p$ 와 $q$는 서로소인 자연수이다.) [4점]","answer":"23","sourceHash":"34b269e5ae8ab32025cc65986ea8676faf3357b786414128329d7c2ca9dac277","steps":[{"id":"s1","latex":"P(X=4)=\\left(\\frac{n_1}{12}\\right)^4=\\frac1{81}\\Rightarrow n_1=4"},{"id":"s2","latex":"P(X=16)=\\left(\\frac{n_4}{12}\\right)^4=\\frac1{16\\cdot81}\\Rightarrow n_4=2"},{"id":"s3","latex":"E(X)=4E(Y)=9\\Rightarrow E(Y)=\\frac94"},{"id":"s4","latex":"n_2+n_3=6,\\quad\\frac{4+2n_2+3n_3+8}{12}=\\frac94\\Rightarrow n_2=n_3=3"},{"id":"s5","latex":"E(Y^2)=\\frac{4+12+27+32}{12}=\\frac{25}4"},{"id":"s6","latex":"V(Y)=\\frac{25}4-\\left(\\frac94\\right)^2=\\frac{19}{16}"},{"id":"s7","latex":"V(X)=4V(Y)=\\frac{19}4\\Rightarrow p+q=23"}],"diagram":null,"contentHash":"8d7288265283b598804dc37d8e085f920b96c3e2b29a8c288c79b775648e10c8","questionHtml":"\u003cp class=\"hp\">주머니에 \u003cspan class=\"heq\">\\(12\\)\u003c/span>개의 공이 들어 있다. 이 공들 각각에는 숫자 \u003cspan class=\"heq\">\\(1\\)\u003c/span>, \u003cspan class=\"heq\">\\(2\\)\u003c/span>, \u003cspan class=\"heq\">\\(3\\)\u003c/span>, \u003cspan class=\"heq\">\\(4\\)\u003c/span> 중 하나씩이 적혀 있다. 이 주머니에서 임의로 한 개의 공을 꺼내어 공에 적혀 있는 수를 확인한 후 다시 넣는 시행을 한다. 이 시행을 \u003cspan class=\"heq\">\\(4\\)\u003c/span>번 반복하여 확인한 \u003cspan class=\"heq\">\\(4\\)\u003c/span>개의 수의 합을 확률변수 \u003cspan class=\"heq\">\\(X\\)\u003c/span> 라 할 때, 확률변수 \u003cspan class=\"heq\">\\(X\\)\u003c/span>는 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp htall\">(가) \u003cspan class=\"heq
