<script>window.HandStudyRecord={"itemId":18196,"sourceLabel":"2025 교육청 고3 수학기하 5월 30번","adminYear":2025,"grade":3,"month":5,"number":30,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 ${ \\overline{{AD}}}=8 \\sqrt{3}\\,$인 직사각형 ${{ABCD}}\\,$가 있다. 두 점 ${{E}}$, ${{F}}\\,$가 점 ${{E}}\\,$는 선분 ${{AD}}$ 위를, 점 ${{F}}\\,$는 선분 ${{BC}}$ 위를 $\\angle {{CFE}}=60 ^{\\circ} \\,$를 만족시키며 움직인다. 선분 ${{EF}}\\,$를 $1\\,:\\,2\\,$로 내분하는 점을 ${{G}}\\,$라 할 때, 점 ${{G}}\\,$가 다음 조건을 만족시킨다.\n$\\left|\\, { \\vec{{GA}}}+{ \\vec{{GC}}}\\,\\right| \\,$의 최댓값을 $M\\,$, 최솟값을 $m\\,$이라 할 때, $M\\,:\\,m= \\sqrt{13} \\,:\\,1\\,$이다.\n$\\left|\\, { \\vec{{GA}}}+{ \\vec{{GC}}}\\,\\right| \\,$의 값이 최대일 때의 점 ${{G}}\\,$를 ${{G}}_{1}$, 최소일 때의 점 ${{G}}\\,$를 ${{G}}_{2}\\,$라 하자. 삼각형 ${{BG}}_{1}{{G}}_{2}\\,$의 넓이를 $S\\,$라 할 때, $S^{2}\\,$의 값을 구하시오. (단, ${ \\overline{{AB}}} \\leq 18$) [4점]","answer":"243","sourceHash":"57e65ee18a7ea156c4ff7461caef33a3402a499024a80e2b785a50b67c6fe445","steps":[{"id":"s1","latex":"B=(0,0),\\ C=(8\\sqrt3,0),\\ A=(0,h),\\ E=(e,h),\\ F=(f,0)"},{"id":"s2","latex":"e-f=h/\\sqrt3,\\quad G=(g,2h/3),\\quad g=f+2h/(3\\sqrt3)"},{"id":"s3","latex":"0\\le f\\le8\\sqrt3-h/\\sqrt3\\Rightarrow\\frac{2h}{3\\sqrt3}\\le g\\le8\\sqrt3-\\frac h{3\\sqrt3}"},{"id":"s4","latex":"\\vec{GA}+\\vec{GC}=(8\\sqrt3-2g,-h/3),\\quad h\\le18\\Rightarrow4\\sqrt3\\text{는 }g\\text{의 범위 안}"},{"id":"s5","latex":"m=h/3,\\quad M^2=\\left(8\\sqrt3-\\frac{2h}{3\\sqrt3}\\right)^2+h^2/9=13m^2"},{"id":"s6","latex":"h=9,\\quad G_1=(7\\sqrt3,6),\\ G_2=(4\\sqrt3,6)"},{"id":"s7","latex":"S=\\tfrac12\\cdot3\\sqrt3\\cdot6=9\\sqrt3\\Rightarrow S^2=243"}],"diagram":null,"contentHash":"a4dcf89f940332eba33b238e03465fe991e592559c6a4a1eb33a39e5e3dcb0fb","questionHtml":"\u003cp class=\"hp htall\">그림과 같이 \u003cspan class=\"heq\">\\({ \\overline{{AD}}}=8 \\sqrt{3}\\,\\)\u003c/span>인 직사각형 \u003cspan class=\"heq\">\\({{ABCD}}\\,\\)\u003c/span>가 있다. 두 점 \u003cspan class=\"heq\">\\({{E}}\\)\u003c/span>, \u003cspan class=\"heq\">\\({{F}}\\,\\)\u003c/span>가 점 \u003cspan class=\"heq\">\\({{E}}\\,\\)\u003c/span>는 선분 \u003cspan class=\"heq\">\\({{AD}}\\)\u003c/span> 위를, 점 \u003cspan class=\"heq\">\\({{F}}\\,\\)\u003c/span>는 선분 \u003cspan class=\"heq\">\\({{BC}}\\)\u003c/span> 위를 \u003cbr>\u003cspan class=\"heq\">\\(\\angle {{CFE}}=60^{\\circ} \\,\\)\u003c/span>를 만족시키며 움직인다. 선분 \u003cspan class=\"heq\">\\({{EF}}\\,\\)\u003c/span>를 \u003cspan class=\"heq\">\\(1\\,:\\,2\\,\\)\u003c/span>로 내분하는 점을 \u003cspan class=\"heq\">\\({{G}}\\,\\)\u003c/span>라 할 때, 점 \u003cspan class=\"heq\">\\({{G}}\\,\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(\\left|\\, { \\vec{{GA}}}+{ \\vec{{GC}}}\\,\\right| \\,\\)\u003c/span>의 최댓값을 \u003cspan class=\"heq\">\\(M\\,\\)\u003c/span>, 최솟값을 \u003cspan class=\"heq\">\\(m\\,\\)\u003c/span>이라 할 때, \u003cbr>\u003cspan class=\"heq\">\\(M\\,:\\,m= \\sqrt{13} \\,:\\,1\\,\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp class=\"hp htall\">\u003cspan class=\"heq\">\\(\\left|\\, { \\vec{{GA}}}+{ \\vec{{GC}}}\\,\\right| \\,\\)\u003c/span>의 값이 최대일 때의 점 \u003cspan class=\"heq\">\\({{G}}\\,\\)\u003c/span>를 \u003cspan class=\"heq\">\\({{G}}_{1}\\)\u003c/span>, 최소일 때의 점 \u003cspan class=\"heq\">\\({{G}}\\,\\)\u003c/span>를 \u003cspan class=\"heq\">\\({{G}}_{2}\\,\\)\u003c/span>라 하자. 삼각형 \u003cspan class=\"heq\">\\({{BG}}_{1}{{G}}_{2}\\,\\)\u003c/span>의 넓이를 \u003cspan class=\"heq\">\\(S\\,\\)\u003c/span>라 할 때, \u003cspan class=\"heq\">\\(S^{2}\\,\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\({ \\overline{{AB}}} \\leq 18\\)\u003c/span>) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/d8aa8f76f5c94f33a8e543a9.png\" style=\"width:315px;max-width:100%\">\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"cab01bd4db093530674085a79c220cfb85429ecb5b660f80093253cdb132e001"};</script>
<script>window.HandStudyGuide={"itemId":18196,"sourceHash":"57e65ee18a7ea156c4ff7461caef33a3402a499024a80e2b785a50b67c6fe445","contentHash":"a4dcf89f940332eba33b238e03465fe991e592559c6a4a1eb33a39e5e3dcb0fb","overview":{"goal":"각 조건과 내분점의 자취를 좌표로 나타내고, 벡터합의 크기가 가장 작고 큰 위치를 비교해 직사각형의 높이를 정해요.","firstLook":"\\(\\overrightarrow{GA}+\\overrightarrow{GC}\\)는 점 \\(G\\)에서 대각선 양 끝 \\(A,C\\)로 향하는 두 벡터의 합이에요. 좌표로 쓰면 \\(G\\)의 가로 위치에 따라 변하고 세로 성분은 일정해요.","conditions":[{"label":"직사각형","meaning":"가로 길이 \\(AD=8\\sqrt3\\), 세로 길이를 \\(h=AB\\)라 두고 \\(h\\le18\\)이에요."},{"label":"각과 내분","meaning":"\\(\\angle CFE=60^\\circ\\)이고 \\(EG:GF=1:2\\)예요."},{"label":"최대와 최소의 비","meaning":"벡터합 크기의 비가 \\(M:m=\\sqrt{13}:1\\)이에요."}]},"chapters":[{"id":"c1","label":"E와 F의 관계에서 G의 자취를 구해요","stepIds":["s1","s2","s3"],"question":"점 \\(G\\)는 어떤 수평선 위의 어느 구간을 움직일까요?","hint":"\\(E=(e,h)\\), \\(F=(f,0)\\)로 두고 기울기가 \\(\\tan60^\\circ\\)임을 써요.","explanation":"\\(B=(0,0)\\), \\(C=(8\\sqrt3,0)\\), \\(A=(0,h)\\), \\(E=(e,h)\\), \\(F=(f,0)\\)로 놓아요. \\(\\angle CFE=60^\\circ\\)에서 \\(h/(e-f)=\\sqrt3\\), 즉 \\(e-f=h/\\sqrt3\\)이에요.\n\n\\(EG:GF=1:2\\)이므로 \\(G=(2E+F)/3\\)이고 \\(G=(g,2h/3)\\), \\(g=f+2h/(3\\sqrt3)\\)예요. \\(0\\le f\\)이고 \\(e=f+h/\\sqrt3\\le8\\sqrt3\\)이므로\n\\[\n\\frac{2h}{3\\sqrt3}\\le g\\le8\\sqrt3-\\frac{h}{3\\sqrt3}.\n\\]\n따라서 \\(G\\)는 높이가 \\(2h/3\\)인 수평선분을 움직여요.","check":{"prompt":"점 \\(G\\)의 \\(y\\)좌표가 일정한 이유는 무엇인가요?","answer":"\\(E\\)의 높이는 늘 \\(h\\), \\(F\\)의 높이는 늘 \\(0\\)이고 같은 내분비를 유지하므로 \\(2h/3\\)으로 고정돼요."}},{"id":"c2","label":"벡터합의 최솟값 위치를 찾아요","stepIds":["s4"],"question":"\\(|\\overrightarrow{GA}+\\overrightarrow{GC}|\\)가 가장 작은 가로 위치는 어디인가요?","hint":"벡터합은 \\((8\\sqrt3-2g,-h/3)\\)이고 첫 성분을 0으로 만들 수 있는지 확인해요.","explanation":"\\(\\overrightarrow{GA}+\\overrightarrow{GC}=A+C-2G=(8\\sqrt3-2g,-h/3)\\)예요. 크기의 제곱은 \\((8\\sqrt3-2g)^2+h^2/9\\)이므로 \\(g=4\\sqrt3\\)에서 가장 작아요.\n\n이 값이 \\(G\\)의 범위 안에 있으려면 왼쪽 끝 이하가 아니고 오른쪽 끝 이상이 아니어야 해요. 특히 \\(2h/(3\\sqrt3)\\le4\\sqrt3\\)은 \\(h\\le18\\)이고 문제의 조건과 같아요. 따라서 실제 최솟값은 \\(m=h/3\\)이에요.","check":{"prompt":"최솟값에서 벡터합의 가로 성분은 얼마인가요?","answer":"\\(8\\sqrt3-2(4\\sqrt3)=0\\)이에요."}},{"id":"c3","label":"두 끝점을 비교해 최댓값과 높이를 정해요","stepIds":["s5","s6"],"question":"최댓값은 어느 끝점에서 나오고, 비 조건은 \\(h\\)를 얼마로 정할까요?","hint":"가운데에서 가장 작아지는 이차식이므로 두 끝점을 실제로 비교해요.","explanation":"오른쪽 끝에서 중심까지의 거리는 \\(4\\sqrt3-h/(3\\sqrt3)\\), 왼쪽 끝에서 중심까지의 거리는 \\(4\\sqrt3-2h/(3\\sqrt3)\\)예요. \\(h>0\\)이므로 오른쪽 끝이 더 멀어 최댓값은 \\(g=8\\sqrt3-h/(3\\sqrt3)\\)에서 나와요.\n\n이때 가로 성분의 절댓값은 \\(8\\sqrt3-2h/(3\\sqrt3)\\)이므로\n\\[\nM^2=\\left(8\\sqrt3-\\frac{2h}{3\\sqrt3}\\right)^2+\\frac{h^2}{9}.\n\\]\n\\(M^2=13m^2=13h^2/9\\)을 넣고 양의 제곱근을 취하면 \\(8\\sqrt3-2h/(3\\sqrt3)=2h/\\sqrt3\\)이에요. 정리하면 \\(h=9\\)예요. 따라서 \\(G_1=(7\\sqrt3,6)\\), \\(G_2=(4\\sqrt3,6)\\)이에요.","check":{"prompt":"두 끝점 중 오른쪽 끝이 중심 \\(4\\sqrt3\\)에서 더 먼 이유는 무엇인가요?","answer":"오른쪽 거리는 \\(4\\sqrt3-h/(3\\sqrt3)\\), 왼쪽 거리는 \\(4\\sqrt3-2h/(3\\sqrt3)\\)라 전자가 \\(h/(3\\sqrt3)\\)만큼 더 커요."}},{"id":"c4","label":"두 G점을 밑변으로 넓이를 구해요","stepIds":["s7"],"question":"삼각형 \\(BG_1G_2\\)의 넓이와 그 제곱은 얼마인가요?","hint":"두 G점은 같은 높이 6에 있어 밑변이 수평이에요.","explanation":"\\(G_1G_2=7\\sqrt3-4\\sqrt3=3\\sqrt3\\)이고, 원점 \\(B\\)에서 이 수평선까지의 높이는 \\(6\\)이에요. 따라서 \\(S=\\frac12\\cdot3\\sqrt3\\cdot6=9\\sqrt3\\)이고 \\(S^2=243\\)이에요.","check":{"prompt":"밑변 \\(G_1G_2\\)의 길이는 얼마인가요?","answer":"두 점의 세로좌표가 같으므로 가로좌표 차인 \\(3\\sqrt3\\)이에요."}}],"takeaway":["고정된 내분비로 두 평행한 변 위의 점을 이으면 내분점은 그 사이의 평행선분을 움직여요.","벡터합 크기의 제곱을 한 좌표의 이차식으로 만들면 중심에서 최소, 구간의 더 먼 끝에서 최대예요.","구간 양 끝 후보는 중심까지의 실제 거리를 비교해 최댓값 위치를 확정해요."]};</script>
