  <script>window.HandStudyRecord={"itemId":16653,"sourceLabel":"2020 교육청 고3 수리가형 3월 18번","adminYear":2020,"grade":3,"month":3,"number":18,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"다음은 $1 \\leq \\left| m \\right| \\lt n \\leq 10\\,$을 만족시키는 두 정수 $m$, $n\\,$에 대하여 $m\\,$의 $n\\,$제곱근 중에서 실수인 것이 존재하도록 하는 순서쌍 $\\left(m,\\,n \\right)\\,$의 개수를 구하는 과정이다.\n(ⅰ) $m\\gt 0\\,$인 경우\n$n\\,$의 값에 관계없이 $m\\,$의 $n\\,$제곱근 중에서 실수인 것이 존재한다. 그러므로 $m\\gt 0\\,$인 순서쌍 $\\left(m,\\,n \\right)\\,$의 개수는 $\\boxed{\\vphantom{(} \\,(\\text{가})^\\, \\,}\\,$이다.\n(ⅱ) $m \\lt 0\\,$인 경우\n$n\\,$이 홀수이면 $m\\,$의 $n\\,$제곱근 중에서 실수인 것이 항상 존재한다. 한편, $n\\,$이 짝수이면 $m\\,$의 $n\\,$제곱근 중에서 실수인 것은 존재하지 않는다. 그러므로 $m\\lt 0\\,$인 순서쌍 $\\left(m,\\,n \\right)\\,$의 개수는 ${\\boxed{\\vphantom{(}\\,(\\text{나})^\\,}} \\,$이다.\n(ⅰ), (ⅱ)에 의하여 $m\\,$의 $n\\,$제곱근 중에서 실수인 것이 존재하도록 하는 순서쌍 $( m,\\,n)\\,$의 개수는\n${\\boxed{\\vphantom{(}\\,(\\text{가}) \\,}}\\,+\\,{\\boxed{\\vphantom{(}\\,(\\text{나}) \\,}} \\,$이다.\n위의 (가), (나)에 알맞은 수를 각각 $p$, $q\\,$라 할 때, $p+q\\,$의 값은?\n[4점]\n① $70$ ② $65$ ③ $60$ ④ $55$ ⑤ $50$","answer":"②","sourceHash":"89830f56e52fac511cfdea661ac9ac626b13812a97c1dd2507543943877d8c4c","steps":[{"id":"s1","latex":"m>0:\\quad p=\\sum_{n=2}^{10}(n-1)=1+2+\\cdots+9=45"},{"id":"s2","latex":"m\u003c0:\\quad n\\in\\{3,5,7,9\\}"},{"id":"s3","latex":"q=(3-1)+(5-1)+(7-1)+(9-1)=2+4+6+8=20"},{"id":"s4","latex":"p+q=45+20=\\boxed{65}"}],"diagram":null,"contentHash":"206b87043e60ffdc573c707997bacc8f9d5e414409caddd91195ce7d7c478090","questionHtml":"\u003cp class=\"hp\">다음은 \u003cspan class=\"heq\">\\(1 \\leq \\left| m \\right| \\lt n \\leq 10\\,\\)\u003c/span>을 만족시키는 두 정수 \u003cspan class=\"heq\">\\(m\\)\u003c/span>, \u003cspan class=\"heq\">\\(n\\,\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(m\\,\\)\u003c/span>의 \u003cspan class=\"heq\">\\(n\\,\\)\u003c/span>제곱근 중에서 실수인 것이 존재하도록 하는 순서쌍 \u003cspan class=\"heq\">\\(\\left(m,\\,n \\right)\\,\\)\u003c/span>의 개수를 구하는 과정이다.\u003c/p>\u003cdiv class=\"hbox\">\u0
