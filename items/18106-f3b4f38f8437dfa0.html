<script>window.HandStudyRecord={"itemId":18106,"sourceLabel":"2024 평가원 고3 수학확통 9월 30번","adminYear":2024,"grade":3,"month":9,"number":30,"track":"확통","points":4,"scoreStatus":"confirmed_4_direct","questionText":"흰 공 $4\\,$개와 검은 공 $4\\,$개를 세 명의 학생 $A$, $B$, $C \\,$에게 다음 규칙에 따라 남김없이 나누어 주는 경우의 수를 구하시오. (단, 같은 색 공끼리는 서로 구별하지 않고, 공을 받지 못하는 학생이 있을 수 있다.) [4점]\n(가) 학생 $A\\,$가 받는 공의 개수는 $0$ 이상 $2$ 이하이다.\n(나) 학생 $B\\,$가 받는 공의 개수는 $2$ 이상이다.","answer":"93","sourceHash":"943b517b3b8582d42698af3dc50d1976b71068db6e2d2d663f8519a05d544276","steps":[{"id":"s1","latex":"p,q=\\text{A가 받은 흰 공, 검은 공},\\quad p+q\\le2"},{"id":"s2","latex":"\\text{고정 }(p,q):\\quad B\\text{의 흰 공 }0\\sim4-p,\\ \\text{검은 공 }0\\sim4-q\\Rightarrow(5-p)(5-q)\\text{가지}"},{"id":"s3","latex":"\\sum_{p+q\\le2}(5-p)(5-q)=111"},{"id":"s4","latex":"B\\text{가 0개 또는 1개 받는 경우}=6\\cdot3=18"},{"id":"s5","latex":"N=111-18=93"}],"diagram":null,"contentHash":"0a291d5ce9d812a7b02d97cdee2ed55d1def76bd04ed6c04a049365325397a0a","questionHtml":"\u003cp class=\"hp\">흰 공 \u003cspan class=\"heq\">\\(4\\,\\)\u003c/span>개와 검은 공 \u003cspan class=\"heq\">\\(4\\,\\)\u003c/span>개를 세 명의 학생 \u003cspan class=\"heq\">\\({{A}}\\)\u003c/span>, \u003cspan class=\"heq\">\\({{B}}\\)\u003c/span>, \u003cspan class=\"heq\">\\({{C}} \\,\\)\u003c/span>에게 다음 규칙에 따라 남김없이 나누어 주는 경우의 수를 구하시오. (단, 같은 색 공끼리는 서로 구별하지 않고, 공을 받지 못하는 학생이 있을 수 있다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) 학생 \u003cspan class=\"heq\">\\(A\\,\\)\u003c/span>가 받는 공의 개수는 \u003cspan class=\"heq\">\\(0\\)\u003c/span> 이상 \u003cspan class=\"heq\">\\(2\\)\u003c/span> 이하이다.\u003c/p>\u003cp class=\"hp\">(나) 학생 \u003cspan class=\"heq\">\\(B\\,\\)\u003c/span>가 받는 공의 개수는 \u003cspan class=\"heq\">\\(2\\)\u003c/span> 이상이다.\u003c/p>\u003c/div>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"f3b4f38f8437dfa0c909eb252c2b91bbf37f6b1f1fda16e9b232d5e449d6e537"};</script>
<script>window.HandStudyGuide={"itemId":18106,"sourceHash":"943b517b3b8582d42698af3dc50d1976b71068db6e2d2d663f8519a05d544276","contentHash":"0a291d5ce9d812a7b02d97cdee2ed55d1def76bd04ed6c04a049365325397a0a","overview":{"goal":"학생 A가 받는 두 색 공의 수를 먼저 고정하고, 학생 B의 선택을 세되 두 개 미만 받는 경우를 빼요.","firstLook":"A의 몫을 고정하면 남은 각 색 공을 B와 C에게 나누는 방법은 B가 받는 수만 정하면 하나씩 결정돼요.","conditions":[{"label":"조건 (가)","meaning":"A의 흰 공 수와 검은 공 수의 합이 \\(2\\) 이하예요."},{"label":"조건 (나)","meaning":"B가 \\(0\\)개 또는 \\(1\\)개 받는 경우를 전체에서 빼요."}]},"chapters":[{"id":"c1","label":"첫 학생의 몫을 고정해요","stepIds":["s1","s2"],"question":"A가 \\((p,q)\\)개를 받았을 때 B와 C의 분배는 몇 가지인가요?","hint":"B의 흰 공 수와 검은 공 수를 고르면 C의 몫은 자동이에요.","explanation":"A가 흰 공 \\(p\\)개, 검은 공 \\(q\\)개를 받고 \\(p+q\\le2\\)라 해요. 남은 흰 공은 \\(4-p\\)개이므로 B는 \\(0\\)부터 \\(4-p\\)까지 \\(5-p\\)가지, 검은 공은 \\(5-q\\)가지로 고를 수 있어요. 따라서 고정한 \\((p,q)\\)마다 \\((5-p)(5-q)\\)가지예요.","check":{"prompt":"C의 몫을 따로 곱하지 않는 이유는 무엇인가요?","answer":"A와 B의 몫을 정하면 남은 공을 모두 C가 받아 C의 몫이 자동으로 정해져요."}},{"id":"c2","label":"제한 전 전체를 더해요","stepIds":["s3"],"question":"가능한 여섯 쌍의 합은 얼마인가요?","hint":"\\((0,0),(1,0),(0,1),(2,0),(1,1),(0,2)\\)를 대입하세요.","explanation":"각 값은 \\(25,20,20,15,16,15\\)이므로 합은 \\(25+20+20+15+16+15=111\\)가지예요. 여기에는 B가 두 개 미만 받는 경우도 들어 있어요.","check":{"prompt":"A가 받을 수 있는 쌍이 정확히 여섯 개인 이유는 무엇인가요?","answer":"음이 아닌 정수 \\(p,q\\)가 \\(p+q\\le2\\)를 만족하는 쌍을 모두 적으면 여섯 개예요."}},{"id":"c3","label":"둘째 학생의 부족한 경우를 빼요","stepIds":["s4","s5"],"question":"B가 0개 또는 1개 받는 경우는 몇 개인가요?","hint":"A의 여섯 쌍마다 B가 0개인 한 경우와 1개인 두 경우가 있어요.","explanation":"B가 공을 받지 않는 경우는 각 \\((p,q)\\)마다 한 가지라 \\(6\\)가지예요. B가 한 개 받는 경우는 흰 공 한 개 또는 검은 공 한 개의 두 가지이고, A가 많아도 각 색이 최소 두 개 남으므로 항상 가능해 \\(6\\times2=12\\)가지예요. 따라서 \\(111-(6+12)=93\\)가지예요.","check":{"prompt":"B가 한 개 받는 두 선택이 모든 A의 쌍에서 가능한 이유는 무엇인가요?","answer":"A는 한 색을 최대 2개만 받아 각 색 공이 적어도 2개 남기 때문이에요."}}],"takeaway":["같은 색 공 분배는 한 학생의 몫을 고르면 마지막 학생 몫이 자동으로 정해져요.","합 조건이 작은 변수쌍은 직접 표로 모두 적어 누락을 막아요.","최소 개수 조건은 부족한 경우를 빼는 편이 간단할 수 있어요."]};</script>
