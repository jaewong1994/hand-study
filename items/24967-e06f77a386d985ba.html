<script>window.HandStudyRecord={"adminYear":2025,"answer":"457","contentHash":"6e4dd288aa37701d9c021b492ce39df5b43b5a93c647dd8f5bb3e1a16adaa2c7","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24967,"month":11,"number":22,"points":4,"preview":false,"questionHtml":"\u003cp>곡선 \u003cspan class=\"heq\">\\(y= \\log_{16}\\, \\left(8x+2 \\right)\\)\u003c/span> 위의 점 \u003cspan class=\"heq\">\\({{A}} \\left(a,\\,b \\right)\\,\\)\u003c/span>와 곡선 \u003cspan class=\"heq\">\\(y=4^{x-1}-\\frac{1}{2}\\)\u003c/span> 위의 점 \u003cspan class=\"heq\">\\({{B}}\\,\\)\u003c/span>가 제\u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>사분면에 있다. 점 \u003cspan class=\"heq\">\\({{A}}\\,\\)\u003c/span>를 직선 \u003cspan class=\"heq\">\\(y=x\\,\\)\u003c/span>에 대하여 대칭이동한 점이 직선 \u003cspan class=\"heq\">\\({{OB}}\\)\u003c/span> 위에 있고 선분 \u003cspan class=\"heq\">\\({{AB}}\\,\\)\u003c/span>의 중점의 좌표가 \u003cspan class=\"heq\">\\(\\left(\\frac{77}{8},\\,\\frac{133}{8} \\right)\\,\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(a \\times b=\\frac{q}{p}\\,\\)\u003c/span>이다. \u003cspan class=\"heq\">\\(p+q\\,\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\({{O}}\\,\\)\u003c/span>는 원점이고, \u003cspan class=\"heq\">\\(p\\,\\)\u003c/span>와 \u003cspan class=\"heq\">\\(q\\,\\)\u003c/span>는 서로소인 자연수이다.) [4점]\u003c/p>","questionText":"곡선 $y= \\log\\,_{16}\\, \\left(8x+2 \\right)$ 위의 점 ${{A}} \\left(a,\\,b \\right)\\,$와 곡선 $y=4^{x-1}-\\frac{1}{2}$ 위의 점 ${{B}}\\,$가 제$1\\,$사분면에 있다. 점 ${{A}}\\,$를 직선 $y=x\\,$에 대하여 대칭이동한 점이 직선 ${{OB}}$ 위에 있고 선분 ${{AB}}\\,$의 중점의 좌표가 $\\left(\\frac{77}{8},\\,\\frac{133}{8} \\right)\\,$일 때, $a \\times b=\\frac{q}{p}\\,$이다. $p+q\\,$의 값을 구하시오. (단, ${{O}}\\,$는 원점이고, $p\\,$와 $q\\,$는 서로소인 자연수이다.) [4점]","sourceHash":"04e8c6d7a12da4dfaf590f12fdb2196b87234518bfdcab4c849efd2609265d7b","sourceKind":"csat","sourceLabel":"2025년 시행 수능 · 2026학년도 · 공통 · 22번","steps":[{"id":"s1","latex":"A=(a,b)\\text{가 }b=\\log_{16}(8a+2)\\text{ 위에 있으므로 }a=\\frac{16^{b}}8-\\frac14"},{"id":"s2","latex":"2a=4^{2b-1}-\\frac12"},{"id":"s3","latex":"\\text{따라서 }(2b,2a)\\text{는 }y=4^{x-1}-\\frac12\\text{ 위에 있고 }O,(b,a)\\text{와 한 직선 위에 있다.}"},{"explanation":{"body":"원점을 지나는 직선의 기울기를 \\(m\\)이라 하고 \\(F(x)=4^{x-1}-\\frac12-mx\\)로 둡니다. \\(F(0)\u003c0\\), \\(F^{\\prime\\prime}(x)>0\\)입니다. 양의 두 근 \\(r\u003cs\\)가 있다면 볼록성에 따라 할선 기울기는 증가해야 하지만, \\((F(r)-F(0))/r>0\\)인 반면 \\((F(s)-F(r))/(s-r)=0\\)이라 모순입니다. 따라서 양의 교점은 하나뿐입니다.","skillTags":["볼록성","교점유일성"],"title":"같은 직선 위 교점이 왜 하나인가"},"id":"s4","latex":"\\begin{aligned}&F(x)=4^{x-1}-\\frac12-mx\\text{라 하면 }F(0)\u003c0,\\quad F''(x)>0.\\\\&\\text{양의 두 근 }r\u003cs\\text{가 있다고 가정하자.}\\\\&\\frac{F(r)-F(0)}r>0,\\qquad \\frac{F(s)-F(r)}{s-r}=0\\\\&\\text{이 되어 볼록성에 모순이다.}\\end{aligned}"},{"id":"s5","latex":"\\text{따라서 양의 교점은 하나이고 }B=(2b,2a)"},{"id":"s6","latex":"\\frac{a+2b}{2}=\\frac{77}{8},\\qquad \\frac{b+2a}{2}=\\frac{133}{8}"},{"id":"s7","latex":"a+2b=\\frac{77}{4},\\quad2a+b=\\frac{133}{4}"},{"id":"s8","latex":"a=\\frac{63}{4},\\qquad b=\\frac74"},{"id":"s9","latex":"ab=\\frac{441}{16},\\quad p+q=16+441=457"},{"id":"s10","latex":"\\therefore\\ \\boxed{457}"}],"track":"공통"};</script>
<script>window.HandStudyGuide={"itemId":24967,"sourceHash":"04e8c6d7a12da4dfaf590f12fdb2196b87234518bfdcab4c849efd2609265d7b","contentHash":"6e4dd288aa37701d9c021b492ce39df5b43b5a93c647dd8f5bb3e1a16adaa2c7","overview":{"goal":"로그곡선 위 점 A의 좌표를 지수곡선 위 점으로 바꾸고, 원점을 지나는 한 직선과 지수곡선의 양의 교점이 하나임을 보여 B를 확정해요.","firstLook":"로그식 \\(b=\\log_{16}(8a+2)\\)을 지수식으로 바꾸면 \\((2b,2a)\\)가 바로 두 번째 지수곡선 위에 놓여요. 이 점은 \\(A\\)의 대칭점 \\((b,a)\\)의 두 배라 같은 직선 위예요.","conditions":[{"label":"제1사분면","meaning":"\\(A,B\\)의 두 좌표는 모두 양수예요."},{"label":"대칭점","meaning":"\\(A=(a,b)\\)를 \\(y=x\\)에 대칭이동한 점은 \\((b,a)\\)예요."},{"label":"중점","meaning":"\\(A,B\\)의 좌표 합은 주어진 중점 좌표의 두 배예요."}]},"chapters":[{"id":"c1","label":"로그식에서 지수곡선 위의 새 점을 만들어요","stepIds":["s1","s2","s3"],"question":"왜 \\((2b,2a)\\)가 곡선 \\(y=4^{x-1}-1/2\\) 위에 있을까요?","hint":"\\(8a+2=16^b=4^{2b}\\)로 바꾸어요.","explanation":"점 \\(A\\)가 로그곡선 위에 있으므로 \\(8a+2=16^b\\), 즉 \\(a=16^b/8-1/4\\)예요. 양변을 두 배 하면\n\\[\n2a=\\frac{16^b}{4}-\\frac12=4^{2b-1}-\\frac12.\n\\]\n따라서 \\((x,y)=(2b,2a)\\)는 지수곡선 위에 있어요.\n\n한편 대칭점은 \\((b,a)\\)이고 문제에서 직선 \\(OB\\) 위에 있어요. \\((2b,2a)\\)는 그 점을 원점에서 두 배 한 점이므로 역시 같은 직선 위에 있어요.","check":{"prompt":"\\(16^b/4\\)가 \\(4^{2b-1}\\)인 이유는 무엇인가요?","answer":"\\(16^b=4^{2b}\\)이고 \\(4\\)로 나누면 지수가 \\(1\\) 줄기 때문이에요."}},{"id":"c2","label":"같은 직선의 양의 교점이 하나임을 확인해요","stepIds":["s4","s5"],"question":"지수곡선과 원점을 지나는 직선은 제1사분면에서 왜 두 번 만날 수 없을까요?","hint":"직선의 기울기를 m이라 두고 지수함수와 직선의 차가 아래로 굽지 않는 함수임을 이용해요.","explanation":"직선의 기울기를 \\(m\\)이라 하고 \\(F(x)=4^{x-1}-1/2-mx\\)로 두어요. \\(F(0)=-1/4<0\\)이고 \\(F''(x)=(\\ln4)^2 4^{x-1}>0\\)이므로 \\(F\\)의 그래프는 아래로 굽지 않아요.\n\n양의 두 근 \\(r<s\\)가 있다고 하면 \\(0\\)에서 \\(r\\)까지의 할선 기울기는 \\(\\{F(r)-F(0)\\}/r>0\\)이에요. 그런데 \\(r\\)에서 \\(s\\)까지는 두 끝값이 모두 \\(0\\)이라 할선 기울기가 \\(0\\)이에요. 아래로 굽지 않는 함수의 할선 기울기는 오른쪽으로 갈수록 감소할 수 없으므로 모순이에요. 따라서 양의 교점은 하나이고, 이미 찾은 점이 곧 \\(B=(2b,2a)\\)예요.","check":{"prompt":"\\(F(0)\\)을 계산할 때 직선항은 얼마인가요?","answer":"\\(-m\\cdot0=0\\)이어서 \\(F(0)=4^{-1}-1/2=-1/4\\)예요."}},{"id":"c3","label":"중점 좌표로 a와 b를 구해요","stepIds":["s6","s7","s8"],"question":"A와 B의 좌표를 중점식에 넣으면 어떤 연립방정식이 되나요?","hint":"\\(A=(a,b)\\), \\(B=(2b,2a)\\)예요.","explanation":"중점의 \\(x\\)좌표에서 \\((a+2b)/2=77/8\\), \\(y\\)좌표에서 \\((b+2a)/2=133/8\\)이에요. 즉\n\\[\na+2b=\\frac{77}{4},\\qquad 2a+b=\\frac{133}{4}.\n\\]\n첫 식을 두 배 한 뒤 둘째 식을 빼면 \\(3b=21/4\\)라 \\(b=7/4\\)이고, 이어서 \\(a=63/4\\)예요.","check":{"prompt":"구한 \\(a,b\\)는 모두 양수인가요?","answer":"\\(63/4>0\\), \\(7/4>0\\)이라 제1사분면 조건과 맞아요."}},{"id":"c4","label":"좌표의 곱을 기약분수로 정리해요","stepIds":["s9","s10"],"question":"\\(ab=q/p\\)에서 \\(p+q\\)는 얼마인가요?","hint":"두 분수의 분자와 분모를 곱하고 약분 여부를 확인해요.","explanation":"\\(ab=(63/4)(7/4)=441/16\\)이에요. \\(441\\)은 홀수라 \\(16\\)과 서로소이므로 \\(p=16,q=441\\)이고 \\(p+q=457\\)이에요.","check":{"prompt":"\\(441\\)은 어떤 수의 제곱인가요?","answer":"\\(21^2=441\\)이에요."}}],"takeaway":["로그곡선의 점 좌표 관계를 지수식으로 바꾸면 역함수와 닮은 좌표 교환을 찾을 수 있어요.","지수함수와 직선의 교점 유일성은 두 함수의 차의 굽음과 할선 기울기로 확인할 수 있어요.","대칭점과 그 양의 배수는 원점을 지나는 같은 직선 위에 있어요."]};</script>
