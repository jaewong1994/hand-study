a=4^{2b-1}-\\frac12"},{"id":"s3","latex":"\\text{따라서 }(2b,2a)\\text{는 }y=4^{x-1}-\\frac12\\text{ 위에 있고 }O,(b,a)\\text{와 한 직선 위에 있다.}"},{"explanation":{"body":"원점을 지나는 직선의 기울기를 \\(m\\)이라 하고 \\(F(x)=4^{x-1}-\\frac12-mx\\)로 둡니다. \\(F(0)\u003c0\\), \\(F^{\\prime\\prime}(x)>0\\)입니다. 양의 두 근 \\(r\u003cs\\)가 있다면 볼록성에 따라 할선 기울기는 증가해야 하지만, \\((F(r)-F(0))/r>0\\)인 반면 \\((F(s)-F(r))/(s-r)=0\\)이라 모순입니다. 따라서 양의 교점은 하나뿐입니다.","skillTags":["볼록성","교점유일성"],"title":"같은 직선 위 교점이 왜 하나인가"},"id":"s4","latex":"\\begin{aligned}&F(x)=4^{x-1}-\\frac12-mx\\text{라 하면 }F(0)\u003c0,\\quad F''(x)>0.\\\\&\\text{양의 두 근 }r\u003cs\\text{가 있다고 가정하자.}\\\\&\\frac{F(r)-F(0)}r>0,\\qquad \\frac{F(s)-F(r)}{s-r}=0\\\\&\\text{이 되어 볼록성에 모순이다.}\\end{aligned}"},{"id":"s5","latex":"\\text{따라서 양의 교점은 하나이고 }B=(2b,2a)"},{"id":"s6","latex":"\\frac{a+2b}{2}=\\frac{77}{8},\\qquad \\frac{b+2a}{2}=\\frac{133}{8}"},{"id":"s7","latex":"a+2b=\\frac{77}{4},\\quad2a+b=\\frac{133}{4}"},{"id":"s8","latex":"a=\\frac{63}{4},\\qquad b=\\frac74"},{"id":"s9","latex":"ab=\\frac{441}{16},\\quad p+q=16+441=457"},{"id":"s10","latex":"\\therefore\\ \\boxed{457}"}],"track":"공통"};</script>
