<script>window.HandStudyRecord={"itemId":17416,"sourceLabel":"2022 교육청 고3 수학확통 3월 30번","adminYear":2022,"grade":3,"month":3,"number":30,"track":"확통","points":4,"scoreStatus":"confirmed_4_direct","questionText":"흰색 원판 $4\\,$개와 검은색 원판 $4\\,$개에 각각 $A$, $B$, $C$, $D\\,$의 문자가 하나씩 적혀 있다. 이 $8\\,$개의 원판 중에서 $4\\,$개를 택하여 다음 규칙에 따라 원기둥 모양으로 쌓는 경우의 수를 구하시오. (단, 원판의 크기는 모두 같고, 원판의 두 밑면은 서로 구별하지 않는다.) [4점]\n(가) 선택된 $4\\,$개의 원판 중 같은 문자가 적힌 원판이 있으면 같은 문자가 적힌 원판끼리는 검은색 원판이 흰색 원판보다 아래쪽에 놓이도록 쌓는다.(나) 선택된 $4\\,$개의 원판 중 같은 문자가 적힌 원판이 없으면 $D\\,$가 적힌 원판이 맨 아래에 놓이도록 쌓는다.","answer":"708","sourceHash":"aebe147c60052635c0bd4e87c1aa8fdfddbf76987bcc8f69f9032825afd85a87","steps":[{"id":"s1","latex":"r=\\#\\{\\text{선택한 같은 문자 쌍}\\}\\in\\{0,1,2\\}"},{"id":"s2","latex":"r=2:\\quad {4\\choose2}\\frac{4!}{2!2!}=6\\cdot6=36"},{"id":"s3","latex":"r=1:\\quad4\\cdot\\left({3\\choose2}2^2\\right)\\cdot\\frac{4!}{2!}=4\\cdot12\\cdot12=576"},{"id":"s4","latex":"r=0:\\quad2^4\\cdot3!=16\\cdot6=96"},{"id":"s5","latex":"36+576+96=708"}],"diagram":null,"contentHash":"1117724b7c63b5e9e0b18cbd9a960b2067de1ebaa9d7a9175fdf19dbe3ef9c2e","questionHtml":"\u003cp class=\"hp\">흰색 원판 \u003cspan class=\"heq\">\\(4\\,\\)\u003c/span>개와 검은색 원판 \u003cspan class=\"heq\">\\(4\\,\\)\u003c/span>개에 각각 \u003cspan class=\"heq\">\\(A\\)\u003c/span>, \u003cspan class=\"heq\">\\(B\\)\u003c/span>, \u003cspan class=\"heq\">\\(C\\)\u003c/span>, \u003cspan class=\"heq\">\\(D\\,\\)\u003c/span>의 문자가 하나씩 적혀 있다. 이 \u003cspan class=\"heq\">\\(8\\,\\)\u003c/span>개의 원판 중에서 \u003cspan class=\"heq\">\\(4\\,\\)\u003c/span>개를 택하여 다음 규칙에 따라 원기둥 모양으로 쌓는 경우의 수를 구하시오. (단, 원판의 크기는 모두 같고, 원판의 두 밑면은 서로 구별하지 않는다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가)선택된 \u003cspan class=\"heq\">\\(4\\,\\)\u003c/span>개의 원판 중 같은 문자가 적힌 원판이 있으면 같은 문자가 적힌 원판끼리는 검은색 원판이 흰색 원판보다 아래쪽에 놓이도록 쌓는다.\u003c/p>\u003cp class=\"hp\">(나)선택된 \u003cspan class=\"heq\">\\(4\\,\\)\u003c/span>개의 원판 중 같은 문자가 적힌 원판이 없으면 \u003cspan class=\"heq\">\\(D\\,\\)\u003c/span>가 적힌 원판이 맨 아래에 놓이도록 쌓는다.\u003c/p>\u003c/div>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/191f36b178bef75b28bcf838.png\" style=\"width:302px;max-width:100%\">\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"13e56746eaf303e598cc3760acef0ba0b9b96b6e43fb6f6576e68167b43b28a2"};</script>
<script>window.HandStudyGuide={"itemId":17416,"sourceHash":"aebe147c60052635c0bd4e87c1aa8fdfddbf76987bcc8f69f9032825afd85a87","contentHash":"1117724b7c63b5e9e0b18cbd9a960b2067de1ebaa9d7a9175fdf19dbe3ef9c2e","overview":{"goal":"선택한 같은 문자 쌍의 수를 기준으로 원판 선택과 쌓는 순서를 나누어 세어요.","firstLook":"네 장을 고를 때 같은 문자의 흰색·검은색을 모두 고른 쌍은 0개, 1개, 2개만 가능해요.","conditions":[{"label":"같은 문자 있음","meaning":"같은 문자 쌍마다 검은 원판이 흰 원판보다 아래라는 선후관계가 생겨요."},{"label":"같은 문자 없음","meaning":"네 문자를 하나씩 고른 뒤 D 원판을 맨 아래에 고정해요."}]},"chapters":[{"id":"c1","label":"같은 문자 쌍이 두 개인 경우","stepIds":["s1","s2"],"question":"쌍이 두 개일 때 선택과 배열은 각각 몇 가지인가요?","hint":"네 문자 중 두 문자를 고르고, 두 선후관계를 순열에 반영하세요.","explanation":"같은 문자 쌍이 두 개면 두 문자의 흰색·검은색 원판을 모두 골라 네 장을 채워요. 문자를 고르는 방법은 \\({}_{4}\\mathrm C_2=6\\)가지예요.\n\n선택된 네 원판은 모두 다르지만, 각 문자마다 검정이 흰색보다 아래여야 해요. 두 쌍의 선후관계는 서로 독립이므로 전체 \\(4!\\)개 배열의 \\(2\\times2\\)분의 1인 \\(4!/(2!2!)=6\\)가지예요. 따라서 \\(6\\times6=36\\)가지예요.","check":{"prompt":"배열 수를 4!/4로 나누는 이유는 무엇인가요?","answer":"두 문자 쌍 각각에서 검정·흰색의 상대적 순서 두 가지 중 한 가지만 허용되어 두 번 절반이 되기 때문이에요."}},{"id":"c2","label":"같은 문자 쌍이 한 개인 경우","stepIds":["s3"],"question":"나머지 두 원판을 고르는 과정에서 왜 12가지가 나오나요?","hint":"쌍의 문자 하나, 다른 문자 둘, 그 두 원판의 색을 차례로 고르세요.","explanation":"쌍으로 고를 문자는 \\(4\\)가지예요. 남은 세 문자 중 두 문자를 고르는 방법은 \\({}_{3}\\mathrm C_2=3\\)가지이고, 이 두 문자는 각각 흰색 또는 검은색을 고를 수 있어 \\(2^2=4\\)가지예요. 그래서 원판 선택은 쌍의 문자를 고정했을 때 \\(3\\times4=12\\)가지예요.\n\n배열에서는 같은 문자 한 쌍의 검정이 흰색보다 아래라는 조건 하나만 있으므로 \\(4!/2!=12\\)가지예요. 모두 \\(4\\times12\\times12=576\\)가지예요.","check":{"prompt":"쌍이 한 개인데 다른 두 원판의 문자가 같아도 되나요?","answer":"안 돼요. 그러면 같은 문자 쌍이 하나 더 생겨 쌍이 두 개인 경우가 되므로 남은 두 문자는 서로 달라야 해요."}},{"id":"c3","label":"쌍이 없는 경우를 더해요","stepIds":["s4","s5"],"question":"같은 문자가 없을 때 D 조건은 선택과 배열에 어떻게 작용하나요?","hint":"네 문자를 모두 하나씩 선택한 뒤 D 원판을 맨 아래에 고정하세요.","explanation":"같은 문자가 하나도 겹치지 않으면서 네 장을 고르려면 A, B, C, D에서 각각 한 색을 골라야 해요. 각 문자마다 두 색 중 하나를 고르므로 \\(2^4=16\\)가지예요.\n\nD가 적힌 원판을 맨 아래에 고정하면 나머지 세 원판만 순서를 정하므로 \\(3!=6\\)가지예요. 따라서 이 경우는 \\(16\\times6=96\\)가지이고, 전체는 \\(36+576+96=708\\)가지예요.","check":{"prompt":"같은 문자가 없는 경우에 왜 4!이 아니라 3!을 곱하나요?","answer":"조건 (나)가 D 원판의 위치를 맨 아래로 고정하므로 나머지 세 원판의 순서만 정하면 돼요."}}],"takeaway":["같은 종류의 중복 개수를 먼저 정하면 선택 경우가 겹치지 않아요.","선후관계 한 쌍은 서로 다른 원소의 전체 순열을 정확히 절반으로 줄여요.","특정 원판의 위치가 고정되면 남은 원판만 배열해요."]};</script>
