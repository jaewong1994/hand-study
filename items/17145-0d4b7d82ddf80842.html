<script>window.HandStudyRecord={"itemId":17145,"sourceLabel":"2021 교육청 고3 수학확통 7월 29번","adminYear":2021,"grade":3,"month":7,"number":29,"track":"확통","points":4,"scoreStatus":"confirmed_4_direct","questionText":"$1,\\,2,\\,3,\\,4,\\,5$의 숫자가 하나씩 적힌 카드가 각각 $1$장, $2$장, $3$장, $4$장, $5$장이 있다. 이 $15$장의 카드 중에서 임의로 $2$장의 카드를 동시에 선택하는 시행을 한다. 이 시행에서 선택한 $2$장의 카드에 적힌 두 수의 곱의 모든 양의 약수의 개수가 $3$ 이하일 때, 그 두 수의 합이 짝수일 확률은 $\\frac{q}{p}$이다. $p+q$의 값을 구하시오. (단, $p$와 $q$는 서로소인 자연수이다.) [4점]","answer":"25","sourceHash":"cab58fa1c4eda165f3e82b767a6737e0f211508356a84df202cdb2f0396fd6b1","steps":[{"id":"s1","latex":"d(N)=N\\text{의 양의 약수 개수};\\quad d(N)\\le3\\Rightarrow N=1,\\ell,\\ell^2\\quad(\\ell\\text{은 소수})"},{"id":"s2","latex":"\\text{한 수가 }1:\\quad2+3+4+5=14"},{"id":"s3","latex":"\\text{두 수가 모두 }2\\text{ 이상}:\\quad{}_2\\mathrm C_2+{}_3\\mathrm C_2+{}_5\\mathrm C_2=14"},{"id":"s4","latex":"\\#\\{d(N)\\le3\\}=14+14=28"},{"id":"s5","latex":"\\#\\{\\text{합이 짝수}\\}=3+5+{}_2\\mathrm C_2+{}_3\\mathrm C_2+{}_5\\mathrm C_2=22"},{"id":"s6","latex":"P=\\frac{22}{28}=\\frac{11}{14}\\Rightarrow p+q=25"}],"diagram":null,"contentHash":"cbcd99f1971b9f72bd88f6cb440839136a11b0fe6c6018c2a2c3b63e4ccfa415","questionHtml":"<p class=\"hp htall\"><span class=\"heq\">\\(1,\\,2,\\,3,\\,4,\\,5\\)<\/span>의 숫자가 하나씩 적힌 카드가 각각 <span class=\"heq\">\\(1\\)<\/span>장, <span class=\"heq\">\\(2\\)<\/span>장, <span class=\"heq\">\\(3\\)<\/span>장, <span class=\"heq\">\\(4\\)<\/span>장, <span class=\"heq\">\\(5\\)<\/span>장이 있다. 이 <span class=\"heq\">\\(15\\)<\/span>장의 카드 중에서 임의로 <span class=\"heq\">\\(2\\)<\/span>장의 카드를 동시에 선택하는 시행을 한다. 이 시행에서 선택한 <span class=\"heq\">\\(2\\)<\/span>장의 카드에 적힌 두 수의 곱의 모든 양의 약수의 개수가 <span class=\"heq\">\\(3\\)<\/span> 이하일 때, 그 두 수의 합이 짝수일 확률은 <span class=\"heq\">\\(\\dfrac{q}{p}\\)<\/span>이다. <span class=\"heq\">\\(p+q\\)<\/span>의 값을 구하시오.<br>(단, <span class=\"heq\">\\(p\\)<\/span>와 <span class=\"heq\">\\(q\\)<\/span>는 서로소인 자연수이다.) <span class=\"hscore\">[4점]<\/span><\/p><p class=\"hp\"><img class=\"hfig\" src=\"../assets/figures/e44df59e92cd1dabbc3286b6.png\" style=\"width:203px;max-width:100%\"><\/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"069d21fb2c6fcc843b0a9697ecc65710582d7aef6885ac1d8d3503c490ae9867"};</script>
<script>window.HandStudyGuide={"itemId":17145,"sourceHash":"cab58fa1c4eda165f3e82b767a6737e0f211508356a84df202cdb2f0396fd6b1","contentHash":"cbcd99f1971b9f72bd88f6cb440839136a11b0fe6c6018c2a2c3b63e4ccfa415","overview":{"goal":"곱의 약수 개수가 3 이하인 카드 쌍만을 조건부확률의 분모로 삼고, 그중 합이 짝수인 쌍을 세어요.","firstLook":"카드에 적힌 수가 같아도 카드는 여러 장이라 실제 카드 선택 수를 세어야 해요. 먼저 곱이 가능한 형태를 찾고, 그 조건을 만족하는 선택만 분모에 넣어요.","conditions":[{"label":"조건 사건","meaning":"두 수의 곱의 양의 약수 개수가 3 이하인 카드 쌍이에요."},{"label":"구할 사건","meaning":"조건 사건 안에서 두 수의 합이 짝수인 카드 쌍이에요."}]},"chapters":[{"id":"c1","label":"가능한 곱의 모양을 좁혀요","stepIds":["s1"],"question":"양의 약수가 3개 이하인 곱은 어떤 모양이어야 할까요?","hint":"약수가 1개인 수, 2개인 수, 3개인 수를 차례로 떠올려요.","explanation":"양의 약수가 1개인 수는 1, 2개인 수는 소수, 3개인 수는 소수의 제곱이에요. 따라서 두 수의 곱은 \\(1\\), 소수, 또는 소수의 제곱이어야 해요. 카드의 수가 1부터 5이므로 가능한 값의 조합은 한 수가 1인 경우와 \\((2,2),(3,3),(5,5)\\)뿐이에요. \\((1,4)\\)는 곱 4라서 가능하지만, 이것은 한 수가 1인 경우에 이미 들어가요.","check":{"prompt":"\\((2,3)\\)을 제외하는 이유는 무엇인가요?","answer":"곱 6의 양의 약수는 1,2,3,6의 4개라서 조건을 만족하지 않아요."}},{"id":"c2","label":"조건부확률의 분모를 세어요","stepIds":["s2","s3","s4"],"question":"가능한 카드 쌍 28가지는 어떻게 나뉠까요?","hint":"숫자 1 카드와 다른 카드를 고르는 경우, 같은 소수 카드 두 장을 고르는 경우를 따로 세어요.","explanation":"숫자 1 카드는 1장뿐이에요. 이 카드와 숫자 2,3,4,5 카드를 한 장씩 고르는 방법은 \\(2+3+4+5=14\\)가지예요.\n\n두 수가 모두 2 이상이면 가능한 것은 같은 소수끼리인 \\((2,2),(3,3),(5,5)\\)예요. 실제 카드 수가 각각 2장, 3장, 5장이므로 \\({}_2\\mathrm C_2+{}_3\\mathrm C_2+{}_5\\mathrm C_2=1+3+10=14\\)가지예요. 따라서 조건 사건의 경우의 수는 \\(14+14=28\\)이고, 이것이 조건부확률의 분모예요.","check":{"prompt":"숫자 4 카드가 4장인데 \\((4,4)\\)를 세지 않는 이유는 무엇인가요?","answer":"곱 16의 양의 약수는 1,2,4,8,16의 5개라서 조건 사건에 들어가지 않아요."}},{"id":"c3","label":"합이 짝수인 경우를 분자에 넣어요","stepIds":["s5","s6"],"question":"28가지 중 합이 짝수인 선택은 왜 22가지일까요?","hint":"한 수가 1인 경우에는 다른 수도 홀수여야 하고, 같은 소수 두 장은 합이 항상 짝수예요.","explanation":"숫자 1과 함께 골라 합이 짝수가 되려면 다른 수가 홀수여야 하므로 숫자 3 또는 5 카드를 골라요. 방법은 \\(3+5=8\\)가지예요. 같은 소수 두 장을 고른 경우에는 합이 항상 짝수이므로 앞에서 센 \\(1+3+10=14\\)가지가 모두 들어가요. 분자는 \\(8+14=22\\)예요.\n\n따라서 조건부확률은 \\(22/28=11/14\\)이고, \\(p=14,q=11\\)이므로 \\(p+q=25\\)예요.","check":{"prompt":"분자를 전체 15장 중 두 장을 고르는 수로 나누면 안 되는 이유는 무엇인가요?","answer":"곱의 약수 개수가 3 이하라는 조건이 주어졌으므로, 분모는 그 조건을 만족하는 28가지여야 해요."}}],"takeaway":["조건부확률에서는 먼저 조건을 만족하는 경우만 세어 분모를 정해요.","같은 숫자가 적힌 카드가 여러 장이면 숫자 조합을 찾은 뒤 실제 카드를 고르는 조합을 곱하거나 더해요.","합의 홀짝은 두 수가 같은 홀짝인지로 판단하되, 먼저 조건 사건 안에 드는지 확인해요."]};</script>
