<script>window.HandStudyRecord={"itemId":17463,"sourceLabel":"2022 평가원 고3 수학기하 6월 29번","adminYear":2022,"grade":3,"month":6,"number":29,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"초점이 $F$인 포물선 $y ^{2} =8x$ 위의 점 중 제$1$사분면에 있는 점 $P$를 지나고 $x$축과 평행한 직선이 포물선 $y ^{2} =8x$의 준선과 만나는 점을 $F '$이라 하자. 점 $F '$을 초점, 점 $P$를 꼭짓점으로 하는 포물선이 포물선 $y ^{2} =8x$와 만나는 점 중 $P$가 아닌 점을 $Q$라 하자. 사각형 $PF ' QF$의 둘레의 길이가 $12$일 때, 삼각형 $P F'Q$의 넓이는 $\\frac{q}{p} \\sqrt{2}$이다. $p+q$의 값을 구하시오. (단, 점 $P$의 $x$좌표는 $2$보다 작고, $p$와 $q$는 서로소인 자연수이다.) [4점]","answer":"23","sourceHash":"f5d5382eee89032c0b4b2c906b2c59aa1164cfd56d448a2cafcc07882a794663","steps":[{"id":"s1","latex":"P=(t,s),\\ F=(2,0),\\ F'=(-2,s),\\quad PF=PF'=t+2"},{"id":"s2","latex":"\\text{둘째 포물선의 준선 }x=2t+2:\\quad QF+QF'=2t+4"},{"id":"s3","latex":"4t+8=12\\Rightarrow t=1,\\ s=2\\sqrt2"},{"id":"s4","latex":"(y-2\\sqrt2)^2=-12(x-1),\\quad y^2=8x\\Rightarrow5y^2-8\\sqrt2y-8=0"},{"id":"s5","latex":"y_P=2\\sqrt2\\Rightarrow y_Q=-2\\sqrt2/5"},{"id":"s6","latex":"[\\triangle PF'Q]=\\tfrac12\\cdot3(2\\sqrt2+2\\sqrt2/5)=18\\sqrt2/5\\Rightarrow p+q=23"}],"diagram":null,"contentHash":"ef2fe433ad21fac196eb11beb0faefa7d2778c08e0bca9ca772bb483b7a4c387","questionHtml":"\u003cp class=\"hp htall\">초점이 \u003cspan class=\"heq\">\\(F\\)\u003c/span>인 포물선 \u003cspan class=\"heq\">\\(y^{2} =8x\\)\u003c/span> 위의 점 중 제\u003cspan class=\"heq\">\\(1\\)\u003c/span>사분면에 있는 점 \u003cspan class=\"heq\">\\(P\\)\u003c/span>를 지나고 \u003cspan class=\"heq\">\\(x\\)\u003c/span>축과 평행한 직선이 포물선 \u003cspan class=\"heq\">\\(y^{2} =8x\\)\u003c/span>의 준선과 만나는 점을 \u003cspan class=\"heq\">\\(F'\\)\u003c/span>이라 하자. 점 \u003cspan class=\"heq\">\\(F'\\)\u003c/span>을 초점, 점 \u003cspan class=\"heq\">\\(P\\)\u003c/span>를 꼭짓점으로 하는 포물선이 포물선 \u003cspan class=\"heq\">\\(y^{2} =8x\\)\u003c/span>와 만나는 점 중 \u003cspan class=\"heq\">\\(P\\)\u003c/span>가 아닌 점을 \u003cspan class=\"heq\">\\(Q\\)\u003c/span>라 하자. 사각형 \u003cspan class=\"heq\">\\(PF' QF\\)\u003c/span>의 둘레의 길이가 \u0
