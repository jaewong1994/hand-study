<script>window.HandStudyGuide={"itemId":17301,"sourceHash":"6b610d1315db053e2602ea3581997fb456f60984e6f3b60dae2fb084a79cd6ec","contentHash":"2db7eea263a7634aba4874eb323de0fedc1ed5a0f14fb91d9b900ef587685221","overview":{"firstLook":"쌍곡선의 초점은 \\(F(6,0),F^\\prime(-6,0)\\)이고 오른쪽 가지에서 \\(AF^\\prime-AF=4\\)예요. 수직이등분선 위의 \\(F^\\prime\\)은 \\(F^\\prime A=F^\\prime F=12\\)를 뜻하므로 \\(AF=8\\), 중점 M에서 \\(AM=MF=4\\)예요.","goal":"수직이등분선 조건과 쌍곡선 거리차를 이용해 둘레를 소거해요.","conditions":[{"meaning":"수직이등분선 위 점은 양 끝 A,F까지 거리가 같아 \\(F′A=F′F=12\\)예요.","label":"수직이등분선의 뜻을 거리로 써요"},{"meaning":"가까운 교점을 택해 F′-B-M 순서이므로 거리를 뺄 수 있어요.","label":"교점의 순서를 확정해요"}]},"chapters":[{"question":"수직이등분선 조건이 \\(F′A=12\\)를 주는 이유는 무엇인가요?","check":{"prompt":"수직이등분선 조건이 \\(F′A=12\\)를 주는 이유는 무엇인가요?","answer":"수직이등분선 위 점은 양 끝 A,F까지 거리가 같아 \\(F′A=F′F=12\\)예요."},"stepIds":["s1","s2","s3"],"id":"c1","explanation":"쌍곡선의 초점은 \\(F(6,0),F^\\prime(-6,0)\\)이고 오른쪽 가지에서 \\(AF^\\prime-AF=4\\)예요. 수직이등분선 위의 \\(F^\\prime\\)은 \\(F^\\prime A=F^\\prime F=12\\)를 뜻하므로 \\(AF=8\\), 중점 M에서 \\(AM=MF=4\\)예요.","hint":"F′은 A와 F에서 같은 거리에 있고 \\(F′F=12\\)예요.","label":"수직이등분선의 뜻을 거리로 써요"},{"question":"B가 M에 가까운 교점이라는 말은 점 순서를 어떻게 정하나요?","check":{"prompt":"B가 M에 가까운 교점이라는 말은 점 순서를 어떻게 정하나요?","answer":"가까운 교점을 택해 F′-B-M 순서이므로 거리를 뺄 수 있어요."},"stepIds":["s4","s5"],"id":"c2","explanation":"\\(F^\\prime M\\perp AF\\)인 직각삼각형에서 \\(F^\\prime M=\\sqrt{12^2-4^2}=8\\sqrt2\\)예요. B는 M에 가까운 교점이어서 \\(F^\\prime,B,M\\) 순서이고 같은 오른쪽 가지라 \\(BF^\\prime-BF=4\\)예요.","hint":"직선 F′M 위에서 F′,B,M 순서를 그림 없이 적어 보세요.","label":"교점의 순서를 확정해요"},{"question":"둘레에서 BF 관련 항이 어떻게 사라지나요?","check":{"prompt":"둘레에서 BF 관련 항이 어떻게 사라지나요?","answer":"\\(MF+MB+BF=4+MF′-(BF′-BF)=MF′=8\\sqrt{2}\\)예요."},"stepIds":["s6","s7"],"id":"c3","explanation":"둘레는 \\(MF+MB+BF=4+(MF^\\prime-BF^\\prime)+BF=4+MF^\\prime-4=8\\sqrt2\\)예요. 따라서 \\(k^2=128\\)이에요.","hint":"\\(MB=MF′-BF′\\)와 \\(BF′-BF=4\\)를 함께 넣어요.","label":"거리차로 둘레를 소거해요"}],"takeaway":["AF<AF′ 조건으로 거리차 부호를 정했다.","B의 순서를 사용해 MB는 MF′-BF′로 썼다.","문면의 삼각형 표기 OCR 누락은 M,B,F로 해석했다."]};</script>
