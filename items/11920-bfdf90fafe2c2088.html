  <script>window.HandStudyRecord={"itemId":11920,"sourceLabel":"2023 교육청 고1 수학 12월 21번","adminYear":2023,"grade":1,"month":12,"number":21,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"$n(U)=5$인 전체집합 $U$의 세 부분집합 $A$, $B$, $C$에 대하여\n $n \\left(B \\cap C \\right)=2$, $n \\left(B-A \\right)=1$, $n \\left(C-A \\right)=2$\n일 때, \u003c보기>에서 옳은 것만을 있는 대로 고른 것은? [4점]\n\u003c보 기>ㄱ. $n \\left(A \\cap B \\cap C \\right) != 0$ ㄴ. $n \\left(A \\cap B \\cap C \\right)=2$이면 $n \\left(C \\right)=4$이다.ㄷ. $n \\left(A \\right) \\times n \\left(B \\right) \\times n \\left(C \\right)$의 최댓값과 최솟값의 합은 $42$이다.\n① ㄱ ② ㄱ, ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ\n단답형","answer":"⑤","sourceHash":"dda668754ae9245497a0502e14ebf81978d24d83dc89ce5a24d340c0f6e50b8e","steps":[{"id":"s1","latex":"u=n(A\\cap B\\cap C),\\quad(B\\cap C)-A\\subset B-A\\Rightarrow u\\ge1"},{"id":"s2","latex":"n(B\\cap C)=2\\Rightarrow u\\in\\{1,2\\}"},{"id":"s3","latex":"u=2:\\quad(B-A)\\cap(C-A)=\\varnothing\\Rightarrow n(A)=2,\\ n(B)=3,\\ n(C)=4"},{"id":"s4","latex":"u=1:\\quad B\\cap C=\\{p,q\\},\\ p\\in A,\\ q\\notin A"},{"id":"s5","latex":"B-A=\\{q\\},\\quad C-A=\\{q,r\\}"},{"id":"s6","latex":"\\text{남은 두 원소의 위치}:\\quad\\varnothing,\\ A,\\ A\\cap B,\\ A\\cap C"},{"id":"s7","latex":"\\min n(A)n(B)n(C)=1\\cdot2\\cdot3=6"},{"id":"s8","latex":"\\max n(A)n(B)n(C)=3\\cdot4\\cdot3=36\\quad\\text{또는}\\quad3\\cdot3\\cdot4=36"},{"id":"s9","latex":"\\min n(A)n(B)n(C)+\\max n(A)n(B)n(C)=6+36=42"}],"diagram":null,"contentHash":"6b1e98f5c8e41bb30b0f17698e59197d839e266057cbf9beac48bbd050f32da1","questionHtml":"\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(n(U)=5\\)\u003c/span>인 전체집합 \u003cspan class=\"heq\">\\(U\\)\u003c/span>의 세 부분집합 \u003cspan class=\"heq\">\\(A\\)\u003c/span>, \u003cspan class=\"heq\">\\(B\\)\u003c/span>, \u003cspan class=\"heq\">\\(C\\)\u003c/span>에 대하여\u003c/p>\u003cp class=\"hp\">&emsp;\u003cspan class=\"heq\">\\(n \\left(B \\cap C \\right)=2\\)\u003c/span>, \u003cspan class=\"heq\">\\(n \\lef
