<script>window.HandStudyRecord={"itemId":17197,"sourceLabel":"2021 평가원 고3 수학기하 9월 21번","adminYear":2021,"grade":3,"month":9,"number":21,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"$a>1$인 실수 $a$에 대하여 $y$$= -x+4$가 두 곡선\n $y$$=a ^{x-1}$, $y$$=\\log_{a} \\, \\left( x-1 \\right)$\n과 만나는 점을 각각 $A,\\,B$라 하고, 곡선 $y$$=a ^{x-1}$이 $y$축과 만나는 점을 $C$라 하자. ${\\overline{ AB}}$$=2 \\sqrt{2}$일 때, 삼각형 $A B C$의 넓이는 $S$이다. $50 \\times S$의 값을 구하시오. [4점]","answer":"192","sourceHash":"c214bd28b570e0a47057c4e3baa6e5b1ddfbbe55b4b263c63140e1c2ec7565c1","steps":[{"id":"s1","latex":"y=a^{x-1}\\text{와 }y=\\log_a(x-1)\\text{는 }y=x-1\\text{ 대칭}"},{"id":"s2","latex":"y=-x+4\\perp y=x-1,\\quad M_{AB}=(\\frac52,\\frac32)"},{"id":"s3","latex":"AB=2\\sqrt2\\Rightarrow A=(\\frac32,\\frac52),\\ B=(\\frac72,\\frac12)"},{"id":"s4","latex":"a^{1/2}=\\frac52\\Rightarrow a=\\frac{25}4"},{"id":"s5","latex":"C=(0,a^{-1})=(0,\\frac4{25})"},{"id":"s6","latex":"d(C,x+y-4=0)=\\frac{96}{25\\sqrt2}"},{"id":"s7","latex":"S=\\frac12\\cdot2\\sqrt2\\cdot\\frac{96}{25\\sqrt2}=\\frac{96}{25}"},{"id":"s8","latex":"50S=192"}],"diagram":null,"contentHash":"391bf9cae385b535090f32d789014afe99511bcea7bd5a226711ab0e6cddcde3","questionHtml":"\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(a\\gt 1\\)\u003c/span>인 실수 \u003cspan class=\"heq\">\\(a\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(y\\)\u003c/span>\u003cspan class=\"heq\">\\(= -x+4\\)\u003c/span>가 두 곡선\u003c/p>\u003cp class=\"hp\">&emsp;&emsp;\u003cspan class=\"heq\">\\(y\\)\u003c/span>\u003cspan class=\"heq\">\\(=a^{x-1}\\)\u003c/span>, \u003cspan class=\"heq\">\\(y\\)\u003c/span>\u003cspan class=\"heq\">\\(=\\log_{a} \\, \\left( x-1 \\right)\\)\u003c/span>\u003c/p>\u003cp class=\"hp htall\">과 만나는 점을 각각 \u003cspan class=\"heq\">\\(A,\\,B\\)\u003c/span>라 하고, 곡선 \u003cspan class=\"heq\">\\(y\\)\u003c/span>\u003cspan class=\"heq\">\\(=a^{x-1}\\)\u003c/span>이 \u003cspan class=\"heq\">\\(y\\)\u003c/span>축과 만나는 점을 \u003cspan class=\"heq\">\\(C\\)\u003c/span>라 하자. \u003cspan class=\"heq\">\\({\\overline{AB}}\\)\u003c/span>\u003cspan class=\"heq\">\\(=2 \\sqrt{2}\\)\u003c/span>일 때, 삼각형 \u003cspan class=\"heq\">\\(A B C\\)\u003c/span>의 넓이는 \u003cspan class=\"heq\">\\(S\\)\u003c/span>이다. \u003cspan class=\"heq\">\\(50 \\times S\\)\u003c/span>의 값을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig hfigr\" src=\"../assets/figures/77dc53c213cd0e5d418feb48.png\" style=\"float:right;margin:4px 0 8px 12px;width:335px;max-width:45%\">\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"7dc7165fdfd5162ea374cac733bca735a644bf418769aa1a441c1e5ea3292fdd"};</script>
<script>window.HandStudyGuide={"itemId":17197,"sourceHash":"c214bd28b570e0a47057c4e3baa6e5b1ddfbbe55b4b263c63140e1c2ec7565c1","contentHash":"391bf9cae385b535090f32d789014afe99511bcea7bd5a226711ab0e6cddcde3","overview":{"goal":"대칭인 두 곡선과 직선의 위치 관계로 \\(A,B\\)를 정하고 삼각형의 넓이를 구해요.","firstLook":"두 곡선은 직선 \\(y=x-1\\)에 대하여 대칭이고, \\(y=-x+4\\)는 이 대칭축과 수직이에요. 그래서 두 교점의 중점을 먼저 찾을 수 있어요.","conditions":[{"label":"밑의 범위","meaning":"\\(a>1\\)을 교점 좌표 후보에 직접 넣어 어느 점이 지수함수 위의 \\(A\\)인지 확정해요."},{"label":"선분의 길이","meaning":"\\(AB=2\\sqrt2\\)와 기울기 \\(-1\\)을 함께 쓰면 두 점의 좌표 차가 각각 \\(2\\)예요."}]},"chapters":[{"id":"c1","label":"대칭축에서 중점을 찾아요","stepIds":["s1","s2"],"question":"두 교점 \\(A,B\\)의 중점이 왜 \\(y=x-1\\) 위에 놓일까요?","hint":"한 곡선의 점 \\((x,y)\\)를 직선 \\(y=x-1\\)에 대하여 대칭이동한 좌표를 다른 곡선의 식에 넣어 봐요.","explanation":"직선 \\(y=x-1\\)에 대한 대칭이동은 \\((x,y)\\)를 \\((y+1,x-1)\\)로 보내요. \\(y=a^{x-1}\\) 위의 점에서는 \\(x-1=\\log_a y\\)이므로, 대칭이동한 점 \\((X,Y)=(y+1,x-1)\\)은 \\(Y=\\log_a(X-1)\\)을 만족해요. 따라서 두 곡선은 이 직선에 대하여 대칭이에요.\n\n또 \\(y=-x+4\\)의 기울기는 \\(-1\\), 대칭축의 기울기는 \\(1\\)이어서 두 직선은 수직이에요. 같은 직선 위의 대칭인 두 점 \\(A,B\\)를 잇는 선분은 대칭축이 이등분하므로, 중점은 두 직선의 교점이에요. \\(x-1=-x+4\\)에서 \\(M=(5/2,3/2)\\)예요.","check":{"prompt":"대칭이동한 점 \\((X,Y)=(y+1,x-1)\\)이 로그함수 위에 있음을 보여 주는 식은 무엇인가요?","answer":"\\(X-1=y\\)이고 \\(Y=x-1=\\log_a y=\\log_a(X-1)\\)이에요."}},{"id":"c2","label":"길이로 두 교점을 확정해요","stepIds":["s3","s4","s5"],"question":"중점과 \\(AB=2\\sqrt2\\)만으로 \\(A,B\\)의 좌표를 어떻게 정할까요?","hint":"기울기가 \\(-1\\)이므로 중점에서 한 교점까지의 좌표 차를 \\((u,-u)\\)로 둬요.","explanation":"중점에서 한 교점까지의 길이는 \\(\\sqrt2\\)예요. 좌표 차를 \\((u,-u)\\)라 두면 \\(u^2+(-u)^2=2\\)이므로 \\(|u|=1\\)이에요. 따라서 교점 후보는 \\((3/2,5/2)\\), \\((7/2,1/2)\\)예요.\n\n만약 지수함수 위의 점 \\(A\\)가 \\((7/2,1/2)\\)라면 \\(a^{5/2}=1/2\\)인데, \\(a>1\\)이면 왼쪽은 \\(1\\)보다 커서 모순이에요. 그래서 \\(A=(3/2,5/2)\\), \\(B=(7/2,1/2)\\)예요. \\(a^{1/2}=5/2\\)에서 \\(a=25/4\\)이고, \\(C=(0,a^{-1})=(0,4/25)\\)예요.","check":{"prompt":"\\((7/2,1/2)\\)를 \\(A\\)로 둘 수 없는 직접적인 이유는 무엇인가요?","answer":"그 점을 \\(y=a^{x-1}\\)에 넣으면 \\(a^{5/2}=1/2\\)가 되지만 \\(a>1\\)이면 \\(a^{5/2}>1\\)이어서 모순이에요."}},{"id":"c3","label":"밑변과 높이로 넓이를 계산해요","stepIds":["s6","s7","s8"],"question":"점 \\(C\\)에서 직선 \\(AB\\)까지의 거리는 얼마인가요?","hint":"직선 \\(AB\\)를 \\(x+y-4=0\\)으로 쓰고 점과 직선 사이의 거리 공식을 적용해요.","explanation":"직선 \\(AB\\)는 \\(x+y-4=0\\)이고 \\(C=(0,4/25)\\)예요. 따라서 높이는\n\n\\(\\dfrac{|0+4/25-4|}{\\sqrt{1^2+1^2}}=\\dfrac{96}{25\\sqrt2}\\)\n\n예요. 밑변의 길이가 \\(2\\sqrt2\\)이므로 \\(S=(1/2)\\cdot2\\sqrt2\\cdot96/(25\\sqrt2)=96/25\\)예요. 그러므로 \\(50S=192\\)예요.","check":{"prompt":"넓이 계산에서 높이는 어느 선분에 대한 거리인가요?","answer":"밑변을 \\(AB\\)로 잡았으므로 점 \\(C\\)에서 직선 \\(x+y-4=0\\)까지의 수선거리예요."}}],"takeaway":["두 그래프의 대칭은 좌표 변환을 식에 직접 넣어 확인해요.","좌표 후보의 순서는 원래 조건 \\(a>1\\)에 다시 넣어 모순 여부로 정해요.","삼각형 넓이는 밑변이 놓인 직선과 반대쪽 꼭짓점 사이의 거리로 높이를 구해요."]};</script>
