근이 있으려면 }t>0,\\quad0\u003cn-t\u003cn+t\u003c9,\\quad2\\le n-t\u003cn+t"},{"id":"s4","latex":"n>2,\\quad n\u003c9\\ \\Rightarrow\\ n=3,4,5,6,7,8"},{"id":"s5","latex":"\\text{각 }n\\text{에 대해 }0\u003ct\u003cn-2,\\quad0\u003ct\u003c9-n\\text{을 동시에 만족시키는 }t\\text{를 택하면 네 근이 존재한다.}"},{"id":"s6","latex":"3+4+5+6+7+8=\\boxed{33}"}],"track":"공통"};</script>
<script>window.HandStudyGuide={"itemId":24828,"sourceHash":"2567f44fee396365c3b5f31bc2c73c7d76715f95ebcbeb38868d232d25e2f926","contentHash":"6db17f67a7e5ff9d81e9240abc77a455060de1c84470a0e1388106b48dfac7c8","overview":{"goal":"두 조각에서 절댓값 방정식이 각각 두 근을 갖는 공통 높이 \\(t\\)가 존재하도록 \\(n\\)의 범위를 정해요.","firstLook":"각 조각의 안쪽 함수는 자기 정의역에서 계속 증가해요. 먼저 두 안쪽 함수가 실제로 가질 수 있는 값의 범위를 적고, \\(n-t\\)와 \\(n+t\\)가 그 범위 안에 드는지 확인해요.","conditions":[{"label":"왼쪽 조각","meaning":"\\(x<0\\)에서 \\(3^{x+2}\\)의 값은 \\(0\\)과 \\(9\\) 사이예요."},{"label":"오른쪽 조각","meaning":"\\(x\\ge0\\)에서 \\(\\log_2(x+4)\\)의 값은 \\(2\\) 이상이에요."},{"label":"최댓값","meaning":"어떤 \\(t\\)에서 네 근이 실제로 생기고, 어느 \\(t\\)에서도 네 개를 넘지 않아야 해요."}]},"chapters":[{"id":"c1","label":"두 조각의 치역과 근 후보를 적어요","stepIds":["s1","s2"],"question":"한 조각에서 방정식의 근이 많아야 두 개인 이유는 무엇일까요?","hint":"\\(|y-n|=t\\)를 \\(y=n-t\\) 또는 \\(y=n+t\\)로 나누고, 안쪽 함수가 증가함을 써요.","explanation":"\\(x<0\\)이면 \\(0<3^{x+2}<9\\)이고, \\(x\\ge0\\)이면 \\(\\log_2(x+4)\\ge2\\)예요. 두 안쪽 함수는 각 구간에서 계속 증가하므로 주어진 함수값 하나에 대응하는 \\(x\\)는 하나뿐이에요. \\(t>0\\)에서 절댓값 방정식은 안쪽 값이 \\(n-t\\) 또는 \\(n+t\\)인 두 갈래뿐이므로, 각 조각에서 근은 많아야 두 개이고 전체에서는 많아야 네 개예요.","check":{"prompt":"\\(t=0\\)이면 한 조각에서 왜 두 근이 나오지 않나요?","answer":"\\(n-t=n+t=n\\)로 두 후보가 같아져 증가함수의 한 함수값에 대응하는 근이 하나뿐이기 때문이에요."}},{"id":"c2","label":"네 후보가 모두 치역 안에 들게 해요","stepIds":["s3","s4"],"question":"두 조각에서 모두 두 근을 얻으려면 가장 강한 아래 경계와 위 경계는 무엇인가요?","hint":"두 후보 중 작은 값은 \\(n-t\\), 큰 값은 \\(n+t\\)예요.","explanation":"네 근을 얻으려면 \\(t>0\\)이고, 왼쪽 조각에서는 \\(0<n-t<n+t<9\\), 오른쪽 조각에서는 \\(2\\le n-t<n+t\\)여야 해요. 두 조건을 합치면 핵심은 \\(2\\le n-t\\)와 \\(n+t<9\\)예요. 양의 \\(t\\)가 존재하려면 \\(n>2\\)이면서 \\(n<9\\)여야 하므로 자연수 \\(n\\)은 \\(3,4,5,6,7,8\\)이에요.","check":{"prompt":"\\(n=2\\)와 \\(n=9\\)에서는 왜 양의 \\(t\\)를 고를 수 없나요?","answer":"\\(n=2\\)이면 \\(2\\le n-t\\)가 \\(t\\le0\\)을 강제하고, \\(n=9\\)이면 \\(n+t<9\\)가 \\(t<0\\)을 강제해요."}},{"id":"c3","label":"범위 안의 모든 자연수에서 네 근을 실현해요","stepIds":["s5","s6"],"question":"\\(2<n<9\\)이 필요조건에 그치지 않고 실제로 네 근을 만들 수 있는 이유는 무엇일까요?","hint":"\\(n-2\\)와 \\(9-n\\) 중 작은 양수보다 더 작은 \\(t\\)를 골라요.","explanation":"\\(n=3,\\ldots,8\\)이면 \\(n-2>0\\), \\(9-n>0\\)이에요. 이 여섯 자연수에는 \\(t=1/2\\)을 공통으로 고를 수 있고, 실제로 \\(0<t<n-2\\), \\(0<t<9-n\\)을 모두 만족해요. 그러면 \\(n-t>2\\)이고 \\(n+t<9\\)라서 두 후보가 두 조각의 치역에 모두 들어가며, 증가성 때문에 서로 다른 네 \\(x\\)가 실제로 생겨요. 전체 근 수는 처음부터 네 개를 넘을 수 없었으므로 \\(g(t)\\)의 최댓값은 정확히 \\(4\\)예요. 합은 \\(3+4+5+6+7+8=33\\)이에요.","check":{"prompt":"\\(n=8\\)에서 네 근을 만드는 \\(t\\)의 예를 하나 들어 보세요.","answer":"\\(0<t<1\\)이면 되므로 예를 들어 \\(t=1/2\\)를 고르면 \\(n-t=15/2\\), \\(n+t=17/2\\)가 두 치역에 모두 들어가요."}}],"takeaway":["절댓값 방정식은 안쪽 값이 중심에서 같은 거리만큼 떨어진 두 후보로 나눠요.","조각마다 안쪽 함수의 치역과 증가성을 먼저 확인하면 근의 개수를 정확히 셀 수 있어요.","최댓값 문제에서는 상한뿐 아니라 그 개수를 만드는 매개변수가 실제로 존재함도 보여야 해요."]};</script>
