<script>window.HandStudyRecord={"adminYear":2021,"answer":"9","contentHash":"a4165964f996e8579a8e89a2a6e588509c9f8ff0a46bcb446d2abc8b8c3a2276","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24783,"month":11,"number":22,"points":4,"preview":false,"questionHtml":"\u003cp>최고차항의 계수가 \u003cspan class=\"heq\">\\(\\frac{1}{2}\\)\u003c/span>인 삼차함수 \u003cspan class=\"heq\">\\(f \\left( x \\right)\\)\u003c/span>와 실수 \u003cspan class=\"heq\">\\(t\\)\u003c/span>에 대하여 방정식 \u003cspan class=\"heq\">\\(f&#x27; \\left( x \\right)\\)\u003c/span>\u003cspan class=\"heq\">\\(=0\\)\u003c/span>이 닫힌구간 \u003cspan class=\"heq\">\\(\\left[ \\,t,\\,t+2\\, \\right]\\)\u003c/span>에서 갖는 실근의 개수를 \u003cspan class=\"heq\">\\(g \\left( t \\right)\\)\u003c/span>라 할 때, 함수 \u003cspan class=\"heq\">\\(g \\left( t \\right)\\)\u003c/span>는 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox hcond\">\u003cp class=\"hcondr\">(가) 모든 실수 \u003cspan class=\"heq\">\\(a\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(\\lim _{t \\to a+} {} g \\left( t \\right) + \\lim _{t \\to a-} {} g \\left( t \\right) \\leq 2\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hcondr\">(나) \u003cspan class=\"heq\">\\(g \\left( f \\left( 1 \\right) \\right)\\)\u003c/span>\u003cspan class=\"heq\">\\(=g \\left( f \\left( 4 \\right) \\right)\\)\u003c/span>\u003cspan class=\"heq\">\\(=2\\)\u003c/span>, \u003cspan class=\"heq\">\\(g \\left( f \\left( 0 \\right) \\right)\\)\u003c/span>\u003cspan class=\"heq\">\\(=1\\)\u003c/span>\u003c/p>\u003c/div>\u003cp>\u003cspan class=\"heq\">\\(f \\left( 5 \\right)\\)\u003c/span>의 값을 구하시오. [4점]\u003c/p>","questionText":"최고차항의 계수가 $\\frac{1}{2}$인 삼차함수 $f \\left( x \\right)$와 실수 $t$에 대하여 방정식 $f\\,' \\left( x \\right)$$=0$이 닫힌구간 $\\left[ \\,t,\\,t+2\\, \\right]$에서 갖는 실근의 개수를 $g \\left( t \\right)$라 할 때, 함수 $g \\left( t \\right)$는 다음 조건을 만족시킨다.\n(가) 모든 실수 $a$에 대하여 $\\lim _{t -> a+} {} g \\left( t \\right) + \\lim _{t -> a-} {} g \\left( t \\right) \\leq 2$이다.(나) $g \\left( f \\left( 1 \\right) \\right)$$=g \\left( f \\left( 4 \\right) \\right)$$=2$, $g \\left( f \\left( 0 \\right) \\right)$$=1$\n$f \\left( 5 \\right)$의 값을 구하시오. [4점]","sourceHash":"0b8292527283c60c9e50af0e7e56855202094fdc0ef259c7152b20fb958e85fe","sourceKind":"csat","sourceLabel":"2021년 시행 수능 · 2022학년도 · 공통 · 22번","steps":[{"id":"s1","latex":"f\\prime(x)=0\\text{의 서로 다른 실근을 }\\alpha\u003c\\beta\\text{라 하자},\\quad\\beta-\\alpha\\le2"},{"id":"s2","latex":"\\beta-\\alpha\u003c2\\text{이면 }\\beta-2\u003ca\u003c\\alpha\\text{에서 }g(a^-)+g(a^+)=4\\quad\\text{모순}"},{"id":"s3","latex":"\\beta=\\alpha+2,\\quad g(t)=2\\ \\Leftrightarrow\\ t=\\alpha"},{"id":"s4","latex":"f(1)=f(4)=\\alpha,\\quad\\alpha-2\\le f(0)\\le\\alpha+2,\\quad f(0)\\ne\\alpha"},{"id":"s5","latex":"f(x)-\\alpha=\\frac12(x-1)(x-4)(x-c)"},{"id":"s6","latex":"f\\prime(x)=\\frac32x^2-(c+5)x+\\frac{5c+4}{2}"},{"id":"s7","latex":"\\beta-\\alpha=2\\quad\\Rightarrow\\quad(c+5)^2-3(5c+4)=9\\quad\\Rightarrow\\quad(c-1)(c-4)=0"},{"id":"s8","latex":"2\\alpha+2=\\frac{2(c+5)}3\\quad\\Rightarrow\\quad\\begin{array}{c|c|c}c&\\alpha&f(0)\\\\\\hline1&1&-1\\\\4&2&-6\\end{array}"},{"id":"s9","latex":"c=4:\\ f(0)\u003c\\alpha-2\\text{로 제외}\\quad\\Rightarrow\\quad c=1"},{"id":"s10","latex":"f(x)=\\frac12(x-1)^2(x-4)+1\\quad\\Rightarrow\\quad f(5)=9"}],"track":"공통"};</script>
<script>window.HandStudyGuide={"itemId":24783,"sourceHash":"0b8292527283c60c9e50af0e7e56855202094fdc0ef259c7152b20fb958e85fe","contentHash":"a4165964f996e8579a8e89a2a6e588509c9f8ff0a46bcb446d2abc8b8c3a2276","overview":{"goal":"길이 2인 구간에 들어오는 도함수의 두 근을 추적해 삼차함수를 정하고 \\(f(5)\\)를 구해요.","firstLook":"\\(g(t)=2\\)인 값이 있으므로 \\(f'(x)=0\\)은 서로 다른 두 근을 가져요. 조건 (가)는 그 두 근 사이의 거리가 정확히 \\(2\\)임을 강제해요.","conditions":[{"label":"(가)","meaning":"어떤 점의 양쪽에서 \\(g\\)가 계속 \\(2\\)가 되는 열린 구간이 생길 수 없어요."},{"label":"(나)의 두 값","meaning":"\\(g(f(1))=g(f(4))=2\\)이므로 \\(f(1)\\)과 \\(f(4)\\)는 두 근을 모두 담는 구간의 같은 시작점이에요."},{"label":"(나)의 한 값","meaning":"\\(g(f(0))=1\\)이므로 \\(f(0)\\)에서 시작하는 길이 2의 구간에는 두 근 중 하나만 들어가요."}]},"chapters":[{"id":"c1","label":"두 근의 거리를 정확히 정해요","stepIds":["s1","s2","s3","s4"],"question":"도함수의 두 근 사이 거리가 왜 \\(2\\)보다 작을 수 없고, \\(g(t)=2\\)인 \\(t\\)는 왜 하나뿐일까요?","hint":"길이 2인 닫힌구간이 두 근을 여유 있게 담으면 시작점을 조금 움직여도 근의 개수가 바뀌지 않아요.","explanation":"\\(f'(x)=0\\)의 서로 다른 두 근을 \\(\\alpha<\\beta\\)라 해요. \\(g(t)=2\\)인 값이 있으므로 두 근을 길이 2인 구간에 함께 담을 수 있어 \\(\\beta-\\alpha\\le2\\)예요. 만약 \\(\\beta-\\alpha<2\\)라면 \\(\\beta-2<a<\\alpha\\)인 \\(a\\)를 잡을 수 있어요. 이때 \\(a\\)의 왼쪽과 오른쪽에서 시작점을 조금 움직여도 두 근이 모두 구간 안에 남으므로 양쪽 극한이 각각 \\(2\\)이고 합이 \\(4\\)가 돼 조건 (가)에 어긋나요.\n\n따라서 \\(\\beta-\\alpha=2\\)예요. 길이가 정확히 2인 닫힌구간에 \\(\\alpha\\)와 \\(\\beta=\\alpha+2\\)를 모두 넣으려면 시작점은 \\(t=\\alpha\\)뿐이에요. 즉 \\(g(t)=2\\)일 필요충분조건은 \\(t=\\alpha\\)예요. 그래서 \\(f(1)=f(4)=\\alpha\\)이고, \\(g(f(0))=1\\)에서 \\(\\alpha-2\\le f(0)\\le\\alpha+2\\)이면서 \\(f(0)\ne\\alpha\\)를 얻어요.","check":{"prompt":"\\(t=\\alpha-2\\) 또는 \\(t=\\alpha+2\\)에서는 왜 \\(g(t)=1\\)인가요?","answer":"\\([\\alpha-2,\\alpha]\\)에는 첫 근 \\(\\alpha\\)만, \\([\\alpha+2,\\alpha+4]\\)에는 둘째 근 \\(\\beta=\\alpha+2\\)만 들어가기 때문이에요."}},{"id":"c2","label":"함수의 세 번째 근을 후보로 좁혀요","stepIds":["s5","s6","s7","s8"],"question":"\\(f(1)=f(4)=\\alpha\\)와 도함수 두 근의 거리로 세 번째 근 \\(c\\)를 어떻게 정할까요?","hint":"\\(f(x)-\\alpha\\)를 인수분해한 뒤, 이차식 \\(f'(x)=0\\)의 두 근 사이 거리가 2라는 조건을 판별식으로 옮겨요.","explanation":"\\(f(1)=f(4)=\\alpha\\)이고 최고차항 계수가 \\(1/2\\)이므로 \\(f(x)-\\alpha=\\frac12(x-1)(x-4)(x-c)\\)로 둘 수 있어요. 미분하면\n\n\\(f'(x)=\\frac32x^2-(c+5)x+\\frac{5c+4}{2}\\)\n\n예요. 이 이차방정식의 판별식을 \\(D\\)라 하면 두 근의 차는 \\(2\\sqrt D/3\\)이에요. 그 차가 \\(2\\)이므로 \\(D=9\\), 곧 \\((c+5)^2-3(5c+4)=9\\)예요. 정리하면 \\((c-1)(c-4)=0\\)이어서 \\(c=1\\) 또는 \\(c=4\\)예요.\n\n한편 도함수 두 근의 합은 \\(2(c+5)/3\\)이고 두 근은 \\(\\alpha,\\alpha+2\\)이므로 \\(2\\alpha+2=2(c+5)/3\\)이에요. 따라서 \\(c=1\\)이면 \\(\\alpha=1,f(0)=-1\\), \\(c=4\\)이면 \\(\\alpha=2,f(0)=-6\\)이에요.","check":{"prompt":"이차방정식의 두 근 차가 \\(2\\sqrt D/3\\)이 되는 이유는 무엇인가요?","answer":"최고차항 계수가 \\(3/2\\)이므로 두 근의 차는 \\(\\sqrt D/(3/2)=2\\sqrt D/3\\)이기 때문이에요."}},{"id":"c3","label":"한 근만 들어가는 조건으로 결정해요","stepIds":["s9","s10"],"question":"두 후보 중 \\(c=4\\)가 제외되는 정확한 부등식은 무엇인가요?","hint":"\\(g(f(0))=1\\)에서 얻은 \\(\\alpha-2\\le f(0)\\le\\alpha+2\\)에 각 후보의 값을 넣어요.","explanation":"\\(c=4\\)이면 \\(\\alpha=2\\)인데 \\(f(0)=-6\\)이에요. 필요한 범위는 \\(0\\le f(0)\\le4\\)이므로 범위에서 벗어나요. 따라서 \\(c=1\\), \\(\\alpha=1\\)만 남아요. 이때 \\(f(0)=-1\\)은 \\(\\alpha-2=-1\\)과 같아서 길이 2인 구간에 \\(\\alpha\\) 하나만 포함하므로 원래 조건도 만족해요.\n\n따라서 \\(f(x)=\\frac12(x-1)^2(x-4)+1\\)이고, \\(x=5\\)를 넣으면 \\(f(5)=\\frac12\\cdot16\\cdot1+1=9\\)예요.","check":{"prompt":"\\(c=1\\)에서 \\(f(0)=\\alpha-2\\)처럼 경계에 놓여도 허용되는 이유는 무엇인가요?","answer":"구간이 닫힌구간이라 \\([f(0),f(0)+2]=[-1,1]\\)에 근 \\(\\alpha=1\\)이 포함되고, 다른 근 \\(3\\)은 포함되지 않아 근이 정확히 하나이기 때문이에요."}}],"takeaway":["움직이는 닫힌구간에서 근의 개수를 셀 때에는 근 사이 거리와 구간 길이를 먼저 비교해요.","양쪽 극한 조건은 시작점을 조금 움직여도 같은 근들이 남는 구간을 막는 데 쓸 수 있어요.","후보를 구한 뒤에는 근 개수 조건의 끝점 포함 여부까지 원래 닫힌구간에 다시 넣어 확인해요."]};</script>
