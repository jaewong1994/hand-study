<script>window.HandStudyGuide={"itemId":17721,"sourceHash":"7e8a77a7dad6331401552162c03ffca6a9f06c6015566edd0303626dca630229","contentHash":"135bc0fcd8c6e38c8a8bd22999bee2350d23a35c6f222a5f151f04a3a24d801a","overview":{"goal":"연속인 \\(g\\)가 그래프 \\(f\\)와 수평선 \\(y=a\\) 중 하나를 따라야 한다는 조건으로 모양을 정하고, 전체 넓이 1에서 \\(a\\)를 구해 확률을 계산해요.","firstLook":"\\(g(x)\\)는 매 점에서 \\(f(x)\\) 또는 \\(a\\)예요. 연속성을 유지하며 둘 사이를 바꿀 수 있는 곳은 \\(f(x)=a\\)인 교점뿐이에요.","conditions":[{"label":"곱 조건","meaning":"각 \\(x\\)에서 \\(g(x)=f(x)\\) 또는 \\(g(x)=a\\)예요."},{"label":"양끝 확률","meaning":"양끝 단위구간의 넓이는 \\(f\\)보다 작아야 해요."},{"label":"밀도 정규화","meaning":"\\(g\\) 아래 전체 넓이는 1이어야 해요."}]},"chapters":[{"id":"c1","label":"연속성을 이용해 따라갈 그래프를 정해요","stepIds":["s1","s2"],"question":"\\(g\\)가 \\(f\\)와 수평선 사이를 아무 데서나 바꿀 수 없는 이유는 무엇인가요?","hint":"바꾸는 점에서 두 함숫값이 같아야 연속이에요.","explanation":"곱이 0이므로 \\(g(x)\\)는 \\(f(x)\\) 또는 \\(a\\)예요. 그림의 첫 삼각형에서 \\(f(x)=a\\)인 점은 \\(x=2a\\), \\(x=2-2a\\)이고 둘째 삼각형에서는 \\(x=2+2a\\), \\(x=4-2a\\)예요. 끝 구간의 확률을 \\(f\\)보다 작게 하려면 왼쪽에서는 \\(x=2a\\)까지 \\(f\\)를 따른 뒤 \\(a\\)로 바뀌고, 오른쪽에서는 \\(x=4-2a\\)부터 다시 \\(f\\)를 따라야 해요. 가운데 골에서 \\(g\\)가 다시 \\(f\\)로 바뀐다면 모든 구간에서 \\(g\\le f\\)이고 양끝의 넓이 부등식 때문에 일부 구간에서는 엄격히 작아요. 그러면 \\(g\\) 아래 전체 넓이가 \\(f\\)의 전체 넓이 \\(1\\)보다 작아져 확률밀도함수가 될 수 없어요. 따라서 \\(g=f\\)는 \\([0,2a]\\), \\([4-2a,4]\\)이고 그 사이에서는 계속 \\(g=a\\)예요. 이 모양이 가능하려면 \\(0<a<1/2\\)예요.","check":{"prompt":"왼쪽 끝에서 처음부터 \\(g=a\\)를 따르면 왜 조건 (가)에 맞지 않나요?","answer":"\\(x=0\\) 근처에서 \\(f(x)=x/2<a\\)이므로 \\(g\\)의 넓이가 오히려 더 커지기 때문이에요."}},{"id":"c2","label":"전체 넓이 1로 높이를 정해요","stepIds":["s3","s4"],"question":"양끝의 작은 삼각형 넓이는 각각 왜 \\(a^2\\)인가요?","hint":"밑변은 \\(2a\\), 높이는 \\(a\\)예요.","explanation":"양끝에서 \\(g=f\\)인 부분은 밑변 \\(2a\\), 높이 \\(a\\)인 삼각형이므로 각각 넓이가 \\(a^2\\)예요. 가운데 직사각형은 폭 \\(4-4a\\), 높이 \\(a\\)예요. 밀도 전체 넓이가 1이므로 \\(a^2+(4-4a)a+a^2=1\\), 즉 \\(2a^2-4a+1=0\\)이에요. 근은 \\(a=(2\\pm\\sqrt2)/2\\)인데 \\(0<a<1/2\\)이므로 \\(a=(2-\\sqrt2)/2\\)예요.","check":{"prompt":"큰 근을 제외하는 데 사용하는 그래프 조건은 무엇인가요?","answer":"수평선이 봉우리 높이 \\(1/2\\)보다 낮아야 네 교점과 주어진 조각 모양이 생기므로 \\(a<1/2\\)를 사용해요."}},{"id":"c3","label":"확률 구간이 수평 부분 안에서 끝남을 확인해요","stepIds":["s5","s6"],"question":"\\(0\\)부터 \\(5a\\)까지의 넓이를 왜 \\(4a^2\\)로 계산할까요?","hint":"처음 삼각형 뒤에 길이 \\(3a\\)인 직사각형이 이어져요.","explanation":"\\(a>0\\)이므로 \\(2a<5a\\)이고, \\(a<1/2\\)이므로 \\(5a<4-2a\\)예요. 따라서 \\(x=5a\\)는 \\(g=a\\)인 가운데 수평 부분 안에 있어요. \\(0\\)부터 \\(2a\\)까지 삼각형 넓이 \\(a^2\\), \\(2a\\)부터 \\(5a\\)까지 폭 \\(3a\\), 높이 \\(a\\)인 직사각형 넓이 \\(3a^2\\)를 더해 확률은 \\(4a^2\\)예요. \\(2a^2-4a+1=0\\)에서 \\(4a^2=8a-2=6-4\\sqrt2\\)이므로 \\(p=6,q=4\\), 답은 \\(24\\)예요.","check":{"prompt":"\\(5a\\)가 \\(g=a\\)인 가운데 구간에 들어감을 어떤 두 부등식으로 확인하나요?","answer":"\\(2a<5a\\)와 \\(5a<4-2a\\)를 확인해요. 첫째는 \\(a>0\\), 둘째는 \\(a<1/2\\)에서 \\(7a<7/2<4\\)이므로 성립해요."}}],"takeaway":["연속함수가 두 그래프 중 하나만 따라야 하면 두 그래프의 교점에서만 갈아탈 수 있어요.","확률밀도함수는 전체 넓이가 1이라는 조건으로 남은 높이를 정해요.","부분확률을 구하기 전에 적분 끝점이 어느 조각에 놓이는지 먼저 확인해요."]};</script>
