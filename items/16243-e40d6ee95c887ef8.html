<script>window.HandStudyRecord={"itemId":16243,"sourceLabel":"2019 교육청 고3 수리가형 3월 21번","adminYear":2019,"grade":3,"month":3,"number":21,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"함수 $f(x)\\,$의 도함수가 $f' (x)=xe ^{-x ^{2}} \\,$이다. 모든 실수 $x\\,$에 대하여 두 함수 $f(x)$, $g(x)\\,$가 다음 조건을 만족시킬 때, \u003c보기>에서 옳은 것만을 있는 대로 고른 것은? [4점]\n(가) $g(x)= \\int _{1} ^{x} {f'(t)(x+1-t)dt}$ (나) $f(x)=g ' (x)-f' (x)$\n\u003c 보 기 > ㄱ. $g' (1)= \\frac{1}{e}$ ㄴ. $f(1)=g(1)$ ㄷ. 어떤 양수 $x\\,$에 대하여 $g(x)\u003cf(x)\\,$이다.\n① ㄱ ② ㄱ, ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ\n단답형","answer":"②","sourceHash":"d3ada0f7a73a4328da90234b2119cc75e4966f53df274ee509c771fa72f23929","steps":[{"id":"s1","latex":"g'(x)=\\int_1^xf'(t)dt+f'(x)"},{"id":"s2","latex":"g'(1)=f'(1)=\\dfrac1e"},{"id":"s3","latex":"f(x)=g'(x)-f'(x)=\\int_1^xf'(t)dt"},{"id":"s4","latex":"f(1)=g(1)=0"},{"id":"s5","latex":"h(x)=g(x)-f(x)\\Rightarrow h'(x)=f(x),\\quad h''(x)=xe^{-x^2}"},{"id":"s6","latex":"x>0\\Rightarrow h\\text{의 최솟값}=h(1)=0"},{"id":"s7","latex":"g(x)\\ge f(x)\\ (x>0)\\Rightarrow\\text{첫째와 둘째만 참}"}],"diagram":null,"contentHash":"f9de47f6c0f5ae55be1dd9e9ade17f067d03e5527f80bbe12b5f7a5dbf680273","questionHtml":"\u003cp class=\"hp\">함수 \u003cspan class=\"heq\">\\(f(x)\\,\\)\u003c/span>의 도함수가 \u003cspan class=\"heq\">\\(f' (x)=xe^{-x^{2}} \\,\\)\u003c/span>이다. 모든 실수 \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>에 대하여 두 함수 \u003cspan class=\"heq\">\\(f(x)\\)\u003c/span>, \u003cspan class=\"heq\">\\(g(x)\\,\\)\u003c/span>가 다음 조건을 만족시킬 때, &lt;보기&gt;에서 옳은 것만을 있는 대로 고른 것은? \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) \u003cspan class=\"heq\">\\(g(x)= \\int_{1}^{x} {f'(t)(x+1-t)dt}\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">(나) \u003cspan class=\"heq\">\\(f(x)=g' (x)-f' (x)\\)\u003c/span>\u003c/p>\u003c/div>\u003c/p>\u003cp class=\"hp htall\">\u003cdiv class=\"hbox\">\u003cp class=\"hp\">\u003cdiv class=\"hbox\">\u003cp class=\"hp\">&lt; 보 기 &gt;\u003c/p>\u003c/div>\u003c/p>\u003cp class=\"hp\">&lt; 보 기 &gt;\u003c/p>\u003cp class=\"hp htall\">\u003cdiv class=\"hbox\">\u003cp class=\"hp htall\">ㄱ. \u003cspan class=\"heq\">\\(g' (1)= \\dfrac{1}{e}\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">ㄴ. \u003cspan class=\"heq\">\\(f(1)=g(1)\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">ㄷ. 어떤 양수 \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(g(x)\\lt f(x)\\,\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003c/p>\u003cp class=\"hp htall\">ㄱ. \u003cspan class=\"heq\">\\(g' (1)= \\dfrac{1}{e}\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">ㄴ. \u003cspan class=\"heq\">\\(f(1)=g(1)\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">ㄷ. 어떤 양수 \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(g(x)\\lt f(x)\\,\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003c/p>\u003cp class=\"hp\">① ㄱ&emsp;② ㄱ, ㄴ&emsp;③ ㄱ, ㄷ\u003c/p>\u003cp class=\"hp\">④ ㄴ, ㄷ&emsp;⑤ ㄱ, ㄴ, ㄷ\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"e40d6ee95c887ef811954a60161a55977a32f0b52eb92ff5ff0dbc8410515aa5"};</script>
<script>window.HandStudyGuide={"itemId":16243,"sourceHash":"d3ada0f7a73a4328da90234b2119cc75e4966f53df274ee509c771fa72f23929","contentHash":"f9de47f6c0f5ae55be1dd9e9ade17f067d03e5527f80bbe12b5f7a5dbf680273","overview":{"goal":"매개변수가 들어간 적분을 미분하고 \\(g-f\\)의 증감을 조사해 보기의 참·거짓을 판정해요.","firstLook":"적분 안의 \\(x+1-t\\)에는 바깥 변수 x가 들어 있으므로 적분의 윗끝에서 생기는 항과 적분 내부를 미분한 항을 모두 써요.","conditions":[{"label":"적분 정의","meaning":"\\(g\\)를 미분할 때 윗끝값 항과 \\(x\\)에 대한 편미분 항이 함께 나와요."},{"label":"함수 관계","meaning":"\\(f=g'-f'\\)가 \\(f\\)의 값을 정해요."}]},"chapters":[{"id":"c1","label":"g를 미분해 첫 두 보기를 확인해요","stepIds":["s1","s2","s3","s4"],"question":"\\(g'(x)\\)에 왜 \\(f'(x)\\)가 따로 더해질까요?","hint":"윗끝 \\(t=x\\)에서 \\(x+1-t=1\\)이에요.","explanation":"윗끝에서 생기는 값은 \\(f'(x)(x+1-x)=f'(x)\\)이고, 적분 안을 \\(x\\)로 미분하면 \\(f'(t)\\)가 남아요. 따라서 \\(g'(x)=f'(x)+\\int_1^x f'(t)dt\\)예요. \\(x=1\\)에서 적분은 \\(0\\)이므로 \\(g'(1)=f'(1)=1/e\\)라 ㄱ은 참이에요. (나)를 넣으면 \\(f(x)=\\int_1^x f'(t)dt\\)이고 \\(x=1\\)에서 \\(f(1)=0\\)이에요. 정의에서 \\(g(1)=0\\)이므로 ㄴ도 참이에요.","check":{"prompt":"\\(x=1\\)에서 \\(g(1)\\)이 0인 이유는 무엇인가요?","answer":"적분의 아래끝과 위끝이 모두 1이기 때문이에요."}},{"id":"c2","label":"차이의 도함수 부호를 찾아요","stepIds":["s5"],"question":"\\(h=g-f\\)의 가장 작은 값을 찾으려면 무엇을 보면 될까요?","hint":"\\(h'=f\\)이고 f는 f'를 적분해 직접 쓸 수 있어요.","explanation":"\\(h=g-f\\)라 하면 \\(h'=g'-f'=f\\), \\(h''=f'=xe^{-x^2}\\)예요. 앞에서 \\(f(x)=\\int_1^x te^{-t^2}dt=\\frac12(e^{-1}-e^{-x^2})\\)를 얻어요. 양수 \\(x\\)에서 \\(0<x<1\\)이면 \\(e^{-x^2}>e^{-1}\\)라 \\(f(x)<0\\), \\(x>1\\)이면 \\(f(x)>0\\)이에요. 따라서 \\(h\\)는 \\(1\\)까지 감소하고 그 뒤 증가해 \\(x=1\\)에서 가장 작아요.","check":{"prompt":"\\(h'\\)의 부호가 바뀌는 양수는 어디인가요?","answer":"\\(f(1)=0\\)이고 \\(1\\)의 왼쪽에서 음수, 오른쪽에서 양수이므로 \\(x=1\\)이에요."}},{"id":"c3","label":"차이가 음수가 되는지 판정해요","stepIds":["s6","s7"],"question":"어떤 양수에서 \\(g<f\\)가 될 수 있을까요?","hint":"\\(h(1)=g(1)-f(1)\\)을 계산해요.","explanation":"h의 최솟값은 \\(h(1)=0-0=0\\)이에요. 따라서 모든 양수 x에서 \\(g(x)-f(x)=h(x)\\ge0\\)이고 \\(g(x)<f(x)\\)인 양수는 없어요. ㄷ은 거짓이므로 ㄱ, ㄴ만 옳아 정답은 ②예요.","check":{"prompt":"ㄷ을 반박하는 전체 부등식은 무엇인가요?","answer":"모든 \\(x>0\\)에서 \\(g(x)-f(x)\\ge0\\)이에요."}}],"takeaway":["매개변수가 들어간 정적분을 미분할 때 윗끝 항과 적분 내부의 변화를 모두 계산해요.","두 함수의 대소는 차이를 새 함수로 두고 도함수 부호로 판단해요.","극솟값이 0이면 함수가 음수가 되는 점은 없어요."]};</script>
