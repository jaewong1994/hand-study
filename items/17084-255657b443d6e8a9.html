<script>window.HandStudyRecord={"itemId":17084,"sourceLabel":"2021 교육청 고3 수학미적분 3월 22번","adminYear":2021,"grade":3,"month":3,"number":22,"track":"미적분","points":4,"scoreStatus":"confirmed_4_direct","questionText":"양수 $a\\,$와 일차함수 $f(x)\\,$에 대하여 실수 전체의 집합에서 정의된 함수 $g(x)= \\int _{0} ^{x} {\\left( t ^{2} -4 \\right) \\left\\{ \\left| f ( t ) \\right| -a \\right\\}} \\,dt\\,$\n가 다음 조건을 만족시킨다. \n(가) 함수 $g(x)\\,$는 극값을 갖지 않는다.(나) $g(2)=5$\n$g(0)-g ( -4 )\\,$의 값을 구하시오. [4점]\n 사각형입니다. 2021년 3월 고3 모의고사 문제지제 2 교시 수학 영역(미적분) 5 지선다형","answer":"16","sourceHash":"75916d6bfc71eab813c86dac1442f0e3cadc0abf644286ed1f705c4bd010b195","steps":[{"id":"s1","latex":"g'(x)=(x^2-4)(|f(x)|-a)"},{"id":"s2","latex":"\\text{부호 변화 상쇄}\\Rightarrow |f(x)|=a\\text{의 근은 }\\pm2"},{"id":"s3","latex":"f\\text{가 일차}\\Rightarrow |f(x)|=\\frac a2|x|"},{"id":"s4","latex":"g(2)=\\frac a2\\int_0^2(t+2)(t-2)^2dt=\\frac{10a}{3}=5"},{"id":"s5","latex":"a=\\frac32"},{"id":"s6","latex":"g(0)-g(-4)=\\frac34\\int_{-4}^0(t^2-4)(-t-2)dt=16"}],"diagram":null,"contentHash":"1befd016090688db45ec78e5a245d22e13f18994fb86a868397ef36d47c58d9a","questionHtml":"\u003cp class=\"hp\">양수 \u003cspan class=\"heq\">\\(a\\,\\)\u003c/span>와 일차함수 \u003cspan class=\"heq\">\\(f(x)\\,\\)\u003c/span>에 대하여 실수 전체의 집합에서 정의된 함수\u003cbr>&emsp;\u003cspan class=\"heq\">\\(g(x)= \\int_{0}^{x} {\\left( t^{2} -4 \\right) \\left\\{ \\left| f ( t ) \\right| -a \\right\\}} \\,dt\\,\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">가 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) 함수 \u003cspan class=\"heq\">\\(g(x)\\,\\)\u003c/span>는 극값을 갖지 않는다.\u003c/p>\u003cp class=\"hp\">(나) \u003cspan class=\"heq\">\\(g(2)=5\\)\u003c/span>\u003c/p>\u003c/div>\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(g(0)-g ( -4 )\\,\\)\u003c/span>의 값을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cspan class=\"hpic\">[도형 1]\u003c/span>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">2021년 3월 고3 모의고사 문제지\u003c/p>\u003cp clas <script>window.HandStudyGuide={"itemId":17084,"sourceHash":"75916d6bfc71eab813c86dac1442f0e3cadc0abf644286ed1f705c4bd010b195","contentHash":"1befd016090688db45ec78e5a245d22e13f18994fb86a868397ef36d47c58d9a","overview":{"goal":"g가 극값을 갖지 않도록 도함수의 두 인수가 같은 곳에서 부호를 바꾸게 하고 적분값을 계산해요.","firstLook":"\\(x^2-4\\)는 \\(-2,2\\)에서 부호가 바뀌어요. g' 전체의 부호가 바뀌지 않으려면 \\(|f|-a\\)도 같은 두 점에서 부호가 바뀌어야 해요.","conditions":[{"label":"극값 없음","meaning":"\\(g'\\)가 0이 되는 점을 지나도 전체 부호가 바뀌면 안 돼요."},{"label":"일차함수","meaning":"\\(|f(x)|=a\\)의 두 해의 중점은 f의 영점이에요."}]},"chapters":[{"id":"c1","label":"두 영점을 맞춰 일차함수를 정해요","stepIds":["s1","s2","s3"],"question":"왜 \\(|f(x)|=a\\)의 해가 꼭 \\(-2,2\\)여야 할까요?","hint":"\\(x^2-4\\)가 각 점에서 부호를 바꾸는 것을 상쇄해야 해요.","explanation":"\\(g'(x)=(x^2-4)(|f(x)|-a)\\)예요. 첫 인수는 -2와 2에서 각각 부호가 바뀌므로 둘째 인수도 같은 점에서 부호가 바뀌어야 g'의 부호가 유지돼요. 따라서 \\(|f(-2)|=|f(2)|=a\\)예요. f가 상수가 아닌 일차함수이고 두 점의 함숫값이 크기는 같고 부호는 반대이므로 영점은 중점 0이에요. 기울기의 절댓값은 a/2여서 \\(|f(x)|=(a/2)|x|\\)예요.","check":{"prompt":"두 해의 중점이 0이라는 사실은 f에 대해 무엇을 알려 주나요?","answer":"일차함수 f의 영점이 0이라 \\(f(x)\\)가 x의 상수배예요."}},{"id":"c2","label":"주어진 적분값으로 a를 구해요","stepIds":["s4","s5"],"question":"구간 \\([0,2]\\)에서 절댓값은 어떻게 없어질까요?","hint":"이 구간에서는 \\(|x|=x\\)예요.","explanation":"\\(0\\le t\\le2\\)에서 \\(|f(t)|-a=(a/2)t-a=(a/2)(t-2)\\)예요. 따라서 \\(g(2)=(a/2)\\int_0^2(t^2-4)(t-2)dt=(a/2)\\int_0^2(t+2)(t-2)^2dt\\)예요. 다항식을 전개해 적분하면 적분값이 \\(20/3\\)이므로 \\(g(2)=10a/3=5\\), 따라서 \\(a=3/2\\)예요.","check":{"prompt":"\\(10a/3=5\\)에서 a는 얼마인가요?","answer":"\\(a=3/2\\)예요."}},{"id":"c3","label":"음의 구간 적분을 실제로 계산해요","stepIds":["s6"],"question":"\\([-4,0]\\)에서 \\(|f(t)|-a\\)는 무엇인가요?","hint":"이 구간에서는 \\(|t|=-t\\)예요.","explanation":"\\(a=3/2\\)이고 t가 음수이므로 \\(|f(t)|-a=(3/4)(-t)-3/2=(3/4)(-t-2)\\)예요. 따라서 \\(g(0)-g(-4)=\\frac34\\int_{-4}^0(t^2-4)(-t-2)dt\\)예요. \\((t^2-4)(-t-2)=-(t-2)(t+2)^2\\)를 전개해 적분하면 값이 \\(64/3\\)이고, \\(3/4\\)를 곱하면 \\(16\\)이에요.","check":{"prompt":"마지막 정적분과 바깥 계수는 각각 무엇인가요?","answer":"정적분은 \\(64/3\\), 바깥 계수는 \\(3/4\\)라 곱은 \\(16\\)이에요."}}],"takeaway":["극값이 없다는 조건은 도함수의 두 인수가 같은 점에서 부호를 바꾸도록 만들 수 있어요.","일차함수 절댓값의 두 같은 높이 해는 영점을 중심으로 대칭이에요.","절댓값은 적분 구간의 부호에 따라 나누어 없애요."]};</script>
