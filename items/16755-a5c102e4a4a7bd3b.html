<script>window.HandStudyGuide={"itemId":16755,"sourceHash":"eb2bc503460c88fef934343f56ffa32075712772aa6f3927e89c8545b9a2962d","contentHash":"61d4f9838d1b14d942ff3363707e8d7c2e559614cf998f9bde146081d91f231b","overview":{"goal":"도함수의 부호로 그래프의 오르내림을 정하고, 수평선과의 교점 수가 양쪽에서 2만큼 달라지는 높이를 찾습니다.","firstLook":"교점 개수는 극댓값과 극솟값을 지날 때 바뀝니다. 적분을 전부 하기 전에 도함수의 영점과 부호부터 읽습니다.","conditions":[{"label":"적분으로 정의한 함수","meaning":"적분 안의 식을 이용해 도함수와 증가·감소를 정합니다."},{"label":"교점 수의 좌우 차","meaning":"높이가 극값을 통과할 때 교점이 몇 개 생기거나 사라지는지 비교합니다."}]},"chapters":[{"id":"c1","label":"도함수의 부호를 나눕니다","stepIds":["s1"],"question":"그래프가 방향을 바꾸는 x의 값은 어디인가요?","hint":"구간별 f(x)를 x-1과 곱하고 부호를 확인하세요.","explanation":"\\(x<1\\)에서는 \\(g'(x)=3x^2(1-x)\\)이므로 \\(x=0\\)의 양쪽에서 모두 양수입니다. 따라서 \\(x=0\\)은 극값점이 아닙니다. \\(x\\ge1\\)에서는 \\(g'(x)=2(x-1)(x-3)\\)이므로 \\(1<x<3\\)에서 감소하고 \\(x>3\\)에서 증가합니다. 결국 \\(x=1\\)은 극댓값점, \\(x=3\\)은 극솟값점입니다.","check":{"prompt":"\\(x=0\\)에서 도함수가 0인데도 극값이 아닌 이유는 무엇인가요?","answer":"\\(x=0\\)의 왼쪽과 오른쪽에서 도함수가 모두 양수여서 증가 방향이 바뀌지 않기 때문입니다."}},{"id":"c2","label":"두 극값을 직접 계산합니다","stepIds":["s2"],"question":"수평선의 교점 수가 바뀌는 두 높이는 얼마인가요?","hint":"0에서 1까지와 1에서 3까지 적분을 나누세요.","explanation":"\\(g(1)=\\int_0^1 3t^2(1-t)\\,dt=[t^3-\\frac34t^4]_0^1=\\frac14\\)입니다. 또 \\(g(3)=g(1)+\\int_1^3 2(t-1)(t-3)\\,dt\\)이고, \\(2(t-1)(t-3)=2t^2-8t+6\\)이므로 \\(g(3)=\\frac14+[\\frac23t^3-4t^2+6t]_1^3=\\frac14-\\frac83=-\\frac{29}{12}\\)입니다.","check":{"prompt":"g(3)가 g(1)보다 작은 까닭은 무엇인가요?","answer":"1과 3 사이에서 2(t-1)(t-3)가 음수여서 그 구간의 적분값이 -8/3이기 때문입니다."}},{"id":"c3","label":"높이별 교점 수를 셉니다","stepIds":["s3","s4"],"question":"왜 두 극값 높이에서 좌우 교점 수의 차가 2인가요?","hint":"그래프는 증가, 감소, 증가의 세 갈래로 나뉩니다.","explanation":"그래프는 \\(x\\le1\\)에서 \\(1/4\\)까지 증가하고, \\(1\\le x\\le3\\)에서 \\(-29/12\\)까지 감소한 뒤 다시 증가합니다. 따라서 \\(t<-29/12\\)와 \\(t>1/4\\)에서는 교점이 1개이고, 두 극값 사이에서는 3개입니다. 극값 높이 자체에서는 접점을 중복하지 않아 2개입니다. 좌우 극한의 차가 2인 높이는 \\(a=-29/12, 1/4\\)입니다.","check":{"prompt":"극값 높이에서 교점 수를 3개로 세면 안 되는 이유는 무엇인가요?","answer":"증가 갈래와 감소 갈래가 만나는 극값점은 같은 한 점이므로 중복해서 세지 않아야 합니다."}},{"id":"c4","label":"절댓값의 합을 마무리합니다","stepIds":["s5"],"question":"두 높이의 절댓값을 더하면 얼마인가요?","hint":"1/4을 분모 12로 바꾸세요.","explanation":"\\(S=|-29/12|+|1/4|=29/12+3/12=8/3\\)이므로 \\(30S=80\\)입니다.","check":{"prompt":"음수인 높이 -29/12은 합에 어떻게 들어가나요?","answer":"절댓값을 취하므로 양수 29/12로 들어갑니다."}}],"takeaway":["교점 수는 도함수의 부호가 바뀌는 극값 높이에서 달라집니다.","극값 높이의 접점은 서로 다른 교점을 셀 때 한 번만 셉니다."]};</script>
