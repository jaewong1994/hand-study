  <script>window.HandStudyRecord={"itemId":17390,"sourceLabel":"2022 교육청 고3 수학미적분 7월 22번","adminYear":2022,"grade":3,"month":7,"number":22,"track":"미적분","points":4,"scoreStatus":"confirmed_4_direct","questionText":"삼차함수 $f \\left( x \\right) \\,$에 대하여 곡선 $y=f \\left( x \\right)$ 위의 점 $\\left( 0,\\,0 \\right) \\,$에서의 접선의 방정식을 $y=g \\left( x \\right) \\,$라 할 때, 함수 $h \\left( x \\right) \\,$를\n $h \\left( x \\right) = \\left| f \\left( x \\right) \\right| +g \\left( x \\right) \\,$\n라 하자. 함수 $h \\left( x \\right) \\,$가 다음 조건을 만족시킨다.\n(가) 곡선 $y=h \\left( x \\right)$ 위의 점 $\\left( k,\\,0 \\right) \\,$$\\left( k != 0 \\right) \\,$에서의 접선의 방정식은 $y=0\\,$이다.(나) 방정식 $h \\left( x \\right) =0\\,$의 실근 중에서 가장 큰 값은 $12\\,$이다.\n$h \\left( 3 \\right)= - \\frac{9}{2} \\,$일 때, $k \\times \\left\\{ h \\left( 6 \\right) -h \\left( 11 \\right) \\right\\} \\,$의 값을 구하시오. (단, $k\\,$는 상수이다.) [4점]\n 사각형입니다. 2022년 7월 고3 모의고사 문제지제 2 교시 수학 영역(미적분) \n5 지선다형","answer":"121","sourceHash":"7e6fe4fb63aa39b17a0f1b50eb00bbc96f45d3b1ec20e3ed07f1209c15db5b2e","steps":[{"id":"s1","latex":"f(x)=px^3+qx^2+mx,\\quad g(x)=mx"},{"id":"s2","latex":"f\\ge0:\\ h=x(px^2+qx+2m),\\quad f\u003c0:\\ h=-x^2(px+q)"},{"id":"s3","latex":"h(k)=h'(k)=0,\\ k\\ne0\\Rightarrow f(k)>0"},{"id":"s4","latex":"px^2+qx+2m=p(x-k)^2"},{"id":"s5","latex":"q=-2pk,\\quad m=\\frac{pk^2}{2}"},{"id":"s6","latex":"f(x)=px\\left(x^2-2kx+\\frac{k^2}{2}\\right)"},{"id":"s7","latex":"h=0\\text{의 후보}=0,k,2k"},{"id":"s8","latex":"f(k)=-\\frac{pk^3}{2}>0\\Rightarrow pk\u003c0"},{"id":"s9","latex":"\\max\\{x:h(x)=0\\}=12\\Rightarrow k>0,\\ 2k=12"},{"id":"s10","latex":"k=6,\\quad h(3)=27p=-\\frac92\\Rightarrow p=-\\frac16"},{"id":"s11","latex":"h(6)=0,\\quad h(11)=-\\frac{121}{6}"},{"id":"s12","latex":"k\\{h(6)-h(11)\\}=6\\cdot\\frac{121}{6}=\\boxed{121}"}],"diagram":null,"contentHash":"371cb8439fcb29442792e73448fbd00b974747c103c32f314aa3aefcdc535738","questionHtml":"\u003cp class=\"hp\">삼차함수 \u003cspan class=\"heq\">\\(f \\left( x \\right) \\,\\)\u003c/span>에 대하여 곡선 \u003cspan class=\"heq\">\\(y=f \\left( x \\right)\\)\u003c/span> 위의 점 \u003cspan class=\"heq\">\\(\\left( 0,\\,0 \\right) \\,\\)\u003c/span>에서의 접선의 방정식을 \u003cspan class=\"heq\">\\(y=g \\left( x \\right) \\,\\)\u003c/span>라 할 때, 함수 \u003cspan class=\"heq\">\\(h \\left( x \\right) \\,\\)\u003c/span>를\u003c/p>\u003cp class=\"hp\">&emsp;&emsp;\u003cspan class=\"heq\">\\(h \\left( x \\right) = \\left| f \\left( x \\right) \\right| +g \\left( x \\right) \\,\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">라 하자. 함수 \u003cspan class=\"heq\">\\(h \\left( x \\right) \\,\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cp class=\"hp\">\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) 곡선 \u003cspan class=\"heq\">\\(y=h \\left( x \\right)\\)\u003c/span> 위의 점 \u003cspan class=\"heq\">\\(\\left( k,\\,0 \\right) \\,\\)\u003c/span>\u003cspan class=\"heq\">\\(\\left( k  \\neq  0 \\right) \\,\\)\u003c/span>에서의 \u003cbr>접선의 방정식은 \u003cspan class=\"heq\">\\(y=0\\,\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp\">(나) 방정식 \u003cspan class=\"heq\">\\(h \\left( x \\right) =0\\,\\)\u003c/span>의 실근 중에서 가장 큰 값은 \u003cspan class=\"heq\">\\(12\\,\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003c/p>\u003cp class=\"hp htall\">\u003cspan class=\"heq\">\\(h \\left( 3 \\right)= - \\dfrac{9}{2} \\,\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(k \\times \\left\\{ h \\left( 6 \\right) -h \\left( 11 \\right) \\right\\} \\,\\)\u003c/span>의 값을 구하시오.\u003cbr>(단, \u003cspan class=\"heq\">\\(k\\,\\)\u003c/span>는 상수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"edb0cc3bbc675a11683c1fd9b9cc8b2a4e809aa36ed606db963e95f60afac7ba"};</script>
