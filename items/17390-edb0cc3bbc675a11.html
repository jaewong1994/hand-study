<script>window.HandStudyRecord={"itemId":17390,"sourceLabel":"2022 교육청 고3 수학미적분 7월 22번","adminYear":2022,"grade":3,"month":7,"number":22,"track":"미적분","points":4,"scoreStatus":"confirmed_4_direct","questionText":"삼차함수 $f \\left( x \\right) \\,$에 대하여 곡선 $y=f \\left( x \\right)$ 위의 점 $\\left( 0,\\,0 \\right) \\,$에서의 접선의 방정식을 $y=g \\left( x \\right) \\,$라 할 때, 함수 $h \\left( x \\right) \\,$를\n $h \\left( x \\right) = \\left| f \\left( x \\right) \\right| +g \\left( x \\right) \\,$\n라 하자. 함수 $h \\left( x \\right) \\,$가 다음 조건을 만족시킨다.\n(가) 곡선 $y=h \\left( x \\right)$ 위의 점 $\\left( k,\\,0 \\right) \\,$$\\left( k != 0 \\right) \\,$에서의 접선의 방정식은 $y=0\\,$이다.(나) 방정식 $h \\left( x \\right) =0\\,$의 실근 중에서 가장 큰 값은 $12\\,$이다.\n$h \\left( 3 \\right)= - \\frac{9}{2} \\,$일 때, $k \\times \\left\\{ h \\left( 6 \\right) -h \\left( 11 \\right) \\right\\} \\,$의 값을 구하시오. (단, $k\\,$는 상수이다.) [4점]\n 사각형입니다. 2022년 7월 고3 모의고사 문제지제 2 교시 수학 영역(미적분) \n5 지선다형","answer":"121","sourceHash":"7e6fe4fb63aa39b17a0f1b50eb00bbc96f45d3b1ec20e3ed07f1209c15db5b2e","steps":[{"id":"s1","latex":"f(x)=px^3+qx^2+mx,\\quad g(x)=mx"},{"id":"s2","latex":"f\\ge0:\\ h=x(px^2+qx+2m),\\quad f<0:\\ h=-x^2(px+q)"},{"id":"s3","latex":"h(k)=h'(k)=0,\\ k\\ne0\\Rightarrow f(k)>0"},{"id":"s4","latex":"px^2+qx+2m=p(x-k)^2"},{"id":"s5","latex":"q=-2pk,\\quad m=\\frac{pk^2}{2}"},{"id":"s6","latex":"f(x)=px\\left(x^2-2kx+\\frac{k^2}{2}\\right)"},{"id":"s7","latex":"h=0\\text{의 후보}=0,k,2k"},{"id":"s8","latex":"f(k)=-\\frac{pk^3}{2}>0\\Rightarrow pk<0"},{"id":"s9","latex":"h(x)=0\\text{의 실근 중 가장 큰 값이 }12\\Rightarrow k>0,\\ 2k=12"},{"id":"s10","latex":"k=6,\\quad h(3)=27p=-\\frac92\\Rightarrow p=-\\frac16"},{"id":"s11","latex":"h(6)=0,\\quad h(11)=-\\frac{121}{6}"},{"id":"s12","latex":"k\\{h(6)-h(11)\\}=6\\cdot\\frac{121}{6}=\\boxed{121}"}],"diagram":null,"contentHash":"13abfd26c5b2f49cf521796ca847b372af61abc2a172d7c3b030203eb4c231d5","questionHtml":"<p class=\"hp\">삼차함수 <span class=\"heq\">\\(f \\left( x \\right) \\,\\)<\/span>에 대하여 곡선 <script>window.HandStudyGuide={"itemId":17390,"sourceHash":"7e6fe4fb63aa39b17a0f1b50eb00bbc96f45d3b1ec20e3ed07f1209c15db5b2e","contentHash":"13abfd26c5b2f49cf521796ca847b372af61abc2a172d7c3b030203eb4c231d5","overview":{"goal":"절댓값 안의 f 부호에 따라 h를 나누고, x축이 접선인 점에서 같은 인수가 두 번 곱해진 구조를 찾아요.","firstLook":"원점에서 f의 접선은 \\(g(x)=f'(0)x\\)예요. h는 f의 부호에 따라 서로 다른 다항식으로 바뀌어요.","conditions":[{"label":"x축 접선","meaning":"\\(h(k)=0\\)과 \\(h'(k)=0\\)이 동시에 성립해요."},{"label":"가장 큰 영점","meaning":"h의 모든 영점 후보를 찾은 뒤 가장 큰 값이 12인지 비교해요."}]},"chapters":[{"id":"c1","label":"f의 부호에 따라 h를 써요","stepIds":["s1","s2"],"question":"f가 음수일 때 h에서 일차항이 왜 없어질까요?","hint":"\\(|f|=-f\\)와 \\(g=mx\\)를 더해요.","explanation":"\\(f(x)=px^3+qx^2+mx\\)로 놓으면 원점 접선은 \\(g(x)=mx\\)예요. \\(f(x)\\ge0\\)이면 \\(h=f+g=x(px^2+qx+2m)\\)이고, \\(f(x)<0\\)이면 \\(h=-f+g=-x^2(px+q)\\)예요. 뒤 식에서는 f의 일차항 \\(-mx\\)와 g의 \\(+mx\\)가 없어져요.","check":{"prompt":"두 경우 모두에서 바로 보이는 h의 영점은 무엇인가요?","answer":"두 식 모두 x가 인수라 \\(x=0\\)이에요."}},{"id":"c2","label":"접점 k의 부호와 중근 구조를 정해요","stepIds":["s3","s4","s5","s6"],"question":"접점에서 왜 f(k)>0인 경우를 써야 할까요?","hint":"f<0인 식에서 0이 아닌 영점이 접점이 될 수 있는지 미분까지 확인해요.","explanation":"\\(h(k)=h'(k)=0\\), \\(k\\ne0\\)이에요. f가 음수인 식 \\(-x^2(px+q)\\)에서 0 아닌 영점은 \\(px+q=0\\)인데 이 점의 도함수는 일반적으로 0이 아니어서 x축에 접하지 못해요. 따라서 f(k)>0인 식에서 이차인수 \\(px^2+qx+2m\\)가 k를 같은 인수가 두 번 곱해진 근으로 가져야 해요. 즉 \\(px^2+qx+2m=p(x-k)^2\\)이고, 계수 비교로 \\(q=-2pk,m=pk^2/2\\)예요. 따라서 \\(f(x)=px(x^2-2kx+k^2/2)\\)예요.","check":{"prompt":"접선이 x축이라는 조건이 이차인수에 요구하는 것은 무엇인가요?","answer":"\\(x=k\\)가 함숫값과 도함수를 함께 0으로 만드는 두 번 곱해진 근이어야 해요."}},{"id":"c3","label":"영점 후보를 비교해 k를 정해요","stepIds":["s7","s8","s9","s10"],"question":"h의 영점 후보가 왜 \\(0,k,2k\\)인가요?","hint":"f가 양수인 식의 두 번 근 k와 음수인 식의 일차인수 근을 구해요.","explanation":"양수 쪽 h는 \\(px(x-k)^2\\)라 영점이 0,k예요. 음수 쪽 h는 \\(-x^2(px+q)=-px^2(x-2k)\\)라 추가 후보가 2k예요. 또 \\(f(k)=-pk^3/2>0\\)이므로 \\(pk<0\\)이에요. 가장 큰 영점이 12이려면 k가 양수이고 \\(2k=12\\), 따라서 \\(k=6\\)이에요. \\(h(3)=p\\cdot3(3-6)^2=27p=-9/2\\)에서 \\(p=-1/6\\)이에요.","check":{"prompt":"k가 음수이면 12인 양의 영점을 만들 수 없는 이유는 무엇인가요?","answer":"후보 \\(0,k,2k\\)가 모두 0 이하가 되기 때문이에요."}},{"id":"c4","label":"두 함숫값을 계산해 마무리해요","stepIds":["s11","s12"],"question":"\\(h(11)\\)에는 어느 부호 경우의 식을 써야 할까요?","hint":"구한 p와 k를 f에 넣어 11에서의 부호를 확인해요.","explanation":"\\(k=6\\)에서 \\(h(6)=0\\)이에요. \\(x=11\\)은 \\(2k=12\\)보다 작고 해당 구간에서 \\(f\\)가 음수이므로 \\(h(11)=-px^2(x-2k)\\)를 써요. \\(p=-1/6\\)을 넣으면 \\(h(11)=(1/6)121(-1)=-121/6\\)이에요. 따라서 \\(k\\{h(6)-h(11)\\}=6(121/6)=121\\)이에요.","check":{"prompt":"최종 괄호 안의 값은 얼마인가요?","answer":"\\(0-(-121/6)=121/6\\)이에요."}}],"takeaway":["절댓값이 있는 다항함수는 안쪽 함수의 부호에 따라 식을 나눠요.","수평인 x축이 접선이면 영점이면서 도함수도 0인 구조를 찾아요.","영점 후보를 모두 모은 뒤 부호와 순서를 확인해 가장 큰 영점을 정해요."]};</script>
