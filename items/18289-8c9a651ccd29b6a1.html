<script>window.HandStudyRecord={"itemId":18289,"sourceLabel":"2025 교육청 고3 수학확통 5월 30번","adminYear":2025,"grade":3,"month":5,"number":30,"track":"확통","points":4,"scoreStatus":"confirmed_4_direct","questionText":"$1\\,$부터 $6\\,$까지의 자연수가 하나씩 적혀 있는 $6\\,$개의 전구가 있다. 이 $6\\,$개의 전구는 모두 꺼져 있고, 각 전구는 전원 버튼을 누를 때마다 켜짐과 꺼짐이 전환된다. 이 $6\\,$개의 전구와 한 개의 주사위를 사용하여 다음 시행을 한다.\n주사위를 한 번 던져 나온 눈의 수가 $n\\,$일 때, $n$ 이하의 숫자가 적힌 모든 전구의 전원 버튼을 한 번씩 누른다.\n이 시행을 $5\\,$번 반복할 때, 나오는 눈의 수를 차례로 $a$, $b$, $c$, $d$, $e\\,$라 하자. $5\\,$번째 시행 후 전구가 모두 켜져 있도록 하는 모든 순서쌍 $\\left(a,\\,b,\\,c,\\,d,\\,e \\right)\\,$의 개수를 구하시오. [4점]","answer":"376","sourceHash":"f7f68681d6e033b0120b81b0f75539f7f4a2af1aae15bcdc8dead342ef805278","steps":[{"id":"s1","latex":"m_j=\\#\\{\\text{눈 }j\\},\\quad\\#\\{\\text{전구 }k\\text{ 누름}\\}=\\sum_{j=k}^6m_j\\equiv1\\pmod2"},{"id":"s2","latex":"m_1,\\ldots,m_5\\equiv0\\pmod2,\\quad m_6\\equiv1\\pmod2,\\quad\\sum m_j=5"},{"id":"s3","latex":"m_6=5:\\ 1"},{"id":"s4","latex":"m_6=3:\\ 5\\cdot\\frac{5!}{3!2!}=50"},{"id":"s5","latex":"m_6=1:\\ 5\\cdot\\frac{5!}{4!}+{5\\choose2}\\frac{5!}{2!2!}=325"},{"id":"s6","latex":"1+50+325=376"}],"diagram":null,"contentHash":"2f568f24d497b54b3a72026f0c0bc75d14ab68d6de23c12bbde95a7f453cdb78","questionHtml":"\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>부터 \u003cspan class=\"heq\">\\(6\\,\\)\u003c/span>까지의 자연수가 하나씩 적혀 있는 \u003cspan class=\"heq\">\\(6\\,\\)\u003c/span>개의 전구가 있다. 이 \u003cspan class=\"heq\">\\(6\\,\\)\u003c/span>개의 전구는 모두 꺼져 있고, 각 전구는 전원 버튼을 누를 때마다 켜짐과 꺼짐이 전환된다. 이 \u003cspan class=\"heq\">\\(6\\,\\)\u003c/span>개의 전구와 한 개의 주사위를 사용하여 다음 시행을 한다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">주사위를 한 번 던져 나온 눈의 수가 \u003cspan class=\"heq\">\\(n\\,\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(n\\)\u003c/span> 이하의 숫자가 적힌 모든 전구의 전원 버튼을 한 번씩 누른다.\u003c/p>\u003c/div>\u003cp class=\"hp\">이 시행을 \u003cspan class=\"heq\">\\(5\\,\\)\u003c/span>번 반복할 때, 나오는 눈의 수를 차례로 \u003cspan class=\"heq\">\\(a\\)\u003c/span>, \u003cspan class=\"heq\">\\(b\\)\u003c/span>, \u003cspan class=\"heq\">\\(c\\)\u003c/span>, \u003cspan class=\"heq\">\\(d\\)\u003c/span>, \u003cspan class=\"heq\">\\(e\\,\\)\u003c/span>라 하자. \u003cspan class=\"heq\">\\(5\\,\\)\u003c/span>번째 시행 후 전구가 모두 켜져 있도록 하는 모든 순서쌍 \u003cspan class=\"heq\">\\(\\left(a,\\,b,\\,c,\\,d,\\,e \\right)\\,\\)\u003c/span>의 개수를 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/fde9af7ce9fc434eff6c777a.png\" style=\"width:307px;max-width:100%\">\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"8c9a651ccd29b6a14be2c1f5f1ac78bc58f59f3bf1517493e823eb510380d66c"};</script>
<script>window.HandStudyGuide={"itemId":18289,"sourceHash":"f7f68681d6e033b0120b81b0f75539f7f4a2af1aae15bcdc8dead342ef805278","contentHash":"2f568f24d497b54b3a72026f0c0bc75d14ab68d6de23c12bbde95a7f453cdb78","overview":{"goal":"각 눈이 나온 횟수의 홀짝 조건으로 모든 전구가 켜지는 경우를 바꾸고, 가능한 횟수 분배별 순서를 세어요.","firstLook":"k번 전구는 주사위 눈이 k 이상일 때마다 눌려요. 처음 꺼져 있으므로 다섯 시행 뒤 켜지려면 각 전구의 누른 횟수가 홀수여야 해요.","conditions":[{"label":"누른 횟수","meaning":"눈 \\(j\\)의 출현 횟수를 \\(m_j\\)라 하면 전구 \\(k\\)는 \\(\\sum_{j=k}^6m_j\\)번 눌려요."},{"label":"켜진 상태","meaning":"각 전구의 누른 횟수는 홀수여야 해요."},{"label":"다섯 시행","meaning":"\\(m_1+\\cdots+m_6=5\\)이고 각 실제 주사위 결과의 순서를 구별해요."}]},"chapters":[{"id":"c1","label":"전구 조건을 눈별 횟수의 홀짝으로 바꿔요","stepIds":["s1","s2"],"question":"왜 \\(m_1,\\ldots,m_5\\)는 짝수이고 \\(m_6\\)은 홀수일까요?","hint":"서로 이웃한 두 전구의 누른 횟수 차가 정확히 한 눈의 출현 횟수예요.","explanation":"전구 \\(k\\)의 누른 횟수는 \\(S_k=m_k+\\cdots+m_6\\)이고 모두 홀수여야 해요. \\(S_k-S_{k+1}=m_k\\)는 홀수끼리의 차이므로 \\(k=1,\\ldots,5\\)에서 \\(m_k\\)는 짝수예요. 마지막 전구는 \\(S_6=m_6\\)번 눌리므로 \\(m_6\\)은 홀수예요. 합이 \\(5\\)라 \\(m_6=1,3,5\\)만 가능해요.","check":{"prompt":"\\(m_5\\)가 짝수인 것은 어느 두 전구를 비교하면 알 수 있나요?","answer":"5번과 6번 전구의 누른 횟수를 비교하면 돼요."}},{"id":"c2","label":"6이 다섯 번 또는 세 번 나온 경우를 세어요","stepIds":["s3","s4"],"question":"\\(m_6=5,3\\)일 때 주사위 순서는 몇 개인가요?","hint":"남은 횟수는 1부터5 중 한 눈에 짝수만큼 배분돼요.","explanation":"\\(m_6=5\\)이면 모든 결과가 \\(6\\)이라 \\(1\\)가지예요. \\(m_6=3\\)이면 남은 두 번은 \\(1\\)부터 \\(5\\) 중 같은 눈이 두 번 나와야 해요. 그 눈 선택이 \\(5\\)가지이고, 세 개의 \\(6\\)과 두 개의 선택한 눈을 배열하는 방법은 \\(5!/(3!2!)=10\\)가지라 모두 \\(50\\)가지예요.","check":{"prompt":"\\(m_6=3\\)에서 남은 두 눈이 서로 다를 수 없는 이유는 무엇인가요?","answer":"각 \\(m_1,\\ldots,m_5\\)가 짝수여야 하는데 서로 다르면 두 횟수가 각각 \\(1\\)이 되기 때문이에요."}},{"id":"c3","label":"6이 한 번 나온 두 분배를 세어요","stepIds":["s5"],"question":"\\(m_6=1\\)일 때 남은 네 번의 짝수 분배는 어떤 두 형태인가요?","hint":"4를 짝수들의 합으로 나누어요.","explanation":"남은 네 번은 한 눈이 \\(4\\)번 나오는 형태와 서로 다른 두 눈이 \\(2\\)번씩 나오는 형태뿐이에요. 첫째는 눈 선택 \\(5\\)가지와 배열 \\(5!/(4!1!)=5\\)가지를 곱해 \\(25\\)가지예요.\n\n둘째는 두 눈 선택 \\({}_5\\mathrm C_2=10\\)가지와 배열 \\(5!/(2!2!1!)=30\\)가지를 곱해 \\(300\\)가지예요. 따라서 이 경우는 \\(325\\)가지예요.","check":{"prompt":"두 눈이 2번씩인 경우의 나머지 한 자리는 어떤 눈인가요?","answer":"\\(m_6=1\\)이므로 나머지 한 자리는 눈 \\(6\\)이에요."}},{"id":"c4","label":"서로 다른 세 경우를 더해요","stepIds":["s6"],"question":"전체 순서쌍의 개수는 얼마인가요?","hint":"6의 출현 횟수가 다른 경우들은 겹치지 않아요.","explanation":"세 경우를 더하면 \\(1+50+325=376\\)이에요.","check":{"prompt":"가능한 홀수 m6 값을 모두 조사했나요?","answer":"합이 \\(5\\)이고 \\(m_6\\)이 홀수이므로 \\(1,3,5\\)를 모두 조사했어요."}}],"takeaway":["누를 때마다 상태가 바뀌는 전구는 누른 횟수의 홀짝만 추적해요.","누적 횟수들이 모두 홀수라면 이웃한 누적합의 차로 개별 눈의 횟수 홀짝을 구할 수 있어요.","횟수 분배를 정한 뒤 실제 순서 수는 같은 원소가 있는 순열로 계산해요."]};</script>
