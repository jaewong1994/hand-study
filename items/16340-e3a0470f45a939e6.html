<script>window.HandStudyGuide={"itemId":16340,"sourceHash":"fdf599b0e28ed59126999bfcbad7fce7570acc18c7693c6c84e56a22fb4eea06","contentHash":"3a73e045257af86b8033ae266a44641fb614f4f6f0ac2af7619f286b9ea4f46c","overview":{"goal":"쌍곡선의 초점 성질과 내접원의 접선 길이를 이용해 내심의 좌표를 구해요.","firstLook":"초점 거리는 5이고 두 초점까지 거리의 차는 6이에요. 내접원의 접점에서 같은 꼭짓점에서 그은 두 접선 길이가 같다는 성질을 써요.","conditions":[{"label":"초점","meaning":"\\(F'=(-5,0),F=(5,0)\\)예요."},{"label":"접점","meaning":"내접원이 밑변에 닿는 점을 \\(B\\)라 두어요."},{"label":"내심","meaning":"반지름 3이므로 중심의 높이는 3이에요."}]},"chapters":[{"id":"c1","label":"밑변의 접점을 정해요","stepIds":["s1","s2","s3","s4"],"question":"왜 \\(F'B-BF=PF'-PF\\)일까요?","hint":"각 꼭짓점에서 내접원에 그은 두 접선 길이가 같아요.","explanation":"쌍곡선에서 \\(c=\\sqrt{3^2+4^2}=5\\)이므로 \\(F'=(-5,0),F=(5,0)\\)이고 \\(F'F=10\\)이에요. 제1사분면 가지에서는 \\(PF'-PF=2\\cdot3=6\\)이에요. 내접원의 밑변 접점을 \\(B\\)라 하면 \\(F'B\\)는 \\(F'\\)에서 다른 변에 닿는 접선 길이와 같고 \\(BF\\)도 마찬가지라 \\(F'B-BF=PF'-PF=6\\)이에요. \\(F'B+BF=10\\)과 풀면 \\(F'B=8,BF=2\\), 따라서 \\(B=(3,0)\\)예요.","check":{"prompt":"\\(B\\)의 x좌표는 어떻게 3이 되나요?","answer":"\\(F'\\)의 x좌표 -5에서 오른쪽으로 8만큼 간 점이므로 \\(-5+8=3\\)이에요."}},{"id":"c2","label":"내심 좌표로 거리를 구해요","stepIds":["s5","s6"],"question":"내접원의 중심은 왜 \\(B\\) 바로 위에 있을까요?","hint":"반지름은 접점에서 변에 수직이에요.","explanation":"밑변 \\(F'F\\)는 x축이고 접점이 \\(B=(3,0)\\)이므로 중심 \\(Q\\)는 \\(x=3\\) 위에 있어요. 원이 삼각형 내부인 위쪽에 있고 반지름이 3이므로 \\(Q=(3,3)\\)이에요. 따라서 \\(OQ^2=3^2+3^2=18\\)이에요.","check":{"prompt":"\\(Q=(3,-3)\\)이 아닌 이유는 무엇인가요?","answer":"점 \\(P\\)와 삼각형의 내부가 x축 위쪽에 있으므로 내접원의 중심도 위쪽이에요."}}],"takeaway":["쌍곡선의 두 초점까지 거리의 차와 내접원의 접선 길이를 연결해요.","접점이 정해지면 반지름의 수직 관계로 내심 좌표를 바로 얻을 수 있어요."]};</script>
