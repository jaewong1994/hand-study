<script>window.HandStudyRecord={"adminYear":2021,"answer":"100","contentHash":"c652f375cd1b0f8849076f92338bfe6e1920b21ca6026770d7d0ad237bf2f62f","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24790,"month":11,"number":29,"points":4,"preview":false,"questionHtml":"\u003cp>좌표평면에서 \u003cspan class=\"heq\">\\({\\overline{ OA}}\\)\u003c/span>\u003cspan class=\"heq\">\\(= \\sqrt{2}\\)\u003c/span>, \u003cspan class=\"heq\">\\({\\overline{ OB}}\\)\u003c/span>\u003cspan class=\"heq\">\\(=2 \\sqrt{2}\\)\u003c/span>이고 \u003cspan class=\"heq\">\\(\\cos\\, \\left( \\angle AOB \\right)\\)\u003c/span>\u003cspan class=\"heq\">\\(= \\frac{1}{4}\\)\u003c/span>인 평행사변형 \u003cspan class=\"heq\">\\(O A C B\\)\u003c/span>에 대하여 점 \u003cspan class=\"heq\">\\(P\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox hcond\">\u003cp class=\"hcondr\">(가) \u003cspan class=\"heq\">\\({\\vec{ OP}}\\)\u003c/span>\u003cspan class=\"heq\">\\(=s\\, {\\vec{ OA}} +t\\, {\\vec{ OB}}\\)\u003c/span> (\u003cspan class=\"heq\">\\(0 \\leq s \\leq 1\\)\u003c/span>, \u003cspan class=\"heq\">\\(0 \\leq t \\leq 1\\)\u003c/span>)\u003c/p>\u003cp class=\"hcondr\">(나) \u003cspan class=\"heq\">\\({\\vec{ OP}} \\cdot {\\vec{ OB}} + {\\vec{ BP}} \\cdot {\\vec{ BC}}\\)\u003c/span>\u003cspan class=\"heq\">\\(=2\\)\u003c/span>\u003c/p>\u003c/div>\u003cp>점 \u003cspan class=\"heq\">\\(O\\)\u003c/span>를 중심으로 하고 점 \u003cspan class=\"heq\">\\(A\\)\u003c/span>를 지나는 원 위를 움직이는 점 \u003cspan class=\"heq\">\\(X\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(\\left| \\,3\\, {\\vec{ OP}} - {\\vec{ OX}} \\, \\right|\\)\u003c/span>의 최댓값과 최솟값을 각각 \u003cspan class=\"heq\">\\(M\\)\u003c/span>, \u003cspan class=\"heq\">\\(m\\)\u003c/span>이라 하자. \u003cspan class=\"heq\">\\(M \\times m\\)\u003c/span>\u003cspan class=\"heq\">\\(=a \\sqrt{6} +b\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(a ^{2} +b ^{2}\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(a\\)\u003c/span>와 \u003cspan class=\"heq\">\\(b\\)\u003c/span>는 유리수이다.) [4점]\u003c/p>\u003cfigure>\u003cimg class=\"hfig\" src=\"../assets/csat/24790-a92fa240d4f40ae3.png\" alt=\"2021년 시행 수능 29번 문항 그림 \" style=\"max-width:100%;width:420px\">\u003c/figure>","questionText":"좌표평면에서 ${\\overline{ OA}}$$= \\sqrt{2}$, ${\\overline{ OB}}$$=2 \\sqrt{2}$이고 $\\cos\\, \\left( \\angle AOB \\right)$$= \\frac{1}{4}$인 평행사변형 $O A C B$에 대하여 점 $P$가 다음 조건을 만족시킨다.\n(가) ${\\vec{ OP}}$$=s\\, {\\vec{ OA}} +t\\, {\\vec{ OB}}$ ($0 \\leq s \\leq 1$, $0 \\leq t \\leq 1$)(나) ${\\vec{ OP}} BUL \\leq T {\\vec{ OB}} + {\\vec{ BP}} BUL \\leq T {\\vec{ BC}}$$=2$\n점 $O$를 중심으로 하고 점 $A$를 지나는 원 위를 움직이는 점 $X$에 대하여 $\\left| \\,3\\, {\\vec{ OP}} - {\\vec{ OX}} \\, \\right|$의 최댓값과 최솟값을 각각 $M$, $m$이라 하자. $M \\times m$$=a \\sqrt{6} +b$일 때, $a ^{2} +b ^{2}$의 값을 구하시오. (단, $a$와 $b$는 유리수이다.) [4점]","sourceHash":"ade96e5dabd962995990f27d27307e3eba34b6edecbb5fdf0105449ab6f4d266","sourceKind":"csat","sourceLabel":"2021년 시행 수능 · 2022학년도 · 기하 · 29번","steps":[{"id":"s1","latex":"\\vec u=\\overrightarrow{\\mathrm{OA}},\\quad\\vec v=\\overrightarrow{\\mathrm{OB}},\\quad|\\vec u|^2=2,\\ |\\vec v|^2=8,\\ \\vec u\\cdot\\vec v=1"},{"id":"s2","latex":"\\overrightarrow{\\mathrm{OP}}=s\\vec u+t\\vec v\\quad(0\\le s,t\\le1)"},{"id":"s3","latex":"\\overrightarrow{\\mathrm{OP}}\\cdot\\vec v+(\\overrightarrow{\\mathrm{OP}}-\\vec v)\\cdot\\vec u=2\\quad\\Rightarrow\\quad3s+9t=3"},{"id":"s4","latex":"s=1-3t,\\quad0\\le t\\le\\frac13,\\quad|\\overrightarrow{\\mathrm{OP}}|^2=2s^2+2st+8t^2=20\\left(t-\\frac14\\right)^2+\\frac34"},{"id":"s5","latex":"\\frac{\\sqrt3}{2}\\le|\\overrightarrow{\\mathrm{OP}}|\\le\\sqrt2,\\quad|\\overrightarrow{\\mathrm{OX}}|=\\sqrt2"},{"id":"s6","latex":"M=3\\sqrt2+\\sqrt2=4\\sqrt2,\\quad m=\\frac{3\\sqrt3}{2}-\\sqrt2\\quad\\text{(같은 방향과 반대 방향에서 각각 성립)}"},{"id":"s7","latex":"Mm=6\\sqrt6-8\\quad\\Rightarrow\\quad a^2+b^2=64+36=100"}],"track":"기하"};</script>
<script>window.HandStudyGuide={"itemId":24790,"sourceHash":"ade96e5dabd962995990f27d27307e3eba34b6edecbb5fdf0105449ab6f4d266","contentHash":"c652f375cd1b0f8849076f92338bfe6e1920b21ca6026770d7d0ad237bf2f62f","overview":{"goal":"내적 조건으로 점 \\(P\\)의 자취를 매개변수 하나로 줄이고, 원 위의 점 \\(X\\)와의 거리 범위를 구해요.","firstLook":"\\(\\vec u=\\overrightarrow{OA}\\), \\(\\vec v=\\overrightarrow{OB}\\)로 두면 두 변의 길이와 끼인각에서 \\(\\vec u\\cdot\\vec v=1\\)을 얻어요.","conditions":[{"label":"(가)","meaning":"점 \\(P\\)는 \\(0\\le s\\le1\\), \\(0\\le t\\le1\\)인 평행사변형 안에 있어요."},{"label":"(나)","meaning":"두 내적을 계산하면 \\(s+3t=1\\)이 되어 점 \\(P\\)가 한 선분 위에 놓여요."}]},"chapters":[{"id":"c1","label":"선분 OP의 길이 범위를 구해요","stepIds":["s1","s2","s3","s4","s5"],"question":"선분 \\(OP\\)의 길이의 최솟값과 최댓값은 무엇인가요?","hint":"\\(s=1-3t\\)를 \\(|\\overrightarrow{OP}|^2\\)에 넣고, 꼭짓점과 구간의 양 끝값을 비교해요.","explanation":"\\(|\\vec u|^2=2\\), \\(|\\vec v|^2=8\\), \\(\\vec u\\cdot\\vec v=|\\vec u||\\vec v|\\cos\\angle AOB=1\\)이에요. 조건 (나)는 \\((s\\vec u+t\\vec v)\\cdot\\vec v+(s\\vec u+(t-1)\\vec v)\\cdot\\vec u=2\\)이므로 \\(3s+9t=3\\), 즉 \\(s=1-3t\\)예요. 조건 (가)와 함께 보면 \\(0\\le t\\le1/3\\)이에요. 이제 \\(|\\overrightarrow{OP}|^2=2s^2+2st+8t^2=20(t-1/4)^2+3/4\\)예요. 꼭짓점 \\(t=1/4\\)에서 최솟값 \\(\\sqrt3/2\\)를 얻고, 양 끝 \\(t=0,1/3\\)의 값을 비교하면 각각 \\(\\sqrt2\\), \\(2\\sqrt2/3\\)이므로 최댓값은 \\(\\sqrt2\\)예요.","check":{"prompt":"최솟값은 어느 \\(t\\)에서 실제로 나오나요?","answer":"구간 안의 \\(t=1/4\\)에서 \\(|\\overrightarrow{OP}|^2=3/4\\)이므로 실제로 나와요."}},{"id":"c2","label":"원 위 점까지의 거리 범위를 구해요","stepIds":["s6"],"question":"\\(M\\)과 \\(m\\)은 왜 두 길이의 합과 차로 정해지나요?","hint":"\\(|\\overrightarrow{OX}|=\\sqrt2\\)이고, 점 \\(X\\)를 \\(\\overrightarrow{OP}\\)와 같은 방향 또는 반대 방향에서 잡을 수 있어요.","explanation":"점 \\(X\\)는 중심이 \\(O\\), 반지름이 \\(\\sqrt2\\)인 원 전체를 움직이므로 \\(\\overrightarrow{OX}\\)는 모든 방향을 가질 수 있어요. 가장 멀게 하려면 \\(|\\overrightarrow{OP}|=\\sqrt2\\)일 때 \\(\\overrightarrow{OX}\\)를 \\(\\overrightarrow{OP}\\)와 반대 방향으로 잡아 \\(M=3\\sqrt2+\\sqrt2=4\\sqrt2\\)를 얻어요. 또 \\(3|\\overrightarrow{OP}|\\ge3\\sqrt3/2>\\sqrt2\\)이므로 가장 가까운 거리는 두 길이의 차예요. \\(|\\overrightarrow{OP}|=\\sqrt3/2\\)일 때 같은 방향으로 잡으면 \\(m=3\\sqrt3/2-\\sqrt2\\)이고 실제로 성립해요.","check":{"prompt":"두 극값에서 필요한 방향을 실제로 고를 수 있나요?","answer":"점 \\(X\\)가 원 전체를 움직이므로 \\(\\overrightarrow{OP}\\)와 같은 방향과 반대 방향을 모두 고를 수 있어요."}},{"id":"c3","label":"곱의 계수를 읽어요","stepIds":["s7"],"question":"유리수 \\(a,b\\)는 각각 얼마인가요?","hint":"구한 \\(M\\)과 \\(m\\)을 곱해 \\(a\\sqrt6+b\\)와 비교해요.","explanation":"\\(Mm=4\\sqrt2(3\\sqrt3/2-\\sqrt2)=6\\sqrt6-8\\)이므로 \\(a=6\\), \\(b=-8\\)이에요. 따라서 \\(a^2+b^2=36+64=100\\)이에요.","check":{"prompt":"\\(b^2\\)의 값은 얼마인가요?","answer":"\\((-8)^2=64\\)예요."}}],"takeaway":["내적 조건은 매개변수 사이의 일차관계로 바꿔요.","매개변수 구간의 이차식은 꼭짓점과 양 끝값을 모두 비교해요.","원 위의 점과의 거리의 합과 차가 실제로 성립하는 방향을 확인해요."]};</script>
