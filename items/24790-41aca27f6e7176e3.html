/span>는 유리수이다.) [4점]\u003c/p>\u003cfigure>\u003cimg class=\"hfig\" src=\"../assets/csat/24790-a92fa240d4f40ae3.png\" alt=\"2021년 시행 수능 29번 문항 그림 \" style=\"max-width:100%;width:420px\">\u003c/figure>","questionText":"좌표평면에서 ${\\overline{ OA}}$$= \\sqrt{2}$, ${\\overline{ OB}}$$=2 \\sqrt{2}$이고 $\\cos\\, \\left( \\angle AOB \\right)$$= \\frac{1}{4}$인 평행사변형 $O A C B$에 대하여 점 $P$가 다음 조건을 만족시킨다.\n(가) ${\\vec{ OP}}$$=s\\, {\\vec{ OA}} +t\\, {\\vec{ OB}}$ ($0 \\leq s \\leq 1$, $0 \\leq t \\leq 1$)(나) ${\\vec{ OP}} BUL \\leq T {\\vec{ OB}} + {\\vec{ BP}} BUL \\leq T {\\vec{ BC}}$$=2$\n점 $O$를 중심으로 하고 점 $A$를 지나는 원 위를 움직이는 점 $X$에 대하여 $\\left| \\,3\\, {\\vec{ OP}} - {\\vec{ OX}} \\, \\right|$의 최댓값과 최솟값을 각각 $M$, $m$이라 하자. $M \\times m$$=a \\sqrt{6} +b$일 때, $a ^{2} +b ^{2}$의 값을 구하시오. (단, $a$와 $b$는 유리수이다.) [4점]","sourceHash":"ade96e5dabd962995990f27d27307e3eba34b6edecbb5fdf0105449ab6f4d266","sourceKind":"csat","sourceLabel":"2021년 시행 수능 · 2022학년도 · 기하 · 29번","steps":[{"id":"s1","latex":"\\vec u=\\overrightarrow{\\mathrm{OA}},\\quad\\vec v=\\overrightarrow{\\mathrm{OB}},\\quad|\\vec u|^2=2,\\ |\\vec v|^2=8,\\ \\vec u\\cdot\\vec v=1"},{"id":"s2","latex":"\\overrightarrow{\\mathrm{OP}}=s\\vec u+t\\vec v\\quad(0\\le s,t\\le1)"},{"id":"s3","latex":"\\overrightarrow{\\mathrm{OP}}\\cdot\\vec v+(\\overrightarrow{\\mathrm{OP}}-\\vec v)\\cdot\\vec u=2\\quad\\Rightarrow\\quad3s+9t=3"},{"id":"s4","latex":"s=1-3t,\\quad0\\le t\\le\\frac13,\\quad|\\overrightarrow{\\mathrm{OP}}|^2=2s^2+2st+8t^2=20\\left(t-\\frac14\\right)^2+\\frac34"},{"id":"s5","latex":"\\frac{\\sqrt3}{2}\\le|\\overrightarrow{\\mathrm{OP}}|\\le\\sqrt2,\\quad|\\overrightarrow{\\mathrm{OX}}|=\\sqrt2"},{"id":"s6","latex":"M=3\\sqrt2+\\sqrt2=4\\sqrt2,\\quad m=\\frac{3\\sqrt3}{2}-\\sqrt2\\quad\\text{(같은 방향과 반대 방향에서 각각 성립)}"},{"id":"s7","latex":"Mm=6\\sqrt6-8\\quad\\Rightarrow\\quad a^2+b^2=64+36=100"}],"track":"기하"};</script>
