  <script>window.HandStudyRecord={"itemId":16995,"sourceLabel":"2021 교육청 고3 수학기하 3월 11번","adminYear":2021,"grade":3,"month":3,"number":11,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 두 점 $O$, $O '\\,$을 각각 중심으로 하고 반지름의 길이가 $3\\,$인 두 원 $O$, $O'\\,$이 한 평면 위에 있다. 두 원 $O$, $O'\\,$이 만나는 점을 각각 $A$, $B\\,$라 할 때, $\\angle AOB= \\frac{5}{6} \\pi \\,$이다.\n \n원 $O\\,$의 외부와 원 $O'\\,$의 내부의 공통부분의 넓이를 $S_{\\,1}$, 마름모 $AOBO ' \\,$의 넓이를 $S _{\\,2} \\,$라 할 때, $S _{\\,1} -S _{\\,2} \\,$의 값은? [4점]\n① $\\frac{5}{4} \\, \\pi$ ② $\\frac{4}{3} \\, \\pi$ ③ $\\frac{17}{12} \\pi$ ④ $\\frac{3}{2} \\, \\pi$ ⑤ $\\frac{19}{12} \\pi$","answer":"④","sourceHash":"a7ca72ebd7b064c95697e20f963f7409430d94e426e1fee5a93d8d6905b22f0a","steps":[{"id":"s1","latex":"OA=OB=O'A=O'B=3\\Rightarrow AOBO'\\text{는 마름모}"},{"id":"s2","latex":"\\angle AOB=\\angle AO'B=\\frac{5\\pi}{6}"},{"id":"s3","latex":"[AOB]=\\frac12\\cdot3^2\\sin\\frac{5\\pi}{6}=\\frac94"},{"id":"s4","latex":"S_2=2[AOB]=\\frac92"},{"id":"s5","latex":"\\text{공통 렌즈}=2\\left(\\frac12\\cdot3^2\\cdot\\frac{5\\pi}{6}-\\frac94\\right)=\\frac{15\\pi}{2}-\\frac92"},{"id":"s6","latex":"S_1=9\\pi-\\left(\\frac{15\\pi}{2}-\\frac92\\right)=\\frac{3\\pi}{2}+\\frac92"},{"id":"s7","latex":"S_1-S_2=\\frac{3\\pi}{2}"}],"diagram":null,"contentHash":"27f36b529ee7b08f86ac6cb130f580dac015ebdb928c50eaa73ad815a6cf913c","questionHtml":"\u003cp class=\"hp htall\">그림과 같이 두 점 \u003cspan class=\"heq\">\\(O\\)\u003c/span>, \u003cspan class=\"heq\">\\(O'\\,\\)\u003c/span>을 각각 중심으로 하고 반지름의 길이가 \u003cspan class=\"heq\">\\(3\\,\\)\u003c/span>인 두 원 \u003cspan class=\"heq\">\\(O\\)\u003c/span>, \u003cspan class=\"heq\">\\(O'\\,\\)\u003c/span>이 한 평면 위에 있다. 두 원 \u003cspan class=\"heq\">\\(O\\)\u003c/span>, \u003cspan class=\"heq\">\\(O'\\,\\)\u003c/span>이 만나는 점을 각각 \u003cspan class=\"heq\">\\(A\\)\u003c/span>, \u003cspan class=\"heq\">\\(B\\,\\)\u003c/span>라 할 때, \u003cspan class=\"heq\">\\(\\angle AOB= \\dfrac{5}{6} \\pi \\,\\)\u003c/span>이다.\u003c
