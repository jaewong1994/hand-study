<script>window.HandStudyRecord={"itemId":17791,"sourceLabel":"2023 평가원 고3 수학미적분 6월 30번","adminYear":2023,"grade":3,"month":6,"number":30,"track":"미적분","points":4,"scoreStatus":"confirmed_4_direct","questionText":"수열 $\\left\\{ a_{n} \\right\\}$은 등비수열이고, 수열 $\\left\\{ b_{n} \\right\\}$을 모든 자연수 $n$에 대하여\n  $b_{n} = {\\begin{cases}eqalign{\\,-1 \\\\ }&eqalign{\\, \\left( a_{n} \\leq -1 \\right) \\\\ } \\\\ \\,a_{n}&\\, \\left( a_{n} \\gt -1 \\right)\\end{cases}}$\n이라 할 때, 수열 $\\left\\{ b_{n} \\right\\}$은 다음 조건을 만족시킨다.\n(가) 급수 $\\sum\\limits_{n=1}^{\\infty } b_{2n-1}$은 수렴하고 그 합은 $-3$이다.\n(나) 급수 $\\sum\\limits_{n=1}^{\\infty } b_{2n}$은 수렴하고 그 합은 $8$이다.\n$b_{3} =-1$일 때, $\\sum\\limits_{n=1}^{\\infty } \\left| a_{n} \\right|$의 값을 구하시오. [4점]","answer":"24","sourceHash":"8d10c11d1f1a8180600852f00d3945fb7e3e7ba49200b61ac08713c91dadcbfa","steps":[{"id":"s1","latex":"b_n=\\begin{cases}-1&a_n\\le-1\\\\a_n&a_n>-1\\end{cases},\\quad \\sum b_{2n-1},\\sum b_{2n}\\text{가 수렴하므로 }|r|<1"},{"id":"s2","latex":"r>0\\Rightarrow b_{2n}<0\\Rightarrow\\sum b_{2n}\\ne8\\quad\\therefore\\quad -1<r<0"},{"id":"s3","latex":"b_3=-1\\Rightarrow a_1,a_3\\le-1"},{"id":"s4","latex":"m=\\#\\{n:b_{2n-1}=-1\\}\\ge2,\\quad \\sum b_{2n-1}<-m"},{"id":"s5","latex":"\\sum b_{2n-1}=-3\\Rightarrow m=2"},{"id":"s6","latex":"\\frac{a_1r}{1-r^2}=8,\\qquad -2+\\frac{a_1r^4}{1-r^2}=-3"},{"id":"s7","latex":"r^3=-\\frac18\\Rightarrow r=-\\frac12,\\qquad a_1=-12"},{"id":"s8","latex":"\\sum_{n=1}^{\\infty}|a_n|=\\frac{12}{1-1/2}=24"}],"diagram":null,"contentHash":"013318f0d7baf9b19e530aa45c85013b29338f8fbaafa2fc1b8b83f4d98e1c2d","questionHtml":"<p class=\"hp\">수열 <span class=\"heq\">\\(\\left\\{ a_{n} \\right\\}\\)<\/span>은 등비수열이고, 수열 <span class=\"heq\">\\(\\left\\{ b_{n} \\right\\}\\)<\/span>을 모든 자연수 <span class=\"heq\">\\(n\\)<\/span>에 대하여<\/p><p class=\"hp htall\">&emsp;&emsp;<span class=\"heq\">\\(b_n=\\begin{cases}-1&a_n\\le-1\\\\a_n&a_n\\gt-1\\end{cases}\\)<\/span><\/p><p class=\"hp\">이라 할 때, 수열 <span class=\"heq\">\\(\\left\\{ b_{n} \\right\\}\\)<\/span>은 다음 조건을 만족시킨다.<\/p><div class=\"hbox\"><p class=\"hp htall\">(가) 급수 <span class=\"heq\">\\(\\sum\\limits_{n=1}^{\\infty } b_{2n-1}\\)<\/span>은 수렴하고 그 합은 <span class=\"heq\">\\(-3\\)<\/span>이다.<\/p><p class=\"hp htall\">(나) 급수 <span class=\"heq\">\\(\\sum\\limits_{n=1}^{\\infty } b_{2n}\\)<\/span>은 수렴하고 그 합은 <span class=\"heq\">\\(8\\)<\/span>이다.<\/p><\/div><p class=\"hp htall\"><span class=\"heq\">\\(b_{3} =-1\\)<\/span>일 때, <span class=\"heq\">\\(\\sum\\limits_{n=1}^{\\infty } \\left| a_{n} \\right|\\)<\/span>의 값을 구하시오. <span class=\"hscore\">[4점]<\/span><\/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"c55e36129ae42424e0538896ffdf9a9eb4000026f1f5fac64adb8d421b665ccb"};</script>
<script>window.HandStudyGuide={"itemId":17791,"sourceHash":"8d10c11d1f1a8180600852f00d3945fb7e3e7ba49200b61ac08713c91dadcbfa","contentHash":"013318f0d7baf9b19e530aa45c85013b29338f8fbaafa2fc1b8b83f4d98e1c2d","overview":{"goal":"\\(-1\\) 이하인 항을 \\(-1\\)로 바꾼 등비수열의 홀수항·짝수항 합으로 공비와 첫째항을 구해요.","firstLook":"홀수번째 원래 항은 모두 음수이고 짝수번째 원래 항은 모두 양수가 되도록 공비의 부호부터 정해요.","conditions":[{"label":"\\(b_3=-1\\)","meaning":"\\(a_3\\le-1\\)이고, 공비가 음수이면 홀수항은 음수·짝수항은 양수가 돼요."},{"label":"홀수항 합 \\(-3\\)","meaning":"\\(-1\\)로 바뀐 홀수항이 몇 개인지와 그 뒤의 음수 꼬리합을 함께 세어요."}]},"chapters":[{"id":"c1","label":"공비 부호와 바뀌는 항의 개수","stepIds":["s1","s2","s3","s4","s5"],"question":"\\(-1\\)로 바뀌는 홀수항이 세 개 이상일 수 없는 이유는 무엇인가요?","hint":"그 항들만으로 합이 \\(-3\\) 이하이고, 뒤의 꼬리도 음수예요.","explanation":"주어진 두 부분급수가 수렴하므로 등비수열의 공비는 \\(|r|<1\\)이어야 해요. \\(b_3=-1\\)이라 \\(a_3\\le-1\\). 만약 \\(r>0\\)이면 \\(a_1,a_2,a_3,\\ldots\\)의 부호가 모두 같아 짝수항 \\(b_{2n}\\)도 음수라 그 합이 8일 수 없어요. 따라서 \\(-1<r<0\\). 그러면 \\(a_1,a_3,a_5,\\ldots\\)는 음수이고, \\(a_1=a_3/r^2\\le a_3\\le-1\\)이어서 처음 두 홀수항은 모두 \\(b_1=b_3=-1\\)예요. \\(-1\\)로 바뀌는 홀수항이 \\(m\\)개라면 그 뒤 홀수항도 음수이므로 전체 홀수합은 \\(-m\\)보다 작아요. 합이 \\(-3\\)이므로 \\(m\\ge 3\\)은 불가능하고, 이미 두 개가 있으니 정확히 \\(m=2\\)예요.","check":{"prompt":"공비가 음수일 때 짝수번째 원래 항의 부호는 무엇인가요?","answer":"\\(a_1\\)이 음수이고 \\(r\\)이 음수이므로 짝수번째 항은 양수예요."}},{"id":"c2","label":"두 꼬리합으로 공비와 첫째항 계산","stepIds":["s6","s7","s8"],"question":"홀수항 꼬리합이 왜 \\(a_1r^4/(1-r^2)\\)에서 시작하나요?","hint":"\\(b_1,b_3\\) 다음 홀수항은 \\(a_5\\)예요.","explanation":"짝수항은 모두 양수라 바뀌지 않으므로 \\(8=a_2+a_4+\\cdots=a_1r/(1-r^2)\\)예요. 홀수항에서는 \\(b_1=b_3=-1\\)이고 그다음부터는 \\(a_5,a_7,\\ldots\\)가 그대로 남으므로 \\(-3=-2+a_1r^4/(1-r^2)\\)예요. 첫 식에 \\(r^3\\)을 곱하면 \\(a_1r^4/(1-r^2)=8r^3\\)이므로 \\(8r^3=-1\\), \\(r=-1/2\\). 이어 \\(a_1r/(1-r^2)=8\\)에서 \\(a_1=-12\\)를 얻어요. 따라서 \\(\\sum|a_n|=12/(1-1/2)=24\\)예요.","check":{"prompt":"구한 값에서 정말 \\(b_1=b_3=-1\\)이고 \\(b_5=a_5\\)인가요?","answer":"\\(a_1=-12,a_3=-3\\)은 \\(-1\\) 이하이고 \\(a_5=-3/4>-1\\)이므로 정확히 맞아요."}}],"takeaway":["조각 정의는 축약 기호로 바꾸지 말고 어느 항이 경계 \\(-1\\)에 걸리는지 직접 확인해요.","일부 항이 바뀐 등비급수는 바뀐 앞부분과 그대로인 꼬리합을 분리해요."]};</script>
