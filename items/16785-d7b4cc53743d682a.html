  <script>window.HandStudyRecord={"itemId":16785,"sourceLabel":"2020 교육청 고3 수리나형 3월 30번","adminYear":2020,"grade":3,"month":3,"number":30,"track":"수리나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"닫힌구간 $\\left[-1,\\,1\\right]\\,$에서 정의된 연속함수 $f(x)\\,$는 정의역에서 증가하고 모든 실수 $x\\,$에 대하여 $f(-x)=-f(x)\\,$가 성립할 때, 함수 $g(x)$가 다음 조건을 만족시킨다.\n(가) 닫힌구간 $\\left[-1,\\,1 \\right]\\,$에서 $g(x)=f(x)\\,$이다.(나) 닫힌구간 $\\left[2n-1,\\,2n+1 \\right]\\,$에서 함수 $y=g(x)\\,$의 그래프는 함수 $y=f(x)\\,$의 그래프를 $x\\,$축의 방향으로 $2n\\,$만큼, $y\\,$축의 방향으로 $6n\\,$만큼 평행이동한 그래프이다. (단, $n\\,$은 자연수이다.)\n$f(1)= 3\\,$이고 $\\int_0 ^1 f(x) dx = 1\\,$일 때, $\\int _{3} ^{6} {} g(x)dx\\,$의 값을 구하시오.\n[4점]","answer":"41","sourceHash":"27cafb880d309d93f0c6a4a28cc86f96129db600cdad5afdcee946e715f05c82","steps":[{"id":"s1","latex":"3\\le x\\le5:\\quad g(x)=f(x-4)+12"},{"id":"s2","latex":"5\\le x\\le6:\\quad g(x)=f(x-6)+18"},{"id":"s3","latex":"f(-x)=-f(x)\\Rightarrow\\int_{-1}^{1}f(t)\\,dt=0,\\quad\\int_{-1}^{0}f(t)\\,dt=-1"},{"id":"s4","latex":"\\int_3^5g(x)\\,dx=\\int_{-1}^{1}f(t)\\,dt+24=24"},{"id":"s5","latex":"\\int_5^6g(x)\\,dx=\\int_{-1}^{0}f(t)\\,dt+18=17"},{"id":"s6","latex":"\\int_3^6g(x)\\,dx=24+17=\\boxed{41}"}],"diagram":null,"contentHash":"82954ecc5340bf3eb8c3b5f7486e2f1c083bb89ff08f332f2bbb1f7fbd7b3dc2","questionHtml":"\u003cp class=\"hp\">닫힌구간 \u003cspan class=\"heq\">\\(\\left[-1,\\,1\\right]\\,\\)\u003c/span>에서 정의된 연속함수 \u003cspan class=\"heq\">\\(f(x)\\,\\)\u003c/span>는 정의역에서 증가하고 모든 실수 \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(f(-x)=-f(x)\\,\\)\u003c/span>가 성립할 때, 함수 \u003cspan class=\"heq\">\\(g(x)\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가)닫힌구간 \u003cspan class=\"heq\">\\(\\left[-1,\\,1 \\right]\\,\\)\u003c/span>에서 \u003cspan class=\"heq\">\\(g(x)=f(x)\\,\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp\">(나)닫힌구간 \u003cspan class=\"heq\">\\(\\left[2n-1,\\,2n+1 \\right]\\,\\)\u003c/span>에서 함수 \u003cspan class=\"heq\
