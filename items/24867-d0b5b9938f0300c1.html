cases}2x ^{3} -6x+1&& \\left(x \\leq 2 \\right) \\\\ a \\left(x-2 \\right) \\left(x-b \\right)+9&& \\left(x>2 \\right)\\end{cases}}$\n이다. 실수 $t$에 대하여 함수 $y=f(x)$의 그래프와 직선 $y=t$가 만나는 점의 개수를 $g(t)$라 하자.\n $g \\left(k \\right)+ \\lim _{t \\,->\\, k-} {} g \\left(t \\right)+ \\lim _{t \\,->\\, k+} {} g \\left(t \\right)=9$\n를 만족시키는 실수 $k$의 개수가 $1$이 되도록 하는 두 자연수 $a$, $b$의 순서쌍 $(a,\\, b)$에 대하여 $a+b$의 최댓값은? [4점]\n① $51$ ② $52$ ③ $53$ ④ $54$ ⑤ $55$","sourceHash":"23f8c5f5331cb7399e74b79c56d05760bf4be360e4ebe2e90312fa2eac6c5618","sourceKind":"csat","sourceLabel":"2023년 시행 수능 · 2024학년도 · 공통 · 14번","steps":[{"id":"s1","latex":"x\\le2\\text{에서 }f'(x)=6(x-1)(x+1),\\quad f(-1)=f(2)=5,\\ f(1)=-3"},{"id":"s2","latex":"\\text{이 조각의 교점 수는 }t\u003c-3:1,\\ t=-3:2,\\ -3\u003ct\u003c5:3,\\ t=5:2,\\ t>5:0\\text{이다.}"},{"id":"s3","latex":"\\begin{aligned}&b=1,2\\text{이면 오른쪽 가지는 }x>2\\text{에서 증가하고,}\\\\&\\text{그 함숫값은 항상 }9\\text{보다 크다.}\\\\&-3\u003ct\u003c5\\text{에서는 왼쪽 가지의 교점만 세 개이므로}\\\\&g(t)=3\\text{인 }k\\text{가 무한히 많아 탈락한다.}\\end{aligned}"},{"id":"s4","latex":"x>2\\text{의 이차함수는 }b\\ge3\\text{일 때 최솟값 }M=9-\\frac{a(b-2)^2}{4}\\text{를 갖는다.}"},{"explanation":{"body":"교점 수가 열린구간 전체에서 3이면 그 구간의 모든 \\(k\\)가 조건식을 만족해 '한 개'가 될 수 없습니다. 오른쪽 이차함수의 교점 수가 바뀌는 높이 \\(M\\)을 왼쪽 조각의 경계 높이 \\(-3\\)과 정확히 겹쳐야 이런 열린구간이 사라집니다.","skillTags":["교점개수","경계맞춤"],"title":"왜 최솟값을 -3에 맞추나"},"id":"s5","latex":"M>-3\\text{ 또는 }M\u003c-3\\text{이면 }g(t)=3\\text{인 열린구간이 생겨 그 모든 }k\\text{에서 합이 }9\\text{가 된다.}"},{"id":"s6","latex":"\\text{조건을 만족하려면 }M=-3,\\quad a(b-2)^2=48"},{"id":"s7","latex":"\\text{이때 합이 }9\\text{인 곳은 }k=-3\\text{ 하나뿐이다.}"},{"id":"s8","latex":"(b-2)^2\\mid48,\\quad (a,b)=(48,3),(12,4),(3,6)"},{"id":"s9","latex":"48+3=51,\\quad12+4=16,\\quad3+6=9\\text{이므로 가장 큰 값은 }51"},{"id":"s10","latex":"\\therefore\\ \\boxed{51}\\;(①)"}],"track":"공통"};</script>
