eq\">\\(C\\,\\)\u003c/span>에 접하는 두 직선 중 기울기가 작은 직선을 \u003cspan class=\"heq\">\\(l\\,:\\,y=mx\\,\\)\u003c/span>라 하자. 원 \u003cspan class=\"heq\">\\(C\\,\\)\u003c/span>와 직선 \u003cspan class=\"heq\">\\(y=x\\,\\)\u003c/span>의 교점 중 \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>좌표가 작은 것을 \u003cspan class=\"heq\">\\({{P}}_{1}\\)\u003c/span>, \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>좌표가 큰 것을 \u003cspan class=\"heq\">\\({{P}}_{2}\\,\\)\u003c/span>라 하면 \u003cspan class=\"heq\">\\({ \\overline{{{OP}}_{1}}}=2\\,\\)\u003c/span>이다. 원 \u003cspan class=\"heq\">\\(C\\,\\)\u003c/span> 위의 점 \u003cspan class=\"heq\">\\({{P}}_{1}\\,\\)\u003c/span>에서의 접선과 직선 \u003cspan class=\"heq\">\\(l\\,\\)\u003c/span>의 교점을 \u003cspan class=\"heq\">\\({{Q}}_{1}\\)\u003c/span>, 원 \u003cspan class=\"heq\">\\(C\\,\\)\u003c/span> 위의 점 \u003cspan class=\"heq\">\\({{P}}_{2}\\,\\)\u003c/span>에서의 접선과 직선 \u003cspan class=\"heq\">\\(l\\,\\)\u003c/span>의 교점을 \u003cspan class=\"heq\">\\({{Q}}_{2}\\,\\)\u003c/span>라 하면 삼각형 \u003cspan class=\"heq\">\\({{AQ}}_{2}{ {P}}_{2}\\,\\)\u003c/span>의 넓이는 삼각형 \u003cspan class=\"heq\">\\({{AP}}_{1}{{Q}}_{1}\\,\\)\u003c/span>의 넓이의 \u003cspan class=\"heq\">\\(4\\,\\)\u003c/span>배이다. \u003cspan class=\"heq\">\\(m=\\dfrac{q}{p}\\,\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(p+q\\,\\)\u003c/span>의 값을 구하시오. (단, 점 \u003cspan class=\"heq\">\\({{A}}\\,\\)\u003c/span>는 제\u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>사분면 위의 점이고, \u003cspan class=\"heq\">\\(p\\)\u003c/span>, \u003cspan class=\"heq\">\\(q\\,\\)\u003c/span>는 서로소인 자연수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/c5f4427462f1c7f03affcc5d.png\" style=\"width:354px;max-width:100%\">\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"e899f5f5b8d854c1b8c52faccea9ee3ab5d4e54bef5b6f74f0adbb6caf988fe4"};</script>
