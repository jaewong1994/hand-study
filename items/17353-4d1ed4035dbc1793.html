_2=8\\)이고 \\(|a_2-a_1|=1\\)이라 \\(n=1\\)의 조건과 맞아요."}},{"id":"c4","label":"열 개의 짝수항을 더해요","stepIds":["s8"],"question":"첫 열 개의 짝수 번째 항의 합은 얼마일까요?","hint":"\\(\\sum_{m=1}^{10}(2m+7)\\)을 계산해요.","explanation":"\\(\\sum_{m=1}^{10}(2m+7)=2(1+\\cdots+10)+7\\cdot10=2\\cdot55+70=180\\)이에요.","check":{"prompt":"마지막 항 \\(a_{20}\\)은 얼마인가요?","answer":"\\(m=10\\)을 넣으면 \\(a_{20}=27\\)이에요."}}],"takeaway":["짝수 개까지의 부분합 조건은 이웃한 두 부분합을 빼서 두 항의 합으로 바꿔요.","절댓값 차이의 부호는 임의로 고르지 말고 다음 항과의 조건으로 부호가 이어지는지 확인해요."]};</script>
