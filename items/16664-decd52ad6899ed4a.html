  <script>window.HandStudyRecord={"itemId":16664,"sourceLabel":"2020 교육청 고3 수리가형 3월 29번","adminYear":2020,"grade":3,"month":3,"number":29,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"자연수 $n\\,$에 대하여 두 점 $A\\, \\left( 0,\\,n+5 \\right)$, $B\\, \\left( n+4,\\,0 \\right)\\,$과 원점 $O\\,$를 꼭짓점으로 하는 삼각형 $A O B\\,$가 있다. 삼각형 $A O B\\,$의 내부에 포함된 정사각형 중 한 변의 길이가 $1\\,$이고 꼭짓점의 $x\\,$좌표와 $y\\,$좌표가 모두 자연수인 정사각형의 개수를 $a _{\\,n}\\,$이라 하자. $\\sum _{n=1} ^{8} a _{\\,n}\\,$의 값을 구하시오. [4점]","answer":"164","sourceHash":"e0322adcbb0589ab4857af8dafa5d65d5ea7c20d3b42f3047a78c64fc840c2f2","steps":[{"id":"s1","latex":"AB:\\quad \\frac{x}{n+4}+\\frac{y}{n+5}=1"},{"id":"s2","latex":"\\text{정사각형의 왼쪽 아래 꼭짓점}=(i,j),\\qquad i,j\\in\\mathbb N"},{"id":"s3","latex":"\\frac{i+1}{n+4}+\\frac{j+1}{n+5}\\le1"},{"id":"s4","latex":"j+1\\le(n+3-i)+\\frac{n+3-i}{n+4}\\Rightarrow j\\le n+2-i"},{"id":"s5","latex":"a_n=\\sum_{i=1}^{n+1}(n+2-i)=\\frac{(n+1)(n+2)}2={n+2\\choose2}"},{"id":"s6","latex":"\\sum_{n=1}^{8}a_n=\\sum_{r=3}^{10}{r\\choose2}={11\\choose3}-1=\\boxed{164}"}],"diagram":null,"contentHash":"a9e34bd6ee6938349d6a8b75669fbaf9eddfb0846b1ba9f9b2e8e268bdd55370","questionHtml":"\u003cp class=\"hp htall\">자연수 \u003cspan class=\"heq\">\\(n\\,\\)\u003c/span>에 대하여 두 점 \u003cspan class=\"heq\">\\(A\\, \\left( 0,\\,n+5 \\right)\\)\u003c/span>, \u003cspan class=\"heq\">\\(B\\, \\left( n+4,\\,0 \\right)\\,\\)\u003c/span>과 원점 \u003cspan class=\"heq\">\\(O\\,\\)\u003c/span>를 꼭짓점으로 하는 삼각형 \u003cspan class=\"heq\">\\(A O B\\,\\)\u003c/span>가 있다. 삼각형 \u003cspan class=\"heq\">\\(A O B\\,\\)\u003c/span>의 내부에 포함된 정사각형 중 한 변의 길이가 \u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>이고 꼭짓점의 \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>좌표와 \u003cspan class=\"heq\">\\(y\\,\\)\u003c/span>좌표가 모두 자연수인 정사각형의 개수를 \u003cspan class=\"heq\">\\(a_{\\,n}\\,\\)\u003c/span>이라 하자. \u003cspan class=\"heq\">\\(\\sum\\limits_{n=1}^{8} a_{\\,n}\\,\\)\u003c/span>의 값을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c
