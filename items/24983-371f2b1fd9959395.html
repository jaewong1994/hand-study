<script>window.HandStudyRecord={"adminYear":2025,"answer":"11","contentHash":"138597c05089d76b919b60ab0afc97f39487d5f189901b7db8f62b6617cd411a","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24983,"month":11,"number":30,"points":4,"preview":false,"questionHtml":"\u003cp>실수 전체의 집합에서 증가하는 연속함수 \u003cspan class=\"heq\">\\(f \\left(x \\right)\\,\\)\u003c/span>의 역함수 \u003cspan class=\"heq\">\\(f^{-1} \\left(x \\right)\\,\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox hcond\">\u003cp class=\"hcondr\">(가) \u003cspan class=\"heq\">\\(\\left|\\, x\\,\\right| \\leq 1\\,\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(4 \\times \\left(f^{-1} \\left(x \\right) \\right)^{2}=x^{2} \\left(x^{2}-5 \\right)^{2}\\,\\)\u003c/span>이다\u003c/p>\u003cp class=\"hcondr\">(나) \u003cspan class=\"heq\">\\(\\left|\\, x\\,\\right| &gt; 1\\,\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(\\left|\\, f^{-1} \\left(x \\right)\\,\\right| =e^{ \\left|\\, x\\,\\right| -1}+1\\,\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp>실수 \u003cspan class=\"heq\">\\(m\\,\\)\u003c/span>에 대하여 기울기가 \u003cspan class=\"heq\">\\(m\\,\\)\u003c/span>이고 점 \u003cspan class=\"heq\">\\(\\left(1,\\,0 \\right)\\,\\)\u003c/span>을 지나는 직선이 곡선 \u003cspan class=\"heq\">\\(y=f \\left(x \\right)\\,\\)\u003c/span>와 만나는 점의 개수를 \u003cspan class=\"heq\">\\(g \\left(m \\right)\\,\\)\u003c/span>이라 하자. 함수 \u003cspan class=\"heq\">\\(g \\left(m \\right)\\,\\)\u003c/span>이 \u003cspan class=\"heq\">\\(m=a\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(m=b\\, \\left(a &lt; b \\right)\\,\\)\u003c/span>에서 불연속일 때, \u003cspan class=\"heq\">\\(g \\left(a \\right) \\times \\left( \\lim_{m\\,\\rightarrow\\, a+}g \\left(m \\right) \\right)+g \\left(b \\right) \\times \\left(\\frac{ \\ln\\, b}{b} \\right)^{2}\\,\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(\\lim_{x\\,\\rightarrow\\, \\infty }\\frac{ \\ln\\, x}{x}=0\\)\u003c/span>) [4점]\u003c/p>","questionText":"실수 전체의 집합에서 증가하는 연속함수 $f \\left(x \\right)\\,$의 역함수 $f\\,^{-1} \\left(x \\right)\\,$가 다음 조건을 만족시킨다.\n(가) $\\left|\\, x\\,\\right| \\leq 1\\,$일 때, $4 \\times \\left(f\\,^{-1} \\left(x \\right) \\right)^{2}=x\\,^{2} \\left(x^{2}-5 \\right)^{2}\\,$이다(나) $\\left|\\, x\\,\\right| > 1\\,$일 때, $\\left|\\, f\\,^{-1} \\left(x \\right)\\,\\right| =e^{ \\left|\\, x\\,\\right| -1}+1\\,$이다.\n실수 $m\\,$에 대하여 기울기가 $m\\,$이고 점 $\\left(1,\\,0 \\right)\\,$을 지나는 직선이 곡선 $y=f \\left(x \\right)\\,$와 만나는 점의 개수를 $g \\left(m \\right)\\,$이라 하자. 함수 $g \\left(m \\right)\\,$이 $m=a\\,$, $m=b\\, \\left(a \u003c b \\right)\\,$에서 불연속일 때, $g \\left(a \\right) \\times \\left( \\lim_{m\\,\\rightarrow\\, a+}g \\left(m \\right) \\right)+g \\left(b \\right) \\times \\left(\\frac{ \\ln\\, b}{b} \\right)^{2}\\,$의 값을 구하시오. $\\left( \\pi \\leq {\\,#\\,} \\right.$단, $\\lim_{x\\,\\rightarrow\\, \\infty }\\frac{ \\ln\\, x}{x}=0 \\pi \\leq {\\,#\\,} \\right)$ [4점]","sourceHash":"546eebd2ac89c3f9d30d0e4cad754e6525d2f9f65d884dabb99de159c9503cae","sourceKind":"csat","sourceLabel":"2025년 시행 수능 · 2026학년도 · 미적분 · 30번","steps":[{"explanation":{"body":"조건은 \\(|f^{-1}(x)|\\)만 알려 주지만 역함수 자체는 증가해야 합니다. 각 구간에서 증가하도록 만드는 부호를 고르고, \\(x=\\pm1\\)에서 값이 이어지는지 확인하면 세 조각이 하나로 정해집니다.","skillTags":["역함수","부호선택","연속성"],"title":"제곱식에서 부호를 고르는 기준"},"id":"s1","latex":"f^{-1}\\text{가 증가하므로 }f^{-1}(x)=\\begin{cases}-e^{-x-1}-1&(x\u003c-1)\\\\-\\frac12x^{3}+\\frac52x&(|x|\\le1)\\\\e^{x-1}+1&(x>1)\\end{cases}"},{"id":"s2","latex":"f^{-1}(-1)=-2,\\ f^{-1}(1)=2\\Rightarrow f(-2)=-1,\\ f(2)=1"},{"id":"s3","latex":"x\u003c-2\\text{에서 }f(x)=-\\ln(-x-1)-1,\\quad f'(x)=-\\frac1{x+1}"},{"id":"s4","latex":"t\u003c-2\\text{인 접점에서 접선이 }(1,0)\\text{을 지나면 }\\frac{f(t)}{t-1}=f'(t)"},{"id":"s5","latex":"\\ln(-t-1)=-\\frac2{t+1}"},{"id":"s6","latex":"b=-\\frac1{t+1}=\\frac12\\ln(-t-1)>0"},{"id":"s7","latex":"\\begin{aligned}&R(x)=\\frac{f(x)}{x-1}\\text{라 하면 직선 }y=m(x-1)\\text{과}\\\\&y=f(x)\\text{의 교점 수가 }g(m)\\text{이다.}\\\\&m\\le0\\text{에서는 증가함수 }f\\text{와 증가하지 않는 직선이}\\\\&\\text{만나는 점이 하나이다.}\\end{aligned}"},{"id":"s8","latex":"\\begin{aligned}&x>1\\text{에서 }R\\text{은 }\\infty\\text{에서 }0\\text{으로 감소한다.}\\\\&1\u003cx\\le2\\text{에서는 }x=i(y)=-\\frac12y^3+\\frac52y\\text{라 두면}\\\\&\\frac{d}{dy}\\frac{y}{i(y)-1}\\text{의 분자는}\\\\&i-1-yi'=y^3-1\\le0.\\end{aligned}"},{"id":"s9","latex":"x>2\\text{에서는 }R(x)=\\frac{\\ln(x-1)+1}{x-1},\\quad R'(x)=\\frac{-\\ln(x-1)}{(x-1)^2}\\le0\\text{이므로 }m>0\\text{인 오른쪽 교점은 하나이다.}"},{"id":"s10","latex":"-2\\le x\u003c0\\text{의 중앙 조각에서도 }i-1-yi'=y^3-1\u003c0\\text{이므로 }R\\text{는 }\\frac13\\text{에서 }0\\text{까지 감소한다.}"},{"id":"s11","latex":"x\u003c-2\\text{에서 }u=-x-1>1\\text{로 두면 }R=\\frac{\\ln u+1}{u+2},\\quad\\frac{dR}{du}\\text{의 분자는 }\\frac2u-\\ln u\\text{로 한 번만 부호가 바뀌어 }R\\text{의 최댓값 }b\\text{가 하나이다.}"},{"id":"s12","latex":"\\text{따라서 }g(m)=1\\ (m\\le0),\\ 3\\ (0\u003cm\u003cb),\\ 2\\ (m=b),\\ 1\\ (m>b)"},{"id":"s13","latex":"\\text{불연속점은 }a=0,\\ b\\text{이고 }g(a)=1,\\ \\lim_{m\\to a+}g(m)=3,\\ g(b)=2"},{"id":"s14","latex":"-t-1=\\frac1b,\\quad \\ln\\frac1b=2b\\Rightarrow \\frac{\\ln b}{b}=-2"},{"id":"s15","latex":"1\\cdot3+2\\cdot(-2)^{2}=11"},{"id":"s16","latex":"\\therefore\\ \\boxed{11}"}],"track":"미적분"};</script>
<script>window.HandStudyGuide={"itemId":24983,"sourceHash":"546eebd2ac89c3f9d30d0e4cad754e6525d2f9f65d884dabb99de159c9503cae","contentHash":"138597c05089d76b919b60ab0afc97f39487d5f189901b7db8f62b6617cd411a","overview":{"goal":"역함수 조건으로 \\(f\\)의 세 조각을 정하고, 점 \\((1,0)\\)을 지나는 직선의 교점 수가 바뀌는 두 기울기를 찾아요.","firstLook":"직선 \\(y=m(x-1)\\)과 \\(y=f(x)\\)의 교점은 \\(R(x)=f(x)/(x-1)=m\\)의 해로 바꾸어 세어요.","conditions":[{"label":"증가하는 역함수","meaning":"제곱식과 절댓값식에서 각 구간의 부호를 증가성과 경계값에 맞게 골라요."},{"label":"교점 수의 불연속","meaning":"수평선 \\(y=m\\)이 \\(R\\)의 꼭대기에 닿거나 \\(m=0\\)을 지날 때 해의 개수가 바뀌어요."}]},"chapters":[{"id":"c1","label":"역함수의 부호와 바깥 조각","stepIds":["s1","s2","s3"],"question":"\\(|x|\\le 1\\)에서 제곱근의 두 부호 중 어느 쪽을 골라야 하나요?","hint":"\\(-1,0,1\\)에서 역함숫값이 증가하는 순서가 되게 고르세요.","explanation":"\\(|x|\\le 1\\)에서 제곱식을 풀면 크기는 \\(|x|(5-x^2)/2\\)예요. 역함수 자체가 증가해야 하므로 음수 \\(x\\)에서는 음수, 양수 \\(x\\)에서는 양수를 골라 \\(f^{-1}(x)=-x^3/2+5x/2\\)가 돼요. 이 식은 \\(f^{-1}(-1)=-2\\), \\(f^{-1}(1)=2\\)라서 \\(f(-2)=-1,f(2)=1\\)예요. 바깥에서도 증가성에 맞춰 \\(x<-1\\)에서는 \\(f^{-1}(x)=-e^{-x-1}-1\\), \\(x>1\\)에서는 \\(f^{-1}(x)=e^{x-1}+1\\)을 골라요. 이를 뒤집으면 \\(x<-2\\)에서 \\(f(x)=-\\ln(-x-1)-1\\), \\(x>2\\)에서 \\(f(x)=\\ln(x-1)+1\\)예요.","check":{"prompt":"\\(f^{-1}(1)=2\\)는 원래 함수에서 어떤 점을 뜻하나요?","answer":"\\(f(2)=1\\), 즉 곡선 \\(y=f(x)\\)가 점 \\((2,1)\\)을 지난다는 뜻이에요."}},{"id":"c2","label":"왼쪽 바깥 조각의 접선 기울기","stepIds":["s4","s5","s6"],"question":"교점 수가 바뀌는 양의 기울기 \\(b\\)는 왜 접선 조건으로 찾나요?","hint":"수평선 \\(y=m\\)이 \\(R\\)의 꼭대기에 닿을 때 두 해가 하나로 합쳐져요.","explanation":"\\(t<-2\\)에서 곡선의 접선이 \\((1,0)\\)을 지나면 접선 기울기는 \\(f'(t)\\)이면서 두 점의 기울기 \\(f(t)/(t-1)\\)과 같아요. \\(f(t)=-\\ln(-t-1)-1\\), \\(f'(t)=-1/(t+1)\\)을 넣으면 \\(\\ln(-t-1)=-2/(t+1)\\)예요. 이 접선의 양의 기울기를 \\(b\\)라 하면 \\(b=-1/(t+1)>0\\)이고, 앞 식에서 \\(b=\\frac12\\ln(-t-1)\\)도 얻어요.","check":{"prompt":"\\(t<-2\\)에서 \\(b=-1/(t+1)\\)가 양수인 이유는 무엇인가요?","answer":"\\(t+1<-1\\)이라 분모가 음수이고 앞에 음수 부호가 있기 때문이에요."}},{"id":"c3","label":"네 구간에서 교점 세기","stepIds":["s7","s8","s9","s10","s11"],"question":"\\(0<m<b\\)에서 왼쪽 교점이 항상 두 개인 이유는 무엇인가요?","hint":"\\([-2,0]\\)의 가지와 \\(x<-2\\)의 가지가 \\(m=1/3\\)에서 역할을 이어받는 모습을 보세요.","explanation":"\\(R(x)=f(x)/(x-1)\\)라 하면 \\(R(x)=m\\)의 해가 교점이에요. \\(m\\le 0\\)에서는 증가함수 \\(f\\)와 증가하지 않는 직선이 한 번만 만나요. \\(m>0\\)에서 오른쪽 \\(x>1\\)을 보면, 중앙 조각 \\(1<x\\le 2\\)에서는 \\(x=i(y)=-y^3/2+5y/2\\)로 두었을 때 \\(y/(i(y)-1)\\)의 분자가 \\(i-1-yi'=y^3-1\\le 0\\)이라 감소해요. \\(x>2\\)에서도 \\(R=(\\ln(x-1)+1)/(x-1)\\), \\(R'=-\\ln(x-1)/(x-1)^2\\le 0\\)이고 \\(R(2)=1\\)로 이어지므로 양의 \\(m\\)마다 오른쪽 교점은 하나예요. 왼쪽 중앙 \\(-2\\le x\\le 0\\)에서는 \\(R\\)가 \\(1/3\\)에서 0까지 감소해 \\(0<m<1/3\\)에서 한 점을 줘요. 왼쪽 바깥 \\(x<-2\\)에서는 \\(u=-x-1>1\\)로 두면 \\(R=(\\ln u+1)/(u+2)\\)이고, 도함수의 부호를 정하는 \\(2/u-\\ln u\\)가 양수에서 음수로 한 번만 바뀌어요. 따라서 \\(R\\)는 \\(1/3\\)에서 시작해 최댓값 \\(b\\)까지 증가한 뒤 0으로 감소해요. \\(m<1/3\\)에서는 내려가는 쪽 한 점과 중앙 한 점, \\(m=1/3\\)에서는 경계 \\(x=-2\\)와 내려가는 쪽 한 점, \\(1/3<m<b\\)에서는 바깥 가지의 두 점으로, 어느 경우든 왼쪽 교점은 두 개예요. \\(m=b\\)에서는 접점 한 개, \\(m>b\\)에서는 0개예요.","check":{"prompt":"\\(m=1/3\\)에서 \\(x=-2\\)를 두 번 세면 안 되는 이유는 무엇인가요?","answer":"중앙 조각과 바깥 조각이 같은 점 \\((-2,-1)\\)에서 이어지므로 실제 교점은 한 점이기 때문이에요."}},{"id":"c4","label":"두 불연속점과 요구값","stepIds":["s12","s13","s14","s15","s16"],"question":"\\(m=0\\)과 \\(m=b\\)에서 \\(g(m)\\)과 한쪽 극한은 각각 얼마인가요?","hint":"오른쪽 한 점에 왼쪽 교점 수를 더하세요.","explanation":"앞의 개수를 합치면 \\(g(m)=1\\,(m\\le 0)\\), \\(g(m)=3\\,(0<m<b)\\), \\(g(b)=2\\), \\(g(m)=1\\,(m>b)\\)예요. 따라서 불연속점은 \\(a=0\\)과 \\(b\\)이고, \\(g(a)=1\\), \\(\\lim_{m\\to a+}g(m)=3\\), \\(g(b)=2\\)예요. 접점에서 \\(-t-1=1/b\\)이고 \\(\\ln(-t-1)=2b\\)였으므로 \\(\\ln(1/b)=2b\\), 곧 \\(\\ln b/b=-2\\)예요. 요구값은 \\(1\\cdot 3+2\\cdot(-2)^2=11\\)예요.","check":{"prompt":"\\(m=b\\)에서 \\(g(b)=2\\)인 두 교점은 어디에 있나요?","answer":"왼쪽 바깥 가지의 접점 한 개와 오른쪽 가지의 교점 한 개예요."}}],"takeaway":["한 점을 지나는 직선의 교점 수는 \\(f(x)/(x-c)\\)와 수평선의 교점 수로 바꾸어 볼 수 있어요.","조각 경계에서는 양쪽 식이 같은 점을 나타내므로 교점을 중복해서 세지 않아요."]};</script>
