  <script>window.HandStudyRecord={"itemId":12125,"sourceLabel":"2025 교육청 고1 수학 6월 16번","adminYear":2025,"grade":1,"month":6,"number":16,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"두 실수 $a\\, \\left(a > 2 \\right)$, $b\\,$에 대하여 이차함수 $y=x^{2}- \\left(a+1 \\right)x+a\\,$의 그래프와 직선 $y=bx-b\\,$가 한 점 ${{A}} \\left(1,\\,0 \\right)\\,$에서만 만난다. 함수 $y=x^{2}- \\left(a+1 \\right)x+a\\,$의 그래프가 $x\\,$축과 만나는 점 중 ${{A}}\\,$가 아닌 점을 ${{B}}$, 함수 $y=x^{2}- \\left(a+1 \\right)x+a\\,$의 그래프가 $y\\,$축과 만나는 점을 ${{C}}$, 직선 $y=bx-b\\,$가 $y\\,$축과 만나는 점을 ${{D}}\\,$라 하자. 다음은 삼각형 ${{OAD}}\\,$의 넓이를 $S_{1}$, 사각형 ${{ABCD}}\\,$의 넓이를 $S_{2}\\,$라 할 때, $S_{1} \\,:\\,S_{2}=2\\,:\\,7\\,$이 되도록 하는 $a\\,$의 값을 구하는 과정이다. (단, ${{O}}\\,$는 원점이다.) [4점]\n 이차함수 $y=x^{2}- \\left(a+1 \\right)x+a\\,$의 그래프가 직선 $y=bx-b\\,$와 한 점 ${{A}}\\,$에서만 만나므로이차방정식 $x^{2}- \\left(a+b+1 \\right)x+a+b=0\\,$의 판별식 $D\\,=0\\,$이다.삼각형 ${{OAD}}\\,$의 넓이 $S_{1}\\,$과 사각형 ${{ABCD}}\\,$의 넓이 $S_{2}\\,$를 $a\\,$에 대한 식으로 나타내면$S_{1}= box{\\, \\left(가 \\right)\\,}$, $S_{2}= box{\\, \\left(나 \\right)\\,}\\,$이다.따라서 $S_{1} \\,:\\,S_{2}=2\\,:\\,7\\,$이 되도록 하는 $a\\,$의 값은$a= box{\\, \\left(다 \\right)\\,}\\,$이다.위의 (가), (나)에 알맞은 식을 각각 $f \\left(a \\right)$, $g \\left(a \\right)\\,$라 하고, (다)에 알맞은 수를 $p\\,$라 할 때, $f \\left(5 \\right)+g \\left(5 \\right)+p\\,$의 값은?\n① $\\frac{27}{2}$ ② $\\frac{29}{2}$ ③ $\\frac{31}{2}$ ④ $\\frac{33}{2}$ ⑤ $\\frac{35}{2}$","answer":"③","sourceHash":"3918e8909f0eded7dfd2a14be397c29cec0b5cd120620617e2fa10c99bf0ac07","steps":[{"id":"s1","latex":"x^2-(a+1)x+a=(x-1)(x-a),\\quad y=b(x-1)"},{"id":"s2","latex":"(x-1)(x-a-b)=0,\\quad\\text{교점이 }A(1,0)\\text{ 하나}\\Rightarrow a+b=1"},{"id":"s3","latex":"B=(a,0),\\quad C=(0,a),\\quad D=(0,a-1)"},{"id":"s4","latex":"S_1=[\\triangle OAD]=\\frac{a-1}{2}"},{"id":"s5","latex":"S_2=[ABCD]=\\frac12\\{a^2-(a-1)\\}=\\frac{a^2-a+1}{2}"},{"id":"s6","latex":"S_1:S_2=2:7\\Rightarrow7(a-1)=2(a^2-a+1)\\Rightarrow a=3\\quad(a>2)"},{"id":"s7","latex":"f(5)+g(5)+p=\\frac{5-1}{2}+\\fr
