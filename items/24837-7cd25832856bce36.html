<script>window.HandStudyRecord={"adminYear":2022,"answer":"24","contentHash":"89299e791d97ab8b8e3231834f6c9730740af66cb24aa63c34991d4012890d07","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24837,"month":11,"number":30,"points":4,"preview":false,"questionHtml":"\u003cp>좌표공간에 정사면체 \u003cspan class=\"heq\">\\({ABCD}\\)\u003c/span>가 있다. 정삼각형 \u003cspan class=\"heq\">\\({BCD}\\)\u003c/span>의 외심을 중심으로 하고 점 \u003cspan class=\"heq\">\\({B}\\)\u003c/span>를 지나는 구를 \u003cspan class=\"heq\">\\(S\\)\u003c/span>라 하자. 구 \u003cspan class=\"heq\">\\(S\\)\u003c/span> 와 선분 \u003cspan class=\"heq\">\\({AB}\\)\u003c/span>가 만나는 점 중 \u003cspan class=\"heq\">\\({B}\\)\u003c/span>가 아닌 점을 \u003cspan class=\"heq\">\\({P}\\)\u003c/span>, 구 \u003cspan class=\"heq\">\\(S\\)\u003c/span> 와 선분 \u003cspan class=\"heq\">\\({AC}\\)\u003c/span>가 만나는 점 중 \u003cspan class=\"heq\">\\({C}\\)\u003c/span>가 아닌 점을 \u003cspan class=\"heq\">\\({Q}\\)\u003c/span>, 구 \u003cspan class=\"heq\">\\(S\\)\u003c/span> 와 선분 \u003cspan class=\"heq\">\\({AD}\\)\u003c/span>가 만나는 점 중 \u003cspan class=\"heq\">\\({D}\\)\u003c/span>가 아닌 점을 \u003cspan class=\"heq\">\\({R}\\)\u003c/span>라 하고, 점 \u003cspan class=\"heq\">\\({P}\\)\u003c/span>에서 구 \u003cspan class=\"heq\">\\(S\\)\u003c/span> 에 접하는 평면을 \u003cspan class=\"heq\">\\(\\alpha\\)\u003c/span>라 하자. 구 \u003cspan class=\"heq\">\\(S\\)\u003c/span> 의 반지름의 길이가 \u003cspan class=\"heq\">\\(6\\)\u003c/span>일 때, 삼각형 \u003cspan class=\"heq\">\\({PQR}\\)\u003c/span>의 평면 \u003cspan class=\"heq\">\\(\\alpha\\)\u003c/span> 위로의 정사영의 넓이는 \u003cspan class=\"heq\">\\(k\\)\u003c/span>이다. \u003cspan class=\"heq\">\\(k^{2}\\)\u003c/span>의 값을 구하시오. [4점]\u003c/p>\u003cfigure>\u003cimg class=\"hfig\" src=\"../assets/csat/24837-c5a2209892260204.png\" alt=\"2022년 시행 수능 30번 문항 그림 \" style=\"max-width:100%;width:420px\">\u003c/figure>","questionText":"좌표공간에 정사면체 ${ABCD}$가 있다. 정삼각형 ${BCD}$의 외심을 중심으로 하고 점 ${B}$를 지나는 구를 $S$라 하자. 구 $S$ 와 선분 ${AB}$가 만나는 점 중 ${B}$가 아닌 점을 ${P}$, 구 $S$ 와 선분 ${AC}$가 만나는 점 중 ${C}$가 아닌 점을 ${Q}$, 구 $S$ 와 선분 ${AD}$가 만나는 점 중 ${D}$가 아닌 점을 ${R}$라 하고, 점 ${P}$에서 구 $S$ 에 접하는 평면을 $\\alpha$라 하자. 구 $S$ 의 반지름의 길이가 $6$일 때, 삼각형 ${PQR}$의 평면 $\\alpha$ 위로의 정사영의 넓이는 $k$이다. $k^{2}$의 값을 구하시오. [4점]","sourceHash":"ee4f950bec7b19b03990e2b9c88dfc33a745880fc6c2aa335b063754e3ab45e3","sourceKind":"csat","sourceLabel":"2022년 시행 수능 · 2023학년도 · 기하 · 30번","steps":[{"id":"s1","latex":"\\mathrm O\\text{를 구의 중심이라 하면 }\\mathrm{OB}=6,\\quad\\mathrm{AB}=6\\sqrt3,\\quad\\mathrm{AO}=6\\sqrt2"},{"id":"s2","latex":"\\mathrm O=(0,0,0),\\quad\\mathrm A=(0,0,6\\sqrt2),\\quad\\mathrm B=(6,0,0)"},{"id":"s3","latex":"\\mathrm P=\\mathrm A+t(\\mathrm B-\\mathrm A)=(6t,0,6\\sqrt2(1-t))"},{"id":"s4","latex":"\\mathrm{OP}=6\\ \\Rightarrow 36t^2+72(1-t)^2=36\\ \\Rightarrow (3t-1)(t-1)=0"},{"id":"s5","latex":"t=1\\text{은 }\\mathrm B\\text{이므로 }t=\\frac13,\\quad\\mathrm P=(2,0,4\\sqrt2)"},{"id":"s6","latex":"\\mathrm Q,\\mathrm R\\text{도 같은 비로 나뉘므로 }\\triangle\\mathrm{PQR}\\parallel\\triangle\\mathrm{BCD},\\quad\\mathrm{PQ}=2\\sqrt3"},{"id":"s7","latex":"[\\triangle\\mathrm{PQR}]=\\frac{\\sqrt3}4(2\\sqrt3)^2=3\\sqrt3"},{"id":"s8","latex":"\\alpha\\text{의 법선은 }\\vec{\\mathrm{OP}},\\quad\\mathrm{PQR}\\text{평면의 법선은 }\\vec{\\mathrm{OA}}"},{"id":"s9","latex":"\\cos\\theta=\\frac{4\\sqrt2}{6}=\\frac{2\\sqrt2}3\\ \\Rightarrow\\ k=3\\sqrt3\\cos\\theta=2\\sqrt6"},{"id":"s10","latex":"\\boxed{k^2=24}"}],"track":"기하"};</script>
<script>window.HandStudyGuide={"itemId":24837,"sourceHash":"ee4f950bec7b19b03990e2b9c88dfc33a745880fc6c2aa335b063754e3ab45e3","contentHash":"89299e791d97ab8b8e3231834f6c9730740af66cb24aa63c34991d4012890d07","overview":{"goal":"정사면체의 대칭과 닮음을 이용해 구 위의 세 점이 만드는 정삼각형의 넓이를 구하고, 접평면으로의 정사영 넓이를 계산해요.","firstLook":"구의 중심 \\(O\\)는 밑면 정삼각형 \\(BCD\\)의 외심이에요. 정사면체의 꼭짓점 \\(A\\)는 \\(O\\)의 바로 위에 있고, 세 모서리와 구의 두 번째 교점은 같은 비로 놓여요.","conditions":[{"label":"구의 반지름","meaning":"\\(OB=OC=OD=OP=OQ=OR=6\\)이에요."},{"label":"정사면체","meaning":"밑면은 정삼각형이고 꼭짓점에서 밑면의 세 꼭짓점까지 길이가 모두 같아 회전 대칭을 이뤄요."},{"label":"정사영","meaning":"삼각형의 넓이에 두 평면이 이루는 각의 코사인을 곱해 정사영 넓이를 구해요."}]},"chapters":[{"id":"c1","label":"정사면체의 변과 높이를 구해요","stepIds":["s1","s2"],"question":"밑면의 외접원 반지름이 \\(6\\)이면 정사면체의 모서리와 높이는 얼마일까요?","hint":"정삼각형의 외접원 반지름은 한 변의 \\(\\sqrt3/3\\)배예요.","explanation":"정삼각형 \\(BCD\\)의 외접원 반지름이 \\(6\\)이므로 한 변은 \\(6\\sqrt3\\)이에요. 따라서 정사면체의 모든 모서리도 \\(AB=6\\sqrt3\\)이에요.\n\n\\(AO\\)는 밑면에 수직이고 \\(OB=6\\)이므로 직각삼각형 \\(AOB\\)에서 \\(AO^2=AB^2-OB^2=108-36=72\\), 곧 \\(AO=6\\sqrt2\\)예요. 위치를 계산하기 쉽게 \\(O\\)를 원점, \\(AO\\)를 세로축으로 잡고 \\(A=(0,0,6\\sqrt2)\\), \\(B=(6,0,0)\\)로 둘 수 있어요.","check":{"prompt":"\\(AB^2\\)에서 \\(OB^2\\)을 빼면 얼마인가요?","answer":"\\(108-36=72\\)이므로 \\(AO=6\\sqrt2\\)예요."}},{"id":"c2","label":"모서리 위의 두 번째 교점 비를 구해요","stepIds":["s3","s4","s5"],"question":"점 \\(P\\)는 선분 \\(AB\\)를 어떤 비로 나눌까요?","hint":"\\(A\\)에서 \\(B\\)로 가는 비율을 \\(t\\)라 두고 \\(OP=6\\)을 써요.","explanation":"\\(AP:AB=t:1\\)이라 두면 단면 \\(AOB\\)에서 \\(P\\)의 가로 성분은 \\(6t\\), 밑면에서의 높이는 \\(6\\sqrt2(1-t)\\)예요. \\(P\\)가 반지름 \\(6\\)인 구 위에 있으므로\n\\[\n(6t)^2+\\{6\\sqrt2(1-t)\\}^2=36.\n\\]\n정리하면 \\(3t^2-4t+1=0\\), 즉 \\((3t-1)(t-1)=0\\)이에요. \\(t=1\\)은 이미 알고 있는 교점 \\(B\\)이므로 다른 교점은 \\(t=1/3\\)이에요. 따라서 \\(AP:PB=1:2\\)이고, \\(P\\)의 높이는 \\(4\\sqrt2\\)예요.","check":{"prompt":"방정식의 해 \\(t=1\\)을 제외하는 이유는 무엇인가요?","answer":"\\(t=1\\)이면 점이 \\(B\\)이고, 문제는 \\(B\\)가 아닌 다른 교점 \\(P\\)를 정했기 때문이에요."}},{"id":"c3","label":"대칭으로 PQR의 모양과 넓이를 정해요","stepIds":["s6","s7"],"question":"왜 \\(Q,R\\)도 같은 비로 모서리를 나누며 \\(PQR\\)이 정삼각형일까요?","hint":"정사면체를 AO 둘레로 돌리면 B,C,D와 P,Q,R이 차례로 대응해요.","explanation":"\\(120^\\circ\\) 회전 대칭으로 \\(AB,AC,AD\\)와 구의 교점 관계가 같으므로 \\(AQ/AC=AR/AD=1/3\\)이에요. 세 모서리를 같은 비로 나눈 점을 이은 평면은 밑면과 평행하고, 삼각형 \\(PQR\\)은 삼각형 \\(BCD\\)를 \\(1/3\\)배 한 정삼각형이에요.\n\n따라서 \\(PQ=(1/3)BC=2\\sqrt3\\)이고 넓이는 \\(\\frac{\\sqrt3}{4}(2\\sqrt3)^2=3\\sqrt3\\)이에요.","check":{"prompt":"삼각형 \\(PQR\\)과 \\(BCD\\)의 넓이비는 얼마인가요?","answer":"닮음비가 \\(1:3\\)이므로 넓이비는 \\(1:9\\)예요."}},{"id":"c4","label":"두 평면의 각으로 정사영 넓이를 구해요","stepIds":["s8","s9","s10"],"question":"접평면과 PQR의 평면이 이루는 각의 코사인은 어떻게 구할까요?","hint":"접평면은 반지름 \\(OP\\)에 수직이고, \\(PQR\\)의 평면은 높이 \\(AO\\)에 수직이에요.","explanation":"점 \\(P\\)에서의 접평면 \\(\\alpha\\)는 \\(OP\\)에 수직이고, 평면 \\(PQR\\)은 밑면과 평행하므로 \\(AO\\)에 수직이에요. 따라서 두 평면이 이루는 각은 두 수선 \\(OP\\)와 \\(AO\\)가 이루는 각과 같아요.\n\n\\(P\\)의 밑면에서의 높이가 \\(4\\sqrt2\\)이고 \\(OP=6\\)이므로 이 각을 \\(\\theta\\)라 하면 \\(\\cos\\theta=4\\sqrt2/6=2\\sqrt2/3\\)이에요. 정사영 넓이는 \\(k=3\\sqrt3\\cdot2\\sqrt2/3=2\\sqrt6\\)이고, 따라서 \\(k^2=24\\)예요.","check":{"prompt":"정사영 넓이가 원래 넓이보다 작은지 확인해 볼까요?","answer":"\\(\\cos\\theta=2\\sqrt2/3<1\\)이므로 \\(2\\sqrt6<3\\sqrt3\\)이고 조건에 맞아요."}}],"takeaway":["정사면체에서는 밑면 외심과 꼭짓점을 이은 선이 높이가 돼요.","회전 대칭인 모서리와 같은 구의 교점은 모두 같은 비로 모서리를 나눠요.","정사영 넓이는 원래 넓이와 두 평면이 이루는 각의 코사인을 곱해 구해요."]};</script>
