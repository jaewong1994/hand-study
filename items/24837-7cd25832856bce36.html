선분 ${AC}$가 만나는 점 중 ${C}$가 아닌 점을 ${Q}$, 구 $S$ 와 선분 ${AD}$가 만나는 점 중 ${D}$가 아닌 점을 ${R}$라 하고, 점 ${P}$에서 구 $S$ 에 접하는 평면을 $\\alpha$라 하자. 구 $S$ 의 반지름의 길이가 $6$일 때, 삼각형 ${PQR}$의 평면 $\\alpha$ 위로의 정사영의 넓이는 $k$이다. $k^{2}$의 값을 구하시오. [4점]","sourceHash":"ee4f950bec7b19b03990e2b9c88dfc33a745880fc6c2aa335b063754e3ab45e3","sourceKind":"csat","sourceLabel":"2022년 시행 수능 · 2023학년도 · 기하 · 30번","steps":[{"id":"s1","latex":"\\mathrm O\\text{를 구의 중심이라 하면 }\\mathrm{OB}=6,\\quad\\mathrm{AB}=6\\sqrt3,\\quad\\mathrm{AO}=6\\sqrt2"},{"id":"s2","latex":"\\mathrm O=(0,0,0),\\quad\\mathrm A=(0,0,6\\sqrt2),\\quad\\mathrm B=(6,0,0)"},{"id":"s3","latex":"\\mathrm P=\\mathrm A+t(\\mathrm B-\\mathrm A)=(6t,0,6\\sqrt2(1-t))"},{"id":"s4","latex":"\\mathrm{OP}=6\\ \\Rightarrow 36t^2+72(1-t)^2=36\\ \\Rightarrow (3t-1)(t-1)=0"},{"id":"s5","latex":"t=1\\text{은 }\\mathrm B\\text{이므로 }t=\\frac13,\\quad\\mathrm P=(2,0,4\\sqrt2)"},{"id":"s6","latex":"\\mathrm Q,\\mathrm R\\text{도 같은 비로 나뉘므로 }\\triangle\\mathrm{PQR}\\parallel\\triangle\\mathrm{BCD},\\quad\\mathrm{PQ}=2\\sqrt3"},{"id":"s7","latex":"[\\triangle\\mathrm{PQR}]=\\frac{\\sqrt3}4(2\\sqrt3)^2=3\\sqrt3"},{"id":"s8","latex":"\\alpha\\text{의 법선은 }\\vec{\\mathrm{OP}},\\quad\\mathrm{PQR}\\text{평면의 법선은 }\\vec{\\mathrm{OA}}"},{"id":"s9","latex":"\\cos\\theta=\\frac{4\\sqrt2}{6}=\\frac{2\\sqrt2}3\\ \\Rightarrow\\ k=3\\sqrt3\\cos\\theta=2\\sqrt6"},{"id":"s10","latex":"\\boxed{k^2=24}"}],"track":"기하"};</script>
