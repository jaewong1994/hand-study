<script>window.HandStudyRecord={"itemId":11838,"sourceLabel":"2022 교육청 고1 수학 11월 29번","adminYear":2022,"grade":1,"month":11,"number":29,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 모든 모서리의 길이가 $a$인 정사각뿔 $O-ABCD$가 있다. 네 선분 $O A$, $O B$, $O C$, $O D$ 위의 네 점 $E$, $F$, $G$, $H$를 $\\overline{O E}=\\overline{O F}=\\overline{O G}=\\overline{O H}=b$가 되도록 잡는다. 두 정사각뿔 $O-ABCD$, $O-EFGH$의 부피의 합이 $2 \\sqrt{2}$이고 선분 $A F$의 길이가 $2$일 때, 사각형 $A E$의 넓이를 $S$라 하자. $32 \\times S ^{2}$의 값을 구하시오. (단, $a$, $b$는 $a>b>0$인 상수이다.)\n[4점]","answer":"126","sourceHash":"f5c06c2e9f50aaae1aacb4b2d8de55f70f4ff1c9af2e34a4421fa33366bbc4f5","steps":[{"id":"s1","latex":"V_a=\\frac{\\sqrt2}{6}a^3,\\quad V_b=\\frac{\\sqrt2}{6}b^3"},{"id":"s2","latex":"V_a+V_b=2\\sqrt2\\Rightarrow a^3+b^3=12"},{"id":"s3","latex":"AF^2=a^2-ab+b^2=4"},{"id":"s4","latex":"a^3+b^3=(a+b)(a^2-ab+b^2)\\Rightarrow a+b=3"},{"id":"s5","latex":"a^2-ab+b^2=(a+b)^2-3ab=4\\Rightarrow ab=\\frac53"},{"id":"s6","latex":"(a-b)^2=(a+b)^2-4ab=\\frac73"},{"id":"s7","latex":"S=\\frac{\\sqrt3}{4}(a^2-b^2)=\\frac{\\sqrt3}{4}(a+b)(a-b)=\\frac34\\sqrt7"},{"id":"s8","latex":"32S^2=32\\cdot\\frac{63}{16}=126"}],"diagram":null,"contentHash":"ca89df603be14bd99da93d6bce6425afd5b82bf34af0557fa848ad561a545509","questionHtml":"\u003cp class=\"hp htall\">그림과 같이 모든 모서리의 길이가 \u003cspan class=\"heq\">\\(a\\)\u003c/span>인 정사각뿔 \u003cspan class=\"heq\">\\(O-ABCD\\)\u003c/span>가 있다. 네 선분 \u003cspan class=\"heq\">\\(O A\\)\u003c/span>, \u003cspan class=\"heq\">\\(O B\\)\u003c/span>, \u003cspan class=\"heq\">\\(O C\\)\u003c/span>, \u003cspan class=\"heq\">\\(O D\\)\u003c/span> 위의 네 점 \u003cspan class=\"heq\">\\(E\\)\u003c/span>, \u003cspan class=\"heq\">\\(F\\)\u003c/span>, \u003cspan class=\"heq\">\\(G\\)\u003c/span>, \u003cspan class=\"heq\">\\(H\\)\u003c/span>를 \u003cspan class=\"heq\">\\(\\overline{O E}=\\overline{O F}=\\overline{O G}=\\overline{O H}=b\\)\u003c/span>가 되도록 잡는다. \u003cbr>두 정사각뿔 \u003cspan class=\"heq\">\\(O-ABCD\\)\u003c/span>, \u003cspan class=\"heq\">\\(O-EFGH\\)\u003c/span>의 부피의 합이 \u003cspan class=\"heq\">\\(2 \\sqrt{2}\\)\u003c/span>이고 선분 \u003cspan class=\"heq\">\\(A F\\)\u003c/span>의 길이가 \u003cspan class=\"heq\">\\(2\\)\u003c/span>일 때, 사각형 \u003cspan class=\"heq\">\\(A E\\)\u003c/span>의 넓이를 \u003cspan class=\"heq\">\\(S\\)\u003c/span>라 하자. \u003cspan class=\"heq\">\\(32 \\times S^{2}\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(a\\)\u003c/span>, \u003cspan class=\"heq\">\\(b\\)\u003c/span>는 \u003cspan class=\"heq\">\\(a\\gt b\\gt 0\\)\u003c/span>인 상수이다.)\u003c/p>\u003cp class=\"hp\">\u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/83f3a5539b960803e2da45ab.png\" style=\"width:322px;max-width:100%\">\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"1d0efd2d1366266a3370667f5275e154a3d963b45dfc289520c2f3c5efe8b02d"};</script>
