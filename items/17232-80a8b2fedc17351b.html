<script>window.HandStudyRecord={"itemId":17232,"sourceLabel":"2021 평가원 고3 수학확통 6월 29번","adminYear":2021,"grade":3,"month":6,"number":29,"track":"확통","points":4,"scoreStatus":"confirmed_4_direct","questionText":"$1$부터 $6$까지의 자연수가 하나씩 적혀 있는 $6$개의 의자가 있다. 이 $6$개의 의자를 일정한 간격을 두고 원형으로 배열할 때, 서로 이웃한 $2$개의 의자에 적혀 있는 수의 곱이 $12$가 되지 않도록 배열하는 경우의 수를 구하시오. (단, 회전하여 일치하는 것은 같은 것으로 본다.) [4점]","answer":"48","sourceHash":"58d29eb4ba6a14b59069702408eba8b7460610a3ef950dd64b5a3e6ba09e3606","steps":[{"id":"s1","latex":"ij=12:\\quad\\{i,j\\}=\\{2,6\\}\\text{ 또는 }\\{3,4\\}"},{"id":"s2","latex":"\\#\\text{전체 원순열}=(6-1)!=120"},{"id":"s3","latex":"A:\\ 2,6\\text{ 이웃}\\Rightarrow n(A)=4!\\cdot2=48"},{"id":"s4","latex":"B:\\ 3,4\\text{ 이웃}\\Rightarrow n(B)=48"},{"id":"s5","latex":"n(A\\cap B)=3!\\cdot2\\cdot2=24"},{"id":"s6","latex":"n(A\\cup B)=48+48-24=72"},{"id":"s7","latex":"120-72=48"}],"diagram":null,"contentHash":"3f368161f0ebde4b1b3ebe47fd3223453580a24efb900d88052aff36f2e3054e","questionHtml":"\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(1\\)\u003c/span>부터 \u003cspan class=\"heq\">\\(6\\)\u003c/span>까지의 자연수가 하나씩 적혀 있는 \u003cspan class=\"heq\">\\(6\\)\u003c/span>개의 의자가 있다. 이 \u003cspan class=\"heq\">\\(6\\)\u003c/span>개의 의자를 일정한 간격을 두고 원형으로 배열할 때, 서로 이웃한 \u003cspan class=\"heq\">\\(2\\)\u003c/span>개의 의자에 적혀 있는 수의 곱이 \u003cspan class=\"heq\">\\(12\\)\u003c/span>가 되지 않도록 배열하는 경우의 수를 구하시오. (단, 회전하여 일치하는 것은 같은 것으로 본다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/6204a4ed076146e0dd2ef7fa.png\" style=\"width:277px;max-width:100%\">\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"80a8b2fedc17351b30f87a7ad19677dc5e466d0a452a379cdc1e528e33e4f8dc"};</script>
<script>window.HandStudyGuide={"itemId":17232,"sourceHash":"58d29eb4ba6a14b59069702408eba8b7460610a3ef950dd64b5a3e6ba09e3606","contentHash":"3f368161f0ebde4b1b3ebe47fd3223453580a24efb900d88052aff36f2e3054e","overview":{"goal":"곱이 12가 되는 두 이웃 관계를 찾아, 포함과 배제로 금지 배열을 빼요.","firstLook":"1부터 6 사이에서 서로 다른 두 수의 곱이 12인 경우는 \\(2,6\\)과 \\(3,4\\)뿐이에요. 둘 중 하나라도 이웃한 원순열을 세어 전체에서 빼면 돼요.","conditions":[{"label":"원형 배열","meaning":"회전해서 같으면 한 배열이므로 전체는 원순열로 세어요."},{"label":"금지 이웃","meaning":"\\(2,6\\) 또는 \\(3,4\\)가 이웃하면 조건을 어겨요."}]},"chapters":[{"id":"c1","label":"금지되는 두 쌍을 찾고 전체를 세어요","stepIds":["s1","s2"],"question":"곱이 12인 이웃쌍과 전체 원순열은 각각 몇 개인가요?","hint":"1부터 6까지에서 12의 약수쌍을 찾고, 원순열 공식을 써요.","explanation":"서로 다른 두 의자의 수를 곱해 \\(12\\)가 되는 것은 \\(2\\times6\\)과 \\(3\\times4\\)뿐이에요. \\(1\\times12\\)는 12가 없고, 같은 수를 두 번 쓰는 경우도 없어요. 여섯 의자를 원형으로 배열한 전체 경우는 한 의자의 자리를 고정해 나머지 다섯 의자를 놓으므로 \\((6-1)!=120\\)개예요.","check":{"prompt":"\\(1,12\\)를 금지쌍에 넣지 않는 이유는 무엇인가요?","answer":"의자에 적힌 수는 1부터 6까지이므로 12가 적힌 의자가 없어요."}},{"id":"c2","label":"각 금지쌍과 겹친 경우를 세어요","stepIds":["s3","s4","s5"],"question":"두 금지쌍이 모두 이웃한 배열은 왜 \\(24\\)개일까요?","hint":"각 이웃쌍을 한 덩어리로 보고, 덩어리 안의 앞뒤 순서도 세어요.","explanation":"\\(A\\)를 2와 6이 이웃한 배열이라 해요. 두 의자를 한 덩어리로 보면 이 덩어리와 나머지 네 의자, 모두 다섯 대상을 원형으로 배열하므로 \\((5-1)!=4!\\)가지예요. 덩어리 안은 \\(2,6\\) 또는 \\(6,2\\)의 두 방향이어서 \\(n(A)=4!\\times2=48\\)이에요. 같은 이유로 \\(3,4\\)가 이웃한 \\(B\\)도 \\(48\\)개예요. 두 쌍이 모두 이웃하면 두 덩어리와 의자 1, 5의 네 대상을 원형으로 놓아 \\((4-1)!=3!\\)가지이고, 각 덩어리 방향이 두 가지씩이라 \\(n(A\\cap B)=3!\\times2\\times2=24\\)예요.","check":{"prompt":"두 쌍을 모두 덩어리로 만들었을 때 원 위에 놓는 대상은 무엇인가요?","answer":"\\(\\{2,6\\}\\) 덩어리, \\(\\{3,4\\}\\) 덩어리, 의자 1, 의자 5의 네 대상이에요."}},{"id":"c3","label":"금지 배열을 한 번만 빼요","stepIds":["s6","s7"],"question":"왜 \\(48+48\\)에서 \\(24\\)를 한 번 빼나요?","hint":"두 금지쌍이 모두 이웃한 배열은 앞의 두 수에 각각 한 번씩 들어 있어요.","explanation":"\\(A\\)와 \\(B\\)를 단순히 더하면 두 쌍이 모두 이웃한 \\(24\\)개를 두 번 세어요. 따라서 금지 배열은 \\(n(A\\cup B)=48+48-24=72\\)개예요. 문제 조건을 만족하는 배열은 어느 금지쌍도 이웃하지 않아야 하므로 전체 \\(120\\)개에서 빼서 \\(120-72=48\\)개예요.","check":{"prompt":"정답 배열에는 어떤 이웃 관계가 모두 없어야 하나요?","answer":"2와 6의 이웃 관계, 3과 4의 이웃 관계가 모두 없어야 해요."}}],"takeaway":["금지 조건은 먼저 위반 사건을 정확히 찾은 뒤 전체에서 빼요.","원형에서 이웃한 대상은 한 덩어리로 묶되 덩어리 안의 방향도 곱해요.","두 위반 조건이 겹치면 포함과 배제로 중복을 바로잡아요."]};</script>
