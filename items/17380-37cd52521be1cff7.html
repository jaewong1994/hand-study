<script>window.HandStudyGuide={"itemId":17380,"sourceHash":"f54ae20b16e29e4366709a3e71e6fb19e88686abba491ebfbdbcee2bed69134a","contentHash":"c2b20644d4164e79db672d5ec958ecd4a663ff9408744df938d4570e04eb1741","overview":{"goal":"도형의 모든 길이를 \\(n+1\\)로 나타내고, 두 넓이에 같은 보조 영역을 더해 넓이의 차와 극한을 구해요.","firstLook":"교점 \\(Q_n\\)의 좌표를 직접 구하면 계산이 길어져요. 두 넓이가 공유하는 경계를 찾아 같은 영역을 더하면 \\(Q_n\\)이 계산에서 없어져요.","conditions":[{"label":"포물선 위의 점과 원점까지의 거리","meaning":"점의 좌표와 원의 반지름을 모두 \\(n+1\\)의 배수로 정해요."},{"label":"원점에서 원에 그은 접선","meaning":"반지름과 접선의 수직 관계로 필요한 각과 삼각형의 넓이를 정해요."},{"label":"두 색칠 영역의 공통 경계","meaning":"같은 보조 영역을 양쪽에 더해 복잡한 교점의 위치를 구하지 않고도 차를 계산해요."}]},"chapters":[{"id":"c1","label":"점의 좌표와 각 구하기","stepIds":["s1","s2","s3"],"question":"포물선 위의 점을 \\(P_n=(t,\\frac{\\sqrt3}{n+1}t^2)\\)로 두었을 때 거리 조건은 \\(t\\)를 어떻게 정할까요?","hint":"\\(t\\ge0\\)를 기억하고 거리의 제곱을 계산한 뒤 \\((n+1)^2\\)로 묶어 보세요.","explanation":"\\(P_n\\)의 \\(x\\)좌표를 \\(t\\)라 하면 \\(t\\ge0\\)이고, 포물선 식에서 \\(P_n=(t,\\frac{\\sqrt3}{n+1}t^2)\\)예요. 거리 조건을 제곱하면 \\(t^2+\\frac{3t^4}{(n+1)^2}=4(n+1)^2\\)예요. \\(y=\\frac{t^2}{(n+1)^2}\\)로 두면 \\(3y^2+y-4=0\\), 즉 \\((3y+4)(y-1)=0\\)이에요. \\(y\\ge0\\)이므로 \\(y=1\\), 다시 \\(t\\ge0\\)이므로 \\(t=n+1\\)이에요. 따라서 \\(P_n=(n+1,\\sqrt3(n+1))\\), \\(H_n=(n+1,0)\\)이고 원의 반지름은 \\(P_nH_n=\\sqrt3(n+1)\\)예요.\n\n직각삼각형 \\(OP_nH_n\\)에서 밑변과 높이의 비가 \\(1:\\sqrt3\\)이므로 \\(\\angle P_nOH_n=\\pi/3\\)이에요. 또 접점 \\(R_n\\)에서는 \\(P_nR_n\\perp OR_n\\)이고, \\(OP_n=2(n+1)\\), \\(P_nR_n=\\sqrt3(n+1)\\)예요. 그래서 직각삼각형 \\(OP_nR_n\\)에서 \\(OR_n=n+1\\)이고 \\(\\angle R_nP_nO=\\pi/6\\)이에요. \\(\\angle OP_nH_n=\\pi/6\\)이므로 \\(\\angle R_nP_nH_n=\\pi/3\\)이 됩니다.","check":{"prompt":"거리식에서 나온 \\(t=-(n+1)\\)을 쓰지 않는 이유는 무엇인가요?","answer":"곡선 \\(T_n\\)은 \\(x\\ge0\\)인 부분만 주어졌으므로 \\(P_n\\)의 \\(x\\)좌표 \\(t\\)도 0 이상이어야 해요."}},{"id":"c2","label":"공통 영역을 더해 교점 없애기","stepIds":["s4","s5","s6"],"question":"곡선과 호 사이의 공통 영역을 두 넓이에 똑같이 더하면 각각 어떤 익숙한 도형이 되나요?","hint":"첫째는 포물선 아래 영역이고, 둘째는 두 직각삼각형에서 원의 부채꼴을 뺀 영역이에요.","explanation":"곡선 \\(OQ_n\\), 호 \\(Q_nH_n\\), 선분 \\(H_nO\\)로 둘러싸인 넓이를 \\(h_n\\)이라 해요. \\(f(n)\\)에 \\(h_n\\)을 더하면 \\(O\\)에서 \\(P_n\\)까지 포물선 아래의 전체 넓이가 돼요. 따라서 \\(f(n)+h_n=\\int_0^{n+1}\\frac{\\sqrt3}{n+1}x^2\\,dx=\\frac{\\sqrt3}{3}(n+1)^2\\)예요.\n\n\\(g(n)+h_n\\)은 두 삼각형 \\(OP_nH_n\\), \\(OP_nR_n\\)을 합친 넓이에서 중심각 \\(\\angle R_nP_nH_n=\\pi/3\\)인 부채꼴을 뺀 값이에요. 두 삼각형은 각각 넓이가 \\(\\frac12(n+1)\\cdot\\sqrt3(n+1)=\\frac{\\sqrt3}{2}(n+1)^2\\)이므로 합은 \\(\\sqrt3(n+1)^2\\)예요. 부채꼴의 반지름은 \\(\\sqrt3(n+1)\\)이어서 그 넓이는 \\(\\frac12\\cdot3(n+1)^2\\cdot\\frac\\pi3=\\frac\\pi2(n+1)^2\\)예요. 따라서 \\(g(n)+h_n=\\sqrt3(n+1)^2-\\frac\\pi2(n+1)^2\\)예요.","check":{"prompt":"부채꼴 넓이에서 반지름의 제곱은 얼마인가요?","answer":"반지름이 \\(\\sqrt3(n+1)\\)이므로 제곱은 \\(3(n+1)^2\\)예요. 여기에 중심각 \\(\\pi/3\\)을 써야 \\(\\frac\\pi2(n+1)^2\\)가 나와요."}},{"id":"c3","label":"넓이의 차와 극한 계산하기","stepIds":["s7","s8","s9"],"question":"두 식에서 보조 넓이를 없앤 뒤 \\(n^2\\)으로 나누면 어떤 비가 1로 가까워질까요?","hint":"\\(f(n)-g(n)\\)을 먼저 구하고 \\(\\frac{(n+1)^2}{n^2}\\)의 극한을 따로 확인하세요.","explanation":"두 식을 빼면 \\(h_n\\)이 없어져요. 계산하면 \\(f(n)-g(n)=\\left(\\frac\\pi2-\\frac{2\\sqrt3}{3}\\right)(n+1)^2\\)예요. 따라서 \\(\\frac{f(n)-g(n)}{n^2}=\\left(\\frac\\pi2-\\frac{2\\sqrt3}{3}\\right)\\left(1+\\frac1n\\right)^2\\)이고, \\(n\\)이 커질 때 두 번째 인수는 1에 가까워져요. 문제의 극한값 \\(\\frac\\pi2+k\\)와 비교하면 \\(k=-\\frac{2\\sqrt3}{3}\\)예요. 그러므로 \\(60k^2=60\\cdot\\frac43=80\\)이에요.","check":{"prompt":"\\(k\\)가 음수여도 마지막 값이 양수가 되는 이유는 무엇인가요?","answer":"마지막에는 \\(k^2\\)을 구하므로 부호가 사라져요. \\((-2\\sqrt3/3)^2=4/3\\)이에요."}}],"takeaway":["거리 조건을 제곱해 좌표를 구할 때는 곡선의 정의역으로 해의 부호를 걸러요.","교점의 좌표가 복잡하면 두 넓이에 같은 영역을 더하거나 빼서 교점을 계산에서 없앨 수 있어요.","부채꼴을 뺄 때는 중심각과 반지름의 제곱을 각각 확인해요."]};</script>
