(3+1)^2=4\\cdot16=64\\)예요."}}],"takeaway":["곱이 홀수이면 두 인수가 모두 홀수이고, 합이 짝수이면 두 수의 홀짝이 같아요.","비감소인 두 수를 같은 후보 집합에서 고르는 것은 중복조합으로 셀 수 있어요.","양 끝의 실제 값보다 홀수 목록에서의 번호 차를 쓰면 같은 간격의 경우를 한꺼번에 셀 수 있어요."]};</script>
