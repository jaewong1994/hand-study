<script>window.HandStudyRecord={"itemId":18348,"sourceLabel":"2025 평가원 고3 수학기하 9월 20번","adminYear":2025,"grade":3,"month":9,"number":20,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 사각형 ${{ABCD}}\\,$가 한 원에 내접하고 ${ \\overline{{AB}}} \\,:\\, { \\overline{{CD}}}=1\\,:\\,3\\,$, ${ \\overline{{BC}}} \u003c { \\overline{{AD}}}\\,$일 때, 직선 ${{AB}}\\,$와 직선 ${{CD}}\\,$가 만나는 점을 ${{P}}\\,$라 하자.\n다음은 ${ \\overline{{PB}}} \\,:\\, { \\overline{{PC}}} \\,:\\, { \\overline{{BC}}}=7\\,:\\,5\\,:\\, \\sqrt{14}\\,$이고 ${ \\overline{{AD}}}=4 \\sqrt{13}\\,$일 때, 삼각형 ${{BPC}}\\,$의 외접원의 반지름의 길이를 구하는 과정이다.\n$\\angle {{BPC}}= \\theta\\,$라 할 때, ${ \\overline{{PB}}} \\,:\\, { \\overline{{PC}}} \\,:\\, { \\overline{{BC}}}=7\\,:\\,5\\,:\\, \\sqrt{14}\\,$이므로삼각형 ${{BPC}}\\,$에서 코사인법칙에 의하여 $\\cos\\, \\theta =\\frac{6}{7}\\,$이다.${ \\overline{{PB}}} \\,:\\, { \\overline{{PC}}}=7\\,:\\,5\\,$에서 ${ \\overline{{PB}}}=7k\\,$, ${ \\overline{{PC}}}=5k\\,$,${ \\overline{{AB}}} \\,:\\, { \\overline{{CD}}}=1\\,:\\,3\\,$에서 ${ \\overline{{AB}}}=l\\,$, ${ \\overline{{CD}}}=3l\\,$이라 하자.원의 성질에 의하여삼각형 ${{BPC}}\\,$와 삼각형 ${{DPA}}\\,$가 서로 닮음이므로${ \\overline{{PB}}} \\,:\\, { \\overline{{PC}}}={ \\overline{{PD}}} \\,:\\, { \\overline{{PA}}}\\,$이고, $l= box{\\, \\left(가 \\right)\\,}\\, \\times k\\,$이다.삼각형 ${{BPC}}\\,$와 삼각형 ${{DPA}}\\,$의 닮음비가 $1\\,:\\, box{\\, \\left(나 \\right)\\,}\\,$이므로${ \\overline{{BC}}}=\\frac{1}{ \\, box{\\, \\left(나 \\right)\\,}\\, } \\times { \\overline{{AD}}}\\,$이다.따라서 삼각형 ${{BPC}}\\,$의 외접원의 반지름의 길이를 $R\\,$라 할 때, 삼각형 ${{BPC}}\\,$에서 사인법칙에 의하여 $R\\,= box{\\, \\left(다 \\right)\\,}\\,$이다.\n위의 (가), (나), (다)에 알맞은 수를 각각 $p\\,$, $q\\,$, $r\\,$라 할 때, $p+q+r\\,$의 값을 구하시오. [4점]","answer":"12","sourceHash":"9d2bccd8ba59da2bf9e79a46c2d80be4cd4ebcccc558a10216d5cd706557bb76","steps":[{"id":"s1","latex":"PB=7k,\\quad PC=5k,\\quad AB=l,\\quad CD=3l"},{"id":"s2","latex":"PA\\cdot PB=PC\\cdot PD"},{"id":"s3","latex":"(7k+l)7k=(5k+3l)5k\\Rightarrow l=3k\\Rightarrow p=3"},{"id":"s4","lat
