<script>window.HandStudyRecord={"itemId":11646,"sourceLabel":"2020 교육청 고1 수학 11월 17번","adminYear":2020,"grade":1,"month":11,"number":17,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"좌표평면 위에 원 $C\\,:\\,x^{2} +y^{2} =r^{2} \\,(r\\gt 0)$과 직선 \n$l\\,:\\,2x-2y+ \\sqrt{6} r=0$이 있다. 원 $C\\,$와 직선 $l$이 만나는 두 점을 각각 $A,\\,B$라 할 때, 호 $A B$와 선분 $A B$로 둘러싸인 부분 중에서 원점 $O$를 포함하지 않는 부분의 넓이를 $S(r)$라 하자. 다음은 $S(r)$를 구하는 과정이다.\n[그림 1]\n위의 (가), (나)에 알맞은 식을 각각 $f(r)$, $g(r)$라 하고 (다)에 알맞은 수를 $k$라 할 때, $f\\, \\left( \\dfrac{1}{k} \\right) \\times g \\left( \\dfrac{1}{k} \\right)$의 값은? [4점]\n① $57$ ② $63$ ③ $69$ ④ $75$ ⑤ $81$","answer":"⑤","sourceHash":"634fe2c058a2b8239ac9ee3122ed267f6a499597b04f72b555a5dd41e907dc75","steps":[{"id":"s1","latex":"OH=\\frac{|\\sqrt6r|}{\\sqrt{2^2+(-2)^2}}=\\frac{\\sqrt3}{2}r=f(r)"},{"id":"s2","latex":"HA=HB=\\sqrt{r^2-OH^2}=\\frac r2\\quad\\Rightarrow\\quad AB=r"},{"id":"s3","latex":"OA=OB=AB=r\\quad\\Rightarrow\\quad\\angle AOB=60^\\circ"},{"id":"s4","latex":"g(r)=[\\triangle OAB]=\\frac12\\cdot r\\cdot\\frac{\\sqrt3}{2}r=\\frac{\\sqrt3}{4}r^2"},{"id":"s5","latex":"S(r)=\\frac{60^\\circ}{360^\\circ}\\pi r^2-g(r)\\quad\\Rightarrow\\quad k=\\frac16"},{"id":"s6","latex":"f(6)g(6)=3\\sqrt3\\cdot9\\sqrt3=81"}],"diagram":null,"contentHash":"64889176fcd565ed9823ac9ecf2a496619dd327edca2a9346cd41d90eea7b2d7","questionHtml":"\u003cp class=\"hp\">좌표평면 위에 원 \u003cspan class=\"heq\">\\(C\\,:\\,x^{2} +y^{2} =r^{2} \\,(r\\gt 0)\\)\u003c/span>과 직선 \u003cbr>\u003cspan class=\"heq\">\\(l\\,:\\,2x-2y+ \\sqrt{6} r=0\\)\u003c/span>이 있다. 원 \u003cspan class=\"heq\">\\(C\\,\\)\u003c/span>와 직선 \u003cspan class=\"heq\">\\(l\\)\u003c/span>이 만나는 두 점을 각각 \u003cspan class=\"heq\">\\(A,\\,B\\)\u003c/span>라 할 때, 호 \u003cspan class=\"heq\">\\(A B\\)\u003c/span>와 선분 \u003cspan class=\"heq\">\\(A B\\)\u003c/span>로 둘러싸인 부분 중에서 원점 \u003cspan class=\"heq\">\\(O\\)\u003c/span>를 포함하지 않는 부분의 넓이를 \u003cspan class=\"heq\">\\(S(r)\\)\u003c/span>라 하자. 다음은 \u003cspan class=
