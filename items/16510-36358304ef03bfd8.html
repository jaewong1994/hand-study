<script>window.HandStudyRecord={"itemId":16510,"sourceLabel":"2019 평가원 고3 수리가형 6월 20번","adminYear":2019,"grade":3,"month":6,"number":20,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"실수 전체의 집합에서 미분가능한 함수 $f(x)$가 모든 실수 $x$에 대하여 다음 조건을 만족시킨다.\n(가) $f(x) > 0$\n(나) $\\ln f(x) + 2 \\int_{0}^{x}(x- t)f(t)dt= 0$\n<보기>에서 옳은 것만을 있는 대로 고른 것은? [4점]\n<보기>\nㄱ. $x > 0$에서 함수 $f(x)$는 감소한다.\nㄴ. 함수 $f(x)$의 최댓값은 $1$이다.\nㄷ. 함수 $F (x)$를 $F (x) = \\int_{0}^{x}f(t)dt$라 할 때, $f(1) + \\left\\{F (1) \\right\\}^{2}= 1$이다.\n① ㄱ ② ㄱ, ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","answer":"⑤","sourceHash":"5db62dfaf1721ba2a53a7b435addf2a6513b7f371cc554cffb7e903d9bd88291","steps":[{"id":"s1","latex":"F(x)=\\int_0^x f(t)\\,dt"},{"id":"s2","latex":"\\dfrac{d}{dx}\\!\\left\\{\\ln f(x)+2\\int_0^x(x-t)f(t)\\,dt\\right\\}=\\dfrac{f'(x)}{f(x)}+2F(x)=0"},{"id":"s3","latex":"f'(x)=-2f(x)F(x)"},{"id":"s4","latex":"x>0\\Rightarrow F(x)>0\\Rightarrow f'(x)<0\\qquad\\text{(첫째)}"},{"id":"s5","latex":"x<0\\Rightarrow f'(x)>0,\\quad x>0\\Rightarrow f'(x)<0,\\quad f(0)=1\\Rightarrow f(x)\\le f(0)=1\\ (\\forall x)\\qquad\\text{(둘째)}"},{"id":"s6","latex":"\\{f(x)+F(x)^2\\}'=f'(x)+2f(x)F(x)=0"},{"id":"s7","latex":"f(1)+F(1)^2=f(0)+F(0)^2=1\\qquad\\text{(셋째)}"}],"diagram":null,"contentHash":"8a375147f8f3870c5401139e11ff8306dbfd81a29fb66a189424a9474e4c04af","questionHtml":"<p class=\"hp\">실수 전체의 집합에서 미분가능한 함수 <span class=\"heq\">\\(f(x)\\)<\/span>가 모든 실수 <span class=\"heq\">\\(x\\)<\/span>에 대하여 다음 조건을 만족시킨다.<\/p><div class=\"hbox\"><p class=\"hp\">(가) <span class=\"heq\">\\(f(x) \\gt  0\\)<\/span><\/p><p class=\"hp\">(나) <span class=\"heq\">\\(\\ln f(x) + 2 \\int_{0}^{x}(x- t)f(t)dt= 0\\)<\/span><\/p><\/div><p class=\"hp\">&lt;보기&gt;에서 옳은 것만을 있는 대로 고른 것은? <span class=\"hscore\">[4점]<\/span><\/p><table class=\"htbl\"><tr><td style=\"width:162px;border-top:none;border-bottom:1px solid #333;border-left:none;border-right:none\">&nbsp;<\/td><td rowspan=\"2\" style=\"width:81px;border-top:none;border-bottom:none <script>window.HandStudyGuide={"itemId":16510,"sourceHash":"5db62dfaf1721ba2a53a7b435addf2a6513b7f371cc554cffb7e903d9bd88291","contentHash":"8a375147f8f3870c5401139e11ff8306dbfd81a29fb66a189424a9474e4c04af","overview":{"firstLook":"\\(F(x)=\\int_0^x f(t)dt\\)라 두고 조건을 미분하면 \\(f^\\prime(x)/f(x)+2F(x)=0\\), 즉 \\(f^\\prime=-2fF\\)예요. \\(f>0\\)이므로 \\(x>0\\)에서는 \\(F>0\\), 따라서 \\(f^\\prime<0\\)라 ㄱ은 참이에요.","goal":"적분 조건을 미분해 함수의 증가·감소와 보존되는 식을 찾아요.","conditions":[{"meaning":"d/dx \\(\\int _0^x(x-t)f(t)dt=\\int _0^x\\) \\(f(t)dt=F(x)\\)예요.","label":"적분 조건을 미분해요"},{"meaning":"\\(F(x)=-\\int _x^0f(t)dt\\)이고 f>0이라 음수예요.","label":"양쪽에서의 증가·감소를 정해요"}]},"chapters":[{"question":"적분항을 미분하면 왜 F(x)가 나오나요?","check":{"prompt":"적분항을 미분하면 왜 F(x)가 나오나요?","answer":"d/dx \\(\\int _0^x(x-t)f(t)dt=\\int _0^x\\) \\(f(t)dt=F(x)\\)예요."},"stepIds":["s1","s2","s3"],"id":"c1","explanation":"\\(F(x)=\\int_0^x f(t)dt\\)라 두고 조건을 미분하면 \\(f^\\prime(x)/f(x)+2F(x)=0\\), 즉 \\(f^\\prime=-2fF\\)예요. \\(f>0\\)이므로 \\(x>0\\)에서는 \\(F>0\\), 따라서 \\(f^\\prime<0\\)라 ㄱ은 참이에요.","hint":"Leibniz 계산을 이 문제의 적분에 직접 적용해요.","label":"적분 조건을 미분해요"},{"question":"x<0에서 F(x)가 음수인 이유는 무엇인가요?","check":{"prompt":"x<0에서 F(x)가 음수인 이유는 무엇인가요?","answer":"\\(F(x)=-\\int _x^0f(t)dt\\)이고 f>0이라 음수예요."},"stepIds":["s4","s5"],"id":"c2","explanation":"\\(x<0\\)에서는 적분 방향 때문에 \\(F(x)<0\\)이고 \\(f^\\prime(x)>0\\)이에요. 또 원래 식에 \\(x=0\\)을 넣으면 \\(\\ln f(0)=0\\), 양수 조건에서 \\(f(0)=1\\)이에요. 양쪽에서 0을 향해 증가했다가 감소하므로 최댓값은 1이고 ㄴ도 참이에요.","hint":"0부터 x까지의 적분 방향을 뒤집어 보세요.","label":"양쪽에서의 증가·감소를 정해요"},{"question":"\\(f+F^2\\)가 일정한 값은 얼마인가요?","check":{"prompt":"\\(f+F^2\\)가 일정한 값은 얼마인가요?","answer":"\\(f(0)=1,F(0)=0\\)이므로 일정한 값은 1이에요."},"stepIds":["s6","s7"],"id":"c3","explanation":"\\(\\{f+F^2\\}^\\prime=f^\\prime+2FF^\\prime=f^\\prime+2Ff=0\\)이므로 이 식은 일정해요. \\(x=0\\)에서 값이 1이므로 \\(x=1\\)에서도 \\(f(1)+F(1)^2=1\\), ㄷ도 참이라 답은 ⑤예요.","hint":"\\(x=0\\)의 f와 F를 원래 조건에서 구해요.","label":"보존되는 식을 찾아요"}],"takeaway":["f>0이라 로그 미분과 부호 판단이 가능하다.","x<0에서 F의 부호는 적분 방향 때문에 음수다.","적분으로 정의한
