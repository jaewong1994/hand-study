<script>window.HandStudyRecord={"itemId":16510,"sourceLabel":"2019 평가원 고3 수리가형 6월 20번","adminYear":2019,"grade":3,"month":6,"number":20,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"실수 전체의 집합에서 미분가능한 함수 $f(x)$가 모든 실수 $x$에 대하여 다음 조건을 만족시킨다.\n(가) $f(x) > 0$\n(나) $\\ln f(x) + 2 \\int_{0}^{x}(x- t)f(t)dt= 0$\n\u003c보기>에서 옳은 것만을 있는 대로 고른 것은? [4점]\n\u003c보기>\nㄱ. $x > 0$에서 함수 $f(x)$는 감소한다.\nㄴ. 함수 $f(x)$의 최댓값은 $1$이다.\nㄷ. 함수 $F (x)$를 $F (x) = \\int_{0}^{x}f(t)dt$라 할 때, $f(1) + \\left\\{F (1) \\right\\}^{2}= 1$이다.\n① ㄱ ② ㄱ, ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","answer":"⑤","sourceHash":"5db62dfaf1721ba2a53a7b435addf2a6513b7f371cc554cffb7e903d9bd88291","steps":[{"id":"s1","latex":"F(x)=\\int_0^x f(t)\\,dt"},{"id":"s2","latex":"\\dfrac{d}{dx}\\!\\left\\{\\ln f(x)+2\\int_0^x(x-t)f(t)\\,dt\\right\\}=\\dfrac{f'(x)}{f(x)}+2F(x)=0"},{"id":"s3","latex":"f'(x)=-2f(x)F(x)"},{"id":"s4","latex":"x>0\\Rightarrow F(x)>0\\Rightarrow f'(x)\u003c0\\qquad\\text{(첫째)}"},{"id":"s5","latex":"x\u003c0\\Rightarrow F(x)\u003c0\\Rightarrow f'(x)>0,\\quad f(0)=1\\Rightarrow\\max f=1\\qquad\\text{(둘째)}"},{"id":"s6","latex":"\\{f(x)+F(x)^2\\}'=f'(x)+2f(x)F(x)=0"},{"id":"s7","latex":"f(1)+F(1)^2=f(0)+F(0)^2=1\\qquad\\text{(셋째)}"}],"diagram":null,"contentHash":"2f6dfc46e91cdc4f0419b23516c6bc0f5e59b93272608bf44c08cfcc7336becd","questionHtml":"\u003cp class=\"hp\">실수 전체의 집합에서 미분가능한 함수 \u003cspan class=\"heq\">\\(f(x)\\)\u003c/span>가 모든 실수 \u003cspan class=\"heq\">\\(x\\)\u003c/span>에 대하여 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) \u003cspan class=\"heq\">\\(f(x) \\gt  0\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">(나) \u003cspan class=\"heq\">\\(\\ln f(x) + 2 \\int_{0}^{x}(x- t)f(t)dt= 0\\)\u003c/span>\u003c/p>\u003c/div>\u003cp class=\"hp\">&lt;보기&gt;에서 옳은 것만을 있는 대로 고른 것은? \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003ctable class=\"htbl\">\u003ctr>\u003ctd style=\"width:162px;border-top:none;border-bottom:1px solid #333;border-left:none;border-
