<script>window.HandStudyRecord={"itemId":17206,"sourceLabel":"2021 평가원 고3 수학기하 9월 30번","adminYear":2021,"grade":3,"month":9,"number":30,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"좌표평면에서 세 점 $A \\left( -3,\\,1 \\right)$, $B \\left( 0,\\,2 \\right)$, $C \\left( 1,\\,0 \\right)$에 대하여 두 점 $P,\\,Q$가\n $|\\, {\\vec{A P}} \\,|=1$, $|\\, {\\vec{ BQ }} \\,|=2$, ${\\vec{ AP }}  \\cdot  {\\vec{O C}} \\geq \\frac{\\sqrt{2}}{2}$\n를 만족시킬 때, ${\\vec{ AP }}  \\cdot  {\\vec{ AQ }}$의 값이 최소가 되도록 하는 두 점 $P,\\,Q$를 각각 $P _{0}$, $Q _{0}$이라 하자. 선분 $A P _{0}$ 위의 점 $X$에 대하여 ${\\vec{ BX }}  \\cdot  {\\vec{ BQ _{0} }} \\geq 1$일 때, $|\\, {\\vec{ Q _{0} X }} \\,| ^{2}$의 최댓값은 $\\frac{q}{p}$이다. $p+q$의 값을 구하시오. (단, $O$는 원점이고, $p$와 $q$는 서로소인 자연수이다.) [4점]","answer":"45","sourceHash":"9c53fcfdfc194b30c076d1874602507ec8ef4dd156477d98da9c4ddba206290d","steps":[{"id":"s1","latex":"AP=(\\cos\\theta,\\sin\\theta),\\quad-\\frac\\pi4\\le\\theta\\le\\frac\\pi4"},{"id":"s2","latex":"AQ=AB+BQ,\\quad AP\\cdot BQ\\ge-2"},{"id":"s3","latex":"AP\\cdot AB=3\\cos\\theta+\\sin\\theta\\ge\\sqrt2"},{"id":"s4","latex":"AP\\cdot AQ\\text{의 최솟값은 }\\theta=-\\frac\\pi4\\text{일 때 }\\sqrt2-2"},{"id":"s5","latex":"AP_0=(\\frac{\\sqrt2}2,-\\frac{\\sqrt2}2),\\quad BQ_0=(-\\sqrt2,\\sqrt2)"},{"id":"s6","latex":"X\\in AP_0:\\ AX=tAP_0,\\quad0\\le t\\le\\sqrt2-\\frac12"},{"id":"s7","latex":"Q_0X^2=t^2+2(2-\\sqrt2)t+14-4\\sqrt2"},{"id":"s8","latex":"Q_0X^2\\text{는 }t=\\sqrt2-\\frac12\\text{일 때 최댓값 }\\frac{41}{4}\\text{를 갖는다}"},{"id":"s9","latex":"p+q=45"}],"diagram":null,"contentHash":"62fb1fec02d0c19a739793de4acb0eec67dff3176b84fccacd9aba55a2d61c0b","questionHtml":"<p class=\"hp\">좌표평면에서 세 점 <span class=\"heq\">\\(A \\left( -3,\\,1 \\right)\\)<\/span>, <span class=\"heq\">\\(B \\left( 0,\\,2 \\right)\\)<\/span>, <span class=\"heq\">\\(C \\left( 1,\\,0 \\right)\\)<\/span>에 대하여 두 점 <span class=\"heq\">\\(P,\\,Q\\)<\/span>가<\/p><p class=\"hp htall\">&emsp;<span class=\"heq\">\\(|\\, {\\vec{A P}} \\,|=1\\) <script>window.HandStudyGuide={"itemId":17206,"sourceHash":"9c53fcfdfc194b30c076d1874602507ec8ef4dd156477d98da9c4ddba206290d","contentHash":"62fb1fec02d0c19a739793de4acb0eec67dff3176b84fccacd9aba55a2d61c0b","overview":{"goal":"먼저 두 벡터의 내적을 가장 작게 만드는 방향을 정하고, 그때의 선분 위 허용 범위에서 두 점 사이 거리의 최댓값을 구합니다.","firstLook":"Q는 P의 방향이 정해지면 원 위에서 반대 방향으로 잡을 때 내적을 가장 작게 만들 수 있습니다. 그 뒤 X는 한 변수로 나타냅니다.","conditions":[{"label":"점 P의 방향","meaning":"길이 1인 벡터 AP의 가로 성분이 주어진 양수 이상이어야 합니다."},{"label":"점 Q의 원","meaning":"BQ의 길이가 2이므로 AP 방향과 반대로 놓을 때 내적이 가장 작아집니다."}]},"chapters":[{"id":"c1","label":"내적의 최솟값을 만드는 두 점을 찾습니다","stepIds":["s1","s2","s3","s4","s5"],"question":"점 P의 방향과 점 Q의 위치는 왜 끝점에서 정해지나요?","hint":"\\(AP=(\\cos\\theta,\\sin\\theta)\\)로 놓고 두 내적을 따로 낮추세요.","explanation":"\\(|AP|=1\\)이고 \\(AP\\cdot OC\\ge\\sqrt2/2\\)이므로 \\(AP=(\\cos\\theta,\\sin\\theta)\\), \\(-\\pi/4\\le\\theta\\le\\pi/4\\)입니다. \\(AQ=AB+BQ\\)이므로 \\(AP\\cdot AQ=AP\\cdot AB+AP\\cdot BQ\\)입니다. \\(|BQ|=2\\)에서 둘째 항의 최솟값은 BQ가 AP와 반대 방향일 때의 \\(-2\\)입니다. 또 \\(AB=(3,1)\\)이므로 첫째 항은 \\(3\\cos\\theta+\\sin\\theta\\)이고 주어진 구간에서 최솟값은 \\(\\theta=-\\pi/4\\)일 때 \\(\\sqrt2\\)입니다. 따라서 \\(AP_0=(\\sqrt2/2,-\\sqrt2/2)\\), \\(BQ_0=(-\\sqrt2,\\sqrt2)\\)입니다.","check":{"prompt":"BQ를 AP와 반대 방향으로 잡을 수 있는 이유는 무엇인가요?","answer":"Q는 중심 B, 반지름 2인 원 전체를 움직이므로 길이 2인 모든 방향의 BQ가 가능합니다."}},{"id":"c2","label":"점 X의 허용 구간을 구합니다","stepIds":["s6"],"question":"조건 \\(BX\\cdot BQ_0\\ge1\\)은 변수의 범위를 어떻게 줄이나요?","hint":"\\(AX=tAP_0\\)로 놓고 B에서 X로 가는 벡터를 쓰세요.","explanation":"선분 \\(AP_0\\) 위이므로 \\(AX=tAP_0\\), \\(0\\le t\\le1\\)입니다. \\(BX=BA+AX=(-3,-1)+t(\\sqrt2/2,-\\sqrt2/2)\\)이고 \\(BQ_0=(-\\sqrt2,\\sqrt2)\\)이므로 \\(BX\\cdot BQ_0=2\\sqrt2-2t\\)입니다. 이것이 1 이상이어서 \\(0\\le t\\le\\sqrt2-1/2\\)가 됩니다. 이 윗값은 1보다 작으므로 원래 선분 범위와도 맞습니다.","check":{"prompt":"왜 최종 윗값을 1과 다시 비교해야 하나요?","answer":"X가 선분 \\(AP_0\\) 위라는 조건이 원래 \\(t\\le1\\)을 요구하므로 내적 조건에서 얻은 범위와 함께 만족해야 하기 때문입니다."}},{"id":"c3","label":"거리의 제곱을 끝점에서 비교합니다","stepIds":["s7","s8","s9"],"question":"거리의 제곱이 어느 끝점에서 가장 큰가요?","hint":"이차식의 증가 여부를 구간에서 확인하세요.","explanation":"좌표를 넣으면 \\(Q_0X^2=t^2+2(2-\\sqrt2)t+14-4\\sqrt2\\)입니다. \\(t\\ge0\\)에서 일차항의 계수도 양수이므로 이 식은 증가합니다. 따라서 \\(t=\\sqrt2-1/2\\)에서 가장 크고, 대입하면 \\(41/4\\)입니다. 기약분수이므로 \\(p+q=4+41=45\\)입니다.","check":{"prompt":"이차함수의 꼭짓점을 따로 찾지 않아도 되는 이유는 무엇인가요?","answer":"도함수 \\(2t+4-2\\sqrt2\\)가 허용 구간 전체에서 양수여서 계속 증가하기 때문입니다."}}],"takeaway":["두 벡터의 내적은 한 벡터를 다른 벡터와 반대 방향으로 놓을 때 가장 작아집니다.","선분 위의 점은 한 변수로 나타낸 뒤 원래 선분 범위와 추가 조건의 범위를 함께 교차 확인합니다."]};</script>
