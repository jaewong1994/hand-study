<script>window.HandStudyRecord={"adminYear":2022,"answer":"49","contentHash":"c94753101cbe317d01ee04b36a85a7320ba65d81139508698549d5a5803e24a6","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24852,"month":11,"number":29,"points":4,"preview":false,"questionHtml":"\u003cp>앞면에는 \u003cspan class=\"heq\">\\(1\\)\u003c/span>부터 \u003cspan class=\"heq\">\\(6\\)\u003c/span>까지의 자연수가 하나씩 적혀 있고 뒷면에는 모두 \u003cspan class=\"heq\">\\(0\\)\u003c/span>이 하나씩 적혀 있는 \u003cspan class=\"heq\">\\(6\\)\u003c/span>장의 카드가 있다. 이 \u003cspan class=\"heq\">\\(6\\)\u003c/span>장의 카드가 \u003cspan class=\"heq\">\\(6\\)\u003c/span> 이하의 자연수 \u003cspan class=\"heq\">\\(k\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(k\\)\u003c/span>번째 자리에 자연수 \u003cspan class=\"heq\">\\(k\\)\u003c/span>가 보이도록 놓여 있다.\u003c/p>\u003cp>이 \u003cspan class=\"heq\">\\(6\\)\u003c/span>장의 카드와 한 개의 주사위를 사용하여 다음 시행을 한다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp>주사위를 한 번 던져 나온 눈의 수가 \u003cspan class=\"heq\">\\(k\\)\u003c/span>이면\u003cspan class=\"heq\">\\(k\\)\u003c/span>번째 자리에 놓여 있는 카드를 한 번 뒤집어 제자리에 놓는다.\u003c/p>\u003c/div>\u003cp>위의 시행을 \u003cspan class=\"heq\">\\(3\\)\u003c/span>번 반복한 후 \u003cspan class=\"heq\">\\(6\\)\u003c/span>장의 카드에 보이는 모든 수의 합이 짝수일 때, 주사위의 \u003cspan class=\"heq\">\\(1\\)\u003c/span>의 눈이 한 번만 나왔을 확률은 \u003cspan class=\"heq\">\\(\\frac{q}{p}\\)\u003c/span>이다. \u003cspan class=\"heq\">\\(p+q\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(p\\)\u003c/span>와 \u003cspan class=\"heq\">\\(q\\)\u003c/span>는 서로소인 자연수이다.) [4점]\u003c/p>","questionText":"앞면에는 $1$부터 $6$까지의 자연수가 하나씩 적혀 있고 뒷면에는 모두 $0$이 하나씩 적혀 있는 $6$장의 카드가 있다. 이 $6$장의 카드가 그림과 같이 $6$ 이하의 자연수 $k$에 대하여 $k$번째 자리에 자연수 $k$가 보이도록 놓여 있다.\n이 $6$장의 카드와 한 개의 주사위를 사용하여 다음 시행을 한다.\n주사위를 한 번 던져 나온 눈의 수가 $k$이면$k$번째 자리에 놓여 있는 카드를 한 번 뒤집어 제자리에 놓는다.\n위의 시행을 $3$번 반복한 후 $6$장의 카드에 보이는 모든 수의 합이 짝수일 때, 주사위의 $1$의 눈이 한 번만 나왔을 확률은 $\\frac{q}{p}$이다. $p+q$의 값을 구하시오. (단, $p$와 $q$는 서로소인 자연수이다.) [4점]","sourceHash":"6f383b254eb191dd68c9f985e7669a834aae9573890d5020582d5bbf0ed76679","sourceKind":"csat","sourceLabel":"2022년 시행 수능 · 2023학년도 · 확률과 통계 · 29번","steps":[{"id":"s1","latex":"A=\\text{마지막 합이 짝수인 사건},\\quad B=\\text{1의 눈이 한 번만 나온 사건}"},{"id":"s2","latex":"\\text{처음 합은 }21\\text{이며 홀수 카드가 뒤집힐 때마다 합의 홀짝이 바뀐다.}"},{"id":"s3","latex":"A\\ \\Leftrightarrow\\ \\text{세 시행 중 홀수 눈이 1번 또는 3번}"},{"id":"s4","latex":"\\mathrm P(A)=\\frac{{}_3\\mathrm C_1+{}_3\\mathrm C_3}{2^3}=\\frac12"},{"id":"s5","latex":"A\\cap B:\\quad\\text{1이 나온 위치를 고른 뒤 나머지 두 눈이 모두 짝수 또는 모두 }3,5"},{"id":"s6","latex":"\\mathrm P(A\\cap B)=3\\cdot\\frac16\\left\\{\\left(\\frac36\\right)^2+\\left(\\frac26\\right)^2\\right\\}=\\frac{13}{72}"},{"id":"s7","latex":"\\mathrm P(B\\mid A)=\\frac{13/72}{1/2}=\\frac{13}{36}"},{"id":"s8","latex":"\\boxed{p+q=36+13=49}"}],"track":"확률과 통계"};</script>
