  <script>window.HandStudyRecord={"itemId":16479,"sourceLabel":"2019 교육청 고3 수리나형 7월 19번","adminYear":2019,"grade":3,"month":7,"number":19,"track":"수리나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 한 변의 길이가 $3\\,$인 정삼각형 $A_1 B_1 C_1\\,$이 있다. 세 선분 $A_1 B_1 \\,$, $B_1 C_1 \\,$, $C_1 A_1\\,$을 $1:2\\,$로 내분하는 점을 각각 $A_2 \\,$, $B_2\\,$, $C_2 \\,$라 하자. 선분 $B _{2} C _{1} \\,$을 지름으로 하는 반원의 내부와 선분 $B_2 C_2\\,$를 지름으로 하는 반원의 외부의 공통부분인 모양의 도형에 색칠하여 얻은 그림을 $R_1\\,$이라 하자. 그림 $R_1 \\,$에서 세 선분 $A_2 B_2 \\,$, $B_2 C_2 \\,$, $C_2 A_2\\,$를 $1:2\\,$로 내분하는 점을 각각 $A_3 \\,$, $B _{3} \\,$, $C_3 \\,$이라 하자. 선분 $B _{3} C _{2} \\,$를 지름으로 하는 반원의 내부와 선분 $B _{3} C _{3} \\,$을 지름으로 하는 반원의 외부의 공통부분인 모양의 도형에 색칠하여 얻은 그림을 $R _{2} \\,$라 하자. 이와 같은 과정을 계속하여 $n\\,$번째 얻은 그림 $R_n \\,$에 색칠되어 있는 부분의 넓이를 $S_n\\,$이라 할 때, $\\lim _{n\\, -> \\, \\infty } {S _{n}} \\,$의 값은? [4점]\n$A _{1}$$B _{1}$$C _{1}$$B _{2}$$A _{2}$$C _{2}$$B _{1}$$C _{1}$$B _{2}$$A _{2}$$A _{3}$$C _{2}$$C _{3}$$B _{3}$$A _{1}$$R_1$$R_2$$\\cdots$$R_3$$\\cdots$\n① $\\frac{11 \\pi +8 \\sqrt{3}}{32}$ ② $\\frac{11 \\pi +9 \\sqrt{3}}{32}$ ③ $\\frac{3 \\pi +2 \\sqrt{3}}{8}$\n④ $\\frac{12 \\pi +9 \\sqrt{3}}{32}$ ⑤ $\\frac{3 \\pi +3 \\sqrt{3}}{8}$","answer":"④","sourceHash":"734f036940f69c00522dd42578b33cb2ea818286b98efdead12d4d62d062851a","steps":[{"id":"s1","latex":"B_2C_1=2,\\ C_1C_2=1\\Rightarrow B_2C_2=\\sqrt3"},{"id":"s2","latex":"\\triangle B_2C_1C_2\\text{는 }C_2\\text{가 직각}"},{"id":"s3","latex":"\\text{첫 색칠 넓이}=\\frac\\pi2-\\frac\\pi4+\\frac{3\\sqrt3}{16}=\\frac{4\\pi+3\\sqrt3}{16}"},{"id":"s4","latex":"a_{n+1}=\\frac1{\\sqrt3}a_n\\Rightarrow\\text{넓이비}=\\frac13"},{"id":"s5","latex":"\\lim S_n=\\frac{(4\\pi+3\\sqrt3)/16}{1-1/3}=\\frac{12\\pi+9\\sqrt3}{32}"}],"diagram":null,"contentHash":"aa457ae3a0dfe5f6cf04bcb68086a959e64e671b3176c4e66027a70d263a44c0","questionHtml":"\u003cp class=\"hp\">그림과 같이 한 변의 길이가 \u003cspan class=\"heq\">\\(3\\,\\)\u003c/span>인 정삼각형 \u003cspan class=\"heq\">\\(A_{1} B_{1} C_{1}\\,\\)\u003c/span>이 있다. 세 선분 \u003cspan class=\"heq\">\\(A_{1} B_{1} \\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(B_{1} C_{1} \\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(C_{1} A_{1}\\,\\)\u003c/span>을 \u003cspan class=\"heq\">\\(1:2\\,\\)\u003c/span>로 내분하는 점을 각각 \u003cspan class=\"heq\">\\(A_{2} \\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(B_{2}\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(C_{2} \\,\\)\u003c/span>라 하자. 선분 \u003cspan class=\"heq\">\\(B_{2} C_{1} \\,\\)\u003c/span>을 지름으로 하는 반원의 내부와 선분 \u003cspan class=\"heq\">\\(B_{2} C_{2}\\,\\)\u003c/span>를 지름으로 하는 반원의 외부의 공통부분인 \u003cimg class=\"hfig\" src=\"../assets/figures/0b8182a2f8206394b2734068.png\" style=\"width:35px;max-width:100%\">모양의 도형에 색칠하여 얻은 그림을 \u003cspan class=\"heq\">\\(R_{1}\\,\\)\u003c/span>이라 하자. \u003cbr>그림 \u003cspan class=\"heq\">\\(R_{1} \\,\\)\u003c/span>에서 세 선분 \u003cspan class=\"heq\">\\(A_{2} B_{2} \\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(B_{2} C_{2} \\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(C_{2} A_{2}\\,\\)\u003c/span>를 \u003cspan class=\"heq\">\\(1:2\\,\\)\u003c/span>로 내분하는 점을 각각 \u003cspan class=\"heq\">\\(A_{3} \\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(B_{3} \\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(C_{3} \\,\\)\u003c/span>이라 하자. 선분 \u003cspan class=\"heq\">\\(B_{3} C_{2} \\,\\)\u003c/span>를 지름으로 하는 반원의 내부와 선분 \u003cspan class=\"heq\">\\(B_{3} C_{3} \\,\\)\u003c/span>을 지름으로 하는 반원의 외부의 공통부분인 \u003cimg class=\"hfig\" src=\"../assets/figures/0b8182a2f8206394b2734068.png\" style=\"width:35px;max-width:100%\">모양의 도형에 색칠하여 얻은 그림을 \u003cspan class=\"heq\">\\(R_{2} \\,\\)\u003c/span>라 하자.\u003cbr>이와 같은 과정을 계속하여 \u003cspan class=\"heq\">\\(n\\,\\)\u003c/span>번째 얻은 그림 \u003cspan class=\"heq\">\\(R_{n} \\,\\)\u003c/span>에 색칠되어 있는 부분의 넓이를 \u003cspan class=\"heq\">\\(S_{n}\\,\\)\u003c/span>이라 할 때, \u003cspan class=\"heq\">\\(\\lim\\limits_{n\\, \\to  \\, \\infty } {S_{n}} \\,\\)\u003c/span>의 값은? \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003ctable class=\"htbl\">\u0
