  <script>window.HandStudyRecord={"itemId":17816,"sourceLabel":"2023 평가원 고3 수학확통 9월 28번","adminYear":2023,"grade":3,"month":9,"number":28,"track":"확통","points":4,"scoreStatus":"confirmed_4_direct","questionText":"주머니 ${{A}}$에는 숫자 $1$, $2$, $3$이 하나씩 적힌 $3$개의 공이 들어 있고, 주머니 $B$에는 숫자 $1$, $2$, $3$, $4$가 하나씩 적힌 $4$개의 공이 들어 있다. 두 주머니 $A$, $B$와 한 개의 주사위를 사용하여 다음 시행을 한다.\n 주사위를 한 번 던져 나온 눈의 수가 $3$의 배수이면주머니 $A$에서 임의로 $2$개의 공을 동시에 꺼내고, 나온 눈의 수가 $3$의 배수가 아니면주머니 ${{B}}$에서 임의로 $2$개의 공을 동시에 꺼낸다.꺼낸 $2$개의 공에 적혀 있는 수의 차를 기록한 후, 공을 꺼낸 주머니에 이 $2$개의 공을 다시 넣는다.\n이 시행을 $2$번 반복하여 기록한 두 개의 수의 평균을 $\\overline{X}$라 할 때, $P \\left( {\\overline{X}} =2 \\right)$의 값은? [4점]\n① $\\frac{11}{81}$ ② $\\frac{13}{81}$ ③ $\\frac{5}{27}$ ④ $\\frac{17}{81}$ ⑤ $\\frac{19}{81}$\n단답형","answer":"⑤","sourceHash":"5c4f390d126ea2c2427e17e40d1790fc5ff7c58b382cda09a68c9584abd11c11","steps":[{"id":"s1","latex":"P(D=1)=5/9,\\ P(D=2)=1/3,\\ P(D=3)=1/9"},{"id":"s2","latex":"\\overline X=(D_1+D_2)/2"},{"id":"s3","latex":"P(\\overline X=2)=2(5/9)(1/9)+(1/3)^2"},{"id":"s4","latex":"=19/81"},{"id":"s5","latex":"\\boxed{19/81}"}],"diagram":null,"contentHash":"e90011e5675e50a1a594cde76d02ddafa9cb732fd0428c982e4653ed4a1f6211","questionHtml":"\u003cp class=\"hp\">주머니 \u003cspan class=\"heq\">\\({{A}}\\)\u003c/span>에는 숫자 \u003cspan class=\"heq\">\\(1\\)\u003c/span>, \u003cspan class=\"heq\">\\(2\\)\u003c/span>, \u003cspan class=\"heq\">\\(3\\)\u003c/span>이 하나씩 적힌 \u003cspan class=\"heq\">\\(3\\)\u003c/span>개의 공이 들어 있고, 주머니 \u003cspan class=\"heq\">\\(B\\)\u003c/span>에는 숫자 \u003cspan class=\"heq\">\\(1\\)\u003c/span>, \u003cspan class=\"heq\">\\(2\\)\u003c/span>, \u003cspan class=\"heq\">\\(3\\)\u003c/span>, \u003cspan class=\"heq\">\\(4\\)\u003c/span>가 하나씩 적힌 \u003cspan class=\"heq\">\\(4\\)\u003c/span>개의 공이 들어 있다. 두 주머니 \u003cspan class=\"heq\">\\(A\\)\u003c/span>, \u003cspan class=\"heq\">\\(B\\)\u003c/span>와 한 개의 주사위를 사용하여 다음 시행을 한다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">주사위를 한 번 던져 나온 눈의 수가 \u003cspan class
