  <script>window.HandStudyRecord={"itemId":17028,"sourceLabel":"2021 교육청 고3 수학기하 4월 14번","adminYear":2021,"grade":3,"month":4,"number":14,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"$4$ 이상의 자연수 $n$에 대하여 다음 조건을 만족시키는 $n$ 이하의 네 자연수 $a,\\,b,\\,c,\\,d$가 있다.\n∘ $a\\gt b$\n∘ 좌표평면 위의 두 점 $A \\left( a,\\,b \\right)$, $B \\left( c,\\,d \\right)$와 원점 $O$에 대하여 삼각형 $O A B$는 $\\angle A$$= \\dfrac{\\pi}{2}$인 직각이등변삼각형이다.\n다음은 $a,\\,b,\\,c,\\,d$의 모든 순서쌍 $\\left( a,\\,b,\\,c,\\,d \\right)$의 개수를 $T_{n}$이라 할 때, $\\sum\\limits_{n=4}^{20} T_{n}$의 값을 구하는 과정이다.\n [그림 1]\n점 $A \\left( a,\\,b \\right)$에 대하여\n점 $B \\left( c,\\,d \\right)$가 ${\\overline{OA}} BOT {\\overline{AB}}$, ${\\overline{OA}}$$= {\\overline{AB}}$를 만족시키려면\n$c$$=a-b$, $d$$=a+b$이어야 한다.\n이때, $a\\gt b$이고 $d$가 $n$ 이하의 자연수이므로 $b\\lt \\dfrac{n}{2}$이다.\n$\\dfrac{n}{2}$ 미만의 자연수 $k$에 대하여\n$b$$=k$일 때, $a+b \\leq n$을 만족시키는 자연수 $a$의 개수는\n$n-2k$이다.\n$2$ 이상의 자연수 $m$에 대하여\n(ⅰ) $n=2m$인 경우\n$b$가 될 수 있는 자연수는 $1$부터 ${\\boxed{\\vphantom{(}\\, \\left( \\text{가} \\right) \\,}}$까지이므로\n$T_{2m}$$= \\sum\\limits_{k=1}^{{\\boxed{\\vphantom{(}\\, \\left( \\text{가} \\right) \\,}}} \\left( 2m-2k \\right)$$= {\\boxed{\\vphantom{(}\\, \\left( \\text{나} \\right) \\,}}$\n(ⅱ) $n$$=2m+1$인 경우\n$T_{2m+1}$$= {\\boxed{\\vphantom{(}\\, \\left( \\text{다} \\right) \\,}}$\n(ⅰ), (ⅱ)에 의해 $\\sum\\limits_{n=4}^{20} T_{n}$$=614$\n위의 (가), (나), (다)에 알맞은 식을 각각 $f \\left( m \\right) ,\\,g \\left( m \\right) ,\\,h \\left( m \\right)$이라 할 때, $f \\left( 5 \\right) +g \\left( 6 \\right) +h \\left( 7 \\right)$의 값은? [4점]\n① $71$ ② $74$ ③ $77$ ④ $80$ ⑤ $83$","answer":"⑤","sourceHash":"a1bd1c4f86335c7e7da7394240375cb1733d3ee9d8c839b4196de6203f1f7562","steps":[{"id":"s1","latex":"OA\\perp AB,\\ OA=AB\\Rightarrow B\\text{는 }O\\text{의 }A\\text{ 중심 }-\\frac\\pi2\\text{ 회전상}"},{"id":"s2","latex":"d>0\\Rightarrow c=a-b,\\ d=a+b,\\quad a>b,\\ a+b\\le n"},{"id":"s3","latex":"b=k\\Rightarrow k\u003ca\\le n-k:\\quad n-2k\\text{가지}"},{"id":"s4","latex":"n=2m:\\q
