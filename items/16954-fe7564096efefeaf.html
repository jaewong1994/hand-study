<script>window.HandStudyRecord={"itemId":16954,"sourceLabel":"2020 평가원 고3 수리나형 9월 30번","adminYear":2020,"grade":3,"month":9,"number":30,"track":"수리나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"삼차함수 $f(x)$가 다음 조건을 만족시킨다.\n(가) $f(1)=f(3)=0$ (나) 집합 ${x\\,|\\,x{\\geq}1$이고 $f ' (x)=0 \\right\\}$의 원소의 개수는 $1$이다.\n상수 $a$에 대하여 함수 $g(x)= \\left| f(x)f(a-x) \\right|$가 실수 전체의 집합에서 미분가능할 때, $\\frac{g(4a)}{f(0) \\times f(4a)}$의 값을 구하시오. [4점]","answer":"105","sourceHash":"84559968cce3b4a8d356616e597b9f21e807391b00e22df9c7bb23c539bbe904","steps":[{"id":"s1","latex":"f(x)=k(x-1)(x-3)(x-c)"},{"id":"s2","latex":"f'(x)=k\\{3x^2-2(c+4)x+4c+3\\},\\quad\\text{(나)}\\Rightarrow c\u003c1"},{"id":"s3","latex":"h(x)=f(x)f(a-x),\\quad |h(x)|\\text{가 미분가능}\\Rightarrow h\\text{의 모든 실근은 중근 이상}"},{"id":"s4","latex":"\\{c,1,3\\}=\\{a-3,a-1,a-c\\}"},{"id":"s5","latex":"c=a-3,\\quad1=a-1,\\quad3=a-c\\Rightarrow a=2,\\ c=-1"},{"id":"s6","latex":"f(x)=k(x+1)(x-1)(x-3),\\quad4a=8"},{"id":"s7","latex":"f(0)=3k,\\quad f(8)=315k,\\quad f(-6)=-315k"},{"id":"s8","latex":"\\frac{g(4a)}{f(0)f(4a)}=\\frac{|f(8)f(-6)|}{f(0)f(8)}=105"}],"diagram":null,"contentHash":"3fe480e877ae621e85dc17a8fc078cc4af396187369a3cb3f287ac2e3ebb5c5f","questionHtml":"\u003cp class=\"hp\">삼차함수 \u003cspan class=\"heq\">\\(f(x)\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cp class=\"hp\">\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) \u003cspan class=\"heq\">\\(f(1)=f(3)=0\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">(나) 집합 \u003cspan class=\"heq\">\\({x\\,|\\,x{\\geq}1}\\)\u003c/span>이고 \u003cspan class=\"heq\">\\(f' (x)=0 \\}\\)\u003c/span>의 원소의 개수는 \u003cspan class=\"heq\">\\(1\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003c/p>\u003cp class=\"hp htall\">상수 \u003cspan class=\"heq\">\\(a\\)\u003c/span>에 대하여 함수 \u003cspan class=\"heq\">\\(g(x)= \\left| f(x)f(a-x) \\right|\\)\u003c/span>가 실수 전체의 집합에서 미분가능할 때, \u003cspan class=\"heq\">\\(\\dfrac{g(4a)}{f(0) \\times f(4a)}\\)\u003c/span>의 값을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"fe7564096efefeaff10552e55e0595898b7527d340aa80d3747edd5a58351460"};</script>
<script>window.HandStudyGuide={"itemId":16954,"sourceHash":"84559968cce3b4a8d356616e597b9f21e807391b00e22df9c7bb23c539bbe904","contentHash":"3fe480e877ae621e85dc17a8fc078cc4af396187369a3cb3f287ac2e3ebb5c5f","overview":{"goal":"삼차함수의 세 근 위치를 정하고, 절댓값 곱이 미분가능하려면 두 인수의 근들이 짝을 이뤄야 함을 이용해 a를 구해요.","firstLook":"절댓값 \\(|h(x)|\\)는 \\(h\\)가 부호를 바꾸며 0을 지나면 그 점에서 뾰족해져요. 따라서 \\(f(x)\\)와 \\(f(a-x)\\)의 세 근이 서로 겹쳐 각 근에서 부호가 바뀌지 않게 해야 해요.","conditions":[{"label":"주어진 두 근","meaning":"\\(f(1)=f(3)=0\\)이므로 세 번째 근을 \\(c\\)라 둘 수 있어요."},{"label":"도함수의 근","meaning":"\\(x\\ge1\\)에서 \\(f'(x)=0\\)인 점이 정확히 하나예요."},{"label":"전체 미분가능","meaning":"\\(g(x)=|f(x)f(a-x)|\\)는 모든 실수에서 미분가능해야 해요."}]},"chapters":[{"id":"c1","label":"세 번째 근은 1보다 왼쪽에 있어요","stepIds":["s1","s2"],"question":"도함수 조건은 왜 \\(c<1\\)을 뜻할까요?","hint":"삼차함수의 서로 다른 세 근 사이에는 각각 도함수의 근이 하나씩 있어요.","explanation":"최고차항 계수를 \\(k\\ne0\\)이라 하면 \\(f(x)=k(x-1)(x-3)(x-c)\\)예요. 미분하면 \\(f'(x)=k\\{3x^2-2(c+4)x+4c+3\\}\\)이에요.\n\n만약 \\(c\\ge1\\)이면 세 근을 크기순으로 놓았을 때 두 근 사이에서 생기는 두 극값 위치가 모두 \\(1\\) 이상이에요. \\(c=1\\)이나 \\(c=3\\)처럼 근이 겹치는 경우에도 \\(x\\ge1\\)인 도함수의 서로 다른 근이 둘 생겨 조건에 어긋나요. 반대로 \\(c<1\\)이면 한 극값은 \\(c\\)와 \\(1\\) 사이, 다른 하나는 \\(1\\)과 \\(3\\) 사이여서 \\(x\\ge1\\)인 것은 하나뿐이에요. 따라서 \\(c<1\\)이에요.","check":{"prompt":"\\(c<1\\)일 때 오른쪽 극값 위치는 어느 두 근 사이인가요?","answer":"\\(1\\)과 \\(3\\) 사이에 있어요."}},{"id":"c2","label":"절댓값의 미분가능성으로 두 근 집합을 맞춰요","stepIds":["s3","s4"],"question":"왜 \\(\\{c,1,3\\}=\\{a-3,a-1,a-c\\}\\)이어야 할까요?","hint":"\\(h(x)=f(x)f(a-x)\\)의 한 근이 한 인수에만 한 번 나타나면 그 점을 지나며 \\(h\\)의 부호가 바뀌어요.","explanation":"\\(h(x)=f(x)f(a-x)\\)라 두어요. \\(c<1<3\\)이므로 \\(f(x)\\)의 세 근은 서로 다르고 각각 인수에 한 번씩 나타나요. \\(|h(x)|\\)가 모든 곳에서 미분가능하려면 \\(h\\)의 각 근에서 부호가 바뀌지 않아야 하므로, 각 근은 전체 곱에 두 번씩 나타나야 해요.\n\n\\(f(a-x)=0\\)의 근은 \\(a-c,a-1,a-3\\)이에요. 두 인수에 각각 서로 다른 근이 세 개씩 있으므로 모든 근을 짝지으려면 두 집합이 같아야 해요. 따라서 \\(\\{c,1,3\\}=\\{a-3,a-1,a-c\\}\\)예요.","check":{"prompt":"한쪽에만 있는 근이 생기면 왜 미분가능하지 않나요?","answer":"그 근에서 곱이 한 번만 0이 되어 부호가 바뀌고, 절댓값을 취한 그래프가 뾰족해지기 때문이에요."}},{"id":"c3","label":"근의 크기순서를 맞춰 a와 c를 구해요","stepIds":["s5","s6"],"question":"두 근 집합의 원소를 어떤 순서로 대응시키면 될까요?","hint":"왼쪽은 \\(c<1<3\\)이고 오른쪽도 \\(a-3<a-1<a-c\\)예요.","explanation":"\\(c<1\\)이므로 \\(a-3<a-1<a-c\\)예요. 양쪽 집합을 작은 것부터 대응시키면 \\(c=a-3\\), \\(1=a-1\\), \\(3=a-c\\)예요. 가운데 식에서 \\(a=2\\), 첫 식에서 \\(c=-1\\)을 얻고 마지막 식도 \\(3=2-(-1)\\)로 맞아요.\n\n따라서 \\(f(x)=k(x+1)(x-1)(x-3)\\)이고 \\(4a=8\\)이에요.","check":{"prompt":"오른쪽 세 근에서 가장 큰 것이 \\(a-c\\)인 이유는 무엇인가요?","answer":"\\(c<1\\)이므로 \\(-c>-1\\), 따라서 \\(a-c>a-1\\)이기 때문이에요."}},{"id":"c4","label":"필요한 세 함숫값만 계산해요","stepIds":["s7","s8"],"question":"요구한 비에서 계수 k는 어떻게 사라질까요?","hint":"\\(g(8)=|f(8)f(-6)|\\)이고 분모는 \\(f(0)f(8)\\)이에요.","explanation":"함숫값을 계산하면 \\(f(0)=k(1)(-1)(-3)=3k\\), \\(f(8)=k(9)(7)(5)=315k\\), \\(f(-6)=k(-5)(-7)(-9)=-315k\\)예요.\n\n따라서\n\\[\n\\frac{g(4a)}{f(0)f(4a)}\n=\\frac{|f(8)f(-6)|}{f(0)f(8)}\n=\\frac{315^2k^2}{3\\cdot315k^2}=105\n\\]\n예요.","check":{"prompt":"분모의 부호는 계수 k의 부호와 관계없이 양수인가요?","answer":"\\(f(0)f(8)=945k^2>0\\)이므로 양수예요."}}],"takeaway":["삼차함수의 근 위치와 도함수의 근 개수는 근 사이의 극값 위치로 연결해요.","절댓값을 취한 다항식이 근에서 미분가능하려면 그 근에서 부호가 바뀌지 않도록 인수가 짝을 이뤄야 해요.","두 근 집합이 같을 때는 원소의 크기순서를 비교하면 대응을 빠르게 확정할 수 있어요."]};</script>
