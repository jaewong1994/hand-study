  <script>window.HandStudyRecord={"itemId":18358,"sourceLabel":"2025 평가원 고3 수학기하 9월 30번","adminYear":2025,"grade":3,"month":9,"number":30,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"좌표평면에 ${ \\overline{{AB}}}={ \\overline{{AC}}}=8 \\sqrt{5}\\,$, ${ \\overline{{BC}}}=16\\,$인 삼각형 ${{ABC}}\\,$가 있다. 선분 ${{AB}}$ 위의 점 ${{P}}\\,$, 선분 ${{BC}}$ 위의 점 ${{Q}}\\,$, 선분 ${{CA}}$ 위의 점 ${{R}}\\,$가 다음 조건을 만족시킨다.\n(가) $\\left({ \\vec{{PB}}}+{ \\vec{{PQ}}} \\right) bullet { \\vec{{BC}}}= \\left({ \\vec{{RC}}}+{ \\vec{{RQ}}} \\right) bullet { \\vec{{BC}}}=0$ (나) ${ \\vec{{QP}}} bullet { \\vec{{QR}}}= \\left|\\, { \\vec{{QP}}}\\,\\right| ^{2}$\n$\\left|\\, 3{ \\vec{{XP}}}+{ \\vec{{XR}}}\\,\\right| = \\left|\\, { \\vec{{PR}}}\\,\\right| \\,$를 만족시키는 점 ${{X}}\\,$에 대하여 $\\left|\\, { \\vec{{BX}}}\\,\\right| \\,$의 최댓값과 최솟값을 각각 $M\\,$, $m\\,$이라 할 때, $M\\, \\times m\\,$의 값을 구하시오. (단, $\\left|\\, { \\vec{{PQ}}}\\,\\right| > 0\\,$) [4점]","answer":"69","sourceHash":"bf845ba46f30bea64f9ac39832f62b615ad62e7d99e63d4ae7f14084d8603933","steps":[{"id":"s1","latex":"B=(-8,0),\\quad C=(8,0),\\quad A=(0,16),\\quad Q=(q,0)"},{"id":"s2","latex":"P=\\left(\\frac{q-8}{2},q+8\\right),\\quad R=\\left(\\frac{q+8}{2},8-q\\right)"},{"id":"s3","latex":"\\overrightarrow{QP}\\cdot\\overrightarrow{PR}=0\\Rightarrow(q+8)(-4-2q)=0"},{"id":"s4","latex":"PQ>0\\Rightarrow q=-2,\\quad P=(-5,6),\\quad R=(3,10)"},{"id":"s5","latex":"G=\\frac{3P+R}{4}=(-3,7),\\quad3\\overrightarrow{XP}+\\overrightarrow{XR}=4\\overrightarrow{XG}"},{"id":"s6","latex":"PR=4\\sqrt5\\Rightarrow XG=\\sqrt5,\\quad BG=\\sqrt{74}"},{"id":"s7","latex":"Mm=(BG+XG)(BG-XG)=74-5=69"}],"diagram":null,"contentHash":"6edc3d7f28da177c0d462505aa3c081d2bc7c5d38d59ed55b3679965da03532d","questionHtml":"\u003cp class=\"hp htall\">좌표평면에 \u003cspan class=\"heq\">\\({ \\overline{{AB}}}={ \\overline{{AC}}}=8 \\sqrt{5}\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\({ \\overline{{BC}}}=16\\,\\)\u003c/span>인 삼각형 \u003cspan class=\"heq\">\\({{AB
