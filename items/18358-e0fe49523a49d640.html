<script>window.HandStudyRecord={"itemId":18358,"sourceLabel":"2025 평가원 고3 수학기하 9월 30번","adminYear":2025,"grade":3,"month":9,"number":30,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"좌표평면에 ${ \\overline{{AB}}}={ \\overline{{AC}}}=8 \\sqrt{5}\\,$, ${ \\overline{{BC}}}=16\\,$인 삼각형 ${{ABC}}\\,$가 있다. 선분 ${{AB}}$ 위의 점 ${{P}}\\,$, 선분 ${{BC}}$ 위의 점 ${{Q}}\\,$, 선분 ${{CA}}$ 위의 점 ${{R}}\\,$가 다음 조건을 만족시킨다.\n(가) $\\left({ \\vec{{PB}}}+{ \\vec{{PQ}}} \\right) bullet { \\vec{{BC}}}= \\left({ \\vec{{RC}}}+{ \\vec{{RQ}}} \\right) bullet { \\vec{{BC}}}=0$ (나) ${ \\vec{{QP}}} bullet { \\vec{{QR}}}= \\left|\\, { \\vec{{QP}}}\\,\\right| ^{2}$\n$\\left|\\, 3{ \\vec{{XP}}}+{ \\vec{{XR}}}\\,\\right| = \\left|\\, { \\vec{{PR}}}\\,\\right| \\,$를 만족시키는 점 ${{X}}\\,$에 대하여 $\\left|\\, { \\vec{{BX}}}\\,\\right| \\,$의 최댓값과 최솟값을 각각 $M\\,$, $m\\,$이라 할 때, $M\\, \\times m\\,$의 값을 구하시오. (단, $\\left|\\, { \\vec{{PQ}}}\\,\\right| > 0\\,$) [4점]","answer":"69","sourceHash":"bf845ba46f30bea64f9ac39832f62b615ad62e7d99e63d4ae7f14084d8603933","steps":[{"id":"s1","latex":"B=(-8,0),\\quad C=(8,0),\\quad A=(0,16),\\quad Q=(q,0)"},{"id":"s2","latex":"P=\\left(\\frac{q-8}{2},q+8\\right),\\quad R=\\left(\\frac{q+8}{2},8-q\\right)"},{"id":"s3","latex":"\\overrightarrow{QP}\\cdot\\overrightarrow{PR}=0\\Rightarrow(q+8)(-4-2q)=0"},{"id":"s4","latex":"PQ>0\\Rightarrow q=-2,\\quad P=(-5,6),\\quad R=(3,10)"},{"id":"s5","latex":"G=\\frac{3P+R}{4}=(-3,7),\\quad3\\overrightarrow{XP}+\\overrightarrow{XR}=4\\overrightarrow{XG}"},{"id":"s6","latex":"PR=4\\sqrt5\\Rightarrow XG=\\sqrt5,\\quad BG=\\sqrt{74}"},{"id":"s7","latex":"Mm=(BG+XG)(BG-XG)=74-5=69"}],"diagram":null,"contentHash":"6edc3d7f28da177c0d462505aa3c081d2bc7c5d38d59ed55b3679965da03532d","questionHtml":"\u003cp class=\"hp htall\">좌표평면에 \u003cspan class=\"heq\">\\({ \\overline{{AB}}}={ \\overline{{AC}}}=8 \\sqrt{5}\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\({ \\overline{{BC}}}=16\\,\\)\u003c/span>인 삼각형 \u003cspan class=\"heq\">\\({{ABC} <script>window.HandStudyGuide={"itemId":18358,"sourceHash":"bf845ba46f30bea64f9ac39832f62b615ad62e7d99e63d4ae7f14084d8603933","contentHash":"6edc3d7f28da177c0d462505aa3c081d2bc7c5d38d59ed55b3679965da03532d","overview":{"goal":"내적 조건으로 세 점을 정하고, 벡터의 가중합 조건을 원의 방정식으로 바꿔 거리의 범위를 구해요.","firstLook":"이등변삼각형을 좌표축에 대칭으로 놓으면 조건 (가)가 점 \\(P,R\\)의 좌표를 바로 정해요.","conditions":[{"label":"내적이 영","meaning":"해당 두 벡터의 합이 \\(BC\\)와 수직이에요."},{"label":"가중합의 길이","meaning":"점 \\(X\\)는 한 고정점을 중심으로 하는 원 위를 움직여요."}]},"chapters":[{"id":"c1","label":"삼각형과 세 점을 좌표로 나타내요","stepIds":["s1","s2"],"question":"\\(P,R\\)의 좌표는 \\(q\\)로 어떻게 표현되나요?","hint":"\\(BC\\)를 \\(x\\)축에 놓고 조건 (가)의 \\(x\\)성분을 \\(0\\)으로 만들어요.","explanation":"\\(B=(-8,0),C=(8,0)\\)로 놓으면 높이가 \\(16\\)이므로 \\(A=(0,16)\\)이고, \\(Q=(q,0)\\)라 해요. \\(P\\)를 \\(AB\\) 위의 점으로 놓고 \\((\\overrightarrow{PB}+\\overrightarrow{PQ})\\cdot\\overrightarrow{BC}=0\\)을 쓰면 두 벡터합의 \\(x\\)성분이 \\(0\\)이 되어 \\(P=((q-8)/2,q+8)\\)을 얻어요. 같은 방식으로 \\(R=((q+8)/2,8-q)\\)예요.","check":{"prompt":"조건 (가)에서 왜 \\(x\\)성분만 보면 되나요?","answer":"\\(BC\\)가 \\(x\\)축 방향이기 때문이에요."}},{"id":"c2","label":"두 번째 내적으로 점들을 확정해요","stepIds":["s3","s4"],"question":"\\(q\\)는 얼마인가요?","hint":"조건 (나)를 \\(QP\\cdot(PR)=0\\)으로 바꿔요.","explanation":"\\(QR=QP+PR\\)이므로 \\(QP\\cdot QR=|QP|^2\\)에서 양변의 \\(QP\\cdot QP\\)를 없애면 \\(QP\\cdot PR=0\\)이에요. 좌표를 넣으면 \\((q+8)(-4-2q)=0\\)이라 \\(q=-8\\) 또는 \\(q=-2\\)예요. \\(q=-8\\)이면 \\(Q=B=P\\)가 되어 \\(PQ=0\\)이므로 제외하고, \\(q=-2\\)에서 \\(P=(-5,6),R=(3,10)\\)을 얻어요.","check":{"prompt":"\\(q=-8\\)을 제외하는 원문 조건은 무엇인가요?","answer":"\\(|PQ|>0\\)이에요."}},{"id":"c3","label":"가중합을 원의 조건으로 바꿔요","stepIds":["s5","s6"],"question":"점 \\(X\\)는 어떤 원 위를 움직이나요?","hint":"\\(3P+R\\)의 무게중심을 \\(G\\)라 해요.","explanation":"\\(G=(3P+R)/4=(-3,7)\\)라 하면 \\(3\\overrightarrow{XP}+\\overrightarrow{XR}=3(P-X)+(R-X)=4(G-X)=4\\overrightarrow{XG}\\)예요. 또 \\(PR=\\sqrt{8^2+4^2}=4\\sqrt5\\)이므로 주어진 길이식은 \\(4XG=4\\sqrt5\\), 즉 \\(XG=\\sqrt5\\)가 돼요. 따라서 \\(X\\)는 중심 \\(G\\), 반지름 \\(\\sqrt5\\)인 원 위를 움직여요. \\(BG=\\sqrt{5^2+7^2}=\\sqrt{74}\\)예요.","check":{"prompt":"원의 반지름은 얼마인가요?","answer":"\\(XG=\\sqrt5\\)이므로 \\(\\sqrt5\\)예요."}},{"id":"c4","label":"점에서 원까지의 거리 범위를 써요","stepIds":["s7"],"question":"최대거리와 최소거리의 곱은 얼마인가요?","hint":"점 \\(B\\)는 원 밖에 있으므로 중심거리에서 반지름을 더하고 빼요.","explanation":"\\(BG=\\sqrt{74}>\\sqrt5\\)이므로 \\(B\\)는 원 밖에 있어요. 따라서 \\(BX\\)의 최댓값과 최솟값은 \\(M=BG+XG\\), \\(m=BG-XG\\)예요. 곱은 \\(Mm=(\\sqrt{74}+\\sqrt5)(\\sqrt{74}-\\sqrt5)=74-5=69\\)예요.","check":{"prompt":"최솟값에서 절댓값 처리가 필요 없는 이유는 무엇인가요?","answer":"\\(BG>XG\\)라 \\(BG-XG>0\\)이기 때문이에요."}}],"takeaway":["기준변을 좌표축에 놓으면 내적의 수직 조건이 한 좌표식으로 줄어요.","벡터의 가중합은 가중평균점에서 출발하는 벡터로 묶을 수 있어요.","원 밖의 점에서 원 위 점까지 거리 범위는 중심거리와 반지름의 합과 차예요."]};</script>
