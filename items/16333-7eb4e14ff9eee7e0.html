<script>window.HandStudyRecord={"itemId":16333,"sourceLabel":"2019 교육청 고3 수리가형 7월 21번","adminYear":2019,"grade":3,"month":7,"number":21,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"$0\u003ct\u003c1\\,$인 실수 $t\\,$에 대하여 직선 $y=t\\,$와 함수 $f \\left( x \\right) =\\sin\\,x\\, \\left( 0\u003cx\u003c \\frac{\\pi }{2} \\right) \\,$의 그래프가 만나는 점을 $P\\,$라 할 때, 곡선 $y=f \\left(x \\right)\\,$ 위의 점 $P\\,$에서 그은 접선의 $x\\,$절편을 $g \\left(t \\right)\\,$라 하자. $g ' \\left( \\frac{2 \\sqrt{2}}{3} \\right) \\,$의 값은? [4점]\n① $-28$ ② $-24$ ③ $-20$ ④ $-16$ ⑤ $-12$\n단답형","answer":"②","sourceHash":"a8db4585118fbdb610a64b3fccdc7326e46d19a5d990321e6d27a4582829fa80","steps":[{"id":"s1","latex":"P=(\\alpha,t),\\ \\sin\\alpha=t,\\ 0\u003c\\alpha\u003c\\frac\\pi2"},{"id":"s2","latex":"g(t)=\\alpha-\\tan\\alpha"},{"id":"s3","latex":"\\frac{d\\alpha}{dt}=\\frac1{\\cos\\alpha}"},{"id":"s4","latex":"g'(t)=\\frac1{\\cos\\alpha}-\\frac1{\\cos^3\\alpha}=-\\frac{t^2}{(1-t^2)^{3/2}}"},{"id":"s5","latex":"t=\\frac{2\\sqrt2}{3}\\Rightarrow g'(t)=-24"}],"diagram":null,"contentHash":"f800ee9bda06737c07ace6dd983fcd7bcd7aacd7c71b34a444013386c1cd04af","questionHtml":"\u003cp class=\"hp htall\">\u003cspan class=\"heq\">\\(0\\lt t\\lt 1\\,\\)\u003c/span>인 실수 \u003cspan class=\"heq\">\\(t\\,\\)\u003c/span>에 대하여 직선 \u003cspan class=\"heq\">\\(y=t\\,\\)\u003c/span>와 \u003cbr>함수 \u003cspan class=\"heq\">\\(f \\left( x \\right) =\\sin\\,x\\, \\left( 0\\lt x\\lt  \\dfrac{\\pi }{2} \\right) \\,\\)\u003c/span>의 그래프가 만나는 점을 \u003cspan class=\"heq\">\\(P\\,\\)\u003c/span>라 할 때, 곡선 \u003cspan class=\"heq\">\\(y=f \\left(x \\right)\\,\\)\u003c/span> 위의 점 \u003cspan class=\"heq\">\\(P\\,\\)\u003c/span>에서 그은 접선의 \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>절편을 \u003cspan class=\"heq\">\\(g \\left(t \\right)\\,\\)\u003c/span>라 하자. \u003cspan class=\"heq\">\\(g' \\left( \\dfrac{2 \\sqrt{2}}{3} \\right) \\,\\)\u003c/span>의 값은? \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">① \ <script>window.HandStudyGuide={"itemId":16333,"sourceHash":"a8db4585118fbdb610a64b3fccdc7326e46d19a5d990321e6d27a4582829fa80","contentHash":"f800ee9bda06737c07ace6dd983fcd7bcd7aacd7c71b34a444013386c1cd04af","overview":{"goal":"접선의 절편을 교점의 좌표로 나타낸 뒤 매개변수로 미분해요.","firstLook":"교점의 \\(x\\)좌표를 \\(\\alpha\\)라 두면 \\(t=\\sin\\alpha\\)이고 접선 기울기는 \\(\\cos\\alpha\\)예요.","conditions":[{"label":"범위","meaning":"\\(0<\\alpha<\\pi/2\\)라 코사인이 양수예요."},{"label":"절편","meaning":"접선식에 \\(y=0\\)을 넣어 \\(x\\)절편을 구해요."}]},"chapters":[{"id":"c1","label":"접선의 절편을 각으로 나타내요","stepIds":["s1","s2"],"question":"\\(g(t)\\)는 왜 \\(\\alpha-\\tan\\alpha\\)인가요?","hint":"점 \\((\\alpha,\\sin\\alpha)\\)에서 접선식을 쓰세요.","explanation":"\\(P=(\\alpha,t)\\), \\(t=\\sin\\alpha\\)예요. 접선은 \\(y-t=\\cos\\alpha(x-\\alpha)\\)이고 \\(y=0\\)을 넣으면 \\(x=\\alpha-t/\\cos\\alpha=\\alpha-\\tan\\alpha\\)예요.","check":{"prompt":"접선의 기울기는 무엇인가요?","answer":"\\(f'(\\alpha)=\\cos\\alpha\\)예요."}},{"id":"c2","label":"매개변수 관계를 미분해요","stepIds":["s3","s4"],"question":"\\(g'(t)\\)는 어떻게 나오나요?","hint":"\\(t=\\sin\\alpha\\)를 먼저 미분해요.","explanation":"\\(dt/d\\alpha=\\cos\\alpha\\)이므로 \\(d\\alpha/dt=1/\\cos\\alpha\\)예요. 따라서 \\(g'(t)=(1-\\sec^2\\alpha)/\\cos\\alpha=1/\\cos\\alpha-1/\\cos^3\\alpha\\)이고, \\(\\cos^2\\alpha=1-t^2\\)를 쓰면 \\(g'(t)=-t^2/(1-t^2)^{3/2}\\)예요.","check":{"prompt":"분모가 양수인 이유는 무엇인가요?","answer":"\\(0<t<1\\)이라 \\(1-t^2>0\\)이기 때문이에요."}},{"id":"c3","label":"주어진 값에 대입해요","stepIds":["s5"],"question":"미분계수의 값은 얼마인가요?","hint":"\\(t^2=8/9\\), \\(1-t^2=1/9\\)를 써요.","explanation":"\\(t=2\\sqrt2/3\\)이면 \\(t^2=8/9\\), \\((1-t^2)^{3/2}=(1/9)^{3/2}=1/27\\)이에요. 따라서 \\(g'(t)=-(8/9)/(1/27)=-24\\)이고 정답은 ②예요.","check":{"prompt":"결과의 부호는 예상과 맞나요?","answer":"\\(g'(t)\\) 식이 음수이므로 \\(-24\\)가 맞아요."}}],"takeaway":["움직이는 교점은 각 같은 매개변수로 놓으면 접선식을 간단히 쓸 수 있어요.","매개변수 미분에서는 \\(d\\alpha/dt\\)를 곱해요.","삼각함수는 주어진 \\(t\\)로 바꿔 마지막에 계산해요."]};</script>
