<script>window.HandStudyGuide={"itemId":17789,"sourceHash":"b1aa851ebcea47ee6aae847dd920877580acb8510efbdb6304d05298734f2cfd","contentHash":"59b014208009b55cbe256b60ed646817e8d5f37ea6e462fdb4bd30ebcdf6ac84","overview":{"goal":"제곱식의 비음성과 연속함수의 부호 변화로 a,b를 정해요.","firstLook":"\\((f+1)^2=h+1\\)로 완전제곱을 만들면 \\(h+1\\)의 가장 작은 값과 0이 되는 점을 함께 알 수 있어요.","conditions":[{"label":"연속성","meaning":"\\(f(0)+1\\)과 \\(f(2)+1\\)의 부호가 반대이므로 그 사이에서 \\(f(x)+1=0\\)인 점이 있어요."}]},"chapters":[{"id":"c1","label":"끝점 조건으로 두 함숫값 구하기","stepIds":["s1","s2","s3"],"question":"같은 제곱값과 차가 1인 두 수는 어떻게 정해지나요?","hint":"\\(u=f(0)+1,v=f(2)+1\\)로 두면 \\(u^2=v^2\\)이고 \\(u-v=1\\)예요.","explanation":"\\(h(x)=a\\cos^3\\pi x\\,e^{\\sin^2\\pi x}+b\\)라 두면 \\((f(x)+1)^2=h(x)+1\\). \\(h(0)=h(2)\\)이므로 \\((f(0)+1)^2=(f(2)+1)^2\\). 또 \\(f(0)-f(2)=1\\)이어서 같은 부호는 불가능하고, 합이 0이어야 해요. 연립하면 \\(f(0)=-1/2\\), \\(f(2)=-3/2\\). \\(x=0\\)의 식에서 \\(a+b=f(0)^2+2f(0)=-3/4\\)예요.","check":{"prompt":"\\(f(0)+1\\)과 \\(f(2)+1\\)이 같은 값일 수 없는 이유는 무엇인가요?","answer":"두 값의 차가 \\(f(0)-f(2)=1\\)이므로 같지 않아요."}},{"id":"c2","label":"연속성과 제곱으로 가장 작은 값 찾기","stepIds":["s4"],"question":"\\(h(x)+1\\)의 가장 작은 값이 왜 0인가요?","hint":"비음성과 실제로 0이 되는 점을 둘 다 확인하세요.","explanation":"\\(f(0)+1=1/2\\), \\(f(2)+1=-1/2\\)이고 \\(f\\)가 연속이므로 0과 2 사이의 어떤 점에서 \\(f(x)+1=0\\)예요. 한편 모든 \\(x\\)에서 \\(h(x)+1=(f(x)+1)^2\\ge 0\\). 따라서 \\(h(x)+1\\)은 실제로 0이 되며 그보다 작을 수 없으므로 가장 작은 값은 0예요.","check":{"prompt":"\\(h+1\\ge 0\\)만으로 가장 작은 값이 0이라고 할 수 있나요?","answer":"아니요. 0이 실제로 되는 점의 존재까지 연속성으로 확인해야 해요."}},{"id":"c3","label":"삼각함수 부분의 범위와 두 계수 결정","stepIds":["s5","s6","s7"],"question":"\\(c^3e^(1-c^2)\\)의 가장 작은 값은 어디서 나오나요?","hint":"\\(c=\\cos \\pi x\\)의 범위 [-1,1]에서 도함수 부호를 확인하세요.","explanation":"\\(c=\\cos\\pi x\\)로 두면 \\(-1\\le c\\le 1\\)이고 \\(\\phi(c)=ac^3e^{1-c^2}\\). \\(\\phi'(c)=ae^{1-c^2}c^2(3-2c^2)\\ge 0\\)이므로 증가하며, 가장 작은 값은 \\(c=-1\\)에서 \\(-a\\)예요. 따라서 \\(h+1\\)의 가장 작은 값은 \\(b-a+1=0\\). 이를 \\(a+b=-3/4\\)와 연립하면 \\(a=1/8,b=-7/8\\), 곱은 \\(-7/64\\)로 정답 ②예요.","check":{"prompt":"\\(3-2c^2\\)가 구간에서 음수가 되지 않는 이유는 무엇인가요?","answer":"\\(|c|\\le 1\\)이므로 \\(3-2c^2\\ge 1>0\\)이기 때문이에요."}}],"takeaway":["완전제곱식에서는 0 이상이라는 사실과 0에 실제로 도달하는지를 구분해 확인해요.","삼각함수 치환 뒤 닫힌구간의 단조성과 끝값으로 최솟값을 찾아요."]};</script>
