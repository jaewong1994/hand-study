<script>window.HandStudyRecord={"adminYear":2025,"answer":"⑤","contentHash":"acb72b2512ea85a71458a3a9bb1ebbf957df06df08e33227c04bcae99f93f416","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24981,"month":11,"number":28,"points":4,"preview":false,"questionHtml":"\u003cp>함수\u003c/p>\u003cp> \u003cspan class=\"heq\">\\(f \\left(x \\right)=\\frac{1}{2}x^{2}-x+ \\ln\\, \\left(1+x \\right)\\,\\)\u003c/span>\u003c/p>\u003cp>와 양수 \u003cspan class=\"heq\">\\(t\\,\\)\u003c/span>에 대하여 점 \u003cspan class=\"heq\">\\(\\left(s,\\,f \\left(s \\right) \\right)\\, \\left(s &gt; 0 \\right)\\,\\)\u003c/span>에서 \u003cspan class=\"heq\">\\(y\\,\\)\u003c/span>축에 내린 수선의 발과 곡선 \u003cspan class=\"heq\">\\(y=f \\left(x \\right)\\)\u003c/span> 위의 점 \u003cspan class=\"heq\">\\(\\left(s,\\,f \\left(s \\right) \\right)\\,\\)\u003c/span>에서의 접선이 \u003cspan class=\"heq\">\\(y\\,\\)\u003c/span>축과 만나는 점 사이의 거리가 \u003cspan class=\"heq\">\\(t\\,\\)\u003c/span>가 되도록 하는 \u003cspan class=\"heq\">\\(s\\,\\)\u003c/span>의 값을 \u003cspan class=\"heq\">\\(g \\left(t \\right)\\,\\)\u003c/span>라 하자. \u003cspan class=\"heq\">\\(\\int_{\\frac{1}{2}}^{\\frac{27}{4}}g \\left(t \\right)\\,dt\\,\\)\u003c/span>의 값은? [4점]\u003c/p>\u003cdiv class=\"hchoices\">\u003cdiv class=\"hch\">① \u003cspan class=\"heq\">\\(\\frac{161}{12}+ \\ln\\, 3\\,\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">② \u003cspan class=\"heq\">\\(\\frac{40}{3}+ \\ln\\, 3\\,\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">③ \u003cspan class=\"heq\">\\(\\frac{53}{4}+ \\ln\\, 2\\,\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">④ \u003cspan class=\"heq\">\\(\\frac{79}{6}+ \\ln\\, 2\\,\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">⑤ \u003cspan class=\"heq\">\\(\\frac{157}{12}+ \\ln\\, 2\\)\u003c/span>\u003c/div>\u003c/div>","questionText":"함수\n $f \\left(x \\right)=\\frac{1}{2}x^{2}-x+ \\ln\\, \\left(1+x \\right)\\,$\n와 양수 $t\\,$에 대하여 점 $\\left(s,\\,f \\left(s \\right) \\right)\\, \\left(s > 0 \\right)\\,$에서 $y\\,$축에 내린 수선의 발과 곡선 $y=f \\left(x \\right)$ 위의 점 $\\left(s,\\,f \\left(s \\right) \\right)\\,$에서의 접선이 $y\\,$축과 만나는 점 사이의 거리가 $t\\,$가 되도록 하는 $s\\,$의 값을 $g \\left(t \\right)\\,$라 하자. $\\int_{\\frac{1}{2}}^{\\frac{27}{4}}g \\left(t \\right)\\,dt\\,$의 값은? [4점]\n① $\\frac{161}{12}+ \\ln\\, 3\\,$ ② $\\frac{40}{3}+ \\ln\\, 3\\,$ ③ $\\frac{53}{4}+ \\ln\\, 2\\,$\n④ $\\frac{79}{6}+ \\ln\\, 2\\,$ ⑤ $\\frac{157}{12}+ \\ln\\, 2$\n단답형","sourceHash":"a38f1d53c6fb09f9300eda9353e536d80700ff49c7b88fec87b8efb00cce043f","sourceKind":"csat","sourceLabel":"2025년 시행 수능 · 2026학년도 · 미적분 · 28번","steps":[{"id":"s1","latex":"f'(x)=x-1+\\frac1{x+1}=\\frac{x^{2}}{x+1}"},{"id":"s2","latex":"\\text{접선의 }y\\text{절편은 }f(s)-sf'(s)\\text{이고 수선의 발의 }y\\text{좌표는 }f(s)\\text{이다.}"},{"explanation":{"body":"수선의 발과 접선의 y절편 차는 \\(|sf'(s)|\\)입니다. \\(s>0\\)이고 \\(f'(s)=s^2/(s+1)>0\\)이므로 절댓값을 벗겨 \\(t=s^3/(s+1)\\)로 둡니다.","skillTags":["접선절편","역함수"],"title":"거리식이 역함수 식이 되는 과정"},"id":"s3","latex":"t=|sf'(s)|=\\frac{s^{3}}{s+1}\\quad(s>0)"},{"id":"s4","latex":"\\frac{dt}{ds}=\\frac{2s^{3}+3s^{2}}{(s+1)^{2}}>0"},{"id":"s5","latex":"t=\\frac12\\Rightarrow s=1,\\qquad t=\\frac{27}{4}\\Rightarrow s=3"},{"explanation":{"body":"\\(s=g(t)\\)이므로 \\(t\\)가 변할 때 \\(s\\)도 함께 변합니다. \\(dt=(dt/ds)ds\\)를 써서 \\(\\int g(t)dt=\\int s(dt/ds)ds\\)로 바꾸고, 끝점 \\(t=1/2,27/4\\)는 각각 \\(s=1,3\\)에 대응시킵니다.","skillTags":["치환적분","역함수적분"],"title":"t적분을 s적분으로 바꾸기"},"id":"s6","latex":"\\int_{1/2}^{27/4}g(t)\\,dt=\\int_{1}^{3}s\\frac{dt}{ds}\\,ds"},{"id":"s7","latex":"=\\int_{1}^{3}\\frac{2s^{4}+3s^{3}}{(s+1)^{2}}\\,ds"},{"id":"s8","latex":"=\\int_{1}^{3}\\left(2s^{2}-s+\\frac1{s+1}-\\frac1{(s+1)^{2}}\\right)ds"},{"id":"s9","latex":"=\\left[\\frac23s^{3}-\\frac12s^{2}+\\ln(s+1)+\\frac1{s+1}\\right]_{1}^{3}"},{"id":"s10","latex":"=\\frac{157}{12}+\\ln2"},{"id":"s11","latex":"\\therefore\\ \\boxed{\\frac{157}{12}+\\ln2}\\;(⑤)"}],"track":"미적분"};</script>
<script>window.HandStudyGuide={"itemId":24981,"sourceHash":"a38f1d53c6fb09f9300eda9353e536d80700ff49c7b88fec87b8efb00cce043f","contentHash":"acb72b2512ea85a71458a3a9bb1ebbf957df06df08e33227c04bcae99f93f416","overview":{"goal":"거리 \\(t\\)를 \\(s\\)의 식으로 만든 뒤 \\(t\\)-적분을 \\(s\\)-적분으로 바꿔 계산해요.","firstLook":"두 점이 모두 \\(y\\)축 위에 있으므로 거리는 두 \\(y\\)좌표의 차예요. 먼저 접선의 \\(y\\)절편을 구해요.","conditions":[{"label":"\\(s>0\\)","meaning":"거리식의 절댓값을 벗길 때 \\(s\\)와 \\(f'(s)\\)가 양수임을 보장해요."},{"label":"\\(g(t)=s\\)","meaning":"\\(t=s^3/(s+1)\\)이 증가하므로 각 \\(t\\)에 대응하는 \\(s\\)가 하나뿐이에요."}]},"chapters":[{"id":"c1","label":"접선에서 거리식을 만들어요","stepIds":["s1","s2","s3"],"question":"접선의 \\(y\\)절편과 수선의 발 사이 거리를 \\(s\\)로 어떻게 나타낼까요?","hint":"점 \\(s\\)에서의 접선식에 \\(x=0\\)을 넣어요.","explanation":"먼저 \\(f'(x)=x-1+1/(x+1)=x^2/(x+1)\\)이에요. 점 \\((s,f(s))\\)에서의 접선은 \\(y-f(s)=f'(s)(x-s)\\)이므로 \\(y\\)절편은 \\(f(s)-sf'(s)\\)예요. 수선의 발은 \\((0,f(s))\\)이므로 두 점의 거리는 \\(|f(s)-[f(s)-sf'(s)]|=|sf'(s)|\\)예요. \\(s>0\\)이고 \\(f'(s)=s^2/(s+1)>0\\)이므로 \\(t=s^3/(s+1)\\)이에요.","check":{"prompt":"절댓값을 벗길 수 있는 두 부호 조건은 무엇인가요?","answer":"\\(s>0\\)이고 \\(f'(s)=s^2/(s+1)>0\\)이에요."}},{"id":"c2","label":"역관계의 적분 변수를 바꿔요","stepIds":["s4","s5","s6"],"question":"왜 \\(\\int g(t)\\,dt\\)를 \\(\\int s(dt/ds)\\,ds\\)로 바꿀 수 있을까요?","hint":"\\(g(t)=s\\)이고 \\(dt/ds>0\\)인지 먼저 확인해요.","explanation":"\\(t=s^3/(s+1)\\)을 미분하면 \\(dt/ds=[3s^2(s+1)-s^3]/(s+1)^2=s^2(2s+3)/(s+1)^2>0\\)이에요. 그래서 \\(s\\)와 \\(t\\)가 일대일로 대응해요. \\(t=1/2\\)일 때 \\(s=1\\), \\(t=27/4\\)일 때 \\(s=3\\)이에요. \\(g(t)=s\\), \\(dt=(dt/ds)ds\\)이므로 \\(\\int_{1/2}^{27/4}g(t)\\,dt=\\int_1^3s\\frac{dt}{ds}\\,ds\\)로 바뀌어요.","check":{"prompt":"치환 뒤의 변수, 미분 관계, 양 끝값은 각각 무엇인가요?","answer":"변수는 \\(s\\), \\(dt=[s^2(2s+3)/(s+1)^2]ds\\), 양 끝값은 \\(1,3\\)이에요."}},{"id":"c3","label":"나눗셈 뒤 항별로 적분해요","stepIds":["s7","s8","s9","s10","s11"],"question":"\\((2s^4+3s^3)/(s+1)^2\\)을 왜 다항식과 간단한 분수로 나눌까요?","hint":"그 꼴로 바꾸면 각 항을 바로 적분할 수 있어요.","explanation":"적분할 식은 \\(s\\cdot dt/ds=(2s^4+3s^3)/(s+1)^2\\)예요. 다항식 나눗셈을 하면\n\n\\(\\frac{2s^4+3s^3}{(s+1)^2}=2s^2-s+\\frac1{s+1}-\\frac1{(s+1)^2}\\)이에요.\n\n각 항을 적분하면 미분했을 때 원래 식이 되는 함수의 하나는 \\(F(s)=2s^3/3-s^2/2+\\ln(s+1)+1/(s+1)\\)예요. \\(F(3)=18-9/2+\\ln4+1/4=55/4+\\ln4\\), \\(F(1)=2/3-1/2+\\ln2+1/2=2/3+\\ln2\\)이므로 차는 \\(55/4-2/3+\\ln2=157/12+\\ln2\\)예요. 따라서 ⑤예요.","check":{"prompt":"끝값 대입에서 유리수 부분과 로그 부분은 각각 어떻게 나오나요?","answer":"유리수 부분은 \\(55/4-2/3=157/12\\), 로그 부분은 \\(\\ln4-\\ln2=\\ln2\\)예요."}}],"takeaway":["기하적 거리는 좌표 차로 먼저 식을 만들어요.","역함수 적분은 원래 변수의 증가 여부와 양 끝값을 확인한 뒤 변수를 바꿔요.","유리함수 적분은 다항식 나눗셈 뒤 각 항을 적분하고 끝값을 따로 확인해요."]};</script>
