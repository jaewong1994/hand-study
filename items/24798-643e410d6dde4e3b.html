<script>window.HandStudyRecord={"adminYear":2021,"answer":"11","contentHash":"cbe36431caf222d7a02eda2cee22efaa9587018abef44f1054ccbb7c0b245385","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24798,"month":11,"number":29,"points":4,"preview":false,"questionHtml":"\u003cp>그림과 같이 길이가 \u003cspan class=\"heq\">\\(2\\)\u003c/span>인 선분 \u003cspan class=\"heq\">\\(AB\\)\u003c/span>를 지름으로 하는 반원이 있다. 호 \u003cspan class=\"heq\">\\(AB\\)\u003c/span>위에 두점 \u003cspan class=\"heq\">\\(P,\\,Q\\)\u003c/span>를 \u003cspan class=\"heq\">\\(\\angle PAB= \\theta ,\\, \\angle QBA=2 \\theta\\)\u003c/span>가 되도록 잡고, 두 선분 \u003cspan class=\"heq\">\\(AP,\\,BQ\\)\u003c/span>의 교점을 \u003cspan class=\"heq\">\\(R\\)\u003c/span>라 하자. 선분 \u003cspan class=\"heq\">\\(AB\\)\u003c/span>위의 점 \u003cspan class=\"heq\">\\(S\\)\u003c/span>, 선분 \u003cspan class=\"heq\">\\(BR\\)\u003c/span>위의 점 \u003cspan class=\"heq\">\\(T\\)\u003c/span>, 선분 \u003cspan class=\"heq\">\\(AR\\)\u003c/span>위의 점 \u003cspan class=\"heq\">\\(U\\)\u003c/span>를 선분 \u003cspan class=\"heq\">\\(UT\\)\u003c/span>가 선분 \u003cspan class=\"heq\">\\(A B\\)\u003c/span>에 평행하고 삼각형 \u003cspan class=\"heq\">\\(S T U\\)\u003c/span>가 정삼각형이 되도록 잡는다. 두 선분 \u003cspan class=\"heq\">\\(AR,\\,QR\\)\u003c/span>와 호 \u003cspan class=\"heq\">\\(AQ\\)\u003c/span>로 둘러싸인 부분의 넓이를 \u003cspan class=\"heq\">\\(f \\left( \\theta \\right)\\)\u003c/span>, 삼각형 \u003cspan class=\"heq\">\\(S T U\\)\u003c/span>의 넓이를 \u003cspan class=\"heq\">\\(g \\left( \\theta \\right)\\)\u003c/span>라 할 때, \u003cspan class=\"heq\">\\(\\lim _{\\theta \\,\\to 0+} {\\frac{g \\left( \\theta \\right)}{\\theta \\times f \\left( \\theta \\right)} = \\frac{q}{p} \\sqrt{3}}\\)\u003c/span>이다. \u003cspan class=\"heq\">\\(p+q\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(0&lt; \\theta &lt; \\frac{\\pi }{6}\\)\u003c/span>이고, \u003cspan class=\"heq\">\\(p\\)\u003c/span>와 \u003cspan class=\"heq\">\\(q\\)\u003c/span>는 서로소인 자연수이다.) [4점]\u003c/p>\u003cfigure>\u003cimg class=\"hfig\" src=\"../assets/csat/24798-efda3a61377bf525.png\" alt=\"2021년 시행 수능 29번 문항 그림 \" style=\"max-width:100%;width:420px\">\u003c/figure>","questionText":"그림과 같이 길이가 $2$인 선분 $AB$를 지름으로 하는 반원이 있다. 호 $AB$위에 두점 $P,\\,Q$를 $\\angle PAB= \\theta ,\\, \\angle QBA=2 \\theta$가 되도록 잡고, 두 선분 $AP,\\,BQ$의 교점을 $R$라 하자. 선분 $AB$위의 점 $S$, 선분 $BR$위의 점 $T$, 선분 $AR$위의 점 $U$를 선분 $UT$가 선분 $A B$에 평행하고 삼각형 $S T U$가 정삼각형이 되도록 잡는다. 두 선분 $AR,\\,QR$와 호 $AQ$로 둘러싸인 부분의 넓이를 $f \\left( \\theta \\right)$, 삼각형 $S T U$의 넓이를 $g \\left( \\theta \\right)$라 할 때, $\\lim _{\\theta \\,-> 0+} {\\frac{g \\left( \\theta \\right)}{\\theta \\times f \\left( \\theta \\right)} = \\frac{q}{p} \\sqrt{3}}$이다. $p+q$의 값을 구하시오. (단, $0\u003c \\theta \u003c \\frac{\\pi }{6}$이고, $p$와 $q$는 서로소인 자연수이다.) [4점]","sourceHash":"8013818c39eb4c01f5127cd326287eb0dce7bb0583ec5fe41d83be8fb3cbc616","sourceKind":"csat","sourceLabel":"2021년 시행 수능 · 2022학년도 · 미적분 · 29번","steps":[{"id":"s1","latex":"\\overline{\\mathrm{BR}}=\\frac{2\\sin\\theta}{\\sin3\\theta},\\quad H=\\overline{\\mathrm{BR}}\\sin2\\theta=\\frac{2\\sin\\theta\\sin2\\theta}{\\sin3\\theta}"},{"id":"s2","latex":"f(\\theta)=2\\theta+\\frac12\\sin4\\theta-\\frac{2\\sin\\theta\\sin2\\theta}{\\sin3\\theta}"},{"explanation":{"body":"마지막 항을 \\(\\theta\\)로 나누면 \\(2\\frac{\\sin\\theta}{\\theta}\\frac{\\sin2\\theta}{\\sin3\\theta}\\)예요. 두 번째 비는 \\(\\frac23\\frac{\\sin2\\theta}{2\\theta}\\frac{3\\theta}{\\sin3\\theta}\\)로 바꿀 수 있으니 극한이 \\(\\frac23\\)입니다. 따라서 이 항의 극한은 \\(\\frac43\\)이고, 나머지 두 항은 각각 2가 돼요.","skillTags":["limit.trigonometric"],"title":"0으로 가는 식끼리 나눌 때는 표준 극한으로 바꿔요"},"id":"s3","latex":"\\lim_{\\theta\\to0+}\\frac{f(\\theta)}\\theta=2+2-\\frac43=\\frac83"},{"id":"s4","latex":"\\text{정삼각형의 한 변을 }u\\text{라 하면 높이는 }\\frac{\\sqrt3u}{2}"},{"id":"s5","latex":"\\mathrm{UT}\\parallel\\mathrm{AB}\\text{이고 삼각형의 닮음에 의해 }u=2\\left(1-\\frac{\\sqrt3u}{2H}\\right)"},{"id":"s6","latex":"u=\\frac{2H}{H+\\sqrt3}=\\frac{4\\sin\\theta\\sin2\\theta}{2\\sin\\theta\\sin2\\theta+\\sqrt3\\sin3\\theta}"},{"id":"s7","latex":"\\lim_{\\theta\\to0+}\\frac u\\theta=\\frac8{3\\sqrt3},\\quad\\lim_{\\theta\\to0+}\\frac{g(\\theta)}{\\theta^2}=\\frac{\\sqrt3}{4}\\left(\\frac8{3\\sqrt3}\\right)^2=\\frac{16\\sqrt3}{27}"},{"id":"s8","latex":"\\lim_{\\theta\\to0+}\\frac{g(\\theta)}{\\theta f(\\theta)}=\\frac{16\\sqrt3}{27}\\cdot\\frac38=\\frac{2\\sqrt3}{9}\\quad\\Rightarrow\\quad p+q=11"}],"track":"미적분"};</script>
