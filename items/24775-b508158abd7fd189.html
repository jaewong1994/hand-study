\,1 \\right)\\)\u003c/span>에 존재한다.\u003c/p>\u003cdiv class=\"hchoices\">\u003cdiv class=\"hch\">① ㄱ\u003c/div>\u003cdiv class=\"hch\">② ㄱ, ㄴ\u003c/div>\u003cdiv class=\"hch\">③ ㄱ, ㄷ\u003c/div>\u003cdiv class=\"hch\">④ ㄴ, ㄷ\u003c/div>\u003cdiv class=\"hch\">⑤ ㄱ, ㄴ, ㄷ\u003c/div>\u003c/div>","questionText":"수직선 위를 움직이는 점 $P$의 시각 $t$에서의 위치 $x \\left( t \\right)$가 두 상수 $a$, $b$에 대하여\n $x \\left( t \\right)$$=t \\left( t-1 \\right) \\left( at+b \\right)$ ($a != 0$)\n이다. 점 $P$의 시각 $t$에서의 속도 $v \\left( t \\right)$가 $\\int _{0} ^{1} {} \\left| \\,v \\left( t \\right) \\, \\right| \\,dt$$=2$를 만족시킬 때, \u003c보기>에서 옳은 것만을 있는 대로 고른 것은? [4점]\n| 보기 |ㄱ. $\\int _{0} ^{1} {} v \\left( t \\right) \\,dt$$=0$ㄴ. $\\left| \\,x \\left( t _{1} \\right) \\, \\right| >1$인 $t _{1}$이 열린구간 $\\left( 0,\\,1 \\right)$에 존재한다.ㄷ. $0 \\leq t \\leq 1$인 모든 $t$에 대하여 $\\left| \\,x \\left( t \\right) \\, \\right| \u003c1$이면 $x \\left( t _{2} \\right)$$=0$인 $t _{2}$가 열린구간 $\\left( 0,\\,1 \\right)$에 존재한다.\n① ㄱ ② ㄱ, ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","sourceHash":"c3088abe7b10acc5fb7bd0e7ff58c806b1d53c77c75127e16775a9727cba1f16","sourceKind":"csat","sourceLabel":"2021년 시행 수능 · 2022학년도 · 공통 · 14번","steps":[{"id":"s1","latex":"\\text{ㄱ. }\\int_0^1v(t)\\,dt=x(1)-x(0)=0\\quad\\text{(참)}"},{"id":"s2","latex":"\\text{ㄴ. 반례 }x(t)=\\frac{3\\sqrt3}{2}(t^3-t)\\quad(a=b=\\tfrac{3\\sqrt3}{2})"},{"id":"s3","latex":"v(t)=\\frac{3\\sqrt3}{2}(3t^2-1),\\quad x\\left(\\frac1{\\sqrt3}\\right)=-1"},{"id":"s4","latex":"\\int_0^1|v(t)|\\,dt=1+1=2,\\quad |x(t)|\\le1\\quad(0\\le t\\le1)\\quad\\Rightarrow\\quad\\text{ㄴ 거짓}"},{"id":"s5","latex":"\\text{ㄷ. }0\u003ct\u003c1\\text{에 }x(t)=0\\text{인 점이 없다고 가정}"},{"id":"s6","latex":"x(t)\\text{의 세 번째 근은 }0\u003ct\u003c1\\text{ 밖}\\quad\\Rightarrow\\quad v(t)=0\\text{은 }0\u003cc\u003c1\\text{에서 하나}"},{"id":"s7","latex":"\\int_0^1|v(t)|\\,dt=2|x(c)|=2\\quad\\Rightarrow\\quad |x(c)|=1\\quad\\text{모순}"},{"id":"s8","latex":"\\text{ㄱ, ㄷ}\\quad\\therefore\\text{③}"}],"track":"공통"};</script>
