<script>window.HandStudyGuide={"itemId":17520,"sourceHash":"cf7e4bb49994dd322d9b1b039b60ae431b32cc466a8c3452f0ed6a60858131f6","contentHash":"715d8ea27695be9b6ebfbb383012e4b2e97082ff921b5e583e5ccde68a43763a","overview":{"goal":"\\(f(1)\\)의 값에 따라 경우를 나누고, 함수 조건과 대소 관계를 함께 만족하는 함수를 세어요.","firstLook":"\\(f(f(1))=4\\)는 \\(f(1)\\)을 먼저 정하면 그 값에서의 함숫값이 4로 고정된다는 뜻이에요. 그래서 \\(k=f(1)\\)로 두고 \\(k=1,2,3,4,5\\)를 빠짐없이 확인해요.","conditions":[{"label":"합성 조건","meaning":"\\(k=f(1)\\)로 두면 \\(f(k)=4\\)예요."},{"label":"대소 조건","meaning":"\\(k\\le f(3)\\le f(5)\\)이고 세 값은 모두 집합 \\(X\\)의 원소예요."}]},"chapters":[{"id":"c1","label":"첫 함숫값으로 경우를 나눠요","stepIds":["s1","s2"],"question":"\\(k=f(1)\\)로 둘 때 \\(k=1\\)과 \\(k=5\\)는 왜 바로 제외될까요?","hint":"각 경우에 \\(f(k)=4\\)와 \\(k\\le f(3)\\le f(5)\\)를 따로 넣어 봐요.","explanation":"\\(k=f(1)\\)로 두면 (가)는 \\(f(k)=4\\), (나)는 \\(k\\le f(3)\\le f(5)\\)가 돼요.\n\n\\(k=1\\)이면 \\(f(1)=1\\)이어야 하는데 동시에 \\(f(k)=f(1)=4\\)여야 해서 모순이에요. \\(k=5\\)이면 \\(f(5)=4\\)인데 대소 조건은 \\(5\\le f(3)\\le f(5)=4\\)를 요구하므로 불가능해요. 따라서 가능한 값은 \\(k=2,3,4\\)뿐이에요.","check":{"prompt":"\\(k=5\\)가 안 되는 이유를 합성 조건과 대소 조건을 모두 써서 말해 보세요.","answer":"합성 조건에서 \\(f(5)=4\\)이고 대소 조건에서 \\(5\\le f(5)\\)여야 하는데, \\(5\\le4\\)는 거짓이라서 불가능해요."}},{"id":"c2","label":"각 경우의 고정값과 자유값을 구분해요","stepIds":["s3","s4","s5"],"question":"\\(k=2,3,4\\)에서 대소 조건을 만족하는 값과 자유롭게 정할 값을 어떻게 세면 될까요?","hint":"먼저 \\(f(k)=4\\)로 고정되는 값을 표시한 뒤, \\((f(3),f(5))\\)를 세고 남은 함숫값을 세어요.","explanation":"\\(k=2\\)이면 \\(f(1)=2\\), \\(f(2)=4\\)로 고정돼요. \\((f(3),f(5))\\)는 \\(2\\le f(3)\\le f(5)\\le5\\)를 만족해야 해요. \\(2,3,4,5\\)에서 중복을 허용해 두 값을 작은 순서로 고르는 경우이므로 \\({}_4\\mathrm H_2={}_5\\mathrm C_2=10\\)가지예요. 남은 \\(f(4)\\)는 1부터 5까지 자유로워서 \\(10\\times5=50\\)가지예요.\n\n\\(k=3\\)이면 \\(f(1)=3\\), \\(f(3)=4\\)예요. 대소 조건은 \\(3\\le4\\le f(5)\\)이므로 \\(f(5)=4,5\\)의 2가지예요. \\(f(2),f(4)\\)는 각각 5가지여서 \\(2\\times5\\times5=50\\)가지예요.\n\n\\(k=4\\)이면 \\(f(1)=4\\), \\(f(4)=4\\)예요. \\((f(3),f(5))\\)는 \\((4,4),(4,5),(5,5)\\)의 3가지이고, \\(f(2)\\)는 5가지여서 \\(3\\times5=15\\)가지예요.","check":{"prompt":"\\(k=3\\)일 때 \\(f(5)\\)가 3이 될 수 없는 이유와 자유롭게 정하는 두 함숫값은 무엇인가요?","answer":"\\(f(3)=4\\le f(5)\\)여야 하므로 \\(f(5)=3\\)은 안 돼요. \\(f(2)\\)와 \\(f(4)\\)는 각각 1부터 5까지 자유롭게 정해요."}},{"id":"c3","label":"서로 겹치지 않는 경우를 더해요","stepIds":["s6"],"question":"세 경우의 수를 그대로 더해도 되는 이유는 무엇일까요?","hint":"각 경우는 서로 다른 \\(f(1)\\)의 값으로 나뉘어요.","explanation":"\\(k=2,3,4\\)는 \\(f(1)\\)의 값이 서로 달라 같은 함수가 두 경우에 동시에 들어갈 수 없어요. 또 \\(k=1,5\\)는 불가능함을 확인했으므로 빠진 경우도 없어요. 따라서 전체 함수의 개수는 \\(50+50+15=115\\)예요.","check":{"prompt":"마지막 합에서 중복해서 센 경우도 없고 누락도 없는 이유는 무엇인가요?","answer":"\\(f(1)\\)의 다섯 값을 전부 조사했고, 가능한 값 2, 3, 4는 서로 배타적인 경우이기 때문이에요."}}],"takeaway":["합성함수 조건에 \\(f(1)\\)이 다시 들어가면 \\(k=f(1)\\)로 두어 \\(f(k)\\)를 먼저 고정해요.","함수의 개수를 셀 때는 조건으로 고정되는 함숫값과 남아서 자유로운 함숫값을 구분해 곱해요.","경우를 더하기 전에는 분류 기준이 전체를 빠짐없이 덮고 서로 겹치지 않는지 확인해요."]};</script>
