<script>window.HandStudyGuide={"itemId":17433,"sourceHash":"7f21600b9bbbb9f15cfb5a2bf1c30dab390338551fe3463b331d3464fca022bb","contentHash":"8b91c1edfb8cdc1de232cfce96452066e364df302677bd5fc5ab5e285e4b279d","overview":{"goal":"두 확률밀도함수 아래의 전체 넓이가 1이라는 조건으로 \\(a,b\\)를 정하고, 누적 넓이로 \\(c\\)를 구해요.","firstLook":"\\(f(x)=b\\)는 직사각형, \\(g(x)=P(0\\le X\\le x)\\)는 \\(f\\) 아래의 0부터 \\(x\\)까지 넓이예요. 두 함수 모두 확률밀도함수이므로 0부터 \\(a\\)까지의 전체 넓이가 각각 1이에요.","conditions":[{"label":"X의 밀도","meaning":"높이 \\(b\\), 밑변 \\(a\\)인 직사각형의 넓이가 1이에요."},{"label":"Y의 밀도","meaning":"\\(g(x)=bx\\)이고, 이 직선 아래 0부터 \\(a\\)까지의 삼각형 넓이도 1이에요."}]},"chapters":[{"id":"c1","label":"두 전체 넓이로 a와 b를 정해요","stepIds":["s1","s2"],"question":"\\(f\\)와 \\(g\\)의 전체 넓이가 각각 1이라는 조건은 어떤 식을 만들까요?","hint":"먼저 \\(f\\)의 직사각형 넓이로 \\(ab=1\\)을 얻고, 이를 \\(g\\)에 사용해요.","explanation":"\\(f(x)=b\\)가 \\(0\\le x\\le a\\)에서 확률밀도함수이므로 전체 넓이는 \\(ab=1\\)이에요. 따라서 \\(g(x)=P(0\\le X\\le x)=\\int_0^x b\\,dt=bx=x/a\\)예요.\n\n\\(g\\)도 \\(Y\\)의 확률밀도함수이므로 0부터 \\(a\\)까지의 넓이가 1이어야 해요. 그래프는 \\((0,0)\\)과 \\((a,g(a))=(a,1)\\)을 잇는 선분 아래 삼각형이므로 넓이는 \\(a/2\\)예요. \\(a/2=1\\)에서 \\(a=2\\), 그리고 \\(ab=1\\)에서 \\(b=1/2\\)예요.","check":{"prompt":"\\(g(a)=1\\)인 이유를 확률의 뜻으로 설명해 보세요.","answer":"\\(X\\)가 가질 수 있는 값이 0부터 \\(a\\)까지 전부이므로 \\(P(0\\le X\\le a)=1\\)이에요."}},{"id":"c2","label":"Y의 누적 넓이로 c를 구해요","stepIds":["s3"],"question":"\\(P(0\\le Y\\le c)=1/2\\)는 그래프에서 어떤 넓이일까요?","hint":"\\(g(x)=x/2\\) 아래에서 0부터 \\(c\\)까지의 삼각형 넓이를 구해요.","explanation":"\\(a=2,b=1/2\\)이므로 \\(g(x)=x/2\\)예요. 따라서 \\(P(0\\le Y\\le c)=\\int_0^c x/2\\,dx\\)는 밑변 \\(c\\), 높이 \\(c/2\\)인 삼각형의 넓이예요. 즉 \\((1/2)c(c/2)=c^2/4=1/2\\)이므로 \\(c^2=2\\)예요. 확률의 구간이 \\(0\\le Y\\le c\\)이므로 \\(c\\ge0\\)이고 \\(c=\\sqrt2<2=a\\)여서 범위 안에 있어요.","check":{"prompt":"\\(c^2=2\\)에서 음의 값을 고려하지 않는 이유는 무엇인가요?","answer":"\\(c\\)는 확률 구간 \\(0\\le Y\\le c\\)의 오른쪽 끝이므로 0 이상이어야 해요."}},{"id":"c3","label":"요구한 식에 값을 넣어요","stepIds":["s4"],"question":"\\((a+b)c^2\\)의 값은 얼마인가요?","hint":"\\(a=2,b=1/2,c^2=2\\)를 그대로 넣어요.","explanation":"\\((a+b)c^2=(2+1/2)\\times2=(5/2)\\times2=5\\)예요. \\(c=\\sqrt2\\)가 \\(Y\\)의 범위 \\([0,2]\\) 안에 있으므로 구한 넓이 조건도 실제로 성립해요.","check":{"prompt":"마지막에 \\(c\\) 대신 \\(c^2\\)만으로 계산해도 되는 이유는 무엇인가요?","answer":"문제에서 요구한 식이 \\((a+b)c^2\\)이므로 앞에서 구한 \\(c^2=2\\)를 바로 쓰면 돼요."}}],"takeaway":["확률밀도함수는 가능한 값의 전체 범위에서 그래프 아래 넓이가 1이에요.","누적확률로 정의된 함수는 원래 밀도 아래의 왼쪽부터 현재 값까지의 넓이로 해석해요.","제곱값을 구한 뒤에는 확률변수의 범위로 부호와 실제 위치를 확인해요."]};</script>
