<script>window.HandStudyGuide={"itemId":17075,"sourceHash":"a7ab93ff729c64d9fff6524ceaf4bdaf439fdf649f39049e7e126ff0e4eaed1a","contentHash":"ad18a60221d79cda6d1b677fb70fc06b375934c7b17965fccaef9b44300d8b5d","overview":{"goal":"절댓값 앞의 부호가 바뀌는 \\(0,2\\)에서 연속성과 미분가능성을 적용해 삼차함수와 \\(a\\)를 정해요.","firstLook":"\\(0,2\\)의 양쪽에서 \\(g\\)의 식이 서로 반대예요. 값이 이어지려면 \\(|f|=a\\), 기울기까지 이어지려면 \\(f'=0\\)이 필요해요.","conditions":[{"label":"조건 (가)","meaning":"\\((0,2)\\) 안과 밖에서 \\(g\\)의 부호가 반대로 정의돼요."},{"label":"조건 (나)","meaning":"경계 두 점에서 함숫값과 좌우미분계수가 모두 같아야 해요."}]},"chapters":[{"id":"c1","label":"구간별 식과 연속 조건을 써요","stepIds":["s1","s2"],"question":"0과 2의 양쪽에서 g는 어떻게 달라지나요?","hint":"\\(|x(x-2)|\\)와 \\(x(x-2)\\)의 부호를 비교하세요.","explanation":"\\(x<0\\) 또는 \\(x>2\\)에서는 \\(g=|f|-a\\), \\(0<x<2\\)에서는 \\(g=a-|f|\\)예요. 양쪽 식이 경계에서 같은 값을 가지려면 \\(|f(0)|-a=a-|f(0)|\\), \\(|f(2)|-a=a-|f(2)|\\)여야 하므로 \\(|f(0)|=|f(2)|=a\\)예요.","check":{"prompt":"경계에서 g의 값은 얼마가 되나요?","answer":"두 점 모두 \\(|f|=a\\)라서 \\(g=0\\)이에요."}},{"id":"c2","label":"미분가능성으로 도함수의 근을 정해요","stepIds":["s3","s4"],"question":"왜 \\(f'(0)=f'(2)=0\\)인가요?","hint":"\\(a>0\\)이므로 경계에서 \\(f\\ne0\\)이고 \\(|f|\\)는 미분가능해요.","explanation":"경계에서 \\(|f|=a>0\\)라 \\(f\\ne0\\)예요. 바깥쪽 식과 안쪽 식은 \\(|f|\\) 항의 부호가 반대이므로 좌우미분계수가 같으려면 \\((|f|)'=0\\), 곧 \\(f'=0\\)이어야 해요. 최고차항 계수가 \\(1\\)인 삼차함수라 \\(f'\\)의 최고차항은 \\(3x^2\\)이고 두 근이 \\(0,2\\)이므로 \\(f'(x)=3x(x-2)\\)예요. 적분하면 \\(f=x^3-3x^2+C\\)예요.","check":{"prompt":"\\(|f|\\)의 미분에서 f가 0일 가능성을 왜 걱정하지 않아도 되나요?","answer":"경계에서 \\(|f|=a\\)이고 \\(a>0\\)이므로 \\(f\\ne0\\)이에요."}},{"id":"c3","label":"상수와 답을 계산해요","stepIds":["s5","s6"],"question":"\\(|C|=|C-4|\\)에서 C는 무엇인가요?","hint":"두 수가 0에서 같은 거리에 있다는 뜻이에요.","explanation":"\\(f(0)=C\\), \\(f(2)=C-4\\)이므로 \\(|C|=|C-4|=a\\)예요. 제곱해 비교하면 \\(C^2=(C-4)^2\\)에서 \\(C=2\\), 따라서 \\(a=2\\)예요. \\(3a=6>2\\)이므로 바깥쪽 식을 써서 \\(g(6)=|216-108+2|-2=108\\)이에요.","check":{"prompt":"마지막에 어느 구간의 g 식을 썼나요?","answer":"\\(6>2\\)이므로 \\(g=|f|-a\\)를 썼어요."}}],"takeaway":["조각함수의 미분가능성은 먼저 연속성을 확인해요.","절댓값 안이 0이 아닌지 확인한 뒤 미분해요.","마지막 대입점이 어느 조각에 속하는지 다시 확인해요."]};</script>
