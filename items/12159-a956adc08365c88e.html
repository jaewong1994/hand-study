  <script>window.HandStudyRecord={"itemId":12159,"sourceLabel":"2025 교육청 고1 수학 9월 20번","adminYear":2025,"grade":1,"month":9,"number":20,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"최고차항의 계수가 $a\\, \\left(a \u003c 0 \\right)\\,$인 두 이차함수 $f \\left(x \\right)\\,$, $g \\left(x \\right)\\,$에 대하여 $f \\left(3 \\right)=g \\left(3 \\right)\\,$이다. 함수 $h \\left(x \\right)\\,$를\n $h \\left(x \\right)= \\begin{cases}\\,f \\left(x \\right) & & \\left(x \\leq 3 \\right) \\\\ \\, g \\left(x \\right) & & \\left(x > 3 \\right)\\end{cases}\\,$\n이라 할 때, 함수 $h \\left(x \\right)\\,$가 다음 조건을 만족시킨다.\n(가) 함수 $y=h \\left(x \\right)\\,$의 그래프와 직선 $y=f \\left(0 \\right)\\,$이 만나는 점의 $x\\,$좌표는 $0\\,$, $4\\,$, $12\\,$뿐이다.(나) 두 실수 $\\alpha\\,$, $\\beta \\, \\left( \\alpha \u003c 3 \u003c \\beta \\right)\\,$에 대하여 함수 $y=h \\left(x \\right)\\,$의 그래프와 직선 $y=2x-8\\,$이 만나는 점의 $x\\,$좌표는 $\\alpha\\,$, $3\\,$, $\\beta\\,$이다.\n$\\alpha + \\beta =6\\,$일 때, $h \\left(-2 \\right)+h \\left(5 \\right)\\,$의 값은? [4점]\n① $15\\,$ ② $16\\,$ ③ $17\\,$ ④ $18\\,$ ⑤ $19$","answer":"③","sourceHash":"c1063ca7fd90bcd5491403fc5a8b1043af7039a9d14d7a1575340219ea4949d1","steps":[{"id":"s1","latex":"g(4)=g(12)=f(0)\\Rightarrow\\text{axis}(g):x=8"},{"id":"s2","latex":"f(3)=g(3)=2\\cdot3-8=-2"},{"id":"s3","latex":"\\text{axis}(f):x=p,\\quad f(0)-f(3)=a\\{p^2-(3-p)^2\\}=-9a\\Rightarrow p=0"},{"id":"s4","latex":"f(x)=2x-8:\\quad\\alpha+3=\\frac2a"},{"id":"s5","latex":"g(x)=2x-8:\\quad3+\\beta=16+\\frac2a"},{"id":"s6","latex":"\\alpha+\\beta=6\\Rightarrow a=-1"},{"id":"s7","latex":"f(x)=-x^2+7,\\quad g(x)=-(x-8)^2+23"},{"id":"s8","latex":"h(-2)+h(5)=3+14=17"}],"diagram":null,"contentHash":"cf75fde6326554b3a13f368afcffc19957fe784b90b67b7a7fb22f553604a705","questionHtml":"\u003cp class=\"hp\">최고차항의 계수가 \u003cspan class=\"heq\">\\(a\\, \\left(a \\lt  0 \\right)\\,\\)\u003c/span>인 두 이차함수 \u003cspan class=\"heq\">\\(f \\left(x \\right)\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(g \\left(x \\right)\\,\\)\u0
