<script>window.HandStudyRecord={"itemId":11899,"sourceLabel":"2022 교육청 고1 수학 9월 30번","adminYear":2022,"grade":1,"month":9,"number":30,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"최고차항의 계수가 $1\\,$인 이차함수 $y=f \\left( x \\right) \\,$의 그래프를 원점에 대하여 대칭이동하면 이차함수 $y=g \\left( x \\right) \\,$의 그래프와 일치한다. 방정식 $f \\left( x \\right)$$=g \\left( x \\right) \\,$는 서로 다른 두 실근 $\\alpha \\,$, $\\beta \\,$$\\left( \\, \\alpha < \\beta \\, \\right) \\,$를 갖고, 함수 $h \\left( x \\right) \\,$는 \n $h(x)=\\begin{cases} f(x) & (x<\\alpha\\ \\text{또는}\\ x>\\beta) \\\\ g(x) & (\\alpha \\leq x \\leq \\beta) \\end{cases}$\n일 때, 함수 $h \\left( x \\right) \\,$는 다음 조건을 만족시킨다.\n(가) 방정식 $h(x)$$=h \\left( \\beta \\right) \\,$는 서로 다른 세 실근을 갖고, 세 실근의 합은 $-4\\,$이다. (나) 함수 $y=h \\left( x \\right) \\,$의 그래프 위의 점 중에서 $y\\,$좌표가 음의 정수인 점의 개수는 $15\\,$이다.\n$h \\left( 2 \\right)$$+h \\left( 5 \\right) \\,$의 값을 구하시오. [4점]","answer":"35","sourceHash":"ee188558e9b7de983bcf6fd894014d1706d7835b0d3ad3e8af4555febae705b6","steps":[{"id":"s1","latex":"f(x)=x^2+px+q,\\quad g(x)=-f(-x)=-x^2+px-q"},{"id":"s2","latex":"f(x)=g(x)\\Rightarrow x^2+q=0\\Rightarrow\\alpha=-\\beta,\\ q=-\\beta^2"},{"id":"s3","latex":"h(\\beta)=p\\beta"},{"id":"s4","latex":"[-\\beta,\\beta]:\\quad h(x)=p\\beta\\Rightarrow(x-\\beta)(x-p+\\beta)=0"},{"id":"s5","latex":"x\\notin[-\\beta,\\beta]:\\quad h(x)=p\\beta\\Rightarrow(x-\\beta)(x+p+\\beta)=0"},{"id":"s6","latex":"0<p<2\\beta:\\quad\\{x\\}=\\{\\beta,p-\\beta,-p-\\beta\\}"},{"id":"s7","latex":"\\sum x=-\\beta=-4\\Rightarrow\\beta=4"},{"id":"s8","latex":"h(x)\\text{의 최솟값은 }h(-4)=-4p,\\quad0<p<8"},{"id":"s9","latex":"N_{y\\in-\\mathbb N}=15\\Rightarrow4p\\in\\mathbb N,\\quad2(4p-1)+1=15"},{"id":"s10","latex":"p=2,\\quad f(x)=x^2+2x-16,\\quad g(x)=-x^2+2x+16"},{"id":"s11","latex":"h(2)+h(5)=g(2)+f(5)=16+19=35"}],"diagram":null,"contentHash":"73e1dbd9b08209b4f50a2dd27ffbd570165aa3634f8e8417c4f639b487fe89a7","questionHtml":"<p class=\"hp\">최고차항의 계수가 <span class=\"heq\">\\(1\\,\\)<\/span>인 이차함수 <span class=\"heq\">\\(y=f \\left( x \\right) \\,\\)<\/span>의 그래프를 원점에 대하여 대칭이동하면 이차함수 <span class=\"heq\">\\(y=g \\left( x \\right) \\,\\)<\/span>의 그래프와 일치한다. 방정식 <span class=\"heq\">\\(f \\left( x \\right)\\)<\/span><span class=\"heq\">\\(=g \\left( x \\right) \\,\\)<\/span>는 서로 다른 두 실근 <span class=\"heq\">\\(\\alpha \\,\\)<\/span>, <span class=\"heq\">\\(\\beta \\,\\)<\/span><span class=\"heq\">\\(\\left( \\, \\alpha \\lt  \\beta \\, \\right) \\,\\)<\/span>를 갖고, 함수 <span class=\"heq\">\\(h \\left( x \\right) \\,\\)<\/span>는<\/p><p class=\"hp htall\"><span class=\"heq\">\\(h(x) = {\\begin{cases}\\,f(x) &\\,\\left( \\,x\\lt \\alpha \\text{ 또는 } x\\gt \\beta \\, \\right) \\\\ \\,g(x) &\\,\\left( \\, \\alpha \\leq x \\leq \\beta \\, \\right)\\end{cases}}\\)<\/span><\/p><p class=\"hp\">일 때, 함수 <span class=\"heq\">\\(h \\left( x \\right) \\,\\)<\/span>는 다음 조건을 만족시킨다.<\/p><table class=\"htbl\"><tr><td colspan=\"3\" style=\"width:412px;border-top:1px solid #333;border-bottom:none;border-left:1px solid #333;border-right:1px solid #333\">&nbsp;<\/td><\/tr><tr><td style=\"width:7px;border-top:none;border-bottom:none;border-left:1px solid #333;border-right:none\">&nbsp;<\/td><td style=\"width:397px;border-top:none;border-bottom:none;border-left:none;border-right:none\"><p class=\"hp\">(가) 방정식 <span class=\"heq\">\\(h(x)=h \\left( \\beta \\right) \\,\\)<\/span>는 서로 다른 세 실근을 갖고, <br>세 실근의 합은 <span class=\"heq\">\\(-4\\,\\)<\/span>이다.<\/p><p class=\"hp\">(나) 함수 <span class=\"heq\">\\(y=h \\left( x \\right) \\,\\)<\/span>의 그래프 위의 점 중에서 <span class=\"heq\">\\(y\\,\\)<\/span>좌표가 <br>음의 정수인 점의 개수는 <span class=\"heq\">\\(15\\,\\)<\/span>이다.<\/p><\/td><td style=\"width:7px;border-top:none;border-bottom:none;border-left:none;border-right:1px solid #333\">&nbsp;<\/td><\/tr><tr><td colspan=\"3\" style=\"width:412px;border-top:none;border-bottom:1px solid #333;border-left:1px solid #333;border-right:1px solid #333\">&nbsp;<\/td><\/tr><\/table><p class=\"hp\"><span class=\"heq\">\\(h \\left( 2 \\right)\\)<\/span><span class=\"heq\">\\(+h \\left( 5 \\right) \\,\\)<\/span>의 값을 구하시오. <span class=\"hscore\">[4점]<\/span><\/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"d696db4638299243f56e099dd1de1540532fe93a71aa67f78e3ffbf039e617fb"};</script>
<script>window.HandStudyGuide={"itemId":11899,"sourceHash":"ee188558e9b7de983bcf6fd894014d1706d7835b0d3ad3e8af4555febae705b6","contentHash":"73e1dbd9b08209b4f50a2dd27ffbd570165aa3634f8e8417c4f639b487fe89a7","overview":{"goal":"원점 대칭인 두 이차함수의 교점과 음의 정수 높이의 점 개수로 \\(h\\)를 정해요.","firstLook":"\\(f(x)=x^2+px+q\\)로 두면 원점 대칭 그래프는 \\(g(x)=-f(-x)\\)예요.","conditions":[{"label":"세 실근의 합","meaning":"각 조각에서 얻은 근이 실제 정의구간에 들어가는지 확인한 뒤 세 근을 더해요."},{"label":"음의 정수 높이","meaning":"가장 낮은 높이에서는 한 점, 그 위의 각 음의 정수 높이에서는 두 점씩 생겨요."}]},"chapters":[{"id":"c1","label":"대칭과 교점으로 조각의 경계를 정해요","stepIds":["s1","s2","s3"],"question":"왜 \\(\\alpha=-\\beta\\), \\(q=-\\beta^2\\)인가요?","hint":"\\(g(x)=-f(-x)\\)를 전개한 뒤 \\(f=g\\)를 풀어요.","explanation":"\\(f(x)=x^2+px+q\\)라 두면 원점 대칭은 \\(g(x)=-f(-x)=-x^2+px-q\\)예요. \\(f(x)=g(x)\\)에서 \\(2x^2+2q=0\\), 즉 \\(x^2=-q\\)예요. 서로 다른 두 근이므로 \\(q<0\\)이고 두 근은 \\(\\alpha=-\\beta\\), \\(q=-\\beta^2\\)예요. 교점에서 \\(h(\\beta)=f(\\beta)=p\\beta\\)예요.","check":{"prompt":"두 교점이 원점에 대하여 좌우 대칭인 이유는 무엇인가요?","answer":"교점 방정식이 \\(x^2=-q\\)라서 두 해가 서로 반대인 \\(\\pm\\sqrt{-q}\\)이기 때문이에요."}},{"id":"c2","label":"세 근의 위치로 beta를 구해요","stepIds":["s4","s5","s6","s7"],"question":"\\(h(x)=h(\\beta)\\)의 세 근은 무엇인가요?","hint":"안쪽에서는 \\(g(x)=p\\beta\\), 바깥쪽에서는 \\(f(x)=p\\beta\\)를 각각 인수분해해요.","explanation":"안쪽 식은 \\(g(x)=p\\beta\\)에서 \\((x-\\beta)(x-p+\\beta)=0\\)이므로 후보가 \\(\\beta,p-\\beta\\)예요. 바깥쪽 식은 \\(f(x)=p\\beta\\)에서 \\((x-\\beta)(x+p+\\beta)=0\\)이므로 후보가 \\(\\beta,-p-\\beta\\)예요. 정의구간에 맞게 서로 다른 세 근이 모두 남으려면 \\(0<p<2\\beta\\)이고, 근은 \\(\\beta,p-\\beta,-p-\\beta\\)예요.\n\n합은 \\(\\beta+(p-\\beta)+(-p-\\beta)=-\\beta\\)예요. 이것이 \\(-4\\)이므로 \\(\\beta=4\\)이고 \\(q=-16\\)이에요.","check":{"prompt":"식에서 나온 후보를 그대로 모두 세면 안 되는 이유는 무엇인가요?","answer":"\\(h\\)는 구간에 따라 \\(f\\)와 \\(g\\)를 다르게 쓰므로 각 근이 그 식을 쓰는 구간에 들어가는지 확인해야 해요."}},{"id":"c3","label":"음의 정수 높이의 점을 세어요","stepIds":["s8","s9"],"question":"점이 \\(15\\)개라는 조건에서 왜 \\(p=2\\)인가요?","hint":"가장 낮은 음의 정수 높이에는 점이 한 개이고, 그 위에는 좌우로 두 개씩 있어요.","explanation":"\\(h\\)의 가장 작은 함숫값은 경계 \\(x=-4\\)에서 \\(h(-4)=-4p\\)이고 \\(0<p<8\\)이에요. 음의 정수 높이의 점 개수가 홀수 \\(15\\)이므로 가장 낮은 높이도 음의 정수이고, 그 높이의 점은 한 개예요. \\(-1,-2,\\ldots,-4p\\) 중 위의 \\(4p-1\\)개 높이에는 점이 두 개씩, 마지막 높이에는 한 개가 있어 \\(2(4p-1)+1=15\\)예요. 따라서 \\(4p=8\\), \\(p=2\\)예요.","check":{"prompt":"가장 낮은 높이에서 점을 한 개만 세는 이유는 무엇인가요?","answer":"그 높이에서는 두 조각이 만나는 경계점이 겹쳐 같은 점 하나가 되기 때문이에요."}},{"id":"c4","label":"요구한 두 함숫값을 계산해요","stepIds":["s10","s11"],"question":"\\(x=2\\)와 \\(x=5\\)에서는 어느 식을 쓰나요?","hint":"경계는 \\(-4,4\\)예요.","explanation":"\\(p=2,q=-16\\)이므로 \\(f(x)=x^2+2x-16\\), \\(g(x)=-x^2+2x+16\\)이에요. \\(2\\)는 \\([-4,4]\\) 안이므로 \\(h(2)=g(2)=16\\)이고, \\(5\\)는 바깥이므로 \\(h(5)=f(5)=19\\)예요. 따라서 합은 \\(35\\)예요.","check":{"prompt":"두 값을 같은 이차식에 넣지 않는 이유는 무엇인가요?","answer":"\\(h\\)가 교점 사이에서는 \\(g\\), 바깥에서는 \\(f\\)로 정의된 조각함수이기 때문이에요."}}],"takeaway":["원점 대칭 그래프는 \\(g(x)=-f(-x)\\)로 식을 만들어요.","조각함수 방정식의 근은 식을 푼 뒤 각 정의구간에 속하는지 확인해요.","그래프 위 점의 개수는 높이별 교점 수를 세고 가장 낮은 높이의 중복을 따로 처리해요."]};</script>
