  <script>window.HandStudyRecord={"itemId":11899,"sourceLabel":"2022 교육청 고1 수학 9월 30번","adminYear":2022,"grade":1,"month":9,"number":30,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"최고차항의 계수가 $1\\,$인 이차함수 $y=f \\left( x \\right) \\,$의 그래프를 원점에 대하여 대칭이동하면 이차함수 $y=g \\left( x \\right) \\,$의 그래프와 일치한다. 방정식 $f \\left( x \\right)$$=g \\left( x \\right) \\,$는 서로 다른 두 실근 $\\alpha \\,$, $\\beta \\,$$\\left( \\, \\alpha \u003c \\beta \\, \\right) \\,$를 갖고, 함수 $h \\left( x \\right) \\,$는 \n $h(x)=\\begin{cases} f(x) & (x\u003c\\alpha\\ \\text{또는}\\ x>\\beta) \\\\ g(x) & (\\alpha \\leq x \\leq \\beta) \\end{cases}$\n일 때, 함수 $h \\left( x \\right) \\,$는 다음 조건을 만족시킨다.\n(가) 방정식 $h(x)$$=h \\left( \\beta \\right) \\,$는 서로 다른 세 실근을 갖고, 세 실근의 합은 $-4\\,$이다. (나) 함수 $y=h \\left( x \\right) \\,$의 그래프 위의 점 중에서 $y\\,$좌표가 음의 정수인 점의 개수는 $15\\,$이다.\n$h \\left( 2 \\right)$$+h \\left( 5 \\right) \\,$의 값을 구하시오. [4점]","answer":"35","sourceHash":"ee188558e9b7de983bcf6fd894014d1706d7835b0d3ad3e8af4555febae705b6","steps":[{"id":"s1","latex":"f(x)=x^2+px+q,\\quad g(x)=-f(-x)=-x^2+px-q"},{"id":"s2","latex":"f(x)=g(x)\\Rightarrow x^2+q=0\\Rightarrow\\alpha=-\\beta,\\ q=-\\beta^2"},{"id":"s3","latex":"h(\\beta)=p\\beta"},{"id":"s4","latex":"[-\\beta,\\beta]:\\quad h(x)=p\\beta\\Rightarrow(x-\\beta)(x-p+\\beta)=0"},{"id":"s5","latex":"x\\notin[-\\beta,\\beta]:\\quad h(x)=p\\beta\\Rightarrow(x-\\beta)(x+p+\\beta)=0"},{"id":"s6","latex":"0\u003cp\u003c2\\beta:\\quad\\{x\\}=\\{\\beta,p-\\beta,-p-\\beta\\}"},{"id":"s7","latex":"\\sum x=-\\beta=-4\\Rightarrow\\beta=4"},{"id":"s8","latex":"\\min h=h(-4)=-4p,\\quad0\u003cp\u003c8"},{"id":"s9","latex":"N_{y\\in-\\mathbb N}=15\\Rightarrow4p\\in\\mathbb N,\\quad2(4p-1)+1=15"},{"id":"s10","latex":"p=2,\\quad f(x)=x^2+2x-16,\\quad g(x)=-x^2+2x+16"},{"id":"s11","latex":"h(2)+h(5)=g(2)+f(5)=16+19=35"}],"diagram":null,"contentHash":"8a9d9f4421e695c81b50973e1c5f025a3c16e03cf864430721dcfe0c63e0c31d","questionHtml":"\u003cp class=\"hp\">최고차항의 계수가 \u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>인 이차함수 \u003cspan class=\"heq\">\\(y=f \\left( x \\right) \\,\\)\u003c/span>의 그래프를 원점에 대하여 대칭이동하면 이차함수 \u003cspan class=\"heq\">\\(y=g \\left( x \\right) \\,\\)\u003c/span>의 그래프와 일치한다. 방정식 \u003cspan class=\"heq\">\\(f \\left( x \\right)\\)\u003c/span>\u003cspan class=\"heq\">\\(=g \\left( x \\right) \\,\\)\u003c/span>는 서로 다른 두 실근 \u003cspan class=\"heq\">\\(\\alpha \\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(\\beta \\,\\)\u003c/span>\u003cspan class=\"heq\">\\(\\left( \\, \\alpha \\lt  \\beta \\, \\right) \\,\\)\u003c/span>를 갖고, 함수 \u003cspan class=\"heq\">\\(h \\left( x \\right) \\,\\)\u003c/span>는\u003c/p>\u003cp class=\"hp htall\">\u003cspan class=\"heq\">\\(h(x) = {\\begin{cases}\\,f(x) &\\,\\left( \\,x\\lt \\alpha \\text{ 또는 } x\\gt \\beta \\, \\right) \\\\ \\,g(x) &\\,\\left( \\, \\alpha \\leq x \\leq \\beta \\, \\right)\\end{cases}}\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">일 때, 함수 \u003cspan class=\"heq\">\\(h \\left( x \\right) \\,\\)\u003c/span>는 다음 조건을 만족시킨다.\u003c/p>\u003ctable class=\"htbl\">\u003ctr>\u003ctd colspan=\"3\" style=\"width:412px;border-top:1px solid #333;border-bottom:none;border-left:1px solid #333;border-right:1px solid #333\">&nbsp;\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"width:7px;border-top:none;border-bottom:none;border-left:1px solid #333;border-right:none\">&nbsp;\u003c/td>\u003ctd style=\"width:397px;border-top:none;border-bottom:none;border-left:none;border-right:none\">\u003cp class=\"hp\">(가) 방정식 \u003cspan class=\"heq\">\\(h(x)=h \\left( \\beta \\right) \\,\\)\u003c/span>는 서로 다른 세 실근을 갖고, \u003cbr>세 실근의 합은 \u003cspan class=\"heq\">\\(-4\\,\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp\">(나) 함수 \u003cspan class=\"heq\">\\(y=h \\left( x \\right) \\,\\)\u003c/span>의 그래프 위의 점 중에서 \u003cspan class=\"heq\">\\(y\\,\\)\u003c/span>좌표가 \u003cbr>음의 정수인 점의 개수는 \u003cspan class=\"heq\">\\(15\\,\\)\u003c/span>이다.\u003c/p>\u003c/td>\u003ctd style=\"width:7px;border-top:none;border-
