<script>window.HandStudyGuide={"itemId":11839,"sourceHash":"63dd5b1832e1804f83935bf6329b6f5f54e33bf26dd3efe3798d29ee6b12f502","contentHash":"45b5e4850f611934d5d553ddbfe65109eeea9015f58f91d02e5f6ee508a1968c","overview":{"conditions":[{"label":"교점과 원의 조건","meaning":"포물선과 직선의 두 교점이 지름의 양 끝이고, 그 원은 원점을 지나요."},{"label":"넓이비","meaning":"네 번째 교점 \\(P\\)에 대하여 \\(\\triangle ABP\\)와 \\(\\triangle AOB\\)의 넓이비가 \\(5:1\\)이에요."}],"goal":"지름에 대한 직각과 원의 방정식으로 네 번째 교점의 좌표를 구해요.","firstLook":"교점 A,B의 x좌표를 \\(\\alpha,\\beta\\)라 하면 \\(ax^2=mx+4a\\)에서 \\(\\alpha+\\beta=m/a,\\alpha\\beta=-4\\)예요. 원점 O가 지름 AB인 원 위에 있으므로 \\(\\angle AOB=90^\\circ\\)예요. 따라서 두 직선 OA,OB의 기울기 곱이 \\(-1\\), 즉 \\(\\alpha\\beta+(a\\alpha^2)(a\\beta^2)=0\\)이고 \\(-4+16a^2=0\\)에서 \\(a=1/2\\)예요."},"chapters":[{"check":{"prompt":"\\(a\\)를 정하는 기울기 계산은 무엇인가요?","answer":"\\(OA\\)와 \\(OB\\)의 기울기는 \\(a\\alpha,a\\beta\\)이고 곱은 \\(a^2\\alpha\\beta=-4a^2=-1\\)이므로 \\(a=1/2\\)예요."},"stepIds":["s1","s2","s3","s4"],"question":"원점에서 두 교점으로 향하는 직선의 기울기는 어떤 관계인가요?","id":"c1","label":"조건을 좌표로 옮겨요","explanation":"교점 A,B의 x좌표를 \\(\\alpha,\\beta\\)라 하면 \\(ax^2=mx+4a\\)에서 \\(\\alpha+\\beta=m/a,\\alpha\\beta=-4\\)예요. 원점 O가 지름 AB인 원 위에 있으므로 \\(\\angle AOB=90^\\circ\\)예요. 따라서 두 직선 OA,OB의 기울기 곱이 \\(-1\\), 즉 \\(\\alpha\\beta+(a\\alpha^2)(a\\beta^2)=0\\)이고 \\(-4+16a^2=0\\)에서 \\(a=1/2\\)예요.","hint":"지름을 보는 원주각이 직각이라는 사실과 두 직선의 기울기 곱을 써요."},{"check":{"prompt":"원의 중심에서 \\(D,E\\)를 어떻게 정하나요?","answer":"지름 \\(AB\\)의 중점이 \\((m,m^2+2)\\)이고 일반형 원의 중심이 \\((-D/2,-E/2)\\)이므로 \\(D=-2m, E=-(2m^2+4)\\)예요."},"stepIds":["s5","s6","s7","s8"],"question":"원과 포물선의 네 번째 교점은 어떤 인수에서 나오나요?","id":"c2","label":"좌표 관계로 핵심 식을 세워요","explanation":"\\(a=1/2\\)이므로 \\(A,B\\)의 \\(x\\)좌표는 \\(x^2-2mx-4=0\\)의 두 근이고, \\(\\alpha+\\beta=2m,\\ \\alpha\\beta=-4\\)예요. 두 점의 \\(y\\)좌표 합은 \\((\\alpha^2+\\beta^2)/2=((2m)^2-2(-4))/2=2m^2+4\\)예요. 따라서 지름 \\(AB\\)의 중점이자 원의 중심은 \\((m,m^2+2)\\)이고, \\(x^2+y^2+Dx+Ey=0\\)의 중심 \\((-D/2,-E/2)\\)와 비교하면 \\(D=-2m,\\ E=-(2m^2+4)\\)예요. 여기에 \\(y=x^2/2\\)를 넣어 인수분해하면 \\(x(x^2-2mx-4)(x+2m)=0\\)이므로 네 번째 교점 \\(P\\)의 \\(x\\)좌표는 \\(k=-2m\\)이에요.","hint":"원 방정식에 \\(y=x^2/2\\)를 넣어 이미 아는 세 교점의 인수를 분리해요."},{"check":{"prompt":"양수 조건을 반영하면 \\(m\\)은 얼마인가요?","answer":"\\(|2m^2-1|=5\\)에서 \\(m^2=3\\) 또는 \\(-2\\)이고 \\(m>0\\)이므로 \\(m=\\sqrt3\\)예요."},"stepIds":["s9","s10","s11"],"question":"같은 밑변을 쓰는 두 삼각형의 넓이비는 어떻게 계산하나요?","id":"c3","label":"값과 범위를 확인해요","explanation":"삼각형 ABP와 AOB는 밑변 AB가 같으므로 넓이비는 직선 AB에서 P와 O까지의 거리비예요. 직선 \\(y=mx+2\\)를 이용하면 비는 \\(|k^2/2-mk-2|/2=|2m^2-1|=5\\)예요. \\(m>0\\)에서 \\(m=\\sqrt3\\), 따라서 \\(f(k)=2m^2=6\\), \\(g(-k)=2m^2+2=8\\), 곱은 48이에요.","hint":"직선 \\(AB\\)에서 \\(P\\)와 \\(O\\)까지의 거리비를 계산해요."}],"takeaway":["지름의 양 끝 좌표 합을 구하면 중점인 원의 중심과 원의 일반형 계수를 바로 연결할 수 있어요.","이미 아는 세 교점의 인수를 분리하면 남은 교점의 좌표를 찾을 수 있어요.","같은 밑변을 가진 두 삼각형의 넓이비는 그 밑변이 놓인 직선까지의 거리비로 계산해요."]};</script>
