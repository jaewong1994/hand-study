  <script>window.HandStudyRecord={"itemId":11839,"sourceLabel":"2022 교육청 고1 수학 11월 30번","adminYear":2022,"grade":1,"month":11,"number":30,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"두 양수 $a$, $m$에 대하여 두 함수 $f \\left( x \\right)$, $g \\left( x \\right)$를\n $f \\left( x \\right) =ax ^{2}$,\n $g \\left( x \\right) =mx+4a$\n라 하자. 그림과 같이 곡선 $y=f \\left( x \\right)$와 직선 $y=g \\left( x \\right)$가 만나는 두 점을 $A$, $B$라 할 때, 선분 $A B$를 지름으로 하고 원점 $O$를 지나는 원 $C\\,$가 있다. 원 $C\\,$와 곡선 $y=f \\left( x \\right)$는 서로 다른 네 점에서 만나고. 원 $C\\,$와 곡선 $y=f \\left( x \\right)$가 만나는 네 점 중 $O$, $A$, $B$가 아닌 점을 $P$$\\left( k,\\,f \\left( k \\right) \\right)$라 하자. 삼각형 $A B P$의 넓이가 삼각형 $A O B$의 넓이의 $5$배일 때, $f \\left( k \\right) \\times{g \\left( -k \\right)$의 값을 구하시오. [4점]","answer":"48","sourceHash":"63dd5b1832e1804f83935bf6329b6f5f54e33bf26dd3efe3798d29ee6b12f502","steps":[{"id":"s1","latex":"ax^2=mx+4a:\\quad\\alpha+\\beta=\\frac ma,\\quad\\alpha\\beta=-4"},{"id":"s2","latex":"O\\in\\text{circle with diameter }AB\\Rightarrow\\overrightarrow{OA}\\cdot\\overrightarrow{OB}=0"},{"id":"s3","latex":"\\alpha\\beta+a^2\\alpha^2\\beta^2=-4+16a^2=0\\Rightarrow a=\\frac12"},{"id":"s4","latex":"A,B:\\quad x^2-2mx-4=0"},{"id":"s5","latex":"C:\\quad x^2+y^2-2mx-(2m^2+4)y=0"},{"id":"s6","latex":"y=\\frac12x^2\\Rightarrow x(x^2-2mx-4)(x+2m)=0"},{"id":"s7","latex":"k=-2m"},{"id":"s8","latex":"\\frac{[ABP]}{[AOB]}=\\frac{|\\frac12k^2-mk-2|}{2}=|2m^2-1|=5"},{"id":"s9","latex":"m>0\\Rightarrow m=\\sqrt3"},{"id":"s10","latex":"f(k)=2m^2=6,\\quad g(-k)=2m^2+2=8"},{"id":"s11","latex":"f(k)g(-k)=48"}],"diagram":null,"contentHash":"cd4b448754a1608f118bd0ed932375de5cd90fa709b414728a0bcc78580b1318","questionHtml":"\u003cp class=\"hp\">두 양수 \u003cspan class=\"heq\">\\(a\\)\u003c/span>, \u003cspan class=\"heq\">\\(m\\)\u003c/span>에 대하여 두 함수 \u003cspan class=\"heq\">\\(f \\left( x \\right)\\)\u003c/span>, \u003cspan class=\"heq\">\\(g \\left( x \\right)\\)\u003c/span>를\u003c/p>\u003cp class=\"h
