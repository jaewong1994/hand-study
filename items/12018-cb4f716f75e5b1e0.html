  <script>window.HandStudyRecord={"itemId":12018,"sourceLabel":"2024 교육청 고1 수학 10월 29번","adminYear":2024,"grade":1,"month":10,"number":29,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 중심이 ${{O}} _{1}\\,$인 원 $C_{1}$ 위에 두 점 ${{A}}$, ${{B}} \\,$를 $\\angle {{BO}} _{1} {{A}} =90 ^{\\circ} \\,$가 되도록 잡는다. 선분 ${{O}} _{1} {{A}}$ 위의 점 $C\\,$에 대하여 선분 $AC\\,$를 지름으로 하는 원을 $C_{2}$, 선분 ${{O}} _{1} {{B}}$ 위의 점 $D\\,$에 대하여 선분 $BD\\,$를 지름으로 하는 원을 $C_{3}\\,$이라 하고, 두 원 $C_{2}$, $C_{3}\\,$의 중심을 각각 ${{O}} _{2}$, ${{O}} _{3}\\,$이라 하자. 사각형 ${{AO}} _{2} {{O}} _{3} {{B}} \\,$의 넓이가 $34\\,$이고 $\\overline{{{O}} _{1} {{C}} }+ \\overline{{{O}} _{1} {{D}} }=6 \\sqrt{2}\\,$일 때, 세 원 $C_{1}$, $C_{2}$, $C_{3}\\,$의 넓이의 합이 $p \\pi\\,$이다. $p\\,$의 값을 구하시오. (단, 점 $C\\,$는 점 $A\\,$도 아니고 점 ${{O}} _{1}\\,$도 아니며, 점 $D\\,$는 점 $B\\,$도 아니고 점 ${{O}} _{1}\\,$도 아니다.) [4점]","answer":"154","sourceHash":"eb3c2d93c8040e4b5a2f785e7441af3c06f0a01282ffd1608a0bf03442ff600d","steps":[{"id":"s1","latex":"r(C_1)=a,\\quad r(C_2)=b,\\quad r(C_3)=c"},{"id":"s2","latex":"O_1O_2=a-b,\\quad O_1O_3=a-c"},{"id":"s3","latex":"[AO_2O_3B]=\\frac12a^2-\\frac12(a-b)(a-c)=34"},{"id":"s4","latex":"ab-bc+ca=68"},{"id":"s5","latex":"O_1C+O_1D=(a-2b)+(a-2c)=6\\sqrt2\\Rightarrow a-b-c=3\\sqrt2"},{"id":"s6","latex":"a^2+b^2+c^2=(a-b-c)^2+2(ab-bc+ca)=18+136=154"},{"id":"s7","latex":"\\sum\\text{areas}=154\\pi\\Rightarrow p=154"}],"diagram":null,"contentHash":"9d131403b58efe075da24aa142f6fdd087b82a5ca1ad0a9558cbe8eec99712d5","questionHtml":"\u003cp class=\"hp htall\">그림과 같이 중심이 \u003cspan class=\"heq\">\\({{O}}_{1}\\,\\)\u003c/span>인 원 \u003cspan class=\"heq\">\\(C_{1}\\)\u003c/span> 위에 두 점 \u003cspan class=\"heq\">\\({{A}}\\)\u003c/span>, \u003cspan class=\"heq\">\\({{B}} \\,\\)\u003c/span>를 \u003cbr>\u003cspan class=\"heq\">\\(\\angle {{BO}}_{1} {{A}} =90^{\\circ} \\,\\)\u003c/span>가 되도록 잡는다. 선분 \u003cspan class=\"heq\">\\({{O}}_{1} {{A}}\\)\u003c/span> 위의 점 \u003cspan class=\"heq\">\\(C\\,\\)\u003c/span>에 대하여 선
