  <script>window.HandStudyRecord={"itemId":16620,"sourceLabel":"2020 교육청 고3 수리가형 10월 15번","adminYear":2020,"grade":3,"month":10,"number":15,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 좌표평면에서 곡선 $y=a ^{x}$($0\u003ca\u003c1$) 위의 점 $P\\,$가 제$2\\,$사분면에 있다. 점 $P\\,$를 직선 $y=x\\,$에 대하여 대칭이동시킨 점 $Q\\,$와 곡선 $y= -\\log _{a} \\,x$ 위의 점 $R\\,$에 대하여 $\\angle PQR=45°\\,$이다. ${\\overline{ PR }} = \\frac{5 \\sqrt{2}}{2} \\,$이고 직선 $P R\\,$의 기울기가 $\\frac{1}{7} \\,$일 때, 상수 $a\\,$의 값은? [4점]\n① $\\frac{\\sqrt{2}}{3}$ ② $\\frac{\\sqrt{3}}{3}$ ③ $\\frac{2}{3}$ ④ $\\frac{\\sqrt{5}}{3}$ ⑤ $\\frac{\\sqrt{6}}{3}$","answer":"⑤","sourceHash":"524407fb2cb6bc644c637e33ca5c1ceba66ac48ce38634c6b88f2fb16edbf70b","steps":[{"id":"s1","latex":"P=(t,a^t),\\quad Q=(a^t,t),\\quad t\u003c0"},{"id":"s2","latex":"QR\\parallel x\\text{축}\\Rightarrow R=(a^{-t},t),\\quad\\frac{t-a^t}{a^{-t}-t}\u003c0\\ne\\frac17\\quad\\times"},{"id":"s3","latex":"\\angle PQR=45^\\circ,\\ \\operatorname{slope}(PQ)=-1\\Rightarrow QR\\parallel y\\text{-axis},\\quad R=(a^t,-t)"},{"id":"s4","latex":"\\operatorname{slope}(PR)=\\frac{-t-a^t}{a^t-t}=\\frac17\\Rightarrow a^t=-\\frac34t"},{"id":"s5","latex":"PR^2=(a^t-t)^2+(-t-a^t)^2=\\frac{25}{2}\\Rightarrow (a^t)^2+t^2=\\frac{25}{4}"},{"id":"s6","latex":"\\frac9{16}t^2+t^2=\\frac{25}{4},\\quad t\u003c0\\Rightarrow t=-2"},{"id":"s7","latex":"a^{-2}=\\frac32\\Rightarrow a=\\sqrt{\\frac23}=\\frac{\\sqrt6}{3}"}],"diagram":null,"contentHash":"26502ee492874b08a08f70a8e7af2dcc69cc36f61e0a3b0bbf6c02b5c1d4f301","questionHtml":"\u003cp class=\"hp htall\">그림과 같이 좌표평면에서 곡선 \u003cspan class=\"heq\">\\(y=a^{x}\\)\u003c/span>(\u003cspan class=\"heq\">\\(0\\lt a\\lt 1\\)\u003c/span>) 위의 점 \u003cspan class=\"heq\">\\(P\\,\\)\u003c/span>가 제\u003cspan class=\"heq\">\\(2\\,\\)\u003c/span>사분면에 있다. 점 \u003cspan class=\"heq\">\\(P\\,\\)\u003c/span>를 직선 \u003cspan class=\"heq\">\\(y=x\\,\\)\u003c/span>에 대하여 대칭이동시킨 점 \u003cspan class=\"heq\">\\(Q\\,\\)\u003c/span>와 곡선 \u003cspan class=\"heq\">\\(y= -\\log_{a} \\,x\\)\u003c/span> 위의 점 \u003cspan class=\"heq\">\\(R\\,\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(\\angle PQR=45^{\\circ}\\,\\)\u003c/span>이다. \u003cspan class=\"heq\">\\({\\overline{PR }} = \\dfrac{5 \\sqrt{2}}{2} \\,\\)\u003c/span>이고 직선 \u003cspan class=\"heq\">\\(P R\\,\\)\u003c/span>의 기울기가 \u003cspan class=\"heq\">\\(\\dfrac{1}{7} \\,\\)\u003c/span>일 때, 상수 \u003cspan class=\"heq\">\\(a\\,\\)\u003c/span>의 값은? \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/e25d8cc977dc6b11e93841fe.png\" style=\"width:416px;max-width:100%\">\u003c/p>\u003cp class=\"hp htall\">① \u003cspan class=\"heq\">\\(\\dfrac{\\sqrt{2}}{3}\\)\u003c/span>&emsp;② \u003cspan class=\"heq\">\\(\\dfrac{\\sqrt{3}}{3}\\)\u003c/span>&emsp;③ \u003cspan class=\"heq\">\\(\\dfrac{2}{3}\\)\u003c/span>&emsp;④ \u003cspan class=\"heq\">\\(\\dfrac{\\sqrt{5}}{3}\\)\u003c/span>&emsp;⑤ \u003cspan class=\"heq\">\\(\\dfrac{\\sqrt{6}}{3}\\)\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"c8936b15a6bed0e7f26ef26940529b453a8540673c4b1abbf7e9c58af9c914a0"};</script>
