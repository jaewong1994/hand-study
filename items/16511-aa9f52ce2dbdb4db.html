<script>window.HandStudyRecord={"itemId":16511,"sourceLabel":"2019 평가원 고3 수리가형 6월 21번","adminYear":2019,"grade":3,"month":6,"number":21,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"함수 $f(x) = \\frac{\\ln x}{x}$와 양의 실수 $t$에 대하여 기울기가 $t$인 직선이 곡선 $y= f(x)$에 접할 때 접점의 $x$좌표를 $g(t)$라 하자. 원점에서 곡선 $y= f(x)$에 그은 접선의 기울기가 $a$일 때, 미분가능한 함수 $g(t)$에 대하여 $a \\times g′(a)$의 값은? [4점]\n➀ $-\\frac{ \\sqrt{e}}{3}$ ➁ $-\\frac{ \\sqrt{e}}{4}$ ➂ $-\\frac{ \\sqrt{e}}{5}$\n➃ $-\\frac{ \\sqrt{e}}{6}$ ➄ $-\\frac{ \\sqrt{e}}{7}$\n단답형(22 ~ 30)","answer":"②","sourceHash":"758b98ef617fe767005f0774cec13c6ef8bb6bcfc612c85e898915df22e223f7","steps":[{"id":"s1","latex":"f'(x)=\\dfrac{1-\\ln x}{x^2}"},{"id":"s2","latex":"\\text{원점을 지나는 접선}:\\quad f(s)=sf'(s)\\Rightarrow\\ln s=\\dfrac12\\Rightarrow s=\\sqrt e"},{"id":"s3","latex":"a=f'(\\sqrt e)=\\dfrac1{2e}"},{"id":"s4","latex":"f'(g(t))=t\\Rightarrow f''(g(t))g'(t)=1"},{"id":"s5","latex":"f''(x)=\\dfrac{2\\ln x-3}{x^3},\\qquad f''(\\sqrt e)=-\\dfrac2{e\\sqrt e}"},{"id":"s6","latex":"ag'(a)=\\dfrac1{2e}\\cdot\\left(-\\dfrac{e\\sqrt e}{2}\\right)=-\\dfrac{\\sqrt e}{4}"}],"diagram":null,"contentHash":"9a924e3cc9fb8bc5a62d6087e0b7d2b58d42fb60083a29a1d8ae94f01f30f32c","questionHtml":"\u003cp class=\"hp htall\">함수 \u003cspan class=\"heq\">\\(f(x) = \\dfrac{\\ln x}{x}\\)\u003c/span>와 양의 실수 \u003cspan class=\"heq\">\\(t\\)\u003c/span>에 대하여 기울기가 \u003cspan class=\"heq\">\\(t\\)\u003c/span>인 직선이 곡선 \u003cspan class=\"heq\">\\(y= f(x)\\)\u003c/span>에 접할 때 접점의 \u003cspan class=\"heq\">\\(x\\)\u003c/span>좌표를 \u003cspan class=\"heq\">\\(g(t)\\)\u003c/span>라 하자. 원점에서 곡선 \u003cspan class=\"heq\">\\(y= f(x)\\)\u003c/span>에 그은 접선의 기울기가 \u003cspan class=\"heq\">\\(a\\)\u003c/span>일 때, 미분가능한 함수 \u003cspan class=\"heq\">\\(g(t)\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(a \\times g' (a)\\)\u003c/span>의 값은? \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp htall\">➀ \u003cspan class=\"heq\">\\(-\\dfrac{ \\sqrt{e}}{3}\\)\u003c/span>&emsp;➁ \u003cspan class=\"heq\">\\(-\\dfrac{ \\sqrt{e}}{4}\\)\u003c/span>&emsp;➂ \u003cspan class=\"heq\">\\(-\\dfrac{ \\sqrt{e}}{5}\\)\u003c/span>\u003c/p>\u003cp class=\"hp htall\">➃ \u003cspan class=\"heq\">\\(-\\dfrac{ \\sqrt{e}}{6}\\)\u003c/span>&emsp;➄ \u003cspan class=\"heq\">\\(-\\dfrac{ \\sqrt{e}}{7}\\)\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"aa9f52ce2dbdb4db137f1bc14db1f63dd66c47f20191851792b5de67612d960d"};</script>
<script>window.HandStudyGuide={"itemId":16511,"sourceHash":"758b98ef617fe767005f0774cec13c6ef8bb6bcfc612c85e898915df22e223f7","contentHash":"9a924e3cc9fb8bc5a62d6087e0b7d2b58d42fb60083a29a1d8ae94f01f30f32c","overview":{"goal":"원점에서 그은 접선의 접점을 먼저 구하고, 접선 기울기와 접점 좌표의 역관계를 미분해 g'(a)를 계산해요.","firstLook":"접점의 \\(x\\)좌표가 \\(s\\)이면 원점을 지나는 직선의 기울기는 \\(f(s)/s\\)이고 접선의 기울기는 \\(f'(s)\\)예요. 두 값이 같아야 해요.","conditions":[{"label":"함수의 정의역","meaning":"로그 때문에 \\(x>0\\)에서 생각해요."},{"label":"접선 기울기","meaning":"기울기 \\(t\\)와 접점 \\(g(t)\\)는 \\(f'(g(t))=t\\)로 연결돼요."},{"label":"미분가능성","meaning":"문제에서 g가 미분가능하다고 했으므로 이 관계를 t에 대해 미분할 수 있어요."}]},"chapters":[{"id":"c1","label":"원점 접선의 접점을 구해요","stepIds":["s1","s2"],"question":"접점의 \\(x\\)좌표 \\(s\\)는 왜 \\(\\sqrt e\\)일까요?","hint":"원점과 \\((s,f(s))\\)를 잇는 직선 기울기 \\(f(s)/s\\)를 \\(f'(s)\\)와 같게 놓아요.","explanation":"먼저 \\(f'(x)=(1-\\ln x)/x^2\\)예요. 원점을 지나는 접선의 접점을 \\((s,f(s))\\)라 하면 접선 기울기는 한편으로 \\(f(s)/s\\), 다른 한편으로 \\(f'(s)\\)예요.\n\n따라서 \\(\\ln s/s^2=(1-\\ln s)/s^2\\)이고 \\(2\\ln s=1\\)이에요. 그러므로 \\(\\ln s=1/2\\), \\(s=\\sqrt e\\)예요.","check":{"prompt":"왜 \\(s^2\\)을 약분할 수 있나요?","answer":"정의역에서 \\(s>0\\)이므로 \\(s^2\\ne0\\)이기 때문이에요."}},{"id":"c2","label":"접선의 기울기 a를 계산해요","stepIds":["s3"],"question":"\\(s=\\sqrt e\\)에서 접선 기울기 \\(a\\)는 얼마인가요?","hint":"\\(a=f'(\\sqrt e)\\)이고 \\(\\ln\\sqrt e=1/2\\)예요.","explanation":"\\[\na=f'(\\sqrt e)=\\frac{1-\\ln\\sqrt e}{(\\sqrt e)^2}\n=\\frac{1-1/2}{e}=\\frac1{2e}.\n\\]","check":{"prompt":"a가 양수라는 문제 조건과 맞나요?","answer":"\\(e>0\\)이므로 \\(1/(2e)>0\\)이에요."}},{"id":"c3","label":"접점과 기울기의 관계를 미분해요","stepIds":["s4","s5"],"question":"\\(g'(a)\\)는 왜 \\(1/f''(\\sqrt e)\\)인가요?","hint":"항등식 \\(f'(g(t))=t\\)의 양변을 \\(t\\)로 미분해요.","explanation":"기울기가 \\(t\\)인 접선의 접점 좌표가 \\(g(t)\\)이므로 \\(f'(g(t))=t\\)예요. 양변을 미분하면 \\(f''(g(t))g'(t)=1\\), 따라서 \\(g'(t)=1/f''(g(t))\\)예요.\n\n또 \\(f''(x)=(2\\ln x-3)/x^3\\)이고\n\\[\nf''(\\sqrt e)=\\frac{1-3}{e\\sqrt e}=-\\frac2{e\\sqrt e}.\n\\]\n\\(g(a)=\\sqrt e\\)이므로 \\(g'(a)=-e\\sqrt e/2\\)예요.","check":{"prompt":"\\(g(a)=\\sqrt e\\)인 이유는 무엇인가요?","answer":"기울기 \\(a\\)가 바로 원점 접선의 기울기이고 그 접점의 \\(x\\)좌표를 \\(\\sqrt e\\)로 구했기 때문이에요."}},{"id":"c4","label":"두 값을 곱해 선택지를 정해요","stepIds":["s6"],"question":"\\(ag'(a)\\)의 값은 얼마인가요?","hint":"앞에서 구한 두 식의 e를 약분해요.","explanation":"\\[\nag'(a)=\\frac1{2e}\\left(-\\frac{e\\sqrt e}{2}\\right)\n=-\\frac{\\sqrt e}{4}.\n\\]\n따라서 정답은 ②예요.","check":{"prompt":"결과가 음수인 것은 접점 좌표가 기울기에 따라 어떻게 변한다는 뜻인가요?","answer":"이 접점 근처에서는 접선 기울기가 커질수록 접점의 x좌표가 작아진다는 뜻이에요."}}],"takeaway":["원점을 지나는 접선은 할선 기울기와 접점에서의 미분계수를 같게 두어 접점을 구해요.","접선 기울기를 접점 좌표의 함수로 보면 f'와 g가 서로 역관계에 있어 합성관계를 미분할 수 있어요.","미분한 관계에 특정 접점을 대입하면 역함수 공식을 외우지 않고도 g'를 구할 수 있어요."]};</script>
