  <script>window.HandStudyRecord={"itemId":11677,"sourceLabel":"2020 교육청 고1 수학 6월 18번","adminYear":2020,"grade":1,"month":6,"number":18,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 한 변의 길이가 $20\\,$인 정삼각형 $ABC\\,$에 대하여 변 $A B$ 위의 점 $D\\,$, 변 $AC$ 위의 점 $G\\,$, 변 $BC$ 위의 두 점 $E\\,$, $F\\,$를 꼭짓점으로 하는 직사각형 $DEFG\\,$가 있다. 직사각형 $DEFG\\,$의 넓이가 최대일 때, 삼각형 $DBE\\,$에 내접하는 원의 둘레의 길이는 $\\left( p \\sqrt{3} +q \\right) \\pi\\,$이다. $p ^{2} +q ^{2} \\,$의 값은? (단, $p$, $q$는 유리수이다.)\n[4점]\n $A$$B$$C$$G$$D$$E$$F$$20$\n① $10$ ② $20$ ③ $30$ ④ $40$ ⑤ $50$","answer":"⑤","sourceHash":"c4d411e693911c60999f34cb2cdc3c50e6308b26094c441a54656cc5a93b9790","steps":[{"id":"s1","latex":"BE=x\\Rightarrow DE=\\sqrt3x,\\quad CF=x,\\quad EF=20-2x,\\quad0\u003cx\u003c10"},{"id":"s2","latex":"S(x)=\\sqrt3x(20-2x)=-2\\sqrt3(x-5)^2+50\\sqrt3"},{"id":"s3","latex":"S\\text{ 최대}\\iff x=5"},{"id":"s4","latex":"(BE,DE,BD)=(5,5\\sqrt3,10)"},{"id":"s5","latex":"r=\\frac{BE+DE-BD}{2}=\\frac{5\\sqrt3-5}{2}"},{"id":"s6","latex":"2\\pi r=(5\\sqrt3-5)\\pi\\Rightarrow(p,q)=(5,-5)"},{"id":"s7","latex":"p^2+q^2=50"}],"diagram":null,"contentHash":"5e0b38a78e2ee32f75bef4533c4b01dff6bc8effebd3bff6a11ff34b6e1a5091","questionHtml":"\u003cp class=\"hp\">그림과 같이 한 변의 길이가 \u003cspan class=\"heq\">\\(20\\,\\)\u003c/span>인 정삼각형 \u003cspan class=\"heq\">\\(ABC\\)\u003c/span>에 대하여 변 \u003cspan class=\"heq\">\\(A B\\)\u003c/span> 위의 점 \u003cspan class=\"heq\">\\(D\\)\u003c/span>, 변 \u003cspan class=\"heq\">\\(AC\\)\u003c/span> 위의 점 \u003cspan class=\"heq\">\\(G\\)\u003c/span>, 변 \u003cspan class=\"heq\">\\(BC\\)\u003c/span> 위의 두 점 \u003cspan class=\"heq\">\\(E\\)\u003c/span>, \u003cspan class=\"heq\">\\(F\\)\u003c/span>를 꼭짓점으로 하는 직사각형 \u003cspan class=\"heq\">\\(DEFG\\)\u003c/span>가 있다. 직사각형 \u003cspan class=\"heq\">\\(DEFG\\)\u003c/span>의 넓이가 최대일 때, 삼각형 \u003cspan class=\"heq\">\\(DBE\\)\u003c/span>에 내접하는 원의 둘레의 길이는 \u003cspan class=\"heq\">\\(\\left( p \\sqrt{3} +q \\right) \\pi\\)\u003c/span>이다. \
