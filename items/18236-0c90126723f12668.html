<script>window.HandStudyGuide={"itemId":18236,"sourceHash":"88869dc7ae2f2f00a482eb4c284490c67f5c62f45e3f2fcf4a23827cd7c50f62","contentHash":"659e4df306a76a595b8079d626684b9ef637ea9db3521f911f435550105b397d","overview":{"goal":"절댓값 때문에 꺾일 수 있는 지점을 모두 찾아, 미분 가능 조건으로 삼차함수를 결정해요.","firstLook":"식이 바뀌는 \\(x=0\\)에서는 좌우를 맞추고, \\(x=2\\)에서는 두 절댓값의 꺾임이 서로 없어지는 조건을 살펴봐요.","conditions":[{"label":"전체에서 미분 가능","meaning":"\\(x=0\\)에서 연속이고 좌우 미분계수가 같아야 해요."},{"label":"절댓값의 꺾임","meaning":"\\(x>0\\)에서 \\(f\\)의 영점은 \\(x=2\\) 말고 생기면 안 돼요."}]},"chapters":[{"id":"c1","label":"원점에서 함수값과 기울기를 맞춰요","stepIds":["s1","s2"],"question":"\\(x=0\\)의 연속과 미분 가능 조건은 \\(f\\)에 무엇을 요구할까요?","hint":"왼쪽 식과 오른쪽 식의 값, 그리고 좌우 미분계수를 차례로 비교해요.","explanation":"왼쪽 극한은 \\(-f(0)\\), 오른쪽 값은 \\(|f(0)|-8\\)이에요. \\(-f(0)=|f(0)|-8\\)은 \\(f(0)<0\\)이면 \\(-f(0)=-f(0)-8\\)이 되어 불가능하므로 \\(f(0)\\ge0\\)이고, 이때 \\(-f(0)=f(0)-8\\)에서 \\(f(0)=4\\)예요. 원점 가까이에서는 \\(f(x)>0\\), \\(2x^2-8<0\\)이므로 오른쪽 식은 \\(f(x)+2x^2-8\\)이에요. 오른쪽 미분계수는 \\(f'(0)\\), 왼쪽은 \\(-f'(0)\\)이어서 둘이 같으려면 \\(f'(0)=0\\)이어야 해요.","check":{"prompt":"연속 조건에서 \\(f(0)<0\\)인 경우가 왜 제외되나요?","answer":"등식의 양변에서 \\(-f(0)\\)이 없어지면 \\(0=-8\\)이 되기 때문이에요."}},{"id":"c2","label":"두 절댓값이 꺾이는 지점을 맞춰요","stepIds":["s3"],"question":"\\(x=2\\)에서 왜 \\(f(2)=0\\)이고 \\(|f'(2)|=8\\)일까요?","hint":"\\(|2x^2-8|\\)의 좌우 기울기 변화를 계산해요.","explanation":"\\(2x^2-8\\)은 \\(x=2\\)에서 부호가 바뀌므로 \\(-|2x^2-8|\\)의 왼쪽 기울기는 \\(8\\), 오른쪽 기울기는 \\(-8\\)이에요. 이 꺾임을 없애려면 \\(|f(x)|\\)도 같은 점에서 반대 방향으로 꺾여야 하므로 \\(f(2)=0\\)이어야 해요. \\(f'(2)>0\\)이면 \\(|f|\\)의 좌우 기울기는 \\(-f'(2),f'(2)\\)이고, \\(f'(2)<0\\)이면 순서만 바뀌어요. 전체 좌우 기울기를 같게 놓으면 어느 경우든 \\(|f'(2)|=8\\)을 얻어요.","check":{"prompt":"\\(f(2)\\ne0\\)이면 왜 미분 가능할 수 없나요?","answer":"그때 \\(|f|\\)는 매끄러워 \\(-|2x^2-8|\\)의 기울기 점프를 없애지 못해요."}},{"id":"c3","label":"두 기울기 후보를 모두 구해요","stepIds":["s4","s5"],"question":"지금까지의 조건으로 \\(f\\)의 계수는 어떻게 정해지나요?","hint":"\\(f(0)=4\\), \\(f'(0)=0\\)부터 일반식을 줄여요.","explanation":"삼차항 계수를 \\(p\\), 이차항 계수를 \\(q\\)라 하면 \\(f(x)=px^3+qx^2+4\\)예요. \\(f(2)=0\\)에서 \\(8p+4q+4=0\\), \\(f'(2)=\\pm8\\)에서 \\(12p+4q=\\pm8\\)을 얻어요. 두 식을 빼면 양의 기울기일 때 \\(p=3,q=-7\\), 음의 기울기일 때 \\(p=-1,q=1\\)이에요.","check":{"prompt":"\\(f'(2)=8\\)일 때 \\(p\\)는 얼마인가요?","answer":"두 계수식을 빼면 \\(4p-4=8\\)이어서 \\(p=3\\)이에요."}},{"id":"c4","label":"숨은 꺾임으로 한 후보를 제외해요","stepIds":["s6","s7"],"question":"\\(f'(2)=8\\)인 후보는 왜 탈락할까요?","hint":"\\(x>0\\)에서 \\(f\\)가 \\(2\\) 이외의 영점을 갖는지 확인해요.","explanation":"양의 기울기 후보는 \\(f(x)=3x^3-7x^2+4=(x-1)(x-2)(3x+2)\\)예요. 그런데 \\(x=1\\)은 \\(|2x^2-8|\\)이 매끄러운 곳이고 \\(f'(1)\\ne0\\)이므로 \\(|f(x)|\\)만 꺾여 \\(g\\)가 미분 가능하지 않아요. 따라서 이 후보는 제외돼요. 음의 기울기 후보는 \\(f(x)=-x^3+x^2+4=-(x-2)(x^2+x+2)\\)이고, \\(x^2+x+2\\)의 판별식이 \\(-7\\)이어서 다른 실근이 없어요. 그러므로 양의 구간에서 새 꺾임이 생기지 않아 이 후보가 조건을 만족해요.","check":{"prompt":"두 번째 후보가 \\(x=2\\) 말고 실근이 없는 근거는 무엇인가요?","answer":"이차인수 \\(x^2+x+2\\)의 판별식이 음수이기 때문이에요."}},{"id":"c5","label":"구한 함수에 값을 대입해요","stepIds":["s8"],"question":"\\(f(-5)\\)는 얼마인가요?","hint":"확정된 식 \\(-x^3+x^2+4\\)에 대입해요.","explanation":"\\(f(x)=-x^3+x^2+4\\)이므로 \\(f(-5)=-(-5)^3+(-5)^2+4=125+25+4=154\\)예요.","check":{"prompt":"세 항의 값은 각각 무엇인가요?","answer":"\\(125,25,4\\)이고 합은 \\(154\\)예요."}}],"takeaway":["조각함수의 경계에서는 먼저 연속을 맞춘 뒤 좌우 미분계수를 비교해요.","절댓값 두 개의 꺾임이 같은 점에서 서로 상쇄되는지 좌우 기울기로 확인해요.","얻은 계수 후보마다 다른 영점에서 새 꺾임이 생기는지도 끝까지 검사해요."]};</script>
