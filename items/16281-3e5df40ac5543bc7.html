<script>window.HandStudyRecord={"itemId":16281,"sourceLabel":"2019 교육청 고3 수리가형 4월 29번","adminYear":2019,"grade":3,"month":4,"number":29,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 중심이 점 $A \\left( \\, 1,\\,0 \\right)$이고 반지름의 길이가 $1$인 원 $C _{1}$과 중심이 점 $B \\left( \\,-2,\\,0 \\right)$이고 반지름의 길이가 $2$인 원 $C _{2}$가 있다. $y$축 위의 점 $P \\left( \\,0,\\, a \\right)$$\\left( a> \\sqrt{2} \\right)$에서 원 $C _{1}$에 그은 접선 중 $y$축이 아닌 직선이 원 $C _{1}$과 접하는 점을 $Q$, 원 $C _{2}$에 그은 접선 중 $y$축이 아닌 직선이 원 $C _{2}$와 접하는 점을 $R$라 하고 $\\angle \\,R P Q=\\theta$라 하자. $\\tan\\,\\theta= \\frac{4}{3}$일 때, $\\left( a-3 \\right) ^{2}$의 값을 구하시오. [4점]\n$\\,O$$x$$y$$A$$B$$\\,P$$\\,Q$$\\,R$$C_1$$\\theta$$C _{2}$","answer":"11","sourceHash":"215b45c83709ef30e45328c8208ca3b66e4859f0b6c2a91505b0757de3b36bf2","steps":[{"id":"s1","latex":"\\tan\\alpha=\\dfrac1a,\\quad\\tan\\beta=\\dfrac2a,\\quad\\theta=2\\alpha+2\\beta"},{"id":"s2","latex":"\\tan2\\alpha=\\dfrac{2a}{a^2-1},\\quad\\tan2\\beta=\\dfrac{4a}{a^2-4}"},{"id":"s3","latex":"\\tan\\theta=\\dfrac{6a^3-12a}{a^4-13a^2+4}=\\dfrac43"},{"id":"s4","latex":"2a^4-9a^3-26a^2+18a+8=0"},{"id":"s5","latex":"(a^2-6a-2)(2a^2+3a-4)=0"},{"id":"s6","latex":"a>\\sqrt2\\Rightarrow a=3+\\sqrt{11}"},{"id":"s7","latex":"(a-3)^2=11"}],"diagram":null,"contentHash":"3af64762c51d4f1775cad37ebd07eaafb2366c24638804d304bd366697b3a9d5","questionHtml":"\u003cp class=\"hp htall\">그림과 같이 중심이 점 \u003cspan class=\"heq\">\\(A \\left( \\, 1,\\,0 \\right)\\)\u003c/span>이고 반지름의 길이가 \u003cspan class=\"heq\">\\(1\\)\u003c/span>인 원 \u003cspan class=\"heq\">\\(C_{1}\\)\u003c/span>과 중심이 점 \u003cspan class=\"heq\">\\(B \\left( \\,-2,\\,0 \\right)\\)\u003c/span>이고 반지름의 길이가 \u003cspan class=\"heq\">\\(2\\)\u003c/span>인 원 \u003cspan class=\"heq\">\\(C_{2}\\)\u003c/span>가 있다. \u003cspan class=\"heq\">\\(y\\)\u003c/span>축 위의 점 \u003cspan class=\"heq\">\\(P \\left( \\,0,\\, a \\right)\\)\u003c/span>\u003cspan class=\"heq\">\\(\\left( a\\gt  \\sqrt{2} \\right)\\)\u003c/span>에서 원 \u003cspan class=\"heq\">\\(C_{1}\\)\u003c/span>에 그은 접선 중 \u003cspan class=\"heq\">\\(y\\)\u003c/span>축이 아닌 직선이 원 \u003cspan class=\"heq\">\\(C_{1}\\)\u003c/span>과 접하는 점을 \u003cspan class=\"heq\">\\(Q\\)\u003c/span>, 원 \u003cspan class=\"heq\">\\(C_{2}\\)\u003c/span>에 그은 접선 중 \u003cspan class=\"heq\">\\(y\\)\u003c/span>축이 아닌 직선이 원 \u003cspan class=\"heq\">\\(C_{2}\\)\u003c/span>와 접하는 점을 \u003cspan class=\"heq\">\\(R\\)\u003c/span>라 하고 \u003cspan class=\"heq\">\\(\\angle \\,R P Q=\\theta\\)\u003c/span>라 하자. \u003cbr>\u003cspan class=\"heq\">\\(\\tan\\,\\theta= \\dfrac{4}{3}\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(\\left( a-3 \\right)^{2}\\)\u003c/span>의 값을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cspan class=\"hfigwrap\" style=\"position:relative;display:inline-block;width:277px;aspect-ratio:20825/22367;max-width:100%;vertical-align:middle\">\u003cimg class=\"hfig\" src=\"../assets/figures/0a95c9ee9b1406bb22c9dce1.png\" style=\"width:100%;height:100%;object-fit:fill;display:block\">\u003cspan style=\"position:absolute;left:53.40%;top:74.27%;line-height:1\">\u003cspan class=\"heq\">\\(\\,O\\)\u003c/span>\u003c/span>\u003cspan style=\"position:absolute;left:92.08%;top:73.43%;line-height:1\">\u003cspan class=\"heq\">\\(x\\)\u003c/span>\u003c/span>\u003cspan style=\"position:absolute;left:59.86%;top:-3.91%;line-height:1\">\u003cspan class=\"heq\">\\(y\\)\u003c/span>\u003c/span>\u003cspan style=\"position:absolute;left:68.48%;top:74.77%;line-height:1\">\u003cspan class=\"heq\">\\(A\\)\u003c/span>\u003c/span>\u003cspan style=\"position:absolute;left:33.57%;top:74.43%;line-height:1\">\u003cspan class=\"heq\">\\(B\\)\u003c/span>\u003c/span>\u003cspan style=\"position:absolute;left:59.95%;top:6.34%;line-height:1\">\u003cspan class=\"heq\">\\(\\,P\\)\u003c/span>\u003c/span>\u003cspan style=\"position:absolute;left:81.40%;top:65.87%;line-height:1\">\u003cspan class=\"heq\">\\(\\,Q\\)\u003c/span>\u003c/span>\u003cspan style=\"position:absolute;left:10.83%;top:57.08%;line-height:1\">\u003cspan class=\"heq\">\\(\\,R\\)\u003c/span>\u003c/span>\u003cspan style=\"position:absolute;left:73.12%;top:84.69%;line-height:1\">\u003cspan class=\"heq\">\\(C_{1}\\)\u003c/span>\u003c/span>\u003cspan style=\"position:absolute;left:55.79%;top:14.64%;line-height:1\">\u003cspan class=\"heq\">\\(\\theta\\)\u003c/span>\u003c/span>\u003cspan style=\"position:absolute;left:8.54%;top:84.71%;line-height:1\">\u003cspan class=\"heq\">\\(C_{2}\\)\u003c/span>\u003c/span>\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"3e5df40ac5543bc72ddc097590a631e0862af16eeab4ce5779618613c80a8dc0"};</script>
<script>window.HandStudyGuide={"itemId":16281,"sourceHash":"215b45c83709ef30e45328c8208ca3b66e4859f0b6c2a91505b0757de3b36bf2","contentHash":"3af64762c51d4f1775cad37ebd07eaafb2366c24638804d304bd366697b3a9d5","overview":{"goal":"각 원에서 두 접선 사이의 각을 중심선이 이등분한다는 성질로 \\(\\theta\\)를 두 각의 합으로 나타내고, 탄젠트 식에서 \\(a\\)를 구해요.","firstLook":"y축은 두 원에 모두 원점에서 접해요. 한 점에서 원에 그은 두 접선은 길이가 같아서 중심을 이은 선이 두 접선 사이의 각을 이등분해요.","conditions":[{"label":"두 원","meaning":"오른쪽 원은 중심 \\(A=(1,0)\\), 반지름 \\(1\\), 왼쪽 원은 중심 \\(B=(-2,0)\\), 반지름 \\(2\\)예요."},{"label":"점 P","meaning":"\\(P=(0,a)\\)이고 \\(a>\\sqrt2\\)예요."},{"label":"접선 선택","meaning":"각 원에서 \\(y\\)축이 아닌 다른 접선을 택해 두 접선 사이의 각을 \\(\\theta\\)라 해요."}]},"chapters":[{"id":"c1","label":"두 접선 사이 각을 작은 두 각으로 나눠요","stepIds":["s1"],"question":"왜 \\(\\theta=2\\alpha+2\\beta\\)이고 \\(\\tan\\alpha=1/a\\), \\(\\tan\\beta=2/a\\)일까요?","hint":"중심 A 또는 B와 P, 원점을 이은 직각삼각형을 보고 중심선의 각 이등분 성질을 써요.","explanation":"원점 \\(O\\)에서 \\(y\\)축은 두 원에 접해요. 오른쪽 원에 대해 직각삼각형 \\(POA\\)에서 \\(PO=a\\), \\(OA=1\\)이므로 \\(\\tan\\alpha=1/a\\)라 두면 \\(\\alpha=\\angle OPA\\)예요. 두 접선 \\(PO,PQ\\)의 길이가 같고 \\(PA\\)가 공통이므로 두 직각삼각형이 합동이고 \\(PA\\)는 접선 사이 각을 이등분해요. 따라서 \\(PO\\)와 \\(PQ\\) 사이 각은 \\(2\\alpha\\)예요.\n\n왼쪽 원도 같은 방식으로 \\(OB=2\\)에서 \\(\\tan\\beta=2/a\\), \\(PO\\)와 \\(PR\\) 사이 각은 \\(2\\beta\\)예요. 그림에서 \\(PQ\\)와 \\(PR\\) 사이의 작은 각은 이 둘을 더한 것이므로 \\(\\theta=2\\alpha+2\\beta\\)예요.","check":{"prompt":"오른쪽 원에서 \\(\\tan\\alpha\\)의 높이와 밑변은 무엇인가요?","answer":"직각삼각형 \\(POA\\)에서 맞은편 변 \\(OA=1\\), 이웃한 변 \\(PO=a\\)예요."}},{"id":"c2","label":"배각공식으로 두 탄젠트를 만들어요","stepIds":["s2"],"question":"\\(\\tan2\\alpha\\)와 \\(\\tan2\\beta\\)는 \\(a\\)로 어떻게 나타나나요?","hint":"\\(\\tan2u=2\\tan u/(1-\\tan^2u)\\)를 사용해요.","explanation":"\\(\\tan\\alpha=1/a\\)를 배각공식에 넣으면\n\\[\n\\tan2\\alpha=\\frac{2/a}{1-1/a^2}=\\frac{2a}{a^2-1}.\n\\]\n같은 방식으로 \\(\\tan\\beta=2/a\\)에서\n\\[\n\\tan2\\beta=\\frac{4/a}{1-4/a^2}=\\frac{4a}{a^2-4}\n\\]\n예요.","check":{"prompt":"\\(\\tan2\\beta\\)의 분모가 \\(a^2-4\\)가 되는 이유는 무엇인가요?","answer":"\\(1-(2/a)^2=(a^2-4)/a^2\\)이기 때문이에요."}},{"id":"c3","label":"덧셈공식으로 a의 방정식을 만들어요","stepIds":["s3","s4","s5"],"question":"\\(\\tan\\theta=4/3\\)을 넣으면 어떤 인수분해가 나오나요?","hint":"\\(\\theta=2\\alpha+2\\beta\\)에 탄젠트 덧셈공식을 적용해요.","explanation":"탄젠트 덧셈공식에 앞의 두 식을 넣어 정리하면\n\\[\n\\tan\\theta=\\frac{6a^3-12a}{a^4-13a^2+4}.\n\\]\n이를 \\(4/3\\)과 같게 두고 교차곱하면 \\(2a^4-9a^3-26a^2+18a+8=0\\)이에요.\n\n이 식은 \\((a^2-6a-2)(2a^2+3a-4)=0\\)으로 인수분해돼요.","check":{"prompt":"인수분해한 두 이차식의 최고차항을 곱하면 원래 최고차항과 맞나요?","answer":"\\(a^2\\cdot2a^2=2a^4\\)로 맞아요."}},{"id":"c4","label":"a의 범위로 한 해만 남겨요","stepIds":["s6","s7"],"question":"조건 \\(a>\\sqrt2\\)를 만족하는 해는 무엇이고 요구값은 얼마인가요?","hint":"두 이차방정식의 양의 해를 각각 범위와 비교해요.","explanation":"첫 식 \\(a^2-6a-2=0\\)의 해는 \\(a=3\\pm\\sqrt{11}\\)이고, 양의 범위에 맞는 것은 \\(3+\\sqrt{11}\\)이에요. 둘째 식의 양의 해는 \\((-3+\\sqrt{41})/4\\)인데 이는 \\(\\sqrt2\\)보다 작아 제외해요.\n\n따라서 \\(a=3+\\sqrt{11}\\)이고 \\((a-3)^2=(\\sqrt{11})^2=11\\)이에요.","check":{"prompt":"\\(3-\\sqrt{11}\\)은 왜 제외되나요?","answer":"\\(\\sqrt{11}>3\\)이므로 음수여서 \\(a>\\sqrt2\\)를 만족하지 않아요."}}],"takeaway":["한 점에서 원에 그은 두 접선과 중심을 이은 선은 접선 사이 각을 이등분해요.","복잡한 각의 탄젠트는 작은 각의 탄젠트를 직각삼각형에서 구한 뒤 배각과 덧셈공식으로 합쳐요.","다항방정식의 모든 해를 구한 뒤 원래의 길이 범위로 불필요한 해를 제외해요."]};</script>
