  <script>window.HandStudyRecord={"itemId":8784,"sourceLabel":"2019 교육청 고2 수학나형 11월 18번","adminYear":2019,"grade":2,"month":11,"number":18,"track":"수학나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 가로줄 $l _{1}$, $l _{2}$, $l _{3}$과 세로줄 $l _{4}$, $l _{5}$, $l _{6}$이 만나는 곳에 있는 $9$개의 메모판에 모두 $x$에 대한 식이 하나씩 적혀 있고, 그중 $4$개의 메모판은 접착 메모지로 가려져 있다. $x=a$일 때, 각 줄 $l _{k}$($k=1$, $2$, $3$, $4$, $5$, $6$)에 있는 $3$개의 메모판에 적혀 있는 모든 식의 값의 합을 $S _{k}$라 하자. $S _{k}$($k=1$, $2$, $3$, $4$, $5$, $6$)의 값이 모두 같게 되는 모든 실수 $a$의 값의 합은? [4점]\n$-2 ^{x+1}$$2 ^{x+3} -16$$-2 ^{x+1}$$4 ^{x}$$2 ^{x+3} -16$$l _{1}$$l _{2}$$l _{3}$$l _{4}$$l _{5}$$l _{6}$\n① $5$ ② $6$ ③ $7$ ④ $8$ ⑤ $9$","answer":"①","sourceHash":"3b8ff682583664a873431ed5cecaf2a9adca3910fdc5de9011d78f466bc12312","steps":[{"id":"s1","latex":"p,q,r,s=\\text{각각 }(1,2),(2,1),(2,3),(3,3)\\text{의 가린 값}"},{"id":"s2","latex":"S_1=S_4\\Rightarrow p=q,\\qquad S_3=S_6\\Rightarrow r=2^{a+3}-16"},{"id":"s3","latex":"S_3=S_4\\Rightarrow s=4^a-2^{a+3}+16+p"},{"id":"s4","latex":"S_1=4^a-2^{a+1}+p,\\qquad S_2=2^{a+4}-32+p"},{"id":"s5","latex":"S_1=S_2\\Rightarrow 4^a-2^{a+1}=2^{a+4}-32"},{"id":"s6","latex":"X=2^a>0\\Rightarrow X^2-18X+32=(X-2)(X-16)=0"},{"id":"s7","latex":"a=1\\text{ 또는 }a=4\\Rightarrow 1+4=5"}],"diagram":null,"contentHash":"25a537cb7dc2c952866ff0550ce8179fa61e348c16565ad499ad9824af13055b","questionHtml":"\u003cp class=\"hp\">그림과 같이 가로줄 \u003cspan class=\"heq\">\\(l_{1}\\)\u003c/span>, \u003cspan class=\"heq\">\\(l_{2}\\)\u003c/span>, \u003cspan class=\"heq\">\\(l_{3}\\)\u003c/span>과 세로줄 \u003cspan class=\"heq\">\\(l_{4}\\)\u003c/span>, \u003cspan class=\"heq\">\\(l_{5}\\)\u003c/span>, \u003cspan class=\"heq\">\\(l_{6}\\)\u003c/span>이 만나는 곳에 있는 \u003cspan class=\"heq\">\\(9\\)\u003c/span>개의 메모판에 모두 \u003cspan class=\"heq\">\\(x\\)\u003c/span>에 대한 식이 하나씩 적혀 있고, 그중 \u003cspan class=\"heq\">\\(4\\)\u003c/span>개의 메모판은 접착 메모지로 가려져 있다. \u003cbr>\u003cspan class=\"heq\">\\(x=a\\)\u003c/span>일 때, 각 줄 \u003cspan class=
