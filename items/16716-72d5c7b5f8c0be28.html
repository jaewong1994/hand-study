<script>window.HandStudyRecord={"itemId":16716,"sourceLabel":"2020 교육청 고3 수리가형 7월 21번","adminYear":2020,"grade":3,"month":7,"number":21,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"양의 실수 전체의 집합에서 정의된 함수 $f\\, \\left( x \\right) = \\frac{4x ^{2}}{x ^{2} +3} \\,$에 대하여 $f\\, \\left( x \\right) \\,$의 역함수를 $g\\, \\left( x \\right) \\,$라 할 때, 함수 $h\\,(x)\\,$를\n $h\\, \\left( x \\right) =f\\, \\left( x \\right) -g\\, \\left( x \\right) \\, \\left( 0<x<4 \\right)$\n라 하자. <보기>에서 옳은 것만을 있는 대로 고른 것은? [4점]\n<보기>\nㄱ. $h\\, \\left( 1 \\right) =0$\nㄴ. 두 양수 $a\\,$, $b\\, \\left( a<b<4\\, \\right) \\,$에 대하여 $\\int _{a} ^{b} {h\\, \\left( x \\right) dx} \\,$의 값이 최대일 때, $b-a=2\\,$이다.\nㄷ. $h\\, \\left( x \\right) \\,$의 도함수 $h' \\left( x \\right) \\,$의 최댓값은 $\\frac{7}{6} \\,$이다.\n① ㄱ ② ㄱ, ㄴ ③ ㄱ, ㄷ ④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","answer":"②","sourceHash":"aeea1ee28ca303c62f2dcdcc3bcec759ad55bcdb5ccf9483f8ef121057fd5aa2","steps":[{"id":"s1","latex":"f'(x)=\\frac{24x}{(x^2+3)^2}>0,\\quad g=f^{-1},\\quad f(1)=g(1)=1"},{"id":"s2","latex":"f(x)>x\\iff1<x<3\\Rightarrow h(x)>0\\iff1<x<3"},{"id":"s3","latex":"\\max_{0<a<b<4}\\int_a^bh(x)\\,dx=\\int_1^3h(x)\\,dx\\Rightarrow b-a=2"},{"id":"s4","latex":"f'(x)\\le f'(1)=\\frac32"},{"id":"s5","latex":"g'(x)=\\frac1{f'(g(x))}\\ge\\frac23,\\quad g'(1)=\\frac23"},{"id":"s6","latex":"h'(x)=f'(x)-g'(x)\\le\\frac32-\\frac23=\\frac56"},{"id":"s7","latex":"h'(1)=\\frac56\\Rightarrow h'(x)\\text{의 최댓값은 }\\frac56\\ne\\frac76"},{"id":"s8","latex":"\\therefore\\ \\text{첫째, 둘째 명제만 참}"}],"diagram":null,"contentHash":"4ce7e35197b6889b6abcf2d7e5d2db12f19f85156aad1446aa26c1d3ab60ca90","questionHtml":"<p class=\"hp htall\">양의 실수 전체의 집합에서 정의된 함수 <span class=\"heq\">\\(f\\, \\left( x \\right) = \\dfrac{4x^{2}}{x^{2} +3} \\,\\)<\/span>에 대하여 <span class=\"heq\">\\(f\\, \\left( x \\right) \\,\\)<\/span>의 역함수를 <span class=\"heq\">\\(g\\, \\left( x \\right) \\,\\)<\/span>라 할 때, 함수 <span class=\"heq\">\\(h\\,(x)\\,\\)<\/span>를<\/p><p class=\"hp\">&emsp;<span class=\"heq\">\\(h\\, \\left( x \\right) =f\\, \\left( x \\right) -g\\, \\left( x \\right) \\, \\left( 0\\lt x\\lt 4 \\right)\\)<\/span><\/p><p class=\"hp\">라 하자. &lt;보기&gt;에서 옳은 것만을 있는 대로 고른 것은? <span class=\"hscore\">[4점]<\/span><\/p><p class=\"hp htall\"><div class=\"hbox\"><p class=\"hp\">&lt; 보 기 &gt;<\/p><p class=\"hp\">ㄱ. <span class=\"heq\">\\(h\\, \\left( 1 \\right) =0\\)<\/span><\/p><p class=\"hp\">ㄴ. 두 양수 <span class=\"heq\">\\(a\\,\\)<\/span>, <span class=\"heq\">\\(b\\,\\)<\/span><span class=\"heq\">\\(\\left( a\\lt b\\lt 4\\, \\right) \\,\\)<\/span>에 대하여 <br><span class=\"heq\">\\(\\int_{a}^{b} {h\\, \\left( x \\right) dx} \\,\\)<\/span>의 값이 최대일 때, <span class=\"heq\">\\(b-a=2\\,\\)<\/span>이다.<\/p><p class=\"hp htall\">ㄷ. <span class=\"heq\">\\(h\\, \\left( x \\right) \\,\\)<\/span>의 도함수 <span class=\"heq\">\\(h' \\left( x \\right) \\,\\)<\/span>의 최댓값은 <span class=\"heq\">\\(\\dfrac{7}{6} \\,\\)<\/span>이다.<\/p><\/div><\/p><p class=\"hp\">① ㄱ&emsp;② ㄱ, ㄴ&emsp;③ ㄱ, ㄷ<br>④ ㄴ, ㄷ&emsp;⑤ ㄱ, ㄴ, ㄷ<\/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"3173de1d473e805debf76ca97a287eaba37ca2154ea10994dbed04a2762a9247"};</script>
<script>window.HandStudyGuide={"itemId":16716,"sourceHash":"aeea1ee28ca303c62f2dcdcc3bcec759ad55bcdb5ccf9483f8ef121057fd5aa2","contentHash":"4ce7e35197b6889b6abcf2d7e5d2db12f19f85156aad1446aa26c1d3ab60ca90","overview":{"goal":"함수와 역함수의 그래프 관계로 \\(h\\)의 부호와 도함수의 범위를 구해 세 명제를 판단해요.","firstLook":"\\(f'(x)>0\\)이라 \\(f\\)는 증가하고 역함수 \\(g\\)가 존재해요. \\(f(x)\\)와 \\(x\\)의 비교가 역함수와의 비교까지 정해요.","conditions":[{"label":"정의역","meaning":"\\(f\\)는 양의 실수에서 증가하며 값의 범위는 \\(0\\)과 \\(4\\) 사이예요."},{"label":"역함수","meaning":"\\(g'(x)=1/f'(g(x))\\)을 쓰기 전에 \\(f'(g(x))>0\\)임을 확인해요."},{"label":"적분구간","meaning":"\\(h\\)가 양수인 부분은 모두 넣고 음수인 부분은 넣지 않을 때 적분이 가장 커요."}]},"chapters":[{"id":"c1","label":"고정점과 부호를 찾아요","stepIds":["s1","s2"],"question":"\\(h(1)=0\\)이고 \\(h(x)>0\\)인 범위가 \\(1<x<3\\)인 이유는 무엇인가요?","hint":"\\(f(x)>x\\)를 직접 풀고, 증가함수에서 \\(f(g(x))=x\\)를 이용해 \\(g(x)\\)와 \\(x\\)도 비교해요.","explanation":"\\(f'(x)=24x/(x^2+3)^2>0\\)이므로 \\(f\\)는 증가하고 \\(g\\)가 존재해요. \\(f(1)=1\\)이어서 \\(g(1)=1\\), 따라서 \\(h(1)=0\\)이라 ㄱ은 참이에요.\n\n양의 \\(x\\)에서 \\(f(x)>x\\)를 풀면 \\(4x>x^2+3\\), 즉 \\((x-1)(x-3)<0\\)이므로 \\(1<x<3\\)이에요. 이 범위에서는 \\(f(x)>x=f(g(x))\\)이고 \\(f\\)가 증가하므로 \\(x>g(x)\\)예요. 그래서 \\(h(x)=f(x)-g(x)>0\\)이고, 나머지 범위에서는 반대로 \\(h(x)<0\\)이에요.","check":{"prompt":"\\(f(x)>x\\)에서 곧바로 \\(g(x)<x\\)를 말할 때 어떤 성질을 사용하나요?","answer":"\\(f\\)가 증가함수라서 \\(f(x)>f(g(x))\\)이면 입력도 \\(x>g(x)\\)라는 성질을 사용해요."}},{"id":"c2","label":"양수인 구간 전체를 적분해요","stepIds":["s3"],"question":"적분값이 가장 클 때 왜 \\(a=1,b=3\\)이어야 할까요?","hint":"\\(1<x<3\\)에서는 구간을 넓히면 양수인 넓이가 더해지고, 그 밖에서는 음수인 넓이가 더해져요.","explanation":"\\(h\\)는 \\((1,3)\\)에서만 양수이고 양 끝에서는 \\(0\\)이에요. 이 양수 부분을 조금이라도 빼면 적분값이 줄고, 바깥의 음수 부분을 넣어도 적분값이 줄어요. 따라서 가장 큰 적분값은 \\(\\int_1^3h(x)dx\\)이고 \\(b-a=3-1=2\\)라 ㄴ은 참이에요.","check":{"prompt":"끝점에서 \\(h=0\\)인데도 \\(a=1,b=3\\)을 포함해도 되는 이유는 무엇인가요?","answer":"문제의 제한은 \\(0<a<b<4\\)라 \\(1,3\\) 모두 허용되고, 한 점의 함숫값은 정적분값을 바꾸지 않기 때문이에요."}},{"id":"c3","label":"역함수 도함수의 범위를 함께 봐요","stepIds":["s4","s5","s6","s7","s8"],"question":"\\(h'(x)\\)의 가장 큰 값은 왜 \\(5/6\\)이고 \\(7/6\\)이 아닐까요?","hint":"\\(f'(x)\\)의 가장 큰 값과 \\(g'(x)\\)의 가장 작은 값을 같은 점에서 동시에 얻는지 확인해요.","explanation":"\\(f'(x)=24x/(x^2+3)^2\\)을 다시 미분해 부호를 보면 \\(x=1\\)에서 가장 크고 그 값은 \\(3/2\\)예요. 또 \\(f'(g(x))>0\\)이므로 역함수 미분에서 \\(g'(x)=1/f'(g(x))\\)이고, \\(f'\\le3/2\\)이어서 \\(g'(x)\\ge2/3\\)이에요. 따라서 \\(h'(x)=f'(x)-g'(x)\\le3/2-2/3=5/6\\)이에요. \\(x=1\\)에서는 \\(g(1)=1\\)이라 두 등호가 동시에 성립해 실제로 \\(h'(1)=5/6\\)이에요. ㄷ은 거짓이고 정답은 ㄱ, ㄴ인 ②예요.","check":{"prompt":"두 부등식의 차로 얻은 \\(5/6\\)이 실제 최댓값인지 어떻게 확인하나요?","answer":"\\(x=1\\)에서 \\(f'(1)=3/2\\), \\(g'(1)=2/3\\)이 동시에 성립하므로 위쪽 경계 \\(5/6\\)에 실제로 도달해요."}}],"takeaway":["증가함수와 역함수를 비교할 때에는 두 함수의 고정점과 \\(f(x)-x\\)의 부호를 먼저 봐요.","정적분의 최댓값은 피적분함수의 양수 구간과 음수 구간을 빠짐없이 비교해 정해요.","역함수 미분을 쓸 때 분모가 양수인지 확인하고, 부등식의 등호가 같은 점에서 가능한지도 확인해요."]};</script>
