<script>window.HandStudyRecord={"itemId":17207,"sourceLabel":"2021 평가원 고3 수학미적분 6월 22번","adminYear":2021,"grade":3,"month":6,"number":22,"track":"미적분","points":4,"scoreStatus":"confirmed_4_direct","questionText":"삼차함수 $f \\left( x \\right)$가 다음 조건을 만족시킨다.\n(가) 방정식 $f \\left( x \\right)$$=0$의 서로 다른 실근의 개수는 $2$이다.(나) 방정식 $f \\left( x-f \\left( x \\right) \\right)$$=0$의 서로 다른 실근의 개수는 $3$이다.\n$f \\left( 1 \\right) =4$, $f' \\left( 1 \\right)$$=1$, $f' \\left( 0 \\right)$$>1$일 때, $f \\left( 0 \\right)$$= \\frac{q}{p}$이다. $p+q$의 값을 구하시오. (단, $p$와 $q$는 서로소인 자연수이다.) [4점]\n 사각형입니다. 2021년 6월 고3 모의고사 문제지제 2 교시 수학 영역(미적분) 5 지선다형","answer":"61","sourceHash":"660b775880c64c7ae105981add5a7575e9fc62d0edabc345228807f06e171a1e","steps":[{"id":"s1","latex":"f(x)=c(x-\\alpha)^2(x-\\beta),\\quad\\alpha\\ne\\beta"},{"id":"s2","latex":"f(x)=x-\\alpha\\Leftrightarrow(x-\\alpha)\\{c(x-\\alpha)(x-\\beta)-1\\}=0"},{"id":"s3","latex":"f(x)=x-\\beta\\Leftrightarrow(x-\\beta)\\{c(x-\\alpha)^2-1\\}=0"},{"id":"s4","latex":"c>0:\\quad\\text{첫 식의 근 }3\\text{개, 둘째 식의 근 }2\\text{개 이상; 두 근 집합은 겹치지 않음}"},{"id":"s5","latex":"c\u003c0:\\quad\\text{둘째 식의 근은 }\\beta\\text{뿐}\\Rightarrow\\text{첫 식의 이차식이 중근}"},{"id":"s6","latex":"c^2(\\alpha-\\beta)^2+4c=0\\Rightarrow c(\\alpha-\\beta)^2=-4"},{"id":"s7","latex":"A=1-\\alpha,\\ B=1-\\beta,\\ t=B/A:\\quad cA^3t=4,\\ cA^2(1+2t)=1"},{"id":"s8","latex":"cA^2(t-1)^2=-4\\Rightarrow(t-1)^2=-4(1+2t)\\Rightarrow t=-1,-5"},{"id":"s9","latex":"t=-5:\\quad A=36/5,\\ c=-25/11664,\\ f^{\\prime}(0)=3503/3888\u003c1\\quad\\text{제외}"},{"id":"s10","latex":"t=-1:\\quad A=4,\\ c=-1/16,\\ \\alpha=-3,\\ \\beta=5"},{"id":"s11","latex":"f(0)=45/16\\Rightarrow p+q=61"}],"diagram":null,"contentHash":"5d9cd293b85ac16c437481cf0ac59a9dd6feb0f453d30c9aff47a755b69361d5","questionHtml":"\u003cp class=\"hp\">삼차함수 \u003cspan class=\"heq\">\\(f \\left( x \\right)\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) 방정식 \u003cspan class=\"heq\">\\(f \\left( x \\right)\\)\u003c/span>\u003cspan class=\"heq\">\\(=0\\)\u003c/span>의 서로 다른 실근의 개수는 \u003cspan class=\"heq\">\\(2\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp\">(나) 방정식 \u003cspan class=\"heq\">\\(f \\left( x-f \\left( x \\right) \\right)\\)\u003c/span>\u003cspan class=\"heq\">\\(=0\\)\u003c/span>의 서로 다른 실근의 개수는 \u003cspan class=\"heq\">\\(3\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp class=\"hp htall\">\u003cspan class=\"heq\">\\(f \\left( 1 \\right) =4\\)\u003c/span>, \u003cspan class=\"heq\">\\(f' \\left( 1 \\right)\\)\u003c/span>\u003cspan class=\"heq\">\\(=1\\)\u003c/span>, \u003cspan class=\"heq\">\\(f' \\left( 0 \\right)\\)\u003c/span>\u003cspan class=\"heq\">\\(\\gt 1\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(f \\left( 0 \\right)\\)\u003c/span>\u003cspan class=\"heq\">\\(= \\dfrac{q}{p}\\)\u003c/span>이다. \u003cspan class=\"heq\">\\(p+q\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(p\\)\u003c/span>와 \u003cspan class=\"heq\">\\(q\\)\u003c/span>는 서로소인 자연수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"dc6582671769574ec7047cade4b404deb6275891572f0726798c7a64b8caae3d"};</script>
<script>window.HandStudyGuide={"itemId":17207,"sourceHash":"660b775880c64c7ae105981add5a7575e9fc62d0edabc345228807f06e171a1e","contentHash":"5d9cd293b85ac16c437481cf0ac59a9dd6feb0f453d30c9aff47a755b69361d5","overview":{"goal":"합성방정식의 세 근 조건으로 삼차함수의 근과 계수를 정해 \\(f(0)\\)을 구해요.","firstLook":"\\(f\\)의 서로 다른 근이 두 개이므로 한 근에 같은 인수가 두 번 곱해져요. \\(f(x-f(x))=0\\)은 안쪽 값이 그 두 근 중 하나라는 두 방정식으로 나눠요.","conditions":[{"label":"(가)","meaning":"\\(f(x)=c(x-\\alpha)^2(x-\\beta)\\)로 둘 수 있어요."},{"label":"(나)","meaning":"\\(f(x)=x-\\alpha\\)와 \\(f(x)=x-\\beta\\)의 서로 다른 해를 합쳐 정확히 세 개여야 해요."},{"label":"함숫값과 미분계수","meaning":"\\(x=1\\)에서의 두 식이 계수 후보를 만들고 \\(f'(0)>1\\)이 하나를 골라요."}]},"chapters":[{"id":"c1","label":"합성방정식을 두 갈래로 풀어요","stepIds":["s1","s2","s3"],"question":"\\(f(x-f(x))=0\\)은 왜 두 방정식으로 나뉠까요?","hint":"\\(f(u)=0\\)의 서로 다른 두 근이 \\(\\alpha,\\beta\\)라는 뜻을 \\(u=x-f(x)\\)에 적용해요.","explanation":"\\(f(x)=c(x-\\alpha)^2(x-\\beta)\\)로 두어요. 합성방정식은 \\(x-f(x)=\\alpha\\) 또는 \\(x-f(x)=\\beta\\)이므로 각각 \\(f(x)=x-\\alpha\\), \\(f(x)=x-\\beta\\)예요. 인수분해하면 첫 식은 \\((x-\\alpha)\\{c(x-\\alpha)(x-\\beta)-1\\}=0\\), 둘째 식은 \\((x-\\beta)\\{c(x-\\alpha)^2-1\\}=0\\)이 돼요. 두 해집합은 같은 \\(x\\)를 가질 수 없어요. 같은 \\(x\\)가 있다면 \\(x-f(x)\\)가 서로 다른 \\(\\alpha,\\beta\\)와 동시에 같아야 하기 때문이에요.","check":{"prompt":"두 방정식의 해 개수를 더할 때 겹치는 해를 뺄 필요가 없는 이유는 무엇인가요?","answer":"한 해가 두 방정식을 모두 만족하면 \\(x-\\alpha=x-\\beta\\)가 되어 \\(\\alpha=\\beta\\)라는 모순이 생기기 때문이에요."}},{"id":"c2","label":"계수의 부호와 근 개수를 맞춰요","stepIds":["s4","s5","s6"],"question":"왜 \\(c<0\\)이어야 하고 첫 번째 이차식은 같은 근을 두 번 가져야 할까요?","hint":"\\(c>0\\)일 때 두 방정식에서 생기는 해를 각각 세어 보세요.","explanation":"\\(c>0\\)이면 첫 식의 이차인수는 판별식이 양수라 서로 다른 두 근을 만들고 \\(x=\\alpha\\)까지 세 근이 돼요. 둘째 식의 \\(c(x-\\alpha)^2=1\\)도 실근을 만들어 전체가 세 개를 넘어요. 따라서 \\(c<0\\)이에요. 그러면 둘째 식의 제곱식은 해가 없어 \\(x=\\beta\\)만 남아요. 전체가 세 근이 되려면 첫 식은 서로 다른 두 근만 가져야 하므로 그 이차인수의 판별식이 \\(0\\)이어야 해요. 계산하면 \\(c^2(\\alpha-\\beta)^2+4c=0\\), 즉 \\(c(\\alpha-\\beta)^2=-4\\)예요.","check":{"prompt":"\\(c<0\\)일 때 \\(c(x-\\alpha)^2=1\\)이 해를 갖지 않는 이유는 무엇인가요?","answer":"왼쪽은 \\(c<0\\)와 제곱의 곱이라 \\(0\\) 이하인데 오른쪽은 \\(1\\)이기 때문이에요."}},{"id":"c3","label":"한 점의 조건을 비율로 정리해요","stepIds":["s7","s8"],"question":"\\(f(1)=4\\), \\(f'(1)=1\\)과 판별식 조건은 어떻게 두 후보를 만들까요?","hint":"\\(A=1-\\alpha\\), \\(B=1-\\beta\\), \\(t=B/A\\)로 두어 공통인 \\(cA^2\\)를 없애요.","explanation":"\\(A=1-\\alpha\\), \\(B=1-\\beta\\), \\(t=B/A\\)로 두면 \\(f(1)=4\\)에서 \\(cA^3t=4\\), \\(f'(1)=1\\)에서 \\(cA^2(1+2t)=1\\)이에요. 또 \\(\\alpha-\\beta=B-A=A(t-1)\\)이므로 앞의 관계는 \\(cA^2(t-1)^2=-4\\)가 돼요. \\(cA^2=1/(1+2t)\\)를 넣으면 \\((t-1)^2=-4(1+2t)\\), 즉 \\((t+1)(t+5)=0\\)이에요. 따라서 \\(t=-1\\) 또는 \\(t=-5\\)예요.","check":{"prompt":"\\(A=0\\)일 가능성을 따로 고려하지 않는 이유는 무엇인가요?","answer":"\\(A=0\\)이면 \\(f(1)=cA^2B=0\\)이 되어 주어진 \\(f(1)=4\\)와 모순이기 때문이에요."}},{"id":"c4","label":"도함수 조건으로 후보를 골라요","stepIds":["s9","s10","s11"],"question":"두 후보 중 어느 것이 \\(f'(0)>1\\)을 만족할까요?","hint":"각 후보에서 \\(A,c,\\alpha,\\beta\\)를 정한 뒤 \\(f'(0)\\)을 계산해요.","explanation":"\\(t=-5\\)이면 \\(A=36/5\\), \\(c=-25/11664\\)이고 직접 계산한 \\(f'(0)=3503/3888<1\\)이라 제외돼요. \\(t=-1\\)이면 \\(A=4\\), \\(c=-1/16\\), \\(\\alpha=-3\\), \\(\\beta=5\\)예요. 이 함수는 \\(f'(0)>1\\)을 만족하고 \\(f(0)=(-1/16)\\cdot3^2\\cdot(-5)=45/16\\)이에요. \\(45\\)와 \\(16\\)은 서로소이므로 \\(p=16,q=45\\), \\(p+q=61\\)이에요.","check":{"prompt":"마지막 분수에서 \\(p\\)와 \\(q\\)의 순서는 어떻게 정하나요?","answer":"문제가 \\(f(0)=q/p\\)로 정했으므로 분모가 \\(p=16\\), 분자가 \\(q=45\\)예요."}}],"takeaway":["합성방정식은 바깥 함수가 \\(0\\)이 되는 입력값을 먼저 찾고 안쪽 식과 같게 놓아요.","서로 겹치지 않는 두 해집합의 개수는 계수 부호와 판별식으로 조절해요.","비율 변수를 쓴 뒤에도 원래의 부등식 조건으로 후보를 반드시 걸러요."]};</script>
