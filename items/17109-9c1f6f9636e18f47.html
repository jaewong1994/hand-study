<script>window.HandStudyRecord={"itemId":17109,"sourceLabel":"2021 교육청 고3 수학미적분 7월 29번","adminYear":2021,"grade":3,"month":7,"number":29,"track":"미적분","points":4,"scoreStatus":"confirmed_4_direct","questionText":"함수 $f \\left( x \\right)=x^{3} -x$와 실수 전체의 집합에서 미분가능한 역함수가 존재하는 삼차함수 $g \\left( x \\right)=ax^{3} +x^{2} +bx+1$이 있다. 함수 $g \\left( x \\right)$의 역함수 $g^{-1} \\left( x \\right)$에 대하여 함수 $h \\left( x \\right)$를\n $h \\left( x \\right) = \\begin{cases}\\left( f \\circ g^{-1} \\right) \\left( x \\right) & \\left( x\u003c 0 \\text{ 또는 } x> 1 \\right) \\\\ \\dfrac{1}{\\pi} \\sin \\pi x & \\left( 0 \\leq x \\leq 1 \\right)\\end{cases}$\n이라 하자. 함수 $h \\left( x \\right)$가 실수 전체의 집합에서 미분가능할 때, $g \\left( a+b \\right)$의 값을 구하시오. (단, $a,\\,b$는 상수이다.) [4점]","answer":"15","sourceHash":"e4826a03d5e078115f1659cf6db96707f526ba657a7a3f1c2047eb71ed98e030","steps":[{"id":"s1","latex":"g(0)=1\\Rightarrow g^{-1}(1)=0"},{"id":"s2","latex":"h\\prime(1)=\\cos\\pi=-1=\\frac{f\\prime(0)}{g\\prime(0)}=-\\frac1b\\Rightarrow b=1"},{"id":"s3","latex":"g\\text{는 일대일이고 }g\\prime(0)>0\\Rightarrow g\\text{는 증가함수}"},{"id":"s4","latex":"t=g^{-1}(0)\u003c0,\\quad h\\text{의 }0\\text{에서 연속성}\\Rightarrow f(t)=t(t-1)(t+1)=0\\Rightarrow t=-1"},{"id":"s5","latex":"g(-1)=1-a=0\\Rightarrow a=1,\\quad g\\prime(x)=3(x+1/3)^2+2/3>0"},{"id":"s6","latex":"\\frac{f\\prime(-1)}{g\\prime(-1)}=1=\\cos0\\quad\\text{(미분조건 확인)}"},{"id":"s7","latex":"g(a+b)=g(2)=8+4+2+1=15"}],"diagram":null,"contentHash":"a7410df02b4c93e0e9bf761eb6ab3ff6374340c860acdcd92ffb089784ed9b31","questionHtml":"\u003cp class=\"hp\">함수 \u003cspan class=\"heq\">\\(f \\left( x \\right)\\)\u003c/span>\u003cspan class=\"heq\">\\(=x^{3} -x\\)\u003c/span>와 실수 전체의 집합에서 미분가능한 역함수가 존재하는 삼차함수 \u003cspan class=\"heq\">\\(g \\left( x \\right)\\)\u003c/span>\u003cspan class=\"heq\">\\(=ax^{3} +x^{2} +bx+1\\)\u003c/span>이 있다. 함수 \u003cspan class=\"heq\">\\(g \\left( x \\right)\\)\u003c/span>의 역함수 \u003cspan class=\"heq\">\\(g^{-1} \\left( x \\right)\\)\u003c/span>에 대하여 함수 \u003cspan class=\"heq\">\\(h \\left( x \\right)\\)\u003c/span>를\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\(h(x)=\\begin{cases}(f\\circ g^{-1})(x)&x\\lt0\\text{ 또는 }x\\gt1\\\\\\dfrac1\\pi\\sin\\pi x&0\\le x\\le1\\end{cases}\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">이라 하자. 함수 \u003cspan class=\"heq\">\\(h \\left( x \\right)\\)\u003c/span>가 실수 전체의 집합에서 미분가능할 때, \u003cspan class=\"heq\">\\(g \\left( a+b \\right)\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(a,\\,b\\)\u003c/span>는 상수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"9c1f6f9636e18f473df51f517db33eb5b8cc8d8192eef3854b6fba9a5ed79950"};</script>
<script>window.HandStudyGuide={"itemId":17109,"sourceHash":"e4826a03d5e078115f1659cf6db96707f526ba657a7a3f1c2047eb71ed98e030","contentHash":"a7410df02b4c93e0e9bf761eb6ab3ff6374340c860acdcd92ffb089784ed9b31","overview":{"goal":"조각함수의 두 연결점에서 함숫값과 미분계수를 맞추어 \\(g\\)의 두 계수를 정해요.","firstLook":"\\(g(0)=1\\)이므로 \\(g^{-1}(1)=0\\)은 바로 알아낼 수 있어요. 먼저 \\(x=1\\)의 미분 조건으로 \\(b\\)를 정해요.","conditions":[{"label":"역함수가 실수 전체에서 미분가능","meaning":"합성함수의 미분계수에서 분모 \\(g'\\)가 0이 되지 않아요."},{"label":"조각함수가 두 경계에서 미분가능","meaning":"\\(x=1\\)과 \\(x=0\\)에서 값과 좌우 미분계수를 각각 맞춰요."}]},"chapters":[{"id":"c1","label":"오른쪽 경계에서 첫 계수 구하기","stepIds":["s1","s2"],"question":"\\(x=1\\)에서 바깥 조각의 합성함수 미분계수는 어떻게 계산할까요?","hint":"\\(g^{-1}\\)가 \\(1\\)에서 미분가능하다는 조건으로 \\(g'(0)\\ne0\\)을 먼저 확인하세요.","explanation":"\\(g(0)=1\\)이므로 \\(g^{-1}(1)=0\\)이에요. 문제에서 \\(g^{-1}\\)가 실수 전체에서 미분가능하다고 했으므로 특히 \\(x=1\\)에서 미분가능하고, 이에 대응하는 \\(g'(0)=b\\)는 0이 아니에요. 이제 역함수 미분 공식을 쓸 수 있어 바깥 조각의 오른쪽 미분계수는 \\(f'(0)/g'(0)=-1/b\\)예요. 안쪽 조각의 왼쪽 미분계수는 \\(\\cos\\pi=-1\\)이므로 \\(-1/b=-1\\), 따라서 \\(b=1\\)이에요.","check":{"prompt":"역함수 미분 공식의 분모 \\(g'(0)\\)가 0이 아님을 무엇으로 보장하나요?","answer":"\\(g^{-1}\\)가 \\(g(0)=1\\)에서 미분가능하다는 원래 조건이 \\(g'(0)\\ne0\\)을 보장해요."}},{"id":"c2","label":"증가 방향과 왼쪽 경계값 정하기","stepIds":["s3","s4"],"question":"\\(t=g^{-1}(0)\\)가 왜 0보다 작고, \\(f(t)=0\\)의 세 근 중 왜 -1일까요?","hint":"연속인 일대일 함수의 증가·감소 방향과 \\(g^{-1}(1)=0\\)을 함께 보세요.","explanation":"연속인 삼차함수 \\(g\\)가 역함수를 가지므로 엄격히 증가하거나 엄격히 감소해요. \\(b=1\\)에서 \\(g'(0)=1>0\\)이므로 감소함수일 수 없고 증가함수예요. \\(0<1\\)이므로 \\(t=g^{-1}(0)<g^{-1}(1)=0\\)이에요.\n\n\\(x=0\\)에서 안쪽 조각의 값은 0이고 연속이어야 하므로 바깥 조각의 값 \\(f(t)\\)도 0이에요. \\(f(t)=t(t-1)(t+1)=0\\)의 근은 -1,0,1인데 \\(t<0\\)이므로 \\(t=-1\\)이에요.","check":{"prompt":"\\(t=0\\)을 고를 수 없는 이유는 무엇인가요?","answer":"\\(g\\)가 증가하고 \\(g^{-1}(0)<g^{-1}(1)=0\\)이므로 \\(t\\)는 반드시 음수예요."}},{"id":"c3","label":"남은 계수와 미분 조건 확인하기","stepIds":["s5","s6","s7"],"question":"\\(g(-1)=0\\)에서 구한 계수들이 실제로 역함수와 경계 미분 조건을 모두 만족할까요?","hint":"\\(a=b=1\\)을 \\(g'\\)와 \\(x=0\\)의 합성함수 미분계수에 다시 넣으세요.","explanation":"\\(b=1\\)에서 \\(g(-1)=-a+1-1+1=1-a\\)예요. 이것이 0이므로 \\(a=1\\)이에요. 그러면 \\(g'(x)=3x^2+2x+1=3(x+1/3)^2+2/3>0\\)이라 실제로 실수 전체에서 증가해요. 또한 \\(f'(-1)=2\\), \\(g'(-1)=2\\)라 바깥 조각의 \\(x=0\\) 미분계수는 1이고, 안쪽 조각의 미분계수 \\(\\cos0=1\\)과 같아요.\n\n따라서 모든 연결 조건이 맞고 \\(a+b=2\\)예요. \\(g(2)=8+4+2+1=15\\)예요.","check":{"prompt":"계수를 구한 뒤 \\(g'(x)>0\\)을 다시 확인하는 이유는 무엇인가요?","answer":"역함수가 존재한다는 원래 조건과 앞에서 사용한 증가 방향이 실제 식에서도 성립하는지 확인하기 위해서예요."}}],"takeaway":["역함수가 들어간 조각함수는 경계값의 원상을 먼저 찾아요.","연속인 일대일 함수의 증가·감소 방향은 한 점의 양의 미분계수로 구별할 수 있어요.","구한 계수는 두 경계의 값과 미분계수에 모두 다시 대입해요."]};</script>
