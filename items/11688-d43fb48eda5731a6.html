  <script>window.HandStudyRecord={"itemId":11688,"sourceLabel":"2020 교육청 고1 수학 6월 29번","adminYear":2020,"grade":1,"month":6,"number":29,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"$\\frac{\\sqrt{2}}{2} \u003ck\u003c \\sqrt{2} \\,$인 실수 $k\\,$에 대하여 그림과 같이 한 변의 길이가 각각 $2$, $2k\\,$인 두 정사각형 $A B C D$, $EFGH\\,$가 있다. 두 정사각형의 대각선이 모두 한 점 $O$에서 만나고, 대각선 $FH\\,$가 변 $AB\\,$를 이등분한다. 변 $AD\\,$와 $EH\\,$의 교점을 $I\\,$, 변 $AD\\,$와 $EF\\,$의 교점을 $J\\,$, 변 $AB\\,$와 $EF\\,$의 교점을 $K\\,$라 하자. 삼각형 $AKJ\\,$의 넓이가 삼각형 $EJI\\,$의 넓이의 $\\frac{3}{2\\,}$배가 되도록 하는 $k\\,$의 값이 $p \\sqrt{2} +q \\sqrt{6} \\,$일 때, $100(p+q)\\,$의 값을 구하시오. (단, $p$, $q\\,$는 유리수이다.)\n[4점]\n$A$$B$$C$$D$$E$$F$$G$$H$$I$$J$$O$$K$","answer":"50","sourceHash":"5f87b8352ab5c32157419be18771abcef2475c314c7504395fc224c80e064a4a","steps":[{"id":"s1","latex":"A=(-1,1),\\ B=(-1,-1),\\ D=(1,1),\\quad E=(0,k\\sqrt2),\\ F=(-k\\sqrt2,0),\\ H=(k\\sqrt2,0)"},{"id":"s2","latex":"J=(1-k\\sqrt2,1),\\quad I=(k\\sqrt2-1,1),\\quad K=(-1,k\\sqrt2-1)"},{"id":"s3","latex":"[\\triangle AKJ]=\\frac12(2-k\\sqrt2)^2"},{"id":"s4","latex":"[\\triangle EJI]=(k\\sqrt2-1)^2"},{"id":"s5","latex":"\\frac12(2-k\\sqrt2)^2=\\frac32(k\\sqrt2-1)^2"},{"id":"s6","latex":"1\u003ck\\sqrt2\u003c2\\Rightarrow2-k\\sqrt2=\\sqrt3(k\\sqrt2-1)"},{"id":"s7","latex":"k\\sqrt2=\\frac{1+\\sqrt3}{2}\\Rightarrow k=\\frac{\\sqrt2+\\sqrt6}{4}"},{"id":"s8","latex":"(p,q)=\\left(\\frac14,\\frac14\\right)\\Rightarrow100(p+q)=50"}],"diagram":null,"contentHash":"e647495ad2cc496419a4d9d342786db4f0d9cc3b538123f6b77a59ba13ac3af1","questionHtml":"\u003cp class=\"hp htall\">\u003cspan class=\"heq\">\\(\\dfrac{\\sqrt{2}}{2} \\lt k\\lt  \\sqrt{2} \\,\\)\u003c/span>인 실수 \u003cspan class=\"heq\">\\(k\\,\\)\u003c/span>에 대하여 그림과 같이 한 변의 길이가 각각 \u003cspan class=\"heq\">\\(2\\)\u003c/span>, \u003cspan class=\"heq\">\\(2k\\,\\)\u003c/span>인 두 정사각형 \u003cspan class=\"heq\">\\(A B C D\\)\u003c/span>, \u003cspan class=\"heq\">\\(EFGH\\,\\)\u003c/span>가 있다. 두 정사각형의 대각선이 모두 한 점
