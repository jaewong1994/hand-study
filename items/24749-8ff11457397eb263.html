  <script>window.HandStudyRecord={"adminYear":2020,"answer":"③","contentHash":"5f11be4d8efd7878ee5826b2786bd7b7f0c4ade29733e71c6309a4666a2d3b0b","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24749,"month":12,"number":18,"points":4,"preview":false,"questionHtml":"\u003cp>\u003cspan class=\"heq\">\\(\\frac{1}{4} &lt; a &lt; 1\\)\u003c/span>인 실수 \u003cspan class=\"heq\">\\(a\\)\u003c/span>에 대하여 직선 \u003cspan class=\"heq\">\\(y = 1\\)\u003c/span>이 두 곡선 \u003cspan class=\"heq\">\\(y = \\log_a x\\)\u003c/span>, \u003cspan class=\"heq\">\\(y = \\log_{4a} x\\)\u003c/span>와 만나는 점을 각각 \u003cspan class=\"heq\">\\(A, \\, B\\)\u003c/span>라 하고, 직선 \u003cspan class=\"heq\">\\(y = -1\\)\u003c/span>이 두 곡선 \u003cspan class=\"heq\">\\(y = \\log_a x\\)\u003c/span>, \u003cspan class=\"heq\">\\(y = \\log_{4a} x\\)\u003c/span>와 만나는 점을 각각 \u003cspan class=\"heq\">\\(C, \\, D\\)\u003c/span>라 하자. &lt;보기&gt;에서 옳은 것만을 있는 대로 고른 것은?\u003c/p>\u003cp>[4점]\u003c/p>\u003cp>&lt;보 기&gt;ㄱ. 선분 \u003cspan class=\"heq\">\\(AB\\)\u003c/span>를 \u003cspan class=\"heq\">\\(1 : 4\\)\u003c/span>로 외분하는 점의 좌표는 \u003cspan class=\"heq\">\\((0, \\, 1)\\)\u003c/span>이다.ㄴ. 사각형 \u003cspan class=\"heq\">\\(ABCD\\)\u003c/span>가 직사각형이면 \u003cspan class=\"heq\">\\(a = \\frac{1}{2}\\)\u003c/span>이다.ㄷ. \u003cspan class=\"heq\">\\(\\overline{AB} &lt; \\overline{CD}\\)\u003c/span>이면 \u003cspan class=\"heq\">\\(\\frac{1}{2} &lt; a &lt; 1\\)\u003c/span>이다.\u003c/p>\u003cdiv class=\"hchoices\">\u003cdiv class=\"hch\">① ㄱ\u003c/div>\u003cdiv class=\"hch\">② ㄷ\u003c/div>\u003cdiv class=\"hch\">③ ㄱ, ㄴ\u003c/div>\u003cdiv class=\"hch\">④ ㄴ, ㄷ\u003c/div>\u003cdiv class=\"hch\">⑤ ㄱ, ㄴ, ㄷ\u003c/div>\u003c/div>","questionText":"$\\frac{1}{4} \u003c a \u003c 1$인 실수 $a$에 대하여 직선 $y = 1$이 두 곡선 $y = \\log_a x$, $y = \\log_4a x$와 만나는 점을 각각 $A, \\, B$라 하고, 직선 $y = -1$이 두 곡선 $y = \\log_a x$, $y = \\log_4a x$와 만나는 점을 각각 $C, \\, D$라 하자. \u003c보기>에서 옳은 것만을 있는 대로 고른 것은?\n[3점]\n\u003c보 기>ㄱ. 선분 $AB$를 $1 : 4$로 외분하는 점의 좌표는 $(0, \\, 1)$이다.ㄴ. 사각형 $ABCD$가 직사각형이면 $a = \\frac{1}{2}$이다.ㄷ. $\\overline{AB} \u003c \\overline{CD}$이면 $\\frac{1}{2} \u003c a \u003c 1$이다.\n① ㄱ ② ㄷ ③ ㄱ, ㄴ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","sourceHash":"44c4b443b8b8f299f7f41c885d034b9189e7b71f54382857dd019a9d8a255d00","sourceKind":"csat","sourceLabel":"2020년 시행 수능 · 2021학년도 · 나형 · 18번","steps":[{"id":"s1","latex":"\\mathrm A=(a,1),\\quad\\mathrm B=(4a,1),\\quad\\mathrm C=(a^{-1},-1),\\quad\\mathrm D=((4a)^{-1},-1)"},{"id":"s2","latex":"\\text{ㄱ: 외분점의 }x\\text{좌표}=\\frac{1\\cdot4a-4\\cdot a}{1-4}=0,\\quad y=1\\quad\\text{참}"},{"id":"s3","latex":"\\text{ㄴ: }\\mathrm{AB}\\parallel\\mathrm{CD}\\text{이므로 직사각형이면 }\\mathrm{AD},\\mathrm{BC}\\text{는 수직선}"},{"id":"s4","latex":"a=\\frac1{4a}\\ \\Rightarrow 4a^2=1,\\quad\\frac14\u003ca\u003c1\\ \\Rightarrow\\ a=\\frac12\\quad\\text{참}"},{"id":"s5","latex":"\\text{ㄷ: }\\mathrm{AB}=3a,\\quad\\mathrm{CD}=\\frac1a-\\frac1{4a}=\\frac3{4a}"},{"id":"s6","latex":"3a\u003c\\frac3{4a}\\ \\Leftrightarrow\\ a^2\u003c\\frac14\\ \\Rightarrow\\ \\frac14\u003ca\u003c\\frac12\\quad\\text{거짓}"},{"id":"s7","latex":"\\boxed{\\text{ㄱ, ㄴ}}\\quad\\text{③}"}],"track":"나형"};</script>
