<script>window.HandStudyGuide={"itemId":17792,"sourceHash":"05edc5a357a7b426a57026e90988dffab8ce448f7bfe964611fd47cf7f0127b9","contentHash":"0aae650897f79bf53f5d385eb11d92b2628fb92548d23b4645e33a37e24055df","overview":{"goal":"(가)에서 \\(f\\)를 정하고, (나)의 왼쪽을 곱의 미분으로 읽어 \\(G\\)를 찾아요.","firstLook":"\\(F'=f\\), \\(G'=g\\)이므로 \\(fG+Fg\\)는 \\((FG)'\\)예요. 먼저 (가)로 \\(F\\)의 모양을 정하면 계수 비교가 가능해요.","conditions":[{"label":"(가)","meaning":"양변을 미분해 \\(f'\\)를 구하고, \\(x=1\\)을 원래 식에 넣어 \\(f(1)\\)을 정해요."},{"label":"(나)","meaning":"두 항을 따로 보지 말고 곱 \\(FG\\)를 미분한 식으로 묶어요."}]},"chapters":[{"id":"c1","label":"미분과 끝값으로 첫 함수를 정해요","stepIds":["s1"],"question":"(가)를 미분한 뒤 \\(x=0\\)에서 바로 나누지 않아도 \\(f'(x)=4\\)라고 할 수 있을까요?","hint":"먼저 \\(x\\ne0\\)에서 구하고, \\(f'\\)가 다항함수라는 점을 써요.","explanation":"(가)의 양변을 미분하면 \\(f(x)=f(x)+xf'(x)-4x\\)이므로 \\(x\\{f'(x)-4\\}=0\\)이에요. \\(x\\ne0\\)에서는 \\(f'(x)=4\\)이고, \\(f'\\)는 다항함수라 연속이므로 \\(x=0\\)에서도 같은 값이에요. 또 (가)에 \\(x=1\\)을 넣으면 왼쪽은 \\(0\\), 오른쪽은 \\(f(1)-3\\)이어서 \\(f(1)=3\\)이에요. 따라서 \\(f(x)=4x-1\\)이에요.","check":{"prompt":"\\(f'(x)=4\\)만으로 남아 있던 상수는 어떤 조건으로 정했나요?","answer":"(가)에 \\(x=1\\)을 넣어 \\(f(1)=3\\)을 얻고, 그 값으로 \\(f(x)=4x-1\\)을 정했어요."}},{"id":"c2","label":"곱의 미분 뒤 계수를 맞춰요","stepIds":["s2","s3","s4"],"question":"\\(G=x^2+x\\)와 \\(F=2x^2-x+1\\)은 어떤 계산으로 함께 정해질까요?","hint":"\\((FG)'=8x^3+3x^2+1\\)을 한 번 적분하고 \\(G=x^2+px+q\\)로 놓아요.","explanation":"\\(f=4x-1\\)의 한 부정적분은 \\(F(x)=2x^2-x+a\\)예요. 또 \\(F'=f\\), \\(G'=g\\)이므로 (나)의 왼쪽은 \\(F'G+FG'=(FG)'\\)이에요. 따라서\n\n\\(F(x)G(x)=2x^4+x^3+x+C\\)\n\n로 쓸 수 있어요. 왼쪽의 최고차항을 맞추어 \\(G=x^2+px+q\\)로 놓고 곱의 계수를 비교해요. \\(x^3\\)의 계수에서 \\(2p-1=1\\)이므로 \\(p=1\\), \\(x^2\\)의 계수에서 \\(2q-p+a=0\\), \\(x\\)의 계수에서 \\(-q+ap=1\\)이에요. \\(p=1\\)을 넣으면 \\(a-q=1\\), \\(a+2q=1\\)이어서 \\(q=0,\\ a=1\\)이에요. 따라서 \\(G=x^2+x\\), \\(F=2x^2-x+1\\)이에요.","check":{"prompt":"\\(x^2\\)항과 \\(x\\)항의 비교로 얻는 두 식은 무엇인가요?","answer":"\\(p=1\\)을 넣은 뒤 \\(a+2q=1\\)과 \\(a-q=1\\)을 얻고, 여기서 \\(q=0,a=1\\)이에요."}},{"id":"c3","label":"부정적분의 양 끝값을 빼요","stepIds":["s5"],"question":"\\(g\\)를 다시 미분해 구하지 않고도 정적분을 계산할 수 있는 이유는 무엇인가요?","hint":"\\(G\\)가 \\(g\\)의 한 부정적분이라는 처음 정의를 사용해요.","explanation":"\\(G'(x)=g(x)\\)이므로 정적분은 \\(G\\)의 양 끝값 차예요. 따라서\n\n\\(\\int_1^3g(x)\\,dx=G(3)-G(1)=(9+3)-(1+1)=12-2=10\\)\n\n이에요. \\(G\\)에 적분상수가 더해져도 양 끝값에서 서로 없어지므로 결과는 바뀌지 않아요.","check":{"prompt":"\\(G\\)의 적분상수가 정답에 영향을 주지 않는 이유는 무엇인가요?","answer":"\\(G(3)-G(1)\\)에서 같은 적분상수가 한 번 더해지고 한 번 빠져 서로 없어지기 때문이에요."}}],"takeaway":["미분한 식에서 특정 점이 빠지면 다항함수의 연속성으로 그 점까지 확인해요.","\\(F'=f\\), \\(G'=g\\)가 보이면 \\(fG+Fg\\)를 곱의 미분으로 묶어요.","정적분은 부정적분의 양 끝값 차이므로 적분상수는 결과에 영향을 주지 않아요."]};</script>
