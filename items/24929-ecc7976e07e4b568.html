<script>window.HandStudyRecord={"adminYear":2024,"answer":"316","contentHash":"fe5f52ac0b4c1180e705c0463eaac9d765ea7be3a273243e369d187e22884029","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24929,"month":11,"number":30,"points":4,"preview":false,"questionHtml":"\u003cp>좌표평면에 한 변의 길이가 \u003cspan class=\"heq\">\\(4\\,\\)\u003c/span>인 정사각형 \u003cspan class=\"heq\">\\(ABCD\\,\\)\u003c/span>가 있다.\u003c/p>\u003cp> \u003cspan class=\"heq\">\\(\\left|\\, {\\vec{ XB }} + {\\vec{ XC }} \\,\\right| = \\left|\\, {\\vec{ XB }} - {\\vec{ XC }} \\,\\right|\\)\u003c/span>\u003c/p>\u003cp>를 만족시키는 점 \u003cspan class=\"heq\">\\(X\\,\\)\u003c/span>가 나타내는 도형을 \u003cspan class=\"heq\">\\(S\\,\\)\u003c/span>라 하자. 도형 \u003cspan class=\"heq\">\\(S\\,\\)\u003c/span> 위의 점 \u003cspan class=\"heq\">\\(P\\,\\)\u003c/span>에 대하여\u003c/p>\u003cp> \u003cspan class=\"heq\">\\(4 {\\overrightarrow{PQ}}={\\overrightarrow{PB}}+2 {\\overrightarrow{PD}}\\)\u003c/span> 를 만족시키는 점을 \u003cspan class=\"heq\">\\(Q\\,\\)\u003c/span>라 할 때, \u003cspan class=\"heq\">\\({\\overrightarrow{AC}} \\cdot {\\overrightarrow{AQ}}\\,\\)\u003c/span>의 최댓값과 최솟값을 각각 \u003cspan class=\"heq\">\\(M\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(m\\)\u003c/span>이라 하자. \u003cspan class=\"heq\">\\(M\\, \\times m\\,\\)\u003c/span>의 값을 구하시오. [4점]\u003c/p>\u003cfigure>\u003cimg class=\"hfig\" src=\"../assets/csat/24929-7cabcab58117f9db.png\" alt=\"2024년 시행 수능 30번 문항 그림 \" style=\"max-width:100%;width:420px\">\u003c/figure>","questionText":"좌표평면에 한 변의 길이가 $4\\,$인 정사각형 $ABCD\\,$가 있다.\n $\\left|\\, {\\vec{ XB }} + {\\vec{ XC }} \\,\\right| = \\left|\\, {\\vec{ XB }} - {\\vec{ XC }} \\,\\right|$\n를 만족시키는 점 $X\\,$가 나타내는 도형을 $S\\,$라 하자. 도형 $S\\,$ 위의 점 $P\\,$에 대하여\n $4 {\\overrightarrow{PQ}}={\\overrightarrow{PB}}+2 {\\overrightarrow{PD}}$ 를 만족시키는 점을 $Q\\,$라 할 때, ${\\overrightarrow{AC}} bul \\leq t {\\overrightarrow{AQ}}\\,$의 최댓값과 최솟값을 각각 $M\\,$, $m$이라 하자. $M\\, \\times m\\,$의 값을 구하시오. [4점]","sourceHash":"834519f3cff34f50bef30d26bc8647d35d5f57be30e840448ccdcb77cf772e8c","sourceKind":"csat","sourceLabel":"2024년 시행 수능 · 2025학년도 · 기하 · 30번","steps":[{"id":"s1","latex":"\\mathrm A=(0,0),\\ \\mathrm B=(4,0),\\ \\mathrm C=(4,4),\\ \\mathrm D=(0,4)"},{"id":"s2","latex":"\\overrightarrow{\\mathrm{XB}}-\\overrightarrow{\\mathrm{XC}}=\\overrightarrow{\\mathrm{CB}},\\quad\\left|\\overrightarrow{\\mathrm{CB}}\\right|=4"},{"id":"s3","latex":"\\mathrm E=(4,2)\\quad\\Rightarrow\\quad\\overrightarrow{\\mathrm{XB}}+\\overrightarrow{\\mathrm{XC}}=2\\overrightarrow{\\mathrm{XE}},\\quad\\overline{\\mathrm{XE}}=2"},{"id":"s4","latex":"\\mathrm P=(4+2\\cos\\theta,\\ 2+2\\sin\\theta)"},{"id":"s5","latex":"4(\\mathrm Q-\\mathrm P)=(\\mathrm B-\\mathrm P)+2(\\mathrm D-\\mathrm P)\\quad\\Rightarrow\\quad\\mathrm Q=\\frac{\\mathrm P+\\mathrm B+2\\mathrm D}{4}"},{"id":"s6","latex":"\\mathrm Q=\\left(2+\\frac12\\cos\\theta,\\ \\frac52+\\frac12\\sin\\theta\\right)"},{"id":"s7","latex":"\\overrightarrow{\\mathrm{AC}}\\cdot\\overrightarrow{\\mathrm{AQ}}=18+2(\\cos\\theta+\\sin\\theta)=18+2\\sqrt2\\sin\\left(\\theta+\\frac\\pi4\\right)"},{"id":"s8","latex":"M=18+2\\sqrt2,\\quad m=18-2\\sqrt2\\quad\\Rightarrow\\quad Mm=324-8=316"}],"track":"기하"};</script>
<script>window.HandStudyGuide={"itemId":24929,"sourceHash":"834519f3cff34f50bef30d26bc8647d35d5f57be30e840448ccdcb77cf772e8c","contentHash":"fe5f52ac0b4c1180e705c0463eaac9d765ea7be3a273243e369d187e22884029","overview":{"goal":"벡터의 길이 조건을 원으로 바꾸고, 원 위를 움직이는 점의 좌표로 내적의 범위를 구해요.","firstLook":"\\(\\overrightarrow{\\mathrm{XB}}-\\overrightarrow{\\mathrm{XC}}\\)에서 점 \\(\\mathrm X\\)가 사라져요. 합은 \\(\\mathrm{BC}\\)의 중점을 이용하면 길이로 읽을 수 있어요.","conditions":[{"label":"한 변의 길이가 4인 정사각형","meaning":"\\(\\mathrm A=(0,0),\\mathrm B=(4,0),\\mathrm C=(4,4),\\mathrm D=(0,4)\\)로 두어 길이와 내적을 계산할 수 있어요."},{"label":"두 벡터의 합과 차의 길이가 같다","meaning":"차의 길이는 변 \\(\\mathrm{BC}\\)의 길이로 일정해요. 합은 중점을 향한 벡터의 두 배예요."},{"label":"\\(4\\overrightarrow{\\mathrm{PQ}}=\\overrightarrow{\\mathrm{PB}}+2\\overrightarrow{\\mathrm{PD}}\\)","meaning":"\\(\\mathrm P\\)의 좌표가 정해지면 \\(\\mathrm Q\\)의 좌표도 정해져요. 좌표를 성분별로 비교해요."}]},"chapters":[{"id":"c1","label":"움직이는 점의 도형 읽기","stepIds":["s1","s2","s3"],"question":"길이 조건은 점 \\(\\mathrm X\\)가 어디에서 일정한 거리에 있다는 뜻일까요?","hint":"\\(\\mathrm{BC}\\)의 중점을 \\(\\mathrm E\\)라 하고 두 벡터의 합을 표현해 보세요.","explanation":"두 벡터의 차는 \\(\\overrightarrow{\\mathrm{CB}}\\)라서 길이가 4예요. 중점 \\(\\mathrm E=(4,2)\\)를 쓰면 합은 \\(2\\overrightarrow{\\mathrm{XE}}\\)가 되므로 \\(2\\overline{\\mathrm{XE}}=4\\)예요. 따라서 도형 \\(S\\)는 중심 \\((4,2)\\), 반지름 2인 원이에요.","check":{"prompt":"원의 반지름은 왜 4가 아니라 2인가요?","answer":"길이가 4인 것은 \\(2\\overrightarrow{\\mathrm{XE}}\\)예요. 벡터를 2배 하면 길이도 2배이므로 \\(\\overline{\\mathrm{XE}}=2\\)예요."}},{"id":"c2","label":"원 위의 점에서 다음 점으로","stepIds":["s4","s5","s6"],"question":"원 위의 모든 \\(\\mathrm P\\)를 빠짐없이 나타내려면 좌표를 어떻게 쓸까요?","hint":"중심의 좌표에 반지름과 \\(\\cos\\theta,\\sin\\theta\\)를 이용한 이동량을 더해 보세요.","explanation":"\\(\\mathrm P=(4+2\\cos\\theta,2+2\\sin\\theta)\\)로 쓰면 원을 한 바퀴 모두 나타낼 수 있어요. 벡터식의 각 성분을 정리하면 \\(\\mathrm Q\\)의 각 좌표는 \\(\\mathrm P\\)의 해당 좌표에 \\(\\mathrm B\\)의 좌표와 \\(\\mathrm D\\)의 좌표의 두 배를 더한 뒤 4로 나눈 값이에요. 그래서 \\(\\mathrm Q=(2+\\frac12\\cos\\theta,\\frac52+\\frac12\\sin\\theta)\\)를 얻어요.","check":{"prompt":"\\(\\mathrm P\\)를 움직일 때 \\(\\mathrm Q\\)의 원의 반지름은 얼마인가요?","answer":"좌표의 변화량에 붙은 계수가 \\(1/2\\)이므로 반지름은 \\(1/2\\)예요. 중심은 \\((2,5/2)\\)예요."}},{"id":"c3","label":"내적의 양 끝값 구하기","stepIds":["s7","s8"],"question":"내적을 좌표로 계산하면 어떤 삼각함수의 범위를 구하는 문제가 될까요?","hint":"\\(\\overrightarrow{\\mathrm{AC}}=(4,4)\\)를 이용해 \\(\\mathrm Q\\)의 두 좌표에 각각 4를 곱해 더하세요.","explanation":"내적은 \\(18+2(\\cos\\theta+\\sin\\theta)\\)예요. 합성하면 \\(18+2\\sqrt2\\sin(\\theta+\\pi/4)\\)이고 사인값은 -1부터 1까지 모두 가능해요. 원 위의 점을 제한 없이 움직이므로 두 끝값도 실제로 나와요. 따라서 \\(M=18+2\\sqrt2\\), \\(m=18-2\\sqrt2\\)이고, 곱은 합차공식으로 \\(18^2-(2\\sqrt2)^2=316\\)이에요.","check":{"prompt":"\\(\\cos\\theta\\)와 \\(\\sin\\theta\\)를 각각 1로 놓아도 되나요?","answer":"안 돼요. 두 값이 동시에 1일 수 없어요. 같은 \\(\\theta\\)의 두 값을 합성해서 가능한 범위를 구해야 해요."}}],"takeaway":["시작점이 같은 두 벡터의 차는 시작점과 무관해요. 합은 두 끝점의 중점으로 바꿔 보세요.","같은 각의 사인과 코사인은 각각의 최댓값을 따로 더하지 말고 합성해서 범위를 구해요."]};</script>
