<script>window.HandStudyRecord={"itemId":17332,"sourceLabel":"2022 교육청 고3 수학기하 4월 30번","adminYear":2022,"grade":3,"month":4,"number":30,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 두 점 $F \\left( c,\\,0 \\right)$, $F' \\left( -c,\\,0 \\right)$($c>0$)을 초점으로 하는 쌍곡선 $\\frac{x ^{2}}{10} - \\frac{y ^{2}}{a ^{2}}$$=1$이 있다. 쌍곡선 위의 점 중 제$2$사분면에 있는 점 $P$에 대하여 삼각형 $F'FP$는 넓이가 $15$이고 $\\angle F'PF$$= \\frac{\\pi}{2}$인 직각삼각형이다. 직선 $P F'$과 평행하고 쌍곡선에 접하는 두 직선을 $l _{1}$, $l _{2}$라 하자. 두 직선 $l _{1}$, $l _{2}$가 $x$축과 만나는 점을 $Q _{1}$, $Q _{2}$라 할 때, ${\\overline{ Q _{1} Q _{2}}}$$= \\frac{q}{p} \\sqrt{3}$이다. $p+q$의 값을 구하시오. (단, $p$와 $q$는 서로소인 자연수이고, $a$는 양수이다.) [4점]","answer":"13","sourceHash":"953c4a742e0fc9b367e4f26a467efdf016e82a24b53b5c57517cdcdd76630eca","steps":[{"id":"s1","latex":"PF=u,\\quad PF'=u-2\\sqrt{10},\\quad\\tfrac12u(u-2\\sqrt{10})=15"},{"id":"s2","latex":"u=3\\sqrt{10},\\quad PF'=\\sqrt{10}\\Rightarrow4c^2=90+10=100,\\ c=5,\\ a^2=15"},{"id":"s3","latex":"H\\text{는 }P\\text{에서 }FF'\\text{로 내린 수선의 발}:\\quad\\frac{PH}{F'H}=\\frac{PF}{PF'}=3"},{"id":"s4","latex":"l_1,l_2:\\quad y=3x\\pm\\sqrt{10\\cdot9-15}=3x\\pm5\\sqrt3"},{"id":"s5","latex":"Q_1Q_2=10\\sqrt3/3\\Rightarrow p+q=13"}],"diagram":null,"contentHash":"ac761f62fc7efe862052a35a0dd4ef633f4ec83c0e63dd9f0cd8b73ed2f4470d","questionHtml":"\u003cp class=\"hp htall\">그림과 같이 두 점 \u003cspan class=\"heq\">\\(F \\left( c,\\,0 \\right)\\)\u003c/span>, \u003cspan class=\"heq\">\\(F' \\left( -c,\\,0 \\right)\\)\u003c/span>(\u003cspan class=\"heq\">\\(c\\gt 0\\)\u003c/span>)을 초점으로 하는 쌍곡선 \u003cspan class=\"heq\">\\(\\dfrac{x^{2}}{10} - \\dfrac{y^{2}}{a^{2}}\\)\u003c/span>\u003cspan class=\"heq\">\\(=1\\)\u003c/span>이 있다. 쌍곡선 위의 점 중 제\u003cspan class=\"heq\">\\(2\\)\u003c/span>사분면에 있는 점 \u003cspan class=\"heq\">\\(P\\)\u003c/span>에 대하여 삼각형 \u003cspan class=\"heq\">\\(F'FP\\)\u003c/span>는 넓이가 \u003cspan class=\"heq\">\\(15\\)\u003c/span>이고 \u003cspan class=\"heq\">\\(\\angle F'PF\\)\u003c/span>\u003cspan class=\"heq\">\\(= \\dfrac{\\pi}{2}\\)\u003c/span>인 직각삼각형이다. 직선 \u003cspan class=\"heq\">\\(P F'\\)\u003c/span>과 평행하고 쌍곡선에 접하는 두 직선을 \u003cspan class=\"heq\">\\(l_{1}\\)\u003c/span>, \u003cspan class=\"heq\">\\(l_{2}\\)\u003c/span>라 하자. 두 직선 \u003cspan class=\"heq\">\\(l_{1}\\)\u003c/span>, \u003cspan class=\"heq\">\\(l_{2}\\)\u003c/span>가 \u003cspan class=\"heq\">\\(x\\)\u003c/span>축과 만나는 점을 \u003cspan class=\"heq\">\\(Q_{1}\\)\u003c/span>, \u003cspan class=\"heq\">\\(Q_{2}\\)\u003c/span>라 할 때, \u003cspan class=\"heq\">\\({\\overline{Q_{1} Q_{2}}}\\)\u003c/span>\u003cspan class=\"heq\">\\(= \\dfrac{q}{p} \\sqrt{3}\\)\u003c/span>이다. \u003cspan class=\"heq\">\\(p+q\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(p\\)\u003c/span>와 \u003cspan class=\"heq\">\\(q\\)\u003c/span>는 서로소인 자연수이고, \u003cspan class=\"heq\">\\(a\\)\u003c/span>는 양수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/77bbf9134350801e19c4a8fb.png\" style=\"width:413px;max-width:100%\">\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"dbad1f359554f557f8730d0d3ee8e75065a01700c69b3db3ddc882785cf3402c"};</script>
<script>window.HandStudyGuide={"itemId":17332,"sourceHash":"953c4a742e0fc9b367e4f26a467efdf016e82a24b53b5c57517cdcdd76630eca","contentHash":"ac761f62fc7efe862052a35a0dd4ef633f4ec83c0e63dd9f0cd8b73ed2f4470d","overview":{"goal":"쌍곡선의 거리차와 직각삼각형 넓이로 쌍곡선을 정한 뒤, 평행한 두 접선의 절편 차를 구해요.","firstLook":"왼쪽 가지의 점에서는 먼 초점까지 거리와 가까운 초점까지 거리의 차가 \\(2\\sqrt{10}\\)이에요.","conditions":[{"label":"쌍곡선","meaning":"장반경 제곱은 \\(10\\), 초점거리 제곱은 \\(10+a^2\\)이에요."},{"label":"직각삼각형","meaning":"\\(PF,PF'\\)가 두 직각변이고 \\(FF'\\)가 빗변이에요."}]},"chapters":[{"id":"c1","label":"초점거리와 단반경을 구해요","stepIds":["s1","s2"],"question":"\\(c\\)와 \\(a^2\\)는 얼마인가요?","hint":"거리차와 넓이를 먼저 \\(PF=u\\)에 넣어요.","explanation":"\\(PF=u\\)라 하면 왼쪽 가지에서 \\(PF-PF'=2\\sqrt{10}\\)이므로 \\(PF'=u-2\\sqrt{10}\\)이에요. 직각삼각형 넀이가 \\(15\\)여서 \\(u(u-2\\sqrt{10})/2=15\\), 양의 해는 \\(u=3\\sqrt{10}\\)이고 \\(PF'=\\sqrt{10}\\)예요. 피타고라스 정리로 \\((2c)^2=PF^2+PF'^2=90+10=100\\), 따라서 \\(c=5\\)예요. \\(c^2=10+a^2\\)에서 \\(a^2=15\\)예요.","check":{"prompt":"거리식의 다른 해를 버리는 이유는 무엇인가요?","answer":"거리 \\(PF\\)가 양수이고 \\(PF'>0\\)이어야 하기 때문이에요."}},{"id":"c2","label":"평행한 접선의 기울기를 찾아요","stepIds":["s3"],"question":"직선 \\(PF'\\)의 기울기 크기는 왜 \\(3\\)인가요?","hint":"직각삼각형에서 빗변에 내린 높이로 생긴 닮음을 이용해요.","explanation":"\\(P\\)에서 \\(FF'\\)에 내린 수선의 발을 \\(H\\)라 하면 직각삼각형의 닮음으로 \\(PH/F'H=PF/PF'=3\\)이에요. 따라서 \\(PF'\\)의 기울기 크기는 \\(3\\)이고, 문제의 그림 방향에 따라 접선들을 \\(y=3x+n\\) 꼴로 놓을 수 있어요.","check":{"prompt":"두 직각변의 길이비는 얼마인가요?","answer":"\\(PF:PF'=3:1\\)이에요."}},{"id":"c3","label":"접선 조건으로 두 절편을 구해요","stepIds":["s4","s5"],"question":"두 접선의 \\(x\\)절편 차는 얼마인가요?","hint":"직선 \\(y=3x+n\\)을 쌍곡선에 넣어 판별식을 \\(0\\)으로 놓아요.","explanation":"쌍곡선 \\(x^2/10-y^2/15=1\\)에 \\(y=3x+n\\)을 넣은 이차방정식이 한 해를 가져야 해요. 판별식 조건을 정리하면 \\(n^2=10\\cdot3^2-15=75\\), 따라서 \\(n=\\pm5\\sqrt3\\)예요. 두 직선의 \\(x\\)절편은 각각 \\(-n/3\\)이므로 거리는 \\(10\\sqrt3/3\\)예요. \\(p=3,q=10\\)이어서 \\(p+q=13\\)이에요.","check":{"prompt":"\\(p,q\\)는 서로소인가요?","answer":"\\(3\\)과 \\(10\\)은 서로소예요."}}],"takeaway":["쌍곡선의 두 초점거리 차는 장축 길이와 같아요.","직각삼각형의 넓이와 피타고라스 정리를 함께 쓰면 초점거리를 정할 수 있어요.","주어진 기울기의 접선은 대입한 이차방정식의 판별식을 \\(0\\)으로 놓아 구해요."]};</script>
