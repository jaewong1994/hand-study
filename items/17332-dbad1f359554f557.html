  <script>window.HandStudyRecord={"itemId":17332,"sourceLabel":"2022 교육청 고3 수학기하 4월 30번","adminYear":2022,"grade":3,"month":4,"number":30,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 두 점 $F \\left( c,\\,0 \\right)$, $F' \\left( -c,\\,0 \\right)$($c>0$)을 초점으로 하는 쌍곡선 $\\frac{x ^{2}}{10} - \\frac{y ^{2}}{a ^{2}}$$=1$이 있다. 쌍곡선 위의 점 중 제$2$사분면에 있는 점 $P$에 대하여 삼각형 $F'FP$는 넓이가 $15$이고 $\\angle F'PF$$= \\frac{\\pi}{2}$인 직각삼각형이다. 직선 $P F'$과 평행하고 쌍곡선에 접하는 두 직선을 $l _{1}$, $l _{2}$라 하자. 두 직선 $l _{1}$, $l _{2}$가 $x$축과 만나는 점을 $Q _{1}$, $Q _{2}$라 할 때, ${\\overline{ Q _{1} Q _{2}}}$$= \\frac{q}{p} \\sqrt{3}$이다. $p+q$의 값을 구하시오. (단, $p$와 $q$는 서로소인 자연수이고, $a$는 양수이다.) [4점]","answer":"13","sourceHash":"953c4a742e0fc9b367e4f26a467efdf016e82a24b53b5c57517cdcdd76630eca","steps":[{"id":"s1","latex":"PF=u,\\quad PF'=u-2\\sqrt{10},\\quad\\tfrac12u(u-2\\sqrt{10})=15"},{"id":"s2","latex":"u=3\\sqrt{10},\\quad PF'=\\sqrt{10}\\Rightarrow4c^2=90+10=100,\\ c=5,\\ a^2=15"},{"id":"s3","latex":"H\\text{는 }P\\text{에서 }FF'\\text{로 내린 수선의 발}:\\quad\\frac{PH}{F'H}=\\frac{PF}{PF'}=3"},{"id":"s4","latex":"l_1,l_2:\\quad y=3x\\pm\\sqrt{10\\cdot9-15}=3x\\pm5\\sqrt3"},{"id":"s5","latex":"Q_1Q_2=10\\sqrt3/3\\Rightarrow p+q=13"}],"diagram":null,"contentHash":"ac761f62fc7efe862052a35a0dd4ef633f4ec83c0e63dd9f0cd8b73ed2f4470d","questionHtml":"\u003cp class=\"hp htall\">그림과 같이 두 점 \u003cspan class=\"heq\">\\(F \\left( c,\\,0 \\right)\\)\u003c/span>, \u003cspan class=\"heq\">\\(F' \\left( -c,\\,0 \\right)\\)\u003c/span>(\u003cspan class=\"heq\">\\(c\\gt 0\\)\u003c/span>)을 초점으로 하는 쌍곡선 \u003cspan class=\"heq\">\\(\\dfrac{x^{2}}{10} - \\dfrac{y^{2}}{a^{2}}\\)\u003c/span>\u003cspan class=\"heq\">\\(=1\\)\u003c/span>이 있다. 쌍곡선 위의 점 중 제\u003cspan class=\"heq\">\\(2\\)\u003c/span>사분면에 있는 점 \u003cspan class=\"heq\">\\(P\\)\u003c/span>에 대하여 삼각형 \u003cspan class=\"heq\">\\(F'FP\\)\u003c/span>는 넓이가 \u003cspan class=\"heq\">\\(15\\)\u003c/span>이고 \u003cspan class=\"heq\">\\(\\angle F'PF\\)\u003c/
