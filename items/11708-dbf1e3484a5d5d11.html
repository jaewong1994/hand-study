  <script>window.HandStudyRecord={"itemId":11708,"sourceLabel":"2020 교육청 고1 수학 9월 19번","adminYear":2020,"grade":1,"month":9,"number":19,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"좌표평면 위에 점 ${{ A \\left( 0 ,\\, 1 \\right) }{{from^2020^09^인천교고1^중}}$이 있다. 이차함수 $f \\left( x \\right) = \\frac{1}{4} x ^{2}$의 그래프 위의 점 ${ P }\\left( t ,\\, \\frac{t ^{2}}{4} \\right)$ $\\left( t>0 \\right)$을 지나고 기울기가 $\\frac{ t }{2 }$인 직선이 $x$축과 만나는 점을 ${ Q$라 할 때, 보기에서 옳은 것만을 있는 대로 고른 것은? [4점]\n\u003c보 기>ㄱ. $t=2$일 때, 점 ${ Q$의 $x$좌표는 $1$이다. ㄴ. 두 직선 ${ PQ$와 ${ AQ$는 서로 수직이다.ㄷ. 선분 ${ QA$를 $3 \\,:\\, 2$로 외분하는 점 ${ R$가 함수 $y=f \\left( x \\right)$의 그래프 위의 점일 때, 삼각형 ${ RQP$의 넓이는 $6 \\sqrt{3}$이다.\n① ㄱ ② ㄴ ③ ㄱ, ㄴ\n④ ㄱ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","answer":"⑤","sourceHash":"552ca2fe9847c7fed9ef7a58587c67bd934b8082d4e394e6eddf49f14032f8f0","steps":[{"id":"s1","latex":"PQ:\\ y-\\frac{t^2}{4}=\\frac t2(x-t),\\quad y=0\\Rightarrow Q=\\left(\\frac t2,0\\right)"},{"id":"s2","latex":"t=2\\Rightarrow x_Q=1\\quad\\text{(\\char\"3131 참)}"},{"id":"s3","latex":"\\operatorname{slope}(AQ)=-\\frac2t,\\quad\\operatorname{slope}(PQ)=\\frac t2\\Rightarrow AQ\\perp PQ\\quad\\text{(\\char\"3134 참)}"},{"id":"s4","latex":"R=\\frac{3A-2Q}{3-2}=(-t,3)"},{"id":"s5","latex":"R\\in y=\\frac14x^2\\Rightarrow\\frac{t^2}{4}=3\\Rightarrow t=2\\sqrt3"},{"id":"s6","latex":"R=(-2\\sqrt3,3),\\ P=(2\\sqrt3,3),\\ Q=(\\sqrt3,0)"},{"id":"s7","latex":"[\\triangle RQP]=\\frac12\\cdot4\\sqrt3\\cdot3=6\\sqrt3\\quad\\text{(\\char\"3137 참)}"}],"diagram":null,"contentHash":"fcf78a3d6d2b04b8b63a0414c337d9246673614a798d8174842346da54156c47","questionHtml":"\u003cp class=\"hp htall\">좌표평면 위에 점 \u003cspan class=\"heq\">\\({{A \\left( 0 ,\\, 1 \\right) }}\\)\u003c/span>이 있다. 이차함수 \u003cspan class=\"heq\">\\(f \\left( x \\right) = \\dfrac{1}{4} x^{2}\\)\u003c/span>의 그래프 위의 점 \u003cspan class=\"heq\">\\({P }\\left( t ,\\, \\dfrac{t^{2}}{4} \\right)\\)\u003c/span> \u003cspan class=\"heq\">\\(\\left( t\\gt 0 \\right)\\)\u003c/span>을 지나고 기울기가 \u003cspan class=\"heq\">\\(\\dfrac{ t\t}{2 }\\)\u003c/span>인 직선이 \u003cspan class=\"heq\">\\(x\\)\u003c/span>축과 만나는 점을 \u003cspan class=\"heq\">\\({Q }\\)\u003c/span>라 할 때, 보기에서 옳은 것만을 있는 대로 고른 것은? \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cdiv class=\"hbox\">\u003cdiv style=\"text-align:center;font-weight:700;margin:0 0 6px\">&lt; 보 기 &gt;\u003c/div>\u003cp class=\"hp\">ㄱ. \u003cspan class=\"heq\">\\(t=2\\)\u003c/span>일 때, 점 \u003cspan class=\"heq\">\\({Q }\\)\u003c/span>의 \u003cspan class=\"heq\">\\(x\\)\u003c/span>좌표는 \u003cspan class=\"heq\">\\(1\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp\">ㄴ. 두 직선 \u003cspan class=\"heq\">\\({PQ }\\)\u003c/span>와 \u003cspan class=\"heq\">\\({AQ }\\)\u003c/span>는 서로 수직이다.\u003c/p>\u003cp class=\"hp\">ㄷ. 선분 \u003cspan class=\"heq\">\\({QA }\\)\u003c/span>를 \u003cspan class=\"heq\">\\(3 \\,:\\, 2\\)\u003c/span>로 외분하는 점 \u003cspan class=\"heq\">\\({R }\\)\u003c/span>가 함수 \u003cspan class=\"heq\">\\(y=f \\left( x \\right)\\)\u003c/span>의 그래프 위의 점일 때, 삼각형 \u003cspan class=\"heq\">\\({RQP }\\)\u003c/span>의 넓이는 \u003cspan class=\"heq\">\\(6 \\sqrt{3}\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp class=\"hp\">① ㄱ&emsp;② ㄴ&emsp;③ ㄱ, ㄴ\u003c/p>\u003cp class=\"hp\">④ ㄱ, ㄷ&emsp;⑤ ㄱ, ㄴ, ㄷ\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"dbf1e3484a5d5d11041118ebc18cc6a36d2764b1dae173e2a56db6d523f7e465"};</script>
