  <script>window.HandStudyRecord={"itemId":16769,"sourceLabel":"2020 교육청 고3 수리나형 3월 14번","adminYear":2020,"grade":3,"month":3,"number":14,"track":"수리나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"세 숫자 $1$, $2$, $3$ 만을 사용하여 일곱 자리의 자연수를 만들 때, 세 숫자 $1$, $2$, $3\\,$을 모두 한 번 이상씩 사용하고 숫자 $2\\,$를 반드시 짝수 번째 자리에만 오도록 놓는 경우의 수를 구하려고 한다. 다음은 이것을 구하는 과정의 일부이다.\n일곱 자리의 자연수를 만들 때, 짝수 번째 자리는\n세 군데이므로 숫자 $2\\,$는 많아야 세 번 사용할 수 있다.\n(ⅰ)숫자 $2\\,$를 한 번 사용한 경우\n$2\\,$를 십의 자리에 오도록 놓으면 조건을 만족시키도록 만들 수 있는 자연수는 나머지 자리에 $1$, $1$, $1,$ $1$, $1,$ $3$ 또는 $1$, $1,$ $1$, $1$, $3$, $3\\,$ 또는 $1$, $1$, $1$, $3$, $3$, $3$ 또는\n$1$, $1$, $3$, $3$, $3,$ $3\\,$ 또는 $1$, $3$, $3$, $3$, $3,$ $3\\,$을 나열한 것이므로 그 경우의 수는 ${\\boxed{\\vphantom{(}\\,(\\text{가}) \\, \\,}} \\,$이다.\n$2\\,$를 짝수 번째 자리에 한 번 오도록 놓는 경우의 수는 세 군데 중 한 군데를 선택하는 경우의 수와 같으므로 $_{3} {\\C}_{1} \\,$이다.\n그러므로 숫자 $2\\,$를 한 번 사용했을 때 일곱 자리의 자연수를 만들 수 있는 경우의 수는 $\\boxed{\\vphantom{(}\\,(\\text{나})\\,}\\,$이다.\n(ⅱ)숫자 $2\\,$를 두 번 사용한 경우\n $\\vdots$ (중략)\n(ⅲ)숫자 $2$를 세 번 사용한 경우\n$2\\,$를 모든 짝수 번째 자리에 오도록 놓으면 조건을 만족시키도록 만들 수 있는 자연수는 홀수 번째 자리에 \n$1$, $3\\,$을 모두 한 번 이상씩 사용하여 나열한 것이므로 \n그 경우의 수는 $\\boxed{\\vphantom{(}\\,(\\text{다})\\,}\\,$이다.\n따라서 (ⅰ), (ⅱ), (ⅲ)에 의해 구하는 경우의 수는 $290\\,$이다.\n위의 (가), (나), (다)에 알맞은 수를 각각 $p$, $q$, $r\\,$라 할 때,\n$p+q+r\\,$의 값은? [4점]\n① $262$ ② $267$ ③ $272$ ④ $277$ ⑤ $282$","answer":"①","sourceHash":"dca044aaf7be97db2dc800288118d4322accba004b8b77f57b3579b220f9c60e","steps":[{"id":"s1","latex":"p=2^6-2=62"},{"id":"s2","latex":"q={3\\choose1}62=186"},{"id":"s3","latex":"r=2^4-2=14"},{"id":"s4","latex":"p+q+r=\\boxed{262}"}],"diagram":null,"contentHash":"f65a8b98f387655e048467c2ff1d5e0d6a6b0faf110841b909b3e4485b55abad","questionHtml":"\u003cp class=\"hp\">세 숫자 \u003cspan class=\"heq\">\\(1\\)\u003c/span>, \u003cspan class=\"heq\">\\(2\\)\u003c/span>, \u003cspan class=\"heq\">\\(3\\)\u003c/span> 만을 사용하여 일곱 자리의 자연수를 만들 때, 세 숫자 \u003cspan class=\"heq\">\\(1\\)\u003c/span>, \u003cspan class=\"heq\">\\(2\\)\u003c/span>, \u0
