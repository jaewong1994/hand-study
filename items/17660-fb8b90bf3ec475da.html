<script>window.HandStudyRecord={"itemId":17660,"sourceLabel":"2023 교육청 고3 수학미적분 3월 22번","adminYear":2023,"grade":3,"month":3,"number":22,"track":"미적분","points":4,"scoreStatus":"confirmed_4_direct","questionText":"최고차항의 계수가 $1\\,$인 사차함수 $f(x)\\,$가 있다. 실수 $t\\,$에 대하여 함수 $g(x)\\,$를 $g(x)= \\left| f(x)-t \\right| \\,$라 할 때, $\\lim _{x\\, \\rightarrow \\,k} {\\frac{g(x)-g(k)}{\\left| x-k \\right|}} \\,$의 값이 존재하는 서로 다른 실수 $k\\,$의 개수를 $h(t)\\,$라 하자. 함수 $h(t)\\,$는 다음 조건을 만족시킨다.\n(가) $\\lim _{t\\, \\rightarrow \\,4+} {h(t)} =5$ (나) 함수 $h(t)\\,$는 $t= -60\\,$과 $t=4\\,$에서만 불연속이다.\n$f(2)=4\\,$이고 $f'(2)>0\\,$일 때, $f(4)+h(4)\\,$의 값을 구하시오.\n[4점]\n 사각형입니다. 2023년 3월 고3 모의고사 문제지제 2 교시 수학 영역(미적분) \n5 지선다형","answer":"729","sourceHash":"4fe33f003e7f29bc083d4edaaeb49eea9afbed57772fc271a17e16792e6e806f","steps":[{"id":"s1","latex":"L_k=\\lim_{x\\to k}\\frac{|f(x)-t|-|f(k)-t|}{|x-k|}"},{"id":"s2","latex":"L_k\\text{ 존재}\\Longleftrightarrow f(k)=t\\ \\text{ 또는 }\\ f'(k)=0"},{"id":"s3","latex":"h(t)=\\#\\bigl(\\{f=t\\}\\cup\\{f'=0\\}\\bigr)"},{"id":"s4","latex":"\\lim_{t\\to4+}h(t)=5,\\quad h\\text{의 불연속점}=-60,4"},{"latex":"h(4+)=5\\Rightarrow f^{\\prime}\\text{는 서로 다른 세 근, }f\\text{는 두 극소와 한 극대}","id":"s5"},{"latex":"\\text{불연속 높이가 둘}\\Rightarrow\\text{두 극솟값은 }-60,\\quad\\text{극댓값은 }4","id":"s6"},{"id":"s7","latex":"f(x)+60=(x-\\alpha)^2(x-\\beta)^2=\\left((x-\\gamma)^2-d\\right)^2"},{"id":"s8","latex":"f(\\gamma)=4\\Rightarrow d^2-60=4\\Rightarrow d=8"},{"id":"s9","latex":"f(2)=4\\Rightarrow (2-\\gamma)^2\\in\\{0,16\\}"},{"id":"s10","latex":"f'(2)>0\\Rightarrow 2-\\gamma=4\\Rightarrow \\gamma=-2"},{"id":"s11","latex":"f(x)=\\left((x+2)^2-8\\right)^2-60,\\quad f(4)=724"},{"id":"s12","latex":"\\{f=4\\}=\\{-6,-2,2\\},\\quad \\{f'=0\\}=\\{-2-2\\sqrt2,-2,-2+2\\sqrt2\\}"},{"id":"s13","latex":"h(4)=5\\Rightarrow f(4)+h(4)=\\boxed{729}"}],"diagram":null,"contentHash":"73c9a568eefa92254c52f722171cb352947ea19690d5c22e00987ef9e28b91a6","questionHtml":"\u003cp class=\"hp htall\">최고차항의 계수가 \u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>인 사차함수 \u003cspan class=\"heq\">\\(f(x)\\,\\)\u003c/span>가 있다.\u003cbr>실수 \u003cspan class=\"heq\">\\(t\\,\\)\u003c/span>에 대하여 함수 \u003cspan class=\"heq\">\\(g(x)\\,\\)\u003c/span>를 \u003cspan class=\"heq\">\\(g(x)= \\left| f(x)-t \\right| \\,\\)\u003c/span>라 할 때,\u003cbr>\u003cspan class=\"heq\">\\(\\lim\\limits_{x\\, \\rightarrow \\,k} {\\dfrac{g(x)-g(k)}{\\left| x-k \\right|}} \\,\\)\u003c/span>의 값이 존재하는 서로 다른 실수 \u003cspan class=\"heq\">\\(k\\,\\)\u003c/span>의 개수를\u003cbr>\u003cspan class=\"heq\">\\(h(t)\\,\\)\u003c/span>라 하자. 함수 \u003cspan class=\"heq\">\\(h(t)\\,\\)\u003c/span>는 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) \u003cspan class=\"heq\">\\(\\lim\\limits_{t\\, \\rightarrow \\,4+} {h(t)} =5\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">(나) 함수 \u003cspan class=\"heq\">\\(h(t)\\,\\)\u003c/span>는 \u003cspan class=\"heq\">\\(t= -60\\,\\)\u003c/span>과 \u003cspan class=\"heq\">\\(t=4\\,\\)\u003c/span>에서만 불연속이다.\u003c/p>\u003c/div>\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(f(2)=4\\,\\)\u003c/span>이고 \u003cspan class=\"heq\">\\(f'(2)\\gt 0\\,\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(f(4)+h(4)\\,\\)\u003c/span>의 값을 구하시오.\u003c/p>\u003cp class=\"hp\">\u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"fb8b90bf3ec475daa387e3f2ade9f7fbb418c60bbb4bf4ab2c5f4ca1c0e10d5e"};</script>
<script>window.HandStudyGuide={"itemId":17660,"sourceHash":"4fe33f003e7f29bc083d4edaaeb49eea9afbed57772fc271a17e16792e6e806f","contentHash":"73c9a568eefa92254c52f722171cb352947ea19690d5c22e00987ef9e28b91a6","overview":{"goal":"주어진 극한이 존재하는 점을 방정식의 근으로 바꾸고, 극값의 높이로 사차함수를 복원해요.","firstLook":"분모가 \\(|x-k|\\)라서 오른쪽과 왼쪽의 부호가 달라져요. \\(f(k)=t\\)인 경우와 아닌 경우를 나누면, 세려는 점은 \\(f(k)=t\\) 또는 \\(f'(k)=0\\)인 점이에요.","conditions":[{"label":"(가)","meaning":"\\(t=4\\)보다 조금 큰 높이에서 방정식 \\(f(x)=t\\)의 근과 극값 위치를 합쳐 5개예요."},{"label":"(나)","meaning":"수평선과 그래프의 교점 개수가 바뀌는 극솟값·극댓값의 높이는 \\(-60\\)과 \\(4\\)뿐이에요."},{"label":"위치 결정","meaning":"\\(f(2)=4\\)와 \\(f'(2)>0\\)이 좌우로 이동할 수 있는 그래프의 중심을 하나로 정해요."}]},"chapters":[{"id":"c1","label":"극한이 존재하는 점을 분류해요","stepIds":["s1","s2","s3"],"question":"왜 극한의 존재 조건이 \\(f(k)=t\\) 또는 \\(f'(k)=0\\)일까요?","hint":"\\(f(k)-t\\)가 \\(0\\)인지 아닌지 나누고, 분모 \\(|x-k|\\) 때문에 좌우에서 생기는 부호를 비교해요.","explanation":"\\(f(k)\ne t\\)이면 \\(|f(x)-t|\\)는 \\(k\\) 근처에서 보통처럼 미분돼요. 분자를 \\(g'(k)(x-k)\\)로 보면 오른쪽 극한은 \\(g'(k)\\), 왼쪽 극한은 \\(-g'(k)\\)가 되므로 둘이 같으려면 \\(g'(k)=0\\), 곧 \\(f'(k)=0\\)이어야 해요.\n\n반대로 \\(f(k)=t\\)이면 분자는 \\(|f(x)-f(k)|\\)예요. 이를 \\(|x-k|\\)로 나눈 값은 양쪽에서 \\(|f'(k)|\\)로 가므로 극한이 존재해요. 따라서 세려는 \\(k\\)는 \\(f(k)=t\\)인 점과 \\(f'(k)=0\\)인 점의 합집합이고, 같은 점은 한 번만 세어요.","check":{"prompt":"\\(f(k)=t\\)이고 \\(f'(k)=0\\)인 점은 \\(h(t)\\)에서 몇 번 세나요?","answer":"두 조건을 모두 만족해도 서로 다른 실수 \\(k\\)의 개수를 세므로 한 번만 세어요."}},{"id":"c2","label":"불연속 높이로 그래프 모양을 정해요","stepIds":["s4","s5","s6"],"question":"\\(t=4\\)의 오른쪽에서 개수가 5라는 조건은 왜 두 극소와 한 극대를 뜻할까요?","hint":"사차함수의 양끝은 위로 향하고, 수평선이 극값 높이를 지날 때 교점 개수가 바뀌어요.","explanation":"최고차항 계수가 양수인 사차함수에서 \\(t=4\\)보다 조금 큰 수평선이 그래프와 두 점에서 만나고, 여기에 서로 다른 극값 위치 세 점을 더하면 \\(h(t)=5\\)가 돼요. 따라서 \\(f'(x)=0\\)은 서로 다른 세 근을 가지고 그래프는 두 극소와 그 사이 한 극대를 가져요.\n\n\\(h(t)\\)가 불연속이 되는 높이는 수평선 \\(y=t\\)가 극값 높이를 지날 때예요. 불연속 높이가 \\(-60\\)과 \\(4\\) 두 개뿐이므로 두 극솟값은 서로 같아 \\(-60\\), 가운데 극댓값은 \\(4\\)예요.","check":{"prompt":"두 극솟값이 서로 달랐다면 조건 (나)에 어떤 문제가 생기나요?","answer":"각 극솟값을 지날 때 교점 개수가 바뀌므로 극댓값 높이까지 합쳐 불연속 높이가 세 개가 되어 조건과 맞지 않아요."}},{"id":"c3","label":"같은 극솟값으로 사차함수를 묶어요","stepIds":["s7","s8"],"question":"두 극소에서 값이 \\(-60\\)이라는 사실이 왜 완전제곱의 제곱 꼴을 만들까요?","hint":"\\(f(x)+60\\)은 두 극소 위치에서 값도 \\(0\\), 도함숫값도 \\(0\\)이에요.","explanation":"두 극소 위치를 \\(\\alpha,\\beta\\)라 하면 \\(f(x)+60\\)은 두 점에서 각각 같은 인수가 두 번씩 곱해져요. 최고차항 계수가 \\(1\\)이므로\n\n\\(f(x)+60=(x-\\alpha)^2(x-\\beta)^2=\\{(x-\\gamma)^2-d\\}^2\\)\n\n로 쓸 수 있어요. 여기서 \\(\\gamma\\)는 두 극소 위치의 가운데이고 \\(d>0\\)이에요. 가운데 \\(x=\\gamma\\)에서 극댓값이 \\(4\\)이므로 \\(d^2-60=4\\), 따라서 \\(d=8\\)이에요.","check":{"prompt":"\\(d^2=64\\)에서 \\(d=-8\\)을 쓰지 않는 이유는 무엇인가요?","answer":"\\(d\\)는 두 극소 위치 사이 거리의 제곱에서 나온 양수이므로 \\(d=8\\)이어야 해요."}},{"id":"c4","label":"도함수의 부호로 중심을 선택해요","stepIds":["s9","s10","s11"],"question":"\\(f(2)=4\\)가 주는 여러 위치 중 \\(f'(2)>0\\)은 어느 것을 남길까요?","hint":"\\(\\{(2-\\gamma)^2-8\\}^2=64\\)를 풀고, 도함수의 부호를 실제로 확인해요.","explanation":"\\(f(2)=4\\)를 넣으면 \\(\\{(2-\\gamma)^2-8\\}^2=64\\)이므로 \\((2-\\gamma)^2=0\\) 또는 \\(16\\)이에요. 첫 경우에는 \\(2=\\gamma\\)라 도함숫값이 \\(0\\)이어서 제외돼요. 둘째 경우에는 \\(2-\\gamma=\\pm4\\)인데, 도함수는\n\n\\(f'(x)=4(x-\\gamma)\\{(x-\\gamma)^2-8\\}\\)\n\n이므로 \\(x=2\\)에서 양수가 되려면 \\(2-\\gamma=4\\)여야 해요. 따라서 \\(\\gamma=-2\\)이고 \\(f(x)=\\{(x+2)^2-8\\}^2-60\\)이에요. 그러면 \\(f(4)=(36-8)^2-60=724\\)예요.","check":{"prompt":"\\(2-\\gamma=-4\\)일 때 도함숫값의 부호는 무엇인가요?","answer":"\\((2-\\gamma)^2-8=8>0\\)이고 첫 인수는 음수이므로 \\(f'(2)<0\\)가 되어 제외돼요."}},{"id":"c5","label":"겹치는 점을 한 번만 세어요","stepIds":["s12","s13"],"question":"\\(t=4\\)에서 두 집합의 원소는 무엇이고, 왜 합집합의 원소가 5개일까요?","hint":"\\(f(x)=4\\)와 \\(f'(x)=0\\)을 각각 풀고 공통인 \\(x=-2\\)를 확인해요.","explanation":"\\(f(x)=4\\)를 풀면 \\(\\{(x+2)^2-8\\}^2=64\\)에서 \\(x=-6,-2,2\\)를 얻어요. 또 \\(f'(x)=0\\)에서는 \\(x=-2-2\\sqrt2,-2,-2+2\\sqrt2\\)를 얻어요. 두 집합은 \\(-2\\) 하나가 겹치므로 원소 수는 \\(3+3-1=5\\), 즉 \\(h(4)=5\\)예요. 따라서 \\(f(4)+h(4)=724+5=729\\)예요.","check":{"prompt":"\\(h(4)\\)를 \\(6\\)으로 세면 어떤 점을 중복한 것인가요?","answer":"\\(f(-2)=4\\)이면서 \\(f'(-2)=0\\)인 \\(x=-2\\)를 두 번 센 것이에요."}}],"takeaway":["분모가 절댓값이면 좌우 극한의 부호를 따로 비교해 극한 존재 조건을 찾아요.","수평선과 그래프의 교점 개수가 바뀌는 높이는 극값의 높이와 연결돼요.","두 조건으로 얻은 점들의 개수는 합집합으로 세고 겹치는 점을 한 번 빼요."]};</script>
