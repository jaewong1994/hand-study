<script>window.HandStudyGuide={"itemId":17666,"sourceHash":"b6bf8f10da2433146927f21669ff78337c6533efa25c6aa6f23dd679eb2e7165","contentHash":"ec90856c3ac25805d5a76a9d105269a3274d9e6162bdc3567a792353341ed8f2","overview":{"goal":"사다리꼴 넓이와 빗변 길이의 극한을 \\(a\\)의 범위별로 계산해 가능한 \\(a\\)를 모두 구해요.","firstLook":"\\(0<a<1\\)이면 \\(a\\)ⁿ이 0으로 가고\\(, a>1\\)이면 \\(a\\)ⁿ으로 나누어 최고차항의 비를 봐요.","conditions":[{"label":"두 범위","meaning":"문제에서 \\(a>0, a\\ne1\\)이므로 \\(0<a<1\\)과 \\(a>1\\)을 빠짐없이 나눠요."}]},"chapters":[{"id":"c1","label":"좌표로 넓이와 길이 구하기","stepIds":["s1","s2","s3"],"question":"Sn의 두 평행변과 높이는 무엇인가요?","hint":"\\(\\log_a(x-1)=n\\)을 \\(x\\)에 대하여 풀고 수평선 \\(y=n,n+1\\)을 보세요.","explanation":"\\(\\log_a(x-1)=n\\)에서 \\(x=1+a^n\\)이므로 \\(A_n=(0,n)\\), \\(B_n=(1+a^n,n)\\)예요. 사다리꼴의 평행변은 \\(A_nB_n=1+a^n\\), \\(A_{n+1}B_{n+1}=1+a^{n+1}\\), 높이는 1이므로 \\(S_n=(2+a^n+a^{n+1})/2\\). 두 \\(B\\)점의 수평 차는 \\(a^{n+1}-a^n\\), 수직 차는 1이어서 \\(B_nB_{n+1}=\\sqrt{a^{2n}(a-1)^2+1}\\)예요.","check":{"prompt":"\\(BnBn+1\\)의 길이에 항상 +1이 들어가는 이유는 무엇인가요?","answer":"두 점의 \\(y\\)좌표가 \\(n\\)과 \\(n+1\\)이어서 수직 차가 1이기 때문이에요."}},{"id":"c2","label":"밑이 일보다 큰 경우","stepIds":["s4","s5"],"question":"\\(a\\)ⁿ으로 나눈 뒤 분자와 분모는 무엇으로 가나요?","hint":"분자에서는 \\(a-1\\)이 양수라는 점을 쓰세요.","explanation":"\\(a>1\\)이면 분자와 분모를 \\(a^n\\)으로 나눠요. 분자는 \\(\\sqrt{(a-1)^2+a^{-2n}}\\to a-1\\), 분모는 \\((2a^{-n}+1+a)/2\\to(1+a)/2\\). 따라서 비의 극한은 \\(2(a-1)/(a+1)\\). 이를 \\(3/[2(a+1)]\\)과 같게 두면 \\(4(a-1)=3\\), 즉 \\(a=7/4\\)예요.","check":{"prompt":"분자 극한에 \\(|a-1|\\) 대신 \\(a-1\\)을 쓴 이유는 무엇인가요?","answer":"이 장에서는 \\(a>1\\)이므로 \\(a-1\\)이 양수이기 때문이에요."}},{"id":"c3","label":"밑이 일보다 작은 경우와 합","stepIds":["s6","s7","s8"],"question":"이 범위에서 길이와 넓이는 각각 어디로 가나요?","hint":"\\(a\\)ⁿ\\(\\to 0\\)을 원래 두 식에 직접 넣으세요.","explanation":"\\(0<a<1\\)이면 \\(a^n\\to 0\\). 따라서 \\(B_nB_{n+1}\\to 1\\), \\(S_n\\to 1\\)이므로 비의 극한은 1예요. \\(1=3/[2(a+1)]\\)에서 \\(a=1/2\\). 두 범위의 해는 \\(7/4,1/2\\)이고 합은 \\(9/4\\), 정답은 ②예요.","check":{"prompt":"\\(a=1\\)을 별도로 검사해야 하나요?","answer":"원문에서 \\(a\\ne1\\)로 제외했고 두 범위에도 들어가지 않아요."}}],"takeaway":["지수항의 극한은 밑이 1보다 큰지 작은지에 따라 나누어 계산해요.","거리 공식에서는 수평 차뿐 아니라 고정된 수직 차도 빠뜨리지 않아요."]};</script>
