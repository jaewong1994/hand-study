<script>window.HandStudyRecord={"adminYear":2019,"answer":"51","contentHash":"c8ffdfe58450c79b1d69e06a7a88b76bcb7411e7cbc9ae6771a8a5b4f652dc7a","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24701,"month":11,"number":30,"points":4,"preview":false,"questionHtml":"\u003cp>최고차항의 계수가 양수인 삼차함수 \u003cspan class=\"heq\">\\(f(x)\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox hcond\">\u003cp class=\"hcondr\">(가) 방정식 \u003cspan class=\"heq\">\\(f(x)- x=0\\)\u003c/span>의 서로 다른 실근의 개수는 \u003cspan class=\"heq\">\\(2\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hcondr\">(나) 방정식 \u003cspan class=\"heq\">\\(f(x)+x=0\\)\u003c/span>의 서로 다른 실근의 개수는 \u003cspan class=\"heq\">\\(2\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp>\u003cspan class=\"heq\">\\(f(0)=0\\)\u003c/span>, \u003cspan class=\"heq\">\\(f&#x27; (1)=1\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(f(3)\\)\u003c/span>의 값을 구하시오. [4점]\u003c/p>","questionText":"최고차항의 계수가 양수인 삼차함수 $f(x)$가 다음 조건을 만족시킨다.\n(가) 방정식 $f(x)- x=0$의 서로 다른 실근의 개수는 $2$이다.(나) 방정식 $f(x)+x=0$의 서로 다른 실근의 개수는 $2$이다.\n$f(0)=0$, $f\\,' (1)=1$일 때, $f(3)$의 값을 구하시오. [4점]","sourceHash":"b650e8e370cec0bfca6735447b2f5bbb6aad41747eaf43ef760f101fc31d8a85","sourceKind":"csat","sourceLabel":"2019년 시행 수능 · 2020학년도 · 나형 · 30번","steps":[{"id":"s1","latex":"f(x)=ax^3+bx^2+cx,\\quad a>0,\\quad3a+2b+c=1"},{"id":"s2","latex":"f(x)-x=x(ax^2+bx+c-1),\\quad f(x)+x=x(ax^2+bx+c+1)"},{"id":"s3","latex":"\\text{서로 다른 근이 2개이려면 이차식은 }0\\text{과 다른 근을 가지거나, }0\\text{이 아닌 중근을 갖는다.}"},{"id":"s4","latex":"f-x:\\quad c=1\\ (b\\ne0)\\ \\text{또는 }b^2-4a(c-1)=0\\ (b\\ne0)"},{"id":"s5","latex":"f+x:\\quad c=-1\\ (b\\ne0)\\ \\text{또는 }b^2-4a(c+1)=0\\ (b\\ne0)"},{"id":"s6","latex":"\\text{두 판별식이 모두 }0\\text{이면 차 }8a=0\\text{이므로 불가능}"},{"id":"s7","latex":"c=-1\\text{이면 }b^2-4a(c-1)=b^2+8a>0\\text{이므로 불가능}"},{"id":"s8","latex":"c=1,\\quad b^2=8a,\\quad3a+2b=0"},{"id":"s9","latex":"b=-\\frac32a\\ \\Rightarrow\\ \\frac94a^2=8a\\ \\Rightarrow\\ a=\\frac{32}9,\\quad b=-\\frac{16}3"},{"id":"s10","latex":"f(x)=\\frac{32}9x^3-\\frac{16}3x^2+x"},{"id":"s11","latex":"f-x=\\frac{16}9x^2(2x-3),\\quad f+x=\\frac29x(4x-3)^2"},{"id":"s12","latex":"\\text{각각 서로 다른 근 2개이며 }f\\prime(1)=1,\\quad\\boxed{f(3)=51}"}],"track":"나형"};</script>
<script>window.HandStudyGuide={"itemId":24701,"sourceHash":"b650e8e370cec0bfca6735447b2f5bbb6aad41747eaf43ef760f101fc31d8a85","contentHash":"c8ffdfe58450c79b1d69e06a7a88b76bcb7411e7cbc9ae6771a8a5b4f652dc7a","overview":{"goal":"\\(f(x)-x\\)와 \\(f(x)+x\\)가 각각 서로 다른 두 실근을 갖는 경우를 빠짐없이 나누어 \\(f\\)를 정해요.","firstLook":"\\(f(0)=0\\)이므로 두 식 모두 \\(x=0\\)을 근으로 가져요. 나머지 이차식이 새 근 하나만 더 주는 경우를 분류하는 것이 핵심이에요.","conditions":[{"label":"(가)","meaning":"\\(f(x)-x\\)에서 \\(0\\)이 겹쳐 나오거나, 나머지 이차식이 \\(0\\) 아닌 한 점에서 접해야 해요."},{"label":"(나)","meaning":"\\(f(x)+x\\)에도 같은 두 갈래를 적용하고, (가)의 갈래와 함께 가능한 조합을 찾아요."}]},"chapters":[{"id":"c1","label":"공통인 근을 먼저 꺼내요","stepIds":["s1","s2"],"question":"두 방정식이 모두 이미 알고 있는 실근은 무엇인가요?","hint":"\\(f(0)=0\\)을 이용해 삼차함수의 상수항을 정해요.","explanation":"\\(f(0)=0\\)이고 최고차항의 계수가 양수이므로 \\(f(x)=ax^3+bx^2+cx\\), \\(a>0\\)으로 놓아요. 또 \\(f'(1)=1\\)에서 \\(3a+2b+c=1\\)이에요. 두 식을 인수분해하면\n\n\\(f(x)-x=x\\{ax^2+bx+c-1\\}\\), \\qquad \\(f(x)+x=x\\{ax^2+bx+c+1\\}\\)\n\n이어서 두 방정식은 모두 \\(x=0\\)을 근으로 가져요.","check":{"prompt":"\\(f'(1)=1\\)이 계수에 주는 식은 무엇인가요?","answer":"\\(f'(x)=3ax^2+2bx+c\\)이므로 \\(3a+2b+c=1\\)이에요."}},{"id":"c2","label":"새 근이 하나만 생기는 두 갈래를 나눠요","stepIds":["s3","s4","s5"],"question":"바깥의 근 \\(0\\)에 서로 다른 근 하나만 더하려면 안쪽 이차식은 어떤 모양이어야 할까요?","hint":"안쪽 이차식이 \\(0\\)도 근으로 갖는 경우와, \\(0\\) 아닌 중근을 갖는 경우를 나눠요.","explanation":"안쪽 이차식이 서로 다른 두 비영근을 가지면 전체 실근은 세 개가 되고, 실근이 없으면 전체 실근은 \\(0\\) 하나뿐이에요. 따라서 두 근만 만들려면 두 경우뿐이에요. 첫째, 안쪽 이차식도 \\(0\\)을 근으로 갖고 다른 근 하나를 가져 바깥의 \\(x\\)와 \\(0\\)이 겹치는 경우예요. 둘째, 안쪽 이차식이 \\(0\\)이 아닌 중근을 갖는 경우예요.\n\n따라서 \\(f-x\\)에서는 \\(c=1,\\ b\\ne0\\) 또는 \\(b^2-4a(c-1)=0,\\ b\\ne0\\)이고, \\(f+x\\)에서는 \\(c=-1,\\ b\\ne0\\) 또는 \\(b^2-4a(c+1)=0,\\ b\\ne0\\)이에요. \\(b\\ne0\\)은 새 근이 \\(0\\)과 달라야 한다는 조건이에요.","check":{"prompt":"판별식이 \\(0\\)인 경우에 왜 \\(b\\ne0\\)도 확인해야 하나요?","answer":"중근 \\(-b/(2a)\\)가 \\(0\\)이면 서로 다른 근이 하나만 남으므로, 새 중근이 \\(0\\)과 다르게 하려는 조건이에요."}},{"id":"c3","label":"불가능한 조합을 지워요","stepIds":["s6","s7","s8"],"question":"네 갈래의 조합 가운데 실제로 남는 것은 어느 조합일까요?","hint":"두 판별식이 동시에 \\(0\\)인 경우와 \\(c=-1\\)인 경우를 먼저 검사해요.","explanation":"두 이차식의 판별식이 모두 \\(0\\)이면\n\n\\(b^2-4a(c-1)=0,\\qquad b^2-4a(c+1)=0\\)\n\n인데, 두 식을 빼면 \\(8a=0\\)이 되어 \\(a>0\\)과 모순이에요. 또 \\(f+x\\) 쪽에서 \\(c=-1\\)을 택하고 \\(f-x\\) 쪽 판별식을 \\(0\\)으로 두면 \\(b^2+8a=0\\)이 되는데 \\(a>0\\)이라 불가능해요. \\(c=1\\)과 \\(c=-1\\)을 동시에 택할 수도 없어요. 결국 \\(f-x\\)에서는 \\(c=1\\), \\(f+x\\)에서는 판별식 \\(0\\)을 택해야 하므로 \\(c=1,\\ b^2=8a\\)가 남아요. 미분 조건은 \\(3a+2b=0\\)이 돼요.","check":{"prompt":"두 판별식을 동시에 \\(0\\)으로 둘 수 없는 가장 짧은 근거는 무엇인가요?","answer":"두 등식의 차가 \\(8a=0\\)을 주지만 최고차항의 계수는 \\(a>0\\)이기 때문이에요."}},{"id":"c4","label":"계수를 구하고 근의 개수를 되짚어요","stepIds":["s9","s10","s11","s12"],"question":"구한 계수는 원래 두 방정식에서 정말 서로 다른 근을 두 개씩 만들까요?","hint":"마지막에는 \\(f-x\\)와 \\(f+x\\)를 다시 인수분해해요.","explanation":"\\(3a+2b=0\\)에서 \\(b=-3a/2\\)예요. 이를 \\(b^2=8a\\)에 넣으면 \\(9a^2/4=8a\\)이고, \\(a>0\\)이므로 \\(a=32/9,\\ b=-16/3\\)이에요. 따라서\n\n\\(f(x)=\\dfrac{32}{9}x^3-\\dfrac{16}{3}x^2+x\\)\n\n이에요. 실제로 \\(f-x=16x^2(2x-3)/9\\)라 서로 다른 근은 \\(0,3/2\\)이고, \\(f+x=2x(4x-3)^2/9\\)라 서로 다른 근은 \\(0,3/4\\)예요. 두 조건과 \\(f'(1)=1\\)을 모두 다시 만족해요. 마지막으로 \\(f(3)=96-48+3=51\\)이에요.","check":{"prompt":"최종 두 방정식의 서로 다른 실근을 각각 말해 보세요.","answer":"\\(f-x=0\\)은 \\(0,3/2\\), \\(f+x=0\\)은 \\(0,3/4\\)로 각각 두 개예요."}}],"takeaway":["이미 알고 있는 근을 먼저 인수로 꺼내면 서로 다른 근의 개수 조건을 이차식에 옮길 수 있어요.","서로 다른 근의 개수는 겹치는 근과 새 중근의 위치를 따로 확인해요.","경우를 고른 뒤에는 최종 인수분해로 원래 근의 개수를 반드시 되짚어요."]};</script>
