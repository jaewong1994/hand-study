/span>과 호 \u003cspan class=\"heq\">\\({ E}_{1}{ C}_{1}\\)\u003c/span>로 둘러싸인 부분에 색칠하여 얻은 그림을 \u003cspan class=\"heq\">\\(R_{1}\\)\u003c/span>이라 하자. 그림 \u003cspan class=\"heq\">\\(R_{1}\\)\u003c/span>에서 정사각형 \u003cspan class=\"heq\">\\({ A}_{1}{B}_{1}{ C}_{1}{D}_{1}\\)\u003c/span>에 중심이 \u003cspan class=\"heq\">\\({A}_{1}\\)\u003c/span>이고 중심각의 크기가 \u003cspan class=\"heq\">\\(90°\\)\u003c/span>인 부채꼴 \u003cspan class=\"heq\">\\({A}_{1}{B}_{1}{D}_{1}\\)\u003c/span>을 그린다. 선분 \u003cspan class=\"heq\">\\({A}_{1}{D}_{1}\\)\u003c/span>을 \u003cspan class=\"heq\">\\(3 \\,:\\, 2\\)\u003c/span>로 내분하는 점을 \u003cspan class=\"heq\">\\({A}_{2}\\)\u003c/span>, 점 \u003cspan class=\"heq\">\\({A}_{2}\\)\u003c/span>를 지나고 선분 \u003cspan class=\"heq\">\\({A}_{1}{B}_{1}\\)\u003c/span>에 평행한 직선이 호 \u003cspan class=\"heq\">\\({B}_{1}{D}_{1}\\)\u003c/span>과 만나는 점을 \u003cspan class=\"heq\">\\({B}_{2}\\)\u003c/span>라 하자. 선분 \u003cspan class=\"heq\">\\({A}_{2}{B}_{2}\\)\u003c/span>를 한 변으로 하고 선분 \u003cspan class=\"heq\">\\({ D}_{1}{ C}_{1}\\)\u003c/span>과 만나도록 정사각형 \u003cspan class=\"heq\">\\({ A}_{2}{B}_{2}{ C}_{2}{D}_{2}\\)\u003c/span>를 그린 후, 그림 \u003cspan class=\"heq\">\\(R_{1}\\)\u003c/span>을 얻은 것과 같은 방법으로 정사각형 \u003cspan class=\"heq\">\\({ A}_{2}{B}_{2}{ C}_{2}{D}_{2}\\)\u003c/span>에 같은 모양의 도형을 그리고 색칠하여 얻은 그림을 \u003cspan class=\"heq\">\\(R_{2}\\)\u003c/span>라 하자. 이와 같은 과정을 계속하여 \u003cspan class=\"heq\">\\(n\\)\u003c/span>번째 얻은 그림 \u003cspan class=\"heq\">\\(R_{n}\\)\u003c/span>에 색칠되어 있는 부분의 넓이를 \u003cspan class=\"heq\">\\(S_{n}\\)\u003c/span>이라 할 때, \u003cspan class=\"heq\">\\(\\lim_{n \\,\\to\\, \\infty }\\,S_{n}\\)\u003c/span>의 값은? [4점]\u003c/p>\u003cfigure>\u003cimg class=\"hfig\" src=\"../assets/csat/24689-d9d8e1d161019327.png\" alt=\"2019년 시행 수능 18번 문항 그림 첫 번째 도형\" style=\"max-width:100%;width:420px\">\u003cfigcaption>첫 번째 도형\u003c/figcaption>\u003c/figure>\u003cfigure>\u003cimg class=\"hfig\" src=\"../assets/csat/24689-f25cae60d0d45942.png\" alt=\"2019년 시행 수능 18번 문항 그림 두 번째 도형\" style=\"max-width:100%;width:420px\">\u003cfigcaption>두 번째 도형\u003c/figcaption>\u003c/figure>\u003cdiv class=\"hchoices\">\u003cdiv class=\"hch\">① \u003cspan class=\"heq\">\\(\\frac{50}{3} \\left(3-\\sqrt{3}+ \\frac{\\pi}{6} \\right)\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">② \u003cspan class=\"heq\">\\(\\frac{100}{9} \\left(3-\\sqrt{3}+ \\frac{\\pi}{3} \\right)\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">③ \u003cspan class=\"heq\">\\(\\frac{50}{3} \\left(2-\\sqrt{3}+ \\frac{\\pi}{3} \\right)\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">④ \u003cspan class=\"heq\">\\(\\frac{100}{9} \\left(3-\\sqrt{3}+ \\frac{\\pi}{6} \\right)\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">⑤ \u003cspan class=\"heq\">\\(\\frac{100}{9} \\left(2-\\sqrt{3}+ \\frac{\\pi}{3} \\right)\\)\u003c/span>\u003c/div>\u003c/div>","questionText":"그림과 같이 한 변의 길이가 $5$인 정사각형 ${A B C D}$에 중심이 ${A}$이고 중심각의 크기가 $90°$인 부채꼴 ${A B D}$를 그린다. 선분 ${A D}$를 $3 \\,:\\, 2$로 내분하는 점을 ${A}_{1}$, 점 ${A}_{1}$을 지나고 선분 ${A B}$에 평행한 직선이 호 ${B D}$ 와 만나는 점을 ${B}_{1}$이라 하자. 선분 ${A}_{1}{B}_{1}$을 한 변으로 하고 선분 ${D C}$와 만나도록 정사각형 ${ A}_{1}{B}_{1}{ C}_{1}{D}_{1}$을 그린 후, 중심이 ${D}_{1}$이고 중심각의 크기가 $90°$인 부채꼴 ${ D}_{1}{A}_{1}{ C}_{1}$을 그린다. 선분 ${D C}$가 호 ${ A}_{1}{ C}_{1}$, 선분 ${ B}_{1}{ C}_{1}$과 만나는 점을 각각 ${E}_{1}$, ${F\\,}_{1}$이라 하고, 두 선분 ${D A}_{1}$, ${D E}_{1}$과 호 ${A}_{1}{E}_{1}$로 둘러싸인 부분과 두 선분 ${E}_{1}{F\\,}_{1}$, ${ F\\,}_{1}{ C}_{1}$과 호 ${ E}_{1}{ C}_{1}$로 둘러싸인 부분인 모양의 도형에 색칠하여 얻은 그림을 $R_{1}$이라 하자. 그림 $R_{1}$에서 정사각형 ${ A}_{1}{B}_{1}{ C}_{1}{D}_{1}$에 중심이 ${A}_{1}$이고 중심각의 크기가 $90°$인 부채꼴 ${A}_{1}{B}_{1}{D}_{1}$을 그린다. 선분 ${A}_{1}{D}_{1}$을 $3 \\,:\\, 2$로 내분하는 점을 ${A}_{2}$, 점 ${A}_{2}$를 지나고 선분 ${A}_{1}{B}_{1}$에 평행한 직선이 호 ${B}_{1}{D}_{1}$과 만나는 점을 ${B}_{2}$라 하자. 선분 ${A}_{2}{B}_{2}$를 한 변으로 하고 선분 ${ D}_{1}{ C}_{1}$과 만나도록 정사각형 ${ A}_{2}{B}_{2}{ C}_{2}{D}_{2}$를 그린 후, 그림 $R_{1}$을 얻은 것과 같은 방법으로 정사각형 ${ A}_{2}{B}_{2}{ C}_{2}{D}_{2}$에 모양의 도형을 그리고 색칠하여 얻은 그림을 $R_{2}$라 하자. 이와 같은 과정을 계속하여 $n$번째 얻은 그림 $R_{n}$에 색칠되어 있는 부분의 넓이를 $S_{n}$이라 할 때, $\\lim_{n \\,->\\, \\infty }\\,S_{n}$의 값은? [4점]\n① $\\frac{50}{3} \\left(3-\\sqrt{3}+ \\frac{\\pi}{6} \\right)$ ② $\\frac{100}{9} \\left(3-\\sqrt{3}+ \\frac{\\pi}{3} \\right)$\n③ $\\frac{50}{3} \\left(2-\\sqrt{3}+ \\frac{\\pi}{3} \\right)$ ④ $\\frac{100}{9} \\left(3-\\sqrt{3}+ \\frac{\\pi}{6} \\right)$\n⑤ $\\frac{100}{9} \\left(2-\\sqrt{3}+ \\frac{\\pi}{3} \\right)$","sourceHash":"5121287922c63f9c2bedbf4531a74b5f59cc5c319e1f63ffe6bc90c139822b3e","sourceKind":"csat","sourceLabel":"2019년 시행 수능 · 2020학년도 · 나형 · 18번","steps":[{"id":"s1","latex":"\\mathrm{AA}_1=3,\\quad\\mathrm{AB}_1=5\\ \\Rightarrow\\ \\mathrm A_1\\mathrm B_1=4"},{"id":"s2","latex":"\\mathrm D_1\\mathrm D=2,\\quad\\mathrm D_1\\mathrm E_1=4\\ \\Rightarrow\\ \\angle\\mathrm{DD}_1\\mathrm E_1=\\frac\\pi3"},{"id":"s3","latex":"\\mathrm{DE}_1=\\sqrt{4^2-2^2}=2\\sqrt3,\\quad\\angle\\mathrm C_1\\mathrm D_1\\mathrm E_1=\\frac\\pi6"},{"id":"s4","latex":"\\text{첫 색칠 부분}=\\frac12\\cdot4^2\\cdot\\frac\\pi3-\\frac12\\cdot2\\cdot2\\sqrt3=\\frac{8\\pi}3-2\\sqrt3"},{"id":"s5","latex":"\\text{둘째 색칠 부분}=4\\cdot2-\\frac12\\cdot2\\cdot2\\sqrt3-\\frac12\\cdot4^2\\cdot\\frac\\pi6=8-2\\sqrt3-\\frac{4\\pi}3"},{"id":"s6","latex":"S_1=8-4\\sqrt3+\\frac{4\\pi}3"},{"id":"s7","latex":"\\text{다음 정사각형의 길이비}=\\frac45\\ \\Rightarrow\\ \\text{새 색칠 넓이의 비}=\\frac{16}{25}"},{"id":"s8","latex":"\\lim_{n\\to\\infty}S_n=\\frac{8-4\\sqrt3+4\\pi/3}{1-16/25}=\\boxed{\\frac{100}9\\left(2-\\sqrt3+\\frac\\pi3\\right)}\\quad\\text{⑤}"}],"track":"나형"};</script>
