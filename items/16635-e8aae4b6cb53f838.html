<script>window.HandStudyRecord={"itemId":16635,"sourceLabel":"2020 교육청 고3 수리가형 10월 30번","adminYear":2020,"grade":3,"month":10,"number":30,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"최고차항의 계수가 $k\\,$($k>0$)인 이차함수 $f \\left( x \\right) \\,$에 대하여 $f \\left( 0 \\right) =f \\left( -2 \\right)$, $f \\left( 0 \\right) \\ne  0\\,$이다. 함수 $g \\left( x \\right) = \\left( ax+b \\right) e ^{f \\left( x \\right)} \\,$($a<0$)이 다음 조건을 만족시킨다.\n(가) 모든 실수 $x\\,$에 대하여 $\\left( x+1 \\right) \\left\\{ g \\left( x \\right) -mx-m \\right\\} \\leq 0\\,$ 을 만족시키는 실수 $m\\,$의 최솟값은 $-2\\,$이다.\n(나) $\\int _{0} ^{1} {} g \\left( x \\right) dx= \\int _{-2f \\left( 0 \\right)} ^{1} {} g \\left( x \\right) dx= \\frac{e-e ^{4}}{k}$\n$f \\left( ab \\right) \\,$의 값을 구하시오. (단, $a$, $b\\,$는 상수이다.) [4점]","answer":"25","sourceHash":"e3323e1363f5a808d18f5aae288bcb7ae5f346017ddef501e7c69ff82e6a20fd","steps":[{"id":"s1","latex":"f(x)=k(x+1)^2+c,\\quad g(x)=(ax+b)e^{f(x)}"},{"id":"s2","latex":"g(-1)=0\\Rightarrow b=a"},{"id":"s3","latex":"(x+1)^2\\{ae^{f(x)}-m\\}\\le0\\Rightarrow m\\text{의 최솟값은 }ae^c=-2"},{"id":"s4","latex":"\\int g(x)\\,dx=\\frac{a}{2k}e^{f(x)}"},{"id":"s5","latex":"\\int_{-2f(0)}^0g(x)\\,dx=0\\Rightarrow f(-2f(0))=f(0)"},{"id":"s6","latex":"f(0)\\ne0,\\ \\text{축 }x=-1\\Rightarrow-2f(0)=-2\\Rightarrow f(0)=1"},{"id":"s7","latex":"c=1-k,\\ a=b=-2e^{k-1},\\quad e^{4k}-e^k=e^4-e\\Rightarrow k=1"},{"id":"s8","latex":"k>0:\\quad\\frac d{dk}(e^{4k}-e^k)=4e^{4k}-e^k>0\\Rightarrow k=1\\text{은 유일}"},{"id":"s9","latex":"f(x)=(x+1)^2,\\quad ab=4\\Rightarrow f(ab)=25"}],"diagram":null,"contentHash":"77e71d4d2c658385c1035e3d21808b620dd4c90b26a41f2b57c72edb9a90e301","questionHtml":"<p class=\"hp\">최고차항의 계수가 <span class=\"heq\">\\(k\\,\\)<\/span>(<span class=\"heq\">\\(k\\gt 0\\)<\/span>)인 이차함수 <span class=\"heq\">\\(f \\left( x \\right) \\,\\)<\/span>에 대하여<br><span class=\"heq\">\\(f \\left( 0 \\right) =f \\left( -2 \\right)\\)<\/span>, <span class=\"heq\">\\(f \\left( 0 \\r <script>window.HandStudyGuide={"itemId":16635,"sourceHash":"e3323e1363f5a808d18f5aae288bcb7ae5f346017ddef501e7c69ff82e6a20fd","contentHash":"77e71d4d2c658385c1035e3d21808b620dd4c90b26a41f2b57c72edb9a90e301","overview":{"goal":"부등식의 최솟값 조건과 두 정적분 조건으로 \\(f,g\\)의 계수를 정해요.","firstLook":"\\(f(0)=f(-2)\\)이므로 이차함수의 축은 \\(x=-1\\)이에요. 부등식은 \\(x=-1\\)에서 인수가 겹치도록 \\(b=a\\)를 만들어요.","conditions":[{"label":"전체 실수 부등식","meaning":"\\(x=-1\\)의 양쪽에서 부호가 바뀌지 않도록 일차인수도 \\(x+1\\)을 가져야 해요."},{"label":"두 정적분","meaning":"같은 윗끝값을 가진 적분의 차가 \\(0\\)이므로 중간 구간의 적분이 \\(0\\)이에요."}]},"chapters":[{"id":"c1","label":"부등식에서 일차인수를 맞춰요","stepIds":["s1","s2","s3"],"question":"왜 \\(g(-1)=0\\)이어야 할까요?","hint":"바깥 인수 \\(x+1\\)은 -1의 양쪽에서 부호가 바뀌어요.","explanation":"\\(f(x)=k(x+1)^2+c\\)로 둘 수 있어요. 부등식이 모든 실수에서 성립하려면 \\(x=-1\\)을 지날 때 \\(g(x)-m(x+1)\\)도 0을 지나야 하므로 \\(g(-1)=0\\)이에요. \\(e^{f(-1)}>0\\)이므로 \\(-a+b=0\\), 즉 \\(b=a\\)예요. 그러면 \\(g=a(x+1)e^{f(x)}\\)이고 부등식은 \\((x+1)^2(ae^{f(x)}-m)\\le0\\)이에요. 따라서 모든 x에서 \\(m\\ge ae^{f(x)}\\)여야 해요. \\(a<0\\), \\(f(x)\\ge c\\)이므로 \\(ae^{f(x)}\\)의 가장 큰 값은 \\(ae^c\\), 주어진 최솟값에서 \\(ae^c=-2\\)예요.","check":{"prompt":"\\(a<0\\)일 때 \\(e^{f(x)}\\)가 커질수록 \\(ae^{f(x)}\\)는 어떻게 되나요?","answer":"더 작아지므로 가장 큰 값은 \\(f\\)가 가장 작은 \\(x=-1\\)에서 나와요."}},{"id":"c2","label":"적분값이 같은 이유를 미분꼴로 읽어요","stepIds":["s4","s5","s6"],"question":"\\(g\\)의 부정적분은 왜 지수함수 하나로 정리될까요?","hint":"\\(f'(x)=2k(x+1)\\)이고 \\(g=a(x+1)e^{f(x)}\\)예요.","explanation":"\\(\\frac{d}{dx}e^{f(x)}=2k(x+1)e^{f(x)}\\)이므로 \\(\\int g(x)dx=\\frac{a}{2k}e^{f(x)}\\)예요. 두 정적분의 값이 같아서 \\(\\int_{-2f(0)}^0g(x)dx=0\\)이고, \\(a\\ne0\\)이므로 \\(e^{f(0)}=e^{f(-2f(0))}\\), 곧 \\(f(-2f(0))=f(0)\\)이에요. 축이 -1인 이차함수에서 같은 함숫값을 갖는 두 x좌표의 합은 -2예요. \\(f(0)\\neq0\\)이므로 두 좌표가 같은 경우가 아니어서 \\(-2f(0)+0=-2\\), 따라서 \\(f(0)=1\\)이에요.","check":{"prompt":"\\(f(0)\\neq0\\) 조건은 어디에서 쓰이나요?","answer":"\\(-2f(0)=0\\)으로 두 입력이 같은 자명한 경우를 제외하고 대칭인 서로 다른 두 입력으로 판단할 때 써요."}},{"id":"c3","label":"지수식으로 k를 정해요","stepIds":["s7","s8"],"question":"\\(e^{4k}-e^k=e^4-e\\)의 양의 해가 왜 하나뿐일까요?","hint":"왼쪽을 \\(k\\)에 대해 미분해 증가하는지 확인해요.","explanation":"\\(f(0)=k+c=1\\)이므로 \\(c=1-k\\), 또 \\(ae^c=-2\\)에서 \\(a=b=-2e^{k-1}\\)이에요. \\(\\int_0^1g=(a/2k)(e^{f(1)}-e^{f(0)})\\)에 \\(f(1)=4k+c=1+3k\\)을 넣고 조건과 정리하면 \\(e^{4k}-e^k=e^4-e\\)예요. \\(k=1\\)이 해이고, 왼쪽의 도함수 \\(4e^{4k}-e^k=e^k(4e^{3k}-1)>0\\)이므로 \\(k>0\\)에서 계속 증가해 다른 해가 없어요.","check":{"prompt":"\\(k=1\\)을 지수식에 넣으면 양변은 무엇인가요?","answer":"양변 모두 \\(e^4-e\\)예요."}},{"id":"c4","label":"구한 계수로 요구값을 계산해요","stepIds":["s9"],"question":"\\(ab\\)와 \\(f(ab)\\)는 얼마인가요?","hint":"\\(k=1\\)이면 \\(c=0\\)이고 \\(a=b=-2\\)예요.","explanation":"\\(k=1,c=0,a=b=-2\\)이므로 \\(f(x)=(x+1)^2\\), \\(ab=4\\)예요. 따라서 \\(f(ab)=f(4)=25\\)예요.","check":{"prompt":"원래 조건 \\(f(0)=f(-2)\\)도 만족하나요?","answer":"둘 다 1이므로 만족해요."}}],"takeaway":["이차함수의 같은 함숫값을 축에 대한 대칭으로 연결해요.","일차식과 지수함수의 곱이 도함수 꼴인지 먼저 확인하면 적분이 짧아져요.","방정식의 해를 찾은 뒤 단조성을 확인해 유일성까지 증명해요."]};</script>
