<script>window.HandStudyRecord={"itemId":16507,"sourceLabel":"2019 평가원 고3 수리가형 6월 17번","adminYear":2019,"grade":3,"month":6,"number":17,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"$1$부터 $8$까지의 자연수가 하나씩 적혀 있는 $8$장의 카드가 있다. 이 카드를 모두 한 번씩 사용하여 그림과 같은 $8$개의 자리에 각각 한 장씩 임의로 놓을 때, $8$ 이하의 자연수 $k$에 대하여 $k$번째 자리에 놓인 카드에 적힌 수가 $k$ 이하인 사건을 $A_{k}$라 하자. 다음은 두 자연수 $m,\\,n\\,(1 \\leq m\u003cn \\leq 8)$에 대하여 두 사건 $A_{m}$과 $A_{n}$이 서로 독립이 되도록 하는 $m ,\\, n$의 모든 순서쌍 $(m ,\\, n)$의 개수를 구하는 과정이다. \n$A_{k}$는 $k$번째 자리에 $k$ 이하의 자연수 중 하나가 적힌 카드가 놓여있고, $k$번째 자리를 제외한 $7$개의 자리에 나머지 $7$장의 카드가 놓여 있는 사건이므로 ${ P}(A_{k})=$$box{\\,(가)\\,{}^{}{}_{}}$ 이다.$A_{m}∩A_{n}(m \u003c n)$은 $m$번째 자리에 $m$ 이하의 자연수 중 하나가 적힌 카드가 놓여 있고, $n$번째 자리에 $n$ 이하의 자연수 중 $m$번째 자리에 놓인 카드에 적힌 수가 아닌 자연수가 적힌 카드가 놓여 있고, $m$번째와 $n$번째 자리를 제외한 $6$개의 자리에 나머지 $6$장의 카드가 놓여있는 사건이므로 ${ P}(A_{m}∩A_{n})=$$box{\\,(나)\\,{}^{}{}_{}}$ 이다.한편, 두 사건 $A_{m}$과 $A_{n}$이 서로 독립이기 위해서는 ${ P}(A_{m}∩A_{n})= { P}(A_{m}){ P}(A_{n})$ 을 만족시켜야 한다.따라서 두 사건 $A_{m}$과 $A_{n}$이 서로 독립이 되도록 하는 $m ,\\, n$의 모든 순서쌍 $(m ,\\, n)$의 개수는 $box{\\,(다)\\,{}^{}{}_{}}$이다.\n위의 (가)에 알맞은 식에 $k= 4$를 대입한 값을 $p$, (나)에 알맞은 식에 $m= 3 ,\\, n= 5$를 대입한 값을 $q$, (다)에 알맞은 수를 $r$라 할 때, $p \\times q \\times r$의 값은? [4점]\n➀ $\\frac{3}{8}$ ➁ $\\frac{1}{2}$ ➂ $\\frac{5}{8}$ ➃ $\\frac{3}{4}$ ➄ $\\frac{7}{8}$","answer":"④","sourceHash":"f3875b8d23ecf8abea409d8e1a4a7cac73aa7525b5163b5f6c84a74c6eb202f4","steps":[{"id":"s1","latex":"P(A_k)=\\dfrac{k\\cdot7!}{8!}=\\dfrac{k}{8}"},{"id":"s2","latex":"P(A_m\\cap A_n)=\\dfrac{m(n-1)6!}{8!}=\\dfrac{m(n-1)}{56}\\quad(m\u003cn)"},{"id":"s3","latex":"\\dfrac{m(n-1)}{56}=\\dfrac{m}{8}\\dfrac{n}{8}\\Rightarrow8(n-1)=7n\\Rightarrow n=8"},{"id":"s4","latex":"1\\le m\u003c8\\Rightarrow r=7"},{"id":"s5","latex":"p=\\dfrac48=\\dfrac12,\\qquad q=\\dfrac{3(5-1)}{56}=\\dfrac3{14}"},{"id":"s6","latex":"pqr=\\dfrac12\\cdot\\dfrac3{14}\\cdot7=\\dfrac34"}],"diagram":null,"contentHash":"5a22ef40cc64f2b87aadd2038617cb0e0ba68c9ff7b76e128debda9da7e
