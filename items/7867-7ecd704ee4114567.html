<script>window.HandStudyGuide={"itemId":7867,"sourceHash":"213183f5add9a9224eeda3415b44e6beadaad6166a549fcba34dd691c68f3a87","contentHash":"a644b55ea96b2e02cada0ad53e29eb4402322a4af5f94f96ceb181e020b409ff","overview":{"goal":"함수와 역함수의 교점을 대칭인 두 점과 고정점으로 나누어 매개변수를 구해요.","firstLook":"\\(f(x)=g(x)\\)의 교점은 직선 \\(y=x\\)에 대해 대칭으로 짝을 이루어요.","conditions":[{"label":"세 해","meaning":"\\(-3/4,5/4\\)는 서로 값을 바꾸는 한 쌍이고 \\(t\\)는 고정점이에요."},{"label":"범위","meaning":"\\(0<t<1\\), \\(k>0\\), \\(k\\ne1\\)이에요."}]},"chapters":[{"id":"c1","label":"역함수 대칭으로 함수값을 정해요","stepIds":["s1"],"question":"세 해가 함수값 관계를 어떻게 정하나요?","hint":"그래프와 역함수 그래프는 \\(y=x\\)에 대칭이에요.","explanation":"두 그래프의 교점 중 직선 \\(y=x\\) 밖의 점은 대칭인 교점과 짝을 이뤄요. 따라서 \\(f(-3/4)=5/4\\), \\(f(5/4)=-3/4\\)이고, 사이의 해 \\(t\\)는 \\(f(t)=t\\)인 고정점이에요. 주어진 조각들이 한 함수로 일대일 대응하려면 로그의 증감 방향이 맞아 \\(0<k<1\\)인 경우가 남아요.","check":{"prompt":"\\(t\\)가 만족하는 가장 간단한 식은 무엇인가요?","answer":"\\(f(t)=t\\)예요."}},{"id":"c2","label":"대칭인 두 함수값으로 밑을 구해요","stepIds":["s2","s3","s4","s5"],"question":"두 로그식에서 \\(k\\)만 남기려면 어떻게 하나요?","hint":"두 식을 더해 로그를 하나로 합쳐요.","explanation":"두 함수값을 해당 조각에 넣으면 \\(-2\\log_k(k+7/4)+2^{-a}=5/4\\), \\(2\\log_k(9/4-k)+2^{-a}=-3/4\\)예요. 두 식의 차이와 합을 정리해 \\(k(k+7/4)(9/4-k)=1\\)을 얻어요. 분모를 없애 전개하면 \\(16k^3-8k^2-63k+16=0\\), 곧 \\((4k-1)(4k^2-k-16)=0\\)이에요. 이차인수의 양의 근은 \\(1\\)보다 크므로 \\(0<k<1\\)에서는 \\(k=1/4\\)만 가능해요.","check":{"prompt":"이차인수에서 나오는 양의 근을 제외하는 기준은 무엇인가요?","answer":"앞에서 확인한 \\(0<k<1\\)을 만족하지 않아요."}},{"id":"c3","label":"나머지 매개변수와 고정점을 구해요","stepIds":["s6","s7","s8"],"question":"\\(a\\)와 \\(t\\)는 얼마인가요?","hint":"\\(k=1/4\\)를 함수값 식과 고정점 식에 차례로 넣어요.","explanation":"\\(k=1/4\\)를 앞의 함수값 식에 넣으면 \\(2^{-a}=1/4\\)이어서 \\(a=2\\)예요. 또 경계점 \\(x=k=1/4\\)에서 로그 안은 \\(1\\)이므로 \\(f(1/4)=2^{-a}=1/4\\)예요. 따라서 \\(0<t<1\\)인 고정점은 \\(t=1/4\\)이고, \\(30(a+k+t)=30(2+1/4+1/4)=75\\)예요.","check":{"prompt":"\\(t=1/4\\)가 범위 조건을 만족하나요?","answer":"\\(0<1/4<1\\)이므로 만족해요."}}],"takeaway":["함수와 역함수의 교점은 대칭쌍과 고정점으로 나누어 봐요.","로그식 여러 개에서는 상수항을 없애 밑에 관한 방정식을 만들어요.","방정식의 근은 로그 밑
