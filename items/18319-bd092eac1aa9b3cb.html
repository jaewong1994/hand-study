<script>window.HandStudyGuide={"itemId":18319,"sourceHash":"15219e891bbfa9fc5685ff5ddc9e9325a1e26329e6845863f174b8e490a33c3e","contentHash":"99faa8c79a9acd850699390a78392207f02f3f5065210bcae2bdb1f02f79fd70","overview":{"goal":"두 절댓값 극한이 모든 점에서 존재하도록 하는 사차함수 \\(g\\)를 정해요.","firstLook":"\\(f\\)의 부호가 바뀌는 \\(x=1,2\\)에서 첫 극한이 끊기지 않으려면 \\(g\\)가 두 점에서 \\(0\\)이어야 해요.","conditions":[{"label":"첫 번째 극한","meaning":"\\(|f(x)|/f(x)\\)의 부호 변화가 \\(g(x)\\)와 곱해져 사라져야 해요."},{"label":"두 번째 극한","meaning":"\\(x=1,2\\)에서 남은 부호 변화까지 없어지도록 이차식 \\(Q\\)의 값을 정해요."}]},"chapters":[{"id":"c1","label":"부호가 바뀌는 두 점을 잡아요","stepIds":["s1","s2","s3"],"question":"첫 극한으로부터 왜 \\(g(1)=g(2)=0\\)인가요?","hint":"\\(f(x)\\)는 \\(1,2\\)에서 부호가 바뀌고 \\(|f(x)|/f(x)\\)는 좌우에서 값이 달라져요.","explanation":"\\(f(x)=(x-1)(x-2)\\)이므로 \\(x=1,2\\)를 지날 때 \\(|f(x)|/f(x)\\)는 \\(1\\)과 \\(-1\\) 사이에서 바뀌어요. \\(g(a)|f(x)|/f(x)\\)의 좌우 극한이 같으려면 \\(a=1,2\\)에서 \\(g(a)=0\\)이어야 해요. 따라서 \\(g(x)=f(x)Q(x)\\)로 둘 수 있고, \\(g\\)가 최고차항 계수 \\(1\\)의 사차식이므로 \\(Q\\)는 최고차항 계수 \\(1\\)의 이차식이에요.","check":{"prompt":"\\(g(1)\\ne0\\)이면 첫 식의 좌극한과 우극한은 어떻게 되나요?","answer":"\\(|f|/f\\)의 부호가 바뀌므로 두 극한은 서로 부호가 반대가 되어 같을 수 없어요."}},{"id":"c2","label":"두 번째 극한으로 이차식을 정해요","stepIds":["s4","s5","s6"],"question":"왜 \\(Q(1)=Q(2)=1\\)이어야 할까요?","hint":"\\(|g-f|/g\\)에 \\(g=fQ\\)를 넣고 \\(x=1,2\\)의 좌우 부호를 비교해요.","explanation":"\\(g=fQ\\)를 넣으면 \\(|g-f|/g=(|f|/f)\\cdot |Q-1|/Q\\)예요. \\(x=1,2\\)에서 첫 인수의 부호가 바뀌므로 전체 극한이 존재하려면 둘째 인수가 \\(0\\)으로 가야 해요. 따라서 \\(Q(1)=Q(2)=1\\)이에요.\n\n\\(Q(x)-1\\)은 최고차항 계수 \\(1\\)의 이차식이고 \\(1,2\\)를 근으로 가지므로 \\(Q(x)-1=(x-1)(x-2)\\), 즉 \\(Q(x)=x^2-3x+3\\)이에요. 이 이차식의 판별식은 \\(9-12=-3<0\\)이라 실근이 없으므로 \\(g\\)의 분모 때문에 다른 점에서 극한이 깨지지도 않아요.","check":{"prompt":"\\(Q\\)가 다른 실근을 가지지 않는지 왜 확인해야 하나요?","answer":"\\(g=fQ\\)가 \\(f\\ne0\\)인 곳에서 \\(0\\)이 되면 둘째 식의 분모만 \\(0\\)이 되어 극한이 존재하지 않을 수 있기 때문이에요."}},{"id":"c3","label":"확정한 식에 값을 넣어요","stepIds":["s7"],"question":"\\(g(-1)\\)은 얼마인가요?","hint":"\\(f(-1)\\)과 \\(Q(-1)\\)을 따로 계산해요.","explanation":"\\(f(-1)=(-2)(-3)=6\\), \\(Q(-1)=1+3+3=7\\)이므로 \\(g(-1)=f(-1)Q(-1)=6\\cdot7=42\\)예요.","check":{"prompt":"마지막 값이 원래 차수와 최고차항 계수 조건에도 맞나요?","answer":"\\(f\\)와 \\(Q\\)가 각각 최고차항 계수 \\(1\\)인 이차식이므로 곱 \\(g\\)는 최고차항 계수 \\(1\\)인 사차식이에요."}}],"takeaway":["절댓값을 원래 식으로 나눈 값은 영점을 지날 때 부호가 바뀌므로 곱해진 함수가 그 점에서 \\(0\\)인지 확인해요.","좌우 부호 변화를 없애려면 남은 인수의 값이 \\(0\\)으로 가야 해요.","분모에 들어가는 다항식은 새 영점을 만들지 않는지도 확인해요."]};</script>
