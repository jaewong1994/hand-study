<script>window.HandStudyGuide={"itemId":7768,"sourceHash":"a795a6df492fc41e00cc86a3c760fe9606766b836eaef068ec39e81be13340bc","contentHash":"9a627a195a5c2dc415fbfe6a6c0f4c2d0421e9790a9276f8a226998151258fee","overview":{"goal":"p,q의 홀짝에 따라 2와 3의 지수를 합하고, 두 소수의 지수가 모두 정수가 되는 순서쌍을 세어요.","firstLook":"네제곱근을 소수의 거듭제곱으로 풀면 자연수 조건은 2와 3의 지수가 각각 정수인지로 바뀌어요.","conditions":[{"label":"홀수 입력","meaning":"\\(n\\)이 홀수이면 \\(f(n)=3^{1/2}2^{(n+1)/4}\\)예요."},{"label":"짝수 입력","meaning":"\\(n\\)이 짝수이면 \\(f(n)=2^{1/2}3^{n/4}\\)예요."},{"label":"순서쌍","meaning":"\\(p,q\\le10\\)이고 \\((p,q)\\)와 \\((q,p)\\)는 서로 다르게 세어요."}]},"chapters":[{"id":"c1","label":"홀수와 짝수 입력의 거듭제곱 꼴을 만들어요","stepIds":["s1","s2"],"question":"두 정의식은 2와 3의 지수로 어떻게 바뀌나요?","hint":"네제곱근은 각 소수의 지수를 4로 나누어요.","explanation":"홀수 \\(n\\)에서는 \\(\\sqrt[4]{9\\cdot2^{n+1}}=3^{1/2}2^{(n+1)/4}\\)예요. 짝수 \\(n\\)에서는 \\(\\sqrt[4]{4\\cdot3^n}=2^{1/2}3^{n/4}\\)예요. 두 값을 곱한 뒤 자연수가 되려면 남는 제곱근 없이 \\(2,3\\)의 지수가 모두 음이 아닌 정수여야 해요.","check":{"prompt":"\\(9\\)의 네제곱근이 \\(3^{1/2}\\)인 이유는 무엇인가요?","answer":"\\(9=3^2\\)이므로 \\((3^2)^{1/4}=3^{1/2}\\)이에요."}},{"id":"c2","label":"두 입력의 홀짝이 같은 경우를 세어요","stepIds":["s3"],"question":"둘 다 홀수 또는 둘 다 짝수일 때 왜 각각 13가지일까요?","hint":"1부터5까지의 보조 번호를 만들고 두 번호의 홀짝이 같은지 봐요.","explanation":"둘 다 홀수이면 곱은 \\(3\\cdot2^{(p+q+2)/4}\\)예요. 홀수 \\(n=1,3,5,7,9\\)에 번호 \\(r=(n+1)/2=1,2,3,4,5\\)를 붙이면 지수가 \\((r_p+r_q)/2\\)라 두 번호의 홀짝이 같아야 해요. 홀수 번호는 \\(3\\)개, 짝수 번호는 \\(2\\)개이므로 순서쌍은 \\(3^2+2^2=13\\)개예요.\n\n둘 다 짝수일 때도 번호 \\(s=n/2=1,\\ldots,5\\)를 쓰면 3의 지수가 \\((s_p+s_q)/2\\)이고 같은 계산으로 \\(13\\)개예요.","check":{"prompt":"같은 홀짝인 번호 순서쌍에서 순서를 구별했나요?","answer":"각 집합 안에서 \\(3^2\\), \\(2^2\\)로 세어 순서를 구별했어요."}},{"id":"c3","label":"홀짝이 다른 경우의 합동조건을 세어요","stepIds":["s4"],"question":"한 입력이 홀수이고 다른 입력이 짝수이면 어떤 나머지 조건이 필요한가요?","hint":"제곱근으로 남은 2와 3의 지수 1/2을 각각 합쳐요.","explanation":"\\(p\\)가 홀수, \\(q\\)가 짝수라 하면 곱은 \\(2^{(p+3)/4}3^{(q+2)/4}\\)예요. 두 지수가 정수이려면 \\(p\\equiv1\\pmod4\\), \\(q\\equiv2\\pmod4\\)여야 해요.\n\n홀수 후보는 \\(1,5,9\\)의 \\(3\\)개, 짝수 후보는 \\(2,6,10\\)의 \\(3\\)개라 이 방향은 \\(9\\)가지예요. 홀짝의 자리를 바꾼 방향도 \\(9\\)가지여서 모두 \\(18\\)가지예요.","check":{"prompt":"홀수 후보 \\(3,7\\)이 제외되는 이유는 무엇인가요?","answer":"\\(4\\)로 나눈 나머지가 \\(3\\)이라 \\((p+3)/4\\)가 정수가 아니기 때문이에요."}},{"id":"c4","label":"세 경우를 더해요","stepIds":["s5"],"question":"전체 순서쌍과 정답 선택지는 무엇인가요?","hint":"같은 홀짝 두 경우와 다른 홀짝 경우는 서로 겹치지 않아요.","explanation":"전체는 \\(13+13+18=44\\)가지이므로 정답은 ⑤예요.","check":{"prompt":"세 경우가 모든 순서쌍을 포함하나요?","answer":"두 수는 둘 다 홀수, 둘 다 짝수, 서로 다른 홀짝 중 정확히 하나에 속해요."}}],"takeaway":["근호가 있는 곱이 자연수인지 볼 때 소인수별 지수가 정수인지 따로 확인해요.","입력의 홀짝이 같을 때는 보조 번호의 홀짝 조건으로 바꿔 셀 수 있어요.","순서쌍에서는 홀짝 위치가 바뀐 경우를 별도로 포함해요."]};</script>
