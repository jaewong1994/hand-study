<script>window.HandStudyRecord={"itemId":11659,"sourceLabel":"2020 교육청 고1 수학 11월 30번","adminYear":2020,"grade":1,"month":11,"number":30,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"두 정수 $m,\\,n$에 대하여 이차함수 $f(x)$와 일차함수 $g(x)$가 다음 조건을 만족시킨다.\n(가) 함수 $f(x)$의 최댓값은 $0$이다.\n(나) 함수 $y=f(x)$의 그래프와 함수 $y=g(x)$의 그래프는 두 점 $(m,\\,0)$, $(m+4,\\,32n)$에서 만난다.\n(다) $0{\\leq}a{\\leq}4$인 정수 $a$에 대하여 정수 $b$가 부등식 $g(m+a){\\leq}b{\\leq}f(m+a)$를 만족시킬 때, $a,\\,b$의 모든 순서쌍 $(a,\\,b)$의 개수는 $45$이다.\n방정식 $\\left\\{ f(x) \\right\\} ^{2} - \\left\\{ g(x) \\right\\} ^{2} =0$을 만족시키는 실근 중 최댓값과 최솟값의 합이 $8$일 때, $f(5) \\times g(5)$의 값을 구하시오. [4점]","answer":"64","sourceHash":"af1d3bed38d18678553c5fa0ef61894476e02ea1990cd2ca642c9f4d128c645c","steps":[{"id":"s1","latex":"f(m)=0=\\max f\\Rightarrow f(x)=2n(x-m)^2,\\quad g(x)=8n(x-m),\\quad n\u003c0"},{"id":"s2","latex":"f(m+a)-g(m+a)=2na(a-4)\\in\\mathbb Z_{\\ge0}"},{"id":"s3","latex":"\\sum_{a=0}^{4}\\{f(m+a)-g(m+a)+1\\}=2n(-10)+5=45\\Rightarrow n=-2"},{"id":"s4","latex":"f^2-g^2=(f-g)(f+g)"},{"id":"s5","latex":"f-g=2n(x-m)(x-m-4),\\quad f+g=2n(x-m)(x-m+4)"},{"id":"s6","latex":"\\{\\text{실근}\\}=\\{m-4,m,m+4\\},\\quad(m-4)+(m+4)=8\\Rightarrow m=4"},{"id":"s7","latex":"f(5)=-4,\\quad g(5)=-16\\Rightarrow f(5)g(5)=64"}],"diagram":null,"contentHash":"6bde84c1a8601e82b90d9e330b8c51b0a7dc08357a253d6cc6ee61a6601058c2","questionHtml":"\u003cp class=\"hp\">두 정수 \u003cspan class=\"heq\">\\(m,\\,n\\)\u003c/span>에 대하여 이차함수 \u003cspan class=\"heq\">\\(f(x)\\)\u003c/span>와 일차함수 \u003cspan class=\"heq\">\\(g(x)\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cp class=\"hp\">\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) 함수 \u003cspan class=\"heq\">\\(f(x)\\)\u003c/span>의 최댓값은 \u003cspan class=\"heq\">\\(0\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp\">(나) 함수 \u003cspan class=\"heq\">\\(y=f(x)\\)\u003c/span>의 그래프와 함수 \u003cspan class=\"heq\">\\(y=g(x)\\)\u003c/span>의 그래프는\u003cbr>두 점 \u003cspan class=\"heq\">\\((m,\\,0)\\)\u003c/span>, \u003c
