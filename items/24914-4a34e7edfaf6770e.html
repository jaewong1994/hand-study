<script>window.HandStudyRecord={"adminYear":2024,"answer":"②","contentHash":"63595dba9838b776e5d8b5953e1c65751cd2d1bcbbe5d8126144a74d323d76ee","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24914,"month":11,"number":15,"points":4,"preview":false,"questionHtml":"\u003cp>상수 \u003cspan class=\"heq\">\\(a \\, \\left( a \\ne  3 \\sqrt{5} \\right)\\,\\)\u003c/span>와 최고차항의 계수가 음수인 이차함수 \u003cspan class=\"heq\">\\(f \\left(x \\right)\\,\\)\u003c/span>에 대하여 함수\u003c/p>\u003cp> \u003cspan class=\"heq\">\\(g \\left( x \\right) = {\\begin{cases}\\,x ^{3} +ax ^{2} +15x+7&amp;&amp;\\left( x \\leq 0 \\right) \\\\ \\,f \\left( x \\right)&amp;&amp;\\left( x&gt;0 \\right)\\end{cases}}\\)\u003c/span>\u003c/p>\u003cp>이 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox hcond\">\u003cp class=\"hcondr\">(가) 함수 \u003cspan class=\"heq\">\\(g \\left(x \\right)\\,\\)\u003c/span>는 실수 전체의 집합에서 미분가능하다.\u003c/p>\u003cp class=\"hcondr\">(나) \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>에 대한 방정식 \u003cspan class=\"heq\">\\(g &#x27; \\left( x \\right) \\times g &#x27; \\left( x-4 \\right) =0\\,\\)\u003c/span>의 서로 다른 실근의 개수는 \u003cspan class=\"heq\">\\(4\\,\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp>\u003cspan class=\"heq\">\\(g \\left(-2 \\right)+g \\left(2 \\right)\\,\\)\u003c/span>의 값은? [4점]\u003c/p>\u003cdiv class=\"hchoices\">\u003cdiv class=\"hch\">① \u003cspan class=\"heq\">\\(30\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">② \u003cspan class=\"heq\">\\(32\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">③ \u003cspan class=\"heq\">\\(34\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">④ \u003cspan class=\"heq\">\\(36\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">⑤ \u003cspan class=\"heq\">\\(38\\)\u003c/span>\u003c/div>\u003c/div>","questionText":"상수 $a \\, \\left( a \\ne  3 \\sqrt{5} \\right)\\,$와 최고차항의 계수가 음수인 이차함수 $f \\left(x \\right)\\,$에 대하여 함수\n $g \\left( x \\right) = {\\begin{cases}\\,x ^{3} +ax ^{2} +15x+7&&\\left( x \\leq 0 \\right) \\\\ \\,f \\left( x \\right)&&\\left( x>0 \\right)\\end{cases}}$\n이 다음 조건을 만족시킨다.\n(가) 함수 $g \\left(x \\right)\\,$는 실수 전체의 집합에서 미분가능하다.\n(나) $x\\,$에 대한 방정식 $g \\,' \\left( x \\right) \\times g \\,' \\left( x-4 \\right) =0\\,$의 서로 다른 실근의 개수는 $4\\,$이다.\n$g \\left(-2 \\right)+g \\left(2 \\right)\\,$의 값은? [4점]\n① $30$ ② $32$ ③ $34$ ④ $36$ ⑤ $38$","sourceHash":"ad63b231999f52055d544b8793ef4bec787fc1eca9f53a70f3200a448fd9c097","sourceKind":"csat","sourceLabel":"2024년 시행 수능 · 2025학년도 · 공통 · 15번","steps":[{"id":"s1","latex":"f(x)=px^2+15x+7\\quad(p\u003c0)\\qquad\\{g(0^-)=g(0^+),\\ g\\prime(0^-)=g\\prime(0^+)\\}"},{"id":"s2","latex":"g\\prime(x)=\\begin{cases}3x^2+2ax+15&(x\\le0)\\\\2px+15&(x>0)\\end{cases}"},{"id":"s3","latex":"x>0:\\quad g\\prime(x)=0\\ \\Rightarrow\\ x=\\beta=-\\frac{15}{2p}>0"},{"id":"s4","latex":"a\\ne3\\sqrt5\\quad\\Rightarrow\\quad\\text{음의 근은 0개 또는 서로 다른 2개}"},{"id":"s5","latex":"\\text{근이 }\\beta\\text{뿐이면 곱의 근은 }\\beta,\\beta+4\\text{뿐}\\quad\\Rightarrow\\quad a>3\\sqrt5"},{"id":"s6","latex":"\\alpha_1\u003c\\alpha_2\u003c0\u003c\\beta,\\quad\\alpha_1\\alpha_2=5,\\quad\\alpha_1+\\alpha_2=-\\frac{2a}{3}"},{"id":"s7","latex":"\\text{곱의 근: }\\alpha_1,\\alpha_2,\\beta,\\alpha_1+4,\\alpha_2+4,\\beta+4"},{"id":"s8","latex":"\\text{서로 다른 근 4개}\\quad\\Rightarrow\\quad\\alpha_2=\\alpha_1+4,\\quad\\beta=\\alpha_2+4"},{"id":"s9","latex":"\\alpha_1(\\alpha_1+4)=5,\\quad\\alpha_1\u003c0\\quad\\Rightarrow\\quad\\alpha_1=-5,\\ \\alpha_2=-1,\\ \\beta=3"},{"id":"s10","latex":"a=9,\\quad p=-\\frac52"},{"id":"s11","latex":"g(-2)=5,\\quad g(2)=27\\quad\\Rightarrow\\quad g(-2)+g(2)=32\\quad\\therefore\\text{②}"}],"track":"공통"};</script>
<script>window.HandStudyGuide={"itemId":24914,"sourceHash":"ad63b231999f52055d544b8793ef4bec787fc1eca9f53a70f3200a448fd9c097","contentHash":"63595dba9838b776e5d8b5953e1c65751cd2d1bcbbe5d8126144a74d323d76ee","overview":{"goal":"도함수가 0이 되는 위치를 찾고, 4만큼 옮긴 위치와 겹치는 조건으로 \\(g(-2)+g(2)\\)를 구해요.","firstLook":"곱을 전개하기 전에 \\(g^{\\prime}(x)=0\\)의 근부터 보세요. \\(g^{\\prime}(x-4)=0\\)의 근은 그 위치에서 오른쪽으로 4만큼 옮겨져요.","conditions":[{"label":"실수 전체에서 미분가능","meaning":"두 식이 만나는 \\(x=0\\)에서 함숫값과 미분계수가 같아야 해요. 이 조건으로 이차함수의 상수항과 일차항이 정해져요."},{"label":"이차함수의 최고차항 계수가 음수","meaning":"\\(x>0\\)에서 도함수는 감소하는 일차식이에요. \\(g^{\\prime}(0)=15\\)이므로 양수인 근이 하나 생겨요."},{"label":"곱으로 된 방정식의 서로 다른 실근 4개","meaning":"두 도함수 중 하나가 0인 위치를 모두 세되, 두 식에서 함께 나오는 위치는 한 번만 세어요."},{"label":"\\(a\\ne3\\sqrt5\\)","meaning":"음수 쪽 도함수가 음의 중근 하나를 갖는 경우를 제외해요."}]},"chapters":[{"id":"c1","label":"경계에서 이차함수 정하기","stepIds":["s1","s2","s3"],"question":"\\(f(x)\\)의 세 계수 중 무엇을 바로 정할 수 있을까요?","hint":"왼쪽 식에 0을 대입한 값과, 왼쪽 식을 미분해 0을 대입한 값을 각각 확인해 보세요.","explanation":"\\(g(0)=7\\), \\(g^{\\prime}(0)=15\\)가 오른쪽 식에도 이어져야 해요. 그래서 \\(f(x)=px^2+15x+7\\), \\(p<0\\)로 놓을 수 있어요. 양수 쪽에서는 \\(2px+15=0\\)을 풀어 양의 근 \\(\\beta\\) 하나를 얻어요.","check":{"prompt":"\\(x=0\\)도 도함수가 0인 점인가요?","answer":"아니요. \\(g^{\\prime}(0)=15\\)이므로 근으로 세지 않아요."}},{"id":"c2","label":"음수 쪽 근이 필요한 이유","stepIds":["s4","s5","s6"],"question":"도함수의 근이 양수인 \\(\\beta\\) 하나뿐이면 조건을 만족할까요?","hint":"그 경우 원래 근과 4만큼 옮긴 근을 각각 적어 보세요.","explanation":"근이 \\(\\beta\\)뿐이면 곱으로 된 방정식의 근도 \\(\\beta,\\beta+4\\) 두 개뿐이에요. 따라서 음수 쪽에도 근이 있어야 해요. 이차방정식 \\(3x^2+2ax+15=0\\)의 두 근의 곱은 5라서 두 근의 부호는 같아요. 음의 중근은 주어진 조건으로 제외되므로 서로 다른 음의 근 \\(\\alpha_1,\\alpha_2\\)가 필요하고, 이때 \\(a>3\\sqrt5\\)예요.","check":{"prompt":"음의 근이 하나만 남는 경우를 왜 따로 다루지 않나요?","answer":"두 근의 곱이 양수여서 서로 다른 실근이면 부호가 같아요. 음의 중근 하나인 경우는 \\(a=3\\sqrt5\\)일 때인데 문제에서 제외했어요."}},{"id":"c3","label":"여섯 위치가 네 위치가 되려면","stepIds":["s7","s8"],"question":"원래 근 세 개와 옮긴 근 세 개 사이에서 어디가 겹쳐야 할까요?","hint":"원래 근을 작은 순서대로 적으세요. 옮긴 가장 큰 근은 원래 세 근보다 크고, 원래 가장 작은 근은 옮긴 세 근보다 작아요.","explanation":"각각의 세 근 안에는 중복이 없어요. 여섯 후보가 서로 다른 네 근이 되려면 두 위치가 겹쳐야 해요. 겹침은 작은 원래 근에 4를 더한 값이 더 큰 원래 근과 같을 때만 생겨요. 원래 근 세 개로 이런 겹침을 두 번 만들려면 세 근이 차례로 4씩 떨어져 있어야 해요. 따라서 \\(\\alpha_2=\\alpha_1+4\\), \\(\\beta=\\alpha_2+4\\)예요.","check":{"prompt":"\\(\\alpha_1+4=\\beta\\)만 성립한다면 서로 다른 근은 몇 개인가요?","answer":"다른 겹침이 없다면 여섯 후보 중 한 쌍만 같으므로 다섯 개예요. 문제의 네 개 조건에는 겹침이 하나 더 필요해요."}},{"id":"c4","label":"계수와 요구값 확인하기","stepIds":["s9","s10","s11"],"question":"근 사이의 간격을 알았으니 어떤 관계식으로 실제 근을 구할까요?","hint":"음의 두 근의 곱이 5라는 식에 간격 4를 넣어 보세요.","explanation":"\\(\\alpha_1(\\alpha_1+4)=5\\)를 풀면 \\(\\alpha_1=-5\\) 또는 1이에요. 음의 근이므로 \\(-5\\)를 고르고, 나머지는 \\(-1,3\\)이 돼요. 근과 계수의 관계에서 \\(a=9\\), \\(p=-5/2\\)를 얻어요. 곱의 근은 \\(-5,-1,3,7\\) 네 개로 원래 조건에 맞아요. 음수인 -2에는 삼차식을, 양수인 2에는 이차식을 대입하여 5와 27을 더하면 32예요.","check":{"prompt":"\\(g(-2)\\)와 \\(g(2)\\)를 같은 식에 대입해도 되나요?","answer":"안 돼요. \\(-2\\le0\\)에는 \\(x^3+9x^2+15x+7\\), \\(2>0\\)에는 \\(-5x^2/2+15x+7\\)을 써요."}}],"takeaway":["\\(g^{\\prime}(x-c)\\)의 근은 \\(g^{\\prime}(x)\\)의 근을 오른쪽으로 \\(c\\)만큼 옮긴 위치예요.","서로 다른 근의 개수는 후보 수와 겹치는 위치를 나누어 세면 보여요."]};</script>
