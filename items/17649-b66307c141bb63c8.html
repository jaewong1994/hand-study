<script>window.HandStudyGuide={"itemId":17649,"sourceHash":"d97b78b7cb9304fc0254151a83a372dbac71228bef3792c67eecb8c8a1aeb7a9","contentHash":"c144b38c79ced02b7595b9a39abd4e6f8b59b73ce8cb114d802ab49012a12b64","overview":{"goal":"원의 좌표와 평면벡터 조건으로 \\(C,D,P,Q\\)를 차례로 정하고 마지막 내적을 계산해요.","firstLook":"\\(A=(0,0),B=(6,0)\\)로 두면 \\(\\overrightarrow{AB}\\)와의 내적은 점의 x좌표를 바로 정해요. 각 좌표에서 y의 부호는 \\(CD>3\\) 조건으로 결정해요.","conditions":[{"label":"원","meaning":"중심은 \\((3,0)\\), 반지름은 3이에요."},{"label":"서로 다른 P,Q","meaning":"Q의 내적 조건에서 P와 같은 해가 나오면 제외해야 해요."}]},"chapters":[{"id":"c1","label":"내적으로 C와 D의 위치를 정해요","stepIds":["s1","s2","s3"],"question":"두 내적 조건은 \\(C,D\\)의 x좌표를 어떻게 정할까요?","hint":"\\(\\overrightarrow{AB}=(6,0)\\)이므로 x성분만 남아요.","explanation":"\\(A=(0,0),B=(6,0)\\)로 두면 원은 \\((x-3)^2+y^2=9\\)예요. \\(\\overrightarrow{AB}\\cdot\\overrightarrow{AC}=6x_C=27\\)에서 \\(x_C=9/2\\), 원의 식에서 \\(|y_C|=3\\sqrt3/2\\)예요. 같은 방식으로 \\(6x_D=9\\)이므로 \\(x_D=3/2\\), \\(|y_D|=3\\sqrt3/2\\)예요.\n\nC와 D의 y좌표 부호가 같으면 두 점의 세로 차가 0이고 \\(CD=3\\)이에요. 조건은 \\(CD>3\\)이므로 부호가 반대여야 해요. 그림을 x축에 대하여 뒤집어도 값은 같으므로 \\(C=(9/2,3\\sqrt3/2),D=(3/2,-3\\sqrt3/2)\\)로 둘게요.","check":{"prompt":"\\(CD>3\\) 조건이 없으면 어떤 위치가 추가되나요?","answer":"C와 D가 x축의 같은 쪽에 있어 \\(CD=3\\)이 되는 배치도 가능해져요."}},{"id":"c2","label":"P를 선분 AC 위에 맞춰요","stepIds":["s4","s5"],"question":"조건 (가)로 얻은 점이 선분 \\(AC\\) 위에 있으려면 \\(k\\)는 얼마일까요?","hint":"조건 (가)를 \\(\\overrightarrow{DP}=\\frac23(\\overrightarrow{AB}+k\\overrightarrow{BC})\\)로 정리한 뒤 P의 좌표가 AC의 기울기를 따르게 해요.","explanation":"조건 (가)에서 \\(\\overrightarrow{DP}=\\frac23(\\overrightarrow{AB}+k\\overrightarrow{BC})\\)예요. 좌표를 넣으면 \\(P=(11/2-k,\\sqrt3(k-3/2))\\)예요.\n\n선분 \\(AC\\) 위의 점은 y좌표가 x좌표의 \\(\\sqrt3/3\\)배이므로 \\(3(k-3/2)=11/2-k\\)예요. 따라서 \\(k=5/2\\), \\(P=(3,\\sqrt3)\\)예요. 실제로 \\(P=(2/3)C\\)라서 A와 C 사이에 있어요.","check":{"prompt":"직선 AC 위 조건만 확인하지 않고 선분 위인지도 확인해야 하는 이유는 무엇인가요?","answer":"직선의 연장선 위 해도 같은 기울기를 만족할 수 있으므로, 여기서는 \\(P=(2/3)C\\)로 매개값이 0과 1 사이인지 확인해야 해요."}},{"id":"c3","label":"Q의 두 후보에서 P를 제외해요","stepIds":["s6"],"question":"조건 (나)를 만족하는 \\(Q\\) 중 어느 점을 골라야 할까요?","hint":"\\(Q=tC\\), \\(0<t<1\\)로 두면 두 근 중 하나는 \\(P=(2/3)C\\)예요.","explanation":"\\(Q\\)도 선분 \\(AC\\) 위이므로 \\(Q=tC\\), \\(0<t<1\\)로 둬요. \\(\\overrightarrow{QB}\\cdot\\overrightarrow{QD}=3\\)에 좌표를 넣어 정리하면 \\((3t-1)(3t-2)=0\\)이어서 \\(t=1/3\\) 또는 \\(2/3\\)예요.\n\n그런데 \\(t=2/3\\)이면 \\(Q=P\\)가 되어 P와 Q가 서로 다르다는 조건을 어겨요. 따라서 \\(Q=C/3=(3/2,\\sqrt3/2)\\)예요. 두 후보 모두 선분 안에 있지만, 서로 다름 조건이 하나를 결정해요.","check":{"prompt":"\\(t=2/3\\)을 제외하는 원래 조건은 무엇인가요?","answer":"\\(P\\)와 \\(Q\\)가 선분 \\(AC\\) 위의 서로 다른 두 점이라고 했는데 \\(P=(2/3)C\\)이므로 \\(Q\\)와 겹치기 때문이에요."}},{"id":"c4","label":"마지막 내적을 계산해요","stepIds":["s7"],"question":"\\(k(\\overrightarrow{AQ}\\cdot\\overrightarrow{DP})\\)의 값은 얼마인가요?","hint":"\\(\\overrightarrow{AQ}\\)와 \\(\\overrightarrow{DP}\\)의 좌표를 각각 구해요.","explanation":"\\(\\overrightarrow{AQ}=(3/2,\\sqrt3/2)\\)이고 \\(\\overrightarrow{DP}=P-D=(3/2,5\\sqrt3/2)\\)예요. 따라서 내적은 \\((3/2)^2+(\\sqrt3/2)(5\\sqrt3/2)=9/4+15/4=6\\)이에요. \\(k=5/2\\)이므로 구하는 값은 \\((5/2)\\times6=15\\)예요.","check":{"prompt":"x축 대칭인 배치를 택해도 마지막 내적이 같은 이유는 무엇인가요?","answer":"두 벡터의 y성분이 함께 부호가 바뀌어 y성분끼리의 곱은 그대로이고 x성분은 변하지 않기 때문이에요."}}],"takeaway":["한 벡터가 좌표축과 나란하면 내적 조건으로 다른 점의 한 좌표를 바로 정할 수 있어요.","원의 대칭 후보는 추가 거리 조건으로 실제 위아래 위치를 골라요.","선분 위 두 점이 서로 다르다는 조건은 방정식의 겹치는 해를 제외하는 데 꼭 사용해요."]};</script>
