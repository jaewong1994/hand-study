<script>window.HandStudyGuide={"itemId":17658,"sourceHash":"32b0382747d9f2d354d01f62dd2fd081e95e275419eb4512ca74dc178b4bd6b7","contentHash":"a6ed23f3dc216838e9eb3b27cb54a123b4d7205daf58bde3753cfde9258ffec3","overview":{"goal":"원과 이등변삼각형의 길이 관계로 \\(S(\\theta )\\)를 단순화해 극한을 구해요.","firstLook":"\\(AB=AC=c\\)로 두면 \\(c\\)는 \\(\\theta\\)에 따라 달라지지만 \\(c^2(1-\\cos \\theta )\\)는 \\(BC=2\\) 때문에 항상 2예요.","conditions":[{"label":"직각과 중점","meaning":"\\(AB\\)가 지름이므로 \\(\\angle ADB=90^\\circ\\)이고, \\(E\\)가 \\(AB\\)의 중점이어서 \\(E\\)에서 \\(AC\\)까지의 거리는 \\(BD\\)의 절반이에요."}]},"chapters":[{"id":"c1","label":"이등변삼각형에서 길이 조건 구하기","stepIds":["s1"],"question":"\\(c^2(1-\\cos \\theta )=2\\)는 어떻게 나오나요?","hint":"삼각형 \\(ABC\\)에 코사인법칙을 쓰고 \\(BC=2\\)를 대입하세요.","explanation":"\\(AB=AC=c\\)이므로 코사인법칙에서 \\(BC^2=c^2+c^2-2c^2\\cos\\theta=2c^2(1-\\cos\\theta)\\). \\(BC=2\\)를 넣으면 \\(4=2c^2(1-\\cos\\theta)\\), 따라서 \\(c^2(1-\\cos\\theta)=2\\)예요.","check":{"prompt":"\\(\\theta \\to 0\\)일 때 \\(c\\)가 커져도 계산할 수 있는 이유는 무엇인가요?","answer":"넓이에 필요한 조합 \\(c^2(1-\\cos \\theta )\\)가 항상 2로 고정되기 때문이에요."}},{"id":"c2","label":"교점의 위치와 삼각형의 넓이","stepIds":["s2","s3","s4"],"question":"\\(E\\)에서 직선 \\(AC\\)까지의 거리가 왜 \\(BD/2\\)인가요?","hint":"\\(A\\)에서 직선 \\(AC\\)까지의 거리는 0, \\(B\\)의 거리는 \\(BD\\)이고 \\(E\\)는 \\(AB\\)의 중점이라는 점을 쓰세요.","explanation":"\\(AB\\)가 원의 지름이므로 \\(\\angle ADB=90^\\circ\\). 직각삼각형 \\(ABD\\)에서 \\(BD=c\\sin\\theta\\), \\(AD=c\\cos\\theta\\)이므로 \\(DC=AC-AD=c(1-\\cos\\theta)\\)예요. \\(A\\)가 직선 \\(AC\\) 위에 있고 \\(E\\)는 \\(AB\\)의 중점이므로 \\(E\\)에서 \\(AC\\)까지의 수선거리는 \\(B\\)의 거리 \\(BD\\)의 절반이에요. 따라서 \\(S(\\theta)=\\frac12DC\\cdot\\frac12BD=\\frac14c^2(1-\\cos\\theta)\\sin\\theta=\\frac12\\sin\\theta\\)예요.","check":{"prompt":"넓이의 밑변을 \\(DC\\)로 잡았을 때 높이는 무엇인가요?","answer":"\\(E\\)에서 직선 \\(AC\\)까지의 거리이며 \\(BD/2\\)예요."}},{"id":"c3","label":"기본 극한 적용하기","stepIds":["s5","s6"],"question":"\\(S(\\theta )/\\theta\\)의 극한은 어떤 기본 극한으로 끝나나요?","hint":"\\(S(\\theta )=\\sin \\theta /2\\)를 그대로 대입하세요.","explanation":"\\(S(\\theta)/\\theta=\\frac12(\\sin\\theta/\\theta)\\)이고 \\(\\sin\\theta/\\theta\\to 1\\)이므로 극한은 1/2예요. 요구값은 \\(60\\times 1/2=30\\)예요.","check":{"prompt":"\\(\\theta\\)가 0의 오른쪽에서 가는 것이 값에 영향을 주나요?","answer":"\\(\\sin \\theta /\\theta\\)의 오른쪽 극한도 1이므로 같은 값을 얻어요."}}],"takeaway":["움직이는 길이가 발산해도 조건으로 일정한 곱을 찾으면 넓이가 단순해질 수 있어요.","원의 지름에 대한 원주각과 중점의 거리 성질을 함께 사용해요."]};</script>
