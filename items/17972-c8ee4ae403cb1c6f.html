  <script>window.HandStudyRecord={"adminYear":2024,"answer":"②","contentHash":"6b70750c9ffa6bfcef5d065385b3caa82795fc754e6aa55e84c6117f8acd7f3a","diagram":null,"editionHash":"c8ee4ae403cb1c6f442b8feb727ab0281b130dc5e405bd32bf31a6a5f78cd707","grade":3,"graphHash":"","graphPlan":null,"itemId":17972,"learningHash":"aa73f03bf51b594787706df562b1bacc6c113b355f627a287ff13aebd5882d17","month":7,"number":28,"points":4,"preview":false,"questionHtml":"\u003cp class=\"hp\">최고차항의 계수가 \u003cspan class=\"heq\">\\(1\\)\u003c/span>이고 역함수가 존재하는 삼차함수 \u003cspan class=\"heq\">\\(f \\left( x \\right)\\)\u003c/span>에 대하여 함수 \u003cspan class=\"heq\">\\(f \\left( x \\right)\\)\u003c/span>의 역함수를 \u003cspan class=\"heq\">\\(g \\left( x \\right)\\)\u003c/span>라 하자. 실수 \u003cspan class=\"heq\">\\(k \\, \\left( k\\gt 0 \\right)\\)\u003c/span>에 대하여 함수 \u003cspan class=\"heq\">\\(h \\left( x \\right)\\)\u003c/span>는\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\(h \\left( x \\right) = {\\begin{cases}\\dfrac{g \\left( x \\right) -k}{x-k}&& \\left( x  \\neq  k \\right) \\\\ \\dfrac{1}{3}&& \\left( x=k \\right)\\end{cases}}\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">이다. 함수 \u003cspan class=\"heq\">\\(h \\left( x \\right)\\)\u003c/span>가 다음 조건을 만족시키도록 하는 모든 함수 \u003cspan class=\"heq\">\\(f \\left( x \\right)\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(f' \\left( 0 \\right)\\)\u003c/span>의 값이 최대일 때, \u003cspan class=\"heq\">\\(k\\)\u003c/span>의 값을 \u003cspan class=\"heq\">\\(\\alpha\\)\u003c/span>라 하자.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) \u003cspan class=\"heq\">\\(h \\left( 0 \\right) =1\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">(나) 함수 \u003cspan class=\"heq\">\\(h \\left( x \\right)\\)\u003c/span>는 실수 전체의 집합에서 연속이다.\u003c/p>\u003c/div>\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(k= \\alpha\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(\\alpha \\times h \\left( 9 \\right) \\times g' \\left( 9 \\right)\\)\u003c/span>의 값은? \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp htall\">① \u003cspan class=\"heq\">\\(\\dfrac{1}{84}\\)\u003c/span>&emsp;② \u003cspan class=\"heq\">\\(\\dfrac{1}{42}\\)\u003c/span>&emsp;③ \u003cspan class=\"heq\">\\(\\dfrac{1}{28}\\)\u003c/span>&emsp;④ \u003cspan class=\"heq\">\\(\\dfrac{1}{21}\\)\u003c/span>&emsp;⑤ \u003cspan class=\"heq\">\\(\\dfrac{5}{84}\\)\u003c/span>\u003c/p>","questionText":"최고차항의 계수가 $1$이고 역함수가 존재하는 삼차함수 $f \\left( x \\right)$에 대하여 함수 $f \\left( x \\right)$의 역함수를 $g \\left( x \\right)$라 하자. 실수 $k \\, \\left( k>0 \\right)$에 대하여 함수 $h \\left( x \\right)$는\n $h \\left( x \\right) = {\\begin{cases}\\frac{g \\left( x \\right) -k}{x-k}&& \\left( x != k \\right) \\\\ \\frac{1}{3}&& \\left( x=k \\right)\\end{cases}}$\n이다. 함수 $h \\left( x \\right)$가 다음 조건을 만족시키도록 하는 모든 함수 $f \\left( x \\right)$에 대하여 $f ' \\left( 0 \\right)$의 값이 최대일 때, $k$의 값을 $\\alpha$라 하자.\n(가) $h \\left( 0 \\right) =1$ (나) 함수 $h \\left( x \\right)$는 실수 전체의 집합에서 연속이다.\n$k= \\alpha$일 때, $\\alpha \\times h \\left( 9 \\right) \\times g ' \\left( 9 \\right)$의 값은? [4점]\n① $\\frac{1}{84}$ ② $\\frac{1}{42}$ ③ $\\frac{1}{28}$ ④ $\\frac{1}{21}$ ⑤ $\\frac{5}{84}$\n단답형","scoreStatus":"confirmed_4_direct","sourceHash":"272b69674e4e1ed6aa871883d88ecf98d8136ae2e9cd523568f753c51f41a209","sourceLabel":"2024 교육청 고3 수학미적분 7월 28번","stepExplanations":{"s1":{"body":"\\(x\\to k\\)일 때 \\(\\frac{g(x)-k}{x-k}\\)가 유한한 값 \\(\\frac{1}{3}\\)으로 가려면 분자도 0으로 가야 하므로 \\(g(k)=k\\)예요. 그러면 이 극한은 \\(g^{\\prime}(k)=\\frac{1}{3}\\)이고, \\(f(g(x))=x\\)를 미분하면 \\(f^{\\prime}(k)g^{\\prime}(k)=1\\)이어서 \\(f^{\\prime}(k)=3\\)이에요.","skillTags":["calculus.derivative"],"title":"연속 조건을 역함수의 접선 기울기로 읽어요"},"s3":{"body":"\\(f(0)=0\\)이므로 \\(f(x)=x^3+ax^2+bx\\)로 놓아요. \\(f(k)=k\\)에서 \\(k^2+ak+b=1\\), \\(f^{\\prime}(k)=3\\)에서 \\(3k^2+2ak+b=3\\)을 얻어요. 두 식을 빼면 \\(2k^2+ak=2\\)이고 \\(k>0\\)이므로 \\(a=\\frac2k-2k\\)예요. 이를 첫 식에 넣으면 \\(b=k^2-1\\)이에요.","skillTags":["algebra.calculation"],"title":"두 조건으로 a와 b를 먼저 정리해요"},"s4":{"body":"최고차항의 계수가 양수인 삼차함수가 역함수를 가지려면 전체 구간에서 증가해야 해요. 따라서 \\(f^{\\prime}(x)=3x^2+2ax+b\\)가 모든 실수에서 0 이상이어야 하므로 \\(a^2\\le3b\\)예요. 위의 \\(a,b\\)를 넣고 양수인 \\(k^2\\)을 곱하면 \\((k^2-1)(4-k^2)\\ge0\\), 즉 \\(1\\le k\\le2\\)예요. \\(f^{\\prime}(0)=k^2-1\\)은 이 범위에서 증가하므로 \\(k=2\\)일 때 가장 커요. 이때 \\(f^{\\prime}(x)=3(x-1)^2\\)라서 한 점을 제외하고 양수이고, 실제로 역함수가 있어요.","skillTags":["reasoning.casework"],"title":"역함수가 있으려면 중간에 감소하면 안 돼요"},"s5":{"body":"\\(k=2\\)이면 \\(f(x)=(x-1)^3+1\\)이에요. \\(f(3)=9\\)이므로 \\(g(9)=3\\)이고, \\(h(9)=\\frac{3-2}{9-2}=\\frac{1}{7}\\)이에요. 또 \\(g^{\\prime}(9)=\\frac1{f^{\\prime}(3)}=\\frac{1}{12}\\)이므로 원하는 값은 \\(2\\cdot(\\frac{1}{7})\\cdot(\\frac{1}{12})=\\frac{1}{42}\\)예요.","skillTags":["algebra.calculation"],"title":"역함수의 미분에는 대응하는 x를 넣어요"}},"steps":[{"id":"s1","latex":"h\\text{는 }k\\text{에서 연속}\\Rightarrow g(k)=k,\\ g^{\\prime}(k)=1/3\\Rightarrow f(k)=k,\\ f^{\\prime}(k)=3"},{"id":"s2","latex":"h(0)=1\\Rightarrow g(0)=0\\Rightarrow f(0)=0"},{"id":"s3","latex":"f(x)=x^3+ax^2+bx,\\quad a=\\frac2k-2k,\\ b=k^2-1"},{"id":"s4","latex":"f^{\\prime}\\ge0\\Rightarrow1\\le k\\le2,\\quad f^{\\prime}(0)=k^2-1\\text{ 최대}\\Rightarrow k=2"},{"id":"s5","latex":"f(x)=(x-1)^3+1,\\quad g(9)=3,\\ h(9)=\\frac17,\\ g^{\\prime}(9)=\\frac1{12}"},{"id":"s6","latex":"2\\cdot\\frac17\\cdot\\frac1{12}=\\frac1{42}"}],"track":"미적분"};</script>
