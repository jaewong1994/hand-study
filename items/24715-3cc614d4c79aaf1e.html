  <script>window.HandStudyRecord={"adminYear":2020,"answer":"③","contentHash":"65b29bc3ca15ea7f0c5299ce1baf226b6ce0c96977354e6d5260848476959dd0","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24715,"month":12,"number":14,"points":4,"preview":false,"questionHtml":"\u003cp>그림과 같이 \u003cspan class=\"heq\">\\(\\overline{AB_1} = 2\\)\u003c/span>, \u003cspan class=\"heq\">\\(\\overline{AD_1} = 4\\)\u003c/span>인 직사각형 \u003cspan class=\"heq\">\\(A B_1 C_1 D_1\\)\u003c/span>이 있다. 선분 \u003cspan class=\"heq\">\\(AD_1\\)\u003c/span>을 \u003cspan class=\"heq\">\\(3:1\\)\u003c/span>로 내분하는 점을 \u003cspan class=\"heq\">\\(E_1\\)\u003c/span>이라 하고, 직사각형 \u003cspan class=\"heq\">\\(A B_1 C_1 D_1\\)\u003c/span>의 내부에 점 \u003cspan class=\"heq\">\\(F_1\\)\u003c/span>을 \u003cspan class=\"heq\">\\(\\overline{ F_1 E_1 } = \\overline{ F_1 C_1 }\\)\u003c/span>, \u003cspan class=\"heq\">\\(\\angle E_1 F_1 C_1 = \\frac{\\pi}{2}\\)\u003c/span>가 되도록 잡고 삼각형 \u003cspan class=\"heq\">\\(E_1 F_1 C_1\\)\u003c/span>을 그린다. 사각형 \u003cspan class=\"heq\">\\(E_1 F_1 C_1 D_1\\)\u003c/span>을 색칠하여 얻은 그림을 \u003cspan class=\"heq\">\\(R_1\\)\u003c/span>이라 하자. 그림 \u003cspan class=\"heq\">\\(R_1\\)\u003c/span>에서 선분 \u003cspan class=\"heq\">\\(AB_1\\)\u003c/span>위의 점 \u003cspan class=\"heq\">\\(B_2\\)\u003c/span>, 선분 \u003cspan class=\"heq\">\\(E_1 F_1\\)\u003c/span> 위의 점 \u003cspan class=\"heq\">\\(C_2\\)\u003c/span>, 선분 \u003cspan class=\"heq\">\\(AE_1\\)\u003c/span> 위의 점 \u003cspan class=\"heq\">\\(D_2\\)\u003c/span>와 점 \u003cspan class=\"heq\">\\(A\\)\u003c/span>를 꼭짓점으로 하고 \u003cspan class=\"heq\">\\(\\overline{AB_2} : \\overline{AD_2} = 1 : 2\\)\u003c/span>인 직사각형 \u003cspan class=\"heq\">\\(AB_2 C_2 D_2\\)\u003c/span>를 그린다. 그림 \u003cspan class=\"heq\">\\(R_1\\)\u003c/span>을 얻은 것과 같은 방법으로 직사각형 \u003cspan class=\"heq\">\\(A B_2 C_2 D_2\\)\u003c/span>에 삼각형 \u003cspan class=\"heq\">\\(E_2 F_2 C_2\\)\u003c/span>를 그리고 사각형 \u003cspan class=\"heq\">\\(E_2 F_2 C_2 D_2\\)\u003c/span>를 색칠하여 얻은 그림을 \u003cspan class=\"heq\">\\(R_2\\)\u003c/span>라 하자. 이와 같은 과정을 계속하여 \u003cspan class=\"heq\">\\(n\\)\u003c/span>번째 얻은 그림 \u003cspan class=\"heq\">\\(R_n\\)\u003c/span>에 색칠되어 있는 부분의 넓이를 \u003cspan class=\"heq\">\\(S_n\\)\u003c/span>이라 할 때, \u003cspan class=\"heq\">\\(\\lim_{n\\to\\infty} S_n\\)\u003c/span>의 값은? [4점]\u003c/p>\u003cfigure>\u003cimg class=\"hfig\" src=\"../assets/csat/24715-a88bdc7e6e87f85f.png\" alt=\"2020년 시행 수능 14번 문항 그림 \" style=\"max-width:100%;width:420px\">\u003c/figure>\u003cdiv class=\"hchoices\">\u003cdiv class=\"hch\">① \u003cspan class=\"heq\">\\(\\frac{441}{103}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">② \u003cspan class=\"heq\">\\(\\frac{441}{109}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">③ \u003cspan class=\"heq\">\\(\\frac{441}{115}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">④ \u003cspan class=\"heq\">\\(\\frac{441}{121}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">⑤ \u003cspan class=\"heq\">\\(\\frac{441}{127}\\)\u003c/span>\u003c/div>\u003c/div>","questionText":"그림과 같이 $\\overline{AB_1} = 2$, $\\overline{AD_1} = 4$인 직사각형 $A B_1 C_1 D_1$이 있다. 선분 $AD_1$을 $3:1$로 내분하는 점을 $E_1$이라 하고, 직사각형 $A B_1 C_1 D_1$의 내부에 점 $F_1$을 $\\overline{ F_1 E_1 } = \\overline{ F_1 C_1 }$, $\\angle E_1 F_1 C_1 = \\frac{\\pi}{2}$가 되도록 잡고 삼각형 $E_1 F_1 C_1$을 그린다. 사각형 $E_1 F_1 C_1 D_1$을 색칠하여 얻은 그림을 $R_1$이라 하자. 그림 $R_1$에서 선분 $AB_1$위의 점 $B_2$, 선분 $E_1 F_1$ 위의 점 $C_2$, 선분 $AE_1$ 위의 점 $D_2$와 점 $A$를 꼭짓점으로 하고 $\\overline{AB_2} : \\overline{AD_2} = 1 : 2$인 직사각형 $AB_2 C_2 D_2$를 그린다. 그림 $R_1$을 얻은 것과 같은 방법으로 직사각형 $A B_2 C_2 D_2$에 삼각형 $E_2 F_2 C_2$를 그리고 사각형 $E_2 F_2 C_2 D_2$를 색칠하여 얻은 그림을 $R_2$라 하자. 이와 같은 과정을 계속하여 $n$번째 얻은 그림 $R_n$에 색칠되어 있는 부분의 넓이를 $S_n$이라 할 때, $\\lim_n->\\infty S_n$의 값은? [4점]\n① $\\frac{441}{103}$ ② $\\frac{441}{109}$ ③ $\\frac{441}{115}$ ④ $\\frac{441}{121}$ ⑤ $\\frac{441}{127}$","sourceHash":"1c879d914197a2c5c8449d9312cc4052c2776805d1798ab958835d0e26ee348a","sourceKind":"csat","sourceLabel":"2020년 시행 수능 · 2021학년도 · 가형 · 14번","steps":[{"id":"s1","latex":"\\mathrm A=(0,0),\\ \\mathrm B_1=(2,0),\\ \\mathrm C_1=(2,4),\\ \\mathrm D_1=(0,4),\\ \\mathrm E_1=(0,3)"},{"id":"s2","latex":"\\mathrm E_1\\mathrm C_1=\\sqrt5,\\quad[\\triangle\\mathrm E_1\\mathrm F_1\\mathrm C_1]=\\frac{(\\sqrt5)^2}{4}=\\frac54"},{"id":"s3","latex":"[\\triangle\\mathrm C_1\\mathrm D_1\\mathrm E_1]=\\frac12\\cdot2\\cdot1=1\\ \\Rightarrow\\ S_1=\\frac94"},{"id":"s4","latex":"\\text{직각이등변삼각형의 내부 꼭짓점은 }\\mathrm F_1=(\\tfrac32,\\tfrac52)"},{"id":"s5","latex":"\\mathrm E_1\\mathrm F_1:\\quad y=3-\\frac x3"},{"id":"s6","latex":"\\mathrm C_2=(u,2u)\\ \\Rightarrow\\ 2u=3-\\frac u3\\ \\Rightarrow\\ u=\\frac97"},{"id":"s7","latex":"\\text{닮음비}=\\frac{u}{2}=\\frac9{14},\\quad\\text{넓이의 비}=\\frac{81}{196}"},{"id":"s8","latex":"\\lim_{n\\to\\infty}S_n=\\frac{9/4}{1-81/196}=\\boxed{\\frac{441}{115}}\\quad\\text{③}"}],"track":"가형"};</script>
