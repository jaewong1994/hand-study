0\\,\\)\u003c/span>이 되도록 하는 서로 다른 모든 양수 \u003cspan class=\"heq\">\\(k\\,\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(k^{2}\\,\\)\u003c/span>의 값의 합을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"fed09b5392fa99ca37f26c09df56b19698811fc2695d9c0e147e0579de420669"};</script>
