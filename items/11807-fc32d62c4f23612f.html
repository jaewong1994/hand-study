<script>window.HandStudyRecord={"itemId":11807,"sourceLabel":"2021 교육청 고1 수학 9월 28번","adminYear":2021,"grade":1,"month":9,"number":28,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 원의 중심 $C \\left( a,\\,b \\right)$가 제$1$사분면 위에 있고, 반지름의 길이가 $r$이며 원점 $O$를 지나는 원이 있다. 원과 $x$축, $y$축이 만나는 점 중 $O$가 아닌 점을 각각 $A,\\,B$라 하자. 네 점 $O,\\,A,\\,B,\\,C$가 다음 조건을 만족시킬 때, $a+b+r ^{2}$의 값을 구하시오. [4점]\n(가) ${\\overline{ OB}} - {\\overline{ OA}}$$=4$ (나) 두 점 $O,\\,C$를 지나는 직선의 방정식은 $y$$=3x$이다.","answer":"14","sourceHash":"66ab0d8ba19b969a252bdf1c086be502eff900b75c2fae30419c06ee6cd4955c","steps":[{"id":"s1","latex":"C=(a,b),\\ O\\text{가 원 위}\\Rightarrow r^2=a^2+b^2"},{"id":"s2","latex":"A=(2a,0),\\ B=(0,2b)\\Rightarrow OA=2a,\\ OB=2b"},{"id":"s3","latex":"OB-OA=4\\Rightarrow b-a=2"},{"id":"s4","latex":"O,C\\text{의 직선 }y=3x\\Rightarrow b=3a"},{"id":"s5","latex":"(a,b)=(1,3),\\quad r^2=10\\Rightarrow a+b+r^2=14"}],"diagram":null,"contentHash":"ccfb121717291e5ac9e6960716ab7f481469d8ca5f97a8086d69dc5cc1484fed","questionHtml":"\u003cp class=\"hp\">그림과 같이 원의 중심 \u003cspan class=\"heq\">\\(C \\left( a,\\,b \\right)\\)\u003c/span>가 제\u003cspan class=\"heq\">\\(1\\)\u003c/span>사분면 위에 있고, 반지름의 길이가 \u003cspan class=\"heq\">\\(r\\)\u003c/span>이며 원점 \u003cspan class=\"heq\">\\(O\\)\u003c/span>를 지나는 원이 있다. 원과 \u003cspan class=\"heq\">\\(x\\)\u003c/span>축, \u003cspan class=\"heq\">\\(y\\)\u003c/span>축이 만나는 점 중 \u003cspan class=\"heq\">\\(O\\)\u003c/span>가 아닌 점을 각각 \u003cspan class=\"heq\">\\(A,\\,B\\)\u003c/span>라 하자. \u003cbr>네 점 \u003cspan class=\"heq\">\\(O,\\,A,\\,B,\\,C\\)\u003c/span>가 다음 조건을 만족시킬 때, \u003cspan class=\"heq\">\\(a+b+r^{2}\\)\u003c/span>의 값을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp htall\">(가) \u003cspan class=\"heq\">\\({\\overline{OB}} - {\\overline{OA}}\\)\u003c/span>\u003cspan class=\"heq\">\\(=4\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">(나) 두 점 \u003cspan class=\"heq\">\\(O,\\,C\\)\u
