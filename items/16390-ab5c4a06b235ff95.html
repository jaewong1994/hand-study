  <script>window.HandStudyRecord={"itemId":16390,"sourceLabel":"2019 교육청 고3 수리나형 3월 18번","adminYear":2019,"grade":3,"month":3,"number":18,"track":"수리나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"자연수 $n\\,$에 대하여 원점을 지나는 직선과 \n곡선 $y=- \\left( x-n \\right) \\left( x-n-2 \\right) \\,$가 제$1\\,$사분면에서 접할 때, 접점의 $x\\,$좌표를 $a_{n}$, 직선의 기울기를 $b_{n} \\,$이라 하자.\n다음은 $\\lim\\limits_{n\\,\\to \\,\\infty} {a_{n} \\,b_{n} \\,}$의 값을 구하는 과정이다.\n원점을 지나고 기울기가 $b_{n}\\,$인 직선의 방정식은 $y= b_{n} x\\,$이다. 이 직선이 곡선 $y=- \\left( x-n \\right) \\left( x-n-2 \\right) \\,$에 접하므로\n이차방정식 $b_{n} x = -(x-n) (x-n-2)\\,$의 근 $x= a_{n}$은 중근이다.\n그러므로 이차방정식\n$x^{\\,2} + \\left\\{ b_{n} -2(n+1) \\right\\} x+n \\left( n+2 \\right) =0\\,$\n에서 이차식\n$x^{\\,2} + \\left\\{ b_{n} -2(n+1) \\right\\} x+n \\left( n+2 \\right)$\n는 완전제곱식으로 나타내어진다.\n그런데 $a_{n} \\gt 0\\,$이므로\n$x^{\\,2} + \\left\\{ b_{n} -2(n+1) \\right\\} x+n \\left( n+2 \\right)$$= \\left\\{ x - \\sqrt{n(n+2)} \\right\\}^{2}$\n에서\n$a_{n} = {\\boxed{\\vphantom{(}^\\, (\\text{가})^\\, \\,}}$, $b_{n} = {\\boxed{\\vphantom{(}^\\, (\\text{나})^\\,}} \\,$\n이다.\n따라서 $\\lim\\limits_{n\\,\\to \\,\\infty} {a_{n} \\,b_{n} \\,}$$= {\\boxed{\\vphantom{(}^\\, (\\text{다})^\\, \\,}} \\,$이다.\n위의 (가)와 (나)에 알맞은 식을 각각 $f \\left( n \\right)$, $g \\left( n \\right) \\,$이라 하고, (다)에 알맞은 값을 $\\alpha\\,$라 할 때, $2f \\left( \\alpha \\right) +g \\left( \\alpha \\right) \\,$의 값은? [4점]\n① $1$ ② $2$ ③ $3$ ④ $4$ ⑤ $5$","answer":"④","sourceHash":"2920e043ab45f5e5ad3a3dac72aa594be494f5377403665dc387172fe110dd22","steps":[{"id":"s1","latex":"x^2+\\{b_n-2(n+1)\\}x+n(n+2)=\\{x-\\sqrt{n(n+2)}\\}^2"},{"id":"s2","latex":"a_n=\\sqrt{n(n+2)}"},{"id":"s3","latex":"b_n=2(n+1)-2\\sqrt{n(n+2)}"},{"id":"s4","latex":"a_nb_n=\\dfrac{2\\sqrt{n(n+2)}}{n+1+\\sqrt{n(n+2)}}\\to1"},{"id":"s5","latex":"\\alpha=1,\\quad2f(1)+g(1)=2\\sqrt3+4-2\\sqrt3=4"}],"diagram":null,"contentHash":"fa22015bed428fafaad39449dc6e96d673d7c63e29def86274edc9ae1cc4edb2","questionHtml":"\u003cp class=\"hp\">자연수 \u003
