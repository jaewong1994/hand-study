<script>window.HandStudyGuide={"itemId":17081,"sourceHash":"bdf8e66a387fd450ad8498bb7ade72e322e03bb7a50f57895e7bde024f39487f","contentHash":"f7fbd154e7bc0df3f8eeb65db69de35b244fdc783665b8d82d3e763af1741c4a","overview":{"goal":"각의 이등분선과 중점 평행선이 만드는 두 넓이를 좌표로 나타내고 극한을 구해요.","firstLook":"밑변을 좌표축에 두면 넓이는 밑변 길이와 높이로 계산되고, 두 넓이의 공통인 \\(\\sin\\theta\\)가 약분돼요.","conditions":[{"label":"각의 이등분선","meaning":"각의 이등분선 정리로 밑변 위의 점을 정확히 잡아요."},{"label":"중점을 지나는 평행선","meaning":"직선 방정식을 세워 교점의 높이를 구해요."}]},"chapters":[{"id":"c1","label":"좌표와 첫 넓이","stepIds":["s1","s2"],"question":"각의 이등분선이 밑변과 만나는 점의 좌표는 어떻게 정하나요?","hint":"\\(AB:AC=1:b\\)가 \\(BE:EC\\)와 같다는 정리를 사용하세요.","explanation":"\\(B=(0,0)\\), \\(C=(2,0)\\), \\(A=(\\cos\\theta,\\sin\\theta)\\)로 두면 \\(AB=1\\)이고 \\(b=AC=\\sqrt{(2-\\cos\\theta)^2+\\sin^2\\theta}=\\sqrt{5-4\\cos\\theta}\\)예요.\n\n각의 이등분선 정리에서 \\(BE:EC=1:b\\)이므로 \\(BE=2/(1+b)\\), 따라서 \\(E=(2/(1+b),0)\\)예요. 삼각형 \\(ABE\\)의 높이는 \\(\\sin\\theta\\)이므로 \\(f(\\theta)=\\frac12\\cdot\\frac{2}{1+b}\\sin\\theta=\\sin\\theta/(1+b)\\)예요.","check":{"prompt":"\\(b^2=5-4\\cos\\theta\\)에서 상수 5는 어떻게 나오나요?","answer":"\\((2-\\cos\\theta)^2+\\sin^2\\theta=4-4\\cos\\theta+\\cos^2\\theta+\\sin^2\\theta\\)에서 나와요."}},{"id":"c2","label":"평행선 교점과 둘째 넓이","stepIds":["s3"],"question":"두 직선의 방정식을 연립했을 때 교점 \\(F\\)의 높이는 얼마인가요?","hint":"\\(D=(1,0)\\), \\(M=((2+\\cos\\theta)/2,\\sin\\theta/2)\\)를 먼저 적으세요.","explanation":"\\(D\\)는 \\(BC\\)의 중점이라 \\((1,0)\\), \\(M\\)은 \\(AC\\)의 중점이라 \\(((2+\\cos\\theta)/2,\\sin\\theta/2)\\)예요. 직선 \\(DM\\)을 \\(D+s(M-D)\\)로 나타내고 각의 이등분선 \\(AE\\)의 직선식과 연립하면 교점의 높이는 \\(y_F=(b-1)\\sin\\theta/2\\)예요.\n\n\\(DC=1\\)이고 밑변이 \\(x\\)축에 있으므로 \\(g(\\theta)=[\\triangle DFC]=\\frac12y_F=(b-1)\\sin\\theta/4\\)예요.","check":{"prompt":"삼각형 \\(DFC\\)의 밑변 길이가 1인 이유는 무엇인가요?","answer":"\\(D\\)가 길이 2인 \\(BC\\)의 중점이므로 \\(DC=1\\)이에요."}},{"id":"c3","label":"넓이비의 극한","stepIds":["s4","s5"],"question":"두 넓이의 비에서 \\(b-1\\)을 어떻게 \\(1-\\cos\\theta\\)로 바꾸나요?","hint":"분자와 분모에 \\(b+1\\)이 짝으로 나타나는지 보세요.","explanation":"두 넓이를 나누면 \\(g/(\\theta^2f)=((b-1)(1+b))/(4\\theta^2)=(b^2-1)/(4\\theta^2)\\)예요. \\(b^2=5-4\\cos\\theta\\)이므로 \\(b^2-1=4(1-\\cos\\theta)\\), 따라서 비는 \\((1-\\cos\\theta)/\\theta^2\\)로 줄어요.\n\n\\(1-\\cos\\theta=2\\sin^2(\\theta/2)\\)를 쓰면 \\(\\frac12(\\sin(\\theta/2)/(\\theta/2))^2\\)이고, \\(\\theta\\to0+\\)에서 값은 \\(1/2\\)예요. 정답은 ③이에요.","check":{"prompt":"마지막 극한에서 앞의 계수가 \\(1/2\\)인 까닭은 무엇인가요?","answer":"\\(2\\sin^2(\\theta/2)/\\theta^2=\\frac12(\\sin(\\theta/2)/(\\theta/2))^2\\)이기 때문이에요."}}],"takeaway":["각의 이등분선 정리는 밑변의 좌표를 바로 정해 줘요.","중점과 평행선의 교점은 직선 두 개를 매개변수로 놓으면 높이를 구하기 쉬워요.","넓이비에서 켤레처럼 묶이는 두 인수는 제곱의 차로 정리해요."]};</script>
