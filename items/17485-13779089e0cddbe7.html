<script>window.HandStudyRecord={"itemId":17485,"sourceLabel":"2022 평가원 고3 수학기하 9월 21번","adminYear":2022,"grade":3,"month":9,"number":21,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 곡선 $y=2^{x}$ 위에 두 점 ${{P}} \\left(a,\\, 2^{a} \\right)$, ${{Q}} \\left(b,\\, 2^{b} \\right)$이 있다. 직선 ${{PQ}}$의 기울기를 $m$이라 할 때, 점 ${{P}}$를 지나며 기울기가 $-m$인 직선이 $x$축, $y$축과 만나는 점을 각각 ${{A}}$, ${{B}}$라 하고, 점 ${{Q}}$를 지나며 기울기가 $-m$인 직선이 $x$축과 만나는 점을 ${{C}}$라 하자.\n $\\frac{}{l} i n e{{{AB}} }=\\frac{4}{l} i n e{{{PB}} }$, $\\\\frac{,}{l} i n e{{{CQ}} }=\\frac{3}{l} i n e{{{AB}} }$\n일 때, $90 \\times(a+b)$의 값을 구하시오. (단, $0\u003ca\u003cb$) [4점]","answer":"220","sourceHash":"c4f005d1f4591bb28dfbfb45d9fca74addf068c9173bacf91ebcb047b7fbc85e","steps":[{"id":"s1","latex":"B=(0,ma+2^a),\\quad A=\\left(a+\\frac{2^a}{m},0\\right)"},{"id":"s2","latex":"AB=4PB\\Rightarrow ma+2^a=4ma"},{"id":"s3","latex":"2^a=3ma"},{"id":"s4","latex":"CQ=3AB\\Rightarrow2^b=3(ma+2^a)=12ma=4\\cdot2^a"},{"id":"s5","latex":"b=a+2"},{"id":"s6","latex":"m=\\frac{2^b-2^a}{b-a}=\\frac{3\\cdot2^a}{2}"},{"id":"s7","latex":"2^a=3a\\cdot\\frac{3\\cdot2^a}{2}\\Rightarrow a=\\frac29"},{"id":"s8","latex":"b=\\frac{20}{9}"},{"id":"s9","latex":"90(a+b)=90\\cdot\\frac{22}{9}=\\boxed{220}"}],"diagram":null,"contentHash":"bc76569c53f1ae2a67cef05d3f38c95faf2fcb5d98ef8008cb55cfec1e4734cc","questionHtml":"\u003cp class=\"hp\">그림과 같이 곡선 \u003cspan class=\"heq\">\\(y=2^{x}\\)\u003c/span> 위에 두 점 \u003cspan class=\"heq\">\\({{P}} \\left(a,\\, 2^{a} \\right)\\)\u003c/span>, \u003cspan class=\"heq\">\\({{Q}} \\left(b,\\, 2^{b} \\right)\\)\u003c/span>이 있다. 직선 \u003cspan class=\"heq\">\\({{PQ}}\\)\u003c/span>의 기울기를 \u003cspan class=\"heq\">\\(m\\)\u003c/span>이라 할 때, 점 \u003cspan class=\"heq\">\\({{P}}\\)\u003c/span>를 지나며 기울기가 \u003cspan class=\"heq\">\\(-m\\)\u003c/span>인 직선이 \u003cspan class=\"heq\">\\(x\\)\u003c/span>축, \u003cspan class=\"heq\">\\(y\\)\u003c/span>축과 만나는 점을 각각 \u003cspan class=\"heq\">\\({{A}}\\)\u003c/span>, \u003cspan class=\"heq\">\\({{B}}\\)\u003c/span>라 하고, 점 \u003cspan class=\"heq\">\\({{Q}}\\)\u003c/span>를 지나며 기울기가 \u003cspan class=\"heq\">\\(-m\\)\u003c/span>인 직선이 \u003cspan class=\"heq\">\\(x\\)\u003c/span>축과 만나는 점을 \u003cspan class=\"heq\">\\({{C}}\\)\u003c/span>라 하자.\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\(\\overline{{{AB}} }=4 \\overline{{{PB}} }\\)\u003c/span>, \u003cspan class=\"heq\">\\(\\, \\overline{{{CQ}} }=3 \\overline{{{AB}} }\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">일 때, \u003cspan class=\"heq\">\\(90 \\times(a+b)\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(0\\lt a\\lt b\\)\u003c/span>) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/d03e51c459a9c3bab51d2464.png\" style=\"width:1345px;max-width:100%\">\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"13779089e0cddbe72db5bc4a50536e4130bed2bc576efc291b1f4b827a8aef53"};</script>
<script>window.HandStudyGuide={"itemId":17485,"sourceHash":"c4f005d1f4591bb28dfbfb45d9fca74addf068c9173bacf91ebcb047b7fbc85e","contentHash":"bc76569c53f1ae2a67cef05d3f38c95faf2fcb5d98ef8008cb55cfec1e4734cc","overview":{"goal":"서로 평행한 두 하강 직선에서 선분 길이의 비를 세로 길이의 비로 바꾸고, 지수함수 위 두 점의 좌표를 정해요.","firstLook":"기울기가 모두 \\(-m\\)인 선분끼리는 실제 길이와 세로 길이의 비율이 같아요. 그림에서 \\(B,P,A\\)와 \\(Q,C\\)의 세로 높이를 좌표로 먼저 적어요.","conditions":[{"label":"첫 길이비","meaning":"같은 직선 위 \\(AB\\)와 \\(PB\\)의 길이비는 세로 변화량의 비와 같아요."},{"label":"둘째 길이비","meaning":"평행한 \\(CQ\\)와 \\(AB\\)도 세로 변화량으로 길이비를 비교할 수 있어요."},{"label":"점의 순서","meaning":"\\(0<a<b\\)이므로 \\(m>0\\)이고 그림의 선분 방향과 세로 길이가 모두 양수예요."}]},"chapters":[{"id":"c1","label":"첫 직선의 절편과 길이비를 연결해요","stepIds":["s1","s2","s3"],"question":"\\(AB=4PB\\)를 왜 \\(ma+2^a=4ma\\)로 바꿀 수 있을까요?","hint":"기울기 \\(-m\\)인 같은 직선 위에서는 길이가 세로 변화량에 같은 비율로 비례해요.","explanation":"점을 \\(P=(a,2^a)\\)라 하면 기울기 \\(-m\\)인 직선의 \\(y\\)절편은 \\(ma+2^a\\)이므로 \\(B=(0,ma+2^a)\\)예요. \\(x\\)절편은 \\(A=(a+2^a/m,0)\\)예요. 같은 직선 위에서 실제 선분 길이는 세로 변화량에 공통인 배율 \\(\\sqrt{1+m^{-2}}\\)을 곱한 값이에요. \\(AB\\)의 세로 변화량은 \\(ma+2^a\\), \\(PB\\)의 세로 변화량은 \\(ma\\)이므로 \\(AB=4PB\\)는 \\(ma+2^a=4ma\\)와 같아요. 따라서 \\(2^a=3ma\\)예요.","check":{"prompt":"\\(PB\\)의 세로 변화량이 \\(ma\\)인 이유는 무엇인가요?","answer":"\\(B\\)의 높이 \\(ma+2^a\\)에서 \\(P\\)의 높이 \\(2^a\\)를 빼면 \\(ma\\)예요."}},{"id":"c2","label":"둘째 길이비에서 지수의 차를 정해요","stepIds":["s4","s5","s6"],"question":"\\(CQ=3AB\\)가 왜 \\(2^b=4\\cdot2^a\\)를 줄까요?","hint":"\\(CQ\\)의 세로 변화량은 \\(Q\\)의 높이이고, 앞에서 \\(AB\\)의 세로 변화량을 구했어요.","explanation":"\\(C\\)는 \\(x\\)축 위이고 \\(Q=(b,2^b)\\)이므로 \\(CQ\\)의 세로 변화량은 \\(2^b\\)예요. 두 직선의 기울기는 모두 \\(-m\\)이어서 같은 세로 변화량 배율을 쓰므로 \\(CQ=3AB\\)는 \\(2^b=3(ma+2^a)\\)예요. \\(2^a=3ma\\)를 넣으면 \\(ma+2^a=4ma=4\\cdot2^a/3\\)이므로 \\(2^b=4\\cdot2^a=2^{a+2}\\), 따라서 \\(b=a+2\\)예요. 이제 직선 \\(PQ\\)의 기울기는 \\(m=(2^b-2^a)/(b-a)=3\\cdot2^a/2\\)예요.","check":{"prompt":"\\(b-a=2\\)일 때 \\(2^b-2^a\\)를 \\(2^a\\)로 나타내 보세요.","answer":"\\(2^b=4\\cdot2^a\\)이므로 차는 \\(3\\cdot2^a\\)예요."}},{"id":"c3","label":"두 기울기 식을 맞춰 좌표를 구해요","stepIds":["s7","s8","s9"],"question":"\\(2^a\\)를 직접 구하지 않아도 \\(a\\)가 정해지는 까닭은 무엇일까요?","hint":"\\(2^a=3ma\\)에 방금 구한 \\(m\\)을 넣으면 양변에 같은 양수 \\(2^a\\)가 있어요.","explanation":"\\(2^a=3ma\\)에 \\(m=3\\cdot2^a/2\\)를 넣으면 \\(2^a=(9a/2)2^a\\)예요. \\(2^a>0\\)이므로 나누어 \\(1=9a/2\\), 곧 \\(a=2/9\\)를 얻어요. \\(b=a+2=20/9\\)이고, \\(a+b=22/9\\)이므로 \\(90(a+b)=90\\cdot22/9=220\\)이에요.","check":{"prompt":"양변을 \\(2^a\\)로 나누어도 되는 이유는 무엇인가요?","answer":"지수함수값 \\(2^a\\)는 모든 실수 \\(a\\)에서 항상 양수라서 0이 아니기 때문이에요."}}],"takeaway":["평행한 선분들의 길이비는 같은 방향에서 잰 가로 또는 세로 변화량의 비로 바꿀 수 있어요.","지수함수 위 두 점의 높이비가 거듭제곱이면 지수의 차를 바로 정할 수 있어요.","공통인 양수 인수를 나눌 때는 0이 아님을 먼저 확인해요."]};</script>
