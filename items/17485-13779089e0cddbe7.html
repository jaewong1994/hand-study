  <script>window.HandStudyRecord={"itemId":17485,"sourceLabel":"2022 평가원 고3 수학기하 9월 21번","adminYear":2022,"grade":3,"month":9,"number":21,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 곡선 $y=2^{x}$ 위에 두 점 ${{P}} \\left(a,\\, 2^{a} \\right)$, ${{Q}} \\left(b,\\, 2^{b} \\right)$이 있다. 직선 ${{PQ}}$의 기울기를 $m$이라 할 때, 점 ${{P}}$를 지나며 기울기가 $-m$인 직선이 $x$축, $y$축과 만나는 점을 각각 ${{A}}$, ${{B}}$라 하고, 점 ${{Q}}$를 지나며 기울기가 $-m$인 직선이 $x$축과 만나는 점을 ${{C}}$라 하자.\n $\\frac{}{l} i n e{{{AB}} }=\\frac{4}{l} i n e{{{PB}} }$, $\\\\frac{,}{l} i n e{{{CQ}} }=\\frac{3}{l} i n e{{{AB}} }$\n일 때, $90 \\times(a+b)$의 값을 구하시오. (단, $0\u003ca\u003cb$) [4점]","answer":"220","sourceHash":"c4f005d1f4591bb28dfbfb45d9fca74addf068c9173bacf91ebcb047b7fbc85e","steps":[{"id":"s1","latex":"B=(0,ma+2^a),\\quad A=\\left(a+\\frac{2^a}{m},0\\right)"},{"id":"s2","latex":"AB=4PB\\Rightarrow ma+2^a=4ma"},{"id":"s3","latex":"2^a=3ma"},{"id":"s4","latex":"CQ=3AB\\Rightarrow2^b=3(ma+2^a)=12ma=4\\cdot2^a"},{"id":"s5","latex":"b=a+2"},{"id":"s6","latex":"m=\\frac{2^b-2^a}{b-a}=\\frac{3\\cdot2^a}{2}"},{"id":"s7","latex":"2^a=3a\\cdot\\frac{3\\cdot2^a}{2}\\Rightarrow a=\\frac29"},{"id":"s8","latex":"b=\\frac{20}{9}"},{"id":"s9","latex":"90(a+b)=90\\cdot\\frac{22}{9}=\\boxed{220}"}],"diagram":null,"contentHash":"bc76569c53f1ae2a67cef05d3f38c95faf2fcb5d98ef8008cb55cfec1e4734cc","questionHtml":"\u003cp class=\"hp\">그림과 같이 곡선 \u003cspan class=\"heq\">\\(y=2^{x}\\)\u003c/span> 위에 두 점 \u003cspan class=\"heq\">\\({{P}} \\left(a,\\, 2^{a} \\right)\\)\u003c/span>, \u003cspan class=\"heq\">\\({{Q}} \\left(b,\\, 2^{b} \\right)\\)\u003c/span>이 있다. 직선 \u003cspan class=\"heq\">\\({{PQ}}\\)\u003c/span>의 기울기를 \u003cspan class=\"heq\">\\(m\\)\u003c/span>이라 할 때, 점 \u003cspan class=\"heq\">\\({{P}}\\)\u003c/span>를 지나며 기울기가 \u003cspan class=\"heq\">\\(-m\\)\u003c/span>인 직선이 \u003cspan class=\"heq\">\\(x\\)\u003c/span>축, \u003cspan class=\"heq\">\\(y\\)\u003c/span>축과 만나는 점을 각각 \u003cspan class=\"heq\">\\({{A}}\\)\u00
