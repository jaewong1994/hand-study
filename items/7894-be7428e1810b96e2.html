<script>window.HandStudyGuide={"itemId":7894,"sourceHash":"74968cb874c513eddf0230f0db6323e0aa8c31042578bc6da88c81c8b3106d46","contentHash":"28fd671c27832df21bab77aad2ecc53faec29b0431785bb04d1e6277ebb31a49","overview":{"conditions":[{"label":"직사각형의 크기","meaning":"\\(AB=3, BC=6\\)인 직사각형에서 \\(E\\)는 \\(BC\\)를 \\(1:5\\)로 나눠요."},{"label":"구할 각","meaning":"\\(\\theta=\\angle EAC\\)이고 \\(50\\sin\\theta\\cos\\theta\\)의 값을 구해요."}],"goal":"삼각형 \\(AEC\\)의 세 변을 좌표로 구하고 코사인법칙으로 끼인각의 삼각함수 값을 계산해요.","firstLook":"직사각형을 \\(A=(0,3),B=(0,0),C=(6,0)\\)로 두어요. E는 BC를 1:5로 내분하므로 \\(E=(1,0)\\)이에요."},"chapters":[{"check":{"prompt":"점 \\(E\\)의 좌표는 무엇인가요?","answer":"\\(BE=1\\)이므로 \\(E=(1,0)\\)이에요."},"stepIds":["s1","s2"],"question":"내분점의 좌표를 어떻게 정하나요?","id":"c1","label":"조건을 좌표로 옮겨요","explanation":"직사각형을 \\(A=(0,3),B=(0,0),C=(6,0)\\)로 두어요. E는 BC를 1:5로 내분하므로 \\(E=(1,0)\\)이에요.","hint":"\\(BC=6\\)이고 \\(BE:EC=1:5\\)를 써요."},{"check":{"prompt":"코사인법칙에 넣을 세 변의 길이는 얼마인가요?","answer":"\\(AE=\\sqrt{10}, AC=3\\sqrt5, EC=5\\)예요."},"stepIds":["s3"],"question":"삼각형 \\(AEC\\)의 세 변으로 \\(\\cos\\theta\\)를 어떻게 구하나요?","id":"c2","label":"좌표 관계로 핵심 식을 세워요","explanation":"좌표에서 \\(AE=\\sqrt{1^2+3^2}=\\sqrt{10}\\), \\(AC=\\sqrt{6^2+3^2}=3\\sqrt5\\), \\(EC=5\\)예요. \\(\\theta=\\angle EAC\\)이므로 코사인법칙에서 \\(\\cos\\theta=(AE^2+AC^2-EC^2)/(2\\,AE\\,AC)=(10+45-25)/(2\\sqrt{10}\\cdot3\\sqrt5)=1/\\sqrt2\\)예요.","hint":"\\(AE,AC,EC\\)를 구한 뒤 코사인법칙을 써요."},{"check":{"prompt":"\\(\\sin\\theta\\)와 최종값은 각각 얼마인가요?","answer":"\\(\\theta\\)가 예각이므로 \\(\\sin\\theta=1/\\sqrt2\\)이고 \\(50\\sin\\theta\\cos\\theta=25\\)예요."},"stepIds":["s4"],"question":"마지막 삼각함수 곱은 얼마인가요?","id":"c3","label":"값과 범위를 확인해요","explanation":"\\(\\theta\\)는 삼각형의 예각이므로 \\(\\sin\\theta>0\\)이에요. 따라서 \\(\\sin\\theta=\\sqrt{1-\\cos^2\\theta}=1/\\sqrt2\\)이고 \\(50\\sin\\theta\\cos\\theta=50\\cdot(1/\\sqrt2)^2=25\\)예요.","hint":"\\(45^\\circ\\)의 사인과 코사인을 넣어요."}],"takeaway":["좌표를 잡으면 내분점과 세 변의 길이를 거리 공식으로 구할 수 있어요.","두 변과 그 끼인각의 맞은편 변을 알면 코사인법칙으로 각의 코사인을 구해요.","사인의 부호는 각의 범위를 확인한
