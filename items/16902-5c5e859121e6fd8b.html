<script>window.HandStudyRecord={"itemId":16902,"sourceLabel":"2020 평가원 고3 수리가형 9월 28번","adminYear":2020,"grade":3,"month":9,"number":28,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 길이가 $2$인 선분 $A B$를 지름으로 하는 반원이 있다. 선분 $A B$의 중점을 $O$라 할 때, 호 $A B$ 위에 두 점 $P,\\,Q$를 $\\angle POA=\\theta$, $\\angle QOB=2\\theta$가 되도록 잡는다. 두 선분 $P B,\\,OQ$의 교점을 $R$라 하고, 점 $R$에서 선분 $P Q$에 내린 수선의 발을 $H$라 하자. 삼각형 $P O R$의 넓이를 $f(\\theta)$, 두 선분 $R Q,\\,RB$와 호 $Q B$로 둘러싸인 부분의 넓이를 $g(\\theta)$라 할 때, $\\lim _{\\theta \\,-> \\,0+} {\\frac{f(\\theta)+g(\\theta)}{ {\\overline{RH}}} = \\frac{q}{p}}$ 이다. $p+q$의 값을 구하시오. (단, $0\u003c\\theta\u003c \\frac{\\pi}{3}$이고, $p$와 $q$는 서로소인 자연수이다.) [4점]","answer":"23","sourceHash":"5966a2ffaaa2e9323b442d775be22ca8221342069eb2237e8318dfef90c1cce8","steps":[{"id":"s1","latex":"OR=\\dfrac{\\sin(\\theta/2)}{\\sin(5\\theta/2)}"},{"id":"s2","latex":"f(\\theta)=\\dfrac{\\sin(\\theta/2)\\sin3\\theta}{2\\sin(5\\theta/2)}"},{"id":"s3","latex":"g(\\theta)=\\theta-\\dfrac{\\sin(\\theta/2)\\sin2\\theta}{2\\sin(5\\theta/2)}"},{"id":"s4","latex":"RH=\\sin\\dfrac{3\\theta}{2}\\left(1-\\dfrac{\\sin(\\theta/2)}{\\sin(5\\theta/2)}\\right)"},{"id":"s5","latex":"\\lim_{\\theta\\to0+}\\dfrac{f+g}{RH}=\\dfrac{1+\\frac12\\frac15(3-2)}{\\frac32(1-\\frac15)}=\\dfrac{11}{12}"},{"id":"s6","latex":"p+q=\\boxed{23}"}],"diagram":null,"contentHash":"32e6f8a1e38577f924797414fb53a021eec477c53dfb5768a5b694c8d66409e7","questionHtml":"\u003cp class=\"hp htall\">그림과 같이 길이가 \u003cspan class=\"heq\">\\(2\\)\u003c/span>인 선분 \u003cspan class=\"heq\">\\(A B\\)\u003c/span>를 지름으로 하는 반원이 있다. 선분 \u003cspan class=\"heq\">\\(A B\\)\u003c/span>의 중점을 \u003cspan class=\"heq\">\\(O\\)\u003c/span>라 할 때, 호 \u003cspan class=\"heq\">\\(A B\\)\u003c/span> 위에 두 점 \u003cspan class=\"heq\">\\(P,\\,Q\\)\u003c/span>를 \u003cspan class=\"heq\">\\(\\angle POA=\\theta\\)\u003c/span>, \u003cspan class=\"heq\">\\(\\angle QOB=2\\theta\\)\u003c/span>가 되도록 잡는다. 두 선분 \u003cspan class=\"heq\">\\(P B,\\,OQ\\)\u003c/span>의 교점을 \u003cspan class=\"heq\">\\(R\\)\u003c/span>라 하고, 점 \u003cspan class=\"heq\">\\(R\\)\u003c/span>에서 선분 \u003cspan class=\"heq\">\\(P Q\\)\u003c/span>에 내린 수선의 발을 \u003cspan class=\"heq\">\\(H\\)\u003c/span>라 하자. 삼각형 \u003cspan class=\"heq\">\\(P O R\\)\u003c/span>의 넓이를 \u003cspan class=\"heq\">\\(f(\\theta)\\)\u003c/span>, 두 선분 \u003cspan class=\"heq\">\\(R Q,\\,RB\\)\u003c/span>와 호 \u003cspan class=\"heq\">\\(Q B\\)\u003c/span>로 둘러싸인 부분의 넓이를 \u003cspan class=\"heq\">\\(g(\\theta)\\)\u003c/span>라 할 때, \u003cspan class=\"heq\">\\(\\lim\\limits_{\\theta \\,\\to  \\,0+} {\\dfrac{f(\\theta)+g(\\theta)}{{\\overline{RH}}} = \\dfrac{q}{p}}\\)\u003c/span>이다. \u003cspan class=\"heq\">\\(p+q\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(0\\lt \\theta\\lt  \\dfrac{\\pi}{3}\\)\u003c/span>이고, \u003cspan class=\"heq\">\\(p\\)\u003c/span>와 \u003cspan class=\"heq\">\\(q\\)\u003c/span>는 서로소인 자연수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/5837b483a25dd7b317c72798.png\" style=\"width:309px;max-width:100%\">\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"5c5e859121e6fd8b43b45f8ec55d53410cfb7d7d39b2fc5882aa8fbb143f6acc"};</script>
<script>window.HandStudyGuide={"itemId":16902,"sourceHash":"5966a2ffaaa2e9323b442d775be22ca8221342069eb2237e8318dfef90c1cce8","contentHash":"32e6f8a1e38577f924797414fb53a021eec477c53dfb5768a5b694c8d66409e7","overview":{"goal":"넓이와 높이를 \\(\\theta\\)의 식으로 나타낸 뒤 작은 각의 극한을 계산해요.","firstLook":"반지름이 1이므로 각 삼각형의 변과 넓이를 사인으로 나타낼 수 있어요. 먼저 교점 \\(R\\)의 위치를 정하는 것이 핵심이에요.","conditions":[{"label":"교점","meaning":"\\(R\\)은 \\(PB\\)와 \\(OQ\\)의 교점이에요."},{"label":"넓이","meaning":"부채꼴에서 삼각형을 빼 \\(g(\\theta)\\)를 구해요."},{"label":"극한","meaning":"각 사인의 각도를 빠뜨리지 않고 \\(\\sin t/t\\to1\\)을 써요."}]},"chapters":[{"id":"c1","label":"교점과 두 넓이를 구해요","stepIds":["s1","s2","s3"],"question":"왜 \\(OR\\)의 분모에 \\(5\\theta/2\\)가 나타날까요?","hint":"삼각형 \\(ORB\\)에서 \\(OB=1\\)이고 \\(PB\\)가 만드는 각을 원주각으로 읽어요.","explanation":"호의 원주각을 이용하면 삼각형 \\(ORB\\)에서 \\(\\angle OBR=\\theta/2\\), \\(\\angle ORB=\\pi-5\\theta/2\\)예요. 사인법칙으로 \\(OR/\\sin(\\theta/2)=1/\\sin(5\\theta/2)\\), 따라서 \\(OR=\\sin(\\theta/2)/\\sin(5\\theta/2)\\)예요. \\(\\angle POR=\\pi-3\\theta\\)이고 \\(\\sin(\\pi-3\\theta)=\\sin3\\theta\\)이므로 \\(f(\\theta)=\\frac12 OR\\sin3\\theta\\)예요. 또 \\(g\\)는 중심각 \\(2\\theta\\)인 부채꼴의 넓이 \\(\\theta\\)에서 삼각형 \\(ORQ\\)의 넓이 \\(\\frac12OR\\sin2\\theta\\)를 뺀 값이에요.","check":{"prompt":"\\(g(\\theta)\\)에서 빼는 삼각형의 넓이는 무엇인가요?","answer":"\\(OQ=1\\), \\(\\angle QOR=2\\theta\\)이므로 \\(\\frac12OR\\sin2\\theta\\)예요."}},{"id":"c2","label":"수선의 길이와 극한을 계산해요","stepIds":["s4","s5","s6"],"question":"\\(RH\\)는 어떤 두 높이의 차일까요?","hint":"직선 \\(PQ\\)에서 \\(O\\)와 \\(R\\)까지의 수직거리를 비교해요.","explanation":"현 \\(PQ\\)가 중심 \\(O\\)에서 떨어진 거리는 \\(\\sin(3\\theta/2)\\)이고, \\(R\\)은 \\(OQ\\) 위에 있으므로 \\(R\\)에서 같은 직선까지의 거리는 \\(\\sin(3\\theta/2)(1-OR)\\)예요. 따라서 주어진 식을 \\(\\theta\\)로 나누고 \\(\\sin(c\\theta)/\\theta\\to c\\)를 적용하면 분자는 \\(1+\\frac12\\cdot\\frac15(3-2)=11/10\\), 분모는 \\(\\frac32(1-\\frac15)=6/5\\)가 되어 극한은 \\(11/12\\)예요. 그러므로 \\(p+q=12+11=23\\)이에요.","check":{"prompt":"분모의 극한값은 왜 \\(6/5\\)인가요?","answer":"\\(\\sin(3\\theta/2)/\\theta\\to3/2\\), \\(OR\\to1/5\\)이므로 \\((3/2)(4/5)=6/5\\)예요."}}],"takeaway":["도형의 교점을 먼저 정하면 넓이와 높이를 같은 길이로 표현할 수 있어요.","작은 각의 극한에서는 식 전체를 \\(\\theta\\)로 나눈 뒤 각 사인의 계수를 확인해요."]};</script>
