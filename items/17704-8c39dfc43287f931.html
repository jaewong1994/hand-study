<script>window.HandStudyGuide={"itemId":17704,"sourceHash":"00b426bc57ae44ef9319d26d284c8ead9ba8a8dd217ac2e610e267284eece932","contentHash":"a11d0146c8b4daa65b2e1fc07537b8d66cb9a5255a5598cbd889d08f402a5ce3","overview":{"goal":"비감소하는 다섯 함숫값을 중복조합으로 센 뒤 두 금지 조건을 차례로 빼요.","firstLook":"함수 하나는 \\(f(1)\\le\\cdots\\le f(5)\\)인 수열 하나와 같아요. 먼저 전체를 세고 위반 집합을 빼면 겹침을 관리하기 쉬워요.","conditions":[{"label":"(가)","meaning":"다섯 함숫값은 \\(1,\\dots,5\\)에서 중복을 허용해 비감소하게 골라요."},{"label":"(나)","meaning":"\\(f(2)=1\\)인 경우와 \\(f(4)f(5)\\ge20\\)인 경우를 제외해요."}]},"chapters":[{"id":"c1","label":"전체와 첫 금지 조건을 세어요","stepIds":["s1","s2","s3","s4"],"question":"\\(f(2)=1\\)이면 왜 \\(f(1)\\)도 반드시 \\(1\\)일까요?","hint":"\\(1\\le f(1)\\le f(2)=1\\)을 써요.","explanation":"(가)는 \\(f(1)\\le f(2)\\le f(3)\\le f(4)\\le f(5)\\)라는 뜻이에요. 값 \\(1,\\dots,5\\)에서 다섯 개를 중복 허용해 고르면 전체는 \\({}_5\\mathrm H_5={}_9\\mathrm C_5=126\\)개예요. \\(f(2)=1\\)이면 \\(f(1)=1\\)도 강제되고, 뒤 세 값만 \\(1,\\dots,5\\)에서 비감소하게 고르므로 \\({}_5\\mathrm H_3={}_7\\mathrm C_3=35\\)개예요. 따라서 \\(f(2)\\ne1\\)인 경우는 \\(126-35=91\\)개예요.","check":{"prompt":"\\(f(2)=1\\)인 경우에 자유롭게 고르는 함숫값은 어느 세 개인가요?","answer":"\\(f(3),f(4),f(5)\\) 세 값이고 \\(1\\)부터 \\(5\\)까지에서 비감소하게 골라요."}},{"id":"c2","label":"곱 조건을 어기는 끝의 두 값을 찾아요","stepIds":["s5"],"question":"\\(f(4)\\le f(5)\\le5\\)에서 곱이 \\(20\\) 이상인 순서쌍은 왜 두 개뿐일까요?","hint":"\\(f(4)\\le3\\)이면 가능한 가장 큰 곱부터 확인해요.","explanation":"\\(f(4)\\le3\\)이면 \\(f(5)\\le5\\)라 곱은 많아야 \\(15\\)예요. \\(f(4)=4\\)이면 곱이 \\(20\\) 이상이 되려면 \\(f(5)=5\\)여야 하고, \\(f(4)=5\\)이면 순서 때문에 \\(f(5)=5\\)예요. 따라서 위반 순서쌍은 \\((4,5)\\), \\((5,5)\\)뿐이에요.","check":{"prompt":"\\((4,4)\\)를 위반 경우로 세지 않는 이유는 무엇인가요?","answer":"곱이 \\(16\\)이라 \\(20\\) 이상이 아니기 때문이에요."}},{"id":"c3","label":"첫 조건까지 지킨 위반 경우만 빼요","stepIds":["s6","s7","s8"],"question":"끝 두 값이 고정됐을 때 왜 \\(f(2)=1\\)인 경우를 다시 빼야 할까요?","hint":"앞에서 남긴 \\(91\\)개는 이미 \\(f(2)\\ne1\\)인 경우만 모은 집합이에요.","explanation":"끝이 \\((4,5)\\)이면 앞 세 값은 \\(1,\\dots,4\\)에서 비감소하게 골라 \\({}_4\\mathrm H_3=20\\)개예요. 이 중 \\(f(2)=1\\)이면 \\(f(1)=1\\)이고 \\(f(3)\\)만 \\(1,\\dots,4\\)의 네 값이라 \\(4\\)개이므로 실제 위반은 \\(16\\)개예요. 끝이 \\((5,5)\\)이면 전체 \\({}_5\\mathrm H_3=35\\)개에서 같은 방식의 다섯 개를 빼 \\(30\\)개예요. 두 끝쌍은 겹치지 않으므로 답은 \\(91-16-30=45\\)예요.","check":{"prompt":"\\((5,5)\\)에서 빼는 다섯 경우는 어떻게 생기나요?","answer":"\\(f(1)=f(2)=1\\)이고 \\(f(3)\\)가 \\(1,2,3,4,5\\) 중 하나인 다섯 경우예요."}}],"takeaway":["단조 함수의 개수는 함숫값을 비감소 수열로 바꾸어 중복조합으로 세어요.","곱 조건처럼 끝값에 걸린 제한은 가능한 순서쌍을 먼저 완전히 나열해요.","이미 한 조건을 적용한 집합에서 빌 때는 뺄 집합도 그 조건을 지키도록 다시 제한해요."]};</script>
