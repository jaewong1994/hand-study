<script>window.HandStudyRecord={"itemId":16931,"sourceLabel":"2020 평가원 고3 수리나형 6월 30번","adminYear":2020,"grade":3,"month":6,"number":30,"track":"수리나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"이차함수 $f(x)$는 $x=-1$에서 극대이고, 삼차함수 $g(x)$는 이차항의 계수가 $0$이다. 함수\n $h(x)= {\\begin{cases}f(x) _{{}_{{}_{}}}&(x{\\leq}0) _{{}_{{}_{}}} \\\\ g(x) ^{{}^{{}^{}}} \\,&(x>0) ^{{}^{{}^{}}}\\end{cases}}$\n이 실수 전체의 집합에서 미분가능하고 다음 조건을 만족시킬 때, $h'(-3)+h'(4)$의 값을 구하시오. [4점]\n(가) 방정식 $h(x)=h(0)$의 모든 실근의 합은 $1$이다.(나) 닫힌구간 $\\left[ -2,\\,3 \\right]$에서 함수 $h(x)$의 최댓값과 최솟값의 차는 $3+4 \\sqrt{3}$이다.","answer":"38","sourceHash":"229b520e2798006d65dd4af281b30419a5a6b9d058ac5bf3c28527b5d2c09f14","steps":[{"id":"s1","latex":"f(x)=-k(x+1)^2+c\\ (k>0),\\quad g(x)=bx^3+dx+e"},{"id":"s2","latex":"h\\text{가 }0\\text{에서 미분가능}\\Rightarrow e=c-k,\\ d=-2k"},{"id":"s3","latex":"x\\le0:\\quad h(x)=h(0)\\iff-kx(x+2)=0\\Rightarrow x=-2,0"},{"id":"s4","latex":"\\text{양의 실근 }r:\\quad -2+r=1\\Rightarrow r=3,\\quad9b=2k"},{"id":"s5","latex":"h(x)-h(0)=\\begin{cases}-kx(x+2)&x\\le0\\\\\\frac{2k}{9}x^3-2kx&x>0\\end{cases}"},{"id":"s6","latex":"[-2,3]\\text{에서 최댓값은 }k\\ (x=-1),\\quad\\text{최솟값은 }-\\frac{4k\\sqrt3}{3}\\ (x=\\sqrt3)"},{"id":"s7","latex":"k+\\frac{4k\\sqrt3}{3}=3+4\\sqrt3\\Rightarrow k=3,\\quad b=\\frac23"},{"id":"s8","latex":"h\\prime(-3)+h\\prime(4)=12+(2\\cdot4^2-6)=38"}],"diagram":null,"contentHash":"2e4f645b1b30811d298b7249dfcb76e024c113c4bdefcb6fc95509eb6bd7c4b9","questionHtml":"<p class=\"hp\">이차함수 <span class=\"heq\">\\(f(x)\\)<\/span>는 <span class=\"heq\">\\(x=-1\\)<\/span>에서 극대이고, <br>삼차함수 <span class=\"heq\">\\(g(x)\\)<\/span>는 이차항의 계수가 <span class=\"heq\">\\(0\\)<\/span>이다. 함수<\/p><p class=\"hp htall\">&emsp;<span class=\"heq\">\\(h(x)= {\\begin{cases}f(x) &(x{\\leq}0) \\\\ g(x) \\,&(x\\gt 0) \\end{cases}}\\)<\/span><\/p><p class=\"hp\">이 실수 전체의 집합에서 미분가능하고 다음 조건을 만족시킬 때, <span class=\"heq\">\\(h'(-3)+h'(4)\\)<\/span>의 값을 구하시오. <span class=\"hscore\">[4점]<\/span><\/p><p class=\"hp\"><div class=\"hbox\"><p class=\"hp\">(가) 방정식 <span class=\"heq\">\\(h(x)=h(0)\\)<\/span>의 모든 실근의 합은 <span class=\"heq\">\\(1\\)<\/span>이다.<\/p><p class=\"hp\">(나) 닫힌구간 <span class=\"heq\">\\(\\left[ -2,\\,3 \\right]\\)<\/span>에서 함수 <span class=\"heq\">\\(h(x)\\)<\/span>의 최댓값과 최솟값의 차는 <span class=\"heq\">\\(3+4 \\sqrt{3}\\)<\/span>이다.<\/p><\/div><\/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"b62741bf16d6b5b6678452a47e02860321f64b4a4063d18947f833cf0fcfd103"};</script>
<script>window.HandStudyGuide={"itemId":16931,"sourceHash":"229b520e2798006d65dd4af281b30419a5a6b9d058ac5bf3c28527b5d2c09f14","contentHash":"2e4f645b1b30811d298b7249dfcb76e024c113c4bdefcb6fc95509eb6bd7c4b9","overview":{"goal":"미분가능 조건과 실근의 합으로 조각함수를 정한 뒤, 구간의 최댓값과 최솟값 차로 계수를 구해요.","firstLook":"이차함수는 극대가 되는 점을 꼭짓점 꼴로, 삼차함수는 이차항이 없다는 조건을 반영해 써요. 이어서 \\(x=0\\)에서 함숫값과 미분계수를 맞춰요.","conditions":[{"label":"미분가능","meaning":"\\(x=0\\)에서 왼쪽과 오른쪽의 함숫값이 같고 미분계수도 같아요."},{"label":"실근의 합","meaning":"왼쪽 조각에서 이미 얻는 두 근과 오른쪽 조각의 양의 근을 모두 합하면 \\(1\\)이에요."},{"label":"구간의 변화량","meaning":"닫힌구간에서 끝점과 도함수가 \\(0\\)인 점의 함숫값을 비교해 최댓값과 최솟값을 정해요."}]},"chapters":[{"id":"c1","label":"두 조각의 계수를 연결해요","stepIds":["s1","s2"],"question":"\\(x=0\\)에서 미분가능하다는 조건은 계수 사이에 어떤 두 식을 만들까요?","hint":"먼저 \\(f(0)=g(0)\\), 다음에 \\(f'(0)=g'(0)\\)을 써요.","explanation":"\\(f\\)는 \\(x=-1\\)에서 극대이므로 \\(f(x)=-k(x+1)^2+c\\)로 둘 수 있고 \\(k>0\\)이에요. \\(g\\)는 이차항의 계수가 \\(0\\)인 삼차함수이므로 \\(g(x)=bx^3+dx+e\\)로 둬요.\n\n\\(x=0\\)에서 연속이어야 하므로 \\(f(0)=c-k=e=g(0)\\), 곧 \\(e=c-k\\)예요. 또 양쪽 미분계수가 같아야 하므로 \\(f'(0)=-2k=d=g'(0)\\), 곧 \\(d=-2k\\)예요. 이렇게 하면 두 조각의 상수항과 일차항이 같은 \\(k,c\\)로 연결돼요.","check":{"prompt":"연속 조건과 미분계수 조건에서 각각 얻는 식은 무엇인가요?","answer":"연속 조건에서 \\(e=c-k\\), 미분계수 조건에서 \\(d=-2k\\)를 얻어요."}},{"id":"c2","label":"실근의 합으로 오른쪽 근을 정해요","stepIds":["s3","s4","s5"],"question":"방정식 \\(h(x)=h(0)\\)의 양의 실근이 왜 \\(3\\)이어야 할까요?","hint":"\\(x\\le0\\)인 조각의 두 근을 먼저 찾고, 전체 실근의 합이 \\(1\\)임을 써요.","explanation":"\\(x\\le0\\)에서는\n\n\\(h(x)-h(0)=f(x)-f(0)=-k\\{(x+1)^2-1\\}=-kx(x+2)\\)\n\n이므로 근은 \\(x=-2,0\\)이에요. 오른쪽 조각에서는 \\(g(x)-g(0)=bx^3-2kx=x(bx^2-2k)\\)예요. \\(x=0\\)은 오른쪽 구간 \\(x>0\\)에 포함되지 않고, 양의 근을 \\(r\\)라 하면 전체 실근의 합은 \\(-2+0+r=1\\)이므로 \\(r=3\\)이에요. \\(b(3)^2-2k=0\\)에서 \\(9b=2k\\), 곧 \\(b=2k/9\\)를 얻어요. 따라서\n\n\\(h(x)-h(0)=\\begin{cases}-kx(x+2)&(x\\le0)\\\\ \\frac{2k}{9}x^3-2kx&(x>0)\\end{cases}\\)\n\n로 정리돼요.","check":{"prompt":"오른쪽 조각의 양의 근이 두 개가 아니라 하나인 이유는 무엇인가요?","answer":"\\(x>0\\)에서 \\(x(bx^2-2k)=0\\)의 해는 \\(x=\\sqrt{2k/b}\\) 하나이고, 음의 제곱근과 \\(0\\)은 오른쪽 구간에 들어가지 않아요."}},{"id":"c3","label":"구간의 최댓값과 최솟값을 찾아요","stepIds":["s6"],"question":"\\([-2,3]\\)에서 가장 큰 값과 가장 작은 값은 각각 어디에서 나올까요?","hint":"공통으로 더해진 \\(h(0)\\)은 값의 차에 영향을 주지 않으므로 \\(h(x)-h(0)\\)을 비교해요.","explanation":"왼쪽 조각 \\(-kx(x+2)=-k(x+1)^2+k\\)는 \\(x=-1\\)에서 \\(k\\), 양 끝 \\(-2,0\\)에서 \\(0\\)이에요. 오른쪽 조각을 \\(u(x)=\\frac{2k}{9}x^3-2kx\\)라 하면\n\n\\(u'(x)=\\frac{2k}{3}x^2-2k=\\frac{2k}{3}(x^2-3)\\)\n\n이므로 \\(0<x<\\sqrt3\\)에서 감소하고 \\(\\sqrt3<x\\le3\\)에서 증가해요. 따라서 오른쪽의 최솟값은\n\n\\(u(\\sqrt3)=\\frac{2k}{9}(3\\sqrt3)-2k\\sqrt3=-\\frac{4k\\sqrt3}{3}\\)\n\n이고, \\(u(3)=0\\)이에요. 전체 구간의 최댓값은 왼쪽의 \\(k\\), 최솟값은 오른쪽의 \\(-4k\\sqrt3/3\\)예요.","check":{"prompt":"오른쪽 조각이 \\(x=\\sqrt3\\)에서 최솟값을 갖는다는 부호 근거는 무엇인가요?","answer":"도함수 \\(\\frac{2k}{3}(x^2-3)\\)가 \\(0<x<\\sqrt3\\)에서 음수, \\(x>\\sqrt3\\)에서 양수라서 감소하다 증가해요."}},{"id":"c4","label":"무리수 부분까지 맞춰 계수를 구해요","stepIds":["s7"],"question":"\\(k+4k\\sqrt3/3=3+4\\sqrt3\\)에서 \\(k\\)는 어떻게 정해질까요?","hint":"왼쪽을 \\(k(1+4\\sqrt3/3)\\)로 묶고 오른쪽도 같은 꼴로 바꿔요.","explanation":"최댓값과 최솟값의 차는\n\n\\(k-(-4k\\sqrt3/3)=k+4k\\sqrt3/3\\)\n\n이에요. 주어진 값은 \\(3+4\\sqrt3=3(1+4\\sqrt3/3)\\)이므로 \\(k=3\\)이에요. 앞에서 얻은 \\(9b=2k\\)에 넣으면 \\(b=2/3\\)이에요.","check":{"prompt":"\\(k=3\\)을 원래 차에 넣으면 어떤 값이 되나요?","answer":"\\(3+4\\cdot3\\sqrt3/3=3+4\\sqrt3\\)가 되어 조건과 정확히 일치해요."}},{"id":"c5","label":"두 미분계수를 직접 계산해요","stepIds":["s8"],"question":"\\(-3\\)과 \\(4\\)는 각각 어느 조각의 도함수에 넣어야 할까요?","hint":"\\(-3\\le0\\)에는 \\(f'\\), \\(4>0\\)에는 \\(g'\\)를 사용해요.","explanation":"\\(k=3\\)이므로 \\(f'(x)=-2k(x+1)=-6(x+1)\\)이고 \\(f'(-3)=12\\)예요. 또 \\(b=2/3\\), \\(d=-6\\)이므로 \\(g'(x)=3bx^2+d=2x^2-6\\)이고 \\(g'(4)=32-6=26\\)이에요. 따라서\n\n\\(h'(-3)+h'(4)=12+26=38\\)\n\n로 원문 정답과 일치해요.","check":{"prompt":"마지막 두 미분계수와 그 합은 각각 얼마인가요?","answer":"\\(h'(-3)=12\\), \\(h'(4)=26\\)이므로 합은 \\(38\\)이에요."}}],"takeaway":["조각함수의 미분가능 조건은 경계에서 함숫값과 미분계수를 각각 맞춰 써요.","방정식의 실근 합을 쓸 때 각 조각의 정의역에 실제로 들어가는 근만 세어요.","닫힌구간의 최댓값과 최솟값은 끝점과 도함수가 \\(0\\)인 점을 모두 비교해 정해요."]};</script>
