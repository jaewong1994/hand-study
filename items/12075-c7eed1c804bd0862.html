<script>window.HandStudyRecord={"itemId":12075,"sourceLabel":"2024 교육청 고1 수학 9월 26번","adminYear":2024,"grade":1,"month":9,"number":26,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 좌표평면 위에 직선 $l _{1} \\,:\\,x-2y-2=0\\,$과 평행하고 $y\\,$절편이 양수인 직선 $l_{2}\\,$가 있다. 직선 $l_{1}\\,$이 $x\\,$축, $y\\,$축과 만나는 점을 각각 $A$, ${{B}} \\,$라 하고 직선 $l _{2}\\,$가 $x\\,$축, $y\\,$축과 만나는 점을 각각 $C$, ${{D}} \\,$라 할 때, 사각형 $ADCB\\,$의 넓이가 $25\\,$이다. 두 직선 $l _{1}\\,$과 $l _{2}$ 사이의 거리를 $d\\,$라 할 때, $d^{2}\\,$의 값을 구하시오. [4점]","answer":"20","sourceHash":"6cb95d87ea2d0a79a67b213c434cb58e0ce7b9f2ba48f86b32be6a2e33530415","steps":[{"id":"s1","latex":"l_1:x-2y=2,\\quad l_2:x-2y=t,\\quad t\u003c0"},{"id":"s2","latex":"A=(2,0),\\ B=(0,-1),\\ C=(t,0),\\ D=\\left(0,-\\frac t2\\right)"},{"id":"s3","latex":"[ADCB]=\\frac12(2-t)\\left(1-\\frac t2\\right)=\\frac{(2-t)^2}{4}=25"},{"id":"s4","latex":"t\u003c0\\Rightarrow t=-8"},{"id":"s5","latex":"d^2=\\frac{(2-t)^2}{1^2+(-2)^2}=\\frac{100}{5}=20"}],"diagram":null,"contentHash":"b15b56e5f95618591bf6d29430d36453fc61e47029d5594e09dc41930c6bbab8","questionHtml":"\u003cp class=\"hp\">그림과 같이 좌표평면 위에 직선 \u003cspan class=\"heq\">\\(l_{1} \\,:\\,x-2y-2=0\\,\\)\u003c/span>과 평행하고 \u003cspan class=\"heq\">\\(y\\,\\)\u003c/span>절편이 양수인 직선 \u003cspan class=\"heq\">\\(l_{2}\\,\\)\u003c/span>가 있다. 직선 \u003cspan class=\"heq\">\\(l_{1}\\,\\)\u003c/span>이 \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>축, \u003cspan class=\"heq\">\\(y\\,\\)\u003c/span>축과 만나는 점을 각각 \u003cspan class=\"heq\">\\(A\\)\u003c/span>, \u003cspan class=\"heq\">\\({{B}} \\,\\)\u003c/span>라 하고 직선 \u003cspan class=\"heq\">\\(l_{2}\\,\\)\u003c/span>가 \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>축, \u003cspan class=\"heq\">\\(y\\,\\)\u003c/span>축과 만나는 점을 각각 \u003cspan class=\"heq\">\\(C\\)\u003c/span>, \u003cspan class=\"heq\">\\({{D}} \\,\\)\u003c/span>라 할 때, 사각형 \u003cspan class=\"heq\">\\(ADCB\\,\\)\u003c/span>의 넓이가 \u003cspan class=\"heq\">\\(25\\,\\)\u003c/span>이다. 두 직선 \u003
