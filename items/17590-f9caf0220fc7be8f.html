<script>window.HandStudyRecord={"itemId":17590,"sourceLabel":"2023 교육청 고3 수학기하 3월 30번","adminYear":2023,"grade":3,"month":3,"number":30,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 두 초점이 $F ( c,\\,0 )$, $F' ( -c,\\,0 ) \\,$$( c>0 )\\,$인 타원 $C\\,$가 있다. 타원 $C\\,$가 두 직선 $x=c$, $x= -c\\,$와 만나는 점 중 $y\\,$좌표가 양수인 점을 각각 $A$, $B\\,$라 하자. 두 초점이 $A$, $B\\,$이고 점 $F\\,$를 지나는 쌍곡선이 직선 $x=c\\,$와 만나는 점 중 $F\\,$가 아닌 점을 $P\\,$라 하고, 이 쌍곡선이 두 직선 $B F$, $B P\\,$와 만나는 점 중 $x\\,$좌표가 음수인 점을 각각 $Q$, $R\\,$라 하자. 세 점 $P$, $Q$, $R\\,$가 다음 조건을 만족시킨다.\n(가) 삼각형 $P\\,$는 정삼각형이다. (나) 타원 $C\\,$의 장축의 길이와 삼각형 $BQR\\,$의 둘레의 길이의 차는 $3\\,$이다.\n$60 \\times \\overline{ AF} \\,$의 값을 구하시오. [4점]","answer":"100","sourceHash":"60ac07853258755dae903310e604931386a7302f00c6690717839fedf4a1adb5","steps":[{"id":"s1","latex":"AF=a,\\quad BQ=b"},{"id":"s2","latex":"A\\text{는 }PF\\text{의 중점},\\quad BF=PF=2a"},{"id":"s3","latex":"\\text{타원의 장축}=BF+BF'=BF+AF=3a"},{"id":"s4","latex":"\\text{직선 }AB\\text{에 대칭}:\\ BQ=BR,\\quad \\angle QBR=60^\\circ\\Rightarrow BQ=QR=RB"},{"id":"s5","latex":"\\triangle BQR\\text{의 둘레}=3b,\\quad 3a-3b=3\\Rightarrow b=a-1"},{"id":"s6","latex":"AQ-BQ=BF-AF=a\\Rightarrow AQ=a+b=2a-1"},{"id":"s7","latex":"QF=BF-BQ=2a-b=a+1"},{"id":"s8","latex":"\\angle AFQ=60^\\circ"},{"id":"s9","latex":"(2a-1)^2=a^2+(a+1)^2-2a(a+1)\\cos60^\\circ"},{"id":"s10","latex":"a(3a-5)=0\\Rightarrow a=\\frac53"},{"id":"s11","latex":"60\\,AF=60a=\\boxed{100}"}],"diagram":null,"contentHash":"e4680b33116240a14a9dfa1fdc41d3360de2a047c926cb275179c960d741146d","questionHtml":"\u003cp class=\"hp\">그림과 같이 두 초점이 \u003cspan class=\"heq\">\\(F ( c,\\,0 )\\)\u003c/span>, \u003cspan class=\"heq\">\\(F' ( -c,\\,0 ) \\,\\)\u003c/span>\u003cspan class=\"heq\">\\(( c\\gt 0 )\\,\\)\u003c/span>인 타원 \u003cspan class=\"heq\">\\(C\\,\\)\u003c/span>가 있다. 타원 \u003cspan class=\"heq\">\\(C\\,\\)\u003c/span>가 두 직선 \u003cspan class=\"heq\">\\(x=c\\)\u003c/span>, \u003cspan class=\"heq\">\\(x= -c\\,\\)\u003c/span>와 만나는 점 중 \u003cspan class=\"heq\">\\(y\\,\\)\u003c/span>좌표가 양수인 점을 각각 \u003cspan class=\"heq\">\\(A\\)\u003c/span>, \u003cspan class=\"heq\">\\(B\\,\\)\u003c/span>라 하자.\u003cbr>두 초점이 \u003cspan class=\"heq\">\\(A\\)\u003c/span>, \u003cspan class=\"heq\">\\(B\\,\\)\u003c/span>이고 점 \u003cspan class=\"heq\">\\(F\\,\\)\u003c/span>를 지나는 쌍곡선이 직선 \u003cspan class=\"heq\">\\(x=c\\,\\)\u003c/span>와 만나는 점 중 \u003cspan class=\"heq\">\\(F\\,\\)\u003c/span>가 아닌 점을 \u003cspan class=\"heq\">\\(P\\,\\)\u003c/span>라 하고, 이 쌍곡선이 두 직선 \u003cspan class=\"heq\">\\(B F\\)\u003c/span>, \u003cspan class=\"heq\">\\(B P\\,\\)\u003c/span>와 만나는 점 중 \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>좌표가 음수인 점을 각각 \u003cspan class=\"heq\">\\(Q\\)\u003c/span>, \u003cspan class=\"heq\">\\(R\\,\\)\u003c/span>라 하자.\u003cbr>세 점 \u003cspan class=\"heq\">\\(P\\)\u003c/span>, \u003cspan class=\"heq\">\\(Q\\)\u003c/span>, \u003cspan class=\"heq\">\\(R\\,\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) 삼각형 \u003cspan class=\"heq\">\\(BFP\\,\\)\u003c/span>는 정삼각형이다.\u003c/p>\u003cp class=\"hp\">(나)타원 \u003cspan class=\"heq\">\\(C\\,\\)\u003c/span>의 장축의 길이와 삼각형 \u003cspan class=\"heq\">\\(BQR\\,\\)\u003c/span>의 둘레의 길이의 차는 \u003cspan class=\"heq\">\\(3\\,\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp class=\"hp htall\">\u003cspan class=\"heq\">\\(60 \\times \\overline{AF} \\,\\)\u003c/span>의 값을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/caa6237edaff7df061933e99.png\" style=\"width:416px;max-width:100%\">\u003c/p>","preview":false,"graphPlan":{"itemId":17590,"sourceHash":"60ac07853258755dae903310e604931386a7302f00c6690717839fedf4a1adb5","contentHash":"e4680b33116240a14a9dfa1fdc41d3360de2a047c926cb275179c960d741146d","version":1,"title":"타원 초점선과 정삼각형 BQR의 실제 배치","bounds":[-2,2,-0.5,4],"aspect":"equal","stages":[{"stepId":"s4","title":"대칭에서 BQR이 정삼각형","layers":[{"id":"BQR-unit","type":"polygon","points":[[0,1],[0.8660254037844386,0.5],[0.8660254037844386,1.5]],"color":"teal"},{"id":"B-unit","type":"point","x":0,"y":1,"text":"B","color":"teal"},{"id":"Q-unit","type":"point","x":0.8660254037844386,"y":0.5,"text":"Q","color":"teal"},{"id":"R-unit","type":"point","x":0.8660254037844386,"y":1.5,"text":"R","color":"teal"},{"id":"unit","type":"label","x":-0.2,"y":2.1,"text":"정삼각형 BQR 정규화","color":"navy"}]},{"stepId":"s10","title":"AF=5/3, BQ=2/3을 반영","layers":[{"id":"AB","type":"polyline","points":[[1.4433756729740643,1.6666666666666667],[-1.4433756729740643,1.6666666666666667]],"color":"muted"},{"id":"PF","type":"polyline","points":[[1.4433756729740643,3.3333333333333335],[1.4433756729740643,0]],"color":"navy"},{"id":"PQ","type":"polyline","points":[[1.4433756729740643,3.3333333333333335],[-0.8660254037844386,1.3333333333333333]],"color":"teal"},{"id":"PR","type":"polyline","points":[[1.4433756729740643,3.3333333333333335],[-0.8660254037844386,2]],"color":"teal"},{"id":"BQR","type":"polygon","points":[[-1.4433756729740643,1.6666666666666667],[-0.8660254037844386,1.3333333333333333],[-0.8660254037844386,2]],"color":"amber"},{"id":"BF","type":"polyline","points":[[-1.4433756729740643,1.6666666666666667],[1.4433756729740643,0]],"color":"navy"},{"id":"F","type":"point","x":1.4433756729740643,"y":0,"text":"F","color":"teal"},{"id":"F1","type":"point","x":-1.4433756729740643,"y":0,"text":"F'","color":"teal"},{"id":"A","type":"point","x":1.4433756729740643,"y":1.6666666666666667,"text":"A","color":"teal"},{"id":"B","type":"point","x":-1.4433756729740643,"y":1.6666666666666667,"text":"B","color":"teal"},{"id":"P","type":"point","x":1.4433756729740643,"y":3.3333333333333335,"text":"P","color":"teal"},{"id":"Q","type":"point","x":-0.8660254037844386,"y":1.3333333333333333,"text":"Q","color":"teal"},{"id":"R","type":"point","x":-0.8660254037844386,"y":2,"text":"R","color":"teal"}]}],"graphHash":"5c4551d72a0cc91e221bda1522b948ab4d63d07e623c3f39322b4e16a5b546e9"},"graphHash <script>window.HandStudyGuide={"itemId":17590,"sourceHash":"60ac07853258755dae903310e604931386a7302f00c6690717839fedf4a1adb5","contentHash":"e4680b33116240a14a9dfa1fdc41d3360de2a047c926cb275179c960d741146d","overview":{"goal":"타원과 쌍곡선의 거리 정의, 두 정삼각형의 관계를 길이 두 개로 정리하여 AF를 구합니다.","firstLook":"그림에서 A는 PF의 중점이고 BQR은 정삼각형입니다. 이 두 사실을 확인하면 모든 길이를 a와 b로 나타낼 수 있습니다.","conditions":[{"label":"정삼각형 조건","meaning":"삼각형 BFP의 세 변이 같아 A의 위치와 각의 크기가 정해집니다."},{"label":"장축과 둘레의 차","meaning":"타원의 장축과 정삼각형 BQR의 둘레를 비교해 두 길이 사이의 식을 얻습니다."}]},"chapters":[{"id":"c1","label":"그림의 길이를 두 문자로 정리합니다","stepIds":["s1","s2","s3"],"question":"왜 A가 PF의 중점이고 타원의 장축이 \\(3a\\)인가요?","hint":"\\(AF=a\\), 정삼각형의 변과 타원의 초점 거리 합을 보세요.","explanation":"\\(AF=a\\), \\(BQ=b\\)라 둡니다. 초점이 A, B인 쌍곡선은 직선 \\(AB\\)에 대하여 대칭이고, 직선 \\(x=c\\) 위의 두 교점 F, P는 서로 대칭입니다. 따라서 A는 \\(PF\\)의 중점이고 \\(AB\\perp PF\\)입니다. 정삼각형 \\(BFP\\)의 한 변이 \\(PF=2AF=2a\\)이므로 \\(BF=2a\\)입니다. 타원 위의 B에 대해 두 초점까지 거리의 합은 장축의 길이이고, 좌우 대칭인 두 수직선에서 \\(BF'=AF=a\\)이므로 장축은 \\(BF+BF'=2a+a=3a\\)입니다.","check":{"prompt":"장축을 \\(BF+BF'\\)로 계산할 수 있는 이유는 무엇인가요?","answer":"타원 위의 점에서 두 초점까지 거리의 합이 장축의 길이와 같기 때문입니다."}},{"id":"c2","label":"쌍곡선의 대칭으로 둘레를 구합니다","stepIds":["s4","s5","s6","s7","s8"],"question":"왜 BQR이 정삼각형이며 Q와 관련된 세 길이는 어떻게 되나요?","hint":"쌍곡선은 두 초점 A, B를 잇는 직선에 대하여 대칭입니다.","explanation":"직선 \\(AB\\)에 대한 대칭으로 \\(BQ=BR\\)이고, 두 직선 \\(BF\\), \\(BP\\)가 이루는 각이 \\(60^\\circ\\)이므로 \\(BQR\\)은 정삼각형입니다. 따라서 둘레는 \\(3b\\)이고 \\(3a-3b=3\\)에서 \\(b=a-1\\)입니다. 쌍곡선의 거리 차는 F에서 \\(BF-AF=a\\)이므로 Q에서도 \\(AQ-BQ=a\\)입니다. 이에 따라 \\(AQ=a+b=2a-1\\), \\(QF=BF-BQ=2a-b=a+1\\)입니다. 정삼각형에서 \\(\\angle AFQ=60^\\circ\\)입니다.","check":{"prompt":"쌍곡선의 거리 차가 Q에서도 a인 이유는 무엇인가요?","answer":"같은 쌍곡선 위의 모든 점에서 두 초점 A, B까지 거리의 차의 절댓값이 일정하고, 점 F에서 그 값이 \\(BF-AF=a\\)이기 때문입니다."}},{"id":"c3","label":"삼각형에서 a를 결정합니다","stepIds":["s9","s10","s11"],"question":"세 변과 끼인각으로 어떤 방정식을 세우나요?","hint":"삼각형 AFQ에 코사인법칙을 적용하세요.","explanation":"삼각형 \\(AFQ\\)에서 \\(AF=a\\), \\(FQ=a+1\\), \\(AQ=2a-1\\), \\(\\angle AFQ=60^\\circ\\)입니다. 따라서 \\((2a-1)^2=a^2+(a+1)^2-2a(a+1)\\cos60^\\circ\\)이고 정리하면 \\(a(3a-5)=0\\)입니다. 길이이므로 \\(a>0\\), 따라서 \\(a=5/3\\)이고 \\(60AF=100\\)입니다.","check":{"prompt":"방정식의 근 0을 제외하는 이유는 무엇인가요?","answer":"a는 선분 AF의 길이이고 타원의 초점과 점이 서로 달라 양수이기 때문입니다."}}],"takeaway":["타원과 쌍곡선에서는 정의에 들어 있는 거리의 합과 차를 같은 문자로 연결합니다.","대칭과 정삼각형 조건으로 각을 정한 뒤 코사인법칙으로 길이를 결정합니다."]};</script>
