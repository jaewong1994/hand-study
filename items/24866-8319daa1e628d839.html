\\overline{ AD }} \\times {\\overline{ CD }} =9$, $\\angle BAC = \\frac{\\pi }{3}$\n인 사각형 $ABCD$가 있다. 삼각형 ${{ABC}}$의 넓이를 $S_{1}$, 삼각형 ${{ACD}}$의 넓이를 $S_{2}$라 하고, 삼각형 ${{ACD}}$의 외접원의 반지름의 길이를 $R$이라 하자. $S _{2} = \\frac{5}{6} S _{1}$일 때, $\\frac{R}{\\sin\\, \\left( \\angle ADC \\right)}$의 값은? [4점]\n① $\\frac{54}{25}$ ② $\\frac{117}{50}$ ③ $\\frac{63}{25}$ ④ $\\frac{27}{10}$ ⑤ $\\frac{72}{25}$","sourceHash":"e4d8d8d38f7722c5535d1ca7f90a1a390e231602f81da258562bc28fc61c5ac3","sourceKind":"csat","sourceLabel":"2023년 시행 수능 · 2024학년도 · 공통 · 13번","steps":[{"id":"s1","latex":"AC=x\\text{라 하면 }13=3^{2}+x^{2}-2\\cdot3x\\cos\\frac\\pi3"},{"id":"s2","latex":"x^{2}-3x-4=0,\\ x>0\\Rightarrow AC=4"},{"id":"s3","latex":"S_1=\\frac12\\cdot3\\cdot4\\sin\\frac\\pi3=3\\sqrt3"},{"id":"s4","latex":"S_2=\\frac56S_1=\\frac{5\\sqrt3}{2}"},{"id":"s5","latex":"\\theta=\\angle ADC\\text{라 하면 }S_2=\\frac12\\,AD\\cdot CD\\sin\\theta=\\frac92\\sin\\theta"},{"id":"s6","latex":"\\sin\\theta=\\frac{5\\sqrt3}{9}"},{"id":"s7","latex":"\\frac{AC}{\\sin\\theta}=2R\\Rightarrow R=\\frac{18}{5\\sqrt3}"},{"id":"s8","latex":"\\frac{R}{\\sin\\theta}=\\frac{18}{5\\sqrt3}\\cdot\\frac9{5\\sqrt3}=\\frac{54}{25}"},{"id":"s9","latex":"\\therefore\\ \\boxed{\\frac{54}{25}}\\;(①)"}],"track":"공통"};</script>
