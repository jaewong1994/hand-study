<script>window.HandStudyRecord={"itemId":17878,"sourceLabel":"2024 교육청 고3 수학기하 3월 30번","adminYear":2024,"grade":3,"month":3,"number":30,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 두 점 $F \\left(c,\\, 0 \\right)\\,$, $F ' \\left( -c,\\,0 \\right) \\, \\left( c>0 \\right)\\,$을 초점으로 하고 주축의 길이가 $6\\,$인 쌍곡선이 있다. 이 쌍곡선이 선분 $FF ' \\,$을 지름으로 하는 원과 제$1\\,$사분면에서 만나는 점을 ${{P}} \\,$라 하자. 선분 ${{F}} ' {{P}} \\,$가 쌍곡선과 만나는 점 중 점 ${{P}} \\,$가 아닌 점을 ${{Q}} \\,$라 하고, 선분 ${{FQ}} \\,$가 쌍곡선과 만나는 점 중 점 ${{Q}} \\,$가 아닌 점을 ${{R}} \\,$라 하자. 점 ${{Q}} \\,$가 선분 $F ' P \\,$를 $1\\,:\\,2\\,$로 내분할 때, 삼각형 $QF ' R \\,$의 넓이를 $S\\,$라 하자. $20S\\,$의 값을 구하시오. [4점]","answer":"150","sourceHash":"1b179f92b31c40e9e1419ee4ffc37153a8417e5b964ec2a6cfc257bcb7bdbbf1","steps":[{"id":"s1","latex":"F\\prime Q=u,\\quad F\\prime P=3u,\\quad PQ=2u"},{"id":"s2","latex":"PF=3u-6,\\quad QF=u+6,\\quad\\angle F\\prime PF=90^\\circ"},{"id":"s3","latex":"(u+6)^2=(2u)^2+(3u-6)^2\\Rightarrow u(u-4)=0\\Rightarrow u=4"},{"id":"s4","latex":"PF=6,\\quad QF=10,\\quad FF\\prime=6\\sqrt5"},{"id":"s5","latex":"\\triangle QFF\\prime\\text{의 넓이}=\\frac{F\\prime Q}{F\\prime P}\\cdot\\frac12 F\\prime P\\cdot PF=12"},{"id":"s6","latex":"QR=v\\Rightarrow RF=10-v,\\quad RF\\prime=RF+6=16-v"},{"id":"s7","latex":"\\cos\\angle F\\prime QF=\\frac{4^2+10^2-(6\\sqrt5)^2}{2\\cdot4\\cdot10}=-\\frac45"},{"id":"s8","latex":"(16-v)^2=4^2+v^2-2\\cdot4v\\left(-\\frac45\\right)\\Rightarrow v=25/4"},{"id":"s9","latex":"S=\\frac{QR}{QF}\\cdot12=\\frac{15}{2}\\Rightarrow20S=150"}],"diagram":null,"contentHash":"9d0bbdad1178a8be5c4a3d003d00e437e343e44f93499c5ee8fef759e410335d","questionHtml":"\u003cp class=\"hp\">그림과 같이 두 점 \u003cspan class=\"heq\">\\(F \\left(c,\\, 0 \\right)\\,\\)\u003c/span>, \u003cspan class=\"heq\">\\(F' \\left( -c,\\,0 \\right) \\, \\left( c\\gt 0 \\right)\\,\\)\u003c/span>을 초점으로 하고 주축의 길이가 \u003cspan class=\"heq\">\\(6\\,\\)\u003c/span>인 쌍곡선이 있다. 이 쌍곡선이 선분 \u003cspan class=\"heq\">\\(FF' \\,\\)\u003c/span>을 지름으로 하는 원과 제\u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>사분면에서 만나는 점을 \u003cspan class=\"heq\">\\({{P}} \\,\\)\u003c/span>라 하자. 선분 \u003cspan class=\"heq\">\\({{F}}' {{P}} \\,\\)\u003c/span>가 쌍곡선과 만나는 점 중 점 \u003cspan class=\"heq\">\\({{P}} \\,\\)\u003c/span>가 아닌 점을 \u003cspan class=\"heq\">\\({{Q}} \\,\\)\u003c/span>라 하고, 선분 \u003cspan class=\"heq\">\\({{FQ}} \\,\\)\u003c/span>가 쌍곡선과 만나는 점 중 점 \u003cspan class=\"heq\">\\({{Q}} \\,\\)\u003c/span>가 아닌 점을 \u003cspan class=\"heq\">\\({{R}} \\,\\)\u003c/span>라 하자. 점 \u003cspan class=\"heq\">\\({{Q}} \\,\\)\u003c/span>가 선분 \u003cspan class=\"heq\">\\(F' P \\,\\)\u003c/span>를 \u003cspan class=\"heq\">\\(1\\,:\\,2\\,\\)\u003c/span>로 내분할 때, 삼각형 \u003cspan class=\"heq\">\\(QF' R \\,\\)\u003c/span>의 넓이를 \u003cspan class=\"heq\">\\(S\\,\\)\u003c/span>라 하자. \u003cspan class=\"heq\">\\(20S\\,\\)\u003c/span>의 값을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/3042b18e7a6d1ef7ca4951dd.png\" style=\"width:282px;max-width:100%\">\u003c/p>","preview":false,"graphPlan":{"version":1,"itemId":17878,"sourceHash":"1b179f92b31c40e9e1419ee4ffc37153a8417e5b964ec2a6cfc257bcb7bdbbf1","contentHash":"9d0bbdad1178a8be5c4a3d003d00e437e343e44f93499c5ee8fef759e410335d","title":"초점거리와 Q,R의 실제 위치","bounds":[-9,9,-2,8],"aspect":"equal","stages":[{"stepId":"s4","title":"P와 내분점 Q","layers":[{"id":"FprimeF","type":"polyline","points":[[-6.708204,0],[6.708204,0]],"color":"navy","text":""},{"id":"FprimeP","type":"polyline","points":[[-6.708204,0],[4.024922,5.366563]],"color":"navy","text":""},{"id":"PF","type":"polyline","points":[[4.024922,5.366563],[6.708204,0]],"color":"teal","text":""},{"id":"Fprime","type":"point","x":-6.708204,"y":0,"text":"Fprime","color":"teal"},{"id":"F","type":"point","x":6.708204,"y":0,"text":"F","color":"teal"},{"id":"P","type":"point","x":4.024922,"y":5.366563,"text":"P","color":"teal"},{"id":"Q","type":"point","x":-3.130495,"y":1.788854,"text":"Q","color":"teal"}]},{"stepId":"s8","title":"QF 위의 R","layers":[{"id":"FprimeF","type":"polyline","points":[[-6.708204,0],[6.708204,0]],"color":"navy","text":""},{"id":"FprimeP","type":"polyline","points":[[-6.708204,0],[4.024922,5.366563]],"color":"navy","text":""},{"id":"PF","type":"polyline","points":[[4.024922,5.366563],[6.708204,0]],"color":"teal","text":""},{"id":"Fprime","type":"point","x":-6.708204,"y":0,"text":"Fprime","color":"teal"},{"id":"F","type":"point","x":6.708204,"y":0,"text":"F","color":"teal"},{"id":"P","type":"point","x":4.024922,"y":5.366563,"text":"P","color":"teal"},{"id":"Q","type":"point","x":-3.130495,"y":1.788854,"text":"Q","color":"teal"},{"id":"R","type":"point","x":3.018692,"y":0.67082,"text":"R","color":"teal"},{"id":"QF","type":"polyline","points":[[-3.130495,1.788854],[6.708204,0]],"color":"teal","text":""}]},{"stepId":"s9","title":"삼각형 QF'R","layers":[{"id":"FprimeF","type":"polyline","points":[[-6.708204,0],[6.708204,0]],"color":"navy","text":""},{"id":"FprimeP","type":"polyline","points":[[-6.708204,0],[4.024922,5.366563]],"color":"navy","text":""},{"id":"PF","type":"polyline","points":[[4.024922,5.366563],[6.708204,0]],"color":"teal","text":""},{"id":"Fprime","type":"point","x":-6.708204,"y":0,"text":"Fprime","color":"teal"},{"id":"F","type":"point","x":6.708204,"y":0,"text":"F","color":"teal"},{"id":"P","type":"point","x":4.024922,"y":5.366563,"text":"P","color":"teal"},{"id":"Q","type":"point","x":-3.130495,"y":1.788854,"text":"Q","color":"teal"},{"id":"R","type":"point","x":3.018692,"y":0.67082,"text":"R","color":"teal"},{"id":"QFprimeR","type":"polygon","points":[[-3.130495,1.788854],[-6.708204,0],[3.018692,0.67082]],"color":"amber","text":""}]}],"graphHash":"0d83621d613e13e26f16f004ac66b9adb02b3519a8f07ae68b1000c2d12b9b8f"},"graphHash":"0d83621d613e13e26f16f004ac66b9adb02b3519a8f07ae68b1000c2d12b9b8f","editionHash":"9f7973e8a5c2d48c99ea73d08b0a44c59bad91f003a720ea484df62e90acebac"};</script>
<script>window.HandStudyGuide={"itemId":17878,"sourceHash":"1b179f92b31c40e9e1419ee4ffc37153a8417e5b964ec2a6cfc257bcb7bdbbf1","contentHash":"9d0bbdad1178a8be5c4a3d003d00e437e343e44f93499c5ee8fef759e410335d","overview":{"goal":"쌍곡선의 초점 거리 차와 원의 직각 조건으로 길이를 정한 뒤 넓이비를 구해요.","firstLook":"Q가 F'P를 1:2로 나누므로 세 길이를 하나의 문자로 놓아요. P가 지름 FF'인 원 위에 있어 \\(\\angle F'PF=90^\\circ\\)예요.","conditions":[{"label":"쌍곡선","meaning":"오른쪽 가지에서는 두 초점까지 거리의 차가 주축 길이 \\(6\\)이에요."},{"label":"내분점","meaning":"\\(F'Q:QP=1:2\\)이므로 \\(F'P\\)를 세 등분한 길이로 표현해요."}]},"chapters":[{"id":"c1","label":"직각삼각형에서 길이를 정해요","stepIds":["s1","s2","s3","s4"],"question":"\\(u=F'Q\\)를 알면 P와 Q에서의 초점 거리가 어떻게 정해질까요?","hint":"\\(F'P=3u, PQ=2u\\)와 쌍곡선의 거리 차 \\(6\\)을 써요.","explanation":"\\(F'Q=u\\)라 두면 \\(F'P=3u, PQ=2u\\)예요. P는 오른쪽 가지에 있으므로 \\(PF=F'P-6=3u-6\\), Q는 왼쪽 가지에 있으므로 \\(QF=QF'+6=u+6\\)이에요. 지름 \\(FF'\\)인 원 위의 P에서 \\(\\angle F'PF=90^\\circ\\)이므로 삼각형 PQF에서도 P의 각이 직각이에요. 따라서 \\((u+6)^2=(2u)^2+(3u-6)^2\\), 즉 \\(u(u-4)=0\\)이에요. 길이이므로 \\(u=4\\), 따라서 \\(PF=6,QF=10,FF'=\\sqrt{6^2+12^2}=6\\sqrt5\\)예요.","check":{"prompt":"방정식의 해 \\(u=0\\)을 제외하는 이유는 무엇인가요?","answer":"\\(u=F'Q\\)는 서로 다른 두 점 사이의 길이이므로 양수여야 해요."}},{"id":"c2","label":"Q가 있는 삼각형의 넓이를 구해요","stepIds":["s5"],"question":"삼각형 QFF'의 넓이가 왜 삼각형 PFF'의 삼분의 일일까요?","hint":"Q와 P는 F'에서 같은 직선 위에 있고 \\(F'Q:F'P=1:3\\)이에요.","explanation":"두 삼각형 QFF'과 PFF'은 꼭짓점 Q,P가 같은 직선 F'P 위에 있어 밑변 FF'에 대한 높이의 비가 \\(F'Q:F'P=1:3\\)이에요. 삼각형 PFF'은 P에서 직각이므로 넓이가 \\(\\frac12\\cdot F'P\\cdot PF=\\frac12\\cdot12\\cdot6=36\\)이에요. 따라서 삼각형 QFF'의 넓이는 \\(36/3=12\\)예요.","check":{"prompt":"PFF'의 넓이를 계산할 때 서로 수직인 두 변은 무엇인가요?","answer":"\\(PF'=12\\)와 \\(PF=6\\)이에요."}},{"id":"c3","label":"두 번째 거리 차로 R을 정해요","stepIds":["s6","s7","s8"],"question":"\\(QR=v\\)일 때 \\(RF'=16-v\\)인 이유는 무엇인가요?","hint":"R은 오른쪽 가지이므로 \\(RF'-RF=6\\)이에요.","explanation":"R은 선분 QF 위에 있으므로 \\(RF=QF-QR=10-v\\)예요. 오른쪽 가지의 거리 차에서 \\(RF'=RF+6=16-v\\)예요. 삼각형 QFF'에서 코사인법칙을 쓰면 \\(\\cos\\angle F'QF=(4^2+10^2-(6\\sqrt5)^2)/(2\\cdot4\\cdot10)=-4/5\\)예요. 삼각형 QRF'에서 다시 코사인법칙을 쓰면 \\((16-v)^2=4^2+v^2-2\\cdot4v(-4/5)\\)이고, 풀면 \\(v=25/4\\)예요.","check":{"prompt":"R이 Q와 F 사이에 있는지 길이로 확인해 보세요.","answer":"\\(QR=25/4<10=QF\\)이므로 R은 선분 QF 안에 있어요."}},{"id":"c4","label":"같은 높이의 넓이비로 마무리해요","stepIds":["s9"],"question":"삼각형 QF'R의 넓이는 왜 \\(QR/QF\\)만큼일까요?","hint":"QF'을 공통 밑변으로 보면 R과 F의 높이비가 QR:QF예요.","explanation":"삼각형 QF'R과 QF'F는 밑변 QF'을 공유하고 R,F가 같은 직선 QF 위에 있으므로 높이의 비가 \\(QR:QF\\)예요. 따라서 \\(S=(25/4)/10\\cdot12=15/2\\)이고 \\(20S=150\\)이에요.","check":{"prompt":"최종 넓이와 요구값은 각각 얼마인가요?","answer":"\\(S=15/2\\), \\(20S=150\\)이에요."}}],"takeaway":["쌍곡선의 각 가지에서 어느 초점 거리가 더 큰지 그림과 함께 확인해요.","지름을 보는 원주각은 직각이므로 피타고라스 정리를 바로 연결할 수 있어요.","한 꼭짓점이 같은 직선 위를 움직이는 삼각형은 높이와 넓이가 같은 비로 바뀌어요."]};</script>
