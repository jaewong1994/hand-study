<script>window.HandStudyRecord={"itemId":17362,"sourceLabel":"2022 교육청 고3 수학기하 7월 30번","adminYear":2022,"grade":3,"month":7,"number":30,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"공간에서 중심이 $O\\,$이고 반지름의 길이가 $4\\,$인 구와 점 $O\\,$를 지나는 평면 $\\alpha\\,$가 있다. 평면 $\\alpha\\,$와 구가 만나서 생기는 원 위의 서로 다른 세 점 $A\\,$, $B\\,$, $C\\,$에 대하여 두 직선 $O A\\,$, $B C\\,$가 서로 수직일 때, 구 위의 점 $P\\,$가 다음 조건을 만족시킨다.\n(가) $\\angle PAO= \\frac{\\pi }{3}$\n(나) 점 $P\\,$의 평면 $\\alpha$ 위로의 정사영은 선분 $OA$ 위에 있다.\n$\\cos \\left( \\angle PAB \\right) = \\frac{\\sqrt{10}}{8}\\,$일 때, 삼각형 $PAB\\,$의 평면 $PAC\\,$ 위로의 정사영의 넓이를 $S\\,$라 하자. $30 \\times S^{2} \\,$의 값을 구하시오. (단, $0\u003c \\angle BAC\u003c \\frac{\\pi }{2}\\,$) [4점]","answer":"50","sourceHash":"3c4beeda5f89027d4fca27f58cef1604f51376be1ac14c170dc871a56459ae2a","steps":[{"id":"s1","latex":"\\triangle OAP\\text{는 정삼각형},\\quad AP=4,\\quad P'=\\operatorname{proj}_{\\alpha}P,\\ AP'=2,\\ PP'=2\\sqrt3"},{"id":"s2","latex":"N=OA\\cap BC,\\quad AN=m,\\quad AB^2=8m,\\quad NB^2=16-(4-m)^2"},{"id":"s3","latex":"PB^2=12+(m-2)^2+NB^2=4m+16"},{"id":"s4","latex":"\\cos\\angle PAB=\\frac{16+8m-(4m+16)}{8\\sqrt{8m}}=\\frac{\\sqrt{2m}}8=\\frac{\\sqrt{10}}8\\Rightarrow m=5"},{"id":"s5","latex":"F\\in PA,\\quad NF\\perp PA,\\quad NF=5\\sqrt3/2,\\ NB=\\sqrt{15}"},{"id":"s6","latex":"FB=FC=\\sqrt{NF^2+NB^2}=3\\sqrt{15}/2,\\quad FB,FC\\perp PA"},{"id":"s7","latex":"\\cos\\angle BFC=\\frac{2FB^2-BC^2}{2FB^2}=\\frac{135/2-60}{135/2}=1/9"},{"id":"s8","latex":"S=\\tfrac12 AP\\cdot FB\\cdot\\tfrac19=\\sqrt{15}/3\\Rightarrow30S^2=50"}],"diagram":null,"contentHash":"0bb2fdf27cde59a70005ac8ee699f7af891e49791a08fab14eb64588ec0f2bd3","questionHtml":"\u003cp class=\"hp\">공간에서 중심이 \u003cspan class=\"heq\">\\(O\\,\\)\u003c/span>이고 반지름의 길이가 \u003cspan class=\"heq\">\\(4\\,\\)\u003c/span>인 구와 점 \u003cspan class=\"heq\">\\(O\\,\\)\u003c/span>를 지나는 평면 \u003cspan class=\"heq\">\\(\\alpha\\,\\)\u003c/span>가 있다. 평면 \u003cspan class=\"heq\">\\(\\alpha\\,\\)\u003c/span )\u003c/span>\u003c/span>\u003cspan class=\"hfiglabel\" style=\"position:absolute;left:26.84%;top:36.38%;line-height:1;white-space:nowrap\">\u003cspan class=\"heq\">\\(A\\)\u003c/span>\u003c/span>\u003cspan class=\"hfiglabel\" style=\"position:absolute;left:33.85%;top:63.47%;line-height:1;white-space:nowrap\">\u003cspan class=\"heq\">\\(B\\)\u003c/span>\u003c/span>\u003cspan class=\"hfiglabel\" style=\"position:absolute;left:74.17%;top:49.28%;line-height:1;white-space:nowrap\">\u003cspan class=\"heq\">\\(C\\)\u003c/span>\u003c/span>\u003cspan class=\"hfiglabel\" style=\"position:absolute;left:44.83%;top:49.59%;line-height:1;white-space:nowrap\">\u003cspan class=\"heq\">\\(O\\)\u003c/span>\u003c/span>\u003cspan class=\"hfiglabel\" style=\"position:absolute;left:4.89%;top:61.35%;line-height:1;white-space:nowrap\">\u003cspan class=\"heq\">\\(\\alpha\\)\u003c/span>\u003c/span>\u003c/span>\u003c/p>","preview":false,"graphPlan":{"itemId":17362,"sourceHash":"3c4beeda5f89027d4fca27f58cef1604f51376be1ac14c170dc871a56459ae2a","contentHash":"0bb2fdf27cde59a70005ac8ee699f7af891e49791a08fab14eb64588ec0f2bd3","version":1,"title":"정삼각형 OAP와 투영에 쓰이는 BFC","bounds":[-1,7,-1,7],"aspect":"equal","stages":[{"stepId":"s1","title":"OAP 정삼각형과 P의 α-정사영","layers":[{"id":"OAP","type":"polygon","points":[[0,0],[4,0],[2,3.4641016151377544]],"color":"navy"},{"id":"PPp","type":"polyline","points":[[2,3.4641016151377544],[2,0]],"color":"teal"},{"id":"O","type":"point","x":0,"y":0,"text":"O","color":"teal"},{"id":"A","type":"point","x":4,"y":0,"text":"A","color":"teal"},{"id":"P","type":"point","x":2,"y":3.4641016151377544,"text":"P","color":"teal"},{"id":"Pp","type":"point","x":2,"y":0,"text":"P'","color":"teal"}]},{"stepId":"s7","title":"FB=FC=3√15/2, cos∠BFC=1/9","layers":[{"id":"BFC","type":"polygon","points":[[0,0],[5.809475019311126,0],[0.6454972243679028,5.773502691896258]],"color":"navy"},{"id":"F","type":"point","x":0,"y":0,"text":"F","color":"teal"},{"id":"B","type":"point","x":5.809475019311126,"y":0,"text":"B","color":"teal"},{"id":"C","type":"point","x":0.6454972243679028,"y":5.773502691896258,"text":"C","color":"teal"}]}],"graphHash":"7ef666705ffadce47b2c928cce16976c9b13b7e4c30284fc13b47d040b0201a3"},"graphHash":"7ef666705ffadce47b2c928cce16976c9b13b7e4c30284fc13b47d040b0201a3","editionHash":"c9584029185b251268073b38f7077db44dbed113e3bc94c215c903a62bcfa6c8"};</script>
<script>window.HandStudyGuide={"itemId":17362,"sourceHash":"3c4beeda5f89027d4fca27f58cef1604f51376be1ac14c170dc871a56459ae2a","contentHash":"0bb2fdf27cde59a70005ac8ee699f7af891e49791a08fab14eb64588ec0f2bd3","overview":{"goal":"구의 단면에서 생기는 길이를 주어진 평면의 그림으로 옮겨 미지의 길이를 정하고, 두 평면 사이의 각을 삼각형의 길이로 구합니다.","firstLook":"P를 주어진 평면에 내린 점을 먼저 잡으면 삼각형 OAP의 모양과 높이가 정해집니다. 이후 직선 BC와 OA의 교점을 기준으로 B와 C의 위치를 읽습니다.","conditions":[{"label":"각 조건","meaning":"OA와 OP가 모두 구의 반지름이라서 삼각형 OAP의 변과 각이 정해집니다."},{"label":"정사영 위치","meaning":"P′가 선분 OA 위에 있어 공간 길이를 평면 길이와 높이로 나눌 수 있습니다."}]},"chapters":[{"id":"c1","label":"점 P의 높이와 밑면 위치를 정합니다","stepIds":["s1"],"question":"왜 삼각형 OAP가 정삼각형인가요?","hint":"구의 반지름 OA, OP와 주어진 각 PAO를 함께 보세요.","explanation":"\\(OA=OP=4\\)이므로 삼각형 OAP는 이등변삼각형입니다. \\(\\angle PAO=60^\\circ\\)이면 나머지 각도 모두 \\(60^\\circ\\)여서 \\(AP=4\\)입니다. P를 평면에 내린 점을 \\(P'\\)라 하면 \\(AP'=AP\\cos60^\\circ=2\\), \\(PP'=AP\\sin60^\\circ=2\\sqrt3\\)입니다.","check":{"prompt":"P′가 A에서 O 쪽으로 2만큼인 것을 어떻게 알 수 있나요?","answer":"P′가 선분 OA 위에 있고 AP의 평면 성분이 \\(4\\cos60^\\circ=2\\)이기 때문입니다."}},{"id":"c2","label":"주어진 코사인으로 m을 구합니다","stepIds":["s2","s3","s4"],"question":"\\(AN=m\\)으로 놓으면 AB와 PB의 길이는 어떻게 되나요?","hint":"원 안에서 반지름과 현의 수직 관계를 이용하세요.","explanation":"\\(N=OA\\cap BC\\)이고 \\(OA\\perp BC\\)이므로 \\(AN=m\\)이라 두면 원의 현 관계에서 \\(AB^2=8m\\), \\(NB^2=16-(4-m)^2\\)입니다. P의 밑면 위치는 A에서 O 쪽으로 2만큼이므로 \\(P'B^2=(m-2)^2+NB^2\\), 여기에 높이 \\(PP'^2=12\\)를 더해 \\(PB^2=4m+16\\)을 얻습니다. 코사인법칙으로 \\(\\cos\\angle PAB=(AP^2+AB^2-PB^2)/(2AP\\cdot AB)=\\sqrt{2m}/8\\)입니다. 이것이 \\(\\sqrt{10}/8\\)이므로 \\(m=5\\)입니다.","check":{"prompt":"m이 반지름 4보다 큰 5여도 가능한 이유는 무엇인가요?","answer":"N은 선분 OA의 안쪽에 있다고 주어지지 않았고 직선 OA와 현 BC의 교점이므로 A에서 O를 지나 더 갈 수 있습니다."}},{"id":"c3","label":"두 평면 사이의 각으로 넓이를 줄입니다","stepIds":["s5","s6","s7","s8"],"question":"삼각형 PAB를 평면 PAC에 내릴 때 넓이 비는 어떻게 구하나요?","hint":"공통 직선 PA에 수직인 FB와 FC가 이루는 각을 구하세요.","explanation":"PA 위의 점 F에서 \\(NF\\perp PA\\)로 잡으면 \\(NF=5\\sqrt3/2\\), \\(NB=\\sqrt{15}\\)입니다. 따라서 \\(FB=FC=\\sqrt{NF^2+NB^2}=3\\sqrt{15}/2\\)이고 두 선분은 PA에 수직입니다. \\(BC=2NB=2\\sqrt{15}\\)이므로 코사인법칙에서 \\(\\cos\\angle BFC=(2FB^2-BC^2)/(2FB^2)=1/9\\)입니다. 원래 삼각형 넓이는 \\(\\frac12 AP\\cdot FB\\)이고 정사영 넓이는 여기에 \\(1/9\\)를 곱한 \\(S=\\sqrt{15}/3\\)입니다. 따라서 \\(30S^2=50\\)입니다.","check":{"prompt":"넓이 비에 \\(1/9\\)을 곱하는 이유는 무엇인가요?","answer":"두 평면의 공통 직선 PA에 각각 수직인 FB와 FC가 이루는 각이 두 평면이 이루는 각이고, 정사영 넓이는 그 코사인배가 되기 때문입니다."}}],"takeaway":["구의 반지름 두 개가 만든 이등변삼각형은 주어진 각으로 나머지 변과 높이를 정합니다.","두 평면이 공통 직선을 가지면 그 직선에 수직인 두 선분의 각으로 정사영 넓이 비를 구합니다."]};</script>
