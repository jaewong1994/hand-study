  <script>window.HandStudyRecord={"itemId":17362,"sourceLabel":"2022 교육청 고3 수학기하 7월 30번","adminYear":2022,"grade":3,"month":7,"number":30,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"공간에서 중심이 $O\\,$이고 반지름의 길이가 $4\\,$인 구와 점 $O\\,$를 지나는 평면 $\\alpha\\,$가 있다. 평면 $\\alpha\\,$와 구가 만나서 생기는 원 위의 서로 다른 세 점 $A\\,$, $B\\,$, $C\\,$에 대하여 두 직선 $O A\\,$, $B C\\,$가 서로 수직일 때, 구 위의 점 $P\\,$가 다음 조건을 만족시킨다.\n(가) $\\angle PAO= \\frac{\\pi }{3}$\n(나) 점 $P\\,$의 평면 $\\alpha$ 위로의 정사영은 선분 $OA$ 위에 있다.\n$\\cos \\left( \\angle PAB \\right) = \\frac{\\sqrt{10}}{8}\\,$일 때, 삼각형 $PAB\\,$의 평면 $PAC\\,$ 위로의 정사영의 넓이를 $S\\,$라 하자. $30 \\times S^{2} \\,$의 값을 구하시오. (단, $0\u003c \\angle BAC\u003c \\frac{\\pi }{2}\\,$) [4점]","answer":"50","sourceHash":"3c4beeda5f89027d4fca27f58cef1604f51376be1ac14c170dc871a56459ae2a","steps":[{"id":"s1","latex":"\\triangle OAP\\text{는 정삼각형},\\quad AP=4,\\quad P'=\\operatorname{proj}_{\\alpha}P,\\ AP'=2,\\ PP'=2\\sqrt3"},{"id":"s2","latex":"N=OA\\cap BC,\\quad AN=m,\\quad AB^2=8m,\\quad NB^2=16-(4-m)^2"},{"id":"s3","latex":"PB^2=12+(m-2)^2+NB^2=4m+16"},{"id":"s4","latex":"\\cos\\angle PAB=\\frac{16+8m-(4m+16)}{8\\sqrt{8m}}=\\frac{\\sqrt{2m}}8=\\frac{\\sqrt{10}}8\\Rightarrow m=5"},{"id":"s5","latex":"F\\in PA,\\quad NF\\perp PA,\\quad NF=5\\sqrt3/2,\\ NB=\\sqrt{15}"},{"id":"s6","latex":"FB=FC=\\sqrt{NF^2+NB^2}=3\\sqrt{15}/2,\\quad FB,FC\\perp PA"},{"id":"s7","latex":"\\cos\\angle BFC=\\frac{2FB^2-BC^2}{2FB^2}=\\frac{135/2-60}{135/2}=1/9"},{"id":"s8","latex":"S=\\tfrac12 AP\\cdot FB\\cdot\\tfrac19=\\sqrt{15}/3\\Rightarrow30S^2=50"}],"diagram":null,"contentHash":"0bb2fdf27cde59a70005ac8ee699f7af891e49791a08fab14eb64588ec0f2bd3","questionHtml":"\u003cp class=\"hp\">공간에서 중심이 \u003cspan class=\"heq\">\\(O\\,\\)\u003c/span>이고 반지름의 길이가 \u003cspan class=\"heq\">\\(4\\,\\)\u003c/span>인 구와 점 \u003cspan class=\"heq\">\\(O\\,\\)\u003c/span>를 지나는 평면 \u003cspan class=\"heq\">\\(\\alpha\\,\\)\u003c/span>가 있다. 평면 \u003cspan class=\"heq\">\\(\\alpha\\,\\)\u003c/sp
