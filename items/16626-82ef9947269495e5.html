<script>window.HandStudyRecord={"itemId":16626,"sourceLabel":"2020 교육청 고3 수리가형 10월 21번","adminYear":2020,"grade":3,"month":10,"number":21,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 길이가 $2\\,$인 선분 $A B\\,$를 지름으로 하는 반원이 있다. 호 $A B$ 위의 점 $P\\,$와 선분 $A B$ 위의 점 $C\\,$에 대하여 $\\angle P A C=\\theta\\,$일 때, $\\angle APC=2\\theta\\,$이다. $\\angle ADC= \\angle PCD= \\frac{\\pi }{2} \\,$인 점 $D\\,$에 대하여 두 선분 $AP\\,$와 $C D\\,$가 만나는 점을 $E\\,$라 하자. 삼각형 $DEP\\,$의 넓이를 $S( \\theta )\\,$라 할 때, $\\lim _{\\theta \\, -> \\,0+} {\\frac{S( \\theta )}{\\theta }} \\,$의 값은? (단, $0\u003c \\theta \u003c \\frac{\\pi }{6}$) [4점]\n① $\\frac{5}{9}$ ② $\\frac{2}{3}$ ③ $\\frac{7}{9}$ ④ $\\frac{8}{9}$ ⑤ $1$\n단답형","answer":"④","sourceHash":"8c94ccf7dce5d884edb57ab65121644b093186cd3847216406aa41fd0f9d0a5c","steps":[{"id":"s1","latex":"\\triangle PCE\\sim\\triangle ADE\\Rightarrow EP\\cdot ED=EA\\cdot EC"},{"id":"s2","latex":"S(\\theta)=\\dfrac12EA\\cdot EC\\cos2\\theta"},{"id":"s3","latex":"AP=2\\cos\\theta,\\quad AC=\\dfrac{2\\sin2\\theta\\cos\\theta}{\\sin3\\theta}"},{"id":"s4","latex":"EC=\\dfrac{2\\sin2\\theta\\sin\\theta\\cos\\theta}{\\sin3\\theta\\cos2\\theta}"},{"id":"s5","latex":"EA=\\dfrac{2\\sin2\\theta\\cos\\theta\\cos3\\theta}{\\sin3\\theta\\cos2\\theta}"},{"id":"s6","latex":"S(\\theta)=\\dfrac{2\\sin^22\\theta\\sin\\theta\\cos^2\\theta\\cos3\\theta}{\\sin^23\\theta\\cos2\\theta}"},{"id":"s7","latex":"\\lim_{\\theta\\to0+}\\dfrac{S(\\theta)}\\theta=\\boxed{\\dfrac89}"}],"diagram":null,"contentHash":"ea71eafb5991c4bd92534be3177349b9b28cbca972053f7410989377905ad478","questionHtml":"\u003cp class=\"hp htall\">그림과 같이 길이가 \u003cspan class=\"heq\">\\(2\\,\\)\u003c/span>인 선분 \u003cspan class=\"heq\">\\(A B\\,\\)\u003c/span>를 지름으로 하는 반원이 있다. 호 \u003cspan class=\"heq\">\\(A B\\)\u003c/span> 위의 점 \u003cspan class=\"heq\">\\(P\\,\\)\u003c/span>와 선분 \u003cspan class=\"heq\">\\(A B\\)\u003c/span> 위의 점 \u003cspan class=\"heq\">\\(C\\,\\)\u003c/span>에 대하여\u003cbr>\u003cspan class=\"heq\">\\(\\angle P A C=\\theta\\,\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(\\angle APC=2\\theta\\,\\)\u003c/span>이다. \u003cspan class=\"heq\">\\(\\angle ADC= \\angle PCD= \\dfrac{\\pi }{2} \\,\\)\u003c/span>인 점 \u003cspan class=\"heq\">\\(D\\,\\)\u003c/span>에 대하여 두 선분 \u003cspan class=\"heq\">\\(AP\\,\\)\u003c/span>와 \u003cspan class=\"heq\">\\(C D\\,\\)\u003c/span>가 만나는 점을 \u003cspan class=\"heq\">\\(E\\,\\)\u003c/span>라 하자. 삼각형 \u003cspan class=\"heq\">\\(DEP\\,\\)\u003c/span>의 넓이를 \u003cspan class=\"heq\">\\(S( \\theta )\\,\\)\u003c/span>라 할 때, \u003cspan class=\"heq\">\\(\\lim\\limits_{\\theta \\, \\to  \\,0+} {\\dfrac{S( \\theta )}{\\theta }} \\,\\)\u003c/span>의 값은? \u003cbr>(단, \u003cspan class=\"heq\">\\(0\\lt  \\theta \\lt  \\dfrac{\\pi }{6}\\)\u003c/span>) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/6af98484727bdc72dd8ef00c.png\" style=\"width:416px;max-width:100%\">\u003c/p>\u003cp class=\"hp htall\">① \u003cspan class=\"heq\">\\(\\dfrac{5}{9}\\)\u003c/span>&emsp;② \u003cspan class=\"heq\">\\(\\dfrac{2}{3}\\)\u003c/span>&emsp;③ \u003cspan class=\"heq\">\\(\\dfrac{7}{9}\\)\u003c/span>&emsp;④ \u003cspan class=\"heq\">\\(\\dfrac{8}{9}\\)\u003c/span>&emsp;⑤ \u003cspan class=\"heq\">\\(1\\)\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"82ef9947269495e5fe37618e3bfd49705787205ef8f90843a835f5816a6c9028"};</script>
<script>window.HandStudyGuide={"itemId":16626,"sourceHash":"8c94ccf7dce5d884edb57ab65121644b093186cd3847216406aa41fd0f9d0a5c","contentHash":"ea71eafb5991c4bd92534be3177349b9b28cbca972053f7410989377905ad478","overview":{"goal":"닮음으로 넓이의 두 변의 곱을 바꾸고, 사인법칙으로 필요한 길이를 구해 극한을 계산해요.","firstLook":"넓이에 필요한 \\(EP\\cdot ED\\)를 직접 구하기보다 닮은 두 삼각형에서 \\(EA\\cdot EC\\)로 바꾸면 삼각형 \\(APC\\)의 각 정보가 이어져요.","conditions":[{"label":"반원","meaning":"\\(AB\\)가 지름이라 \\(\\angle APB=\\pi/2\\)이고 \\(AP=2\\cos\\theta\\)예요."},{"label":"두 직각","meaning":"\\(PC\\perp CD\\), \\(AD\\perp DC\\)가 닮음과 각 계산을 만들어요."},{"label":"각의 범위","meaning":"\\(0<\\theta<\\pi/6\\)이라 등장하는 삼각형의 길이와 코사인 분모가 양수예요."}]},"chapters":[{"id":"c1","label":"닮음으로 넓이의 곱을 바꿔요","stepIds":["s1","s2"],"question":"삼각형 \\(PCE\\)와 \\(ADE\\)의 닮음이 넓이 \\(S(\\theta)\\)에 어떻게 쓰일까요?","hint":"두 삼각형의 직각과 \\(E\\)의 맞꼭지각을 확인하고 대응변의 비를 교차로 곱해요.","explanation":"\\(\\angle PCE=\\angle ADE=\\pi/2\\)이고 \\(\\angle PEC=\\angle AED\\)이므로 두 삼각형은 닮아요. 대응변에서 \\(EP/EA=EC/ED\\)이므로 \\(EP\\cdot ED=EA\\cdot EC\\)예요. 삼각형 \\(DEP\\)에서 두 변 \\(EP,ED\\) 사이 각의 사인은 \\(\\cos2\\theta\\)이므로\n\n\\(S(\\theta)=\\frac12EA\\cdot EC\\cos2\\theta\\)\n\n로 바꿀 수 있어요.","check":{"prompt":"두 변 사이 각의 사인이 왜 \\(\\cos2\\theta\\)인가요?","answer":"\\(PC\\perp CD\\)이고 \\(AP\\)와 \\(PC\\) 사이 각이 \\(2\\theta\\)라 \\(AP\\)와 \\(CD\\) 사이의 예각은 \\(\\pi/2-2\\theta\\)이고, 그 사인이 \\(\\cos2\\theta\\)이기 때문이에요."}},{"id":"c2","label":"사인법칙으로 세 길이를 연결해요","stepIds":["s3","s4","s5"],"question":"\\(AC,EC,EA\\)는 각각 어떤 삼각형에서 구할까요?","hint":"먼저 삼각형 \\(APC\\)에서 \\(AC\\), 다음 삼각형 \\(AEC\\)에서 나머지 두 길이를 구해요.","explanation":"반원에서 \\(\\angle APB=\\pi/2\\)이므로 직각삼각형 \\(APB\\)에서 \\(AP=2\\cos\\theta\\)예요. 삼각형 \\(APC\\)의 각은 \\(\\theta,2\\theta,\\pi-3\\theta\\)이므로 사인법칙에서\n\n\\(AC=\\frac{2\\sin2\\theta\\cos\\theta}{\\sin3\\theta}\\)\n\n를 얻어요. 그림의 직각 관계로 삼각형 \\(AEC\\)의 나머지 각을 정리하면 사인법칙에서\n\n\\(EC=\\frac{AC\\sin\\theta}{\\cos2\\theta},\\qquad EA=\\frac{AC\\cos3\\theta}{\\cos2\\theta}\\)\n\n예요. 여기에 \\(AC\\)를 넣으면 원래 단계의 두 식이 나와요.","check":{"prompt":"\\(EC\\)와 \\(EA\\)의 분모가 모두 \\(\\cos2\\theta\\)인 이유는 무엇인가요?","answer":"두 길이와 마주 보는 각을 비교하는 같은 삼각형 \\(AEC\\)에서 세 번째 각의 사인이 \\(\\cos2\\theta\\)이기 때문이에요."}},{"id":"c3","label":"작은 각의 비를 하나씩 확인해요","stepIds":["s6","s7"],"question":"넓이식을 \\(\\theta\\)로 나눈 극한에서 \\(8/9\\)는 어떻게 나오나요?","hint":"\\(\\sin2\\theta/\\theta\\), \\(\\sin3\\theta/\\theta\\), \\(\\sin\\theta/\\theta\\)를 각각 분리하고 코사인들은 \\(1\\)로 가는지 봐요.","explanation":"길이들을 넓이식에 넣으면\n\n\\(S(\\theta)=\\frac{2\\sin^22\\theta\\sin\\theta\\cos^2\\theta\\cos3\\theta}{\\sin^23\\theta\\cos2\\theta}\\)\n\n예요. \\(\\theta\\)로 나누고 \\(\\theta\\to0+\\)로 보내면 사인 인수들은 분자에서 \\(2\\theta\\)가 두 번과 \\(\\theta\\) 한 번, 분모에서 \\(3\\theta\\)가 두 번과 바깥의 \\(\\theta\\) 한 번을 만들어요. 코사인들은 모두 \\(1\\)로 가므로 값은 \\(2\\cdot2^2/3^2=8/9\\)예요. 따라서 정답은 ④예요.","check":{"prompt":"분자 앞의 계수 \\(2\\)를 빠뜨리지 않으면 최종 수치가 어떻게 되나요?","answer":"\\(2\\times4/9=8/9\\)가 돼요."}}],"takeaway":["넓이에 필요한 두 변의 곱은 닮음의 교차곱으로 더 구하기 쉬운 두 길이의 곱으로 바꿀 수 있어요.","그림의 직각에서 각을 먼저 모두 표시한 뒤 사인법칙의 대응을 정해요.","삼각함수 극한은 각 사인 인수와 바깥의 변수까지 몇 번 나타나는지 세어 계산해요."]};</script>
