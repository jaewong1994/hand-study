<script>window.HandStudyRecord={"adminYear":2023,"answer":"673","contentHash":"dddb5f6394c40e82c88c793526b991abc8b2f11435ca829ebf6b3a4248221023","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24899,"month":11,"number":30,"points":4,"preview":false,"questionHtml":"\u003cp>양수 \u003cspan class=\"heq\">\\(t\\)\u003c/span>에 대하여 확률변수 \u003cspan class=\"heq\">\\(X\\)\u003c/span>가 정규분포 \u003cspan class=\"heq\">\\({{N}} \\left(1,\\, t^{2} \\right)\\)\u003c/span>을 따른다.\u003c/p>\u003cp> \u003cspan class=\"heq\">\\(P \\left(X \\leq 5t \\right) \\geq \\frac{1}{2}\\)\u003c/span>\u003c/p>\u003cp>이 되도록 하는 모든 양수 \u003cspan class=\"heq\">\\(t\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\({{P}} \\left(t^{2}-t+1 \\leq X \\leq t^{2}+t+1 \\right)\\)\u003c/span>의 최댓값을 오른쪽 표준정규분포표를 이용하여 구한 값을 \u003cspan class=\"heq\">\\(k\\)\u003c/span>라 하자. \u003cspan class=\"heq\">\\(1000 \\times k\\)\u003c/span>의 값을 구하시오. [4점]\u003c/p>\u003cp>[표] z=0.6: 0.226, z=0.8: 0.288, z=1.0: 0.341, z=1.2: 0.385, z=1.4: 0.419\u003c/p>","questionText":"양수 $t$에 대하여 확률변수 $X$가 정규분포 ${{N}} \\left(1,\\, t^{2} \\right)$을 따른다.\n $P \\left(X \\leq 5t \\right) \\geq \\frac{1}{2}$\n이 되도록 하는 모든 양수 $t$에 대하여 ${{P}} \\left(t^{2}-t+1 \\leq X \\leq t^{2}+t+1 \\right)$의 최댓값을 오른쪽 표준정규분포표를 이용하여 구한 값을 $k$라 하자. $1000 \\times k$의 값을 구하시오. [4점]\n[표] z=0.6: 0.226, z=0.8: 0.288, z=1.0: 0.341, z=1.2: 0.385, z=1.4: 0.419","sourceHash":"60632e7b287cd2e0f66f8ef7162ffaf892398bf182973e2de3ded682d7957b5b","sourceKind":"csat","sourceLabel":"2023년 시행 수능 · 2024학년도 · 확률과 통계 · 30번","steps":[{"id":"s1","latex":"Z=\\frac{X-1}{t}\\text{라 하면 }Z\\sim N(0,1)"},{"id":"s2","latex":"P(X\\le5t)\\ge\\frac12\\Rightarrow \\frac{5t-1}{t}\\ge0\\Rightarrow t\\ge\\frac15"},{"id":"s3","latex":"P(t^{2}-t+1\\le X\\le t^{2}+t+1)=P(t-1\\le Z\\le t+1)"},{"explanation":{"body":"표준정규곡선은 0을 중심으로 좌우대칭이고 0에서 멀어질수록 낮아집니다. 길이가 같은 구간을 오른쪽으로 옮기면 높은 중앙 부분을 덜 포함하므로 확률이 작아집니다. 허용된 가장 왼쪽 중심 \\(t=\\frac15\\)에서 최대입니다.","skillTags":["정규분포","대칭성"],"title":"같은 길이 구간의 확률 비교"},"id":"s4","latex":"\\text{표준정규분포에서 길이가 }2\\text{인 구간은 중심이 }0\\text{에 가까울수록 확률이 크다.}"},{"id":"s5","latex":"t\\ge\\frac15\\text{이므로 최댓값은 }t=\\frac15\\text{에서 얻는다.}"},{"id":"s6","latex":"P\\left(-0.8\\le Z\\le1.2\\right)=P(0\\le Z\\le0.8)+P(0\\le Z\\le1.2)"},{"id":"s7","latex":"=0.288+0.385=0.673"},{"id":"s8","latex":"1000k=673"},{"id":"s9","latex":"\\therefore\\ \\boxed{673}"}],"track":"확률과 통계"};</script>
<script>window.HandStudyGuide={"itemId":24899,"sourceHash":"60632e7b287cd2e0f66f8ef7162ffaf892398bf182973e2de3ded682d7957b5b","contentHash":"dddb5f6394c40e82c88c793526b991abc8b2f11435ca829ebf6b3a4248221023","overview":{"goal":"정규분포 조건으로 t의 범위를 정하고, 길이가 일정한 표준정규 구간이 중심에 가장 가까울 때 확률이 최대임을 이용해요.","firstLook":"평균이 \\(1\\), 표준편차가 \\(t\\)이므로 먼저 표준화해요. 목표 확률의 구간은 길이가 늘 \\(2\\)이고 중심만 \\(t\\)만큼 움직여요.","conditions":[{"label":"양수 t","meaning":"표준편차 \\(t\\)는 양수예요."},{"label":"누적확률 조건","meaning":"정규분포에서 평균 이하일 확률이 \\(1/2\\)임을 이용해 \\(5t\\)와 평균 \\(1\\)을 비교해요."},{"label":"분포표","meaning":"표는 0부터 양의 z값까지의 확률을 주므로 대칭성을 사용해 구간을 나누어요."}]},"chapters":[{"id":"c1","label":"표준화하고 t의 허용 범위를 구해요","stepIds":["s1","s2"],"question":"조건 \\(P(X\\le5t)\\ge1/2\\)는 왜 \\(t\\ge1/5\\)와 같을까요?","hint":"\\(Z=(X-1)/t\\)로 표준화하거나, 정규분포의 중앙값이 평균 \\(1\\)임을 써요.","explanation":"\\(Z=(X-1)/t\\)라 두면 \\(Z\\)는 표준정규분포를 따라요. 조건은 \\(P(Z\\le(5t-1)/t)\\ge1/2\\)가 돼요. 표준정규분포는 \\(0\\)을 중심으로 대칭이어서 누적확률이 \\(1/2\\) 이상이려면 경계값이 \\(0\\) 이상이어야 해요. \\(t>0\\)이므로 \\((5t-1)/t\\ge0\\), 즉 \\(t\\ge1/5\\)예요.","check":{"prompt":"부등식에 \\(t\\)를 곱할 때 부등호 방향이 바뀌지 않는 이유는 무엇인가요?","answer":"문제에서 \\(t>0\\)이라고 했기 때문이에요."}},{"id":"c2","label":"목표 확률을 길이 2인 구간으로 바꿔요","stepIds":["s3","s4","s5"],"question":"표준화한 구간은 어떻게 움직이고, 왜 \\(t=1/5\\)에서 확률이 가장 클까요?","hint":"두 끝점을 표준화하면 \\(t-1\\)과 \\(t+1\\)이 돼요. 구간의 중심은 \\(t\\), 길이는 \\(2\\)예요.","explanation":"양쪽 끝에서 평균 \\(1\\)을 빼고 표준편차 \\(t\\)로 나누면\n\\[\nP(t^2-t+1\\le X\\le t^2+t+1)=P(t-1\\le Z\\le t+1)\n\\]\n이에요. 이 구간은 길이가 \\(2\\)로 고정되고 중심이 \\(t\\)예요.\n\n표준정규곡선은 \\(0\\)에서 가장 높고 양쪽으로 멀어질수록 낮아져요. 길이가 같은 구간을 양의 방향으로 옮기면 왼쪽에서 빠지는 부분이 오른쪽에서 새로 들어오는 부분보다 곡선 높이가 크므로 확률이 줄어요. 허용 범위 \\(t\\ge1/5\\)에서 중심이 \\(0\\)에 가장 가까운 값은 \\(t=1/5\\)이므로 이때 최대예요.","check":{"prompt":"\\(t=1/5\\)일 때 표준화 구간의 두 끝점은 무엇인가요?","answer":"\\(t-1=-0.8\\), \\(t+1=1.2\\)예요."}},{"id":"c3","label":"분포표의 두 값을 더해요","stepIds":["s6","s7","s8","s9"],"question":"구간 \\([-0.8,1.2]\\)의 확률은 표에서 어떻게 읽을까요?","hint":"0을 기준으로 왼쪽과 오른쪽을 나누고 대칭성을 사용해요.","explanation":"표준정규분포의 대칭성으로 \\(P(-0.8\\le Z\\le0)=P(0\\le Z\\le0.8)=0.288\\)이에요. 또 표에서 \\(P(0\\le Z\\le1.2)=0.385\\)예요. 따라서 최대확률은 \\(k=0.288+0.385=0.673\\)이고 \\(1000k=673\\)이에요.","check":{"prompt":"두 표의 값을 빼지 않고 더하는 이유는 무엇인가요?","answer":"구간이 0의 왼쪽 부분과 오른쪽 부분을 모두 포함하며 두 부분이 겹치지 않기 때문이에요."}}],"takeaway":["정규분포의 누적확률이 절반인지 비교할 때 평균을 경계로 판단할 수 있어요.","표준화 후 구간 길이와 중심을 따로 보면 확률의 최댓값 위치를 쉽게 찾을 수 있어요.","음의 구간 확률은 표준정규분포의 좌우대칭으로 양의 값 표에서 읽어요."]};</script>
