<script>window.HandStudyGuide={"itemId":17137,"sourceHash":"5aeea4adec5bdf2cd1f1f43a657ce308bfe2de42cc89a033ff2aa7509047f549","contentHash":"d8c408a5485dea1a850056959648b919d1264414752d0dc6d456fe2e2e4f40f5","overview":{"goal":"홀짝 조건을 새 변수로 없앤 뒤 각 변수가 6 이하인 해를 포함배제로 세어요.","firstLook":"홀수와 짝수의 최소값이 다르므로 네 값을 2배한 새 변수와 최소값으로 표현해요.","conditions":[{"label":"합 조건","meaning":"네 자연수의 합은 34예요."},{"label":"홀짝과 상한","meaning":"첫째·셋째는 홀수, 둘째·넷째는 짝수이고 모두 14 이하예요."}]},"chapters":[{"id":"c1","label":"홀짝을 새 변수에 담아요","stepIds":["s1","s2"],"question":"왜 네 새 변수의 합이 14이고 각각 6 이하일까요?","hint":"홀수는 2a+1, 양의 짝수는 2b+2로 두세요.","explanation":"\\(x_1=2a+1\\), \\(x_3=2c+1\\)로 두면 홀수 조건이 자동으로 만족돼요. 양의 짝수는 최소가 2이므로 \\(x_2=2b+2\\), \\(x_4=2d+2\\)로 두어요.\n\n합에 넣으면 \\(2(a+b+c+d)+6=34\\), 따라서 \\(a+b+c+d=14\\)예요. 원래 값이 14 이하이므로 홀수에서는 \\(2a+1\\le14\\), 짝수에서는 \\(2b+2\\le14\\)이고, 네 변수 모두 \\(0\\) 이상 \\(6\\) 이하예요.","check":{"prompt":"짝수를 2b가 아니라 2b+2로 둔 이유는 무엇인가요?","answer":"원래 수가 자연수라 0은 허용되지 않으므로 가장 작은 짝수 2부터 시작하게 하려는 거예요."}},{"id":"c2","label":"상한을 넘는 해를 빼요","stepIds":["s3","s4"],"question":"상한이 없을 때와 한 변수가 7 이상일 때 각각 몇 가지인가요?","hint":"한 변수가 7 이상이면 그 변수에서 7을 먼저 빼세요.","explanation":"상한을 잠시 무시하면 \\(a+b+c+d=14\\)의 음이 아닌 정수해는 \\({}_{4}\\mathrm H_{14}={}_{17}\\mathrm C_3=680\\)가지예요.\n\n예를 들어 \\(a\\ge7\\)이면 \\(a'=a-7\\)로 두어 \\(a'+b+c+d=7\\)이 되고, 해는 \\({}_{4}\\mathrm H_7={}_{10}\\mathrm C_3=120\\)가지예요. 어느 변수가 7 이상인지 4가지이므로 우선 \\(4\\times120=480\\)가지를 빼요.","check":{"prompt":"상한 위반의 기준이 14가 아니라 새 변수 7인 이유는 무엇인가요?","answer":"새 변수는 6 이하여야 하므로 7부터가 위반이에요."}},{"id":"c3","label":"두 번 뺀 해를 되돌려요","stepIds":["s5","s6"],"question":"왜 마지막에 6가지를 더하나요?","hint":"두 변수가 동시에 7 이상이면 합 14를 모두 써요.","explanation":"두 변수가 동시에 7 이상인 해는 앞에서 각각의 위반을 뺄 때 두 번 빠졌어요. 두 변수에서 각각 7을 빼면 남은 합이 \\(0\\)이므로 선택한 두 변수는 정확히 7이고 나머지는 0인 한 해만 있어요.\n\n7 이상일 두 변수를 고르는 방법이 \\({}_{4}\\mathrm C_2=6\\)가지이므로 6을 한 번 되돌려요. 세 변수가 동시에 7 이상이면 합이 21 이상이라 불가능해요. 따라서 \\(680-480+6=206\\)가지예요.","check":{"prompt":"세 변수 이상이 상한을 넘는 경우는 왜 더 보정하지 않나요?","answer":"각각 최소 7이어서 세 변수의 합만 21이 되므로 전체 합 14를 넘겨 불가능해요."}}],"takeaway":["홀짝과 최소값을 함께 반영해 음이 아닌 새 변수로 바꿔요.","상한 위반은 기준값을 빼서 같은 형태의 정수해로 세어요.","포함배제에서는 두 번 빠진 교집합과 더 높은 교집합의 가능성을 확인해요."]};</script>
