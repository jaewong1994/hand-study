  <script>window.HandStudyRecord={"itemId":18194,"sourceLabel":"2025 교육청 고3 수학기하 5월 28번","adminYear":2025,"grade":3,"month":5,"number":28,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 두 초점이 ${{F}} \\left(1,\\,0 \\right)$, ${{F}}' \\left(-1,\\,0 \\right)\\,$이고 단축의 길이가 $2 \\sqrt{5}\\,$인 타원과 $y\\,$축 위의 점 ${{A}}\\,$가 있다. 점 ${{A}}\\,$를 $x\\,$축에 대하여 대칭이동한 점을 ${{B}}\\,$라 하자. 제$1\\,$사분면에서 이 타원 위를 움직이는 점 ${{P}}\\,$에 대하여 네 선분 ${{AB}}$, ${{}}$, ${{FP}}$, ${{PA}}\\,$로 둘러싸인 도형의 넓이가 최대가 되도록 하는 점 ${{P}}\\,$를 ${{P}}_{0} \\left(a,\\,b \\right)\\,$라 하자. ${ \\overline{{}}}+{ \\overline{{{FP}}_{0}}}+{ \\overline{{{P}}_{0}{{A}}}}=2 \\sqrt{6}\\,$일 때, $a \\times b\\,$의 값은? (단, 점 ${{A}}\\,$의 $y\\,$좌표는 양수이고, ${ \\overline{{AB}}} \u003c 2 \\sqrt{5}\\,$이다.) [4점]\n① $\\frac{11 \\sqrt{2}}{8}$ ② $\\frac{3 \\sqrt{2}}{2}$ ③ $\\frac{13 \\sqrt{2}}{8}$\n④ $\\frac{7 \\sqrt{2}}{4}$ ⑤ $\\frac{15 \\sqrt{2}}{8}$\n단답형","answer":"⑤","sourceHash":"387b0819600fa2a7ffffef4ebc70ff6243d74b861979c08ba1886884a3b2afff","steps":[{"id":"s1","latex":"A=(0,h),\\quad B=(0,-h),\\quad h>0,\\quad \\dfrac{x^2}{6}+\\dfrac{y^2}{5}=1"},{"id":"s2","latex":"[ABFP]=\\dfrac12(hx+y+h)"},{"id":"s3","latex":"hx+y\\le\\sqrt{6h^2+5}"},{"id":"s4","latex":"P_0=(a,b)=\\left(\\dfrac{6h}{\\sqrt{6h^2+5}},\\dfrac5{\\sqrt{6h^2+5}}\\right)"},{"id":"s5","latex":"BF=AF',\\quad PF+PF'=2\\sqrt6"},{"id":"s6","latex":"BF+PF+PA=2\\sqrt6\\Rightarrow AF'+AP=F'P"},{"id":"s7","latex":"F',A,P_0\\text{가 이 순서로 일직선}\\Rightarrow b=h(a+1)"},{"id":"s8","latex":"\\dfrac5{\\sqrt{6h^2+5}}=h\\left(\\dfrac{6h}{\\sqrt{6h^2+5}}+1\\right)"},{"id":"s9","latex":"h^2=\\dfrac12\\quad\\left(h^2=\\dfrac53\\text{은 부호 조건 }5-6h^2>0\\text{에 어긋남}\\right)"},{"id":"s10","latex":"a=\\dfrac32,\\quad b=\\dfrac{5\\sqrt2}{4}\\Rightarrow ab=\\dfrac{15\\sqrt2}{8}"}],"diagram":null,"contentHash":"689363935eab9125031d7102a0da721887871e5671fdb946511085cc1dabe8a1","questionHtml":"\u003cp class=\"hp htall\">그림과 같이 두 초점이 \u003cspan class=\"heq\">\\({{F}} \\lef
