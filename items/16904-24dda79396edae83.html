<script>window.HandStudyRecord={"itemId":16904,"sourceLabel":"2020 평가원 고3 수리가형 9월 30번","adminYear":2020,"grade":3,"month":9,"number":30,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"다음 조건을 만족시키는 실수 $a,\\,b$에 대하여 $ab$의 최댓값을 $M$, 최솟값을 $m$이라 하자.\n모든 실수 $x$에 대하여 부등식 $-e ^{-x+1} {\\leq}ax+b{\\leq}e ^{x-2}$ 이 성립한다.\n$\\left| M \\times m ^{3} \\right| = \\frac{q}{p}$일 때, $p+q$의 값을 구하시오. (단, $p$와 $q$는 서로소인 자연수이다.) [4점]","answer":"43","sourceHash":"48f74ec1ddc85736db600ce3a7f04f59917071691403443caf4fe56a25852cf6","steps":[{"id":"s1","latex":"a=0\\Rightarrow b=0,\\qquad a>0"},{"id":"s2","latex":"a(\\ln a-2)\\le b\\le-a(1+\\ln a)"},{"id":"s3","latex":"0<a\\le\\sqrt e"},{"id":"s4","latex":"-a^2(1+\\ln a)\\le\\dfrac1{2e^3}\\quad(\\text{등호는 }a=e^{-3/2})\\Rightarrow M=\\dfrac1{2e^3}"},{"id":"s5","latex":"a^2(\\ln a-2)\\ge-\\dfrac{3e}{2}\\quad(\\text{등호는 }a=\\sqrt e)\\Rightarrow m=-\\dfrac{3e}{2}"},{"id":"s6","latex":"|Mm^3|=\\dfrac{27}{16}\\Rightarrow p+q=\\boxed{43}"}],"diagram":null,"contentHash":"98692ac9721f8c77fa3b0842e563e946df18ceac967eef160f79454d681ee4f8","questionHtml":"<p class=\"hp\">다음 조건을 만족시키는 실수 <span class=\"heq\">\\(a,\\,b\\)<\/span>에 대하여 <span class=\"heq\">\\(ab\\)<\/span>의 최댓값을 <span class=\"heq\">\\(M\\)<\/span>, 최솟값을 <span class=\"heq\">\\(m\\)<\/span>이라 하자.<\/p><p class=\"hp\"><div class=\"hbox\"><p class=\"hp\">모든 실수 <span class=\"heq\">\\(x\\)<\/span>에 대하여 부등식<br><span class=\"heq\">\\(-e^{-x+1} {\\leq}ax+b{\\leq}e^{x-2}\\)<\/span><\/p><p class=\"hp\">이 성립한다.<\/p><\/div><\/p><p class=\"hp htall\"><span class=\"heq\">\\(\\left| M \\times m^{3} \\right| = \\dfrac{q}{p}\\)<\/span>일 때, <span class=\"heq\">\\(p+q\\)<\/span>의 값을 구하시오.<br>(단, <span class=\"heq\">\\(p\\)<\/span>와 <span class=\"heq\">\\(q\\)<\/span>는 서로소인 자연수이다.) <span class=\"hscore\">[4점]<\/span><\/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"c3030415e2daa1e31d6cf566449847ab9e64fbeb52721aabf97f954cf6dd4205"};</script>
<script>window.HandStudyGuide={"itemId":16904,"sourceHash":"48f74ec1ddc85736db600ce3a7f04f59917071691403443caf4fe56a25852cf6","contentHash":"98692ac9721f8c77fa3b0842e563e946df18ceac967eef160f79454d681ee4f8","overview":{"goal":"모든 실수에서 성립하는 두 부등식을 접선 조건으로 바꾸고, 가능한 \\(ab\\)의 양끝을 구해요.","firstLook":"지수함수와 직선이 모든 점에서 한쪽에 있으려면 가장 가까워지는 접점의 값이 경계를 정해요.","conditions":[{"label":"아래쪽 부등식","meaning":"\\(b\\)의 아랫범위를 지수함수와 직선의 접점에서 구해요."},{"label":"위쪽 부등식","meaning":"\\(b\\)의 윗범위를 다른 지수함수의 접점에서 구해요."}]},"chapters":[{"id":"c1","label":"기울기의 부호를 정해요","stepIds":["s1"],"question":"왜 음의 \\(a\\)는 불가능하고 \\(a=0\\)이면 \\(b=0\\)인가요?","hint":"\\(x\\)가 매우 커지거나 작아질 때를 보세요.","explanation":"\\(a<0\\)이면 \\(x\\to\\infty\\)에서 \\(ax+b\\to-\\infty\\)인데 아래 경계 \\(-e^{-x+1}\\to0\\)보다 작아져 불가능해요. \\(a=0\\)이면 \\(-e^{-x+1}\\le b\\le e^{x-2}\\)가 모든 \\(x\\)에서 성립해야 하고 양쪽 경계가 각각 \\(0\\)에 가까워지므로 \\(b=0\\)이에요. 나머지는 \\(a>0\\)만 보면 돼요.","check":{"prompt":"\\(a=0\\)에서 양수나 음수인 b가 불가능한 이유는 무엇인가요?","answer":"위 경계와 아래 경계가 각각 0에 한없이 가까워져 모든 x에서 끼일 수 있는 상수는 0뿐이에요."}},{"id":"c2","label":"절편의 범위를 구해요","stepIds":["s2","s3"],"question":"두 접점에서 \\(b\\)의 범위는 어떻게 나오나요?","hint":"\\(e^{x-2}-ax\\)의 최솟값과 \\(-e^{1-x}-ax\\)의 최댓값을 구하세요.","explanation":"위 부등식에서 \\(b\\le e^{x-2}-ax\\)이고, 오른쪽의 최솟값은 \\(e^{x-2}=a\\), 즉 \\(x=\\ln a+2\\)에서 \\(-a(1+\\ln a)\\)예요. 아래 부등식에서는 \\(b\\ge-e^{1-x}-ax\\)이고 최댓값은 \\(e^{1-x}=a\\), 즉 \\(x=1-\\ln a\\)에서 \\(a(\\ln a-2)\\)예요. 두 범위가 겹치려면 \\(a(\\ln a-2)\\le-a(1+\\ln a)\\), 따라서 \\(0<a\\le\\sqrt e\\)예요.","check":{"prompt":"\\(a\\le\\sqrt e\\)의 등호도 가능한가요?","answer":"가능해요. 그때 b의 아랫값과 윗값이 같아 하나의 직선이 두 경계에 접해요."}},{"id":"c3","label":"곱의 최댓값과 최솟값을 구해요","stepIds":["s4","s5"],"question":"고정한 \\(a\\)에서 \\(ab\\)는 어느 절편에서 가장 크고 작나요?","hint":"\\(a>0\\)이므로 b의 순서가 곱에서도 유지돼요.","explanation":"\\(ab\\)의 윗경계는 \\(-a^2(1+\\ln a)\\)예요. 미분하면 \\(-a(3+2\\ln a)\\)이므로 \\(a=e^{-3/2}\\)에서 최댓값 \\(M=1/(2e^3)\\)을 가져요. 아랫경계는 \\(a^2(\\ln a-2)\\)이고 도함수는 \\(a(2\\ln a-3)\\)예요. \\(0<a\\le\\sqrt e\\)에서는 감소하므로 끝점 \\(a=\\sqrt e\\)에서 \\(m=e(1/2-2)=-3e/2\\)예요.","check":{"prompt":"최솟값이 내부의 정지점이 아니라 오른쪽 끝에서 나오는 이유는 무엇인가요?","answer":"정지점 \\(e^{3/2}\\)은 허용범위 밖이고, 허용범위 전체에서 아랫경계가 감소하기 때문이에요."}},{"id":"c4","label":"요구한 분수를 계산해요","stepIds":["s6"],"question":"\\(|Mm^3|\\)은 얼마인가요?","hint":"지수 \\(e^3\\)이 약분돼요.","explanation":"\\(|Mm^3|=\\frac1{2e^3}\\left(\\frac{3e}{2}\\right)^3=27/16\\)이에요. 따라서 \\(p=16,q=27\\)이고 \\(p+q=43\\)이에요.","check":{"prompt":"분수는 이미 기약분수인가요?","answer":"\\(27\\)과 \\(16\\)은 서로소이므로 기약분수예요."}}],"takeaway":["모든 실수에서의 지수함수 부등식은 접선이 되는 경계값으로 바꿔요.","매개변수 범위를 먼저 정한 뒤 그 범위 안에서 극값을 구해요.","내부 정지점과 구간 끝점을 모두 비교해요."]};</script>
