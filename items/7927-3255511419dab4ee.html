<script>window.HandStudyRecord={"itemId":7927,"sourceLabel":"2020 교육청 고2 수학 3월 30번","adminYear":2020,"grade":2,"month":3,"number":30,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"함수 $f(x)= \\sqrt{ax-3} +2\\ \\left( a \\geq \\frac{3}{2} \\right)\\,$에 대하여 집합 $\\{ x \\mid x \\geq 2 \\}\\,$에서 정의된 함수\n $g(x)=\\begin{cases} f(x) & (f(x)<f^{-1}(x)\\text{인 경우}) \\\\ f^{-1}(x) & (f(x) \\geq f^{-1}(x)\\text{인 경우}) \\end{cases}$\n가 있다. 자연수 $n\\,$에 대하여 함수 $y=g(x)\\,$의 그래프와 직선 $y=x-n\\,$이 만나는 서로 다른 점의 개수를 $h(n)\\,$이라 하자.\n $h(1)=h(3)<h(2)\\,$\n일 때, $g(4)= \\frac{q}{p} \\,$이다. $p+q\\,$의 값을 구하시오. (단, $a\\,$는 상수이고, $p\\,$와 $q\\,$는 서로소인 자연수이다.) [4점]","answer":"13","sourceHash":"c2d456cdda2e124c5258a9db5366af4ded538fa1cb89a6d812c88bdb14c07256","steps":[{"id":"s1","latex":"g(x)\\text{는 }f(x)\\text{와 }f^{-1}(x)\\text{ 중 작은 값}"},{"id":"s2","latex":"f(x)=x\\iff x^2-(a+4)x+7=0;\\quad t\\text{는 이 방정식의 큰 근}"},{"id":"s3","latex":"g(x)=\\begin{cases}\\dfrac{(x-2)^2+3}{a}&(2\\le x\\le t)\\\\\\sqrt{ax-3}+2&(x\\ge t)\\end{cases}"},{"id":"s4","latex":"\\text{이차함수 조각과의 교점:}\\quad x^2-(a+4)x+7+an=0"},{"id":"s5","latex":"h(2)>h(3)\\Rightarrow a^2-12>0"},{"id":"s6","latex":"h(1)=h(3)\\Rightarrow n=3\\text{일 때 중근이 생긴다}"},{"id":"s7","latex":"a^2-4a-12=0,\\quad a\\ge\\dfrac32\\Rightarrow a=6"},{"id":"s8","latex":"2<4<t\\Rightarrow g(4)=\\dfrac{(4-2)^2+3}{6}=\\dfrac76"},{"id":"s9","latex":"p+q=6+7=13"}],"diagram":null,"contentHash":"7525cfc1e8ea152f9a4cce831dc346a67fa3d0994241d4693367a2e0c0cf170c","questionHtml":"<p class=\"hp htall\">함수 <span class=\"heq\">\\(f(x)= \\sqrt{ax-3} +2\\,\\)<\/span><span class=\"heq\">\\(\\left( a{\\geq} \\dfrac{3}{2} \\right) \\,\\)<\/span>에 대하여 집합 <span class=\"heq\">\\(\\left\\{ x\\,|\\,x{\\geq}2 \\right\\} \\,\\)<\/span>에서 정의된 함수<\/p><table class=\"htbl\"><tr><td style=\"width:102px\"><p class=\"hp htall\"><span class=\"heq\">\\(g(x)= {\\begin{cases}\\,f(x)_{{}_{\\begin{matrix}\\, \\\\ \\,\\end{matrix}}}&_{{}_{\\begin{matrix}\\, \\\\ \\,\\end{matrix}}} \\\\ \\,f^{-1} (x) &\\end{cases}}\\)<\/span><\/p><\/td><td style=\"width:245px\"><p class=\"hp\">(<span class=\"heq\">\\(f(x)\\,\\lt f^{-1} (x)\\,\\)<\/span>인 경우)<\/p><p class=\"hp\">(<span class=\"heq\">\\(f(x) \\geq f^{-1} (x)\\,\\)<\/span>인 경우)<\/p><\/td><\/tr><\/table><p class=\"hp\">가 있다. 자연수 <span class=\"heq\">\\(n\\,\\)<\/span>에 대하여 함수 <span class=\"heq\">\\(y=g(x)\\,\\)<\/span>의 그래프와 직선 <span class=\"heq\">\\(y=x-n\\,\\)<\/span>이 만나는 서로 다른 점의 개수를 <span class=\"heq\">\\(h(n)\\,\\)<\/span>이라 하자.<\/p><p class=\"hp\">&emsp;<span class=\"heq\">\\(h(1)=h(3)\\lt h(2)\\,\\)<\/span><\/p><p class=\"hp htall\">일 때, <span class=\"heq\">\\(g(4)= \\dfrac{q}{p} \\,\\)<\/span>이다. <span class=\"heq\">\\(p+q\\,\\)<\/span>의 값을 구하시오. (단, <span class=\"heq\">\\(a\\,\\)<\/span>는 상수이고, <span class=\"heq\">\\(p\\,\\)<\/span>와 <span class=\"heq\">\\(q\\,\\)<\/span>는 서로소인 자연수이다.) <span class=\"hscore\">[4점]<\/span><\/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"3403f99d98470e405fd1576a39059008838120bd6111e90ebbc0985b8aae75c5"};</script>
<script>window.HandStudyGuide={"sourceHash":"c2d456cdda2e124c5258a9db5366af4ded538fa1cb89a6d812c88bdb14c07256","contentHash":"7525cfc1e8ea152f9a4cce831dc346a67fa3d0994241d4693367a2e0c0cf170c","overview":{"goal":"함수와 역함수 중 아래쪽 그래프를 고른 \\(g\\)의 조각식을 구하고, 직선과의 교점 수 변화로 \\(a\\)를 정해요.","firstLook":"\\(f\\)와 \\(f^{-1}\\)의 교점은 \\(y=x\\) 위에 있어 \\(f(x)=x\\)의 근으로 찾을 수 있어요. 큰 고정점 \\(t\\)를 기준으로 아래쪽 그래프가 바뀌어요.","conditions":[{"label":"정의역","meaning":"\\(g\\)는 \\(x\\ge2\\)에서만 정의되므로 이차방정식의 근이 실제 구간과 조각에 들어오는지 확인해요."},{"label":"교점 수","meaning":"\\(h(1)=h(3)<h(2)\\)는 \\(n=3\\)에서 두 교점이 하나로 합쳐지는 접선 상황을 만들어요."}]},"chapters":[{"id":"c1","label":"g를 두 그래프의 아래쪽으로 나타내요","stepIds":["s1","s2","s3"],"question":"f와 역함수의 큰 교점 t 전후에서 g의 식이 왜 바뀌나요?","hint":"\\(f\\)의 그래프와 \\(y=x\\)의 위치를 보고, 역함수 그래프가 \\(y=x\\) 대칭이라는 점을 이용하세요.","explanation":"\\(g\\)는 \\(f\\)와 역함수 중 작은 값이에요. \\(f(x)=x\\)의 큰 근을 \\(t\\)라 하면 두 그래프의 대칭성과 증가성으로 \\(2\\le x\\le t\\)에서는 \\(f^{-1}(x)=((x-2)^2+3)/a\\), \\(x\\ge t\\)에서는 \\(f(x)\\)를 택해요.","check":{"prompt":"\\(2\\le x\\le t\\)에서 사용하는 식은 무엇인가요?","answer":"\\(f^{-1}(x)=\\dfrac{(x-2)^2+3}{a}\\)이고 이 구간에서 이 값이 더 작아요."}},{"id":"c2","label":"교점 개수 조건으로 a를 정해요","stepIds":["s4","s5","s6","s7"],"question":"직선 \\(y=x-n\\)과 이차 조각의 교점 방정식은 무엇이며 판별식은 어떻게 변하나요?","hint":"\\(\\dfrac{(x-2)^2+3}{a}=x-n\\)의 양변에 \\(a\\)를 곱하세요.","explanation":"먼저 큰 고정점을 \\(t\\)라 하면 \\(x\\ge t\\)에서 \\(f'(x)=a/(2\\sqrt{ax-3})\\)는 계속 작아져요. 고정점 식으로 확인하면 \\(f'(t)<1\\)이므로 이 조각에서는 \\(f(x)-(x-n)\\)이 감소해요. \\(x=t\\)에서는 \\(f(t)=t>t-n\\)이고 \\(x\\)가 커지면 차가 음수가 되므로, \\(n=1,2,3\\) 각각에서 이 조각과 직선은 정확히 한 번 만나요. 이 공통 교점 하나를 제외하면 해의 개수 차이는 \\(2\\le x\\le t\\)의 역함수 조각에서만 생겨요.\n\n이차 조각의 교점 방정식은\n\n\\(Q_n(x)=x^2-(a+4)x+7+an=0\\)\n\n이고 판별식은 \\(D_n=a^2+(8-4n)a-12\\)예요. \\(h(2)>h(3)\\)이려면 \\(n=2\\)에서 두 근이 생겨야 하므로 \\(D_2=a^2-12>0\\), 따라서 \\(a>\\sqrt{12}>3\\)이에요. 이때 \\(Q_1(2)=3-a<0\\), \\(Q_1(t)=a>0\\)이므로 \\(n=1\\)에서는 실제 구간에 근이 하나예요. 한편 \\(Q_3(2)=a+3>0\\), \\(Q_3(t)=3a>0\\)이어서 \\(n=3\\)의 근은 \\(0\\)개, 중근 \\(1\\)개, 서로 다른 두 근 중 하나예요. \\(h(1)=h(3)\\)이 되려면 \\(n=3\\)에서도 이차 조각의 교점이 하나여야 하므로 판별식이 \\(0\\)이어야 해요.\n\n\\(D_3=a^2-4a-12=0\\)\n\n에서 \\(a=6\\) 또는 \\(-2\\)이고, \\(a\\ge3/2\\)이므로 \\(a=6\\)이에요. 이때 \\(t=5+3\\sqrt2\\)이고 실제로 역함수 조각의 교점 수는 \\(n=1,2,3\\)에서 각각 \\(1,2,1\\)이라 전체 교점 수도 \\(2,3,2\\)가 돼요.","check":{"prompt":"\\(n=3\\)에서 중근 조건이 주는 방정식은 무엇인가요?","answer":"판별식이 \\(a^2-4a-12=0\\)이 되어 \\(a=6\\) 또는 \\(-2\\)를 주고, \\(a\\ge\\dfrac32\\)라 \\(6\\)만 남아요."}},{"id":"c3","label":"g(4)와 답을 계산해요","stepIds":["s8","s9"],"question":"구한 \\(a\\)에서 \\(x=4\\)가 어느 조각에 들어가는지 어떻게 확인하나요?","hint":"\\(f(x)=x\\)의 큰 근 \\(t\\)와 \\(4\\)를 비교하거나 두 조각의 전환점을 계산하세요.","explanation":"\\(a=6\\)이면 고정점 방정식은 \\(x^2-10x+7=0\\)이고 큰 근은 \\(t=5+3\\sqrt2\\)예요. \\(4<t\\)이므로 \\(x=4\\)에서는 이차 조각을 써요. \\(g(4)=((4-2)^2+3)/6=7/6\\), 서로소인 \\(p=6,q=7\\)이므로 답은 13이에요.","check":{"prompt":"\\(g(4)\\)를 계산한 뒤 분수의 서로소 조건은 어떻게 확인하나요?","answer":"\\(g(4)=\\dfrac{(4-2)^2+3}{6}=\\dfrac76\\)이고 \\(6,7\\)은 서로소라 \\(p+q=13\\)이에요."}}],"takeaway":["함수와 역함수의 대소는 \\(y=x\\)와의 교점을 기준으로 구간별로 판단해요.","교점 개수 조건에서는 판별식뿐 아니라 근이 실제 조각의 정의역 안에 있는지도 확인해요.","구한 매개변수를 원래 조각 경계에 대입한 뒤 요구한 함숫값을 계산해요."],"itemId":7927};</script>
