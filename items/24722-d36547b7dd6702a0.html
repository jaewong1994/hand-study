<script>window.HandStudyGuide={"itemId":24722,"sourceHash":"89b37850a48c6c2c8dd6f3aca7ac75a9a89c847778a1746292ce3f94ef355775","contentHash":"1e9f1999188aec7a40d0f512cfc9d6aac527d09a2c00ec353f45e4e06ebb1d0a","overview":{"goal":"둘째 항을 하나의 문자로 놓고 8과 15의 첨자 경로를 따라 점화식을 반복하여 초항을 구합니다.","firstLook":"8은 짝수 조건을, 15는 홀수 조건을 거듭 적용합니다. 두 항의 공통 세제곱항이 소거됩니다.","conditions":[{"label":"초항의 범위","meaning":"\\(0<a_1<1\\)에서 \\(a_2>1\\)을 얻어 방정식의 근을 고릅니다."},{"label":"짝수·홀수 첨자","meaning":"각 첨자가 2n인지 2n+1인지에 맞는 식을 적용합니다."}]},"chapters":[{"id":"c1","label":"둘째 항과 초항을 연결합니다","stepIds":["s1"],"question":"\\(n=1\\)을 짝수 항 식에 넣으면 무엇을 얻나요?","hint":"\\(a_2\\)가 식의 양쪽에 나타납니다.","explanation":"\\(r=a_2\\)라 두면 \\(r=ra_1+1\\), 즉 \\(r(1-a_1)=1\\)입니다. 따라서 \\(r=1/(1-a_1)\\)이고, \\(0<a_1<1\\)이므로 \\(r>1\\)입니다.","check":{"prompt":"나중에 r>1이 필요한 까닭은 무엇인가요?","answer":"\\(r=4\\)와 \\(r=-5\\) 중에서 초항 조건에 맞는 근만 고르기 위해서입니다."}},{"id":"c2","label":"여덟째 항을 계산합니다","stepIds":["s2"],"question":"2에서 8까지 어떤 순서로 계산하나요?","hint":"첨자를 2에서 4, 4에서 8로 늘리며 짝수 식을 두 번 씁니다.","explanation":"\\(a_4=ra_2+1=r^2+1\\)이고, \\(a_8=ra_4+1=r(r^2+1)+1=r^3+r+1\\)입니다. 각 단계 끝의 1을 빠뜨리지 않습니다.","check":{"prompt":"a₈의 일차항 r은 어디에서 생기나요?","answer":"a₄의 상수항 1에 r을 곱할 때 생깁니다."}},{"id":"c3","label":"열다섯째 항을 계산합니다","stepIds":["s3","s4","s5"],"question":"3, 7, 15를 따라가면 식이 어떻게 이어지나요?","hint":"모두 2n+1 꼴입니다.","explanation":"\\(a_3=ra_1-2=(r-1)-2=r-3\\)입니다. 이어서 \\(a_7=r(r-3)-2=r^2-3r-2\\), \\(a_{15}=r(r^2-3r-2)-2=r^3-3r^2-2r-2\\)입니다.","check":{"prompt":"a₃가 r-2가 아니라 r-3인 이유는 무엇인가요?","answer":"\\(ra_1=r-1\\)인 데서 다시 2를 빼기 때문입니다."}},{"id":"c4","label":"차를 이용해 r을 정합니다","stepIds":["s6","s7"],"question":"\\(a_8-a_{15}=63\\)에서 어떤 방정식이 남나요?","hint":"\\(r^3\\)항이 소거됩니다.","explanation":"\\(a_8-a_{15}=3r^2+3r+3=63\\)이므로 \\(r^2+r-20=0\\), 곧 \\((r-4)(r+5)=0\\)입니다. \\(r>1\\)이므로 \\(r=4\\), \\(a_1=1-1/r=3/4\\)입니다.","check":{"prompt":"\\(r=-5\\)를 제외하는 직접 근거는 무엇인가요?","answer":"\\(0<a_1<1\\)에서 \\(r=1/(1-a_1)>1\\)이기 때문입니다."}},{"id":"c5","label":"조건과 답을 확인합니다","stepIds":["s8","s9"],"question":"구한 값이 원래 차를 만족하나요?","hint":"\\(r=4\\)를 두 항에 넣으세요.","explanation":"\\(a_8=69\\), \\(a_{15}=6\\)이어서 차는 63입니다. 따라서 \\(a_8/a_1=69/(3/4)=69\\times4/3=92\\)입니다.","check":{"prompt":"69를 3/4로 나눌 때 왜 4/3을 곱하나요?","answer":"분수로 나누는 것은 그 역수를 곱하는 것과 같기 때문입니다."}}],"takeaway":["2n과 2n+1 점화식은 목표 첨자의 경로를 따라 반복합니다.","초항의 범위에서 얻은 부호 조건으로 불필요한 근을 제외합니다."]};</script>
