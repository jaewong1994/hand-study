<script>window.HandStudyRecord={"itemId":7798,"sourceLabel":"2019 교육청 고2 수학가형 9월 21번","adminYear":2019,"grade":2,"month":9,"number":21,"track":"수학가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"공차가 양수인 등차수열 $\\left\\{ a _{n} \\right\\} \\,$이 다음 조건을 만족시킬 때, $a _{14} \\,$의 값은? [4점]\n(가) $\\sum _{n=1} ^{2m-1} a _{n} =0\\,$을 만족시키는 자연수 $m\\,$이 존재한다.(나) $2 \\sum _{n=1} ^{15} \\,a _{n} = \\sum _{n=1} ^{15} \\, \\left| a _{n} \\right| =90\\,$\n① $6$ ② $8$ ③ $10$ ④ $12$ ⑤ $14$\n단 답 형","answer":"④","sourceHash":"26389690030c1ab3a5f10b9e532089207106b3076411223c682d605a9812ec14","steps":[{"id":"s1","latex":"\\sum_{n=1}^{2m-1}a_n=(2m-1)a_m=0\\Rightarrow a_m=0"},{"id":"s2","latex":"2S_{15}=90\\Rightarrow15(8-m)d=45"},{"id":"s3","latex":"\\sum_{n=1}^{15}|a_n|=S_{15}+2\\sum_{n=1}^{m-1}(-a_n)=45+m(m-1)d=90"},{"id":"s4","latex":"m=6,\\quad d=\\frac32"},{"id":"s5","latex":"a_{14}=(14-6)d=12"}],"diagram":null,"contentHash":"d2e4c87994e21050aadb758d8ec36c644b46abf0b48c2f15f276c0d48003478b","questionHtml":"\u003cp class=\"hp\">공차가 양수인 등차수열 \u003cspan class=\"heq\">\\(\\left\\{ a_{n} \\right\\} \\,\\)\u003c/span>이 다음 조건을 만족시킬 때, \u003cspan class=\"heq\">\\(a_{14} \\,\\)\u003c/span>의 값은? \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003ctable class=\"htbl\">\u003ctr>\u003ctd colspan=\"3\" style=\"width:408px\">&nbsp;\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"width:7px\">&nbsp;\u003c/td>\u003ctd style=\"width:393px\">\u003cp class=\"hp htall\">(가) \u003cspan class=\"heq\">\\(\\sum\\limits_{n=1}^{2m-1} a_{n} =0\\,\\)\u003c/span>을 만족시키는 자연수 \u003cspan class=\"heq\">\\(m\\,\\)\u003c/span>이 존재한다.\u003c/p>\u003cp class=\"hp htall\">(나) \u003cspan class=\"heq\">\\(2 \\sum\\limits_{n=1}^{15} \\,a_{n} = \\sum\\limits_{n=1}^{15} \\, \\left| a_{n} \\right| =90\\,\\)\u003c/span>\u003c/p>\u003c/td>\u003ctd style=\"width:7px\">&nbsp;\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"3\" style=\"width:408px\">&nbsp;\u003c/td>\u003c/tr>\u003c/table>\u003cp class=\"hp\">① \u003cspan class=\"heq\">\\(6\\)\u003c/span>&emsp;② \u003cspan class=\"heq\">\\(8\\)\u003c/span>&emsp;③ \u003cspan class=\"heq\">\\(10\\)\u003c/span>&emsp;④ \u003cspan class=\"heq\">\\(12\\)\u003c/span>&emsp;⑤ \u003cspan class=\"heq\">\\(14\\)\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"0d64542e6f2fd86fc6ae912ec51961d52ddbf22e13e7cd1b36ab0e99b4ae62a3"};</script>
<script>window.HandStudyGuide={"itemId":7798,"sourceHash":"26389690030c1ab3a5f10b9e532089207106b3076411223c682d605a9812ec14","contentHash":"d2e4c87994e21050aadb758d8ec36c644b46abf0b48c2f15f276c0d48003478b","overview":{"goal":"홀수 개 항의 합이 0이라는 조건으로 0인 항의 위치를 정하고, 절댓값 합에서 음수 부분의 크기를 찾아 m과 공차를 구해요.","firstLook":"공차가 양수라 수열은 한 번만 0을 지나요. 앞의 홀수 개 항 합이 0이면 그 구간의 가운데 항이 바로 0이에요.","conditions":[{"label":"양의 공차","meaning":"공차 \\(d>0\\)이므로 \\(a_m=0\\) 앞의 항은 음수, 뒤의 항은 양수예요."},{"label":"보통 합","meaning":"처음 \\(15\\)항의 합은 \\(45\\)예요."},{"label":"절댓값 합","meaning":"처음 \\(15\\)항의 절댓값 합은 \\(90\\)이에요."}]},"chapters":[{"id":"c1","label":"가운데 항을 0으로 정해요","stepIds":["s1"],"question":"처음 \\(2m-1\\)항의 합이 0이면 왜 \\(a_m=0\\)일까요?","hint":"등차수열의 홀수 개 항은 가운데 항을 기준으로 대칭인 두 항의 평균이 가운데 항과 같아요.","explanation":"등차수열의 처음 \\(2m-1\\)항 합은 항의 개수와 가운데 항의 곱인 \\((2m-1)a_m\\)이에요. 이 값이 \\(0\\)이고 \\(2m-1>0\\)이므로 \\(a_m=0\\)이에요. 따라서 모든 항을 \\(a_n=(n-m)d\\)로 나타낼 수 있어요.","check":{"prompt":"\\(a_1\\)은 \\(m,d\\)로 어떻게 쓰나요?","answer":"\\(a_1=(1-m)d\\)예요."}},{"id":"c2","label":"보통 합으로 m과 d의 첫 관계를 만들어요","stepIds":["s2"],"question":"\\(2S_{15}=90\\)은 어떤 식이 되나요?","hint":"첫 항과 열다섯째 항의 평균 또는 가운데 \\(a_8\\)을 사용해요.","explanation":"\\(S_{15}=45\\)이고 열다섯 항의 가운데는 \\(a_8=(8-m)d\\)예요. 따라서 \\(S_{15}=15a_8=15(8-m)d=45\\), 즉 \\((8-m)d=3\\)이에요. \\(d>0\\)이므로 \\(m<8\\)도 알 수 있어요.","check":{"prompt":"\\(a_8\\)은 얼마인가요?","answer":"합을 \\(15\\)로 나누면 \\(a_8=3\\)이에요."}},{"id":"c3","label":"절댓값 합으로 음수 부분을 되돌려요","stepIds":["s3","s4"],"question":"절댓값 합과 보통 합의 차 \\(45\\)는 무엇을 뜻할까요?","hint":"음수 항 하나는 절댓값을 취하면 원래 합보다 그 크기의 두 배만큼 커져요.","explanation":"음수 항은 \\(a_1,\\ldots,a_{m-1}\\)이고 절댓값 합은 보통 합에 이 항들의 크기 두 배를 더한 값이에요. 그 크기 합은\n\\[\n\\sum_{n=1}^{m-1}(-a_n)=d\\{(m-1)+(m-2)+\\cdots+1\\}=\\frac{m(m-1)d}{2}.\n\\]\n따라서 \\(90=45+m(m-1)d\\), 즉 \\(m(m-1)d=45\\)예요. 이를 \\((8-m)d=3\\)과 나누면 \\(m(m-1)=15(8-m)\\), 정리해 \\(m^2+14m-120=0\\)이에요. 자연수 해는 \\(m=6\\)이고 \\(d=3/(8-6)=3/2\\)예요.","check":{"prompt":"다른 이차방정식의 해가 자연수가 아닌 이유는 무엇인가요?","answer":"인수분해하면 \\((m-6)(m+20)=0\\)이라 다른 해는 \\(-20\\)이에요."}},{"id":"c4","label":"열네째 항을 계산해요","stepIds":["s5"],"question":"\\(a_{14}\\)의 값은 얼마인가요?","hint":"\\(a_n=(n-m)d\\)에 \\(m=6,d=3/2\\)를 넣어요.","explanation":"\\(a_{14}=(14-6)(3/2)=8\\cdot3/2=12\\)예요. 따라서 정답은 ④예요.","check":{"prompt":"공차가 양수라는 조건과 맞나요?","answer":"\\(d=3/2>0\\)이므로 맞아요."}}],"takeaway":["홀수 개 등차수열의 합은 항의 개수와 가운데 항의 곱으로 계산할 수 있어요.","절댓값 합은 보통 합에 음수 항들의 크기 두 배를 더한 값이에요.","두 합 조건에서 얻은 식을 나누면 공차를 없애 0인 항의 위치를 먼저 구할 수 있어요."]};</script>
