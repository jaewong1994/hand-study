  <script>window.HandStudyRecord={"adminYear":2022,"answer":"②","contentHash":"9c48a5b643a59706d280943a6e37840b6fb5ab42ac33ee3e05fb7967aeb47a46","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24843,"month":11,"number":28,"points":4,"preview":false,"questionHtml":"\u003cp>그림과 같이 중심이 \u003cspan class=\"heq\">\\(O\\)\u003c/span>이고 길이가 \u003cspan class=\"heq\">\\(2\\)\u003c/span>인 선분 \u003cspan class=\"heq\">\\(A B\\)\u003c/span>를 지름으로 하는 반원 위에 \u003cspan class=\"heq\">\\(\\angle {A O C}= \\frac{\\pi}{2}\\)\u003c/span>인 점 \u003cspan class=\"heq\">\\(C\\)\u003c/span>가 있다. 호 \u003cspan class=\"heq\">\\(B C\\)\u003c/span> 위에 점 \u003cspan class=\"heq\">\\(P\\)\u003c/span>와 호 \u003cspan class=\"heq\">\\(C A\\)\u003c/span>위에 점 \u003cspan class=\"heq\">\\(Q\\)\u003c/span>를 \u003cspan class=\"heq\">\\(\\overline{P B}=\\overline{Q C}\\)\u003c/span>가 되도록 잡고, 선분 \u003cspan class=\"heq\">\\(A P\\)\u003c/span> 위에 점 \u003cspan class=\"heq\">\\(R\\)\u003c/span>를 \u003cspan class=\"heq\">\\(\\angle {C Q R}= \\frac{\\pi}{2}\\)\u003c/span>가 되도록 잡는다. 선분 \u003cspan class=\"heq\">\\(A P\\)\u003c/span>와 선분 \u003cspan class=\"heq\">\\(C O\\)\u003c/span>의 교점을 \u003cspan class=\"heq\">\\(S\\)\u003c/span>라 하자. \u003cspan class=\"heq\">\\(\\angle {P A B}=\\,\\theta\\)\u003c/span>일 때, 삼각형 \u003cspan class=\"heq\">\\(P O B\\)\u003c/span>의 넓이를 \u003cspan class=\"heq\">\\(f \\left( \\theta \\right)\\)\u003c/span>, 사각형 \u003cspan class=\"heq\">\\(C Q R S\\)\u003c/span>의 넓이를 \u003cspan class=\"heq\">\\(g \\left( \\theta \\right)\\)\u003c/span>라 하자. \u003cspan class=\"heq\">\\(\\lim _{\\theta \\, \\rightarrow \\,0+} {\\, }\\frac{3f \\left( \\theta \\right) -2\\,g( \\theta )}{\\theta ^{2}}\\)\u003c/span>의 값은? \u003cspan class=\"heq\">\\((\\)\u003c/span>단, \u003cspan class=\"heq\">\\(0&lt; \\theta &lt; \\frac{\\pi }{4}\\)\u003c/span>) [4점]\u003c/p>\u003cfigure>\u003cimg class=\"hfig\" src=\"../assets/csat/24843-d9f9add32d77b474.png\" alt=\"2022년 시행 수능 28번 문항 그림 \" style=\"max-width:100%;width:420px\">\u003c/figure>\u003cdiv class=\"hchoices\">\u003cdiv class=\"hch\">① \u003cspan class=\"heq\">\\(1\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">② \u003cspan class=\"heq\">\\(2\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">③ \u003cspan class=\"heq\">\\(3\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">④ \u003cspan class=\"heq\">\\(4\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">⑤ \u003cspan class=\"heq\">\\(5\\)\u003c/span>\u003c/div>\u003c/div>","questionText":"그림과 같이 중심이 $O$이고 길이가 $2$인 선분 $A B$를 지름으로 하는 반원 위에 $ang \\leq {A O C}= \\frac{\\pi}{2}$인 점 $C$가 있다. 호 $B C$ 위에 점 $P$와 호 $C A$위에 점 $Q$를 $\\overline{P B}=\\overline{Q C}$가 되도록 잡고, 선분 $A P$ 위에 점 $R$를 $ang \\leq {C Q R}= \\frac{\\pi}{2}$가 되도록 잡는다. 선분 $A P$와 선분 $C O$의 교점을 $S$라 하자. $ang \\leq {P A B}=\\,\\theta$일 때, 삼각형 $P O B$의 넓이를 $f \\left( \\theta \\right)$, 사각형 $C Q R S$의 넓이를 $g \\left( \\theta \\right)$라 하자. $\\lim _{\\theta \\, \\rightarrow \\,0+} {\\, }\\frac{3f \\left( \\theta \\right) -2\\,g( \\theta )}{\\theta ^{2}}$의 값은? $\\left( \\pi \\leq {\\,#\\,} \\right.$단, $0\u003c \\theta \u003c \\frac{\\pi }{4} \\right)$ [4점]\n① $1$ ② $2$ ③ $3$ ④ $4$ ⑤ $5$\n단답형","sourceHash":"721e2027ce883867cf07df4e1af83af5579756a4855f77fb437297c54b8d933f","sourceKind":"csat","sourceLabel":"2022년 시행 수능 · 2023학년도 · 미적분 · 28번","steps":[{"id":"s1","latex":"\\angle\\mathrm{BOP}=2\\theta\\ \\Rightarrow\\ f(\\theta)=\\frac12\\sin2\\theta=\\sin\\theta\\cos\\theta"},{"id":"s2","latex":"\\mathrm{OS}=\\tan\\theta,\\quad\\mathrm{CS}=1-\\tan\\theta>0"},{"id":"s3","latex":"\\mathrm{CQ}=\\mathrm{PB}=2\\sin\\theta,\\quad\\angle\\mathrm{COQ}=2\\theta"},{"id":"s4","latex":"\\mathrm{CQ}\\parallel\\mathrm{AP}\\text{이므로 }\\mathrm{CQ}\\parallel\\mathrm{RS},\\quad\\mathrm{QR}\\perp\\mathrm{CQ}"},{"id":"s5","latex":"\\mathrm H\\text{를 }\\mathrm S\\text{에서 직선 }\\mathrm{CQ}\\text{에 내린 수선의 발이라 하면 }\\angle\\mathrm{CSH}=\\theta"},{"id":"s6","latex":"\\mathrm{QR}=\\mathrm{SH}=(1-\\tan\\theta)\\cos\\theta,\\quad\\mathrm{CH}=(1-\\tan\\theta)\\sin\\theta"},{"id":"s7","latex":"\\mathrm{RS}=\\mathrm{QH}=\\mathrm{CQ}-\\mathrm{CH}=\\sin\\theta(1+\\tan\\theta)"},{"id":"s8","latex":"g(\\theta)=\\frac12(\\mathrm{CQ}+\\mathrm{RS})\\mathrm{QR}=\\frac12\\sin\\theta\\cos\\theta(3+\\tan\\theta)(1-\\tan\\theta)"},{"explanation":{"body":"분모가 \\(\\theta^2\\)라서 분자의 첫 번째 크기뿐 아니라 서로 빼서 남는 양까지 봐야 해요. 먼저 \\(\\sin\\theta\\cos\\theta\\)를 묶으면 괄호가 \\(\\tan\\theta(2+\\tan\\theta)\\)로 정리돼요. 그다음 \\(\\theta\\) 두 개를 각각 \\(\\sin\\theta\\), \\(\\tan\\theta\\)와 짝지으면 배운 기본 극한으로 계산할 수 있어요.","skillTags":["limits.trigonometric-cancellation"],"title":"작은 각이라고 바로 대입하면 안 돼요"},"id":"s9","latex":"3f-2g=\\sin\\theta\\cos\\theta\\{3-(3+\\tan\\theta)(1-\\tan\\theta)\\}"},{"id":"s10","latex":"=\\sin\\theta\\cos\\theta\\tan\\theta(2+\\tan\\theta)"},{"id":"s11","latex":"\\lim_{\\theta\\to0+}\\frac{3f-2g}{\\theta^2}=\\lim_{\\theta\\to0+}\\frac{\\sin\\theta}{\\theta}\\frac{\\tan\\theta}{\\theta}\\cos\\theta(2+\\tan\\theta)=\\boxed2\\quad\\text{②}"}],"track":"미적분"};</script>
