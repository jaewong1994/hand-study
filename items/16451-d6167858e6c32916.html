<script>window.HandStudyRecord={"itemId":16451,"sourceLabel":"2019 교육청 고3 수리나형 5월 20번","adminYear":2019,"grade":3,"month":5,"number":20,"track":"수리나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 ${\\overline{A _{1} B _{1}}} =1+ \\sqrt{3}$, ${\\overline{B _{1} C}} =3+ \\sqrt{3}$인 직사각형 $A _{1} B _{1} CD _{1} \\,$이 있다. 직사각형 $A _{1} B _{1} CD _{1} \\,$의 내부에 점 $A _{1}$을 중심으로 하고 반지름의 길이가 $\\left( \\sqrt{3} -1 \\right) {\\overline{A _{1} B _{1}}}$인 사분원을 그릴 때, 이 사분원이 두 선분 $A_1 B_1$, $A _{1} D _{1}$과 만나는 점을 각각 $E _{1}$, $F_1$이라 하고, 호 $E_1 F_1$의 길이를 3등분하는 점 중에서 점 $E _{1}$에 가까운 점을 $G_1$이라 하자. 사분원 $A _{1} E _{1} F _{1} \\,$의 내부와 세 점 $G_1$, $C$, $F_1$을 지나는 원의 내부의 공통부분에 색칠하여 얻은 그림을 $R_1$이라 하자. 그림 $R_1$에서 점 $F_1$을 지나고 선분 $A _{1} D _{1}$에 수직인 직선이 선분 $B _{1} C$와 만나는 점을 $B _{2}$라 하고, 선분 $F _{1} B _{2}$와 선분 $A _{1} C$의 교점을 $A _{2}$, 점 $A _{2}$에서 선분 $D _{1} C$에 내린 수선의 발을 $D _{2}$라 하자. 직사각형 $A _{2} B _{2} CD _{2} \\,$의 내부에 점 $A _{2}$을 중심으로 하고 반지름의 길이가 $\\left( \\sqrt{3} -1 \\right) {\\overline{A _{2} B _{2}}}$인 사분원을 그릴 때, 이 사분원이 두 선분 $A _{2} B _{2}$, $A _{2} D _{2}$과 만나는 점을 각각 $E _{2}$, $F _{2}$라 하고, 호 $E _{2} F _{2}$의 길이를 3등분하는 점 중에서 점 $E _{2}$에 가까운 점을 $G _{2}$라 하자. 사분원 $A _{2} E _{2} F _{2} \\,$의 내부와 세 점 $G _{2}$, $C$, $F _{2}$을 지나는 원의 내부의 공통부분에 색칠하여 얻은 그림을 $R _{2}$라 하자. 이와 같은 과정을 계속하여 $n$번째 얻은 그림 $R _{n}$에 색칠되어 있는 부분의 넓이를 $S_n$이라 할 때, $\\lim _{n -> \\infty } {} S _{n}$의 값은? [4점]\n① $\\pi- \\sqrt{ 3}$ ② $2\\pi-3 \\sqrt{ 3}$ ③ $2\\pi-2 \\sqrt{ 3}$\n④ $2\\pi- \\sqrt{ 3}$ ⑤ $3\\pi-2 \\sqrt{ 3}$","answer":"②","sourceHash":"fdb311e41a7130a34180f570cef8f039e66e22ab30f833be5ac9e38488dd177d","steps":[{"id":"s1","latex":"a_n=S_n-S_{n-1},\\quad S_0=0\\quad\\text{(이번 단계에서 더해진 넓이)}"},{"id":"s2","latex":"A_1=(0,0),\\quad F_1=(0,2),\\quad G_1=(\\sqrt3,1),\\quad C=(1+\\sqrt3,3+\\sqrt3)"},{"id":"s3","latex":"O_1=(\\sqrt3,3)\\Rightarrow O_1F_1=O_1G_1=O_1C=2"},{"id":"s4","latex":"A_1F_1=A_1G_1=F_1G_1=2,\\quad O_1F_1=O_1G_1=F_1G_1=2"},{"id":"s5","latex":"\\angle F_1A_1G_1=\\angl
