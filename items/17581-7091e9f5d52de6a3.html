          <option value="4000">천천히</option>
          <option value="2200" selected>보통</option>
          <option value="1200">빠르게</option>
        </select>
      </label>
    </div>

    <article class="hs-paper" aria-label="순차 손풀이">
      <figure class="hs-diagram" id="hs-diagram" hidden></figure>
      <div class="hs-steps" id="hs-steps"></div>
      <p class="hs-prompt" id="hs-prompt">먼저 풀어 보세요.<br>다음 줄을 눌러 한 단계씩 확인합니다.</p>
      <div class="hs-answer" id="hs-answer" hidden></div>
    </article>
    <p class="hs-error" id="hs-error" role="alert"></p>
    <p class="hs-sr-only" id="hs-live" aria-live="polite"></p>

    <p class="hs-help"><kbd>→</kbd> 다음 · <kbd>←</kbd> 이전 · <kbd>H</kbd> 가리기 · <kbd>A</kbd> 전체 · <kbd>P</kbd> 재생</p>
  </main>
</body>
</html>
