<script>window.HandStudyRecord={"adminYear":2022,"answer":"12","contentHash":"c61175c6bd3cf216e621c7250062abcefc29f04bd348b6dc97ca0eea5f5ef678","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24836,"month":11,"number":29,"points":4,"preview":false,"questionHtml":"\u003cp>평면 \u003cspan class=\"heq\">\\(\\alpha\\)\u003c/span> 위에 \u003cspan class=\"heq\">\\({\\overline{ AB }} = {\\overline{ CD }} = {\\overline{ AD }} =2\\)\u003c/span>, \u003cspan class=\"heq\">\\(\\angle ABC = \\angle BCD = \\frac{\\pi }{3}\\)\u003c/span>인 사다리꼴 \u003cspan class=\"heq\">\\({ABCD}\\)\u003c/span>가 있다. 다음 조건을 만족시키는 평면 \u003cspan class=\"heq\">\\(\\alpha\\)\u003c/span> 위의 두 점 \u003cspan class=\"heq\">\\(P\\)\u003c/span>, \u003cspan class=\"heq\">\\(Q\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\({\\vec{ CP }} \\cdot {\\vec{ DQ }}\\)\u003c/span>의 값을 구하시오. [4점]\u003c/p>\u003cdiv class=\"hbox hcond\">\u003cp class=\"hcondr\">(가) \u003cspan class=\"heq\">\\({\\vec{A C}} =2 \\left( {\\vec{AD}} + {\\vec{BP}} \\right)\\)\u003c/span>\u003c/p>\u003cp class=\"hcondr\">(나) \u003cspan class=\"heq\">\\({\\vec{AC}} \\cdot {\\vec{PQ}} =6\\)\u003c/span>\u003c/p>\u003cp class=\"hcondr\">(다) \u003cspan class=\"heq\">\\(2\\times{\\angle BQA}=\\angle PBQ&lt; \\frac{\\pi}{2}\\)\u003c/span>\u003c/p>\u003c/div>\u003cfigure>\u003cimg class=\"hfig\" src=\"../assets/csat/24836-a9e1303a6a35aa32.png\" alt=\"2022년 시행 수능 29번 문항 그림 \" style=\"max-width:100%;width:420px\">\u003c/figure>","questionText":"평면 $\\alpha$ 위에 ${\\overline{ AB }} = {\\overline{ CD }} = {\\overline{ AD }} =2$, $\\angle ABC = \\angle BCD = \\frac{\\pi }{3}$인 사다리꼴 ${ABCD}$가 있다. 다음 조건을 만족시키는 평면 $\\alpha$ 위의 두 점 $P$, $Q$에 대하여 ${\\vec{ CP }} bul \\leq t {\\vec{ DQ }}$의 값을 구하시오. [4점]\n(가) ${\\vec{A C}} =2 \\left( {\\vec{AD}} + {\\vec{BP}} \\right)$(나) ${\\vec{AC}} bul \\leq t {\\vec{PQ}} =6$(다) $2\\times{rmang \\leq BQA}=rmang \\leq PBQ\u003c \\frac{\\pi}{2}$","sourceHash":"d821f07e38d4d41ef0f92e5eb165b5fcd0e915e41e8a1dd66d71211bae7383ec","sourceKind":"csat","sourceLabel":"2022년 시행 수능 · 2023학년도 · 기하 · 29번","steps":[{"id":"s1","latex":"\\mathrm A=(0,\\sqrt3),\\ \\mathrm B=(-1,0),\\ \\mathrm C=(3,0),\\ \\mathrm D=(2,\\sqrt3)"},{"id":"s2","latex":"\\vec{\\mathrm{AC}}=2(\\vec{\\mathrm{AD}}+\\vec{\\mathrm{BP}})\\ \\Rightarrow\\ \\mathrm P=(-\\frac32,-\\frac{\\sqrt3}2)"},{"id":"s3","latex":"\\mathrm Q=(x,y):\\quad(3,-\\sqrt3)\\cdot(x+\\frac32,y+\\frac{\\sqrt3}2)=6"},{"id":"s4","latex":"y=\\sqrt3(x-1)"},{"id":"s5","latex":"\\mathrm A,\\mathrm B,\\mathrm P\\text{가 한 직선에 있고 }\\angle\\mathrm{PBQ}\\text{는 삼각형 }\\mathrm{ABQ}\\text{의 외각}"},{"id":"s6","latex":"2\\angle\\mathrm{BQA}=\\angle\\mathrm{PBQ}=\\angle\\mathrm{BAQ}+\\angle\\mathrm{BQA}\\ \\Rightarrow\\mathrm{BQ}=\\mathrm{AB}=2"},{"id":"s7","latex":"(x+1)^2+y^2=4\\ \\Rightarrow (x+1)^2+3(x-1)^2=4\\ \\Rightarrow\\ x=0,1"},{"id":"s8","latex":"\\mathrm Q=(1,0)\\text{이면 }\\angle\\mathrm{PBQ}=\\frac{2\\pi}3>\\frac\\pi2\\text{이므로 제외}"},{"id":"s9","latex":"\\mathrm Q=(0,-\\sqrt3)\\text{이면 }\\angle\\mathrm{PBQ}=\\frac\\pi3,\\ \\angle\\mathrm{BQA}=\\frac\\pi6\\text{이므로 적합}"},{"id":"s10","latex":"\\vec{\\mathrm{CP}}=(-\\frac92,-\\frac{\\sqrt3}2),\\quad\\vec{\\mathrm{DQ}}=(-2,-2\\sqrt3)"},{"id":"s11","latex":"\\vec{\\mathrm{CP}}\\cdot\\vec{\\mathrm{DQ}}=9+3=\\boxed{12}"}],"track":"기하"};</script>
<script>window.HandStudyGuide={"itemId":24836,"sourceHash":"d821f07e38d4d41ef0f92e5eb165b5fcd0e915e41e8a1dd66d71211bae7383ec","contentHash":"c61175c6bd3cf216e621c7250062abcefc29f04bd348b6dc97ca0eea5f5ef678","overview":{"goal":"사다리꼴을 좌표로 놓아 \\(P\\)를 정하고, 각 조건으로 \\(Q\\)의 두 후보 중 하나를 골라 내적을 구해요.","firstLook":"평행한 두 변을 수평으로 놓으면 네 꼭짓점과 벡터 조건을 좌표로 계산하기 쉬워요.","conditions":[{"label":"(가)","meaning":"점 \\(P\\)의 좌표를 하나로 정해요."},{"label":"(나)","meaning":"점 \\(Q\\)가 놓일 직선을 정해요."},{"label":"(다)","meaning":"그 직선 위 두 후보 중 각이 예각인 하나만 남겨요."}]},"chapters":[{"id":"c1","label":"사다리꼴과 점 P를 좌표로 정해요","stepIds":["s1","s2"],"question":"조건 (가)에서 \\(P\\)는 어떻게 정해지나요?","hint":"\\(A=(0,\\sqrt3)\\), \\(B=(-1,0)\\), \\(C=(3,0)\\), \\(D=(2,\\sqrt3)\\)을 넣어 벡터 성분을 비교해요.","explanation":"주어진 길이와 \\(60^\\circ\\) 각을 만족하도록 \\(A=(0,\\sqrt3)\\), \\(B=(-1,0)\\), \\(C=(3,0)\\), \\(D=(2,\\sqrt3)\\)로 둘 수 있어요. \\(\\overrightarrow{AC}=(3,-\\sqrt3)\\), \\(\\overrightarrow{AD}=(2,0)\\)이므로 (가)에서 \\(\\overrightarrow{BP}=\\overrightarrow{AC}/2-\\overrightarrow{AD}=(-1/2,-\\sqrt3/2)\\)예요. 따라서 \\(P=B+\\overrightarrow{BP}=(-3/2,-\\sqrt3/2)\\)예요.","check":{"prompt":"세 점 \\(A,B,P\\)가 한 직선에 놓이는 것을 기울기로 어떻게 확인하나요?","answer":"직선 \\(AB\\)와 직선 \\(BP\\)의 기울기가 모두 \\(\\sqrt3\\)이므로 세 점은 한 직선 위에 있어요."}},{"id":"c2","label":"내적 조건으로 점 Q의 직선을 구해요","stepIds":["s3","s4"],"question":"점 \\(Q=(x,y)\\)는 어떤 직선 위에 있나요?","hint":"\\(\\overrightarrow{AC}\\)와 \\(\\overrightarrow{PQ}\\)의 성분을 조건 (나)에 그대로 넣어요.","explanation":"\\(\\overrightarrow{PQ}=(x+3/2,y+\\sqrt3/2)\\)이므로 \\((3,-\\sqrt3)\\cdot(x+3/2,y+\\sqrt3/2)=6\\)이에요. 펼치면 \\(3x-\\sqrt3y=3\\), 따라서 \\(y=\\sqrt3(x-1)\\)이에요.","check":{"prompt":"점 \\(Q=(1,0)\\)은 이 직선 위에 있나요?","answer":"직선의 식에 넣으면 양변이 모두 \\(0\\)이므로 직선 위에 있어요."}},{"id":"c3","label":"각 조건으로 점 Q를 하나만 남겨요","stepIds":["s5","s6","s7","s8","s9"],"question":"왜 \\(BQ=2\\)가 되고 두 교점 중 하나만 남나요?","hint":"직선 \\(PB\\)는 직선 \\(AB\\)의 연장이므로 \\(\\angle PBQ\\)는 삼각형 \\(ABQ\\)의 외각이에요.","explanation":"외각 관계로 \\(\\angle PBQ=\\angle BAQ+\\angle BQA\\)예요. 조건 (다)의 \\(\\angle PBQ=2\\angle BQA\\)와 비교하면 \\(\\angle BAQ=\\angle BQA\\), 따라서 \\(BQ=AB=2\\)예요. 원 \\((x+1)^2+y^2=4\\)와 앞의 직선을 함께 풀면 \\(x=0,1\\)이고 후보는 \\(Q=(0,-\\sqrt3)\\), \\(Q=(1,0)\\)예요. \\(Q=(1,0)\\)에서는 \\(\\angle PBQ=2\\pi/3\\)라 예각 조건에 어긋나요. \\(Q=(0,-\\sqrt3)\\)에서는 두 각이 각각 \\(\\pi/3\\), \\(\\pi/6\\)이라 조건을 만족해요.","check":{"prompt":"점 \\(Q=(1,0)\\)을 버리는 직접 조건은 무엇인가요?","answer":"\\(\\angle PBQ<\\pi/2\\)이어야 하는데 이 후보에서는 \\(\\angle PBQ=2\\pi/3\\)이기 때문이에요."}},{"id":"c4","label":"두 벡터의 내적을 계산해요","stepIds":["s10","s11"],"question":"마지막 두 벡터는 무엇인가요?","hint":"끝점 좌표에서 시작점 좌표를 빼요.","explanation":"\\(\\overrightarrow{CP}=(-9/2,-\\sqrt3/2)\\), \\(\\overrightarrow{DQ}=(-2,-2\\sqrt3)\\)예요. 내적은 \\((-9/2)(-2)+(-\\sqrt3/2)(-2\\sqrt3)=9+3=12\\)예요.","check":{"prompt":"두 번째 성분의 곱은 왜 \\(3\\)인가요?","answer":"\\((\\sqrt3/2)(2\\sqrt3)=3\\)이기 때문이에요."}}],"takeaway":["벡터 조건이 많은 평면도형은 주어진 각과 길이에 맞는 좌표를 먼저 잡아요.","각의 배수 조건은 외각 관계와 결합하면 같은 각, 같은 길이로 바뀔 수 있어요.","교점이 둘 나오면 원문의 각 범위로 반드시 후보를 걸러요."]};</script>
