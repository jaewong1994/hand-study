  <script>window.HandStudyRecord={"itemId":16902,"sourceLabel":"2020 평가원 고3 수리가형 9월 28번","adminYear":2020,"grade":3,"month":9,"number":28,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 길이가 $2$인 선분 $A B$를 지름으로 하는 반원이 있다. 선분 $A B$의 중점을 $O$라 할 때, 호 $A B$ 위에 두 점 $P,\\,Q$를 $\\angle POA=\\theta$, $\\angle QOB=2\\theta$가 되도록 잡는다. 두 선분 $P B,\\,OQ$의 교점을 $R$라 하고, 점 $R$에서 선분 $P Q$에 내린 수선의 발을 $H$라 하자. 삼각형 $P O R$의 넓이를 $f(\\theta)$, 두 선분 $R Q,\\,RB$와 호 $Q B$로 둘러싸인 부분의 넓이를 $g(\\theta)$라 할 때, $\\lim _{\\theta \\,-> \\,0+} {\\frac{f(\\theta)+g(\\theta)}{ {\\overline{RH}}} = \\frac{q}{p}}$ 이다. $p+q$의 값을 구하시오. (단, $0\u003c\\theta\u003c \\frac{\\pi}{3}$이고, $p$와 $q$는 서로소인 자연수이다.) [4점]","answer":"23","sourceHash":"5966a2ffaaa2e9323b442d775be22ca8221342069eb2237e8318dfef90c1cce8","steps":[{"id":"s1","latex":"OR=\\dfrac{\\sin(\\theta/2)}{\\sin(5\\theta/2)}"},{"id":"s2","latex":"f(\\theta)=\\dfrac{\\sin(\\theta/2)\\sin3\\theta}{2\\sin(5\\theta/2)}"},{"id":"s3","latex":"g(\\theta)=\\theta-\\dfrac{\\sin(\\theta/2)\\sin2\\theta}{2\\sin(5\\theta/2)}"},{"id":"s4","latex":"RH=\\sin\\dfrac{3\\theta}{2}\\left(1-\\dfrac{\\sin(\\theta/2)}{\\sin(5\\theta/2)}\\right)"},{"id":"s5","latex":"\\lim_{\\theta\\to0+}\\dfrac{f+g}{RH}=\\dfrac{1+\\frac12\\frac15(3-2)}{\\frac32(1-\\frac15)}=\\dfrac{11}{12}"},{"id":"s6","latex":"p+q=\\boxed{23}"}],"diagram":null,"contentHash":"32e6f8a1e38577f924797414fb53a021eec477c53dfb5768a5b694c8d66409e7","questionHtml":"\u003cp class=\"hp htall\">그림과 같이 길이가 \u003cspan class=\"heq\">\\(2\\)\u003c/span>인 선분 \u003cspan class=\"heq\">\\(A B\\)\u003c/span>를 지름으로 하는 반원이 있다. 선분 \u003cspan class=\"heq\">\\(A B\\)\u003c/span>의 중점을 \u003cspan class=\"heq\">\\(O\\)\u003c/span>라 할 때, 호 \u003cspan class=\"heq\">\\(A B\\)\u003c/span> 위에 두 점 \u003cspan class=\"heq\">\\(P,\\,Q\\)\u003c/span>를 \u003cspan class=\"heq\">\\(\\angle POA=\\theta\\)\u003c/span>, \u003cspan class=\"heq\">\\(\\angle QOB=2\\theta\\)\u003c/span>가 되도록 잡는다. 두 선분 \u003cspan class=\"heq\">\\(P B,\\,OQ\\)\u003c/span>의 교점을 \u003cspan class=\"heq\">\\(R\\)\u003c/span>라 하고, 점 \u003cspan class=\"heq\">\\(R\\)\u003c/span>에서 선분 \u003cspan class=\"heq\">\\(P Q\\)\u003c/span>에 내린 수선의 발을 \u003cspan class=\"heq\">\\(H\\)\u003c/span>라 하자. 삼각형 \u003cspan class=\"heq\">\\(P O R\\)\u003c/span>의 넓이를 \u003cspan class=\"heq\">\\(f(\\theta)\\)\u003c/span>, 두 선분 \u003cspan class=\"heq\">\\(R Q,\\,RB\\)\u003c/span>와 호 \u003cspan class=\"heq\">\\(Q B\\)\u003c/span>로 둘러싸인 부분의 넓이를 \u003cspan class=\"heq\">\\(g(\\theta)\\)\u003c/span>라 할 때, \u003cspan class=\"heq\">\\(\\lim\\limits_{\\theta \\,\\to  \\,0+} {\\dfrac{f(\\theta)+g(\\theta)}{{\\overline{RH}}} = \\dfrac{q}{p}}\\)\u003c/span>이다. \u003cspan class=\"heq\">\\(p+q\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(0\\lt \\theta\\lt  \\dfrac{\\pi}{3}\\)\u003c/span>이고, \u003cspan class=\"heq\">\\(p\\)\u003c/span>와 \u003cspan class=\"heq\">\\(q\\)\u003c/span>는 서로소인 자연수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/5837b483a25dd7b317c72798.png\" style=\"width:309px;max-width:100%\">\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"73242572db86c1cbdc0423baadffe3c21013300d234f72314c83c58161b79190"};</script>
