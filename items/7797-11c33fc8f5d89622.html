<script>window.HandStudyGuide={"itemId":7797,"sourceHash":"6d7670685daa2b1c1021252d6631dc9cd9b706f7f0d5e53a853506128137705f","contentHash":"07f64b3294ef517b034b945c09ae309fbd5a137f352621a4331c0e4c1c12dd0a","overview":{"goal":"등차수열의 일반항으로 두 집합의 포함 관계와 차집합의 합을 확인해요.","firstLook":"\\(2\\)부터 \\(4\\)까지 간격을 \\(n+1\\)등분하므로 \\(j\\)번째 항은 \\(2+2j/(n+1)\\)이에요.","conditions":[{"label":"일반항","meaning":"\\(j=0,\\ldots,n+1\\)로 양 끝점을 함께 나타내요."},{"label":"포함","meaning":"큰 집합에서는 짝수 번째 점이 원래 점과 같아요."},{"label":"차집합","meaning":"남는 홀수 번째 점들끼리도 등차수열이에요."}]},"chapters":[{"id":"c1","label":"ㄱ과 ㄴ을 확인해요","stepIds":["s1","s2","s3"],"question":"\\(A_n\\)의 점이 \\(A_{2n+1}\\)에서는 몇 번째 점일까요?","hint":"분모 \\(2n+2=2(n+1)\\)에 맞춰 지수를 두 배로 해요.","explanation":"\\(A_n=\\{2+2j/(n+1)\\mid j=0,1,\\ldots,n+1\\}\\)예요. \\(n\\)이 홀수이면 \\(j=(n+1)/2\\)가 정수이고 그 항은 3이므로 ㄱ은 참이에요. 또 \\(2+2j/(n+1)=2+2(2j)/(2n+2)\\)이므로 \\(A_n\\)의 모든 점은 \\(A_{2n+1}\\)의 짝수 번째 점이에요. 따라서 ㄴ도 참이에요.","check":{"prompt":"끝점 2와 4도 포함 관계에서 빠지지 않나요?","answer":"각각 \\(j=0,n+1\\)이고 큰 집합에서는 지수 \\(0,2n+2\\)가 되어 포함돼요."}},{"id":"c2","label":"차집합의 합을 구해요","stepIds":["s4","s5","s6"],"question":"차집합에는 왜 \\(n+1\\)개의 점이 남을까요?","hint":"큰 집합의 지수 0부터 \\(2n+2\\) 중 짝수 지수를 제외해요.","explanation":"차집합에는 홀수 지수 \\(1,3,\\ldots,2n+1\\)에 해당하는 \\(n+1\\)개가 남아요. 첫 항은 \\(2+1/(n+1)\\), 마지막 항은 \\(2+(2n+1)/(n+1)\\)이므로 합은 \\((n+1)/2\\)에 두 끝항의 합을 곱한 \\(3(n+1)\\)이에요. 따라서 \\(S_6+S_{13}=21+42=63\\)이어서 ㄷ도 참이고 답은 ⑤예요.","check":{"prompt":"차집합의 첫 항과 마지막 항의 합은 얼마인가요?","answer":"\\(2+1/(n+1)+2+(2n+1)/(n+1)=6\\)이에요."}}],"takeaway":["등분점 집합은 양 끝을 포함하는 정수 지수의 일반항으로 쓰면 포함 관계가 보여요.","차집합은 빠지는 지수의 홀짝을 확인한 뒤 남은 등차수열의 합을 구해요."]};</script>
