<script>window.HandStudyRecord={"itemId":16518,"sourceLabel":"2019 평가원 고3 수리가형 6월 28번","adminYear":2019,"grade":3,"month":6,"number":28,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 길이가 $2$인 선분 ${A B}$를 지름으로 하는 반원의 호 ${A B}$ 위에 점 ${P}$가 있다. 중심이 ${A}$이고 반지름의 길이가 $\\overline{{A P}}$인 원과 선분 ${A B}$의 교점을 ${Q}$라 하자. 호 ${P B}$ 위에 점 ${R}$를 호 ${P R}$와 호 ${R B}$의 길이의 비가 $3 : 7$이 되도록 잡는다. 선분 ${A B}$의 중점을 ${O}$라 할 때, 선분 ${O R}$와 호 ${P Q}$의 교점을 ${T}$, 점 ${O}$에서 선분 ${A P}$에 내린 수선의 발을 ${H}$라 하자. 세 선분 ${P H}$, ${H O}$, ${O T}$와 호 ${T P}$로 둘러싸인 부분의 넓이를 $S_1$, 두 선분 ${R T}$, ${Q B}$와 두 호 ${T Q}$, ${B R}$로 둘러싸인 부분의 넓이를 $S_2$라 하자. $∠{P A B} = \\theta$라 할 때, $\\lim _{ \\theta \\,->\\, 0 +}\\frac{S _{1 }-S _{2 }}{\\overline{{O H}}}= a$이다. $50a$의 값을 구하시오. (단, $0 < \\theta < \\frac{ \\pi}{4}$) [4점]","answer":"40","sourceHash":"86170e467f6b38ad9b564cfada8763be70b16ad2ba2af2d0d232793abc438fcc","steps":[{"id":"s1","latex":"A=(0,0),\\ B=(2,0),\\ O=(1,0),\\qquad AP=2\\cos\\theta"},{"id":"s2","latex":"P=(2\\cos^2\\theta,2\\sin\\theta\\cos\\theta),\\quad H=(\\cos^2\\theta,\\sin\\theta\\cos\\theta)"},{"id":"s3","latex":"OH=\\sin\\theta,\\qquad \\angle ROB=\\dfrac75\\theta"},{"id":"s4","latex":"\\begin{aligned}\\phi&=\\frac75\\theta,\\quad r=2\\cos\\theta,\\quad T=O+\\lambda(\\cos\\phi,\\sin\\phi)\\\\ \\lambda^2+2\\lambda\\cos\\phi+1-r^2&=0\\\\ \\lambda&=-\\cos\\phi+\\sqrt{r^2-\\sin^2\\phi}>0\\end{aligned}"},{"id":"s5","latex":"\\begin{aligned}\\tan\\tau&=\\frac{\\lambda\\sin\\phi}{1+\\lambda\\cos\\phi}\\\\ S_2&=\\frac12(\\lambda\\sin\\phi-r^2\\tau+\\phi)\\\\ \\lim_{\\theta\\to0+}\\frac{S_2}{\\sin\\theta}&=\\frac12\\left(\\frac75-4\\cdot\\frac7{10}+\\frac75\\right)=0\\end{aligned}"},{"id":"s6","latex":"\\begin{aligned}S_1&=\\frac12\\{-\\sin\\theta\\cos\\theta+\\lambda\\sin\\phi+r^2(\\theta-\\tau)\\}\\\\ \\lim_{\\theta\\to0+}\\frac{S_1}{\\sin\\theta}&=\\frac12\\left(-1+\\frac75+\\frac65\\right)=\\frac45\\end{aligned}"},{"id":"s7","latex":"a=\\lim_{\\theta\\to0+}\\dfrac{S_1-S_2}{\\sin\\theta}=\\dfrac45\\Rightarrow50a=40"}],"diagram":null,"contentHash":"b0f518261c282eddecde4505119d742c46b2531b4a5a78feb7898c52edfe0ee4","questionHtml":"<p class=\"hp htall\">그림과 같이 길이가 <span class=\"heq\">\\(2\\)<\/span>인 선분 <span class=\"heq\">\\({A B}\\)<\/span>를 지름으로 하는 반원의 호 <span class=\"heq\">\\({A B}\\)<\/span> 위에 점 <span class=\"heq\">\\({P}\\)<\/span>가 있다. 중심이 <span class=\"heq\">\\({A}\\)<\/span>이고 반지름의 길이가 <span class=\"heq\">\\(\\overline{{A P}}\\)<\/span>인 원과 선분 <span class=\"heq\">\\({A B}\\)<\/span>의 교점을 <span class=\"heq\">\\({Q}\\)<\/span>라 하자. <br>호<span class=\"heq\">\\({P B}\\)<\/span> 위에 점<span class=\"heq\">\\({R}\\)<\/span>를 호<span class=\"heq\">\\({P R}\\)<\/span>와 호<span class=\"heq\">\\({R B}\\)<\/span>의 길이의 비가 <span class=\"heq\">\\(3 : 7\\)<\/span>이 되도록 잡는다. 선분<span class=\"heq\">\\({A B}\\)<\/span>의 중점을 <span class=\"heq\">\\({O}\\)<\/span>라 할 때, 선분 <span class=\"heq\">\\({O R}\\)<\/span>와 호 <span class=\"heq\">\\({P Q}\\)<\/span>의 교점을 <span class=\"heq\">\\({T}\\)<\/span>, 점 <span class=\"heq\">\\({O}\\)<\/span>에서 선분<span class=\"heq\">\\({A P}\\)<\/span>에 내린 수선의 발을 <span class=\"heq\">\\({H}\\)<\/span>라 하자.<br>세 선분 <span class=\"heq\">\\({P H}\\)<\/span>, <span class=\"heq\">\\({H O}\\)<\/span>, <span class=\"heq\">\\({O T}\\)<\/span>와 호 <span class=\"heq\">\\({T P}\\)<\/span>로 둘러싸인 부분의 넓이를 <span class=\"heq\">\\(S_{1}\\)<\/span>, 두 선분 <span class=\"heq\">\\({R T}\\)<\/span>, <span class=\"heq\">\\({Q B}\\)<\/span>와 두 호 <span class=\"heq\">\\({T Q}\\)<\/span>, <span class=\"heq\">\\({B R}\\)<\/span>로 둘러싸인 부분의 넓이를 <span class=\"heq\">\\(S_{2}\\)<\/span>라 하자. <span class=\"heq\">\\(∠{P A B} = \\theta\\)<\/span>라 할 때, <span class=\"heq\">\\(\\lim\\limits_{ \\theta \\,\\to \\, 0 +}\\dfrac{S_{1 }-S_{2 }}{\\overline{{O H}}}= a\\)<\/span>이다. <br><span class=\"heq\">\\(50a\\)<\/span>의 값을 구하시오. (단, <span class=\"heq\">\\(0 \\lt  \\theta \\lt  \\dfrac{ \\pi}{4}\\)<\/span>) <span class=\"hscore\">[4점]<\/span><\/p><p class=\" <script>window.HandStudyGuide={"itemId":16518,"sourceHash":"86170e467f6b38ad9b564cfada8763be70b16ad2ba2af2d0d232793abc438fcc","contentHash":"b0f518261c282eddecde4505119d742c46b2531b4a5a78feb7898c52edfe0ee4","overview":{"firstLook":"\\(A=(0,0),B=(2,0),O=(1,0)\\)로 두면 반원의 반지름은 1이고 \\(AP=2\\cos\\theta\\)예요. 따라서 \\(P=(2\\cos^2\\theta,2\\sin\\theta\\cos\\theta)\\), 그 중점인 수선의 발은 \\(H=(\\cos^2\\theta,\\sin\\theta\\cos\\theta)\\)이며 \\(OH=\\sin\\theta\\)예요. 호의 비에서 중심각도 같은 비라 \\(\\angle ROB=7\\theta/5\\)예요.","goal":"두 넓이를 \\(\\sin\\theta\\)로 나눈 극한을 각각 계산해 차의 극한을 구해요.","conditions":[{"meaning":"\\(OH^2=(1-\\cos^2\\theta)^2+(\\sin\\theta\\cos\\theta)^2=\\sin^2\\theta\\)라 \\(\\theta>0\\)에서 \\(OH=\\sin\\theta\\)예요.","label":"분모 길이를 정확히 구해요"},{"meaning":"\\(1/2(7/5-4·7/10+7/5)=0\\)으로 상쇄돼요.","label":"작은 영역의 넓이식을 세워요"}]},"chapters":[{"question":"점 \\(P,H\\)의 좌표에서 \\(OH\\)를 어떻게 구하나요?","check":{"prompt":"OH가 정확히 \\(\\sin\\theta\\)인 이유는 무엇인가요?","answer":"\\(OH^2=(1-\\cos^2\\theta)^2+(\\sin\\theta\\cos\\theta)^2=\\sin^2\\theta\\)라 \\(\\theta>0\\)에서 \\(OH=\\sin\\theta\\)예요."},"stepIds":["s1","s2","s3"],"id":"c1","explanation":"\\(A=(0,0),B=(2,0),O=(1,0)\\)로 두면 반원의 반지름은 1이고 \\(AP=2\\cos\\theta\\)예요. 따라서 \\(P=(2\\cos^2\\theta,2\\sin\\theta\\cos\\theta)\\), 그 중점인 수선의 발은 \\(H=(\\cos^2\\theta,\\sin\\theta\\cos\\theta)\\)이며 \\(OH=\\sin\\theta\\)예요. 호의 비에서 중심각도 같은 비라 \\(\\angle ROB=7\\theta/5\\)예요.","hint":"H 좌표와 O 좌표의 거리식을 직접 정리해요.","label":"분모 길이를 정확히 구해요"},{"question":"\\(S_2\\)를 삼각형과 두 부채꼴의 넓이로 어떻게 분해하나요?","check":{"prompt":"\\(\\lambda\\)의 두 근 중 양수인 근을 골라야 하는 이유는 무엇인가요?","answer":"\\(T\\)가 \\(O\\)에서 \\(R\\)로 향하는 반직선 위에 있으므로 \\(OT=\\lambda>0\\)이어야 해요."},"stepIds":["s4","s5"],"id":"c2","explanation":"\\(\\phi=7\\theta/5\\), \\(r=2\\cos\\theta\\)라 하고 \\(T=O+\\lambda(\\cos\\phi,\\sin\\phi)\\)로 두어요. 그러면 \\(T=(1+\\lambda\\cos\\phi,\\lambda\\sin\\phi)\\)이고, \\(AT=r\\)에서 \\(\\lambda^2+2\\lambda\\cos\\phi+1-r^2=0\\)을 얻어요. \\(T\\)가 반직선 \\(OR\\) 위에 있으므로 \\(\\lambda>0\\)인 근 \\(\\lambda=-\\cos\\phi+\\sqrt{r^2-\\sin^2\\phi}\\)를 골라요. 또 \\(\\tau=\\angle BAT\\)라 하면 \\(\\tan\\tau=\\lambda\\sin\\phi/(1+\\lambda\\cos\\phi)\\)예요. 그림에서 \\(S_2\\)는 삼각형 \\(AOT\\)의 넓이에 중심 \\(O\\), 반지름 \\(1\\), 중심각 \\(\\phi\\)인 부채꼴 \\(OBR\\)의 넓이를 더하고, 중심 \\(A\\), 반지름 \\(r\\), 중심각 \\(\\tau\\)인 부채꼴 \\(ATQ\\)의 넓이를 뺀 값이에요. 따라서 \\([AOT]=\\lambda\\sin\\phi/2\\), 두 부채꼴의 넓이는 각각 \\(\\phi/2\\), \\(r^2\\tau/2\\)이므로\n\n\\(S_2=\\frac12\\{\\lambda\\sin\\phi-r^2\\tau+\\phi\\}\\)\n\n예요. \\(\\tau\\to0\\)이므로 \\(\\tau/\\tan\\tau\\to1\\)이고, \\(\\tan\\tau/\\sin\\theta=\\lambda(\\sin\\phi/\\sin\\theta)/(1+\\lambda\\cos\\phi)\\to7/10\\)이에요. 따라서 \\(\\lambda\\to1\\), \\(\\sin\\phi/\\sin\\theta\\to7/5\\), \\(r^2\\to4\\)이므로 \\(S_2/\\sin\\theta\\to\\frac12(7/5-4\\cdot7/10+7/5)=0\\)이에요.","hint":"\\(\\lambda\\to 1\\), \\(τ/\\sin\\theta\\to 7/10\\)을 정확한 넓이식에 넣어요.","label":"작은 영역의 넓이식을 세워요"},{"question":"S1의 4/5는 어느 세 극한의 합인가요?","check":{"prompt":"S1의 4/5는 어느 세 극한의 합인가요?","answer":"\\(1/2(-1+7/5+6/5)=4/5\\)예요."},"stepIds":["s6","s7"],"id":"c3","explanation":"그림에서 \\(S_1\\)은 삼각형 \\(AOT\\)와 중심 \\(A\\), 반지름 \\(r\\), 중심각 \\(\\theta-\\tau\\)인 부채꼴 \\(ATP\\)의 넓이를 더한 뒤 삼각형 \\(AHO\\)의 넓이를 뺀 값이에요. \\([AOT]=\\lambda\\sin\\phi/2\\), \\([AHO]=\\sin\\theta\\cos\\theta/2\\)이므로 \\(S_1=\\frac12\\{-\\sin\\theta\\cos\\theta+\\lambda\\sin\\phi+r^2(\\theta-\\tau)\\}\\)예요. 이를 \\(\\sin\\theta\\)로 나누면 각 항의 극한은 차례로 \\(-1\\), \\(7/5\\), \\(4(1-7/10)=6/5\\)예요. 따라서 \\(S_1/\\sin\\theta\\to4/5\\)이고 \\(S_2/\\sin\\theta\\to0\\)이므로 \\(50a=40\\)이에요.","hint":"선분 경계 두 항과 원호 항을 각각 \\(\\sin\\theta\\)로 나눠요.","label":"정확한 극한으로 답을 마무리해요"}],"takeaway":["곡선으로 둘러싸인 넓이는 삼각형과 부채꼴의 합과 차로 분해해 식을 세워요.","이차방정식으로 반직선 위 거리를 구할 때는 방향 조건으로 양수인 근을 골라요.","작은 넓이 자체가 0으로 가는 사실과 그 넓이를 작은 길이로 나눈 극한은 구별해야 해요."]};</script>
