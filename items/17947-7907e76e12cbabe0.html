점]\n(가) $\\left\\{ x \\,\\middle|\\, f \\left( x \\right) =f' \\left( t \\right) \\times x \\right\\} = \\left\\{ 0 \\right\\}\\,$을 만족시키는 실수 $t\\,$의 개수가 $1\\,$이다.\n(나) $f \\left( 2 \\right) =2e ^{-2}$","scoreStatus":"confirmed_4_direct","sourceHash":"64e7ae4765169d08b463b881d5829ef618d26e485c265ae7bba50e75bfcd6073","sourceLabel":"2024 교육청 고3 수학미적분 10월 30번","stepExplanations":{"s1":{"body":"\\(f(x)=xg(x)\\)이므로 \\(x\\ne0\\)인 해는 \\(g(x)=f^{\\prime}(t)\\)의 해와 같아요. \\(g^{\\prime}(x)=a(x_0-x)e^{-x}\\)이므로 \\(g\\)는 \\(x_0\\)까지 증가하고 그 뒤 감소해요. 또 \\(x\\to-\\infty\\)일 때 \\(g(x)\\to-\\infty\\), \\(x\\to\\infty\\)일 때 \\(g(x)\\to0\\)이므로 가장 큰 값은 \\(M=ae^{-x_0}>0\\)예요.","skillTags":["algebra.calculation"],"title":"0 이외의 교점은 g로 살펴봐요"},"s4":{"body":"\\(f^{\\prime}(x_0)=M\\)이고 \\(f^{\\prime\\prime}(x_0)=-x_0M\\)이에요. \\(x_0\\ne0\\)이면 이 도함수 값이 0이 아니므로, \\(x_0\\)의 한쪽 가까운 구간에서 \\(f^{\\prime}(t)>M\\)이 돼요. 그 모든 \\(t\\)에서는 \\(g(x)=f^{\\prime}(t)\\)인 \\(x\\)가 없어서 원래 방정식의 해가 0뿐이에요. 그러면 조건을 만족하는 \\(t\\)가 무한히 많아지므로, 반드시 \\(x_0=0\\), 즉 \\(a=b\\)여야 해요.","skillTags":["reasoning.casework"],"title":"기울기가 0이 아니면 근처에도 해가 많아져요"},"s6":{"body":"\\(f^{\\prime\\prime}(t)=at(t-3)e^{-t}\\)의 부호는 \\(t\u003c0\\)에서 양수, \\(0\u003ct\u003c3\\)에서 음수, \\(t>3\\)에서 양수예요. 따라서 \\(f^{\\prime}\\)은 증가→감소→증가하고, \\(f^{\\prime}(0)=a\\), \\(f^{\\prime}(3)=-5ae^{-3}\u003c0\\)이에요. 양 끝에서는 각각 \\(-\\infty\\), \\(0\\)으로 가므로 \\(f^{\\prime}(t)\\le a\\)이며 등호는 \\(t=0\\)에서만 성립해요.","skillTags":["algebra.calculation","calculus.limit"],"title":"가장 큰 값과 등호가 되는 때를 함께 확인해요"},"s7":{"body":"\\(a=b\\)이면 \\(g(x)=a(x+1)e^{-x}\\)는 \\(x=0\\)에서만 가장 큰 값 \\(a\\)를 가져요. \\(t=0\\)일 때 \\(g(x)=f^{\\prime}(0)=a\\)의 해는 0뿐이에요. \\(t\\ne0\\)이면 \\(f^{\\prime}(t)\u003ca\\)이고, \\(g\\)가 \\((-\\infty,0)\\)에서 \\(-\\infty\\)부터 \\(a\\)까지 증가하므로 음수인 해가 하나 생겨요. 따라서 조건 (가)를 만족하는 \\(t\\)는 정확히 0 하나예요. 이제 \\(f(2)=(4a+2b)e^{-2}=2e^{-2}\\)에 \\(a=b\\)를 넣으면 \\(a=b=\\frac{1}{3}\\)이에요.","skillTags":["reasoning.casework","geometry.reasoning"],"title":"t=0 하나만 남는지 원래 조건에 돌려봐요"}},"steps":[{"id":"s1","latex":"g(x)=(ax+b)e^{-x},\\quad f(x)=xg(x),\\quad x_0=(a-b)/a,\\ M=g(x_0)=ae^{-x_0}"},{"id":"s2","latex":"f^{\\prime}(t)>M\\Rightarrow g(x)=f^{\\prime}(t)\\text{의 근이 없음}\\Rightarrow f(x)=f^{\\prime}(t)x\\text{의 근은 }0\\text{뿐}"},{"id":"s3","latex":"f^{\\prime}(x_0)=M,\\quad f^{\\prime\\prime}(x_0)=-x_0M"},{"id":"s4","latex":"x_0\\ne0\\Rightarrow f^{\\prime}(t)>M\\text{인 구간 존재}\\Rightarrow t\\text{가 무한히 많음}"},{"id":"s5","latex":"x_0=0\\Rightarrow a=b,\\quad f^{\\prime}(t)=a(-t^2+t+1)e^{-t}"},{"id":"s6","latex":"f^{\\prime\\prime}(t)=at(t-3)e^{-t}\\quad\\Rightarrow\\quad f^{\\prime}(t)\\le a,\\quad f^{\\prime}(t)=a\\iff t=0"},{"id":"s7","latex":"g(x)=a\\Leftrightarrow x=0,\\quad f(2)=2e^{-2}\\Rightarrow4a+2b=2"},{"id":"s8","latex":"a=b=1/3\\Rightarrow60(a+b)=40"}],"track":"미적분"};</script>
<script>window.HandStudyGuide={"itemId":17947,"sourceHash":"64e7ae4765169d08b463b881d5829ef618d26e485c265ae7bba50e75bfcd6073","contentHash":"eed89db1f7e79358ed3b86bb02110da68a11aa4875ed478d282653096d0b389b","overview":{"goal":"조건을 만족시키는 실수 \\(t\\)가 딱 하나라는 말을, 보조함수의 가장 큰 값과 도함수의 높이 비교로 바꿔 \\(a,b\\)를 정해요.","firstLook":"\\(f(x)=(ax^2+bx)e^{-x}\\)에는 \\(x\\)가 공통으로 들어 있어요. \\(f(x)=xg(x)\\)로 놓으면 \\(x=0\\)은 언제나 해이고, 0이 아닌 해의 존재는 \\(g(x)=f^{\\prime}(t)\\)의 교점 개수로 읽을 수 있어요.","conditions":[{"label":"해집합 조건","meaning":"방정식의 해가 \\(\\{0\\}\\)뿐인 \\(t\\)가 정확히 하나예요."},{"label":"계수 조건","meaning":"\\(a>0\\)이므로 \\(g(x)=(ax+b)e^{-x}\\)는 한 번 올라갔다 내려가는 모양을 가집니다."},{"label":"수치 조건","meaning":"\\(f(2)=2e^{-2}\\)는 마지막에 \\(a,b\\)의 크기를 정해 줍니다."}]},"chapters":[{"id":"c1","label":"방정식을 높이 비교로 바꾸기","stepIds":["s1","s2"],"question":"왜 \\(x=0\\) 이외의 해는 \\(g\\)의 그래프와 수평선의 교점으로 볼 수 있을까요?","hint":"\\(f(x)=xg(x)\\)를 방정식에 넣고 \\(x\\ne0\\)인 경우에만 \\(x\\)로 나눠 보세요.","explanation":"\\(f(x)=f^{\\prime}(t)x\\)에 \\(f(x)=xg(x)\\)를 넣으면 \\(x\\{g(x)-f^{\\prime}(t)\\}=0\\)이에요. 따라서 0이 아닌 해는 \\(g(x)=f^{\\prime}(t)\\)의 해입니다. \\(g^{\\prime}(x)=a(x_0-x)e^{-x}\\), \\(x_0=(a-b)/a\\)이므로 \\(g\\)는 \\(x_0\\)에서 가장 큰 값 \\(M=ae^{-x_0}\\)을 가져요. 수평선의 높이가 \\(M\\)보다 크면 교점이 없어서 원래 방정식의 해는 0뿐입니다.","check":{"prompt":"\\(f^{\\prime}(t)>M\\)일 때 원래 방정식에 0이 아닌 해가 생기나요?","answer":"아니요. \\(g(x)\\le M\\)이므로 \\(g(x)=f^{\\prime}(t)\\)는 해가 없고, 원래 방정식에는 \\(x=0\\)만 남습니다."}},{"id":"c2","label":"조건을 만족시키는 t가 하나가 되게 하기","stepIds":["s3","s4"],"question":"\\(x_0\\ne0\\)이면 왜 조건을 만족시키는 \\(t\\)가 하나가 아니라 여러 개가 될까요?","hint":"\\(f^{\\prime}(x_0)=M\\)일 때 \\(f^{\\prime}\\)의 순간 변화율 \\(f^{\\prime\\prime}(x_0)\\)을 확인해 보세요.","explanation":"계산하면 \\(f^{\\prime}(x_0)=M\\), \\(f^{\\prime\\prime}(x_0)=-x_0M\\)이에요. \\(x_0\\ne0\\)이면 두 번째 값이 0이 아니므로 \\(x_0\\)의 한쪽 가까이에서 \\(f^{\\prime}(t)>M\\)인 구간이 생겨요. 그 구간의 모든 \\(t\\)에서 원래 방정식의 해가 0뿐이므로, 그런 \\(t\\)가 정확히 하나라는 조건과 맞지 않습니다. 따라서 \\(x_0=0\\), 즉 \\(a=b\\)여야 해요.","check":{"prompt":"\\(x_0=0\\)이 주는 계수 관계는 무엇인가요?","answer":"\\((a-b)/a=0\\)이고 \\(a>0\\)이므로 \\(a=b\\)입니다."}},{"id":"c3","label":"남은 t가 정말 하나인지 확인하기","stepIds":["s5","s6"],"question":"\\(a=b\\)이면 왜 \\(t=0\\)만 특별한가요?","hint":"\\(f^{\\prime\\prime}(t)=at(t-3)e^{-t}\\)의 부호로 \\(f^{\\prime}\\)의 증감을 나눠 보세요.","explanation":"\\(a=b\\)일 때 \\(f^{\\prime}(t)=a(-t^2+t+1)e^{-t}\\)이고, 그 도함수는 \\(at(t-3)e^{-t}\\)예요. 따라서 \\(f^{\\prime}\\)은 \\(t=0\\)까지 증가하고, \\(0<t<3\\)에서 감소한 뒤 다시 증가합니다. 또한 \\(t\\to-\\infty\\)일 때 \\(f^{\\prime}(t)\\to-\\infty\\), \\(t\\to\\infty\\)일 때는 음수 쪽에서 0에 가까워지므로 \\(f^{\\prime}(t)\\le a\\)이고 등호는 \\(t=0\\)에서만 성립해요. \\(t\\ne0\\)이면 \\(f^{\\prime}(t)<a\\)이고, \\(g\\)는 \\(( -\\infty,0)\\)에서 \\(-\\infty\\)부터 \\(a\\)까지 증가하므로 \\(g(x)=f^{\\prime}(t)\\)인 0이 아닌 해가 생깁니다. 그래서 원래 방정식의 해가 0뿐인 경우는 \\(t=0\\) 하나예요.","check":{"prompt":"\\(g\\)의 가장 큰 값이 \\(a\\)일 때 수평선 높이 \\(f^{\\prime}(t)\\)가 \\(a\\)와 같은 경우는 언제인가요?","answer":"\\(t=0\\)일 때뿐입니다."}},{"id":"c4","label":"수치 조건으로 계수 확정하기","stepIds":["s7","s8"],"question":"해의 개수 조건으로 얻은 \\(a=b\\)를 \\(f(2)\\)에 어떻게 연결할까요?","hint":"\\(f(2)=(4a+2b)e^{-2}\\)를 그대로 주어진 값과 비교하세요.","explanation":"\\(a=b\\)이면 \\(g(x)=a(x+1)e^{-x}\\)는 \\(x=0\\)에서만 가장 큰 값 \\(a\\)를 가져서 앞 조건도 실제로 만족해요. 이제 \\((4a+2b)e^{-2}=2e^{-2}\\)이므로 \\(4a+2b=2\\)이고, \\(a=b\\)를 넣으면 \\(a=b=1/3\\)입니다.","check":{"prompt":"\\(60(a+b)\\)는 얼마인가요?","answer":"\\(60\\cdot\\frac23=40\\)입니다."}}],"takeaway":["방정식에 항상 존재하는 해가 보이면 그 인수를 먼저 분리하고, 나머지 해를 그래프의 교점으로 해석해요.","“그런 매개변수가 딱 하나”라는 조건은 높이의 등호뿐 아니라 그 높이를 넘는 구간이 생기는지도 확인해야 해요.","도함수의 가장 큰 값을 주장할 때는 증가·감소 구간과 양 끝의 값까지 함께 확인해요."]};</script>
