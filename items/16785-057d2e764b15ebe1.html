<script>window.HandStudyRecord={"itemId":16785,"sourceLabel":"2020 교육청 고3 수리나형 3월 30번","adminYear":2020,"grade":3,"month":3,"number":30,"track":"수리나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"닫힌구간 $\\left[-1,\\,1\\right]\\,$에서 정의된 연속함수 $f(x)\\,$는 정의역에서 증가하고 모든 실수 $x\\,$에 대하여 $f(-x)=-f(x)\\,$가 성립할 때, 함수 $g(x)$가 다음 조건을 만족시킨다.\n(가) 닫힌구간 $\\left[-1,\\,1 \\right]\\,$에서 $g(x)=f(x)\\,$이다.(나) 닫힌구간 $\\left[2n-1,\\,2n+1 \\right]\\,$에서 함수 $y=g(x)\\,$의 그래프는 함수 $y=f(x)\\,$의 그래프를 $x\\,$축의 방향으로 $2n\\,$만큼, $y\\,$축의 방향으로 $6n\\,$만큼 평행이동한 그래프이다. (단, $n\\,$은 자연수이다.)\n$f(1)= 3\\,$이고 $\\int_0 ^1 f(x) dx = 1\\,$일 때, $\\int _{3} ^{6} {} g(x)dx\\,$의 값을 구하시오.\n[4점]","answer":"41","sourceHash":"27cafb880d309d93f0c6a4a28cc86f96129db600cdad5afdcee946e715f05c82","steps":[{"id":"s1","latex":"3\\le x\\le5:\\quad g(x)=f(x-4)+12"},{"id":"s2","latex":"5\\le x\\le6:\\quad g(x)=f(x-6)+18"},{"id":"s3","latex":"f(-x)=-f(x)\\Rightarrow\\int_{-1}^{1}f(t)\\,dt=0,\\quad\\int_{-1}^{0}f(t)\\,dt=-1"},{"id":"s4","latex":"\\int_3^5g(x)\\,dx=\\int_{-1}^{1}f(t)\\,dt+24=24"},{"id":"s5","latex":"\\int_5^6g(x)\\,dx=\\int_{-1}^{0}f(t)\\,dt+18=17"},{"id":"s6","latex":"\\int_3^6g(x)\\,dx=24+17=\\boxed{41}"}],"diagram":null,"contentHash":"82954ecc5340bf3eb8c3b5f7486e2f1c083bb89ff08f332f2bbb1f7fbd7b3dc2","questionHtml":"\u003cp class=\"hp\">닫힌구간 \u003cspan class=\"heq\">\\(\\left[-1,\\,1\\right]\\,\\)\u003c/span>에서 정의된 연속함수 \u003cspan class=\"heq\">\\(f(x)\\,\\)\u003c/span>는 정의역에서 증가하고 모든 실수 \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(f(-x)=-f(x)\\,\\)\u003c/span>가 성립할 때, 함수 \u003cspan class=\"heq\">\\(g(x)\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가)닫힌구간 \u003cspan class=\"heq\">\\(\\left[-1,\\,1 \\right]\\,\\)\u003c/span>에서 \u003cspan class=\"heq\">\\(g(x)=f(x)\\,\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp\">(나)닫힌구간 \u003cspan class=\"heq\">\\(\\left[2n-1,\\,2n+1 \\right]\\,\\)\u003c/span>에서 함수 \u003cspan class=\"heq\">\\(y=g(x)\\,\\)\u003c/span>의 그래프는 함수 \u003cspan class=\"heq\">\\(y=f(x)\\,\\)\u003c/span>의 그래프를 \u003cspan class=\"heq\">\\(x\\,\\)\u003c/span>축의 방향으로 \u003cspan class=\"heq\">\\(2n\\,\\)\u003c/span>만큼, \u003cspan class=\"heq\">\\(y\\,\\)\u003c/span>축의 방향으로 \u003cspan class=\"heq\">\\(6n\\,\\)\u003c/span>만큼 평행이동한 그래프이다. \u003cbr>(단, \u003cspan class=\"heq\">\\(n\\,\\)\u003c/span>은 자연수이다.)\u003c/p>\u003c/div>\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(f(1)= 3\\,\\)\u003c/span>이고 \u003cspan class=\"heq\">\\(\\int_{0}^{1} f(x) dx = 1\\,\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(\\int_{3}^{6} {} g(x)dx\\,\\)\u003c/span>의 값을 구하시오.\u003c/p>\u003cp class=\"hp\">\u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/6dda487792d937f276702b0b.png\" style=\"width:416px;max-width:100%\">\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"057d2e764b15ebe1e4f372fa868ceed6ad68d3415b1b272300c8e53872ba512d"};</script>
<script>window.HandStudyGuide={"itemId":16785,"sourceHash":"27cafb880d309d93f0c6a4a28cc86f96129db600cdad5afdcee946e715f05c82","contentHash":"82954ecc5340bf3eb8c3b5f7486e2f1c083bb89ff08f332f2bbb1f7fbd7b3dc2","overview":{"goal":"적분 구간을 평행이동된 두 조각으로 나누고 홀함수의 대칭 적분을 사용해요.","firstLook":"구간 \\([3,6]\\)은 \\(n=2\\)인 \\([3,5]\\)와 \\(n=3\\)인 \\([5,7]\\)의 앞부분으로 나뉘어요.","conditions":[{"label":"홀함수","meaning":"\\([-1,1]\\)의 적분은 \\(0\\), \\([-1,0]\\)의 적분은 \\(-1\\)이에요."}]},"chapters":[{"id":"c1","label":"각 조각을 원래 구간으로 되돌려요","stepIds":["s1","s2"],"question":"\\([3,5]\\)와 \\([5,6]\\)에서 \\(g\\)는 각각 어떻게 쓰나요?","hint":"조건 (나)에 \\(n=2,3\\)을 넣어요.","explanation":"\\(3\\le x\\le5\\)에서는 \\(g(x)=f(x-4)+12\\), \\(5\\le x\\le6\\)에서는 \\(g(x)=f(x-6)+18\\)이에요. 첫 치환은 \\([-1,1]\\), 둘째는 \\([-1,0]\\)으로 구간을 옮겨요.","check":{"prompt":"두 평행이동에서 더해지는 상수는 각각 무엇인가요?","answer":"\\(6n\\)이므로 \\(n=2\\)에서 \\(12\\), \\(n=3\\)에서 \\(18\\)이에요."}},{"id":"c2","label":"홀함수 적분과 직사각형 넓이를 더해요","stepIds":["s3","s4","s5","s6"],"question":"왜 \\(\\int_{-1}^0f=-1\\)일까요?","hint":"\\(\\int_0^1f=1\\)이고 홀함수의 대칭을 써요.","explanation":"홀함수라 \\(\\int_{-1}^1f=0\\), \\(\\int_{-1}^0f=-\\int_0^1f=-1\\)이에요. 따라서 \\(\\int_3^5g=0+12\\cdot2=24\\), \\(\\int_5^6g=-1+18\\cdot1=17\\)이고 전체는 \\(41\\)이에요.","check":{"prompt":"상수 \\(12\\)와 \\(18\\)에 각각 곱하는 구간 길이는 얼마인가요?","answer":"\\([3,5]\\)의 길이 \\(2\\), \\([5,6]\\)의 길이 \\(1\\)이에요."}}],"takeaway":["평행이동된 함수의 적분은 치환으로 원래 정의 구간에 되돌려요.","홀함수의 좌우 적분은 부호가 반대예요.","세로 이동 상수의 적분은 상수와 구간 길이의 곱으로 계산해요."]};</script>
