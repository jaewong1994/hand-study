<script>window.HandStudyGuide={"itemId":17650,"sourceHash":"dd046cea4f8b287f3b28e5189f5345ee2f2da266cfb962b53778c4957e340d14","contentHash":"f4509bfefbded3235c4db5c88574088cb83b98e5bce458d5654c011baa9150ac","overview":{"goal":"구의 중심각과 평면 안의 직각관계로 AH, OH, DH를 구하고, 두 평면이 이루는 각을 이용해 삼각형의 정사영 넓이를 계산해요.","firstLook":"\\(AB=8\\)은 구의 지름이므로 \\(O\\)는 평면 \\(ABC\\) 위에 있어요. \\(D\\)에서 그 평면으로 내린 수선 \\(DH\\)를 쓰면 공간의 길이들이 직각삼각형으로 연결돼요.","conditions":[{"label":"구의 반지름","meaning":"\\(OA=OB=OC=OD=4\\)이고 \\(AB=8\\)이라 \\(A,O,B\\)가 한 직선에 있어요."},{"label":"두 수직","meaning":"\\(OC\\perp OD\\), \\(AD\\perp OH\\)예요."},{"label":"정사영","meaning":"삼각형 DAH가 놓인 평면과 평면 DOC 사이의 각의 코사인을 넓이에 곱해요."}]},"chapters":[{"id":"c1","label":"현 BC로 중심각을 구해요","stepIds":["s1"],"question":"\\(\\angle BOC\\)의 코사인과 사인은 얼마인가요?","hint":"삼각형 \\(BOC\\)에서 \\(OB=OC=4\\), \\(BC=2\\sqrt2\\)에 코사인법칙을 써요.","explanation":"코사인법칙으로\n\\[\n\\cos\\angle BOC=\\frac{4^2+4^2-(2\\sqrt2)^2}{2\\cdot4\\cdot4}\n=\\frac{24}{32}=\\frac34.\n\\]\n각은 예각이므로 \\(\\sin\\angle BOC=\\sqrt{1-9/16}=\\sqrt7/4\\)예요.","check":{"prompt":"\\(BC^2\\)은 얼마인가요?","answer":"\\((2\\sqrt2)^2=8\\)이에요."}},{"id":"c2","label":"평면 ABC 안에서 AH와 OH를 구해요","stepIds":["s2","s3"],"question":"두 수직 조건은 왜 \\(AH\\parallel OC\\)를 만들고 두 길이를 정할까요?","hint":"\\(OD\\)를 평면 \\(ABC\\)에 내려 생기는 성분이 \\(OH\\)이고, \\(DH\\)는 평면 안의 모든 선에 수직이에요.","explanation":"\\(DH\\perp\\)평면 \\(ABC\\)이므로 \\(DH\\perp OC\\)와 \\(DH\\perp OH\\)예요. \\(OD\\perp OC\\)에서 수직 성분 \\(DH\\)를 제외한 평면 안의 선 \\(OH\\)도 \\(OC\\)에 수직이에요. 또 \\(AD\\perp OH\\)이고 \\(DH\\perp OH\\)이므로 평면 안의 선 \\(AH\\)도 \\(OH\\)에 수직이에요. 평면 \\(ABC\\) 안에서 \\(AH\\)와 \\(OC\\)가 모두 \\(OH\\)에 수직이어서 \\(AH\\parallel OC\\)예요.\n\n이제 반지름 \\(OA=4\\)를 \\(OC\\)와 나란한 방향과 수직인 방향으로 나누면 앞에서 구한 각 때문에 그 길이는 각각 \\(4\\cos\\angle BOC=3\\), \\(4\\sin\\angle BOC=\\sqrt7\\)이에요. 따라서 \\(AH=3\\), \\(OH=\\sqrt7\\)이에요.","check":{"prompt":"\\(AH^2+OH^2\\)은 \\(OA^2\\)과 같나요?","answer":"\\(3^2+(\\sqrt7)^2=16=4^2\\)로 같아요."}},{"id":"c3","label":"수선 DH와 삼각형 넓이를 구해요","stepIds":["s4","s5"],"question":"직각삼각형 \\(OHD\\)에서 \\(DH\\)와 \\(\\angle ODH\\)는 어떻게 구하나요?","hint":"빗변 \\(OD=4\\), 한 변 \\(OH=\\sqrt7\\)이에요.","explanation":"삼각형 \\(OHD\\)는 \\(H\\)에서 직각이므로 \\(DH=\\sqrt{OD^2-OH^2}=\\sqrt{16-7}=3\\)이에요. 따라서 \\(\\cos\\angle ODH=DH/OD=3/4\\)예요.\n\n삼각형 \\(DAH\\)도 \\(H\\)에서 직각이고 \\(AH=DH=3\\)이므로 넓이는 \\(\\frac12\\cdot3\\cdot3=9/2\\)예요.","check":{"prompt":"삼각형 \\(DAH\\)가 \\(H\\)에서 직각인 이유는 무엇인가요?","answer":"\\(DH\\)가 평면 \\(ABC\\)에 수직이고 \\(AH\\)가 그 평면 위에 있기 때문이에요."}},{"id":"c4","label":"두 평면의 각으로 정사영 넓이를 구해요","stepIds":["s6"],"question":"정사영 넓이에 곱할 코사인이 왜 \\(\\cos\\angle ODH=3/4\\)일까요?","hint":"두 평면은 모두 \\(OC\\)와 나란한 방향을 포함하므로, 그 방향에 수직인 단면에서 \\(DH\\)와 \\(DO\\)의 각을 봐요.","explanation":"삼각형 \\(DAH\\)의 평면은 \\(AH\\parallel OC\\)를 포함하고, 평면 \\(DOC\\)도 \\(OC\\)를 포함해요. 이 공통 방향에 수직인 단면에서 첫 평면은 \\(DH\\), 둘째 평면은 \\(DO\\)로 보이므로 두 평면이 이루는 각은 \\(\\angle ODH\\)예요.\n\n따라서 정사영 넓이는 \\(S=(9/2)(3/4)=27/8\\)이고 \\(8S=27\\)이에요.","check":{"prompt":"정사영 넓이가 원래 넓이 \\(9/2\\)보다 작은가요?","answer":"코사인 \\(3/4<1\\)을 곱하므로 \\(27/8<9/2\\)예요."}}],"takeaway":["구의 지름과 현이 주어지면 중심각을 코사인법칙으로 구할 수 있어요.","공간의 수직관계는 밑면 안 성분과 밑면에 수직인 성분으로 나눠 평행선과 직각삼각형을 찾아요.","두 평면이 공통으로 포함하는 방향에 수직인 단면을 보면 이면각을 평면각으로 읽을 수 있어요."]};</script>
