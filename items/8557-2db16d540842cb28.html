<script>window.HandStudyRecord={"itemId":8557,"sourceLabel":"2025 교육청 고2 수학 9월 30번","adminYear":2025,"grade":2,"month":9,"number":30,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"최고차항의 계수가 양수인 이차함수 $f \\left(x \\right)\\,$와 함수 $g \\left(x \\right)=\\frac{1}{3}x+a\\,$에 대하여 함수\n $h \\left(x \\right)= \\begin{cases}\\,g \\left(x \\right)+f \\left(x \\right) & & \\left(f \\left(x \\right) \\geq g \\left(x \\right) \\right) \\\\ \\, g \\left(x \\right)-f \\left(x \\right) & & \\left(f \\left(x \\right) \u003c g \\left(x \\right) \\right)\\end{cases}\\,$\n가 다음 조건을 만족시킨다.\n(가) $\\lim_{x\\,\\rightarrow\\, \\alpha -}h \\left(x \\right) \\neq \\lim_{x\\,\\rightarrow\\, \\alpha +}h \\left(x \\right)\\,$를 만족시키는 실수 $\\alpha\\,$의 값은 $2\\,$뿐이다.(나) 모든 실수 $k\\,$에 대하여 $\\lim_{x\\,\\rightarrow\\, k} \\left|\\, h \\left(x \\right)-1\\,\\right| \\,$의 값이 존재한다.\n$h \\left(0 \\right)=\\frac{7}{3}\\,$일 때, $h \\left(5 \\right)\\,$의 값을 구하시오. (단, $a\\,$는 상수이다.) [4점]","answer":"25","sourceHash":"d9b4a69935ba96237246bf1f665279fce98ce8096ae1b2d9bc459fbce496e9ad","steps":[{"id":"s1","latex":"q(x)=f(x)-g(x)\\text{는 최고차항 계수가 양수인 이차식}"},{"id":"s2","latex":"q(x)=0\\text{에서 한쪽 극한은 }2g(x),\\text{ 다른 쪽은 }0"},{"id":"s3","latex":"x=2\\text{에서 불연속}\\Rightarrow g(2)\\ne0"},{"id":"s4","latex":"\\lim|h-1|\\text{ 존재}\\Rightarrow|2g(2)-1|=1\\Rightarrow g(2)=1"},{"id":"s5","latex":"\\frac23+a=1\\Rightarrow a=\\frac13,\\quad g(x)=\\frac x3+\\frac13"},{"id":"s6","latex":"q\\text{의 다른 근 }r\\text{에서는 }h\\text{가 연속}\\Rightarrow g(r)=0\\Rightarrow r=-1"},{"id":"s7","latex":"q(x)=c(x+1)(x-2),\\quad c>0"},{"id":"s8","latex":"q(0)=-2c\u003c0\\Rightarrow h(0)=g(0)-f(0)=-q(0)=2c=\\frac73"},{"id":"s9","latex":"c=\\frac76"},{"id":"s10","latex":"q(5)=\\frac76\\cdot6\\cdot3=21,\\quad g(5)=2"},{"id":"s11","latex":"q(5)>0\\Rightarrow h(5)=f(5)+g(5)=q(5)+2g(5)=25"}],"diagram":null,"contentHash":"0c5fdf6f2edd4e2d42eb3ba1e1c6bc0ffeffd5fd71ab4a6eacbb7e5080b02dcf","questionHtml":"\u003cp class=\"hp htall\"
