<script>window.HandStudyRecord={"adminYear":2026,"answer":"20","contentHash":"cd1e799fc71a1658774e97bbd5674d842d4eb1ddea050274e3c3f4b82b90f1d0","diagram":null,"editionHash":"f091faa9a05384faa01322a4ff84f49710c3cee09cf39a31f193e18fea1f692d","grade":3,"graphHash":"","graphPlan":null,"itemId":25029,"learningHash":"eebe6e98801bbfc1b998aa5b61f5dc1e3e5b02660d5b84087cce283c9386be02","month":6,"number":30,"points":4,"preview":false,"questionHtml":"\u003cdiv>최고차항의 계수가 $1\\,$인 삼차함수 $f \\left(x \\right)\\,$에 대하여 함수 $g \\left(x \\right)\\,$는\u003cbr>$g \\left(x \\right)= \\sqrt[3]{x \\left(f \\left(x \\right) \\right)^{2}}\\,$\u003cbr>이다. 함수 $g \\left(x \\right)\\,$가 실수 전체의 집합에서 미분가능하고 $x=\\frac{19}{7}\\,$와 $x=3\\,$에서 극값을 가질 때, $f \\left(5 \\right)\\,$의 값을 구하시오.\u003c/div>","questionText":"최고차항의 계수가 $1\\,$인 삼차함수 $f \\left(x \\right)\\,$에 대하여 함수 $g \\left(x \\right)\\,$는\n$g \\left(x \\right)= \\sqrt[3]{x \\left(f \\left(x \\right) \\right)^{2}}\\,$\n이다. 함수 $g \\left(x \\right)\\,$가 실수 전체의 집합에서 미분가능하고 $x=\\frac{19}{7}\\,$와 $x=3\\,$에서 극값을 가질 때, $f \\left(5 \\right)\\,$의 값을 구하시오.","scoreStatus":"confirmed_4_direct","sourceHash":"d2b1a3e9d2524b9d908276b6e14f1a0f8261943c364c3710c2a81509d671f4e0","sourceLabel":"2026 평가원 고3 수학미적분 6월 30번","stepExplanations":{"s1":{"body":"\\(f(0)\\ne0\\)이면 \\(x\\to0\\)에서 \\(g(x)\\)는 상수배 \\(\\sqrt[3]{x}\\)처럼 움직여 기울기가 커집니다. 실수 전체에서 미분가능하려면 이 현상을 없애야 하므로 \\(f(0)=0\\), 즉 \\(f(x)=xh(x)\\)입니다.","skillTags":["differentiability-at-zero","factor-extraction"],"title":"x=0에서 f(0)=0이 필요한 이유"},"s12":{"body":"\\(D\u003c0\\)이면 이차식 \\(h(x)>0\\)이라 분모의 부호가 항상 양수입니다. 두 극값 위치가 도함수 분자의 두 근이므로 \\(7x^2+5ax+3b=7(x-19/7)(x-3)\\)이고, 계수를 비교해 \\(a=-8,b=19\\)를 얻습니다.","skillTags":["derivative-numerator","coefficient-comparison"],"title":"실근이 없는 경우 도함수의 분자 맞추기"},"s3":{"body":"\\(g(x)=x\\sqrt[3]{h(x)^2}\\)이고 \\(g(\\alpha)=0\\)입니다. \\(h(\\alpha)=0,h'(\\alpha)\\ne0,\\alpha\\ne0\\)이면 \\(\\left|\\dfrac{g(x)-g(\\alpha)}{x-\\alpha}\\right|=\\dfrac{|x|\\,|h(x)/(x-\\alpha)|^{2/3}}{|x-\\alpha|^{1/3}}\\)입니다. 분자의 앞부분은 \\(|\\alpha|\\,|h'(\\alpha)|^{2/3}>0\\)으로 가고 분모는 0으로 가므로 미분계수가 존재할 수 없습니다.","skillTags":["difference-quotient","differentiability-filter"],"title":"서로 다른 실근에서는 평균변화율의 절댓값이 한없이 커져요"},"s7":{"body":"\\(h=(x-\\alpha)^2\\)이면 \\(g=x\\sqrt[3]{(x-\\alpha)^4}\\)이고, 미분하면 \\(g'=\\frac13\\sqrt[3]{x-\\alpha}(7x-3\\alpha)\\)입니다. 극값 후보는 \\(x=\\alpha,3\\alpha/7\\)인데 두 수의 비가 \\(7/3\\)으로 고정되어 \\(19/7,3\\)과 맞지 않습니다.","skillTags":["repeated-root","critical-point-ratio"],"title":"겹친 근에서 나오는 두 극값 위치"}},"steps":[{"id":"s1","latex":"g'(0)=\\lim_{x\\to0}\\sqrt[3]{\\left(\\frac{f(x)}x\\right)^2}\\Rightarrow f(0)=0"},{"id":"s2","latex":"f(x)=xh(x),\\quad h(x)=x^2+ax+b,\\quad D=a^2-4b"},{"id":"s3","latex":"(\\mathrm I)\\ D>0:\\quad\\alpha\\ne0,\\ h(\\alpha)=0,\\ h'(\\alpha)\\ne0\\Rightarrow\\frac{g(x)}{x-\\alpha}\\text{의 절댓값이 한없이 커짐}\\quad\\times"},{"id":"s4","latex":"D>0:\\ \\text{서로 다른 두 실근 중 적어도 하나는 }\\alpha\\ne0"},{"id":"s5","latex":"h(\\alpha)=0,\\ h^{\\prime}(\\alpha)\\ne0,\\ \\alpha\\ne0\\Rightarrow\\lim_{x\\to\\alpha}\\left|\\frac{g(x)-g(\\alpha)}{x-\\alpha}\\right|=\\infty"},{"id":"s6","latex":"(\\mathrm {II})\\ D=0:\\quad h(x)=(x-\\alpha)^2"},{"id":"s7","latex":"g'(x)=\\frac13\\sqrt[3]{x-\\alpha}(7x-3\\alpha)"},{"id":"s8","latex":"\\alpha=0:\\quad g(x)=\\sqrt[3]{x^7}=x^2\\sqrt[3]x,\\quad g^{\\prime}(x)=\\frac73\\sqrt[3]{x^4}\\ge0\\quad\\text{(극값 없음)}"},{"id":"s9","latex":"\\alpha\\ne0:\\quad\\{\\alpha,3\\alpha/7\\}=\\{19/7,3\\}\\quad\\text{불가능}"},{"id":"s10","latex":"\\text{극값 위치}:\\ \\alpha,\\frac{3\\alpha}7\\quad\\ne\\quad\\frac{19}7,3\\qquad\\times"},{"id":"s11","latex":"(\\mathrm {III})\\ D\u003c0:\\quad h(x)>0,\\quad g'(x)=\\frac{7x^2+5ax+3b}{3h(x)^{1/3}}"},{"id":"s12","latex":"7x^2+5ax+3b=7\\left(x-\\frac{19}7\\right)(x-3)"},{"id":"s13","latex":"a=-8,\\ b=19,\\quad D=-12\u003c0"},{"id":"s14","latex":"g'(x):+\\ \\big|_{19/7}\\ -\\ \\big|_3\\ +"},{"id":"s15","latex":"f(5)=5(25-40+19)=20"}],"track":"미적분"};</script>
<script>window.HandStudyGuide={"itemId":25029,"sourceHash":"d2b1a3e9d2524b9d908276b6e14f1a0f8261943c364c3710c2a81509d671f4e0","contentHash":"cd1e799fc71a1658774e97bbd5674d842d4eb1ddea050274e3c3f4b82b90f1d0","overview":{"goal":"\\(g(x)=\\sqrt[3]{x(f(x))^2}\\)가 모든 실수에서 미분가능하다는 조건으로 삼차함수 \\(f\\)의 모양을 정하고 \\(f(5)\\)를 구해요.","firstLook":"세제곱근 안에서 \\(f(x)\\)의 근이 어떤 방식으로 반복되는지가 미분가능성을 좌우해요. 먼저 \\(x=0\\)을 확인해 \\(f(x)=xh(x)\\)로 묶은 뒤, 이차식 \\(h\\)의 서로 다른 실근 개수에 따라 나눕니다.","conditions":[{"label":"f의 최고차항","meaning":"최고차항의 계수가 1인 삼차함수예요."},{"label":"g의 미분가능성","meaning":"세제곱근 때문에 기울기가 한없이 커지는 점이 생기면 안 됩니다."},{"label":"극값 위치","meaning":"\\(g\\)는 \\(x=19/7\\), \\(x=3\\)에서 극값을 가져요."}]},"chapters":[{"id":"c1","label":"0에서 미분가능하도록 f를 묶기","stepIds":["s1","s2"],"question":"왜 먼저 \\(f(0)=0\\)을 확인해야 할까요?","hint":"\\(g(x)/x\\)의 절댓값을 \\(x\\to0\\)에서 생각해 보세요.","explanation":"\\(g(0)=0\\)이고 \\(g^{\\prime}(0)=\\lim_{x\\to0}\\sqrt[3]{(f(x)/x)^2}\\)예요. \\(f(0)\\ne0\\)이면 \\(|f(x)/x|\\)가 한없이 커져 미분계수가 존재할 수 없습니다. 따라서 \\(f(0)=0\\)이고, 최고차항의 계수가 1이므로 \\(f(x)=xh(x)\\), \\(h(x)=x^2+ax+b\\)로 쓸 수 있어요. \\(D=a^2-4b\\)는 \\(h\\)의 서로 다른 실근 개수를 판단하는 값입니다.","check":{"prompt":"\\(f(0)=0\\)을 얻은 뒤 \\(g(x)\\)는 어떻게 정리되나요?","answer":"\\(g(x)=x\\sqrt[3]{h(x)^2}\\)로 정리됩니다."}},{"id":"c2","label":"h가 서로 다른 두 실근을 가질 수 없는 이유","stepIds":["s3","s4","s5"],"question":"\\(h\\)의 한 번만 나타나는 0이 왜 \\(g\\)의 미분가능성을 깨뜨릴까요?","hint":"그 근을 \\(\\alpha\\)라 하고 \\((g(x)-g(\\alpha))/(x-\\alpha)\\)의 절댓값을 써 보세요.","explanation":"\\(D>0\\)이면 \\(h\\)는 서로 다른 두 실근을 가지며, 그중 적어도 하나 \\(\\alpha\\)는 0이 아니에요. 이때 \\(h(\\alpha)=0\\), \\(h^{\\prime}(\\alpha)\\ne0\\)이고, 함숫값의 증가량을 \\(x\\)의 증가량으로 나눈 값의 절댓값은 \\(|x|\\,|h(x)/(x-\\alpha)|^{2/3}/|x-\\alpha|^{1/3}\\)입니다. 분자는 양수에 가까워지고 분모는 0에 가까워져 기울기의 절댓값이 한없이 커지므로 미분가능할 수 없어요.","check":{"prompt":"서로 다른 두 실근 가운데 적어도 하나가 0이 아닌 이유는 무엇인가요?","answer":"서로 다른 두 수가 모두 0일 수는 없기 때문입니다."}},{"id":"c3","label":"h가 같은 실근을 두 번 갖는 경우 제외하기","stepIds":["s6","s7","s8","s9","s10"],"question":"\\(h(x)=(x-\\alpha)^2\\)이면 극값 후보는 어디에서 생기나요?","hint":"주어진 \\(g^{\\prime}(x)=\\frac13\\sqrt[3]{x-\\alpha}(7x-3\\alpha)\\)의 두 인수를 보세요.","explanation":"후보는 \\(x=\\alpha\\)와 \\(x=3\\alpha/7\\)예요. \\(\\alpha=0\\)이면 \\(g^{\\prime}(x)=\\frac73\\sqrt[3]{x^4}\\ge0\\)라 극값이 생기지 않습니다. \\(\\alpha\\ne0\\)이면 두 후보의 비가 \\(7:3\\)인데, 주어진 두 위치 \\(19/7\\)과 \\(3\\)은 그 관계를 만족하지 않아요. 따라서 \\(D=0\\)인 경우도 제외됩니다.","check":{"prompt":"\\(\\{\\alpha,3\\alpha/7\\}=\\{19/7,3\\}\\)가 불가능한 것을 어떻게 확인할 수 있나요?","answer":"주어진 두 위치가 모두 양수이므로 \\(\\alpha>0\\)이어야 해요. 그러면 왼쪽 두 수의 큰 값과 작은 값의 비는 \\(7/3\\)인데, 오른쪽은 \\(3/(19/7)=21/19\\)라 서로 다릅니다."}},{"id":"c4","label":"h가 항상 양수인 경우 계수 찾기","stepIds":["s11","s12","s13"],"question":"이제 극값 위치는 어떤 식의 근으로 정해질까요?","hint":"\\(D<0\\)이면 \\(h(x)>0\\)이어서 \\(g^{\\prime}\\)의 분모 부호가 바뀌지 않아요.","explanation":"\\(D<0\\)이면 \\(h(x)>0\\)이고 \\(g^{\\prime}(x)=\\{7x^2+5ax+3b\\}/\\{3h(x)^{1/3}\\}\\)예요. 분모가 항상 양수이므로 극값 위치는 분자 이차식의 두 근과 같습니다. 따라서 \\(7x^2+5ax+3b=7(x-19/7)(x-3)\\)로 놓고 계수를 비교하면 \\(a=-8,b=19\\)를 얻어요. 실제로 \\(D=64-76=-12<0\\)라 이 경우의 가정도 맞습니다.","check":{"prompt":"분자 이차식의 일차항 계수를 비교하면 \\(a\\)에 대해 어떤 식이 나오나요?","answer":"오른쪽의 일차항 계수는 \\(-40\\)이므로 \\(5a=-40\\), \\(a=-8\\)입니다."}},{"id":"c5","label":"부호 변화와 최종값 확인하기","stepIds":["s14","s15"],"question":"두 근이 실제로 모두 극값을 만드는지 어떻게 확인할까요?","hint":"위로 열린 이차식의 부호를 두 근의 바깥과 사이에서 보세요.","explanation":"분모는 양수이고 분자는 위로 열린 이차식이므로 \\(g^{\\prime}\\)의 부호는 \\(+,-,+\\)로 바뀝니다. 따라서 \\(19/7\\)에서는 증가에서 감소, \\(3\\)에서는 감소에서 증가로 바뀌어 두 점이 정확히 극값 위치예요. 이제 \\(f(x)=x(x^2-8x+19)\\)에 \\(x=5\\)를 넣으면 \\(5(25-40+19)=20\\)입니다.","check":{"prompt":"구한 \\(a,b\\)에서 \\(g\\)의 다른 극값 위치가 더 생길 수 있나요?","answer":"아니요. 도함수의 부호를 정하는 분자는 두 근만 가진 이차식이고 분모는 항상 양수입니다."}}],"takeaway":["근호가 들어간 함수의 미분가능성은 근이 몇 번 반복되는지에 따라 달라질 수 있으므로 미분계수의 정의로 직접 확인해요.","경우를 나눌 때는 각 경우를 제외한 뒤 마지막 경우에서 처음 가정이 실제로 성립하는지도 되돌아봐요.","극값 위치만 주어지면 도함수 분자의 근을 그 위치와 맞추고, 마지막에는 부호 변화까지 확인해요."]};</script>
