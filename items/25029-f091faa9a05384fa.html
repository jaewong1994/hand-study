  <script>window.HandStudyRecord={"adminYear":2026,"answer":"20","contentHash":"cd1e799fc71a1658774e97bbd5674d842d4eb1ddea050274e3c3f4b82b90f1d0","diagram":null,"editionHash":"f091faa9a05384faa01322a4ff84f49710c3cee09cf39a31f193e18fea1f692d","grade":3,"graphHash":"","graphPlan":null,"itemId":25029,"learningHash":"eebe6e98801bbfc1b998aa5b61f5dc1e3e5b02660d5b84087cce283c9386be02","month":6,"number":30,"points":4,"preview":false,"questionHtml":"\u003cdiv>최고차항의 계수가 $1\\,$인 삼차함수 $f \\left(x \\right)\\,$에 대하여 함수 $g \\left(x \\right)\\,$는\u003cbr>$g \\left(x \\right)= \\sqrt[3]{x \\left(f \\left(x \\right) \\right)^{2}}\\,$\u003cbr>이다. 함수 $g \\left(x \\right)\\,$가 실수 전체의 집합에서 미분가능하고 $x=\\frac{19}{7}\\,$와 $x=3\\,$에서 극값을 가질 때, $f \\left(5 \\right)\\,$의 값을 구하시오.\u003c/div>","questionText":"최고차항의 계수가 $1\\,$인 삼차함수 $f \\left(x \\right)\\,$에 대하여 함수 $g \\left(x \\right)\\,$는\n$g \\left(x \\right)= \\sqrt[3]{x \\left(f \\left(x \\right) \\right)^{2}}\\,$\n이다. 함수 $g \\left(x \\right)\\,$가 실수 전체의 집합에서 미분가능하고 $x=\\frac{19}{7}\\,$와 $x=3\\,$에서 극값을 가질 때, $f \\left(5 \\right)\\,$의 값을 구하시오.","scoreStatus":"confirmed_4_direct","sourceHash":"d2b1a3e9d2524b9d908276b6e14f1a0f8261943c364c3710c2a81509d671f4e0","sourceLabel":"2026 평가원 고3 수학미적분 6월 30번","stepExplanations":{"s1":{"body":"\\(f(0)\\ne0\\)이면 \\(x\\to0\\)에서 \\(g(x)\\)는 상수배 \\(\\sqrt[3]{x}\\)처럼 움직여 기울기가 커집니다. 실수 전체에서 미분가능하려면 이 현상을 없애야 하므로 \\(f(0)=0\\), 즉 \\(f(x)=xh(x)\\)입니다.","skillTags":["differentiability-at-zero","factor-extraction"],"title":"x=0에서 f(0)=0이 필요한 이유"},"s12":{"body":"\\(D\u003c0\\)이면 이차식 \\(h(x)>0\\)이라 분모의 부호가 항상 양수입니다. 두 극값 위치가 도함수 분자의 두 근이므로 \\(7x^2+5ax+3b=7(x-19/7)(x-3)\\)이고, 계수를 비교해 \\(a=-8,b=19\\)를 얻습니다.","skillTags":["derivative-numerator","coefficient-comparison"],"title":"실근이 없는 경우 도함수의 분자 맞추기"},"s3":{"body":"\\(g(x)=x\\sqrt[3]{h(x)^2}\\)이고 \\(g(\\alpha)=0\\)입니다. \\(h(\\alpha)=0,h'(\\alpha)\\ne0,\\alpha\\ne0\\)이면 \\(\\left|\\dfrac{g(x)-g(\\alpha)}{x-\\alpha}\\right|=\\dfrac{|x|\\,|h(x)/(x-\\alpha)|^{2/3}}{|x-\\alp
