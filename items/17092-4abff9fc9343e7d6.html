\\,n} b_{\\,n}}{n^{3}}}= \\dfrac{q}{p} \\,\\)\u003c/span>이다. \u003cspan class=\"heq\">\\(p+q\\,\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(p\\,\\)\u003c/span>와 \u003cspan class=\"heq\">\\(q\\,\\)\u003c/span>는 서로소인 자연수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"4abff9fc9343e7d69fd3480c4c5acb075559df92b117e0afcc2b58c8de70ca12"};</script>
<script>window.HandStudyGuide={"itemId":17092,"sourceHash":"a7379c4f52937d20232daf59deff990f60848674182848f46c2969ee2b489aee","contentHash":"205345a517bae0eaaf2f02f91f4e43c42e03e4e4dcf3874e316e22711926d5cd","overview":{"goal":"극대가 되는 위치의 크기와 같은 높이에서 만나는 다른 근의 크기를 각각 구해 곱의 극한을 계산해요.","firstLook":"극대점에서는 수평선이 그래프에 접하므로 \\(f(x)-f(a_n)\\)에서 \\(a_n\\)이 두 번 나타나는 근이에요.","conditions":[{"label":"극대가 되는 위치","meaning":"도함수의 두 근 중 부호가 양수에서 음수로 바뀌는 작은 근을 골라요."},{"label":"같은 함숫값의 다른 근","meaning":"접점의 중근을 포함해 세 근의 합을 계수와 비교해요."}]},"chapters":[{"id":"c1","label":"극대점의 위치 고르기","stepIds":["s1","s2"],"question":"도함수의 두 근 가운데 왜 작은 근이 극대 위치인가요?","hint":"\\(f'(0)\\)과 \\(f'(n)\\)의 부호를 확인하세요.","explanation":"전개하면 \\(f(x)=x^3-(3n^2+n)x^2+3n^3x\\)이므로 \\(f'(x)=3x^2-2(3n^2+n)x+3n^3\\)이에요. 위로 열린 이차식이고 \\(f'(0)=3n^3>0\\), \\(f'(n)=n^2(1-3n)<0\\)이므로 0과 \\(n\\) 사이의 작은 근을 지날 때 도함수 부호가 양수에서 음수로 바뀌어요. 그 근이 극대 위치 \\(a_n\\)이에요. 근의 공식을 쓰면 \\(a_n=\\frac{3n^2+n-\\sqrt{9n^4-3n^3+n^2}}3\\)이에요.","check":{"prompt":"큰 근이 극대점이 아니라 극소점인 이유는 무엇인가요?","answer":"위로 열린 도함수는 두 근 사이에서 음수이고 큰 근을 지난 뒤 양수가 되므로, 큰 근에서는 감소에서 증가로 바뀌어요."}},{"id":"c2","label":"접점의 중근으로 다른 근 연결하기","stepIds":["s3","s4"],"question":"\\(f(x)=f(a_n)\\)에서 \\(a_n\\)이 왜 두 번 나타나는 근인가요?","hint":"함숫값도 같고 \\(f'(a_n)=0\\)이라 그 수평선과 접해요.","explanation":"\\(x=a_n\\)에서는 \\(f(x)-f(a_n)=0\\)이고 그 식의 도함수도 \\(f'(a_n)=0\\)이에요. 따라서 \\(a_n\\)은 두 번 나타나는 근이고, 최고차항 계수가 1이므로 \\(f(x)-f(a_n)=(x-a_n)^2(x-b_n)\\)예요. 세 근의 합은 원래 삼차식의 \\(x^2\\) 계수에서 \\(3n^2+n\\)이므로 \\(2a_n+b_n=3n^2+n\\)이에요.","check":{"prompt":"인수분해 앞에 별도의 상수가 붙지 않는 이유는 무엇인가요?","answer":"\\(f(x)-f(a_n)\\)의 최고차항 계수가 1이고 오른쪽 곱의 최고차항 계수도 1이기 때문이에요."}},{"id":"c3","label":"두 수열의 크기 비교하기","stepIds":["s5","s6"],"question":"\\(a_n\\)은 \\(n\\)과 \\(n^2\\) 중 어느 크기에 가깝고, 이를 어떻게 확인할까요?","hint":"근의 공식에서 분자의 켤레를 곱해 \\(a_n/n\\) 꼴을 만드세요.","explanation":"\\(a_n\\)의 식에서 분자의 켤레를 곱하면 \\(\\frac{a_n}{n}=\\frac{3n}{3n+1+\\sqrt{9n^2-3n+1}}\\)이에요. 분자와 분모를 \\(n\\)으로 나누면 극한은 \\(3/(3+3)=1/2\\)예요. 또 \\(b_n=3n^2+n-2a_n\\)이므로 \\(\\frac{b_n}{n^2}=3+\\frac1n-2\\frac{a_n/n}{n}\\)이고 극한은 3이에요.","check":{"prompt":"\\(2a_n/n^2\\)가 0으로 가는 이유는 무엇인가요?","answer":"\\(a_n/n\\)이 \\(1/2\\)로 가까워져 유한하고, 여기에 \\(1/n\\)을 한 번 더 곱한 꼴이기 때문이에요."}},{"id":"c4","label":"곱의 극한 계산하기","stepIds":["s7","s8"],"question":"\\(a_nb_n/n^3\\)을 앞에서 구한 두 극한의 곱으로 어떻게 나눌까요?","hint":"\\((a_n/n)(b_n/n^2)\\)로 쓰세요.","explanation":"\\(\\frac{a_nb_n}{n^3}=\\frac{a_n}{n}\\cdot\\frac{b_n}{n^2}\\)이므로 극한은 \\(\\frac12\\cdot3=\\frac32\\)예요. \\(q/p=3/2\\)이므로 \\(p+q=5\\)예요.","check":{"prompt":"\\(p\\)와 \\(q\\)의 순서는 어떻게 정하나요?","answer":"문제에서 극한을 \\(q/p\\)로 썼으므로 \\(\\frac32\\)에서 \\(q=3\\), \\(p=2\\)예요."}}],"takeaway":["극대·극소 위치를 고를 때 도함수의 근만 구하지 말고 부호 변화를 확인해요.","접선과 같은 높이의 방정식에서는 접점이 두 번 나타나는 근이 돼요.","서로 다른 크기의 수열 곱은 각 수열을 알맞은 \\(n\\)의 거듭제곱으로 나누어 극한을 구해요."]};</script>
