<script>window.HandStudyRecord={"adminYear":2022,"answer":"13","contentHash":"8598b9329f76cc23e7a9b7c119808e74a3e4382a5e0a2513f1a42d9dafceefde","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24829,"month":11,"number":22,"points":4,"preview":false,"questionHtml":"\u003cp>최고차항의 계수가 \u003cspan class=\"heq\">\\(1\\)\u003c/span>인 삼차함수 \u003cspan class=\"heq\">\\(f \\left( x \\right)\\)\u003c/span>와 실수 전체의 집합에서 연속인 함수 \u003cspan class=\"heq\">\\(g \\left( x \\right)\\)\u003c/span>가 다음 조건을 만족시킬 때, \u003cspan class=\"heq\">\\(f \\left( 4 \\right)\\)\u003c/span>의 값을 구하시오. [4점]\u003c/p>\u003cdiv class=\"hbox hcond\">\u003cp class=\"hcondr\">(가) 모든 실수 \u003cspan class=\"heq\">\\(x\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(f \\left( x \\right) = f \\left( 1 \\right)+ \\left( x-1 \\right)f&#x27; \\left( g \\left( x \\right) \\right)\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hcondr\">(나) 함수 \u003cspan class=\"heq\">\\(g \\left( x \\right)\\)\u003c/span>의 최솟값은 \u003cspan class=\"heq\">\\(\\frac{5}{2}\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hcondr\">(다) \u003cspan class=\"heq\">\\(f \\left( 0 \\right)= -3\\)\u003c/span>, \u003cspan class=\"heq\">\\(f \\left( g \\left( 1 \\right) \\right) = 6\\)\u003c/span>\u003c/p>\u003c/div>","questionText":"최고차항의 계수가 $1$인 삼차함수 $f \\left( x \\right)$와 실수 전체의 집합에서 연속인 함수 $g \\left( x \\right)$가 다음 조건을 만족시킬 때, $f \\left( 4 \\right)$의 값을 구하시오. [4점]\n(가) 모든 실수 $x$에 대하여 $f \\left( x \\right) = f \\left( 1 \\right)+ \\left( x-1 \\right)f\\,' \\left( g \\left( x \\right) \\right)$이다.(나) 함수 $g \\left( x \\right)$의 최솟값은 $\\frac{5}{2}$이다.(다) $f \\left( 0 \\right)= -3$, $f \\left( g \\left( 1 \\right) \\right) = 6$","sourceHash":"74fa7cea8961036f158bc057ffc7cce5cf7904ab42ed5a99d77193e55e1cb03b","sourceKind":"csat","sourceLabel":"2022년 시행 수능 · 2023학년도 · 공통 · 22번","steps":[{"id":"s1","latex":"f(x)=x^3+ax^2+bx-3"},{"id":"s2","latex":"x\\ne1:\\quad f\\prime(g(x))=\\frac{f(x)-f(1)}{x-1}=x^2+(a+1)x+a+b+1"},{"id":"s3","latex":"g\\text{의 연속성으로 }x=1\\text{에서도 같은 등식이 성립}"},{"id":"s4","latex":"3\\left(g(x)+\\frac a3\\right)^2=\\left(x+\\frac{a+1}2\\right)^2+\\frac{(a+3)^2}{12}"},{"id":"s5","latex":"a=-3\\text{이면 }g(x)=1\\pm\\frac{|x-1|}{\\sqrt3}"},{"id":"s6","latex":"\\text{어느 한쪽에서 음의 가지를 택하면 아래로 무한히 작아지므로 최솟값을 가지려면 양의 가지만 가능}"},{"id":"s7","latex":"\\text{이때 최솟값은 }1\\ne\\frac52\\ \\Rightarrow\\ a\\ne-3"},{"id":"s8","latex":"\\text{우변이 항상 양수이고 }g\\text{가 연속이므로 }g(x)+a/3\\text{의 부호는 일정}"},{"id":"s9","latex":"\\text{음의 가지는 아래로 무한히 작아지므로 양의 가지를 택한다. }g(x)\\text{의 최솟값은 }-\\frac a3+\\frac{|a+3|}{6}=\\frac52"},{"id":"s10","latex":"a>-3\\text{이면 }g(x)\\text{의 최솟값은 }\\frac{3-a}6\u003c1\\text{이므로 불가}"},{"id":"s11","latex":"a\u003c-3:\\quad-\\frac{a+1}2=\\frac52\\ \\Rightarrow\\ a=-6"},{"id":"s12","latex":"3(g(1)-2)^2=3,\\quad g(1)>2\\ \\Rightarrow\\ g(1)=3"},{"id":"s13","latex":"f(3)=6\\ \\Rightarrow\\ 27-54+3b-3=6\\ \\Rightarrow\\ b=12"},{"id":"s14","latex":"f(4)=64-96+48-3=\\boxed{13}"}],"track":"공통"};</script>
<script>window.HandStudyGuide={"itemId":24829,"sourceHash":"74fa7cea8961036f158bc057ffc7cce5cf7904ab42ed5a99d77193e55e1cb03b","contentHash":"8598b9329f76cc23e7a9b7c119808e74a3e4382a5e0a2513f1a42d9dafceefde","overview":{"goal":"연속인 함수 \\(g\\)가 어느 제곱근 가지를 따라야 하는지 판단해서 삼차함수 \\(f\\)를 정해요.","firstLook":"(가)를 \\(x-1\\)로 나누면 \\(f'(g(x))\\)가 이차식으로 나타나요. 이 이차식을 완전제곱으로 바꾸면 \\(g\\)의 최솟값 조건을 직접 쓸 수 있어요.","conditions":[{"label":"(가)","meaning":"\\(x\\ne1\\)에서 \\(f'(g(x))\\)를 \\(f\\)의 계수와 \\(x\\)로 나타내고, 연속성을 이용해 \\(x=1\\)에서도 그 관계를 이어 줘요."},{"label":"(나)","meaning":"제곱근의 두 가지 부호 중 아래로 한없이 작아지는 가지를 버리고, 남은 가지의 최솟값을 \\(5/2\\)와 맞춰요."},{"label":"(다)","meaning":"\\(f(0)=-3\\)으로 상수항을 정하고, 마지막에 \\(f(g(1))=6\\)으로 일차항의 계수를 정해요."}]},"chapters":[{"id":"c1","label":"나눈 식을 빠진 점까지 이어 줘요","stepIds":["s1","s2","s3"],"question":"\\(x=1\\)에서는 \\(x-1\\)로 나눌 수 없는데, 왜 나눈 뒤의 등식을 \\(x=1\\)에서도 쓸 수 있을까요?","hint":"먼저 \\(x\\ne1\\)에서 몫을 계산한 뒤, 등식의 양변이 \\(x\\)에 관해 연속이라는 점을 확인해요.","explanation":"최고차항의 계수와 \\(f(0)=-3\\)을 반영하면 \\(f(x)=x^3+ax^2+bx-3\\)으로 둘 수 있어요. \\(x\\ne1\\)에서는 (가)를 \\(x-1\\)로 나누어\n\n\\(f'(g(x))=\\dfrac{f(x)-f(1)}{x-1}=x^2+(a+1)x+a+b+1\\)\n\n을 얻어요. 여기서 \\(x=1\\)을 바로 대입한 것이 아니에요. \\(g\\)와 \\(f'\\)가 연속이므로 왼쪽 \\(f'(g(x))\\)가 연속이고, 오른쪽도 이차함수라 연속이에요. 따라서 \\(x\\)를 \\(1\\)에 가까이 보냈을 때 두 값의 극한이 같아서 같은 등식이 \\(x=1\\)까지 이어져요.","check":{"prompt":"나눗셈으로 얻은 등식을 \\(x=1\\)까지 확장할 때 필요한 조건은 무엇인가요?","answer":"\\(g\\)가 연속이고 \\(f'\\)도 연속이어서 \\(f'(g(x))\\)가 연속이며, 오른쪽 이차식도 연속이라는 점이에요."}},{"id":"c2","label":"두 이차식을 완전제곱으로 맞춰요","stepIds":["s4"],"question":"\\(f'(g(x))\\)의 식에서 \\(g\\)의 최솟값을 읽기 좋은 꼴은 어떻게 만들까요?","hint":"\\(f'(t)=3t^2+2at+b\\)와 앞에서 구한 이차식을 각각 완전제곱해요.","explanation":"\\(f'(t)=3t^2+2at+b\\)에 \\(t=g(x)\\)를 넣고 앞 장의 이차식과 같다고 놓아요. 양쪽에서 완전제곱을 만들면\n\n\\(3\\left(g(x)+\\dfrac a3\\right)^2=\\left(x+\\dfrac{a+1}{2}\\right)^2+\\dfrac{(a+3)^2}{12}\\)\n\n이 돼요. 오른쪽은 제곱과 음이 아닌 상수의 합이에요. 특히 \\(a\\ne-3\\)이면 항상 양수라서 \\(g(x)+a/3\\)은 한 번도 \\(0\\)이 될 수 없어요. 이 사실이 뒤에서 부호를 한 가지로 고정해 줘요.","check":{"prompt":"\\(a\\ne-3\\)일 때 \\(g(x)+a/3\\)이 \\(0\\)이 될 수 없는 이유는 무엇인가요?","answer":"오른쪽의 \\((a+3)^2/12\\)가 양수이므로 전체가 항상 양수이고, 따라서 왼쪽의 제곱도 \\(0\\)이 될 수 없기 때문이에요."}},{"id":"c3","label":"겹치는 두 가지를 따로 검사해요","stepIds":["s5","s6","s7"],"question":"\\(a=-3\\)일 때 부호를 마음대로 바꾸지 못하는 이유는 무엇일까요?","hint":"두 가지 식이 만나는 점은 \\(x=1\\)뿐이고, 각 반직선에서 음의 가지를 택했을 때 끝으로 가 보세요.","explanation":"\\(a=-3\\)이면 식이 \\(3(g(x)-1)^2=(x-1)^2\\)이므로\n\n\\(g(x)=1\\pm\\dfrac{|x-1|}{\\sqrt3}\\)\n\n이에요. 두 가지 값은 \\(x=1\\)에서만 같아요. 그러므로 연속인 \\(g\\)는 \\(x<1\\), \\(x>1\\)인 각각의 구간 안에서 부호를 갑자기 바꿀 수 없어요. 왼쪽이나 오른쪽에서 음의 가지를 택하면 그 방향으로 멀어질수록 \\(1-|x-1|/\\sqrt3\\)이 아래로 한없이 작아져 최솟값을 가질 수 없어요. 결국 양의 가지만 택해야 하고, 이때 최솟값은 \\(x=1\\)에서 \\(1\\)이에요. 조건의 \\(5/2\\)와 다르므로 \\(a=-3\\)은 제외돼요.","check":{"prompt":"\\(a=-3\\)에서 양의 가지만 택한 함수의 최솟값과 그때의 \\(x\\)는 무엇인가요?","answer":"\\(g(x)=1+|x-1|/\\sqrt3\\)이므로 \\(x=1\\)에서 최솟값 \\(1\\)을 가져요."}},{"id":"c4","label":"연속성과 최솟값으로 계수를 정해요","stepIds":["s8","s9","s10","s11"],"question":"\\(a\\ne-3\\)일 때 왜 양의 제곱근만 남고, 그 최솟값은 어떻게 계산할까요?","hint":"\\(g(x)+a/3\\)은 연속이고 \\(0\\)이 되지 않아요. 음의 부호를 택했을 때 \\(|x|\\)가 커지는 경우도 살펴봐요.","explanation":"\\(a\\ne-3\\)이면 \\(g(x)+a/3\\)은 연속이면서 \\(0\\)이 되지 않으므로 실수 전체에서 부호가 일정해요. 음의 부호를 고르면 \\(|x|\\)가 커질 때 제곱근 부분이 커져 \\(g(x)\\)가 아래로 한없이 작아져요. 최솟값이 있다는 조건 때문에 양의 부호만 가능해요.\n\n제곱근 안은 \\(x=-(a+1)/2\\)에서 가장 작으므로 \\(g\\)의 최솟값은\n\n\\(-\\dfrac a3+\\dfrac{|a+3|}{6}=\\dfrac52\\)\n\n예요. \\(a>-3\\)이면 왼쪽은 \\((3-a)/6<1\\)이라 \\(5/2\\)가 될 수 없어요. 따라서 \\(a<-3\\)이고, 이때 \\(|a+3|=-(a+3)\\)이므로\n\n\\(-\\dfrac a3-\\dfrac{a+3}{6}=-\\dfrac{a+1}{2}=\\dfrac52\\)\n\n에서 \\(a=-6\\)을 얻어요.","check":{"prompt":"\\(a<-3\\)인 경우 절댓값을 푼 뒤 생기는 일차방정식은 무엇인가요?","answer":"\\(-a/3-(a+3)/6=-(a+1)/2=5/2\\)이고, 이를 풀면 \\(a=-6\\)이에요."}},{"id":"c5","label":"남은 계수와 요구값을 계산해요","stepIds":["s12","s13","s14"],"question":"\\(a=-6\\)을 정한 뒤 \\(g(1)\\)과 \\(b\\)는 어떤 순서로 구할까요?","hint":"완전제곱 식에 \\(x=1\\)을 넣고, 앞에서 고른 양의 가지의 부호를 잊지 마세요.","explanation":"\\(a=-6\\), \\(x=1\\)을 완전제곱 식에 넣으면 \\(3(g(1)-2)^2=3\\)이에요. 그래서 겉으로는 \\(g(1)=1,3\\) 두 값이 나오지만, 우리는 \\(g(x)+a/3=g(x)-2>0\\)인 양의 가지를 골랐으므로 \\(g(1)=3\\)이에요.\n\n(다)의 \\(f(g(1))=6\\)은 \\(f(3)=6\\)이라는 뜻이에요. \\(f(x)=x^3-6x^2+bx-3\\)에 넣으면\n\n\\(27-54+3b-3=6\\), 따라서 \\(b=12\\)예요. 이제 \\(f(4)=64-96+48-3=13\\)이고, 주어진 정답과도 일치해요.","check":{"prompt":"\\(g(1)=1\\)을 버리는 근거와 최종 확인값을 함께 말해 보세요.","answer":"양의 가지에서는 \\(g(1)-2>0\\)이어야 하므로 \\(g(1)=3\\)이고, \\(b=12\\)를 넣은 \\(f(4)\\)는 \\(13\\)이에요."}}],"takeaway":["나눗셈으로 빠진 점이 생기면 양변의 연속성을 확인한 뒤 그 점까지 등식을 확장해요.","제곱근의 부호는 연속성과 최솟값의 존재를 함께 써서 고정해요.","절댓값이 든 최솟값 식은 계수의 범위를 먼저 나눈 뒤 풀어요."]};</script>
