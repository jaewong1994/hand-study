 연속성으로 }x=1\\text{에서도 같은 등식이 성립}"},{"id":"s4","latex":"3\\left(g(x)+\\frac a3\\right)^2=\\left(x+\\frac{a+1}2\\right)^2+\\frac{(a+3)^2}{12}"},{"id":"s5","latex":"a=-3\\text{이면 }g(x)=1\\pm\\frac{|x-1|}{\\sqrt3}"},{"id":"s6","latex":"\\text{어느 한쪽에서 음의 가지를 택하면 아래로 무한히 작아지므로 최솟값을 가지려면 양의 가지만 가능}"},{"id":"s7","latex":"\\text{이때 최솟값은 }1\\ne\\frac52\\ \\Rightarrow\\ a\\ne-3"},{"id":"s8","latex":"\\text{우변이 항상 양수이고 }g\\text{가 연속이므로 }g(x)+a/3\\text{의 부호는 일정}"},{"id":"s9","latex":"\\text{음의 가지는 아래로 무한히 작아지므로 양의 가지를 택한다. }g(x)\\text{의 최솟값은 }-\\frac a3+\\frac{|a+3|}{6}=\\frac52"},{"id":"s10","latex":"a>-3\\text{이면 }g(x)\\text{의 최솟값은 }\\frac{3-a}6\u003c1\\text{이므로 불가}"},{"id":"s11","latex":"a\u003c-3:\\quad-\\frac{a+1}2=\\frac52\\ \\Rightarrow\\ a=-6"},{"id":"s12","latex":"3(g(1)-2)^2=3,\\quad g(1)>2\\ \\Rightarrow\\ g(1)=3"},{"id":"s13","latex":"f(3)=6\\ \\Rightarrow\\ 27-54+3b-3=6\\ \\Rightarrow\\ b=12"},{"id":"s14","latex":"f(4)=64-96+48-3=\\boxed{13}"}],"track":"공통"};</script>
