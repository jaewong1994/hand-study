<script>window.HandStudyRecord={"itemId":16242,"sourceLabel":"2019 교육청 고3 수리가형 3월 20번","adminYear":2019,"grade":3,"month":3,"number":20,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"함수 $f(x)=x ^{2} +ax+b\\,$$\\left( \\,0\u003cb\u003c \\frac{\\pi }{2} \\, \\right) \\,$에 대하여 함수 $g\\,(x)=\\sin\\, \\left( f\\, \\left( x \\right) \\right) \\,$가 다음 조건을 만족시킨다.\n(가) 모든 실수 $x\\,$에 대하여 $g' \\left( -x \\right) \\,= -g' \\left( x \\right) \\,$이다.(나) 점 $\\left( k,\\,g(k) \\right) \\,$는 곡선 $y=g \\left( x \\right) \\,$의 변곡점이고, $2k\\,g\\,(k)\\,= \\sqrt{3} g' \\left( k \\right) \\,$이다.\n두 상수 $a$, $b\\,$에 대하여 $a+b\\,$의 값은? [4점]\n① $\\frac{\\pi }{3} - \\frac{\\sqrt{3}}{2}$ ② $\\frac{\\pi }{3} - \\frac{\\sqrt{3}}{3}$ ③ $\\frac{\\pi }{3} - \\frac{\\sqrt{3}}{6}$\n④ $\\frac{\\pi }{2} - \\frac{\\sqrt{3}}{3}$ ⑤ $\\frac{\\pi }{2} - \\frac{\\sqrt{3}}{6}$","answer":"③","sourceHash":"e4203c3596acabba59f4b4c30b1f6e02cbbf41b14fda98f4a1ac4e7469bc79e4","steps":[{"id":"s1","latex":"g'(x)=(2x+a)\\cos(x^2+ax+b)"},{"id":"s2","latex":"g'\\text{가 홀함수}\\Rightarrow g'(0)=a\\cos b=0"},{"id":"s3","latex":"0\u003cb\u003c\\dfrac\\pi2\\Rightarrow a=0"},{"id":"s4","latex":"g''(x)=2\\cos(x^2+b)-4x^2\\sin(x^2+b)"},{"id":"s5","latex":"\\theta=k^2+b:\\quad2k\\sin\\theta=2\\sqrt3k\\cos\\theta\\Rightarrow\\tan\\theta=\\sqrt3"},{"id":"s6","latex":"g''(k)=0\\Rightarrow\\cos\\theta=2k^2\\sin\\theta\\Rightarrow k^2=\\dfrac{\\sqrt3}{6}"},{"id":"s7","latex":"\\theta=\\dfrac\\pi3\\Rightarrow b=\\dfrac\\pi3-\\dfrac{\\sqrt3}{6}"},{"id":"s8","latex":"a+b=\\dfrac\\pi3-\\dfrac{\\sqrt3}{6}"}],"diagram":null,"contentHash":"ba40ab6262bc406053a1d92b414067c633b474f5c8897dafa55e6cd60c5adbf3","questionHtml":"\u003cp class=\"hp htall\">함수 \u003cspan class=\"heq\">\\(f(x)=x^{2} +ax+b\\,\\)\u003c/span>\u003cspan class=\"heq\">\\(\\left( \\,0\\lt b\\lt  \\dfrac{\\pi }{2} \\, \\right) \\,\\)\u003c/span>에 대하여 \u003cbr>함수 \u003cspan class=\"heq\">\\(g\\,(x)=\\sin\\, \\left( f\\, \\left( x \\right) \\right) \\,\\) <script>window.HandStudyGuide={"itemId":16242,"sourceHash":"e4203c3596acabba59f4b4c30b1f6e02cbbf41b14fda98f4a1ac4e7469bc79e4","contentHash":"ba40ab6262bc406053a1d92b414067c633b474f5c8897dafa55e6cd60c5adbf3","overview":{"goal":"도함수의 대칭 조건으로 \\(a\\)를 정하고 변곡점의 두 조건을 함께 써서 \\(b\\)를 구해요.","firstLook":"\\(g'(-x)=-g'(x)\\)는 \\(g'\\)가 홀함수라는 뜻이에요. 먼저 \\(x=0\\)을 넣으면 계산이 크게 줄어요.","conditions":[{"label":"도함수 대칭","meaning":"\\(g'(0)=0\\)을 강제해 \\(a\\)를 정해요."},{"label":"변곡점 조건","meaning":"\\(g''(k)=0\\)과 주어진 등식을 동시에 만족해야 해요."}]},"chapters":[{"id":"c1","label":"대칭 조건으로 일차항을 없애요","stepIds":["s1","s2","s3"],"question":"왜 \\(a=0\\)이어야 할까요?","hint":"\\(x=0\\)을 홀함수 조건에 넣고 \\(\\cos b\\)의 부호를 확인해요.","explanation":"\\(g'(x)=(2x+a)\\cos(x^2+ax+b)\\)예요. 홀함수이면 \\(g'(0)=-g'(0)\\)이므로 \\(g'(0)=a\\cos b=0\\)이에요. \\(0<b<\\pi/2\\)에서는 \\(\\cos b>0\\)이므로 \\(a=0\\)이에요.","check":{"prompt":"\\(\\cos b=0\\)인 가능성을 왜 제외할 수 있나요?","answer":"\\(b\\)가 0과 \\(\\pi/2\\) 사이에 있어서 \\(\\cos b\\)는 양수이고 0이 아니기 때문이에요."}},{"id":"c2","label":"두 변곡점 조건을 식으로 바꿔요","stepIds":["s4","s5","s6"],"question":"\\(k^2\\)은 어떻게 \\(\\sqrt3/6\\)으로 정해질까요?","hint":"\\(\\theta=k^2+b\\)로 두고 주어진 등식과 \\(g''(k)=0\\)을 나란히 써요.","explanation":"\\(a=0\\)이면 \\(g''(x)=2\\cos(x^2+b)-4x^2\\sin(x^2+b)\\)예요. \\(k=0\\)이면 \\(g''(0)=2\\cos b>0\\)라 변곡점이 아니므로 \\(k\\ne0\\)이에요. \\(\\theta=k^2+b\\)로 두면 주어진 등식은 \\(2k\\sin\\theta=2\\sqrt3k\\cos\\theta\\)이고, \\(k\\ne0\\)이므로 \\(\\tan\\theta=\\sqrt3\\)이에요. 또 \\(g''(k)=0\\)에서 \\(\\cos\\theta=2k^2\\sin\\theta\\)이므로 \\(1=2k^2\\tan\\theta\\), 따라서 \\(k^2=\\sqrt3/6\\)이에요.","check":{"prompt":"주어진 등식에서 \\(k\\)로 나누기 전에 무엇을 확인해야 하나요?","answer":"\\(k=0\\)이 변곡점이 될 수 없음을 \\(g''(0)=2\\cos b>0\\)으로 먼저 확인해야 해요."}},{"id":"c3","label":"각의 여러 가능성에서 범위에 맞는 값을 골라요","stepIds":["s7","s8"],"question":"\\(\\tan\\theta=\\sqrt3\\)에서 왜 \\(\\theta=\\pi/3\\)만 남을까요?","hint":"\\(\\theta=\\pi/3+n\\pi\\)를 \\(b=\\theta-k^2\\)에 넣고 \\(0<b<\\pi/2\\)를 써요.","explanation":"\\(\\tan\\theta=\\sqrt3\\)이므로 \\(\\theta=\\pi/3+n\\pi\\)예요. 따라서 \\(b=\\pi/3+n\\pi-\\sqrt3/6\\)이에요. \\(0<b<\\pi/2\\)를 만족하는 정수는 \\(n=0\\)뿐이에요. 그러므로 \\(b=\\pi/3-\\sqrt3/6\\), \\(a=0\\)이고 \\(a+b=\\pi/3-\\sqrt3/6\\)이에요. 실제 변곡점인지도 \\(g''\\)의 부호로 확인할 수 있어요. \\(u=x^2\\)로 두면 \\(k\\) 근처에서 \\(g''(x)=2\\cos(u+b)\\{1-2u\\tan(u+b)\\}\\)이고 \\(\\cos(u+b)>0\\)이에요. 또 \\(u=k^2\\) 근처에서는 \\(u>0\\), \\(\\tan(u+b)>0\\)이고, \\(u\\)가 커질수록 \\(u\\)와 \\(\\tan(u+b)\\)가 함께 커지므로 \\(2u\\tan(u+b)\\)도 증가해요. 이 값은 \\(u=k^2\\)에서 1이에요. 따라서 \\(x\\)가 \\(k\\)를 지날 때 \\(g''\\)의 부호가 바뀌어 실제로 변곡점 조건을 만족해요. 정답은 ③이에요.","check":{"prompt":"마지막 후보가 실제 변곡점을 만드는 것은 어떻게 확인하나요?","answer":"\\(u=k^2\\) 근처에서는 \\(u\\)와 \\(\\tan(u+b)\\)가 모두 양수로 증가해 \\(2u\\tan(u+b)\\)가 1을 지나가요. 그래서 \\(1-2u\\tan(u+b)\\)의 부호가 바뀌고, 양수인 \\(2\\cos(u+b)\\)를 곱한 \\(g''\\)의 부호도 바뀌어요."}}],"takeaway":["홀함수인 도함수에는 먼저 0을 넣어 상수 조건을 찾아요.","식을 나눌 때는 나누는 값이 0이 아님을 먼저 확인해요.","삼각함수 방정식의 여러 해는 원래 상수의 범위로 걸러요."]};</script>
