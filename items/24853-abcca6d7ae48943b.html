<script>window.HandStudyRecord={"adminYear":2022,"answer":"100","contentHash":"d6b3d064590c0e26477055078cebc187f11b4781bd48cf6f24e5c03961eee2d0","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24853,"month":11,"number":30,"points":4,"preview":false,"questionHtml":"\u003cp>집합 \u003cspan class=\"heq\">\\(X=\\{x\\mid x\\text{는 }10\\text{ 이하의 자연수}\\}\\)\u003c/span>에 대하여 다음 조건을 만족시키는 함수 \u003cspan class=\"heq\">\\(f\\,:\\,X\\, \\rightarrow \\,X\\,\\)\u003c/span>의 개수를 구하시오. [4점]\u003c/p>\u003cdiv class=\"hbox hcond\">\u003cp class=\"hcondr\">(가) \u003cspan class=\"heq\">\\(9\\)\u003c/span> 이하의 모든 자연수 \u003cspan class=\"heq\">\\(x\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(f \\left( x \\right) \\leq f \\left( x+1 \\right)\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hcondr\">(나) \u003cspan class=\"heq\">\\(1 \\leq x \\leq 5\\)\u003c/span>일 때 \u003cspan class=\"heq\">\\(f \\left( x \\right) \\leq x\\)\u003c/span>이고, \u003cspan class=\"heq\">\\(6 \\leq x \\leq 10\\)\u003c/span>일 때 \u003cspan class=\"heq\">\\(f \\left( x \\right) \\geq x\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hcondr\">(다) \u003cspan class=\"heq\">\\(f \\left( 6 \\right) =f \\left( 5 \\right) +6\\)\u003c/span>\u003c/p>\u003c/div>","questionText":"집합 $X=\\left\\{x \\, \\left| \\,x$는 $10$ 이하의 자연수$\\left. \\right\\}$에 대하여 다음 조건을 만족시키는 함수 $f\\,:\\,X\\, \\rightarrow \\,X\\,$의 개수를 구하시오. [4점]\n(가) $9$ 이하의 모든 자연수 $x$에 대하여 $f \\left( x \\right) \\leq f \\left( x+1 \\right)$이다.(나) $1 \\leq x \\leq 5$일 때 $f \\left( x \\right) \\leq x$이고, $6 \\leq x \\leq 10$일 때 $f \\left( x \\right) \\geq x$이다.(다) $f \\left( 6 \\right) =f \\left( 5 \\right) +6$","sourceHash":"485f697d3a781d908f1bc789efe6ea46e7e70a020bae2be2bc3244f35a6f2b21","sourceKind":"csat","sourceLabel":"2022년 시행 수능 · 2023학년도 · 확률과 통계 · 30번","steps":[{"id":"s1","latex":"f(1)=1,\\quad f(10)=10,\\quad k=f(5),\\quad f(6)=k+6\\le10\\ \\Rightarrow\\ k=1,2,3,4"},{"id":"s2","latex":"L_k=\\text{앞 다섯 함숫값을 정하는 경우의 수},\\quad R_k=\\text{뒤 다섯 함숫값을 정하는 경우의 수}"},{"id":"s3","latex":"L_1=1\\quad\\text{모두 1}"},{"id":"s4","latex":"L_2={}_4\\mathrm C_3=4\\quad\\text{1,2 중 중복하여 세 값을 골라 작은 값부터 나열}"},{"id":"s5","latex":"L_3={}_5\\mathrm C_3-1=9\\quad\\text{1,2,3의 작은 값부터 놓은 세 값 중 }(3,3,3)\\text{ 제외}"},{"id":"s6","latex":"L_4={}_6\\mathrm C_3-{}_4\\mathrm C_3-2=20-4-2=14"},{"id":"s7","latex":"\\text{제외한 네 경우는 }f(2)\\ge3;\\quad\\text{추가 두 경우는 }(f(2),f(3),f(4))=(1,4,4),(2,4,4)"},{"id":"s8","latex":"b_i=11-f(11-i)\\quad(i=1,\\ldots,5)\\text{로 두면 }1=b_1\\le\\cdots\\le b_5=5-k,\\quad b_i\\le i"},{"id":"s9","latex":"\\text{이 대응은 되돌릴 수 있으므로 }R_k=L_{5-k}"},{"id":"s10","latex":"\\sum_{k=1}^4L_kR_k=1\\cdot14+4\\cdot9+9\\cdot4+14\\cdot1=\\boxed{100}"}],"track":"확률과 통계"};</script>
<script>window.HandStudyGuide={"itemId":24853,"sourceHash":"485f697d3a781d908f1bc789efe6ea46e7e70a020bae2be2bc3244f35a6f2b21","contentHash":"d6b3d064590c0e26477055078cebc187f11b4781bd48cf6f24e5c03961eee2d0","overview":{"goal":"\\(f(5)\\)의 값으로 경우를 나누고, 앞 다섯 값과 뒤 다섯 값의 대칭을 이용해 함수의 개수를 세어요.","firstLook":"함숫값이 감소하지 않으므로 처음 값과 마지막 값이 바로 정해져요. 가운데 조건 \\(f(6)=f(5)+6\\)이 가능한 경우를 네 갈래로 줄여 줘요.","conditions":[{"label":"단조 조건","meaning":"\\(f(1)\\le\\cdots\\le f(10)\\)이라 함숫값을 작은 순서로 세면 돼요."},{"label":"앞쪽 범위","meaning":"\\(1\\le x\\le5\\)에서는 각 자리의 함숫값이 그 자리 번호를 넘지 않아요."},{"label":"뒤쪽 범위","meaning":"\\(6\\le x\\le10\\)에서는 각 자리의 함숫값이 그 자리 번호보다 작지 않아요."}]},"chapters":[{"id":"c1","label":"가운데 값의 네 경우를 잡아요","stepIds":["s1","s2"],"question":"\\(k=f(5)\\)는 왜 \\(1,2,3,4\\)만 가능할까요?","hint":"\\(f(1)\\)과 \\(f(10)\\)을 먼저 정하고 \\(f(6)=k+6\\le10\\)을 써요.","explanation":"\\(f(1)\\le1\\)이고 함숫값은 자연수이므로 \\(f(1)=1\\)이에요. 또 \\(f(10)\\ge10\\)이고 공역이 \\(X\\)이므로 \\(f(10)=10\\)이에요. \\(k=f(5)\\)로 놓으면 \\(f(6)=k+6\\)이고 이 값도 \\(10\\) 이하이므로 \\(k\\le4\\)예요. 자연수이므로 \\(k=1,2,3,4\\)예요. 앞 다섯 값을 정하는 경우의 수를 \\(L_k\\), 뒤 다섯 값을 정하는 경우의 수를 \\(R_k\\)라 할게요.","check":{"prompt":"\\(k=5\\)가 불가능한 원래 조건은 무엇인가요?","answer":"\\(f(6)=k+6=11\\)이 되어 공역 \\(X=\\{1,\\ldots,10\\}\\)을 벗어나요."}},{"id":"c2","label":"앞의 네 경우를 직접 세어요","stepIds":["s3","s4","s5","s6","s7"],"question":"\\(k=4\\)일 때 전체 스무 경우에서 왜 여섯 경우를 빼야 할까요?","hint":"\\(f(2)\\le2\\)를 어기는 경우와, 그것은 지키지만 \\(f(3)\\le3\\)을 어기는 경우를 따로 세어요.","explanation":"\\(f(1)=1,f(5)=k\\)이므로 가운데 \\(f(2),f(3),f(4)\\)를 \\(1\\)부터 \\(k\\)에서 감소하지 않게 골라요. \\(k=1\\)이면 모두 \\(1\\)이라 \\(L_1=1\\)이에요. \\(k=2\\)이면 두 값을 중복 허용해 세 자리에 놓는 경우라 \\(L_2={}_4\\mathrm C_3=4\\)예요.\n\n\\(k=3\\)이면 전체가 \\({}_5\\mathrm C_3=10\\)인데 \\((3,3,3)\\)은 \\(f(2)\\le2\\)를 어겨 제외하므로 \\(L_3=9\\)예요. \\(k=4\\)이면 전체가 \\({}_6\\mathrm C_3=20\\)이에요. \\(f(2)\\ge3\\)인 경우는 \\(3,4\\)에서 세 값을 고르는 \\({}_4\\mathrm C_3=4\\)가지예요. 이를 제외한 뒤에도 \\(f(3)=4\\)인 \\((1,4,4),(2,4,4)\\) 두 경우가 \\(f(3)\\le3\\)을 어겨요. 따라서 \\(L_4=20-4-2=14\\)예요.","check":{"prompt":"\\(k=4\\)에서 제외하는 두 종류가 겹치지 않는 이유는 무엇인가요?","answer":"첫 종류는 \\(f(2)\\ge3\\)이고, 추가 두 경우는 \\(f(2)=1\\) 또는 \\(2\\)라서 서로 겹치지 않아요."}},{"id":"c3","label":"뒤쪽을 앞쪽으로 뒤집어요","stepIds":["s8","s9"],"question":"뒤 다섯 함숫값을 왜 앞쪽과 같은 문제로 바꿀 수 있을까요?","hint":"순서를 뒤집고 각 값을 \\(11\\)에서 빼는 \\(b_i=11-f(11-i)\\)를 사용해요.","explanation":"\\(b_i=11-f(11-i)\\)로 두면 뒤쪽 순서를 거꾸로 읽으면서 큰 값을 작은 값으로 바꿔요. \\(f(10)=10\\)에서 \\(b_1=1\\), \\(f(6)=k+6\\)에서 \\(b_5=5-k\\)예요. \\(f\\)가 감소하지 않으므로 \\(b_1\\le\\cdots\\le b_5\\)이고, \\(f(11-i)\\ge11-i\\)는 \\(b_i\\le i\\)로 바뀌어요. 이는 앞 다섯 값을 세는 조건과 똑같고 마지막 값만 \\(5-k\\)예요. 이 대응은 \\(f(11-i)=11-b_i\\)로 되돌릴 수 있으므로 빠지거나 겹치는 경우가 없어 \\(R_k=L_{5-k}\\)예요.","check":{"prompt":"뒤쪽 조건 \\(f(11-i)\\ge11-i\\)는 \\(b_i\\)에 대한 어떤 부등식이 되나요?","answer":"\\(11-f(11-i)\\le i\\), 곧 \\(b_i\\le i\\)가 돼요."}},{"id":"c4","label":"네 갈래를 곱하고 더해요","stepIds":["s10"],"question":"각 \\(k\\)에서 앞과 뒤 경우의 수는 왜 곱할 수 있을까요?","hint":"\\(k\\)가 정해지면 앞쪽 선택과 뒤쪽 선택이 가운데 두 값 외에는 서로 간섭하지 않아요.","explanation":"각 \\(k\\)에 대해 앞쪽 한 가지를 고른 뒤 뒤쪽 한 가지를 독립적으로 붙일 수 있으므로 \\(L_kR_k\\)예요. \\(L_1,L_2,L_3,L_4=1,4,9,14\\)이고 \\(R_k=L_{5-k}\\)이므로\n\n\\(1\\cdot14+4\\cdot9+9\\cdot4+14\\cdot1=14+36+36+14=100\\)\n\n이에요. 서로 다른 \\(k\\)는 \\(f(5)\\)가 달라 겹치지 않으므로 모두 더한 \\(100\\)이 정답이에요.","check":{"prompt":"가운데 두 항이 각각 \\(36\\)인 이유는 무엇인가요?","answer":"\\(k=2\\)에서는 \\(L_2R_2=4L_3=4\\cdot9\\), \\(k=3\\)에서는 \\(L_3R_3=9L_2=9\\cdot4\\)이기 때문이에요."}}],"takeaway":["감소하지 않는 함수의 개수는 양 끝값과 가운데 경계값을 먼저 정하면 경우가 크게 줄어요.","중복을 허용해 고른 값을 작은 순서로 놓은 뒤 자리별 상한을 어기는 경우를 겹치지 않게 제외해요.","순서를 뒤집고 값을 보완하는 대응이 되돌릴 수 있는지 확인하면 뒤쪽 계산을 앞쪽 계산으로 바꿀 수 있어요."]};</script>
