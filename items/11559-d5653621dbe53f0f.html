  <script>window.HandStudyRecord={"itemId":11559,"sourceLabel":"2019 교육청 고1 수학 11월 20번","adminYear":2019,"grade":1,"month":11,"number":20,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"이차함수 $f \\left( x \\right)$가 다음 조건을 만족시킨다.\n(가) $f \\left( -4 \\right) =0$\n(나) 모든 실수 $x$에 대하여 $f \\left( x \\right) \\leq f \\left( -2 \\right)$이다.\n\u003c보기>에서 옳은 것만을 있는 대로 고른 것은? [4점]\n\u003c보기>\nㄱ. $f \\left( 0 \\right) =0$\nㄴ. $-1 \\leq x \\leq 1$에서 함수 $f \\left( x \\right)$의 최솟값은 $f \\left( 1 \\right)$이다.\nㄷ. 실수 $p$에 대하여 $p \\leq x \\leq p+2$에서 함수 $f \\left( x \\right)$의 최솟값을 $g \\left( p \\right)$라 할 때, 함수 $g \\left( p \\right)$의 최댓값이 $1$이면 $f \\left( -2 \\right) = \\frac{4}{3}$이다. \n① ㄱ ② ㄱ, ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","answer":"⑤","sourceHash":"adc2f22f0bbcb80818aff195bdf0214c2dea167bff746c2571cf509dcc7017f6","steps":[{"id":"s1","latex":"f(-4)=0,\\ \\text{축 }x=-2,\\ \\max f=f(-2)\\Rightarrow f(x)=ax(x+4),\\ a\u003c0"},{"id":"s2","latex":"f(0)=0\\quad\\text{(\\char\"3131 참)}"},{"id":"s3","latex":"[-1,1]\\text{에서 }f\\text{는 감소}\\Rightarrow\\min f=f(1)\\quad\\text{(\\char\"3134 참)}"},{"id":"s4","latex":"g(p)=\\min\\{f(p),f(p+2)\\}"},{"id":"s5","latex":"g\\text{ 최대}\\iff p=-3\\Rightarrow g(-3)=f(-3)=-3a"},{"id":"s6","latex":"-3a=1\\Rightarrow f(-2)=-4a=\\frac43\\quad\\text{(\\char\"3137 참)}"}],"diagram":null,"contentHash":"8dbb309f22c65ab6bb09d9ddcc277b1ea663568dcca0f28fd459a6e49b70d57a","questionHtml":"\u003cp class=\"hp\">이차함수 \u003cspan class=\"heq\">\\(f \\left( x \\right)\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) \u003cspan class=\"heq\">\\(f \\left( -4 \\right) =0\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">(나) 모든 실수 \u003cspan class=\"heq\">\\(x\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(f \\left( x \\right) \\leq f \\left( -2 \\right)\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp class=\"hp\">&lt;보기&gt;에서 옳은 것만을 있는 대로 고른 것은? \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cdiv class=\"
