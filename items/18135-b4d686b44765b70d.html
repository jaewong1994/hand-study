<script>window.HandStudyGuide={"itemId":18135,"sourceHash":"4d4da7239d98890c2a10d1d8db12ce11cb680aba6be6e11587fbbf7678b6ee28","contentHash":"6ba480facbab83a349db1f711703709c55eb60ac3e6aed290baed8f2b568f721","overview":{"goal":"초점에서 점근선과 평행하게 그은 선의 각과 쌍곡선의 거리차를 이용해 쌍곡선의 크기를 정하고 삼각형 넓이를 구해요.","firstLook":"\\(Q,P,F\\)는 한 직선 위이고 \\(PF\\)는 점근선과 평행해요. 직각삼각형 \\(PFF'\\)에서 쌍곡선의 거리차와 점근선의 기울기를 함께 쓰면 두 초점거리가 정해져요.","conditions":[{"label":"오른쪽 가지","meaning":"\\(P\\)는 제1사분면의 오른쪽 가지에 있어 \\(PF'-PF=2a\\)예요."},{"label":"직각","meaning":"\\(Q,P,F\\)가 일직선이므로 \\(\\angle QPF'=90^\\circ\\)에서 \\(PF\\perp PF'\\)예요."}]},"chapters":[{"id":"c1","label":"점근선 방향과 QF를 식으로 나타내요","stepIds":["s1","s2"],"question":"점근선과 평행한 \\(PF\\)는 어떤 직각삼각형의 비를 만들까요?","hint":"쌍곡선을 \\(x^2/a^2-y^2/b^2=1\\)로 두고 \\(c^2=a^2+b^2\\)를 사용해요.","explanation":"쌍곡선을 \\(x^2/a^2-y^2/b^2=1\\)로 두면 초점은 \\((\\pm c,0)\\)이고 \\(c^2=a^2+b^2\\)예요. 점근선의 기울기 크기는 \\(b/a\\)이므로, \\(F\\)에서 왼쪽 위로 향하는 \\(PF\\)가 \\(x\\)축과 이루는 예각을 \\(\\theta\\)라 하면 \\(\\cos\\theta=a/c\\)예요.\n\n직선 \\(PF\\)가 y축과 만나는 점이 \\(Q\\)이므로 직각삼각형 \\(QOF\\)에서 \\(OF=c\\), \\(OQ=bc/a\\)예요. 따라서 \\(QF=\\sqrt{c^2+(bc/a)^2}=c^2/a\\)이고, 조건에서 \\(c^2/a=20\\)이에요.","check":{"prompt":"\\(OQ=bc/a\\)는 어떻게 나오나요?","answer":"기울기 크기가 \\(b/a\\)인 직선이 F에서 y축까지 수평으로 c만큼 이동하므로 높이는 \\((b/a)c\\)예요."}},{"id":"c2","label":"직각 초점삼각형으로 a와 c의 비를 구해요","stepIds":["s3","s4","s5"],"question":"\\(PF=2a\\), \\(PF'=4a\\)는 어떤 두 조건을 함께 써서 얻을까요?","hint":"점근선 방향에서 얻은 코사인과 쌍곡선의 초점 거리차를 사용해요.","explanation":"\\(Q,P,F\\)가 일직선이고 \\(PF'\\perp PQ\\)이므로 삼각형 \\(PFF'\\)는 \\(P\\)에서 직각이고 빗변은 \\(FF'=2c\\)예요. \\(F\\)에서의 각은 점근선 방향의 각 \\(\\theta\\)이므로 \\(PF/(2c)=\\cos\\theta=a/c\\), 따라서 \\(PF=2a\\)예요.\n\n\\(P\\)가 오른쪽 가지에 있으므로 \\(PF'-PF=2a\\)이고, \\(PF'=4a\\)예요. 피타고라스 정리로 \\((2a)^2+(4a)^2=(2c)^2\\), 즉 \\(c^2=5a^2\\)예요. 이를 \\(c^2/a=20\\)에 넣으면 \\(5a=20\\), \\(a=4\\)이고 \\(b=8,c=4\\sqrt5\\)예요.","check":{"prompt":"초점 거리차에서 \\(PF-PF'\\)가 아니라 \\(PF'-PF\\)를 쓰는 이유는 무엇인가요?","answer":"P가 오른쪽 가지에 있어 오른쪽 초점 F에 더 가깝고 왼쪽 초점 F'까지의 거리가 더 길기 때문이에요."}},{"id":"c3","label":"P와 Q의 위치로 넓이를 구해요","stepIds":["s6","s7"],"question":"밑변을 \\(OQ\\)로 볼 때 필요한 높이는 무엇인가요?","hint":"\\(OQ\\)는 y축 위이므로 P에서 y축까지 거리는 \\(x_P\\)예요.","explanation":"\\(F=(c,0)\\)에서 \\(P\\)까지 길이는 \\(2a\\)이고 그 선의 수평 성분 비는 \\(a/c\\)예요. 따라서 \\(x_P=c-2a(a/c)=(c^2-2a^2)/c=3a^2/c=12/\\sqrt5\\)예요. 또 \\(OQ=bc/a=8\\sqrt5\\)예요.\n\n삼각형 \\(OPQ\\)의 밑변을 y축 위의 \\(OQ\\)로 잡으면 높이는 \\(P\\)의 x좌표예요. 따라서 넓이는 \\((1/2)(8\\sqrt5)(12/\\sqrt5)=48\\)이에요. \\(x_P>0\\), \\(OQ>0\\)이므로 P와 Q의 위치도 원래 조건에 맞아요.","check":{"prompt":"삼각형 높이가 \\(OP\\)가 아니라 \\(x_P\\)인 이유는 무엇인가요?","answer":"밑변 \\(OQ\\)가 y축 위에 있으므로 P에서 그 직선까지의 수직거리가 P의 x좌표예요."}}],"takeaway":["초점을 지나는 선이 점근선과 평행하면 점근선의 기울기 비를 초점삼각형의 각에 사용할 수 있어요.","쌍곡선의 어느 가지에 점이 있는지 확인해 두 초점거리 중 큰 것과 작은 것을 정해요.","좌표축 위의 선분을 밑변으로 잡으면 삼각형의 높이는 반대 꼭짓점의 해당 좌표로 바로 읽을 수 있어요."]};</script>
