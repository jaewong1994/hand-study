  <script>window.HandStudyRecord={"itemId":17263,"sourceLabel":"2022 교육청 고3 수학기하 10월 21번","adminYear":2022,"grade":3,"month":10,"number":21,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 $a>1$인 실수 $a$에 대하여 두 곡선\n $y$$=a ^{-2x} -1$, $y$$=a ^{x} -1$\n이 있다. 곡선 $y$$=a ^{-2x} -1$과 직선 $y$$= - \\sqrt{3} x$가 서로 다른 두 점 $O$, $A$에서 만난다. 점 $A$를 지나고 직선 $O A$에 수직인 직선이 곡선 $y$$=a ^{x} -1$과 제$1$사분면에서 만나는 점 $B$라 하자. ${\\overline{ OA}} \\,:\\, {\\overline{ OB}}$$= \\sqrt{3} \\,:\\, \\sqrt{19}$일 때, 선분 $A B$의 길이를 구하시오. (단, $O$는 원점이다.) [4점]","answer":"8","sourceHash":"0b282ba8b3041986fdcdb6b6c26cc2b6e4a4b8df5fca01790de10124b7e5b09d","steps":[{"id":"s1","latex":"OA=\\sqrt3k,\\quad OB=\\sqrt{19}k,\\quad AB=4k"},{"id":"s2","latex":"A=\\left(-\\frac{\\sqrt3}{2}k,\\frac32k\\right)"},{"id":"s3","latex":"AB\\perp OA\\Rightarrow B=\\left(\\frac{3\\sqrt3}{2}k,\\frac72k\\right)"},{"id":"s4","latex":"A\\in y=a^{-2x}-1\\Rightarrow a^{\\sqrt3k}=\\frac{3k+2}{2}"},{"id":"s5","latex":"B\\in y=a^x-1\\Rightarrow a^{3\\sqrt3k/2}=\\frac{7k+2}{2}"},{"id":"s6","latex":"\\left(\\frac{3k+2}{2}\\right)^3=\\left(\\frac{7k+2}{2}\\right)^2"},{"id":"s7","latex":"k( k-2)(27k+10)=0\\Rightarrow k=2"},{"id":"s8","latex":"AB=4k=\\boxed8"}],"diagram":null,"contentHash":"fbc32c5f97ed139b512e83469491912522cb577a0b63336a9d7be44c5b3db608","questionHtml":"\u003cp class=\"hp\">그림과 같이 \u003cspan class=\"heq\">\\(a\\gt 1\\)\u003c/span>인 실수 \u003cspan class=\"heq\">\\(a\\)\u003c/span>에 대하여 두 곡선\u003c/p>\u003cp class=\"hp\">&emsp;&emsp;\u003cspan class=\"heq\">\\(y\\)\u003c/span>\u003cspan class=\"heq\">\\(=a^{-2x} -1\\)\u003c/span>, \u003cspan class=\"heq\">\\(y\\)\u003c/span>\u003cspan class=\"heq\">\\(=a^{x} -1\\)\u003c/span>\u003c/p>\u003cp class=\"hp htall\">이 있다. 곡선 \u003cspan class=\"heq\">\\(y\\)\u003c/span>\u003cspan class=\"heq\">\\(=a^{-2x} -1\\)\u003c/span>과 직선 \u003cspan class=\"heq\">\\(y\\)\u003c/span>\u003cspan class=\"heq\">\\(= - \\sqrt{3} x\\)\u003c/span>가 서로 다른 두 점 \u003cspan class=\"heq\">\\(O\\)\u003c/span>, \u003cspan class=\"heq\">\\(A\\)\u003c/span>에서 만난다. 점 \u003cspan class=\"heq\">\\(A\\)\u003c/span>를 지나고 직선 \u003cspan class=\"heq\">\\(O A\\)\u003c/span>에 수직인 직선이 곡선 \u003cspan class=\"heq\">\\(y\\)\u003c/span>\u003cspan class=\"heq\">\\(=a^{x} -1\\)\u003c/span>과 제\u003cspan class=\"heq\">\\(1\\)\u003c/span>사분면에서 만나는 점 \u003cspan class=\"heq\">\\(B\\)\u003c/span>라 하자. \u003cbr>\u003cspan class=\"heq\">\\({\\overline{OA}} \\,:\\, {\\overline{OB}}\\)\u003c/span>\u003cspan class=\"heq\">\\(= \\sqrt{3} \\,:\\, \\sqrt{19}\\)\u003c/span>일 때, 선분 \u003cspan class=\"heq\">\\(A B\\)\u003c/span>의 길이를 구하시오.\u003cbr>(단, \u003cspan class=\"heq\">\\(O\\)\u003c/span>는 원점이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/97f7436f429bd73fbdbf1c4a.png\" style=\"width:303px;max-width:100%\">\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"932f0f105aba6c2986047b2d625f2db571bcf7f16eb400046f2637cafc03ef73"};</script>
