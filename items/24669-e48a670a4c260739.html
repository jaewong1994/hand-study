<script>window.HandStudyRecord={"adminYear":2019,"answer":"450","contentHash":"6385e15046d65948c0929b7b75f90075a846a339f043eaa6be92045aeaae2679","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24669,"month":11,"number":28,"points":4,"preview":false,"questionHtml":"\u003cp>숫자 \u003cspan class=\"heq\">\\(1\\)\u003c/span>, \u003cspan class=\"heq\">\\(2\\)\u003c/span>, \u003cspan class=\"heq\">\\(3\\)\u003c/span>, \u003cspan class=\"heq\">\\(4\\)\u003c/span>, \u003cspan class=\"heq\">\\(5\\)\u003c/span>, \u003cspan class=\"heq\">\\(6\\)\u003c/span> 중에서 중복을 허락하여 다섯 개를 다음 조건을 만족시키도록 선택한 후, 일렬로 나열하여 만들 수 있는 모든 다섯 자리의 자연수의 개수를 구하시오. [4점]\u003c/p>\u003cdiv class=\"hbox hcond\">\u003cp class=\"hcondr\">(가) 각각의 홀수는 선택하지 않거나 한 번만 선택한다.\u003c/p>\u003cp class=\"hcondr\">(나) 각각의 짝수는 선택하지 않거나 두 번만 선택한다.\u003c/p>\u003c/div>","questionText":"숫자 $1$, $2$, $3$, $4$, $5$, $6$ 중에서 중복을 허락하여 다섯 개를 다음 조건을 만족시키도록 선택한 후, 일렬로 나열하여 만들 수 있는 모든 다섯 자리의 자연수의 개수를 구하시오. [4점]\n(가) 각각의 홀수는 선택하지 않거나 한 번만 선택한다.(나) 각각의 짝수는 선택하지 않거나 두 번만 선택한다.","sourceHash":"fd75f065013440d508aa2ff2c75de9c1ae6cbd1a615fe84a5d754ef57dc55279","sourceKind":"csat","sourceLabel":"2019년 시행 수능 · 2020학년도 · 가형 · 28번","steps":[{"id":"s1","latex":"\\text{선택한 홀수의 개수를 }o,\\text{짝수의 종류 수를 }e\\text{라 하면 }o+2e=5"},{"id":"s2","latex":"0\\le o,e\\le3\\ \\Rightarrow\\ (o,e)=(1,2),(3,1)"},{"id":"s3","latex":"(\\mathrm I)\\ (o,e)=(1,2):\\quad {}_3\\mathrm C_1{}_3\\mathrm C_2\\frac{5!}{2!2!}=270"},{"id":"s4","latex":"(\\mathrm {II})\\ (o,e)=(3,1):\\quad {}_3\\mathrm C_3{}_3\\mathrm C_1\\frac{5!}{2!}=180"},{"id":"s5","latex":"\\text{숫자 }0\\text{이 없으므로 모든 배열이 다섯 자리 자연수이다.}"},{"id":"s6","latex":"270+180=\\boxed{450}"}],"track":"가형"};</script>
<script>window.HandStudyGuide={"itemId":24669,"sourceHash":"fd75f065013440d508aa2ff2c75de9c1ae6cbd1a615fe84a5d754ef57dc55279","contentHash":"6385e15046d65948c0929b7b75f90075a846a339f043eaa6be92045aeaae2679","overview":{"goal":"홀수와 짝수를 고르는 경우를 빠짐없이 나눈 뒤, 같은 숫자가 반복되는 배열의 수를 구해요.","firstLook":"짝수 한 종류는 두 자리, 홀수 한 종류는 한 자리를 차지해요. 다섯 자리를 채우는 방법부터 정하면 경우가 크게 줄어요.","conditions":[{"label":"홀수 조건","meaning":"1, 3, 5 가운데 고른 숫자는 각각 한 번씩만 써요."},{"label":"짝수 조건","meaning":"2, 4, 6 가운데 고른 숫자는 각각 정확히 두 번씩 써요."}]},"chapters":[{"id":"c1","label":"다섯 자리를 채우는 두 경우를 찾아요","stepIds":["s1","s2"],"question":"홀수의 개수와 고른 짝수의 종류 수는 어떤 조합만 가능할까요?","hint":"고른 홀수의 개수를 \\(o\\), 고른 짝수의 종류 수를 \\(e\\)라 하고 자리 수를 세어 봐요.","explanation":"홀수 한 종류는 한 자리, 짝수 한 종류는 두 자리를 차지하므로 \\(o+2e=5\\)예요. 또 \\(0\\le o,e\\le3\\)이에요. \\(e=0,1,2\\)를 넣으면 \\(o=5,3,1\\)인데 \\(o=5\\)는 홀수가 세 종류뿐이라 불가능해요. \\(e\\ge3\\)이면 \\(o<0\\)이므로 가능한 경우는 \\((o,e)=(3,1),(1,2)\\)뿐이에요.","check":{"prompt":"\\((o,e)=(5,0)\\)은 왜 제외하나요?","answer":"서로 다른 홀수는 1, 3, 5의 세 종류뿐이고 같은 홀수는 다시 고를 수 없어서 홀수 다섯 개를 채울 수 없어요."}},{"id":"c2","label":"홀수 하나와 짝수 두 종류를 세어요","stepIds":["s3"],"question":"숫자를 고르는 수와 배열하는 수는 각각 얼마일까요?","hint":"홀수 한 종류와 짝수 두 종류를 고른 뒤, 두 번씩 나온 짝수의 중복을 나눠요.","explanation":"종류를 고르는 수는 \\({}_{3}\\mathrm{C}_{1}\\times{}_{3}\\mathrm{C}_{2}=3\\times3\\)이에요. 횟수가 \\(1,2,2\\)이므로 배열은 \\(\\dfrac{5!}{2!2!}=30\\)가지예요. 따라서 \\({}_{3}\\mathrm{C}_{1}\\times{}_{3}\\mathrm{C}_{2}\\times\\dfrac{5!}{2!2!}=270\\)가지예요.","check":{"prompt":"왜 \\(2!\\)를 두 번 나누나요?","answer":"고른 두 짝수가 각각 두 번씩 반복되어, 같은 짝수끼리 자리를 바꾼 배열이 각각 \\(2!\\)번씩 중복되기 때문이에요."}},{"id":"c3","label":"홀수 셋과 짝수 한 종류를 세어요","stepIds":["s4"],"question":"이 경우는 왜 180가지일까요?","hint":"홀수는 모두 한 번씩 나오고, 고른 짝수만 두 번 나와요.","explanation":"홀수는 세 종류를 모두 고르므로 \\({}_{3}\\mathrm{C}_{3}=1\\)가지, 짝수는 \\({}_{3}\\mathrm{C}_{1}=3\\)가지예요. 횟수가 \\(1,1,1,2\\)이므로 배열은 \\(\\dfrac{5!}{2!}=60\\)가지예요. 따라서 \\({}_{3}\\mathrm{C}_{3}\\times{}_{3}\\mathrm{C}_{1}\\times\\dfrac{5!}{2!}=180\\)가지예요.","check":{"prompt":"왜 이번에는 \\(2!\\) 하나만 나누나요?","answer":"반복되는 숫자는 두 번 쓰는 짝수 한 종류뿐이고, 세 홀수는 서로 다르기 때문이에요."}},{"id":"c4","label":"두 경우를 더해 답을 확인해요","stepIds":["s5","s6"],"question":"센 배열이 모두 다섯 자리 자연수이고 서로 겹치지 않을까요?","hint":"맨 앞자리에 올 수 없는 숫자가 있는지와 두 경우의 홀수 개수를 봐요.","explanation":"사용하는 숫자는 1부터 6까지라서 어느 숫자가 맨 앞에 와도 다섯 자리 자연수예요. 첫째 경우는 홀수가 한 개, 둘째 경우는 홀수가 세 개여서 서로 겹치지 않아요. 따라서 \\(270+180=450\\)이에요.","check":{"prompt":"선택 대상에 0이 있었다면 무엇을 더 확인해야 하나요?","answer":"0이 맨 앞에 놓인 배열은 다섯 자리 자연수가 아니므로 빼야 해요. 이 문제에는 0이 없어 추가 제외가 없어요."}}],"takeaway":["종류마다 차지하는 자리 수가 다르면 먼저 자리 수 식으로 가능한 경우를 좁혀요.","숫자 종류를 고르는 수와 배열하는 수를 나누어 계산해요.","반복 횟수만큼 계승으로 나누고 맨 앞자리 제한도 확인해요."]};</script>
