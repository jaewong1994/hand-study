n(가) $\\left| {\\vec{ DP }} \\right| = \\left| {\\vec{ EQ }} \\right| = \\left| {\\vec{ FR }} \\right| =1$(나) ${\\vec{ AX }} = {\\vec{ PB }} + {\\vec{ QC }} + {\\vec{ RA }}$\n$|{\\overrightarrow{AX}}|$의 값이 최대일 때, 삼각형 ${{PQR}}$의 넓이를 $S$라 하자. $16 S^{2}$의 값을 구하시오. [4점]","sourceHash":"7ab19126cce055e31a1919aaff754ef191ce0f94a608b028a8f73dfc9ff734b2","sourceKind":"csat","sourceLabel":"2023년 시행 수능 · 2024학년도 · 기하 · 30번","steps":[{"id":"s1","latex":"\\overrightarrow{AX}=\\overrightarrow{PB}+\\overrightarrow{QC}+\\overrightarrow{RA}"},{"id":"s2","latex":"=-(\\overrightarrow{DP}+\\overrightarrow{EQ}+\\overrightarrow{FR})+(\\overrightarrow{DB}+\\overrightarrow{EC}+\\overrightarrow{FA})"},{"id":"s3","latex":"\\overrightarrow{DB}+\\overrightarrow{EC}+\\overrightarrow{FA}=\\frac34(\\overrightarrow{AB}+\\overrightarrow{BC}+\\overrightarrow{CA})=\\vec0"},{"id":"s4","latex":"\\therefore\\ \\overrightarrow{AX}=-(\\overrightarrow{DP}+\\overrightarrow{EQ}+\\overrightarrow{FR})"},{"id":"s5","latex":"|\\overrightarrow{DP}|=|\\overrightarrow{EQ}|=|\\overrightarrow{FR}|=1\\text{이므로 }|\\overrightarrow{AX}|\\le3"},{"id":"s6","latex":"\\text{등호는 세 벡터의 방향이 같을 때 성립하며, 이때 }\\triangle PQR\\text{는 }\\triangle DEF\\text{의 평행이동이다.}"},{"id":"s7","latex":"DE^{2}=3^{2}+1^{2}-2\\cdot3\\cdot1\\cos\\frac\\pi3=7"},{"id":"s8","latex":"D,E,F\\text{는 }120^\\circ\\text{ 회전에 대응하므로 }\\triangle DEF\\text{는 한 변 }\\sqrt7\\text{인 정삼각형이다.}"},{"id":"s9","latex":"S=\\frac{\\sqrt3}{4}\\cdot7\\Rightarrow16S^{2}=16\\cdot\\frac{147}{16}=147"},{"id":"s10","latex":"\\therefore\\ \\boxed{147}"}],"track":"기하"};</script>
