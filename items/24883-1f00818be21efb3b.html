<script>window.HandStudyRecord={"adminYear":2023,"answer":"147","contentHash":"2637edaa538634725ec04423e175028d0535ab817279d12bf5354a6bd2dfcbc6","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24883,"month":11,"number":30,"points":4,"preview":false,"questionHtml":"\u003cp>좌표평면에 한 변의 길이가 \u003cspan class=\"heq\">\\(4\\)\u003c/span>인 정삼각형 \u003cspan class=\"heq\">\\({{ABC}}\\)\u003c/span>가 있다. 선분 \u003cspan class=\"heq\">\\({{AB}}\\)\u003c/span>를 \u003cspan class=\"heq\">\\(1: 3\\)\u003c/span>으로 내분하는 점을 \u003cspan class=\"heq\">\\({{D}}\\)\u003c/span>, 선분 \u003cspan class=\"heq\">\\({{BC}}\\)\u003c/span>를 \u003cspan class=\"heq\">\\(1: 3\\)\u003c/span>으로 내분하는 점을 \u003cspan class=\"heq\">\\({{E}}\\)\u003c/span>, 선분 \u003cspan class=\"heq\">\\({{CA}}\\)\u003c/span>를 \u003cspan class=\"heq\">\\(1: 3\\)\u003c/span>으로 내분하는 점을 \u003cspan class=\"heq\">\\({{F}}\\)\u003c/span>라 하자. 네 점 \u003cspan class=\"heq\">\\({{P}}\\)\u003c/span>, \u003cspan class=\"heq\">\\({{Q}}\\)\u003c/span>, \u003cspan class=\"heq\">\\({{R}}\\)\u003c/span>, \u003cspan class=\"heq\">\\({{X}}\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox hcond\">\u003cp class=\"hcondr\">(가) \u003cspan class=\"heq\">\\(\\left| {\\vec{ DP }} \\right| = \\left| {\\vec{ EQ }} \\right| = \\left| {\\vec{ FR }} \\right| =1\\)\u003c/span>\u003c/p>\u003cp class=\"hcondr\">(나) \u003cspan class=\"heq\">\\({\\vec{ AX }} = {\\vec{ PB }} + {\\vec{ QC }} + {\\vec{ RA }}\\)\u003c/span>\u003c/p>\u003c/div>\u003cp>\u003cspan class=\"heq\">\\(|{\\overrightarrow{AX}}|\\)\u003c/span>의 값이 최대일 때, 삼각형 \u003cspan class=\"heq\">\\({{PQR}}\\)\u003c/span>의 넓이를 \u003cspan class=\"heq\">\\(S\\)\u003c/span>라 하자. \u003cspan class=\"heq\">\\(16 S^{2}\\)\u003c/span>의 값을 구하시오. [4점]\u003c/p>","questionText":"좌표평면에 한 변의 길이가 $4$인 정삼각형 ${{ABC}}$가 있다. 선분 ${{AB}}$를 $1: 3$으로 내분하는 점을 ${{D}}$, 선분 ${{BC}}$를 $1: 3$으로 내분하는 점을 ${{E}}$, 선분 ${{CA}}$를 $1: 3$으로 내분하는 점을 ${{F}}$라 하자. 네 점 ${{P}}$, ${{Q}}$, ${{R}}$, ${{X}}$가 다음 조건을 만족시킨다.\n(가) $\\left| {\\vec{ DP }} \\right| = \\left| {\\vec{ EQ }} \\right| = \\left| {\\vec{ FR }} \\right| =1$(나) ${\\vec{ AX }} = {\\vec{ PB }} + {\\vec{ QC }} + {\\vec{ RA }}$\n$|{\\overrightarrow{AX}}|$의 값이 최대일 때, 삼각형 ${{PQR}}$의 넓이를 $S$라 하자. $16 S^{2}$의 값을 구하시오. [4점]","sourceHash":"7ab19126cce055e31a1919aaff754ef191ce0f94a608b028a8f73dfc9ff734b2","sourceKind":"csat","sourceLabel":"2023년 시행 수능 · 2024학년도 · 기하 · 30번","steps":[{"id":"s1","latex":"\\overrightarrow{AX}=\\overrightarrow{PB}+\\overrightarrow{QC}+\\overrightarrow{RA}"},{"id":"s2","latex":"=-(\\overrightarrow{DP}+\\overrightarrow{EQ}+\\overrightarrow{FR})+(\\overrightarrow{DB}+\\overrightarrow{EC}+\\overrightarrow{FA})"},{"id":"s3","latex":"\\overrightarrow{DB}+\\overrightarrow{EC}+\\overrightarrow{FA}=\\frac34(\\overrightarrow{AB}+\\overrightarrow{BC}+\\overrightarrow{CA})=\\vec0"},{"id":"s4","latex":"\\therefore\\ \\overrightarrow{AX}=-(\\overrightarrow{DP}+\\overrightarrow{EQ}+\\overrightarrow{FR})"},{"id":"s5","latex":"|\\overrightarrow{DP}|=|\\overrightarrow{EQ}|=|\\overrightarrow{FR}|=1\\text{이므로 }|\\overrightarrow{AX}|\\le3"},{"id":"s6","latex":"\\text{등호는 세 벡터의 방향이 같을 때 성립하며, 이때 }\\triangle PQR\\text{는 }\\triangle DEF\\text{의 평행이동이다.}"},{"id":"s7","latex":"DE^{2}=3^{2}+1^{2}-2\\cdot3\\cdot1\\cos\\frac\\pi3=7"},{"id":"s8","latex":"D,E,F\\text{는 }120^\\circ\\text{ 회전에 대응하므로 }\\triangle DEF\\text{는 한 변 }\\sqrt7\\text{인 정삼각형이다.}"},{"id":"s9","latex":"S=\\frac{\\sqrt3}{4}\\cdot7\\Rightarrow16S^{2}=16\\cdot\\frac{147}{16}=147"},{"id":"s10","latex":"\\therefore\\ \\boxed{147}"}],"track":"기하"};</script>
<script>window.HandStudyGuide={"itemId":24883,"sourceHash":"7ab19126cce055e31a1919aaff754ef191ce0f94a608b028a8f73dfc9ff734b2","contentHash":"2637edaa538634725ec04423e175028d0535ab817279d12bf5354a6bd2dfcbc6","overview":{"goal":"세 이동벡터의 합이 최대가 되는 방향을 찾고, 그때 생기는 삼각형이 고정된 삼각형의 평행이동임을 이용해 넓이를 구해요.","firstLook":"점 \\(P,Q,R\\)를 직접 정하려 하지 말고 \\(\\overrightarrow{PB},\\overrightarrow{QC},\\overrightarrow{RA}\\)를 내분점에서 시작하는 벡터와 고정벡터로 나누어요.","conditions":[{"label":"내분점","meaning":"\\(AD:DB=BE:EC=CF:FA=1:3\\)이므로 \\(DB,EC,FA\\)는 각각 원래 변 길이의 \\(3/4\\)예요."},{"label":"움직이는 벡터","meaning":"\\(|\\overrightarrow{DP}|=|\\overrightarrow{EQ}|=|\\overrightarrow{FR}|=1\\)이에요."},{"label":"최대 조건","meaning":"길이가 1인 세 벡터의 합의 크기가 최대가 되는 등호 조건까지 사용해야 해요."}]},"chapters":[{"id":"c1","label":"고정벡터의 합을 지워요","stepIds":["s1","s2","s3","s4"],"question":"\\(\\overrightarrow{AX}\\)를 왜 세 단위벡터의 합으로 바꿀 수 있을까요?","hint":"\\(\\overrightarrow{PB}=-\\overrightarrow{DP}+\\overrightarrow{DB}\\)처럼 각각 나누어요.","explanation":"\\(\\overrightarrow{PB}=-\\overrightarrow{DP}+\\overrightarrow{DB}\\), \\(\\overrightarrow{QC}=-\\overrightarrow{EQ}+\\overrightarrow{EC}\\), \\(\\overrightarrow{RA}=-\\overrightarrow{FR}+\\overrightarrow{FA}\\)예요. 이를 더하면 움직이는 부분과 고정된 부분이 분리돼요.\n\n내분비 때문에 \\(\\overrightarrow{DB}=\\frac34\\overrightarrow{AB}\\), \\(\\overrightarrow{EC}=\\frac34\\overrightarrow{BC}\\), \\(\\overrightarrow{FA}=\\frac34\\overrightarrow{CA}\\)이고, 삼각형을 한 바퀴 도는 벡터의 합 \\(\\overrightarrow{AB}+\\overrightarrow{BC}+\\overrightarrow{CA}\\)는 영벡터예요. 따라서 고정된 세 벡터의 합은 사라지고 \\(\\overrightarrow{AX}=-(\\overrightarrow{DP}+\\overrightarrow{EQ}+\\overrightarrow{FR})\\)만 남아요.","check":{"prompt":"고정벡터의 합이 0이 되는 데 정삼각형 조건이 꼭 필요한가요?","answer":"아니요. \\(\\overrightarrow{AB}+\\overrightarrow{BC}+\\overrightarrow{CA}=\\vec0\\)은 어떤 삼각형에서도 성립해요."}},{"id":"c2","label":"합의 길이가 최대인 등호 조건을 찾아요","stepIds":["s5","s6"],"question":"세 벡터의 길이가 모두 \\(1\\)일 때 합의 길이 \\(3\\)은 언제 만들어질까요?","hint":"삼각부등식에서 두 번 모두 등호가 되는 방향을 생각해요.","explanation":"삼각부등식으로 \\(|\\overrightarrow{AX}|\\le|\\overrightarrow{DP}|+|\\overrightarrow{EQ}|+|\\overrightarrow{FR}|=3\\)이에요. 등호가 되려면 세 벡터가 모두 같은 방향을 향해야 해요.\n\n이때 어떤 한 벡터를 \\(\\vec v\\)라 하면 \\(P=D+\\vec v\\), \\(Q=E+\\vec v\\), \\(R=F+\\vec v\\)예요. 세 점을 모두 같은 벡터만큼 옮겼으므로 삼각형 \\(PQR\\)는 삼각형 \\(DEF\\)의 평행이동이고 넓이가 같아요.","check":{"prompt":"세 벡터의 길이만 같고 방향이 다르면 합의 길이가 3이 될 수 있나요?","answer":"방향이 하나라도 다르면 삼각부등식의 등호가 성립하지 않아 합의 길이가 3보다 작아요."}},{"id":"c3","label":"내분점으로 만든 정삼각형의 변을 구해요","stepIds":["s7","s8"],"question":"선분 \\(DE\\)의 길이는 왜 \\(\\sqrt7\\)일까요?","hint":"삼각형 \\(DBE\\)에서 \\(DB=3\\), \\(BE=1\\), 끼인각이 \\(60^\\circ\\)임을 써요.","explanation":"원래 정삼각형의 한 변이 \\(4\\)이므로 \\(DB=3\\), \\(BE=1\\)이고 \\(\\angle DBE=60^\\circ\\)예요. 코사인법칙으로 \\(DE^2=3^2+1^2-2\\cdot3\\cdot1\\cdot\\cos60^\\circ=10-3=7\\)이에요.\n\n정삼각형을 중심 둘레로 \\(120^\\circ\\) 회전하면 \\(D,E,F\\)가 차례로 대응하므로 \\(DE=EF=FD=\\sqrt7\\)이에요. 따라서 삼각형 \\(DEF\\), 곧 삼각형 \\(PQR\\)는 한 변이 \\(\\sqrt7\\)인 정삼각형이에요.","check":{"prompt":"코사인법칙의 마지막 항 \\(2\\cdot3\\cdot1\\cdot\\cos60^\\circ\\)의 값은 얼마인가요?","answer":"\\(\\cos60^\\circ=1/2\\)이므로 값은 \\(3\\)이에요."}},{"id":"c4","label":"넓이를 구해 요구한 값을 계산해요","stepIds":["s9","s10"],"question":"한 변이 \\(\\sqrt7\\)인 정삼각형의 넓이에서 \\(16S^2\\)는 얼마인가요?","hint":"정삼각형 넓이 \\(\\frac{\\sqrt3}{4}a^2\\)를 사용해요.","explanation":"한 변의 제곱이 \\(7\\)이므로 \\(S=\\frac{\\sqrt3}{4}\\cdot7=\\frac{7\\sqrt3}{4}\\)예요. 따라서 \\(16S^2=16\\cdot\\frac{49\\cdot3}{16}=147\\)이에요.","check":{"prompt":"\\(S^2\\)을 계산하면 얼마인가요?","answer":"\\((7\\sqrt3/4)^2=147/16\\)이에요."}}],"takeaway":["벡터의 합은 움직이는 부분과 고정된 부분으로 나누면 구조가 단순해져요.","삼각부등식으로 최댓값을 구할 때는 등호가 성립하는 방향까지 확인해 점들의 관계를 정해요.","세 점을 같은 벡터만큼 옮기면 삼각형의 모양과 넓이는 그대로예요."]};</script>
