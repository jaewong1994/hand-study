<script>window.HandStudyRecord={"itemId":17073,"sourceLabel":"2021 교육청 고3 수학기하 7월 29번","adminYear":2021,"grade":3,"month":7,"number":29,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이\n ${\\overline{ AB}}$$=4$, ${\\overline{ CD}}$$=8$, ${\\overline{ BC}}$$= {\\overline{ BD}}$$=4 \\sqrt{5}$\n인 사면체 $A B C D$에 대하여 직선 $A B$와 평면 $A C D$는 서로 수직이다. 두 선분 $C D$, $D B$의 중점을 각각 $M,\\,N$이라 할 때, 선분 $A M$ 위의 점 $P$에 대하여 선분 $D B$와 선분 $P N$은 서로 수직이다. 두 평면 $P D B$와 $C D B$가 이루는 예각의 크기를 $\\theta$라 할 때, $40\\,\\cos ^{2} \\, \\theta$의 값을 구하시오. [4점]\n$B$$A$$C$$D$$M$$N$$P$","answer":"25","sourceHash":"5fdeb084b94b76c33a029a2a565fbbd3ad86f591fcd95c1edb5445539ed01918","steps":[{"id":"s1","latex":"A=(0,0,0),\\quad C=(4\\sqrt3,-4,0),\\quad D=(4\\sqrt3,4,0),\\quad B=(0,0,4)"},{"id":"s2","latex":"M=(4\\sqrt3,0,0),\\quad N=\\frac{D+B}{2}=(2\\sqrt3,2,2)"},{"id":"s3","latex":"P\\in AM\\Rightarrow P=(t,0,0)"},{"id":"s4","latex":"N\\text{은 }DB\\text{의 중점이고 }PN\\perp DB\\Rightarrow PD=PB\\Rightarrow(t-4\\sqrt3)^2+16=t^2+16\\Rightarrow t=2\\sqrt3"},{"id":"s5","latex":"P=(2\\sqrt3,0,0)"},{"id":"s6","latex":"BH=\\frac{BC^2+BD^2-CD^2}{2BD}=\\frac{12}{\\sqrt5},\\quad BH:HD=3:2\\Rightarrow H=\\left(\\frac{12\\sqrt3}{5},\\frac{12}{5},\\frac85\\right)"},{"id":"s7","latex":"H\\text{에서 }C\\text{로 가는 좌표 차 }\\left(\\frac{8\\sqrt3}{5},-\\frac{32}{5},-\\frac85\\right)\\text{를 }N\\text{의 각 좌표에 더해 }K=\\left(\\frac{18\\sqrt3}{5},-\\frac{22}{5},\\frac25\\right)\\text{로 두면 }PN^2=8,\\ NK^2=\\frac{256}{5},\\ PK^2=\\frac{136}{5}"},{"id":"s8","latex":"PN\\perp DB,\\ CH\\perp DB,\\ NK\\parallel CH\\Rightarrow\\cos\\angle PNK=\\frac{PN^2+NK^2-PK^2}{2PN\\cdot NK}=\\frac{\\sqrt{10}}4>0\\Rightarrow\\angle PNK=\\theta"},{"id":"s9","latex":"40\\cos^2\\theta=25"}],"diagram":null,"contentHash":"fc10ed26aab55867c94ab928c4f3f86d027e25b47667a53af3e2c9bb14b20ad0","questionHtml":"<p class=\"hp\">그림과 같이<\/p><p class=\"hp htall\">&emsp;<span class=\"heq\">\\({\\overline{AB}}\\)<\/span><span class=\"heq\"> <script>window.HandStudyGuide={"itemId":17073,"sourceHash":"5fdeb084b94b76c33a029a2a565fbbd3ad86f591fcd95c1edb5445539ed01918","contentHash":"fc10ed26aab55867c94ab928c4f3f86d027e25b47667a53af3e2c9bb14b20ad0","overview":{"goal":"공간좌표로 점의 위치를 정하되, 중점과 수직 조건은 길이와 평면 단면으로 해석해 두 평면의 각을 구해요.","firstLook":"두 평면은 공통 직선 \\(DB\\)를 가져요. 각 평면 안에서 \\(DB\\)에 수직인 선 \\(PN\\), \\(CH\\)를 잡으면 두 평면의 각은 이 두 선이 이루는 각이에요.","conditions":[{"label":"수직 배치","meaning":"\\(AB\\perp\\)평면 \\(ACD\\)이므로 밑면을 \\(z=0\\), \\(B\\)를 \\(z\\)축 위에 둘 수 있어요."},{"label":"이루는 각","meaning":"공통선 \\(DB\\)에 각각 수직인 두 평면 안의 선 사이 예각을 구해요."}]},"chapters":[{"id":"c1","label":"길이에 맞게 좌표를 놓아요","stepIds":["s1","s2","s3"],"question":"주어진 모든 길이를 만족하도록 네 꼭짓점을 어떻게 둘까요?","hint":"\\(CD=8\\)인 밑면을 \\(y\\)방향으로 대칭 배치하고 \\(AB=4\\)를 \\(z\\)축으로 둬요.","explanation":"\\(A=(0,0,0),B=(0,0,4)\\)로 두고 밑면을 \\(z=0\\)에 놓아요. \\(C=(4\\sqrt3,-4,0),D=(4\\sqrt3,4,0)\\)로 두면 \\(CD=8\\)이고 \\(BC^2=BD^2=48+16+16=80\\)이어서 \\(BC=BD=4\\sqrt5\\)예요. 모든 원래 길이와 수직 조건이 맞아요.\n\n중점은 \\(M=(4\\sqrt3,0,0)\\), \\(N=(2\\sqrt3,2,2)\\)예요. \\(P\\)는 선분 \\(AM\\) 위이므로 \\(P=(t,0,0)\\), \\(0\\le t\\le4\\sqrt3\\)로 둘 수 있어요.","check":{"prompt":"정한 좌표에서 \\(BC=4\\sqrt5\\)를 어떻게 확인하나요?","answer":"\\(BC^2=(4\\sqrt3)^2+(-4)^2+(0-4)^2=48+16+16=80\\)이므로 \\(BC=4\\sqrt5\\)예요."}},{"id":"c2","label":"중점의 수직 조건을 거리로 바꿔요","stepIds":["s4","s5","s6"],"question":"\\(PN\\perp DB\\)는 왜 \\(PD=PB\\)와 같고, 여기서 \\(P\\)는 어디일까요?","hint":"\\(N\\)은 \\(DB\\)의 중점이므로 \\(PN\\)은 선분 \\(DB\\)의 수직이등분선 역할을 해요.","explanation":"\\(N\\)은 \\(DB\\)의 중점이고 \\(PN\\perp DB\\)이므로 직각삼각형 \\(PND\\), \\(PNB\\)에서 \\(PN\\)은 공통이고 \\(ND=NB\\)예요. 따라서 \\(PD=PB\\)예요. 좌표의 거리 제곱을 비교하면 \\((t-4\\sqrt3)^2+4^2=t^2+4^2\\)이고, 이를 풀면 \\(t=2\\sqrt3\\)이에요. 이 값은 선분의 범위 안이므로 \\(P=(2\\sqrt3,0,0)\\)예요.\n\n이제 \\(C\\)에서 \\(DB\\)에 내린 수선의 발을 \\(H\\)라 해요. 삼각형 \\(BCD\\)에서 \\(BH=(BC^2+BD^2-CD^2)/(2BD)=12/\\sqrt5\\)이고 \\(BD=4\\sqrt5\\)이므로 \\(BH:HD=3:2\\)예요. 즉 \\(H\\)는 \\(B=(0,0,4)\\)에서 \\(D=(4\\sqrt3,4,0)\\) 쪽으로 \\(DB\\)의 \\(3/5\\)만큼 간 점이에요. 따라서 \\(x_H=0+(3/5)(4\\sqrt3)=12\\sqrt3/5\\), \\(y_H=0+(3/5)4=12/5\\), \\(z_H=4+(3/5)(0-4)=8/5\\)이고, \\(H=(12\\sqrt3/5,12/5,8/5)\\)예요.","check":{"prompt":"\\(t=2\\sqrt3\\)이 단지 직선 \\(AM\\) 위가 아니라 선분 위라는 것은 어떻게 확인하나요?","answer":"\\(0<2\\sqrt3<4\\sqrt3\\)이므로 A와 M 사이에 있어요."}},{"id":"c3","label":"수직 단면에서 평면의 각을 재요","stepIds":["s7","s8","s9"],"question":"두 평면의 각을 평면삼각형의 코사인으로 어떻게 구할까요?","hint":"\\(CH\\)와 평행하고 길이가 같은 선분 \\(NK\\)를 \\(N\\)에서 그어 \\(PNK\\)를 만들어요.","explanation":"\\(PN\\)은 평면 \\(PDB\\) 안에서 \\(DB\\)에 수직이고, \\(CH\\)는 평면 \\(CDB\\) 안에서 \\(DB\\)에 수직이에요. 따라서 두 평면의 예각 \\(\\theta\\)는 두 직선 \\(PN\\), \\(CH\\)가 이루는 예각이에요. \\(N\\)에서 \\(CH\\)와 같은 방향이고 길이가 같은 선분 \\(NK\\)를 그어 한 평면의 삼각형을 만들어요.\n\n\\(H\\)에서 \\(C\\)로 갈 때 세 좌표의 차는 \\((8\\sqrt3/5,-32/5,-8/5)\\)예요. 이를 \\(N=(2\\sqrt3,2,2)\\)의 각 좌표에 더하면 \\(K=(18\\sqrt3/5,-22/5,2/5)\\)예요. 거리 제곱을 직접 계산하면 \\(PN^2=0^2+(-2)^2+(-2)^2=8\\), \\(NK^2=(8\\sqrt3/5)^2+(-32/5)^2+(-8/5)^2=256/5\\), \\(PK^2=(8\\sqrt3/5)^2+(-22/5)^2+(2/5)^2=136/5\\)예요.\n\n평면삼각형 \\(PNK\\)에 코사인법칙을 쓰면 \\(\\cos\\angle PNK=(8+256/5-136/5)/(2\\cdot2\\sqrt2\\cdot16/\\sqrt5)=\\sqrt{10}/4\\)예요. 이 값이 양수이므로 \\(\\angle PNK\\)는 예각이고, 바로 두 평면이 이루는 예각 \\(\\theta\\)예요. 따라서 \\(40\\cos^2\\theta=40\\times10/16=25\\)예요.","check":{"prompt":"\\(PN\\)과 \\(CH\\)를 그대로 한 꼭짓점의 각으로 보지 않고 평행이동하는 이유는 무엇인가요?","answer":"두 선은 서로 다른 점을 지나므로, 방향을 보존한 평행선 \\(NK\\)를 같은 점 N에서 그어 실제 평면삼각형의 각으로 만들어야 해요."}}],"takeaway":["공간좌표를 정한 뒤에도 중점에서의 수직은 수직이등분선과 같은 평면기하 성질로 바꿀 수 있어요.","두 평면의 각은 공통선에 각각 수직인 두 선의 각으로 구해요.","서로 다른 곳의 두 선이 이루는 각은 한 선을 평행이동해 같은 꼭짓점에서 만나는 평면삼각형으로 확인할 수 있어요."]};</script>
