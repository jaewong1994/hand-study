  <script>window.HandStudyRecord={"itemId":16595,"sourceLabel":"2019 평가원 고3 수리나형 9월 18번","adminYear":2019,"grade":3,"month":9,"number":18,"track":"수리나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 중심이 ${O}$, 반지름의 길이가 $2$이고 중심각의 크기가 $90°$인 부채꼴 ${O A B}$가있다. 선분 ${O A}$의 중점을 ${C },\\,$선분 ${O B}$의 중점을 ${D}$라 하자. 점 ${C }$를 지나고 선분 ${O B}$와 평행한 직선이 호 ${A B}$와 만나는 점을 ${E}$, 점 ${D}$를 지나고 선분 ${O A}$와 평행한 직선이 호 ${A B}$와 만나는 점을 ${F }$라 하자. 선분 ${C E}$와 선분 ${D F}$가 만나는 점을 ${G}$, 선분 ${O E}$와 선분 ${D G}$가 만나는 점을 ${H}$, 선분 ${O F}$와 선분 ${C G}$가 만나는 점을 ${I }$라 하자. 사각형 ${O I G H}$를 색칠하여 얻은 그림을 $R_{1 }$이라 하자. 그림 $R_{1 }$에 중심이 ${C }$, 반지름의 길이가 $\\overline{{C I}}$, 중심각의 크기가 $90°$인 부채꼴 ${C J I}$와 중심이 ${D}$, 반지름의 길이가 $\\overline{{D H}}$, 중심각의 크기가 $90°$인 부채꼴 ${D H K}$를 그린다. 두 부채꼴 ${C J I}$, ${D H K}$에 그림 $R_{1 }$을 얻는 것과 같은 방법으로 두 개의 사각형을 그리고 색칠하여 얻은 그림을 $R_{2 }$라 하자. 이와 같은 과정을 계속하여 $n$번째 얻은 그림 $R_{n }$에 색칠되어 있는 부분의 넓이를 $S _{n }$이라 할 때, $\\lim _{n \\,->\\, \\infty }\\,S _{n }$의 값은? [4점]\n① $\\frac{2(3 - \\sqrt{3} )}{5}$ ② $\\frac{7(3 - \\sqrt{3} )}{15}$ ③ $\\frac{8(3 - \\sqrt{3} )}{15}$\n④ $\\frac{3(3 - \\sqrt{3} )}{5}$ ⑤ $\\frac{2(3 - \\sqrt{3} )}{3}$","answer":"①","sourceHash":"7bae25724ac2354c4b71fba6ecb25e315ebc6e05fc4131b8c60568722ebb10e8","steps":[{"id":"s1","latex":"A_n=S_n-S_{n-1}\\ (S_0=0):\\quad n\\text{번째에 새로 색칠한 넓이}"},{"id":"s2","latex":"O=(0,0),\\ A=(2,0),\\ B=(0,2),\\ C=(1,0),\\ D=(0,1)"},{"id":"s3","latex":"E=(1,\\sqrt3),\\quad F=(\\sqrt3,1),\\quad G=(1,1)"},{"id":"s4","latex":"H=OE\\cap DG=\\left(\\frac1{\\sqrt3},1\\right),\\quad I=OF\\cap CG=\\left(1,\\frac1{\\sqrt3}\\right)"},{"id":"s5","latex":"A_1=[OIGH]=1-\\frac1{\\sqrt3}=\\frac{3-\\sqrt3}{3}"},{"id":"s6","latex":"CI=DH=\\frac1{\\sqrt3},\\quad\\text{길이비}=\\frac{1/\\sqrt3}{2}=\\frac1{2\\sqrt3}"},{"id":"s7","latex":"\\frac{A_{n+1}}{A_n}=2\\left(\\frac1{2\\sqrt3}\\right)^2=\\frac16"},{"id":"s8","latex":"\\lim_{n\\to\\infty}S_n=\\frac{A_1}{1-1/6}=\\boxed{\\frac{2(3-\\sqrt3)}5}"}],"diagram":null,"contentHash":"e2fd785270218d1e64ad5d2cc230e1ac452725bf926f037363ed0baf17ab1c93","questionHtml":"\u003cp class=\"hp htall\">그림과 같이 중심이 \u003cspan class=\"heq\">\\({O}\\)\u003c/span>, 반지름의 길이가 \u003cspan class=\"heq\">\\(2\\)\u003c/span>이고 중심각의 크기가 \u003cspan class=\"heq\">\\(90^{\\circ}\\)\u003c/span>인 부채꼴 \u003cspan class=\"heq\">\\({O A B}\\)\u003c/span>가있다. 선분 \u003cspan class=\"heq\">\\({O A}\\)\u003c/span>의 중점을 \u003cspan class=\"heq\">\\({C },\\,\\)\u003c/span>선분 \u003cspan class=\"heq\">\\({O B}\\)\u003c/span>의 중점을 \u003cspan class=\"heq\">\\({D}\\)\u003c/span>라 하자. 점 \u003cspan class=\"heq\">\\({C }\\)\u003c/span>를 지나고 선분 \u003cspan class=\"heq\">\\({O B}\\)\u003c/span>와 평행한 직선이 호 \u003cspan class=\"heq\">\\({A B}\\)\u003c/span>와 만나는 점을 \u003cspan class=\"heq\">\\({E}\\)\u003c/span>, 점 \u003cspan class=\"heq\">\\({D}\\)\u003c/span>를 지나고 선분 \u003cspan class=\"heq\">\\({O A}\\)\u003c/span>와 평행한 직선이 호 \u003cspan class=\"heq\">\\({A B}\\)\u003c/span>와 만나는 점을 \u003cspan class=\"heq\">\\({F }\\)\u003c/span>라 하자.\u003cbr>선분 \u003cspan class=\"heq\">\\({C E}\\)\u003c/span>와 선분 \u003cspan class=\"heq\">\\({D F}\\)\u003c/span>가 만나는 점을 \u003cspan class=\"heq\">\\({G}\\)\u003c/span>, 선분 \u003cspan class=\"heq\">\\({O E}\\)\u003c/span>와 선분 \u003cspan class=\"heq\">\\({D G}\\)\u003c/span>가 만나는 점을 \u003cspan class=\"heq\">\\({H}\\)\u003c/span>, 선분 \u003cspan class=\"heq\">\\({O F}\\)\u003c/span>와 선분 \u003cspan class=\"heq\">\\({C G}\\)\u003c/span>가 만나는 점을 \u003cspan class=\"heq\">\\({I }\\)\u003c/span>라 하자. 사각형 \u003cspan class=\"heq\">\\({O I G H}\\)\u003c/span>를 색칠하여 얻은 그림을 \u003cspan class=\"heq\">\\(R_{1 }\\)\u003c/span>이라 하자.\u003cbr>그림 \u003cspan class=\"heq\">\\(R_{1 }\\)\u003c/span>에 중심이 \u003cspan class=\"heq\">\\({C }\\)\u003c/span>, 반지름의 길이가 \u003cspan class=\"heq\">\\(\\overline{{C I}}\\)\u003c/span>, 중심각의 크기가 \u003cspan class=\"heq\">\\(90^{\\circ}\\)\u003c/span>인 부채꼴 \u003cspan class=\"heq\">\\({C J I}\\)\u003c/span>와 중심이 \u003cspan class=\"heq\">\\({D}\\)\u003c/span>, 반지름의 길이가 \u003cspan class=\"heq\">\\(\\overline{{D H}}\\)\u003c/span>, 중심각의 크기가 \u003cspan class=\"heq\">\\(90^{\\circ}\\)\u003c/span>인 부채꼴 \u003cspan class=\"heq\">\\({D H K}\\)\u003c/span>를 그린다. 두 부채꼴 \u003cspan class=\"heq\">\\({C J I}\\)\u003c/span>, \u003cspan class=\"heq\">\\({D H K}\\)\u003c/span>에 그림 \u003cspan class=\"heq\">\\(R_{1 }\\)\u003c/span>을 얻는 것과 같은 방법으로 두 개의 사각형을 그리고 색칠하여 얻은 그림을 \u003cspan class=\"heq\">\\(R_{2 }\\)\u003c/span>라 하자.\u003cbr>이와 같은 과정을 계속하여 \u003cspan class=\"heq\">\\(n\\)\u003c/span>번째 얻은 그림 \u003cspan class=\"heq\">\\(R_{n }\\)\u003c/span>에 색칠되어 있는 부분의 넓이를 \u003cspan class=\"heq\">\\(S_{n }\\)\u003c/span>이라 할 때, \u003cspan class=\"heq\">\\(\\lim\\limits_{n \\,\\to \\, \\infty }\\,S_{n }\\)\u003c/span>의 값은? \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp htall\">① \u003cspan class=\"heq\">\\(\\dfrac{2(3 - \\sqrt{3} )}{5}\\)\u003c/span>&emsp;② \u003cspan class=\"heq\">\\(\\dfrac{7(3 - \\sqrt{3} )}{15}\\)\u003c/span>&emsp;③ \u003cspan class=\"heq\">\\(\\dfrac{8(3 - \\sqrt{3} )}{15}\\)\u003c/span>\u003c/p>\u003cp class=\"hp htall\">④ \u003cspan class=\"heq\">\\(\\dfrac{3(3 - \\sqrt{3} )}{5}\\)\u003c/span>&emsp;⑤ \u003cspan class=\"heq\">\\(\\dfrac{2(3 - \\sqrt{3} )}{3}\\)\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/3eb75e802309b4f96229f1f6.png\" style=\"width:400px;max-width:100%\">\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"6f2a542a94c6a6e83b8d9eed6b8b85441bd67f76047fc0126b948db9e36d8deb"};</script>
