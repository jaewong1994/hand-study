<script>window.HandStudyGuide={"itemId":17620,"sourceHash":"e2e4425589dab19f3f1ec75930a99efad3dfa157fae7c9c5765836dd31b404b6","contentHash":"ebe38f9061283e4387350f9c22b799d0617cce5aa6ca05fe3678390fd9380af7","overview":{"goal":"포물선을 원점에서 바라볼 수 있는 방향 범위와 중심이 꼭짓점인 원의 교점을 비교해요.","firstLook":"점 \\(X\\)는 꼭짓점 \\(A\\)에서 \\(OP\\)와 같은 방향으로 거리 \\(k\\)만큼 간 점이에요.","conditions":[{"label":"방향 범위","meaning":"원점에서 포물선으로 향하는 직선의 기울기는 두 접선 사이에 있어요."},{"label":"서로 다른 두 교점","meaning":"위아래 대칭인 두 점이 모두 허용 방향 안에 있어야 해요."}]},"chapters":[{"id":"c1","label":"원점에서 가능한 방향의 경계를 구해요","stepIds":["s1"],"question":"포물선을 지나는 직선 방향의 최대 기울기는 얼마인가요?","hint":"원점을 지나는 직선 \\(y=tx\\)가 포물선에 접할 때를 구해요.","explanation":"\\(y=tx\\)를 \\(y^2=2x-2\\)에 넣으면 \\(t^2x^2-2x+2=0\\)이에요. 접할 때 판별식이 \\(0\\)이므로 \\(4-8t^2=0\\), 따라서 경계 기울기는 \\(t=\\pm1/\\sqrt2\\)예요. 원점에서 실제 포물선 위 점으로 향하는 방향은 이 두 접선 사이예요.","check":{"prompt":"접선일 때 이차방정식의 판별식은 얼마인가요?","answer":"\\(0\\)이에요."}},{"id":"c2","label":"점이 나타내는 원을 찾어요","stepIds":["s2","s3"],"question":"도형 \\(C\\)와 원래 포물선의 교점은 어떻게 나타내나요?","hint":"벡터식에서 \\(AX\\)의 길이를 보세요.","explanation":"\\(OX=OA+k(OP/|OP|)\\)이므로 \\(AX=k\\)이고, \\(C\\)는 중심 \\(A=(1,0)\\), 반지름 \\(k\\)인 원에서 허용 방향에 해당하는 부분이에요. 원래 포물선과의 교점에서 \\(s=x-1>0\\)라 하면 \\(y^2=2s\\), 원의 식은 \\(s^2+y^2=k^2\\)예요. 따라서 \\(s^2+2s=k^2\\)이고 \\(s=\\sqrt{1+k^2}-1\\)이에요.","check":{"prompt":"왜 \\(s\\)의 음의 해를 버리나요?","answer":"포물선에서 \\(x\\ge1\\)이고 서로 다른 두 점이면 \\(s=x-1>0\\)이기 때문이에요."}},{"id":"c3","label":"교점 방향이 허용되는 최소 반지름을 구해요","stepIds":["s4","s5"],"question":"두 교점이 도형 \\(C\\)에 포함되려면 어떤 조건이 필요한가요?","hint":"\\(AX\\) 방향의 기울기 \\(|y|/s\\)를 접선 경계와 비교해요.","explanation":"교점에서 \\(A\\)에서 본 방향의 기울기 크기는 \\(|y|/s=\\sqrt{2s}/s\\)예요. 이 방향이 원점에서 포물선으로 갈 수 있는 범위 안에 있으려면 \\(\\sqrt{2s}/s\\le1/\\sqrt2\\)이고, 양변을 제곱하면 \\(2/s\\le1/2\\), 즉 \\(s\\ge4\\)예요. \\(k^2=s^2+2s\\)이므로 최소는 \\(s=4\\)에서 \\(k^2=16+8=24\\)예요. 경계에서도 위아래 두 점이 서로 다르므로 \\(m^2=24\\)예요.","check":{"prompt":"최솟값에서 두 교점이 합쳐지지 않나요?","answer":"\\(s=4\\)이면 \\(y=\\pm2\\sqrt2\\)라 서로 다른 두 점이에요."}}],"takeaway":["벡터를 길이로 나눈 식은 방향만 남기므로 가능한 방향 범위를 먼저 구해요.","고정점에서 일정한 거리를 간 점들은 원을 이루어요.","최소 조건의 경계에서도 요구한 두 점이 실제로 서로 다른지 확인해요."]};</script>
