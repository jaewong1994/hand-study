<script>window.HandStudyGuide={"itemId":17302,"sourceHash":"6254376911a106af3ee4589cce98a2c7beaffe749a547dfacdf0a73a33525170","contentHash":"21016ad62069b77674fc575d369c4809e334bef1797cf3c08329c782393f74c3","overview":{"goal":"두 포물선을 대칭적인 좌표에 놓고 초점거리 차와 예각 조건으로 크기를 정해요.","firstLook":"공통 중점을 원점, \\(F_1F_2\\)를 \\(x\\)축으로 두면 네 점의 좌표가 두 문자 \\(f,h\\)로 정리돼요.","conditions":[{"label":"(가)","meaning":"점 \\(C\\)의 좌표와 \\(A_1C\\)의 길이로 꼭짓점과 초점 사이 거리 \\(h\\)를 정해요."},{"label":"(나)","meaning":"포물선의 초점거리와 준선까지 거리가 같다는 성질로 \\(B\\)의 \\(y\\)좌표를 정해요."}]},"chapters":[{"id":"c1","label":"대칭 좌표와 포물선 식을 세워요","stepIds":["s1","s2","s3"],"question":"점 \\(C\\)의 좌표가 왜 \\(2h-f\\)가 될까요?","hint":"\\(P_1\\)의 식에 \\(y=0\\)을 넣고 그림에서 선분 \\(F_1F_2\\) 위의 교점을 골라요.","explanation":"공통 중점을 원점으로 두고 \\(F_1=(-f,0),F_2=(f,0)\\), \\(A_1=(-f,h),A_2=(f,-h)\\)로 놓아요. 그림처럼 \\(P_1\\)은 아래로, \\(P_2\\)는 위로 열려 \\(P_1:(x+f)^2=-4h(y-h)\\), \\(P_2:(x-f)^2=4h(y+h)\\)예요. \\(y=0\\)에서 \\(P_1\\)의 교점은 \\(x=-f\\pm2h\\)이고 선분 쪽의 점은 \\(C=(2h-f,0)\\)예요. 따라서 \\(A_1C\\)의 가로·세로 차는 \\(2h,-h\\)라 길이는 \\(h\\sqrt5\\), 조건에서 \\(h=5\\)예요.","check":{"prompt":"\\(A_1C=h\\sqrt5\\)에서 사용한 두 좌표 차는 무엇인가요?","answer":"가로 차 \\(2h\\), 세로 차 \\(-h\\)이므로 피타고라스 정리로 \\(h\\sqrt5\\)예요."}},{"id":"c2","label":"교점의 높이와 두 후보를 구해요","stepIds":["s4","s5","s6"],"question":"초점거리의 차가 왜 \\(-2y_B\\)와 같을까요?","hint":"각 포물선에서 초점까지 거리와 준선까지의 거리를 같게 써요.","explanation":"두 포물선 식을 함께 풀면 교점은 \\(x^2=4h^2-f^2\\), \\(y=-fx/(2h)\\)를 만족해요. \\(P_1\\)의 준선은 \\(y=2h\\)이므로 \\(BF_1=2h-y_B\\), \\(P_2\\)의 준선은 \\(y=-2h\\)이므로 \\(BF_2=y_B+2h\\)예요. 따라서 \\(BF_1-BF_2=-2y_B=48/5\\), 곧 \\(y_B=-24/5\\)예요. \\(h=5\\)와 \\(y=-fx/10\\)에서 \\(fx_B=48\\), 또 \\(x_B^2=100-f^2\\)이므로 \\(f^2(100-f^2)=2304\\), \\(f^2=36\\) 또는 \\(64\\)예요.","check":{"prompt":"\\(f^2=36,64\\)를 얻은 뒤 각각의 \\(x_B\\)는 얼마인가요?","answer":"\\(fx_B=48\\)이므로 \\(f=6\\)일 때 \\(x_B=8\\), \\(f=8\\)일 때 \\(x_B=6\\)이에요."}},{"id":"c3","label":"예각 조건으로 후보를 고르고 넓이를 구해요","stepIds":["s7","s8","s9"],"question":"\\(\\angle F_1F_2B<90^\\circ\\)가 왜 \\(x_B<f\\)를 뜻할까요?","hint":"점 \\(F_2=(f,0)\\)에서 \\(F_1\\)로 향하는 선분은 왼쪽을 향해요.","explanation":"\\(F_2\\)에서 \\(F_1\\)로 향하는 방향이 왼쪽이므로 \\(F_2B\\)도 왼쪽 성분을 가져야 예각이고, 이는 \\(x_B<f\\)예요. \\(f=6\\)이면 \\(x_B=8>6\\)이라 제외되고, \\(f=8\\)이면 \\(x_B=6<8\\)이라 남아요. 따라서 밑변 \\(F_1F_2=16\\), 높이는 \\(|y_B|=24/5\\)이므로 \\(S=\\frac12\\cdot16\\cdot24/5=192/5\\), \\(10S=384\\)예요.","check":{"prompt":"제외된 \\(f=6\\) 후보가 예각 조건을 어기는 실제 좌표 비교는 무엇인가요?","answer":"그때 \\(x_B=48/6=8\\)이고 \\(x_{F_2}=6\\)이라 \\(B\\)가 \\(F_2\\)의 오른쪽에 있어 예각이 아니에요."}}],"takeaway":["대칭 조건이 있으면 공통 중점과 평행한 준선을 좌표축으로 잡아요.","포물선 위 점의 초점거리는 준선까지 거리로 바꾸면 거리 차가 좌표식이 돼요.","두 후보는 원문의 각 조건을 좌표 부등식으로 바꾸어 실제 수치로 걸러요."]};</script>
