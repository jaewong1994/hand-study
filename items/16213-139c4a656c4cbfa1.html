<script>window.HandStudyRecord={"itemId":16213,"sourceLabel":"2019 교육청 고3 수리가형 10월 21번","adminYear":2019,"grade":3,"month":10,"number":21,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"정수 $n\\,$에 대하여 점 $\\left( a,\\,0 \\right) \\,$에서 곡선 $y=(x-n)e ^{x} \\,$에 그은 접선의 개수를 $f(n)\\,$이라 하자. \u003c보기>에서 옳은 것만을 있는 대로 고른 것은? [4점]\n\u003c 보 기 >ㄱ. $a=0\\,$일 때, $f(4)=1\\,$이다.ㄴ. $f(n)=1$인 정수 $n\\,$의 개수가 $1\\,$인 정수 $a\\,$가 존재한다. ㄷ. $\\sum _{n=1} ^{5} f(n)=5\\,$를 만족시키는 정수 $a\\,$의 값은 $-1$ 또는 $3\\,$이다.\n① ㄱ ② ㄱ, ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ\n단답형","answer":"③","sourceHash":"c6193ec8ce9f4723df108c3bce5019c0b682e64257600ed6ec27aded17cd4fa2","steps":[{"id":"s1","latex":"\\text{접점 }t:\\quad (t-n)e^t=(t-a)(t-n+1)e^t"},{"id":"s2","latex":"u=t-n,\\ c=a-n\\Rightarrow u^2-cu-c=0"},{"id":"s3","latex":"D=c(c+4)\\Rightarrow f(n)=\\begin{cases}2&c>0\\text{ 또는 }c\u003c-4\\\\1&c=0\\text{ 또는 }c=-4\\\\0&-4\u003cc\u003c0\\end{cases}"},{"id":"s4","latex":"a=0,\\ n=4\\Rightarrow c=-4\\Rightarrow f(4)=1\\quad(\\mathrm I)"},{"id":"s5","latex":"f(n)=1\\Longleftrightarrow n=a\\text{ 또는 }n=a+4\\Rightarrow\\#=2\\quad(\\mathrm{II}\\text{ 거짓})"},{"id":"s6","latex":"\\sum_{n=1}^{5}f(n)=5\\Longleftrightarrow a\\in\\{-1,3\\}\\quad(\\mathrm{III})"},{"id":"s7","latex":"\\boxed{\\mathrm{I,III}}"}],"diagram":null,"contentHash":"1c3ad05490e2fbf2e4fc44062d5ba57c8763c39040d3b26faa68b38d6914f003","questionHtml":"\u003cp class=\"hp\">정수 \u003cspan class=\"heq\">\\(n\\,\\)\u003c/span>에 대하여 점 \u003cspan class=\"heq\">\\(\\left( a,\\,0 \\right) \\,\\)\u003c/span>에서 곡선 \u003cspan class=\"heq\">\\(y=(x-n)e^{x} \\,\\)\u003c/span>에 그은 접선의 개수를 \u003cspan class=\"heq\">\\(f(n)\\,\\)\u003c/span>이라 하자. &lt;보기&gt;에서 옳은 것만을 있는 대로 고른 것은? \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cdiv class=\"hbox\">\u003cdiv style=\"text-align:center;font-weight:700;margin:0 0 6px\">&lt; 보 기 &gt;\u003c/div>\u003cp class=\"hp\">ㄱ.\u003cspan class=\"heq\">\\(a=0\\,\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(f(4)=1\\,\\)\u003c/span>이다.\u003c/p>\u003cp class=\"hp\">ㄴ.\u003cspan class=\"heq\">\\(f(n)=1\\)\u003c/span>인 정수 \u003cspan class=\"heq\">\\(n\\,\\)\u003c/span>의 개수가 \u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>인 정수 \u003cspan class=\"heq\">\\(a\\,\\)\u003c/span>가 존재한다.\u003c/p>\u003cp class=\"hp htall\">ㄷ.\u003cspan class=\"heq\">\\(\\sum\\limits_{n=1}^{5} f(n)=5\\,\\)\u003c/span>를 만족시키는 정수 \u003cspan class=\"heq\">\\(a\\,\\)\u003c/span>의 값은 \u003cbr>\u003cspan class=\"heq\">\\(-1\\)\u003c/span> 또는 \u003cspan class=\"heq\">\\(3\\,\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp class=\"hp\">① ㄱ&emsp;② ㄱ, ㄴ&emsp;③ ㄱ, ㄷ\u003c/p>\u003cp class=\"hp\">④ ㄴ, ㄷ&emsp;⑤ ㄱ, ㄴ, ㄷ\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"139c4a656c4cbfa1e5eb5aaba4c514a152177e53a6c1e0a6b895e17652b12fbb"};</script>
<script>window.HandStudyGuide={"itemId":16213,"sourceHash":"c6193ec8ce9f4723df108c3bce5019c0b682e64257600ed6ec27aded17cd4fa2","contentHash":"1c3ad05490e2fbf2e4fc44062d5ba57c8763c39040d3b26faa68b38d6914f003","overview":{"goal":"접점을 \\(t\\)로 두어 접선 조건을 이차방정식으로 바꾸고 보기마다 정수 \\(n\\)을 세어요.","firstLook":"접선이 점 \\((a,0)\\)을 지나면 접점의 함숫값은 기울기와 가로 거리의 곱이에요.","conditions":[{"label":"접선 조건","meaning":"접점 \\(t\\)마다 하나의 접선이 정해지므로 가능한 \\(t\\)의 개수를 세어요."}]},"chapters":[{"id":"c1","label":"접선 개수를 판별식으로 바꿔요","stepIds":["s1","s2","s3"],"question":"접점 방정식의 판별식이 \\(c(c+4)\\)가 되는 과정은 무엇인가요?","hint":"\\(u=t-n,\\ c=a-n\\)으로 바꿔 지수인자를 약분해요.","explanation":"곡선의 접점 \\(t\\)에서 함숫값은 \\((t-n)e^t\\), 기울기는 \\((t-n+1)e^t\\)예요. 접선이 \\((a,0)\\)을 지나므로 \\((t-n)e^t=(t-a)(t-n+1)e^t\\)예요. \\(u=t-n,\\ c=a-n\\)으로 두면 \\(u^2-cu-c=0\\), 판별식은 \\(c^2+4c=c(c+4)\\)예요. 따라서 \\(c>0\\) 또는 \\(c<-4\\)면 두 접선, \\(c=0,-4\\)면 한 접선, \\(-4<c<0\\)면 접선이 없어요.","check":{"prompt":"판별식이 \\(0\\)인 두 \\(c\\)값은 무엇인가요?","answer":"\\(c(c+4)=0\\)에서 \\(c=0,-4\\)이고 각각 접점 하나를 줘요."}},{"id":"c2","label":"첫 두 보기를 판단해요","stepIds":["s4","s5"],"question":"\\(f(n)=1\\)인 정수 \\(n\\)은 왜 항상 두 개인가요?","hint":"\\(a-n=0\\)과 \\(a-n=-4\\)를 각각 풀어요.","explanation":"ㄱ에서 \\(a=0,n=4\\)이면 \\(c=-4\\)라 \\(f(4)=1\\), 참이에요. 일반적으로 \\(f(n)=1\\)은 \\(a-n=0\\) 또는 \\(-4\\), 즉 \\(n=a\\) 또는 \\(n=a+4\\)일 때예요. \\(a\\)가 정수이면 두 값은 서로 다른 정수이므로 개수는 항상 \\(2\\)예요. 따라서 그 개수가 \\(1\\)인 정수 \\(a\\)는 존재하지 않아 ㄴ은 거짓이에요.","check":{"prompt":"\\(n=a\\)와 \\(n=a+4\\)가 겹칠 수 없는 이유는 무엇인가요?","answer":"두 정수의 차가 항상 \\(4\\)이기 때문이에요."}},{"id":"c3","label":"다섯 항의 합이 5인 정수를 확인해요","stepIds":["s6","s7"],"question":"\\(a=-1,3\\) 외의 가까운 정수에서는 합이 어떻게 달라질까요?","hint":"\\(a=-1,0,1,2,3\\)에서 \\(n=1,\\dots,5\\)의 값을 직접 세어요.","explanation":"\\(f(n)\\)은 \\(n<a\\) 또는 \\(n>a+4\\)에서 \\(2\\), \\(n=a,a+4\\)에서 \\(1\\), 그 사이에서 \\(0\\)이에요. \\(a=-1\\)이면 \\(n=1,2,3,4,5\\)의 값이 \\(0,0,1,2,2\\)라 합 \\(5\\), \\(a=3\\)이면 \\(2,2,1,0,0\\)이라 합 \\(5\\)예요. 경계 사이의 \\(a=0,1,2\\)에서는 합이 각각 \\(3,2,3\\), 바깥으로 한 칸 간 \\(a=-2,4\\)에서는 각각 \\(7\\)이고 더 멀어지면 더 커져요. 따라서 ㄷ은 참이고 정답은 ㄱ, ㄷ인 ③이에요.","check":{"prompt":"\\(a=-1\\)과 \\(a=3\\)에서 다섯 값의 합을 각각 적어 보세요.","answer":"\\(a=-1\\)은 \\(0+0+1+2+2=5\\), \\(a=3\\)은 \\(2+2+1+0+0=5\\)예요."}}],"takeaway":["접선의 개수는 접점을 미지수로 둔 방정식의 서로 다른 실근 수로 바꿔요.","판별식 경계값은 접선 하나가 되는 경우라 등호를 따로 포함해요.","유한한 정수 구간의 합 조건은 경계 근처 값을 표로 직접 확인해 후보의 완전성을 보장해요."]};</script>
