<script>window.HandStudyRecord={"itemId":16661,"sourceLabel":"2020 교육청 고3 수리가형 3월 26번","adminYear":2020,"grade":3,"month":3,"number":26,"track":"수리가형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"좌표평면에서 제$\\,1\\,$사분면에 점 $P\\,$가 있다. 점 $P\\,$를 직선 $y=x\\,$에 대하여 대칭이동한 점을 $Q\\,$라 하고, 점 $Q\\,$를 원점에 대하여 대칭이동한 점을 $R\\,$라 할 때, 세 동경 $O P$, $O Q$, $O R\\,$가 나타내는 각을 각각 $\\alpha$, $\\beta$, $\\gamma\\,$라 하자. $\\sin\\, \\alpha = \\frac{1}{3}\\,$일 때, $9\\, \\left(\\sin ^{\\,2} \\, \\beta +\\tan^{\\,2} \\, \\gamma \\right)\\,$의 값을 구하시오. (단, $O\\,$는 원점이고, 시초선은 $x\\,$축의 양의 방향이다.) [4점]","answer":"80","sourceHash":"38a9efb400a88beb5df444530978b26310c98634f72c40c826ae41fe5f5b8bbf","steps":[{"id":"s1","latex":"P=(x,y),\\quad x,y>0,\\quad r^2=x^2+y^2"},{"id":"s2","latex":"\\sin\\alpha=\\frac{y}{r}=\\frac13\\Rightarrow\\frac{x^2}{r^2}=1-\\frac19=\\frac89"},{"id":"s3","latex":"Q=(y,x)\\Rightarrow\\sin^2\\beta=\\frac{x^2}{r^2}=\\frac89"},{"id":"s4","latex":"R=(-y,-x)\\Rightarrow\\tan^2\\gamma=\\frac{x^2}{y^2}=8"},{"id":"s5","latex":"9\\left(\\sin^2\\beta+\\tan^2\\gamma\\right)=9\\left(\\frac89+8\\right)=\\boxed{80}"}],"diagram":null,"contentHash":"7c1abd391f4efdf4e8dbd1002201bab81c57c1bc12f3073edd6c9ca6800b7826","questionHtml":"\u003cp class=\"hp htall\">좌표평면에서 제\u003cspan class=\"heq\">\\(\\,1\\,\\)\u003c/span>사분면에 점 \u003cspan class=\"heq\">\\(P\\,\\)\u003c/span>가 있다. 점 \u003cspan class=\"heq\">\\(P\\,\\)\u003c/span>를 직선 \u003cspan class=\"heq\">\\(y=x\\,\\)\u003c/span>에 대하여 대칭이동한 점을 \u003cspan class=\"heq\">\\(Q\\,\\)\u003c/span>라 하고, 점 \u003cspan class=\"heq\">\\(Q\\,\\)\u003c/span>를 원점에 대하여 대칭이동한 점을 \u003cspan class=\"heq\">\\(R\\,\\)\u003c/span>라 할 때, 세 동경 \u003cspan class=\"heq\">\\(O P\\)\u003c/span>, \u003cspan class=\"heq\">\\(O Q\\)\u003c/span>, \u003cspan class=\"heq\">\\(O R\\,\\)\u003c/span>가 나타내는 각을 각각 \u003cspan class=\"heq\">\\(\\alpha\\)\u003c/span>, \u003cspan class=\"heq\">\\(\\beta\\)\u003c/span>, \u003cspan class=\"heq\">\\(\\gamma\\,\\)\u003c/span>라 하자
