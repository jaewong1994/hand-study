<script>window.HandStudyRecord={"itemId":16984,"sourceLabel":"2021 교육청 고3 수학기하 10월 30번","adminYear":2021,"grade":3,"month":10,"number":30,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"한 변의 길이가 $4$인 정삼각형 ${ ABC }$를 한 면으로 하는 사면체 ${ ABCD }$의 꼭짓점 ${ A}$에서 평면 ${ BCD }$에 내린 수선의 발을 ${ H}$라 할 때, 점 ${ H}$는 삼각형 ${ BCD }$의 내부에 놓여 있다. 직선 ${ DH }$가 선분 ${ BC }$와 만나는 점을 $E$라 할 때, 점 ${ E}$가 다음 조건을 만족시킨다.\n(가) $∠{ AEH }=∠{ DAH }$ (나) 점 $E$는 선분 ${ CD }$를 지름으로 하는 원 위의 점이고 $\\overline{ DE }}\\,=4$이다.\n삼각형 ${ AHD }$의 평면 ${ ABD }$ 위로의 정사영의 넓이는 $\\frac{q}{p}$이다. $p+q$ 의 값을 구하시오. (단, $p$와 $q$는 서로소인 자연수이다.)\n[4점]","answer":"7","sourceHash":"ae419d625a146962b95ee8c70a67bcd343f208de8632d0fb39b5b754e0c097de","steps":[{"id":"s1","latex":"CD\\text{는 지름}\\Rightarrow CE\\perp DE,\\quad AH\\perp(BCD)\\Rightarrow AE\\perp BC"},{"id":"s2","latex":"ABC\\text{ 정삼각형},\\ AB=4\\Rightarrow AE=2\\sqrt3"},{"id":"s3","latex":"\\angle EAD=90^\\circ,\\quad AD=\\sqrt{4^2-(2\\sqrt3)^2}=2"},{"id":"s4","latex":"AH=\\frac{AE\\cdot AD}{4}=\\sqrt3,\\quad HD=\\frac{AD^2}{4}=1"},{"id":"s5","latex":"S_{AHD}=\\frac12\\sqrt3,\\quad \\angle BAE=30^\\circ"},{"id":"s6","latex":"S_{\\text{정사영}}=\\frac{\\sqrt3}{2}\\cos30^\\circ=\\frac34"},{"id":"s7","latex":"p=4,\\ q=3\\Rightarrow p+q=7"}],"diagram":null,"contentHash":"5712e6672c6890449da16b41e331d3bef39aacc654ab09ed7105433aeb8f2f1a","questionHtml":"\u003cp class=\"hp\">한 변의 길이가 \u003cspan class=\"heq\">\\(4\\)\u003c/span>인 정삼각형 \u003cspan class=\"heq\">\\({ABC }\\)\u003c/span>를 한 면으로 하는 사면체 \u003cspan class=\"heq\">\\({ABCD }\\)\u003c/span>의 꼭짓점 \u003cspan class=\"heq\">\\({A}\\)\u003c/span>에서 평면 \u003cspan class=\"heq\">\\({BCD }\\)\u003c/span>에 내린 수선의 발을 \u003cspan class=\"heq\">\\({H}\\)\u003c/span>라 할 때, 점 \u003cspan class=\"heq\">\\({H}\\)\u003c/span>는 삼각형 \u003cspan class=\"heq\">\\({BCD }\\)\u003c/span>의 내부에 놓여 있다. 직선 \u003cspan class=\"heq\">\\({DH }\\)\u003c/span>가 선분 \u003cspan class=\"heq\">\\({BC }\\)\u003c/span>와 만나는 점을 \u003cspan class=\"heq\">\\(E\\)\u003c/span>라 할 때, 점 \u003cspan class=\"heq\">\\({E}\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">(가) \u003cspan class=\"heq\">\\(∠{AEH }=∠{DAH }\\)\u003c/span>\u003c/p>\u003cp class=\"hp htall\">(나) 점 \u003cspan class=\"heq\">\\(E\\)\u003c/span>는 선분 \u003cspan class=\"heq\">\\({CD }\\)\u003c/span>를 지름으로 하는 원 위의 점이고\u003cbr>\u003cspan class=\"heq\">\\(\\overline{DE }\\,=4\\)\u003c/span>이다.\u003c/p>\u003c/div>\u003cp class=\"hp htall\">삼각형 \u003cspan class=\"heq\">\\({AHD }\\)\u003c/span>의 평면 \u003cspan class=\"heq\">\\({ABD }\\)\u003c/span> 위로의 정사영의 넓이는 \u003cspan class=\"heq\">\\(\\dfrac{q}{p}\\)\u003c/span>이다.\u003cbr>\u003cspan class=\"heq\">\\(p+q\\)\u003c/span> 의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(p\\)\u003c/span>와 \u003cspan class=\"heq\">\\(q\\)\u003c/span>는 서로소인 자연수이다.)\u003c/p>\u003cp class=\"hp\">\u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/dee9ecfbd596ec8442c3b975.png\" style=\"width:278px;max-width:100%\">\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"63b5b478f9146ef361627b73990d2c3054afe655c66dd011eb9077f616c6d0b1"};</script>
<script>window.HandStudyGuide={"itemId":16984,"sourceHash":"ae419d625a146962b95ee8c70a67bcd343f208de8632d0fb39b5b754e0c097de","contentHash":"5712e6672c6890449da16b41e331d3bef39aacc654ab09ed7105433aeb8f2f1a","overview":{"goal":"여러 수직관계로 직각삼각형의 길이를 구하고, 두 평면 사이의 각을 이용해 정사영 넓이를 계산해요.","firstLook":"지름에 대한 원주각과 평면에 내린 수선에서 생기는 직각을 연결하면 평면도형 계산으로 줄어들어요.","conditions":[{"label":"지름의 원주각","meaning":"\\(CE\\perp DE\\)예요."},{"label":"평면에 수직","meaning":"\\(AH\\)는 평면 \\(BCD\\)의 모든 직선과 수직이에요."}]},"chapters":[{"id":"c1","label":"수직관계로 길이를 구해요","stepIds":["s1","s2","s3"],"question":"\\(AE\\)와 \\(AD\\)는 얼마인가요?","hint":"\\(AE\\perp BC\\)와 정삼각형의 높이를 이용해요.","explanation":"\\(CD\\)가 원의 지름이므로 \\(CE\\perp DE\\)예요. \\(C,E,B\\)가 한 직선 위이므로 \\(DE\\perp BC\\)이고, \\(AH\\perp(BCD)\\)라 \\(AH\\perp BC\\)예요. 두 수직선 \\(AH,EH\\)이 만드는 평면 \\(AEH\\)도 \\(BC\\)에 수직이어서 \\(AE\\perp BC\\)예요. 따라서 정삼각형 \\(ABC\\)에서 \\(AE\\)는 높이이고 \\(AE=2\\sqrt3\\)이에요. 한편 \\(D,H,E\\)가 이 순서로 한 직선 위이고 \\(AH\\perp DE\\)이므로 \\(\\angle ADH+\\angle DAH=90^\\circ\\)예요. 조건 (가)에서 \\(\\angle AEH=\\angle DAH\\)이므로 삼각형 \\(AED\\)의 나머지 각의 합이 \\(90^\\circ\\), 즉 \\(AE\\perp AD\\)예요. \\(ED=4\\)이므로 \\(AD=\\sqrt{ED^2-AE^2}=2\\)예요.","check":{"prompt":"정삼각형 한 변이 \\(4\\)일 때 높이는 얼마인가요?","answer":"\\(2\\sqrt3\\)예요."}},{"id":"c2","label":"직각삼각형의 높이와 투영을 써요","stepIds":["s4","s5"],"question":"\\(AH,HD\\)와 삼각형 넓이는 얼마인가요?","hint":"빗변 \\(ED=4\\)인 직각삼각형에서 높이 관계를 써요.","explanation":"직각삼각형의 닮음에서 빗변에 내린 높이는 두 변의 곱을 빗변으로 나눈 값이므로 \\(AH=AE\\cdot AD/ED=(2\\sqrt3\\cdot2)/4=\\sqrt3\\)예요. 또 한 변의 빗변 위 정사영 길이는 그 변 제곱을 빗변으로 나눈 값이라 \\(HD=AD^2/ED=1\\)이에요. 따라서 \\(\\triangle AHD\\)의 넓이는 \\(\\frac12 AH\\cdot HD=\\sqrt3/2\\)예요. 정삼각형에서 높이 \\(AE\\)가 각을 이등분하므로 \\(\\angle BAE=30^\\circ\\)예요.","check":{"prompt":"\\(HD\\)가 \\(1\\)인 계산은 무엇인가요?","answer":"\\(HD=AD^2/ED=4/4=1\\)이에요."}},{"id":"c3","label":"평면각으로 정사영 넓이를 구해요","stepIds":["s6","s7"],"question":"두 평면 사이의 각은 왜 \\(30^\\circ\\)인가요?","hint":"공통선 \\(AD\\)에 수직인 두 선이 이루는 각을 봐요.","explanation":"평면 \\(AHD\\)와 평면 \\(ABD\\)는 \\(AD\\)를 공통선으로 가져요. 앞에서 \\(AE\\perp AD\\)이고 \\(AE\\)는 평면 \\(AHD\\) 위에 있어요. 또한 \\(BE=2,DE=4\\)라 \\(BD=2\\sqrt5\\)이고, \\(AB^2+AD^2=4^2+2^2=20=BD^2\\)이므로 \\(AB\\perp AD\\)예요. 따라서 두 평면 사이의 각은 \\(\\angle BAE=30^\\circ\\)예요. 정사영 넓이는 \\(\\frac{\\sqrt3}{2}\\cos30^\\circ=3/4\\)이고, \\(p+q=7\\)이에요.","check":{"prompt":"정사영 넓이가 원래 넓이보다 작은가요?","answer":"\\(0<\\cos30^\\circ<1\\)을 곱하므로 작아요."}}],"takeaway":["공간 문제도 수직관계가 만든 직각삼각형의 닮음으로 길이를 구할 수 있어요.","두 평면 사이의 각은 공통선에 수직인 두 직선의 각으로 찾아요.","정사영 넓이는 원래 넓이에 평면각의 코사인을 곱해요."]};</script>
