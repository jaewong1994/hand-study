  <script>window.HandStudyRecord={"itemId":17456,"sourceLabel":"2022 평가원 고3 수학기하 6월 22번","adminYear":2022,"grade":3,"month":6,"number":22,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"두 양수 $a,\\,b$($b\\gt 3$)과 최고차항의 계수가 $1$인 이차함수 $f \\left( x \\right)$에 대하여 함수\n $g \\left( x \\right)$$= {\\begin{cases}\\, \\left( x+3 \\right) \\,f \\left( x \\right)&\\, \\left( x\\lt 0 \\right) \\\\ eqalign{ \\\\ \\, \\left( x+a \\right) \\,f \\left( x-b \\right)}&eqalign{ \\\\ \\, \\left( x \\geq 0 \\right)}\\end{cases}}$\n이 실수 전체의 집합에서 연속이고 다음 조건을 만족시킬 때, $g \\left( 4 \\right)$의 값을 구하시오. [4점]\n$\\lim\\limits_{x \\to -3} {} \\dfrac{\\sqrt{\\left| \\,g \\left( x \\right) \\, \\right| + \\left\\{ g \\left( t \\right) \\right\\}^{2}} - \\left| \\,g \\left( t \\right) \\, \\right|}{\\left( x+3 \\right)^{2}}$의 값이 존재하지 않는\n실수 $t$의 값은 $-3$과 $6$뿐이다.\n[도형 1]2022년 6월 고3 모의고사 문제지\n제2교시\n 수학영역(기하)\n제2교시\n[도형 2]\n5지선다형","answer":"19","sourceHash":"a014080c0df98c177e9edf83658a6f9403a286b319a39353e6ac3083dafa683c","steps":[{"id":"s1","latex":"C=|g(t)|>0:\\quad \\frac{\\sqrt{|g(x)|+C^2}-C}{(x+3)^2}=\\frac{|f(x)|}{|x+3|(\\sqrt{|g(x)|+C^2}+C)}"},{"id":"s2","latex":"f(-3)\\ne0\\Rightarrow\\text{모든 }t\\text{에서 발산}\\Rightarrow f(x)=(x+3)(x-c)"},{"id":"s3","latex":"C>0:\\ \\lim\\frac{|x-c|}{\\sqrt{|g(x)|+C^2}+C}=\\frac{|-3-c|}{2C}"},{"id":"s4","latex":"C=0:\\quad\\frac{\\sqrt{|x-c|}}{|x+3|}\\to\\infty\\quad(c=-3\\text{일 때도 발산})"},{"id":"s5","latex":"g(t)=0\\iff t=-3,6,\\quad x\\ge0:\\ g(x)=(x+a)(x-b+3)(x-b-c)"},{"id":"s6","latex":"b-3>0\\Rightarrow b=9;\\quad c\\ge0\\Rightarrow9+c\\text{가 새 근이므로 불가};\\quad c\u003c0\\Rightarrow c=-3"},{"id":"s7","latex":"f(x)=(x+3)^2,\\quad3f(0)=af(-9)\\Rightarrow a=3/4"},{"id":"s8","latex":"g(4)=(4+3/4)(-5+3)^2=19"}],"diagram":null,"contentHash":"f92f058702f7e74a080a5cb50b9dd6dd13f7f3d4adede4e7eb5c3e2dda594a9c","questionHtml":"\u003cp class=\"hp\">두 양수 \u003cspan class=\"heq\">\\(a,\\,b\\)\u003c/span>(\u003cspan class=\"heq\">\\(b\\gt 3\\)\u
