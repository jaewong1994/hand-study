<script>window.HandStudyRecord={"adminYear":2025,"answer":"38","contentHash":"bc74991d219489c57c72c801c5a7a34962cfc6c63d4007c66550d50eb5e106e2","diagram":null,"editionHash":"87ab9b55c0a059a371aaf3db2b2bfa94f0c271b1bf35a8833709cf6dc133e7e4","grade":3,"graphHash":"","graphPlan":null,"itemId":18320,"learningHash":"5242962c75ce10246eb0ca46a991abdbc8680804ba6a9b5a5e431087b83330f1","month":6,"number":22,"points":4,"preview":false,"questionHtml":"\u003cp class=\"hp\">\u003cspan class=\"heq\">\\(k \\gt  1\\,\\)\u003c/span>인 실수 \u003cspan class=\"heq\">\\(k\\,\\)\u003c/span>에 대하여 두 곡선\u003c/p>\u003cp class=\"hp htall\">&emsp;\u003cspan class=\"heq\">\\(y=2^{x}+\\dfrac{k}{2}\\)\u003c/span>, \u003cspan class=\"heq\">\\(y=k \\times \\left(\\dfrac{1}{2} \\right)^{x}+k-2\\)\u003c/span>\u003c/p>\u003cp class=\"hp htall\">가 만나는 점을 \u003cspan class=\"heq\">\\({{A}}\\,\\)\u003c/span>라 하고, 점 \u003cspan class=\"heq\">\\({{A}}\\,\\)\u003c/span>를 지나고 기울기가 \u003cspan class=\"heq\">\\(-1\\,\\)\u003c/span>인 직선이 곡선 \u003cspan class=\"heq\">\\(y=2^{x-2}-3\\,\\)\u003c/span>과 만나는 점을 \u003cspan class=\"heq\">\\({{B}}\\,\\)\u003c/span>라 하자. 삼각형 \u003cspan class=\"heq\">\\({{AOB}}\\,\\)\u003c/span>의 넓이가 \u003cspan class=\"heq\">\\(16\\,\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(k+ \\log_{2}\\,k=\\dfrac{q}{p}\\,\\)\u003c/span>이다. \u003cspan class=\"heq\">\\(p+q\\,\\)\u003c/span>의 값을 구하시오. \u003cbr>(단, \u003cspan class=\"heq\">\\({{O}}\\,\\)\u003c/span>는 원점이고, \u003cspan class=\"heq\">\\(p\\,\\)\u003c/span>와 \u003cspan class=\"heq\">\\(q\\,\\)\u003c/span>는 서로소인 자연수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","questionText":"$k > 1\\,$인 실수 $k\\,$에 대하여 두 곡선\n $y=2^{x}+\\frac{k}{2}$, $y=k \\times \\left(\\frac{1}{2} \\right)^{x}+k-2$\n가 만나는 점을 ${{A}}\\,$라 하고, 점 ${{A}}\\,$를 지나고 기울기가 $-1\\,$인 직선이 곡선 $y=2^{x-2}-3\\,$과 만나는 점을 ${{B}}\\,$라 하자. 삼각형 ${{AOB}}\\,$의 넓이가 $16\\,$일 때, $k+ \\log_{2}\\,k=\\frac{q}{p}\\,$이다. $p+q\\,$의 값을 구하시오. (단, ${{O}}\\,$는 원점이고, $p\\,$와 $q\\,$는 서로소인 자연수이다.) [4점]\n 사각형입니다. 2025년 6월 고3 모의고사 문제지제 2 교시 수학 영역(기하) \n5 지선다형","scoreStatus":"confirmed_4_direct","sourceHash":"66d0fa72d8d6634e5076ff75a089f324feeb61dcadc11273ed7669dae9731762","sourceLabel":"2025 평가원 고3 수학기하 6월 22번","stepExplanations":{"s1":{"body":"교점에서는 두 \\(y\\)값이 같아요. \\(t=2^x>0\\)로 놓으면 \\((\\frac12)^x=\\frac1t\\)이므로 \\(t+\\frac k2=\\frac kt+k-2\\)입니다. 양변에 \\(t\\)를 곱하고 한쪽으로 모으면 지금의 이차방정식이 나와요. \\(t>0\\)이어서 분모가 0일 걱정 없이 곱할 수 있어요.","skillTags":["exponential.substitution","equation.denominator"],"title":"지수식을 양수인 한 문자로 바꿔요"},"s2":{"body":"인수분해하면 \\(t=\\frac k2\\) 또는 \\(t=-2\\)인데, \\(t=2^x>0\\)이므로 \\(-2\\)는 버려요. 남은 식에서 \\(x=\\log_2\\frac k2=\\log_2k-1=a\\)입니다. 또 \\(y=t+\\frac k2=k\\)이므로 \\(\\mathrm{A}=(a,k)\\)예요.","skillTags":["exponential.substitution","equation.domain-check"],"title":"치환한 문자의 범위로 불가능한 해를 걸러요"},"s3":{"body":"첫 교점에서는 \\(2^{a+1}=k\\)예요. 두 번째 곡선의 지수를 \\(a+1\\)로 맞추려면 \\(x=a+3\\)을 넣으면 되고, 그때 \\(y=k-3\\)입니다. \\(\\mathrm{A}\\)를 지나는 기울기 \\(-1\\)인 직선은 \\(x+y=a+k\\)인데 이 점도 그 식을 만족해요. 또 곡선은 증가하고 직선은 감소하므로 두 교점이 생길 수는 없어요. 따라서 이 점이 바로 \\(\\mathrm{B}\\)입니다.","skillTags":["exponential.translation","line.intersection"],"title":"이동한 점이 곡선과 직선을 모두 만족하는지 확인해요"},"s4":{"body":"\\(\\mathrm{A}=(a,k)\\)에서 \\(\\mathrm{B}=(a+3,k-3)\\)까지의 좌표 차는 3과 \\(-3\\)이므로 \\(\\overline{\\mathrm{AB}}=3\\sqrt2\\)예요. 밑변을 \\(\\mathrm{AB}\\)로 잡으면 높이는 원점에서 직선 \\(x+y=a+k\\)까지의 거리 \\(\\frac{|a+k|}{\\sqrt2}\\)입니다. \\(k>1\\)이고 \\(a=\\log_2k-1>-1\\)이므로 \\(a+k>0\\)이에요. 절댓값을 벗긴 뒤 ‘밑변×높이÷2’를 계산하면 \\(\\frac32(a+k)=16\\)이 됩니다.","skillTags":["geometry.triangle-area","line.distance","inequality.sign"],"title":"밑변과 높이로 넓이 계산을 풀어 써요"}},"steps":[{"id":"s1","latex":"t=2^x:\\quad t^2+\\left(2-\\frac k2\\right)t-k=0"},{"id":"s2","latex":"\\left(t-\\frac k2\\right)(t+2)=0\\Rightarrow A=(a,k),\\quad a=\\log_2k-1"},{"id":"s3","latex":"2^{(a+3)-2}-3=k-3,\\quad(a+3)+(k-3)=a+k\\Rightarrow B=(a+3,k-3)"},{"id":"s4","latex":"\\dfrac12\\times3\\sqrt2\\times\\dfrac{a+k}{\\sqrt2}=\\dfrac32(a+k)=16"},{"id":"s5","latex":"a+k=\\frac{32}{3}"},{"id":"s6","latex":"k+\\log_2k=k+a+1=\\frac{35}{3}\\Rightarrow p+q=38"}],"track":"기하"};</script>
<script>window.HandStudyGuide={"itemId":18320,"sourceHash":"66d0fa72d8d6634e5076ff75a089f324feeb61dcadc11273ed7669dae9731762","contentHash":"bc74991d219489c57c72c801c5a7a34962cfc6c63d4007c66550d50eb5e106e2","overview":{"goal":"두 지수곡선의 교점 \\(A\\)와 기울기 \\(-1\\)인 직선 위의 교점 \\(B\\)를 좌표로 나타내 삼각형 넓이 조건을 계산해요.","firstLook":"두 곡선에는 \\(2^x\\)와 \\((1/2)^x\\)가 함께 보여요. \\(t=2^x>0\\)로 바꾸면 서로 역수인 항이 하나의 이차방정식으로 정리됩니다.","conditions":[{"label":"교점 A","meaning":"두 지수곡선의 \\(y\\)값이 같은 점이에요."},{"label":"점 B","meaning":"\\(A\\)를 지나고 기울기가 \\(-1\\)인 직선과 \\(y=2^{x-2}-3\\)의 교점이에요."},{"label":"넓이","meaning":"원점과 \\(A,B\\)가 만드는 삼각형의 넓이가 16이에요."}]},"chapters":[{"id":"c1","label":"지수 교점을 이차방정식으로 바꾸기","stepIds":["s1","s2"],"question":"왜 \\(t=2^x\\)로 놓으면 교점 계산이 쉬워질까요?","hint":"\\((1/2)^x=1/t\\)를 사용해 두 곡선의 \\(y\\)값을 같게 놓으세요.","explanation":"교점에서 \\(t+k/2=k/t+k-2\\)이고 \\(t>0\\)이에요. 양변에 \\(t\\)를 곱하면 \\(t^2+(2-k/2)t-k=0\\), 즉 \\((t-k/2)(t+2)=0\\)입니다. \\(t=-2\\)는 불가능하므로 \\(t=k/2\\), \\(x=\\log_2k-1=:a\\), \\(y=k\\)가 되어 \\(A=(a,k)\\)예요.","check":{"prompt":"인수분해로 나온 \\(t=-2\\)를 버리는 근거는 무엇인가요?","answer":"\\(t=2^x\\)는 항상 양수이기 때문입니다."}},{"id":"c2","label":"두 번째 교점 B 찾기","stepIds":["s3"],"question":"\\(A\\)를 지나는 기울기 \\(-1\\)인 직선과 두 번째 곡선의 교점을 어떻게 짐작할까요?","hint":"\\(2^{a+1}=k\\)를 이용해 지수를 \\(a+1\\)로 맞추세요.","explanation":"\\(x=a+3\\)을 두 번째 곡선에 넣으면 \\(2^{(a+3)-2}-3=2^{a+1}-3=k-3\\)이에요. 따라서 \\(B=(a+3,k-3)\\)입니다. 두 점에서 \\(x+y=a+k\\)가 같으므로 기울기 \\(-1\\)인 직선 위에 있고, 증가하는 곡선과 감소하는 직선은 한 번만 만나므로 이 점이 바로 \\(B\\)예요.","check":{"prompt":"\\(A\\)와 \\(B\\)의 좌표 차는 무엇인가요?","answer":"\\(B-A=(3,-3)\\)입니다."}},{"id":"c3","label":"밑변과 높이로 넓이 계산하기","stepIds":["s4","s5","s6"],"question":"삼각형 \\(AOB\\)의 밑변과 높이를 어떤 직선에서 읽을까요?","hint":"\\(AB\\)는 \\(x+y=a+k\\) 위에 있고 원점에서 이 직선까지의 거리를 높이로 쓸 수 있어요.","explanation":"\\(B-A=(3,-3)\\)이므로 \\(AB=3\\sqrt2\\)예요. 원점에서 직선 \\(x+y=a+k\\)까지의 거리는 \\(|a+k|/\\sqrt2\\)이고, \\(k>1\\), \\(a=\\log_2k-1>-1\\)이라 \\(a+k>0\\)입니다. 넓이는 \\(\\frac12\\cdot3\\sqrt2\\cdot(a+k)/\\sqrt2=\\frac32(a+k)=16\\), 따라서 \\(a+k=32/3\\)이에요. \\(a=\\log_2k-1\\)을 되돌리면 \\(k+\\log_2k=35/3\\)입니다.","check":{"prompt":"\\(p+q\\)는 얼마인가요?","answer":"\\(35/3\\)에서 \\(p=3,q=35\\)이므로 38입니다."}}],"takeaway":["서로 역수인 지수항이 함께 나오면 \\(t=2^x\\) 같은 양수 치환으로 대수식으로 바꿔요.","후보 교점을 찾은 뒤에는 두 식을 모두 만족하는지와 교점의 유일성을 확인해요.","두 점이 놓인 직선이 단순하면 그 선분을 밑변으로 잡고 원점에서 직선까지의 거리를 높이로 써요."]};</script>
