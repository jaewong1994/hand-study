<script>window.HandStudyGuide={"itemId":16550,"sourceHash":"a4906c1a9f71023f45d0bfafe4ae36c0c98568c9ae3d0ad54745ca3e8b8a1577","contentHash":"468f4cf5822a20aa2e33db16c594275bca3412c991f2399bde6e06e5b4831f92","overview":{"goal":"이차식이 같은 값을 만드는 두 입력을 비교해 \\(f(3)\\)을 구하고, 합성함수를 미분해 \\(f(1),f(7)\\)을 차례로 정해요.","firstLook":"\\(x^2+x+1\\)은 x와 \\(-1-x\\)에서 같은 값이에요. 왼쪽이 같으므로 오른쪽 두 식도 같아야 해요.","conditions":[{"label":"모든 실수에서 성립","meaning":"같은 이차식 값을 주는 두 입력을 자유롭게 비교할 수 있어요."}]},"chapters":[{"id":"c1","label":"대칭인 두 입력으로 f(3)을 구해요","stepIds":["s1","s2"],"question":"x와 \\(-1-x\\)를 넣으면 어느 항이 그대로인가요?","hint":"이차식과 사인값을 각각 확인해요.","explanation":"\\((-1-x)^2+(-1-x)+1=x^2+x+1\\)이고 \\(\\sin\\pi(-1-x)=\\sin\\pi x\\)예요. 따라서 오른쪽에서 남은 다항식 부분도 같아야 해요. 즉 \\(f(3)x+5x^2=-f(3)(1+x)+5(1+x)^2\\)예요. 전개해 양변의 상수항을 비교하면 \\(-f(3)+5=0\\), 따라서 \\(f(3)=5\\)예요.","check":{"prompt":"두 식의 상수항 비교에서 얻는 등식은 무엇인가요?","answer":"\\(0=-f(3)+5\\)라서 \\(f(3)=5\\)예요."}},{"id":"c2","label":"합성함수를 미분해 f(1)을 구해요","stepIds":["s3","s4"],"question":"왜 입력 구간 \\([0,1]\\)이 함수 f의 입력 \\([1,3]\\)에 대응할까요?","hint":"\\(x^2+x+1\\)에 양 끝값을 넣어요.","explanation":"연쇄법칙으로 \\(\\frac d{dx}f(x^2+x+1)=\\{\\pi f(1)\\sin\\pi x+5x+5x^2\\}(2x+1)\\)예요. 0부터 1까지 적분하면 왼쪽은 \\(f(3)-f(1)\\)이에요. 오른쪽에서 사인 부분은 \\(4f(1)\\), 다항식 부분은 10이므로 \\(5-f(1)=4f(1)+10\\)이에요. 따라서 \\(f(1)=-1\\)이에요.","check":{"prompt":"\\(5-f(1)=4f(1)+10\\)을 풀면 왜 -1인가요?","answer":"\\(-5=5f(1)\\)이므로 \\(f(1)=-1\\)이에요."}},{"id":"c3","label":"입력 칠까지의 변화량을 적분해요","stepIds":["s5","s6"],"question":"f의 입력이 1에서 7까지 가려면 x는 어디까지 움직여야 할까요?","hint":"\\(x^2+x+1=7\\)의 양의 해를 구해요.","explanation":"\\(x=2\\)이면 \\(x^2+x+1=7\\)이므로 \\(0\\)부터 \\(2\\)까지 적분해요. \\(f(1)=-1,f(3)=5\\)를 원식에 넣으면 적분할 식은 \\(\\{-\\pi\\sin\\pi x+5x+5x^2\\}(2x+1)\\)예요. 사인 부분 적분은 \\(4\\), 다항식 부분 적분은 \\(90\\)이라 \\(f(7)-f(1)=94\\)예요. 따라서 \\(f(7)=-1+94=93\\)이에요.","check":{"prompt":"변화량 94에 어느 시작값을 더해야 하나요?","answer":"\\(f(1)=-1\\)을 더해 \\(f(7)=93\\)이에요."}}],"takeaway":["합성함수의 안쪽 이차식이 같은 두 입력을 찾아 오른쪽 식을 비교해요.","합성함수를 미분한 뒤 적분하면 f의 두 함숫값 차를 얻을 수 있어요.",
