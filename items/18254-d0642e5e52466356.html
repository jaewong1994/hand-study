<script>window.HandStudyRecord={"itemId":18254,"sourceLabel":"2025 교육청 고3 수학미적분 7월 22번","adminYear":2025,"grade":3,"month":7,"number":22,"track":"미적분","points":4,"scoreStatus":"confirmed_4_direct","questionText":"모든 항이 자연수이고 다음 조건을 만족시키는 모든 수열 $\\left\\{a_{n} \\right\\}\\,$에 대하여 $a_{6}=6\\,$이 되도록 하는 모든 $a_{1}\\,$의 값의 합을 구하시오. [4점]\n(가) 모든 자연수 $n\\,$에 대하여 $a_{n+2}= \\begin{cases} a_{n+1}+a_{n} & (a_{n}\\text{이 홀수인 경우}) \\\\ \\dfrac{1}{2}a_{n} & (a_{n}\\text{이 짝수인 경우}) \\end{cases}$ 이다.\n(나) 네 항 $a_{2}$, $a_{3}$, $a_{4}$, $a_{5}$ 중 짝수인 항의 개수는 $1\\,$이다.","answer":"76","sourceHash":"bf4bafcf2c20dc33e51c5679bf9bec2d788bf1b74c60d1726d635c01341c8a6e","steps":[{"id":"s1","latex":"a_6=6"},{"id":"s2","latex":"a_4\\text{ 짝수}:\\quad a_4=12,\\quad a_2,a_3,a_5\\text{는 홀수}"},{"id":"s3","latex":"a_5=a_4+a_3,\\quad a_4=a_3+a_2\\Rightarrow a_2+a_3=12"},{"id":"s4","latex":"a_1\\text{은 짝수},\\quad a_3=\\frac{a_1}{2}\\Rightarrow a_1\\in\\{2,6,10,14,18,22\\}"},{"id":"s5","latex":"a_4\\text{ 홀수}:\\quad a_4+a_5=6\\Rightarrow a_5\\text{도 홀수}"},{"id":"s6","latex":"a_3\\text{은 유일한 짝수},\\quad a_5=\\frac{a_3}{2},\\quad a_4=a_3+a_2"},{"id":"s7","latex":"\\frac32a_3+a_2=6\\Rightarrow(a_2,a_3,a_4,a_5)=(3,2,5,1)"},{"id":"s8","latex":"a_3=\\frac{a_1}{2}\\Rightarrow a_1=4"},{"id":"s9","latex":"2+6+10+14+18+22+4=76"}],"diagram":null,"contentHash":"93027aa0f59e8b221bb3dac16f7c176364942133d3256ff9b86e174a9dbe65f1","questionHtml":"\u003cp class=\"hp\">모든 항이 자연수이고 다음 조건을 만족시키는 모든 수열 \u003cspan class=\"heq\">\\(\\left\\{a_{n} \\right\\}\\,\\)\u003c/span>에 대하여 \u003cspan class=\"heq\">\\(a_{6}=6\\,\\)\u003c/span>이 되도록 하는 모든 \u003cspan class=\"heq\">\\(a_{1}\\,\\)\u003c/span>의 값의 합을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp htall\">(가) 모든 자연수 \u003cspan class=\"heq\">\\(n\\,\\)\u003c/span>에 대하여\u003cbr>   \u003cspan class=\"heq\">\\(a_{n+2}= \\begin{cases}\\,a_{n+1}+a_{n} & & \\left(a_{n}\\text{이}\\,\\text{홀수인}\\,\\text{경우} \\right) \\\\ \\, \\,\\dfrac{1}{2}a_{n} & & \\left(a_{n}\\text{이}\\,\\text{짝수인}\\,\\text{경우} \\right)\\end{cases}\\)\u003c/span>\u003cbr>이다.\u003c/p>\u003cp class=\"hp\">(나) 네 항 \u003cspan class=\"heq\">\\(a_{2}\\)\u003c/span>, \u003cspan class=\"heq\">\\(a_{3}\\)\u003c/span>, \u003cspan class=\"heq\">\\(a_{4}\\)\u003c/span>, \u003cspan class=\"heq\">\\(a_{5}\\)\u003c/span> 중 짝수인 항의 개수는 \u003cspan class=\"heq\">\\(1\\,\\)\u003c/span>이다.\u003c/p>\u003c/div>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"d0642e5e5246635656282a9a2c486e4d1eda07e64017a60a3cd23db606e31ea8"};</script>
<script>window.HandStudyGuide={"itemId":18254,"sourceHash":"bf4bafcf2c20dc33e51c5679bf9bec2d788bf1b74c60d1726d635c01341c8a6e","contentHash":"93027aa0f59e8b221bb3dac16f7c176364942133d3256ff9b86e174a9dbe65f1","overview":{"goal":"여섯째 항이 6이고 중간 네 항 중 짝수가 하나라는 조건으로 가능한 홀짝 배열을 나누어 초항을 모두 찾습니다.","firstLook":"점화식에서 다음다음 항은 현재 항의 홀짝에 따라 정해집니다. 여섯째 항을 만드는 넷째 항부터 거꾸로 경우를 나눕니다.","conditions":[{"label":"자연수 수열","meaning":"각 항은 양의 정수이므로 절반이 나오는 경우에는 현재 항이 짝수여야 합니다."},{"label":"짝수 한 항","meaning":"둘째부터 다섯째 항까지 정확히 한 항만 짝수입니다."}]},"chapters":[{"id":"c1","label":"넷째 항이 짝수인 경우를 풉니다","stepIds":["s1","s2","s3","s4"],"question":"넷째 항이 유일한 짝수라면 앞뒤 항은 어떻게 정해지나요?","hint":"여섯째 항은 넷째 항의 홀짝으로 정해집니다.","explanation":"\\(a_4\\)가 짝수이면 \\(a_6=a_4/2=6\\)이므로 \\(a_4=12\\)입니다. 나머지 \\(a_2,a_3,a_5\\)는 홀수입니다. \\(a_3\\)과 \\(a_2\\)가 홀수이므로 \\(a_5=a_4+a_3\\), \\(a_4=a_3+a_2\\)이고 \\(a_2+a_3=12\\)입니다. 양의 홀수쌍은 \\((1,11),(3,9),(5,7),(7,5),(9,3),(11,1)\\)입니다. 이제 \\(a_1\\)이 홀수라고 하면 점화식에서 \\(a_3=a_2+a_1\\)인데 두 항이 모두 홀수여서 \\(a_3\\)이 짝수가 되는 모순이 생깁니다. 따라서 \\(a_1\\)은 짝수이고 \\(a_3=a_1/2\\)이므로 가능한 값은 \\(22,18,14,10,6,2\\)입니다.","check":{"prompt":"\\(a_2+a_3=12\\)인 양의 홀수쌍이 여섯 개인 이유는 무엇인가요?","answer":"첫째 성분을 1, 3, 5, 7, 9, 11로 고르면 둘째 성분이 각각 11, 9, 7, 5, 3, 1로 하나씩 정해집니다."}},{"id":"c2","label":"넷째 항이 홀수인 경우를 풉니다","stepIds":["s5","s6","s7","s8"],"question":"유일한 짝수는 왜 셋째 항이어야 하나요?","hint":"넷째 항이 홀수이면 여섯째 항은 넷째 항과 다섯째 항의 합입니다.","explanation":"\\(a_4\\)가 홀수이면 \\(a_6=a_5+a_4=6\\)입니다. 합이 짝수이고 \\(a_4\\)가 홀수이므로 \\(a_5\\)도 홀수입니다. 만약 유일한 짝수가 \\(a_2\\)라면 \\(a_3\\)도 홀수이므로 점화식에서 \\(a_5=a_4+a_3\\)은 짝수가 되어 모순입니다. 따라서 유일한 짝수는 \\(a_3\\)이고 \\(a_5=a_3/2\\), \\(a_4=a_3+a_2\\)입니다. 그래서 \\(a_2+3a_3/2=6\\)입니다. 양의 자연수이며 \\(a_2\\)는 홀수, \\(a_3\\)은 짝수인 해는 \\((a_2,a_3)=(3,2)\\)뿐이고 \\((a_4,a_5)=(5,1)\\)입니다. 마지막으로 \\(a_1\\)이 홀수이면 \\(a_3=a_2+a_1>3\\)이므로 \\(a_3=2\\)와 모순입니다. 따라서 \\(a_1\\)은 짝수이고 \\(a_3=a_1/2\\)에서 \\(a_1=4\\)입니다.","check":{"prompt":"\\(a_3=4\\)를 넣으면 왜 안 되나요?","answer":"그러면 \\(a_2=0\\)이 되어 모든 항이 자연수라는 조건을 어깁니다."}},{"id":"c3","label":"초항을 빠짐없이 더합니다","stepIds":["s9"],"question":"두 경우에서 얻은 초항의 합은 얼마인가요?","hint":"첫 경우 여섯 값과 둘째 경우 한 값을 더하세요.","explanation":"첫 경우의 초항은 \\(2,6,10,14,18,22\\), 둘째 경우의 초항은 4입니다. 서로 다른 일곱 값을 모두 더하면 \\(2+6+10+14+18+22+4=76\\)입니다.","check":{"prompt":"초항 4가 첫 경우와 겹치지 않는 이유는 무엇인가요?","answer":"첫 경우의 초항은 모두 4로 나눈 나머지가 2이고, 4는 4의 배수이기 때문입니다."}}],"takeaway":["홀짝에 따라 식이 달라지는 점화식은 목표 항을 만드는 앞 항의 홀짝부터 나눕니다.","자연수 조건은 0이나 음수가 생기는 후보를 제외할 때 반드시 다시 사용합니다."]};</script>
