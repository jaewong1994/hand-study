<script>window.HandStudyRecord={"adminYear":2020,"answer":"39","contentHash":"4bf99148e4959d9c0bc4d1baa84ffe1dc8ba0a0b4b38646be793da91b53b5b32","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24761,"month":12,"number":30,"points":4,"preview":false,"questionHtml":"\u003cp>함수 \u003cspan class=\"heq\">\\(f(x)\\)\u003c/span>는 최고차항의 계수가 \u003cspan class=\"heq\">\\(1\\)\u003c/span>인 삼차함수이고, 함수 \u003cspan class=\"heq\">\\(g(x)\\)\u003c/span>는 일차함수이다. 함수 \u003cspan class=\"heq\">\\(h(x)\\)\u003c/span>를\u003c/p>\u003cp> \u003cspan class=\"heq\">\\(h(x) = \\begin{cases} | f(x) - g(x) | \\, (x&lt;1) \\\\ \\,f(x) + g(x) \\,(x \\geq 1) \\end{cases}\\)\u003c/span>\u003c/p>\u003cp>이라 하자. 함수 \u003cspan class=\"heq\">\\(h(x)\\)\u003c/span>가 실수 전체의 집합에서 미분가능하고, \u003cspan class=\"heq\">\\(h(0) = 0\\)\u003c/span>, \u003cspan class=\"heq\">\\(h(2) = 5\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(h(4)\\)\u003c/span>의 값을 구하시오. [4점]\u003c/p>","questionText":"함수 $f(x)$는 최고차항의 계수가 $1$인 삼차함수이고, 함수 $g(x)$는 일차함수이다. 함수 $h(x)$를\n $h(x) = \\begin{cases} | f(x) - g(x) | \\, (x\u003c1) \\\\ \\,f(x) + g(x) \\,(x \\geq 1) \\end{cases}$\n이라 하자. 함수 $h(x)$가 실수 전체의 집합에서 미분가능하고, $h(0) = 0$, $h(2) = 5$일 때, $h(4)$의 값을 구하시오. [4점]","sourceHash":"a6a218d60f9d826d71e26ee870452e82834c591e08ed12d6c1a9569da80b8cac","sourceKind":"csat","sourceLabel":"2020년 시행 수능 · 2021학년도 · 나형 · 30번","steps":[{"id":"s1","latex":"h(0)=0\\ \\Rightarrow\\ f(0)=g(0)"},{"id":"s2","latex":"|f-g|\\text{가 }0\\text{에서 미분가능하려면 }f\\prime(0)=g\\prime(0)"},{"id":"s3","latex":"f(x)-g(x)=x^2(x-k)\\quad(k\\text{는 실수})"},{"id":"s4","latex":"(\\mathrm I)\\ k\u003c1:\\quad x\\to1-\\text{일 때 }h(x)=f(x)-g(x)"},{"id":"s5","latex":"\\text{연속성에서 }g(1)=0,\\quad\\text{미분가능성에서 }g\\prime(1)=0\\ \\Rightarrow\\ g\\text{가 일차함수라는 조건에 모순}"},{"id":"s6","latex":"(\\mathrm {II})\\ k\\ge1:\\quad x\u003c1\\text{에서 }h(x)=g(x)-f(x)"},{"id":"s7","latex":"x=1\\text{에서 연속이고 미분가능하므로 }f(1)=f\\prime(1)=0"},{"id":"s8","latex":"f(x)=(x-1)^2(x+c),\\quad g(x)=px+q"},{"id":"s9","latex":"f(0)=g(0)\\ \\Rightarrow\\ q=c,\\quad f\\prime(0)=g\\prime(0)\\ \\Rightarrow\\ p=1-2c"},{"id":"s10","latex":"h(2)=2+c+2p+q=4-2c=5\\ \\Rightarrow\\ c=-\\frac12"},{"id":"s11","latex":"g(x)=2x-\\frac12,\\quad f(x)=(x-1)^2(x-\\frac12)"},{"id":"s12","latex":"f-g=x^2(x-\\tfrac52)\\ \\Rightarrow\\ k=\\frac52\\ge1\\text{이고 모든 미분가능 조건 만족}"},{"id":"s13","latex":"h(4)=9\\cdot\\frac72+8-\\frac12=\\boxed{39}"}],"track":"나형"};</script>
<script>window.HandStudyGuide={"itemId":24761,"sourceHash":"a6a218d60f9d826d71e26ee870452e82834c591e08ed12d6c1a9569da80b8cac","contentHash":"4bf99148e4959d9c0bc4d1baa84ffe1dc8ba0a0b4b38646be793da91b53b5b32","overview":{"goal":"절댓값 조각과 경계에서의 미분가능 조건으로 두 함수를 정해 \\(h(4)\\)를 구해요.","firstLook":"\\(h(0)=0\\)은 \\(f-g\\)가 \\(0\\)에서 중근이라는 뜻이에요. 그 뒤 \\(x=1\\)의 왼쪽에서 절댓값이 어느 부호로 풀리는지 나누어야 해요.","conditions":[{"label":"영점의 미분가능성","meaning":"\\(|f-g|\\)가 \\(0\\)에서 미분가능하려면 \\(f-g\\)의 값과 도함숫값이 모두 \\(0\\)이어야 해요."},{"label":"조각의 경계","meaning":"\\(x=1\\)에서 왼쪽 식과 오른쪽 식의 함숫값과 미분계수가 각각 같아야 해요."},{"label":"주어진 함숫값","meaning":"\\(h(2)=5\\)가 마지막으로 남은 상수를 정해요."}]},"chapters":[{"id":"c1","label":"영점에서 중근을 찾아요","stepIds":["s1","s2","s3"],"question":"\\(f(x)-g(x)\\)가 왜 \\(x^2(x-k)\\) 꼴일까요?","hint":"\\(h(0)=0\\)과 \\(|f-g|\\)의 미분가능성을 차례로 \\(f-g\\)에 옮겨 봐요.","explanation":"\\(h(0)=|f(0)-g(0)|=0\\)이므로 \\(f(0)=g(0)\\)이에요. 또 \\(|f-g|\\)가 영점 \\(x=0\\)에서 미분가능하려면 \\(f-g\\)가 부호를 바꾸며 뾰족하게 지나면 안 돼요. 따라서 \\(f'(0)=g'(0)\\)도 성립해 \\(0\\)은 \\(f-g\\)의 적어도 이중근이에요.\n\n\\(f\\)는 최고차항 계수가 \\(1\\)인 삼차함수이고 \\(g\\)는 일차함수이므로 \\(f-g\\)도 최고차항 계수가 \\(1\\)인 삼차함수예요. 남은 근을 \\(k\\)라 두면 \\(f(x)-g(x)=x^2(x-k)\\)로 쓸 수 있어요.","check":{"prompt":"\\(f(0)=g(0)\\)만으로는 왜 충분하지 않나요?","answer":"그 조건만 있으면 \\(f-g\\)에 \\(x\\)가 한 번만 곱해져 \\(0\\)을 지나며 부호가 바뀔 수 있고, 그러면 \\(|f-g|\\)의 그래프가 \\(0\\)에서 꺾여 미분가능하지 않기 때문이에요."}},{"id":"c2","label":"경계 왼쪽의 부호를 나눠요","stepIds":["s4","s5","s6","s7"],"question":"\\(k<1\\)은 왜 모순이고 \\(k\\ge1\\)에서는 어떤 조건이 남을까요?","hint":"\\(x\\)가 \\(1\\)보다 조금 작을 때 \\(x-k\\)의 부호로 절댓값을 먼저 풀어요.","explanation":"\\(k<1\\)이면 \\(1\\)의 바로 왼쪽에서 \\(x-k>0\\)이므로 \\(h(x)=f(x)-g(x)\\)예요. 오른쪽 식은 \\(f(x)+g(x)\\)이므로 연속성에서 \\(f(1)-g(1)=f(1)+g(1)\\), 즉 \\(g(1)=0\\)을 얻어요. 미분계수도 같아야 하므로 \\(f'(1)-g'(1)=f'(1)+g'(1)\\), 즉 \\(g'(1)=0\\)이에요. 그러면 \\(g\\)는 기울기가 \\(0\\)이고 \\(g(1)=0\\)인 영함수가 되어 일차함수라는 조건과 모순이에요.\n\n따라서 \\(k\\ge1\\)이에요. 이때 모든 \\(x<1\\)에서 \\(x-k<0\\)이므로 \\(h(x)=g(x)-f(x)\\)예요. \\(x=1\\)에서 연속이면 \\(g(1)-f(1)=f(1)+g(1)\\)이어서 \\(f(1)=0\\), 미분가능하면 \\(g'(1)-f'(1)=f'(1)+g'(1)\\)이어서 \\(f'(1)=0\\)이에요. 즉 \\(1\\)도 \\(f\\)의 이중근이에요.","check":{"prompt":"\\(k=1\\)일 때도 왼쪽에서 \\(h=g-f\\)라고 할 수 있나요?","answer":"네. \\(x<1=k\\)이므로 \\(x-k<0\\)이고, \\(f-g=x^2(x-k)<0\\)여서 절댓값을 풀면 \\(g-f\\)가 돼요."}},{"id":"c3","label":"계수를 정하고 원래 조건을 확인해요","stepIds":["s8","s9","s10","s11","s12","s13"],"question":"\\(h(2)=5\\)로 상수를 정한 뒤 \\(k\\ge1\\) 조건까지 어떻게 확인할까요?","hint":"\\(f\\)에는 \\(1\\)의 이중근을 넣고, \\(f(0)=g(0)\\), \\(f'(0)=g'(0)\\)을 차례로 써요.","explanation":"\\(f\\)는 최고차항 계수가 \\(1\\)이고 \\(1\\)이 이중근이므로 \\(f(x)=(x-1)^2(x+c)\\)로 두어요. \\(g(x)=px+q\\)라 하면 \\(f(0)=g(0)\\)에서 \\(q=c\\), \\(f'(0)=g'(0)\\)에서 \\(p=1-2c\\)를 얻어요.\n\n\\(2\\ge1\\)이므로 \\(h(2)=f(2)+g(2)\\)예요. 직접 넣으면 \\(f(2)=2+c\\), \\(g(2)=2(1-2c)+c=2-3c\\)이어서 \\(4-2c=5\\), 즉 \\(c=-\\frac12\\)이에요. 따라서\n\n\\(f(x)=(x-1)^2\\left(x-\\frac12\\right),\\qquad g(x)=2x-\\frac12\\)\n\n이고, 빼면 \\(f(x)-g(x)=x^2\\left(x-\\frac52\\right)\\)예요. 실제로 \\(k=\\frac52\\ge1\\)이므로 앞에서 택한 경우와 맞아요. 마지막으로 \\(h(4)=f(4)+g(4)=9\\cdot\\frac72+8-\\frac12=39\\)예요.","check":{"prompt":"계수를 구한 뒤 \\(f-g\\)를 다시 인수분해하는 이유는 무엇인가요?","answer":"처음 경우를 나눌 때 필요했던 \\(k\\ge1\\)이 실제로 만족되는지 확인해, 얻은 함수가 원래의 미분가능 조건을 빠짐없이 만족하는지 대조하려는 거예요."}}],"takeaway":["절댓값 안의 함수가 0이 되는 점에서 미분가능하려면 같은 인수가 몇 번 곱해졌는지 확인해요.","조각함수의 경계에서는 함숫값과 좌우 미분계수를 각각 맞춰요.","경우를 가정해 계수를 정했다면 마지막에 그 경우의 부등식과 원래 조건을 다시 확인해요."]};</script>
