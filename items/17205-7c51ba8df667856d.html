<script>window.HandStudyRecord={"itemId":17205,"sourceLabel":"2021 평가원 고3 수학기하 9월 29번","adminYear":2021,"grade":3,"month":9,"number":29,"track":"기하","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 한 변의 길이가 $8$인 정사각형 $A B C D$에 두 선분 $A B$, $C D$를 각각 지름으로 하는 두 반원이 붙어 있는 모양의 종이가 있다. 반원의 호 $A B$의 삼등분점 중 점 $B$에 가까운 점을 $P$라 하고, 반원의 호 $C D$를 이등분하는 점을 $Q$라 하자. 이 종이에서 두 선분 $A B$와 $C D$를 접는 선으로 하여 두 반원을 접어 올렸을 때 두 점 $P,\\,Q$에서 평면 $A B C D$에 내린 수선의 발을 각각 $G,\\,H$라 하면 두 점 $G,\\,H$는 정사각형 $A B C D$의 내부에 놓여 있고, ${\\overline{PG}}= \\sqrt{3}$, ${\\overline{QH}} =2 \\sqrt{3}$이다. 두 평면 $P C Q$와 $A B C D$가 이루는 각의 크기가 $\\theta$일 때, $70 \\times \\cos ^{2} \\theta$의 값을 구하시오. (단, 종이의 두께는 고려하지 않는다.) [4점]","answer":"40","sourceHash":"1590ac4a8d83c4fcb8780089aa3ff1287241dfbb88e76be48c10d23612fcba82","steps":[{"id":"s1","latex":"B=(0,0,0),\\ C=(8,0,0),\\ A=(0,8,0),\\ D=(8,8,0)"},{"id":"s2","latex":"P=(3,2,\\sqrt3),\\quad Q=(6,4,2\\sqrt3)"},{"id":"s3","latex":"G=(3,2,0),\\ H=(6,4,0)"},{"id":"s4","latex":"S_{GCH}=\\frac12|3(0-4)+8(4-2)+6(2-0)|=8"},{"id":"s5","latex":"PC=CQ=4\\sqrt2,\\ PQ=4"},{"id":"s6","latex":"S_{PCQ}=\\frac12\\cdot4\\cdot\\sqrt{(4\\sqrt2)^2-2^2}=4\\sqrt7"},{"id":"s7","latex":"\\cos\\theta=\\frac{S_{GCH}}{S_{PCQ}}=\\frac2{\\sqrt7}"},{"id":"s8","latex":"70\\cos^2\\theta=40"}],"diagram":null,"contentHash":"5312fe5bc8a7ccf0b4435a97d0e189d0e9eeb86a859e6b0a84641b45c8512840","questionHtml":"\u003cp class=\"hp htall\">그림과 같이 한 변의 길이가 \u003cspan class=\"heq\">\\(8\\)\u003c/span>인 정사각형 \u003cspan class=\"heq\">\\(A B C D\\)\u003c/span>에 두 선분 \u003cspan class=\"heq\">\\(A B\\)\u003c/span>, \u003cspan class=\"heq\">\\(C D\\)\u003c/span>를 각각 지름으로 하는 두 반원이 붙어 있는 모양의 종이가 있다. 반원의 호 \u003cspan class=\"heq\">\\(A B\\)\u003c/span>의 삼등분점 중 점 \u003cspan class=\"heq\">\\(B\\)\u003c/span>에 가까운 점을 \u003cspan class=\"heq\">\\(P\\)\u003c/span>라 하고, 반원의 호 \u003cspan class=\"heq\">\\(C D\\)\u003c/span>를 이등분하는 점을 \u003cspan class=\"heq\">\\(Q\\)\u003c/span>라 하자.\u003cbr>이 종이에서 두 선분 \u0
