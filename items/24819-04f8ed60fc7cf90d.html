  <script>window.HandStudyRecord={"adminYear":2022,"answer":"②","contentHash":"ac0b72d53f21f88fa0c393ca2c73c4d4a076c500e4a77d8902de57c8ecfe2423","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"itemId":24819,"month":11,"number":12,"points":4,"preview":false,"questionHtml":"\u003cp>실수 전체의 집합에서 연속인 함수 \u003cspan class=\"heq\">\\(f \\left( x \\right)\\)\u003c/span>가 다음 조건을 만족시킨다.\u003c/p>\u003cp>\u003cspan class=\"heq\">\\(n-1 \\leq x &lt;n\\)\u003c/span>일 때, \u003cspan class=\"heq\">\\(\\left| \\,f \\left( x \\right) \\,\\right| = \\left| \\,6 \\left( x-n + 1 \\right) \\left( x-n \\right) \\,\\right|\\)\u003c/span>이다.(단, \u003cspan class=\"heq\">\\(n\\)\u003c/span>은 자연수이다.)\u003c/p>\u003cp>열린구간 \u003cspan class=\"heq\">\\(\\left( \\,0, \\, 4 \\, \\right)\\)\u003c/span>에서 정의된 함수\u003c/p>\u003cp> \u003cspan class=\"heq\">\\(g \\left( x \\right) = \\int _{ 0} ^{ x} { f \\left( t \\right) }\\,dt - \\int _{ x} ^{4 } {f \\left( t \\right) }\\,dt\\)\u003c/span>\u003c/p>\u003cp>가 \u003cspan class=\"heq\">\\(x=2\\)\u003c/span>에서 최솟값 \u003cspan class=\"heq\">\\(0\\)\u003c/span>을 가질 때, \u003cspan class=\"heq\">\\(\\int _{ \\frac{1}{2} } ^{ 4} { f \\left( x \\right) }\\,dx\\)\u003c/span>의 값은? [4점]\u003c/p>\u003cdiv class=\"hchoices\">\u003cdiv class=\"hch\">① \u003cspan class=\"heq\">\\(- \\frac{3}{2}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">② \u003cspan class=\"heq\">\\(- \\frac{1}{2}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">③ \u003cspan class=\"heq\">\\(\\frac{1}{2}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">④ \u003cspan class=\"heq\">\\(\\frac{3}{2}\\)\u003c/span>\u003c/div>\u003cdiv class=\"hch\">⑤ \u003cspan class=\"heq\">\\(\\frac{5}{2}\\)\u003c/span>\u003c/div>\u003c/div>","questionText":"실수 전체의 집합에서 연속인 함수 $f \\left( x \\right)$가 다음 조건을 만족시킨다.\n$n-1 \\leq x \u003cn$일 때, $\\left| \\,f \\left( x \\right) \\,\\right| = \\left| \\,6 \\left( x-n + 1 \\right) \\left( x-n \\right) \\,\\right|$이다.(단, $n$은 자연수이다.)\n열린구간 $\\left( \\,0, \\, 4 \\, \\right)$에서 정의된 함수\n $g \\left( x \\right) = \\int _{ 0} ^{ x} { f \\left( t \\right) }\\,dt - \\int _{ x} ^{4 } {f \\left( t \\right) }\\,dt$\n가 $x=2$에서 최솟값 $0$을 가질 때, $\\int _{ \\frac{1}{2} } ^{ 4} { f \\left( x \\right) }\\,dx$의 값은? [4점]\n① $- \\frac{3}{2}$ ② $- \\frac{1}{2}$ ③ $\\frac{1}{2}$ ④ $\\frac{3}{2}$ ⑤ $\\frac{5}{2}$","sourceHash":"5615aab1e58a4473476130cfe0a8bbe372ea1e2419fbbac4527f5173b6d13b48","sourceKind":"csat","sourceLabel":"2022년 시행 수능 · 2023학년도 · 공통 · 12번","steps":[{"id":"s1","latex":"f(x)=s_n6(x-n+1)(n-x)\\quad(n-1\u003cx\u003cn),\\quad s_n=\\pm1"},{"id":"s2","latex":"\\text{연속이고 각 열린구간에서 }|f|>0\\text{이므로 }s_n\\text{은 구간 안에서 일정}"},{"explanation":{"body":"\\(u=x-n+1\\)로 놓으면 왼쪽 끝 \\(x=n-1\\)은 \\(u=0\\), 오른쪽 끝 \\(x=n\\)은 \\(u=1\\)이 돼요. 또 \\(n-x=1-u\\), \\(dx=du\\)라서 모든 구간의 넓이를 똑같은 적분으로 계산할 수 있어요. 평행이동된 식에서는 변수뿐 아니라 두 끝점도 같이 바꾸는 게 핵심이에요.","skillTags":["integration.substitution"],"title":"구간이 달라도 넓이가 같아요"},"id":"s3","latex":"\\int_{n-1}^n6(x-n+1)(n-x)\\,dx=\\int_0^16u(1-u)\\,du=1"},{"id":"s4","latex":"\\mathrm F(x)=\\int_0^xf(t)\\,dt\\ \\Rightarrow\\ g(x)=2\\mathrm F(x)-\\mathrm F(4),\\quad g\\prime(x)=2f(x)"},{"id":"s5","latex":"x=2\\text{에서 최소이므로 }s_2=-1,\\quad s_3=1"},{"id":"s6","latex":"g(2)=0\\ \\Rightarrow\\ 2(s_1-1)-(s_1+s_4)=0\\ \\Rightarrow\\ s_1-s_4=2"},{"id":"s7","latex":"s_1=1,\\quad s_4=-1\\ \\Rightarrow\\mathrm F(4)=0"},{"id":"s8","latex":"\\int_{1/2}^4f(x)\\,dx=-\\int_0^{1/2}6x(1-x)\\,dx=-\\left[3x^2-2x^3\\right]_0^{1/2}"},{"id":"s9","latex":"=\\boxed{-\\frac12}\\quad\\text{②}"}],"track":"공통"};</script>
