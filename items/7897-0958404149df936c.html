<script>window.HandStudyRecord={"itemId":7897,"sourceLabel":"2019 교육청 고2 수학나형 9월 30번","adminYear":2019,"grade":2,"month":9,"number":30,"track":"수학나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"자연수 $n\\,$에 대하여 함수 $f \\left( x \\right) \\,$는 $f \\left( x \\right) \\,=x ^{2} +n$ 이다. 함수 $y=f \\left( x \\right) \\,$의 그래프와 직선 $y=mx\\,$가 만나도록 하는 자연수 $m\\,$의 최솟값을 $a _{n} \\,$이라 하자. $a _{n} \u003ca _{n+1} \\,$을 만족시키는 $33$ 이하의 모든 $n\\,$의 값의 합을 구하시오. [4점]","answer":"125","sourceHash":"3ac4709ab96f0379649d831b21d4c83252ae21192a7f3731d68cdf980c3dcfe8","steps":[{"id":"s1","latex":"x^2-mx+n=0\\text{ has a real root}\\iff m^2\\ge4n"},{"id":"s2","latex":"a_n\u003ca_{n+1}\\iff4n\\le k^2\\le4n+3"},{"id":"s3","latex":"n=j^2\\text{ or }n=j(j+1)"},{"id":"s4","latex":"n\\le33:\\quad1,4,9,16,25,2,6,12,20,30"},{"id":"s5","latex":"\\sum n=125"}],"diagram":null,"contentHash":"54f63a9e7ea7ddcce4d8407887756bb991cd49a2807f0b4ba17f6328a91de5a3","questionHtml":"\u003cp class=\"hp\">자연수 \u003cspan class=\"heq\">\\(n\\,\\)\u003c/span>에 대하여 함수 \u003cspan class=\"heq\">\\(f \\left( x \\right) \\,\\)\u003c/span>는\u003cbr>&emsp;&emsp;\u003cspan class=\"heq\">\\(f \\left( x \\right) \\,=x^{2} +n\\)\u003c/span>\u003cbr>이다. 함수 \u003cspan class=\"heq\">\\(y=f \\left( x \\right) \\,\\)\u003c/span>의 그래프와 직선 \u003cspan class=\"heq\">\\(y=mx\\,\\)\u003c/span>가 만나도록 하는\u003cbr>자연수 \u003cspan class=\"heq\">\\(m\\,\\)\u003c/span>의 최솟값을 \u003cspan class=\"heq\">\\(a_{n} \\,\\)\u003c/span>이라 하자. \u003cspan class=\"heq\">\\(a_{n} \\lt a_{n+1} \\,\\)\u003c/span>을 만족시키는 \u003cspan class=\"heq\">\\(33\\)\u003c/span> 이하의 모든 \u003cspan class=\"heq\">\\(n\\,\\)\u003c/span>의 값의 합을 구하시오. \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"0958404149df936c68adad9c4760063c500241b0a330b83c9afe163f9bb54854"};</script>
<script>window.HandStudyGuide={"itemId":7897,"sourceHash":"3ac4709ab96f0379649d831b21d4c83252ae21192a7f3731d68cdf980c3dcfe8","contentHash":"54f63a9e7ea7ddcce4d8407887756bb991cd49a2807f0b4ba17f6328a91de5a3","overview":{"goal":"교점이 생기는 최소 자연수 기울기가 증가하는 지점을 완전제곱수로 판정해 합해요.","firstLook":"교점 조건은 이차방정식의 판별식이 음이 아닌 조건이고, 최소 기울기는 제곱의 경계를 처음 넘는 자연수예요.","conditions":[{"label":"교점 존재","meaning":"방정식이 실근을 하나 이상 가져야 해요."},{"label":"증가 조건","meaning":"이웃한 두 항 사이에서 최소 자연수 기울기가 한 단계 커지는 경우만 찾아요."}]},"chapters":[{"id":"c1","label":"판별식으로 최소 기울기를 읽어요","stepIds":["s1"],"question":"직선과 포물선이 만나려면 m과 n이 어떤 부등식을 만족해야 할까요?","hint":"두 식을 같게 놓아 x에 대한 이차방정식을 만드세요.","explanation":"교점의 x좌표는 \\(x^2+n=mx\\), 곧 \\(x^2-mx+n=0\\)의 실근이에요. 판별식은 \\(m^2-4n\\)이므로 교점이 존재할 조건은 \\(m^2\\ge4n\\)이에요.\n\n따라서 \\(a_n\\)은 \\(m^2\\ge4n\\)을 처음 만족시키는 자연수 \\(m\\), 즉 \\(2\\sqrt n\\) 이상인 가장 작은 자연수예요.","check":{"prompt":"판별식이 0인 접하는 경우도 교점이 있는 것으로 세나요?","answer":"네. 서로 다른 교점 수를 묻지 않았으므로 실근 하나인 접점도 만나는 경우예요."}},{"id":"c2","label":"증가하는 경계를 제곱수로 잡아요","stepIds":["s2","s3"],"question":"최소 기울기가 다음 항에서 커진다는 것은 어떤 제곱수가 끼어 있다는 뜻일까요?","hint":"현재 최소 기울기를 한 자연수로 두고 두 판별식 경계를 비교하세요.","explanation":"\\(a_n<a_{n+1}\\)이면 어떤 자연수 \\(k\\)의 제곱이 \\(4n\\) 이상이지만 \\(4(n+1)\\)보다는 작아야 해요. 정수 제곱이므로 \\(4n\\le k^2\\le4n+3\\)이에요.\n\n\\(k=2j\\)가 짝수이면 \\(k^2=4j^2\\)이고 이 구간의 4의 배수는 \\(4n\\)뿐이므로 \\(n=j^2\\)예요. \\(k=2j+1\\)이 홀수이면 \\(k^2=4j(j+1)+1\\)이고, 부등식은 \\(n=j(j+1)\\)일 때 성립해요.","check":{"prompt":"그 자연수가 짝수인 경우 원래 항이 완전제곱수가 되는 이유는 무엇인가요?","answer":"그 자연수의 제곱은 4의 배수이고, 해당 네 정수 구간에 있는 4의 배수는 맨 앞의 수 하나뿐이기 때문이에요."}},{"id":"c3","label":"33 이하의 값을 적어 합해요","stepIds":["s4","s5"],"question":"두 꼴에서 33 이하인 n은 무엇이고 합은 얼마인가요?","hint":"j를 1부터 늘리며 제곱수와 이웃한 두 수의 곱을 따로 적으세요.","explanation":"\\(n=j^2\\le33\\)에서는 \\(1,4,9,16,25\\)가 나와요. \\(n=j(j+1)\\le33\\)에서는 \\(2,6,12,20,30\\)이 나와요. 다음 값은 각각 \\(36\\), \\(42\\)라 범위를 넘어요.\n\n두 목록은 하나는 완전제곱수, 다른 하나는 연속한 두 양의 정수의 곱이어서 겹치지 않아요. 합은 \\(1+4+9+16+25+2+6+12+20+30=125\\)예요.","check":{"prompt":"목록의 다음 값을 확인해야 하는 이유는 무엇인가요?","answer":"33 이하인 값을 모두 적었고 더 빠진 값이 없다는 끝점 확인을 위해서예요."}}],"takeaway":["최소 자연수 조건은 제곱의 문턱을 넘는 첫 정수로 바꿔요.","연속한 두 항 사이에서 값이 바뀌면 그 사이에 정수 제곱 경계가 있어요.","짝수 제곱과 홀수 제곱을 나누면 완전제곱수와 연속한 두 수의 곱이 나와요."]};</script>
