  <script>window.HandStudyRecord={"itemId":17983,"sourceLabel":"2024 교육청 고3 수학확통 10월 30번","adminYear":2024,"grade":3,"month":10,"number":30,"track":"확통","points":4,"scoreStatus":"confirmed_4_direct","questionText":"수직선의 원점에 점 $P\\,$가 있다. 주머니에는 숫자 $1$, $2$, $3$, $4\\,$가 하나씩 적힌 $4\\,$장의 카드가 들어 있다. 이 주머니를 사용하여 다음 시행을 한다.\n주머니에서 임의로 한 장의 카드를 꺼내어 카드에 적힌 수를 확인한 후 다시 주머니에 넣는다. 확인한 수 $k\\,$가 홀수이면 점 $P\\,$를 양의 방향으로 $k\\,$만큼 이동시키고, 짝수이면 점 $P\\,$를 음의 방향으로 $k\\,$만큼 이동시킨다.\n이 시행을 $4\\,$번 반복한 후 점 $P\\,$의 좌표가 $0$ 이상일 때, 확인한 네 개의 수의 곱이 홀수일 확률은 $\\frac{q}{p}\\,$이다. $p+q\\,$의 값을 구하시오. (단, $p\\,$와 $q\\,$는 서로소인 자연수이다.) [4점]","answer":"61","sourceHash":"517f11d450dd3c528e5053a4a4812ad827931d7e39eae5975f2c48ebb492b040","steps":[{"id":"s1","latex":"B=\\{\\text{네 카드 모두 홀수}\\}\\subset A=\\{\\text{최종 위치}\\ge0\\}"},{"id":"s2","latex":"n(A\\cap B)=2^4=16"},{"id":"s3","latex":"\\text{짝수 1장}:\\quad4\\{1+(3+3+1)2\\}=60"},{"id":"s4","latex":"\\text{짝수 2장}:\\quad{4\\choose2}(2+2+1)=30"},{"id":"s5","latex":"\\text{짝수 }3\\text{장 이상}:\\quad\\text{왼쪽 이동}\\ge6>\\text{오른쪽 이동}\\le3\\Rightarrow\\text{제외}"},{"id":"s6","latex":"P(B\\mid A)=\\frac{16}{16+60+30}=\\frac8{53}\\Rightarrow p+q=61"}],"diagram":null,"contentHash":"79a916fd56e47a65dc6c6ec43ffa37029833c9daeffedc513ef833c41f0de6d0","questionHtml":"\u003cp class=\"hp\">수직선의 원점에 점 \u003cspan class=\"heq\">\\(P\\,\\)\u003c/span>가 있다. 주머니에는 숫자 \u003cspan class=\"heq\">\\(1\\)\u003c/span>, \u003cspan class=\"heq\">\\(2\\)\u003c/span>, \u003cspan class=\"heq\">\\(3\\)\u003c/span>, \u003cspan class=\"heq\">\\(4\\,\\)\u003c/span>가 하나씩 적힌 \u003cspan class=\"heq\">\\(4\\,\\)\u003c/span>장의 카드가 들어 있다. 이 주머니를 사용하여 다음 시행을 한다.\u003c/p>\u003cdiv class=\"hbox\">\u003cp class=\"hp\">주머니에서 임의로 한 장의 카드를 꺼내어 카드에 적힌 수를 확인한 후 다시 주머니에 넣는다. 확인한 수 \u003cspan class=\"heq\">\\(k\\,\\)\u003c/span>가 홀수이면 점 \u003cspan class=\"heq\">\\(P\\,\\)\u003c/span>를 양의 방향으로 \u003cspan class=\"heq\">\\(k\\,\\)\u003c/span>만큼 이동시키고, 짝수이면 점 \u003cspan class=\"heq\">\\(P\\,\\)\u003c/span>를 음의 방향으로 \u003cspan class=\"heq\">\\(k\\,\\)\u003c/span>만큼 이동시킨다.\u003c/p>\u003c/div>\u003cp class=\"hp htall\">이 시행을 \u003cspan class=\"heq\">\\(4\\,\\)\u003c/span>번 반복한 후 점 \u003cspan class=\"heq\">\\(P\\,\\)\u003c/span>의 좌표가 \u003cspan class=\"heq\">\\(0\\)\u003c/span> 이상일 때, 확인한 네 개의 수의 곱이 홀수일 확률은 \u003cspan class=\"heq\">\\(\\dfrac{q}{p}\\,\\)\u003c/span>이다. \u003cspan class=\"heq\">\\(p+q\\,\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(p\\,\\)\u003c/span>와 \u003cspan class=\"heq\">\\(q\\,\\)\u003c/span>는 서로소인 자연수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig\" src=\"../assets/figures/f85555cf61f9fab0602195ed.png\" style=\"width:209px;max-width:100%\">\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"7bef7bf8763d2ae8e8eb91d250b18dcd99916d65ef1a1ec71c1f0955c356a49e"};</script>
