<script>window.HandStudyRecord={"itemId":16457,"sourceLabel":"2019 교육청 고3 수리나형 5월 27번","adminYear":2019,"grade":3,"month":5,"number":27,"track":"수리나형","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 6개의 주머니 중에서 3개의 주머니에는 흰 공만 2개씩 들어 있고, 2개의 주머니에는 검은 공만 2개씩 들어 있으며, 1개의 주머니에는 흰 공과 검은 공이 각각 1개씩 들어있다. 이 6개의 주머니 중에서 임의로 2개를 선택하여 두 주머니 속에 있는 공을 모두 꺼낸다. 꺼낸 공에 흰 공이 1개 이상 있을 때, 검은 공도 1개 이상 있을 확률은 $\\frac{q}{p}$이다. $p+q$의 값을 구하시오. (단, $p$와 $q$는 서로소인 자연수이다.) [4점]","answer":"25","sourceHash":"16ec00e8ff0bf493372f4375780df8e31d6b1e37bb4924e9442b67ae34693d86","steps":[{"id":"s1","latex":"A=\\{\\text{흰 공이 하나 이상}\\},\\quad B=\\{\\text{검은 공이 하나 이상}\\}"},{"id":"s2","latex":"P(A^c)=\\dfrac{{}_2\\mathrm C_2}{{}_6\\mathrm C_2}=\\dfrac1{15}\\Rightarrow P(A)=\\dfrac{14}{15}"},{"id":"s3","latex":"P(B^c)=\\dfrac{{}_3\\mathrm C_2}{{}_6\\mathrm C_2}=\\dfrac3{15}"},{"id":"s4","latex":"A^c\\cap B^c=\\varnothing\\Rightarrow P(A\\cap B)=1-\\dfrac1{15}-\\dfrac3{15}=\\dfrac{11}{15}"},{"id":"s5","latex":"P(B\\mid A)=\\dfrac{11/15}{14/15}=\\dfrac{11}{14}"},{"id":"s6","latex":"p+q=14+11=25"}],"diagram":null,"contentHash":"20371d248026f9335d26926b7c183da3cf1edcc0343c0f3b1f9981b86bc058ca","questionHtml":"\u003cp class=\"hp htall\">그림과 같이 6개의 주머니 중에서 3개의 주머니에는 흰 공만 2개씩 들어 있고, 2개의 주머니에는 검은 공만 2개씩 들어 있으며, 1개의 주머니에는 흰 공과 검은 공이 각각 1개씩 들어있다. 이 6개의 주머니 중에서 임의로 2개를 선택하여 두 주머니 속에 있는 공을 모두 꺼낸다. 꺼낸 공에 흰 공이 1개 이상 있을 때, 검은 공도 1개 이상 있을 확률은 \u003cspan class=\"heq\">\\(\\dfrac{q}{p}\\)\u003c/span>이다. \u003cspan class=\"heq\">\\(p+q\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(p\\)\u003c/span>와 \u003cspan class=\"heq\">\\(q\\)\u003c/span>는 서로소인 자연수이다.) \u003cspan class=\"hscore\">[4점]\u003c/span>\u003c/p>\u003cp class=\"hp\">\u003cimg class=\"hfig hfigr\" src=\"../assets/figures/f094501756f75d5be21f39f4.png\" style=\"float:right;margin:4px 0 8px 12px;width:392px;max-width:45%\">\u003c/p>","preview":false,"graphPlan":null,"graphHash":"","editionHash":"1609d8783a2a1488a987efe026e816e08491e
