  <script>window.HandStudyRecord={"itemId":7984,"sourceLabel":"2020 교육청 고2 수학 9월 27번","adminYear":2020,"grade":2,"month":9,"number":27,"track":"수학","points":4,"scoreStatus":"confirmed_4_direct","questionText":"그림과 같이 반지름의 길이가 ${2}{{from^2020^09^인천교고2^중}}$이고 중심각의 크기가 $\\frac{3}{2}\\pi$인 부채꼴 $OBA$가 있다. 호 $BA$ 위에 점 $P$를 $\\angle {BAP}=\\frac{\\pi}{6}$가 되도록 잡고, 점 $B$에서 선분 $AP$에 내린 수선의 발을 $H$라 할 때, ${\\overline{OH}}^{2}$의 값은 $m+n \\sqrt{3}$이다. $m^{2}+n^{2}$의 값을 구하시오. (단, $m$, $n$은 유리수이다.) [4점]","answer":"20","sourceHash":"a2a3cc4dc8faf289d9ce99e14f73bc8cff64c15fad57c8d8a9eb74a4358f14be","steps":[{"id":"s1","latex":"\\angle AOB=2\\pi-\\dfrac{3\\pi}{2}=\\dfrac\\pi2"},{"id":"s2","latex":"O=(0,0),\\quad A=(2,0),\\quad B=(0,2)"},{"id":"s3","latex":"\\angle BAP=\\dfrac\\pi6\\Rightarrow\\angle BOP=\\dfrac\\pi3"},{"id":"s4","latex":"P=(-\\sqrt3,1)"},{"id":"s5","latex":"H=\\operatorname{proj}_{AP}B=\\left(\\dfrac{1-\\sqrt3}{2},\\dfrac{3-\\sqrt3}{2}\\right)"},{"id":"s6","latex":"OH^2=4-2\\sqrt3\\Rightarrow (m,n)=(4,-2)"},{"id":"s7","latex":"m^2+n^2=20"}],"diagram":null,"contentHash":"24f94dea291c8ecc07762b31467f91ada2fda75ed994b3d97bcb9dc89852e862","questionHtml":"\u003cp class=\"hp htall\">그림과 같이 반지름의 길이가 \u003cspan class=\"heq\">\\({2}\\)\u003c/span>이고 중심각의 크기가 \u003cspan class=\"heq\">\\(\\dfrac{3}{2}\\pi\\)\u003c/span>인 부채꼴 \u003cspan class=\"heq\">\\(O B A\\)\u003c/span>가 있다. 호 \u003cspan class=\"heq\">\\(B A\\)\u003c/span> 위에 점 \u003cspan class=\"heq\">\\(P\\)\u003c/span>를 \u003cspan class=\"heq\">\\(\\angle {B A P}=\\dfrac{\\pi}{6}\\)\u003c/span>가 되도록 잡고, 점 \u003cspan class=\"heq\">\\(B\\)\u003c/span>에서 선분 \u003cspan class=\"heq\">\\(A P\\)\u003c/span>에 내린 수선의 발을 \u003cspan class=\"heq\">\\(H\\)\u003c/span>라 할 때, \u003cspan class=\"heq\">\\({\\overline{O H}}^{2}\\)\u003c/span>의 값은 \u003cspan class=\"heq\">\\(m+n \\sqrt{3}\\)\u003c/span>이다. \u003cspan class=\"heq\">\\(m^{2}+n^{2}\\)\u003c/span>의 값을 구하시오. (단, \u003cspan class=\"heq\">\\(m\\)\u003c/span>, \u003cspan class=\"he
