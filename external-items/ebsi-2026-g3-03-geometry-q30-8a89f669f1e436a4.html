<script>window.HandStudyGuide={"sourceKey":"ebsi:2026:g3:03:geometry:q30","sourceHash":"eee23074e3cc98447e954ea9a9ac7fb62f9b2f334e9b8d7bcc428e9deb2666ed","contentHash":"c03193d87722709ca15d0caab359518e1378971bd207845470fdc5a90a22f843","overview":{"firstLook":"쌍곡선은 \\(b^2=2a^2\\)이므로 초점거리는 \\(c=\\sqrt3a\\)예요. \\(x=-c\\)인 점 P에서 초점거리 차가 \\(2a\\)이고 \\(P,F,F^\\prime\\)의 거리 관계를 쓰면 \\(F^\\prime P=2a,FP=4a\\), 따라서 \\(\\angle F^\\prime FP=\\pi/6\\)이에요.","goal":"쌍곡선과 타원의 초점 성질을 이어 붙여 두 장축을 구해요.","conditions":[{"meaning":"쌍곡선 거리차 2a와 삼각형의 각 조건으로 두 거리를 확정해요.","label":"쌍곡선의 초점거리를 정해요"},{"meaning":"타원의 거리합과 수선 H가 만든 같은 길이를 연결한 결과예요.","label":"타원의 거리합을 선분합으로 바꿔요"}]},"chapters":[{"question":"P에서 두 초점까지 거리가 2a,4a인 이유는 무엇인가요?","check":{"prompt":"P에서 두 초점까지 거리가 2a,4a인 이유는 무엇인가요?","answer":"\\(P=(-\\sqrt3a,2a)\\)이므로 \\(F'P=2a\\)이고, 왼쪽 가지의 거리차에서 \\(FP-F'P=2a\\)라 \\(FP=4a\\)예요."},"stepIds":["s1","s2","s3","s4"],"id":"c1","explanation":"쌍곡선은 \\(b^2=2a^2\\)이므로 초점거리는 \\(c=\\sqrt3a\\)예요. \\(x=-c\\)인 점 P에서 초점거리 차가 \\(2a\\)이고 \\(P,F,F^\\prime\\)의 거리 관계를 쓰면 \\(F^\\prime P=2a,FP=4a\\), 따라서 \\(\\angle F^\\prime FP=\\pi/6\\)이에요.","hint":"쌍곡선의 거리차와 \\(x=-c\\)인 위치를 함께 사용해요.","label":"쌍곡선의 초점거리를 정해요"},{"question":"AQ+FQ가 AH+FH로 바뀌는 기하 관계는 무엇인가요?","check":{"prompt":"AQ+FQ가 AH+FH로 바뀌는 기하 관계는 무엇인가요?","answer":"\\(H\\)와 \\(Q\\)가 같은 타원 위에 있으므로 두 점에서 초점 \\(A,F\\)까지의 거리합이 같아요."},"stepIds":["s5","s6","s7"],"id":"c2","explanation":"\\(FA=(\\sqrt3+1)a\\)이고 \\(\\angle AFH=\\pi/6\\)인 직각삼각형에서 \\(AH=FA/2=(\\sqrt3+1)a/2\\), \\(FH=FA\\sqrt3/2=(3+\\sqrt3)a/2\\)예요. 문제에서 \\(H\\)가 초점 \\(A,F\\)인 타원 위의 점이므로 타원의 거리합은 \\(AH+FH=(2+\\sqrt3)a\\)예요. 따라서 같은 타원 위의 \\(Q\\)에서도 \\(AQ+FQ=(2+\\sqrt3)a\\)예요.","hint":"타원의 초점 A,F와 점 H,Q의 위치를 그림에서 따라가요.","label":"타원의 거리합을 선분합으로 바꿔요"},{"question":"\\(a=2\\sqrt{3}\\)을 장축 식에 넣으면 왜 \\(6+4\\sqrt{3}\\)인가요?","check":{"prompt":"\\(a=2\\sqrt{3}\\)을 장축 식에 넣으면 왜 \\(6+4\\sqrt{3}\\)인가요?","answer":"\\(4\\sqrt{3}+6\\)으로 정리되어 \\(p=6,q=4\\)예요."},"stepIds":["s8","s9","s10"],"id":"c3","explanation":"쌍곡선 성질 \\(F^\\prime Q-FQ=2a\\)를 더하면 \\(AQ+F^\\prime Q=(4+\\sqrt3)a=6+8\\sqrt3\\)예요. 여기서 \\(a=2\\sqrt3\\), 타원 장축은 \\((2+\\sqrt3)a=6+4\\sqrt3\\), 따라서 \\(p^2+q^2=36+16=52\\)예요.","hint":"\\((2+\\sqrt{3})·2\\sqrt{3}\\)을 항별로 곱해요.","label":"두 장축을 수치로 확정해요"}],"takeaway":["P와 Q가 지정된 사분면에 있는 가지를 사용했다.","쌍곡선의 거리 차 부호를 점 위치로 확인했다.","p,q가 유리수 조건과 맞는다."]};</script>
