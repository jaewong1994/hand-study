<script>window.ExternalHandStudyRecord={"adminYear":2026,"answer":"31","contentHash":"e98913567e5a01423fa63f03f51187ac2bae12070c312c53d03ff6ec1fe78e12","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"learningHash":"d42c743d6950002bc2242387832f5013fb7c84d4832c6475d804316b06b427d7","month":5,"number":30,"preview":false,"questionHtml":"\u003cfigure class=\"hfigwrap\">\u003cimg class=\"hfig\" src=\"../assets/external2026/ebsi-2026-g3-05-calculus-q30-14752ed8ff36416b.png\" alt=\"2026년 5월 30번 문제\">\u003c/figure>","sourceHash":"5047c87a26ba0c9e93d0dd3d04ffcdf1b8d60faf4ab9ea2ef8c6115e0aa52bbf","sourceKey":"ebsi:2026:g3:05:calculus:q30","sourceLabel":"경기도교육청 2026-05-07","stepExplanations":{"s2":{"body":"최고차항 계수가 양수인 삼차함수가 역함수를 가지므로 \\(f\\)와 \\(g\\)는 증가해요. \\(g(k)=0\\)의 오른쪽에서는 \\(g(x)>0\\), 왼쪽에서는 \\(g(x)\u003c0\\)입니다. \\(x\\ne k\\)에서 \\(h(x)=x\\frac{\\ln(1+3|g(x)|)}{g(x)}\\)이고, \\(\\lim_{v\\to0}\\frac{\\ln(1+v)}v=1\\)을 쓰면 오른쪽 극한은 \\(3k\\), 왼쪽은 \\(-3k\\)예요. \\(h-|g|\\)가 미분가능하면 연속이고 \\(|g|\\)도 연속이므로 두 값이 같아야 해요. 따라서 \\(k=0\\), 연속성에서 \\(h(0)=0\\)입니다.","skillTags":["continuity.boundary","limit.logarithm"],"title":"먼저 연속 조건으로 경계의 위치를 정해요"},"s4":{"body":"\\(f(0)=0\\)이고 증가하므로 \\(f^{\\prime}(0)\\ge0\\)예요. 만약 \\(f^{\\prime}(0)=0\\)이면 \\(y=g(x)\\)로 놓았을 때 \\(\\frac{g(x)}x=\\frac y{f(y)}\\)는 \\(x\\to0+\\)에서 한없이 커져요. 그런데 \\(\\frac{h(x)}x\\to3\\)이므로 \\(\\frac{h(x)-|g(x)|}{x}\\)는 유한한 값으로 수렴하지 못해 미분가능 조건과 맞지 않습니다. 따라서 \\(f^{\\prime}(0)>0\\)이고 \\(g^{\\prime}(0)=\\frac1{f^{\\prime}(0)}\\)을 쓸 수 있어요.\n\n오른쪽 미분계수는 \\(3-g^{\\prime}(0)\\), 왼쪽은 \\(-3+g^{\\prime}(0)\\)이에요. 둘을 같게 놓으면 \\(g^{\\prime}(0)=3\\), \\(f^{\\prime}(0)=\\frac13\\)입니다.","skillTags":["derivative.inverse","derivative.one-sided","equation.denominator"],"title":"역함수 미분을 쓰기 전에 분모가 0인지 확인해요"},"s6":{"body":"최고차항의 계수가 1인 삼차함수를 \\(x^3+ax^2+cx+d\\)라 쓰면 \\(f(0)=0\\)에서 \\(d=0\\), \\(f^{\\prime}(0)=\\frac13\\)에서 \\(c=\\frac13\\)이에요. 따라서 아직 모르는 계수는 \\(a\\) 하나만 남습니다.","skillTags":["polynomial.coefficients"],"title":"이미 구한 값으로 삼차함수의 두 계수를 고정해요"},"s8":{"body":"\\(g(f(1))=1\\)이므로 조건에서 이 점의 역함수 미분계수가 존재하므로, 합성함수를 미분한 식의 곱이 1이라는 사실에 따라 분모가 0일 수 없어요. 역함수 미분식의 분모는 \\(f^{\\prime}(1)\\)이에요. 따라서 \\(g^{\\prime}(f(1))=\\frac1{3+2a+1/3}=\\frac3{6a+10}\\)입니다. 조건에 넣으면 \\(\\frac{12}{6a+10}=3a\\)이고, 분모가 0이 아님을 확인한 상태에서 곱하면 \\(3a^2+5a-2=0\\), 즉 \\((3a-1)(a+2)=0\\)을 얻어요.","skillTags":["derivative.inverse","equation.quadratic"],"title":"역함수의 대응점을 맞춰 조건에 대입해요"},"s9":{"body":"\\(f\\)는 증가하므로 모든 실수에서 \\(f^{\\prime}(x)=3x^2+2ax+\\frac13\\ge0\\)이어야 해요. 위로 열린 이차식이 항상 0 이상일 조건은 판별식 \\((2a)^2-4\\cdot3\\cdot\\frac13\\le0\\), 즉 \\(-1\\le a\\le1\\)입니다. 앞에서 구한 \\(a=\\frac13,-2\\) 중 \\(-2\\)를 버리면 \\(a=\\frac13\\)이고, 이 값에서는 도함수의 판별식이 음수여서 실제로 항상 증가해요.","skillTags":["derivative.monotonicity","quadratic.discriminant"],"title":"역함수가 존재한다는 조건으로 남은 해를 골라요"}},"steps":[{"id":"s1","latex":"h(x)-|g(x)|\\text{의 연속}\\Rightarrow h\\text{도 }x=k\\text{에서 연속}"},{"id":"s2","latex":"\\lim_{x\\to k+}h(x)=3k,\\quad\\lim_{x\\to k-}h(x)=-3k\\Rightarrow k=0"},{"id":"s3","latex":"f(0)=g(0)=0"},{"id":"s4","latex":"h-|g|\\text{의 미분가능}\\Rightarrow3-g'(0)=-3+g'(0)"},{"id":"s5","latex":"g'(0)=3\\Rightarrow f'(0)=\\frac13"},{"id":"s6","latex":"f(x)=x^3+ax^2+\\frac13x"},{"id":"s7","latex":"f(1)=a+\\frac43,\\quad g'(f(1))=\\frac1{f'(1)}=\\frac3{6a+10}"},{"id":"s8","latex":"4g'(f(1))=3f(1)-4\\Rightarrow3a^2+5a-2=0"},{"id":"s9","latex":"f'(x)\\ge0\\Rightarrow-1\\le a\\le1\\Rightarrow a=\\frac13"},{"id":"s10","latex":"f(3)=27+3+1=31"}],"track":"미적분"};</script>
