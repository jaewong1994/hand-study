<script>window.ExternalHandStudyRecord={"adminYear":2026,"answer":"57","contentHash":"4177d73542bc96bbfb5af74eac00a53a418dfa5d5e4538a1429c94ae9c833c3e","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"learningHash":"26c6d03ea58fa259895cab47d07d88cab4727ed4e62307b0a55a632ec4f298ce","month":3,"number":30,"preview":false,"questionHtml":"\u003cfigure class=\"hfigwrap\">\u003cimg class=\"hfig\" src=\"../assets/external2026/ebsi-2026-g3-03-calculus-q30-67bf48c19cc298ad.png\" alt=\"2026년 3월 30번 문제\">\u003c/figure>","sourceHash":"19f09da89329cbe2bd81574bb9e36d5bee1e05b2902d6580c50ce0ad032b1ea5","sourceKey":"ebsi:2026:g3:03:calculus:q30","sourceLabel":"서울특별시교육청 2026-03-24","stepExplanations":{"s2":{"body":"두 번째 식은 음이 아닌 수의 거듭제곱이라, 유한한 극한이 존재하면 그 값은 0 또는 1이에요. 값이 1이라면 \\(|a|\\ne0\\)이고 첫 번째 식도 1로 수렴해야 합니다. 정수 \\(a+b\\)가 \\(-1\\)이면 부호가 번갈아 바뀌어 수렴하지 않으므로 안 돼요. 결국 \\(a+b=1\\), \\(|a|=1\\)이고, 두 번째 식에서는 \\(|2(a+b)-20|=k\\)여야 해요.","skillTags":["limit.geometric","sequence.oscillation"],"title":"거듭제곱의 극한이 존재하는 경우부터 나눠요"},"s3":{"body":"\\(a+b=1\\)을 넣으면 \\(k=|2-20|=18\\)입니다. \\(a=1\\)이면 \\(b=0\\), \\(a=-1\\)이면 \\(b=2\\)라서 두 순서쌍을 얻어요. 이 두 개는 극한값이 0인 경우와 겹치지 않습니다.","skillTags":["integer.cases"],"title":"극한값이 1인 순서쌍은 두 개예요"},"s4":{"body":"첫 번째 극한이 0이려면 \\(a=0\\)이거나, \\(a\\ne0\\)일 때 \\(|a+b|\u003c1\\)이어야 해요. \\(a+b\\)가 정수이므로 뒤의 경우는 \\(a+b=0\\)뿐입니다. 그런데 \\(a+b=0\\)을 두 번째 극한에 넣으면 \\((20/k)^n\\)이 되어, 0으로 가려면 \\(k>20\\)이어야 해요. 문제의 범위와 맞지 않으므로 결국 \\(a=0\\)인 경우만 세면 됩니다.","skillTags":["limit.geometric","integer.cases"],"title":"앞의 계수가 0이면 밑의 크기는 제한하지 않아요"},"s7":{"body":"\\(a=0\\)이면 \\(10-\\frac k2\u003cb\u003c10+\\frac k2\\)예요. \\(k=2j\\)가 짝수이면 양 끝이 정수여서 그 둘을 뺀 \\(2j-1=k-1\\)개입니다. \\(k=2j+1\\)이 홀수이면 양 끝이 반정수이므로 \\(10-j\\)부터 \\(10+j\\)까지 \\(2j+1=k\\)개예요. 숫자가 바뀌어도 끝점이 정수인지와 등호가 있는지를 먼저 확인해요.","skillTags":["integer.count","inequality.endpoint"],"title":"양 끝을 빼는 열린 범위의 정수를 세어요"},"s8":{"body":"\\(k=18\\)에서는 극한값 0인 순서쌍 17개에 극한값 1인 두 개를 더해 19개예요. 그 밖에는 0인 경우만 세므로 홀수 \\(k=19\\), 짝수 \\(k=20\\)에서 각각 19개가 됩니다. \\(1\\le k\\le20\\)의 다른 값에서는 19개가 되지 않으므로 답은 \\(18+19+20=57\\)이에요.","skillTags":["integer.count","case.completeness"],"title":"18일 때만 추가한 두 순서쌍을 더해요"}},"steps":[{"id":"s1","latex":"L_1=\\lim_{n\\to\\infty}|a|(a+b)^n,\\quad L_2=\\lim_{n\\to\\infty}\\left|\\frac{2a+2b-20}{k}\\right|^n"},{"id":"s2","latex":"L_1=L_2=1:\\quad a+b=1,\\ |a|=1,\\ |2a+2b-20|=k"},{"id":"s3","latex":"k\\le20\\Rightarrow a+b=1,\\ k=18,\\quad(a,b)=(-1,2),(1,0)"},{"id":"s4","latex":"L_1=L_2=0:\\quad a+b=0\\ (a\\ne0)\\text{ 또는 }a=0"},{"id":"s5","latex":"a+b=0\\Rightarrow20\u003ck\\quad\\text{(조건과 맞지 않음)}"},{"id":"s6","latex":"a=0:\\quad|2b-20|\u003ck\\Rightarrow10-\\frac k2\u003cb\u003c10+\\frac k2"},{"id":"s7","latex":"N_0(k)=\\begin{cases}k&k\\text{ 홀수}\\\\k-1&k\\text{ 짝수}\\end{cases}"},{"id":"s8","latex":"N(18)=17+2=19,\\quad N(19)=19,\\quad N(20)=19"},{"id":"s9","latex":"18+19+20=57"}],"track":"미적분"};</script>
