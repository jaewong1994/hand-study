<script>window.ExternalHandStudyRecord={"adminYear":2026,"answer":"30","contentHash":"532de9a9c367e528528f5345eeb91ac117753686068689e3f434cc2c842c0bf4","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"learningHash":"a8f99719f4be2ee4998498f9e7d60be66f5c630c3e6bfd53850df0187e8dcc2c","month":7,"number":29,"preview":false,"questionHtml":"\u003cfigure class=\"hfigwrap\">\u003cimg class=\"hfig\" src=\"../assets/external2026/ebsi-2026-g3-07-calculus-q29-cac7fd621cdb21e8.png\" alt=\"2026년 7월 29번 문제\">\u003c/figure>","sourceHash":"80574fde81a50e540817f5381945d8ee156cde1c6b2bff026316f4540e0b02f6","sourceKey":"ebsi:2026:g3:07:calculus:q29","sourceLabel":"인천광역시교육청 2026-07-08","stepExplanations":{"s10":{"body":"\\(a=80\\)을 얻었고 \\(b_{2n}=-a_{2n}=-80(-\\frac13)^{2n-1}\\)이에요. 이는 첫째항 \\(\\frac{80}{3}\\), 공비 \\(\\frac19\\)인 등비수열이므로 합은 \\(\\frac{80/3}{1-1/9}=30\\)입니다. 첨자가 \\(2n\\)으로 바뀌면 공비도 원래 공비의 제곱이 된다는 점을 확인해요.","skillTags":["series.even-index","series.geometric"],"title":"요구한 것은 전체 합이 아니라 짝수 번째 항의 합이에요"},"s5":{"body":"조건 \\(a_nb_n\u003c0\\) 때문에 \\(a\\)나 공비 \\(r\\)가 0일 수 없고, 급수가 수렴하므로 \\(-1\u003cr\u003c1\\)이에요. 양수 공비에서는 \\(a\u003c0\\)일 때 모든 \\(b_n=-a_n\\)이 되어 합 63과 맞지 않고, \\(a>0\\)일 때는 두 항의 곱이 양수예요. 음수 공비인데 \\(a\u003c0\\)이면 짝수 번째에서 \\(a_{2m}>0\\), \\(b_{2m}=a_{4m}>0\\)이어서 또 조건과 맞지 않아요. 그래서 \\(r\u003c0\\), \\(a>0\\)만 남습니다.","skillTags":["sequence.sign-cases","case.completeness"],"title":"공비와 첫째항의 부호를 둘 다 확인해요"},"s7":{"body":"\\(a>0\\), \\(r\u003c0\\)이므로 \\(|a_n|=a(-r)^{n-1}\\)이고 그 합은 \\(\\frac a{1+r}\\)예요. 제곱한 항들의 공비는 \\(r^2\\)라서 \\(\\sum a_n^2=\\frac{a^2}{1-r^2}\\)입니다. (나)에 넣고 \\(a^2\\)로 나누면 \\(1-r^2=2(1+r)^2\\), 즉 \\((3r+1)(r+1)=0\\)이에요. \\(r=-1\\)은 수렴 범위 밖이므로 \\(r=-\\frac13\\)입니다.","skillTags":["series.geometric","equation.domain-check"],"title":"절댓값을 취하면 공비가 양수로 바뀌어요"},"s8":{"body":"홀수 번째에서는 \\(a_{2m-1}>0>a_{2m}\\)이므로 \\(b_{2m-1}=a_{4m-2}\\), 짝수 번째에서는 \\(a_{2m}\u003c0\u003ca_{2m+1}\\)이므로 \\(b_{2m}=-a_{2m}\\)예요. 따라서 \\(a_n+b_n\\)을 두 항씩 묶으면 \\(a_{2m-1}+a_{4m-2}\\)만 남습니다. 그 합은 \\(\\frac a{1-r^2}+\\frac{ar}{1-r^4}\\)이고, \\(r=-\\frac13\\)을 넣으면 \\(\\frac98a-\\frac{27}{80}a=\\frac{63}{80}a\\)예요.","skillTags":["series.grouping","series.geometric"],"title":"짝수 번째에서는 두 항이 서로 없어져요"}},"steps":[{"id":"s1","latex":"a_n=ar^{n-1},\\quad a\\ne0,\\quad-1\u003cr\u003c1,\\ r\\ne0"},{"id":"s2","latex":"r>0,\\ a\u003c0\\Rightarrow b_n=-a_n\\Rightarrow\\sum(a_n+b_n)=0\\ne63"},{"id":"s3","latex":"r>0,\\ a>0\\Rightarrow a_nb_n>0\\quad\\text{(조건과 맞지 않음)}"},{"id":"s4","latex":"-1\u003cr\u003c0,\\ a\u003c0\\Rightarrow a_{2m}b_{2m}>0\\quad\\text{(조건과 맞지 않음)}"},{"id":"s5","latex":"\\therefore-1\u003cr\u003c0,\\ a>0"},{"id":"s6","latex":"b_{2m-1}=a_{4m-2},\\quad b_{2m}=-a_{2m}"},{"id":"s7","latex":"\\left(\\frac a{1+r}\\right)^2=2\\frac{a^2}{1-r^2}\\Rightarrow r=-\\frac13"},{"id":"s8","latex":"\\sum_{n=1}^{\\infty}(a_n+b_n)=\\frac{63}{80}a=63\\Rightarrow a=80"},{"id":"s9","latex":"b_{2n}=\\frac{80}{3}\\left(\\frac19\\right)^{n-1}"},{"id":"s10","latex":"\\sum_{n=1}^{\\infty}b_{2n}=\\frac{80/3}{1-1/9}=30"}],"track":"미적분"};</script>
<script>window.HandStudyGuide={"sourceKey":"ebsi:2026:g3:07:calculus:q29","sourceHash":"80574fde81a50e540817f5381945d8ee156cde1c6b2bff026316f4540e0b02f6","contentHash":"532de9a9c367e528528f5345eeb91ac117753686068689e3f434cc2c842c0bf4","overview":{"goal":"등비수열의 첫째항과 공비의 부호를 조건으로 확정하고, 절댓값 급수와 제곱 급수로 공비를 구한 뒤 짝수 번째 \\(b_n\\)의 합을 계산해요.","firstLook":"\\(b_n\\)의 정의가 \\(a_n\\le a_{n+1}\\)인지에 따라 달라져요. 등비수열에서는 이 비교가 첫째항 \\(a\\)와 공비 \\(r\\)의 부호에 따라 정해지므로, 부호 경우를 먼저 빠짐없이 정리해야 합니다.","conditions":[{"label":"급수 수렴","meaning":"\\(a_n=ar^{n-1}\\)에서 \\(-1<r<1\\)이고 \\(a,r\\)는 0이 아니에요."},{"label":"곱의 부호","meaning":"모든 \\(n\\)에서 \\(a_nb_n<0\\)이어야 해요."},{"label":"두 급수 조건","meaning":"절댓값 합의 제곱과 제곱합의 관계, 그리고 \\(\\sum(a_n+b_n)=63\\)을 모두 사용해요."}]},"chapters":[{"id":"c1","label":"첫째항과 공비의 부호 확정하기","stepIds":["s1","s2","s3","s4","s5"],"question":"네 가지 부호 조합 중 왜 \\(a>0,-1<r<0\\)만 남을까요?","hint":"각 경우에 \\(b_n\\)의 정의가 어느 줄을 택하는지와 \\(a_nb_n\\)의 부호를 확인하세요.","explanation":"\\(r>0,a<0\\)이면 모든 \\(b_n=-a_n\\)이라 \\(a_n+b_n=0\\)이 되어 합 63과 맞지 않아요. \\(r>0,a>0\\)이면 \\(a_nb_n>0\\)인 항이 생깁니다. \\(r<0,a<0\\)이면 짝수 번째에서 \\(a_{2m}>0\\), \\(b_{2m}=a_{4m}>0\\)이라 곱의 부호 조건에 어긋나요. 따라서 \\(-1<r<0,a>0\\)만 남습니다.","check":{"prompt":"\\(r=0\\)이나 \\(a=0\\)을 처음부터 제외할 수 있는 이유는 무엇인가요?","answer":"모든 \\(n\\)에서 \\(a_nb_n<0\\)이어야 하므로 어느 항도 0이 될 수 없습니다."}},{"id":"c2","label":"홀짝에 따른 b와 공비 구하기","stepIds":["s6","s7"],"question":"공비가 음수일 때 \\(b_n\\)은 홀수와 짝수에서 어떻게 달라질까요?","hint":"\\(a_{2m-1}>0>a_{2m}\\)의 다음 항과 크기를 비교하세요.","explanation":"홀수 번째에서는 \\(a_{2m-1}>a_{2m}\\)이므로 \\(b_{2m-1}=a_{4m-2}\\), 짝수 번째에서는 \\(a_{2m}\\le a_{2m+1}\\)이므로 \\(b_{2m}=-a_{2m}\\)이에요. 또 \\(\\sum|a_n|=a/(1+r)\\), \\(\\sum a_n^2=a^2/(1-r^2)\\)입니다. 조건에 넣으면 \\((3r+1)(r+1)=0\\)이고 수렴 범위에서 \\(r=-1/3\\)만 가능합니다.","check":{"prompt":"절댓값을 취한 수열 \\(|a_n|\\)의 공비는 무엇인가요?","answer":"\\(-r\\)이고, 지금은 \\(-r=1/3\\)입니다."}},{"id":"c3","label":"전체 합 조건으로 첫째항 정하기","stepIds":["s8"],"question":"\\(a_n+b_n\\)을 왜 두 항씩 묶어야 할까요?","hint":"짝수 번째의 \\(b_{2m}=-a_{2m}\\)가 어떤 항을 없애는지 보세요.","explanation":"두 항씩 묶으면 짝수 번째의 \\(a_{2m}+b_{2m}\\)가 0이 되고 \\(a_{2m-1}+a_{4m-2}\\)만 남아요. 두 등비급수의 합은 \\(a/(1-r^2)+ar/(1-r^4)\\)이고, \\(r=-1/3\\)을 넣으면 \\((63/80)a\\)입니다. 이것이 63이므로 \\(a=80\\)이에요.","check":{"prompt":"\\(a_{4m-2}\\)의 첫째항은 무엇인가요?","answer":"\\(m=1\\)일 때 \\(a_2=ar\\)입니다."}},{"id":"c4","label":"짝수 번째 b의 급수만 계산하기","stepIds":["s9","s10"],"question":"마지막에 요구한 급수의 공비는 왜 원래 공비와 다를까요?","hint":"첨자가 \\(2n\\)씩 움직이면 지수는 두 칸씩 증가해요.","explanation":"\\(b_{2n}=-a_{2n}=-80(-1/3)^{2n-1}=\\frac{80}{3}(1/9)^{n-1}\\)이에요. 따라서 첫째항은 \\(80/3\\), 공비는 \\(r^2=1/9\\)이고, 합은 \\((80/3)/(1-1/9)=30\\)입니다.","check":{"prompt":"구하는 값은 얼마인가요?","answer":"30입니다."}}],"takeaway":["조건부로 정의된 수열은 첫째항과 공비의 부호 경우를 빠짐없이 확인해 정의의 어느 줄이 선택되는지 정해요.","절댓값 수열의 공비와 제곱한 수열의 공비를 원래 공비와 구분해요.","짝수 번째 항만 모으면 공비가 원래 공비의 제곱이 된다는 점을 먼저 확인해요."]};</script>
