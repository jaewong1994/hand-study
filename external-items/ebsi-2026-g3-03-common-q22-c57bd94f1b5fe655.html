<script>window.HandStudyGuide={"sourceKey":"ebsi:2026:g3:03:common:q22","sourceHash":"f08c1e23ed4c473e0d6f2afcf4811e35c42b74596aae1e31cc6e4ff615d815e0","contentHash":"38be407bafe22dbf5e8dce29e4b91e9e4733f9d69ba17dbfb8b5bbeba9dbada4","overview":{"goal":"두 그래프의 세로 거리가 \\(1/5\\)이 되는 교점이 정확히 두 개라는 조건으로 \\(k\\)를 정하고, 두 교점의 지수값의 곱을 이용해 답을 구해요.","firstLook":"같은 \\(x=t\\)에서 두 점의 거리는 함숫값의 차의 절댓값이에요. 먼저 \\(h(x)=g(x)-f(x)\\)를 완전제곱하여 이 차가 \\(-1/5\\)까지 내려갈 수 있는지 확인해요.","conditions":[{"label":"자연수 조건","meaning":"두 양의 근이 생기는 부등식을 만족하는 자연수 \\(k\\)만 남겨요."},{"label":"거리 조건","meaning":"\\(|g(t)-f(t)|=1/5\\)를 만족하는 서로 다른 실수 \\(t\\)가 정확히 두 개예요."}]},"chapters":[{"id":"c1","label":"거리의 절댓값에서 가능한 부호를 정해요","stepIds":["s1","s2","s3"],"question":"왜 \\(h(x)=-1/5\\)인 경우는 따로 풀지 않아도 될까요?","hint":"\\(2^x\\)를 하나의 양수로 보고 \\(h(x)\\)를 완전제곱해 최솟값을 비교해요.","explanation":"같은 세로선 \\(x=t\\)에서 두 그래프와 만나는 점의 거리는 \\(|g(t)-f(t)|\\)예요. 그래서 \\(h(x)=g(x)-f(x)=2\\cdot4^x-2^x+2^{-k}\\)로 두어요. \\(X=2^x\\)라 하면 \\(X>0\\)이고\n\n\\(h(x)=2(X-1/4)^2+2^{-k}-1/8\\)\n\n이에요. 자연수 \\(k\\)에 대해 \\(2^{-k}>0\\)이므로 \\(h(x)>-1/8>-1/5\\)예요. 따라서 \\(|h(x)|=1/5\\)에서 음의 갈래 \\(h(x)=-1/5\\)는 생기지 않고, 반드시 \\(h(x)=1/5\\)만 풀면 돼요.","check":{"prompt":"완전제곱으로 얻은 \\(h(x)\\)의 하한은 왜 \\(-1/5\\)보다 큰가요?","answer":"제곱항은 \\(0\\) 이상이고 \\(2^{-k}>0\\)이므로 \\(h(x)>-1/8\\)이며, \\(-1/8>-1/5\\)이기 때문이에요."}},{"id":"c2","label":"서로 다른 두 양의 근의 조건을 나눠 봐요","stepIds":["s4","s5","s6"],"question":"이차방정식이 서로 다른 두 실수근을 갖는 것만으로는 왜 충분하지 않을까요?","hint":"\\(X=2^x\\)는 항상 양수이므로 두 근의 곱도 확인해야 해요.","explanation":"\\(h(x)=1/5\\)에 \\(X=2^x\\)를 넣으면\n\n\\(2X^2-X+2^{-k}-1/5=0\\)\n\n이에요. 서로 다른 두 실수근을 가지려면 판별식이 양수여야 하므로 \\(13/5-8\\cdot2^{-k}>0\\), 곧 \\(2^k>40/13\\)이에요. 그런데 각 양의 근 \\(X\\)는 실수 \\(x=\\log_2X\\)와 하나씩 대응해요. 두 근이 모두 양수이려면 근의 합 \\(1/2\\)이 이미 양수이므로 근의 곱도 양수여야 해요. 따라서 \\((2^{-k}-1/5)/2>0\\), 곧 \\(2^k<5\\)예요. 두 부등식을 합치면 \\(40/13<2^k<5\\)이고, 자연수 \\(k\\)는 \\(2\\)뿐이에요.","check":{"prompt":"\\(k=1\\)과 \\(k=3\\)은 각각 어느 조건에서 탈락하나요?","answer":"\\(k=1\\)은 \\(2^k>40/13\\)을 만족하지 않아 서로 다른 두 근이 없고, \\(k=3\\)은 \\(2^k<5\\)를 만족하지 않아 두 근이 모두 양수가 될 수 없어요."}},{"id":"c3","label":"근의 곱을 지수의 합으로 바꿔요","stepIds":["s7","s8"],"question":"교점의 \\(x\\)좌표를 각각 구하지 않고도 \\(2^{a+b}\\)를 알 수 있는 이유는 무엇일까요?","hint":"\\(X_1=2^a\\), \\(X_2=2^b\\)로 두고 이차방정식의 근의 곱을 써요.","explanation":"\\(k=2\\)일 때 이차방정식의 두 양의 근을 \\(X_1=2^a\\), \\(X_2=2^b\\)라 두어요. 근의 곱은\n\n\\(X_1X_2=(1/4-1/5)/2=1/40\\)\n\n이므로 \\(2^{a+b}=1/40\\)이에요. 따라서 \\((1/2)^{a+b}=40\\)이고, 문제에서 묻는 값은 \\(k(1/2)^{a+b}=2\\cdot40=80\\)이에요.","check":{"prompt":"\\(k=2\\)를 넣었을 때 근의 곱을 분수 계산으로 확인해 보세요.","answer":"\\((2^{-2}-1/5)/2=(1/4-1/5)/2=(1/20)/2=1/40\\)이에요."}}],"takeaway":["절댓값 방정식은 먼저 함수의 값의 범위를 확인하면 불가능한 부호를 지울 수 있어요.","지수 치환 뒤에는 이차방정식의 두 근이 실수라는 조건과 양수라는 조건을 따로 확인해요.","두 지수의 합이 필요하면 각 근보다 치환한 두 근의 곱을 먼저 봐요."]};</script>
