<script>window.HandStudyGuide={"sourceKey":"ebsi:2026:g3:03:common:q21","sourceHash":"a5b92de41be71b621be2082e3a710e7d3394b79a4d41364c07886b64c6c15d0e","contentHash":"03aa8fc134f4f5929d20b631445e8046deb52cb3248d51a56790746649a1dba1","overview":{"goal":"\\(g'(x)\\)가 언제 \\(0\\)이 되는지 해석해 삼차함수의 세 번째 근을 정하고 \\(f(4)\\)를 구해요.","firstLook":"적분으로 정의된 \\(g\\)를 먼저 미분하면, \\(g'(x)=0\\)이라는 조건이 곧 \\(f(x)\\ge0\\)이라는 부호 조건으로 바뀌어요.","conditions":[{"label":"도함수 조건","meaning":"\\(x=2\\)부터 오른쪽에서는 \\(f(x)\\)가 음수가 아니고, 그보다 왼쪽에는 음수가 되는 구간이 있어요."},{"label":"적분값 조건","meaning":"\\(0\\)부터 \\(2\\)까지 \\(f\\)가 음수인 부분만 두 배 하여 적분한 값이 \\(-8\\)이에요."}]},"chapters":[{"id":"c1","label":"도함수의 영점을 부호 조건으로 바꿔요","stepIds":["s1","s2","s3"],"question":"왜 \\(g'(x)=0\\)인 것과 \\(f(x)\\ge0\\)인 것이 같은 뜻일까요?","hint":"\\(f(x)\\)가 음수일 때와 음수가 아닐 때로 절댓값을 풀어 보세요.","explanation":"적분의 위끝이 \\(x\\)이므로\n\n\\(g'(x)=f(x)-|f(x)|\\)이에요. \\(f(x)<0\\)이면 \\(|f(x)|=-f(x)\\)라서 \\(g'(x)=2f(x)<0\\)이고, \\(f(x)\\ge0\\)이면 \\(g'(x)=0\\)이에요. 따라서 \\(g'(x)=0\\)은 정확히 \\(f(x)\\ge0\\)인 곳에서 성립해요.\n\n(가)에 의해 \\(x\\ge2\\)에서는 \\(f(x)\\ge0\\)이고, \\(2\\)보다 조금 작은 곳까지 계속 음수가 아니면 경계값이 \\(2\\)가 될 수 없어요. 연속인 다항함수이므로 경계에서 \\(f(2)=0\\)이에요. 또 \\(f(0)=0\\)이고 최고차항 계수가 \\(1\\)인 삼차함수이므로\n\n\\(f(x)=x(x-2)(x-a)\\)\n\n로 둘 수 있어요. \\(a>2\\)이면 \\(2<x<a\\)에서 \\(f(x)<0\\)이고, \\(a=2\\)이면 \\(0<x<2\\)에서도 \\(f(x)>0\\)라 경계가 \\(2\\)가 아니므로 \\(a<2\\)예요.","check":{"prompt":"\\(a>2\\)를 바로 제외하는 부호 구간은 어디인가요?","answer":"\\(2<x<a\\)에서 세 인수의 부호가 \\(+,+,-\\)이므로 \\(f(x)<0\\)가 되어 \\(x\\ge2\\)에서 \\(g'(x)=0\\)이라는 조건을 어겨요."}},{"id":"c2","label":"세 번째 근의 위치에 따라 적분 구간을 나눠요","stepIds":["s4","s5","s6"],"question":"왜 \\(0<a<2\\)와 \\(a\\le0\\)에서 \\(g(2)\\)의 적분 시작점이 달라질까요?","hint":"\\(g'\\)는 \\(f<0\\)인 곳에서만 \\(2f\\)예요. 근 \\(0,a,2\\) 사이의 부호를 차례로 적어 보세요.","explanation":"먼저 \\(0<a<2\\)이면 \\(0<x<a\\)에서 \\(f(x)>0\\), \\(a<x<2\\)에서 \\(f(x)<0\\)예요. 그래서\n\n\\(g(2)=\\int_a^2 2x(x-2)(x-a)\\,dx\\)\n\n이고, 직접 적분하면\n\n\\(g(2)=\\frac16a^4-\\frac23a^3+\\frac83a-\\frac83\\)이에요. 이 값에 \\(8/3\\)을 더하면\n\n\\(\\frac{a}{6}(a^3-4a^2+16)\\)\n\n이에요. \\(0<a<2\\)에서 \\(a>0\\)이고 \\(a^3-4a^2+16>8>0\\)이므로 \\(g(2)>-8/3\\)예요. 따라서 \\(g(2)=-8\\)은 불가능해요.\n\n반대로 \\(a\\le0\\)이면 \\(0<x<2\\)에서 \\(x>0\\), \\(x-2<0\\), \\(x-a>0\\)이므로 줄곧 \\(f(x)<0\\)예요. 따라서 이번에는 음수인 구간 전체를 적분하여\n\n\\(g(2)=\\int_0^2 2x(x-2)(x-a)\\,dx=\\frac83a-\\frac83\\)이에요.","check":{"prompt":"\\(0<a<2\\)에서 \\(0\\)부터 \\(a\\)까지의 적분을 넣지 않는 이유는 무엇인가요?","answer":"그 구간에서는 \\(f(x)>0\\)이므로 \\(f(x)-|f(x)|=0\\)이고, \\(g'(x)=0\\)이라 적분에 기여하지 않아요."}},{"id":"c3","label":"적분값으로 근과 함숫값을 확정해요","stepIds":["s7","s8"],"question":"\\(g(2)=-8\\)에서 얻은 \\(a\\)가 원래 부호 조건도 만족하나요?","hint":"\\(a\\le0\\)에서 얻은 일차식에 \\(-8\\)을 넣고, 구한 근의 위치를 다시 확인하세요.","explanation":"\\(a\\le0\\)인 경우의 식에 \\(g(2)=-8\\)을 넣으면\n\n\\(\\frac83a-\\frac83=-8\\),\n\n\\(a-1=-3\\), 따라서 \\(a=-2\\)예요. 이는 가정한 \\(a\\le0\\)을 만족하고, 실제로 \\(f(x)=x(x-2)(x+2)\\)는 \\(0<x<2\\)에서 음수이고 \\(x\\ge2\\)에서 음수가 아니므로 (가)와도 맞아요.\n\n이제\n\n\\(f(4)=4(4-2)(4+2)=4\\cdot2\\cdot6=48\\)\n\n이므로 정답은 \\(48\\)이에요.","check":{"prompt":"구한 \\(a=-2\\)를 적분식에 다시 넣으면 \\(g(2)\\)는 얼마인가요?","answer":"\\((8/3)(-2)-8/3=-16/3-8/3=-24/3=-8\\)이므로 원래 조건과 정확히 일치해요."}}],"takeaway":["절댓값이 든 적분함수는 먼저 미분한 뒤 원래 함수의 부호에 따라 나눠요.","근의 위치가 달라지면 함수가 음수인 구간과 적분 구간도 함께 달라져요.","후보를 구한 뒤에는 근의 위치, 부호 구간, 주어진 적분값을 모두 다시 확인해요."]};</script>
