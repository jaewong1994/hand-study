<script>window.ExternalHandStudyRecord={"sourceKey":"ebsi:2026:g2:06:q30","sourceHash":"7ca8a8f463626dae67918507820e6ae53fc4821d199e18b371acf620812bdee6","contentHash":"091927ee060915e486345cc3fc086df2ca22963eafae6ad2bbbe61aa6edc67e3","sourceLabel":"부산광역시교육청 2026-06-04","adminYear":2026,"grade":2,"month":6,"number":30,"track":"공통","answer":"224","questionHtml":"<figure class=\"hfigwrap\"><img class=\"hfig\" src=\"../assets/external2026/ebsi-2026-g2-06-q30-bc1f0a61fb6020d2.png\" alt=\"2026년 6월 30번 문제\"><\/figure>","steps":[{"id":"s1","latex":"\\sin\\frac{3\\pi x}{a}\\text{의 주기는 }\\frac{2a}{3},\\quad g(x)\\ge g(4)\\ (x\\ge0)"},{"id":"s2","latex":"m\\text{을 }x\\ge a\\text{에서 }f(x)-f(a)\\text{가 갖는 최솟값이라 하자. }m>-1\\Rightarrow a=8,\\ h(3)=h(5)"},{"id":"s3","latex":"m<-1\\Rightarrow a<4,\\ h(4)=1,\\quad h(n)=2\\text{인 자연수의 개수}\\ne1"},{"id":"s4","latex":"\\therefore m=-1,\\quad a<4,\\quad h(4)=2"},{"id":"s5","latex":"h(n)=1\\text{인 자연수는 }n=5,\\quad h(n)=3\\Rightarrow g(n)=1"},{"id":"s6","latex":"g(n)=1\\Rightarrow n\\in\\left\\{\\frac a6,\\frac{5a}{6}\\right\\},\\quad a<4\\Rightarrow n=\\frac{5a}{6}"},{"id":"s7","latex":"\\frac{5a}{6}=1,2\\Rightarrow\\text{조건 불충족},\\quad\\frac{5a}{6}=3\\Rightarrow a=\\frac{18}{5}"},{"id":"s8","latex":"x\\ge a:\\quad g(x)=b(x-4)^2-1,\\quad g(a)=0"},{"id":"s9","latex":"b\\left(\\frac{18}{5}-4\\right)^2=1\\Rightarrow b=\\frac{25}{4}"},{"id":"s10","latex":"g(10)=\\frac{25}{4}(10-4)^2-1=224"}],"diagram":null,"preview":false,"graphPlan":null,"graphHash":"","editionHash":"eebc04ee9543667287047564fe98998934f8fa3043e4781a65933b83485b8476"};</script>
<script>window.HandStudyGuide={"sourceKey":"ebsi:2026:g2:06:q30","sourceHash":"7ca8a8f463626dae67918507820e6ae53fc4821d199e18b371acf620812bdee6","contentHash":"091927ee060915e486345cc3fc086df2ca22963eafae6ad2bbbe61aa6edc67e3","overview":{"goal":"사인 조각과 이차함수 조각의 가장 작은 값이 만나는 경계를 분석해 \\(a,b\\)를 정해요.","firstLook":"사인 조각의 값은 \\(-1\\) 이상이에요. 뒤쪽 이차함수 조각의 가장 작은 값을 \\(-1\\)과 비교하면 세 경우를 나눌 수 있어요.","conditions":[{"label":"전체 최솟값의 위치","meaning":"모든 \\(x\\ge0\\)에서 \\(g(x)\\ge g(4)\\)이므로 \\(x=4\\)가 전체에서 가장 작은 값을 줘요."},{"label":"해 개수의 순열","meaning":"\\(h(1),\\ldots,h(5)\\)가 각각 \\(1\\)부터 \\(5\\)를 한 번씩 가져야 해요."}]},"chapters":[{"id":"c1","label":"뒤쪽 조각의 최솟값을 비교해요","stepIds":["s1","s2","s3","s4"],"question":"왜 뒤쪽 조각의 가장 작은 값은 반드시 \\(-1\\)인가요?","hint":"사인 조각의 가장 작은 값 \\(-1\\)보다 큰 경우와 작은 경우를 각각 조건 (나)에 넣어 봐요.","explanation":"\\(0\\le x<a\\)에서 \\(\\sin(3\\pi x/a)\\)의 주기는 \\(2a/3\\)이고 가장 작은 값은 \\(-1\\)이에요. \\(x\\ge a\\)에서 \\(f(x)-f(a)\\)가 갖는 가장 작은 값을 \\(m\\)이라 두어요.\n\n\\(m>-1\\)이면 전체 최솟값은 사인 조각에서 생기고 그 점이 \\(x=4\\)여야 하므로 \\(a/2=4\\), 즉 \\(a=8\\)이에요. 이때 \\(g(3)=\\sin(9\\pi/8)=\\sin(15\\pi/8)=g(5)\\)여서 \\(h(3)=h(5)\\)가 되므로 다섯 값이 모두 달라야 하는 조건을 어겨요.\n\n\\(m<-1\\)이면 이차함수 조각의 꼭짓점이 \\(x=4\\)이고 \\(a<4\\)예요. 이때 높이가 \\(m\\)과 \\(-1\\) 사이이면 사인 조각의 해는 없고 이차함수 조각의 해가 두 개여서 해 개수는 \\(2\\)예요. \\(a\\le3\\)이면 \\(x=3,5\\)가 꼭짓점에 대칭이므로 \\(h(3)=h(5)=2\\)이거나 둘 다 \\(2\\)가 아니고, \\(3<a<4\\)이면 \\(g(5)>0\\)이고 \\(1,2,3\\)에서는 높이 \\(m\\)과 \\(-1\\) 사이가 나오지 않아 해 개수 \\(2\\)가 없어요. 어느 경우에도 \\(2\\)가 정확히 한 번 나오지 않아요.\n\n따라서 \\(m=-1\\), \\(a<4\\)이고 높이 \\(-1\\)에서는 사인 조각과 이차함수 조각에서 각각 한 해가 있어 \\(h(4)=2\\)예요.","check":{"prompt":"\\(m=-1\\)일 때 \\(h(4)=2\\)인 이유는 무엇인가요?","answer":"사인 조각의 가장 낮은 점 한 개와 뒤쪽 이차함수의 꼭짓점 \\(x=4\\)가 서로 다른 두 해를 만들기 때문이에요."}},{"id":"c2","label":"해가 세 개인 자연수 위치를 찾아요","stepIds":["s5","s6","s7"],"question":"왜 \\(5a/6=3\\)이어야 하나요?","hint":"사인값이 \\(1\\)이 되는 두 위치와 \\(a<4\\)를 함께 써요.","explanation":"\\(m=-1\\)일 때 높이에 따른 해 개수는 \\(-1\\)에서 \\(2\\), \\(-1<y<0\\)에서 \\(4\\), \\(0\\le y<1\\)에서 \\(5\\), \\(y=1\\)에서 \\(3\\), \\(y>1\\)에서 \\(1\\)이에요. 따라서 해 개수 \\(3\\)은 \\(g(n)=1\\)일 때 생겨요. 사인 조각에서 \\(\\sin(3\\pi x/a)=1\\)인 위치는 \\(x=a/6,5a/6\\)이고, \\(a<4\\)이므로 \\(a/6<1\\)은 자연수가 될 수 없어요. 그러므로 \\(5a/6\\)은 \\(1,2,3\\) 중 하나예요.\n\n\\(5a/6=1\\)이면 \\(a=6/5\\)이고 \\(h(2)=h(3)=4\\)예요. \\(5a/6=2\\)이면 \\(a=12/5\\)이고 \\(h(1)=h(3)=4\\)예요. 두 경우 모두 다섯 값이 서로 달라야 하는 조건을 어겨요. 따라서 \\(5a/6=3\\)이고 \\(a=18/5\\)예요. 실제로 이때 \\((h(1),h(2),h(3),h(4),h(5))=(5,4,3,2,1)\\)이에요.","check":{"prompt":"\\(a/6\\)을 자연수 후보에서 제외하는 직접적인 부등식은 무엇인가요?","answer":"\\(a<4\\)이므로 \\(0<a/6<2/3<1\\)이라 양의 자연수가 될 수 없어요."}},{"id":"c3","label":"이차함수의 계수를 정해요","stepIds":["s8","s9"],"question":"\\(x\\ge a\\)에서 \\(g(x)=b(x-4)^2-1\\)인 이유는 무엇인가요?","hint":"꼭짓점이 \\((4,-1)\\)인 이차함수의 꼴을 써요.","explanation":"뒤쪽 이차함수 조각은 \\(x=4\\)에서 가장 작은 값 \\(-1\\)을 가지므로 \\(g(x)=b(x-4)^2-1\\)로 쓸 수 있어요. 조각이 만나는 \\(x=a\\)에서 \\(g(a)=f(a)-f(a)=0\\)이에요. \\(a=18/5\\)를 넣으면 \\(b(18/5-4)^2=1\\), 즉 \\(b\\cdot4/25=1\\)이므로 \\(b=25/4\\)예요.","check":{"prompt":"이차함수의 계수 \\(b\\)가 양수인 이유는 무엇인가요?","answer":"\\(x=4\\)에서 가장 작은 값을 가지는 위로 열린 포물선이므로 최고차항 계수가 양수예요."}},{"id":"c4","label":"요구한 함숫값을 계산해요","stepIds":["s10"],"question":"\\(g(10)\\)은 얼마인가요?","hint":"\\(10>a\\)이므로 이차함수 조각에 넣어요.","explanation":"\\(10>18/5\\)이므로 \\(g(10)=\\frac{25}{4}(10-4)^2-1=\\frac{25}{4}\\cdot36-1=225-1=224\\)예요.","check":{"prompt":"사인 조각을 쓰지 않는 이유는 무엇인가요?","answer":"사인 조각의 정의역은 \\(0\\le x<a\\)이고 \\(10>a\\)이기 때문이에요."}}],"takeaway":["두 조각의 가장 작은 값을 비교해 어느 조각이 전체 최솟값을 만드는지 경우를 나눠요.","해 개수 조건이 순열을 이룬다면 같은 개수가 두 번 생기는 후보를 경계에서 제외해요.","이차함수의 꼭짓점과 조각 경계의 함숫값을 알면 식의 계수를 정할 수 있어요."]};</script>
