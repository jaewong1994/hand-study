<script>window.ExternalHandStudyRecord={"sourceKey":"ebsi:2026:g3:03:probability-statistics:q30","sourceHash":"71ee28675f33d6711a5b3808dadf67054cca23098fe6ee4b182f0b5339282007","contentHash":"5f260acc6bcab2f31547c13a6bd3b555e57ff9a7718941398d4287ddcbf8af25","sourceLabel":"서울특별시교육청 2026-03-24","adminYear":2026,"grade":3,"month":3,"number":30,"track":"확률과통계","answer":"100","questionHtml":"<figure class=\"hfigwrap\"><img class=\"hfig\" src=\"../assets/external2026/ebsi-2026-g3-03-probability-statistics-q30-d96b6b81340395fb.png\" alt=\"2026년 3월 30번 문제\"><\/figure>","steps":[{"id":"s1","latex":"a_n\\text{은 이웃한 두 카드의 곱},\\quad\\sum_{n=1}^{11}a_n=3\\Rightarrow(+1)\\ 7\\text{개},\\ (-1)\\ 4\\text{개}"},{"id":"s2","latex":"\\therefore\\text{부호 변화는 }4\\text{회};\\quad +1\\text{ 카드 }6\\text{개 사이의 안쪽 틈 }5\\text{개와 양 끝을 사용}"},{"id":"s3","latex":"\\text{음수 묶음 두 개가 안쪽 틈에 놓이는 경우}:\\quad{ {}_{5}\\mathrm{C}_{2} }{ {}_{5}\\mathrm{C}_{1} }=50"},{"id":"s4","latex":"\\text{한 안쪽 틈과 양 끝에 음수 묶음이 놓이는 경우}:\\quad{ {}_{5}\\mathrm{C}_{1} }{ {}_{5}\\mathrm{C}_{2} }=50"},{"id":"s5","latex":"{ {}_{5}\\mathrm{C}_{1} },{ {}_{5}\\mathrm{C}_{2} }\\text{는 }6\\text{개의 }-1\\text{ 카드를 각각 }2,3\\text{개의 빈틈 없는 묶음으로 나누는 수}"},{"id":"s6","latex":"N=50+50=100"}],"diagram":null,"preview":false,"graphPlan":null,"graphHash":"","editionHash":"4bb724ab674553701960014fab478935f7bf4e5e3cf4e194885450a74909e6c4"};</script>
<script>window.HandStudyGuide={"sourceHash":"71ee28675f33d6711a5b3808dadf67054cca23098fe6ee4b182f0b5339282007","contentHash":"5f260acc6bcab2f31547c13a6bd3b555e57ff9a7718941398d4287ddcbf8af25","overview":{"goal":"이웃한 카드의 곱이 음수인 횟수로 부호 변화 횟수를 정하고, 여섯 장의 음수 카드를 연속한 묶음으로 나누어 배치해요.","firstLook":"\\(a_n=-1\\)은 \\(n\\)번째 카드와 \\(n+1\\)번째 카드의 부호가 달라지는 경계예요. 열한 경계의 합이 \\(3\\)이므로 부호가 달라지는 경계 수부터 구하세요.","conditions":[{"label":"카드 수","meaning":"양수 카드와 음수 카드는 각각 여섯 장이고 같은 수끼리는 구별하지 않아요."},{"label":"곱의 합","meaning":"열한 개의 곱 가운데 \\(+1\\)은 일곱 개, \\(-1\\)은 네 개예요."}]},"chapters":[{"id":"c1","label":"곱의 부호로 변화 횟수를 세어요","stepIds":["s1","s2"],"question":"합이 \\(3\\)이라는 조건에서 부호 변화가 네 번임을 어떻게 얻나요?","hint":"\\(+1\\)인 곱의 수를 \\(u\\), \\(-1\\)인 곱의 수를 \\(v\\)라 두고 \\(u+v=11\\), \\(u-v=3\\)을 푸세요.","explanation":"\\(a_n=-1\\)은 이웃한 카드의 부호가 바뀐 자리예요. 합이 3이고 항이 11개이므로 +1은 7개, -1은 4개라 부호 변화가 정확히 4회예요.","check":{"prompt":"부호가 같은 경계와 다른 경계는 각각 몇 개인가요?","answer":"같은 부호의 경계는 \\(7\\)개, 다른 부호의 경계는 \\(4\\)개라 부호 변화는 네 번이에요."}},{"id":"c2","label":"음수 카드를 묶음으로 배치해요","stepIds":["s3","s4"],"question":"음수 카드 묶음이 모두 양수 카드 사이에 있을 때 왜 두 묶음이어야 하나요?","hint":"양수 카드로 시작하고 끝나는 배열에서 음수 묶음 하나가 부호 변화를 두 번 만든다는 점을 쓰세요.","explanation":"음수 카드 6장이 안쪽 틈에만 놓이면 두 묶음이어야 부호 변화가 네 번이에요. 양수 카드 6장 사이의 안쪽 틈 5곳에서 두 곳을 고르고, 음수 카드 6장을 두 양의 크기 묶음으로 나누는 경계 하나를 고르므로 \\({}_5\\mathrm C_2{}_5\\mathrm C_1=50\\)이에요.","check":{"prompt":"안쪽 틈 두 곳을 고른 뒤 여섯 장을 두 양의 크기 묶음으로 나누는 수는 얼마인가요?","answer":"안쪽 틈 선택은 \\({}_5\\mathrm C_2\\), 여섯 장의 분할은 \\({}_5\\mathrm C_1\\)이므로 곱해서 50가지예요."}},{"id":"c3","label":"두 경우를 더해요","stepIds":["s5","s6"],"question":"양 끝을 모두 쓰는 경우에는 왜 음수 묶음이 세 개 필요한가요?","hint":"끝의 묶음은 부호 변화를 한 번, 안쪽 묶음은 두 번 만들어요.","explanation":"양 끝의 음수 묶음은 각각 부호 변화를 한 번 만들고, 안쪽 음수 묶음 하나가 두 번을 더 만들어 모두 네 번이 돼요. 안쪽 틈은 5곳 중 한 곳, 여섯 장을 세 양의 크기 묶음으로 나누는 경계는 5곳 중 두 곳을 고르므로 \\({}_5\\mathrm C_1{}_5\\mathrm C_2=50\\)이에요. 따라서 \\(N=50+50=100\\)이에요.","check":{"prompt":"양 끝의 두 음수 묶음만 두는 경우가 빠지는 이유는 무엇인가요?","answer":"양 끝의 두 묶음만 두면 부호 변화가 두 번뿐이고, 안쪽 묶음 하나를 더 두어야 필요한 네 번이 돼요."}}],"takeaway":["곱이 음수인 인접쌍의 수는 배열에서 부호가 바뀌는 경계의 수예요.","같은 카드의 배치는 카드 하나씩이 아니라 같은 부호의 연속 묶음 크기로 세어요.","양 끝의 묶음은 부호 변화를 한 번만 만든다는 차이를 반영해요."],"sourceKey":"ebsi:2026:g3:03:probability-statistics:q30"};</script>
