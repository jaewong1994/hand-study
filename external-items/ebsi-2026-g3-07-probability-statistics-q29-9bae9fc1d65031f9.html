<script>window.HandStudyGuide={"sourceHash":"b7572e8a1a08f63f5e553fe275776bdcf86dc4c75af083798b2fa969ff969e54","contentHash":"b9dc63477b86fe84d020e45305f89f0db19dc9157ef9ad0cf100d15913f38724","overview":{"goal":"두 공의 홀짝 조합별로 기록값의 확률을 세고, 두 기댓값의 비로 자연수 \\(n\\)을 정해요.","firstLook":"홀수는 \\(n+1\\)개, 짝수는 \\(n\\)개예요. 같은 홀짝을 뽑으면 \\(0\\), 홀수와 짝수를 하나씩 뽑으면 그중 짝수인 공의 수를 기록해요.","conditions":[{"label":"동시 추출","meaning":"전체 경우의 수는 \\({}_{2n+1}\\mathrm C_2\\)이고 두 공의 순서는 구별하지 않아요."}]},"chapters":[{"id":"c1","label":"0과 양의 짝수의 확률을 구해요","stepIds":["s1","s2"],"question":"\\(X=0\\)인 경우와 \\(X=2i\\)인 경우의 수를 어떻게 따로 세나요?","hint":"같은 홀짝은 조합으로 세고, \\(X=2i\\)이면 짝수 공 \\(2i\\)와 홀수 공 하나를 뽑아야 한다는 뜻을 쓰세요.","explanation":"두 공이 같은 홀짝이면 \\(X=0\\)이에요. 경우의 수는 \\({}_n\\mathrm C_2+{}_{n+1}\\mathrm C_2=n^2\\)이고, 전체 경우의 수는 \\({}_{2n+1}\\mathrm C_2=n(2n+1)\\)이므로 확률은 \\(n/(2n+1)\\)이에요. \\(X=2i\\)가 되려면 짝수 공 \\(2i\\)를 고정하고 \\(n+1\\)개의 홀수 공 중 하나를 함께 뽑으면 돼요. 따라서 경우의 수는 모든 \\(i=1,2,\\ldots,n\\)에 대하여 \\(n+1\\)개이고, 각 확률은 \\((n+1)/(n(2n+1))\\)이에요.","check":{"prompt":"\\(X=2i\\)인 경우의 수가 \\(i\\)와 관계없이 \\(n+1\\)인 이유는 무엇인가요?","answer":"기록되는 짝수 공은 \\(2i\\)로 고정되고, 함께 뽑을 홀수 공은 \\(1,3,\\ldots,2n+1\\)의 \\(n+1\\)개 중 어느 것이어도 되기 때문이에요."}},{"id":"c2","label":"두 기댓값을 합 공식으로 계산해요","stepIds":["s3","s4"],"question":"\\(E(X)\\)와 \\(E(X^2)\\)에서 각각 어떤 합 공식을 사용하나요?","hint":"\\(\\sum_{i=1}^ni\\)와 \\(\\sum_{i=1}^ni^2\\)을 확률 \\(\\dfrac{n+1}{n(2n+1)}\\)에 곱하세요.","explanation":"\\(\\sum i=n(n+1)/2\\), \\(\\sum i^2=n(n+1)(2n+1)/6\\)을 써서 \\(E(X)=(n+1)^2/(2n+1)\\), \\(E(X^2)=\\frac23(n+1)^2\\)를 얻어요.","check":{"prompt":"\\(E(X^2)\\)에서 \\(2n+1\\)이 약분되는 지점을 써 보세요.","answer":"\\(4\\cdot\\dfrac{n(n+1)(2n+1)}6\\cdot\\dfrac{n+1}{n(2n+1)}=\\dfrac23(n+1)^2\\)예요."}},{"id":"c3","label":"n을 정하고 마지막 기댓값을 구해요","stepIds":["s5","s6","s7"],"question":"\\(E(X^2)=14E(X)\\)에서 왜 \\(2n+1=21\\)이 되나요?","hint":"공통인 양수 \\((n+1)^2\\)을 약분하세요.","explanation":"조건을 나누면 \\(\\frac23(2n+1)=14\\), 따라서 \\(n=10\\). \\(E(X)=121/21\\)이므로 \\(E(7X+2/3)=7E(X)+2/3=41\\)이에요.","check":{"prompt":"\\(n=10\\)에서 마지막 기댓값은 어떻게 \\(41\\)이 되나요?","answer":"\\(7\\cdot\\dfrac{121}{21}+\\dfrac23=\\dfrac{121}{3}+\\dfrac23=41\\)이에요."}}],"takeaway":["기록값이 0인 경우와 양의 짝수인 경우를 서로 겹치지 않게 나눠요.","기록할 짝수 공을 하나 고정하면 함께 뽑을 홀수 공은 항상 \\(n+1\\)개예요.","기댓값의 선형성을 사용해 마지막 확률분포를 다시 만들지 않아요."],"sourceKey":"ebsi:2026:g3:07:probability-statistics:q29"};</script>
