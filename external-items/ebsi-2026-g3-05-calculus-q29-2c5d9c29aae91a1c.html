  <script>window.ExternalHandStudyRecord={"adminYear":2026,"answer":"17","contentHash":"f6d8810a332967911dab3b6b137fe11788de28cd169a35609c73a0d5a42d80a6","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"learningHash":"6e93bcb7ac20f013b44d637d08d1fbb143906d211ebc1119139d644cc8a56c7e","month":5,"number":29,"preview":false,"questionHtml":"\u003cfigure class=\"hfigwrap\">\u003cimg class=\"hfig\" src=\"../assets/external2026/ebsi-2026-g3-05-calculus-q29-12064855909c2d11.png\" alt=\"2026년 5월 29번 문제\">\u003c/figure>","sourceHash":"b8bc58f689777bcca58cceec58c69aa4e220f9ededaf0bd831987fccb9deb4a7","sourceKey":"ebsi:2026:g3:05:calculus:q29","sourceLabel":"경기도교육청 2026-05-07","stepExplanations":{"s1":{"body":"\\(\\mathrm{AB}\\)가 지름이므로 \\(\\angle\\mathrm{APB}=\\frac\\pi2\\)예요. 직각삼각형 \\(\\mathrm{APB}\\)에서 \\(\\cos\\theta=\\frac{\\overline{\\mathrm{AP}}}{2}\\)이므로 \\(\\overline{\\mathrm{AP}}=2\\cos\\theta\\)이고, 중점 \\(\\mathrm{M}\\)에 대해 \\(\\overline{\\mathrm{MP}}=\\cos\\theta\\)입니다.","skillTags":["geometry.inscribed-angle","trigonometry.length"],"title":"지름에 대한 원주각으로 길이를 구해요"},"s3":{"body":"원의 중심을 \\(\\mathrm{O}\\)라 하면 반지름과 \\(\\overline{\\mathrm{PQ}}\\)가 모두 1이므로 \\(\\mathrm{OPQ}\\)는 정삼각형이에요. \\(\\mathrm{OA}=\\mathrm{OP}\\)인 삼각형에서 \\(\\angle\\mathrm{OPA}=\\theta\\)이고, \\(\\angle\\mathrm{OPQ}=\\frac\\pi3\\)이므로 \\(\\angle\\mathrm{QPA}=\\frac\\pi3-\\theta\\)입니다. \\(\\mathrm{PM}\\)은 \\(\\mathrm{PA}\\)와 같은 방향이어서, 삼각형 \\(\\mathrm{PQM}\\)의 넓이는 두 변 1, \\(\\cos\\theta\\)와 이 끼인각의 사인으로 구해요.","skillTags":["geometry.area","trigonometry.angle"],"title":"넓이에 필요한 끼인각을 구해요"},"s5":{"body":"\\(\\sin(\\frac\\pi3-\\theta)=\\frac{\\sqrt3}{2}\\cos\\theta-\\frac12\\sin\\theta\\)를 넓이 식에 넣으면 앞 줄의 식이 나와요. 이제 \\((\\cos^2\\theta)^{\\prime}=-2\\cos\\theta\\sin\\theta\\), \\((\\cos\\theta\\sin\\theta)^{\\prime}=-\\sin^2\\theta+\\cos^2\\theta\\)를 각각 적용합니다. 두 번째 곱 앞에 빼기 부호가 있어 최종 부호가 바뀐다는 점을 확인해요.","skillTags":["trigonometry.subtraction","derivative.product"],"title":"각의 차를 전개한 뒤 곱의 미분을 써요"},"s7":{"body":"\\(2\\cos a=\\frac65\\)에서 \\(\\cos a=\\frac35\\)이고, \\(0\u003ca\u003c\\frac\\pi3\\)이므로 \\(\\sin a\\)는 양수 \\(\\frac45\\)예요. 따라서 \\(\\sin^2a-\\cos^2a=\\frac7{25}\\), \\(\\cos a\\sin a=\\frac{12}{25}\\)입니다. 도함수에 넣으면 \\(f^{\\prime}(a)=\\frac7{100}-\\frac{6\\sqrt3}{25}\\)이므로 \\(p+q=\\frac7{100}-\\frac{24}{100}=-\\frac{17}{100}\\), 답은 17입니다.","skillTags":["trigonometry.identity","calculation.exact"],"title":"각도를 구하지 않고 삼각비를 대입해요"}},"steps":[{"id":"s1","latex":"AP=2\\cos\\theta\\Rightarrow MP=\\cos\\theta"},{"id":"s2","latex":"OPQ\\text{는 정삼각형}\\Rightarrow\\angle QPA=\\frac\\pi3-\\theta"},{"id":"s3","latex":"f(\\theta)=\\frac12\\cos\\theta\\sin\\left(\\frac\\pi3-\\theta\\right)"},{"id":"s4","latex":"f(\\theta)=\\frac14(\\sqrt3\\cos^2\\theta-\\cos\\theta\\sin\\theta)"},{"id":"s5","latex":"f'(\\theta)=\\frac14(-2\\sqrt3\\cos\\theta\\sin\\theta+\\sin^2\\theta-\\cos^2\\theta)"},{"id":"s6","latex":"AP=\\frac65\\Rightarrow\\cos a=\\frac35,\\quad\\sin a=\\frac45"},{"id":"s7","latex":"f'(a)=\\frac7{100}-\\frac{6\\sqrt3}{25}"},{"id":"s8","latex":"100|p+q|=17"}],"track":"미적분"};</script>
