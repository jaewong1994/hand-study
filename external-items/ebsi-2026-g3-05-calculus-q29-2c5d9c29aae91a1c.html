\(2\\cos a=\\frac65\\)에서 \\(\\cos a=\\frac35\\)이고, \\(0\u003ca\u003c\\frac\\pi3\\)이므로 \\(\\sin a\\)는 양수 \\(\\frac45\\)예요. 따라서 \\(\\sin^2a-\\cos^2a=\\frac7{25}\\), \\(\\cos a\\sin a=\\frac{12}{25}\\)입니다. 도함수에 넣으면 \\(f^{\\prime}(a)=\\frac7{100}-\\frac{6\\sqrt3}{25}\\)이므로 \\(p+q=\\frac7{100}-\\frac{24}{100}=-\\frac{17}{100}\\), 답은 17입니다.","skillTags":["trigonometry.identity","calculation.exact"],"title":"각도를 구하지 않고 삼각비를 대입해요"}},"steps":[{"id":"s1","latex":"AP=2\\cos\\theta\\Rightarrow MP=\\cos\\theta"},{"id":"s2","latex":"OPQ\\text{는 정삼각형}\\Rightarrow\\angle QPA=\\frac\\pi3-\\theta"},{"id":"s3","latex":"f(\\theta)=\\frac12\\cos\\theta\\sin\\left(\\frac\\pi3-\\theta\\right)"},{"id":"s4","latex":"f(\\theta)=\\frac14(\\sqrt3\\cos^2\\theta-\\cos\\theta\\sin\\theta)"},{"id":"s5","latex":"f'(\\theta)=\\frac14(-2\\sqrt3\\cos\\theta\\sin\\theta+\\sin^2\\theta-\\cos^2\\theta)"},{"id":"s6","latex":"AP=\\frac65\\Rightarrow\\cos a=\\frac35,\\quad\\sin a=\\frac45"},{"id":"s7","latex":"f'(a)=\\frac7{100}-\\frac{6\\sqrt3}{25}"},{"id":"s8","latex":"100|p+q|=17"}],"track":"미적분"};</script>
