0이 되는 양수 \\(t_1\\)이 딱 하나 있어요. 그러므로 서로 다른 교점의 가로좌표는 \\(0,t_1\\) 두 개뿐입니다. 그 합이 \\(k+8=-2+8=6\\)이므로 \\(t_1=6\\)을 넣어 \\(b^2\\)를 구할 수 있어요.","skillTags":["equation.root-count","derivative.monotonicity"],"title":"나머지 해가 하나라는 이유도 확인해요"}},"steps":[{"id":"s1","latex":"\\{3f(x)^2+1\\}f'(x)=\\frac{-2ax}{(x^2+12)^2}-b=:g(x)"},{"id":"s2","latex":"b>0\\Rightarrow f'(0)\u003c0\\Rightarrow f'(x)\\le0\\ (\\forall x)"},{"id":"s3","latex":"g'(x)=\\frac{6a(x+2)(x-2)}{(x^2+12)^3}"},{"id":"s4","latex":"g(x)\\le0,\\ g(k)=0\\Rightarrow k=-2,\\quad g(-2)=0"},{"id":"s5","latex":"a=64b"},{"id":"s6","latex":"f(t)=-bt\\Rightarrow t^2\\{3b^2t^3+36b^2t-16\\}=0"},{"id":"s7","latex":"h(t)=3b^2t^3+36b^2t-16,\\quad h'(t)>0"},{"id":"s8","latex":"\\text{두 교점의 }x\\text{좌표는 }0,t_1,\\quad t_1=k+8=6"},{"id":"s9","latex":"h(6)=864b^2-16=0\\Rightarrow b^2=\\frac1{54}"},{"id":"s10","latex":"ab=64b^2=\\frac{32}{27}\\Rightarrow p+q=59"}],"track":"미적분"};</script>
