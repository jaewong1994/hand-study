<script>window.ExternalHandStudyRecord={"sourceKey":"ebsi:2026:g3:07:geometry:q30","sourceHash":"4b011b065b0507bd49d74649f742463174190ea96fd253c54bd7508bfb4fa538","contentHash":"f5c86604d797e3578e8df6bd9499e5e76d1a3c09d54d40fc51d94181adc7a0c5","sourceLabel":"인천광역시교육청 2026-07-08","adminYear":2026,"grade":3,"month":7,"number":30,"track":"기하","answer":"52","questionHtml":"\u003cfigure class=\"hfigwrap\">\u003cimg class=\"hfig\" src=\"../assets/external2026/ebsi-2026-g3-07-geometry-q30-307b0739fe9f110d.png\" alt=\"2026년 7월 30번 문제\">\u003c/figure>","steps":[{"id":"s1","latex":"\\angle ADB=\\frac\\pi2,\\ AB=10\\sqrt5,\\ AD=10\\Rightarrow BD=20"},{"id":"s2","latex":"H:\\ P\\text{에서 }\\alpha\\text{에 내린 수선의 발}\\Rightarrow DH=PH=BH=10"},{"id":"s3","latex":"PB=10\\sqrt2"},{"id":"s4","latex":"CD=AB-2AD\\cos\\angle DAB=6\\sqrt5"},{"id":"s5","latex":"CH^2=DH^2+DC^2-2DH\\cdot DC\\cos\\angle HDC=40"},{"id":"s6","latex":"PC=\\sqrt{PH^2+CH^2}=2\\sqrt{35}"},{"id":"s7","latex":"M:\\ C\\text{에서 }PB\\text{에 내린 수선의 발}\\Rightarrow MB=4\\sqrt2,\\ CM=2\\sqrt{17}"},{"id":"s8","latex":"N:\\ MN\\perp PB,\\ N\\in AB"},{"id":"s9","latex":"\\triangle BPA\\sim\\triangle BMN\\Rightarrow NB=4\\sqrt5,\\ NM=4\\sqrt3"},{"id":"s10","latex":"AN=CD=6\\sqrt5\\Rightarrow ANCD\\text{는 평행사변형},\\ CN=10"},{"id":"s11","latex":"\\cos\\theta=\\cos\\angle NMC=\\frac{NM^2+CM^2-CN^2}{2NM\\cdot CM}=\\frac1{\\sqrt{51}}"},{"id":"s12","latex":"\\cos^2\\theta=\\frac1{51}\\Rightarrow p+q=52"}],"diagram":null,"preview":false,"graphPlan":null,"graphHash":""};</script>
<script>window.HandStudyGuide={"sourceHash":"4b011b065b0507bd49d74649f742463174190ea96fd253c54bd7508bfb4fa538","contentHash":"f5c86604d797e3578e8df6bd9499e5e76d1a3c09d54d40fc51d94181adc7a0c5","overview":{"goal":"구의 지름에서 얻는 직각, 두 평면의 각, 정사영과 닮음을 차례로 사용해 \\(NM,CM,CN\\)을 구하고 마지막 각의 코사인을 계산해요.","firstLook":"\\(AB\\)가 구의 지름이라 \\(\\angle ADB=90^\\circ\\)이고, \\(AD=10\\)에서 \\(BD=20\\)이에요. \\(P\\)의 정사영 \\(H\\)가 \\(BD\\) 위에 있고 두 평면의 각이 \\(\\pi/4\\)라 직각이등변 관계로 \\(DH=PH=BH=10\\), 따라서 \\(PB=10\\sqrt2\\)예요.","conditions":[{"label":"구의 지름","meaning":"\\(AB\\)가 구의 지름이므로 구 위의 점 \\(D\\)에서 \\(\\angle ADB=90^\\circ\\)예요."},{"label":"정사영","meaning":"\\(H\\)는 \\(P\\)의 평면 \\(\\alpha\\) 위 정사영이고, \\(M\\)은 \\(C\\)에서 \\(PB\\)에 내린 수선의 발이에요."},{"label":"점의 소속","meaning":"\\(N\\)은 \\(AB\\) 위에 있고 \\(MN\\perp PB\\)라 두 직각삼각형의 닮음을 사용할 수 있어요."}]},"chapters":[{"id":"c1","label":"구의 단면과 수선으로 기본 길이를 구해요","stepIds":["s1","s2","s3"],"question":"정사영의 발에서 생기는 세 길이를 어떻게 연결하나요?","hint":"평면 \\(\\mathrm{PAD}\\)와 평면 \\(\\alpha\\)의 이면각을 두 평면에 각각 놓인 수선 \\(PH\\), \\(DH\\)가 이루는 각으로 읽으세요.","explanation":"\\(AB\\)가 구의 지름이라 구 위의 점 \\(D\\)에서 \\(\\angle ADB=90^\\circ\\)예요. 따라서 \\(BD=\\sqrt{AB^2-AD^2}=20\\)이에요. \\(H\\)는 \\(BD\\) 위에 있고 \\(PH\\perp\\alpha\\)이므로 \\(PH\\perp AD\\)예요. 또 \\(DH\\)도 \\(AD\\)에 수직이어서, 평면 \\(PAD\\)와 \\(\\alpha\\)의 이면각은 \\(\\angle PDH=\\pi/4\\)로 읽을 수 있어요. 그러므로 직각삼각형 \\(PDH\\)에서 \\(PH=DH\\)예요. \\(DH=t\\)라 두면 \\(BH=20-t\\)이고, \\(P\\)도 지름 \\(AB\\)인 구 위의 점이므로 \\(PA\\perp PB\\)예요. \\(AD\\), \\(DB\\), \\(PH\\)가 서로 수직인 방향임을 이용해 내적을 전개하면 \\(-DH\\cdot BH+PH^2=0\\), 곧 \\(t^2=t(20-t)\\)예요. \\(t>0\\)이므로 \\(t=10\\). 따라서 \\(DH=PH=BH=10\\), \\(PB=\\sqrt{BH^2+PH^2}=10\\sqrt2\\)예요.","check":{"prompt":"정사영의 발에서 생기는 세 길이를 어떻게 연결하나요?","answer":"\\(DH=BH=10\\)을 먼저 확인하고, 이면각이 \\(\\dfrac\\pi4\\)인 직각삼각형 \\(PDH\\)에서 \\(PH=DH=10\\)을 얻어요."}},{"id":"c2","label":"점 C에서 PB까지의 거리를 구해요","stepIds":["s4","s5","s6","s7"],"question":"점 C에서 선분 PB까지의 수선으로 두 길이를 어떻게 나누어 구하나요?","hint":"삼각형 \\(PCB\\)의 세 변을 구한 뒤, \\(PB\\) 위의 정사영 길이 \\(MB\\)를 코사인법칙으로 계산하세요.","explanation":"평면 \\(\\alpha\\)와 구의 교선은 지름 \\(AB\\)인 원이에요. \\(AD=BC=10\\)인 두 같은 길이의 현이므로 \\(D,C\\)에서 \\(AB\\)에 내린 높이가 같고, \\(CD<AB\\)인 배치를 택하면 \\(CD\\parallel AB\\)예요. \\(\\cos\\angle DAB=AD/AB=1/\\sqrt5\\)이므로 현 \\(AD\\)의 \\(AB\\) 방향 길이는 \\(AD\\cos\\angle DAB=2\\sqrt5\\)예요. 양 끝에서 같은 길이를 빼면 \\(CD=AB-2\\cdot2\\sqrt5=6\\sqrt5\\)예요.\n\n삼각형 \\(DCH\\)에서 \\(DH=10\\)이고 \\(DC\\parallel AB\\)이므로 \\(\\angle HDC=\\angle DBA\\), \\(\\cos\\angle HDC=BD/AB=2/\\sqrt5\\)예요. 따라서\n\n\\(CH^2=10^2+(6\\sqrt5)^2-2\\cdot10\\cdot6\\sqrt5\\cdot\\dfrac2{\\sqrt5}=40\\).\n\n또 \\(PH\\perp\\alpha\\)라 \\(PC^2=PH^2+CH^2=140\\), 즉 \\(PC=2\\sqrt{35}\\)예요. \\(C\\)에서 \\(PB\\)에 내린 수선의 발을 \\(M\\)이라 하면 \\(BC=10\\), \\(PB=10\\sqrt2\\)이고 삼각형 \\(PCB\\)에서\n\n\\(MB=\\dfrac{PB^2+BC^2-PC^2}{2PB}=4\\sqrt2\\),\n\n\\(CM=\\sqrt{BC^2-MB^2}=2\\sqrt{17}\\)\n\n을 얻어요.","check":{"prompt":"점 C에서 선분 PB까지의 수선으로 두 길이를 어떻게 나누어 구하나요?","answer":"\\(PB=10\\sqrt2\\), \\(PC=2\\sqrt{35}\\), \\(BC=10\\)을 대입하면 \\(MB=4\\sqrt2\\)이고, \\(PC^2=PM^2+CM^2\\)에서 \\(CM=2\\sqrt{17}\\)이에요."}},{"id":"c3","label":"평행사변형과 코사인법칙으로 마쳐요","stepIds":["s8","s9","s10","s11","s12"],"question":"사각형 ANCD가 평행사변형임을 어떤 두 사실로 확인하나요?","hint":"닮음으로 \\(NB\\), \\(NM\\)을 구한 뒤 \\(AB=10\\sqrt5\\), \\(CD=6\\sqrt5\\)와 비교하세요.","explanation":"\\(M\\)은 \\(PB\\) 위에 있고 \\(MN\\perp PB\\), \\(N\\in AB\\)이므로 직각삼각형 \\(BPA\\)와 \\(BMN\\)은 \\(B\\)의 각도 같아 닮아요. \\(PA=\\sqrt{AB^2-PB^2}=10\\sqrt3\\)이고 닮음비가 \\(BM:BP=4\\sqrt2:10\\sqrt2=2:5\\)이므로 \\(NB=4\\sqrt5\\), \\(NM=4\\sqrt3\\)이에요. 따라서 \\(AN=AB-NB=6\\sqrt5=CD\\)이고 앞에서 \\(CD\\parallel AB\\), 곧 \\(CD\\parallel AN\\)도 확인했으므로 \\(ANCD\\)는 평행사변형이에요. 그러므로 \\(CN=AD=10\\)이에요.\n\n평면 \\(PAB\\) 안에서 \\(MN\\perp PB\\)이고 평면 \\(PBC\\) 안에서 \\(CM\\perp PB\\)이므로 두 평면이 이루는 각 \\(\\theta\\)는 \\(\\angle NMC\\)예요. 삼각형 \\(NMC\\)에서\n\n\\(\\cos\\theta=\\dfrac{NM^2+CM^2-CN^2}{2NM\\cdot CM}=\\dfrac{48+68-100}{2\\cdot4\\sqrt3\\cdot2\\sqrt{17}}=\\dfrac1{\\sqrt{51}}\\).\n\n따라서 \\(\\cos^2\\theta=1/51\\), \\(p+q=52\\)예요.","check":{"prompt":"사각형 ANCD가 평행사변형임을 어떤 두 사실로 확인하나요?","answer":"\\(AN=AB-NB=6\\sqrt5=CD\\)이고 \\(AN\\parallel CD\\)이므로 한 쌍의 대변이 평행하고 길이가 같아 평행사변형이에요."}}],"takeaway":["구의 지름을 보는 원주각은 직각이므로 \\(AD,BD,AB\\) 사이의 피타고라스 관계를 먼저 만들어요.","정사영과 수선의 발은 서로 다른 평면에 놓인 길이를 직각삼각형으로 연결해요.","\\(AN\\parallel CD\\)와 \\(AN=CD\\)를 함께 확인해야 \\(ANCD\\)가 평행사변형이라고 결론낼 수 있어요."],"sourceKey":"ebsi:2026:g3:07:geometry:q30"};</script>
