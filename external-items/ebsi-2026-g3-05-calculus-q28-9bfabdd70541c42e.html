  <script>window.ExternalHandStudyRecord={"adminYear":2026,"answer":"⑤","contentHash":"604e0fe9e4964c5316717813ab7a9bf7dbe9bd79dc71164f40cc5535e6133261","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"learningHash":"1a3ba59fa34d3c36f0e4d5fdcf60773dc6c9ec9d51463875feb1c2637cbadf52","month":5,"number":28,"preview":false,"questionHtml":"\u003cfigure class=\"hfigwrap\">\u003cimg class=\"hfig\" src=\"../assets/external2026/ebsi-2026-g3-05-calculus-q28-1c60256aeb7b6d99.png\" alt=\"2026년 5월 28번 문제\">\u003c/figure>","sourceHash":"0ae025742c041604c0f60fd31a866f21a69ad71140e56a8a7f327021e3445984","sourceKey":"ebsi:2026:g3:05:calculus:q28","sourceLabel":"경기도교육청 2026-05-07","stepExplanations":{"s10":{"body":"짝수 번째 항은 양수여서 \\(b_n=a_n=|a_n|\\)이고, 홀수 번째 항도 세 번째 항을 빼면 \\(b_n=-a_n=|a_n|\\)예요. 그러므로 먼저 공비 \\(\\frac12\\)인 절댓값 수열을 더하면 \\(\\sum |a_n|=\\frac{5/2}{1-1/2}=5\\)입니다. 세 번째 항은 \\(|a_3|=-a_3\\) 대신 \\(a_3\\)로 바뀌므로 차이 \\(2a_3\\)를 더해요. \\(a_3=-\\frac58\\)이어서 전체는 \\(5-\\frac54=\\frac{15}{4}\\)입니다.","skillTags":["series.geometric","series.single-term-correction"],"title":"절댓값의 합에서 한 항의 차이만 고쳐요"},"s2":{"body":"\\(a_1=0\\)이면 모든 항과 \\(b_n\\)이 0이어서 조건의 합은 \\(k=1\\)부터 0이 돼요. 최솟값이 2라는 조건과 다릅니다. \\(a_1>0\\)이면 모든 홀수 번째 항이 양수이고, (가)에 따라 해당 \\(b_n=a_n\\)이어서 합이 0일 수 없어요. 따라서 \\(a_1\u003c0\\)이고, 공비가 음수이므로 홀수 번째 항은 음수, 짝수 번째 항은 양수입니다.","skillTags":["sequence.sign-cases","series.sign"],"title":"합이 처음 0이 되는 위치로 첫째항의 부호를 정해요"},"s4":{"body":"음수인 홀수 번째 항에 대해 (가)는 \\(b_{2n+1}=a_{2n+1}\\) 또는 \\(-a_{2n+1}\\)라는 뜻이에요. 그래서 \\(a_{2n+1}+b_{2n+1}\\)은 \\(2a_{2n+1}\u003c0\\) 또는 0입니다. \\(n\\ge2\\)인 이 항들의 합이 0인데 그중 하나라도 음수라면 다른 항들이 그것을 양수로 상쇄할 수 없어요. 따라서 모두 0이어야 하고 \\(b_{2n+1}=-a_{2n+1}\\)입니다.","skillTags":["series.sign","equation.zero-sum"],"title":"모두 0 이하인데 합이 0이면 각 항도 0이에요"},"s6":{"body":"\\(k=1\\)일 때는 합이 0이 아니어야 해요. \\(k=2\\)부터의 합이 이미 0이므로 \\(a_3+b_3\\ne0\\), 따라서 \\(b_3=a_3\\)입니다. 주어진 \\(b_1-b_3=3a_3+5\\)에 넣으면 \\(b_1=4a_3+5\\)예요. 공비의 제곱이 \\(\\frac14\\)이므로 \\(4a_3=a_1\\), 즉 \\(b_1=a_1+5\\)입니다. \\(b_1=a_1\\)이면 \\(5=0\\)이 되어 불가능하니 \\(b_1=-a_1\\)을 골라야 해요.","skillTags":["sequence.sign-cases","equation.elimination"],"title":"세 번째 항만 부호 선택이 달라요"}},"steps":[{"id":"s1","latex":"a_1=0\\Rightarrow\\text{최소 }k=1,\\quad a_1>0\\Rightarrow\\text{어느 꼬리합도 양수}"},{"id":"s2","latex":"\\therefore a_1\u003c0,\\quad a_{2n-1}\u003c0\u003ca_{2n}"},{"id":"s3","latex":"a_{2n+1}+b_{2n+1}=0\\ \\text{또는}\\ 2a_{2n+1}\u003c0"},{"id":"s4","latex":"T_k=\\sum_{n=k}^{\\infty}(a_{2n+1}+b_{2n+1}),\\quad T_2=0\\Rightarrow b_{2n+1}=-a_{2n+1}\\ (n\\ge2)"},{"id":"s5","latex":"T_1\\ne0\\Rightarrow b_3=a_3"},{"id":"s6","latex":"b_1-b_3=3a_3+5,\\quad b_1=-a_1"},{"id":"s7","latex":"-a_1=4a_3+5=a_1+5\\Rightarrow a_1=-\\frac52"},{"id":"s8","latex":"a_n=-\\frac52\\left(-\\frac12\\right)^{n-1}"},{"id":"s9","latex":"b_n=|a_n|\\ (n\\ne3),\\quad b_3=a_3"},{"id":"s10","latex":"\\sum_{n=1}^{\\infty}b_n=\\sum|a_n|+2a_3=5-\\frac54=\\frac{15}{4}"}],"track":"미적분"};</script>
