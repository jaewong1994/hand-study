<script>window.HandStudyGuide={"sourceKey":"ebsi:2026:g1:09:q30","sourceHash":"fea7b302bd0555dd18e25b79723bcfe86b90f50d57cb80c74d65f2f452ec3423","contentHash":"5433bd388baf0dfaa2ea52a79686c3cfc8681c8040edd4e0750a8d6a620e346c","overview":{"goal":"두 포물선과 직선의 접점 조건, 수평선 교점의 근의 합, 공통점에서의 접선을 차례로 연결해요.","firstLook":"직선 \\(y=2x\\)와 각 포물선의 교점 방정식은 판별식이 같아요. 전체 서로 다른 교점이 두 개라는 조건이 각 포물선과 한 번씩 접한다는 뜻인지 먼저 확인해요.","conditions":[{"label":"(가)","meaning":"수평선 \\(y=f(0)\\)과 두 포물선의 교점 순서로 \\(k<0\\)을 정해요."},{"label":"(나)","meaning":"세 교점의 \\(x\\)좌표에 대한 근의 합 관계로 \\(a=-2k\\)를 얻어요."}]},"chapters":[{"id":"c1","label":"두 포물선의 공통 접선을 확인해요","stepIds":["s1","s2"],"question":"전체 교점이 두 개이면 왜 두 교점 방정식의 판별식이 모두 \\(0\\)일까요?","hint":"두 방정식은 판별식이 같고, \\(k\\ne0\\)이므로 두 방정식의 근의 합은 서로 달라요.","explanation":"\\(f(x)=2x\\)와 \\(g(x)=2x\\)의 판별식은 모두 \\(8a-4b+4\\)예요. 이 값이 양수라면 각 방정식은 서로 다른 두 근을 가져요. 두 근의 합은 각각 \\(2(a+1)\\), \\(2(a+k+1)\\)이고 \\(k\\ne0\\)이므로 두 근의 집합이 완전히 같을 수 없어요. 따라서 서로 다른 교점은 적어도 세 개가 되어 원문의 두 개와 모순이에요. 판별식이 음수이면 교점이 없으므로, 가능한 것은 두 판별식이 모두 \\(0\\)인 경우뿐이에요. 따라서 직선은 각 포물선과 한 점에서 접하고 \\(8a-4b+4=0\\), 즉 \\(b=2a+1\\)이에요.","check":{"prompt":"판별식이 양수일 때 두 포물선의 교점 네 개가 두 개로 완전히 겹칠 수 없는 이유는 무엇인가요?","answer":"두 이차방정식의 근의 합 차가 \\(2k\\ne0\\)이므로 두 근의 집합이 같을 수 없어요."}},{"id":"c2","label":"수평선 교점의 근의 합을 연결해요","stepIds":["s3","s4","s5"],"question":"조건 (가), (나)에서 왜 \\(k<0\\), \\(a=-2k\\)가 나오나요?","hint":"\\(t_1=2a\\), \\(t_2+t_3=2(a+k)\\)를 쓰고 \\(t_2<0<t_3<t_1\\)도 함께 이용해요.","explanation":"\\(f(x)=f(0)\\)을 풀면 \\(x(x-2a)=0\\)이므로 \\(t_1=2a\\)예요. \\(g(x)=f(0)\\)의 두 근의 합은 \\(t_2+t_3=2(a+k)\\)예요. 조건 (가)에서 \\(t_2<0\\)이므로 \\(t_2+t_3<t_3<t_1=2a\\)예요. 따라서 \\(2(a+k)<2a\\), 즉 \\(k<0\\)이에요. 조건 (나)의 \\(t_1=2(t_2+t_3)\\)에 근의 합을 넣으면 \\(2a=4(a+k)\\)이므로 \\(a=-2k\\)예요.","check":{"prompt":"축의 이동만 보고 \\(k<0\\)이라고 하면 왜 부족한가요?","answer":"교점의 순서가 실제로 근의 합 \\(t_2+t_3<t_1\\)을 만들고, 이를 \\(2(a+k)<2a\\)로 계산해야 부호가 확정돼요."}},{"id":"c3","label":"직선 h가 수평인 접선임을 밝혀요","stepIds":["s6","s7","s8","s9"],"question":"\\(h(x)=mx+n\\)의 기울기 \\(m\\)은 왜 \\(0\\)인가요?","hint":"\\(g(x)=h(x)\\)을 한쪽으로 모은 이차방정식의 \\(x\\)계수를 보고 두 근의 합을 구해요.","explanation":"\\(g(x)=h(x)\\)을 정리하면 최고차항 계수가 \\(1\\), \\(x\\)의 계수가 \\(-2(a+k)-m\\)인 이차방정식이 돼요. 따라서 서로 다른 두 근의 합은 \\(2(a+k)+m\\)이에요. 원문에서 이 합이 \\(2(a+k)\\)라고 했으므로 \\(m=0\\)이에요. 즉 \\(h\\)는 수평선이에요. 또 \\(h\\)는 포물선 \\(y=f(x)\\)와 한 점에서만 만나므로 꼭짓점에서 접하는 수평선 \\(y=b\\)예요.","check":{"prompt":"\\(g(x)=h(x)\\)의 두 근의 합을 구할 때 어떤 계수를 확인하나요?","answer":"\\(g(x)-h(x)\\)의 \\(x\\)계수는 \\(-2(a+k)-m\\)이므로, 근과 계수의 관계에 따라 두 근의 합은 \\(2(a+k)+m\\)이에요."}},{"id":"c4","label":"남은 상수와 마지막 값을 구해요","stepIds":["s10","s11","s12"],"question":"\\(k\\)의 두 후보 중 어떤 값이 남나요?","hint":"두 포물선의 공통점이 수평선 \\(y=b\\) 위에 있으므로 \\(g(a)=b\\)를 써요.","explanation":"수평선 \\(y=b\\)는 \\(f\\)와 꼭짓점 \\((a,b)\\)에서만 만나고 이 점이 두 포물선의 공통점이므로 \\(g(a)=b\\)예요. 이를 계산하면 \\(k^2+2k=0\\), 즉 \\(k=0\\) 또는 \\(k=-2\\)예요. 원문에서 \\(k\\ne0\\)이고 앞에서 \\(k<0\\)도 확인했으므로 \\(k=-2\\)예요. 따라서 \\(a=-2k=4\\), \\(b=2a+1=9\\)예요. 마지막으로 \\(f(-2)=(-6)^2+9=45\\), \\(g(-2)=(-4)^2+9-4=21\\)이므로 \\(f(k)-g(k)=24\\)예요.","check":{"prompt":"\\(k=0\\)을 제외하는 조건은 무엇인가요?","answer":"원문이 \\(k\\ne0\\)이라고 했고, 조건 (가)에서도 \\(k<0\\)을 얻었어요."}}],"takeaway":["전체 교점 수가 작다는 조건은 판별식뿐 아니라 서로 다른 방정식의 근이 겹칠 가능성까지 확인해요.","교점의 순서로 매개변수의 부호를 정할 때에는 근의 합에 실제 부등식을 적용해요.","직선과 이차함수의 교점 방정식에서 근의 합은 \\(x\\)계수를 정확히 전개해 확인해요."]};</script>
