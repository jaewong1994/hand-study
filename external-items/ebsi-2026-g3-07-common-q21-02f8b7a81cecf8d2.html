<script>window.ExternalHandStudyRecord={"sourceKey":"ebsi:2026:g3:07:common:q21","sourceHash":"fcf51b3ed5704302af0a311b06615ae0dadc4819660460bd106a92a76c7c6234","contentHash":"e704b1db25ff2764bbc62fea247d7ade155c09b4fb9c67efb453fa9a67e2a2d0","sourceLabel":"인천광역시교육청 2026-07-08","adminYear":2026,"grade":3,"month":7,"number":21,"track":"공통","answer":"320","questionHtml":"<figure class=\"hfigwrap\"><img class=\"hfig\" src=\"../assets/external2026/ebsi-2026-g3-07-common-q21-bea01f5d7faf704f.png\" alt=\"2026년 7월 21번 문제\"><\/figure>","steps":[{"id":"s1","latex":"\\lim_{t\\to0+}g(t)=6\\Rightarrow f(x)=0\\text{의 서로 다른 세 근은 }a,b,4"},{"id":"s2","latex":"4=\\frac{3a}{2}\\Rightarrow\\lim_{t\\to0+}g(t)=5\\quad\\bot"},{"id":"s3","latex":"a<4<\\frac{3a}{2},\\ b>\\frac{3a}{2}\\text{이면 모든 }t>0\\text{에서 해가 적어도 }2\\text{개}\\quad\\bot"},{"id":"s4","latex":"\\therefore b<a<4<\\frac{3a}{2}"},{"id":"s5","latex":"\\beta=\\lim_{x\\to(3a/2)+}|f(x)|"},{"id":"s6","latex":"|f|=t\\text{의 해의 개수는 극값 높이를 지날 때만 변하므로 불연속 후보 높이는 네 개}"},{"id":"s7","latex":"g\\text{의 불연속점이 둘뿐}\\Rightarrow\\left|f\\left(\\frac{a+b}{2}\\right)\\right|=\\left|f\\left(\\frac{a+4}{2}\\right)\\right|=\\left|f\\left(\\frac{3a}{2}\\right)\\right|"},{"id":"s8","latex":"\\frac{(a-4)^2}{4}=\\frac{a(3a-8)}4\\Rightarrow a=2\\sqrt2"},{"id":"s9","latex":"\\frac{(a-b)^2}{4}=\\frac{(4-a)^2}{4}\\Rightarrow b=2a-4=4\\sqrt2-4"},{"id":"s10","latex":"f(0)=ab=16-8\\sqrt2"},{"id":"s11","latex":"p^2+q^2=16^2+(-8)^2=320"}],"diagram":null,"preview":false,"graphPlan":null,"graphHash":"","editionHash":"9acaf43d7826148c1f97fe0dbcc05d2ec883dbcd3c6ece483b464613e386951f"};</script>
<script>window.HandStudyGuide={"sourceKey":"ebsi:2026:g3:07:common:q21","sourceHash":"fcf51b3ed5704302af0a311b06615ae0dadc4819660460bd106a92a76c7c6234","contentHash":"e704b1db25ff2764bbc62fea247d7ade155c09b4fb9c67efb453fa9a67e2a2d0","overview":{"goal":"작은 양수 t에서 생기는 해를 세어 세 영점의 순서를 정하고, 해의 개수가 바뀌는 네 높이를 두 높이로 합쳐 a와 b를 구해요.","firstLook":"\\(|f(x)|=t\\)의 해의 개수는 그래프 \\(y=|f(x)|\\)와 수평선 \\(y=t\\)의 교점 수예요. \\(t\\)가 \\(0\\)에 가까울 때는 영점 주변을 보고, 불연속점은 각 이차함수 조각의 꼭짓점 높이와 구간 끝 높이를 비교해 찾아요.","conditions":[{"label":"(가)","meaning":"아주 작은 양수 \\(t\\)에서 교점이 \\(6\\)개이므로, 서로 다른 세 영점이 각각 양쪽에서 교점을 만들어요."},{"label":"(나)","meaning":"해의 개수가 바뀌는 높이는 두 개뿐이고, 첫 변화 직후와 둘째 변화 직전의 해의 개수는 모두 \\(1\\)이에요."}]},"chapters":[{"id":"c1","label":"작은 높이에서 세 영점을 찾아요","stepIds":["s1","s2"],"question":"t가 0에 가까울 때 해가 6개라는 사실은 a, b, 4의 위치에 무엇을 요구할까요?","hint":"두 식의 영점 후보는 \\(a,b,4\\)예요. 각 영점의 양쪽에 \\(|f(x)|=t\\)의 해가 하나씩 생겨야 모두 \\(6\\)개가 돼요.","explanation":"두 이차식에 나타나는 영점 후보는 \\(a\\), \\(b\\), \\(4\\)예요. \\(x=a\\)에서는 두 식이 모두 \\(0\\)이고, \\(x=4\\)는 첫째 식을 쓰는 구간 안에 있어야 실제 영점이며, \\(x=b\\)는 둘째 식을 쓰는 구간 안에 있어야 실제 영점이에요. \\(t\\)가 \\(0\\)보다 조금 클 때 영점 하나의 양쪽에서 \\(|f(x)|=t\\)의 해가 하나씩 생기면 영점 하나당 해가 \\(2\\)개예요. 극한값이 \\(6\\)이므로 \\(a,b,4\\)가 서로 다른 영점으로 모두 나타나야 해요.\n\n점 \\(4\\)가 첫째 구간에 있으려면 \\(a<4\\le\\dfrac{3a}{2}\\)예요. 만약 \\(4=\\dfrac{3a}{2}\\)이면 \\(x=4\\)의 오른쪽에서는 둘째 식으로 바뀌어 \\(0\\)에 가까워지지 않으므로, 이 영점 근처에서 해가 한쪽에만 생겨 전체가 \\(5\\)개가 돼요. 따라서\n\n\\(a<4<\\dfrac{3a}{2}\\)\n\n이고, \\(b\\)는 둘째 식의 구간에 있어야 하므로 \\(b<a\\) 또는 \\(b>\\dfrac{3a}{2}\\)예요.","check":{"prompt":"왜 \\(4=\\dfrac{3a}{2}\\)인 경우에는 영점 4가 해 두 개를 만들지 못하나요?","answer":"점 \\(4\\)에서는 첫째 식의 값이 \\(0\\)이지만 바로 오른쪽은 둘째 식을 써서 일반적으로 \\(0\\)으로 이어지지 않아요. 그래서 작은 높이와 만나는 점이 영점의 한쪽에만 생겨요."}},{"id":"c2","label":"b의 위치를 한쪽으로 정해요","stepIds":["s3","s4"],"question":"b가 오른쪽 구간에 있다고 하면 왜 조건 (나)의 극한값 1과 맞지 않을까요?","hint":"둘째 이차식 \\((x-a)(x-b)\\)에서 양의 높이 \\(t\\)와 만나는 가장 왼쪽 점과 가장 오른쪽 점을 보세요.","explanation":"만약 \\(b>\\dfrac{3a}{2}\\)라면 둘째 이차식 \\(y=(x-a)(x-b)\\)에서 방정식 \\((x-a)(x-b)=t\\)는 모든 \\(t>0\\)에 대하여 한 근이 \\(a\\)보다 작고 다른 한 근이 \\(b\\)보다 커요. 두 근은 각각 둘째 식을 사용하는 구간 \\(x<a\\), \\(x>\\dfrac{3a}{2}\\)에 들어가므로 \\(|f(x)|=t\\)는 언제나 적어도 두 해를 가져요.\n\n그런데 조건 (나)에는 한 불연속점의 바로 오른쪽에서 \\(g(t)\\)가 \\(1\\)이 된다고 주어졌어요. 이는 모든 \\(t>0\\)에서 \\(g(t)\\ge2\\)라는 결론과 모순이에요. 따라서 오른쪽 경우는 제외되고\n\n\\(b<a<4<\\dfrac{3a}{2}\\)\n\n만 남아요.","check":{"prompt":"\\((x-a)(x-b)=t\\)의 두 근이 왜 각각 \\(a\\)의 왼쪽과 \\(b\\)의 오른쪽에 있나요?","answer":"위로 열린 이차함수는 두 영점 \\(a,b\\)의 바깥에서 양수이고, 양의 수평선 \\(y=t\\)와 두 영점 바깥쪽에서 한 번씩 만나기 때문이에요."}},{"id":"c3","label":"해의 개수가 바뀌는 높이를 모아요","stepIds":["s5","s6","s7"],"question":"왜 세 높이가 같아야 g의 불연속점이 두 개만 남을까요?","hint":"왼쪽 이차함수 조각의 최솟값, 가운데 조각의 최솟값, 가운데 구간의 오른쪽 끝값을 각각 계산하세요.","explanation":"순서가 \\(b<a<4<\\dfrac{3a}{2}\\)로 정해졌어요. 먼저 왼쪽 구간에는 방정식 \\((x-a)(x-b)=t\\)의 해가 모든 \\(t>0\\)에서 하나 있으므로, 해의 개수는 어떤 높이에서도 \\(0\\)이 되지 않아요. 수평선 \\(y=t\\)와 \\(y=|f(x)|\\)의 교점 수가 줄어드는 높이는 다음 세 곳에서 생겨요.\n\n왼쪽 구간의 이차식은 \\(x=\\dfrac{a+b}{2}\\)에서 가장 아래로 내려가므로 그 절댓값 높이는\n\n\\(H_1=\\left|f\\left(\\dfrac{a+b}{2}\\right)\\right|=\\dfrac{(a-b)^2}{4}\\)\n\n예요. 가운데 구간의 이차식은 \\(x=\\dfrac{a+4}{2}\\)에서 가장 아래로 내려가므로\n\n\\(H_2=\\left|f\\left(\\dfrac{a+4}{2}\\right)\\right|=\\dfrac{(4-a)^2}{4}\\)\n\n예요. 또 가운데 조각의 오른쪽 끝에서는 값이 양수이고\n\n\\(H_3=\\left|f\\left(\\dfrac{3a}{2}\\right)\\right|=\\dfrac{a(3a-8)}4\\)\n\n예요. 수평선이 \\(H_1\\)을 지나면 교점이 \\(2\\)개, \\(H_2\\)를 지나면 \\(2\\)개, \\(H_3\\)를 지나면 \\(1\\)개 줄어요. 한편 오른쪽 구간은 경계 \\(x=\\dfrac{3a}{2}\\)에서의 둘째 식 높이\n\n\\(H_4=\\left|\\left(\\dfrac a2\\right)\\left(\\dfrac{3a}{2}-b\\right)\\right|=\\dfrac{a(3a-2b)}4\\)\n\n를 지난 뒤 교점이 \\(1\\)개 늘어요. 그러므로 오른쪽 극한이 \\(1\\)인 불연속점은 교점이 줄어드는 쪽이어야 하고, 그 높이에서 처음 \\(6\\)개 중 \\(5\\)개가 한꺼번에 사라져야 해요. 세 감소 높이가 서로 다르면 그때마다 불연속점이 생겨 전체가 둘을 넘고, 어느 하나만 먼저 지나도 오른쪽 교점 수가 \\(1\\)보다 커요. 따라서\n\n\\(H_1=H_2=H_3\\)\n\n예요. 이 공통 높이가 \\(t=\\alpha\\)이고, \\(H_4\\)가 나머지 불연속점 \\(t=\\beta\\)예요. \\(H_4\\)를 지나기 직전에는 왼쪽의 늘 존재하는 해 하나만 남으므로 \\(\\lim_{t\\to\\beta-}g(t)=1\\)도 확인돼요.","check":{"prompt":"세 높이에서 줄어드는 교점 수를 더하면 왜 5개인가요?","answer":"두 이차함수 조각의 아래쪽 골짜기에서 각각 교점 \\(2\\)개가 사라지고, 가운데 조각의 오른쪽 끝에서 교점 \\(1\\)개가 사라져서 모두 \\(2+2+1=5\\)개예요. 따라서 \\(6\\)개에서 \\(1\\)개가 돼요."}},{"id":"c4","label":"같은 높이 식으로 a와 b를 구해요","stepIds":["s8","s9"],"question":"세 높이의 등식 가운데 어떤 두 식이 먼저 a를 정할까요?","hint":"\\(H_2=H_3\\)에는 \\(b\\)가 없어요. 먼저 이 식으로 \\(a\\)를 구하세요.","explanation":"먼저 \\(H_2=H_3\\)을 쓰면\n\n\\(\\dfrac{(a-4)^2}{4}=\\dfrac{a(3a-8)}4\\)\n\n이고, 양변에 \\(4\\)를 곱하여 전개하면\n\n\\(a^2-8a+16=3a^2-8a\\)\n\n\\(2a^2=16\\)\n\n이에요. \\(a>0\\)이므로 \\(a=2\\sqrt2\\)예요. 이 값은 앞에서 얻은 \\(a<4<\\dfrac{3a}{2}\\)도 만족해요.\n\n이제 \\(H_1=H_2\\)를 쓰면\n\n\\(\\dfrac{(a-b)^2}{4}=\\dfrac{(4-a)^2}{4}\\)\n\n예요. \\(b<a<4\\)이므로 \\(a-b\\)와 \\(4-a\\)가 모두 양수여서 \\(a-b=4-a\\)예요. 따라서\n\n\\(b=2a-4=4\\sqrt2-4\\)\n\n를 얻어요.","check":{"prompt":"\\((a-b)^2=(4-a)^2\\)에서 음의 부호 경우를 택하지 않는 이유는 무엇인가요?","answer":"이미 \\(b<a<4\\)를 확인했으므로 \\(a-b>0\\), \\(4-a>0\\)이에요. 두 양수의 제곱이 같으므로 두 양수 자체가 같아요."}},{"id":"c5","label":"f(0)의 계수를 읽어요","stepIds":["s10","s11"],"question":"\\(x=0\\)에서는 어느 식을 사용하고, \\(p\\)와 \\(q\\)는 각각 무엇인가요?","hint":"\\(0<a\\)이므로 \\(x<a\\)에서 쓰는 둘째 식 \\((x-a)(x-b)\\)에 대입하세요.","explanation":"\\(a>0\\)이므로 \\(x=0\\)에서는 둘째 식을 사용해요. 따라서\n\n\\(f(0)=(-a)(-b)=ab\\)\n\n이고, 구한 값을 대입하면\n\n\\(f(0)=2\\sqrt2(4\\sqrt2-4)=16-8\\sqrt2\\)\n\n예요. \\(f(0)=p+q\\sqrt2\\)와 비교하면 \\(p=16\\), \\(q=-8\\)이므로\n\n\\(p^2+q^2=16^2+(-8)^2=256+64=320\\)\n\n이에요.","check":{"prompt":"q가 음수여도 \\(q^2\\)를 계산할 때 놓치지 말아야 할 것은 무엇인가요?","answer":"\\(q=-8\\)이므로 \\(q^2=(-8)^2=64\\)예요. 부호는 제곱에서 사라지지만, \\(q\\) 자체를 읽을 때는 \\(-8\\)로 써야 해요."}}],"takeaway":["\\(|f(x)|=t\\)의 해의 개수는 \\(y=|f(x)|\\)와 수평선 \\(y=t\\)의 교점 수로 읽어요.","조각함수의 영점이 경계에 걸리면 양쪽에서 해가 생기는지 따로 확인해요.","해의 개수가 바뀌는 높이는 각 조각의 꼭짓점 높이와 구간 끝 높이를 모두 모아 비교해요.","제곱을 풀어 부호를 정할 때는 앞에서 확정한 수의 순서를 다시 사용해요."]};</script>
