<script>window.ExternalHandStudyRecord={"sourceKey":"ebsi:2026:g3:05:probability-statistics:q30","sourceHash":"eecfe09f23f3d409725c494c8eed9220bcf9a6e3e09f7633d9ad14684efecc12","contentHash":"5890dd3b44a05c8737d3f8c8962ca59049c29eb914cfd35ee4f33aef968014ea","sourceLabel":"경기도교육청 2026-05-07","adminYear":2026,"grade":3,"month":5,"number":30,"track":"확률과통계","answer":"398","questionHtml":"\u003cfigure class=\"hfigwrap\">\u003cimg class=\"hfig\" src=\"../assets/external2026/ebsi-2026-g3-05-probability-statistics-q30-dbb99ff407ee2ad7.png\" alt=\"2026년 5월 30번 문제\">\u003c/figure>","steps":[{"id":"s1","latex":"\\text{조건에 따라 }8\\text{이 적힌 카드는 }8\\text{번 상자에 고정}"},{"id":"s2","latex":"2\\text{번 상자에 }2\\text{의 배수 카드}:\\quad2\\cdot2!=4"},{"id":"s3","latex":"\\text{공은 }4\\text{번 상자에 }4\\text{개를 먼저 넣고 나머지 }4\\text{개를 배분}:\\quad{}_4H_4=35"},{"id":"s4","latex":"N_1=4\\cdot35=140"},{"id":"s5","latex":"4\\text{번 상자에 }4\\text{의 배수 카드}:\\quad2!,\\qquad\\text{남은 공 }6\\text{개 배분}:\\ {}_4H_6=84"},{"id":"s6","latex":"N_2=2\\cdot84=168"},{"id":"s7","latex":"2,4\\text{번 상자에 공을 각각 }2,4\\text{개 고정}:\\quad{}_4H_2=10"},{"id":"s8","latex":"8\\text{번 상자의 카드가 }2\\text{장일 때 }6\\text{가지},\\quad3\\text{장일 때 }3\\text{가지}"},{"id":"s9","latex":"N_3=10(6+3)=90,\\quad N=140+168+90=398"}],"diagram":null,"preview":false,"graphPlan":null,"graphHash":""};</script>
<script>window.HandStudyGuide={"sourceKey":"ebsi:2026:g3:05:probability-statistics:q30","sourceHash":"eecfe09f23f3d409725c494c8eed9220bcf9a6e3e09f7633d9ad14684efecc12","contentHash":"5890dd3b44a05c8737d3f8c8962ca59049c29eb914cfd35ee4f33aef968014ea","overview":{"firstLook":"카드 \\(8\\)이 상자 \\(8\\)에 없다면 그 상자는 공 \\(8\\)개로 조건을 만족해야 해요. 그러면 상자 \\(2,4\\)는 카드 조건을 모두 만족해야 하지만, 상자 \\(1\\)에 카드 한 장, 상자 \\(8\\)에 카드 두 장 이상을 넣고 나면 두 상자에 줄 카드가 한 장뿐이라 불가능해요. 따라서 카드 \\(8\\)은 상자 \\(8\\)에 고정돼요.","goal":"카드 조건이 성립하는 세 경우를 겹치지 않게 나누어 공 배치를 세어요.","conditions":[{"meaning":"카드 \\(8\\)이 없으면 공을 모두 상자 \\(8\\)에 넣어야 하고, 남은 카드 수로 상자 \\(2,4\\)의 조건을 동시에 만족시킬 수 없어요.","label":"카드 8의 위치를 먼저 고정해요"},{"meaning":"조건을 만족시키는 우선 장치를 카드/공으로 나눠 중복을 제거해요.","label":"조건을 만족시키는 방식을 분리해요"}]},"chapters":[{"question":"첫 경우의 카드 배치가 왜 4가지인가요?","check":{"prompt":"첫 경우의 카드 배치가 왜 4가지인가요?","answer":"카드 \\(8\\)을 고정한 뒤 상자 \\(2\\)에 카드 \\(2\\) 또는 \\(4\\)를 넣는 두 선택과 남은 두 카드의 순서 \\(2!\\)를 곱해 \\(4\\)가지예요."},"stepIds":["s1","s2","s3"],"id":"c1","explanation":"8의 배수 카드는 8뿐이므로 카드 8은 상자 8에 고정돼요. 먼저 상자 2가 조건을 만족하고 상자 4는 공 조건으로 만족하는 경우, 카드 배치 \\(2\\cdot2!=4\\)와 공 배치 \\({}_4H_4=35\\)를 곱해 140이에요.","hint":"8 카드를 고정한 뒤 2 상자 조건을 만족시키는 카드 선택과 남은 카드 순서를 세어요.","label":"카드 8의 위치를 먼저 고정해요"},{"question":"둘째 경우가 첫째와 겹치지 않도록 무엇을 고정했나요?","check":{"prompt":"둘째 경우가 첫째와 겹치지 않도록 무엇을 고정했나요?","answer":"조건을 만족시키는 우선 장치를 카드/공으로 나눠 중복을 제거해요."},"stepIds":["s4","s5","s6"],"id":"c2","explanation":"상자 \\(4\\)가 카드 조건을 만족하고 상자 \\(2\\)는 카드 조건을 만족하지 않는 배치는 \\(2\\)가지예요. 이때 공은 제한 없이 네 상자에 나뉘므로 \\({}_4\\mathrm H_6=84\\)이고 \\(2\\cdot84=168\\)이에요. 앞 경우는 상자 \\(2\\)가 카드 조건을 만족하고 상자 \\(4\\)가 만족하지 않는 경우라 서로 겹치지 않아요.","hint":"4번 상자는 카드 조건으로 만족하고 공 수는 제한하지 않는 경우예요.","label":"조건을 만족시키는 방식을 분리해요"},{"question":"8번 상자의 카드 수가 2장과 3장일 때 왜 6,3가지인가요?","check":{"prompt":"8번 상자의 카드 수가 2장과 3장일 때 왜 6,3가지인가요?","answer":"두 상자 모두 카드 조건을 만족하지 않는 카드 배치는 상자 \\(8\\)의 카드가 두 장이면 \\(6\\)가지, 세 장이면 \\(3\\)가지예요. 각각을 직접 배치해 합하면 \\(9\\)가지예요."},"stepIds":["s7","s8","s9"],"id":"c3","explanation":"상자 2와 4가 각각 공 2개,4개로 만족하면 남은 공 배치는 \\({}_4H_2=10\\)이에요. 카드 8상자에 카드가 2장인 경우 6가지, 3장인 경우 3가지여서 90, 총합은 \\(140+168+90=398\\)이에요.","hint":"1번 상자 카드 1장을 고정한 상태에서 남은 카드의 상자 선택을 열거해요.","label":"마지막 겹침 경우를 직접 세어요"}],"takeaway":["빈 상자를 허용해 중복조합을 썼다.","카드와 공은 모두 남김없이 배분했다.","세 경우의 중복 여부를 조건 충족 방식으로 확인했다."]};</script>
