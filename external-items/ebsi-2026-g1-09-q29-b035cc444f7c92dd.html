<script>window.HandStudyGuide={"sourceKey":"ebsi:2026:g1:09:q29","sourceHash":"14726ecefcc1570e90482b591e4b2d660be61ea79a77f326dc885d6cfe4d34c1","contentHash":"0323c0123c6d23c098861af4fcfc87c90d40173536ec5a5aa26b4883e8355e75","overview":{"goal":"두 바깥 간격을 먼저 정한 뒤, 가운데 두 수를 고르는 방법을 빠짐없이 세어요.","firstLook":"\\(a<b<c<d<e\\)에서 \\(c,d\\)는 \\(b\\)와 \\(e\\) 사이에 있어요. 그래서 \\(h=b-a\\), \\(r=e-b\\)로 두면, 먼저 가능한 \\(h,r,b\\)를 정하고 마지막에 \\(c,d\\)를 고를 수 있어요.","conditions":[{"label":"(가)","meaning":"다섯 수가 모두 다르며, \\(c,d\\)는 \\(b\\)와 \\(e\\) 사이의 수 중 두 개를 작은 순서대로 골라요."},{"label":"(나)","meaning":"\\(r=e-b\\)는 \\(2h=2(b-a)\\)보다 큰 자연수예요."},{"label":"(다)","meaning":"\\(b,e\\) 가운데 적어도 하나는 짝수여야 해요."}]},"chapters":[{"id":"c1","label":"두 간격의 범위를 줄여요","stepIds":["s1","s2"],"question":"왜 \\(h=b-a\\)는 \\(1\\) 또는 \\(2\\)만 가능할까요?","hint":"\\(a\\ge1\\), \\(b=a+h\\), \\(r>2h\\), \\(e=b+r\\le9\\)를 한 줄로 이어 보세요.","explanation":"\\(h=b-a\\), \\(r=e-b\\)로 두면 \\(h\\ge1\\), \\(r>2h\\)예요. 또 \\(a\\ge1\\)이므로 \\(b=a+h\\ge h+1\\)이고, 자연수인 \\(r\\)은 \\(r\\ge2h+1\\)이에요. 따라서 \\(e=b+r\\ge(h+1)+(2h+1)=3h+2\\)예요. 그런데 \\(e\\le9\\)이므로 \\(3h+2\\le9\\), 즉 \\(h\\le2\\)예요. 그래서 \\(h=1,2\\)만 살피면 돼요.","check":{"prompt":"\\(h=3\\)이 불가능한 이유를 가장 작은 \\(e\\)로 확인하면 어떻게 되나요?","answer":"\\(b\\ge4\\), \\(r\\ge7\\)이어서 \\(e=b+r\\ge11\\)이 됩니다. \\(e\\le9\\)와 맞지 않아요."}},{"id":"c2","label":"간격이 1인 경우를 실제로 세어요","stepIds":["s3","s4"],"question":"\\(h=1\\)일 때 계수 \\(5,2,3,1,1\\)은 각각 어떤 \\(b,r\\)에서 나올까요?","hint":"각 \\(r\\)마다 \\(2\\le b\\le9-r\\)를 쓰고, \\(e=b+r\\)와 \\(b\\)의 홀짝을 비교해요.","explanation":"\\(h=1\\)이면 \\(a=b-1\\)이므로 \\(b\\ge2\\)이고, \\(r>2\\)이므로 \\(r=3,4,5,6,7\\)이에요. \\(e=b+r\\le9\\)와 \\(be\\)가 짝수라는 조건까지 넣어 하나씩 세면 다음과 같아요.\n\n\\(r=3\\): \\(b=2,3,4,5,6\\)이고 \\(e=b+3\\)은 \\(b\\)와 홀짝이 반대라서 다섯 경우 모두 가능해요. 계수는 \\(5\\)예요.\n\n\\(r=4\\): \\(b=2,3,4,5\\)이고 \\(e=b+4\\)는 \\(b\\)와 홀짝이 같아요. \\(b=2,4\\)일 때만 곱이 짝수이므로 계수는 \\(2\\)예요.\n\n\\(r=5\\): \\(b=2,3,4\\)이고 \\(e=b+5\\)는 \\(b\\)와 홀짝이 반대라서 세 경우가 모두 가능해요. 계수는 \\(3\\)이에요.\n\n\\(r=6\\): \\(b=2,3\\) 중 \\((b,e)=(2,8)\\)만 가능하고 \\((3,9)\\)는 곱이 홀수예요. 계수는 \\(1\\)이에요.\n\n\\(r=7\\): \\(b=2\\), \\(e=9\\)인 한 경우만 가능해요. 계수는 \\(1\\)이에요.\n\n이제 \\(b\\)와 \\(e\\) 사이에는 \\(r-1\\)개의 자연수가 있고, 여기서 \\(c,d\\) 두 개를 고르면 순서는 자동으로 정해져요. 따라서 경우의 수는 \\(5\\,{}_{2}\\mathrm{C}_{2}+2\\,{}_{3}\\mathrm{C}_{2}+3\\,{}_{4}\\mathrm{C}_{2}+{}_{5}\\mathrm{C}_{2}+{}_{6}\\mathrm{C}_{2}=5+6+18+10+15=54\\)예요.","check":{"prompt":"\\(r=4\\)에서 \\(b=3,5\\)를 빼야 하는 이유는 무엇인가요?","answer":"각각 \\((b,e)=(3,7),(5,9)\\)가 되어 두 수가 모두 홀수이고, \\(be\\)가 홀수가 되기 때문이에요."}},{"id":"c3","label":"간격이 2인 경우를 마무리해요","stepIds":["s5","s6"],"question":"\\(h=2\\)에서는 왜 \\(12\\)가지밖에 더해지지 않을까요?","hint":"\\(b\\ge3\\), \\(r>4\\), \\(b+r\\le9\\)에서 가능한 \\(r\\)부터 적어요.","explanation":"\\(h=2\\)이면 \\(a=b-2\\)이므로 \\(b\\ge3\\)이에요. 또 \\(r>4\\)이고 \\(b+r\\le9\\)이므로 \\(r=5,6\\)만 가능해요.\n\n\\(r=5\\)일 때는 \\(b=3,4\\)이고, \\((b,e)=(3,8),(4,9)\\)라서 두 경우 모두 곱이 짝수예요. 각 경우마다 \\(b,e\\) 사이의 네 수 중 \\(c,d\\)를 고르므로 \\(2\\,{}_{4}\\mathrm{C}_{2}=2\\times6=12\\)예요.\n\n\\(r=6\\)일 때는 \\(b=3\\), \\(e=9\\)뿐인데 \\(be=27\\)은 홀수라서 제외해요. 따라서 \\(h=2\\)에서 더해지는 경우는 \\(12\\)가지예요.","check":{"prompt":"\\(r=5\\)에서 \\(b=5\\)를 세지 않는 이유는 무엇인가요?","answer":"그때 \\(e=b+r=10\\)이 되어 \\(9\\) 이하라는 조건을 벗어나기 때문이에요."}},{"id":"c4","label":"두 경우를 합치고 조건을 다시 확인해요","stepIds":["s7"],"question":"마지막 답은 어떻게 확인할 수 있을까요?","hint":"\\(h=1\\)과 \\(h=2\\)가 겹치지 않는지 보고 두 값을 더해요.","explanation":"\\(h=b-a\\)의 값이 \\(1\\)인 경우와 \\(2\\)인 경우는 서로 겹치지 않아요. 또 \\(h\\ge3\\)은 처음의 범위 계산에서 이미 불가능하다고 확인했어요. 그러므로 전체 경우의 수는 \\(54+12=66\\)이에요. 각 경우에서 \\(c,d\\)는 서로 다른 두 수를 고른 뒤 작은 것을 \\(c\\), 큰 것을 \\(d\\)로 정했으므로 같은 순서쌍을 두 번 세지도 않았어요.","check":{"prompt":"\\(c,d\\)를 고를 때 순열이 아니라 조합을 쓰는 이유는 무엇인가요?","answer":"고른 두 수 중 작은 수가 반드시 \\(c\\), 큰 수가 반드시 \\(d\\)가 되어 순서가 하나로 정해지기 때문이에요."}}],"takeaway":["크기순으로 놓인 다섯 수를 바로 세기보다 바깥 간격을 먼저 정하면 가능한 범위가 크게 줄어요.","곱이 짝수라는 조건은 두 수가 모두 홀수인 경우만 빼는 방식으로 확인해요.","간격별 계수는 가능한 시작값을 직접 적어 확인하고, 사이의 두 수는 조합으로 골라요."]};</script>
