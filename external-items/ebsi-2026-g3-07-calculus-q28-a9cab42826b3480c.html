<script>window.ExternalHandStudyRecord={"adminYear":2026,"answer":"①","contentHash":"b3aefd9f95b96e6480857b8a2da3efc2625c8b3162f25f756971faa734feee62","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"learningHash":"6a2c29f83fd6afbf928d8d32eff72bfd3daf9c9cbb5f386b6008750a00ab873b","month":7,"number":28,"preview":false,"questionHtml":"\u003cfigure class=\"hfigwrap\">\u003cimg class=\"hfig\" src=\"../assets/external2026/ebsi-2026-g3-07-calculus-q28-7e99041ff2c30ce5.png\" alt=\"2026년 7월 28번 문제\">\u003c/figure>","sourceHash":"ea1833a8b8cd025417cda3f096c5086cf3fb3a2d086620a9dd53f2ff5b5c01bc","sourceKey":"ebsi:2026:g3:07:calculus:q28","sourceLabel":"인천광역시교육청 2026-07-08","stepExplanations":{"s3":{"body":"\\(x=0\\)을 넣으면 적분 구간이 1에서 1까지여서 0이고, 오른쪽은 \\(-1+k\\)이므로 \\(k=1\\)이에요. 다음으로 주어진 등식을 미분하면 왼쪽은 위끝 \\(e^x\\)를 피적분함수에 넣은 뒤 그 미분값 \\(e^x\\)를 곱한 값입니다. 오른쪽은 곱의 미분으로 \\(e^x+(x-1)e^x=xe^x\\)예요. \\(e^x>0\\)으로 나누면 \\(f^{-1}(g(e^x))=x\\), 양쪽에 \\(f\\)를 적용하여 \\(g(e^x)=f(x)\\)를 얻어요.","skillTags":["derivative.integral-bound","derivative.product"],"title":"적분의 위끝도 함께 미분해요"},"s6":{"body":"적분변수를 \\(x=f(u)\\)로 놓으면 \\(f^{-1}(x)=u\\)가 돼요. 또 앞에서 구한 \\(g(e^u)=f(u)\\) 때문에 \\(g^{-1}(f(u))=e^u\\)입니다. \\(dx=f^{\\prime}(u)du\\)이고, 아래끝 \\(x=f(0)\\)은 \\(u=0\\), 위끝 \\(x=f(k)=f(1)\\)은 \\(u=1\\)로 바꿔요. \\(f^{\\prime}(u)=1+\\frac{e^u}{(e^u+1)^2}>0\\)이어서 이 대응도 한 가지로 정해집니다.","skillTags":["integration.substitution","integration.bounds","function.inverse"],"title":"역함수 두 개를 없애는 치환을 골라요"},"s7":{"body":"\\(u+e^u\\)를 미분하고 \\(f^{\\prime}(u)\\)를 적분하면 각각 \\(1+e^u\\), \\(f(u)\\)가 돼요. 그러므로 곱의 경계항에서 \\(\\int_0^1(1+e^u)f(u)du\\)를 빼는 부분적분 식을 얻습니다. 이 선택이 유리한 이유는 \\(f(u)\\)의 분모 \\(e^u+1\\)이 곱해지는 \\(1+e^u\\)와 약분되기 때문이에요.","skillTags":["integration.by-parts","calculation.cancellation"],"title":"부분적분은 주어진 함수가 다시 나타나도록 골라요"},"s9":{"body":"\\(f(1)=\\frac e{e+1}\\), \\(f(0)=-\\frac12\\)이므로 경계항은 \\((1+e)\\frac e{e+1}-1\\cdot(-\\frac12)=e+\\frac12\\)예요. 남은 적분의 안쪽은 \\((1+e^u)f(u)=u+ue^u-1\\)로 정리됩니다. 여기서 \\(\\int_0^1ue^u du=[(u-1)e^u]_0^1=1\\)이므로 남은 적분은 \\(\\frac12+1-1=\\frac12\\)예요. 따라서 \\(I=(e+\\frac12)-\\frac12=e\\)입니다.","skillTags":["integration.by-parts","integration.evaluation"],"title":"경계항과 남은 적분을 각각 끝까지 계산해요"}},"steps":[{"id":"s1","latex":"\\int_1^{e^x}f^{-1}(g(t))\\,dt=(x-1)e^x+k"},{"id":"s2","latex":"x=0\\Rightarrow k=1"},{"id":"s3","latex":"\\frac d{dx}:\\quad f^{-1}(g(e^x))e^x=xe^x\\Rightarrow g(e^x)=f(x)"},{"id":"s4","latex":"g^{-1}(f(u))=e^u"},{"id":"s5","latex":"x=f(u),\\quad dx=f'(u)du"},{"id":"s6","latex":"I=\\int_0^1(u+e^u)f'(u)\\,du"},{"id":"s7","latex":"I=[(u+e^u)f(u)]_0^1-\\int_0^1(1+e^u)f(u)\\,du"},{"id":"s8","latex":"f(u)=u-\\frac1{e^u+1}"},{"id":"s9","latex":"I=e"}],"track":"미적분"};</script>
<script>window.HandStudyGuide={"sourceKey":"ebsi:2026:g3:07:calculus:q28","sourceHash":"ea1833a8b8cd025417cda3f096c5086cf3fb3a2d086620a9dd53f2ff5b5c01bc","contentHash":"b3aefd9f95b96e6480857b8a2da3efc2625c8b3162f25f756971faa734feee62","overview":{"goal":"적분으로 주어진 역함수 관계를 미분해 \\(f\\)와 \\(g\\)를 연결하고, 두 역함수가 든 적분을 치환과 부분적분으로 계산해요.","firstLook":"처음 적분식의 위끝이 \\(e^x\\)라서 식 전체를 미분하면 피적분함수 안의 역함수를 꺼낼 수 있어요. 그 결과가 뒤의 적분에서 두 역함수를 동시에 없애는 열쇠가 됩니다.","conditions":[{"label":"주어진 함수","meaning":"\\(f(x)=x-1/(e^x+1)\\)이고 \\(f^{-1}\\)이 존재해요."},{"label":"g의 정의역과 역함수","meaning":"\\(g\\)는 \\(x>0\\)에서 연속이고 \\(g^{-1}\\)이 주어져 있어요."},{"label":"적분 관계","meaning":"모든 실수 \\(x\\)에서 위끝이 \\(e^x\\)인 적분식이 성립합니다."}]},"chapters":[{"id":"c1","label":"적분 조건에서 함수 관계 꺼내기","stepIds":["s1","s2","s3"],"question":"적분식에 어떤 값을 먼저 넣고, 그다음 왜 미분할까요?","hint":"\\(x=0\\)이면 위끝이 1이 되어 적분값이 바로 정해져요.","explanation":"\\(x=0\\)을 넣으면 적분 구간이 1에서 1까지라 왼쪽은 0이고, 오른쪽은 \\(-1+k\\)여서 \\(k=1\\)입니다. 식을 미분하면 왼쪽은 \\(f^{-1}(g(e^x))e^x\\), 오른쪽은 \\(xe^x\\)예요. \\(e^x>0\\)으로 나누고 양쪽에 \\(f\\)를 적용하면 \\(g(e^x)=f(x)\\)를 얻습니다.","check":{"prompt":"위끝이 \\(e^x\\)인 적분을 미분할 때 마지막에 무엇을 곱해야 하나요?","answer":"위끝 \\(e^x\\)의 도함수인 \\(e^x\\)를 곱해야 합니다."}},{"id":"c2","label":"두 역함수를 한 번에 없애는 치환","stepIds":["s4","s5","s6"],"question":"왜 목표 적분에서 \\(x=f(u)\\)를 선택하나요?","hint":"이 치환 뒤 \\(f^{-1}(x)\\)와 \\(g^{-1}(x)\\)가 각각 무엇이 되는지 보세요.","explanation":"앞 관계에서 \\(g^{-1}(f(u))=e^u\\)예요. \\(x=f(u)\\)로 놓으면 \\(f^{-1}(x)=u\\), \\(g^{-1}(x)=e^u\\)가 되어 역함수 두 개가 함께 사라집니다. \\(dx=f^{\\prime}(u)du\\)이고 \\(k=1\\)이므로 구간은 \\(u=0\\)에서 \\(u=1\\)로 바뀌어 \\(I=\\int_0^1(u+e^u)f^{\\prime}(u)du\\)가 돼요.","check":{"prompt":"치환 뒤 적분 구간이 \\(0\\)에서 \\(1\\)인 이유는 무엇인가요?","answer":"원래 아래끝이 \\(f(0)\\), 위끝이 \\(f(k)=f(1)\\)이고 \\(f\\)가 증가하여 대응이 한 가지로 정해지기 때문입니다."}},{"id":"c3","label":"약분이 생기도록 부분적분하기","stepIds":["s7","s8"],"question":"\\((u+e^u)f^{\\prime}(u)\\)에서 어느 쪽을 미분해야 계산이 단순해질까요?","hint":"\\(f^{\\prime}\\)를 적분하면 문제에서 식을 아는 \\(f\\)가 다시 나와요.","explanation":"\\(u+e^u\\)를 미분하고 \\(f^{\\prime}(u)\\)를 적분하면 \\(I=[(u+e^u)f(u)]_0^1-\\int_0^1(1+e^u)f(u)du\\)예요. \\(f(u)=u-1/(e^u+1)\\)이므로 곱 안의 분수항에서 \\(e^u+1\\)이 \\(1+e^u\\)와 약분됩니다. 이 약분이 이 방향의 부분적분을 고른 이유예요.","check":{"prompt":"\\((1+e^u)f(u)\\)를 전개하면 무엇인가요?","answer":"\\(u+ue^u-1\\)입니다."}},{"id":"c4","label":"경계항과 남은 적분 계산하기","stepIds":["s9"],"question":"부분적분 뒤 두 부분을 어떻게 끝까지 계산할까요?","hint":"\\(f(0),f(1)\\)을 먼저 구하고 \\(\\int_0^1ue^u du\\)는 한 번 더 부분적분하세요.","explanation":"경계항은 \\((1+e)f(1)-f(0)=e+1/2\\)예요. 남은 적분은 \\(\\int_0^1(u+ue^u-1)du\\)이고, \\(\\int_0^1ue^u du=[(u-1)e^u]_0^1=1\\)이므로 전체가 \\(1/2\\)입니다. 따라서 \\(I=(e+1/2)-1/2=e\\)예요.","check":{"prompt":"보기에서 고를 값은 무엇인가요?","answer":"\\(e\\), 즉 ①입니다."}}],"takeaway":["변하는 위끝을 가진 적분식은 특별한 값을 먼저 대입한 뒤 미분하면 숨은 함수 관계를 꺼낼 수 있어요.","역함수가 둘 들어 있으면 한 치환이 두 역함수를 동시에 없애는지 확인해요.","부분적분은 공식만 적용하지 말고, 어느 쪽을 미분해야 주어진 함수식과 약분이 생기는지 먼저 살펴봐요."]};</script>
