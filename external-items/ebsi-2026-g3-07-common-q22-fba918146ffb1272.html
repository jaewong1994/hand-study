<script>window.ExternalHandStudyRecord={"sourceKey":"ebsi:2026:g3:07:common:q22","sourceHash":"5c1d89ceb3be5dcee9b3775b5287a13bf8bd6646a264efd3addcd4cb2aa96c89","contentHash":"1ebdbd585ef62b928e433ed70fc4436fb6375047bae65779780c5616c334942c","sourceLabel":"인천광역시교육청 2026-07-08","adminYear":2026,"grade":3,"month":7,"number":22,"track":"공통","answer":"26","questionHtml":"<figure class=\"hfigwrap\"><img class=\"hfig\" src=\"../assets/external2026/ebsi-2026-g3-07-common-q22-d80d99915d35b34e.png\" alt=\"2026년 7월 22번 문제\"><\/figure>","steps":[{"id":"s1","latex":"A=(a,b),\\quad B=(b,a),\\quad0<a<b"},{"id":"s2","latex":"b=2^{a-m}+n\\Rightarrow B'=(b-1,a-7)\\text{는 }y=\\log_2(x-n+1)+m-7\\text{ 위의 점}"},{"id":"s3","latex":"BB'=\\sqrt{1^2+7^2}=5\\sqrt2\\Rightarrow B'\\text{는 주어진 원 위의 교점}"},{"id":"s4","latex":"g\\text{가 증가하므로 }B'\\text{가 오른쪽 교점이면 왼쪽 교점은 }B\\text{에서 반지름보다 멀어져 모순}"},{"id":"s5","latex":"\\therefore B'=C,\\quad\\operatorname{slope}(AC)=-3\\Rightarrow a-b=-5"},{"id":"s6","latex":"d(O,AB)=\\frac{a+b}{\\sqrt2},\\quad d(C,AB)=4\\sqrt2"},{"id":"s7","latex":"[AOB]:[ACB]=27:8\\Rightarrow a+b=27"},{"id":"s8","latex":"(a,b)=(11,16),\\quad2^{11-m}+n=16"},{"id":"s9","latex":"(m,n)=(8,8),(9,12),(10,14),(11,15)"},{"id":"s10","latex":"m+n\\le26,\\quad(m,n)=(11,15)\\text{일 때 등호}"}],"diagram":null,"preview":false,"graphPlan":null,"graphHash":"","editionHash":"551f7ef9f41a21e04dd6949944269885063358e324bb2434ee7b7e2b1a8c921a"};</script>
<script>window.HandStudyGuide={"sourceKey":"ebsi:2026:g3:07:common:q22","sourceHash":"5c1d89ceb3be5dcee9b3775b5287a13bf8bd6646a264efd3addcd4cb2aa96c89","contentHash":"1ebdbd585ef62b928e433ed70fc4436fb6375047bae65779780c5616c334942c","overview":{"goal":"지수함수 위의 점을 로그함수 위의 점으로 바꾼 뒤, 원의 두 교점 중 어느 점이 C인지 정하고 넓이비로 좌표를 구해요.","firstLook":"점 \\(A=(a,b)\\)를 직선 \\(y=x\\)에 대하여 대칭이동하면 \\(B=(b,a)\\)예요. 지수식 \\(b=2^{a-m}+n\\)을 로그식으로 바꾸면 원 위의 한 점을 바로 만들 수 있어요.","conditions":[{"label":"(가)","meaning":"직선 \\(AC\\)의 기울기는 \\(-3\\)이에요."},{"label":"(나)","meaning":"공통인 밑변 \\(AB\\)에 대한 두 높이를 비교하면 넓이비 \\(27:8\\)을 좌표식으로 바꿀 수 있어요."}]},"chapters":[{"id":"c1","label":"지수식으로 원 위의 점을 만들어요","stepIds":["s1","s2","s3"],"question":"점 B의 좌표와 지수식을 이용해 주어진 로그곡선 위의 점을 어떻게 찾을까요?","hint":"\\(b-n=2^{a-m}\\)의 양변에 밑이 \\(2\\)인 로그를 취한 뒤, 로그곡선의 식과 좌표를 맞춰 보세요.","explanation":"점 \\(A=(a,b)\\)는 제1사분면에 있고 \\(a<b\\)예요. 직선 \\(y=x\\)에 대하여 대칭이동하면 두 좌표가 서로 바뀌므로 \\(B=(b,a)\\)예요. 또 \\(A\\)가 지수곡선 위에 있으므로\n\n\\(b=2^{a-m}+n\\)\n\n이고, 따라서 \\(b-n=2^{a-m}\\)예요. 점 \\(B'=(b-1,a-7)\\)을 로그곡선에 대입하면\n\n\\(\\log_2((b-1)-n+1)+m-7=\\log_2(b-n)+m-7=a-7\\)\n\n이므로 \\(B'\\)는 로그곡선 위의 점이에요. 또한 중심 \\(B=(b,a)\\)에서 \\(B'\\)까지의 가로 차는 \\(-1\\), 세로 차는 \\(-7\\)이므로\n\n\\(BB'=\\sqrt{(-1)^2+(-7)^2}=\\sqrt{50}=5\\sqrt2\\)\n\n예요. 따라서 \\(B'\\)는 주어진 원과 로그곡선의 두 교점 중 하나예요.","check":{"prompt":"왜 \\(B'=(b-1,a-7)\\)의 둘째 좌표가 로그곡선의 함숫값과 정확히 같나요?","answer":"첫째 좌표 \\(b-1\\)을 대입하면 로그 안이 \\(b-n\\)이고, \\(b-n=2^{a-m}\\)이므로 함숫값이 \\((a-m)+m-7=a-7\\)이기 때문이에요."}},{"id":"c2","label":"작은 좌표의 교점임을 확인해요","stepIds":["s4"],"question":"방금 만든 점 B′가 왜 x좌표가 작은 교점 C일까요?","hint":"B′가 x좌표가 큰 교점이라고 가정하고, 로그함수의 증가와 원의 반지름을 함께 비교하세요.","explanation":"밑이 \\(2\\)인 로그함수는 증가하므로 주어진 로그곡선도 증가해요. 만약 \\(B'=(b-1,a-7)\\)가 두 교점 중 오른쪽 점이라면, 왼쪽 점의 \\(x\\)좌표는 \\(b-1\\)보다 작고 \\(y\\)좌표는 \\(a-7\\)보다 작아요. 그러면 중심 \\(B=(b,a)\\)에서 그 점까지의 가로 거리는 \\(1\\)보다 크고 세로 거리는 \\(7\\)보다 커요. 따라서 그 거리는\n\n\\(\\sqrt{(\\text{가로 거리})^2+(\\text{세로 거리})^2}>\\sqrt{1^2+7^2}=5\\sqrt2\\)\n\n가 되어 원 위의 점이라는 사실과 모순이에요. 그러므로 \\(B'\\)가 왼쪽 교점이고\n\n\\(C=(b-1,a-7)\\)\n\n이에요.","check":{"prompt":"모순을 만들 때 로그곡선이 증가한다는 사실은 두 좌표에 각각 어떤 부등식을 주나요?","answer":"왼쪽 교점의 \\(x\\)좌표가 \\(b-1\\)보다 작으면 그 \\(y\\)좌표도 \\(a-7\\)보다 작아요. 그래서 중심 B와의 가로·세로 거리가 각각 \\(1\\), \\(7\\)보다 커져요."}},{"id":"c3","label":"수직 조건으로 두 좌표의 차를 구해요","stepIds":["s5"],"question":"직선 AC의 기울기가 −3이라는 조건은 b−a를 얼마로 정할까요?","hint":"\\(A=(a,b)\\), \\(C=(b-1,a-7)\\)을 기울기 공식에 그대로 넣으세요.","explanation":"직선 \\(y=\\dfrac13x\\)의 기울기는 \\(\\dfrac13\\)이고, 직선 \\(AC\\)는 이 직선에 수직이므로 기울기가 \\(-3\\)이에요. 두 점의 좌표를 이용하면\n\n\\(\\dfrac{(a-7)-b}{(b-1)-a}=-3\\)\n\n이에요. \\(d=b-a\\)라 두면 왼쪽은 \\(-\\dfrac{d+7}{d-1}\\)이므로\n\n\\(-\\dfrac{d+7}{d-1}=-3\\)\n\n\\(d+7=3d-3\\)\n\n에서 \\(d=5\\)를 얻어요. 따라서 \\(b-a=5\\), 곧 \\(a-b=-5\\)예요.","check":{"prompt":"기울기 식의 분자와 분모를 \\(d=b-a\\)로 쓰면 각각 무엇인가요?","answer":"분자는 \\(a-b-7=-(d+7)\\), 분모는 \\(b-a-1=d-1\\)이에요."}},{"id":"c4","label":"넓이비로 좌표의 합을 정해요","stepIds":["s6","s7"],"question":"두 삼각형이 같은 밑변 AB를 가질 때 넓이비는 무엇의 비가 될까요?","hint":"직선 \\(AB\\)의 방정식을 구하고, 원점 O와 점 C에서 이 직선까지의 거리를 비교하세요.","explanation":"\\(b-a=5\\)이므로 \\(AB=5\\sqrt2\\)예요. 두 점 \\(A=(a,b)\\), \\(B=(b,a)\\)를 지나는 직선은\n\n\\(x+y=a+b\\)\n\n예요. 원점 \\(O\\)에서 직선 \\(AB\\)까지의 거리는 \\(\\dfrac{a+b}{\\sqrt2}\\)예요. 한편 \\(C=(b-1,a-7)\\)이므로 \\(x_C+y_C=a+b-8\\)이고, 점 \\(C\\)에서 직선 \\(AB\\)까지의 거리는\n\n\\(\\dfrac{|(a+b-8)-(a+b)|}{\\sqrt2}=\\dfrac8{\\sqrt2}=4\\sqrt2\\)\n\n예요. 두 삼각형 \\(AOB\\), \\(ACB\\)는 밑변 \\(AB\\)가 같으므로 넓이비는 두 높이의 비와 같아요. 따라서\n\n\\(\\dfrac{a+b}{\\sqrt2}:4\\sqrt2=27:8\\)\n\n이고, 왼쪽 비를 \\((a+b):8\\)로 줄이면 \\(a+b=27\\)이에요.","check":{"prompt":"점 C에서 직선 AB까지의 거리가 a, b와 관계없이 일정한 이유는 무엇인가요?","answer":"직선 \\(AB\\)에서는 \\(x+y=a+b\\)이고 점 \\(C\\)에서는 \\(x_C+y_C=a+b-8\\)이어서 두 식의 차가 항상 \\(8\\)이기 때문이에요."}},{"id":"c5","label":"자연수 조건에서 최댓값을 골라요","stepIds":["s8","s9","s10"],"question":"a, b를 구한 뒤 자연수 m, n의 가능한 쌍을 빠짐없이 찾으려면 무엇을 살펴야 할까요?","hint":"\\(2^{11-m}=16-n\\)에서 오른쪽이 양의 정수라는 점을 사용하세요.","explanation":"\\(a-b=-5\\), \\(a+b=27\\)을 연립하면 \\(a=11\\), \\(b=16\\)이에요. 지수곡선의 식에 점 \\(A\\)를 대입하면\n\n\\(16=2^{11-m}+n\\)\n\n이에요. \\(m,n\\)이 자연수이므로 \\(16-n\\)은 양의 정수이고, 따라서 \\(2^{11-m}\\)도 \\(16\\)보다 작은 양의 정수여야 해요. 가능한 값은 \\(1,2,4,8\\)이고\n\n\\((m,n)=(11,15),(10,14),(9,12),(8,8)\\)\n\n이에요. 각 합은 \\(26,24,21,16\\)이므로 \\(m+n\\)의 최댓값은 \\(26\\)이에요.","check":{"prompt":"\\(m>11\\)인 경우를 제외할 수 있는 이유는 무엇인가요?","answer":"그때 \\(2^{11-m}\\)은 \\(1\\)보다 작은 분수인데, \\(16-n\\)은 정수여야 하므로 두 값이 같을 수 없어요."}}],"takeaway":["지수식과 로그식이 함께 나오면 좌표를 바꾸고 그래프의 이동량을 반영해 대응점을 만들어요.","원의 두 교점 중 어느 점인지 정할 때는 증가·감소와 중심에서의 거리를 함께 확인해요.","같은 밑변을 가진 두 삼각형의 넓이비는 그 밑변에 대한 높이의 비로 바꿔요.","자연수 지수 조건에서는 거듭제곱의 가능한 정수값을 먼저 제한해 빠짐없이 나열해요."]};</script>
