<script>window.ExternalHandStudyRecord={"sourceKey":"ebsi:2026:g3:07:geometry:q29","sourceHash":"ae5118fe02dce192ff76ddf3a26fdf2bb2a7efa5121ca64b3ecd8b5bce2486e4","contentHash":"d73fd1750e519f7b130941dabf8434c8af7d641dcfb535add0e48b58893dbecd","sourceLabel":"인천광역시교육청 2026-07-08","adminYear":2026,"grade":3,"month":7,"number":29,"track":"기하","answer":"216","questionHtml":"\u003cfigure class=\"hfigwrap\">\u003cimg class=\"hfig\" src=\"../assets/external2026/ebsi-2026-g3-07-geometry-q29-0a415f3faddcc186.png\" alt=\"2026년 7월 29번 문제\">\u003c/figure>","steps":[{"id":"s1","latex":"H:\\ P\\text{에서 }x\\text{축에 내린 수선의 발},\\quad P=(m,n),\\ n^2=4pm"},{"id":"s2","latex":"PF=p+m,\\quad HF=p-m"},{"id":"s3","latex":"\\cos\\angle PFF'=\\frac{HF}{PF}=\\frac15\\Rightarrow m=\\frac{2p}{3}"},{"id":"s4","latex":"PH=\\frac{2\\sqrt6}{3}p,\\quad F'H=\\frac{5p}{3},\\quad PF'=\\frac{7p}{3}"},{"id":"s5","latex":"\\triangle PF'F\\sim\\triangle RF'O\\Rightarrow RF'=\\frac{7p}{6}"},{"id":"s6","latex":"R,Q,F'\\text{의 순서에서 }RQ=RF'-QF'"},{"id":"s7","latex":"\\text{쌍곡선의 초점 거리차}:\\quad QO-QF'=RF'-RO"},{"id":"s8","latex":"RQ+QO+RO=2RF'=14\\Rightarrow RF'=7\\Rightarrow p=6"},{"id":"s9","latex":"F'O=6,\\quad PH=4\\sqrt6"},{"id":"s10","latex":"S=[PRO]=\\frac12[PF'O]=\\frac14\\cdot6\\cdot4\\sqrt6=6\\sqrt6,\\quad S^2=216"}],"diagram":null,"preview":false,"graphPlan":null,"graphHash":""};</script>
<script>window.HandStudyGuide={"sourceKey":"ebsi:2026:g3:07:geometry:q29","sourceHash":"ae5118fe02dce192ff76ddf3a26fdf2bb2a7efa5121ca64b3ecd8b5bce2486e4","contentHash":"d73fd1750e519f7b130941dabf8434c8af7d641dcfb535add0e48b58893dbecd","overview":{"goal":"포물선의 거리 성질로 점 \\(P\\)의 위치를 정하고, 쌍곡선의 초점 거리차와 둘레 조건으로 축척을 구해 삼각형 넓이를 계산해요.","firstLook":"그림의 순서가 중요해요. \\(P,R,Q,F'\\)가 한 직선 위에 있고 \\(R\\)은 \\(PF'\\)의 중점이에요. 먼저 포물선에서 \\(P\\)의 좌표를 \\(p\\)로 나타낸 뒤, 둘레 14가 어느 길이를 정하는지 확인해요.","conditions":[{"label":"포물선","meaning":"초점은 \\(F(p,0)\\), 준선은 \\(x=-p\\)이므로 \\(y^2=4px\\)예요."},{"label":"쌍곡선","meaning":"초점 \\(O,F'\\)까지 거리의 차가 일정하고 \\(Q\\)와 \\(R\\)이 같은 쌍곡선 위에 있어요."}]},"chapters":[{"id":"c1","label":"각 조건으로 P의 위치를 정해요","stepIds":["s1","s2","s3","s4"],"question":"\\(\\cos\\angle PFF'=1/5\\)는 \\(P\\)의 \\(x\\)좌표를 어떻게 정할까요?","hint":"\\(P=(m,n)\\)에서 수선의 발을 \\(H=(m,0)\\)로 두고 \\(HF/PF\\)를 사용해요.","explanation":"포물선은 \\(y^2=4px\\)이고 \\(P=(m,n)\\)은 제1사분면이므로 \\(m>0,n>0\\), \\(n^2=4pm\\)이에요. 포물선의 정의에서 \\(PF\\)는 \\(P\\)에서 준선까지의 거리와 같아서 \\(PF=m+p\\)예요.\n\n각 \\(PFF'\\)에서 \\(FF'\\) 방향은 왼쪽이고, \\(P\\)의 수직선이 \\(x\\)축과 만나는 점을 \\(H\\)라 하면 그 방향으로의 길이는 \\(HF=p-m\\)예요. 주어진 코사인에서 \\((p-m)/(p+m)=1/5\\), 따라서 \\(m=2p/3\\)이에요. 그러면 \\(PH=n=\\sqrt{4p(2p/3)}=2\\sqrt6p/3\\), \\(F'H=p+m=5p/3\\), \\(PF'=\\sqrt{(5p/3)^2+(2\\sqrt6p/3)^2}=7p/3\\)예요.","check":{"prompt":"\\(HF=p-m\\)에서 \\(m<p\\)인 것이 실제로 확인되나요?","answer":"계산 결과 \\(m=2p/3<p\\)이므로 \\(H\\)는 \\(O\\)와 \\(F\\) 사이에 있고 길이와 각의 방향이 맞아요."}},{"id":"c2","label":"쌍곡선과 둘레로 길이의 크기를 정해요","stepIds":["s5","s6","s7","s8"],"question":"삼각형 \\(QOR\\)의 둘레가 왜 \\(2RF'\\)로 정리될까요?","hint":"그림의 순서 \\(P,R,Q,F'\\)에서 \\(RQ=RF'-QF'\\)이고, 쌍곡선의 거리차를 \\(Q\\)와 \\(R\\)에 각각 써요.","explanation":"\\(R\\)은 \\(PF'\\)의 중점이므로 \\(RF'=PF'/2=7p/6\\)예요. 선분 위의 순서는 \\(P,R,Q,F'\\)이므로 \\(RQ=RF'-QF'\\)예요.\n\n쌍곡선의 두 초점은 \\(O,F'\\)이고, 그림에서 \\(R\\)은 오른쪽 가지에 있어 \\(RF'>RO\\), \\(Q\\)는 왼쪽 가지에 있어 \\(QO>QF'\\)예요. 두 점은 서로 다른 가지에 있지만 초점 거리의 차의 절댓값은 같으므로 \\(QO-QF'=RF'-RO\\)예요. 따라서 둘레는 \\(RQ+QO+RO=(RF'-QF')+(QF'+RF'-RO)+RO=2RF'\\)예요. 이것이 14이므로 \\(RF'=7\\), \\(7p/6=7\\)에서 \\(p=6\\)이에요.","check":{"prompt":"둘레 식에서 선분의 순서를 확인하지 않으면 어떤 부호를 잘못 쓸 수 있나요?","answer":"\\(R,Q,F'\\) 순서이므로 \\(RQ=RF'-QF'\\)인데, 순서를 반대로 보면 두 길이를 잘못 더할 수 있어요."}},{"id":"c3","label":"같은 높이를 이용해 넓이를 구해요","stepIds":["s9","s10"],"question":"\\([PRO]\\)가 \\([PF'O]\\)의 절반인 이유는 무엇인가요?","hint":"두 삼각형의 밑변 \\(PR\\)과 \\(PF'\\)가 같은 직선 위에 있고 \\(R\\)이 중점이에요.","explanation":"\\(p=6\\)이므로 \\(F'O=6\\), \\(PH=2\\sqrt6p/3=4\\sqrt6\\)이에요. \\(R\\)은 \\(PF'\\)의 중점이어서 \\(PR=PF'/2\\)이고, 삼각형 \\(PRO\\)와 \\(PF'O\\)는 밑변이 같은 직선 위에 있어 꼭짓점 \\(O\\)에서 그 직선까지의 높이가 같아요. 따라서 \\([PRO]=[PF'O]/2\\)예요.\n\n또 \\([PF'O]=(1/2)F'O\\cdot PH=(1/2)\\cdot6\\cdot4\\sqrt6=12\\sqrt6\\)이므로 \\(S=[PRO]=6\\sqrt6\\)예요. 따라서 \\(S^2=36\\times6=216\\)이에요.","check":{"prompt":"넓이를 구할 때 \\(PH\\)를 높이로 쓸 수 있는 큰 삼각형은 무엇인가요?","answer":"밑변이 \\(x\\)축 위의 \\(F'O\\)인 삼각형 \\(PF'O\\)이고, \\(PH\\)가 그 밑변에 수직이에요."}}],"takeaway":["포물선에서는 점에서 초점까지 거리와 준선까지 거리가 같다는 성질로 길이를 좌표와 연결해요.","쌍곡선의 초점 거리차는 점의 실제 위치에 따라 어느 거리를 빼는지 먼저 확인해요.","중점이 만든 작은 삼각형은 같은 높이를 가지는 큰 삼각형과 밑변의 비로 넓이를 비교할 수 있어요."]};</script>
