<script>window.HandStudyGuide={"sourceKey":"ebsi:2026:g2:09:q28","sourceHash":"ff6126ed1b95018529beff9ea6034153c4cd4387385ab6aac6e76640a7415194","contentHash":"975649c0e4442e5a0e782305fa8a1e2bd62b9bcffaaa645b9e6f09d6efbbfe2b","overview":{"goal":"역함수 그래프와 로그함수 그래프의 평행이동을 좌표로 비교해 AC의 길이를 정하고, 직사각형의 넓이로 A와 B의 좌표 차를 구해요.","firstLook":"\\(f^{-1}\\)의 식을 직접 구하면 \\(g\\)의 그래프를 왼쪽으로 \\(\\dfrac32\\), 위로 \\(\\dfrac32\\) 옮긴 그래프예요. 점 C의 이동한 좌표와 선분 AC의 중점이 같은 역함수 위에 놓인다는 점을 이용하세요.","conditions":[{"label":"직사각형","meaning":"AC와 AB는 서로 수직이고, 넓이는 두 변의 길이의 곱이에요."},{"label":"중점 조건","meaning":"선분 \\(AC\\)의 중점은 \\(f^{-1}\\)의 그래프 위에 있어요."}]},"chapters":[{"id":"c1","label":"역함수와 로그함수의 이동을 비교해요","stepIds":["s1","s2"],"question":"점 C에서 어느 만큼 좌표를 바꾸면 역함수 그래프 위의 점이 될까요?","hint":"\\(f^{-1}(x)=g(x+\\dfrac32)+\\dfrac32\\)에 점 \\(C=(c,g(c))\\)를 대입할 수 있는 꼴로 바꾸세요.","explanation":"\\(y=2^{x-4}+\\dfrac92\\)에서 \\(x\\)와 \\(y\\)를 바꾸어 풀면\n\n\\(f^{-1}(x)=\\log_2\\left(x-\\dfrac92\\right)+4\\)\n\n예요. 한편\n\n\\(g\\left(x+\\dfrac32\\right)+\\dfrac32=\\log_2\\left(x-\\dfrac92\\right)+4\\)\n\n이므로 두 식이 같아요. 점 \\(C=(c,g(c))\\)에서 첫째 좌표를 \\(\\dfrac32\\)만큼 줄이고 둘째 좌표를 \\(\\dfrac32\\)만큼 늘린\n\n\\(C'=\\left(c-\\dfrac32,g(c)+\\dfrac32\\right)\\)\n\n는 \\(f^{-1}\\)의 그래프 위에 있어요. 또 \\(C'\\)는 \\(C\\)에서 가로로 \\(-\\dfrac32\\), 세로로 \\(\\dfrac32\\)만큼 간 점이므로 기울기가 \\(-1\\)인 직선 \\(AC\\) 위에 있어요.\n\n선분 \\(AC\\)의 중점을 \\(M\\)이라 하면 조건에 따라 \\(M\\)도 \\(f^{-1}\\)의 그래프 위이고 직선 \\(AC\\) 위에 있어요. 증가하는 역함수 그래프와 기울기 \\(-1\\)인 직선은 한 점에서만 만나므로 \\(M=C'\\)예요. 따라서 \\(C'\\)는 \\(C\\)에서 \\(A\\)로 가는 중간점이고, \\(A\\)와 \\(C\\)의 좌표 차는 각각 \\(3\\), \\(-3\\)이에요. 그러므로\n\n\\(AC=\\sqrt{3^2+(-3)^2}=3\\sqrt2\\)\n\n예요.","check":{"prompt":"C′와 중점 M이 같은 점이라고 말할 수 있는 두 가지 이유는 무엇인가요?","answer":"두 점 모두 직선 \\(AC\\)와 증가하는 그래프 \\(y=f^{-1}(x)\\) 위에 있고, 증가하는 그래프와 기울기 \\(-1\\)인 직선은 두 번 만날 수 없기 때문이에요."}},{"id":"c2","label":"넓이로 다른 변의 길이를 구해요","stepIds":["s3"],"question":"직사각형의 한 변 AC와 넓이를 알면 이웃한 변 AB의 길이는 얼마인가요?","hint":"직사각형의 넓이는 서로 수직인 두 변의 길이의 곱이에요.","explanation":"직사각형 \\(ACDB\\)의 넓이는 \\(AC\\times AB\\)예요. 따라서 \\(6=3\\sqrt2\\times AB\\)이고, \\(AB=\\dfrac6{3\\sqrt2}=\\sqrt2\\)예요.","check":{"prompt":"\\(3\\sqrt2\\times\\sqrt2\\)가 왜 \\(6\\)인가요?","answer":"\\(\\sqrt2\\times\\sqrt2=2\\)이므로 \\(3\\times2=6\\)이에요."}},{"id":"c3","label":"두 점의 좌표 차를 정해요","stepIds":["s4","s5"],"question":"기울기 1이고 길이가 \\(\\sqrt2\\)인 선분 \\(AB\\)는 두 좌표가 각각 얼마나 변할까요?","hint":"\\(x_A<x_B\\)이고 기울기가 \\(1\\)이므로 두 좌표 차는 같은 양수예요.","explanation":"직사각형에서 \\(AB\\)는 \\(AC\\)에 수직이에요. \\(AC\\)의 기울기가 \\(-1\\)이므로 \\(AB\\)의 기울기는 \\(1\\)이에요. \\(A=(a,f(a))\\), \\(B=(b,f(b))\\)이고 \\(a<b\\)이므로 \\(b-a>0\\)이며 \\(f(b)-f(a)=b-a\\)예요. 이 공통 차를 \\(d\\)라 하면\n\n\\(AB=\\sqrt{d^2+d^2}=d\\sqrt2=\\sqrt2\\)\n\n이므로 \\(d=1\\)이에요. 따라서 \\(b-a=1\\)이고\n\n\\(2^{b-4}-2^{a-4}=1\\)\n\n이에요. \\(b=a+1\\)을 대입하면 \\(2^{a-4}(2-1)=1\\)이므로 \\(a=4\\), \\(b=5\\)예요.","check":{"prompt":"길이 \\(\\sqrt2\\)만 알고 좌표 차를 \\(1,1\\)로 정할 수 있는 이유는 무엇인가요?","answer":"선분의 기울기가 \\(1\\)이라 두 좌표 차가 같고, \\(a<b\\)라 둘 다 양수예요. 따라서 \\(\\sqrt{d^2+d^2}=\\sqrt2\\)에서 \\(d=1\\)이에요."}},{"id":"c4","label":"두 y좌표의 합을 계산해요","stepIds":["s6"],"question":"\\(a=4,\\ b=5\\)를 \\(f\\)에 대입하면 두 \\(y\\)좌표는 각각 얼마인가요?","hint":"\\(f(x)=2^{x-4}+\\dfrac92\\)에 따로 대입하세요.","explanation":"\\(y_A=f(4)=1+\\dfrac92=\\dfrac{11}{2}\\)이고 \\(y_B=f(5)=2+\\dfrac92=\\dfrac{13}{2}\\)예요. 따라서 두 점의 \\(y\\)좌표의 합은 \\(\\dfrac{11}{2}+\\dfrac{13}{2}=12\\)예요.","check":{"prompt":"두 분수의 분자가 11과 13이 되는 지수값은 각각 무엇인가요?","answer":"\\(x=4\\)에서는 \\(2^{0}=1\\), \\(x=5\\)에서는 \\(2^{1}=2\\)예요."}}],"takeaway":["그래프의 평행이동은 한 점의 두 좌표가 각각 얼마나 바뀌는지 식으로 확인해요.","증가하는 그래프와 감소하는 직선은 한 점에서만 만나므로 같은 두 조건을 만족하는 점을 일치시킬 수 있어요.","기울기와 선분 길이를 함께 알면 두 좌표 차를 피타고라스 정리로 구해요."]};</script>
