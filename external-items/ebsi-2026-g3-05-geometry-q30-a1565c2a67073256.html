<script>window.ExternalHandStudyRecord={"sourceKey":"ebsi:2026:g3:05:geometry:q30","sourceHash":"050431f611355fd946279e685c9d34c636f238950fc728bc95dda65f65744ded","contentHash":"b74b17c7f2e8225cbad98f64acd5aafdb5b407835110a19d90aca8e7a01776fb","sourceLabel":"경기도교육청 2026-05-07","adminYear":2026,"grade":3,"month":5,"number":30,"track":"기하","answer":"80","questionHtml":"<figure class=\"hfigwrap\"><img class=\"hfig\" src=\"../assets/external2026/ebsi-2026-g3-05-geometry-q30-1f7f04af83a6322b.png\" alt=\"2026년 5월 30번 문제\"><\/figure>","steps":[{"id":"s1","latex":"Q=(k,b^2),\\quad k^2+b^2=1"},{"id":"s2","latex":"Q\\text{에서 타원 접선 }kx+y=1,\\quad F=(c,0),\\ c>0\\Rightarrow kc=1\\Rightarrow k>0"},{"id":"s3","latex":"k=\\sqrt{1-b^2},\\quad Q=(\\sqrt{1-b^2},b^2)"},{"id":"s4","latex":"c=\\frac1{\\sqrt{1-b^2}}=\\sqrt{1+a^2}"},{"id":"s5","latex":"G=(\\sqrt{1-b^2},0),\\quad G'=(-\\sqrt{1-b^2},0)"},{"id":"s6","latex":"QG=b^2,\\quad QG'=2-b^2"},{"id":"s7","latex":"PF-PF'=2,\\quad PQ=PF'+b^2\\Rightarrow QF=2-b^2"},{"id":"s8","latex":"QG'=QF,\\quad G\\text{는 }FG'\\text{의 중점}"},{"id":"s9","latex":"\\frac1{\\sqrt{1-b^2}}-\\sqrt{1-b^2}=2\\sqrt{1-b^2}\\Rightarrow b^2=\\frac23"},{"id":"s10","latex":"a^2=2\\Rightarrow30(a^2+b^2)=80"}],"diagram":null,"preview":false,"graphPlan":null,"graphHash":"","editionHash":"10408b3b2bbc4b38f10ee7f037b1ae512eaa1e6c9f5244a598a5a099bd104618"};</script>
<script>window.HandStudyGuide={"sourceKey":"ebsi:2026:g3:05:geometry:q30","sourceHash":"050431f611355fd946279e685c9d34c636f238950fc728bc95dda65f65744ded","contentHash":"b74b17c7f2e8225cbad98f64acd5aafdb5b407835110a19d90aca8e7a01776fb","overview":{"goal":"타원의 접선이 초점을 지난다는 조건으로 초점 좌표를 정하고, 쌍곡선의 초점 거리 차와 주어진 길이 조건을 합쳐 \\(a^2,b^2\\)를 구해요.","firstLook":"점 \\(Q\\)의 \\(y\\)좌표가 \\(b^2\\)이므로 타원 방정식에서 \\(x\\)좌표가 바로 나와요. 그 점의 접선이 직선 \\(PF\\)이므로 초점 \\(F\\)도 접선식에 넣을 수 있어요.","conditions":[{"label":"점의 위치","meaning":"\\(P\\)는 쌍곡선의 제2사분면 가지에 있고 \\(Q\\)는 \\(P,F\\)를 잇는 선분 위예요."},{"label":"길이 조건","meaning":"\\(PQ=PF'+b^2\\)와 왼쪽 가지의 초점 거리 차를 함께 써요."}]},"chapters":[{"id":"c1","label":"타원 위 점과 접선으로 초점을 정해요","stepIds":["s1","s2","s3","s4"],"question":"접선의 \\(x\\)절편이 왜 쌍곡선의 초점 좌표 \\(c\\)일까요?","hint":"직선 \\(PF\\)가 타원과 \\(Q\\)에서 접하므로 \\(F\\)도 그 접선 위에 있어요.","explanation":"\\(Q=(k,b^2)\\)라 두면 타원 방정식에서 \\(k^2+b^2=1\\)이에요. 타원 \\(x^2+y^2/b^2=1\\)의 \\(Q\\)에서 접선은 \\(kx+y=1\\)이에요. 이 접선이 곧 \\(PF\\)이고 오른쪽 초점 \\(F=(c,0)\\), \\(c>0\\)를 지나므로 \\(kc=1\\)이에요. 따라서 \\(k=1/c>0\\)이고, 이제 \\(k^2=1-b^2\\)에서 \\(k=\\sqrt{1-b^2}\\)로 양의 제곱근을 고를 수 있어요. 이어서 \\(c=1/\\sqrt{1-b^2}\\)이고, 쌍곡선의 초점 관계에서는 \\(c^2=1+a^2\\)예요.","check":{"prompt":"\\(k\\)에서 양의 제곱근을 고르는 구체적인 근거는 무엇인가요?","answer":"접선에 \\(F=(c,0)\\)를 넣은 \\(kc=1\\)과 원문의 \\(c>0\\)에서 \\(k=1/c>0\\)가 나오기 때문이에요."}},{"id":"c2","label":"같은 길이 두 개를 만들어 중점을 찾아요","stepIds":["s5","s6","s7","s8"],"question":"점 \\(G'=(-k,0)\\)를 새로 잡으면 \\(QG'\\)가 왜 \\(2-b^2\\)가 될까요?","hint":"가로 차는 \\(2k\\), 세로 차는 \\(b^2\\)이고 \\(k^2=1-b^2\\)예요.","explanation":"\\(G=(k,0)\\), \\(G'=(-k,0)\\)라 두면 \\(QG=b^2\\)이고\n\n\\(QG'=\\sqrt{(2k)^2+b^4}=\\sqrt{4(1-b^2)+b^4}=2-b^2\\)\n\n예요. \\(P\\)가 쌍곡선의 왼쪽 가지에 있으므로 먼 초점 \\(F\\)까지 거리에서 가까운 초점 \\(F'\\)까지 거리를 빼면 \\(PF-PF'=2\\)예요. 또 \\(P,Q,F\\) 순서이므로 \\(PQ=PF-QF\\)예요. 주어진 \\(PQ=PF'+b^2\\)와 합치면 \\(QF=2-b^2\\)이고, 따라서 \\(QF=QG'\\)예요. 두 점 \\(F,G'\\)는 \\(x\\)축 위이고 \\(Q\\)에서 같은 거리이므로 \\(Q\\)는 \\(FG'\\)의 수직이등분선 위에 있어요. 그 수직선의 \\(x\\)좌표가 \\(k\\)이므로 \\(G=(k,0)\\)가 실제로 \\(FG'\\)의 중점이에요.","check":{"prompt":"초점 거리 차의 부호가 \\(PF-PF'=2\\)인 이유는 무엇인가요?","answer":"\\(P\\)는 왼쪽 가지에 있어 오른쪽 초점 \\(F\\)가 더 멀고 왼쪽 초점 \\(F'\\)가 더 가깝기 때문이에요."}},{"id":"c3","label":"중점 좌표로 두 매개변수를 계산해요","stepIds":["s9","s10"],"question":"\\(G\\)가 중점이라는 사실은 \\(c\\)와 \\(k\\) 사이에 어떤 식을 주나요?","hint":"\\(F\\)의 좌표는 \\(c\\), \\(G'\\)의 좌표는 \\(-k\\), 중점의 좌표는 \\(k\\)예요.","explanation":"중점 좌표에서 \\(k=(c-k)/2\\), 즉 \\(c=3k\\)예요. \\(c=1/k\\)도 알고 있으므로 \\(1/k=3k\\), \\(k^2=1/3\\)이에요. \\(k^2=1-b^2\\)에서 \\(b^2=2/3\\)이고, \\(c^2=3=1+a^2\\)에서 \\(a^2=2\\)예요. 따라서 \\(30(a^2+b^2)=30(2+2/3)=80\\)이에요.","check":{"prompt":"구한 \\(b^2=2/3\\)은 원래 \\(0<b<1\\)과 맞나요?","answer":"\\(0<2/3<1\\)이므로 양의 제곱근 \\(b\\)는 0과 1 사이에 있어요."}}],"takeaway":["타원 위 점의 접선이 주어진 점을 지나면 접선식에 그 점의 좌표를 넣어 매개변수를 연결해요.","쌍곡선의 어느 가지에 점이 있는지 확인해 초점 거리 차의 순서를 정해요.","두 고정점까지 거리가 같은 점은 그 두 점을 잇는 선분의 수직이등분선 위에 있어요."]};</script>
