<script>window.ExternalHandStudyRecord={"sourceKey":"ebsi:2026:g3:07:probability-statistics:q30","sourceHash":"d0e5df651697c536d77d0fe19f839590748f6201861fc01f8f208219e012785f","contentHash":"cc18bf3791cef71b9df4d63f84ab7e1ea38b7403119f9a7870ea03efa0b6c547","sourceLabel":"인천광역시교육청 2026-07-08","adminYear":2026,"grade":3,"month":7,"number":30,"track":"확률과통계","answer":"725","questionHtml":"<figure class=\"hfigwrap\"><img class=\"hfig\" src=\"../assets/external2026/ebsi-2026-g3-07-probability-statistics-q30-2e7ee3017339c927.png\" alt=\"2026년 7월 30번 문제\"><\/figure>","steps":[{"id":"s1","latex":"X=\\{a_1=0,\\ a_7=1\\},\\quad Y=\\{a_m\\le2\\ (m=1,\\ldots,7),\\ \\text{어떤 }m\\text{에서는 }a_m=2\\}"},{"id":"s2","latex":"P(1)=P(2)=\\frac16,\\quad P(3\\text{ 이상})=\\frac23"},{"id":"s3","latex":"X:\\quad(\\#1,\\#2,\\#(\\ge3))=(1,0,6),(2,1,4),(3,2,2)"},{"id":"s4","latex":"\\text{끝점과 순서를 만족하는 가중 경로 수}=128,80,5"},{"id":"s5","latex":"P(X)=\\frac12(128+80+5)\\left(\\frac13\\right)^6=71\\cdot\\frac12\\left(\\frac13\\right)^5"},{"id":"s6","latex":"X\\cap Y:\\quad(1,0,6)\\text{은 첫 시행 뒤 최댓값이 }1\\text{이므로 제외}"},{"id":"s7","latex":"(2,1,4)\\text{의 허용 경로 }40,\\quad(3,2,2)\\text{의 허용 순서 }4\\text{개와 위치 }6\\text{개}"},{"id":"s8","latex":"P(X\\cap Y)=40\\left(\\frac13\\right)^7+\\left(\\frac13\\right)^6=43\\left(\\frac13\\right)^7"},{"id":"s9","latex":"P(Y\\mid X)=\\frac{43(1/3)^7}{71(1/2)(1/3)^5}=\\frac{86}{639},\\quad p+q=725"}],"diagram":null,"preview":false,"graphPlan":null,"graphHash":"","editionHash":"fb326cf12d309f96e5df88ac8e4f5eba14d009988bd2fa714c5460df9e9e3a6a"};</script>
<script>window.HandStudyGuide={"sourceKey":"ebsi:2026:g3:07:probability-statistics:q30","sourceHash":"d0e5df651697c536d77d0fe19f839590748f6201861fc01f8f208219e012785f","contentHash":"cc18bf3791cef71b9df4d63f84ab7e1ea38b7403119f9a7870ea03efa0b6c547","overview":{"goal":"처음과 끝의 좌표가 정해진 7번의 주사위 결과를 이동 횟수별로 나누고, 그중 좌표 2에 도달하면서 넘지 않는 경로만 다시 세어 조건부확률을 구해요.","firstLook":"\\(a_1=0\\)이므로 첫 시행은 반드시 3 이상이 나와 움직이지 않은 경우예요. 남은 여섯 시행에서 오른쪽 횟수와 왼쪽 횟수의 차가 1이어야 해요.","conditions":[{"label":"조건 사건","meaning":"첫 시행 뒤 좌표가 0이고 일곱째 시행 뒤 좌표가 1이에요."},{"label":"목표 사건","meaning":"일곱 좌표가 모두 2 이하이고, 그중 적어도 하나가 2예요."}]},"chapters":[{"id":"c1","label":"끝점 조건으로 이동 횟수를 세 가지로 나눠요","stepIds":["s1","s2","s3"],"question":"남은 여섯 시행의 오른쪽·왼쪽·제자리 횟수는 왜 세 경우뿐인가요?","hint":"오른쪽 횟수를 \\(r\\), 왼쪽 횟수를 \\(l\\)이라 두면 \\(r-l=1\\), \\(r+l\\le6\\)이에요.","explanation":"눈 1은 오른쪽, 눈 2는 왼쪽, 눈 3 이상은 제자리이고 확률은 각각 \\(1/6,1/6,2/3\\)이에요. \\(a_1=0\\)이므로 첫 눈은 3 이상이어야 해요. 남은 여섯 번에서 끝 좌표가 1이려면 오른쪽 횟수가 왼쪽보다 하나 많아야 해요. 가능한 \\((r,l,s)\\)는 \\((1,0,5),(2,1,3),(3,2,1)\\)이고, 첫 제자리 시행까지 포함한 전체 횟수는 원래 단계의 \\((1,0,6),(2,1,4),(3,2,2)\\)예요.","check":{"prompt":"\\(r=4,l=3\\)이 제외되는 이유는 무엇인가요?","answer":"움직이는 시행만 일곱 번이 필요해 남은 여섯 시행 수를 넘기기 때문이에요."}},{"id":"c2","label":"조건 사건의 확률을 다항계수로 계산해요","stepIds":["s4","s5"],"question":"세 경우에서 첫 시행이 제자리라는 확률은 어떻게 함께 반영할까요?","hint":"먼저 \\(2/3\\)을 곱하고, 남은 여섯 시행의 배열을 세요.","explanation":"조건 사건을 \\(X\\)라 해요. 첫 시행의 확률 \\(2/3\\)을 먼저 곱하면\n\n\\(P(X)=\\dfrac23\\left[6\\left(\\dfrac16\\right)\\left(\\dfrac23\\right)^5+\\dfrac{6!}{2!1!3!}\\left(\\dfrac16\\right)^3\\left(\\dfrac23\\right)^3+\\dfrac{6!}{3!2!1!}\\left(\\dfrac16\\right)^5\\left(\\dfrac23\\right)\\right]\\)\n\n이에요. 세 항을 공통분모로 정리하면 \\(\\dfrac12(128+80+5)(1/3)^6=71\\cdot\\dfrac12(1/3)^5\\)예요.","check":{"prompt":"가운데 경우의 배열 수가 60인 이유는 무엇인가요?","answer":"남은 여섯 자리에 오른쪽 2개, 왼쪽 1개, 제자리 3개를 놓으므로 \\(6!/(2!1!3!)=60\\)이에요."}},{"id":"c3","label":"좌표 2에 닿는 이동 순서만 남겨요","stepIds":["s6","s7"],"question":"오른쪽 2번, 왼쪽 1번인 경우에는 어떤 순서만 좌표 2에 닿나요?","hint":"제자리 시행을 지우고 세 이동의 순서를 써 봐요.","explanation":"오른쪽 1번뿐인 첫 경우는 좌표가 1을 넘지 못해 제외돼요. 오른쪽 2번, 왼쪽 1번인 경우에는 이동 순서가 오른쪽-오른쪽-왼쪽일 때만 좌표 2에 닿아요. 여섯 자리 중 이동할 세 자리를 고르는 방법이 \\({}_6\\mathrm C_3=20\\)개이므로, 첫 제자리와 나머지 제자리 확률을 포함하면 \\(40(1/3)^7\\)이에요.\n\n오른쪽 3번, 왼쪽 2번인 경우에는 제자리를 지운 이동 순서 열 개 중 오른쪽-오른쪽-왼쪽-오른쪽-왼쪽, 오른쪽-오른쪽-왼쪽-왼쪽-오른쪽, 오른쪽-왼쪽-오른쪽-오른쪽-왼쪽, 왼쪽-오른쪽-오른쪽-오른쪽-왼쪽의 네 순서만 좌표 2에 닿되 넘지 않아요. 제자리 한 번의 위치는 6곳이어서 이 경우의 확률은 \\((1/3)^6\\)이에요.","check":{"prompt":"오른쪽-오른쪽-오른쪽으로 시작하는 순서는 왜 제외하나요?","answer":"세 번째 이동 뒤 좌표가 3이 되어 가장 큰 좌표가 2라는 조건을 넘기기 때문이에요."}},{"id":"c4","label":"교집합을 조건 사건으로 나눠요","stepIds":["s8","s9"],"question":"조건부확률의 분모는 왜 전체 표본이 아니라 \\(P(X)\\)인가요?","hint":"이미 \\(a_1=0,a_7=1\\)이라는 조건 아래에서 묻고 있어요.","explanation":"목표 사건을 \\(Y\\)라 하면 \\(P(X\\cap Y)=40(1/3)^7+(1/3)^6=43(1/3)^7\\)이에요. 따라서\n\n\\(P(Y\\mid X)=\\dfrac{43(1/3)^7}{71(1/2)(1/3)^5}=\\dfrac{86}{639}\\)\n\n예요. \\(86\\)과 \\(639\\)는 공약수가 없으므로 \\(p+q=86+639=725\\)예요.","check":{"prompt":"마지막 비에서 \\((1/3)^5\\)를 약분한 뒤 남는 수는 무엇인가요?","answer":"분자에는 \\(43/9\\), 분모에는 \\(71/2\\)가 남아 비는 \\(86/639\\)가 돼요."}}],"takeaway":["정지 시행이 섞인 걷기에서는 오른쪽·왼쪽 횟수의 차로 끝점을 먼저 맞춰요.","최고 좌표 조건은 제자리 시행을 잠시 지우고 실제 이동 순서를 검사한 뒤 제자리 위치를 다시 세면 편해요.","조건부확률은 조건을 만족하는 전체 경로 확률로 교집합 확률을 나눠요."]};</script>
