<script>window.HandStudyGuide={"sourceKey":"ebsi:2025:g1:03:q30","sourceHash":"28348b31346f1877a6143afe3d1d8bd4e214d3971df41f17e4de948e7b085827","contentHash":"d77afb5063a71d5bf8c78f47c61041073d6f3432a9bd7df670b1063ffc02700a","overview":{"goal":"같은 원의 현과 원주각을 이용해 닮음·합동을 만들고 두 넓이의 차를 구해요.","firstLook":"\\(DF=EG\\)는 같은 원에서 같은 길이의 현이므로 같은 크기의 원주각을 만들어요.","conditions":[{"label":"다섯 교점의 순서","meaning":"그림의 \\(D,F,G,E\\) 위치를 따라 어떤 호와 각을 바라보는지 정확히 정해요."},{"label":"길이의 비","meaning":"\\(AG=3GC\\)가 닮은 두 삼각형의 길이비와 넓이비를 바로 정해요."}]},"chapters":[{"id":"c1","label":"원주각으로 닮음을 만들어요","stepIds":["s1","s2","s3","s4","s5"],"question":"왜 \\(\\triangle EGC\\)와 \\(\\triangle DAG\\)가 닮을까요?","hint":"같은 길이의 현이 만드는 호와 원주각, 원에 내접한 사각형의 대각을 차례로 써요.","explanation":"같은 원에서 \\(DF=EG\\)이므로 두 현이 만드는 작은 호의 크기도 같아요. 따라서 그 호를 바라보는 원주각에서 \\(\\angle DAF=\\angle GAE\\)이고, 같은 호를 바라보는 각으로 \\(\\angle GDA=\\angle GEC\\)도 얻어요.\n\n또 사각형 \\(AFGE\\)는 원에 내접하므로 \\(\\angle FAE+\\angle FGE=180^\\circ\\)예요. 점 \\(B,F,G,C\\)가 한 직선 위에 있어 \\(\\angle CGE+\\angle FGE=180^\\circ\\)이므로 \\(\\angle FAE=\\angle CGE\\)예요. \\(\\angle DAG=\\angle DAF+\\angle FAG=\\angle GAE+\\angle FAG=\\angle FAE\\)이므로 \\(\\angle DAG=\\angle CGE\\)예요. 두 각이 각각 같아서 \\(\\triangle EGC\\sim\\triangle DAG\\)예요.","check":{"prompt":"\\(\\angle FAE=\\angle CGE\\)에서 공통으로 보충되는 각은 무엇인가요?","answer":"두 각 모두 \\(\\angle FGE\\)와 더하면 \\(180^\\circ\\)가 돼요."}},{"id":"c2","label":"닮음비를 넓이비로 바꿔요","stepIds":["s6","s7"],"question":"\\([DAG]=72\\)는 어떻게 나오나요?","hint":"닮음에서 대응변 \\(GC:AG=1:3\\)을 써요.","explanation":"\\(GC:AG=1:3\\)이므로 닮음비는 \\(1:3\\), 넓이비는 \\(1:9\\)예요. \\([EGC]=8\\)이 주어졌으므로 \\([DAG]=9\\cdot8=72\\)예요.","check":{"prompt":"길이비가 \\(1:3\\)일 때 넓이비는 왜 \\(1:9\\)인가요?","answer":"닮은 도형의 넓이는 대응변 길이비의 제곱에 비례하기 때문이에요."}},{"id":"c3","label":"남은 두 넓이를 합동으로 지워요","stepIds":["s8","s9","s10","s11"],"question":"왜 \\([DBG]=[EGA]\\)인가요?","hint":"\\(DB=EG\\)와 두 쌍의 각을 이용해 두 삼각형의 합동을 보여요.","explanation":"같은 원의 원주각과 직선 위의 각을 비교하면 \\(\\angle DGB=\\angle EAG\\), \\(\\angle BDG=\\angle AEG\\)예요. 여기에 \\(DB=EG\\)가 있으므로 \\(\\triangle DBG\\)와 \\(\\triangle EGA\\)는 합동이고 넓이도 같아요.\n\n그림에서 \\(S=[DAG]+[DBG]\\), \\(T=[EGC]+[EGA]\\)예요. 같은 넓이 \\([DBG]\\)와 \\([EGA]\\)가 차에서 없어지므로 \\(S-T=[DAG]-[EGC]=72-8=64\\)예요.","check":{"prompt":"전체 넓이를 직접 구하지 않아도 되는 이유는 무엇인가요?","answer":"차 \\(S-T\\)에서 합동인 두 삼각형의 넓이가 서로 지워져 이미 아는 \\(72\\)와 \\(8\\)만 남기 때문이에요."}}],"takeaway":["같은 원에서 길이가 같은 현은 같은 크기의 호와 원주각을 만들어요.","닮음비가 정해지면 넓이비는 그 제곱이에요.","넓이의 차를 물을 때는 합동인 부분이 서로 없어지는지 먼저 찾아요."]};</script>
