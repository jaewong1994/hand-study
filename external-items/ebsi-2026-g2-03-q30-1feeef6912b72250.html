<script>window.ExternalHandStudyRecord={"sourceKey":"ebsi:2026:g2:03:q30","sourceHash":"2876704bf418a87429f2e86531011a8b2d88d17b145535506d40247a60a3d3a8","contentHash":"f1578e3f9e1bffc4296a0b983fac326cbd80366ef1bcbdf21e55d58e9d22046e","sourceLabel":"서울특별시교육청 2026-03-24","adminYear":2026,"grade":2,"month":3,"number":30,"track":"공통","answer":"24","questionHtml":"\u003cfigure class=\"hfigwrap\">\u003cimg class=\"hfig\" src=\"../assets/external2026/ebsi-2026-g2-03-q30-098c2f31d4d5423f.png\" alt=\"2026년 3월 30번 문제\">\u003c/figure>","steps":[{"id":"s1","latex":"x\u003c\\frac4a\\text{ 또는 }x>b:\\quad f(x)=\\left|a+\\frac{ab-4}{x-b}\\right|"},{"id":"s2","latex":"f\\text{가 일대일}\\Rightarrow \\frac4a\\le x\\le b\\text{에서 }ax^2-4bx\\le0\\text{이고 단조}"},{"id":"s3","latex":"a>0:\\quad p=a"},{"id":"s4","latex":"a>0,\\ \\frac{2b}{a}\\le\\frac4a\\Rightarrow b\\le2\\Rightarrow pm=16(1-b)=-64\\Rightarrow b=5\\quad\\bot"},{"id":"s5","latex":"a>0,\\ b\\le\\frac{2b}{a}\\Rightarrow a\\le2"},{"id":"s6","latex":"a=1:\\ b^2=\\frac{64}{3}\\notin\\mathbb Q,\\qquad a=2:\\ b=4"},{"id":"s7","latex":"(a,b)=(2,4),\\quad \\max_{[2,4]}(2x^2-16x)=-24\u003c0"},{"id":"s8","latex":"a\u003c0:\\quad p=-a"},{"id":"s9","latex":"a\u003c0,\\ \\frac{2b}{a}\\le\\frac4a\\Rightarrow b\\ge2\\text{이면 중간식의 양수값 발생}\\quad\\bot"},{"id":"s10","latex":"m=\\frac{16(1-b)}a,\\quad pm=-16(1-b)=-64\\Rightarrow b=-3"},{"id":"s11","latex":"-3>\\frac4a,\\ a\\in\\mathbb Z_{\u003c0}\\Rightarrow a=-1"},{"id":"s12","latex":"(a,b)=(-1,-3),\\quad \\max_{[-4,-3]}(-x^2+12x)=-45\u003c0\\Rightarrow(2)(4)(-1)(-3)=\\boxed{24}"}],"diagram":null,"preview":false,"graphPlan":null,"graphHash":""};</script>
<script>window.HandStudyGuide={"sourceHash":"2876704bf418a87429f2e86531011a8b2d88d17b145535506d40247a60a3d3a8","contentHash":"f1578e3f9e1bffc4296a0b983fac326cbd80366ef1bcbdf21e55d58e9d22046e","overview":{"goal":"절댓값 안의 유리식과 이차식이 각 구간에서 한 방향으로만 움직이도록 \\(a\\)의 부호별 후보를 나누고 두 해쌍의 곱을 구해요.","firstLook":"바깥 구간의 식을 \\(a+\\dfrac{ab-4}{x-b}\\)로 나누어 쓰면 수평점근값이 보이고, 가운데 이차식은 꼭짓점이 구간 안에 들어오는지 확인해야 해요.","conditions":[{"label":"일대일","meaning":"각 조각의 치역이 겹쳐 같은 함숫값을 두 번 만들지 않는지까지 확인해야 해요."},{"label":"정수와 유리수","meaning":"\\(a\\)는 정수이고 \\(b\\)는 유리수라 무리수 후보를 제외해요."}]},"chapters":[{"id":"c1","label":"구간별 식과 부호를 정리해요","stepIds":["s1","s2","s3","s4"],"question":"바깥 유리식의 점근값과 가운데 이차식의 부호가 왜 중요한가요?","hint":"바깥 식 \\(a+\\dfrac{ab-4}{x-b}\\)에서 수평점근값 \\(a\\)를 읽고, 가운데 식 \\(ax^2-4bx\\)가 절댓값 안에서 부호를 바꾸는지 확인하세요.","explanation":"\\(r=4/a\\)라 두면 \\(r<b\\)이고, 바깥 구간에서는\n\n\\(f(x)=\\left|a+\\dfrac{ab-4}{x-b}\\right|\\)\n\n예요. \\(x<r\\)와 \\(x>b\\)에서는 \\((x-r)/(x-b)>0\\)이므로 이 식의 절댓값 밖 부호는 \\(a\\)의 부호와 같아요. \\(a>0\\)이면 두 바깥 조각의 치역은 \\((0,a)\\), \\((a,\\infty)\\)이고, \\(a<0\\)이면 \\((0,-a)\\), \\((-a,\\infty)\\)예요. 따라서 바깥 조각만으로 모든 양수 중 각각 \\(a\\), \\(-a\\) 하나만 빠지고 나머지는 정확히 한 번씩 나와요.\n\n전체 함수가 일대일이려면 가운데 이차식 \\(q(x)=ax^2-4bx\\)은 구간 \\([r,b]\\)에서 한 방향으로 움직이고 값이 모두 \\(0\\) 이하여야 해요. 양수가 하나라도 나오면 바깥 조각의 같은 양수값과 겹치고, 꼭짓점이 구간 안쪽에 있으면 이차식 자체가 같은 값을 두 번 만들기 때문이에요. 그러므로 해가 없는 양수는 \\(a>0\\)일 때 \\(p=a\\), \\(a<0\\)일 때 \\(p=-a\\)예요.","check":{"prompt":"가운데 식이 \\(0\\)을 넘어가면 일대일성이 깨질 수 있는 이유는 무엇인가요?","answer":"절댓값을 취할 때 음수와 양수 쪽 값이 같은 양의 함숫값으로 겹칠 수 있기 때문이에요."}},{"id":"c2","label":"a>0인 경우를 판정해요","stepIds":["s5","s6","s7"],"question":"\\(a>0\\)에서 \\(a=1\\)과 \\(a=2\\)만 남는 순서 조건은 무엇인가요?","hint":"꼭짓점 \\(x=\\dfrac{2b}{a}\\)가 가운데 구간의 어느 쪽에 있는지 나누고 \\(pm=-64\\)를 함께 쓰세요.","explanation":"\\(a>0\\)이면 \\(r=4/a>0\\), \\(b>0\\), \\(p=a\\)이고 이차식의 꼭짓점은 \\(v=2b/a\\)예요. 일대일이려면 \\(v\\le r\\) 또는 \\(v\\ge b\\)예요.\n\n(I) \\(v\\le r\\)이면 \\(b\\le2\\)이고 이차식은 구간에서 증가하므로 최솟값은 \\(q(r)=16(1-b)/a\\)예요. 따라서 \\(pm=16(1-b)=-64\\), 즉 \\(b=5\\)가 되어 \\(b\\le2\\)와 모순이에요.\n\n(II) \\(v\\ge b\\)이면 \\(a\\le2\\)이고 이차식은 감소하므로 최솟값은 \\(q(b)=b^2(a-4)\\)예요. 양의 정수 후보는 \\(a=1,2\\)뿐이에요. \\(a=1\\)이면 \\(-3b^2=-64\\), 곧 \\(b^2=64/3\\)이라 유리수 \\(b\\)가 될 수 없어요. \\(a=2\\)이면 \\(-4b^2=-64\\)이고 \\(b>r=2\\)이므로 \\(b=4\\)예요. 실제로 \\(q(x)=2x^2-16x\\)는 \\([2,4]\\)에서 감소하며 \\(q(2)=-24\\), \\(q(4)=-32\\)라 모두 음수예요. 따라서 \\((a,b)=(2,4)\\)가 성립해요.","check":{"prompt":"\\(a=1\\)을 제외하고 \\(a=2,b=4\\)를 남기는 산술 조건은 무엇인가요?","answer":"\\(a=1\\)이면 \\(b^2=\\dfrac{64}{3}\\)라 \\(b\\)가 유리수가 아니고, \\(a=2\\)이면 \\(b=4\\)로 모든 조건을 만족해요."}},{"id":"c3","label":"a<0인 경우와 최종 곱을 구해요","stepIds":["s8","s9","s10","s11","s12"],"question":"\\(a<0\\)에서 \\(b=-3,a=-1\\)이 차례로 정해지는 이유는 무엇인가요?","hint":"\\(p=-a\\), \\(m=\\dfrac{16(1-b)}a\\)를 곱한 뒤 구간 조건 \\(b>\\dfrac4a\\)를 확인하세요.","explanation":"\\(a<0\\)이면 \\(p=-a\\)이고 이차식은 아래로 열린 포물선이에요. 꼭짓점 \\(v=2b/a\\)가 왼쪽 끝 \\(r=4/a\\)보다 왼쪽이면, 음수 \\(a\\)를 곱할 때 부등호가 바뀌어 \\(b\\ge2\\)예요. 그런데 이때 \\(q(r)=16(1-b)/a>0\\)이어서 바깥 조각의 양수 치역과 겹치므로 제외돼요.\n\n남는 경우는 \\(v\\ge b\\)이고 이차식이 \\([r,b]\\)에서 증가해 최솟값이 \\(m=q(r)=16(1-b)/a\\)예요. 그러면\n\n\\(pm=(-a)\\cdot\\dfrac{16(1-b)}a=-16(1-b)=-64\\)\n\n에서 \\(b=-3\\)을 얻어요. 원래 구간 조건 \\(b>4/a\\)는 \\(-3>4/a\\)이고, \\(a<0\\)을 곱하면 \\(-3a<4\\)예요. 음의 정수 \\(a\\) 중 이를 만족하는 것은 \\(a=-1\\)뿐이에요. 실제로 \\(q(x)=-x^2+12x\\)는 \\([-4,-3]\\)에서 증가하고 값은 \\(-64\\)부터 \\(-45\\)까지라 모두 음수예요. 따라서 다른 해쌍은 \\((-1,-3)\\), 요구한 곱은 \\(2\\cdot4\\cdot(-1)\\cdot(-3)=24\\)예요.","check":{"prompt":"두 해쌍을 모두 찾은 뒤 요구한 곱은 어떻게 계산하나요?","answer":"\\((a,b)=(2,4),(-1,-3)\\)이므로 \\(2\\cdot4\\cdot(-1)\\cdot(-3)=24\\)예요."}}],"takeaway":["절댓값 함수의 일대일성은 각 조각의 단조성뿐 아니라 조각 사이 치역 겹침도 확인해요.","매개변수의 부호가 바뀌면 부등식을 나눌 때 방향도 함께 바뀌어요.","후보를 구한 뒤 가운데 구간에서 절댓값 안의 부호와 꼭짓점 위치를 재대입해요."],"sourceKey":"ebsi:2026:g2:03:q30"};</script>
