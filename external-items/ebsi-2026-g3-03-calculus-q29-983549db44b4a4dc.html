<script>window.ExternalHandStudyRecord={"adminYear":2026,"answer":"11","contentHash":"41211bb37c5ed4387b5361cdce223923a61953ba6403cac3bbaac5791836cbf0","diagram":null,"grade":3,"graphHash":"","graphPlan":null,"learningHash":"baf0e7b99decf10e57c5dd709770b806574546fba5a7fb0e1120a187602b7a5e","month":3,"number":29,"preview":false,"questionHtml":"\u003cfigure class=\"hfigwrap\">\u003cimg class=\"hfig\" src=\"../assets/external2026/ebsi-2026-g3-03-calculus-q29-7c27835a3884b29f.png\" alt=\"2026년 3월 29번 문제\">\u003c/figure>","sourceHash":"1039392a6a1af856f85400d3bd983cdb1115320fcbd1650d77b7bbc806314770","sourceKey":"ebsi:2026:g3:03:calculus:q29","sourceLabel":"서울특별시교육청 2026-03-24","stepExplanations":{"s1":{"body":"\\(\\overline{\\mathrm{AC}}=\\overline{\\mathrm{BC}}\\)이고 \\(\\mathrm{P}\\)가 밑변 \\(\\mathrm{AB}\\)의 중점이므로 \\(\\mathrm{CP}\\)는 \\(\\mathrm{AB}\\)에 수직이에요. 직각삼각형 \\(\\mathrm{CPB}\\)에 피타고라스 정리를 쓰면 \\(\\overline{\\mathrm{BP}}^2=(4n+2)^2-(15n^2+16n+4)=n^2\\)입니다. 길이는 양수이므로 \\(\\overline{\\mathrm{BP}}=n\\), 따라서 \\(\\overline{\\mathrm{AB}}=2n\\)이에요.","skillTags":["geometry.isosceles","geometry.pythagoras"],"title":"이등변삼각형의 중선은 높이이기도 해요"},"s3":{"body":"삼각형 \\(\\mathrm{ABC}\\)의 두 변의 중점을 잇는 \\(\\mathrm{PQ}\\)는 \\(\\mathrm{AC}\\)와 평행해요. 여기에 \\(\\angle\\mathrm{CAB}=\\angle\\mathrm{PQR}\\)를 적용하면 \\(\\mathrm{QR}\\)이 \\(\\mathrm{AB}\\)와 평행하다는 것을 알 수 있어요. \\(\\mathrm{Q}\\)가 \\(\\mathrm{BC}\\)의 중점이므로 \\(\\mathrm{R}\\)도 \\(\\mathrm{AC}\\)의 중점이고, \\(\\overline{\\mathrm{RQ}}=\\frac12\\overline{\\mathrm{AB}}=n\\)입니다.","skillTags":["geometry.parallel","geometry.midpoint"],"title":"주어진 각의 등식으로 평행선을 알아내요"},"s7":{"body":"\\(\\overline{\\mathrm{DR}}=x\\)라 놓으면 비례 조건에서 \\(\\overline{\\mathrm{DC}}=2x\\)이고, \\(\\mathrm{D},\\mathrm{R},\\mathrm{Q}\\)가 이 순서로 놓여 \\(\\overline{\\mathrm{DQ}}=x+n\\)이에요. 평행선 때문에 \\(\\angle\\mathrm{DQC}=\\angle\\mathrm{PBC}\\)이고, 직각삼각형 \\(\\mathrm{PBC}\\)에서 그 코사인은 \\(\\frac{n}{4n+2}\\)입니다. 이제 삼각형 \\(\\mathrm{DQC}\\)에 코사인법칙을 쓰면 이 줄의 식이 나와요.","skillTags":["geometry.cosine-rule"],"title":"알려진 각의 코사인을 다른 삼각형에 옮겨요"},"s8":{"body":"코사인법칙 식에서 마지막 항은 \\(n(x+n)\\)이므로 \\(4x^2=(x+n)^2+(2n+1)^2-n(x+n)\\)입니다. 정리하면 \\(3x^2-nx-(2n+1)^2=0\\)이에요. 근의 공식의 판별식은 \\(n^2+12(2n+1)^2=49n^2+48n+12\\)이고, 길이 \\(x>0\\)이므로 더하기 부호인 해만 남깁니다.","skillTags":["equation.quadratic","equation.domain-check"],"title":"길이 조건으로 이차방정식의 해를 골라요"},"s9":{"body":"구하려는 식은 \\(\\frac{\\sqrt{49n^2+48n+12}-7n}{6}\\)이에요. 분자와 분모에 \\(\\sqrt{49n^2+48n+12}+7n\\)을 곱하면 \\(\\frac{48n+12}{6(\\sqrt{49n^2+48n+12}+7n)}\\)가 됩니다. 이제 분자와 분모를 \\(n\\)으로 나누면 \\(\\frac{48+12/n}{6(\\sqrt{49+48/n+12/n^2}+7)}\\)이고, 극한은 \\(\\frac{48}{84}=\\frac47\\)이에요.","skillTags":["limit.rationalization"],"title":"큰 두 수를 바로 빼지 말고 유리화해요"}},"steps":[{"id":"s1","latex":"CP\\perp AB,\\quad BP^2=BC^2-CP^2=n^2\\Rightarrow AP=BP=n"},{"id":"s2","latex":"P,Q\\text{는 중점}\\Rightarrow PQ\\parallel AC"},{"id":"s3","latex":"AB\\parallel DQ,\\quad Q,R\\text{는 }BC,AC\\text{의 중점}"},{"id":"s4","latex":"RQ=n,\\quad CQ=2n+1"},{"id":"s5","latex":"DR=x,\\ DC=2x,\\quad DQ=x+n"},{"id":"s6","latex":"\\cos\\angle DQC=\\cos\\angle PBC=\\frac{n}{4n+2}"},{"id":"s7","latex":"(2x)^2=(x+n)^2+(2n+1)^2-2(x+n)(2n+1)\\frac n{4n+2}"},{"id":"s8","latex":"x=\\frac{n+\\sqrt{49n^2+48n+12}}6"},{"id":"s9","latex":"\\lim_{n\\to\\infty}\\left(x-\\frac43n\\right)=\\frac47\\Rightarrow p+q=11"}],"track":"미적분"};</script>
<script>window.HandStudyGuide={"sourceKey":"ebsi:2026:g3:03:calculus:q29","sourceHash":"1039392a6a1af856f85400d3bd983cdb1115320fcbd1650d77b7bbc806314770","contentHash":"41211bb37c5ed4387b5361cdce223923a61953ba6403cac3bbaac5791836cbf0","overview":{"goal":"중점과 평행선으로 길이를 정리하고 코사인법칙으로 \\(DR\\)의 극한을 구해요.","firstLook":"원문 그림에서 \\(P,Q\\)는 두 변의 중점이고 \\(DR:DC=1:2\\)라서 \\(R\\)도 선분 관계를 만들어요.","conditions":[{"label":"\\(AC=BC=4n+2\\)","meaning":"이등변삼각형의 높이와 밑변 절반을 직각삼각형으로 계산할 수 있어요."},{"label":"\\(CP\\) 길이","meaning":"\\(AB\\)의 절반 \\(AP=BP\\)를 \\(n\\)으로 확정해요."}]},"chapters":[{"id":"c1","label":"중점에서 기본 길이 꺼내기","stepIds":["s1","s2","s3","s4"],"question":"\\(CP^2\\)과 \\(BC^2\\)의 차가 왜 \\(n^2\\)일까요?","hint":"\\(P\\)는 \\(AB\\)의 중점이고 \\(CP\\)는 이등변삼각형의 중선이에요.","explanation":"이등변삼각형에서 \\(CP\\)⊥\\(AB\\). \\(BP^2=BC^2-CP^2=(4n+2)^2-(15n^2+16n+4)=n^2\\), 그래서 \\(AP=BP=n\\). \\(P,Q\\)가 \\(AB,BC\\)의 중점이므로 \\(PQ\\)∥\\(AC\\). 또 원문의 각 조건 \\(\\angle CAB=\\angle PQR\\)과 평행선을 따라 \\(AB\\)∥\\(DQ\\)가 되고, \\(RQ\\)는 중점연결선 길이 \\(n\\), \\(CQ=2n+1\\)이에요.","check":{"prompt":"\\(AB\\)의 길이는?","answer":"\\(AP+PB=2n\\)이에요."}},{"id":"c2","label":"한 길이로 모든 변 표현","stepIds":["s5","s6","s7"],"question":"삼각형 \\(DQC\\)에 코사인법칙을 쓰려면 세 변을 어떻게 놓을까요?","hint":"\\(DR:DC=1:2\\)이고 \\(D,R,Q\\)가 한 직선이에요.","explanation":"\\(DR=x\\)이면 \\(DC=2x\\), \\(DQ=DR+RQ=x+n\\). 평행선과 각 조건으로 \\(\\angle DQC=\\angle PBC\\), 직각삼각형 \\(PBC\\)에서 \\(\\cos\\angle PBC=BP/BC=n/(4n+2)\\). 따라서 \\((2x)^2=(x+n)^2+(2n+1)^2-2(x+n)(2n+1)n/(4n+2)\\)이에요.","check":{"prompt":"코사인법칙의 맞은편 변은?","answer":"각 \\(DQC\\)의 맞은편인 \\(DC=2x\\)이에요."}},{"id":"c3","label":"양의 근과 극한 계산","stepIds":["s8","s9"],"question":"이차방정식의 어느 근을 택해야 할까요?","hint":"\\(x=DR\\)은 양수예요.","explanation":"정리한 이차방정식의 양의 근은 \\(x=[n+\\sqrt{49n^2+48n+12}]/6\\). 이제 \\(x-4n/3=[\\sqrt{49n^2+48n+12}-7n]/6\\). 켤레를 곱하면 \\((48n+12)/[6(\\sqrt{49n^2+48n+12}+7n)]\\), \\(n\\)으로 나누어 극한은 \\(4/7\\). 따라서 \\(p+q=11\\)이에요.","check":{"prompt":"유리화한 극한 \\(4/7\\)에서 분자와 분모의 합은?","answer":"\\(11\\)이에요."}}],"takeaway":["중점은 평행선과 중점연결선 길이를 함께 만들어요.","코사인법칙 전에 세 변과 끼인각을 한 변수로 정리해요.","루트와 일차식의 차 극한은 켤레로 유리화해요."]};</script>
