<script>window.HandStudyGuide={"sourceKey":"ebsi:2024:g1:03:q30","sourceHash":"07f6be5b83e6c07f92414fe6d5892088c2a8ea1718249952d34bb2fb4f0ec438","contentHash":"aff3c6d1dcdfaa083908291fa6a0b61ebe62d7dd53e14bde9c7f0dcc8f4833a6","overview":{"goal":"평행사변형의 높이와 여러 닮음 관계로 \\(\\sin\\angle AGF\\)를 구해요.","firstLook":"넓이와 밑변 \\(BC\\)로 높이 \\(10\\)을 먼저 구하면, 그림의 거의 모든 길이가 피타고라스 정리와 닮음으로 이어져요.","conditions":[{"label":"점 F의 위치","meaning":"\\(F\\)는 \\(CB\\)의 연장선 위이고 \\(BF=ED=3\\)이라 전체 가로 길이를 계산할 수 있어요."},{"label":"평행선","meaning":"\\(EG\\parallel AB\\)와 평행사변형의 두 쌍의 평행선을 이용해 닮음과 합동을 만들어요."}]},"chapters":[{"id":"c1","label":"높이와 대각선 길이를 구해요","stepIds":["s1","s2","s3","s4"],"question":"\\(DF=10\\sqrt5\\)는 어떻게 나오나요?","hint":"\\(D\\)에서 \\(BC\\)의 연장선에 내린 수선의 발을 \\(H\\)라 두어요.","explanation":"평행사변형의 넓이가 \\(120\\), 밑변 \\(BC=12\\)이므로 높이 \\(DH=120/12=10\\)이에요. \\(DC=AB=5\\sqrt5\\)이므로 직각삼각형 \\(DCH\\)에서 \\(CH=\\sqrt{125-100}=5\\)예요.\n\n\\(AD=12\\)이고 \\(AE=3ED\\)이므로 \\(ED=3\\)이에요. 또 \\(BF=ED=3\\)이어서 \\(FH=FB+BC+CH=3+12+5=20\\)이에요. 따라서 \\(DF=\\sqrt{DH^2+FH^2}=\\sqrt{100+400}=10\\sqrt5\\)예요.","check":{"prompt":"\\(FH\\)를 더할 때 점들의 순서는 어떻게 되나요?","answer":"그림에서 \\(F-B-C-H\\) 순서이므로 \\(FH=FB+BC+CH\\)예요."}},{"id":"c2","label":"닮음과 합동으로 G의 위치를 정해요","stepIds":["s5","s6","s7"],"question":"\\(FI=GD=2\\sqrt5\\), \\(EG=\\sqrt5\\)는 왜 성립하나요?","hint":"\\(I=AB\\cap DF\\)를 잡고 \\(ED:AD=1:4\\)를 먼저 써요.","explanation":"평행선으로 생기는 각을 비교하면 \\(\\triangle EGD\\)와 \\(\\triangle AID\\)가 닮고, \\(ED:AD=3:12=1:4\\)예요. 따라서 \\(DG:DI=1:4\\)예요. 한편 \\(ED=BF\\), \\(ED\\parallel BF\\), \\(EG\\parallel BI\\)이므로 \\(\\triangle EGD\\)와 \\(\\triangle BIF\\)는 합동이에요. 그래서 \\(GD=FI\\), \\(EG=IB\\)예요.\n\n\\(DF=FI+ID=GD+4GD=5GD=10\\sqrt5\\)이므로 \\(GD=FI=2\\sqrt5\\)예요. 합동에서 대응하는 길이를 이용하면 \\(IB=EG=\\sqrt5\\)예요.","check":{"prompt":"\\(DF=5GD\\)에서 다섯 조각이 생기는 이유는 무엇인가요?","answer":"닮음으로 \\(DI=4DG\\), 합동으로 \\(FI=DG\\)이므로 \\(DF=FI+ID=DG+4DG\\)예요."}},{"id":"c3","label":"수선거리로 사인을 계산해요","stepIds":["s8","s9","s10","s11","s12"],"question":"\\(\\sin\\angle AGF\\)를 왜 \\(AK/AG\\)로 계산할 수 있나요?","hint":"\\(K\\)는 \\(A\\)에서 직선 \\(GF\\), 곧 \\(DF\\)에 내린 수선의 발이에요.","explanation":"\\(G\\)에서 \\(AD\\)에 내린 수선의 발을 \\(J\\)라 하면 \\(\\triangle GEJ\\sim\\triangle DCH\\)이고 닮음비는 \\(EG:DC=1:5\\)예요. 따라서 \\(EJ=1,GJ=2\\)예요. \\(AJ=AD-ED-EJ=12-3-1=8\\)이므로 \\(AG=\\sqrt{8^2+2^2}=2\\sqrt{17}\\)이에요.\n\n또 \\(K\\)를 \\(A\\)에서 \\(DF\\)에 내린 수선의 발이라 하면, 삼각형 \\(ADF\\)의 넓이를 두 밑변으로 계산하여 \\((1/2)AD\\cdot DH=(1/2)DF\\cdot AK\\)예요. 따라서 \\(AK=12\\cdot10/(10\\sqrt5)=12\\sqrt5/5\\)예요. 직각삼각형 \\(AGK\\)에서 \\(\\sin \\angle AGF=AK/AG=6\\sqrt{85}/85\\)이므로 \\(p=85,q=6\\), \\(p+q=91\\)이에요.","check":{"prompt":"마지막 사인에서 분모와 분자의 자연수는 무엇인가요?","answer":"\\(6\\sqrt{85}/85\\)이므로 서로소인 자연수는 \\(p=85,q=6\\)이에요."}}],"takeaway":["평행사변형의 넓이에서 높이를 먼저 구하면 사선 길이를 직각삼각형으로 바꿀 수 있어요.","닮음비와 합동의 대응변을 연결해 한 직선 위의 여러 길이를 정해요.","각의 사인은 그 각의 한 점에서 반대 변이 놓인 직선까지의 수선거리로 계산할 수 있어요."]};</script>
