<script>window.ExternalHandStudyRecord={"sourceKey":"ebsi:2026:g2:09:q30","sourceHash":"11f287f924a45339a18c02e37568fede4cc2aab74997b0a3fd1f8fa30776125c","contentHash":"0ee6344b883d6a6e0ce37cee6fe3458218789b2822c9077d398ac8a7c3de1f0a","sourceLabel":"인천광역시교육청 2026-09-02","adminYear":2026,"grade":2,"month":9,"number":30,"track":"공통","answer":"15","questionHtml":"<figure class=\"hfigwrap\"><img class=\"hfig\" src=\"../assets/external2026/ebsi-2026-g2-09-q30-f6a05e7579a822c1.png\" alt=\"2026년 9월 30번 문제\"><\/figure>","steps":[{"id":"s1","latex":"f(1)=-\\frac{49}{16}(1-b)>0\\Rightarrow b>1"},{"id":"s2","latex":"A=\\{k\\ne0:f(k)f(-k)=0\\},\\quad|A|=4"},{"id":"s3","latex":"b\\ne2:\\quad a=-2,\\quad0\\le a<2,\\quad\\text{또는 }b=-a"},{"id":"s4","latex":"a=-2\\Rightarrow g(t)\\ne0\\ (\\forall t)\\Rightarrow\\text{조건 (나) 불충족}"},{"id":"s5","latex":"0\\le a<2:\\quad\\beta=\\frac{49b^2}{64},\\quad\\gamma=-\\frac{a^2}{4}-a-1,\\quad\\beta=-\\gamma"},{"id":"s6","latex":"(g(\\beta+),g(\\beta))=(1,2),\\quad(g(-\\beta+),g(-\\beta))=(3,2)\\Rightarrow3\\ne4"},{"id":"s7","latex":"b=-a:\\quad\\frac{49a^2}{64}=\\frac{a^2}{4}+a+1"},{"id":"s8","latex":"33a^2-64a-64=0\\Rightarrow a=\\frac83,-\\frac8{11};\\quad a<2\\text{에서 }\\frac83\\text{을 제외하고, }a=-\\frac8{11}\\text{이면 }b=\\frac8{11}<1\\text{이므로 }f(1)>0\\text{을 만족하지 않는다}"},{"id":"s9","latex":"\\therefore b=2,\\quad a<0,\\quad a\\ne-2"},{"id":"s10","latex":"\\frac{49}{16}=-\\left(-\\frac{a^2}{4}-a-1\\right)\\Rightarrow a=-\\frac{11}{2},\\frac32\\Rightarrow a=-\\frac{11}{2}"},{"id":"s11","latex":"\\beta=\\frac{49}{16}:\\quad(g(\\beta+),g(\\beta))=(2,3),\\quad(g(-\\beta+),g(-\\beta))=(3,2)"},{"id":"s12","latex":"f(-8)=(-8+2)\\left(-8+\\frac{11}{2}\\right)=15"}],"diagram":null,"preview":false,"graphPlan":null,"graphHash":"","editionHash":"57c2f70896843fc105fe411f9140e50cf3552265069a7baccf61e70dc508b096"};</script>
<script>window.HandStudyGuide={"sourceKey":"ebsi:2026:g2:09:q30","sourceHash":"11f287f924a45339a18c02e37568fede4cc2aab74997b0a3fd1f8fa30776125c","contentHash":"0ee6344b883d6a6e0ce37cee6fe3458218789b2822c9077d398ac8a7c3de1f0a","overview":{"goal":"두 포물선 조각의 영점과 수평선 교점 수가 바뀌는 높이를 분석해 \\(a,b\\)를 정해요.","firstLook":"조건 (가)는 \\(f\\)의 영점과 그 반대수를 모은 집합의 원소 수를 세는 조건이에요. 먼저 실제 정의구간에 들어오는 영점만 골라야 해요.","conditions":[{"label":"영점 집합","meaning":"\\(k\\)나 \\(-k\\) 중 하나가 영점이면 \\(k\\)와 \\(-k\\)가 함께 집합에 들어가므로 절댓값이 다른 영점의 수를 세어요."},{"label":"교점 수의 점프","meaning":"각 포물선의 꼭짓점 높이에서 \\(g(t)\\)의 값과 오른쪽 극한을 직접 세어 조건 (나)를 검사해요."}]},"chapters":[{"id":"c1","label":"영점의 절댓값을 두 종류로 맞춰요","stepIds":["s1","s2","s3"],"question":"조건 (가)는 \\(a,b\\)에 어떤 경우를 남기나요?","hint":"왼쪽 조각의 영점은 항상 \\(-2\\), 그리고 \\(a<0\\)일 때만 \\(a\\)예요. 오른쪽 조각은 \\(0\\)과, \\(b>0\\)일 때 \\(b\\)예요.","explanation":"\\(f(1)=-49(1-b)/16>0\\)이므로 \\(b>1\\)이에요. 실제 영점은 왼쪽에서 \\(-2\\), 그리고 \\(a<0\\)이면 \\(a\\), 오른쪽에서 \\(0,b\\)예요. 집합 \\(A=\\{k\\ne0:f(k)f(-k)=0\\}\\)에는 각 영점의 양수·음수 반대수가 함께 들어가요. 원소가 네 개라는 것은 영점의 절댓값이 정확히 두 종류라는 뜻이에요.\n\n\\(b\\ne2\\)이면 가능한 경우는 \\(a=-2\\)로 왼쪽 영점을 겹치게 하거나, \\(0\\le a<2\\)라서 \\(a\\)가 왼쪽 정의역의 영점이 아니게 하거나, \\(a<0\\)이고 \\(b=-a\\)라서 두 영점의 절댓값을 겹치게 하는 경우예요. \\(b=2\\)이면 \\(-2,2\\)가 한 종류를 이루므로 \\(a<0,a\\ne-2\\)가 둘째 종류를 만들어요.","check":{"prompt":"\\(0\\le a<2\\)일 때 \\(x=a\\)를 영점으로 세지 않는 이유는 무엇인가요?","answer":"인수 \\(x-a\\)가 있는 식은 \\(x<0\\)에서만 쓰는데 \\(a\\ge0\\)은 그 정의구간에 들어오지 않기 때문이에요."}},{"id":"c2","label":"b가 2가 아닌 경우를 없애요","stepIds":["s4","s5","s6","s7","s8"],"question":"세 경우가 조건 (나)를 왜 만족시키지 못하나요?","hint":"두 포물선의 꼭짓점 높이에서 \\(g\\)의 값과 바로 오른쪽의 값을 각각 세어요.","explanation":"\\(a=-2\\)이면 왼쪽 조각은 \\((x+2)^2\\)이고, 음의 높이에서는 오른쪽 조각의 교점 하나만 있어 \\(g(t)=1\\)이에요. 따라서 \\(-\\alpha<0\\)에서는 \\(g(-\\alpha)=\\lim_{t\\to-\\alpha+}g(t)=1\\)이에요. 조건 (나)의 곱의 등식에 이를 넣으면 \\(g(\\alpha)=\\lim_{t\\to\\alpha+}g(t)\\)가 되어, 바로 앞의 서로 다르다는 조건과 모순이에요.\n\n\\(0\\le a<2\\)에서는 오른쪽 포물선의 꼭짓점 높이를 \\(\\beta=49b^2/64\\), 왼쪽 꼭짓점 높이를 \\(\\gamma=-a^2/4-a-1\\)이라 할 때 점프가 서로 반대 높이에서 만나려면 \\(\\beta=-\\gamma\\)여야 해요. 그러나 실제 교점 수는 \\((g(\\beta+),g(\\beta))=(1,2)\\), \\((g(-\\beta+),g(-\\beta))=(3,2)\\)라서 조건이 요구하는 곱에서 \\(3\\)과 \\(4\\)가 달라져요.\n\n\\(b=-a\\)에서는 \\(49a^2/64=a^2/4+a+1\\), 즉 \\(33a^2-64a-64=0\\)을 풀어 \\(a=8/3\\) 또는 \\(-8/11\\)을 얻어요. 첫째 값은 \\(a<2\\)를 어기고, 둘째 값은 \\(b=-a=8/11<1\\)이라 \\(f(1)>0\\)에서 얻은 \\(b>1\\)을 어겨요. 따라서 \\(b\\ne2\\)인 경우는 모두 제외돼요.","check":{"prompt":"꼭짓점 높이만 같게 하는 것으로 충분하지 않은 이유는 무엇인가요?","answer":"조건 (나)는 높이의 위치뿐 아니라 그 높이에서의 교점 수와 오른쪽에서의 교점 수의 곱까지 같아야 하므로 실제 개수를 세어야 해요."}},{"id":"c3","label":"b가 2인 경우에 a를 정해요","stepIds":["s9","s10","s11"],"question":"\\(b=2\\)일 때 \\(a=-11/2\\)가 되는 이유는 무엇인가요?","hint":"두 꼭짓점 높이의 절댓값을 같게 하고 \\(a<0\\)을 적용해요.","explanation":"\\(b=2\\)이고 조건 (가)에서 \\(a<0,a\\ne-2\\)예요. 오른쪽 꼭짓점 높이는 \\(\\beta=49/16\\)이고, 왼쪽 꼭짓점 높이의 반대값은 \\((a+2)^2/4\\)예요. 두 점프를 \\(\\alpha=\\beta\\)와 \\(-\\alpha\\)에서 짝지으려면 \\(49/16=(a+2)^2/4\\)예요. 이를 풀면 \\(a=-11/2\\) 또는 \\(3/2\\)이고, \\(a<0\\)에서 \\(a=-11/2\\)예요.\n\n이때 한쪽 점프는 \\((g(\\beta+),g(\\beta))=(2,3)\\), 다른 쪽은 \\((g(-\\beta+),g(-\\beta))=(3,2)\\)라서 값과 오른쪽 극한이 서로 바뀌어 조건 (나)의 두 곱이 같아져요.","check":{"prompt":"\\(a=3/2\\)를 버리는 근거는 무엇인가요?","answer":"\\(b=2\\)인 조건 (가)의 둘째 영점 종류를 만들려면 \\(a<0\\)이어야 하는데 \\(3/2>0\\)이기 때문이에요."}},{"id":"c4","label":"원래 식에 값을 넣어요","stepIds":["s12"],"question":"\\(f(-8)\\)은 어느 조각으로 계산하나요?","hint":"\\(-8<0\\)이므로 첫째 식을 써요.","explanation":"\\(a=-11/2\\)이고 \\(-8<0\\)이므로 \\(f(-8)=(-8+2)(-8+11/2)=(-6)(-5/2)=15\\)예요.","check":{"prompt":"마지막 값은 주어진 정답과 일치하나요?","answer":"두 음수의 곱이므로 양수 \\(15\\)이고 원답과 일치해요."}}],"takeaway":["조각함수의 영점은 인수만 보지 말고 그 값이 해당 정의구간에 들어오는지 확인해요.","교점 수 함수의 불연속 조건은 꼭짓점 높이와 그 높이 양쪽의 실제 교점 수를 함께 세어요.","경우를 나눈 뒤에는 처음의 부호 조건과 영점 개수 조건에 다시 넣어 후보를 걸러요."]};</script>
