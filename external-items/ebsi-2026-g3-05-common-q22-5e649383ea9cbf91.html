<script>window.ExternalHandStudyRecord={"sourceKey":"ebsi:2026:g3:05:common:q22","sourceHash":"10399be3a926584f8841d7005cc6ba27e521a708d10db33d7ee8df618de8f88c","contentHash":"2b5a0c58a9afcec9be5e0b0370e122bfb23949d98cea9033f4909534cd613a2e","sourceLabel":"경기도교육청 2026-05-07","adminYear":2026,"grade":3,"month":5,"number":22,"track":"공통","answer":"9","questionHtml":"\u003cfigure class=\"hfigwrap\">\u003cimg class=\"hfig\" src=\"../assets/external2026/ebsi-2026-g3-05-common-q22-88be6f5e2b5b71fe.png\" alt=\"2026년 5월 22번 문제\">\u003c/figure>","steps":[{"id":"s1","latex":"A=(a,2^{a+1}+k),\\quad B=(a+2,2^{a+1}+k+2)"},{"id":"s2","latex":"B\\text{가 지수곡선 위}\\Rightarrow(2^3-2)2^a=2\\Rightarrow2^a=\\frac13"},{"id":"s3","latex":"a=-\\log_2 3"},{"id":"s4","latex":"M=(a+1,2^{a+1}+k+1)"},{"id":"s5","latex":"M\\text{을 아래로 }1\\text{ 이동한 }M'\\text{과 }C'\\text{는 }y=x\\text{ 대칭}"},{"id":"s6","latex":"C=(2^{a+1}+k,a+2)"},{"id":"s7","latex":"CM=\\sqrt6,\\ \\operatorname{slope}(CM)=-1\\Rightarrow|2^{a+1}+k-a-1|=\\sqrt3"},{"id":"s8","latex":"k_1+k_2=-2^{a+2}+2a+2"},{"id":"s9","latex":"S=-\\frac23-2\\log_23,\\quad2^{-S+2/3}=2^{2\\log_23}=9"}],"diagram":null,"preview":false,"graphPlan":null,"graphHash":""};</script>
<script>window.HandStudyGuide={"sourceKey":"ebsi:2026:g3:05:common:q22","sourceHash":"10399be3a926584f8841d7005cc6ba27e521a708d10db33d7ee8df618de8f88c","contentHash":"2b5a0c58a9afcec9be5e0b0370e122bfb23949d98cea9033f4909534cd613a2e","overview":{"goal":"정삼각형의 좌표 관계와 서로 역관계인 두 곡선을 이용해 가능한 \\(k\\) 두 값의 합을 구해요.","firstLook":"기울기가 \\(1\\)인 선분 \\(AB\\)의 길이가 이미 \\(2\\sqrt2\\)예요. 먼저 \\(A,B\\)의 좌표를 정한 뒤, 정삼각형의 높이가 놓이는 방향을 좌표로 읽어요.","conditions":[{"label":"기울기 조건","meaning":"\\(A\\)에서 \\(B\\)로 갈 때 가로와 세로가 같은 만큼 변해요."},{"label":"정삼각형 조건","meaning":"\\(AB\\)의 중점에서 \\(C\\)까지의 거리는 \\(\\sqrt6\\)이고, 그 선분의 기울기는 \\(-1\\)이에요."},{"label":"두 곡선의 관계","meaning":"두 점을 각각 아래로 \\(1\\)만큼 옮기면 지수함수와 로그함수의 역관계를 \\(y=x\\) 대칭으로 쓸 수 있어요."}]},"chapters":[{"id":"c1","label":"기울기로 두 점의 좌표를 정해요","stepIds":["s1","s2","s3"],"question":"\\(A\\)의 \\(x\\)좌표를 \\(a\\)라 할 때 \\(B\\)의 좌표는 왜 바로 정해질까요?","hint":"선분의 길이가 \\(2\\sqrt2\\)이고 기울기가 \\(1\\)이면 가로 변화량과 세로 변화량의 절댓값이 모두 \\(2\\)예요.","explanation":"\\(A\\)를 \\(A=(a,2^{a+1}+k)\\)라 해요. 기울기가 \\(1\\)이고 두 점이 서로 다르므로, 점의 순서를 바꾸어 필요하면 오른쪽 위에 있는 점을 \\(B\\)라 둘 수 있어요. \\(AB=2\\sqrt2\\)이므로 가로와 세로 변화량은 각각 \\(2\\)이고\n\n\\(B=(a+2,2^{a+1}+k+2)\\)예요. \\(B\\)도 지수곡선 위에 있으므로\n\n\\(2^{a+3}+k=2^{a+1}+k+2\\),\n\n따라서 \\((8-2)2^a=2\\), \\(2^a=1/3\\)이에요. 그러므로 \\(a=-\\log_2 3\\)이에요.","check":{"prompt":"\\(AB\\)의 방향을 반대로 잡아도 빠지는 경우가 없나요?","answer":"없어요. 두 점의 이름을 서로 바꾸면 오른쪽 위의 점을 다시 \\(B\\)로 둘 수 있고, 같은 두 점과 같은 \\(k\\)를 나타내요."}},{"id":"c2","label":"역관계로 점 C를 나타내요","stepIds":["s4","s5","s6"],"question":"로그곡선 위의 점 \\(C\\)를 왜 중점 \\(M\\)의 좌표로 나타낼 수 있을까요?","hint":"\\(M\\)을 아래로 \\(1\\) 옮긴 점은 \\(y=2^x+k\\) 위에 있어요. 로그곡선의 점도 아래로 \\(1\\) 옮겨 보세요.","explanation":"\\(AB\\)의 중점은\n\n\\(M=(a+1,2^{a+1}+k+1)\\)이에요. \\(M\\)과 \\(C\\)를 모두 아래로 \\(1\\)만큼 옮겨 \\(M'=(a+1,2^{a+1}+k)\\), \\(C'=(u,\\log_2(u-k))\\)라 해요. 그러면 \\(M'\\)은 \\(y=2^x+k\\) 위에 있고, \\(C'\\)은 그 역함수 그래프 위에 있어요.\n\n\\(M'\\)을 \\(y=x\\)에 대하여 대칭이동한 점을 \\(D\\)라 하면 \\(D=(2^{a+1}+k,a+1)\\)이고, 역함수 그래프 위에 있어요. 또 \\(M'D\\)의 기울기는 \\(-1\\)이므로 \\(D\\)는 정삼각형의 높이선과 평행이동한 직선 위에도 있어요. 실제 \\(C'\\)도 \\(CM\\)을 함께 아래로 옮긴 이 직선 위에 있어요. 이 직선은 감소하고 로그함수 그래프는 증가하므로 교점은 하나뿐이에요. 따라서 \\(C'=D\\), 즉 \\(C=(2^{a+1}+k,a+2)\\)로 확정돼요.","check":{"prompt":"구한 \\(C\\)를 원래 로그곡선에 넣으면 어떤 등식이 되나요?","answer":"\\(\\log_2((2^{a+1}+k)-k)+1=a+1+1=a+2\\)가 되어 \\(C\\)의 \\(y\\)좌표와 같아요."}},{"id":"c3","label":"정삼각형의 높이로 두 값을 찾아요","stepIds":["s7","s8","s9"],"question":"점 \\(C\\)가 정삼각형의 양쪽 위치를 모두 나타내도록 식을 어떻게 세울까요?","hint":"\\(AB\\)의 기울기가 \\(1\\)이므로 높이 \\(CM\\)의 기울기는 \\(-1\\)이고, 한 변이 \\(2\\sqrt2\\)인 정삼각형의 높이는 \\(\\sqrt6\\)이에요.","explanation":"\\(AB\\)의 중점과 \\(C\\)의 좌표 차는\n\n\\(x_C-x_M=2^{a+1}+k-a-1\\),\n\n\\(y_C-y_M=a+1-2^{a+1}-k\\)예요. 두 값은 서로 부호만 반대이므로 \\(CM\\)의 기울기는 \\(-1\\)이에요. 정삼각형의 높이는\n\n\\((2\\sqrt2)\\frac{\\sqrt3}{2}=\\sqrt6\\)\n\n이므로, 좌표 차의 절댓값을 \\(d\\)라 하면 \\(\\sqrt{d^2+d^2}=\\sqrt6\\)이에요. 따라서 \\(|d|=\\sqrt3\\), 즉\n\n\\(|2^{a+1}+k-a-1|=\\sqrt3\\)이에요. 두 부호에서 얻는 \\(k\\)의 합은\n\n\\(S=2(a+1-2^{a+1})=2a+2-2^{a+2}\\)예요. \\(2^a=1/3\\)과 \\(a=-\\log_2 3\\)을 넣으면 \\(S=2/3-2\\log_2 3\\)이고,\n\n\\(2^{-S+2/3}=2^{2\\log_2 3}=3^2=9\\)예요.","check":{"prompt":"절댓값에서 나온 두 \\(k\\)가 모두 실제 정삼각형을 만들까요?","answer":"두 경우 모두 \\(CM=\\sqrt6\\)이고 \\(CM\\perp AB\\)예요. 중점에서 수직인 두 방향은 정삼각형의 서로 반대쪽 꼭짓점 두 개이므로 둘 다 가능해요."}}],"takeaway":["기울기와 길이를 함께 알면 두 점 사이의 가로·세로 변화량을 먼저 정해요.","지수함수와 로그함수의 역관계는 필요한 평행이동을 한 뒤 \\(y는 x\\) 대칭으로 확인해요.","정삼각형의 꼭짓점이 선분의 양쪽에 있을 수 있으므로 절댓값의 두 부호를 모두 남겨요."]};</script>
