<script>window.HandStudyGuide={"sourceKey":"ebsi:2026:g1:03:q30","sourceHash":"1c6ed89c36b4b7680860bdb0c5d09fa8e77ae0e47fb9b84ff288175be702b1f9","contentHash":"b82f948e331b32bc53a523366e5e7b3827183667a4dceeefed534504238ef45e","overview":{"goal":"닮음으로 큰 삼각형의 길이를 복원하고 내심·수직이등분선으로 각을 옮겨 탄젠트를 구해요.","firstLook":"\\(AE\\)와 \\(BC\\)가 만나는 \\(F\\)를 중심으로 두 번의 닮음을 쓰면 \\(FA=FB=24\\)가 돼요.","conditions":[{"label":"내심","meaning":"내접원의 반지름과 각의 이등분선 위 점 \\(H\\)를 함께 사용해요."},{"label":"수직이등분선","meaning":"\\(J\\)가 \\(IF\\)의 수직이등분선 위에 있음을 길이로 확인해 외심을 찾아요."}]},"chapters":[{"id":"c1","label":"두 번의 닮음으로 큰 길이를 구해요","stepIds":["s1","s2"],"question":"왜 \\(FC=FE=9\\), \\(FA=FB=24\\)인가요?","hint":"평행사변형의 평행선과 \\(AE\\), \\(BC\\)의 교점 \\(F\\)를 이용해요.","explanation":"\\(CD=AB=16\\)이고 \\(CE=6\\)이므로 \\(DE=10\\)이에요. 평행선으로 생기는 각을 비교하면 \\(\\triangle FEC\\sim\\triangle AED\\)이고, 대응변의 관계에 \\(EF=9\\), \\(EC=6\\), \\(ED=10\\)을 넣으면 \\(FC=FE=9\\)를 얻어요.\n\n또 \\(EC\\parallel AB\\)이므로 \\(\\triangle FEC\\sim\\triangle FAB\\)예요. \\(FC:FB=EC:AB=6:16=3:8\\)이고 \\(FC=9\\)이므로 \\(FB=24\\)예요. 같은 닮음에서 \\(FE:FA=3:8\\)이므로 \\(FA=24\\)예요.","check":{"prompt":"두 번째 닮음의 길이비는 무엇인가요?","answer":"\\(EC:AB=6:16=3:8\\)이고, 같은 비로 \\(FC:FB=FE:FA=3:8\\)이에요."}},{"id":"c2","label":"내심의 위치와 반지름을 구해요","stepIds":["s3","s4","s5","s6","s7"],"question":"왜 \\(FH'=H'I=6\\sqrt2\\)인가요?","hint":"\\(H\\)는 이등변삼각형 \\(ABF\\)의 밑변 중점이고, \\(H'=FH\\cap EC\\)로 둬요.","explanation":"\\(FA=FB=24\\), \\(AB=16\\)이므로 꼭짓점 \\(F\\)의 이등분선은 \\(AB\\)의 중점을 지나요. 그 점을 \\(H\\)라 하면 \\(AH=8\\), \\(FH=\\sqrt{24^2-8^2}=16\\sqrt2\\)예요. 삼각형 \\(ABF\\)의 넓이는 \\((1/2)\\cdot16\\cdot16\\sqrt2=128\\sqrt2\\)예요. 반둘레는 \\(32\\)이므로 내접원의 반지름은 \\(r=4\\sqrt2\\)예요.\n\n\\(H'=FH\\cap EC\\)라 하면 \\(\\triangle FEH'\\sim\\triangle FAH\\)이고 닮음비는 \\(FE:FA=9:24=3:8\\)이에요. 따라서 \\(FH'=(3/8)FH=6\\sqrt2\\)예요. 내심 \\(I\\)에서 변 \\(AB\\)까지의 거리 \\(IH\\)는 반지름 \\(4\\sqrt2\\)이므로 \\(H'I=FH-IH-FH'=6\\sqrt2\\)예요. 그러므로 \\(FH'=H'I\\)이고, \\(DH'\\perp IF\\)이므로 \\(DH'\\)는 \\(IF\\)의 수직이등분선이에요.","check":{"prompt":"\\(H'I\\)를 뺄셈으로 구할 때 직선 위 점의 순서는 무엇인가요?","answer":"그림에서 \\(F-H'-I-H\\) 순서이므로 \\(H'I=FH-FH'-IH\\)예요."}},{"id":"c3","label":"외심으로 각을 옮겨 탄젠트를 구해요","stepIds":["s8","s9","s10"],"question":"\\(\\angle FKD=\\angle FID\\)는 왜 성립하나요?","hint":"\\(J\\)가 \\(IF\\)와 \\(KD\\)의 수직이등분선 위에 있음을 이용해요.","explanation":"점 \\(J\\)는 문제의 조건에 따라 \\(DF\\)의 수직이등분선 위에 있어 \\(JD=JF\\)예요. 또 \\(J\\)는 직선 \\(CD=DH'\\) 위에 있고, 앞에서 \\(DH'\\)가 \\(IF\\)의 수직이등분선임을 확인했으므로 \\(JI=JF\\)예요. 따라서 \\(J\\)는 \\(\\triangle DIF\\)의 외심이고 \\(D,F,I\\)는 중심이 \\(J\\)인 한 원 위에 있어요. 조건 \\(IJ=KJ\\)까지 있으므로 \\(K\\)도 같은 원 위에 있고, 같은 현 \\(FD\\)를 바라보는 원주각에서 \\(\\angle FKD=\\angle FID\\)예요.\n\n앞에서 \\(DH'\\perp IF\\)이고 \\(H'I=6\\sqrt2\\)임을 얻었어요. 닮음으로 복원한 길이에서 \\(DH'=16-3=13\\)이므로 직각삼각형 \\(DIH'\\)에서 \\(\\tan \\angle FID=DH'/IH'=13/(6\\sqrt2)=13\\sqrt2/12\\)예요. 따라서 \\(\\tan \\angle FKD=13\\sqrt2/12\\)이고 \\(p=12,q=13\\), \\(p+q=25\\)예요.","check":{"prompt":"탄젠트 분모를 유리화하면 어떻게 되나요?","answer":"\\(13/(6\\sqrt2)=13\\sqrt2/12\\)이므로 서로소인 자연수는 \\(p=12,q=13\\)이에요."}}],"takeaway":["평행사변형 안의 교차선은 작은 삼각형부터 닮음을 이어 큰 길이를 복원해요.","이등변삼각형에서 꼭짓점의 각의 이등분선은 밑변의 중선을 겸해요.","같은 점에서 거리가 같은 점들을 찾으면 외심과 같은 원의 각 관계를 사용할 수 있어요."]};</script>
