<script>window.HandStudyGuide={"sourceKey":"ebsi:2026:g3:03:geometry:q29","sourceHash":"6f081f3ac798d536adf50383c70841a373f3ded38503f027a23a5b9dcc25f689","contentHash":"8c9bb94235c783c9ef0d12389fec7b451b109235b3db57b8b8d8d31a10f58021","overview":{"goal":"포물선과 원의 공통점 \\(P\\)에서 생기는 평행사변형과 이등변삼각형을 이용해 \\(p,r\\)의 곱과 비를 구해요.","firstLook":"\\(P\\)는 포물선 위이면서 중심이 \\(F\\)인 원 위예요. 그래서 \\(PF=r\\)이고, 포물선의 정의로 준선까지 거리 \\(PH\\)도 \\(r\\)예요.","conditions":[{"label":"포물선","meaning":"초점 \\(F(p,0)\\), 준선 \\(x=-p\\)까지의 두 거리가 같아요."},{"label":"원","meaning":"중심이 \\(F\\), 반지름이 \\(r\\)이므로 \\(PF=FA=r\\)이에요."}]},"chapters":[{"id":"c1","label":"평행사변형과 각을 찾아요","stepIds":["s1","s2","s3","s4"],"question":"사각형 \\(APHF\\)가 왜 평행사변형이고 \\(FH\\)는 얼마일까요?","hint":"\\(PH=PF=FA=r\\)와 두 수평선 \\(PH,AF\\)를 확인해요.","explanation":"준선과 \\(x\\)축의 교점을 \\(Q=(-p,0)\\)라 하면 \\(FQ=2p\\)예요. \\(P\\)는 원 위라 \\(PF=r\\)이고 포물선 위라 준선까지 거리 \\(PH\\)도 \\(r\\)예요. 또 양의 \\(x\\)축 쪽 원의 교점은 \\(A=(p+r,0)\\)이므로 \\(FA=r\\)예요.\n\n\\(PH\\)와 \\(AF\\)는 모두 수평이고 길이도 \\(r\\)로 같으므로 \\(APHF\\)는 평행사변형이에요. 직각삼각형 \\(FQH\\)에서 \\(\\angle QFH=\\angle PHF\\)이고 주어진 코사인은 \\(1/\\sqrt3\\)이에요. 따라서 \\(FQ/FH=1/\\sqrt3\\), \\(FH=2\\sqrt3p\\)이며 \\(\\sin\\angle PHF=\\sqrt{1-1/3}=\\sqrt6/3\\)예요.","check":{"prompt":"\\(PH\\)와 \\(AF\\)가 평행한 이유는 무엇인가요?","answer":"\\(PH\\)는 수직선인 준선에 수직이므로 수평이고, \\(AF\\)는 x축 위의 선분이라 수평이에요."}},{"id":"c2","label":"넓이에서 rp를 구해요","stepIds":["s5"],"question":"평행사변형의 넓이 조건은 \\(r,p\\)에 어떤 식을 줄까요?","hint":"서로 이웃한 두 변 \\(PH=r\\), \\(HF=2\\sqrt3p\\)와 끼인각의 사인을 사용해요.","explanation":"평행사변형 \\(APHF\\)의 넓이는 \\(PH\\cdot HF\\cdot\\sin\\angle PHF\\)예요. 값을 넣으면 \\(r\\cdot2\\sqrt3p\\cdot(\\sqrt6/3)=2\\sqrt2rp\\)예요. 이것이 \\(54\\sqrt2\\)이므로 \\(rp=27\\)이에요.","check":{"prompt":"넓이 식의 각은 왜 \\(\\angle PHF\\)인가요?","answer":"길이를 사용한 두 이웃한 변이 \\(HP\\)와 \\(HF\\)이고, 두 변이 만나는 꼭짓점 H의 끼인각이기 때문이에요."}},{"id":"c3","label":"이등변삼각형의 높이로 비를 구해요","stepIds":["s6","s7","s8"],"question":"\\(PH=PF\\)에서 수선의 발 \\(R\\)은 왜 \\(HF\\)의 중점일까요?","hint":"삼각형 \\(PHF\\)는 두 변이 같은 이등변삼각형이에요.","explanation":"\\(PH=PF=r\\)이므로 삼각형 \\(PHF\\)는 밑변이 \\(HF\\)인 이등변삼각형이에요. 꼭짓점 \\(P\\)에서 밑변에 내린 수선은 밑변도 이등분하므로 \\(HR=FH/2=\\sqrt3p\\)예요.\n\n직각삼각형 \\(PHR\\)에서 \\(\\cos\\angle PHR=HR/PH=(\\sqrt3p)/r\\)이고, 이 각은 \\(\\angle PHF\\)와 같아서 \\(1/\\sqrt3\\)이에요. 따라서 \\(r=3p\\)예요. \\(rp=27\\)과 함께 풀면 \\(3p^2=27\\), \\(p=3\\)이에요. \\(p>0\\)이고 \\(r>p\\)이므로 \\(r=9\\)를 택하며 \\(p+r=12\\)예요.","check":{"prompt":"\\(p^2=9\\)에서 \\(p=-3\\)을 제외하는 이유는 무엇인가요?","answer":"문제에서 \\(p>0\\)이라고 했으므로 \\(p=3\\)만 가능해요."}}],"takeaway":["한 점이 포물선과 원 위에 동시에 있으면 초점 거리, 준선 거리, 원의 반지름을 같은 길이로 연결해요.","평행하고 길이가 같은 한 쌍의 맞은편 변을 찾으면 평행사변형을 확인할 수 있어요.","이등변삼각형의 꼭짓점에서 밑변에 내린 수선은 밑변을 이등분한다는 성질로 길이의 비를 만들 수 있어요."]};</script>
