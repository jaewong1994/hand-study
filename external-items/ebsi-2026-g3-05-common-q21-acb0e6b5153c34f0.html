<script>window.HandStudyGuide={"sourceKey":"ebsi:2026:g3:05:common:q21","sourceHash":"7e3a810ad005661d653bbeee9926a0a66b3b00a0cb10db6b26c1dea877f8f94e","contentHash":"402c3963d4d921dd906105453f1c3994d1063b007825f612fdfa0b236c0b4448","overview":{"firstLook":"\\(x=p\\)에서 왼쪽 극한은 \\(f(p)\\), 오른쪽 값은 \\(kf(0)=0\\)이므로 연속이려면 \\(f(p)=0\\)이에요. \\(f(0)=0\\)이므로 \\(f=x(x-p)(x-a)\\)로 두고, \\(g=0\\)의 서로 다른 근들을 실제로 합해 보면 중복되는 \\(a=0,p\\)와 \\(0<a<p\\), \\(a>p\\)는 조건을 못 맞춰요. \\(a<0\\)에서만 \\(a+0+p+2p=2p\\), 따라서 \\(a=-p\\)예요.","goal":"미분가능성과 근의 합 조건으로 삼차함수를 정한 뒤 가장 큰 극값을 맞춰요.","conditions":[{"meaning":"a<0이면 근 a,0,p,2p가 서로 달라 합 조건을 바로 쓸 수 있어요.","label":"근의 위치를 전수 비교해요"},{"meaning":"\\(f′(p)=2p^2\\), \\(f′(0)=-p^2\\)이므로 \\(2p^2=-kp^2\\)예요.","label":"연속 다음에 미분계수를 맞춰요"}]},"chapters":[{"question":"근의 합 조건에서 왜 a<0만 살아남나요?","check":{"prompt":"근의 합 조건에서 왜 a<0만 살아남나요?","answer":"a<0이면 근 a,0,p,2p가 서로 달라 합 조건을 바로 쓸 수 있어요."},"stepIds":["s1","s2","s3"],"id":"c1","explanation":"\\(x=p\\)에서 왼쪽 극한은 \\(f(p)\\), 오른쪽 값은 \\(kf(0)=0\\)이므로 연속이려면 \\(f(p)=0\\)이에요. \\(f(0)=0\\)이므로 \\(f=x(x-p)(x-a)\\)로 두고, \\(g=0\\)의 서로 다른 근들을 실제로 합해 보면 중복되는 \\(a=0,p\\)와 \\(0<a<p\\), \\(a>p\\)는 조건을 못 맞춰요. \\(a<0\\)에서만 \\(a+0+p+2p=2p\\), 따라서 \\(a=-p\\)예요.","hint":"a의 위치별로 \\(g=0\\)의 서로 다른 근을 실제로 적어 합을 비교해요.","label":"근의 위치를 전수 비교해요"},{"question":"\\(x=p\\)에서 미분계수는 어떻게 이어지나요?","check":{"prompt":"\\(x=p\\)에서 미분계수는 어떻게 이어지나요?","answer":"\\(f′(p)=2p^2\\), \\(f′(0)=-p^2\\)이므로 \\(2p^2=-kp^2\\)예요."},"stepIds":["s4","s5","s6"],"id":"c2","explanation":"이제 \\(f=x(x+p)(x-p)\\)예요. \\(x=p\\)에서 왼쪽 미분계수는 \\(f^\\prime(p)=2p^2\\), 오른쪽은 \\(k f^\\prime(0)=-kp^2\\)이므로 \\(k=-2\\)예요. 값만 연속인 것으로 끝내지 않고 두 미분계수가 같은지 확인해야 해요.","hint":"왼쪽은 f′(p), 오른쪽은 kf′(0)예요.","label":"연속 다음에 미분계수를 맞춰요"},{"question":"g의 가장 큰 극값이 왜 2M인가요?","check":{"prompt":"g의 가장 큰 극값이 왜 2M인가요?","answer":"f의 극값 절댓값 M보다 오른쪽 조각의 2M이 더 크고 p>0이에요."},"stepIds":["s7","s8","s9"],"id":"c3","explanation":"\\(f^\\prime=3x^2-p^2\\)의 두 영점에서 \\(f\\)의 극값 절댓값은 \\(M=2\\sqrt3p^3/9\\)예요. 오른쪽 조각은 \\(-2f(x-p)\\)라 극값 절댓값의 가장 큰 값은 \\(2M\\)이고, \\(2M=3\\sqrt3/2\\)에서 \\(p=3/2\\)예요. 그래서 \\(f(4)=64-9=55\\)예요.","hint":"오른쪽 조각에 계수 -2가 붙어 f의 극값 절댓값이 두 배가 돼요.","label":"극값의 확대 비율을 확인해요"}],"takeaway":["p>0을 사용해 근의 순서를 분류했다.","중복근은 서로 다른 실근의 합에서 한 번만 셌다.","p는 3/2를 원래 극값 조건에 재대입했다."]};</script>
